<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聽寫 play 畫面改版 demo v2</title>
<style>
  :root{
    --cream:#FAF7F0; --card:#FFFFFF; --ink:#33312E; --ink-soft:#6B675F;
    --line:#E7E1D6; --accent:#2E8B6F; --accent-ink:#fff; --accent-soft:#E6F2ED;
    --r-lg:18px; --r-md:12px; --tap:44px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
    --shadow:0 2px 10px rgba(40,36,30,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
    background:var(--cream); color:var(--ink);
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  /* 頂列（模擬 app-bar，固定高） */
  .bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:10px 18px;border-bottom:1px solid var(--line);background:var(--card);}
  .bar .home{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink);text-decoration:none;background:var(--cream);}
  .bar h1{font-size:17px;margin:0;font-weight:700;}
  .bar .moon{font-size:18px;opacity:.6;}

  /* play 主體：填滿剩餘高度、不捲動 */
  .play{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:var(--s3);
    padding:var(--s4) clamp(16px,4vw,40px) 0;max-width:1100px;width:100%;margin:0 auto;}

  .playtop{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
  .counter{font-size:15px;color:var(--ink-soft);font-weight:600;}
  .accent{display:inline-flex;gap:6px;}
  .pill{border:1px solid var(--line);background:var(--card);border-radius:999px;
    min-height:var(--tap);padding:0 16px;font-size:15px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

  /* ① 聽一聽：翻面卡（正面=聽、背面=答案＋自評）；固定較矮高度 */
  .flip{flex:0 0 auto;perspective:1200px;}
  .flip-inner{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:188px;}
  .flip.flipped .flip-inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);padding:var(--s4);}
  .face .step{position:absolute;top:12px;left:18px;font-size:14px;color:var(--ink-soft);font-weight:700;}
  .back{transform:rotateY(180deg);}
  .playbtn{width:92px;height:92px;border-radius:50%;border:none;background:var(--accent);color:#fff;
    font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 16px rgba(46,139,111,.3);}
  .playbtn .ico{font-size:30px;line-height:1;}
  .listen-row{display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:center;}
  .sc{border:1px dashed var(--line);background:var(--cream);border-radius:999px;min-height:38px;padding:0 14px;font-size:14px;color:var(--ink-soft);cursor:pointer;}
  .hint{font-size:13px;color:var(--ink-soft);}

  /* 背面：答案 */
  .ans-label{position:absolute;top:12px;left:18px;font-size:14px;color:var(--accent);font-weight:700;}
  .ans{font-size:34px;font-weight:700;color:var(--ink);letter-spacing:.5px;text-align:center;}
  .ans-zh{font-size:15px;color:var(--ink-soft);}
  .selfcue{font-size:13px;color:var(--ink-soft);}

  /* ② 寫下來：填滿中段 */
  .write{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;}
  .write-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;}
  .write-head .t{font-size:15px;color:var(--ink-soft);font-weight:700;}
  .write-actions{display:inline-flex;gap:6px;}
  .canvas-wrap{flex:1 1 auto;min-height:0;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-lg);box-shadow:var(--shadow) inset;position:relative;
    background-image:repeating-linear-gradient(transparent,transparent 47px,var(--line) 47px,var(--line) 48px);}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:var(--r-lg);}

  /* 底部釘住的動作列（永遠可見、不需捲動） */
  .footer{flex:0 0 auto;display:flex;gap:var(--s3);padding:var(--s3) clamp(16px,4vw,40px);
    border-top:1px solid var(--line);background:var(--card);
    padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom));}
  .btn{flex:1 1 auto;min-height:52px;border-radius:14px;border:none;font-size:17px;font-weight:700;cursor:pointer;}
  .btn--primary{background:var(--accent);color:#fff;flex:2 1 auto;}
  .btn--ghost{background:var(--cream);color:var(--ink);border:1px solid var(--line);flex:0 0 auto;padding:0 20px;}
  .rate{display:none;gap:var(--s2);flex:2 1 auto;}
  .rate.show{display:flex;}
  .rate button{flex:1 1 0;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  .rate .emo{font-size:20px;}
  .note{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#2E8B6F;color:#fff;
    font-size:13px;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;}
  .note.show{opacity:.95;}
</style>
</head>
<body>
  <div class="bar">
    <a class="home" href="#">🏠 學習地圖</a>
    <h1>分級聽寫 🎧（改版 demo v2）</h1>
    <span class="moon">🌙</span>
  </div>

  <div class="play">
    <div class="playtop">
      <span class="counter">1 / 5</span>
      <span class="accent">
        <button class="pill on" id="us">美 US</button>
        <button class="pill" id="gb">英 UK</button>
        <button class="pill" id="replay">🔊 重播</button>
      </span>
    </div>

    <!-- ① 聽一聽（翻面卡） -->
    <div class="flip" id="flip">
      <div class="flip-inner">
        <div class="face front">
          <span class="step">① 聽一聽</span>
          <button class="playbtn" id="play"><span class="ico">🔊</span>播放</button>
          <div class="listen-row">
            <button class="sc">首字母</button>
            <button class="sc">音標</button>
          </div>
          <div class="hint">聽不到？檢查 iPad 的靜音鍵與音量。</div>
        </div>
        <div class="face back">
          <span class="ans-label">✅ 答案</span>
          <div class="ans">beautiful</div>
          <div class="ans-zh">美麗的（形容詞）</div>
          <div class="selfcue">對照你寫的，給自己評分 ↓</div>
        </div>
      </div>
    </div>

    <!-- ② 寫下來（填滿中段） -->
    <div class="write">
      <div class="write-head">
        <span class="t">② 寫下來</span>
        <span class="write-actions">
          <button class="pill" id="clear">🧽 清除</button>
          <button class="pill" id="kbd">⌨️ 改用鍵盤</button>
        </span>
      </div>
      <div class="canvas-wrap"><canvas id="cv"></canvas></div>
    </div>
  </div>

  <!-- 底部釘住動作列 -->
  <div class="footer">
    <button class="btn btn--ghost" id="back">← 回選單</button>
    <button class="btn btn--primary" id="reveal">看答案</button>
    <div class="rate" id="rate">
      <button data-g="again"><span class="emo">😅</span>還不熟</button>
      <button data-g="good"><span class="emo">🙂</span>快會了</button>
      <button data-g="easy"><span class="emo">😎</span>會了</button>
    </div>
  </div>
  <div class="note" id="note"></div>

<script>
(function(){
  var flip=document.getElementById('flip'), reveal=document.getElementById('reveal'),
      rate=document.getElementById('rate'), note=document.getElementById('note');
  var revealed=false;
  function toast(t){ note.textContent=t; note.classList.add('show'); setTimeout(function(){note.classList.remove('show');},1100); }
  reveal.addEventListener('click',function(){
    if(!revealed){ // 看答案 → 翻面 + 顯示自評
      flip.classList.add('flipped'); revealed=true;
      reveal.style.display='none'; rate.classList.add('show');
    }
  });
  rate.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    // 下一題：翻回正面、清空、回到看答案
    flip.classList.remove('flipped'); revealed=false;
    rate.classList.remove('show'); reveal.style.display=''; reveal.textContent='看答案';
    clearCanvas(); toast('已記錄，下一題！（demo）');
    document.querySelector('.counter').textContent='2 / 5';
  });
  document.getElementById('play').addEventListener('click',function(){ toast('▶ 播放發音（demo）'); });
  document.getElementById('replay').addEventListener('click',function(){ toast('🔊 重播（demo）'); });
  document.getElementById('back').addEventListener('click',function(){ toast('← 回選單（demo）'); });
  document.getElementById('clear').addEventListener('click',clearCanvas);
  document.getElementById('us').addEventListener('click',function(){this.classList.add('on');document.getElementById('gb').classList.remove('on');});
  document.getElementById('gb').addEventListener('click',function(){this.classList.add('on');document.getElementById('us').classList.remove('on');});

  // 手寫 canvas（含捲動安全 resize：同尺寸不清空）
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), drawing=false,last=null;
  function size(){ var r=cv.getBoundingClientRect(); if(!r.width||!r.height)return;
    var dpr=window.devicePixelRatio||1, nw=Math.round(r.width*dpr), nh=Math.round(r.height*dpr);
    if(cv.width===nw&&cv.height===nh)return;
    cv.width=nw; cv.height=nh; ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#33312E'; }
  function pt(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
  cv.addEventListener('pointerdown',function(e){size();drawing=true;last=pt(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  cv.addEventListener('pointermove',function(e){if(!drawing)return;var p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;e.preventDefault();});
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){cv.addEventListener(ev,function(){drawing=false;});});
  ['touchstart','touchmove'].forEach(function(ev){cv.addEventListener(ev,function(e){e.preventDefault();},{passive:false});});
  function clearCanvas(){ size(); ctx.clearRect(0,0,cv.width,cv.height); }
  requestAnimationFrame(size); window.addEventListener('resize',function(){requestAnimationFrame(size);});
})();
</script>
</body>
</html>
