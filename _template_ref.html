<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版面範本 · Template ✨</title>
<!-- §1.1 載入順序：app.css(token+共用元件) → game_core.css → (cn頁才)concept.css；game_core.js 於 head -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<!-- §1 頁面專屬 accent 三件組（只設色，不重寫版面） -->
<style>:root{ --accent:var(--c-science); --accent-tint:var(--tint-science); --accent-ink:var(--c-science-ink); }
:root[data-theme="dark"]{ --accent:#7ee7c7; --accent-tint:rgba(126,231,199,0.16); }</style>
</head>
<body data-game-hud="off">
<!-- §1.2 app-bar -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">版面範本 · Template ✨</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換深淺色" aria-pressed="false" title="切換深淺色">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<!-- §1.3 .shell 內容容器 -->
<main class="shell">
  <!-- §1.4 兩畫面：#screen-menu / #screen-play -->
  <section id="screen-menu" class="u-screen active">
    <div class="u-hello"><span class="u-hello__mascot" aria-hidden="true">🧭</span>
      <div><div class="u-hello__text">嗨！這是一頁「照 spec 組出來」的範本，示範全書統一版面。</div>
      <div class="u-hello__sub">選一關，玩一玩——確認新頁照這規格做就會跟全書一致。</div></div></div>
    <div class="u-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-done">0/3</span><span class="stat-label">完成關卡</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-star">0</span><span class="stat-label">得到星星</span></div>
      <div class="stat-tile"><span class="stat-value">3</span><span class="stat-label">總關卡</span></div>
    </div>
    <div class="u-grid" id="level-list"></div>
    <a class="cn-nextup" href="index.html"><span class="cn-nextup-ic" aria-hidden="true">🚀</span><span>這只是範本，回學習基地看真的教材 →</span></a>
    <p class="cn-note" style="text-align:center;color:var(--ink-soft);font-size:var(--fs-small);margin-top:var(--s5);font-weight:600">此頁僅供 spec 驗證，不影響學習基地進度。</p>
  </section>

  <section id="screen-play" class="u-screen">
    <div class="cn-topbar"><button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button><span class="cn-title" id="play-title">關卡</span></div>
    <div class="q-progress" id="step-dots" aria-hidden="true"></div>
    <div class="play-column"><div id="stage"></div></div>
  </section>
</main>

<script src="_template_ref.js"></script>
</body>
</html>
