<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基礎生物 🌿 — 生命的祕密</title>
<!-- 統一遊戲化引擎：先載共用設計 token（assets/app.css），再載 HUD/toast 樣式
     （game_core.css），最後同步載入引擎（game_core.js）。
     本頁為「生物」，計入 science 科目（理化／生物／地科共用；game_core.SUBJECTS 已含
     'science'），讓學生升上國中理化、高中生物時獎勵不中斷：
       1. 宣告 <body data-game-wired="science">，顯示共用 HUD。
       2. 每題作答只呼叫一次 Game.recordAnswer('science', 對錯)（answered 旗標鎖定、
          重試不再記帳）；「不」呼叫 Game.award / recordSession / awardBadge，
          本地徽章冊為純本地（自有 key、無 XP），故無 double-count。
       3. 其餘只用純 UI/唯讀 Game 介面：Game.showToast（只彈提示、不計分），
          以及由 app-bar 的 [data-theme-toggle] 自動接線的主題切換
          （game_core 於 DOMContentLoaded 自動 wireThemeToggles，本頁零主題 JS）。
     所有 Game 呼叫皆包 try/catch，Game 不存在也不報錯。
     零聲音：本頁絕不使用任何語音合成 API，也不放朗讀鈕（全站非英文頁鐵則）。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* =====================================================================
 * biology.html — 本頁樣式（全部建立在 assets/app.css 的設計 token 上，
 * 因此自動亮/暗色主題化、與學習基地視覺一致）。
 * 只做強調色映射（不新增全域變數）：本頁走綠色系（green），映射到既有的
 * 英語/正解青綠 token，貼合「生命／自然」的清新意象。
 * =================================================================== */
:root {
  --bio: var(--c-english);
  --bio-tint: var(--tint-english);
  --bio-ink: var(--c-english-ink);
}

body { overflow-x: hidden; }

/* 頁面頂列（返回、標題） */
.bio-topbar {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s4);
}
.bio-topbar .bio-title {
  flex: 1;
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  min-width: 0;
}

/* 螢幕切換 */
.bio-screen { display: none; animation: bio-fade 0.3s ease; }
.bio-screen.active { display: block; }
@keyframes bio-fade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .bio-screen { animation: none; }
}

/* 吉祥物歡迎卡 */
.bio-hello {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s4);
  background: var(--bio-tint);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  margin: 0 0 var(--s4);
}
.bio-hello .bio-mascot { font-size: 46px; flex: none; line-height: 1; }
.bio-hello .bio-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.bio-hello .bio-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }

/* 進度總覽小列 */
.bio-overview {
  display: flex; align-items: center; gap: var(--s3);
  margin-bottom: var(--s4); flex-wrap: wrap;
}
.bio-overview .stat-tile { flex: 1; min-width: 96px; }

/* 等級（關卡）選單 grid */
.bio-levels {
  display: grid;
  gap: var(--s4);
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.bio-level {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  padding: var(--s4);
  text-align: left;
  cursor: pointer;
  border: 2px solid var(--card-border);
  background: var(--card);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  font-family: var(--font);
  color: var(--ink);
}
.bio-level:hover { box-shadow: var(--shadow-lg); border-color: var(--bio); }
.bio-level:active { transform: scale(0.98); }
.bio-level-top { display: flex; align-items: center; gap: var(--s3); }
.bio-level-emoji {
  font-size: 34px;
  width: 56px; height: 56px;
  flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--bio-tint);
  border-radius: 16px;
}
.bio-level-num { font-size: var(--fs-small); font-weight: 700; color: var(--bio-ink); }
.bio-level-name { font-size: var(--fs-body); font-weight: 800; color: var(--ink); line-height: 1.25; }
.bio-level-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }
.bio-level-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: 2px; }
.bio-level-status {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--fs-small); font-weight: 700;
}
.bio-level-status.done { color: var(--c-correct-ink); }
.bio-level-status.todo { color: var(--ink-soft); }
.bio-level-dots { display: inline-flex; gap: 3px; flex-wrap: wrap; max-width: 120px; justify-content: flex-end; }
.bio-level-dots i {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--card-border); display: inline-block;
}
.bio-level-dots i.on { background: var(--bio); }

/* 進行中：一步一畫面的大卡 */

.bio-visual {
  font-size: clamp(64px, 22vw, 108px);
  line-height: 1.1;
  margin: var(--s2) 0 var(--s3);
  user-select: none;
}
.bio-sentence {
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.45;
  margin: 0 auto var(--s4);
  max-width: 32ch;
}
.bio-toolrow { display: flex; justify-content: center; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s3); }

/* 進度：本關卡第幾步 */
.bio-steps {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-bottom: var(--s3); flex-wrap: wrap;
}
.bio-steps i { width: 22px; height: 6px; border-radius: 999px; background: var(--card-border); }
.bio-steps i.on { background: var(--bio); }
.bio-steps i.cur { background: var(--bio); box-shadow: 0 0 0 3px var(--bio-tint); }

/* 選項按鈕（tap 作答；命中區 ≥56px） */


.bio-opt:active { transform: scale(0.98); }
.bio-opt:disabled { cursor: default; }
/* 對/錯雙碼：邊框色 + 圖示（✅/❌），不只靠顏色 */
.bio-opt.correct { border-color: var(--c-correct); background: var(--tint-english); color: var(--ink); }
.bio-opt.wrong { border-color: var(--c-wrong); background: rgba(255,118,117,0.12); color: var(--ink); }
.bio-opt .bio-opt-mark { margin-left: auto; font-size: 22px; }

/* 揭示區（看更多 / 答案解說） */
.bio-reveal {
  margin-top: var(--s4);
  padding: var(--s3) var(--s4);
  background: var(--bio-tint);
  border-left: 4px solid var(--bio);
  border-radius: var(--r-md);
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.55;
  text-align: left;
  display: none;
}
.bio-reveal.show { display: block; animation: bio-fade 0.3s ease; }
.bio-reveal.no { background: rgba(255,118,117,0.12); border-left-color: var(--c-wrong); }
@media (prefers-reduced-motion: reduce) { .bio-reveal.show { animation: none; } }

/* 完成畫面 */
.bio-done { text-align: center; padding: var(--s5) var(--s4); }
.bio-done-emoji { font-size: clamp(64px, 22vw, 100px); }
.bio-done-stars { font-size: 30px; letter-spacing: 3px; margin: var(--s2) 0; }
.bio-done-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); }

/* 底部行動列 */

.bio-actions .btn { flex: 1; min-width: 140px; }

.bio-footnote {
  text-align: left; color: var(--ink-soft); font-size: var(--fs-small);
  margin-top: var(--s5); font-weight: 600; line-height: 1.7;
  max-width: 680px; margin-inline: auto;    /* 護眼：桌機寬版限行長 */
  background: var(--bio-tint); border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
}

/* =====================================================================
 * 徽章櫃（StampBook 式）：入口 FAB + [hidden] 浮層
 * =================================================================== */
#bioBadgeFab {
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 55; display: inline-flex; align-items: center; gap: 6px;
  min-height: 48px; min-width: 48px; padding: 10px 16px;
  background: #0a7d63; color: #fff; border: none;  /* 深綠底白字 ≈5.1:1 過 WCAG AA（原 var(--bio) 淺綠白字僅 2.5:1）；兩主題同值 */
  border-radius: 999px; font-family: var(--font); font-weight: 800;
  font-size: clamp(14px, 3vw, 16px); cursor: pointer; box-shadow: var(--shadow-lg);
}
#bioBadgeFab:active { transform: scale(0.96); }
#bioBadgeFabCount {
  display: inline-flex; align-items: center;
  background: #fff; color: #087a5f; /* 固定深綠：白底藥丸兩主題皆 ~5.1:1 過 AA（勿用會隨暗色翻淺綠的 --bio-ink，暗色僅 1.89:1） */
  border-radius: 999px; padding: 1px 8px; font-size: 13px; font-weight: 800;
}

/* 浮層外殼（用 class 給了 display:flex，author 特異度會壓過 UA 的
   [hidden]{display:none}，故必須加更高特異度 !important 防護，否則浮層恆顯） */
.bio-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 60; padding: 16px;
}
#bioBadgeOverlay[hidden] { display: none !important; }
#bioBadgeSheet[hidden] { display: none !important; }

.bio-badge-sheet {
  position: relative; background: var(--card); border: 2px solid var(--card-border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  padding: 20px 18px 22px; color: var(--ink);
}
.bio-badge-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bio-badge-head h2 { font-size: clamp(1.1rem, 4vw, 1.4rem); font-weight: 800; margin: 0; color: var(--ink); flex: 1; }
.bio-badge-back {
  background: var(--card); border: 2px solid var(--card-border); color: var(--bio-ink);
  font-family: var(--font); font-weight: 800; font-size: 15px; cursor: pointer;
  min-height: 44px; padding: 8px 14px; border-radius: 14px;
}
.bio-badge-back:active { transform: scale(0.96); }
.bio-badge-note {
  background: var(--bio-tint); color: var(--bio-ink); border-radius: var(--r-md);
  font-size: var(--fs-small); font-weight: 600; line-height: 1.7; padding: 10px 12px; margin: 4px 0 14px;
}
.bio-badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.bio-badge {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
  border-radius: 16px; background: var(--card); border: 2px solid var(--card-border);
  padding: 14px 10px; text-align: center;
}
.bio-badge .bio-badge-glyph { font-size: clamp(1.8rem, 8vw, 2.4rem); line-height: 1; }
.bio-badge .bio-badge-name { font-size: var(--fs-small); font-weight: 800; color: var(--ink); line-height: 1.2; }
.bio-badge .bio-badge-state { font-size: clamp(0.62rem, 2.4vw, 0.72rem); font-weight: 700; color: var(--ink-soft); line-height: 1.4; }
/* 未解鎖：虛線邊 + 去彩 + 半透明（雙碼：形狀虛線 + 去彩） */
.bio-badge.locked { border-style: dashed; opacity: 0.55; filter: grayscale(1); }
/* 已解鎖：實線主題色邊 + 右上 ✓ 角標（雙碼：✓ 角標 + 實線邊） */
.bio-badge.earned { border-color: var(--bio); background: var(--bio-tint); }
.bio-badge.earned .bio-badge-check { position: absolute; right: 6px; top: 5px; font-size: 14px; color: var(--c-correct-ink); font-weight: 900; }
.bio-badge .bio-badge-go {
  margin-top: 4px; background: #0a7d63; border: none; color: #fff;  /* 深綠底白字 ≈5.1:1 過 WCAG AA（原 var(--bio) 淺綠白字亮 2.54:1／暗 1.89:1）；兩主題同值 */
  min-height: 44px; padding: 6px 12px; border-radius: 12px; font-size: 13px;
  cursor: pointer; font-weight: 800; font-family: var(--font);
}
.bio-badge .bio-badge-go:active { transform: scale(0.96); }
.bio-badge-empty { text-align: center; color: var(--ink-soft); font-weight: 700; font-size: var(--fs-small); line-height: 1.7; margin: 8px 0 4px; }
</style>
</head>
<body data-game-wired="science" data-game-maturity="advanced">
<!-- ===== 共用頂部應用列（全站一致；貼在 <body> 內第一個元素） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">基礎生物 🌿</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

  <!-- ============================= 選單 / 首頁 ============================= -->
  <section id="screen-menu" class="bio-screen active">
    <div class="bio-topbar">
      <span class="bio-title">生命的祕密 🌿</span>
    </div>

    <div class="bio-hello">
      <span class="bio-mascot" aria-hidden="true">🌿</span>
      <div>
        <div class="bio-hello-text" id="hello-text">嗨！我是小葉（🌿），一起用眼睛和好奇心，探索生命的祕密吧！</div>
        <div class="bio-hello-sub" id="hello-sub">選一個等級，慢慢玩、慢慢懂。</div>
      </div>
    </div>

    <a class="cn-nextup cn-nextup--back" href="biology_concepts.html"><span class="cn-nextup-ic" aria-hidden="true">🌱</span><span>還沒學過嗎？先到「生物觀念養成」用圖學會食物鏈、光合作用、動物分類，再回來玩 →</span></a>

    <div class="bio-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-done">0/16</span><span class="stat-label">完成等級</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-badges">0/17</span><span class="stat-label">解鎖徽章</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-stars">0</span><span class="stat-label">得到的星星</span></div>
    </div>

    <div class="bio-levels" id="level-list"><!-- 由 JS 產生 --></div>

    <p class="bio-footnote">
      🌱 觀察小提醒：認識大自然最好的方法是用眼睛看、用心觀察。
      在野外看到不認識的植物、菇類、動物，不要隨便摘、不要嚐、不要碰——
      有些看起來漂亮卻有毒或會咬人。觀察完記得洗手，探索自然時請有大人陪同喔！
    </p>
  </section>

  <!-- ============================= 進行中 ============================= -->
  <section id="screen-play" class="bio-screen">
    <div class="bio-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到等級選單">←</button>
      <span class="bio-title" id="play-title">等級</span>
    </div>
    <div class="bio-steps" id="step-dots" aria-hidden="true"></div>
    <div class="play-column">
      <div id="stage"><!-- 由 JS 產生每一步 --></div>
    </div>
  </section>

</main>

<!-- ===== 徽章櫃：入口 FAB + [hidden] 浮層（純本地、只增不減） ===== -->
<button id="bioBadgeFab" type="button" aria-label="打開生物徽章櫃" aria-haspopup="dialog" aria-controls="bioBadgeOverlay">
  🏅 徽章櫃 <span id="bioBadgeFabCount">0/17</span>
</button>
<div id="bioBadgeOverlay" class="bio-overlay" hidden>
  <div id="bioBadgeSheet" class="bio-badge-sheet" role="dialog" aria-modal="true" aria-label="生物徽章櫃">
    <div class="bio-badge-head">
      <h2>🏅 我的生物徽章櫃</h2>
      <button type="button" class="bio-badge-back" id="bio-badge-close">← 返回</button>
    </div>
    <div class="bio-badge-note" id="bio-badge-note">每完成一個等級，就會解鎖一枚徽章。徽章只會亮起、不會消失——慢慢收集就好！</div>
    <div class="bio-badge-grid" id="bio-badge-grid"><!-- 由 JS 產生 --></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // 計分策略：本頁以 <body data-game-wired="science"> 掛在既有 'science' 科目下（生物屬自然科學）。
  //   每題只呼叫一次 Game.recordAnswer('science', 對錯)（answered 旗標鎖定、重試不重記）；
  //   「不」呼叫 award/recordSession/awardBadge/pingActive，本地徽章冊為純本地（自有 key、無 XP）。
  //   計入 'science' 是刻意設計，且因單次記帳、不重複計分。
  // ---------------------------------------------------------------------
  function toast(msg, kind) {
    try { if (window.Game && Game.showToast) Game.showToast(msg, kind); } catch (e) { /* 靜默 */ }
  }

  // 零聲音：生物頁不朗讀（非英文發音頁，機器中文語音難聽又重疊）；此處完全不使用
  // 任何語音合成 API，也不放朗讀鈕。

  // =====================================================================
  // 獨立 localStorage keys（與 player_profile_v1 / chemistry_* /
  // social_studies_* / nta_stamps_v1 完全不同名，互不干擾）。
  // 載入皆 try/catch，解析失敗回 {}。
  // =====================================================================
  var PROG_KEY = 'biology_progress_v1';   // { [levelId]: { done:true, best:<stars> } }
  var BADGE_KEY = 'biology_badges_v1';     // { [badgeId]: { earnedAt:<ISO> } }
  function loadJSON(key) {
    try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; }
  }
  function saveJSON(key, obj) {
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) { /* 配額滿也不崩潰 */ }
  }
  var progress = loadJSON(PROG_KEY);
  var badges = loadJSON(BADGE_KEY);

  // =====================================================================
  // 徽章清單（levelId → badgeId）＋ 全通關總成就。純本地、只增不減。
  // =====================================================================
  var BADGE_DEFS = [
    { id: 'b_cell',      level: 'L1', emoji: '🔬', name: '細胞觀察家' },
    { id: 'b_plant',     level: 'L2', emoji: '🌱', name: '光合作用達人' },
    { id: 'b_animal',    level: 'L3', emoji: '🐾', name: '動物分類家' },
    { id: 'b_foodchain', level: 'L4', emoji: '🍃', name: '食物鏈偵探' },
    { id: 'b_ecosystem', level: 'L5', emoji: '🌍', name: '生態系嚮導' },
    { id: 'b_body',      level: 'L6', emoji: '❤️', name: '人體探險家' },
    { id: 'b_microbe',   level: 'L7', emoji: '🦠', name: '衛生小達人' },
    // ↓↓↓ 加法式新增（進階等級 L8–L14 對應徽章；插在 b_master 之前，維持
    //     b_master 為陣列最後一枚＝全通關總成就的假設不變） ↓↓↓
    { id: 'b_organelle', level: 'L8',  emoji: '🏭', name: '胞器工程師' },
    { id: 'b_division',  level: 'L9',  emoji: '🧫', name: '分裂觀察員' },
    { id: 'b_genetics',  level: 'L10', emoji: '🧬', name: '遺傳解密員' },
    { id: 'b_evolution', level: 'L11', emoji: '🦖', name: '演化追蹤者' },

    {"id":"L15","emoji":"🍳","title":"生活中的生物・廚房與飲食","subtitle":"從麵包膨脹到肚子吸收，廚房其實是最好玩的生物課！","steps":[{"t":"fact","v":"🥖","s":"你家廚房藏著看不見的微生物大軍，還有一整套消化與營養的科學。","more":"發酵靠酵母菌與乳酸菌，食物腐敗靠細菌與黴菌；吃進去的食物則要經過咀嚼、唾液、胃和小腸絨毛，才能變成身體用得到的養分。這一關就用做菜、吃飯的日常，帶你看懂背後的生物原理。"},{"t":"choose","v":"🍞","s":"媽媽做麵包時，把揉好的麵團放在溫暖的地方，過一陣子麵團就變得又大又蓬鬆。這主要是因為什麼？","opts":["酵母菌進行發酵，產生二氧化碳氣體撐大麵團","麵團吸收了空氣中的水蒸氣而膨脹","麵粉遇到溫度就會自己變多、體積變大"],"ans":0,"why":"酵母菌是一種真菌，它會分解麵團裡的糖，進行發酵並產生二氧化碳。這些氣體被麵筋包住，撐出一個個小孔，麵團就膨鬆變大了；烤熟後那些孔洞就是麵包鬆軟的原因。"},{"t":"choose","v":"🥛","s":"自製優格時，會在溫牛奶裡加入一點市售優格當「菌種」，放置幾小時後牛奶變得濃稠又帶酸味。這是誰的功勞？","opts":["加進去的糖遇熱變成了酸","乳酸菌把牛奶裡的乳糖發酵成乳酸","牛奶單純放久了自然壞掉發酸"],"ans":1,"why":"優格的酸味來自乳酸菌發酵：它們把牛奶中的乳糖轉變成乳酸，使牛奶變酸、蛋白質凝結而變濃稠。泡菜、味噌也都是靠這類有益微生物發酵做成的，和食物「壞掉」是不一樣的過程。"},{"t":"choose","v":"❄️","s":"吃不完的菜放進冰箱冷藏，就能保存比較久不容易壞。冰箱能保鮮，最主要的原理是什麼？","opts":["冰箱裡完全沒有細菌，是無菌的環境","低溫殺死了食物上所有的細菌","低溫會減緩微生物繁殖與生長，讓食物腐敗變慢"],"ans":2,"why":"低溫並不能殺死細菌，只是讓細菌等微生物的活動與繁殖速度變慢，所以食物壞得比較慢。冰箱裡還是有細菌，食物放久了一樣會壞，因此冷藏食物仍要盡早吃完。"},{"t":"choose","v":"🍫","s":"吐司放久了長出一塊塊綠色、白色的黴菌。有人說「把發霉的地方切掉，剩下的還能吃」，這樣做為什麼其實不安全？","opts":["黴菌的菌絲和看不見的毒素可能已蔓延到麵包內部","切掉後剩下的麵包會失去營養","黴菌只長在表面，切掉就完全沒問題"],"ans":0,"why":"我們看到的霉斑只是黴菌的一部分，它的菌絲會鑽進柔軟的麵包內部，有些黴菌還會產生看不見的毒素。所以麵包、吐司這類鬆軟食物一旦發霉，應整個丟棄，不能只切掉表面。"},{"t":"choose","v":"🍚","s":"運動前教練常建議先吃點飯、麵或麵包墊墊肚子。從營養素來看，這些主食主要提供身體什麼？","opts":["建造肌肉的主要材料","身體活動所需的主要能量","調節生理反應的維生素"],"ans":1,"why":"米飯、麵條、麵包富含醣類（碳水化合物），是人體最主要、最快速的能量來源。運動需要大量能量，先補充醣類能讓身體有力氣活動。"},{"t":"choose","v":"🍗","s":"正在長高的青少年，被提醒要多吃魚、肉、蛋、豆類。這類食物富含的蛋白質，在身體裡最主要的功能是什麼？","opts":["當作身體生長、修補組織的建造材料","專門幫助食物殘渣排出體外","儲存起來當作長期備用的能量"],"ans":0,"why":"蛋白質是構成肌肉、皮膚、器官等身體組織的主要材料，也負責生長與受傷後的修補。青春期身體快速發育，特別需要充足的蛋白質。"},{"t":"choose","v":"🍙","s":"把白飯含在嘴裡慢慢咀嚼，過一會兒會嚐到淡淡的甜味。這個現象背後的原理是什麼？","opts":["米飯放久了本來就會變甜","牙齒把米飯磨碎後就會產生糖","唾液中的澱粉酶把澱粉分解成有甜味的醣類"],"ans":2,"why":"唾液裡含有澱粉酶（消化酵素），會把沒有甜味的澱粉分解成較小的醣類（如麥芽糖），所以嚐起來變甜。這代表食物的化學性消化，其實從口腔就已經開始了。"},{"t":"choose","v":"🌱","s":"小腸內壁佈滿許多細小突起的「絨毛」，摸起來像絨布。這樣的構造對消化吸收有什麼好處？","opts":["能大幅增加吸收養分的表面積，吸收更有效率","可以把食物磨得更碎","能分泌胃酸來殺菌"],"ans":0,"why":"小腸是吸收養分的主要場所。密密麻麻的絨毛大大增加了小腸內壁與食物接觸的表面積，讓養分能被更快、更充分地吸收進血液中。"},{"t":"choose","v":"🥬","s":"營養師常說多吃蔬菜、全穀類可以「幫助排便、預防便秘」。蔬菜裡的膳食纖維是怎麼辦到的？","opts":["纖維能被身體完全消化，直接變成能量","纖維會殺死腸道裡的細菌","人體無法消化纖維，它能增加糞便體積、刺激腸道蠕動"],"ans":2,"why":"膳食纖維無法被人體消化吸收，但它能吸水膨脹、增加糞便的體積，並刺激大腸蠕動，幫助排便順暢。膳食纖維是一種身體無法消化、卻對腸道健康很重要的特殊成分，常被稱為『第七大營養素』。"},{"t":"choose","v":"🥑","s":"堅果、食用油、肥肉吃起來熱量很高。脂肪在我們身體裡扮演的重要角色之一是什麼？","opts":["是身體儲存能量的主要方式，也能保暖與保護器官","是唯一能立刻供應大腦活動的養分","主要負責把食物磨碎"],"ans":0,"why":"脂肪每公克含的能量比醣類、蛋白質都高，是身體長期儲存能量的主要形式；皮下脂肪還能幫助保暖，並保護內臟器官。不過攝取過量容易造成肥胖，仍要適量。"}]},
    {"id":"L16","emoji":"🩺","title":"生活中的生物・健康與身體照顧","subtitle":"從洗手到睡覺，每個生活小動作背後都藏著身體的科學。","steps":[{"t":"fact","v":"💪","s":"身體每天都在默默運作、修復與防禦，好習慣就是在幫這套系統加分。","more":"洗手、睡眠、運動、均衡飲食、正確用眼、好好刷牙……這些看似普通的小事，其實都對應著免疫、內分泌、循環、神經等生物原理。懂了原理，就更知道為什麼要這樣照顧自己。"},{"t":"choose","v":"🧼","s":"用肥皂加清水搓洗雙手，被認為是阻斷病菌傳播最有效的方法之一。從原理來看，肥皂主要是靠什麼機制清除手上的病菌？","opts":["肥皂分子能破壞許多病菌（如包膜病毒）的油脂外膜，並把髒污與病菌包起來，讓流水沖走","肥皂會釋放大量氧氣，直接把手上所有細菌『燒死』","肥皂本身有甜味，會把病菌吸引到泡泡裡集中消滅"],"ans":0,"why":"肥皂的分子一端親油、一端親水，能瓦解病菌的油脂外膜並包覆髒污，再被流水帶走，所以『搓』和『沖』都很重要。肥皂並不會產生氧氣去『燒死』細菌，也沒有靠甜味吸引病菌這種事。"},{"t":"choose","v":"😴","s":"老師常說『長高要睡飽』。從生物原理看，充足且規律的睡眠為什麼對青春期成長特別重要？","opts":["因為睡覺時身體不動，骨頭就會自己慢慢被拉長","因為深層睡眠時腦下垂體會分泌較多生長激素，幫助骨骼與組織生長修復","因為睡覺時完全不用呼吸，能量全部拿去長高"],"ans":1,"why":"生長激素主要在深層睡眠時由腦下垂體大量分泌，幫助骨骼和身體組織生長與修復，所以睡眠不足會影響發育。骨頭不會因為不動就被拉長，人睡覺時也一直在呼吸，這兩個說法都不對。"},{"t":"choose","v":"🏃","s":"規律運動能讓人『體力變好、肌肉更結實』。從身體構造來看，運動帶來這些改變的主要原因是什麼？","opts":["運動時吸進去的空氣會直接變成新的肌肉","肌肉受到適度刺激後會修復並變強，心臟與肺也因訓練而更有效率地供應氧氣","運動會讓骨頭數量增加，所以力氣變大"],"ans":1,"why":"適度運動會刺激肌纖維，在休息修復後變得更強壯；同時心肺經過鍛鍊，能更有效率地輸送氧氣，耐力就提升。空氣不會直接變成肌肉，成年人的骨頭數量也不會因運動而增加。"},{"t":"choose","v":"🩹","s":"不小心割傷流血，過一陣子傷口會結成硬硬的痂。這層痂主要是靠血液中的哪個角色先幫忙止血形成的？","opts":["紅血球，負責把傷口染紅並塞住破洞","血小板，會聚集到傷口並促使血液凝固，形成血塊封住破口","白血球，會把傷口的皮膚黏起來"],"ans":1,"why":"血小板會迅速聚集到傷口並啟動凝血反應，形成血塊止血，乾掉後就成為結痂保護傷口。紅血球主要負責運送氧氣，白血球主要對抗病菌，止血結痂不是它們的主要工作。"},{"t":"choose","v":"🤧","s":"有人一接觸花粉或塵蟎就打噴嚏、流鼻水、皮膚癢，這就是『過敏』。從免疫學來看，過敏反應的本質是什麼？","opts":["是身體徹底沒有免疫力，任何東西都擋不住","是免疫系統對本來無害的物質（過敏原）反應過度，才引起不適","是體內完全沒有細菌，太乾淨造成的中毒"],"ans":1,"why":"過敏是免疫系統把原本無害的物質（如花粉、塵蟎）誤判為威脅而『反應過度』，才出現打噴嚏、癢等症狀。它不是沒有免疫力，也不是『太乾淨中毒』這種說法。"},{"t":"choose","v":"🍱","s":"營養師建議三餐要『均衡飲食』，蔬菜、水果、全穀、蛋白質都要有。從身體需求來看，為什麼不能只挑自己愛吃的一兩種？","opts":["因為不同食物提供不同的營養素（醣類、蛋白質、脂質、維生素、礦物質等），身體各種功能都需要","因為食物種類越多，胃就會被撐得越大越健康","因為只要份量夠多，吃什麼都一樣，重點只是吃飽"],"ans":0,"why":"身體的能量供應、生長修復、代謝調節各自需要不同營養素，單一食物無法全部提供，所以要多樣化才能均衡。把胃撐大並非健康目標，光吃飽卻營養不均也可能造成缺乏症或健康問題。"},{"t":"choose","v":"👀","s":"醫師提醒『看近的東西太久容易近視，要讓眼睛適時看遠、多到戶外』。從眼睛的運作來看，長時間近距離用眼為什麼比較傷眼？","opts":["因為看近時眼睛的睫狀肌要持續用力調節，長時間緊繃容易疲勞，也與近視加深有關","因為看近的字會發出強光，把眼睛裡的水分曬乾","因為看遠會讓眼睛長針眼，所以要一直看近才安全"],"ans":0,"why":"看近物時睫狀肌必須持續收縮來調節水晶體聚焦，長時間近距離用眼會使眼睛疲勞，也與近視發生和加深有關，因此要適時看遠、多到戶外。文字本身不會發強光曬乾眼睛，看遠也不會害人長針眼。"},{"t":"choose","v":"🦷","s":"牙醫說『吃完甜食沒刷牙，特別容易蛀牙』。從口腔裡的生物與化學反應來看，蛀牙是怎麼發生的？","opts":["糖本身有腐蝕性，會像酸一樣直接把牙齒溶掉","口腔裡的細菌會分解食物殘留的糖，產生酸性物質，長期腐蝕牙齒的琺瑯質","牙齒接觸到甜味神經會自己裂開"],"ans":1,"why":"蛀牙是口腔中的細菌利用糖分代謝、產生酸性物質，這些酸長期侵蝕琺瑯質而形成。糖本身並不是酸、不會直接溶解牙齒，牙齒也不會因『甜味』而裂開，所以吃完甜食要記得刷牙或漱口。"},{"t":"choose","v":"💉","s":"打疫苗常被說是『幫免疫系統先做練習』。從免疫記憶的角度來看，疫苗保護我們的原理最接近下列哪一項？","opts":["疫苗讓身體認識病原體的特徵並產生免疫記憶，將來遇到真的病原時能更快反應","疫苗會在血管裡放一層塑膠膜，把病菌全部擋在外面","疫苗能讓人一輩子完全不會生任何病"],"ans":0,"why":"疫苗把病原體的特徵（或減弱、無害的形式）呈現給免疫系統，讓身體產生抗體與免疫記憶，日後遇到真正病原時能更快、更強地反應。疫苗不是在血管裡放膜，也無法保證一輩子不生任何病，但能大幅降低重症風險。"},{"t":"choose","v":"💧","s":"運動流很多汗或天氣炎熱時，大人常提醒『要多喝水』。從身體運作來看，缺水（脫水）為什麼會讓人頭暈、沒力氣？","opts":["因為水分是血液和體液的重要成分，也幫助調節體溫，缺水會影響循環與散熱，讓身體運作變差","因為喝水才能把肚子裝滿，肚子空了就會頭暈","因為水裡有電，喝了才能替身體『充電』"],"ans":0,"why":"水是血液和體液的主要成分，也透過流汗幫助散熱調節體溫；脫水會使血液量與循環受影響、散熱變差，因而頭暈、疲倦。頭暈不是因為肚子空，水也不是靠『電』替身體充電這種說法。"}]}

  // =====================================================================
  // DOM 參照
  // =====================================================================
  var $ = function (id) { return document.getElementById(id); };
  var screenMenu = $('screen-menu');
  var screenPlay = $('screen-play');
  var levelList = $('level-list');
  var stage = $('stage');
  var stepDots = $('step-dots');
  var playTitle = $('play-title');

  // 目前遊玩狀態：{ level, idx, correctCount, total }
  var cur = null;

  // 計分步數（choose）——星等分母。
  function scoringSteps(level) {
    var n = 0;
    for (var i = 0; i < level.steps.length; i++) if (level.steps[i].t === 'choose') n++;
    return n;
  }

  function doneCount() {
    var c = 0;
    for (var i = 0; i < LEVELS.length; i++) if (progress[LEVELS[i].id] && progress[LEVELS[i].id].done) c++;
    return c;
  }
  function earnedBadgeCount() {
    var c = 0;
    for (var i = 0; i < BADGE_DEFS.length; i++) if (badges[BADGE_DEFS[i].id]) c++;
    return c;
  }
  function totalStars() {
    var s = 0;
    for (var id in progress) { if (progress[id] && progress[id].best) s += progress[id].best; }
    return s;
  }

  // =====================================================================
  // 選單渲染
  // =====================================================================
  function renderMenu() {
    var dc = doneCount();
    $('ov-done').textContent = dc + '/' + LEVELS.length;
    $('ov-badges').textContent = earnedBadgeCount() + '/' + BADGE_DEFS.length;
    $('ov-stars').textContent = totalStars();
    $('bioBadgeFabCount').textContent = earnedBadgeCount() + '/' + BADGE_DEFS.length;

    // 歡迎語（首次 / 回訪 / 全完成；讚美努力、不催促）
    if (dc >= LEVELS.length) {
      $('hello-text').textContent = '所有等級都完成了，你是生物小博士！🎓';
      $('hello-sub').textContent = '想再逛哪一關都可以，慢慢玩、慢慢懂。';
    } else if (dc > 0) {
      $('hello-text').textContent = '歡迎回來！你已經完成 ' + dc + ' 個等級，好厲害！';
      $('hello-sub').textContent = '選一個等級，慢慢玩、慢慢懂。';
    }

    // 等級卡（全開放、不擋關，孩子可自由選）
    levelList.innerHTML = '';
    for (var u = 0; u < LEVELS.length; u++) {
      (function (level, num) {
        var done = progress[level.id] && progress[level.id].done;
        var stars = progress[level.id] ? (progress[level.id].best || 0) : 0;
        var total = scoringSteps(level);
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'bio-level';
        card.setAttribute('aria-label', '等級 ' + num + '：' + level.title);
        var dots = '';
        for (var d = 0; d < total; d++) dots += '<i class="' + (d < stars ? 'on' : '') + '"></i>';
        card.innerHTML =
          '<div class="bio-level-top">' +
            '<span class="bio-level-emoji" aria-hidden="true">' + level.emoji + '</span>' +
            '<div>' +
              '<div class="bio-level-num">等級 ' + num + '</div>' +
              '<div class="bio-level-name">' + level.title + '</div>' +
              '<div class="bio-level-sub">' + level.subtitle + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="bio-level-foot">' +
            '<span class="bio-level-status ' + (done ? 'done' : 'todo') + '">' +
              (done ? '✅ 已完成' : '▶️ 開始挑戰（共 ' + total + ' 題）') + '</span>' +
            '<span class="bio-level-dots" aria-hidden="true">' + dots + '</span>' +
          '</div>';
        card.addEventListener('click', function () { startLevel(level); });
        levelList.appendChild(card);
      })(LEVELS[u], u + 1);
    }
  }

  // =====================================================================
  // 遊玩流程
  // =====================================================================
  function show(screen) {
    screenMenu.classList.remove('active');
    screenPlay.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0, 0);
  }

  function startLevel(level) {
    cur = { level: level, idx: 0, correctCount: 0, total: scoringSteps(level) };
    playTitle.textContent = level.emoji + ' ' + level.title;
    show(screenPlay);
    renderStep();
  }

  function renderStepDots() {
    stepDots.innerHTML = '';
    for (var i = 0; i < cur.level.steps.length; i++) {
      var b = document.createElement('i');
      if (i < cur.idx) b.className = 'on';
      else if (i === cur.idx) b.className = 'cur';
      stepDots.appendChild(b);
    }
  }

  function next() {
    cur.idx++;
    if (cur.idx >= cur.level.steps.length) finishLevel();
    else renderStep();
  }

  function renderStep() {
    renderStepDots();
    var step = cur.level.steps[cur.idx];
    if (step.t === 'fact') return renderFact(step);
    if (step.t === 'choose') return renderChoose(step);
  }

  // ---- fact（worked example 先行；零聲音、無朗讀鈕） ----
  function renderFact(step) {
    stage.innerHTML =
      '<div class="bio-stage">' +
        '<div class="bio-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="bio-sentence">' + step.s + '</p>' +
        '<div class="bio-toolrow">' +
          '<button type="button" class="btn" id="btn-more">💡 看更多</button></div>' +
        '<div class="bio-reveal" id="reveal">' + (step.more || '') + '</div>' +
      '</div>' +
      '<div class="bio-actions">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">開始挑戰 ➡️</button>' +
      '</div>';
    $('btn-more').addEventListener('click', function () {
      $('reveal').classList.add('show');
    });
    $('btn-next').addEventListener('click', next);
  }

  // ---- choose（選項洗牌；每題只計一次分） ----
  function renderChoose(step) {
    // 打亂選項顯示順序（正解不可固定在第一個，孩子才會真的閱讀）。
    // data-i 記的是「原始索引」，因此對答判斷 i === step.ans 仍然正確。
    var order = [];
    for (var oi = 0; oi < step.opts.length; oi++) order.push(oi);
    for (var m = order.length - 1; m > 0; m--) {
      var r = Math.floor(Math.random() * (m + 1));
      var tt = order[m]; order[m] = order[r]; order[r] = tt;
    }
    var optsHtml = '';
    for (var k = 0; k < order.length; k++) {
      var origIdx = order[k];
      optsHtml += '<button type="button" class="bio-opt" data-i="' + origIdx + '">' +
        '<span>' + step.opts[origIdx] + '</span><span class="bio-opt-mark" aria-hidden="true"></span></button>';
    }
    stage.innerHTML =
      '<div class="bio-stage">' +
        '<div class="bio-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="bio-sentence">' + step.s + '</p>' +
        '<div class="bio-options">' + optsHtml + '</div>' +
        '<div class="bio-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="bio-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button>' +
      '</div>';

    // answered 旗標鎖定：僅第一次作答計入 cur.correctCount，之後重試只給視覺回饋。
    var answered = false;
    var btns = stage.querySelectorAll('.bio-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var i = parseInt(this.getAttribute('data-i'), 10);
        var isCorrect = (i === step.ans);
        if (answered) {
          // 已答過：只給視覺提示，不再重複計分。
          if (isCorrect) {
            this.classList.add('correct');
            this.querySelector('.bio-opt-mark').textContent = '✅';
          } else {
            this.classList.add('wrong');
            this.querySelector('.bio-opt-mark').textContent = '❌';
          }
          return;
        }
        answered = true;
        if (window.Game && window.Game.recordAnswer) Game.recordAnswer('science', isCorrect);
        if (isCorrect) {
          this.classList.add('correct');
          this.querySelector('.bio-opt-mark').textContent = '✅';
          cur.correctCount++;           // 本頁本地星等（記憶體），與主引擎無關
          reveal(step, true);
        } else {
          this.classList.add('wrong');
          this.querySelector('.bio-opt-mark').textContent = '❌';
          // 標出正解、鼓勵再試（不懲罰）。用原始索引找到正解按鈕（選項已洗牌）。
          var correctBtn = stage.querySelector('.bio-opt[data-i="' + step.ans + '"]');
          if (correctBtn) {
            correctBtn.classList.add('correct');
            correctBtn.querySelector('.bio-opt-mark').textContent = '✅';
          }
          reveal(step, false);
        }
      });
    }

    function reveal(step, correct) {
      var rev = $('reveal');
      rev.textContent = (correct ? '答對了！' : '沒關係，再想想～正確答案是這個！') + ' ' + (step.why || '');
      rev.classList.add('show');
      rev.classList.toggle('no', !correct);
      $('afteract').style.display = 'flex';
      var all = stage.querySelectorAll('.bio-opt');
      for (var k = 0; k < all.length; k++) all[k].disabled = true;
    }

    $('btn-next').addEventListener('click', next);
  }

  // =====================================================================
  // 完成關卡：寫入獨立 key（保留最佳星等，只增不減）＋ 解鎖徽章（純本地）
  // =====================================================================
  function finishLevel() {
    var level = cur.level;
    var stars = cur.correctCount;
    var total = cur.total;

    // 進度：保留最佳星等（Math.max，只增不減）
    var prev = progress[level.id] || {};
    progress[level.id] = { done: true, best: Math.max(prev.best || 0, stars) };
    saveJSON(PROG_KEY, progress);

    // 解鎖徽章（只增不減；已解鎖不覆寫 earnedAt）
    var newlyEarned = [];
    var lb = BADGE_BY_LEVEL[level.id];
    if (lb && !badges[lb.id]) {
      badges[lb.id] = { earnedAt: new Date().toISOString() };
      newlyEarned.push(lb);
    }
    // 全部等級完成 → 解鎖總成就
    if (doneCount() >= LEVELS.length) {
      var grand = BADGE_DEFS[BADGE_DEFS.length - 1]; // b_master
      if (!badges[grand.id]) {
        badges[grand.id] = { earnedAt: new Date().toISOString() };
        newlyEarned.push(grand);
      }
    }
    if (newlyEarned.length) saveJSON(BADGE_KEY, badges);

    var starStr = '';
    for (var i = 0; i < total; i++) starStr += (i < stars ? '⭐' : '☆');

    stage.innerHTML =
      '<div class="bio-stage bio-done">' +
        '<div class="bio-done-emoji" aria-hidden="true">🎉</div>' +
        '<div class="bio-done-title">完成「' + level.title + '」！</div>' +
        '<div class="bio-done-stars" aria-label="得到 ' + stars + ' 顆星">' + starStr + '</div>' +
        '<p class="bio-sentence" style="font-size:clamp(16px,3.6vw,19px)">你答對了 ' + stars + ' / ' + total + ' 題，好棒！</p>' +
      '</div>' +
      '<div class="bio-actions">' +
        '<button type="button" class="btn" id="btn-menu">回到選單</button>' +
        (nextLevelOf(level) ? '<button type="button" class="btn btn-primary" id="btn-nextlevel">下一個等級 ➡️</button>' : '<button type="button" class="btn btn-primary" id="btn-badges2">看我的徽章 🏅</button>') +
      '</div>';

    // 徽章慶祝（純 UI；Game.showToast 只彈提示、不計分）
    for (var e = 0; e < newlyEarned.length; e++) {
      toast('解鎖徽章：' + newlyEarned[e].emoji + ' ' + newlyEarned[e].name + '！', 'badge');
    }

    $('btn-menu').addEventListener('click', goMenu);
    var nl = nextLevelOf(level);
    if (nl) $('btn-nextlevel').addEventListener('click', function () { startLevel(nl); });
    else { var b2 = $('btn-badges2'); if (b2) b2.addEventListener('click', function () { goMenu(); openBadges(); }); }
  }

  function nextLevelOf(level) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (LEVELS[i].id === level.id) return LEVELS[i + 1] || null;
    }
    return null;
  }

  function goMenu() {
    cur = null;
    renderMenu();
    show(screenMenu);
  }

  // =====================================================================
  // 徽章櫃浮層（[hidden] 屬性切換；只切 hidden，不動 class）
  // =====================================================================
  var overlay = $('bioBadgeOverlay');

  function renderBadges() {
    var grid = $('bio-badge-grid');
    grid.innerHTML = '';
    for (var i = 0; i < BADGE_DEFS.length; i++) {
      var def = BADGE_DEFS[i];
      var earned = !!badges[def.id];
      var el = document.createElement('div');
      el.className = 'bio-badge ' + (earned ? 'earned' : 'locked');
      var state = earned
        ? '已解鎖'
        : (def.level ? '玩完這個等級就會亮起來喔！' : '完成全部 ' + LEVELS.length + ' 個等級就會亮起來！');
      var goBtn = (earned && def.level)
        ? '<button type="button" class="bio-badge-go" data-go="' + def.level + '">再逛一次 →</button>'
        : '';
      el.innerHTML =
        (earned ? '<span class="bio-badge-check" aria-hidden="true">✓</span>' : '') +
        '<span class="bio-badge-glyph" aria-hidden="true">' + def.emoji + '</span>' +
        '<span class="bio-badge-name">' + def.name + '</span>' +
        '<span class="bio-badge-state">' + state + '</span>' +
        goBtn;
      grid.appendChild(el);
    }
    // 空狀態文案（溫和、不誘導）
    var note = $('bio-badge-note');
    if (earnedBadgeCount() === 0) {
      note.textContent = '你的生物徽章櫃還空空的，先去玩一個等級吧！';
    } else {
      note.textContent = '每完成一個等級，就會解鎖一枚徽章。徽章只會亮起、不會消失——慢慢收集就好！';
    }
    // 「再逛一次」→ 回到該等級
    var gos = grid.querySelectorAll('.bio-badge-go');
    for (var g = 0; g < gos.length; g++) {
      gos[g].addEventListener('click', function () {
        var lid = this.getAttribute('data-go');
        var lvl = null;
        for (var j = 0; j < LEVELS.length; j++) if (LEVELS[j].id === lid) lvl = LEVELS[j];
        if (lvl) { closeBadges(); startLevel(lvl); }
      });
    }
  }

  function openBadges() {
    renderBadges();
    overlay.hidden = false;
    var closeBtn = $('bio-badge-close');
    if (closeBtn) closeBtn.focus();
  }
  function closeBadges() { overlay.hidden = true; }

  $('bioBadgeFab').addEventListener('click', openBadges);
  $('bio-badge-close').addEventListener('click', closeBadges);
  // 點浮層背景（非內容）也可關閉
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeBadges(); });
  // Esc 關閉（鍵盤可操作）
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Escape' || e.key === 'Esc') && !overlay.hidden) closeBadges();
  });

  // =====================================================================
  // 頂列按鈕（主題切換由共用 app-bar 的 [data-theme-toggle] 統一處理，
  // 由 game_core 自動接線與圖示同步，本頁不再自行處理主題。）
  // =====================================================================
  $('btn-back').addEventListener('click', goMenu);

  // =====================================================================
  // 啟動
  // =====================================================================
  renderMenu();
})();
</script>
</body>
</html>
