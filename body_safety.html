    <div class="cn-hello"><span class="cn-mascot" aria-hidden="true">🛡️</span>
      <div><div class="cn-htext" id="hello">這裡教你怎麼<b>保護自己的身體、照顧自己的感覺</b>：認識身體的界線、分辨舒服和不舒服的碰觸、學會說不、知道哪些祕密不用守，還有——不管發生什麼，記得<b>找信任的大人說，而且那從來不是你的錯</b>。</div>
      <div class="cn-hsub">每一課都是「先懂這個本領 → 學會怎麼做 → 換你試試」。這些是保護自己的超能力，慢慢學就好。</div></div></div>
    <div class="cn-lessons" id="lesson-list"></div>
    <a class="cn-nextup" href="safety.html"><span class="cn-nextup-ic" aria-hidden="true">🦺</span><span>想學更多保護自己的方法嗎？到「安全小達人」繼續 →</span></a>
    <p class="cn-note">這裡是「先學觀念」的教學小旅程，只留在你的裝置上，不影響學習基地的等級或經驗值。</p>

<script>
window.CONCEPT = {"progKey":"body_safety_concepts_v1","practiceHref":"safety.html","lessons":[{"id":"bs_mine","name":"我的身體我做主","emoji":"🧍","sub":"身體的界線，由你自己決定","done":"記住這句：我的身體我做主，不想要就可以說不。","color":"#059669","steps":[{"type":"teach","kicker":"這個本領","title":"你的身體屬於你自己","text":"你的身體是<b>你自己的</b>，從頭到腳都是。<b>要不要被碰、被抱、被親，你有權自己決定。</b>這叫做「身體的界線」——就像你的房間有一扇門，你的身體也有一條看不見的線，別人要尊重它。","svg":""},{"type":"teach","kicker":"怎麼做","title":"相信自己的感覺","text":"當有人靠近或碰你，你心裡會有感覺：<b>舒服、還好，或是怪怪的、不喜歡</b>。這個感覺很重要，要<b>相信它</b>。覺得不舒服，你可以往後退、可以說「我不喜歡這樣」。這並不是沒禮貌，而是在照顧自己。","svg":""},{"type":"quiz","kicker":"換你試試","title":"表哥要抱你，可是你今天就是不想被抱","options":["身體是我的，我可以說「我今天不想抱抱，我們擊掌好嗎？」","不想也要抱，不然很沒禮貌","忍住不舒服，什麼都不說"],"answer":0,"why":"你的身體由你自己決定；禮貌地說「不想抱、改擊掌」，既照顧了自己的感覺，也仍然友善，不必為了怕失禮就勉強自己。"}]},{"id":"bs_touch","name":"舒服和不舒服的碰觸","emoji":"✋","sub":"分辨讓你安心和讓你怪怪的碰觸","done":"記住這句：相信「怪怪的、不舒服」的感覺，可以喊停、可以離開。","color":"#059669","steps":[{"type":"teach","kicker":"這個本領","title":"碰觸有很多種","text":"碰觸有很多種。<b>好的碰觸</b>讓你覺得溫暖、安心，像家人的擁抱、朋友擊掌、需要時被牽著手過馬路。<b>讓你不舒服的碰觸</b>會讓你覺得怪怪的、緊張、想躲開。","svg":""},{"type":"teach","kicker":"怎麼做","title":"用自己的感覺來分辨","text":"分辨的方法就是<b>問自己的感覺</b>：這個碰觸讓我開心，還是讓我緊張、不舒服？不管對方是誰，就算他說「這是遊戲」「這是祕密」，<b>只要讓你不舒服，你都可以喊停、可以離開、可以告訴信任的大人。</b>","svg":""},{"type":"quiz","kicker":"換你試試","title":"有人碰你，讓你覺得怪怪的、不舒服，還說「這是我們的祕密」","options":["相信自己不舒服的感覺，離開並告訴信任的大人","因為他說是祕密，就不能跟任何人講","可能是我想太多，忍一忍就好"],"answer":0,"why":"不舒服的感覺是身體在提醒你；不管對方怎麼說，你都可以離開並告訴信任的大人，這不是你想太多。"}]},{"id":"bs_private","name":"隱私的地方","emoji":"🔒","sub":"哪些地方別人不能隨便看或摸","done":"記住這句：內衣褲、泳衣蓋住的地方是隱私，別人不能隨便看或摸。","color":"#059669","steps":[{"type":"teach","kicker":"這個本領","title":"被內衣褲、泳衣蓋住的地方是隱私","text":"身體上<b>被內衣褲、泳衣蓋住的地方，是你的隱私部位</b>。這些地方<b>別人不可以隨便看、也不可以摸</b>；你也不需要去看或摸別人的。這是每個人都該有的界線。這些地方也都有正式的名字（例如生殖器官），<b>用正確的名字說出來一點都不害羞</b>，還能讓大人更清楚知道發生了什麼、更快幫到你。","svg":""},{"type":"teach","kicker":"怎麼做","title":"只有這兩種情況是例外","text":"只有兩種情況例外：<b>為了健康</b>去看醫生時（而且會有爸媽或信任的大人陪著），或是<b>還小、需要爸媽或平常照顧你的大人幫忙洗澡、擦藥</b>的時候。<b>這些幫忙都不會是祕密</b>；就算是這些情況，只要讓你覺得怪怪的、不舒服，<b>你一樣可以說出來，並告訴信任的大人。</b>","svg":""},{"type":"quiz","kicker":"換你試試","title":"有人想看或摸你隱私的地方，還說「沒關係啦」","options":["那是我的隱私，我可以大聲說「不要」，趕快離開，並告訴信任的大人","對方說沒關係，那應該就沒關係","自己一個人煩惱，不要跟別人講"],"answer":0,"why":"隱私部位別人不能隨便看或摸；不論對方怎麼說，你都可以拒絕、離開，並告訴信任的大人幫你。"}]},{"id":"bs_no","name":"你可以說不","emoji":"🙅","sub":"就算對方是大人也一樣","done":"記住這句：關於我的身體，就算對方是大人，我也可以說不。","color":"#059669","steps":[{"type":"teach","kicker":"這個本領","title":"關於身體，你永遠可以說不","text":"關於你的身體，<b>你永遠可以說「不」</b>——就算對方是大人、是老師、是親戚，或是你認識而且喜歡的人。說不，不會讓你變成沒禮貌或壞小孩。","svg":""},{"type":"teach","kicker":"怎麼做","title":"說不可以很簡單","text":"說不的方法可以很簡單：<b>「不要」「我不喜歡這樣」「停」</b>，然後<b>離開那裡、去找大人</b>。如果當下太害怕、說不出話，<b>那也沒關係</b>，事後一定要找信任的大人說。<b>能保護自己最重要，晚一點說出來一樣很勇敢。</b>","svg":""},{"type":"quiz","kicker":"換你試試","title":"一個你認識的大人，要你做一件讓你很不舒服的事","options":["我可以說「不要」並離開，就算他是大人也一樣","他是大人，我一定得聽話照做","偷偷難過，但不敢做任何事"],"answer":0,"why":"關於自己的身體，就算面對大人你也可以拒絕、離開；聽話不代表要做讓自己不舒服的事。"}]},{"id":"bs_secret","name":"不舒服的祕密不用守","emoji":"🗝️","sub":"好祕密和讓你害怕的祕密","done":"記住這句：讓我不舒服的祕密，我不用守，可以告訴信任的大人。","color":"#059669","steps":[{"type":"teach","kicker":"這個本領","title":"祕密有兩種","text":"祕密有兩種。<b>好祕密</b>讓人開心又期待，而且<b>過一陣子就會公開</b>，像是幫家人準備的生日驚喜。<b>不好的祕密</b>會讓你<b>害怕、緊張、不舒服</b>，對方還會一直說「絕對不能告訴別人」。","svg":""},{"type":"teach","kicker":"怎麼做","title":"讓你不舒服的祕密，不用替別人守","text":"<b>任何讓你不舒服的祕密，你都不用替別人守著。</b>有些人會用嚇的（「說出來你會有麻煩」），也有些人會用<b>禮物、零食，或說「你最特別，這是我們的祕密」</b>來讓你不敢說——不管是用嚇的還是用好處交換的，只要那個祕密讓你不舒服，你都不用守。<b>把它告訴信任的大人，才是對的、勇敢的事。</b>","svg":""},{"type":"quiz","kicker":"換你試試","title":"有人叫你保守一個讓你害怕、不舒服的祕密","options":["這種祕密不用守，我要去告訴信任的大人","答應了就一定要守著，不能說","自己忍著，希望它自己消失"],"answer":0,"why":"讓你害怕、不舒服的祕密不必守；告訴信任的大人不是「打小報告」，而是保護自己的勇敢做法。"}]},{"id":"bs_adult","name":"找信任的大人","emoji":"🫂","sub":"一個沒幫上，就再找下一個","done":"記住這句：找信任的大人說，一個沒幫上就再找下一個。","color":"#059669","steps":[{"type":"teach","kicker":"這個本領","title":"遇到事情，找信任的大人說","text":"遇到讓你不舒服、害怕、或不確定的事，<b>找一個你信任的大人說</b>最重要。信任的大人可能是<b>爸媽、阿公阿嬤、老師、輔導老師、親戚</b>——是你覺得安心、會好好聽你說、會幫你的人。","svg":""},{"type":"teach","kicker":"怎麼做","title":"先想好幾個，找到有人幫你為止","text":"可以先在心裡<b>想好兩三個信任的大人</b>。如果告訴了第一個，對方沒幫上忙、或沒把你的話當一回事，<b>別放棄，再找下一個，一直到有人幫你為止。</b>如果一時找不到能幫你的大人，你也可以打<b>「113 保護專線」（免費、24 小時）</b>，會有大人聽你說、幫你；很緊急的時候也可以打 <b>110</b>。你值得被幫助。","svg":""},{"type":"quiz","kicker":"換你試試","title":"你鼓起勇氣告訴一個大人，但他好像沒把你的話當一回事","options":["別放棄，再去找另一個信任的大人說","算了，以後再也不跟任何人講","覺得一定是自己的錯，不敢再說"],"answer":0,"why":"第一個大人沒幫上忙，不代表沒有人會幫你；再找下一個信任的大人，直到有人認真聽你、幫你。"}]},{"id":"bs_notfault","name":"這不是你的錯","emoji":"🌈","sub":"錯的是越過界線的人","done":"記住這句：越過界線的人才有錯，願意說出來的我很勇敢。","color":"#059669","steps":[{"type":"teach","kicker":"這個本領","title":"錯的永遠不是你","text":"如果有人越過了你的身體界線，<b>錯的是那個做出這種事的人，永遠不是你。</b>就算你當下沒有說不、沒有跑開，或是之前跟對方很好，<b>都不是你的錯。</b>","svg":""},{"type":"teach","kicker":"怎麼做","title":"說出來的你，非常勇敢","text":"說出來以後，你可能會覺得害怕或難過，這些心情都很正常。<b>願意說出來的你，非常勇敢。</b>照顧你的大人會幫你，一切會慢慢變好。你值得安全，也值得被好好對待。","svg":""},{"type":"quiz","kicker":"換你試試","title":"有人越過了你的界線，你心裡有點想「是不是我不好？」","options":["錯的是對方，不是我；我願意說出來很勇敢","一定是我哪裡做錯了才會這樣","都是我的錯，所以更不能告訴別人"],"answer":0,"why":"被越過界線從來不是孩子的錯，責任在做這件事的人；願意說出來是勇敢，不是做錯事。"}]},{"id":"bs_online","name":"網路上的身體界線","emoji":"📱","sub":"照片和影片也要守住界線","done":"記住這句：不拍、不傳身體的照片；有人要求就告訴大人。","color":"#059669","steps":[{"type":"teach","kicker":"這個本領","title":"網路上一樣有身體界線","text":"身體的界線在網路上一樣要守。<b>不要拍、也不要傳自己身體（尤其是隱私部位）的照片或影片給任何人</b>，就算對方說是好朋友、說看完會刪掉、或說不傳就不理你。","svg":""},{"type":"teach","kicker":"怎麼做","title":"遇到就馬上告訴大人","text":"如果<b>有人要你傳這種照片，或傳讓你不舒服的圖片、影片給你</b>，不要照做、不要回、也不要自己刪掉當作沒發生——<b>馬上告訴信任的大人</b>。<b>就算你已經傳出去了，或不小心做了，那也不是你的錯，更不會太遲</b>，一樣要馬上告訴信任的大人，他們會幫你——錯的是那個要求你的人。網路上看不到對方是誰，更要小心保護自己。","svg":""},{"type":"quiz","kicker":"換你試試","title":"網路上有人要你傳自己身體的照片，說「傳了才是好朋友」","options":["不傳，並馬上告訴信任的大人","是好朋友就傳給他看","傳一張應該沒關係"],"answer":0,"why":"真正的朋友不會用「友情」逼你做讓你不舒服的事；不傳身體照片、並告訴信任的大人，才是保護自己的做法。"}]}]};
</script>
