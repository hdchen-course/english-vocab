<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEFR 閃卡</title>
<!-- 引擎資產須在本頁 <style> 之前載入：app.css / game_core.css 先進，本頁樣式在後逐項覆蓋，維持原本外觀並取得夜間模式；game_core.js 於 <head> 同步載入以注入計分 HUD（現已防重疊）。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<!-- 共用「間隔重複」排程核心：須在 game_core.js 之後、本頁腳本之前載入（瀏覽器掛 window.SRS）。 -->
<script src="assets/srs_engine.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 本頁強調色三件組 —— 接到英語科目色，所有共用元件與局部樣式自動換色、
 * 亮/暗雙主題化（見 assets/app.css 的設計語言層說明）。 */
:root {
  --accent: var(--c-english);
  --accent-tint: var(--tint-english);
  --accent-ink: var(--c-english-ink);
}

body {
  font-family: var(--font);
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  overflow-x: hidden;
}
/* 外層改吃共用 .shell（--content-max：手機 720／iPad 1200），移除寫死的 560px 窄條；
 * .app-bar 為 <body> 直屬子元素、body 無左右 padding，故頂列自然滿版（比照 finance/social canon）。 */

/* Header（頁面主標題區；.app-bar 由 assets/app.css 自帶更高特異度樣式，不受影響） */
header { text-align: center; margin-bottom: var(--s5); }
header .emoji { font-size: 48px; display: block; margin-bottom: var(--s2); }
header h1 { font-size: var(--fs-h1); font-weight: 800; color: var(--ink); }
header p { color: var(--ink-soft); font-size: var(--fs-small); font-weight: 600; margin-top: var(--s1); }

/* Level buttons —— 統一的可點卡片式選鈕：中性底＋2px 邊，選中/hover 才上強調色，
 * 讓「強調色稀用且一致」，不再各級散用綠/藍/紫硬碼。（a1/a2/b1 class 仍供 JS 定位） */
/* 等級選單改用共用 .u-grid：手機單/雙欄好讀，iPad 自動攤成寬版多欄（display/gap 由 .u-grid 提供） */
.level-selector {
  margin-bottom: var(--s4);
  /* 只有 3 個等級鈕：用置中 flex 而非 auto-fit grid，避免在寬螢幕上被拉得過寬、
     與 coca/toeic 姊妹頁不一致。 */
  display: flex; flex-wrap: wrap; gap: var(--s3); justify-content: center;
}
.level-selector .level-btn { flex: 0 1 220px; max-width: 240px; }
.level-btn {
  min-height: 56px;
  padding: 14px 8px;
  border: 2px solid var(--card-border);
  border-radius: 16px;
  background: var(--card);
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(15px, 3vw, 17px);
  font-weight: 800;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.level-btn:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); }
.level-btn:active { transform: scale(0.96); }
.level-btn.active { background: var(--c-english-btn); color: var(--on-accent); border-color: transparent; box-shadow: var(--shadow-sm); }

/* Mode toggle */
.mode-toggle {
  display: flex;
  justify-content: center;
  gap: var(--s2);
  margin-bottom: var(--s4);
}
.mode-btn {
  min-height: 48px;
  padding: 10px 20px;
  border: 2px solid var(--card-border);
  border-radius: 16px;
  background: var(--card);
  font-family: var(--font);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--ink-soft);
  cursor: pointer;
  transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}
.mode-btn.active {
  background: var(--c-english-btn);
  color: var(--on-accent);
  border-color: transparent;
}
.mode-btn:active { transform: scale(0.96); }

/* Progress */
.progress-bar {
  text-align: center;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--ink-soft);
  margin-bottom: var(--s4);
}

/* Card container（翻卡互動維持不變；卡面採共用 .q-stage 的圓角/邊/陰影語言）。
 * 兩面用 CSS grid 疊在同一格（grid-area 1/1）：容器高度自動吃「較高的一面」，
 * 短卡靠 min-height 撐出卡感，長例句也不會溢出、翻面鈕永遠不會被蓋住。 */
.card-container {
  perspective: 1200px;
  margin-bottom: var(--s4);
}
.card-inner {
  display: grid;
  transition: transform 0.5s;
  transform-style: preserve-3d;
  width: 100%;
}
.card-inner.flipped { transform: rotateY(180deg); }
.card-front, .card-back {
  grid-area: 1 / 1;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  width: 100%;
  min-height: 280px;
  background: var(--card);
  border-radius: var(--r-lg);
  padding: var(--s6) var(--s4);
  box-shadow: var(--shadow-sm);
  border: 2px solid var(--card-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--s3);
  cursor: pointer;
  overflow: hidden;
  overflow-wrap: break-word;
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}
.card-front:hover, .card-back:hover { box-shadow: var(--shadow-lg); border-color: var(--accent); }
.card-back { transform: rotateY(180deg); }

.card-front .hint-label {
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.card-front .definition-text {
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  line-height: 1.45;
  max-width: 30ch;
  overflow-wrap: break-word;
}
.card-front .tap-hint {
  margin-top: var(--s2);
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--ink-soft);
}

/* BACK：答案以「emoji＋單字＋中文」的 hero 組為視覺主體，例句／發音分組在下，
 * 用細分隔線與間距切開兩組，不再是一長條擠在一起的直式堆疊。 */
.card-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s1);
  max-width: 100%;
}
.card-back .word-emoji {
  font-size: clamp(52px, 16vw, 76px);
  line-height: 1.05;
}
.word-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  flex-wrap: wrap;
  max-width: 100%;
}
.card-back .word-text {
  font-size: clamp(26px, 7vw, 36px);
  font-weight: 800;
  color: var(--c-english-ink);
  min-width: 0;
  overflow-wrap: break-word;
}
.card-back .chinese-hint {
  font-size: var(--fs-h2);
  color: var(--ink);
  font-weight: 800;
}
.card-detail {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s2);
  width: min(38ch, 100%);
  max-width: 100%;
  padding-top: var(--s3);
  border-top: 1px solid var(--card-border);
}
.sentence-text {
  font-size: var(--fs-body);
  font-weight: 600;
  color: var(--ink-soft);
  text-align: center;
  line-height: 1.6;
  max-width: 100%;
  overflow-wrap: break-word;
}
.sentence-text strong {
  color: var(--c-english-ink);
  font-weight: 800;
}

/* Action buttons */
.action-buttons {
  display: flex;
  gap: var(--s3);
  justify-content: center;
  margin-bottom: var(--s4);
}
.action-btn {
  flex: 1;
  max-width: 180px;
  min-height: 56px;
  padding: 14px 12px;
  border: 2px solid transparent;
  border-radius: 16px;
  font-family: var(--font);
  font-size: clamp(15px, 3vw, 17px);
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.2s ease, color 0.2s ease;
}
.action-btn:active { transform: scale(0.96); }
/* (已移除 .btn-know/.btn-again 死碼樣式：無任何 markup 使用，實際自評鈕走 .fc-rate__btn；
   其 :hover 為白字疊實心綠/紅僅 2.54/2.59:1 未達 AA，移除以免誤導與被誤報) */
.btn-flip {
  display: block;
  width: 100%;
  max-width: 220px;
  min-height: 50px;
  margin: 0 auto var(--s4);
  padding: 14px 20px;
  border: 2px solid var(--accent);
  border-radius: 16px;
  background: var(--card);
  font-family: var(--font);
  font-size: clamp(15px, 3vw, 17px);
  font-weight: 700;
  color: var(--c-english-ink);
  cursor: pointer;
  transition: transform 0.12s ease, background 0.2s ease, color 0.2s ease;
}
.btn-flip:hover { background: var(--c-english-btn); color: var(--on-accent); border-color: transparent; }
.btn-flip:active { transform: scale(0.96); }

/* Quiz mode —— 舞台卡採共用 .q-stage 語言；選項對齊 .q-opt 尺寸與狀態色 */
.quiz-container {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s5) var(--s4);
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--s4);
}
.quiz-definition {
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  margin: 0 auto var(--s3);
  line-height: 1.45;
  max-width: 32ch;
}
.quiz-cloze {
  font-size: var(--fs-body);
  font-weight: 600;
  color: var(--ink-soft);
  text-align: center;
  margin: 0 auto var(--s5);
  line-height: 1.55;
  font-style: italic;
  max-width: 34ch;
}
.quiz-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s3);
}
.quiz-option {
  min-height: 56px;
  padding: 14px 12px;
  border: 2px solid var(--card-border);
  border-radius: 16px;
  background: var(--card);
  font-family: var(--font);
  font-size: clamp(15px, 3.4vw, 18px);
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.quiz-option:hover { border-color: var(--accent); background: var(--accent-tint); }
.quiz-option:active { transform: scale(0.98); }
.quiz-option.correct::after { content: ' ✓'; font-weight: 800; }
.quiz-option.wrong::after { content: ' ✗'; font-weight: 800; }
.quiz-option.correct {
  background: var(--tint-english);
  border-color: var(--c-correct);
  color: var(--c-english-ink);
  animation: popIn 0.3s;
}
.quiz-option.wrong {
  background: rgba(255,118,117,0.12);
  border-color: var(--c-wrong);
  color: var(--ink);
  animation: shake 0.4s;
}
.quiz-option.highlight {
  background: var(--tint-english);
  border-color: var(--c-correct);
  color: var(--c-english-ink);
}

.quiz-feedback {
  text-align: center;
  margin-top: var(--s4);
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.55;
  min-height: 30px;
}
.quiz-next-btn {
  display: block;
  margin: var(--s4) auto 0;
  min-height: 48px;
  padding: 12px 28px;
  border: none;
  border-radius: 16px;
  background: var(--c-english-btn);
  color: var(--on-accent);
  font-family: var(--font);
  font-size: clamp(15px, 3vw, 17px);
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease;
}
.quiz-next-btn:hover { box-shadow: var(--shadow-lg); }
.quiz-next-btn:active { transform: scale(0.96); }

/* Completion screen —— 採共用 .result-card 的結算卡語言 */
.complete-screen {
  text-align: center;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--s6) var(--s4);
}
.complete-screen .big-emoji { font-size: clamp(64px, 22vw, 100px); line-height: 1.1; margin-bottom: var(--s3); }
.complete-screen h2 { font-size: var(--fs-h2); font-weight: 800; margin-bottom: var(--s3); }
.complete-screen p { font-size: var(--fs-body); font-weight: 700; color: var(--ink-soft); margin: 0 auto var(--s5); max-width: 34ch; }
.restart-btn {
  min-height: 50px;
  padding: 14px 28px;
  border: none;
  border-radius: 16px;
  background: var(--c-english-btn);
  color: var(--on-accent);
  font-family: var(--font);
  font-size: clamp(15px, 3vw, 17px);
  font-weight: 700;
  cursor: pointer;
  margin: var(--s1);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease;
}
.restart-btn:hover { box-shadow: var(--shadow-lg); }
.restart-btn:active { transform: scale(0.96); }

/* Confetti */
.confetti-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}
.confetti-piece {
  position: absolute;
  width: 10px;
  height: 10px;
  top: -10px;
  border-radius: 2px;
  animation: confettiFall 1.5s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
@keyframes popIn {
  0% { transform: scale(0.9); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* Hidden state */
.hidden { display: none !important; }

/* Welcome placeholder —— 置中卡片，維持同一設計語言的暖白卡面 */
.welcome-msg {
  text-align: center;
  padding: var(--s6) var(--s4);
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  color: var(--ink-soft);
  font-size: var(--fs-body);
  font-weight: 600;
}
.welcome-msg .big-emoji { font-size: 56px; display: block; margin-bottom: var(--s3); }

@media (prefers-reduced-motion: reduce) {
  .quiz-option.correct, .quiz-option.wrong { animation: none; }
  .level-btn:active, .mode-btn:active, .action-btn:active, .btn-flip:active,
  .quiz-option:active, .quiz-next-btn:active, .restart-btn:active { transform: none; }
}

@media (max-width: 480px) {
  .level-btn { padding: 14px 6px; }
}
</style>
</head>
<body>
<!-- ===== 共用頂部應用列（全站一致；貼在 <body> 內第一個元素） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">CEFR 閃卡 🃏</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

<header>
  <span class="emoji">📇</span>
  <h1>CEFR 閃卡</h1>
  <p>看定義，猜單字！翻面看答案</p>
  <p>不確定要選哪一級？就從 A1 入門開始吧！</p>
</header>

<!-- Level Selector（選單：寬版多欄 dashboard 感由 .u-grid 提供） -->
<div class="level-selector u-grid">
  <button class="level-btn a1" onclick="selectLevel('cefr_a1')">A1 入門</button>
  <button class="level-btn a2" onclick="selectLevel('cefr_a2')">A2 基礎</button>
  <button class="level-btn b1" onclick="selectLevel('cefr_b1')">B1 進階</button>
</div>

<!-- 單字圖鑑入口（全站級收藏，未選等級也可用） -->
<div class="worddex-nav">
  <button class="mode-btn" onclick="Worddex.openScreen()">🌈 單字圖鑑</button>
  <button class="mode-btn" onclick="Worddex.startReview()" title="複習今天到期的字">🔭 今日複習</button>
  <span class="worddex-due-desc" id="worddexDueDesc"></span>
</div>

<a href="coca_flashcard.html" class="cn-nextup" style="max-width:720px;margin:0 auto var(--s4);box-sizing:border-box"><span class="cn-nextup-ic" aria-hidden="true">🚀</span><span>已經很熟了？來挑戰進階的「COCA 分級字彙」→</span></a>

<!-- 答題／學習互動區：包進 .play-column（置中收窄），避免 iPad 寬版下閱讀行過長、拇指按不到 -->
<div class="play-column">

<!-- Mode Toggle -->
<div class="mode-toggle hidden" id="modeToggle">
  <button class="mode-btn active" id="btnFlashcard" onclick="switchMode('flashcard')">閃卡模式</button>
  <button class="mode-btn" id="btnQuiz" onclick="switchMode('quiz')">測驗模式</button>
  <button class="mode-btn" id="btnSpell" onclick="switchMode('spell')">拼字模式</button>
</div>

<!-- Progress -->
<div class="progress-bar hidden" id="progressBar" aria-live="polite"></div>

<!-- Welcome -->
<div id="welcomeMsg" class="welcome-msg">
  <span class="big-emoji">👆</span>
  <p>選擇一個等級開始學習吧！</p>
</div>

<!-- Flashcard Mode（audio-first 正面：看字聽音回想義／看義回想字，雙向交錯） -->
<div id="flashcardArea" class="hidden">
  <div class="fc-card" id="fcCard" role="button" tabindex="0" aria-label="單字卡，點擊或按 Enter 翻面"
       onclick="flipCard()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard();}">
    <div class="fc-card__inner" id="cardInner">
      <div class="fc-card__face fc-card__front" id="cardFront"></div>
      <div class="fc-card__face fc-card__back" id="cardBack"></div>
    </div>
  </div>
  <button class="btn-flip" id="flipBtn" onclick="flipCard()">翻面看答案</button>
  <!-- 三級自評（對齊 SM-2）：答錯不呈現為降級、文案兒童友善 -->
  <div class="fc-rate hidden" id="rateButtons">
    <button class="fc-rate__btn again" onclick="rateCard('again')" aria-label="還不熟，再練一次">😅<span class="fc-rate__btn__label">還不熟</span></button>
    <button class="fc-rate__btn good" onclick="rateCard('good')" aria-label="想起來了">🙂<span class="fc-rate__btn__label">想起來了</span></button>
    <button class="fc-rate__btn easy" onclick="rateCard('easy')" aria-label="很輕鬆">😎<span class="fc-rate__btn__label">很輕鬆</span></button>
  </div>
</div>

<!-- Quiz Mode（雙向：看義選字／看字選義；答錯揭示面板＋自控繼續） -->
<div id="quizArea" class="hidden">
  <div class="quiz-container">
    <div class="quiz-definition" id="quizDefinition"></div>
    <div class="quiz-cloze" id="quizCloze"></div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="fc-reveal" id="quizReveal" aria-live="polite"></div>
  </div>
</div>

<!-- Spelling Mode（產出型回想：字母磚點選為預設，可切換鍵盤打字） -->
<div id="spellArea" class="hidden">
  <div class="quiz-container">
    <button class="fc-spell__toggle" id="spellToggle" onclick="toggleSpellMode()">⌨️ 改用鍵盤</button>
    <div class="fc-spell">
      <div class="fc-spell__head">
        <div class="fc-card__emoji" id="spellEmoji"></div>
        <div class="fc-card__cn" id="spellCn"></div>
        <div class="fc-card__hint" id="spellHint"></div>
        <button class="fc-audio fc-audio--lg" id="spellAudio" onclick="playWordAudio()" aria-label="播放單字發音">🔊</button>
      </div>
      <div class="fc-spell__slots" id="spellSlots" aria-label="拼字答案格"></div>
      <div class="fc-spell__bank" id="spellBank" aria-label="字母磚"></div>
      <button class="quiz-next-btn" id="spellCheckBtn" onclick="checkSpelling()">檢查</button>
    </div>
    <div class="fc-reveal" id="spellReveal" aria-live="polite"></div>
  </div>
</div>

<!-- Completion Screen -->
<div id="completeScreen" class="hidden complete-screen">
  <div class="big-emoji">🎉</div>
  <h2>恭喜完成！</h2>
  <p id="completeMsg"></p>
  <button class="restart-btn" onclick="restartLevel()">再來一次</button>
  <button class="restart-btn" onclick="resetAll()">換等級</button>
</div>

</div><!-- /.play-column -->

<!-- ===== 單字圖鑑畫面（比照 flashcardArea 用 .hidden 開關，非 .screen 系統） ===== -->
<div id="worddexArea" class="hidden">
  <div class="worddex-top">
    <h2 class="worddex-title">🌈 單字圖鑑</h2>
    <button class="worddex-back" onclick="Worddex.closeScreen()">← 返回</button>
  </div>
  <div class="worddex-summary" id="worddexSummary" aria-live="polite"></div>
  <div class="worddex-legend">
    <span><span class="lg">☆</span> 未收集</span>
    <span><span class="lg">⭐</span> 收集中</span>
    <span><span class="lg">🌟</span> 精通</span>
    <span><span class="lg">🔵</span> 今天待複習</span>
  </div>
  <div class="worddex-actions">
    <button class="mode-btn" onclick="Worddex.startReview()">🔭 開始今日複習</button>
  </div>
  <div id="worddexSections"></div>
</div>

<!-- 單字聚焦面板 overlay（[hidden] 初始隱藏，含 CSS 保險） -->
<div class="worddex-focus-overlay" id="worddexFocusOverlay" hidden>
  <div class="worddex-focus-card">
    <button class="worddex-focus-close" onclick="Worddex.closeFocus()" aria-label="關閉">✕</button>
    <div class="worddex-focus-body" id="worddexFocusBody"></div>
  </div>
</div>

</main>

<!-- Confetti container -->
<div class="confetti-container" id="confettiContainer"></div>

<script src="cefr_flashcard__0.js"></script>
<script src="vocab_data_cefr_a1.js"></script>
<script src="vocab_data_cefr_a2.js"></script>
<script src="vocab_data_cefr_b1.js"></script>
<!-- 共用排程 store：綁定本頁既有 key `cefr_worddex_v1`（巢狀格式）。
     由「主作答漏斗」與「單字圖鑑」共用同一實例，寫入即時同步。
     一次性 lazy 正規化：舊 Worddex 卡（有 box、已點亮但無 SM-2 status）補上
     status='review'，讓排程能正確判定到期；純補欄位、絕不清空。 -->
<script src="cefr_flashcard__1.js"></script>
</body>
</html>
