<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化學實驗室 🧪 — 物質的祕密</title>
<!-- 統一遊戲化引擎：先載共用設計 token（assets/app.css），再載 HUD/toast 樣式
     （game_core.css），最後同步載入引擎（game_core.js）。
     本頁為「化學」，計入 science 科目（理化／生物／地科共用；game_core.SUBJECTS 已含
     'science'），讓學生升上國中理化、高中化學時獎勵不中斷：
       1. 宣告 <body data-game-wired="science">，顯示共用 HUD。
       2. 每題作答只呼叫一次 Game.recordAnswer('science', 對錯)（answered 旗標鎖定、
          重試不再記帳）；「不」呼叫 Game.award / recordSession / awardBadge，
          本地徽章冊為純本地（自有 key、無 XP），故無 double-count。
       3. 其餘只用純 UI/唯讀 Game 介面：Game.showToast（只彈提示、不計分），
          以及由 app-bar 的 [data-theme-toggle] 自動接線的主題切換
          （game_core 於 DOMContentLoaded 自動 wireThemeToggles，本頁零 JS）。
     所有 Game 呼叫皆包 try/catch，Game 不存在也不報錯。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* =====================================================================
 * chemistry.html — 本頁樣式（全部建立在 assets/app.css 的設計 token 上，
 * 因此自動亮/暗色主題化、與學習基地視覺一致）。
 * 只做強調色映射（不新增全域變數）：本頁走青綠色系（green），映射到既有的
 * 英語/正解青綠 token，貼合「科學／實驗」的清新意象。
 * =================================================================== */
:root {
  --chem: var(--c-english);
  --chem-tint: var(--tint-english);
  --chem-ink: var(--c-english-ink);
}

body { overflow-x: hidden; }

/* 頁面頂列（返回、標題） */
.chem-topbar {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s4);
}
.chem-topbar .chem-title {
  flex: 1;
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  min-width: 0;
}

/* 螢幕切換 */
.chem-screen { display: none; animation: chem-fade 0.3s ease; }
.chem-screen.active { display: block; }
@keyframes chem-fade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .chem-screen { animation: none; }
}

/* 吉祥物歡迎卡 */
.chem-hello {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s4);
  background: var(--chem-tint);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  margin: 0 auto var(--s4);
  max-width: 720px;        /* 護眼：寬螢幕不讓開場語拉成超長單行 */
}
.chem-hello .chem-mascot { font-size: 46px; flex: none; line-height: 1; }
.chem-hello .chem-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.chem-hello .chem-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }

/* 進度總覽小列 */
.chem-overview {
  display: flex; align-items: center; gap: var(--s3);
  margin-bottom: var(--s4); flex-wrap: wrap;
}
.chem-overview .stat-tile { flex: 1; min-width: 96px; }

/* 等級（關卡）選單 grid */
.chem-levels {
  display: grid;
  gap: var(--s4);
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.chem-level {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  padding: var(--s4);
  text-align: left;
  cursor: pointer;
  border: 2px solid var(--card-border);
  background: var(--card);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  font-family: var(--font);
  color: var(--ink);
}
.chem-level:hover { box-shadow: var(--shadow-lg); border-color: var(--chem); }
.chem-level:active { transform: scale(0.98); }
.chem-level-top { display: flex; align-items: center; gap: var(--s3); }
.chem-level-emoji {
  font-size: 34px;
  width: 56px; height: 56px;
  flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--chem-tint);
  border-radius: 16px;
}
.chem-level-num { font-size: var(--fs-small); font-weight: 700; color: var(--chem-ink); }
.chem-level-name { font-size: var(--fs-body); font-weight: 800; color: var(--ink); line-height: 1.25; }
.chem-level-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }
.chem-level-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: 2px; }
.chem-level-status {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--fs-small); font-weight: 700;
}
.chem-level-status.done { color: var(--c-correct-ink); }
.chem-level-status.todo { color: var(--ink-soft); }
.chem-level-dots { display: inline-flex; gap: 3px; flex-wrap: wrap; max-width: 120px; justify-content: flex-end; }
.chem-level-dots i {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--card-border); display: inline-block;
}
.chem-level-dots i.on { background: var(--chem); }

/* 進行中：一步一畫面的大卡 */
.chem-stage {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--s5) var(--s4);
  text-align: center;
}
.chem-visual {
  font-size: clamp(64px, 22vw, 108px);
  line-height: 1.1;
  margin: var(--s2) 0 var(--s3);
  user-select: none;
}
.chem-sentence {
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.45;
  margin: 0 auto var(--s4);
  max-width: 32ch;
}
.chem-toolrow { display: flex; justify-content: center; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s3); }

/* 進度：本關卡第幾步 */
.chem-steps {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-bottom: var(--s3); flex-wrap: wrap;
}
.chem-steps i { width: 22px; height: 6px; border-radius: 999px; background: var(--card-border); }
.chem-steps i.on { background: var(--chem); }
.chem-steps i.cur { background: var(--chem); box-shadow: 0 0 0 3px var(--chem-tint); }

/* 選項按鈕（tap 作答；命中區 ≥56px） */
.chem-options { display: grid; gap: var(--s3); margin-top: var(--s2); }
.chem-opt {
  display: flex; align-items: center; gap: var(--s2);
  min-height: 56px;
  width: 100%;
  padding: 14px 18px;
  border: 2px solid var(--card-border);
  border-radius: 16px;
  background: var(--card);
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(16px, 3.4vw, 19px);
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
}
.chem-opt:active { transform: scale(0.98); }
.chem-opt:disabled { cursor: default; }
/* 對/錯雙碼：邊框色 + 圖示（✅/❌），不只靠顏色 */
.chem-opt.correct { border-color: var(--c-correct); background: var(--tint-english); color: var(--ink); }
.chem-opt.wrong { border-color: var(--c-wrong); background: rgba(255,118,117,0.12); color: var(--ink); }
.chem-opt.correct .chem-opt-mark { color: var(--c-correct-ink); }
.chem-opt.wrong .chem-opt-mark { color: var(--c-streak-ink); }
.chem-opt .chem-opt-mark { margin-left: auto; font-size: 22px; }

/* 揭示區（看更多 / 答案解說） */
.chem-reveal {
  margin-top: var(--s4);
  padding: var(--s3) var(--s4);
  background: var(--chem-tint);
  border-radius: var(--r-md);
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.55;
  text-align: left;
  display: none;
}
.chem-reveal.show { display: block; animation: chem-fade 0.3s ease; }
@media (prefers-reduced-motion: reduce) { .chem-reveal.show { animation: none; } }

/* 完成畫面 */
.chem-done { text-align: center; padding: var(--s5) var(--s4); }
.chem-done-emoji { font-size: clamp(64px, 22vw, 100px); }
.chem-done-stars { font-size: 30px; letter-spacing: 3px; margin: var(--s2) 0; }
.chem-done-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); }

/* 底部行動列 */
.chem-actions { display: flex; gap: var(--s3); margin-top: var(--s4); flex-wrap: wrap; }
.chem-actions .btn { flex: 1; min-width: 140px; }

.chem-footnote {
  text-align: left; color: var(--ink-soft); font-size: var(--fs-small);
  margin-top: var(--s5); font-weight: 600; line-height: 1.7;
  max-width: 680px; margin-inline: auto;    /* 護眼：桌機寬版限行長 */
  background: var(--chem-tint); border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
}

/* =====================================================================
 * 徽章櫃（StampBook 式）：入口 FAB + [hidden] 浮層
 * =================================================================== */
#chemBadgeFab {
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 55; display: inline-flex; align-items: center; gap: 6px;
  min-height: 48px; min-width: 48px; padding: 10px 16px;
  background: #0a7d63; color: #fff; border: none;  /* 深綠底白字 ≈5.1:1 過 WCAG AA（原 var(--chem) 淺綠白字僅 2.5:1）；兩主題同值 */
  border-radius: 999px; font-family: var(--font); font-weight: 800;
  font-size: clamp(14px, 3vw, 16px); cursor: pointer; box-shadow: var(--shadow-lg);
}
#chemBadgeFab:active { transform: scale(0.96); }
#chemBadgeFabCount {
  display: inline-flex; align-items: center;
  background: #fff; color: #087a5f; /* 固定深綠：白底藥丸兩主題皆 ~5.1:1 過 AA（勿用會隨暗色翻淺綠的 --chem-ink，暗色僅 1.89:1） */
  border-radius: 999px; padding: 1px 8px; font-size: 13px; font-weight: 800;
}

/* 浮層外殼（用 class 給了 display:flex，author 特異度會壓過 UA 的
   [hidden]{display:none}，故必須加更高特異度 !important 防護，否則浮層恆顯） */
.chem-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 60; padding: 16px;
}
#chemBadgeOverlay[hidden] { display: none !important; }
#chemBadgeSheet[hidden] { display: none !important; }

.chem-badge-sheet {
  position: relative; background: var(--card); border: 2px solid var(--card-border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  padding: 20px 18px 22px; color: var(--ink);
}
.chem-badge-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.chem-badge-head h2 { font-size: clamp(1.1rem, 4vw, 1.4rem); font-weight: 800; margin: 0; color: var(--ink); flex: 1; }
.chem-badge-back {
  background: var(--card); border: 2px solid var(--card-border); color: var(--chem-ink);
  font-family: var(--font); font-weight: 800; font-size: 15px; cursor: pointer;
  min-height: 44px; padding: 8px 14px; border-radius: 14px;
}
.chem-badge-back:active { transform: scale(0.96); }
.chem-badge-note {
  background: var(--chem-tint); color: var(--chem-ink); border-radius: var(--r-md);
  font-size: var(--fs-small); font-weight: 600; line-height: 1.7; padding: 10px 12px; margin: 4px 0 14px;
}
.chem-badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.chem-badge {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
  border-radius: 16px; background: var(--card); border: 2px solid var(--card-border);
  padding: 14px 10px; text-align: center;
}
.chem-badge .chem-badge-glyph { font-size: clamp(1.8rem, 8vw, 2.4rem); line-height: 1; }
.chem-badge .chem-badge-name { font-size: var(--fs-small); font-weight: 800; color: var(--ink); line-height: 1.2; }
.chem-badge .chem-badge-state { font-size: clamp(0.62rem, 2.4vw, 0.72rem); font-weight: 700; color: var(--ink-soft); line-height: 1.4; }
/* 未解鎖：虛線邊 + 去彩 + 半透明（雙碼：形狀虛線 + 去彩） */
.chem-badge.locked { border-style: dashed; opacity: 0.55; filter: grayscale(1); }
/* 已解鎖：實線主題色邊 + 右上 ✓ 角標（雙碼：✓ 角標 + 實線邊） */
.chem-badge.earned { border-color: var(--chem); background: var(--chem-tint); }
.chem-badge.earned .chem-badge-check { position: absolute; right: 6px; top: 5px; font-size: 14px; color: var(--c-correct-ink); font-weight: 900; }
.chem-badge .chem-badge-go {
  margin-top: 4px; background: #0a7d63; border: none; color: #fff;  /* 深綠底白字 ≈5.1:1 過 WCAG AA（原 var(--chem) 淺綠白字亮 2.54／暗 1.89 不足）；兩主題同值 */
  min-height: 44px; padding: 6px 12px; border-radius: 12px; font-size: 13px;
  cursor: pointer; font-weight: 800; font-family: var(--font);
}
.chem-badge .chem-badge-go:active { transform: scale(0.96); }
.chem-badge-empty { text-align: center; color: var(--ink-soft); font-weight: 700; font-size: var(--fs-small); line-height: 1.7; margin: 8px 0 4px; }
</style>
</head>
<body data-game-wired="science" data-game-maturity="advanced">
<!-- ===== 共用頂部應用列（全站一致；貼在 <body> 內第一個元素） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">化學實驗室 🧪</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

  <!-- ============================= 選單 / 首頁 ============================= -->
  <section id="screen-menu" class="chem-screen active">
    <div class="chem-topbar">
      <span class="chem-title">物質的祕密 🧪</span>
    </div>

    <a href="chemistry_concepts.html" style="display:flex;align-items:center;gap:10px;margin:0 0 var(--s4);padding:12px 16px;background:var(--card);border:2px dashed var(--card-border);border-radius:14px;color:var(--ink);font-weight:700;text-decoration:none;line-height:1.4"><span style="font-size:22px" aria-hidden="true">🧠</span><span>還沒學過嗎？先到「化學觀念養成」用圖學會，再回來練習 →</span></a>

    <div class="chem-hello">
      <span class="chem-mascot" aria-hidden="true">🧪</span>
      <div>
        <div class="chem-hello-text" id="hello-text">嗨！我是小實（🧪），一起用眼睛和好奇心，看看物質的祕密吧！</div>
        <div class="chem-hello-sub" id="hello-sub">選一個等級，慢慢玩、慢慢懂。</div>
      </div>
    </div>

    <div class="chem-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-done">0/22</span><span class="stat-label">完成等級</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-badges">0/23</span><span class="stat-label">解鎖徽章</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-stars">0</span><span class="stat-label">得到的星星</span></div>
    </div>

    <div class="chem-levels" id="level-list"><!-- 由 JS 產生 --></div>

    <p class="chem-footnote">
      🧑‍🔬 安全小提醒：這裡只用眼睛觀察、動腦想——不做危險實驗喔！
      家裡的清潔劑、藥品絕對不能自己亂混、不能嚐、不能碰。有趣的化學現象，
      要在大人陪同、安全的地方觀察。
    </p>
  </section>

  <!-- ============================= 進行中 ============================= -->
  <section id="screen-play" class="chem-screen">
    <div class="chem-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到等級選單">←</button>
      <span class="chem-title" id="play-title">等級</span>
    </div>
    <div class="chem-steps" id="step-dots" aria-hidden="true"></div>
    <div class="play-column">
      <div id="stage"><!-- 由 JS 產生每一步 --></div>
    </div>
  </section>

</main>

<!-- ===== 徽章櫃：入口 FAB + [hidden] 浮層（純本地、只增不減） ===== -->
<button id="chemBadgeFab" type="button" aria-label="打開化學徽章櫃" aria-haspopup="dialog" aria-controls="chemBadgeOverlay">
  🏅 徽章櫃 <span id="chemBadgeFabCount">0/23</span>
</button>
<div id="chemBadgeOverlay" class="chem-overlay" hidden>
  <div id="chemBadgeSheet" class="chem-badge-sheet" role="dialog" aria-modal="true" aria-label="化學徽章櫃">
    <div class="chem-badge-head">
      <h2>🏅 我的化學徽章櫃</h2>
      <button type="button" class="chem-badge-back" id="chem-badge-close">← 返回</button>
    </div>
    <div class="chem-badge-note" id="chem-badge-note">每完成一個等級，就會解鎖一枚徽章。徽章只會亮起、不會消失——慢慢收集就好！</div>
    <div class="chem-badge-grid" id="chem-badge-grid"><!-- 由 JS 產生 --></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // 計分策略：本頁以 <body data-game-wired="science"> 掛在既有 'science' 科目下（化學屬自然科學）。
  //   每題只呼叫一次 Game.recordAnswer('science', 對錯)（answered 旗標鎖定、重試不重記）；
  //   「不」呼叫 award/recordSession/awardBadge/pingActive，本地徽章冊為純本地（自有 key、無 XP）。
  //   計入 'science' 是刻意設計，且因單次記帳、不重複計分。
  // ---------------------------------------------------------------------
  function toast(msg, kind) {
    try { if (window.Game && Game.showToast) Game.showToast(msg, kind); } catch (e) { /* 靜默 */ }
  }

  // ---- Web Speech TTS（繁中、可選、無網路依賴、失敗即靜默） ----
  function speak(text) { /* 科學頁不朗讀：已移除 TTS（非英文發音頁，機器中文語音會難聽又重疊播放） */ }

  // =====================================================================
  // 獨立 localStorage keys（與 player_profile_v1 / social_studies_progress_v1 /
  // nta_stamps_v1 完全不同名，互不干擾）。載入皆 try/catch，解析失敗回 {}。
  // =====================================================================
  var PROG_KEY = 'chemistry_progress_v1';   // { [levelId]: { done:true, best:<stars> } }
  var BADGE_KEY = 'chemistry_badges_v1';    // { [badgeId]: { earnedAt:<ISO> } }
  function loadJSON(key) {
    try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; }
  }
  function saveJSON(key, obj) {
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) { /* 配額滿也不崩潰 */ }
  }
  var progress = loadJSON(PROG_KEY);
  var badges = loadJSON(BADGE_KEY);

  // =====================================================================
  // 徽章清單（levelId → badgeId）＋ 全通關總成就。純本地、只增不減。
  // =====================================================================
  var BADGE_DEFS = [
    { id: 'b_states',    level: 'L1', emoji: '🧊', name: '三態觀察家' },
    { id: 'b_phase',     level: 'L2', emoji: '💧', name: '相變魔法師' },
    { id: 'b_separate',  level: 'L3', emoji: '⚗️', name: '分離達人' },

  function scoringSteps(level) {
    var n = 0;
    for (var i = 0; i < level.steps.length; i++) if (level.steps[i].t === 'choose') n++;
    return n;
  }

  function doneCount() {
    var c = 0;
    for (var i = 0; i < LEVELS.length; i++) if (progress[LEVELS[i].id] && progress[LEVELS[i].id].done) c++;
    return c;
  }
  function earnedBadgeCount() {
    var c = 0;
    for (var i = 0; i < BADGE_DEFS.length; i++) if (badges[BADGE_DEFS[i].id]) c++;
    return c;
  }
  function totalStars() {
    var s = 0;
    for (var id in progress) { if (progress[id] && progress[id].best) s += progress[id].best; }
    return s;
  }

  // =====================================================================
  // 選單渲染
  // =====================================================================
  function renderMenu() {
    var dc = doneCount();
    $('ov-done').textContent = dc + '/' + LEVELS.length;
    $('ov-badges').textContent = earnedBadgeCount() + '/' + BADGE_DEFS.length;
    $('ov-stars').textContent = totalStars();
    $('chemBadgeFabCount').textContent = earnedBadgeCount() + '/' + BADGE_DEFS.length;

    // 歡迎語（首次 / 回訪 / 全完成；讚美努力、不催促）
    if (dc >= LEVELS.length) {
      $('hello-text').textContent = '所有等級都完成了，你是化學小博士！🎓';
      $('hello-sub').textContent = '想再逛哪一關都可以，慢慢玩、慢慢懂。';
    } else if (dc > 0) {
      $('hello-text').textContent = '歡迎回來！你已經完成 ' + dc + ' 個等級，好厲害！';
      $('hello-sub').textContent = '選一個等級，慢慢玩、慢慢懂。';
    }

    // 等級卡（全開放、不擋關，孩子可自由選）
    levelList.innerHTML = '';
    for (var u = 0; u < LEVELS.length; u++) {
      (function (level, num) {
        var done = progress[level.id] && progress[level.id].done;
        var stars = progress[level.id] ? (progress[level.id].best || 0) : 0;
        var total = scoringSteps(level);
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'chem-level';
        card.setAttribute('aria-label', '等級 ' + num + '：' + level.title);
        var dots = '';
        for (var d = 0; d < total; d++) dots += '<i class="' + (d < stars ? 'on' : '') + '"></i>';
        card.innerHTML =
          '<div class="chem-level-top">' +
            '<span class="chem-level-emoji" aria-hidden="true">' + level.emoji + '</span>' +
            '<div>' +
              '<div class="chem-level-num">等級 ' + num + '</div>' +
              '<div class="chem-level-name">' + level.title + '</div>' +
              '<div class="chem-level-sub">' + level.subtitle + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="chem-level-foot">' +
            '<span class="chem-level-status ' + (done ? 'done' : 'todo') + '">' +
              (done ? '✅ 已完成' : '▶️ 開始挑戰（共 ' + total + ' 題）') + '</span>' +
            '<span class="chem-level-dots" aria-hidden="true">' + dots + '</span>' +
          '</div>';
        card.addEventListener('click', function () { startLevel(level); });
        levelList.appendChild(card);
      })(LEVELS[u], u + 1);
    }
  }

  // =====================================================================
  // 遊玩流程
  // =====================================================================
  function show(screen) {
    screenMenu.classList.remove('active');
    screenPlay.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0, 0);
  }

  function startLevel(level) {
    cur = { level: level, idx: 0, correctCount: 0, total: scoringSteps(level) };
    playTitle.textContent = level.emoji + ' ' + level.title;
    show(screenPlay);
    renderStep();
  }

  function renderStepDots() {
    stepDots.innerHTML = '';
    for (var i = 0; i < cur.level.steps.length; i++) {
      var b = document.createElement('i');
      if (i < cur.idx) b.className = 'on';
      else if (i === cur.idx) b.className = 'cur';
      stepDots.appendChild(b);
    }
  }

  function next() {
    cur.idx++;
    if (cur.idx >= cur.level.steps.length) finishLevel();
    else renderStep();
  }

  function ttsButton(text) { return ''; }  /* 科學頁不需朗讀鈕（移除 🔊 TTS） */
  function bindTts(root) {
    var btns = root.querySelectorAll('.chem-tts');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () { speak(this.getAttribute('data-tts')); });
    }
  }

  function renderStep() {
    renderStepDots();
    var step = cur.level.steps[cur.idx];
    if (step.t === 'fact') return renderFact(step);
    if (step.t === 'choose') return renderChoose(step);
  }

  // ---- fact（worked example 先行） ----
  function renderFact(step) {
    stage.innerHTML =
      '<div class="chem-stage">' +
        '<div class="chem-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="chem-sentence">' + step.s + '</p>' +
        '<div class="chem-toolrow">' + ttsButton(step.s) +
          '<button type="button" class="btn" id="btn-more">💡 看更多</button></div>' +
        '<div class="chem-reveal" id="reveal">' + (step.more || '') + '</div>' +
      '</div>' +
      '<div class="chem-actions">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">開始挑戰 ➡️</button>' +
      '</div>';
    bindTts(stage);
    $('btn-more').addEventListener('click', function () {
      $('reveal').classList.add('show');
    });
    $('btn-next').addEventListener('click', next);
  }

  // ---- choose（選項洗牌；每題只計一次分） ----
  function renderChoose(step) {
    // 打亂選項顯示順序（正解不可固定在第一個，孩子才會真的閱讀）。
    // data-i 記的是「原始索引」，因此對答判斷 i === step.ans 仍然正確。
    var order = [];
    for (var oi = 0; oi < step.opts.length; oi++) order.push(oi);
    for (var m = order.length - 1; m > 0; m--) {
      var r = Math.floor(Math.random() * (m + 1));
      var tt = order[m]; order[m] = order[r]; order[r] = tt;
    }
    var optsHtml = '';
    for (var k = 0; k < order.length; k++) {
      var origIdx = order[k];
      optsHtml += '<button type="button" class="chem-opt" data-i="' + origIdx + '">' +
        '<span>' + step.opts[origIdx] + '</span><span class="chem-opt-mark" aria-hidden="true"></span></button>';
    }
    stage.innerHTML =
      '<div class="chem-stage">' +
        '<div class="chem-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="chem-sentence">' + step.s + '</p>' +
        '<div class="chem-toolrow">' + ttsButton(step.s) + '</div>' +
        '<div class="chem-options">' + optsHtml + '</div>' +
        '<div class="chem-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="chem-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button>' +
      '</div>';
    bindTts(stage);

    // answered 旗標鎖定：僅第一次作答計入 cur.correctCount，之後重試只給視覺回饋。
    var answered = false;
    var btns = stage.querySelectorAll('.chem-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var i = parseInt(this.getAttribute('data-i'), 10);
        var isCorrect = (i === step.ans);
        if (answered) {
          // 已答過：只給視覺提示，不再重複計分。
          if (isCorrect) {
            this.classList.add('correct');
            this.querySelector('.chem-opt-mark').textContent = '✅';
          } else {
            this.classList.add('wrong');
            this.querySelector('.chem-opt-mark').textContent = '❌';
          }
          return;
        }
        answered = true;
        if (window.Game && window.Game.recordAnswer) Game.recordAnswer('science', isCorrect);
        if (isCorrect) {
          this.classList.add('correct');
          this.querySelector('.chem-opt-mark').textContent = '✅';
          cur.correctCount++;           // 本頁本地星等（記憶體），與主引擎無關
          reveal(step, true);
        } else {
          this.classList.add('wrong');
          this.querySelector('.chem-opt-mark').textContent = '❌';
          // 標出正解、鼓勵再試（不懲罰）。用原始索引找到正解按鈕（選項已洗牌）。
          var correctBtn = stage.querySelector('.chem-opt[data-i="' + step.ans + '"]');
          if (correctBtn) {
            correctBtn.classList.add('correct');
            correctBtn.querySelector('.chem-opt-mark').textContent = '✅';
          }
          reveal(step, false);
        }
      });
    }

    function reveal(step, correct) {
      var rev = $('reveal');
      rev.textContent = (correct ? '答對了！' : '沒關係，再想想～正確答案是這個！') + ' ' + (step.why || '');
      rev.classList.add('show');
      $('afteract').style.display = 'flex';
      var all = stage.querySelectorAll('.chem-opt');
      for (var k = 0; k < all.length; k++) all[k].disabled = true;
    }

    $('btn-next').addEventListener('click', next);
  }

  // =====================================================================
  // 完成關卡：寫入獨立 key（保留最佳星等，只增不減）＋ 解鎖徽章（純本地）
  // =====================================================================
  function finishLevel() {
    var level = cur.level;
    var stars = cur.correctCount;
    var total = cur.total;

    // 進度：保留最佳星等（Math.max，只增不減）
    var prev = progress[level.id] || {};
    progress[level.id] = { done: true, best: Math.max(prev.best || 0, stars) };
    saveJSON(PROG_KEY, progress);

    // 解鎖徽章（只增不減；已解鎖不覆寫 earnedAt）
    var newlyEarned = [];
    var lb = BADGE_BY_LEVEL[level.id];
    if (lb && !badges[lb.id]) {
      badges[lb.id] = { earnedAt: new Date().toISOString() };
      newlyEarned.push(lb);
    }
    // 全部等級完成 → 解鎖總成就
    if (doneCount() >= LEVELS.length) {
      var grand = BADGE_DEFS[BADGE_DEFS.length - 1]; // b_doctor
      if (!badges[grand.id]) {
        badges[grand.id] = { earnedAt: new Date().toISOString() };
        newlyEarned.push(grand);
      }
    }
    if (newlyEarned.length) saveJSON(BADGE_KEY, badges);

    var starStr = '';
    for (var i = 0; i < total; i++) starStr += (i < stars ? '⭐' : '☆');

    stage.innerHTML =
      '<div class="chem-stage chem-done">' +
        '<div class="chem-done-emoji" aria-hidden="true">🎉</div>' +
        '<div class="chem-done-title">完成「' + level.title + '」！</div>' +
        '<div class="chem-done-stars" aria-label="得到 ' + stars + ' 顆星">' + starStr + '</div>' +
        '<p class="chem-sentence" style="font-size:clamp(16px,3.6vw,19px)">你答對了 ' + stars + ' / ' + total + ' 題，好棒！</p>' +
      '</div>' +
      '<div class="chem-actions">' +
        '<button type="button" class="btn" id="btn-menu">回到選單</button>' +
        (nextLevelOf(level) ? '<button type="button" class="btn btn-primary" id="btn-nextlevel">下一個等級 ➡️</button>' : '<button type="button" class="btn btn-primary" id="btn-badges2">看我的徽章 🏅</button>') +
      '</div>';

    // 徽章慶祝（純 UI；Game.showToast 只彈提示、不計分）
    for (var e = 0; e < newlyEarned.length; e++) {
      toast('解鎖徽章：' + newlyEarned[e].emoji + ' ' + newlyEarned[e].name + '！', 'badge');
    }

    $('btn-menu').addEventListener('click', goMenu);
    var nl = nextLevelOf(level);
    if (nl) $('btn-nextlevel').addEventListener('click', function () { startLevel(nl); });
    else { var b2 = $('btn-badges2'); if (b2) b2.addEventListener('click', function () { goMenu(); openBadges(); }); }
  }

  function nextLevelOf(level) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (LEVELS[i].id === level.id) return LEVELS[i + 1] || null;
    }
    return null;
  }

  function goMenu() {
    cur = null;
    renderMenu();
    show(screenMenu);
  }

  // =====================================================================
  // 徽章櫃浮層（[hidden] 屬性切換；只切 hidden，不動 class）
  // =====================================================================
  var overlay = $('chemBadgeOverlay');

  function renderBadges() {
    var grid = $('chem-badge-grid');
    grid.innerHTML = '';
    for (var i = 0; i < BADGE_DEFS.length; i++) {
      var def = BADGE_DEFS[i];
      var earned = !!badges[def.id];
      var el = document.createElement('div');
      el.className = 'chem-badge ' + (earned ? 'earned' : 'locked');
      var state = earned
        ? '已解鎖'
        : (def.level ? '玩完這個等級就會亮起來喔！' : '完成全部 ' + LEVELS.length + ' 個等級就會亮起來！');
      var goBtn = (earned && def.level)
        ? '<button type="button" class="chem-badge-go" data-go="' + def.level + '">再逛一次 →</button>'
        : '';
      el.innerHTML =
        (earned ? '<span class="chem-badge-check" aria-hidden="true">✓</span>' : '') +
        '<span class="chem-badge-glyph" aria-hidden="true">' + def.emoji + '</span>' +
        '<span class="chem-badge-name">' + def.name + '</span>' +
        '<span class="chem-badge-state">' + state + '</span>' +
        goBtn;
      grid.appendChild(el);
    }
    // 空狀態文案（溫和、不誘導）
    var note = $('chem-badge-note');
    if (earnedBadgeCount() === 0) {
      note.textContent = '你的化學徽章櫃還空空的，先去玩一個等級吧！';
    } else {
      note.textContent = '每完成一個等級，就會解鎖一枚徽章。徽章只會亮起、不會消失——慢慢收集就好！';
    }
    // 「再逛一次」→ 回到該等級
    var gos = grid.querySelectorAll('.chem-badge-go');
    for (var g = 0; g < gos.length; g++) {
      gos[g].addEventListener('click', function () {
        var lid = this.getAttribute('data-go');
        var lvl = null;
        for (var j = 0; j < LEVELS.length; j++) if (LEVELS[j].id === lid) lvl = LEVELS[j];
        if (lvl) { closeBadges(); startLevel(lvl); }
      });
    }
  }

  function openBadges() {
    renderBadges();
    overlay.hidden = false;
    var closeBtn = $('chem-badge-close');
    if (closeBtn) closeBtn.focus();
  }
  function closeBadges() { overlay.hidden = true; }

  $('chemBadgeFab').addEventListener('click', openBadges);
  $('chem-badge-close').addEventListener('click', closeBadges);
  // 點浮層背景（非內容）也可關閉
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeBadges(); });
  // Esc 關閉（鍵盤可操作）
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Escape' || e.key === 'Esc') && !overlay.hidden) closeBadges();
  });

  // =====================================================================
  // 頂列按鈕（主題切換由共用 app-bar 的 [data-theme-toggle] 統一處理，
  // 由 game_core 自動接線與圖示同步，本頁不再自行處理主題。）
  // =====================================================================
  $('btn-back').addEventListener('click', goMenu);

  // =====================================================================
  // 啟動
  // =====================================================================
  renderMenu();
})();
</script>
</body>
</html>
