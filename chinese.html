<!DOCTYPE html>
<html lang="zh-TW" data-game-wired="chinese">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國語大冒險</title>
<!-- 統一遊戲化引擎：主題 token、HUD/toast 樣式、共用引擎（同步載入於 <head>）。
     app.css 先於本頁 <style> 載入，本頁樣式在後、逐屬性覆蓋，維持原本外觀（並取得夜間模式）。
     data-game-wired 亦置於 <html>：引擎於 <head> 同步執行時 document.body 尚為 null，
     須靠 <html> 讓 deltaSync 當下即抑制 chinese 來源（chinese_game_state.exp）的重複計分。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* 移除 Google Fonts @import：離線可用＋不阻塞渲染（效能）；改用系統字，與全書其餘頁一致 */
/* 本頁強調色三件組（國語科；沿用共用設計語言）：強調色只用於卡片邊/圖示底/
   進度/揭示區等「稀用且一致」處，主要行動鈕仍為全站品牌藍。 */
:root {
  --accent: var(--c-chinese);
  --accent-tint: var(--tint-chinese);
  --accent-ink: var(--c-chinese-ink);
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font);
  min-height: 100vh;
  /* 直向堆疊：共用 .app-bar 置頂滿版，#app 於其下水平置中（與 math 等頁一致，
     避免舊的 row 版把 app-bar 與 #app 並排、令頂列不滿版且內容溢出）。 */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: var(--bg);
  overflow-x: hidden;
  overflow-y: auto;
}

/* canon shell：外層改吃 --content-max（手機 720 / iPad 1200），置中；
   保留 SPA 全高與 overflow-x:hidden。iPad 上 #app 變寬 → 選單攤成多欄儀表板，
   答題區另用 .play-column 收窄（見下）。 */
#app {
  width: 100%;
  max-width: var(--content-max);
  margin-inline: auto;
  min-height: 100dvh;
  position: relative;
  overflow-x: hidden;
  overflow-y: auto;
}

.screen {
  display: none;
  width: 100%;
  min-height: 100dvh;
  padding: 16px;
  padding-bottom: 80px;
  animation: fadeIn 0.3s ease;
}

.screen.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.header {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 4px 0 0;
  margin-bottom: 4px;
}

.header-title {
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
}

.header-btn {
  background: var(--accent-tint);
  border: none;
  color: var(--ink);
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s ease;
}

.header-btn:active {
  transform: scale(0.9);
}

.save-notice {
  text-align: center;
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 600;
  margin-bottom: var(--s3);
}

/* 吉祥物開場橫幅：與 concept/subject 頁的 hello banner 同一設計語言 */
.ch-hello { display:flex; align-items:center; gap:var(--s3); padding:var(--s4); background:var(--accent-tint); border:1px solid var(--card-border); border-radius:var(--r-lg); margin-bottom:var(--s4); }
.ch-hello .ch-mascot { font-size:44px; flex:none; line-height:1; }
.ch-htext { font-size:var(--fs-body); font-weight:700; color:var(--ink); }
.ch-hsub { font-size:var(--fs-small); color:var(--ink); font-weight:600; margin-top:2px; }
.category-sub { font-size:var(--fs-small); color:var(--ink-soft); font-weight:600; line-height:1.4; margin-top:1px; }
/* 與 physics 等頁一致：3 個獨立 stat-tile 卡（非單一長條），全書統一設計語言 */
.stats-bar {
  margin-bottom: var(--s4);
  display: flex;
  align-items: stretch;
  gap: var(--s3);
}

.stat-item {
  flex: 1;
  min-width: 96px;
  text-align: center;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--s3) var(--s4);
}

.stat-value {
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
}

.stat-label {
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--ink-soft);
}

.exp-bar-container {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s3) var(--s4);
  margin-bottom: var(--s4);
  box-shadow: var(--shadow-sm);
}

.exp-info {
  display: flex;
  justify-content: space-between;
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 700;
  margin-bottom: var(--s2);
}

.exp-bar {
  height: 8px;
  background: var(--card-border);
  border-radius: 999px;
  overflow: hidden;
}

.exp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent));
  border-radius: 999px;
  transition: width 0.5s ease;
}

/* canon 選單 grid：repeat(auto-fit,minmax(260px,1fr)) —
   手機單/雙欄好讀，iPad 自動攤成寬版多欄 dashboard。 */
.category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--s4);
  padding-bottom: var(--s5);
}

.category-card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: var(--s4);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  border: 2px solid var(--card-border);
  text-align: left;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: var(--s3);
}
.category-body { flex: 1 1 auto; min-width: 0; }

.category-card:hover {
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.category-card:active {
  transform: scale(0.98);
}

.category-emoji {
  width: 56px;
  height: 56px;
  margin: 0;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  background: var(--accent-tint);
  border-radius: var(--r-sm);
}

.category-name {
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 800;
  line-height: 1.25;
  margin-bottom: var(--s1);
}

/* 字詞收藏冊 / 今日複習 入口卡（與 category-card 同一套視覺，橫向並排；補上原本缺的樣式） */
.wordex-entries { display:flex; flex-wrap:wrap; gap:var(--s3); margin:var(--s4) 0 var(--s5); }
.wordex-entry-card {
  flex:1 1 300px; min-width:0; display:flex; align-items:center; gap:var(--s3);
  background:var(--card); border:2px solid var(--card-border); border-radius:var(--r-lg);
  padding:var(--s3) var(--s4); cursor:pointer; box-shadow:var(--shadow-sm);
  transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
}
.wordex-entry-card:hover { box-shadow:var(--shadow-lg); border-color:var(--accent); }
.wordex-entry-card:active { transform:scale(0.98); }
.wordex-entry-emoji {
  width:48px; height:48px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  font-size:28px; background:var(--accent-tint); border-radius:var(--r-sm);
}
.wordex-entry-body { flex:1 1 auto; min-width:0; }
.wordex-entry-name { color:var(--ink); font-size:var(--fs-body); font-weight:800; line-height:1.25; }
.wordex-entry-sub { color:var(--ink-soft); font-size:var(--fs-small); font-weight:600; margin-top:2px; }

/* 主選單卡底部 foot＝全書共用「▶️ 開始／✅ 完成」affordance（比照 .cn-lesson-foot） */
.category-foot {
  font-size: var(--fs-small);
  font-weight: 700;
  margin-top: var(--s1);
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex-wrap: wrap;
}
.category-foot.done { color: var(--c-correct-ink); }
.category-foot .category-stars { color: var(--ink-soft); font-weight: 600; }

/* 關卡選單同樣走 canon grid：手機單欄直列，iPad 多欄 dashboard。 */
.level-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--s4);
}

/* 關卡卡片＝全書共用選單卡結構（比照 .cn-lesson）：直式，磚塊 emoji-tile 上排＋
   標題＋副標，底部 ▶️ 開始／✅ 完成 foot（不再是橫向 + 右側 → 箭頭）。 */
.level-card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  text-align: left;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  border: 2px solid var(--card-border);
  box-shadow: var(--shadow-sm);
}

.level-card:hover {
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.level-card:active {
  transform: scale(0.98);
}

.level-card.locked {
  opacity: 0.5;
  cursor: not-allowed;
}

.level-card-top {
  display: flex;
  align-items: center;
  gap: var(--s3);
}

.level-badge {
  width: 52px;
  height: 52px;
  flex: none;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: var(--accent-ink);
  background: var(--accent-tint);
  font-size: 22px;
}

.level-card-info {
  color: var(--ink);
}

.level-card-title {
  font-size: var(--fs-body);
  font-weight: 800;
  line-height: 1.25;
}

.level-card-sub {
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--ink-soft);
}

.level-card-foot {
  font-size: var(--fs-small);
  font-weight: 700;
  margin-top: 2px;
  color: var(--ink-soft);
}
.level-card-foot.done { color: var(--c-correct-ink); }

/* Question screen */
.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

/* 關卡標題（比照 concept/subject 題目頁「← 關卡名」）：放在返回鍵右側。 */
.q-level-title {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--fs-body);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.3;
}

.progress-dots {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: var(--s4);
}

.progress-dot {
  width: 22px;
  height: 6px;
  border-radius: 999px;
  background: var(--card-border);
}

.progress-dot.correct { background: var(--c-correct); }
.progress-dot.wrong { background: var(--c-wrong); }
.progress-dot.current { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }

.combo-display {
  color: var(--c-coin-ink);
  font-size: var(--fs-small);
  font-weight: 800;
}

/* 答題區收窄置中：實作 HTML 註解承諾但先前從未定義的 .play-column 上限（app.css 預設 width:100%），
   避免 iPad/桌機上題目卡被拉到 --content-max(~1320px)、而內容(題幹 32ch＋選項)只到 ~760px 形成中央窄島。
   860px 足以容納 2 欄選項與題幹，且與全書「答題欄收窄護眼」一致。 */
.play-column { width: 100%; max-width: min(100%, 860px); margin-inline: auto; }
/* 題目卡：把題目＋選項＋解說包在同一張卡（比照 .ma-stage 等），與全書題目卡一致。 */
.ch-qcard {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--s5) var(--s4);
  margin-bottom: var(--s4);
}
.question-box {
  margin-bottom: var(--s4);
  text-align: center;
}

.question-text {
  color: var(--ink);
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  text-align: center;
  line-height: 1.45;
  max-width: 32ch;
  margin: 0 auto;
}

.passage-text {
  color: var(--ink);
  font-size: var(--fs-body);
  line-height: 1.8;
  margin-bottom: var(--s4);
  padding: var(--s4);
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-md);
  border-left: 4px solid var(--accent);
  box-shadow: var(--shadow-sm);
}

/* 選項排版比照全書 canon（.q-options）：手機／平板單欄，寬螢幕才置中兩欄並收斂到
   易讀寬度——避免桌機上選項被拉成整條、單字選項中間空空。 */
.options-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s3);
  margin-top: var(--s2);
  max-width: 640px;
  margin-inline: auto;
}
@media (min-width: 1024px) {
  .options-grid { grid-template-columns: 1fr 1fr; max-width: 760px; }
}

.option-btn {
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 14px 18px;
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(16px, 3.4vw, 19px);
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
  text-align: left;
  line-height: 1.4;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

.option-btn:active {
  transform: scale(0.98);
}

.option-btn.correct {
  background: var(--tint-english);
  border-color: var(--c-correct);
  color: var(--ink);
  animation: popIn 0.3s ease;
}

.option-btn.wrong {
  background: rgba(255, 118, 117, 0.12);
  border-color: var(--c-wrong);
  color: var(--ink);
  animation: shake 0.3s ease;
}

.option-btn.disabled {
  pointer-events: none;
  opacity: 0.6;
}

.option-btn.correct.disabled,
.option-btn.wrong.disabled,
.option-btn.show-correct.disabled {
  opacity: 1;
}

.option-btn.show-correct {
  border-color: var(--c-correct);
  background: var(--tint-english);
  color: var(--ink);
}

/* 除了顏色，也用符號標對錯（對色盲/低視力友善；與全書其他選擇題頁一致）*/
.option-btn.correct::after,
.option-btn.show-correct::after { content: " ✓"; font-weight: 900; }
.option-btn.wrong::after { content: " ✗"; font-weight: 900; }

.explanation-box {
  background: var(--accent-tint);
  border-radius: var(--r-md);
  border-left: 4px solid var(--accent);
  padding: var(--s3) var(--s4);
  margin-top: var(--s4);
  display: none;
  animation: fadeIn 0.3s ease;
}

.explanation-box.show {
  display: block;
}

.explanation-text {
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 700;
  line-height: 1.55;
}

.next-btn {
  display: none;
  width: 100%;
  min-height: 56px;
  padding: 12px 20px;
  margin-top: var(--s4);
  background: linear-gradient(135deg, var(--c-primary-btn), var(--c-primary-btn2));
  border: none;
  border-radius: 16px;
  color: var(--on-accent);
  font-family: var(--font);
  font-size: clamp(17px, 4.5vw, 20px);
  font-weight: 800;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease;
}

.next-btn.show {
  display: block;
}

.next-btn:active {
  transform: scale(0.96);
}

/* Result screen */
.result-container {
  text-align: center;
  margin-top: var(--s5);
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--s5) var(--s4);
}

.result-stars {
  font-size: clamp(40px, 12vw, 56px);
  letter-spacing: 4px;
  margin-bottom: var(--s3);
  animation: popIn 0.5s ease;
}

.result-score {
  color: var(--ink);
  font-size: var(--fs-h2);
  font-weight: 800;
  margin-bottom: var(--s2);
}

.result-detail {
  color: var(--ink-soft);
  font-size: var(--fs-body);
  font-weight: 700;
  max-width: 34ch;
  margin: 0 auto var(--s5);
}

.result-exp {
  background: var(--accent-tint);
  border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
  margin-bottom: var(--s5);
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 800;
}

.result-buttons {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}

.result-btn {
  min-height: 56px;
  padding: 12px 20px;
  border: 2px solid transparent;
  border-radius: 16px;
  font-family: var(--font);
  font-size: clamp(17px, 4.5vw, 20px);
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.result-btn:active {
  transform: scale(0.96);
}

.result-btn.primary {
  background: linear-gradient(135deg, var(--c-primary-btn), var(--c-primary-btn2));
  color: var(--on-accent);
  box-shadow: var(--shadow-sm);
}

.result-btn.secondary {
  background: var(--card);
  border-color: var(--card-border);
  color: var(--accent-ink);
}

.option-btn:focus-visible {
  outline: 3px solid var(--c-focus);
  outline-offset: 2px;
}
</style>
</head>
<!-- data-game-hud="native"：本頁已有自己的 EXP／稱號／連擊列與經驗條，不注入浮動 HUD（防重疊）。
     data-game-wired="chinese"：同 <html>，讓引擎於 <body> 就緒後仍維持 legacy XP 抑制。 -->
<body data-game-hud="native" data-game-wired="chinese">
<!-- ===== 共用頂部應用列（全站一致；貼在 <body> 內第一個元素） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">國語大冒險 🀄</span>
  <button type="button" class="app-bar__theme" id="sound-toggle" aria-label="音效開關" aria-pressed="true" title="音效開關">
    <span class="app-bar__theme-icon" aria-hidden="true">🔊</span>
  </button>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<div id="app">
  <!-- Home Screen -->
  <div class="screen active" id="home-screen">
    <div class="ch-hello"><span class="ch-mascot" aria-hidden="true">🀄</span>
      <div><div class="ch-htext">用玩的方式，把成語、字音字形、造句、閱讀和語詞一次練起來。</div>
      <div class="ch-hsub">先挑一個主題，一關一關往下闖，把喜歡的字詞收進字詞收藏冊。</div></div></div>
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value" id="stat-exp">0</div>
        <div class="stat-label">經驗值</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-rank">國語小新星</div>
        <div class="stat-label">稱號</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-combo">0</div>
        <div class="stat-label">最高連擊</div>
      </div>
    </div>
    <div class="exp-bar-container">
      <div class="exp-info">
        <span id="rank-current">國語小新星</span>
        <span id="rank-next">→ 語文新手 (100)</span>
      </div>
      <div class="exp-bar">
        <div class="exp-fill" id="exp-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="category-grid" id="category-grid"></div>
    <!-- 字詞收藏冊入口（非題型；獨立卡片，不併入 CATEGORIES，避免影響 5 分類星數統計） -->
    <div class="wordex-entries" id="wordex-entries">
      <div class="wordex-entry-card" role="button" tabindex="0" onclick="Wordex.openScreen()">
        <div class="wordex-entry-emoji">📔</div>
        <div class="wordex-entry-body">
          <div class="wordex-entry-name">字詞收藏冊</div>
          <div class="wordex-entry-sub" id="wordex-entry-collect-sub">已收藏 0 張</div>
        </div>
      </div>
      <div class="wordex-entry-card" role="button" tabindex="0" onclick="Wordex.startReview()">
        <div class="wordex-entry-emoji">🔁</div>
        <div class="wordex-entry-body">
          <div class="wordex-entry-name">今日複習</div>
          <div class="wordex-entry-sub" id="wordex-entry-review-sub">今天複習完了，明天見！</div>
        </div>
      </div>
    </div>
    <div class="cn-nextup-group">
      <a href="chinese_concepts.html" class="cn-nextup cn-nextup--back"><span class="cn-nextup-ic" aria-hidden="true">📖</span><span>還沒學過嗎？先到「國語觀念養成」用圖學會部首、筆順、標點，再回來練習 →</span></a>
      <a href="chinese_advanced.html" class="cn-nextup"><span class="cn-nextup-ic" aria-hidden="true">🚀</span><span>已經很熟了？來挑戰更難的「進階國文挑戰」→</span></a>
    </div>
  </div>

  <!-- Level Select Screen -->
  <div class="screen" id="level-screen">
    <div class="header">
      <button class="header-btn" id="back-to-home">←</button>
      <div class="header-title" id="level-screen-title">選擇關卡</div>
      <div style="width:40px"></div>
    </div>
    <div class="level-list" id="level-list"></div>
  </div>

  <!-- Question Screen -->
  <!-- 答題區包 .play-column（min(860px,100%) 置中）：iPad 上不被拉到 1200px，
       維持適當閱讀行長與拇指可及的選項寬度。 -->
  <div class="screen" id="question-screen">
    <div class="play-column">
      <div class="question-header">
        <button class="header-btn" id="quit-game" title="離開這一關">←</button>
        <span class="q-level-title" id="q-level-title"></span>
        <div class="combo-display" id="combo-display"></div>
      </div>
      <div class="progress-dots" id="progress-dots"></div>
      <div class="ch-qcard">
        <div id="passage-container"></div>
        <div class="question-box">
          <div class="question-text" id="question-text"></div>
        </div>
        <div class="options-grid" id="options-grid"></div>
        <div class="explanation-box" id="explanation-box" aria-live="polite">
          <div class="explanation-text" id="explanation-text"></div>
        </div>
      </div>
      <button class="next-btn" id="next-btn">下一題 →</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div class="screen" id="result-screen">
    <div class="play-column">
    <div class="result-container">
      <div class="result-stars" id="result-stars"></div>
      <div class="result-score" id="result-score"></div>
      <div class="result-detail" id="result-detail"></div>
      <div class="result-exp" id="result-exp"></div>
      <div class="result-buttons">
        <button class="result-btn primary" id="result-next">下一關 →</button>
        <button class="result-btn secondary" id="result-retry">再試一次 🔄</button>
        <button class="result-btn secondary" id="result-home" aria-label="返回主畫面">← 回主畫面</button>
      </div>
    </div>
    </div>
  </div>

  <!-- 字詞收藏冊畫面（additive；自足，不影響既有出題流程） -->
  <div class="screen" id="wordex-screen">
    <div class="play-column">
      <div class="header">
        <button class="header-btn" id="wordex-back" title="返回主畫面" onclick="renderHome()">←</button>
        <div class="header-title">📔 字詞收藏冊</div>
        <div style="width:40px"></div>
      </div>
      <div class="wordex-summary" id="wordex-summary"></div>
      <div class="wordex-filter" id="wordex-filter"></div>
      <div class="wordex-grid" id="wordex-grid"></div>
    </div>
  </div>

  <!-- 焦點浮層（單張字詞卡） -->
  <div class="wordex-focus-overlay" id="wordex-focus-overlay" hidden>
    <div class="wordex-focus-card">
      <button class="wordex-focus-close" onclick="Wordex.closeFocus()" aria-label="關閉">✕</button>
      <div id="wordex-focus-body"></div>
    </div>
  </div>

  <!-- 複習／單張練習完成的輕量結果浮層 -->
  <div class="wordex-focus-overlay" id="wordex-result-overlay" hidden>
    <div class="wordex-focus-card">
      <div id="wordex-result-body"></div>
    </div>
  </div>
</div>

<script src="chinese.js"></script>
</body>
</html>
