<!DOCTYPE html>
<html lang="zh-TW" data-game-wired="chinese">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國語大冒險</title>
<!-- 統一遊戲化引擎：主題 token、HUD/toast 樣式、共用引擎（同步載入於 <head>）。
     app.css 先於本頁 <style> 載入，本頁樣式在後、逐屬性覆蓋，維持原本外觀（並取得夜間模式）。
     data-game-wired 亦置於 <html>：引擎於 <head> 同步執行時 document.body 尚為 null，
     須靠 <html> 讓 deltaSync 當下即抑制 chinese 來源（chinese_game_state.exp）的重複計分。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* 移除 Google Fonts @import：離線可用＋不阻塞渲染（效能）；改用系統字，與全書其餘頁一致 */
/* 本頁強調色三件組（國語科；沿用共用設計語言）：強調色只用於卡片邊/圖示底/
   進度/揭示區等「稀用且一致」處，主要行動鈕仍為全站品牌藍。 */
:root {
  --accent: var(--c-chinese);
  --accent-tint: var(--tint-chinese);
  --accent-ink: var(--c-chinese-ink);
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font);
  min-height: 100vh;
  /* 直向堆疊：共用 .app-bar 置頂滿版，#app 於其下水平置中（與 math 等頁一致，
     避免舊的 row 版把 app-bar 與 #app 並排、令頂列不滿版且內容溢出）。 */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: var(--bg);
  overflow-x: hidden;
  overflow-y: auto;
}

/* canon shell：外層改吃 --content-max（手機 720 / iPad 1200），置中；
   保留 SPA 全高與 overflow-x:hidden。iPad 上 #app 變寬 → 選單攤成多欄儀表板，
   答題區另用 .play-column 收窄（見下）。 */
#app {
  width: 100%;
  max-width: var(--content-max);
  margin-inline: auto;
  min-height: 100dvh;
  position: relative;
  overflow-x: hidden;
  overflow-y: auto;
}

.screen {
  display: none;
  width: 100%;
  min-height: 100dvh;
  padding: 16px;
  padding-bottom: 80px;
  animation: fadeIn 0.3s ease;
}

.screen.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.header {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 4px 0 0;
  margin-bottom: 4px;
}

.header-title {
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
}

.header-btn {
  background: var(--accent-tint);
  border: none;
  color: var(--ink);
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s ease;
}

.header-btn:active {
  transform: scale(0.9);
}

.save-notice {
  text-align: center;
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 600;
  margin-bottom: var(--s3);
}

/* 吉祥物開場橫幅：與 concept/subject 頁的 hello banner 同一設計語言 */
.ch-hello { display:flex; align-items:center; gap:var(--s3); padding:var(--s4); background:var(--accent-tint); border:1px solid var(--card-border); border-radius:var(--r-lg); margin-bottom:var(--s4); }
.ch-hello .ch-mascot { font-size:44px; flex:none; line-height:1; }
.ch-htext { font-size:var(--fs-body); font-weight:700; color:var(--ink); }
.ch-hsub { font-size:var(--fs-small); color:var(--ink); font-weight:600; margin-top:2px; }
.category-sub { font-size:var(--fs-small); color:var(--ink-soft); font-weight:600; line-height:1.4; margin-top:1px; }
/* 與 physics 等頁一致：3 個獨立 stat-tile 卡（非單一長條），全書統一設計語言 */
.stats-bar {
  margin-bottom: var(--s4);
  display: flex;
  align-items: stretch;
  gap: var(--s3);
}

.stat-item {
  flex: 1;
  min-width: 96px;
  text-align: center;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--s3) var(--s4);
}

.stat-value {
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
}

.stat-label {
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--ink-soft);
}

.exp-bar-container {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s3) var(--s4);
  margin-bottom: var(--s4);
  box-shadow: var(--shadow-sm);
}

.exp-info {
  display: flex;
  justify-content: space-between;
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 700;
  margin-bottom: var(--s2);
}

.exp-bar {
  height: 8px;
  background: var(--card-border);
  border-radius: 999px;
  overflow: hidden;
}

.exp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent));
  border-radius: 999px;
  transition: width 0.5s ease;
}

/* canon 選單 grid：repeat(auto-fit,minmax(260px,1fr)) —
   手機單/雙欄好讀，iPad 自動攤成寬版多欄 dashboard。 */
.category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--s4);
  padding-bottom: var(--s5);
}

.category-card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: var(--s4);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  border: 2px solid var(--card-border);
  text-align: left;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: var(--s3);
}
.category-body { flex: 1 1 auto; min-width: 0; }

.category-card:hover {
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.category-card:active {
  transform: scale(0.98);
}

.category-emoji {
  width: 56px;
  height: 56px;
  margin: 0;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  background: var(--accent-tint);
  border-radius: var(--r-sm);
}

.category-name {
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 800;
  line-height: 1.25;
  margin-bottom: var(--s1);
}

.category-progress {
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 600;
}
/* 主選單卡底部 foot＝全書共用「▶️ 開始／✅ 完成」affordance（比照 .cn-lesson-foot） */
.category-foot {
  font-size: var(--fs-small);
  font-weight: 700;
  margin-top: var(--s1);
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex-wrap: wrap;
}
.category-foot.done { color: var(--c-correct-ink); }
.category-foot .category-stars { color: var(--ink-soft); font-weight: 600; }

/* 關卡選單同樣走 canon grid：手機單欄直列，iPad 多欄 dashboard。 */
.level-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--s4);
}

/* 關卡卡片＝全書共用選單卡結構（比照 .cn-lesson）：直式，磚塊 emoji-tile 上排＋
   標題＋副標，底部 ▶️ 開始／✅ 完成 foot（不再是橫向 + 右側 → 箭頭）。 */
.level-card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  text-align: left;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  border: 2px solid var(--card-border);
  box-shadow: var(--shadow-sm);
}

.level-card:hover {
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.level-card:active {
  transform: scale(0.98);
}

.level-card.locked {
  opacity: 0.5;
  cursor: not-allowed;
}

.level-card-top {
  display: flex;
  align-items: center;
  gap: var(--s3);
}

.level-badge {
  width: 52px;
  height: 52px;
  flex: none;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: var(--accent-ink);
  background: var(--accent-tint);
  font-size: 22px;
}

.level-card-info {
  color: var(--ink);
}

.level-card-title {
  font-size: var(--fs-body);
  font-weight: 800;
  line-height: 1.25;
}

.level-card-sub {
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--ink-soft);
}

.level-card-foot {
  font-size: var(--fs-small);
  font-weight: 700;
  margin-top: 2px;
  color: var(--ink-soft);
}
.level-card-foot.done { color: var(--c-correct-ink); }

/* Question screen */
.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

/* 關卡標題（比照 concept/subject 題目頁「← 關卡名」）：放在返回鍵右側。 */
.q-level-title {
  flex: 1 1 auto;
  min-width: 0;
  font-size: var(--fs-body);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.3;
}

.progress-dots {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: var(--s4);
}

.progress-dot {
  width: 22px;
  height: 6px;
  border-radius: 999px;
  background: var(--card-border);
}

.progress-dot.correct { background: var(--c-correct); }
.progress-dot.wrong { background: var(--c-wrong); }
.progress-dot.current { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }

.combo-display {
  color: var(--c-coin-ink);
  font-size: var(--fs-small);
  font-weight: 800;
}

/* 題目卡：把題目＋選項＋解說包在同一張卡（比照 .ma-stage 等），與全書題目卡一致。 */
.ch-qcard {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--s5) var(--s4);
  margin-bottom: var(--s4);
}
.question-box {
  margin-bottom: var(--s4);
  text-align: center;
}

.question-text {
  color: var(--ink);
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  text-align: center;
  line-height: 1.45;
  max-width: 32ch;
  margin: 0 auto;
}

.passage-text {
  color: var(--ink);
  font-size: var(--fs-body);
  line-height: 1.8;
  margin-bottom: var(--s4);
  padding: var(--s4);
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-md);
  border-left: 4px solid var(--accent);
  box-shadow: var(--shadow-sm);
}

/* 選項排版比照全書 canon（.q-options）：手機／平板單欄，寬螢幕才置中兩欄並收斂到
   易讀寬度——避免桌機上選項被拉成整條、單字選項中間空空。 */
.options-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s3);
  margin-top: var(--s2);
  max-width: 640px;
  margin-inline: auto;
}
@media (min-width: 1024px) {
  .options-grid { grid-template-columns: 1fr 1fr; max-width: 760px; }
}

.option-btn {
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 14px 18px;
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(16px, 3.4vw, 19px);
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
  text-align: left;
  line-height: 1.4;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

.option-btn:active {
  transform: scale(0.98);
}

.option-btn.correct {
  background: var(--tint-english);
  border-color: var(--c-correct);
  color: var(--ink);
  animation: popIn 0.3s ease;
}

.option-btn.wrong {
  background: rgba(255, 118, 117, 0.12);
  border-color: var(--c-wrong);
  color: var(--ink);
  animation: shake 0.3s ease;
}

.option-btn.disabled {
  pointer-events: none;
  opacity: 0.6;
}

.option-btn.correct.disabled,
.option-btn.wrong.disabled,
.option-btn.show-correct.disabled {
  opacity: 1;
}

.option-btn.show-correct {
  border-color: var(--c-correct);
  background: var(--tint-english);
  color: var(--ink);
}

/* 除了顏色，也用符號標對錯（對色盲/低視力友善；與全書其他選擇題頁一致）*/
.option-btn.correct::after,
.option-btn.show-correct::after { content: " ✓"; font-weight: 900; }
.option-btn.wrong::after { content: " ✗"; font-weight: 900; }

.explanation-box {
  background: var(--accent-tint);
  border-radius: var(--r-md);
  border-left: 4px solid var(--accent);
  padding: var(--s3) var(--s4);
  margin-top: var(--s4);
  display: none;
  animation: fadeIn 0.3s ease;
}

.explanation-box.show {
  display: block;
}

.explanation-text {
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 700;
  line-height: 1.55;
}

.next-btn {
  display: none;
  width: 100%;
  min-height: 56px;
  padding: 12px 20px;
  margin-top: var(--s4);
  background: linear-gradient(135deg, var(--c-primary-btn), var(--c-primary-btn2));
  border: none;
  border-radius: 16px;
  color: var(--on-accent);
  font-family: var(--font);
  font-size: clamp(17px, 4.5vw, 20px);
  font-weight: 800;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease;
}

.next-btn.show {
  display: block;
}

.next-btn:active {
  transform: scale(0.96);
}

/* Result screen */
.result-container {
  text-align: center;
  margin-top: var(--s5);
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--s5) var(--s4);
}

.result-stars {
  font-size: clamp(40px, 12vw, 56px);
  letter-spacing: 4px;
  margin-bottom: var(--s3);
  animation: popIn 0.5s ease;
}

.result-score {
  color: var(--ink);
  font-size: var(--fs-h2);
  font-weight: 800;
  margin-bottom: var(--s2);
}

.result-detail {
  color: var(--ink-soft);
  font-size: var(--fs-body);
  font-weight: 700;
  max-width: 34ch;
  margin: 0 auto var(--s5);
}

.result-exp {
  background: var(--accent-tint);
  border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
  margin-bottom: var(--s5);
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 800;
}

.result-buttons {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}

.result-btn {
  min-height: 56px;
  padding: 12px 20px;
  border: 2px solid transparent;
  border-radius: 16px;
  font-family: var(--font);
  font-size: clamp(17px, 4.5vw, 20px);
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.result-btn:active {
  transform: scale(0.96);
}

.result-btn.primary {
  background: linear-gradient(135deg, var(--c-primary-btn), var(--c-primary-btn2));
  color: var(--on-accent);
  box-shadow: var(--shadow-sm);
}

.result-btn.secondary {
  background: var(--card);
  border-color: var(--card-border);
  color: var(--accent-ink);
}

.option-btn:focus-visible {
  outline: 3px solid var(--c-focus);
  outline-offset: 2px;
}
</style>
</head>
<!-- data-game-hud="native"：本頁已有自己的 EXP／稱號／連擊列與經驗條，不注入浮動 HUD（防重疊）。
     data-game-wired="chinese"：同 <html>，讓引擎於 <body> 就緒後仍維持 legacy XP 抑制。 -->
<body data-game-hud="native" data-game-wired="chinese">
<!-- ===== 共用頂部應用列（全站一致；貼在 <body> 內第一個元素） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">國語大冒險 🀄</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<div id="app">
  <!-- Home Screen -->
  <div class="screen active" id="home-screen">
    <div class="header">
      <button class="header-btn" id="sound-toggle" aria-label="音效開關" aria-pressed="true">🔊</button>
    </div>
    <div class="ch-hello"><span class="ch-mascot" aria-hidden="true">🀄</span>
      <div><div class="ch-htext">用玩的方式，把成語、字音字形、造句、閱讀和語詞一次練起來。</div>
      <div class="ch-hsub">先挑一個主題，一關一關往下闖，把喜歡的字詞收進字詞收藏冊。</div></div></div>
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value" id="stat-exp">0</div>
        <div class="stat-label">經驗值</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-rank">國語小新星</div>
        <div class="stat-label">稱號</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-combo">0</div>
        <div class="stat-label">最高連擊</div>
      </div>
    </div>
    <div class="exp-bar-container">
      <div class="exp-info">
        <span id="rank-current">國語小新星</span>
        <span id="rank-next">→ 語文新手 (100)</span>
      </div>
      <div class="exp-bar">
        <div class="exp-fill" id="exp-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="category-grid" id="category-grid"></div>
    <!-- 字詞收藏冊入口（非題型；獨立卡片，不併入 CATEGORIES，避免影響 5 分類星數統計） -->
    <div class="wordex-entries" id="wordex-entries">
      <div class="wordex-entry-card" role="button" tabindex="0" onclick="Wordex.openScreen()">
        <div class="wordex-entry-emoji">📔</div>
        <div class="wordex-entry-body">
          <div class="wordex-entry-name">字詞收藏冊</div>
          <div class="wordex-entry-sub" id="wordex-entry-collect-sub">已收藏 0 張</div>
        </div>
      </div>
      <div class="wordex-entry-card" role="button" tabindex="0" onclick="Wordex.startReview()">
        <div class="wordex-entry-emoji">🔁</div>
        <div class="wordex-entry-body">
          <div class="wordex-entry-name">今日複習</div>
          <div class="wordex-entry-sub" id="wordex-entry-review-sub">今天複習完了，明天見！</div>
        </div>
      </div>

// ===== AUDIO =====
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(type) {
  if (!state.soundOn) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'correct') {
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.4);
    } else if (type === 'wrong') {
      osc.frequency.setValueAtTime(200, ctx.currentTime);
      osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.3);
    } else if (type === 'star') {
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.setValueAtTime(554, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.2);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.5);
    } else if (type === 'tap') {
      osc.frequency.setValueAtTime(400, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.1);
    }
  } catch(e) {}
}

function loadState() {

  if (saved) {
    const parsed = JSON.parse(saved);
    state = {...state, ...parsed};
  }
}

// ===== RANK FUNCTIONS =====
function getCurrentRank() {
  let rank = RANKS[0];
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (state.exp >= RANKS[i].exp) {
      rank = RANKS[i];
      break;
    }
  }
  return rank;
}

function getNextRank() {
  for (let i = 0; i < RANKS.length; i++) {
    if (state.exp < RANKS[i].exp) return RANKS[i];
  }
  return null;
}

// ==================== UNIFIED GAME ENGINE BRIDGE ====================
// 每答一題就記進統一 profile（chinese 科目）。本頁已在 <html>/<body> 宣告
// data-game-wired="chinese"，故 game_core 的 delta-sync 不會對 legacy
// chinese_game_state.exp 重複補發 XP（避免雙重計分）。
function gameRecord(correct) {
  try {
    if (window.Game && typeof Game.recordAnswer === 'function') {
      Game.recordAnswer('chinese', !!correct);
    }
  } catch (e) { /* 引擎缺席時不影響本頁邏輯 */ }
}

// 用統一 profile 驅動「既有的」原生 HUD（EXP／稱號／經驗條）。stat-combo（最高連擊）
// 為本頁特有指標、無統一對應，故維持由本頁 state.maxCombo 呈現（renderHome 已設）。
function syncHudFromGame() {
  try {
    if (!(window.Game && typeof Game.getProfile === 'function')) return;
    const p = Game.getProfile();
    if (!p) return;
    const d = p.derived || {};
    const setText = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    setText('stat-exp', p.totalXp);
    setText('stat-rank', d.rankName || '國語小新星');
    setText('rank-current', d.rankName || '國語小新星');
    if (d.isMaxLevel) {
      setText('rank-next', `Lv.${p.level}・${p.totalXp}`);
    } else {
      setText('rank-next', `Lv.${p.level}・${d.xpIntoLevel} / ${d.xpForLevel}`);
    }
    const fill = document.getElementById('exp-fill');
    if (fill) fill.style.width = `${Math.round((d.levelProgress || 0) * 100)}%`;
  } catch (e) { /* 靜默 */ }
}

// 註冊事件：XP 變動／升級／連續天數／每日任務更新時即時刷新原生 HUD。
function wireGameEvents() {
  if (!(window.Game && typeof Game.on === 'function')) return;
  ['xp', 'levelup', 'streak', 'daily-complete'].forEach(evt => Game.on(evt, syncHudFromGame));
}

function getCategoryTotalStars(catId) {
  if (!state.categoryStars[catId]) return 0;
  return Object.values(state.categoryStars[catId]).reduce((a, b) => a + b, 0);
}

// ===== LEVEL SELECT =====

    // 閱讀理解各級由短文攤平，題數可能少於 10；動態顯示實際題數以免與內容不符
    const qCount = (catId === 'reading') ? getReadingQuestions(i).length : 10;

// ===== QUESTION GENERATION =====
function getQuestionsForLevel(catId, level) {
  if (catId === 'reading') {
    return getReadingQuestions(level);
  }

  const allQ = QUESTIONS[catId];
  const total = allQ.length;
  const perLevel = Math.floor(total / 4);

  // Divide questions into level ranges
  const start = level * perLevel;
  let end = (level + 1) * perLevel;
  if (level === 3) end = total; // Last level gets remaining

  const pool = allQ.slice(start, end);
  // Fisher–Yates 均勻洗牌（sort(()=>rand-0.5) 非均勻、前段題被抽機率偏高、覆蓋不均）
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  return pool.slice(0, 10);
}

function getReadingQuestions(level) {
  const passages = QUESTIONS.reading;
  const perLevel = Math.floor(passages.length / 4);
  const start = level * perLevel;
  let end = (level + 1) * perLevel;
  if (level === 3) end = passages.length;

  const pool = passages.slice(start, end);
  // Fisher–Yates 均勻洗牌（同 getQuestionsForLevel；避免偏斜抽題、覆蓋不均）
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }

  // Flatten passage questions, take up to 10
  let questions = [];
  for (const p of pool) {
    for (const q of p.questions) {
      questions.push({
        ...q,
        options: q.options.slice(),   // 深拷貝：洗牌會就地打亂陣列，若與原始題庫共享參照，重玩時 answer 會 stale、把錯選項標成正解
        passage: p.passage,
        question: q.q,
        explanation: "答案就藏在上面的短文裡，再讀一次找找看吧！"
      });
      if (questions.length >= 10) break;
    }
    if (questions.length >= 10) break;
  }
  return questions.slice(0, 10);
}

// ===== GAME ENGINE =====
function startGame(catId, level) {
  currentGame = {
    categoryId: catId,
    level: level,
    questions: getQuestionsForLevel(catId, level),
    questionIndex: 0,
    score: 0,
    combo: 0,
    bestCombo: 0,
    answers: []
  };

  showScreen('question-screen');
  renderQuestion();
}

function renderQuestion() {
  const q = currentGame.questions[currentGame.questionIndex];

  // 關卡標題（比照 concept/subject 題目頁「← 關卡名」）
  var _cat = CATEGORIES.find(c => c.id === currentGame.categoryId);
  var _lt = document.getElementById('q-level-title');
  if (_lt) _lt.textContent = _cat ? (_cat.emoji + ' ' + _cat.name + '·' + (LEVEL_NAMES[currentGame.level] || '')) : '';

  // Progress dots
  const dotsEl = document.getElementById('progress-dots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < currentGame.questions.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if (i < currentGame.questionIndex) {
      dot.className += currentGame.answers[i] ? ' correct' : ' wrong';
    } else if (i === currentGame.questionIndex) {
      dot.className += ' current';
    }
    dotsEl.appendChild(dot);
  }

  // Combo
  const comboEl = document.getElementById('combo-display');
  comboEl.textContent = currentGame.combo > 1 ? `🔥 ${currentGame.combo} 連擊！` : '';

  // Passage (for reading)
  const passageContainer = document.getElementById('passage-container');
  if (q.passage) {
    passageContainer.innerHTML = `<div class="passage-text">${q.passage}</div>`;
  } else {
    passageContainer.innerHTML = '';
  }

  // Question text
  let questionText = q.question;
  // 語詞接龍：四個選項都能接龍，加上詞義提示讓答案唯一且可解釋
  if (q.type === 'chain' && q.explanation && q.explanation.indexOf('：') !== -1) {
    const def = q.explanation.split('：')[1];
    if (def) questionText = q.question + '　選出意思是「' + def + '」的接龍詞';
  }
  document.getElementById('question-text').textContent = questionText;

  // Options
  const optGrid = document.getElementById('options-grid');
  optGrid.innerHTML = '';
  // 洗牌選項：避免正解幾乎永遠在第一個（原始資料 95% answer=0），孩子才會真的閱讀。
  // 以「正解的值」為錨、洗牌後用 indexOf 重新定位正解索引；selectAnswer 讀 q.answer 不需改。
  if (Array.isArray(q.options) && q.options.length > 1 && typeof q.answer === 'number') {
    const correctVal = q.options[q.answer];
    for (let i = q.options.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = q.options[i]; q.options[i] = q.options[j]; q.options[j] = t;
    }
    q.answer = q.options.indexOf(correctVal);
  }
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(idx);
    optGrid.appendChild(btn);
  });

  // Hide explanation and next button
  document.getElementById('explanation-box').classList.remove('show');
  document.getElementById('next-btn').classList.remove('show');
}

function selectAnswer(idx) {
  const q = currentGame.questions[currentGame.questionIndex];
  const correct = idx === q.answer;
  const buttons = document.querySelectorAll('.option-btn');

  // Disable all buttons
  buttons.forEach(btn => btn.classList.add('disabled'));

  // Show correct/wrong
  if (correct) {
    buttons[idx].classList.add('correct');
    currentGame.score++;
    currentGame.combo++;
    if (currentGame.combo > currentGame.bestCombo) {
      currentGame.bestCombo = currentGame.combo;
    }
    if (currentGame.combo > state.maxCombo) {
      state.maxCombo = currentGame.combo;
    }
    playSound('correct');
  } else {
    buttons[idx].classList.add('wrong');
    buttons[q.answer].classList.add('show-correct');
    currentGame.combo = 0;
    playSound('wrong');
  }

  currentGame.answers.push(correct);

  // 統一引擎記帳：每題（對／錯）各記一次到 chinese 科目。
  gameRecord(correct);
  try { if (window.Wordex) Wordex.onAnswer(currentGame.questions[currentGame.questionIndex], correct); } catch(e){}

  // Update combo display
  const comboEl = document.getElementById('combo-display');
  comboEl.textContent = currentGame.combo > 1 ? `🔥 ${currentGame.combo} 連擊！` : '';

  // Show explanation
  if (q.explanation) {
    document.getElementById('explanation-text').textContent = (correct ? '✅ 答對了！' : '💡 再看看喔～') + ' ' + q.explanation;
    document.getElementById('explanation-box').classList.add('show');
  } else {
    document.getElementById('explanation-text').textContent = correct ? '✅ 答對了！' : '💡 沒關係，正確答案是「' + q.options[q.answer] + '」，記起來就學會囉！';
    document.getElementById('explanation-box').classList.add('show');
  }

  // Show next button
  document.getElementById('next-btn').classList.add('show');
}

function nextQuestion() {
  currentGame.questionIndex++;
  if (currentGame.questionIndex >= currentGame.questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

// ===== RESULT SCREEN =====
function showResult() {
  if (currentGame && currentGame.mode === 'wordexReview') { return Wordex.endReview(); }
  const score = currentGame.score;
  const total = currentGame.questions.length;
  let stars = 0;
  if (score >= total * 0.9) stars = 3;
  else if (score >= total * 0.7) stars = 2;
  else if (score >= total * 0.5) stars = 1;

  // Calculate EXP
  const baseExp = score * 5;
  const comboBonus = Math.min(currentGame.bestCombo || currentGame.combo, 10) * 2;
  const starBonus = stars * 10;
  const totalExp = baseExp + comboBonus + starBonus;

  // Update state
  state.exp += totalExp;
  if (!state.categoryStars[currentGame.categoryId]) {
    state.categoryStars[currentGame.categoryId] = {};
  }
  const prevStars = state.categoryStars[currentGame.categoryId][currentGame.level] || 0;
  if (stars > prevStars) {
    state.categoryStars[currentGame.categoryId][currentGame.level] = stars;
  }
  saveState();

  // Render result
  document.getElementById('result-stars').textContent = stars > 0 ? '⭐'.repeat(stars) : '🌱';
  document.getElementById('result-score').textContent = `${score} / ${total}`;
  document.getElementById('result-detail').textContent = stars >= 3 ? '太厲害了！幾乎全對！' : stars >= 2 ? '很棒！繼續加油！' : stars >= 1 ? '通過囉！再練習會更好！' : '差一點點，再挑戰一次一定更好！💪';
  document.getElementById('result-exp').textContent = `+${totalExp} 經驗值 (答對${baseExp} + 連擊${comboBonus} + 星星${starBonus})`;

  // Button visibility
  const nextBtn = document.getElementById('result-next');
  if (stars >= 1 && currentGame.level < 3) {
    nextBtn.style.display = 'block';
    nextBtn.textContent = '下一關 →';
  } else if (stars >= 1) {
    nextBtn.style.display = 'block';
    nextBtn.textContent = '回到關卡選擇';
  } else {
    // 未過關時不顯示「下一關」，但下方的「再試一次」「回主畫面」仍在，孩子不會被卡住
    nextBtn.style.display = 'none';
  }

  showScreen('result-screen');
  playSound('star');
}

// ===== EVENT LISTENERS =====
document.getElementById('sound-toggle').onclick = function() {
  state.soundOn = !state.soundOn;
  this.textContent = state.soundOn ? '🔊' : '🔇';
  this.setAttribute('aria-pressed', state.soundOn ? 'true' : 'false');
  saveState();
};

document.getElementById('back-to-home').onclick = function() {
  playSound('tap');
  renderHome();
};

document.getElementById('next-btn').onclick = function() {
  playSound('tap');
  nextQuestion();
};

document.getElementById('quit-game').onclick = function() {
  if (currentGame && currentGame.mode === 'wordexReview') { return Wordex.openScreen(); }
  playSound('tap');
  if (currentGame && currentGame.categoryId) {
    openCategory(currentGame.categoryId);
  } else {
    renderHome();
  }
};

document.getElementById('result-next').onclick = function() {
  playSound('tap');
  if (currentGame.level < 3) {
    startGame(currentGame.categoryId, currentGame.level + 1);
  } else {
    openCategory(currentGame.categoryId);
  }
};

document.getElementById('result-retry').onclick = function() {
  playSound('tap');
  startGame(currentGame.categoryId, currentGame.level);
};

document.getElementById('result-home').onclick = function() {
  playSound('tap');
  renderHome();
};

// ===== INIT =====
loadState();
(function(){ var sb = document.getElementById('sound-toggle'); if (sb) { sb.textContent = state.soundOn ? '🔊' : '🔇'; sb.setAttribute('aria-pressed', state.soundOn ? 'true' : 'false'); } })();
wireGameEvents();   // 註冊統一引擎事件 → 即時刷新原生 HUD
renderHome();       // renderHome 內含 syncHudFromGame()，以統一 profile 值呈現
</script>

<script>
(function () {
  'use strict';
  var KEY = 'chinese_wordex_v1';
  var INTERVAL = { 1:1, 2:2, 3:4, 4:7, 5:15 };
  var REVIEW_TARGET = 15, REVIEW_CAP = 20;
  var MILE_XP = { first_card:10, collect_10:20, collect_25:40, collect_50:60, collect_100:100, collect_all:200, first_master:15, master_25:60, master_all:300 };
  var CAT_XP = 40;

  // 合格題型 → 分類（每個 type 只屬於一個分類，可由 type 反推 cat）
  var TYPE_TO_CAT = { fill:'idiom', meaning:'idiom', usage:'idiom', idiomchain:'idiom', bopomofo:'phonetics', wrong:'phonetics', conjunction:'sentence', chain:'wordchain' };
  var CAT_LIST = ['idiom', 'phonetics', 'sentence', 'wordchain'];
  var CAT_EMOJI = { idiom:'📚', phonetics:'✍️', sentence:'📝', wordchain:'🔗' };
  var CAT_NAME = { idiom:'成語', phonetics:'字音字形', sentence:'句型', wordchain:'語詞接龍' };

  function kindOf(type) {
    if (type === 'idiomchain') return '成語接龍';
    if (type === 'fill' || type === 'meaning' || type === 'usage') return '成語';
    if (type === 'bopomofo') return '破音字';
    if (type === 'wrong') return '詞語';
    if (type === 'conjunction') return '句型';
    if (type === 'chain') return '詞語接龍';
    return '';
  }

  // 由題目物件計算詞面（face）與注音（read）。不合格題型回傳空 face → 不建卡。
  function computeFace(type, q) {
    var opt = (q && q.options && q.answer != null) ? q.options[q.answer] : '';
    var m;
    if (type === 'fill')       return { face: String(q.question || '').replace(/[_＿]+/g, opt), read: '' };
    if (type === 'meaning')    { m = String(q.question || '').match(/「(.+?)」/);    return { face: m ? m[1] : '', read: '' }; }
    if (type === 'usage')      return { face: opt, read: '' };
    if (type === 'idiomchain') return { face: opt, read: '' };
    if (type === 'bopomofo')   { m = String(q.question || '').match(/「(.+?)」/);    return { face: m ? m[1] : '', read: opt }; }
    // 找錯字：正解選項是「有錯字的詞」，故不可直接收；正確寫法在解說首組「」內（例「誠懇」）。
    if (type === 'wrong')      { m = String(q.explanation || '').match(/「(.+?)」/); return { face: m ? m[1] : '', read: '' }; }
    if (type === 'conjunction') return { face: opt, read: '' };
    if (type === 'chain')       return { face: opt, read: '' };
    return { face: '', read: '' };
  }

  // 由題目物件推出穩定 id（永不隨機、永不隨順序改變）。不合格 → null。
  function infoForQ(q) {
    if (!q || !q.type) return null;
    var cat = TYPE_TO_CAT[q.type];
    if (!cat) return null;
    var f = computeFace(q.type, q);
    if (!f.face) return null;
    var read = f.read || '';
    var id = cat + '|' + q.type + '|' + f.face + (read ? '|' + read : '');
    return { id: id, cat: cat, type: q.type, face: f.face, read: read };
  }

  // 掃描 QUESTIONS 建記憶體索引（重複 id 保留首見 q）
  var ITEM_INDEX = {};        // id -> {id,cat,type,face,read,q}
  var CAT_IDS = { idiom:[], phonetics:[], sentence:[], wordchain:[] };
  var TOTAL_ALL = 0;

  function buildIndex() {
    try {
      if (typeof QUESTIONS === 'undefined') return;
      for (var ci = 0; ci < CAT_LIST.length; ci++) {
        var cat = CAT_LIST[ci];
        var arr = QUESTIONS[cat];
        if (!arr || !arr.length) continue;
        for (var i = 0; i < arr.length; i++) {
          var q = arr[i];
          if (!TYPE_TO_CAT[q.type]) continue;       // 排除的題型：dededi/zaizai/zuozuo/word 等
          var info = infoForQ(q);
          if (!info) continue;
          if (ITEM_INDEX[info.id]) continue;        // 去重：保留首見
          info.q = q;                                // 指向原始題目物件，複習時原封重用
          ITEM_INDEX[info.id] = info;
          CAT_IDS[info.cat].push(info.id);
        }
      }
    } catch (e) {}
    TOTAL_ALL = Object.keys(ITEM_INDEX).length;
  }

  function today() {
    try { if (window.Game && Game.localDate) return Game.localDate(); } catch (e) {}
    return new Date().toISOString().slice(0, 10);
  }
  function addDays(dateStr, n) {
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    try { if (window.Game && Game.localDate) return Game.localDate(d); } catch (e) {}
    return d.toISOString().slice(0, 10);
  }
  function reduceMotion() {
    try { return !!(window.Game && Game.getProfile && Game.getProfile().settings && Game.getProfile().settings.reduceMotion); } catch (e) { return false; }
  }

  var data = null;
  var currentFilter = 'all';

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) {}
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.cards) { data = parsed; if (!data.awarded) data.awarded = {}; return; }
      } catch (e) {}
    }
    data = { version: 1, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), migratedFrom: null, cards: {}, awarded: {} };
    save();
  }
  function save() {
    if (!data) return;
    data.updatedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }

  // ---- 統計 ----
  function cardCount() { return Object.keys(data.cards).length; }
  function masteredCount() { var n = 0; for (var id in data.cards) if (data.cards[id].box >= 5) n++; return n; }
  function catAllCollected(cat) {
    var ids = CAT_IDS[cat] || [];
    if (!ids.length) return false;
    for (var i = 0; i < ids.length; i++) { if (!data.cards[ids[i]]) return false; }
    return true;
  }

  // ---- 里程碑 ----
  function satisfiedMilestones() {
    var out = [];
    var n = cardCount(), m = masteredCount();
    if (n >= 1) out.push('first_card');
    if (n >= 10) out.push('collect_10');
    if (n >= 25) out.push('collect_25');
    if (n >= 50) out.push('collect_50');
    if (n >= 100) out.push('collect_100');
    if (TOTAL_ALL > 0 && n >= TOTAL_ALL) out.push('collect_all');
    for (var i = 0; i < CAT_LIST.length; i++) { if (catAllCollected(CAT_LIST[i])) out.push('cat_all_' + CAT_LIST[i]); }
    if (m >= 1) out.push('first_master');
    if (m >= 25) out.push('master_25');
    if (TOTAL_ALL > 0 && m >= TOTAL_ALL) out.push('master_all');
    return out;
  }
  function mileXp(id) { if (id.indexOf('cat_all_') === 0) return CAT_XP; return MILE_XP[id] || 0; }
  function mileMsg(id) {
    if (id === 'first_card') return '📔 收藏了第一張字詞卡！';
    if (id === 'collect_10') return '✨ 已收藏 10 張！';
    if (id === 'collect_25') return '✨ 已收藏 25 張！';
    if (id === 'collect_50') return '✨ 已收藏 50 張！';
    if (id === 'collect_100') return '📚 已收藏 100 張！';
    if (id === 'collect_all') return '🏆 字詞收藏冊全部收齊！';
    if (id === 'first_master') return '🌟 第一張字詞精通！';
    if (id === 'master_25') return '🌟 25 張字詞精通！';
    if (id === 'master_all') return '👑 所有字詞都精通了！';
    if (id.indexOf('cat_all_') === 0) return '⭐ ' + (CAT_NAME[id.slice(8)] || '') + ' 全部收齊！';
    return '🎉 達成新成就！';
  }
  function checkMilestones() {
    var s = satisfiedMilestones();
    for (var i = 0; i < s.length; i++) {
      var id = s[i];
      if (data.awarded[id]) continue;
      // 先設 guard → save → 再單次發 XP（silent），即使當下關頁也不重領
      data.awarded[id] = true;
      save();
      try { if (window.Game && Game.award) Game.award('chinese', mileXp(id), { silent: true, source: 'wordex-milestone', milestone: id }); } catch (e) {}
      try { if (window.Game && Game.showToast) Game.showToast(mileMsg(id), 'success'); } catch (e) {}
    }
  }

  // ---- 核心：一次作答（由 selectAnswer 的收錄 hook 呼叫） ----
  function onAnswer(q, correct) {
    if (!data) load();
    var info = infoForQ(q);
    if (!info) return;                     // 不合格題型：no-op
    var id = info.id;
    var t = today();
    var card = data.cards[id];
    if (!card) {
      if (!correct) return;                // 答對過才收藏；答錯且未收藏 → 不建卡、不記錄
      data.cards[id] = {
        id: info.id, cat: info.cat, type: info.type, face: info.face, read: info.read,
        box: 1, addedDate: t, lastReviewedDate: t, dueDate: addDays(t, INTERVAL[1]),
        timesCorrect: 1, timesSeen: 1
      };
    } else {
      card.timesSeen++;
      if (correct) {
        card.box = Math.min(card.box + 1, 5);   // 只升不降，封頂 5
        card.timesCorrect++;
        card.lastReviewedDate = t;
        card.dueDate = addDays(t, INTERVAL[card.box]);
      } else {
        card.dueDate = t;                        // 答錯：不退階、不熄滅，只安排今天再見
      }
    }
    save();
    if (correct) checkMilestones();
    if (isScreenOpen()) { renderSummary(); renderGrid(); }
    renderHomeEntries();
  }

  // ---- 今日複習佇列 ----
  function dueCards(t) {
    var out = [];
    for (var id in data.cards) { var c = data.cards[id]; if (c.dueDate && c.dueDate <= t) out.push(c); }
    out.sort(function (x, y) {
      if (x.dueDate !== y.dueDate) return x.dueDate < y.dueDate ? -1 : 1;
      if (x.box !== y.box) return x.box - y.box;
      return x.id < y.id ? -1 : 1;
    });
    return out;
  }
  function dueCount() { if (!data) load(); return dueCards(today()).length; }
  function buildQueue() {
    var due = dueCards(today());
    return due.slice(0, REVIEW_CAP).map(function (c) { return c.id; });
  }

  // ---- 畫面 ----
  function isScreenOpen() {
    var el = document.getElementById('wordex-screen');
    return el && el.classList.contains('active');
  }
  function renderHomeEntries() {
    if (!data) load();
    var cs = document.getElementById('wordex-entry-collect-sub');
    if (cs) cs.textContent = '已收藏 ' + cardCount() + ' 張';
    var rs = document.getElementById('wordex-entry-review-sub');
    if (rs) {
      var k = dueCount();
      // 區分「從未收藏」與「今天複習完了」：前者鼓勵開始收藏，別讓新玩家看到「複習完了」而困惑。
      rs.textContent = (cardCount() === 0)
        ? '先去玩幾題、收藏喜歡的字詞，這裡就會出現要複習的卡片喔！'
        : (k > 0 ? ('今天有 ' + k + ' 張想見你') : '今天複習完了，明天見！');
    }
  }
  function renderSummary() {
    var el = document.getElementById('wordex-summary');
    if (!el) return;
    var n = cardCount(), m = masteredCount(), k = dueCount();
    el.innerHTML = '已收藏 <b>' + n + '</b> 張　·　精通 <b>' + m + '</b> 張　·　' +
      (k > 0 ? '今天有 <b>' + k + '</b> 張想複習 🔵' : '今天都複習完了，明天見！');
  }
  function renderFilter() {
    var el = document.getElementById('wordex-filter');
    if (!el) return;
    var html = '<button class="wordex-chip' + (currentFilter === 'all' ? ' active' : '') + '" onclick="Wordex.setFilter(\'all\')">全部</button>';
    for (var i = 0; i < CAT_LIST.length; i++) {
      var cat = CAT_LIST[i];
      html += '<button class="wordex-chip' + (currentFilter === cat ? ' active' : '') + '" onclick="Wordex.setFilter(\'' + cat + '\')">' +
        CAT_EMOJI[cat] + ' ' + CAT_NAME[cat] + '</button>';
    }
    el.innerHTML = html;
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function boxGlyph(box) {
    if (box >= 5) return '🌟';
    return '●'.repeat(box) + '○'.repeat(Math.max(0, 4 - box));
  }
  function renderGrid() {
    if (!data) load();
    var grid = document.getElementById('wordex-grid');
    if (!grid) return;
    var t = today();
    var ids = Object.keys(data.cards).sort();
    if (currentFilter !== 'all') ids = ids.filter(function (id) { return data.cards[id].cat === currentFilter; });
    if (!ids.length) {
      grid.innerHTML = '<div class="wordex-empty">還沒有收藏喔～答對題目就會把那個字詞收進來！</div>';
    } else {
      var html = '';
      for (var i = 0; i < ids.length; i++) {
        var c = data.cards[ids[i]];
        var due = (c.dueDate && c.dueDate <= t);
        html += '<div class="wordex-card' + (c.box >= 5 ? ' mastered' : '') + '" role="button" tabindex="0" onclick="Wordex.openFocus(\'' + encodeURIComponent(c.id) + '\')">' +
          (due ? '<div class="wordex-card-due">🔵</div>' : '') +
          '<div class="wordex-card-cat">' + (CAT_EMOJI[c.cat] || '') + '</div>' +
          '<div class="wordex-card-face">' + escapeHtml(c.face) + '</div>' +
          (c.read ? '<div class="wordex-card-read">' + escapeHtml(c.read) + '</div>' : '') +
          '<div class="wordex-card-box">' + boxGlyph(c.box) + '</div>' +
        '</div>';
      }
      grid.innerHTML = html;
    }
    grid.classList.toggle('wordex-reduce', reduceMotion());
  }

  function openScreen() {
    if (!data) load();
    closeFocus();
    hideResult();
    if (typeof showScreen === 'function') showScreen('wordex-screen');
    renderSummary(); renderFilter(); renderGrid();
  }
  function setFilter(cat) { currentFilter = cat; renderFilter(); renderGrid(); }

  function openFocus(encId) {
    if (!data) load();
    var id = decodeURIComponent(encId);
    var c = data.cards[id];
    if (!c) return;
    var t = today();
    var status = (c.box >= 5) ? '已經精通囉！🌟' : ('目前在第 ' + c.box + ' 盒');
    var when;
    if (c.dueDate && c.dueDate <= t) when = '今天適合複習 🔵';
    else when = '下次複習日：' + c.dueDate;
    var body = document.getElementById('wordex-focus-body');
    if (body) {
      body.innerHTML =
        '<div class="wordex-focus-kind">' + (CAT_EMOJI[c.cat] || '') + ' ' + kindOf(c.type) + '</div>' +
        '<div class="wordex-focus-face">' + escapeHtml(c.face) + '</div>' +
        (c.read ? '<div class="wordex-focus-read">' + escapeHtml(c.read) + '</div>' : '') +
        '<div class="wordex-focus-meta">' + status + '<br>' + when + '<br>答對 ' + c.timesCorrect + ' 次</div>' +
        '<button class="wordex-btn" onclick="Wordex.startFocus(\'' + encodeURIComponent(c.id) + '\')">✏️ 練這張</button>';
    }
    var ov = document.getElementById('wordex-focus-overlay');
    if (ov) ov.hidden = false;
  }
  function closeFocus() { var o = document.getElementById('wordex-focus-overlay'); if (o) o.hidden = true; }
  function hideResult() { var o = document.getElementById('wordex-result-overlay'); if (o) o.hidden = true; }

  // ---- 複習 / 單張練習（重用既有 question-screen 引擎，不改引擎） ----
  function startReview() {
    if (!data) load();
    closeFocus();
    var queue = buildQueue();
    if (!queue.length) { showEmptyReview(); return; }
    currentGame = {
      categoryId: '__wordex__', level: 0, mode: 'wordexReview',
      // 深拷貝 options：renderQuestion 會就地洗牌 options 並只把新 answer 寫回本拷貝；
      // 若與題庫共享 options 陣列參照，會打亂原題卻讓原題 answer stale，日後一般關卡重玩把錯選項標成正解。
      questions: queue.map(function (id) { var s = ITEM_INDEX[id].q; return Object.assign({}, s, Array.isArray(s.options) ? { options: s.options.slice() } : {}); }),
      questionIndex: 0, score: 0, combo: 0, bestCombo: 0, answers: []
    };
    if (typeof showScreen === 'function') showScreen('question-screen');
    if (typeof renderQuestion === 'function') renderQuestion();
  }
  function startFocus(encId) {
    if (!data) load();
    closeFocus();
    var id = decodeURIComponent(encId);
    if (!ITEM_INDEX[id]) return;
    currentGame = {
      categoryId: '__wordex__', level: 0, mode: 'wordexReview',
      questions: [Object.assign({}, ITEM_INDEX[id].q, Array.isArray(ITEM_INDEX[id].q.options) ? { options: ITEM_INDEX[id].q.options.slice() } : {})],
      questionIndex: 0, score: 0, combo: 0, bestCombo: 0, answers: []
    };
    if (typeof showScreen === 'function') showScreen('question-screen');
    if (typeof renderQuestion === 'function') renderQuestion();
  }

  function showEmptyReview() {
    var el = document.getElementById('wordex-result-body');
    if (el) {
      el.innerHTML =
        '<div class="wordex-result-emoji">🌙</div>' +
        '<div class="wordex-result-title">今天複習完了</div>' +
        '<div class="wordex-result-sub">字詞們都好好休息中，明天再來收更多吧！</div>' +
        '<div class="wordex-result-actions">' +
          '<button class="wordex-btn" onclick="Wordex.backToScreen()">看看收藏冊</button>' +
          '<button class="wordex-btn secondary" onclick="Wordex.backToHome()">返回</button></div>';
    }
    var ov = document.getElementById('wordex-result-overlay');
    if (ov) ov.hidden = false;
  }

  // 由 showResult() 首行的分派守衛呼叫
  function endReview() {
    var total = (currentGame && currentGame.questions) ? currentGame.questions.length : 0;
    var score = (currentGame && typeof currentGame.score === 'number') ? currentGame.score : 0;
    var el = document.getElementById('wordex-result-body');
    if (el) {
      var html;
      if (total === 1) {
        var ok = score > 0;
        html = '<div class="wordex-result-emoji">' + (ok ? '⭐' : '💪') + '</div>' +
          '<div class="wordex-result-title">' + (ok ? '答對了！這張又更亮了！' : '再記一次') + '</div>' +
          '<div class="wordex-result-sub">' + (ok ? '繼續保持，很快就精通囉 ✨' : '等一下再遇到就會更熟。') + '</div>';
      } else {
        html = '<div class="wordex-result-emoji">🎉</div>' +
          '<div class="wordex-result-title">今日複習完成！' + score + '/' + total + '</div>' +
          '<div class="wordex-result-sub">這些字詞又更熟了 ✨</div>';
      }
      html += '<div class="wordex-result-actions">' +
        '<button class="wordex-btn" onclick="Wordex.backToScreen()">回收藏冊</button>' +
        '<button class="wordex-btn secondary" onclick="Wordex.backToHome()">← 回主畫面</button></div>';
      el.innerHTML = html;
    }
    var ov = document.getElementById('wordex-result-overlay');
    if (ov) ov.hidden = false;
    renderHomeEntries();
  }
  function backToScreen() { hideResult(); openScreen(); }
  function backToHome() { hideResult(); if (typeof renderHome === 'function') renderHome(); }

  window.Wordex = {
    onAnswer: onAnswer,
    openScreen: openScreen,
    openFocus: openFocus,
    closeFocus: closeFocus,
    setFilter: setFilter,
    startReview: startReview,
    startFocus: startFocus,
    endReview: endReview,
    backToScreen: backToScreen,
    backToHome: backToHome,
    renderHomeEntries: renderHomeEntries
  };

  // 初始化（QUESTIONS 已於主程式解析；DOM 已就緒）
  buildIndex();
  load();
  renderHomeEntries();
})();
</script>
<script>/* kbd-activate-delegation: role=button 的 div 可用 Enter/空白鍵觸發 */
document.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var t=e.target;if(t&&t.getAttribute&&t.getAttribute("role")==="button"&&t.tagName!=="BUTTON"&&t.tagName!=="A"&&t.tagName!=="INPUT"&&t.tagName!=="TEXTAREA"&&!t.hasAttribute("onkeydown")){e.preventDefault();t.click();}});</script>
</body>
</html>
