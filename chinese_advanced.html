<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進階國文挑戰 📖</title>
<!-- 統一遊戲化引擎：先載共用設計 token（assets/app.css），再載 HUD/toast 樣式
     （game_core.css），最後同步載入引擎（game_core.js）。
     ─────────────────────────────────────────────────────────────────
     計分（本頁為「國文進階」，計入 chinese 科目，讓學生升上進階內容時獎勵不中斷）：
       宣告 body[data-game-wired="chinese"]，每題作答只呼叫一次 Game.recordAnswer('chinese', 對錯)
       （作答後 answered 旗標鎖定，重試不再記帳）。本頁「不」呼叫 Game.award / recordSession，
       進階徽章冊為純本地（自有 key、無 XP），故無 double-count。
       本頁只「唯讀 / 純提示」使用引擎：Game.showToast（純提示，不記帳）與
       Game.getProfile（唯讀，僅顯示暱稱／可省略）。主題切換完全交給共用
       app-bar 的 [data-theme-toggle]，由 game_core 自動接線，本頁不寫主題 JS。
     獨立 localStorage key：chinese_adv_progress_v1（與 player_profile_v1 完全區隔）。
     ───────────────────────────────────────────────────────────────── -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* =====================================================================
 * chinese_advanced.html — 本頁樣式（全部建立在 assets/app.css 的設計 token 上，
 * 因此自動亮/暗色主題化、與學習基地視覺一致）。強調色系採國語科琥珀色（chinese）。
 * =================================================================== */

/* 本頁強調色沿用國語科琥珀色 --c-chinese；供 FAB / 徽章冊等共用 --accent* 別名。 */
:root {
  --su: var(--c-chinese);
  --su-tint: var(--tint-chinese);
  --su-ink: var(--c-chinese-ink);
  --accent: var(--c-chinese);
  --accent-ink: var(--c-chinese-ink);
  --accent-tint: var(--tint-chinese);
}

body { overflow-x: hidden; }

/* 頁面頂列（返回、標題） */
.ma-topbar {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s4);
}
.ma-topbar .ma-title {
  flex: 1;
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  min-width: 0;
}

/* 螢幕切換（尊重 prefers-reduced-motion） */
.ma-screen { display: none; animation: ma-fade 0.3s ease; }
.ma-screen.active { display: block; }
@keyframes ma-fade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .ma-screen { animation: none; }
}

/* 歡迎卡 */
.ma-hello {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s4);
  background: var(--su-tint);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  margin-bottom: var(--s4);
}
.ma-hello .ma-mascot { font-size: 46px; flex: none; line-height: 1; }
.ma-hello .ma-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.ma-hello .ma-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }

/* 進度總覽小列 */
.ma-overview {
  display: flex; align-items: center; gap: var(--s3);
  margin-bottom: var(--s4); flex-wrap: wrap;
}
.ma-overview .stat-tile { flex: 1; min-width: 96px; }

/* 等級選單 grid */
.ma-levels {
  display: grid;
  gap: var(--s4);
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.ma-level {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  padding: var(--s4);
  text-align: left;
  cursor: pointer;
  border: 2px solid var(--card-border);
  background: var(--card);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  font-family: var(--font);
  color: var(--ink);
}
.ma-level:hover { box-shadow: var(--shadow-lg); border-color: var(--su); }
.ma-level:active { transform: scale(0.98); }
.ma-level-top { display: flex; align-items: center; gap: var(--s3); }
.ma-level-emoji {
  font-size: 34px;
  width: 56px; height: 56px;
  flex: none;
  display: flex; align-items: center; justify-content: center;
  border-radius: 16px;
}
.ma-level-num { font-size: var(--fs-small); font-weight: 700; color: var(--su-ink); }
.ma-level-name { font-size: var(--fs-body); font-weight: 800; color: var(--ink); line-height: 1.25; }
.ma-level-concepts { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; line-height: 1.4; }
.ma-level-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: 2px; }
.ma-level-status {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--fs-small); font-weight: 700;
}
.ma-level-status.done { color: var(--c-correct-ink); }
.ma-level-status.todo { color: var(--ink-soft); }
.ma-level-stars { font-size: 16px; letter-spacing: 1px; }

/* 進行中：大卡 */
.ma-stage {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--s5) var(--s4);
  text-align: center;
}
.ma-visual {
  font-size: clamp(56px, 18vw, 92px);
  line-height: 1.1;
  margin: var(--s2) 0 var(--s3);
  user-select: none;
}
.ma-question {
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.6;
  margin: 0 auto var(--s4);
  max-width: 42ch;
  text-align: left;
}

/* 本級起始重點卡（advance organizer / worked example 先於練習） */
.ma-brief { text-align: left; }
.ma-brief h2 {
  font-size: var(--fs-h2); font-weight: 800; color: var(--ink);
  margin: 0 0 var(--s3); text-align: center;
}
.ma-brief-sub { text-align: center; color: var(--ink-soft); font-weight: 700; font-size: var(--fs-small); margin: 0 0 var(--s3); }
.ma-keyfacts { list-style: none; padding: 0; margin: 0 auto; max-width: 44ch; display: grid; gap: var(--s2); }
.ma-keyfacts li {
  display: flex; align-items: flex-start; gap: var(--s2);
  padding: 10px 14px;
  background: var(--su-tint);
  border-radius: var(--r-md);
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.6;
}
.ma-keyfacts li .ma-kf-dot { flex: none; color: var(--su-ink); font-weight: 900; }

/* 進度：本級第幾題 */
.ma-steps {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  margin-bottom: var(--s3); flex-wrap: wrap;
}
.ma-steps i { width: 20px; height: 6px; border-radius: 999px; background: var(--card-border); }
.ma-steps i.on { background: var(--su); }
.ma-steps i.cur { background: var(--su); box-shadow: 0 0 0 3px var(--su-tint); }

/* 選項按鈕（tap 作答；命中區 ≥56px） */
.ma-options { display: grid; gap: var(--s3); margin-top: var(--s2); }
.ma-opt {
  display: flex; align-items: center; gap: var(--s2);
  min-height: 56px;
  width: 100%;
  padding: 14px 18px;
  border: 2px solid var(--card-border);
  border-radius: 16px;
  background: var(--card);
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(16px, 3.4vw, 19px);
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
}
.ma-opt:active { transform: scale(0.98); }
.ma-opt:disabled { cursor: default; }
/* 作答後高亮：文字用 var(--ink)（亮暗雙主題皆過 AA），對錯以邊框顏色 + ✅/❌ 雙碼標示（不單靠顏色） */
.ma-opt.correct { border-color: var(--c-correct); background: var(--tint-english); color: var(--ink); }
.ma-opt.wrong { border-color: var(--c-wrong); background: rgba(255,118,117,0.12); color: var(--ink); }
.ma-opt.correct .ma-opt-mark { color: var(--c-correct-ink); }
.ma-opt.wrong .ma-opt-mark { color: var(--c-streak-ink); }
.ma-opt .ma-opt-mark { margin-left: auto; font-size: 22px; }

/* 揭示區（答案解說） */
.ma-reveal {
  margin-top: var(--s4);
  padding: var(--s3) var(--s4);
  background: var(--su-tint);
  border-radius: var(--r-md);
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.6;
  text-align: left;
  display: none;
}
.ma-reveal.show { display: block; animation: ma-fade 0.3s ease; }
@media (prefers-reduced-motion: reduce) { .ma-reveal.show { animation: none; } }

/* 完成畫面 */
.ma-done { text-align: center; padding: var(--s5) var(--s4); }
.ma-done-emoji { font-size: clamp(64px, 22vw, 100px); }
.ma-done-stars { font-size: 34px; letter-spacing: 4px; margin: var(--s2) 0; }
.ma-done-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); }

/* 底部行動列 */
.ma-actions { display: flex; gap: var(--s3); margin-top: var(--s4); flex-wrap: wrap; }
.ma-actions .btn { flex: 1; min-width: 140px; }

.ma-footnote { text-align: center; color: var(--ink-soft); font-size: var(--fs-small); margin-top: var(--s5); font-weight: 600; max-width: 34em; margin-inline: auto; }

/* 桌機（≥1280）近滿版：沿用 app.css 的 --content-max（min(95vw,1800)），不再自行封頂；答題欄由 .ma-question/.ma-keyfacts 自身 ch 上限維持窄欄護眼。 */
</style>
</head>
<body data-game-wired="chinese" data-game-maturity="advanced">
<!-- ===== 共用頂部應用列（全站一致；貼在 <body> 內第一個元素） ===== -->
<!-- data-game-hud="off"：本頁透過 data-game-wired="chinese" + recordAnswer 直接記帳（會計入主角色 XP/等級），關閉浮動 HUD 僅為減少干擾；「純本地、不計 XP」的是下方進階徽章冊，不是整頁。 -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">進階國文挑戰 📖</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

  <!-- ============================= 等級選單 ============================= -->
  <section id="screen-menu" class="ma-screen active">
    <div class="ma-topbar">
      <span class="ma-title">進階國文挑戰 📖</span>
    </div>

    <div class="ma-hello">
      <span class="ma-mascot" aria-hidden="true">📖</span>
      <div>
        <div class="ma-hello-text" id="hello-text">歡迎來到進階國文！這裡是加分小旅程，玩得開心最重要。</div>
        <div class="ma-hello-sub" id="hello-sub">還沒開始也沒關係，挑一個等級試試看吧！</div>
      </div>
    </div>

    <div class="ma-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-done">0/6</span><span class="stat-label">完成等級</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-badges">0/7</span><span class="stat-label">收集徽章</span></div>
    </div>

    <div class="ma-levels" id="level-list"><!-- 由 JS 產生 --></div>

    <a class="cn-nextup cn-nextup--back" href="chinese.html" style="display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px 16px;background:var(--su-tint);border:1px solid var(--card-border);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700;min-height:48px;line-height:1.5"><span style="font-size:26px;flex:none" aria-hidden="true">🎮</span><span>← 覺得太快？先回「國語大冒險」練習打底</span></a>
    <a class="cn-nextup cn-nextup--back" href="chinese_concepts.html" style="display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px 16px;background:var(--su-tint);border:1px solid var(--card-border);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700;min-height:48px;line-height:1.5"><span style="font-size:26px;flex:none" aria-hidden="true">📖</span><span>← 想從頭打底？回「國語觀念養成」複習</span></a>
    <p class="ma-footnote">這是「進階挑戰」小旅程，慢慢玩、盡量想，答錯也沒關係。🌱</p>
  </section>

  <!-- ============================= 進行中 ============================= -->
  <section id="screen-play" class="ma-screen">
    <div class="ma-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到等級選單">←</button>
      <span class="ma-title" id="play-title">等級</span>
    </div>
    <div class="ma-steps" id="step-dots" aria-hidden="true"></div>
    <div class="play-column">
      <div id="stage"><!-- 由 JS 產生每一題 --></div>
    </div>
  </section>

</main>

<script>
/* =====================================================================
 * 主程式（自足 IIFE）
 *   - 6 個中性等級（等級1..6）、每級 12 題，全部一律解鎖、可自由進入。
 *   - 選項每題 Fisher–Yates 洗牌；answer 為「未洗牌前的 0-based 索引」，
 *     以 data-i 保留原始索引判斷 i===answer，判分不受洗牌影響。
 *   - 每題最多記一次分（answered 旗標守衛）；答錯可再試但只給視覺提示、不加分。
 *   - 完成一級 → 依 correctCount/總題數給星（3 階：★☆☆／★★☆／★★★）、寫入 best、
 *     彈 Game.showToast 鼓勵語，並解鎖對應本地徽章。
 *   - 獨立 localStorage key：chinese_adv_progress_v1。結構：
 *       { lv1:{done,best}, ..., lv6:{done,best}, badges:{ badgeId:true } }
 *   - 「只增不減」：best = Math.max(prev.best||0, thisRun)；徽章 awarded guard 永不取消。
 *   - 零重複計分：本徽章模組不呼叫 Game.recordAnswer / award / recordSession，
 *     只用 Game.showToast（純提示）與（可省略的）Game.getProfile（唯讀）。
 *     （每題作答的 recordAnswer('chinese') 在頁面主程式，非本模組；兩者不重疊。）
 * =================================================================== */
(function () {
  'use strict';

  // ---- 純提示（不記帳）：優先用 game_core toast，失敗即靜默 ----
  function toast(msg, kind) {
    try { if (window.Game && Game.showToast) Game.showToast(msg, kind || 'info'); } catch (e) { /* 靜默 */ }
  }

  // ---- 本頁進度（獨立 key，全程 try/catch；配額滿即靜默放棄不崩潰） ----
  var PROG_KEY = 'chinese_adv_progress_v1';
  function loadProg() {
    var p = null;
    try { p = JSON.parse(localStorage.getItem(PROG_KEY)); } catch (e) { p = null; }
    if (!p || typeof p !== 'object') p = {};
    if (typeof p.badges !== 'object' || !p.badges) p.badges = {};
    return p;
  }
  function saveProg(p) {
    try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) { /* 靜默降級 */ }
  }
  var progress = loadProg(); // { lvId:{done,best}, badges:{} }

  // =====================================================================
  // 課程內容（全繁體中文；每題定義／答案皆經 WebSearch 查核並雙重審查）。
  //   answer = 未洗牌前 options 陣列的 0-based 索引。
  // =====================================================================
  var LEVELS = [
    {
      id: 'lv1', level: 1, name: '字詞辨析', emoji: '✍️', color: '#e11d48',
      concepts: ['形近字', '同音字', '一字多義', '易混淆詞語', '正確用字'],
      keyFacts: [
        '形近字要看清楚：辨(辨別)、辯(辯論)、辮(辮子)、瓣(花瓣)，長得像但意思差很多。',
        '「再」是又一次(再見、再來)；「在」是存在或正在(在家、在讀書)。',
        '「得」接在動詞後補充程度(跑得快)；「地」放動詞前修飾動作(慢慢地走)；「的」多接名詞(我的書)。',
        '「必需品」是不可缺少的東西(用需)；「必須」是一定要，當副詞用(用須)。',
        '一字多義：同一個字在不同句子裡意思可能完全不同，要靠上下文判斷。'
      ],
      questions: [
        { q: '「他能清楚地____別是非善惡。」空格應填入哪個字？', options: ['辯', '辨', '辮', '瓣'], answer: 1, why: '分清是非用「辨別」的「辨」；辯是辯論、辮是辮子、瓣是花瓣。' },
        { q: '「律師在法庭上為當事人____護。」空格應填入哪個字？', options: ['辯', '辨', '辮', '瓣'], answer: 0, why: '為人講理申訴是「辯護」，用會說話的「辯」。' },
        { q: '「一朵花有好幾片花____。」空格應填入哪個字？', options: ['瓣', '辦', '辮', '辨'], answer: 0, why: '花的組成部分是「花瓣」的「瓣」；辦是辦事、辮是辮子。' },
        { q: '「我已經來過一次，明天不想____來了。」空格應填入哪個字？', options: ['在', '再', '載', '栽'], answer: 1, why: '表示「又一次」用「再」；「在」表示存在或正在。' },
        { q: '下列哪一句用字完全正確？', options: ['他跑的很快。', '他跑得很快。', '他跑地很快。', '他跑很快得。'], answer: 1, why: '動詞後補充程度用「得」，故「跑得很快」正確。' },
        { q: '「同學們安靜____聽老師講課。」空格應填入哪個字？', options: ['的', '得', '地', '底'], answer: 2, why: '「安靜」修飾動作「聽」，放在動詞前用「地」。' },
        { q: '「牙膏、肥皂都是生活的必____品。」空格應填入哪個字？', options: ['須', '需', '徐', '虛'], answer: 1, why: '不可缺少的東西是「必需品」，用有需求意思的「需」。' },
        { q: '「這本書講的道理很深。」句中的「深」意思最接近？', options: ['距離很長', '深奧、不容易理解', '顏色很濃', '天色很晚'], answer: 1, why: '形容道理的「深」指深奧難懂；深水、深色、夜深是「深」的其他意思。' },
        { q: '「這是老問題了，大家早就知道。」句中的「老」意思最接近？', options: ['年紀大的', '存在很久的', '技術熟練的', '排行最小的'], answer: 1, why: '「老問題」指存在已久的問題；老人、老手、老幺則是「老」的其他意思。' },
        { q: '下列哪個成語用字完全正確？', options: ['穿流不息', '川流不息', '川留不息', '穿留不息'], answer: 1, why: '「川」指河流，「川流不息」比喻行人車馬像流水般不停。' },
        { q: '「天氣冷，出門要____上帽子和手套。」空格應填入哪個字？', options: ['載', '戴', '栽', '裁'], answer: 1, why: '把物品加在身上是「戴」；載是載運、栽是栽種、裁是裁剪。' },
        { q: '「時間過得真快，一天____經結束了。」空格應填入哪個字？', options: ['以', '已', '己', '巳'], answer: 1, why: '表示「已經」用「已」；以是以為、己是自己、巳是地支。' }
      ]
    },
    {
      id: 'lv2', level: 2, name: '成語進階', emoji: '📜', color: '#b45309',

        { q: '「學而不思則罔」中的「則」是什麼意思？', options: ['規則', '就', '卻', '是'], answer: 1, why: '「則罔」就是「就會迷惘」，「則」表承接，相當於白話的「就」。' },
        { q: '「工欲善其事，必先利其器」中的「其」是什麼意思？', options: ['難道', '大概', '他的、自己的', '而且'], answer: 2, why: '「其事」「其器」指「自己的事、自己的工具」，「其」是代詞「他的、自己的」。' },
        { q: '「雙兔傍地走」（〈木蘭詩〉）中的「走」是什麼意思？', options: ['散步', '跑', '站立', '慢慢走路'], answer: 1, why: '文言的「走」指「跑」，「傍地走」是貼著地面奔跑。' },
        { q: '「率妻子邑人來此絕境」（〈桃花源記〉）中的「妻子」指的是？', options: ['只有太太', '妻子和兒女', '女兒', '鄰居'], answer: 1, why: '文言「妻子」是「妻」與「子（兒女）」的合稱，指妻子和兒女。' },
        { q: '「三人行，必有我師焉」最接近的白話意思是？', options: ['三個人走路，一定會迷路', '幾個人同行，其中一定有能做我老師的人', '三人同行，必須聽老師的話', '三個人裡一定有一個老師的兒子'], answer: 1, why: '這句意思是同行的人當中，一定有值得我學習、可以當老師的人。' }
      ]
    },
    {
      id: 'lv6', level: 6, name: '對聯與格律入門', emoji: '🧧', color: '#dc2626',
      concepts: ['對仗與對偶', '平仄', '押韻', '絕句與律詩句數'],
      keyFacts: [
        '「絕句」一共四句，「律詩」一共八句。',
        '對仗與對偶：上下兩句字數要相等，而且「名詞對名詞、動詞對動詞」，叫做「詞性相對」。',
        '平仄：國語的一聲、二聲算「平」；三聲、四聲算「仄」。（注意：有些古代的「入聲字」在國語變成一、二聲，分析古詩詞時要另外查字典，不能只看國語聲調。）',
        '押韻：絕句和律詩多半在「偶數句」（第二、第四句…）押韻，句末的字韻母要相近。',
        '對聯口訣「仄起平收」：上聯最後一字用仄聲，下聯最後一字用平聲。'
      ],
      questions: [
        { q: '一首「絕句」一共有幾句？', options: ['兩句', '四句', '六句', '八句'], answer: 1, why: '絕句固定為四句，常見的有五言絕句和七言絕句。' },
        { q: '一首「律詩」一共有幾句？', options: ['四句', '六句', '八句', '十二句'], answer: 2, why: '律詩固定為八句；超過八句的則稱為「排律」。' },
        { q: '「床前明月光」句末是「光」。下一句若要押韻，句末最適合用哪個字？', options: ['霜', '月', '夜', '思'], answer: 0, why: '「光（ㄍㄨㄤ）」與「霜（ㄕㄨㄤ）」韻母相近能押韻，原詩正是「疑是地上霜」。' },
        { q: '對仗要「詞性相對」。上聯用名詞「山」，下聯相對位置最適合用哪個字？', options: ['跑', '水', '綠', '慢'], answer: 1, why: '「水」和「山」都是名詞，符合名詞對名詞；跑是動詞、綠與慢是形容詞。' },
        { q: '對仗示範：與「明月」相對，下列哪一個詞最恰當？', options: ['清風', '月亮', '看月', '風很大'], answer: 0, why: '「清風」與「明月」都是「形容詞＋名詞」且字數相同；其餘結構或字數不合。' },
        { q: '國語一聲、二聲屬於「平聲」。下列哪個字是平聲？', options: ['花', '馬', '樹', '雪'], answer: 0, why: '「花」是一聲（平）；馬（三聲）、樹（四聲）、雪（三聲）都是仄聲。' },
        { q: '傳統聲調中，「仄聲」包含哪些聲調？', options: ['上聲、去聲、入聲', '只有平聲', '陰平、陽平', '只有輕聲'], answer: 0, why: '四聲分平仄，上、去、入三種合稱仄聲，與平聲相對。' },
        { q: '一首絕句中，通常需要「押韻」的是哪些句子？', options: ['第一、三句', '第二、四句', '全部四句', '第三、四句'], answer: 1, why: '近體詩多在偶數句押韻，絕句即第二、四句；首句可押可不押。' },
        { q: '傳統對聯講究「仄起平收」。下聯的最後一個字通常用什麼聲調？', options: ['平聲', '仄聲', '上聲', '入聲'], answer: 0, why: '仄起平收：上聯末字用仄聲，下聯末字用平聲；上、入都屬仄聲。' },
        { q: '對仗要「動詞對動詞」。上聯「鳥飛」的「飛」是動詞，下聯「魚__」空格最適合填？', options: ['游', '水', '紅', '大'], answer: 0, why: '「游」是動詞，和「飛」相對；水是名詞，紅、大是形容詞。' },
        { q: '律詩共八句、分成四聯。規定「必須對仗」的是哪兩聯？', options: ['首聯與尾聯', '頷聯與頸聯', '首聯與頷聯', '頸聯與尾聯'], answer: 1, why: '頷聯（第三、四句）與頸聯（第五、六句）這中間兩聯必須對仗。' },
        { q: '下列哪一組句子字數相等、詞性相對，屬於「對偶」？', options: ['兩個黃鸝鳴翠柳，一行白鷺上青天', '我今天很開心，因為放假了', '他跑得快，弟弟走得慢一點點', '天氣好，適合出去玩'], answer: 0, why: '這一組上下句都是七字且詞性一一相對，是標準的對偶；其餘字數或詞性都不對稱。' }
      ]
    }
  ];

  // 本地徽章定義（每級一枚 + 全等級達人）。存於同一 key 的 badges 子物件、awarded guard 防重複。
  var BADGES = [
    { id: 'lv1', icon: '✍️', name: '辨字高手' },
    { id: 'lv2', icon: '📜', name: '成語行家' },
    { id: 'lv3', icon: '🎨', name: '修辭魔法師' },
    { id: 'lv4', icon: '📖', name: '閱讀偵探' },
    { id: 'lv5', icon: '🏛️', name: '文言拓荒者' },
    { id: 'lv6', icon: '🧧', name: '對句詩人' },
    { id: 'all', icon: '🏆', name: '國文達人' }
  ];
  var BADGE_BY_ID = {};
  for (var bi = 0; bi < BADGES.length; bi++) BADGE_BY_ID[BADGES[bi].id] = BADGES[bi];

  // =====================================================================
  // DOM 參照
  // =====================================================================
  var $ = function (id) { return document.getElementById(id); };
  var screenMenu = $('screen-menu');
  var screenPlay = $('screen-play');
  var levelList = $('level-list');
  var stage = $('stage');
  var stepDots = $('step-dots');
  var playTitle = $('play-title');

  var cur = null; // { level, idx, correctCount, phase:'brief'|'quiz' }

  // =====================================================================
  // 星等（3 階，依 correctCount/總題數）
  // =====================================================================
  function starsFor(correct, total) {
    if (total <= 0) return 0;
    var r = correct / total;
    if (r >= 0.9) return 3;
    if (r >= 0.6) return 2;
    if (r > 0) return 1;
    return 0;
  }
  function starStr(n) {
    var s = '';
    for (var i = 0; i < 3; i++) s += (i < n ? '⭐' : '☆');
    return s;
  }

  // =====================================================================
  // 徽章解鎖（awarded guard；只增不減）
  // =====================================================================
  function awardBadge(id) {
    var def = BADGE_BY_ID[id];
    if (!def) return;
    if (progress.badges[id]) return;      // guard：已解鎖則不重複
    progress.badges[id] = true;
    saveProg(progress);
    toast('獲得徽章：' + def.icon + ' ' + def.name, 'badge');
    try { if (window.ChineseAdvBadges) ChineseAdvBadges.refresh(); } catch (e) {}
  }
  function badgeCount() {
    var n = 0;
    for (var i = 0; i < BADGES.length; i++) if (progress.badges[BADGES[i].id]) n++;
    return n;
  }

  // =====================================================================
  // 選單渲染（全部一律解鎖、可自由進入）
  // =====================================================================
  function renderMenu() {
    var doneCount = 0;
    for (var i = 0; i < LEVELS.length; i++) if (progress[LEVELS[i].id] && progress[LEVELS[i].id].done) doneCount++;
    $('ov-done').textContent = doneCount + '/' + LEVELS.length;
    $('ov-badges').textContent = badgeCount() + '/' + BADGES.length;

    if (doneCount > 0) {
      $('hello-text').textContent = '歡迎回來！你已完成 ' + doneCount + ' 個等級，很棒！';
      $('hello-sub').textContent = (doneCount >= LEVELS.length)
        ? '六個等級都完成了，你是進階國文達人！🏆'
        : '想挑戰哪一個等級都可以，答錯也沒關係。';
    }

    levelList.innerHTML = '';
    for (var u = 0; u < LEVELS.length; u++) {
      (function (lv) {
        var rec = progress[lv.id] || {};
        var done = !!rec.done;
        var total = lv.questions.length;
        var st = done ? starsFor(rec.best || 0, total) : 0;
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'ma-level';
        card.setAttribute('aria-label', '等級 ' + lv.level + '：' + lv.name);
        card.innerHTML =
          '<div class="ma-level-top">' +
            '<span class="ma-level-emoji" aria-hidden="true" style="background:' + lv.color + '22;color:' + lv.color + '">' + lv.emoji + '</span>' +
            '<div>' +
              '<div class="ma-level-num">等級 ' + lv.level + '</div>' +
              '<div class="ma-level-name">' + lv.name + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="ma-level-concepts">' + lv.concepts.join('・') + '</div>' +
          '<div class="ma-level-foot">' +
            '<span class="ma-level-status ' + (done ? 'done' : 'todo') + '">' +
              (done ? '✅ 已完成（最佳 ' + (rec.best || 0) + '/' + total + '）' : '▶️ 開始挑戰（共 ' + total + ' 題）') + '</span>' +
            '<span class="ma-level-stars" aria-hidden="true">' + (done ? starStr(st) : '') + '</span>' +
          '</div>';
        card.addEventListener('click', function () { startLevel(lv); });
        levelList.appendChild(card);
      })(LEVELS[u]);
    }
  }

  // =====================================================================
  // 遊玩流程
  // =====================================================================
  function show(screen) {
    screenMenu.classList.remove('active');
    screenPlay.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0, 0);
  }

  function startLevel(lv) {
    cur = { level: lv, idx: 0, correctCount: 0, phase: 'brief' };
    playTitle.textContent = lv.emoji + ' 等級 ' + lv.level + '・' + lv.name;
    show(screenPlay);
    renderBrief();
  }

  function renderStepDots() {
    stepDots.innerHTML = '';
    if (cur.phase !== 'quiz') return; // 重點卡不畫題目進度點
    for (var i = 0; i < cur.level.questions.length; i++) {
      var b = document.createElement('i');
      if (i < cur.idx) b.className = 'on';
      else if (i === cur.idx) b.className = 'cur';
      stepDots.appendChild(b);
    }
  }

  // ---- 重點卡（worked example / advance organizer；不計分） ----
  function renderBrief() {
    renderStepDots();
    var lv = cur.level;
    var facts = '';
    for (var i = 0; i < lv.keyFacts.length; i++) {
      facts += '<li><span class="ma-kf-dot" aria-hidden="true">◆</span><span>' + lv.keyFacts[i] + '</span></li>';
    }
    stage.innerHTML =
      '<div class="ma-stage ma-brief">' +
        '<div class="ma-visual" aria-hidden="true">' + lv.emoji + '</div>' +
        '<h2>等級 ' + lv.level + '・' + lv.name + '</h2>' +
        '<p class="ma-brief-sub">先看看這一級的重點，再開始 ' + lv.questions.length + ' 題挑戰。</p>' +
        '<ul class="ma-keyfacts">' + facts + '</ul>' +
      '</div>' +
      '<div class="ma-actions">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-start">開始挑戰 ➡️</button>' +
      '</div>';
    $('btn-start').addEventListener('click', function () {
      cur.phase = 'quiz';
      cur.idx = 0;
      renderQuestion();
    });
  }

  function next() {
    cur.idx++;
    if (cur.idx >= cur.level.questions.length) finishLevel();
    else renderQuestion();
  }

  // ---- 單選題（選項 Fisher–Yates 洗牌；每題最多記一次分） ----
  function renderQuestion() {
    renderStepDots();
    var lv = cur.level;
    var step = lv.questions[cur.idx];

    // 打亂選項顯示順序（正解絕不固定在第一個）。data-i 記「原始索引」，
    // 因此對答判斷 i === step.answer 仍然正確、判分不受洗牌影響。
    var order = [];
    for (var oi = 0; oi < step.options.length; oi++) order.push(oi);
    for (var m = order.length - 1; m > 0; m--) {
      var r = Math.floor(Math.random() * (m + 1));
      var tt = order[m]; order[m] = order[r]; order[r] = tt;
    }
    var optsHtml = '';
    for (var k = 0; k < order.length; k++) {
      var origIdx = order[k];
      optsHtml += '<button type="button" class="ma-opt" data-i="' + origIdx + '">' +
        '<span>' + step.options[origIdx] + '</span><span class="ma-opt-mark" aria-hidden="true"></span></button>';
    }

    stage.innerHTML =
      '<div class="ma-stage">' +
        '<div class="ma-visual" aria-hidden="true">' + lv.emoji + '</div>' +
        '<p class="ma-question">第 ' + (cur.idx + 1) + ' / ' + lv.questions.length + ' 題　' + step.q + '</p>' +
        '<div class="ma-options">' + optsHtml + '</div>' +
        '<div class="ma-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="ma-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button>' +
      '</div>';

    var answered = false;
    var btns = stage.querySelectorAll('.ma-opt');

    function revealAndLock(correct) {
      var rev = $('reveal');
      rev.textContent = (correct ? '答對了！' : '再想想～正確答案是這個！') + (step.why || '');
      rev.classList.add('show');
      $('afteract').style.display = 'flex';
      var all = stage.querySelectorAll('.ma-opt');
      for (var a = 0; a < all.length; a++) all[a].disabled = true;
    }

    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var i = parseInt(this.getAttribute('data-i'), 10);
        var isCorrect = (i === step.answer);
        if (answered) return; // 已作答：不再改動計分（守衛）
        answered = true;      // 第一次作答才計分
        if (window.Game && window.Game.recordAnswer) Game.recordAnswer('chinese', isCorrect);
        if (isCorrect) {
          this.classList.add('correct');
          this.querySelector('.ma-opt-mark').textContent = '✅';
          cur.correctCount++;              // 唯一計分點（純本地）
          revealAndLock(true);
        } else {
          this.classList.add('wrong');
          this.querySelector('.ma-opt-mark').textContent = '❌';
          // 答錯零懲罰：標出正解、允許看解說（不加分、不扣分）。
          var correctBtn = stage.querySelector('.ma-opt[data-i="' + step.answer + '"]');
          if (correctBtn) {
            correctBtn.classList.add('correct');
            correctBtn.querySelector('.ma-opt-mark').textContent = '✅';
          }
          revealAndLock(false);
        }
      });
    }

    $('btn-next').addEventListener('click', next);
  }

  // =====================================================================
  // 完成一級
  // =====================================================================
  function finishLevel() {
    var lv = cur.level;
    var total = lv.questions.length;
    var got = cur.correctCount;

    // 收藏只增不減：best = max(prev, thisRun)。
    var prev = progress[lv.id] || {};
    progress[lv.id] = { done: true, best: Math.max(prev.best || 0, got) };
    saveProg(progress);

    // 解鎖對應等級徽章；若六級全完成 → 全等級達人。
    awardBadge(lv.id);
    var allDone = true;
    for (var i = 0; i < LEVELS.length; i++) if (!(progress[LEVELS[i].id] && progress[LEVELS[i].id].done)) { allDone = false; break; }
    if (allDone) awardBadge('all');

    var st = starsFor(got, total);
    stage.innerHTML =
      '<div class="ma-stage ma-done">' +
        '<div class="ma-done-emoji" aria-hidden="true">🎉</div>' +
        '<div class="ma-done-title">完成「' + lv.name + '」！</div>' +
        '<div class="ma-done-stars" aria-label="得到 ' + st + ' 顆星">' + starStr(st) + '</div>' +
        '<p class="ma-question" style="font-size:clamp(16px,3.6vw,19px);text-align:center">你答對了 ' + got + ' / ' + total + ' 題，真棒！</p>' +
      '</div>' +
      '<div class="ma-actions">' +
        '<button type="button" class="btn" id="btn-menu">回到選單</button>' +
        (nextLevelOf(lv) ? '<button type="button" class="btn btn-primary" id="btn-nextlv">下一個等級 ➡️</button>' : '') +
      '</div>';

    toast('完成「' + lv.name + '」！你答對了 ' + got + ' / ' + total + ' 題，真棒！', 'daily');

    $('btn-menu').addEventListener('click', goMenu);
    var nl = nextLevelOf(lv);
    if (nl) $('btn-nextlv').addEventListener('click', function () { startLevel(nl); });
  }

  function nextLevelOf(lv) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (LEVELS[i].id === lv.id) return LEVELS[i + 1] || null;
    }
    return null;
  }

  function goMenu() {
    cur = null;
    stepDots.innerHTML = '';
    renderMenu();
    show(screenMenu);
  }

  // ---- 頁內返回（一律「←」，回選單，非回首頁）----
  $('btn-back').addEventListener('click', goMenu);

  // 暴露給徽章冊模組讀取（唯讀共享同一份進度與定義）。
  window.__chineseAdv = {
    LEVELS: LEVELS,
    BADGES: BADGES,
    getProgress: function () { return progress; }
  };

  renderMenu();
})();
</script>

<!-- ===== 進階國文徽章冊：樣式（自足、canon 變數、亮暗雙主題、色盲雙碼、[hidden] 防護；純本地、無 XP、無 Game.award） ===== -->
<style>
/* 入口 FAB（右下固定，避開底部安全區；低於 app-bar 的層級，不遮頂列；≥48px 觸控）。
   國語科琥珀色底較亮，故文字採深棕色（#4a3500）以確保亮暗兩主題皆過 AA 對比。 */
#chineseAdvBadgeFab {
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 55; display: inline-flex; align-items: center; gap: 6px;
  min-height: 48px; min-width: 48px; padding: 10px 16px;
  background: var(--accent, var(--c-chinese)); color: #4a3500; border: none;
  border-radius: 999px; font-family: var(--font); font-weight: 800;
  font-size: clamp(14px, 3vw, 16px); cursor: pointer; box-shadow: var(--shadow-lg);
}
#chineseAdvBadgeFab:active { transform: scale(0.96); }
#chineseAdvBadgeFabCount {
  display: inline-flex; align-items: center; gap: 3px;
  background: rgba(0,0,0,0.14); color: #4a3500;
  border-radius: 999px; padding: 1px 8px; font-size: 13px; font-weight: 800;
}
/* 浮層外殼 */
.ma-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 60; padding: 16px;
}
/* [hidden] 防護：class 的 display:flex(author) 特異度會蓋過 UA 的 [hidden]{display:none}，
   故需更高特異度規則，否則浮層會恆顯、蓋住整頁。 */
#chineseAdvBadgeOverlay[hidden] { display: none !important; }
.ma-card {
  position: relative; background: var(--card); border: 2px solid var(--card-border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  padding: 20px 18px 22px; color: var(--ink);
}
.ma-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ma-card-head h1 { font-size: clamp(1.1rem, 4vw, 1.4rem); font-weight: 800; margin: 0; color: var(--ink); flex: 1; }
.ma-card-back {
  background: var(--card); border: 2px solid var(--card-border); color: var(--accent-ink, var(--c-chinese-ink));
  font-family: var(--font); font-weight: 800; font-size: 15px; cursor: pointer;
  min-height: 44px; padding: 8px 14px; border-radius: 14px;
}
.ma-card-back:active { transform: scale(0.96); }
.ma-card-note {
  background: var(--accent-tint); color: var(--ink); border-radius: var(--r-md, 12px);
  font-size: var(--fs-small); font-weight: 600; line-height: 1.7; padding: 10px 12px; margin: 4px 0 12px;
}
.ma-card-summary { text-align: center; font-size: var(--fs-small); font-weight: 700; color: var(--ink-soft); margin: 4px 0 14px; line-height: 1.7; }
.ma-badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
.ma-badge {
  position: relative; min-height: 96px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border-radius: 14px; background: var(--card); border: 2px solid var(--card-border);
  text-align: center; padding: 10px 6px;
}
.ma-badge .ma-badge-glyph { font-size: clamp(1.6rem, 7vw, 2rem); line-height: 1; }
.ma-badge .ma-badge-name { font-size: clamp(0.6rem, 2.6vw, 0.74rem); font-weight: 800; color: var(--ink); line-height: 1.2; }
.ma-badge .ma-badge-state { font-size: clamp(0.52rem, 2.2vw, 0.64rem); font-weight: 700; color: var(--ink-soft); }
/* 未解鎖：虛線邊 + 去彩 + 半透明（碼一＝形狀 🔒／碼二＝虛線+去彩） */
.ma-badge.locked { border-style: dashed; opacity: 0.5; filter: grayscale(1); }
/* 已解鎖：實線金框 + 右上 ★（碼一＝emoji 形狀／碼二＝金框+★） */
.ma-badge.unlocked { box-shadow: 0 0 0 2px #f5b301, 0 0 10px rgba(245,179,1,0.5); background: color-mix(in srgb, #f5b301 12%, var(--card)); }
.ma-badge.unlocked .ma-badge-star { position: absolute; right: 5px; top: 4px; font-size: 14px; }
</style>
<!-- ===== 進階國文徽章冊：模組（自足 IIFE；讀寫共享獨立 key chinese_adv_progress_v1；純本地、只增不減、無 XP、無 Game.award、無 streak） ===== -->
<script>
(function () {
  'use strict';

  function api() { return window.__chineseAdv || null; }

  function unlockedCount() {
    var a = api(); if (!a) return 0;
    var prog = a.getProgress();
    var n = 0;
    for (var i = 0; i < a.BADGES.length; i++) if (prog.badges[a.BADGES[i].id]) n++;
    return n;
  }

  function renderGrid() {
    var a = api(); if (!a) return;
    var prog = a.getProgress();
    var host = document.getElementById('chineseAdvBadgeGrid');
    if (!host) return;
    var html = '';
    for (var i = 0; i < a.BADGES.length; i++) {
      var def = a.BADGES[i];
      var got = !!prog.badges[def.id];
      var cls = 'ma-badge ' + (got ? 'unlocked' : 'locked');
      var glyph = got ? def.icon : '🔒';
      var state = got ? '已收集' : '尚未解鎖';
      var star = got ? '<span class="ma-badge-star" aria-hidden="true">★</span>' : '';
      var label = def.name + '（' + state + '）';
      html += '<div class="' + cls + '" title="' + label + '" aria-label="' + label + '">' +
        '<span class="ma-badge-glyph" aria-hidden="true">' + glyph + '</span>' +
        '<span class="ma-badge-name">' + def.name + '</span>' +
        '<span class="ma-badge-state">' + state + '</span>' + star + '</div>';
    }
    host.innerHTML = html;
  }

  function renderSummary() {
    var a = api(); if (!a) return;
    var el = document.getElementById('chineseAdvBadgeSummary');
    if (!el) return;
    el.innerHTML = '已收集 <b>' + unlockedCount() + '</b> / ' + a.BADGES.length +
      ' 枚徽章（收藏只增不減，慢慢玩就好）';
  }

  function updateFabCount() {
    var a = api(); if (!a) return;
    var badge = document.getElementById('chineseAdvBadgeFabCount');
    if (badge) badge.textContent = unlockedCount() + '/' + a.BADGES.length;
  }

  function refresh() { updateFabCount(); if (isOpen()) { renderGrid(); renderSummary(); } }
  function isOpen() { var el = document.getElementById('chineseAdvBadgeOverlay'); return el && !el.hidden; }
  function openBook() { renderGrid(); renderSummary(); var o = document.getElementById('chineseAdvBadgeOverlay'); if (o) o.hidden = false; }
  function closeBook() { var o = document.getElementById('chineseAdvBadgeOverlay'); if (o) o.hidden = true; }

  // 附加 DOM（皆 append 於 <body> 尾端，不動既有 section；浮層帶 [hidden]）。
  function buildDom() {
    var host = document.createElement('div');
    host.innerHTML =
      '<button id="chineseAdvBadgeFab" type="button" aria-label="打開進階國文徽章冊" onclick="ChineseAdvBadges.openBook()">' +
        '🏅 徽章冊 <span id="chineseAdvBadgeFabCount">0/7</span></button>' +
      '<div id="chineseAdvBadgeOverlay" class="ma-overlay" hidden>' +
        '<div class="ma-card" role="dialog" aria-modal="true" aria-label="進階國文徽章冊">' +
          '<div class="ma-card-head"><h1>🏅 進階國文徽章冊</h1>' +
            '<button class="ma-card-back" onclick="ChineseAdvBadges.closeBook()">← 返回</button></div>' +
          '<div class="ma-card-note">這本徽章冊只存在你自己的裝置上，純粹紀念你完成過哪些進階等級。它不會計入學習基地的等級或經驗值——放輕鬆挑戰就好 🌱</div>' +
          '<div id="chineseAdvBadgeSummary" class="ma-card-summary"></div>' +
          '<div id="chineseAdvBadgeGrid" class="ma-badge-grid"></div>' +
        '</div></div>';
    while (host.firstChild) document.body.appendChild(host.firstChild);
  }

  window.ChineseAdvBadges = {
    openBook: openBook,
    closeBook: closeBook,
    refresh: refresh
  };

  function boot() { buildDom(); updateFabCount(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
