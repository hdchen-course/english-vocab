<!DOCTYPE html>
<html lang="zh-TW" data-game-wired="chinese">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小小作家 · 寫作工廠 ✍️</title>
<!-- 統一遊戲化引擎：先載共用設計 token（assets/app.css），再載 HUD/toast 樣式
     （game_core.css），最後同步載入引擎（game_core.js）。
     本頁透過 Game.recordAnswer('chinese', ...) 即時記帳，XP 匯入同一個國語角色。
     於 <html>＋<body> 宣告 data-game-wired="chinese"（與 chinese.html 一致）：
     此為全站黏著旗標，對應 legacy 的 chinese_game_state.exp；宣告後 delta-sync 只
     前移 shadow、絕不對該 legacy 值補發 XP，確保與本頁即時記帳不重複計分。本頁自身
     不寫 chinese_game_state.exp，故此宣告純為與國語科既有接線保持一致、萬無一失。
     兒童安全（§3.6）：金幣＝純記錄努力的學習點數，不綁任何可兌換造型／物品（清資料才不會讓孩子失落）；無抽卡／轉蛋／隨機獎勵／真錢／
     懲罰性計時／損失厭惡文案；答錯不扣分，答錯後會揭示正解與範例讓孩子看懂再離開。
     國語正確性（第一優先）：成語／修辭標籤依教育部標準；排序題只收「唯一合理順序」
     （靠時間／因果／關聯詞鎖定）；造句選擇題的干擾項一律「明顯不通」，不放「其實也對」，
     以免自動批改懲罰正確思考。自由寫作（我的小作文）「零評分、零內容比對」，
     只以「完成反思」這個行為給鼓勵。全繁體中文，無簡體字。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* =====================================================================
 * composition.html — 本頁樣式（建立在 assets/app.css 的設計 token 上，
 * 自動亮／暗色主題化、與學習基地視覺一致）。強調色沿用國語科的暖黃。
 * =================================================================== */
:root {
  --accent: var(--c-chinese);
  --accent-tint: var(--tint-chinese);
  --accent-ink: var(--c-chinese-ink);
}

body { overflow-x: hidden; }

/* 頁面頂列（回選單、標題） */
.cp-topbar { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s4); }
.cp-topbar .cp-title { flex: 1; font-size: var(--fs-h2); font-weight: 800; color: var(--ink); min-width: 0; }

/* 夥伴「小墨」歡迎卡 */
.cp-hello { display: flex; align-items: center; gap: var(--s3); padding: var(--s4);
  background: var(--accent-tint); border: 1px solid var(--card-border); border-radius: var(--r-lg); margin-bottom: var(--s4); }
.cp-hello .cp-bot { font-size: 46px; flex: none; line-height: 1; }
.cp-hello .cp-bot.pop { animation: cp-pop 0.7s ease; }
@keyframes cp-pop { 0%{transform:scale(1);} 40%{transform:scale(1.25) rotate(-8deg);} 100%{transform:scale(1);} }
.cp-hello .cp-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.cp-hello .cp-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }

/* 安全提示條 */
.cp-note {
  display: flex; align-items: center; gap: var(--s2);
  padding: 10px var(--s3); margin: 0 auto var(--s3); max-width: 42ch;
  background: var(--accent-tint); border: 1px solid var(--card-border); border-left: 4px solid var(--accent);
  border-radius: var(--r-md); color: var(--ink); font-weight: 700; font-size: var(--fs-small);
}
.cp-note .cp-note-ico { font-size: 20px; flex: none; }

/* 看圖寫話：用大 emoji 當「圖」 */
.cp-scene { text-align: center; font-size: clamp(46px, 14vw, 72px); line-height: 1.1; margin: var(--s3) 0;
  letter-spacing: 6px; }

/* 範例／示範盒（worked example） */
.cp-example { margin: var(--s2) auto var(--s3); max-width: 42ch; padding: var(--s3);
  background: var(--card); border: 2px solid var(--card-border); border-radius: var(--r-md);
  text-align: left; font-weight: 700; color: var(--ink); line-height: 1.7; }
.cp-example b { color: var(--accent-ink); }

/* 提示盒 */
.cp-hintbox { margin: var(--s2) auto; max-width: 40ch; padding: var(--s2) var(--s3);
  background: var(--accent-tint); border-radius: var(--r-md); font-size: var(--fs-small);
  font-weight: 700; color: var(--ink); line-height: 1.6; display: none; text-align: left; }
.cp-hintbox.show { display: block; }

/* =========== 排排隊／排段落：可重用的 .order-game ============ */
/* 拼句/排序互動區收斂到易讀寬度並置中，與置中的題幹(.q-prompt max 32ch)對齊，
   避免在滿版 play 卡上「題目置中、積木靠左、中間空空」。 */
.order-game { display: grid; gap: var(--s3); margin: var(--s3) auto; max-width: 34em; }
.og-lane-lbl { font-size: var(--fs-small); font-weight: 800; color: var(--ink-soft); text-align: left; }
.og-slots { display: grid; gap: var(--s2); }
.og-slot { display: flex; align-items: center; gap: var(--s2); width: 100%;
  min-height: 52px; padding: 10px var(--s3); text-align: left;
  border: 2px dashed var(--card-border); border-radius: 14px; background: var(--card);
  color: var(--ink); font-family: var(--font); font-size: clamp(14px, 3.2vw, 17px); font-weight: 700; cursor: pointer; }
.og-slot.filled { border-style: solid; border-color: var(--accent); background: var(--accent-tint); }
.og-slot .og-num { flex: none; width: 26px; height: 26px; border-radius: 999px; background: var(--accent);
  color: #1a1a1a; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.og-slot .og-text { flex: 1; min-width: 0; }
.og-slot.correct { border-color: var(--c-correct); background: var(--tint-english); }
.og-slot.wrong { border-color: var(--c-wrong); }
.og-bank { display: flex; flex-wrap: wrap; gap: var(--s2); justify-content: center;
  padding: var(--s2); border-top: 1px dashed var(--card-border); }
.og-chip { min-height: 48px; padding: 10px var(--s3); border: 2px solid var(--card-border); border-radius: 14px;
  background: var(--card); color: var(--ink); font-family: var(--font); font-size: clamp(14px, 3.2vw, 17px);
  font-weight: 700; cursor: pointer; max-width: 100%; }
.og-chip:active { transform: scale(0.97); }
.og-chip.used { display: none; }

/* =========== 拼句（slot-fill）：逐槽從詞庫挑選拼句，引導式填空 ============ */
/* 沿用 .order-game / .og-* 結構；差別在每個槽有「角色標籤」（誰／在哪裡…）當鷹架。 */
.og-slot .og-role { flex: none; font-size: var(--fs-small); font-weight: 800; color: var(--accent-ink);
  background: var(--accent-tint); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.og-slot.filled .og-role { opacity: 0.75; }
.fill-reveal { margin: var(--s2) auto 0; max-width: 42ch; padding: var(--s2) var(--s3);
  background: var(--card); border: 2px solid var(--accent); border-radius: var(--r-md);
  font-weight: 800; color: var(--accent-ink); line-height: 1.7; text-align: center; }

/* 檢核表（我的小作文自我檢核；不評分、不強制） */
.cp-checklist { display: grid; gap: var(--s2); margin: var(--s3) auto; max-width: 42ch; text-align: left; }
.cp-check { display: flex; align-items: center; gap: var(--s2); min-height: 48px; padding: 8px var(--s3);
  border: 2px solid var(--card-border); border-radius: 14px; background: var(--card); color: var(--ink);
  font-weight: 700; font-size: var(--fs-small); cursor: pointer; }
.cp-check input { width: 24px; height: 24px; flex: none; accent-color: var(--accent); }
.cp-check.on { border-color: var(--accent); background: var(--accent-tint); }
.cp-textarea { width: 100%; min-height: 160px; resize: vertical; padding: var(--s3); border: 2px solid var(--card-border);
  border-radius: var(--r-md); background: var(--card); color: var(--ink); font-family: var(--font);
  font-size: var(--fs-body); font-weight: 600; line-height: 1.8; }
.cp-topic { margin: 0 auto var(--s3); max-width: 42ch; padding: var(--s3); text-align: center;
  background: var(--accent-tint); border-radius: var(--r-md); font-weight: 800; color: var(--ink); }

/* 佳句收藏卡 */
.cp-quote-card { margin: var(--s3) auto; max-width: 42ch; padding: var(--s4);
  background: linear-gradient(135deg, var(--accent-tint), var(--card)); border: 2px solid var(--accent);
  border-radius: var(--r-lg); color: var(--ink); font-weight: 700; font-size: var(--fs-body); line-height: 1.8; text-align: center; }
.cp-quote-card .cp-quote-mark { font-size: 34px; color: var(--accent-ink); line-height: 1; }

.cp-footnote { text-align: center; color: var(--ink-soft); font-size: var(--fs-small); margin-top: var(--s5); font-weight: 600; max-width: 34em; margin-inline: auto; }

.u-card__blueprint { font-size: var(--fs-small); font-weight: 700; color: var(--accent-ink); }
.cp-due { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800;
  color: var(--ink); background: var(--accent-tint); border-radius: 999px; padding: 2px 10px; }
</style>
</head>
<body data-game-wired="chinese">
<!-- ===== 共用頂部應用列（全站一致） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">小小作家 · 寫作工廠 ✍️</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

  <!-- ============================= 選單 / 首頁 ============================= -->
  <section id="screen-menu" class="u-screen active">
    <div class="cp-hello">
      <span class="cp-bot" id="hello-bot" aria-hidden="true">🦉</span>
      <div>
        <div class="cp-hello-text" id="hello-text">嗨！我是小墨，我們一起從「詞」蓋到「句」，再蓋出一整篇文章吧！</div>
        <div class="cp-hello-sub" id="hello-sub">選一項寫作工具，慢慢想沒關係，寫錯也不會扣分喔。</div>
      </div>
    </div>

    <div class="cp-note">
      <span class="cp-note-ico" aria-hidden="true">💡</span>
      <span>這裡的金幣是「學習點數」，記錄你努力的成果，不是真的錢、也不能拿去買東西喔！答錯不會扣分，「我的小作文」更是想怎麼寫都可以。</span>
    </div>

    <div class="u-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-done">0/10</span><span class="stat-label">學會的工具</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-xp">0</span><span class="stat-label">國語經驗值</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-quotes">0</span><span class="stat-label">佳句收藏</span></div>
    </div>

    <div class="u-grid" id="unit-list"><!-- 由 JS 產生 --></div>

    <a class="cn-nextup" href="chinese_advanced.html"><span class="cn-nextup-ic" aria-hidden="true">🚀</span><span>準備好了？挑戰「進階國文挑戰」→</span></a>
    <a class="cn-nextup cn-nextup--back" href="chinese_concepts.html"><span class="cn-nextup-ic" aria-hidden="true">📖</span><span>← 先回「國語觀念養成」複習部首、標點</span></a>
    <p class="cp-footnote">會判斷，就能學會自己寫！把好句子收進「佳句收藏冊」，寫作文時就有用不完的好材料。🖋️</p>
  </section>

  <!-- ============================= 進行中 ============================= -->
  <section id="screen-play" class="u-screen">
    <div class="cp-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button>
      <span class="cp-title" id="play-title">寫作工具</span>
    </div>
    <div class="q-progress" id="step-dots" aria-hidden="true"></div>
    <div class="play-column">
      <div id="stage"><!-- 由 JS 產生每一步 --></div>
    </div>
  </section>

</main>

<script src="composition.js"></script>
</body>
</html>
