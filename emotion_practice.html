<style>
  :root{ --su:#0d9488; --su-tint:rgba(13,148,136,0.14); }

  .pr-screen{ display:none; } .pr-screen.active{ display:block; animation: app-fade 0.3s ease; }
  .pr-count{ font-size:var(--fs-small); font-weight:800; color:var(--su-d,var(--su)); background:var(--su-tint); border-radius:999px; padding:3px 12px; display:inline-block; margin-bottom:var(--s3); }

  .cn-opt.best{ border-color:var(--su); background:var(--su-tint); }
  .cn-opt.picked{ outline:2px dashed var(--card-border); outline-offset:2px; }
  .pr-badge{ font-weight:800; color:var(--su-d,var(--su)); }
  .pr-note{ text-align:center; color:var(--ink-soft); font-size:var(--fs-small); margin-top:var(--s5); font-weight:600; max-width:34em; margin-inline:auto; }

    <div class="cn-hello"><span class="cn-mascot" aria-hidden="true">💡</span>
      <div><div class="cn-htext">這裡有好多真實情境。每一題想想「<b>我可以怎麼做</b>？」選一個看看——<b>沒有「答錯」這回事</b>，我們會一起看看<b>哪個做法最能幫到你</b>，還有為什麼。慢慢想、多試幾個都好。</div>
      <div class="cn-hsub">挑一個主題開始，或選「全部混合」。這只是練習場，不計分、不影響經驗值。</div></div></div>
    <div class="cn-lessons" id="theme-list"></div>
    <a class="cn-nextup cn-nextup--back" href="emotion_skills.html"><span class="cn-nextup-ic" aria-hidden="true">🫧</span><span>想先學這些本領嗎？回「心情練習場」看觀念 →</span></a>

  </section>
