<script>

(function(){
  'use strict';
  var SCENARIOS = [{"scene":"老師在黑板上講解一個新的算法，你聽到一半就跟不上了，可是看起來班上其他人都在點頭。你心裡有點慌。","options":["先假裝聽懂，把黑板上的字抄下來，等回家再自己想辦法。","舉手跟老師說：「這一步我還沒跟上，可以再講一次嗎？」","偷偷看旁邊同學的本子，把他寫的答案照抄過來。"],"best":1,"why":"把「我還沒跟上」說出來，老師就知道要放慢或換個講法，你當下就能補上那一步；而且會卡住的通常不只你一個。先抄下來或照抄同學的，雖然能撐過這一節，但沒弄懂的地方可能會一直累積，下次更難跟上。","theme":"校園"},{"scene":"老師突然點到你的名字，要你回答問題，可是你腦袋一片空白，需要一點時間才想得起來。全班都在看你。","options":["深呼吸一下，跟老師說：「我需要一點時間想，可以等我一下嗎？」","不出聲，低著頭等，希望老師覺得無聊就換別人。","隨便講一個聽起來像答案的東西，講完就算了。"],"best":0,"why":"說出「我需要一點時間」是一個很小卻很清楚的訊號，老師會知道你在思考、不是不理他，通常也願意給你幾秒鐘。需要多一點時間想事情很正常。一直不出聲，老師可能不知道你卡在哪；隨便講一個，反而讓自己更難搞清楚原本不懂的地方。","theme":"校園"},{"scene":"你上台寫答案，老師當著全班說：「這裡算錯囉，再看一次。」你的臉一下子熱起來，很想找個地方躲。","options":["馬上反駁：「我覺得我沒有錯！」","先深呼吸一口氣，看看老師指的地方，把它改過來。","把眼淚忍住，整個人僵在那裡，什麼都不想再寫。"],"best":1,"why":"先吸一口氣可以讓發熱、想躲的感覺慢下來，接著把注意力放回「哪裡可以改」，你就能真的學到這一題。被老師指出來會不舒服，這很正常。急著反駁，可能會錯過老師想幫你的地方；忍住不動，事情還是留在那裡，心裡也會一直悶著。","theme":"校園"},{"scene":"分組討論時，你想到一個做法，可是同學們一直在講自己的，好像沒人聽到你。","options":["算了，安靜坐著，反正說了大概也沒人理。","覺得被忽略很生氣，直接大聲蓋過大家的聲音。","等一個空檔，說：「我有一個想法想跟大家分享一下。」"],"best":2,"why":"先找空檔、再清楚說「我有想法想分享」，同學比較容易停下來聽你，你的點子也才有機會被用上。表達自己的想法是你的權利。一直不說，好點子可能就這樣不見了；用大聲蓋過大家，雖然引起注意，卻可能讓討論變吵、更難合作。","theme":"校園"},{"scene":"你在全班面前把題目做錯了，同學發出一點笑聲。你覺得很丟臉，很想馬上消失。","options":["心裡想：一定是筆不好寫，才會害我寫錯。","雖然臉紅紅的，還是把錯的地方看清楚、改對，記住這次學到什麼。","覺得自己好糟，接下來都不敢再舉手了。"],"best":1,"why":"把出錯當成「這次學到什麼」，你會發現錯誤其實是在告訴你下次怎麼做得更好，人人都會寫錯，這很正常。把原因推給筆，問題其實沒被解決；因為一次錯就不敢再舉手，可能會錯過很多練習和表現的機會。","theme":"校園"},{"scene":"教室裡很吵，事情又很多，你覺得腦袋快要塞不下了，怎麼都靜不下來寫作業。","options":["舉手問老師：「我有點亂，可以讓我喝口水、休息一下下嗎？」","逼自己一直寫，就算越來越煩、快哭出來也不停。","把煩躁發在旁邊同學身上，對他兇一句。"],"best":0,"why":"當腦袋「塞太滿」時，先停一下、喝口水，是幫自己重新開機，休息一小段再回來，通常會比硬撐更專心。覺得被塞滿是很正常的訊號。一直逼自己，情緒可能會越滾越大；把煩躁丟到同學身上，事情沒解決，還可能多出一個要修補的關係。","theme":"校園"},{"scene":"有一題你完全卡住了，很需要老師教，可是你怕打擾老師，也怕被覺得問題太簡單。","options":["整節課都對著那題發呆，一個字也寫不出來。","乾脆放棄這份作業，空著交上去算了。","趁下課走到老師旁邊說：「我這題卡住了，可以教我一下嗎？」"],"best":2,"why":"主動說「我卡住了，可以教我嗎」，老師才知道你需要幫忙，也能針對你卡住的地方講給你聽，尋求協助是很聰明的做法，沒有哪個問題太簡單。一直發呆，時間過去了題目還在；直接放棄，你會少掉一次把它弄懂的機會。","theme":"校園"},{"scene":"同學好意提醒你：「你這一題好像算錯了喔。」你心裡有點不好意思。","options":["跟他說聲謝謝，然後回頭再檢查一次那一題。","覺得很尷尬，假裝沒聽到，繼續做自己的。","堅持說：「才沒有，我一定是對的。」"],"best":0,"why":"先道謝、再自己檢查一次，你既保住了心情，也真的有機會抓到錯在哪，別人願意提醒你，其實是在幫你。被指出來會不好意思很正常。假裝沒聽到，錯的地方可能就留著了；一口咬定自己對，反而讓自己看不到可以修正的地方。","theme":"校園"},{"scene":"老師把你的作業還給你，要你再改一次。你心裡冒出一個念頭：「是不是老師不喜歡我？」","options":["越想越難過，認定老師就是針對你。","乾脆不改了，反正改了老師大概也不會滿意。","問老師：「我可以怎麼改，會變得更好呢？」"],"best":2,"why":"問「我可以怎麼改會更好」，可以把模糊的擔心變成具體、做得到的下一步，也會發現老師要你重改，多半是想幫你把它做得更好，不是針對你。一直往「他不喜歡我」想，難過會越滾越大；直接不改，你會少掉一次把作品變更好的機會。","theme":"校園"},{"scene":"下課鐘快響了，你發現自己的任務還沒做完，心跳一下子變得好快，很怕交不出來。","options":["老實跟老師說：「我還沒做完，需要多一點時間，可以嗎？」","慌慌張張隨便亂寫，趕在鐘響前塞出去。","把還沒做完的收進抽屜，假裝沒這回事。"],"best":0,"why":"把「我需要多一點時間」誠實說出來，老師通常會跟你一起想辦法，例如延一點或分段完成，做事需要的時間人人不同，這很正常。慌著亂寫，交出去的可能不是你真正的實力；藏起來假裝沒事，事情還在，心裡的緊張也不會消失。","theme":"校園"},{"scene":"足球課練習傳球，你連續三次都沒接到球，心裡開始覺得很煩、很想放棄。這時候你可以怎麼做？","options":["先停下來深呼吸兩口氣，告訴自己：剛剛沒接到很正常，再慢慢試一次。","把球踢到旁邊，坐在草地上不想再練了。","忍住不讓自己覺得煩，硬撐著繼續，越接越急。"],"best":0,"why":"先深呼吸、重新開始，能讓緊張的身體放鬆，接下來反而更容易接到球，也提醒自己失誤是練習的一部分。直接放棄可能會少了進步的機會；硬撐著不理會心裡的煩，越急可能會越接不到。","theme":"運動才藝"},{"scene":"比賽時教練在場邊大聲喊：「往左邊跑！」你一下子沒聽清楚，人愣在原地不知道怎麼辦。你可以怎麼做？","options":["假裝沒聽到，繼續站在原地等別人動。","對教練點一下頭或舉手，讓他知道你收到了，再往左邊試著跑。","覺得自己反應太慢，站著責怪自己。"],"best":1,"why":"給教練一個小小的回應（點頭或舉手），他就知道你聽到了，你也能順著指示動起來，場上會更順。假裝沒聽到，教練可能會以為要再喊一次；一直責怪自己，反而更難把心思放回比賽上。","theme":"運動才藝"},{"scene":"投籃時姿勢不太對，教練走過來一次講了好多要改的地方，你覺得腦袋一下子裝不下這麼多。你可以怎麼做？","options":["跟教練說：「可以先告訴我一個最重要的嗎？我一次記一個。」","點頭說好，其實一個都沒記住，回去照舊。","覺得自己什麼都做不好，越聽越沮喪。"],"best":0,"why":"請教練「一次講一個」，你就能專心把一件事練好，記得住也做得到，之後再慢慢加。假裝記住其實沒記，下次可能還是卡在同樣的地方；覺得自己什麼都不行，會讓練習變得更辛苦。","theme":"運動才藝"},{"scene":"這場球賽你們輸了，你很難過，眼淚快要掉下來。你可以怎麼做？","options":["強迫自己不准哭，把難過都壓在心裡。","讓自己哭一下沒關係，然後想想這場比賽哪裡做得不錯、哪裡下次可以更好。","把輸球怪到隊友身上，覺得都是他們害的。"],"best":1,"why":"難過的時候哭出來是很自然的，哭完再回頭看看做得好的地方和可以進步的地方，心情會慢慢平復，也學到東西。硬把難過壓住，情緒可能會憋得更久；把責任怪給隊友，大家會更不開心，也沒辦法一起變強。","theme":"運動才藝"},{"scene":"鋼琴課上台演奏，快輪到你時你的心跳得好快，手心都是汗，好緊張。你可以怎麼做？","options":["因為太緊張，跟老師說你不想上去了。","慢慢深呼吸幾次，告訴自己：緊張很正常，我只要彈我練過的就好。","在心裡一直想「不要彈錯、千萬不要彈錯」。"],"best":1,"why":"深呼吸能讓身體放鬆，提醒自己「彈練過的就好」會把注意力放回音樂上，緊張就沒那麼可怕了。臨時不上去，可能會少了一次為自己加油的經驗；一直想著「不要彈錯」，反而更容易分心。","theme":"運動才藝"},{"scene":"畫畫課上，你畫的樹跟心裡想的不一樣，覺得很醜，很想把整張紙揉掉重畫。你可以怎麼做？","options":["先停一下，看看這張畫有沒有哪個地方其實還不錯，再決定要不要調整那一小塊。","立刻把紙揉成一團丟掉，重新開始。","覺得自己沒有畫畫天分，不想再畫了。"],"best":0,"why":"先找出畫裡不錯的地方，再只修改不滿意的一小塊，你會發現不用整張重來，也更有信心。整張揉掉，之前的努力就沒了；認定自己沒天分而放棄，會錯過越畫越進步的樂趣。","theme":"運動才藝"},{"scene":"足球練習賽你不小心把球踢進了自己的球門，隊友的表情看起來有點失望，你好想找個地方躲起來。你可以怎麼做？","options":["因為太丟臉，跟教練說肚子痛想離開球場。","在場邊發呆，一直想著剛剛那顆球。","深呼吸一下，告訴自己：每個人都會失誤，我把接下來的球守好就行。"],"best":2,"why":"提醒自己「大家都會失誤」，再把心思放到接下來的球上，你就能重新投入比賽，失誤也會慢慢被自己好的表現蓋過去。用肚子痛離開，其實沒有讓心裡好受；一直想著那顆球，可能會影響後面的發揮。","theme":"運動才藝"},{"scene":"直排輪課，同學都已經會轉彎了，只有你還在慢慢練，你覺得自己是不是特別慢。你可以怎麼做？","options":["提醒自己：每個人學會的速度不一樣，我按照自己的步調練就好。","偷偷跟大家比，越比越覺得自己差。","乾脆不練了，反正也追不上別人。"],"best":0,"why":"每個人需要的時間本來就不同，按自己的步調練，你會一點一點進步，也更享受過程。一直跟別人比，容易忘記自己其實有在前進；因為追不上就不練，反而離學會更遠了。","theme":"運動才藝"},{"scene":"游泳課，教練希望你今天試著把頭埋進水裡，可是你有點怕水，一直不敢。你可以怎麼做？","options":["假裝已經做到了，其實頭都沒下去。","跟教練說：「我有點怕，可以先扶著邊邊，讓我慢慢試嗎？」","覺得自己很膽小，站在旁邊不說話。"],"best":1,"why":"把「我有點怕、想慢慢來」告訴教練，他就能用你能接受的方式帶你一步步試，怕水也能慢慢克服。假裝做到了，教練不知道怎麼幫你；因為害怕就不出聲，這份不安可能會一直留著。","theme":"運動才藝"},{"scene":"才藝發表會前的最後一次練習，你彈錯了一個音，老師停下來重新來過。你擔心正式上台也會錯。你可以怎麼做？","options":["因為怕出錯，決定發表會那天請假不去。","跟老師說：「可以在表演結束後再告訴我要改的地方嗎？這樣我上台比較能專心。」","一直在心裡重播剛剛彈錯的地方，越想越慌。"],"best":1,"why":"跟老師說「表演後再給我建議」，你上台時就能專心把整首彈完，不會因為想著錯誤而更緊張，表演完再一起改進。請假不去，會少了一次珍貴的上台經驗；一直重播錯誤，緊張只會越滾越大。","theme":"運動才藝"},{"scene":"你正在玩遊戲，玩得很專心。媽媽走過來說：「快去洗澡。」你心裡知道要去，可是手還停不下來。這時候你可以怎麼做？","options":["假裝沒聽到，繼續玩下去，想說等一下再說","跟媽媽說：「我馬上去，先讓我把這一關停好，大概一分鐘。」","立刻把遊戲關掉，可是心裡很悶，一句話都不想講"],"best":1,"why":"先回應、再說出你需要一點點時間把遊戲收好，媽媽就知道你有在聽、也願意配合，你也不會被打斷得心慌。假裝沒聽到，媽媽可能會以為你不理她而更著急；突然關掉雖然快，但把悶氣憋在心裡，下次會更難開口。","theme":"家裡"},{"scene":"爸爸連續叫了你三次去寫作業，你其實聽到了，只是還沒辦法馬上動起來，爸爸的聲音愈來愈大。這時候你可以怎麼做？","options":["對爸爸說：「我有在聽，只是需要幾秒鐘才能開始，我先寫第一題好嗎？」","什麼都不說，愣在原地，心裡愈來愈緊張","大聲回嘴：「知道了啦！你不要一直唸！」"],"best":0,"why":"說出「我有在聽，只是需要幾秒鐘」能讓爸爸知道你不是故意拖，你也給了自己一個好開始的小步驟。愣著不出聲，爸爸可能不知道你在想什麼而更急；大聲回嘴雖然把情緒發洩出來，可能會讓兩個人都更生氣。","theme":"家裡"},{"scene":"媽媽一口氣交代你：「去收書包、倒垃圾、還有把碗拿去廚房。」你聽到一堆事，腦袋一下子有點打結。這時候你可以怎麼做？","options":["三件事一起做，結果每件都做一半，愈弄愈亂","站著不知道從哪開始，乾脆先滑一下手機","跟媽媽說：「可以一次跟我講一件事嗎？我先做倒垃圾。」"],"best":2,"why":"請媽媽一次講一件、並挑一件先開始，事情就會變得清楚好做，你也比較不會慌。三件一起做容易亂成一團；先滑手機雖然放鬆一下，事情還是卡在那裡，等一下可能更趕。","theme":"家裡"},{"scene":"你被媽媽念了幾句，覺得有點難過，喉嚨緊緊的，快講不出話。這時候你可以怎麼做？","options":["把難過都藏起來，假裝沒事，回房間關上門","先深呼吸一下，跟媽媽說：「我需要先冷靜一下，等一下再跟你講。」","忍不住哭出來，然後開始怪媽媽都不懂你"],"best":1,"why":"先深呼吸、再說出「我需要先冷靜一下」，是照顧自己情緒又不傷害別人的做法，冷靜後你會更能好好把話講清楚。把難過藏起來，悶久了會更不舒服；一邊哭一邊怪對方，話題容易愈扯愈遠，難過也沒被說出來。","theme":"家裡"},{"scene":"你正在看書看得入迷，媽媽突然說：「現在馬上來吃飯。」要你立刻換一件事，你覺得很難轉過來。這時候你可以怎麼做？","options":["跟媽媽說：「我看到這一頁結尾就來，大概再兩分鐘可以嗎？」","繼續看，心想反正媽媽等一下還會再叫","把書用力闔上，氣呼呼地走去餐桌"],"best":0,"why":"說出你需要一點點時間把手邊的事收好、並給一個大概的時間，媽媽通常會願意等，你也能順順地換到下一件事。繼續裝作沒聽到，媽媽可能會覺得你不配合；用力闔上書雖然照做了，但把氣帶到餐桌上，全家都吃得不開心。","theme":"家裡"},{"scene":"你和弟弟搶同一個玩具，弟弟先哭了，爸爸只念了你，你覺得好冤枉。這時候你可以怎麼做？","options":["把玩具搶回來，想說反正被念了，乾脆搶到底","悶著不講，覺得反正說了也沒人信","跟爸爸說：「我覺得有點冤枉，可以聽我說一下剛剛發生什麼嗎？」"],"best":2,"why":"平靜地說出「我覺得冤枉，想說一下經過」，是在幫自己爭取被聽見的機會，爸爸才有辦法了解全部的情況。搶到底會讓場面更亂、也更難解釋；悶著不講，冤枉的感覺會一直卡在心裡，別人也不知道你其實很難過。","theme":"家裡"},{"scene":"你答應媽媽寫完作業就去幫忙，可是作業比想像中難，你卡住了，時間一直過去，媽媽開始不高興。這時候你可以怎麼做？","options":["假裝還在寫，其實已經放棄了，不敢跟媽媽講","跟媽媽說：「這題我卡住了，可以先幫我看一下，還是我先去幫忙、等一下再寫？」","把作業本推開，覺得自己好爛，什麼都不想做了"],"best":1,"why":"把「我卡住了」講出來並提出辦法，媽媽就能幫你，事情也有往前走的方向。假裝在寫，問題還是沒解決，媽媽發現後可能更失望；覺得自己很爛而放棄，只是把難過加在自己身上，其實你只是需要一點幫忙。","theme":"家裡"},{"scene":"早上要出門了，媽媽一直催：「快一點、快一點！」你愈被催愈慌，手忙腳亂，鞋子都穿不好。這時候你可以怎麼做？","options":["對媽媽大叫：「不要再催了啦！」然後更慌","跟媽媽說：「你這樣一直催我會更緊張，可以等我幾秒、慢慢穿好嗎？」","不講話，硬把鞋子塞上，心跳好快、快哭出來"],"best":1,"why":"溫和地說出「一直催我會更緊張，可以等我幾秒嗎」，媽媽才知道怎麼幫你，你也能好好把鞋穿好。大叫雖然把緊張喊出來，可能讓兩個人都更急；硬撐著不說，慌張沒有出口，只會愈來愈難受。","theme":"家裡"},{"scene":"你把房間弄得很亂，媽媽說：「怎麼又這麼亂，都講幾次了。」你心裡也知道，可是看到一堆東西不知道從哪收起。這時候你可以怎麼做？","options":["先撿地上的書就好，跟媽媽說：「我先收一樣，好嗎？」","站在門口發呆，覺得太多了，乾脆不收","回嘴說：「這樣才找得到東西啦！」然後走開"],"best":0,"why":"從一件小事開始、並說出「我先收一樣好嗎」，能讓一大堆事變得做得動，媽媽也會看到你正在努力。發呆不收，房間還是亂、心裡也悶；回嘴走開雖然當下輕鬆，事情沒解決，之後可能又被念。","theme":"家裡"},{"scene":"你正要開始寫功課，妹妹一直來找你玩、拉你的手，你有點被打斷、快靜不下心。這時候你可以怎麼做？","options":["不理妹妹，心裡愈來愈煩，功課也寫不下去","把妹妹推開、對她兇，叫她走遠一點","跟妹妹說：「我先寫完這一頁就陪你玩，你先幫我計時好嗎？」"],"best":2,"why":"跟妹妹約好「寫完這頁就陪你」並給她一件小任務，既顧到自己的功課、也照顧了妹妹的心情，你比較能靜下來。不理她，煩躁會一直累積；把她推開、對她兇，妹妹會難過，你可能事後也會後悔。","theme":"家裡"},{"scene":"你和好朋友在玩桌遊，可是你們對規則的看法不一樣，兩個人都覺得自己是對的，氣氛開始變得有點僵。你可以怎麼做？","options":["先深呼吸，然後說「我們看法不一樣，要不要一起看看說明書，找出對的規則？」","不再說話，把桌遊收起來，自己走去別的地方","大聲說「就是我對，你根本不會玩」，堅持照你的方式玩"],"best":0,"why":"先深呼吸能讓自己冷靜下來，再提議一起查證，就把「誰贏」變成「一起解決」，兩個人都不用輸，友誼也保住了。收起來走開會讓問題卡著沒解決；大聲堅持雖然當下贏了，卻可能讓好朋友心裡不舒服。","theme":"朋友"},{"scene":"下課時，有同學一直學你講話的樣子，還笑你，你覺得很不舒服。你可以怎麼做？","options":["假裝沒事，繼續忍著，心裡卻越來越難過","也想辦法找對方的缺點笑回去，讓他也不好受","看著對方、冷靜地說「我不喜歡被這樣笑，請你停下來」，如果還是繼續，就去告訴老師"],"best":2,"why":"清楚說出「我不喜歡、請停下來」，是讓對方知道你的界線；真的沒有改善時找老師幫忙，是聰明又安全的做法。一直忍著，難過會越積越多；笑回去可能讓兩邊越吵越兇。","theme":"朋友"},{"scene":"午休時同學們分組玩，你發現大家好像都有伴，只剩你一個人，心裡覺得有點孤單。你可以怎麼做？","options":["走到其中一組旁邊，微笑問「我可以跟你們一起玩嗎？」","自己躲到角落，告訴自己「反正沒有人想跟我玩」","站在旁邊生氣，覺得他們故意不找你"],"best":0,"why":"主動、友善地開口問能不能加入，大多數同學都會歡迎你，因為他們常常只是沒注意到你想玩。躲起來會讓孤單感更重；先生氣則可能誤會了同學，其實他們並不是故意的。","theme":"朋友"},{"scene":"班上只剩一顆最喜歡的球，你和同學都想先玩。你可以怎麼做？","options":["搶先把球拿走，先玩再說","乾脆不玩了，把球讓給對方，自己在旁邊悶悶不樂","提議「我們輪流吧，你先玩五分鐘，換我玩五分鐘，好不好？」"],"best":2,"why":"提議輪流，兩個人都玩得到，是公平又能一起開心的辦法。搶先拿走容易讓對方不高興；每次都讓給別人、自己忍著，久了你也會覺得委屈，輪流才是剛剛好。","theme":"朋友"},{"scene":"你不小心弄壞了好朋友借你的鉛筆，朋友知道後看起來很生氣，不想理你。你可以怎麼做？","options":["假裝這件事沒發生，等他自己氣消","真誠地說「對不起，我把你的鉛筆弄壞了，你一定很難過，我會想辦法補給你」","覺得他小氣，心想「不過是一支鉛筆，有什麼好氣的」"],"best":1,"why":"先誠懇道歉、說出你懂他的心情，再提出補救，最能讓朋友感覺被重視，關係也比較快修復。假裝沒事會讓他覺得你不在乎；認為他小氣，則忽略了他的感受，可能讓誤會變更大。","theme":"朋友"},{"scene":"你想加入同學正在踢的球賽，可是他們已經開始玩了，你有點緊張不知道怎麼開口。你可以怎麼做？","options":["深呼吸走過去，趁休息時問「我也想踢，可以讓我加入嗎？」","一直站在旁邊看，希望有人主動來找你","覺得他們一定不會讓你玩，就轉身離開"],"best":0,"why":"先深呼吸再挑一個適合的時機開口問，是勇敢又禮貌的做法，大多時候大家都會答應。一直等別人主動，機會可能一直不來；還沒問就離開，等於自己先放棄了，其實你不知道答案會是好的。","theme":"朋友"},{"scene":"你在分享自己知道的事，同學說「你講錯了，其實不是這樣」。你聽了臉有點紅。你可以怎麼做？","options":["馬上反駁「才沒有錯，你才搞錯」，不想承認","板著臉不說話，覺得很沒面子，之後都不想再發言","說「這樣啊，謝謝你告訴我，那我們一起查一下看看誰說得對」"],"best":2,"why":"把被糾正當成「一起弄清楚」的機會，願意查證，你會學到更多，也不用一直卡在面子上。急著反駁可能其實是你弄錯了；因為害羞就不再開口，會讓你錯過分享的樂趣，說錯本來就是學習的一部分。","theme":"朋友"},{"scene":"幾個同學要你一起在牆上亂畫，說「不畫就不跟你好」，可是你覺得這樣不對，也不想做。你可以怎麼做？","options":["雖然不願意，還是照著做，怕不做會沒有朋友","堅定地說「我不想這樣做，這樣不對，我們去玩別的吧」","什麼都不說，偷偷跟著他們，希望不要被發現"],"best":1,"why":"就算是朋友邀你，你也有權利說「不」；堅定拒絕、再提議別的玩法，是保護自己也對大家好的做法。勉強照做會讓你心裡不安，真正的朋友不會用「不跟你好」來逼你；偷偷跟著做，一樣要承擔後果。","theme":"朋友"},{"scene":"你和同學為了一件小事吵起來，你越來越生氣，覺得快要忍不住想大吼了。你可以怎麼做？","options":["先深呼吸幾下，或先離開一下下，等冷靜了再回來把話說清楚","立刻大吼回去，把心裡的氣一次發洩出來","把氣全部吞下去，假裝沒關係，其實心裡很不平"],"best":0,"why":"生氣時先深呼吸或暫時離開一下，是給自己冷靜的時間，等情緒緩下來再談，比較不會說出傷人的話。當場大吼常會讓事情更糟；把氣全吞下去，難受的感覺並不會消失，之後可能更委屈。","theme":"朋友"},{"scene":"你發現好朋友最近常常和別的同學一起玩，比較少找你，你心裡酸酸的。你可以怎麼做？","options":["生氣地不理他，也故意去和別人玩，讓他也嘗嘗這種感覺","找機會誠實地說「你最近比較少找我，我有點想念以前一起玩的時候，我們可以約時間玩嗎？」","什麼都不說，自己一個人難過，猜想他是不是不喜歡你了"],"best":1,"why":"把心裡的想念用「我覺得……我們可以……嗎？」溫和說出來，朋友才知道你的感受，也有機會一起安排相處。故意不理他容易讓兩個人越走越遠；只是自己猜測，往往越想越難過，其實他可能只是最近多認識了新朋友，並沒有不喜歡你。","theme":"朋友"},{"scene":"你在寫作業，題目一直算錯，一股怒氣衝上來，好想把鉛筆摔在地上。這時候，你可以怎麼做？","options":["先停下來，慢慢深呼吸三次，讓自己緩一緩，再回來看這一題","把鉛筆用力摔到地上，反正這題本來就很爛","覺得自己怎麼一直錯，越想越氣，把作業推到一邊不想再寫"],"best":0,"why":"生氣的時候，慢慢的深呼吸可以幫身體先冷靜下來，頭腦才想得清楚，接著再回來面對題目會輕鬆很多。摔東西可能會讓你更煩，或弄壞了東西又多一件要處理的事；把作業推開不寫，題目還在那裡，心裡的煩也沒真的消失，其實算錯只是還沒找到方法，不代表你不好。","theme":"情緒與犯錯"},{"scene":"上台報告前，你的心臟跳得好快，手心也在冒汗，覺得自己好緊張。這時候，你可以怎麼做？","options":["假裝自己一點都不在乎，告訴自己「緊張很丟臉」","對自己說「我會緊張，是因為我很在乎、想把它做好」，然後慢慢吸一口氣","想著「我一定會忘詞、一定會出糗」，越想越怕"],"best":1,"why":"緊張其實是因為你在乎這件事，把它想成「我很想做好」，心裡會比較安定，再配上一個慢慢的呼吸就更穩了。硬要自己「不准在乎」通常壓不住緊張，還會更卡；一直想像失敗則會讓身體更緊，反而更難發揮。","theme":"情緒與犯錯"},{"scene":"你不小心把牛奶打翻，弄濕了同學的課本，好幾個人都轉頭看你，你的臉一下子紅了。這時候，你可以怎麼做？","options":["假裝沒看到，趕快走開，希望沒有人發現是你","小聲怪旁邊的同學「是你撞到我的」","深呼吸一下，跟同學說「對不起，我幫你把課本擦乾」，再一起想辦法"],"best":2,"why":"先深呼吸讓自己不那麼慌，再說對不起並動手幫忙，事情就會往「一起解決」的方向走，同學也更容易諒解。走開會讓問題留在那裡沒被處理；把責任推給別人，通常會讓誤會變大、心裡也更不舒服。犯錯是每個人都會遇到的事，願意面對，事情就會慢慢好起來。","theme":"情緒與犯錯"},{"scene":"老師突然點你回答問題，你的腦袋一下子一片空白，什麼都想不起來，心裡好慌。這時候，你可以怎麼做？","options":["跟老師說「我需要一點時間想一下」，然後慢慢吸一口氣","覺得「我怎麼這麼沒用」，越急越想不出來","低著頭一直不說話，希望老師趕快跳過我"],"best":0,"why":"腦袋突然當機、一片空白是很正常的，不是你的錯。跟老師說「我需要一點時間」並深呼吸，能替自己按下暫停鍵，過幾秒念頭常常就回來了。急著怪自己只會讓你更慌、更想不出來；一直低頭不出聲，慌張的感覺也會一直卡著。","theme":"情緒與犯錯"},{"scene":"你很努力練習的比賽，最後還是沒有得名，一股失望湧上來，眼淚在眼眶裡打轉。這時候，你可以怎麼做？","options":["怪自己「練那麼久還輸，真沒用」","告訴自己「不可以哭，要忍住」，用力把眼淚忍回去","讓自己好好難過一下，哭出來也沒關係，等心情緩一點再想想這次學到了什麼"],"best":2,"why":"失望的時候想哭是很自然的，哭出來能讓心情慢慢放鬆，這一點也不丟臉。等情緒緩下來，再看看這次練習讓自己進步了哪裡，努力就不會白費。急著怪自己會把難過變得更重；硬把眼淚忍回去，難過並不會消失，只是被壓著，其實讓自己好好感受一下反而好得比較快。","theme":"情緒與犯錯"},{"scene":"你和好朋友吵架，一肚子火，很想馬上回他幾句很兇的話。這時候，你可以怎麼做？","options":["先離開現場幾分鐘，喝口水、深呼吸，等火氣小一點再談","立刻用最兇的話回他，讓他也不好受","把氣悶在心裡，決定以後再也不理他"],"best":0,"why":"很生氣的時候先幫自己按暫停，離開一下、深呼吸，等火氣退了頭腦才清楚，這時再談比較不會說出後悔的話。氣頭上互相說重話，常常會讓兩個人都更受傷；把氣一直悶著，心裡的不舒服也不會不見，還可能弄丟一段友情。","theme":"情緒與犯錯"},{"scene":"考卷發下來，分數比你想的低很多，你覺得好丟臉，好想把考卷藏起來不讓別人看到。這時候，你可以怎麼做？","options":["把考卷揉成一團丟掉，當作沒有這回事","覺得「我就是學不會，再怎麼努力都沒用」","先深呼吸接受這個分數，再把錯的題目看一遍，把它當成「這裡我還可以再學」的線索"],"best":2,"why":"分數不理想時心情低落很正常，先深呼吸接受它，再把錯的地方看成「還可以再學」的線索，下次就有機會進步。錯誤是用來學習的提示，不代表你這個人不好。把考卷丟掉，不懂的地方還是在那裡；一直說「我學不會」則會讓自己更沒力氣，其實你只是還在學的路上。","theme":"情緒與犯錯"},{"scene":"你排隊排了好久，快輪到你的時候被插隊了，你氣得整張臉發燙，很想大叫。這時候，你可以怎麼做？","options":["直接推開對方，搶回自己的位置","忍著不出聲，可是心裡越想越氣，一整天都不開心","先深呼吸一下，然後好好地跟對方說「不好意思，我排在你前面喔」"],"best":2,"why":"先深呼吸讓自己不被怒氣沖昏頭，再清楚、有禮貌地說出自己的權益，多半能把事情講開，自己也不會受傷。動手推人可能會演變成衝突，讓場面更難收拾；一直忍著不說，氣會悶在心裡跑不掉，其實把話好好講出來，心情會輕鬆很多。","theme":"情緒與犯錯"},{"scene":"你在很多人面前唸課文，念錯了一個字，同學笑了出來，你的臉一下子好燙，好想馬上跑掉。這時候，你可以怎麼做？","options":["對自己說「唸錯一個字很正常」，深呼吸一下，再接著把後面念完","覺得「大家都在笑我，我好丟臉」，站在原地不敢動","乾脆不念了，把書一合坐下來"],"best":0,"why":"每個人念東西都會偶爾念錯，這很正常。對自己說一句「沒關係」再深呼吸，就能把注意力拉回來繼續念完，練習就完成了。一直想著「大家都在笑我」會讓自己更緊張、更卡；直接放棄不念，雖然當下鬆一口氣，卻少了一次把它念完、給自己加分的機會。","theme":"情緒與犯錯"},{"scene":"今天發生好多事，功課寫不完，房間又亂，你覺得腦袋塞得滿滿的，快要爆炸了，不知道要從哪裡開始。這時候，你可以怎麼做？","options":["對自己生氣「怎麼連這點事都處理不好」","什麼都不想做，躺著一直滑手機，讓事情越積越多","先停下來深呼吸，跟自己說「一次做一件就好」，然後挑一件最小、最簡單的先開始"],"best":2,"why":"事情太多讓人喘不過氣時，先按暫停、深呼吸，再提醒自己「一次做一件就好」，從最小的一件開始，滿出來的感覺就會慢慢變小。對自己生氣只會讓壓力更大；一直逃避，事情越積越多，心裡也會更慌，先動手做一小步反而最能幫到你。","theme":"情緒與犯錯"}];
  function $(id){ return document.getElementById(id); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  var THEME_EMOJI = { '校園':'🏫','運動才藝':'⚽','家裡':'🏠','朋友':'🧑‍🤝‍🧑','情緒與犯錯':'🌈' };

  var themes=[]; SCENARIOS.forEach(function(s){ if(themes.indexOf(s.theme)<0) themes.push(s.theme); });
  function renderMenu(){
    var html='';
    html+='<button type="button" class="cn-lesson" data-theme="__all__">'+
      '<span class="cn-lesson-top"><span class="cn-lesson-emoji" style="background:var(--su-tint)" aria-hidden="true">🎲</span><span class="cn-lesson-name">全部混合（'+SCENARIOS.length+' 題）</span></span>'+
      '<span class="cn-lesson-sub">各種情境打散一起練</span></button>';
    themes.forEach(function(t){
      var n=SCENARIOS.filter(function(s){return s.theme===t;}).length;
      html+='<button type="button" class="cn-lesson" data-theme="'+t+'">'+
        '<span class="cn-lesson-top"><span class="cn-lesson-emoji" style="background:var(--su-tint)" aria-hidden="true">'+(THEME_EMOJI[t]||'💡')+'</span><span class="cn-lesson-name">'+t+'（'+n+' 題）</span></span>'+
        '<span class="cn-lesson-sub">這個主題的情境練習</span></button>';
    });
    $('theme-list').innerHTML=html;
    Array.prototype.forEach.call($('theme-list').querySelectorAll('.cn-lesson'), function(b){
      b.addEventListener('click', function(){ start(b.getAttribute('data-theme')); });
    });
  }

  var queue=[], pos=0, answered=false, curTheme='';
  function show(name){ $('screen-menu').classList.toggle('active', name==='menu'); $('screen-play').classList.toggle('active', name==='play'); try{window.scrollTo(0,0);}catch(e){} }
  function start(theme){
    curTheme=theme;
    var pool = theme==='__all__' ? SCENARIOS.slice() : SCENARIOS.filter(function(s){return s.theme===theme;});
    queue = shuffle(pool.slice()); pos=0;
    $('play-title').textContent = (theme==='__all__'?'全部混合':theme)+' 💡';
    show('play'); renderItem();
  }
  function renderItem(){
    if(pos>=queue.length){ return renderDone(); }
    answered=false;
    var it=queue[pos];
    var order=[0,1,2]; shuffle(order);
    var opts='';
    order.forEach(function(oi){ opts+='<button type="button" class="cn-opt" data-i="'+oi+'">'+it.options[oi]+'</button>'; });
    $('stage').innerHTML =
      '<div class="cn-card">'+
        '<span class="pr-count">第 '+(pos+1)+' / '+queue.length+' 題</span>'+
        '<div class="pr-scene">'+it.scene+'</div>'+
        '<div class="pr-ask">你可以怎麼做？</div>'+
        '<div class="cn-options" id="opts">'+opts+'</div>'+
        '<div class="cn-reveal" id="rev" aria-live="polite"></div>'+
      '</div>'+
      '<div class="cn-actions" id="after" style="display:none"><button type="button" class="btn btn-primary btn-block" id="next">下一題 ➡️</button></div>';
    Array.prototype.forEach.call($('opts').querySelectorAll('.cn-opt'), function(btn){
      btn.addEventListener('click', function(){ choose(parseInt(btn.getAttribute('data-i'),10)); });
    });
  }
  function choose(i){
    if(answered) return; answered=true;
    var it=queue[pos];
    try{ if(window.Game && typeof Game.pingActive==='function') Game.pingActive(); }catch(e){}
    Array.prototype.forEach.call($('opts').querySelectorAll('.cn-opt'), function(btn){
      var bi=parseInt(btn.getAttribute('data-i'),10);
      btn.disabled=true;
      if(bi===it.best){ btn.classList.add('best'); btn.insertAdjacentText('beforeend','  🌟'); }
      if(bi===i && i!==it.best){ btn.classList.add('picked'); }
    });
    var head = (i===it.best) ? '🌟 這個做法最能幫到你！' : '🌟 最能幫到你的做法，是亮起來標星星的那個～你選的也想過了，很好。';
    var rev=$('rev'); rev.textContent = head+' '+it.why; rev.classList.add('show');
    $('after').style.display='flex';
    $('next').onclick=function(){ pos++; renderItem(); };
    try{ $('next').focus(); }catch(e){}
  }
  function renderDone(){
    $('stage').innerHTML =
      '<div class="cn-card" style="text-align:center">'+
        '<div style="font-size:60px">🎉</div>'+
        '<h2 class="cn-h">你把這一輪 '+queue.length+' 個情境都練過了！</h2>'+
        '<p class="cn-text" style="text-align:center">每次想「我可以怎麼做」，都是在幫自己多準備一個好辦法。想再練，隨時回來。</p>'+
      '</div>'+
      '<div class="cn-actions"><button type="button" class="btn" id="again">再練一輪</button><button type="button" class="btn btn-primary" id="menu">換個主題</button></div>';
    $('again').onclick=function(){ start(curTheme); };
    $('menu').onclick=function(){ show('menu'); };
  }
  $('btn-back').addEventListener('click', function(){ show('menu'); });
  renderMenu(); show('menu');
})();
</script>
</body>
</html>
