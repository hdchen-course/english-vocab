    <div class="cn-hello"><span class="cn-mascot" aria-hidden="true">🫧</span>
      <div><div class="cn-htext" id="hello">心情會起起伏伏，這很正常。這裡教你一些<b>照顧自己、也把心裡的話說出來的小本領</b>：怎麼表達自己、遇到困難怎麼開口求助、被指正或被念的時候怎麼接住自己、還有快哭出來時先做什麼。</div>
      <div class="cn-hsub">每一課都是「先懂這個本領 → 學會怎麼做 → 換你試試」。這些本領人人都用得上，慢慢練就好。</div></div></div>
    <div class="cn-lessons" id="lesson-list"></div>
    <a class="cn-nextup" href="self_protection.html"><span class="cn-nextup-ic" aria-hidden="true">🔎</span><span>學會照顧心情後，也來練「留心眼・觀察與自我保護」→</span></a>
    <p class="cn-note">這裡是「先學本領」的教學小旅程，只留在你的裝置上，不影響學習基地的等級或經驗值。</p>

<script>
window.CONCEPT = {"progKey":"emotion_skills_concepts_v1","lessons":[{"id":"emo_mistake","name":"犯錯不等於我不好","emoji":"🌱","sub":"錯誤是幫你進步的線索，不是判你有罪的判決","done":"記住這句：這次錯了，只代表這裡還沒學會，不代表我不好。","color":"#0d9488","steps":[{"type":"teach","kicker":"這個本領","title":"錯誤是資料，不是判決","text":"很多人一犯錯，腦袋就冒出一句「我好爛」。但仔細想想，<b>犯錯只是告訴你「這個地方還沒學會」</b>，它像一張小紙條，寫著「下次可以改這裡」。它<b>不是在說你這個人不好</b>。連厲害的球員、科學家，都是靠一次次犯錯，才知道怎麼做會更好。<b>會犯錯，正是你正在學新東西的證明。</b>","svg":""},{"type":"teach","kicker":"怎麼做","title":"把「我好爛」換成「我學到了」","text":"錯的當下，先在心裡把話換一句：不是「我好爛」，而是<b>「我剛剛學到一件事」</b>。然後問自己一個小問題：<b>「下次哪裡可以做不一樣？」</b>例如投籃沒進，線索可能是「手再抬高一點」；考卷錯了，線索是「這一題的算法我要再練」。把注意力放在<b>「下一步怎麼做」</b>，而不是<b>「我是不是很糟」</b>，心情會鬆很多，也真的會愈來愈進步。","svg":""},{"type":"quiz","kicker":"換你試試","title":"小宇在才藝課彈鋼琴，同一個地方彈錯了兩次，他心裡最好怎麼想？","options":["我果然沒天分，乾脆別學了","這兩個音我還不熟，等一下多練這幾小節就好","希望老師沒發現，趕快混過去"],"answer":1,"why":"把彈錯看成「這幾小節還不熟」的線索，就會知道接下來要多練哪裡，能力才會真的變好；認定自己沒天分而想放棄，會讓人停下來、不再進步；只想矇混過去，錯的地方沒被修正，下次還是會卡在同一個音。"}]},{"id":"emo_feedback","name":"被指正時怎麼接住","emoji":"🎯","sub":"大人糾正你，多半是想幫你變強，不是討厭你","done":"記住這句：他願意糾正我，是因為想幫我變好。","color":"#0d9488","steps":[{"type":"teach","kicker":"這個本領","title":"糾正常常是一種幫忙","text":"被教練或老師當場指出「這裡要改」，心裡難免會揪一下，好像被罵了。但換個角度看：<b>他會停下來教你，通常是因為在意你、想幫你變更好。</b>如果他完全不理你，你反而學不到東西。<b>指正的是「這件事的做法」，不是在說「你這個人不行」。</b>把這兩件事分開，就不會覺得整個人被否定了。","svg":""},{"type":"teach","kicker":"怎麼做","title":"先接住，再挑對我有用的","text":"聽到指正時，先做一個小動作：<b>點個頭、說一聲「好」</b>，讓對方知道你收到了，也讓自己有一秒鐘穩下來。接著在心裡把話當成<b>「一個可以試試看的建議」</b>：想想「他要我改的是哪一個動作？」然後<b>挑一件先做做看</b>。如果沒聽懂，可以問「你是說我要怎麼做呢？」——<b>會問問題，代表你很認真，想把它學會。</b>","svg":""},{"type":"quiz","kicker":"換你試試","title":"打球時教練在場邊大聲說：「傳球前先抬頭看隊友！」小杰聽了心裡一沉，這時最好怎麼做？","options":["覺得被兇了，低頭不說話，也不想再傳球","先點頭說「好」，下一球試著抬頭看一下再傳","覺得教練針對我，愈想愈氣，乾脆不想打了"],"answer":1,"why":"點頭回應再試著照做，既讓教練知道你收到了，也真的把建議用上，球會愈打愈好；把指正當成被兇而不出聲，會漏掉能讓自己變強的提示；認定教練針對你而生氣罷打，既沒學到東西，也讓自己更難受。"}]},{"id":"emo_scolded","name":"被大人念的時候怎麼辦","emoji":"🫧","sub":"被念到心情很滿、說不出話，是正常的，可以先接住自己","done":"記住這句：我有在聽，只是需要一點時間，等我平靜一下再說。","color":"#0d9488","steps":[{"type":"teach","kicker":"這個本領","title":"低頭不出聲，不是不在乎","text":"被大人一直念的時候，如果你會<b>低下頭、說不出話、腦袋一片空白</b>，這其實很正常，叫做「被念到當機」。這不是你故意頂嘴，也不是你不在乎——正好相反，你其實<b>都有聽進去</b>。當心情一下子太滿、眼淚快掉下來的時候，大腦會忙著幫你穩住情緒，嘴巴就一時說不出話。這不是你的錯，也不代表你很糟。","svg":""},{"type":"teach","kicker":"怎麼做","title":"先接住自己，再慢慢回應","text":"第一步，<b>慢慢深呼吸幾下</b>，在心裡跟自己說一句安撫的話，像是「我沒事，我只是有點難過」。第二步，如果說得出口，就用一句話讓大人知道你的狀況，例如「我有在聽，只是現在有點難過，等一下再說好嗎」。第三步，等心情退一點、比較平靜了，再一起想「下次可以怎麼做」。記得：<b>被念不代表你是壞小孩</b>，只是這件事大人希望能不一樣。","svg":""},{"type":"quiz","kicker":"換你試試","title":"媽媽因為你忘了寫作業一直念你，還說一個禮拜不能看電視。你胸口悶悶的、快哭出來、講不出話。這時候先怎麼做最好？","options":["先慢慢深呼吸幾下讓自己穩一點，把重點聽進去，等心情比較平了再說「我知道了，我下次會先把作業寫完」","心裡一直想「反正我就是最爛」，然後更用力低著頭、什麼都不說","覺得很煩，回一句「你很吵耶」，把媽媽的話頂回去"],"answer":0,"why":"先深呼吸能讓快滿出來的情緒退一點，這樣才聽得進媽媽真正在意的重點——作業；等平靜再回應，事情就能好好解決。想著「我就是最爛」會把情緒憋成自責，讓心情越來越沉，問題也沒解決。把情緒變成頂嘴，容易讓場面更僵、媽媽更生氣，作業的事反而被忘掉。健康的做法是先穩住自己、聽進重點，再慢慢表達。"}]},{"id":"emo_signal","name":"讓大人知道我有在聽","emoji":"👀","sub":"一個小回應，勝過一片安靜","done":"記住這句：看他一眼、點個頭、說聲「好」，就是告訴他「我收到了」。","color":"#0d9488","steps":[{"type":"teach","kicker":"這個本領","title":"一個小信號，讓大人放心","text":"當大人跟你說話、你還來不及回應時，他<b>沒辦法知道你是「在聽」還是「沒聽到」</b>，於是可能會再講一次、或講更大聲。其實只要給一個<b>小小的回應信號</b>，情況就不一樣了——對方會知道「他收到了」，就會放心，也不會一直重複。","svg":""},{"type":"teach","kicker":"怎麼做","title":"幾個超簡單的回應信號","text":"就算你緊張到說不出長句子，也可以用這幾招其中一個：<b>點點頭</b>、<b>比個讚（豎起大拇指）</b>、<b>說一個字「好」</b>，或是<b>朝對方的方向看一下</b>（看臉、看肩膀都行，看向別處也沒關係）。這些都只要一兩秒，就能傳達「我有在聽」。<b>如果這一刻你連點頭都做不到，那也完全沒關係，不是你的錯</b>——等你比較穩了，事後再讓對方知道「我剛剛有聽到」也可以。先從最容易的開始，慢慢就會愈來愈自然。","svg":""},{"type":"quiz","kicker":"換你試試","title":"老師走過來提醒小安：「等一下上台，記得先深呼吸喔。」小安緊張到不太想講話，這時怎麼回應最好？","options":["什麼都不做、也不出聲，繼續盯著地板","點點頭，或說一聲「好」，讓老師知道我收到了","假裝沒聽到，希望老師快點走開"],"answer":1,"why":"點頭或一句「好」，只要兩秒，就能讓老師知道提醒收到了，不會再反覆叮嚀；什麼都不做、也不出聲，老師會不確定你到底聽到了沒，可能又講一次；假裝沒聽到則會錯過對自己有用的提醒。真的說不出話的時候，事後再讓老師知道也可以。"}]},{"id":"emo_reset","name":"快哭出來時先做這件事","emoji":"🌬️","sub":"心情太滿的時候，先按一下暫停鍵","done":"記住這句：眼淚快滿出來時，先深呼吸三次，再決定下一步。","color":"#0d9488","steps":[{"type":"teach","kicker":"這個本領","title":"情緒像水，會滿也會退","text":"被指正或做錯事時，胸口悶悶的、眼淚在打轉，這是<b>非常正常</b>的身體反應，代表你很在乎。<b>哭出來也完全沒關係，那不丟臉。</b>只是當情緒像水快要滿出來時，我們可以先做一件小事，讓自己不被沖走——就是<b>按下暫停鍵，給情緒幾秒鐘退一點</b>，等頭腦清楚一些，再決定要怎麼做。","svg":""},{"type":"teach","kicker":"怎麼做","title":"三口氣＋一句話","text":"感覺快撐不住時，試試看：<b>慢慢吸氣數到四，停一下，再慢慢吐氣數到四，做三次</b>。吐氣時想像把緊繃一起吹出去。同時在心裡跟自己說一句：<b>「沒事，我先呼吸，等一下就好一點。」</b>如果需要，跟大人說「我需要一分鐘」，走到旁邊喝口水也可以。<b>暫停不是逃避，是讓自己有能力繼續。</b>","svg":""},{"type":"quiz","kicker":"換你試試","title":"比賽輸了，小圓覺得眼淚快掉下來、胸口很悶，這一刻她最好先做什麼？","options":["用力忍住，告訴自己「不准哭，哭很丟臉」","先慢慢深呼吸幾次，讓自己稍微穩下來，哭出來也沒關係","把難過都怪到隊友頭上，大聲說是他們害的"],"answer":1,"why":"先深呼吸能讓滿出來的情緒退一點、身體慢慢穩下來，之後不管想哭還是想講話都比較有力氣；硬逼自己「不准哭」會讓情緒憋得更緊、更難受；把責任怪到隊友身上會傷了感情，難過也並不會因此消失。"}]},{"id":"emo_say","name":"說出來比悶著好","emoji":"💬","sub":"一句簡單的話，就能讓別人懂你","done":"記住這句：「我剛剛沒聽到」「等一下再跟我說」——說出來，別人就懂了。","color":"#0d9488","steps":[{"type":"teach","kicker":"這個本領","title":"別人不會讀心術","text":"心裡明明有話——「我沒聽清楚」「我現在有點難過，想等一下」——但如果只是悶在心裡不出聲，<b>對方是猜不到的</b>，甚至可能誤會你在生氣或不理人。其實你<b>不用忍、也不用裝沒事</b>，只要用一句簡單的話把狀況說出來，事情往往就順了。<b>會表達，是一種照顧自己也照顧別人的能力。</b>","svg":""},{"type":"teach","kicker":"怎麼做","title":"三句好用的話，先背起來","text":"遇到不同狀況，可以直接用這三句：沒聽清楚時說<b>「我剛剛沒聽到，可以再說一次嗎？」</b>；需要一點時間時說<b>「我知道了，等一下再跟我說好嗎？」</b>；心情不好時說<b>「我現在有點難過，先讓我靜一下。」</b>語氣<b>平平的、好好講</b>就可以，不用兇也不用道歉。先挑一句最容易的，下次真的用一次看看。","svg":""},{"type":"quiz","kicker":"換你試試","title":"媽媽在旁邊講怎麼收拾房間，小豪正在專心找東西、其實沒聽清楚，他最好怎麼說？","options":["什麼都不說，繼續找，假裝有聽到","「我剛剛在忙沒聽清楚，可以再說一次嗎？」","不耐煩地大喊「很吵欸不要唸了！」"],"answer":1,"why":"直接說出「沒聽清楚、請再說一次」，媽媽就知道要重講，事情也不會漏掉；假裝有聽到，之後做錯或漏做，反而更麻煩；不耐煩地大喊會傷到對方，也把單純的「沒聽到」變成一場衝突。"}]},{"id":"emo_askhelp","name":"說出來，就有人幫你","emoji":"🙋","sub":"想講的話、需要的幫忙，說出來大人才會知道。","done":"記住這句：求助不是弱，是聰明。","color":"#0d9488","steps":[{"type":"teach","kicker":"這個本領","title":"說出來，大人才會知道","text":"有時候你心裡有話想講，或是需要一點幫忙，可是沒說出來，大人其實<b>猜不到</b>。你不用一直忍著，也不用等別人發現——把它<b>說出來</b>，大人才知道怎麼幫你。每個人都會遇到需要幫忙的時候，這<b>很正常</b>，大人小孩都一樣。慢慢講也沒關係，你需要一點時間想清楚，是很自然的事。","svg":""},{"type":"teach","kicker":"怎麼做","title":"找對的人、對的時機，借幾句話開口","text":"先找一個你<b>信任的大人</b>，等他比較有空、比較平靜的時候再說，這樣他能好好聽你講。開口不知道怎麼說，可以直接借這幾句：「我遇到一個問題，可以幫我嗎？」「這個我不太會，可以教我怎麼做嗎？」你也可以告訴大人<b>怎麼幫你最順</b>：「可以等我幾秒鐘、再說一次嗎？」「可以一次跟我講一件事嗎？」「我需要先冷靜一下，等一下再說好嗎？」「可以陪我一起開始嗎？」這些話你都可以照著用。","svg":""},{"type":"quiz","kicker":"換你試試","title":"大人一口氣交代了三件事，你有點跟不上，腦袋一團亂。這時候最好怎麼做？","options":["什麼都不說，硬記，結果漏掉兩件","跟大人說：「可以一次跟我講一件事嗎？我這樣比較記得住。」","覺得煩，大聲抱怨「你講太快了啦！」然後不做"],"answer":1,"why":"跟大人說「一次講一件事」，等於把自己需要的方式清楚說出來，大人就能配合你，事情反而更容易做完、也不容易出錯。什麼都不說硬記，訊息太多會漏掉，之後還要重來；用鬧的抱怨，話裡的重點大人接收不到，問題還是沒解決。把需要說清楚，事情就會順很多。","svg":""}]},{"id":"emo_focus","name":"專心時聽不進旁邊的話很正常","emoji":"🎧","sub":"事情做完再聽建議，先跟大人約個暗號","done":"記住這句：專心的時候聽不進去很正常，事後再聽，我一樣學得到。","color":"#0d9488","steps":[{"type":"teach","kicker":"這個本領","title":"專心時耳朵會「關小聲」","text":"當你正在上場打球、上台表演、認真做一件事時，腦袋會把注意力全放在手上的事，<b>旁邊的話真的會聽不太進去</b>——這不是你沒禮貌，也不是故意不理人，而是<b>人在專心時很自然的現象</b>。所以場邊突然給的建議，當下沒完全接收到，很正常。重點是：<b>那些建議可以「事後」再好好聽</b>，你不會因此就學不到。","svg":""},{"type":"teach","kicker":"怎麼做","title":"和大人約一個暗號","text":"事先跟教練或爸媽<b>約好一個暗號</b>，會讓彼此都輕鬆。例如講好：<b>「比賽中你喊重點就好，細節我們賽後再談。」</b>或約一個手勢，代表「我收到了，等一下再說」。真的沒聽到時，事後主動說一句<b>「剛剛太專心沒聽清楚，你要提醒我什麼？」</b>。這樣大人知道你不是不理他，你也能在<b>能專心聽的時候</b>好好把建議學起來。","svg":""},{"type":"quiz","kicker":"換你試試","title":"跑大隊接力時，小凱正全力衝刺，沒聽清楚教練在旁邊喊什麼，比賽結束後他最好怎麼做？","options":["算了，反正沒聽到，就當作沒這回事","主動去問教練：「剛剛你在喊什麼？我太專心沒聽到」","覺得自己很爛，連話都聽不到，開始難過自責"],"answer":1,"why":"賽後主動去問，就能在能專心聽的時候把教練的提醒補回來，下次跑得更好；當作沒這回事會白白錯過有用的建議；因為「衝刺時沒聽到」而自責，其實那是專心時很正常的現象，不需要責怪自己。"}]},{"id":"emo_nerves","name":"把緊張變隊友","emoji":"⚡","sub":"會緊張，代表你很在乎這件事","done":"記住這句：緊張不是敵人，它是提醒我「我很在乎」的隊友。","color":"#0d9488","steps":[{"type":"teach","kicker":"這個本領","title":"緊張其實在幫你","text":"上場前、上台前心跳變快、手心冒汗，很多人以為「我完蛋了、我不行」。其實<b>緊張是身體在幫你準備</b>：它把能量集中起來，讓你更專注、反應更快。<b>會緊張，正是因為你在乎、想把事情做好。</b>連很厲害的選手和演員上場前也會緊張——差別只在於，他們<b>把緊張當成隊友，而不是敵人</b>。","svg":""},{"type":"teach","kicker":"怎麼做","title":"換句話＋做準備動作","text":"感覺緊張時，先換一句話：不是「我好怕、我不行」，而是<b>「我有點興奮，因為我在乎這件事」</b>。這一句話，能把同樣的心跳從「威脅」變成「準備好了」。再配一個小小的<b>準備動作</b>：深呼吸一口、做一次平常練習的動作、告訴自己「盡力就好，不用完美」。把注意力放在<b>「等一下第一步要做什麼」</b>，緊張就會慢慢變成專注。<b>如果緊張一直往上衝、覺得快要太多了，那也很正常</b>——這時就換成慢慢深呼吸、先暫停一下，把它降下來就好。","svg":""},{"type":"quiz","kicker":"換你試試","title":"上台演講前，小妤心跳很快、手在抖，她最好怎麼想、怎麼做？","options":["「我一定會搞砸」，愈想愈慌，很想逃走","深呼吸一口，告訴自己「我會緊張是因為我很在乎，盡力講就好」","硬叫自己「不准緊張」，結果反而更緊繃"],"answer":1,"why":"把緊張解讀成「我很在乎」並配上深呼吸，能讓身體的能量變成專注、幫助自己表現；一直想「我會搞砸」會讓慌張愈滾愈大；命令自己「不准緊張」反而把注意力全放在緊張上，通常會更緊繃。"}]}]};
