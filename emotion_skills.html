  <section id="screen-menu" class="cn-screen active cn-wrap">
    <div class="cn-topbar"><span class="cn-title">心情練習場・照顧情緒的本領 🫧</span></div>
    <div class="cn-hello"><span class="cn-mascot" aria-hidden="true">🫧</span>
      <div><div class="cn-htext" id="hello">心情會起起伏伏，這很正常。這裡教你一些<b>照顧自己、也把心裡的話說出來的小本領</b>：怎麼表達自己、遇到困難怎麼開口求助、被指正或被念的時候怎麼接住自己、還有快哭出來時先做什麼。</div>
      <div class="cn-hsub">每一課都是「先懂這個本領 → 學會怎麼做 → 換你試試」。這些本領人人都用得上，慢慢練就好。</div></div></div>
    <div class="cn-lessons" id="lesson-list"></div>
    <a class="cn-nextup" href="emotion_practice.html"><span class="cn-nextup-ic" aria-hidden="true">💡</span><span>學會這些本領後，來「這時候我可以怎麼做」情境演練場實戰 →</span></a>
    <a class="cn-nextup" href="safety.html#communication"><span class="cn-nextup-ic" aria-hidden="true">🤍</span><span>心情很悶、覺得撐不住的時候，這裡有更多方法和可以找的人 →</span></a>
    <p class="cn-note">這裡是「先學本領」的教學小旅程，只留在你的裝置上，不影響學習基地的等級或經驗值。</p>

    <div class="cn-topbar"><button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button><span class="cn-title" id="play-title">心情練習場</span></div>
