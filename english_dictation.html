<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文聽寫</title>
<!-- 引擎資產先載（app.css / game_core.css / game_core.js / srs_engine.js），本頁樣式 dictation.css 在後；
     game_core.js 於 <head> 同步載入注入 HUD＋夜間模式。與全站 flashcard 家族一致。
     本頁可載入資產白名單（§10.2 R9 a'）：app.css / game_core.css / game_core.js / srs_engine.js /
     dictation.css / dictation.js / dict_data_*.js + audio/*.mp3。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<script src="assets/srs_engine.js"></script>
<link rel="stylesheet" href="dictation.css">
<style>
/* 本頁強調色三件組 → 英語科目色（其餘樣式一律在 dictation.css 的 dct-*）。 */
:root { --accent: var(--c-english); --accent-tint: var(--tint-english); --accent-ink: var(--c-english-ink); }
body { font-family: var(--font); min-height: 100vh; background: var(--bg); color: var(--ink); overflow-x: hidden; }
</style>
</head>
<body>
<!-- ===== 共用頂部應用列（全站一致） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">英文聽寫 🎧</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

<!-- ===== 選單 ===== -->
<section id="dct-screen-menu">
  <div class="dct-intro">
    <span class="dct-emoji">🎧✍️</span>
    <h1>英文聽寫</h1>
    <p>聽發音 → 在畫布上寫下來 → 翻答案自己對 → 選「還不熟／快會了／會了」</p>
    <p>DK《5 Words a Day》：每天 5 個字，第 5 天複習整週 20 字。</p>
  </div>

  <h2 class="dct-section-title">DK《5 Words a Day》— 52 週</h2>
  <div class="dct-week-grid" id="dct-week-grid"></div>

  <h2 class="dct-section-title">加碼練習</h2>
  <div id="dct-bonus"></div>

  <h2 class="dct-section-title">聽力重點・主題例句聽寫</h2>
  <div id="dct-themes"></div>

  <h2 class="dct-section-title">CEFR 分級聽寫（A1–C2・單字＋例句）</h2>
  <div id="dct-cefr"></div>
</section>

<!-- ===== 作答 ===== -->
<section id="dct-screen-play" class="hidden">
  <div class="dct-play">
    <div class="dct-playtop">
      <span class="dct-counter" id="dct-counter" aria-live="polite"></span>
      <span class="dct-accent" role="group" aria-label="口音切換">
        <button type="button" class="dct-pill" id="dct-accent-us">美 US</button>
        <button type="button" class="dct-pill" id="dct-accent-gb">英 UK</button>
      </span>
    </div>

    <div class="dct-controls-row">
      <button type="button" class="dct-pill" id="dct-replay" aria-label="重播發音">🔊 重播</button>
      <button type="button" class="dct-pill hidden" id="dct-slow" aria-label="慢速播放">🐢 慢速</button>
      <button type="button" class="dct-pill hidden" id="dct-wbw" aria-label="逐詞播放">🔤 逐詞</button>
      <span class="dct-scaffolds" role="group" aria-label="提示開關">
        <button type="button" class="dct-sc" id="dct-sc-firstletter" aria-pressed="false">首字母</button>
        <button type="button" class="dct-sc" id="dct-sc-ipa" aria-pressed="false">音標</button>
      </span>
    </div>

    <div class="dct-mutehint hidden" id="dct-mutehint">聽不到？檢查 iPad 的靜音鍵與音量。</div>
    <button type="button" class="dct-bigplay hidden" id="dct-playbtn">🔊 點我播放</button>
    <div class="dct-firstletter" id="dct-firstletter"></div>

    <div class="dct-canvas-wrap">
      <canvas class="dct-canvas" id="dct-canvas" aria-label="手寫畫布"></canvas>
    </div>
    <div class="dct-toolbar" id="dct-toolbar">
      <button type="button" class="dct-btn dct-btn--ghost" id="dct-clear">🧽 清除</button>
      <button type="button" class="dct-btn dct-btn--ghost" id="dct-fallback-toggle">⌨️ 改用鍵盤</button>
    </div>
    <textarea class="dct-fallback hidden" id="dct-fallback" placeholder="想打字的話可以在這裡寫（系統不會批改，翻答案自己對）" aria-label="鍵盤輸入（可選）"></textarea>

    <div class="dct-controls-row" style="justify-content:space-between">
      <button type="button" class="dct-btn dct-btn--ghost" id="dct-back">← 回選單</button>
      <button type="button" class="dct-btn" id="dct-reveal-btn">看答案</button>
    </div>

    <div class="dct-reveal hidden" id="dct-reveal" aria-live="polite"></div>
  </div>
</section>

<!-- ===== 完成 ===== -->
<section id="dct-screen-done" class="hidden">
  <div class="dct-done">
    <div class="dct-big">🎉</div>
    <h2>這一組完成！</h2>
    <p id="dct-done-msg"></p>
    <button type="button" class="dct-btn" id="dct-done-back">回選單</button>
  </div>
</section>

</main>

<script src="dict_data_dk.js"></script>
<script src="dict_data_cefr_a1.js"></script>
<script src="dict_data_cefr_a2.js"></script>
<script src="dict_data_cefr_b1.js"></script>
<script src="dict_data_cefr_b2.js"></script>
<script src="dict_data_cefr_c1.js"></script>
<script src="dict_data_cefr_c2.js"></script>
<script src="dict_data_cefr_daily.js"></script>
<script src="dict_data_cefr_phrasal.js"></script>
<script src="dict_data_cefr_idioms.js"></script>
<script src="dict_data_cefr_practical.js"></script>
<script src="dict_data_cefr_quotes.js"></script>
<script src="dictation.js"></script>
</body>
</html>
