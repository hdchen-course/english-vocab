<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打招呼與自我介紹</title>
<link rel="stylesheet" href="assets/app.css">
<script src="game_core.js"></script>
<style>
  .gr-wrap{ max-width:1500px; margin:0 auto; padding:14px clamp(16px,3.5vw,44px) 48px; }
  /* 左導覽欄 + 右內容：吃滿寬，不留置中空白 */
  .gr-layout{ display:grid; grid-template-columns:clamp(240px,22vw,300px) 1fr; gap:30px; align-items:start; }
  .gr-side{ position:sticky; top:calc(var(--app-bar-h,56px) + 14px); display:flex; flex-direction:column; gap:12px; }
  .gr-main{ min-width:0; }
  .gr-cando{ background:var(--card); border:1px solid var(--card-border); border-left:6px solid var(--c-english);
    border-radius:14px; padding:13px 15px; }
  .gr-cando .lab{ font-size:12px; color:var(--c-english-ink); font-weight:700; }
  .gr-cando .txt{ font-size:15px; color:var(--ink); margin-top:4px; line-height:1.5; }
  .gr-nav{ display:flex; flex-direction:column; gap:5px; }
  .gr-nav a{ text-decoration:none; color:var(--ink); font-size:14px; padding:8px 12px; border-radius:10px;
    border:1px solid var(--card-border); background:var(--card); }
  .gr-nav a:hover{ border-color:var(--c-english); color:var(--c-english-ink); }
  .gr-nav a:focus-visible{ outline:3px solid var(--c-focus); outline-offset:2px; }
  h2.gr-h{ font-size:18px; color:var(--ink); margin:0 0 12px; padding-bottom:6px; border-bottom:2px solid var(--card-border); scroll-margin-top:72px; }
  h2.gr-h:not(:first-child){ margin-top:26px; }
  .gr-card{ background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:14px 16px; margin:10px 0;
    box-shadow:0 1px 3px rgba(51,49,46,.05); }
  .gr-en{ font-size:17px; color:var(--ink); line-height:1.55; }
  .gr-play{ font:inherit; cursor:pointer; border:1px solid var(--c-english); color:var(--c-english-ink);
    background:var(--tint-english); border-radius:999px; padding:3px 12px; font-size:14px; margin-right:8px; }
  .gr-play:hover{ background:var(--c-english); color:#fff; }
  .gr-play:focus-visible{ outline:3px solid var(--c-focus); outline-offset:2px; }
  /* 練習選項：寬螢幕用 2 欄鋪滿，不浪費寬度 */
  .gr-opts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:9px; margin:11px 0 4px; }
  .gr-opt{ font:inherit; text-align:left; cursor:pointer; border:1px solid var(--card-border); background:var(--card);
    border-radius:10px; padding:11px 14px; font-size:15px; color:var(--ink); transition:background .1s,border-color .1s; }
  .gr-opt:hover{ border-color:var(--c-english); }
  .gr-opt:focus-visible{ outline:3px solid var(--c-focus); outline-offset:2px; }
  .gr-opt.correct{ background:#e7f6ef; border-color:var(--c-correct-btn); color:var(--c-correct-ink); font-weight:700; }
  .gr-opt.wrong{ background:#fde8e8; border-color:var(--c-wrong-btn); color:var(--c-wrong-btn); }
  .gr-fb{ font-size:14px; margin-top:8px; padding:9px 12px; border-radius:9px; background:var(--tint-english); color:var(--ink); display:none; }
  .gr-fb.show{ display:block; }
  .gr-ta{ width:100%; font:inherit; font-size:16px; padding:9px 11px; border:1px solid var(--card-border); border-radius:9px; }
  .gr-rate{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .gr-rate button{ font:inherit; cursor:pointer; border:1px solid var(--card-border); background:var(--card);
    border-radius:999px; padding:6px 14px; font-size:14px; color:var(--ink); }
  .gr-rate button:hover{ border-color:var(--c-english); }
  .gr-rate button.sel{ background:var(--c-english); color:#fff; border-color:var(--c-english); }
  .gr-note{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }
  .gr-foot{ color:var(--ink-soft); font-size:12px; margin-top:28px; border-top:1px solid var(--card-border); padding-top:12px; }
  @media (max-width:900px){ .gr-layout{ grid-template-columns:1fr; } .gr-side{ position:static; } }
</style>
</head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span><span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">打招呼與自我介紹 👋</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="gr-wrap"><div id="root"><p id="loading">載入中…</p></div></main>

<script>
function play(f){ try{ new Audio('audio/'+f+'.mp3').play(); }catch(e){} }
function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

fetch('english_greetings.units.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
  const u=data.units[0], root=document.getElementById('root');
  root.innerHTML='';
  const layout=el('div','gr-layout'); const side=el('aside','gr-side'); const main=el('div','gr-main');
  layout.appendChild(side); layout.appendChild(main); root.appendChild(layout);

  // 左欄：can-do + 章節跳轉
  const cd=el('div','gr-cando'); cd.innerHTML=
    `<div class="lab">我學得會（can-do）· ${esc(u.situation_group)}</div><div class="txt">${esc(u.can_do)}</div>`;
  side.appendChild(cd);
  const nav=el('nav','gr-nav'); nav.setAttribute('aria-label','單元章節');
  [['s1','① 先聽、先感覺'],['s2','② 練一練'],['s3','③ 跟著讀 ＋ 模仿語調'],['s4','④ 我到哪一步了']].forEach(([id,t])=>{
    const a=el('a',null,esc(t)); a.href='#'+id; nav.appendChild(a);
  });
  side.appendChild(nav);

  // 右欄：① 教
  main.appendChild(el('h2','gr-h','① 先聽、先感覺')).id='s1';
  u.teach.forEach(t=>{
    const c=el('div','gr-card');
    if(t.audio){ const b=el('button','gr-play','🔊 聽'); b.onclick=()=>play(t.audio); c.appendChild(b); }
    c.appendChild(el('span','gr-en', esc(t.body)));
    main.appendChild(c);
  });

  // ② 練
  main.appendChild(el('h2','gr-h','② 練一練')).id='s2';
  u.practice.forEach(p=>{
    const c=el('div','gr-card');
    c.appendChild(el('div','gr-en', esc(p.stem)));
    if(p.type==='dictation'){
      const b=el('button','gr-play','🔊 聽，然後寫下來'); b.onclick=()=>play(p.audio); c.appendChild(b);
      const ta=el('textarea','gr-ta'); ta.rows=2; ta.setAttribute('aria-label','聽寫作答'); c.appendChild(ta);
      const rev=el('button','gr-play','看答案對照'); rev.style.marginTop='8px';
      const ans=el('div','gr-fb', '正解：<b>'+esc(p.answer)+'</b><br>'+esc(p.feedback));
      rev.onclick=()=>ans.classList.add('show'); c.appendChild(rev); c.appendChild(ans);
      c.appendChild(rateRow());
    } else {
      const opts=el('div','gr-opts');
      (p.options||[]).forEach(o=>{
        const b=el('button','gr-opt', esc(o));
        b.onclick=()=>{
          if(o===p.answer){ b.classList.add('correct'); }
          else { b.classList.add('wrong');
            const dr=(p.distractor_rationales||{})[o]; if(dr) b.innerHTML=esc(o)+' <span style="font-size:12px;color:var(--ink-soft)">— '+esc(dr)+'</span>'; }
          fb.classList.add('show');
        };
        opts.appendChild(b);
      });
      c.appendChild(opts);
      const fb=el('div','gr-fb', '✓ '+esc(p.feedback)); c.appendChild(fb);
    }
    main.appendChild(c);
  });

  // ③ 跟著讀
  if(u.shadowing){
    main.appendChild(el('h2','gr-h','③ 跟著讀 ＋ 模仿語調')).id='s3';
    const c=el('div','gr-card');
    c.appendChild(el('div','gr-note', esc(u.shadowing.note)));
    u.shadowing.lines.forEach(l=>{
      const row=el('div'); row.style.cssText='display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap';
      const b=el('button','gr-play','🔊'); b.onclick=()=>play(l.audio); row.appendChild(b);
      row.appendChild(el('span','gr-en', esc(l.text)));
      row.appendChild(el('span','gr-note','（'+esc(l.intonation)+'）'));
      c.appendChild(row);
    });
    c.appendChild(rateRow()); main.appendChild(c);
  }

  // ④ 自評
  main.appendChild(el('h2','gr-h','④ 我到哪一步了')).id='s4';
  const se=el('div','gr-card');
  se.appendChild(rateRow(u.selfeval));
  se.appendChild(el('div','gr-note', esc(u.selfeval_note||'')));
  main.appendChild(se);

  main.appendChild(el('footer','gr-foot',
    '資料來源：english_greetings.units.json（Phase 2 樣板單元）。音檔為 edge-tts 童聲真實語音。自評不自動判讀，翻答案自己判斷。'));
}).catch(e=>{ document.getElementById('root').innerHTML='<p>載入失敗（請用 http 開啟，勿用 file://）：'+esc(e)+'</p>'; });

function rateRow(levels){
  const wrap=el('div','gr-rate'); (levels||["還不熟","快會了","會了"]).forEach(l=>{
    const b=el('button',null, esc(l));
    b.onclick=()=>{ [...wrap.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
    wrap.appendChild(b);
  }); return wrap;
}
</script>
</body>
</html>
