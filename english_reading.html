<main class="shell">
  <section id="screen-menu" class="cn-screen active cn-wrap">
    <div class="cn-topbar"><span class="cn-title">英語閱讀技巧 📖</span></div>
    <div class="cn-hello"><span class="cn-mascot" aria-hidden="true">📖</span>
      <div><div class="cn-htext" id="hello">讀很多英文書很棒；再學會幾招「閱讀技巧」，就能讀得更快、更懂。用短短的英文小段落，一招一招練。</div>
      <div class="cn-hsub">每個技巧都是「先懂這招 → 看短文 → 換你試試」。看不懂的字先別急著查，試試用學到的方法猜猜看。</div></div></div>
    <div class="cn-lessons" id="lesson-list"></div>
    <a class="cn-nextup" href="english_sense.html"><span class="cn-nextup-ic" aria-hidden="true">🚀</span><span>想練英文語感嗎？到「英文語感」繼續 →</span></a>
    <p class="cn-note">這裡是「先學技巧」的教學小旅程，只留在你的裝置上，不影響學習基地的等級或經驗值。閱讀量可以靠你平常看的英文書（例如 myOn），這裡專門練「怎麼讀」。</p>
  </section>
  <section id="screen-play" class="cn-screen cn-wrap">
    <div class="cn-topbar"><button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button><span class="cn-title" id="play-title">閱讀技巧</span></div>

  </section>
