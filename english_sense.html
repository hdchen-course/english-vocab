<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文語感 🗣️</title>
<!-- 統一遊戲化引擎：assets/app.css（設計 token）→ game_core.css（HUD/toast）→ game_core.js。
     零重複計分：本頁定位「進階挑戰」，絕不呼叫 Game.recordAnswer / award / recordSession，
     （唯一例外：答題時呼叫 Game.pingActive() 維持每日連續學習 streak，不計 XP、不重複計分）
     也不宣告 data-game-wired，故不污染任何科目 XP。只用 Game.showToast（純提示）。
     獨立 localStorage key：sense_progress_v1。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* english_sense.html — 強調色系採青綠（teal）。無專用 subject token，故：
   --su 用實色（邊框/圓點），--su-tint 用半透明（亮暗雙主題自適應），
   --su-ink 用 var(--ink)（自動隨主題翻轉，避免暗色模式對比不足）。 */
:root {
  --su: #0d9488;
  --su-tint: rgba(13,148,136,0.14);
  --su-ink: var(--ink);
  --accent: #0d9488;
  --accent-ink: var(--ink);
  --accent-tint: rgba(13,148,136,0.14);
}

body { overflow-x: hidden; }

.ma-topbar { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s4); }
.ma-topbar .ma-title { flex: 1; font-size: var(--fs-h2); font-weight: 800; color: var(--ink); min-width: 0; }

.ma-screen { display: none; animation: ma-fade 0.3s ease; }
.ma-screen.active { display: block; }
@keyframes ma-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .ma-screen { animation: none; } }

.ma-hello { display: flex; align-items: center; gap: var(--s3); padding: var(--s4); background: var(--su-tint); border: 1px solid var(--card-border); border-radius: var(--r-lg); margin-bottom: var(--s4); }
.ma-hello .ma-mascot { font-size: 46px; flex: none; line-height: 1; }
.ma-hello .ma-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.ma-hello .ma-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }

.ma-overview { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s4); flex-wrap: wrap; }
.ma-overview .stat-tile { flex: 1; min-width: 96px; }

.ma-levels { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.ma-level {
  display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4);
  text-align: left; cursor: pointer; border: 2px solid var(--card-border);
  background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  font-family: var(--font); color: var(--ink);
}
.ma-level:hover { box-shadow: var(--shadow-lg); border-color: var(--su); }
.ma-level:active { transform: scale(0.98); }
.ma-level-top { display: flex; align-items: center; gap: var(--s3); }
.ma-level-emoji { font-size: 34px; width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 16px; }
.ma-level-num { font-size: var(--fs-small); font-weight: 700; color: var(--su-ink); }
.ma-level-name { font-size: var(--fs-body); font-weight: 800; color: var(--ink); line-height: 1.25; }
.ma-level-concepts { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; line-height: 1.4; }
.ma-level-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: 2px; }
.ma-level-status { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-small); font-weight: 700; }
.ma-level-status.done { color: var(--c-correct-ink); }
.ma-level-status.todo { color: var(--ink-soft); }
.ma-level-stars { font-size: 16px; letter-spacing: 1px; }

.ma-stage { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: var(--s5) var(--s4); text-align: center; }
.ma-visual { font-size: clamp(56px, 18vw, 92px); line-height: 1.1; margin: var(--s2) 0 var(--s3); user-select: none; }
.ma-question { font-size: clamp(19px, 4.5vw, 24px); font-weight: 800; color: var(--ink); line-height: 1.6; margin: 0 auto var(--s4); max-width: 42ch; text-align: left; }

.ma-brief { text-align: left; }
.ma-brief h2 { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); margin: 0 0 var(--s3); text-align: center; }
.ma-brief-sub { text-align: center; color: var(--ink-soft); font-weight: 700; font-size: var(--fs-small); margin: 0 0 var(--s3); }
.ma-keyfacts { list-style: none; padding: 0; margin: 0 auto; max-width: 44ch; display: grid; gap: var(--s2); }
.ma-keyfacts li { display: flex; align-items: flex-start; gap: var(--s2); padding: 10px 14px; background: var(--su-tint); border-radius: var(--r-md); font-size: var(--fs-body); font-weight: 700; color: var(--ink); line-height: 1.6; }
.ma-keyfacts li .ma-kf-dot { flex: none; color: var(--su-ink); font-weight: 900; }

.ma-steps { display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: var(--s3); flex-wrap: wrap; }
.ma-steps i { width: 20px; height: 6px; border-radius: 999px; background: var(--card-border); }
.ma-steps i.on { background: var(--su); }
.ma-steps i.cur { background: var(--su); box-shadow: 0 0 0 3px var(--su-tint); }

.ma-options { display: grid; gap: var(--s3); margin-top: var(--s2); }
.ma-opt {
  display: flex; align-items: center; gap: var(--s2); min-height: 56px; width: 100%;
  padding: 14px 18px; border: 2px solid var(--card-border); border-radius: 16px;
  background: var(--card); color: var(--ink); font-family: var(--font);
  font-size: clamp(16px, 3.4vw, 19px); font-weight: 700; text-align: left; cursor: pointer;
  transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
}
.ma-opt:active { transform: scale(0.98); }
.ma-opt:disabled { cursor: default; }
/* 作答後高亮：文字用 var(--ink)（亮暗雙主題皆過 AA），對錯以邊框顏色 + ✅/❌ 雙碼標示 */
.ma-opt.correct { border-color: var(--c-correct); background: var(--tint-english); color: var(--ink); }
.ma-opt.wrong { border-color: var(--c-wrong); background: rgba(255,118,117,0.12); color: var(--ink); }
.ma-opt.correct .ma-opt-mark { color: var(--c-correct-ink); }
.ma-opt.wrong .ma-opt-mark { color: var(--c-streak-ink); }
.ma-opt .ma-opt-mark { margin-left: auto; font-size: 22px; }

.ma-reveal { margin-top: var(--s4); padding: var(--s3) var(--s4); background: var(--su-tint); border-radius: var(--r-md); font-size: var(--fs-body); font-weight: 700; color: var(--ink); line-height: 1.6; text-align: left; display: none; }
.ma-reveal.show { display: block; animation: ma-fade 0.3s ease; }
@media (prefers-reduced-motion: reduce) { .ma-reveal.show { animation: none; } }

.ma-done { text-align: center; padding: var(--s5) var(--s4); }
.ma-done-emoji { font-size: clamp(64px, 22vw, 100px); }
.ma-done-stars { font-size: 34px; letter-spacing: 4px; margin: var(--s2) 0; }
.ma-done-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); }

.ma-actions { display: flex; gap: var(--s3); margin-top: var(--s4); flex-wrap: wrap; }
.ma-actions .btn { flex: 1; min-width: 140px; }

.ma-footnote { text-align: center; color: var(--ink-soft); font-size: var(--fs-small); margin-top: var(--s5); font-weight: 600; max-width: 34em; margin-inline: auto; }
.sense-audio-btn { display:inline-flex; align-items:center; gap:8px; min-height:56px; padding:14px 26px; border:none; border-radius:16px; background:#0f766e; color:#fff; font-family:var(--font); font-weight:800; font-size:clamp(18px,4.5vw,22px); cursor:pointer; box-shadow:var(--shadow-sm); }
.sense-audio-btn:active { transform:scale(0.97); }
</style>
</head>
<body data-game-hud="off">
<header class="app-bar">

          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">

</header>
<main class="shell">

  <section id="screen-menu" class="ma-screen active">
    <div class="ma-topbar">
      <span class="ma-title">英文語感 🗣️</span>

    <div class="ma-hello">

      <div>
        <div class="ma-hello-text" id="hello-text">用「聽起來順不順」、看圖和聽力培養英文語感——用聽和感覺學，不用死背規則，多玩幾次耳朵就會了。</div>
        <div class="ma-hello-sub" id="hello-sub">還沒開始也沒關係，挑一個等級試試看吧！</div>

    </div>

    <div class="ma-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-done">0/20</span><span class="stat-label">完成等級</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-badges">0/21</span><span class="stat-label">收集徽章</span></div>
    </div>

    <div class="ma-levels" id="level-list"><!-- 由 JS 產生 --></div>

    <a class="ma-hello ma-next" href="english_advanced.html" style="text-decoration:none; margin-top:var(--s4); border-color:var(--su);">
      <span class="ma-mascot" aria-hidden="true">🏆</span>
      <div>
        <div class="ma-hello-text">語感練熟了嗎？來挑戰「進階英文語感」 ➡️</div>
        <div class="ma-hello-sub">給你一個句子，用感覺判斷現在／過去／已完成；同一個動作的三種說法怎麼分——更進一步的語感冒險。</div>
      </div>
    </a>

    <a class="cn-nextup cn-nextup--back" href="english_concepts.html" style="display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 16px;background:var(--su-tint);border:1px solid var(--card-border);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700;min-height:48px;line-height:1.5"><span style="font-size:24px;flex:none" aria-hidden="true">📘</span><span>← 想先打底？回「英文句型觀念養成」複習一下</span></a>

    <p class="ma-footnote">這是「進階挑戰」小旅程，只留在你自己的裝置上，不影響學習基地的等級或經驗值。慢慢玩、盡量想，答錯也沒關係。🌱</p>
  </section>

  <section id="screen-play" class="ma-screen">
    <div class="ma-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到等級選單">←</button>
      <span class="ma-title" id="play-title">等級</span>
    </div>
    <div class="ma-steps" id="step-dots" aria-hidden="true"></div>
    <div class="play-column">
      <div id="stage"><!-- 由 JS 產生每一題 --></div>
    </div>
  </section>

</main>

<script>
/* 主程式（自足 IIFE）：4 個等級（12 / 10 / 10 / 10 題）、全部解鎖。選項每題 Fisher–Yates 洗牌；
   answer = 未洗牌前 0-based 索引，以 data-i 判斷，判分不受洗牌影響。每題最多記一次分。
   獨立 key：sense_progress_v1。不呼叫 Game.recordAnswer / award / recordSession。 */
(function () {
  'use strict';

  function toast(msg, kind) {
    try { if (window.Game && Game.showToast) Game.showToast(msg, kind || 'info'); } catch (e) {}
  }

  var PROG_KEY = 'sense_progress_v1';
  function loadProg() {
    var p = null;
    try { p = JSON.parse(localStorage.getItem(PROG_KEY)); } catch (e) { p = null; }
    if (!p || typeof p !== 'object') p = {};
    if (typeof p.badges !== 'object' || !p.badges) p.badges = {};
    return p;
  }
  function saveProg(p) { try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) {} }
  var progress = loadProg();

  window.__sensePlay = function (f) { try { new Audio('audio/' + f + '.mp3').play(); } catch (e) {} };
  function senseVisual(step, lv) {
    if (step.pic) return '<div class="ma-visual" role="img" aria-label="看圖題">' + step.pic + '</div>';
    if (step.audio) return '<div class="ma-visual"><button type="button" class="sense-audio-btn" onclick="__sensePlay(\''+step.audio+'\')">🔊 播放語音</button></div>';
    return '<div class="ma-visual" aria-hidden="true">' + lv.emoji + '</div>';
  }

  // 課程內容（全繁體中文；事實經 WebSearch 查核與雙重審查）。answer = 未洗牌前 0-based 索引。
  var LEVELS = [
  {
    "id": "lv1",
    "level": 1,
    "name": "哪個最自然",
    "emoji": "🗣️",
    "color": "#0d9488",
    "concepts": [
      "時態",
      "介系詞",
      "固定搭配",
      "冠詞",
      "可數/不可數"
    ],
    "keyFacts": [
      "習慣、每天做的事用現在簡單式：I walk to school every day.",
      "時間長度用 for、起點用 since：for five years / since 2019.",
      "此刻正在發生用現在進行式：The baby is crying.",
      "固定搭配靠習慣：good at、interested in、arrive at.",

      {

          "I walked to school every day."
        ],
        "answer": 0,
        "why": "每天的習慣用現在簡單式 walk。"
      },
      {
        "q": "「我住在這裡已經五年了。」",
        "options": [
          "I have lived here for five years.",
          "I have lived here since five years.",
          "I live here for five years.",
          "I am living here for five years."
        ],
        "answer": 0,
        "why": "時間長度用 for（for five years）。"
      },
      {
        "q": "「我從 2019 年就住在這裡。」",
        "options": [
          "I have lived here since 2019.",
          "I have lived here for 2019.",
          "I live here since 2019.",
          "I am living here since 2019."
        ],
        "answer": 0,
        "why": "時間起點用 since（since 2019）。"
      },
      {
        "q": "「聽！寶寶正在哭。」Listen! The baby ___.",
        "options": [
          "is crying",

      },
      {

        ],

        "why": "固定搭配 be good at。"
      },
      {
        "q": "「我對音樂有興趣。」I am interested ___ music.",
        "options": [
          "in",
          "on",
          "at",
          "for"
        ],
        "answer": 0,
        "why": "固定搭配 be interested in。"
      },
      {
        "q": "「我們到機場了。」We arrived ___ the airport.",
        "options": [
          "at",
          "to",
          "in",
          "for"
        ],
        "answer": 0,
        "why": "arrive at + 地點；arrive 不接 to。"
      },
      {

        "options": [
          "on",
          "in",
          "at",
          "of"
        ],
        "answer": 0,
        "why": "星期幾用 on（on Monday）。"
      },
      {
        "q": "「會議在三點。」The meeting is ___ 3 o'clock.",
        "options": [
          "at",
          "on",
          "in",
          "for"
        ],
        "answer": 0,
        "why": "精確時刻用 at（at 3 o'clock）。"
      },
      {
        "q": "「我有很多書。」",
        "options": [
          "I have many books.",
          "I have much books.",
          "I have a lot book.",
          "I have many book."
        ],
        "answer": 0,
        "why": "可數複數用 many + 複數 books。"
      },
      {
        "q": "「這是一顆蘋果。」",
        "options": [
          "This is an apple.",
          "This is a apple.",
          "This is apple.",
          "This is an apples."
        ],
        "answer": 0,
        "why": "母音開頭用 an：an apple。"
      },
      {

        ],
        "answer": 0,
        "why": "昨天是過去，用過去式 watched。"
      }
    ]
  },
  {
    "id": "lv2",
    "level": 2,
    "name": "情境對話",
    "emoji": "💬",
    "color": "#f59e0b",
    "concepts": [

      "禮貌請求",
      "道謝回應",
      "道歉",
      "自然一問一答"
    ],
    "keyFacts": [
      "有人說 Thank you，回 You're welcome。",

    ],
    "questions": [
      {

        "options": [
          "You're welcome.",

      },
      {

        "options": [

        "why": "早上打招呼說 Good morning。"
      },
      {

      {

        "options": [

        "answer": 0,

      },
      {

        "options": [

        "answer": 0,

      {

  {"id":"lv17","level":17,"name":"動詞的語感・後面接什麼","emoji":"🧩","color":"#F4845F","concepts":["enjoy／keep／mind／finish 後面配 -ing 唸起來最順","want／decide／hope／plan／would like 後面配 to V","stop doing（不再做那件事）vs stop to do（停下來去做）","make／let／have 加人配原形；see／hear 加人配 do 或 -ing","look forward to／be good at 這類片語固定配 -ing"],"keyFacts":["enjoy、keep、mind、finish 後面習慣配 -ing：enjoy playing、keep running 一口氣唸下去最順。","want、decide、hope、plan、would like 後面配 to：want to go、decide to try 講出來最直接自然。","stop 接 -ing 是『把那件事停掉』（stop talking＝不再講話）；接 to 是『停下手邊的事、去做別的』（stop to rest＝停下來休息）。","make／let／have 加了『人』之後直接配原形動詞：made me cry、let me go，中間不放 to。","look forward to、be good at 這種片語後面固定配 -ing：looking forward to seeing you、good at singing。"],"questions":[{"q":"週末你最愛游泳，想說「我很享受游泳」。哪個講法最自然？","options":["I enjoy to swim.","I enjoy swimming.","I enjoy for swimming.","I am enjoying to swim."],"answer":1,"why":"enjoy 後面習慣配 -ing，「enjoy swimming」一口氣唸下去就是最順、最道地的享受感。"},{"q":"下雨了，但他還是沒停下腳步。想說「他一直跑」，哪個最自然？","options":["He kept running.","He kept to run.","He kept run.","He kept for running."],"answer":0,"why":"keep 後面配 -ing 才有那種「一直、持續不停」的畫面，「kept running」就是不停地跑，最順口。"},{"q":"想禮貌請人幫忙關窗，說「你介意關個窗嗎？」哪個最自然？","options":["Would you mind to close the window?","Would you mind close the window?","Would you mind closing the window?","Would you mind you close the window?"],"answer":2,"why":"mind 後面配 -ing 最順，「mind closing」聽起來既客氣又自然，是道地的請求說法。"},{"q":"談到未來的夢想，想說「我長大想當醫生」。哪個最自然？","options":["I want being a doctor.","I want be a doctor.","I want to be a doctor.","I want that I am a doctor."],"answer":2,"why":"want 後面就是配 to，「want to be」講出來最直接，一聽就懂你想做什麼。"},{"q":"他做了個決定要學鋼琴。想說「他決定學鋼琴」，哪個最自然？","options":["He decided to learn the piano.","He decided learning the piano.","He decided learn the piano.","He decided for learning the piano."],"answer":0,"why":"decide 後面習慣配 to，「decide to learn」帶出「拿定主意要去做」的感覺，最順。"},{"q":"口渴了，想客氣地說「我想喝點水」。哪個最自然？","options":["I would like having some water.","I would like to have some water.","I would like have some water.","I would like that I have some water."],"answer":1,"why":"would like 後面配 to，「would like to have」是很客氣、很道地的表達，點餐、要東西都常這樣講。"},{"q":"老師一走進教室，大家就不再講話了。想說「大家停止講話」，哪個最自然？","options":["Everyone stopped to talk.","Everyone stopped talking.","Everyone stopped talk.","Everyone stopped for talking."],"answer":1,"why":"想表達「不再講話」時，stop 後面配 -ing，「stopped talking」就是把講話這件事停掉；若說 stopped to talk，感覺反而變成「停下來、專程去講話」，意思就不一樣了。"},{"q":"走路走到一半，他停下腳步去綁鞋帶。想說「他停下來綁鞋帶」，哪個最自然？","options":["He stopped tying his shoes.","He stopped to tie his shoes.","He stopped for tying his shoes.","He stopped for to tie his shoes."],"answer":1,"why":"想說「停下手邊的事、為了去做某件事」時用 stop + to do，「stopped to tie his shoes」就是停下腳步、然後去綁鞋帶；若說 stopped tying，意思會變成「停止綁鞋帶」。"},{"q":"一部很感人的電影讓你哭了。想說「這部電影讓我大哭」，哪個最自然？","options":["The movie made me to cry.","The movie made me crying.","The movie made me cry.","The movie made me cried."],"answer":2,"why":"make 加了人之後直接配原形動詞，「made me cry」唸起來乾淨俐落，中間不用加 to。"},{"q":"你親眼看到他跌倒的整個過程。想說「我看見他跌倒了」，哪個最自然？","options":["I saw him to fall down.","I saw him falls down.","I saw him fall down.","I saw him fell down."],"answer":2,"why":"see 加了人之後配原形動詞，「saw him fall」表示你看到跌倒的完整動作，中間不加 to，也不用改成過去式。"},{"q":"暑假快到了，你很期待去海邊玩。想說「我很期待去海邊」，哪個最自然？","options":["I'm looking forward to go to the beach.","I'm looking forward to going to the beach.","I'm looking forward going to the beach.","I'm looking forward for going to the beach."],"answer":1,"why":"look forward to 後面配 -ing，這裡的 to 是片語的一部分，不是「要去做」的 to，所以「looking forward to going」才是最道地的期待感。"},{"q":"你姐姐很會畫畫。想說「我姐姐很擅長畫畫」，哪個最自然？","options":["My sister is good at draw.","My sister is good at drawing.","My sister is good at to draw.","My sister is good to draw."],"answer":1,"why":"be good at 後面配 -ing，「good at drawing」就是「很擅長畫畫」最順口、最自然的講法。"}]},
  {"id":"lv18","level":18,"name":"形容詞的語感","emoji":"🎨","color":"#EC4899","concepts":["人有感覺用 -ed，事物讓人有感覺用 -ing（I'm bored／it's boring）","look／feel／sound／smell／taste 後面直接配形容詞（You look tired）","形容詞排隊順序：感覺→大小→顏色（a nice big red ball）","-ed 講人的心情、-ing 講事物給人的感受（interested／interesting）","常見搭配：be afraid of、feel good"],"keyFacts":["人累了說 I'm tired；那趟路很累人才說 it's tiring。心情用 -ed，來源用 -ing。","look／feel／sound／smell／taste 後面直接接形容詞：You look tired、It sounds good，不加 -ly。","形容詞排隊習慣是「感覺→大小→顏色」：a nice big red ball 唸起來最順。","「怕某樣東西」用 be afraid of；afraid of dogs 是最順的搭配。","講心情好、開心用 feel good；feel good 唸起來最自然。"],"questions":[{"q":"「我對太空超有興趣。」哪個最自然？","options":["I'm really interested in space.","I'm really interesting in space.","I'm really interested with space.","Space is really interested in me."],"answer":0,"why":"人自己有興趣，用 -ed 的 interested，而且「對某事有興趣」固定配 interested in，interested in space 唸起來最順。"},{"q":"「這本書真的很好看、很有意思。」This book is really ___.","options":["interesting","interested","fascinated","thrilled"],"answer":0,"why":"東西、事情讓人產生感覺，用 -ing 的 interesting 來形容書本身；fascinated、thrilled 這些 -ed 是講人的心情，書本身用 interesting 才自然。"},{"q":"「爬完那座山，我覺得好累。」After the long hike, I felt so ___.","options":["tired","tiring","tiresome","exhausting"],"answer":0,"why":"人累了，用 -ed 的 tired 講自己的感覺；tiring、exhausting 是形容「那件事很累人」，講自己就是 I felt tired 最自然。"},{"q":"「昨晚那場棒球賽超刺激！」The baseball game last night was so ___!","options":["exciting","excited","thrilled","amazed"],"answer":0,"why":"比賽這件事讓大家熱血，用 -ing 的 exciting 形容比賽本身；excited、thrilled 是講人的心情，比賽本身用 exciting 最自然。"},{"q":"「在家沒事做，我覺得好無聊。」There's nothing to do at home. I'm so ___.","options":["bored","boring","dull","uninteresting"],"answer":0,"why":"人覺得無聊、提不起勁，用 -ed 的 bored 講自己的心情；boring、dull 是形容「某樣東西很無趣」，講自己現在的感受用 I'm bored 最自然。"},{"q":"朋友臉色不太好，你想關心他說「你看起來很累。」","options":["You look tired","You look tiredly","You look tiring","You seem tiredly"],"answer":0,"why":"look、seem 後面直接接形容詞 tired，不用加 -ly；You look tired 唸起來最自然，是關心別人時最常講的一句。"},{"q":"「這條毯子摸起來好軟。」This blanket ___.","options":["feels soft","feels softly","feels softness","is feeling softly"],"answer":0,"why":"feel（摸起來、覺得）後面配形容詞 soft，feels soft 就是在講手感，唸起來最順，不用加 -ly。"},{"q":"「一走進廚房，這鍋湯聞起來好香。」The soup ___.","options":["smells good","smells well","smells nicely","is smelling good"],"answer":0,"why":"smell 後面接形容詞 good 來形容味道，smells good 是聞到香味時最自然的講法；這種感官動詞後面配形容詞而不是 -ly。"},{"q":"朋友提議放學去騎腳踏車，你覺得不錯，回他：「___」","options":["Sounds good!","Sounds well!","Sounds goodly!","Sounds nicely!"],"answer":0,"why":"回應別人的點子，Sounds good! 是最自然、最口語的講法；sound 後面配形容詞 good，不加 -ly。"},{"q":"想說「一顆漂亮的紅色大皮球」，哪個唸起來最順？","options":["a nice big red ball","a red big nice ball","a big nice red ball","a red nice big ball"],"answer":0,"why":"英文形容詞習慣照「感覺→大小→顏色」排隊，nice（感覺）big（大小）red（顏色）這個順序唸起來最順，母語人士一聽就覺得自然。"},{"q":"「我弟弟很怕打雷。」My little brother is really ___ thunder.","options":["afraid of","afraid for","afraid to","afraid about"],"answer":0,"why":"「怕某樣東西」英文固定講 be afraid of，afraid of thunder 唸起來就是最順的搭配。"},{"q":"「大家稱讚我的畫，我心裡好開心。」When everyone liked my drawing, I ___.","options":["felt good","felt well","felt goodly","felt goodness"],"answer":0,"why":"講心情好、很開心，英文最自然是 feel good；felt good 就是在說心情，feel 後面配形容詞 good，唸起來最順。"}]},
  {"id":"lv19","level":19,"name":"數得清嗎・量的語感","emoji":"🧮","color":"#E67E22","concepts":["much information／much advice（不可數配 much）","many books／many friends（可數配 many）","a few friends 對 a little water（幾個 vs 一點點）","a piece of paper／a glass of water／two pieces of bread（量的說法）","some tea／any money（some 與 any 的語感）"],"keyFacts":["information、advice、homework、money 是「一整團」的東西，不加 s、也不說 a：a lot of information 唸起來最順。","數得出「幾個」的配 many，倒得出來、數不出個數的配 much：many books、much water。","a few 配數得出來的（a few friends），a little 配數不出來的（a little water）：一個在講「有幾個」，一個在講「一點點」。","想講「一張／一杯／兩片」就說 a piece of paper、a glass of water、two pieces of bread，母語人士這樣講最自然。","請客、期待對方會答應時用 some（Would you like some tea?）；否定和一般疑問常配 any（I don't have any money）。"],"questions":[{"q":"「這個網站有很多有用的資訊。」哪個唸起來最自然？","options":["This website has a lot of useful information.","This website has a lot of useful informations.","This website has many useful information.","This website has many useful informations."],"answer":0,"why":"information 是「一整團」的東西，不會一個一個數，所以不加 s；量多時配 a lot of，a lot of information 唸起來就是最順的講法。"},{"q":"「我媽媽給了我一個很好的建議。」哪個最自然？","options":["My mom gave me a good piece of advice.","My mom gave me a good advice.","My mom gave me a good advices.","My mom gave me good advices."],"answer":0,"why":"advice 沒辦法一則一則數，要講「一個建議」就用 a piece of advice；a good piece of advice 唸起來最順、也最像母語人士的講法。"},{"q":"「我今天有好多功課要寫。」哪個聽起來最自然？","options":["I have a lot of homework today.","I have a lot of homeworks today.","I have many homework today.","I have many homeworks today."],"answer":0,"why":"homework 是一整包的概念，不加 s、也不說 a homework；量多就用 a lot of homework，講起來最自然。"},{"q":"想問朋友「你有多少本書？」問數量時哪個最自然？","options":["How many books do you have?","How much books do you have?","How much book do you have?","How many book do you have?"],"answer":0,"why":"books 是可以一本一本數的東西，數得出來的就配 many；how many books 唸起來就是最順的問法。"},{"q":"「你今天喝了多少水？」哪個最自然？","options":["How much water did you drink today?","How many water did you drink today?","How many waters did you drink today?","How much waters did you drink today?"],"answer":0,"why":"water 是倒得出來、卻數不出「幾個」的東西，就用 much；how much water 是母語人士最自然的問法。"},{"q":"「我有幾個朋友會來我的生日派對。」哪個最自然？","options":["A few friends are coming to my birthday party.","A little friends are coming to my birthday party.","A few friend are coming to my birthday party.","A little friend is coming to my birthday party."],"answer":0,"why":"friends 是數得出來的，「有幾個」就用 a few，a few friends 唸起來最順；a little 是留給數不出個數的東西的。"},{"q":"「杯子裡還有一點點水。」哪個最自然？","options":["There's a little water in the cup.","There's a few water in the cup.","There are a few water in the cup.","There's a little waters in the cup."],"answer":0,"why":"water 數不出「幾個」，要講「還有一點點」就用 a little；a little water 唸起來最自然順口。"},{"q":"上美術課想跟同學借紙，「可以給我一張紙嗎？」哪個最自然？","options":["Can you give me a piece of paper?","Can you give me a paper?","Can you give me a papers?","Can you give me one paper?"],"answer":0,"why":"紙一張一張的，母語人士習慣說 a piece of paper 來表示「一張」，這樣講最自然、意思也最清楚。"},{"q":"口渴了，想跟人要「一杯水」，哪個最自然？","options":["Can I have a glass of water?","Can I have a water?","Can I have a cup water?","Can I have one water?"],"answer":0,"why":"水要用容器裝，「一杯」就說 a glass of water，這是母語人士要水時最自然、最順口的講法。"},{"q":"「早餐我吃了兩片麵包。」哪個最自然？","options":["I ate two pieces of bread for breakfast.","I ate two breads for breakfast.","I ate two bread for breakfast.","I ate a two bread for breakfast."],"answer":0,"why":"bread 要數的時候用 pieces，「兩片麵包」就說 two pieces of bread，唸起來最順、也最道地。"},{"q":"招待客人，想問「你想要一些茶嗎？」哪個聽起來最親切自然？","options":["Would you like some tea?","Would you like any tea?","Do you like some tea?","Would you like some teas?"],"answer":0,"why":"請別人喝東西、心裡期待對方會說好的時候，習慣用 some；Would you like some tea? 聽起來最親切、最自然。"},{"q":"「抱歉，我身上沒有錢。」哪個最自然？","options":["Sorry, I don't have any money.","Sorry, I don't have some money.","Sorry, I don't have any moneys.","Sorry, I don't have some moneys."],"answer":0,"why":"講「沒有…」的否定句，母語人士習慣配 any，I don't have any money 唸起來最自然；money 也是一整團的東西，不加 s。"}]},
  {"id":"lv20","level":20,"name":"這樣講最自然・日常動作","emoji":"🌅","color":"#F59E0B","concepts":["turn on / off the light、turn up / down（開關燈、調音量的固定講法）","take a shower、have breakfast、do your homework、make the bed（起居動作的道地搭配）","catch a cold、have a headache（生病、不舒服的講法）","listen to music、watch TV、take a photo、ride a bike（休閒動作的自然說法）","make friends、go shopping、play the piano、play basketball（常用的整組搭配）"],"keyFacts":["開關燈、電器、音量習慣配 turn：turn on / off、turn up / down，turn on the light 唸起來最順。","三餐、洗澡常配 have 或 take：have breakfast、take a shower，講日常起居就用它們最自然。","do 管功課、make 管整理和交朋友：do your homework、make the bed、make friends，記整組最好記。","感冒說 catch a cold；頭痛、發燒這類身體狀況常用 have：have a headache。","休閒動作各有黃金搭配：listen to music、watch TV、take a photo、ride a bike、play the piano，整組一起記唸起來最自然。"],"questions":[{"q":"天黑了看不清楚，你想請人幫忙開燈，最自然的說法是？","options":["Turn on the light.","Power on the light.","Activate the light.","Switch up the light."],"answer":0,"why":"開燈說 turn on，關燈說 turn off。turn on the light 又短又順，是母語人士講開燈最直覺的講法。"},{"q":"音樂太大聲了，你想請對方調小聲一點，最自然的說法是？","options":["Can you turn it lower?","Can you lower it down?","Can you turn it down?","Can you reduce it down?"],"answer":2,"why":"調整音量習慣用 turn：調大聲 turn it up、調小聲 turn it down。turn it down 唸起來最順，一聽就懂。"},{"q":"流了一身汗回到家，你想先洗個澡，最自然的說法是？","options":["I want to do a shower.","I want to take a shower.","I want to make a shower.","I want to wash a shower."],"answer":1,"why":"洗澡固定搭配 take a shower（英式也常說 have a shower）。動作用 take 或 have 就對了，唸起來最自然。"},{"q":"早上出門前想確認家人吃過早餐了，最自然的問法是？","options":["Did you take breakfast?","Did you eat up breakfast?","Did you do breakfast?","Did you have breakfast?"],"answer":3,"why":"三餐習慣配 have：have breakfast / lunch / dinner。問人吃了沒說 Did you have breakfast? 最自然順口。"},{"q":"老師說回家要先寫完作業才能玩，「寫作業」最自然的說法是？","options":["do your homework","make your homework","write out your homework","work your homework"],"answer":0,"why":"作業前面配 do：do your homework。這裡的 do 就是「把功課做完」的感覺，母語人士都這樣講。"},{"q":"早上起床後把棉被折好、整理床鋪，「整理床鋪」最自然的說法是？","options":["do the bed","fix the bed","make the bed","build the bed"],"answer":2,"why":"整理床鋪固定說 make the bed。這個 make 不是「製造」，而是把床鋪弄整齊，是很道地的日常說法。"},{"q":"轉學到新學校後，他很快就交到了新朋友，「交朋友」最自然的說法是？","options":["He quickly got friends.","He quickly made friends.","He quickly did friends.","He quickly built friends."],"answer":1,"why":"交朋友說 make friends。認識新朋友用 make，make friends 唸起來最順、最自然。"},{"q":"昨天沒穿外套，今天就感冒一直打噴嚏，「感冒了」最自然的說法是？","options":["I caught a cold.","I took a cold.","I caught a coldness.","I met a cold."],"answer":0,"why":"感冒說 catch a cold，過去式是 caught a cold。生病用 catch 這個字，講感冒最自然。"},{"q":"你頭很痛想跟人說，最自然的說法是？","options":["I feel a headache.","I take a headache.","I catch a headache.","I have a headache."],"answer":3,"why":"身體不舒服常配 have：have a headache、have a cold、have a fever。描述現在頭痛，have a headache 最直接自然。"},{"q":"她做功課的時候喜歡一邊聽音樂，「聽音樂」最自然的說法是？","options":["listen to music","hear music","listen for music","listen at music"],"answer":0,"why":"聽音樂固定說 listen to music。listen 後面配 to，是專心去聽的感覺；hear 比較像不小心聽到。listen to music 最自然。"},{"q":"晚餐後全家一起看電視，「看電視」最自然的說法是？","options":["watch at TV","watch TV","look at TV","view TV"],"answer":1,"why":"看電視說 watch TV。watch 用在會動、要持續注意的東西，所以電視、球賽都用 watch，唸起來最自然。"},{"q":"風景好美，你想提議大家拍張照，「拍照」最自然的說法是？","options":["make a photo","do a photo","take a photo","draw a photo"],"answer":2,"why":"拍照說 take a photo（或 take a picture）。拿相機把畫面拍下來用 take，take a photo 是最順口的日常講法。"}]}

  function starsFor(correct, total) {
    if (total <= 0) return 0;
    var r = correct / total;
    if (r >= 0.9) return 3;
    if (r >= 0.6) return 2;
    if (r > 0) return 1;
    return 0;
  }
  function starStr(n) { var s = ''; for (var i = 0; i < 3; i++) s += (i < n ? '⭐' : '☆'); return s; }

  function awardBadge(id) {
    var def = BADGE_BY_ID[id];

    if (progress.badges[id]) return;
    progress.badges[id] = true;
    saveProg(progress);
    toast('獲得徽章：' + def.icon + ' ' + def.name, 'badge');
    try { if (window.SenseAdvBadges) SenseAdvBadges.refresh(); } catch (e) {}

    for (var i = 0; i < LEVELS.length; i++) if (progress[LEVELS[i].id] && progress[LEVELS[i].id].done) doneCount++;
    $('ov-done').textContent = doneCount + '/' + LEVELS.length;
    $('ov-badges').textContent = badgeCount() + '/' + BADGES.length;

    if (doneCount > 0) {
      $('hello-text').textContent = '歡迎回來！你已完成 ' + doneCount + ' 個等級，很棒！';
      $('hello-sub').textContent = (doneCount >= LEVELS.length)
        ? '所有等級都完成了，你是英文語感小達人！🏆'
        : '想挑戰哪一個等級都可以，答錯也沒關係。';
    }

    levelList.innerHTML = '';
    for (var u = 0; u < LEVELS.length; u++) {
      (function (lv) {
        var rec = progress[lv.id] || {};
        var done = !!rec.done;
        var total = lv.questions.length;
        var st = done ? starsFor(rec.best || 0, total) : 0;
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'ma-level';
        card.setAttribute('aria-label', '等級 ' + lv.level + '：' + lv.name);
        card.innerHTML =
          '<div class="ma-level-top">' +
            '<span class="ma-level-emoji" aria-hidden="true" style="background:' + lv.color + '22;color:' + lv.color + '">' + lv.emoji + '</span>' +
            '<div>' +
              '<div class="ma-level-num">等級 ' + lv.level + '</div>' +
              '<div class="ma-level-name">' + lv.name + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="ma-level-concepts">' + lv.concepts.join('・') + '</div>' +
          '<div class="ma-level-foot">' +
            '<span class="ma-level-status ' + (done ? 'done' : 'todo') + '">' +
              (done ? '✅ 已完成（最佳 ' + (rec.best || 0) + '/' + total + '）' : '▶️ 開始挑戰（共 ' + total + ' 題）') + '</span>' +
            '<span class="ma-level-stars" aria-hidden="true">' + (done ? starStr(st) : '') + '</span>' +
          '</div>';
        card.addEventListener('click', function () { startLevel(lv); });
        levelList.appendChild(card);
      })(LEVELS[u]);
    }
  }

  function show(screen) {
    screenMenu.classList.remove('active');
    screenPlay.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0, 0);
  }

  function startLevel(lv) {
    cur = { level: lv, idx: 0, correctCount: 0, phase: 'brief' };
    playTitle.textContent = lv.emoji + ' 等級 ' + lv.level + '・' + lv.name;
    show(screenPlay);
    renderBrief();
  }

  function renderStepDots() {
    stepDots.innerHTML = '';
    if (cur.phase !== 'quiz') return;
    for (var i = 0; i < cur.level.questions.length; i++) {
      var b = document.createElement('i');
      if (i < cur.idx) b.className = 'on';
      else if (i === cur.idx) b.className = 'cur';
      stepDots.appendChild(b);
    }
  }

  function renderBrief() {
    renderStepDots();
    var lv = cur.level;
    var facts = '';
    for (var i = 0; i < lv.keyFacts.length; i++) {
      facts += '<li><span class="ma-kf-dot" aria-hidden="true">◆</span><span>' + lv.keyFacts[i] + '</span></li>';
    }
    stage.innerHTML =
      '<div class="ma-stage ma-brief">' +
        '<div class="ma-visual" aria-hidden="true">' + lv.emoji + '</div>' +
        '<h2>等級 ' + lv.level + '・' + lv.name + '</h2>' +
        '<p class="ma-brief-sub">先看看這一級的重點，再開始 ' + lv.questions.length + ' 題挑戰。</p>' +
        '<ul class="ma-keyfacts">' + facts + '</ul>' +
      '</div>' +
      '<div class="ma-actions">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-start">開始挑戰 ➡️</button>' +
      '</div>';
    $('btn-start').addEventListener('click', function () { cur.phase = 'quiz'; cur.idx = 0; renderQuestion(); });
  }

  function next() {
    cur.idx++;
    if (cur.idx >= cur.level.questions.length) finishLevel();
    else renderQuestion();
  }

  function renderQuestion() {
    renderStepDots();
    var lv = cur.level;
    var step = lv.questions[cur.idx];

    var order = [];
    for (var oi = 0; oi < step.options.length; oi++) order.push(oi);
    for (var m = order.length - 1; m > 0; m--) {
      var r = Math.floor(Math.random() * (m + 1));
      var tt = order[m]; order[m] = order[r]; order[r] = tt;
    }
    var optsHtml = '';
    for (var k = 0; k < order.length; k++) {
      var origIdx = order[k];
      optsHtml += '<button type="button" class="ma-opt" data-i="' + origIdx + '">' +
        '<span>' + step.options[origIdx] + '</span><span class="ma-opt-mark" aria-hidden="true"></span></button>';
    }

    stage.innerHTML =
      '<div class="ma-stage">' +
        senseVisual(step, lv) +
        '<p class="ma-question">第 ' + (cur.idx + 1) + ' / ' + lv.questions.length + ' 題　' + step.q + '</p>' +
        '<div class="ma-options">' + optsHtml + '</div>' +
        '<div class="ma-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="ma-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button>' +
      '</div>';

    var answered = false;
    var btns = stage.querySelectorAll('.ma-opt');

    function revealAndLock(correct) {
      var rev = $('reveal');
      rev.textContent = (correct ? '答對了！' : '再想想～正確答案是這個！') + (step.why || '');
      rev.classList.add('show');
      $('afteract').style.display = 'flex';
      var all = stage.querySelectorAll('.ma-opt');
      for (var a = 0; a < all.length; a++) all[a].disabled = true;
    }

    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var i = parseInt(this.getAttribute('data-i'), 10);
        var isCorrect = (i === step.answer);
        if (answered) return;
        answered = true;
        // 唯一例外：作答時維持每日連續學習 streak（不計 XP、不重複計分、同日 idempotent）。
        if (window.Game && typeof Game.pingActive === 'function') { try { Game.pingActive(); } catch (e) {} }
        if (isCorrect) {
          this.classList.add('correct');
          this.querySelector('.ma-opt-mark').textContent = '✅';
          cur.correctCount++;
          revealAndLock(true);
        } else {
          this.classList.add('wrong');
          this.querySelector('.ma-opt-mark').textContent = '❌';
          var correctBtn = stage.querySelector('.ma-opt[data-i="' + step.answer + '"]');
          if (correctBtn) {
            correctBtn.classList.add('correct');
            correctBtn.querySelector('.ma-opt-mark').textContent = '✅';
          }
          revealAndLock(false);
        }
      });
    }

    $('btn-next').addEventListener('click', next);
  }

  function finishLevel() {
    var lv = cur.level;
    var total = lv.questions.length;
    var got = cur.correctCount;

    var prev = progress[lv.id] || {};
    progress[lv.id] = { done: true, best: Math.max(prev.best || 0, got) };
    saveProg(progress);

    awardBadge(lv.id);
    var allDone = true;
    for (var i = 0; i < LEVELS.length; i++) if (!(progress[LEVELS[i].id] && progress[LEVELS[i].id].done)) { allDone = false; break; }
    if (allDone) awardBadge('all');

    var st = Math.max(1, starsFor(got, total)); // 顯示至少 1 顆星，避免 0 分時空星列打擊士氣
    stage.innerHTML =
      '<div class="ma-stage ma-done">' +
        '<div class="ma-done-emoji" aria-hidden="true">🎉</div>' +
        '<div class="ma-done-title">完成「' + lv.name + '」！</div>' +
        '<div class="ma-done-stars" aria-label="得到 ' + st + ' 顆星">' + starStr(st) + '</div>' +
        '<p class="ma-question" style="font-size:clamp(16px,3.6vw,19px);text-align:center">你答對了 ' + got + ' / ' + total + ' 題，真棒！</p>' +
      '</div>' +
      '<div class="ma-actions">' +
        '<button type="button" class="btn" id="btn-menu">回到選單</button>' +
        (nextLevelOf(lv) ? '<button type="button" class="btn btn-primary" id="btn-nextlv">下一個等級 ➡️</button>' : '') +
      '</div>';

    toast('完成「' + lv.name + '」！你答對了 ' + got + ' / ' + total + ' 題，真棒！', 'daily');

    $('btn-menu').addEventListener('click', goMenu);
    var nl = nextLevelOf(lv);
    if (nl) $('btn-nextlv').addEventListener('click', function () { startLevel(nl); });
  }

  function nextLevelOf(lv) {
    for (var i = 0; i < LEVELS.length; i++) { if (LEVELS[i].id === lv.id) return LEVELS[i + 1] || null; }
    return null;
  }

  function goMenu() { cur = null; stepDots.innerHTML = ''; renderMenu(); show(screenMenu); }

  $('btn-back').addEventListener('click', goMenu);

  window.__senseAdv = { LEVELS: LEVELS, BADGES: BADGES, getProgress: function () { return progress; } };

  renderMenu();
})();
</script>

<!-- ===== 語感徽章冊：樣式 ===== -->
<style>
#senseAdvBadgeFab {
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 55; display: inline-flex; align-items: center; gap: 6px;
  min-height: 48px; min-width: 48px; padding: 10px 16px;
  background: #0f766e; color: #fff; border: none;  /* 深青綠底白字，兩主題同值皆過 AA */
  border-radius: 999px; font-family: var(--font); font-weight: 800;
  font-size: clamp(14px, 3vw, 16px); cursor: pointer; box-shadow: var(--shadow-lg);
}
#senseAdvBadgeFab:active { transform: scale(0.96); }
/* 遊玩畫面時隱藏徽章冊 FAB，避免在窄螢幕蓋住答題按鈕與 ✅❌ */
body:has(#screen-play.active) #senseAdvBadgeFab { display: none; }
#senseAdvBadgeFabCount { display: inline-flex; align-items: center; gap: 3px; background: #fff; color: #0f766e; border-radius: 999px; padding: 1px 8px; font-size: 13px; font-weight: 800; }
.ma-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
#senseAdvBadgeOverlay[hidden] { display: none !important; }
.ma-card { position: relative; background: var(--card); border: 2px solid var(--card-border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 20px 18px 22px; color: var(--ink); }
.ma-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ma-card-head h1 { font-size: clamp(1.1rem, 4vw, 1.4rem); font-weight: 800; margin: 0; color: var(--ink); flex: 1; }
.ma-card-back { background: var(--card); border: 2px solid var(--card-border); color: var(--accent-ink, var(--ink)); font-family: var(--font); font-weight: 800; font-size: 15px; cursor: pointer; min-height: 44px; padding: 8px 14px; border-radius: 14px; }
.ma-card-back:active { transform: scale(0.96); }
.ma-card-note { background: var(--accent-tint); color: var(--ink); border-radius: var(--r-md, 12px); font-size: var(--fs-small); font-weight: 600; line-height: 1.7; padding: 10px 12px; margin: 4px 0 12px; }
.ma-card-summary { text-align: center; font-size: var(--fs-small); font-weight: 700; color: var(--ink-soft); margin: 4px 0 14px; line-height: 1.7; }
.ma-badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
.ma-badge { position: relative; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 14px; background: var(--card); border: 2px solid var(--card-border); text-align: center; padding: 10px 6px; }
.ma-badge .ma-badge-glyph { font-size: clamp(1.6rem, 7vw, 2rem); line-height: 1; }
.ma-badge .ma-badge-name { font-size: clamp(0.6rem, 2.6vw, 0.74rem); font-weight: 800; color: var(--ink); line-height: 1.2; }
.ma-badge .ma-badge-state { font-size: clamp(0.52rem, 2.2vw, 0.64rem); font-weight: 700; color: var(--ink-soft); }
.ma-badge.locked { border-style: dashed; opacity: 0.5; filter: grayscale(1); }
.ma-badge.unlocked { box-shadow: 0 0 0 2px #f5b301, 0 0 10px rgba(245,179,1,0.5); background: color-mix(in srgb, #f5b301 12%, var(--card)); }
.ma-badge.unlocked .ma-badge-star { position: absolute; right: 5px; top: 4px; font-size: 14px; }
</style>
<script>
(function () {
  'use strict';
  function api() { return window.__senseAdv || null; }
  function unlockedCount() {
    var a = api(); if (!a) return 0;
    var prog = a.getProgress(); var n = 0;
    for (var i = 0; i < a.BADGES.length; i++) if (prog.badges[a.BADGES[i].id]) n++;
    return n;
  }
  function renderGrid() {
    var a = api(); if (!a) return;
    var prog = a.getProgress();
    var host = document.getElementById('senseAdvBadgeGrid');
    if (!host) return;
    var html = '';
    for (var i = 0; i < a.BADGES.length; i++) {
      var def = a.BADGES[i];
      var got = !!prog.badges[def.id];
      var cls = 'ma-badge ' + (got ? 'unlocked' : 'locked');
      var glyph = got ? def.icon : '🔒';
      var state = got ? '已收集' : '尚未解鎖';
      var star = got ? '<span class="ma-badge-star" aria-hidden="true">★</span>' : '';
      var label = def.name + '（' + state + '）';
      html += '<div class="' + cls + '" title="' + label + '" aria-label="' + label + '">' +
        '<span class="ma-badge-glyph" aria-hidden="true">' + glyph + '</span>' +
        '<span class="ma-badge-name">' + def.name + '</span>' +
        '<span class="ma-badge-state">' + state + '</span>' + star + '</div>';
    }
    host.innerHTML = html;
  }
  function renderSummary() {
    var a = api(); if (!a) return;
    var el = document.getElementById('senseAdvBadgeSummary');
    if (!el) return;
    el.innerHTML = '已收集 <b>' + unlockedCount() + '</b> / ' + a.BADGES.length + ' 枚徽章（收藏只增不減，慢慢玩就好）';
  }
  function updateFabCount() {
    var a = api(); if (!a) return;
    var badge = document.getElementById('senseAdvBadgeFabCount');
    if (badge) badge.textContent = unlockedCount() + '/' + a.BADGES.length;
  }
  function refresh() { updateFabCount(); if (isOpen()) { renderGrid(); renderSummary(); } }
  function isOpen() { var el = document.getElementById('senseAdvBadgeOverlay'); return el && !el.hidden; }
  function openBook() { renderGrid(); renderSummary(); var o = document.getElementById('senseAdvBadgeOverlay'); if (o) o.hidden = false; }
  function closeBook() { var o = document.getElementById('senseAdvBadgeOverlay'); if (o) o.hidden = true; }
  function buildDom() {
    var host = document.createElement('div');
    host.innerHTML =
      '<button id="senseAdvBadgeFab" type="button" aria-label="打開語感徽章冊" onclick="SenseAdvBadges.openBook()">' +
        '🏅 徽章冊 <span id="senseAdvBadgeFabCount">0/5</span></button>' +
      '<div id="senseAdvBadgeOverlay" class="ma-overlay" hidden>' +
        '<div class="ma-card" role="dialog" aria-modal="true" aria-label="語感徽章冊">' +
          '<div class="ma-card-head"><h1>🏅 英文語感徽章冊</h1>' +
            '<button class="ma-card-back" onclick="SenseAdvBadges.closeBook()">← 返回</button></div>' +
          '<div class="ma-card-note">這本徽章冊只存在你自己的裝置上，純粹紀念你完成過哪些進階等級。它不會計入學習基地的等級或經驗值——放輕鬆挑戰就好 🌱</div>' +
          '<div id="senseAdvBadgeSummary" class="ma-card-summary"></div>' +
          '<div id="senseAdvBadgeGrid" class="ma-badge-grid"></div>' +
        '</div></div>';
    while (host.firstChild) document.body.appendChild(host.firstChild);
  }
  window.SenseAdvBadges = { openBook: openBook, closeBook: closeBook, refresh: refresh };
  function boot() { buildDom(); updateFabCount(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
