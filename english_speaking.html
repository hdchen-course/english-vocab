<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>開口說（情境溝通）</title>
<link rel="stylesheet" href="assets/app.css">
<script src="game_core.js"></script>
<style>
  .sp-wrap{ max-width:none; margin:0 auto; padding:14px clamp(18px,3vw,48px) 44px; }
  .sp-intro{ margin:4px 0 14px; }
  .sp-intro h1{ font-size:23px; margin:0 0 4px; color:var(--ink); display:flex; align-items:center; gap:10px; }
  .sp-intro p{ margin:0; color:var(--ink-soft); font-size:14px; line-height:1.55; }
  .sp-overall{ font-size:13px; color:var(--c-english-ink); font-weight:700; margin-top:6px; }
  /* 10 大情境類別：每類一個 section（類別標題列 + 該類單元卡牆）。 */
  .sp-cats{ display:flex; flex-direction:column; gap:18px; margin-top:6px; }
  .sp-cat{ min-width:0; }
  .sp-cat-head{ display:flex; align-items:baseline; gap:10px; margin:0 0 10px;
    padding-bottom:7px; border-bottom:2px solid var(--c-english); }
  .sp-cat-em{ font-size:21px; line-height:1; }
  .sp-cat-name{ font-size:16px; font-weight:800; color:var(--c-english-ink); }
  /* AC-A11Y-1：白字計數需 ≥4.5:1。原 #fff on --c-english(#00b894)≈2.5:1 不足；改較深的
     --c-english-ink(#07775c，白字 5.52:1)達 WCAG AA。 */
  .sp-cat-count{ font-size:12px; font-weight:700; color:var(--u-on-english-solid); background:var(--c-english-ink);
    border-radius:999px; padding:2px 9px; margin-left:auto; white-space:nowrap; }
  /* 卡牆：auto-fill 多欄，充分利用 iPad 寬度。卡片對齊全站房屋卡（index_new .lp-unitcard）：
     var(--card) 底＋1px card-border＋島色(teal) 4px 左條＋radius 12＋淡陰影，hover 抬陰影（不填色反白）；
     內容＝emoji＋標題＋can-do（2 行截斷）＋分鐘 meta，與 hub 單元牆卡同設計語言。 */
  .sp-units{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .sp-unit{ display:flex; flex-direction:column; gap:5px; text-decoration:none; background:var(--card);
    border:1px solid var(--card-border); border-left:4px solid var(--c-english); border-radius:12px;
    padding:13px 15px; color:var(--ink); box-shadow:var(--u-card-shadow);
    transition:box-shadow .12s; min-width:0; min-height:44px; box-sizing:border-box; }
  .sp-unit:hover{ box-shadow:var(--u-shadow-card-hover); }
  .sp-unit:focus-visible{ outline:3px solid var(--c-focus); outline-offset:2px; }
  .sp-unit .sp-u-top{ display:flex; align-items:center; gap:9px; min-width:0; }
  .sp-unit .em{ font-size:19px; flex:0 0 auto; }
  .sp-unit .tx{ font-size:14.5px; font-weight:700; line-height:1.35; min-width:0; color:var(--ink); }
  .sp-unit .sp-u-can{ font-size:12.5px; color:var(--ink-soft); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sp-unit .sp-u-meta{ font-size:11.5px; color:var(--ink-soft); }
  .sp-foot{ color:var(--ink-soft); font-size:12px; margin-top:24px; border-top:1px solid var(--card-border); padding-top:12px; }
</style>
</head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index_new.html" aria-label="回到學習地圖">
    <span class="app-bar__home-icon" aria-hidden="true">🗺️</span><span class="app-bar__home-label">學習地圖</span>
  </a>
  <span class="app-bar__title">開口說 🗣️</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="sp-wrap">
  <div class="sp-intro">
    <h1><span aria-hidden="true">🗣️</span>開口說（情境溝通）</h1>
    <p>用真實生活情境學「能用的一句話」：先聽先感覺 → 練一練 → 跟著讀、模仿語調 → 自評。每個單元也內含聽寫與跟讀。分成十大生活情境，選一個開始：</p>
    <div class="sp-overall" id="overall"></div>
  </div>
  <div class="sp-cats" id="cats"><p id="loading" style="color:var(--ink-soft)">載入中…</p></div>
  <footer class="sp-foot">資料來源：data/units_index.json（由 tools/gen_derived.py 掃各 *.units.json 衍生）。情境分類見 authoring/english_island_blueprint.md §8。</footer>
</main>
<script>
/* 每單元頁的 emoji */
const EMO={ "english_greetings.html":"👋","english_howareyou.html":"🙂","english_phone.html":"📞","english_compliment.html":"👍","english_playwithme.html":"🙌","english_timegreet.html":"🌅","english_courtesy.html":"🙏","english_seeyou.html":"👋","english_welcome.html":"🏡","english_encourage.html":"💪",
  "english_age.html":"🎂","english_family.html":"👨‍👩‍👧","english_likes.html":"❤️","english_possessive.html":"🎒","english_jobs.html":"👩‍🏫","english_morefamily.html":"👵","english_morejobs.html":"👩‍⚕️","english_hecan.html":"🏅","english_farmanimals.html":"🐮","english_morejobs2.html":"🧑‍✈️",
  "english_borrow.html":"🤝","english_thereis.html":"📦","english_schoolsupplies.html":"✏️","english_myschoolthings.html":"📐","english_classroom.html":"📖","english_hehas.html":"🎒","english_classcommands.html":"🙋","english_myschool2.html":"✏️","english_seeschool.html":"📕","english_haveschool.html":"🖊️",
  "english_time.html":"⏰","english_days.html":"📆","english_months.html":"🗓️","english_howmany.html":"🔢","english_birthday.html":"🎉","english_addition.html":"➕","english_subtraction.html":"➖","english_counting.html":"🔟","english_teens.html":"🔢","english_counting20.html":"🔢",
  "english_ordering.html":"☕","english_want.html":"🥛","english_hungry.html":"🍽️","english_canihave.html":"🥤","english_likefood.html":"🍕","english_helikes.html":"😋","english_fruit.html":"🍓","english_morefood.html":"🍗","english_drinks.html":"🧃","english_fastfood.html":"🍔",
  "english_shopping.html":"🛍️","english_colors.html":"🎨","english_price.html":"💰","english_buyfruit.html":"🍎","english_wantclothes.html":"👕","english_morecolors.html":"🌈","english_wearmore.html":"🧥","english_pricetens.html":"💵","english_pricehundred.html":"💴",
  "english_directions.html":"🧭","english_where.html":"📍","english_hotel.html":"🏨","english_commute.html":"🚌","english_going.html":"🚶","english_atplace.html":"🏞️","english_gomore.html":"✈️","english_atplace2.html":"📍","english_seetransport.html":"🚌","english_seeplaces.html":"🏫",
  "english_body.html":"🖐️","english_doctor.html":"🩺","english_feelok.html":"🤕","english_hygiene.html":"🧼","english_eatwell.html":"🥦","english_bodycount.html":"👀","english_touchmore.html":"🙆","english_sickadvice.html":"🤒","english_touchbody.html":"🧏","english_touchface.html":"🧍",
  "english_weather.html":"⛅","english_weatherwear.html":"🧥","english_weathermore.html":"🌬️","english_isweather.html":"🌡️","english_nature.html":"🌀","english_seasons.html":"🍂","english_weatheradj.html":"🌤️","english_likeseason.html":"🍃","english_likeweather.html":"☀️","english_sky.html":"🌌",
  "english_doing.html":"🏃","english_canability.html":"🏊","english_yesterday.html":"📅","english_letsgo.html":"🏞️","english_canido.html":"✋","english_seeanimals.html":"🐾","english_animalcolors.html":"🖍️","english_heshedoing.html":"🤸","english_havepet.html":"🐶","english_wearing.html":"🧢","english_wildanimals.html":"🦁" };
/* 10 大情境類別（固定順序；blueprint §8）。每類目標約 10 句。 */
const CATS=[
  {key:"social",   em:"👋", name:"打招呼與社交",     pages:["english_greetings.html","english_howareyou.html","english_phone.html","english_compliment.html","english_playwithme.html","english_timegreet.html","english_courtesy.html","english_seeyou.html","english_welcome.html","english_encourage.html"]},
  {key:"people",   em:"🙋", name:"認識自己與他人",   pages:["english_age.html","english_family.html","english_likes.html","english_possessive.html","english_jobs.html","english_morefamily.html","english_morejobs.html","english_hecan.html","english_farmanimals.html","english_morejobs2.html"]},
  {key:"school",   em:"🏫", name:"學校生活",         pages:["english_borrow.html","english_thereis.html","english_schoolsupplies.html","english_myschoolthings.html","english_classroom.html","english_hehas.html","english_classcommands.html","english_myschool2.html","english_seeschool.html","english_haveschool.html"]},
  {key:"numtime",  em:"🔢", name:"數字・時間・日期", pages:["english_counting.html","english_teens.html","english_counting20.html","english_time.html","english_days.html","english_months.html","english_howmany.html","english_birthday.html","english_addition.html","english_subtraction.html"]},
  {key:"food",     em:"🍔", name:"食物與點餐",       pages:["english_ordering.html","english_want.html","english_hungry.html","english_canihave.html","english_likefood.html","english_helikes.html","english_fruit.html","english_morefood.html","english_drinks.html","english_fastfood.html"]},
  {key:"shopping", em:"🛍️", name:"購物",             pages:["english_shopping.html","english_colors.html","english_price.html","english_buyfruit.html","english_wantclothes.html","english_morecolors.html","english_wearmore.html","english_wearing.html","english_pricetens.html","english_pricehundred.html"]},
  {key:"travel",   em:"🧭", name:"問路與交通",       pages:["english_directions.html","english_where.html","english_hotel.html","english_commute.html","english_going.html","english_atplace.html","english_gomore.html","english_atplace2.html","english_seetransport.html","english_seeplaces.html"]},
  {key:"health",   em:"🩺", name:"身體與健康",       pages:["english_body.html","english_doctor.html","english_feelok.html","english_hygiene.html","english_eatwell.html","english_bodycount.html","english_touchmore.html","english_sickadvice.html","english_touchbody.html","english_touchface.html"]},
  {key:"weather",  em:"⛅", name:"天氣與季節",       pages:["english_weather.html","english_weatherwear.html","english_weathermore.html","english_isweather.html","english_nature.html","english_seasons.html","english_weatheradj.html","english_likeseason.html","english_likeweather.html","english_sky.html"]},
  {key:"daily",    em:"🏃", name:"日常生活與興趣 Daily life", pages:["english_doing.html","english_canability.html","english_yesterday.html","english_letsgo.html","english_canido.html","english_seeanimals.html","english_animalcolors.html","english_heshedoing.html","english_havepet.html","english_wildanimals.html"]}
];
const TARGET_PER_CAT=10;
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* 單元卡（對齊全站房屋卡 .lp-unitcard）：emoji＋標題＋can-do（2 行截斷）＋分鐘 meta。 */
function unitCard(u){
  return '<a class="sp-unit" href="'+esc(u.page)+'">'+
    '<span class="sp-u-top"><span class="em" aria-hidden="true">'+(EMO[u.page]||'💡')+'</span>'+
    '<span class="tx">'+esc(u.title_zh)+'</span></span>'+
    (u.can_do?'<span class="sp-u-can">'+esc(u.can_do)+'</span>':'')+
    (u.est_minutes?'<span class="sp-u-meta">⏱ 約 '+esc(u.est_minutes)+' 分</span>':'')+'</a>';
}
fetch('data/units_index.json',{cache:'no-store'}).then(r=>r.ok?r.json():{units:[]}).catch(()=>({units:[]})).then(ui=>{
  const us=(ui.units||[]).filter(u=>u.subject==='eng');
  const byPage={}; us.forEach(u=>{ byPage[u.page]=u; });
  const el=document.getElementById('cats');
  if(!us.length){ el.innerHTML='<p style="color:var(--ink-soft)">單元建置中。</p>'; return; }
  let placed=0;
  const blocks=CATS.map(cat=>{
    const units=cat.pages.map(p=>byPage[p]).filter(Boolean);
    if(!units.length) return '';
    placed+=units.length;
    const cards=units.map(unitCard).join('');
    return '<section class="sp-cat"><div class="sp-cat-head">'+
      '<span class="sp-cat-em" aria-hidden="true">'+cat.em+'</span>'+
      '<span class="sp-cat-name">'+esc(cat.name)+'</span>'+
      '<span class="sp-cat-count">'+units.length+' / '+TARGET_PER_CAT+'</span></div>'+
      '<div class="sp-units">'+cards+'</div></section>';
  }).join('');
  el.innerHTML=blocks;
  /* 開口說＝情境會話練習，只呈現 CATS 定義的 10 大情境（SSOT）。
     刻意「不」把未列入 CATS 的 eng 單元（文法單元等）倒進「其他」——那是舊版造成文法單元
     洩漏進開口說的 bug 根源（2026-11-02 HD 抓到）。新情境單元要顯示，須明確加進對應情境的 CATS。 */
  document.getElementById('overall').textContent='目前 '+placed+' / ~'+(CATS.length*TARGET_PER_CAT)+' 句常用對話（十大情境持續補到每類約 '+TARGET_PER_CAT+' 句）';
});
</script>
</body>
</html>
