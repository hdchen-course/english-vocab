<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>開口說（情境溝通）</title>
<link rel="stylesheet" href="assets/app.css">
<script src="game_core.js"></script>
<style>
  .sp-wrap{ max-width:none; margin:0 auto; padding:14px clamp(18px,3vw,48px) 40px; }
  .sp-intro{ margin:4px 0 16px; }
  .sp-intro h1{ font-size:23px; margin:0 0 4px; color:var(--ink); display:flex; align-items:center; gap:10px; }
  .sp-intro p{ margin:0; color:var(--ink-soft); font-size:14px; line-height:1.55; }
  /* 兩欄表格版面：左欄＝情境名、右欄＝單元卡；情境名與卡片同一列垂直置中 → 徹底對齊，
     不再有「標題在上、卡片在下」因標題行數不一而高低不齊的問題（table style）。 */
  .sp-table{ display:grid; grid-template-columns:max-content minmax(0,1fr); gap:12px 22px; align-items:center; }
  .sp-rlabel{ font-size:13.5px; font-weight:700; color:var(--c-english-ink); line-height:1.35; }
  .sp-runits{ display:flex; flex-wrap:wrap; gap:8px; }
  .sp-unit{ display:inline-flex; align-items:center; gap:8px; text-decoration:none; background:var(--card);
    border:1px solid var(--c-english); border-radius:10px; padding:9px 13px; color:var(--ink); }
  .sp-unit:hover{ background:var(--c-english); color:#fff; }
  .sp-unit:focus-visible{ outline:3px solid var(--c-focus); outline-offset:2px; }
  .sp-unit .em{ font-size:17px; }
  @media (max-width:640px){ /* 窄螢幕改單欄：情境名在上、卡片在下 */
    .sp-table{ grid-template-columns:1fr; gap:6px; }
    .sp-rlabel{ margin-top:8px; }
  }
  .sp-foot{ color:var(--ink-soft); font-size:12px; margin-top:22px; border-top:1px solid var(--card-border); padding-top:12px; }
</style>
</head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index_new.html" aria-label="回到學習地圖">
    <span class="app-bar__home-icon" aria-hidden="true">🗺️</span><span class="app-bar__home-label">學習地圖</span>
  </a>
  <span class="app-bar__title">開口說 🗣️</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="sp-wrap">
  <div class="sp-intro">
    <h1><span aria-hidden="true">🗣️</span>開口說（情境溝通）</h1>
    <p>用真實生活情境學「能用的一句話」：先聽先感覺 → 練一練 → 跟著讀、模仿語調 → 自評。每個單元也內含聽寫與跟讀。選一個情境開始：</p>
  </div>
  <div id="groups"><p id="loading" style="color:var(--ink-soft)">載入中…</p></div>
  <footer class="sp-foot">資料來源：authoring/units_index.json（由 tools/gen_derived.py 掃各 *.units.json 衍生）。</footer>
</main>
<script>
const EMO={ "english_greetings.html":"👋","english_directions.html":"🧭","english_ordering.html":"☕",
  "english_shopping.html":"🛍️","english_time.html":"⏰","english_doctor.html":"🩺",
  "english_hotel.html":"🏨","english_weather.html":"⛅" };
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
fetch('authoring/units_index.json',{cache:'no-store'}).then(r=>r.ok?r.json():{units:[]}).catch(()=>({units:[]})).then(ui=>{
  const us=(ui.units||[]).filter(u=>u.subject==='eng');
  const el=document.getElementById('groups');
  if(!us.length){ el.innerHTML='<p style="color:var(--ink-soft)">單元建置中。</p>'; return; }
  const groups=[], gi={};
  us.forEach(u=>{ const g=u.situation_group||'其他'; if(!(g in gi)){ gi[g]=groups.length; groups.push([g,[]]); } groups[gi[g]][1].push(u); });
  el.innerHTML='<div class="sp-table">'+groups.map(([g,list])=>
    '<div class="sp-rlabel">'+esc(g)+'</div><div class="sp-runits">'+
    list.map(u=>'<a class="sp-unit" href="'+esc(u.page)+'"><span class="em" aria-hidden="true">'+(EMO[u.page]||'💡')+'</span><span>'+esc(u.title_zh)+'</span></a>').join('')+
    '</div>').join('')+'</div>';
});
</script>
</body>
</html>
