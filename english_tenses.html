<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文時態全套 ⏳</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<link rel="stylesheet" href="concept.css">
<script src="game_core.js"></script>
<style>:root{ --su:#0d9488; --su-tint:rgba(13,148,136,0.14); } :root[data-theme="dark"]{ --su:#5eead4; --su-tint:rgba(94,234,212,0.18); }</style>
</head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">英文時態全套 ⏳</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">
  <section id="screen-menu" class="cn-screen active cn-wrap">
    <div class="cn-topbar"><span class="cn-title">英文時態全套 ⏳</span></div>
    <div class="cn-hello"><span class="cn-mascot" aria-hidden="true">⏳</span>
      <div><div class="cn-htext" id="hello">用一條時間軸看懂：昨天做過的、過去正在做的、明天要做的、到現在為止已完成的。</div>
      <div class="cn-hsub">每個時態都是「教一小段 → 馬上練習」，看著時間軸慢慢來就好。</div></div></div>
    <div class="cn-lessons" id="lesson-list"></div>
    <a class="cn-nextup" href="english_sense.html"><span class="cn-nextup-ic" aria-hidden="true">🗣️</span><span>學會了嗎？接著到「英文語感」開始練習 →</span></a>
    <p class="cn-note">這裡是「先學觀念」的教學小旅程，只留在你的裝置上，不影響學習基地的等級或經驗值。</p>
  </section>
  <section id="screen-play" class="cn-screen cn-wrap">
    <div class="cn-topbar"><button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button><span class="cn-title" id="play-title">時態</span></div>
    <div class="cn-progress" id="prog" aria-hidden="true"></div>
    <div id="stage"></div>
  </section>
</main>
<script src="english_tenses.js"></script>
<script src="anim_core.js"></script>
<script src="concept_engine.js"></script>
