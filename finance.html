<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理財小達人 · 錢的探險 💰</title>
<!-- 統一遊戲化引擎：先載共用設計 token（assets/app.css），再載 HUD/toast 樣式
     （game_core.css），最後同步載入引擎（game_core.js）。
     本頁為全新頁面（greenfield），沒有任何 legacy 資料來源，因此「不」宣告
     data-game-wired；只透過 Game.recordAnswer('finance', ...) 即時記帳。
     兒童安全（§6.5）：學習金幣＝經驗值，畫面明示「這是學習點數，不是真的錢」；
     無抽卡／轉盤／下注／戰利品箱／真錢購買；章節式推進、不綁每日、不設會歸零的
     連勝與限時急迫；分享完全脫離獎勵、僅給情感回饋。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* =====================================================================
 * finance.html — 本頁樣式（全部建立在 assets/app.css 的設計 token 上，
 * 因此自動亮/暗色主題化、與學習基地視覺一致）。
 * =================================================================== */

/* 本頁強調色沿用理財科的青綠 --c-finance。 */
:root { --fi: var(--c-finance); --fi-tint: var(--tint-finance); --fi-ink: #00756c; }
:root[data-theme="dark"] { --fi-ink: var(--c-finance); }

body { overflow-x: hidden; }

/* 頁面頂列（返回、標題、主題切換） */
.fi-topbar { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s4); }
.fi-topbar .fi-title { flex: 1; font-size: var(--fs-h2); font-weight: 800; color: var(--ink); min-width: 0; }

/* 螢幕切換 */
.fi-screen { display: none; animation: fi-fade 0.3s ease; }
.fi-screen.active { display: block; }
@keyframes fi-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fi-pop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .fi-screen, .fi-pop { animation: none !important; } }

/* 吉祥物歡迎卡 */
.fi-hello { display: flex; align-items: center; gap: var(--s3); padding: var(--s4);
  background: var(--fi-tint); border: 1px solid var(--card-border); border-radius: var(--r-lg); margin-bottom: var(--s4); }
.fi-hello .fi-mascot { font-size: 46px; flex: none; line-height: 1; }
.fi-hello .fi-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.fi-hello .fi-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }

/* 學習點數安全提示條 */
.fi-note {
  display: flex; align-items: center; gap: var(--s2);
  padding: 10px var(--s3); margin-bottom: var(--s4);
  background: var(--fi-tint); border: 1px dashed var(--fi);
  border-radius: var(--r-md); color: var(--ink); font-weight: 700; font-size: var(--fs-small);
}
.fi-note .fi-note-ico { font-size: 20px; flex: none; }

/* 進度總覽小列（無「每日連勝」——本科為章節式推進） */
.fi-overview { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s4); flex-wrap: wrap; }
.fi-overview .stat-tile { flex: 1; min-width: 96px; }

/* 單元選單 grid */
.fi-units { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.fi-unit { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4); text-align: left;
  cursor: pointer; border: 2px solid var(--card-border); background: var(--card); border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm); transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  font-family: var(--font); color: var(--ink); }
.fi-unit.flagship { border-color: var(--fi); background: linear-gradient(135deg, var(--fi-tint), var(--card)); }
.fi-unit:hover { box-shadow: var(--shadow-lg); border-color: var(--fi); }
.fi-unit:active { transform: scale(0.98); }
.fi-unit-top { display: flex; align-items: center; gap: var(--s3); }
.fi-unit-emoji { font-size: 34px; width: 56px; height: 56px; flex: none; display: flex; align-items: center;
  justify-content: center; background: var(--fi-tint); border-radius: 16px; }
.fi-unit-num { font-size: var(--fs-small); font-weight: 700; color: var(--fi-ink); }
.fi-unit-name { font-size: var(--fs-body); font-weight: 800; color: var(--ink); line-height: 1.25; }
.fi-unit-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: 2px; }
.fi-unit-status { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-small); font-weight: 700; }
.fi-unit-status.done { color: var(--c-correct-ink); }
.fi-unit-status.todo { color: var(--ink-soft); }
.fi-unit-dots { display: inline-flex; gap: 3px; }
.fi-unit-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--card-border); display: inline-block; }
.fi-unit-dots i.on { background: var(--fi); }

/* 一句一畫面的大卡 */

.fi-visual { font-size: clamp(60px, 20vw, 104px); line-height: 1.1; margin: var(--s2) 0 var(--s3); user-select: none; }
.fi-sentence { font-size: clamp(19px, 4.5vw, 24px); font-weight: 800; color: var(--ink); line-height: 1.45;
  margin: 0 auto var(--s4); max-width: 32ch; }
.fi-sub { font-size: var(--fs-body); color: var(--ink-soft); font-weight: 700; margin: 0 auto var(--s3); max-width: 34ch; }
.fi-toolrow { display: flex; justify-content: center; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s3); }

/* 進度：本單元第幾步 */
.fi-steps { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: var(--s3); }
.fi-steps i { width: 22px; height: 6px; border-radius: 999px; background: var(--card-border); }
.fi-steps i.on { background: var(--fi); }
.fi-steps i.cur { background: var(--fi); box-shadow: 0 0 0 3px var(--fi-tint); }

/* 選項按鈕（tap 作答；命中區 ≥56px） */


.fi-opt:active { transform: scale(0.98); }
.fi-opt:disabled { cursor: default; }
.fi-opt.correct { border-color: var(--c-correct); background: var(--tint-english); color: var(--ink); }
.fi-opt.wrong { border-color: var(--c-wrong); background: rgba(255,118,117,0.12); color: var(--ink); }
.fi-opt .fi-opt-mark { margin-left: auto; font-size: 22px; }

/* 揭示區（tap-to-reveal / 答案解說） */
.fi-reveal { margin-top: var(--s4); padding: var(--s3) var(--s4); background: var(--fi-tint); border-radius: var(--r-md);
  font-size: var(--fs-body); font-weight: 700; color: var(--ink); line-height: 1.55; text-align: left; display: none; }
.fi-reveal.show { display: block; animation: fi-fade 0.3s ease; }
@media (prefers-reduced-motion: reduce) { .fi-reveal.show { animation: none; } }

/* 底部行動列 */

.fi-actions .btn { flex: 1; min-width: 140px; }

/* 完成畫面 */
.fi-done { text-align: center; padding: var(--s5) var(--s4); }
.fi-done-emoji { font-size: clamp(64px, 22vw, 100px); }
.fi-done-stars { font-size: 34px; letter-spacing: 4px; margin: var(--s2) 0; }
.fi-done-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); }

/* ---- 配對遊戲（工作 → 幫忙解決的問題） ---- */
.fi-match { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin: var(--s3) 0; text-align: left; }
.fi-match-col-label { font-size: var(--fs-small); font-weight: 700; color: var(--ink-soft); text-align: center; }
.fi-tile { min-height: 56px; width: 100%; padding: 12px 14px; border: 2px solid var(--card-border); border-radius: 14px;
  background: var(--card); color: var(--ink); font-family: var(--font); font-size: clamp(14px, 3.1vw, 17px);
  font-weight: 700; text-align: left; cursor: pointer; margin-bottom: var(--s2); }
.fi-tile:active { transform: scale(0.98); }
.fi-tile.sel { border-color: var(--fi); background: var(--fi-tint); }
.fi-tile.matched { border-color: var(--c-correct); background: var(--card); color: var(--c-english-ink); cursor: default; }
.fi-tile.shake { animation: fi-shake 0.3s; }
@keyframes fi-shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

/* ---- 需要 vs 想要（每列兩個大鈕） ---- */
.fi-nw-row { display: grid; grid-template-columns: 1fr auto; gap: var(--s2); align-items: center; margin-bottom: var(--s3);
  padding: var(--s2) var(--s3); border: 2px solid var(--card-border); border-radius: 14px; background: var(--card); }
.fi-nw-row.done { border-color: var(--c-correct); background: var(--tint-english); }
.fi-nw-item { display: flex; align-items: center; gap: var(--s2); font-weight: 800; color: var(--ink); font-size: var(--fs-body); }
.fi-nw-item .fi-nw-emoji { font-size: 30px; }
.fi-nw-btns { display: flex; gap: 6px; flex: none; }
.fi-nw-btn { min-height: 48px; min-width: 68px; padding: 8px 12px; border: 2px solid var(--card-border);
  border-radius: 12px; background: var(--card); color: var(--ink); font-family: var(--font); font-weight: 800;
  font-size: var(--fs-small); cursor: pointer; }
.fi-nw-btn:active { transform: scale(0.96); }
.fi-nw-tag { font-weight: 800; color: var(--c-correct-ink); font-size: var(--fs-small); }

/* ---- 撲滿溫度計 ---- */
.fi-thermo { display: flex; flex-direction: column-reverse; gap: 4px; width: 84px; margin: var(--s3) auto;
  padding: 8px; border: 3px solid var(--fi); border-radius: 18px; background: var(--card); }
.fi-thermo-seg { height: 20px; border-radius: 6px; background: var(--card-border); transition: background 0.25s ease; }
.fi-thermo-seg.on { background: var(--fi); }
.fi-goal-line { font-weight: 800; color: var(--ink); font-size: var(--fs-body); }

/* ---- 預算採購 ---- */
.fi-shop { display: grid; gap: var(--s2); margin: var(--s3) 0; text-align: left; }
.fi-shop-item { display: flex; align-items: center; gap: var(--s2); min-height: 52px; padding: 10px var(--s3);
  border: 2px solid var(--card-border); border-radius: 12px; background: var(--card); cursor: pointer; }
.fi-shop-item.pick { border-color: var(--fi); background: var(--fi-tint); }
.fi-shop-item .fi-shop-emoji { font-size: 26px; }
.fi-shop-item .fi-shop-name { font-weight: 800; color: var(--ink); flex: 1; }
.fi-shop-item .fi-shop-price { font-weight: 800; color: var(--fi-ink); }
.fi-shop-item .fi-shop-check { font-size: 20px; width: 24px; text-align: center; }
.fi-money { font-size: var(--fs-h2); font-weight: 800; color: var(--c-correct-ink); }
.fi-money.over { color: var(--c-wrong-btn); }   /* 5.71:1 達 AA，取代 --c-wrong(#ff7675) 2.49:1 */
.fi-money.over::before { content: "⚠ "; }        /* 非顏色提示：超支不只靠紅色（WCAG 1.4.1）*/

/* ---- 岔路二選一 ---- */
.fi-fork { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin: var(--s3) 0; }
.fi-fork-card { padding: var(--s4) var(--s3); border: 2px solid var(--card-border); border-radius: var(--r-md);
  background: var(--card); cursor: pointer; text-align: center; }
.fi-fork-card:active { transform: scale(0.98); }
.fi-fork-emoji { font-size: 44px; }
.fi-fork-name { font-weight: 800; color: var(--ink); margin-top: 6px; font-size: var(--fs-body); }
.fi-fork-result { margin: var(--s3) 0; display: none; }
.fi-fork-result.show { display: block; animation: fi-pop 0.4s ease; }
.fi-fork-got { color: var(--c-correct-ink); font-weight: 800; font-size: var(--fs-body); }
.fi-fork-lost { color: var(--ink-soft); font-weight: 800; font-size: var(--fs-body); text-decoration: line-through; }

/* ---- 銀行存摺 ---- */
.fi-bank { display: flex; align-items: center; justify-content: center; gap: var(--s3); flex-wrap: wrap; margin: var(--s3) 0; }
.fi-coin-pop { font-size: 28px; animation: fi-pop 0.5s ease; }

/* ---- 訂價滑桿 / 小攤子 ---- */
.fi-slider-wrap { margin: var(--s3) 0; }
.fi-slider-val { font-size: var(--fs-h2); font-weight: 800; color: var(--fi-ink); }
input[type="range"].fi-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 14px;
  border-radius: 999px; background: var(--card-border); outline: none; margin: var(--s3) 0; }
input[type="range"].fi-slider:focus-visible { outline: 3px solid var(--c-focus); outline-offset: 2px; }
input[type="range"].fi-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 44px; height: 44px;
  border-radius: 50%; background: var(--fi); border: 3px solid var(--card); box-shadow: var(--shadow-sm); cursor: pointer; }
input[type="range"].fi-slider::-moz-range-thumb { width: 44px; height: 44px; border-radius: 50%; background: var(--fi);
  border: 3px solid var(--card); cursor: pointer; }
.fi-readout { display: flex; gap: var(--s3); justify-content: center; flex-wrap: wrap; margin: var(--s3) 0; }
.fi-readout .fi-stat { padding: var(--s2) var(--s3); border-radius: var(--r-md); background: var(--fi-tint);
  font-weight: 800; color: var(--ink); min-width: 90px; }
.fi-readout .fi-stat b { display: block; font-size: var(--fs-h2); color: var(--fi-ink); }
.fi-cups { font-size: 26px; letter-spacing: 2px; margin: var(--s2) 0; min-height: 30px; }

/* 事前明示的隨機事件卡 */
.fi-event { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); margin: var(--s3) auto;
  max-width: 34ch; border: 2px solid var(--fi); border-radius: var(--r-md); background: var(--fi-tint); text-align: left; }
.fi-event .fi-event-ico { font-size: 34px; flex: none; }
.fi-event .fi-event-txt { font-weight: 800; color: var(--ink); font-size: var(--fs-body); }

/* 結算：決定 vs 運氣 分開 */
.fi-settle { display: grid; gap: var(--s3); margin: var(--s3) 0; text-align: left; }
.fi-settle-box { padding: var(--s3) var(--s4); border-radius: var(--r-md); border: 2px solid var(--card-border); background: var(--card); }
.fi-settle-box h4 { margin: 0 0 6px; font-size: var(--fs-body); color: var(--ink); }
.fi-settle-box.you { border-color: var(--fi); }
.fi-settle-box.luck { border-color: var(--c-chinese); }
.fi-settle-box p { margin: 0; font-weight: 700; color: var(--ink-soft); font-size: var(--fs-small); line-height: 1.5; }
.fi-profit { font-size: var(--fs-h2); font-weight: 800; }
.fi-profit.up { color: var(--c-correct-ink); }
.fi-profit.down { color: var(--c-streak-ink); }

/* 三罐分配 */
.fi-jars { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); margin: var(--s3) 0; }
.fi-jar { padding: var(--s3); border: 2px solid var(--card-border); border-radius: var(--r-md); background: var(--card); text-align: center; }
.fi-jar-emoji { font-size: 38px; }
.fi-jar-name { font-weight: 800; color: var(--ink); font-size: var(--fs-small); margin: 4px 0; }
.fi-jar-val { font-weight: 800; color: var(--fi-ink); font-size: var(--fs-body); }
.fi-jar-btns { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
.fi-jar-btns button { min-width: 48px; min-height: 48px; border-radius: 12px; border: 2px solid var(--card-border);
  background: var(--card); color: var(--ink); font-weight: 800; font-size: 18px; cursor: pointer; }

/* 分享罐（純情感回饋、不計分、不給徽章） */
.fi-share-scene { font-size: clamp(48px, 16vw, 84px); margin: var(--s3) 0; line-height: 1.2; transition: all 0.3s ease; }
.fi-share-thanks { color: var(--c-correct-ink); font-weight: 800; font-size: var(--fs-body); min-height: 26px; }

/* ---- 廣告偵探 ---- */
.fi-ad { border: 3px dashed var(--c-wrong); border-radius: var(--r-md); padding: var(--s4); margin: var(--s3) 0;
  background: rgba(255,118,117,0.06); text-align: left; }
.fi-ad-head { font-weight: 800; color: var(--ink); margin-bottom: var(--s2); }
.fi-ad-trick { display: inline-flex; align-items: center; margin: 4px; padding: 10px 16px; min-height: 48px; border-radius: 999px;
  border: 2px solid var(--card-border); background: var(--card); color: var(--ink); font-weight: 800; cursor: pointer; }
.fi-ad-trick.found { border-color: var(--c-correct); background: var(--card); color: var(--c-english-ink); }
.fi-ad-plain { display: inline-block; margin: 4px; padding: 8px 14px; color: var(--ink-soft); font-weight: 700; }

.fi-footnote { text-align: center; color: var(--ink-soft); font-size: var(--fs-small); margin-top: var(--s5); font-weight: 600; }
</style>
</head>
<body>
<!-- ===== 共用頂部應用列（全站一致；貼在 <body> 內第一個元素） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">理財小達人 💰</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

  <!-- ============================= 選單 / 首頁 ============================= -->
  <section id="screen-menu" class="fi-screen active">
    <div class="fi-hello">
      <span class="fi-mascot" aria-hidden="true">🦊</span>
      <div>
        <div class="fi-hello-text" id="hello-text">嗨！我是小理，一起來認識「錢」的祕密吧！</div>
        <div class="fi-hello-sub" id="hello-sub">選一關，玩一玩、學一學，慢慢想沒關係。</div>

    <a class="cn-nextup" href="economics_advanced.html"><span class="cn-nextup-ic" aria-hidden="true">💹</span><span>已經很熟了？來挑戰更難的「經濟與資本探索」→</span></a>

    </div>
  </section>

</main>

<script>
(function () {
  'use strict';

  // ---- 安全呼叫引擎（引擎必定已於 <head> 同步載入，但仍防禦式檢查） ----
  function record(correct) {
    try { if (window.Game && Game.recordAnswer) Game.recordAnswer('finance', !!correct); }
    catch (e) { /* 靜默：不阻斷孩子的遊戲 */ }
  }
  function toast(msg, kind) {
    try { if (window.Game && Game.showToast) Game.showToast(msg, kind); } catch (e) {}
  }

  function speak(text) {
    /* 已移除 TTS：本頁非英文發音頁，不需朗讀 */
  }

  // ---- 本頁進度（獨立 key，不與引擎 profile 衝突） ----
  var PROG_KEY = 'finance_progress_v1';
  function loadProg() {

  // =====================================================================
  // 選單渲染
  // =====================================================================
  function scoringSteps(unit) {
    var n = 0;
    for (var i = 0; i < unit.steps.length; i++) if (SCORED[unit.steps[i].t]) n++;
    return n;
  }

  function renderMenu() {
    var doneCount = 0;
    for (var i = 0; i < UNITS.length; i++) if (progress.units[UNITS[i].id] && progress.units[UNITS[i].id].done) doneCount++;
    $('ov-done').textContent = doneCount + '/' + UNITS.length;

    var p = null;
    try { p = window.Game && Game.getProfile ? Game.getProfile() : null; } catch (e) {}
    if (p) $('ov-xp').textContent = (p.subjects && p.subjects.finance ? p.subjects.finance.xp : 0);
    $('ov-piggy').textContent = progress.piggy;

    if (doneCount > 0) {
      $('hello-text').textContent = '歡迎回來！你已經完成 ' + doneCount + ' 關，好棒！';
      $('hello-sub').textContent = doneCount >= UNITS.length ? '十關都完成了，你是理財小達人！🏆' : '接著挑戰還沒玩過的關卡吧！';
    }

    unitList.innerHTML = '';
    for (var u = 0; u < UNITS.length; u++) {
      (function (unit, num) {
        var st = progress.units[unit.id] || {};
        var done = !!st.done;
        var stars = st.best || 0;
        var total = scoringSteps(unit);
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'fi-unit' + (unit.flagship ? ' flagship' : '');
        card.setAttribute('aria-label', '第 ' + num + ' 關：' + unit.name);
        var dots = '';
        for (var d = 0; d < total; d++) dots += '<i class="' + (d < stars ? 'on' : '') + '"></i>';
        card.innerHTML =
          '<div class="fi-unit-top">' +
            '<span class="fi-unit-emoji" aria-hidden="true">' + unit.emoji + '</span>' +
            '<div>' +
              '<div class="fi-unit-num">第 ' + num + ' 關・' + unit.game + (unit.flagship ? ' ⭐旗艦' : '') + '</div>' +
              '<div class="fi-unit-name">' + unit.name + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="fi-unit-foot">' +
            '<span class="fi-unit-status ' + (done ? 'done' : 'todo') + '">' +
              (done ? '✅ 已完成' : '▶️ 開始玩（共 ' + total + ' 題）') + '</span>' +
            '<span class="fi-unit-dots" aria-hidden="true">' + dots + '</span>' +
          '</div>';
        card.addEventListener('click', function () { startUnit(unit); });
        unitList.appendChild(card);
      })(UNITS[u], u + 1);
    }
  }

  // =====================================================================
  // 遊玩流程
  // =====================================================================
  function show(screen) {
    screenMenu.classList.remove('active');
    screenPlay.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0, 0);
  }

  function startUnit(unit) {
    cur = { unit: unit, idx: 0, correctCount: 0, total: scoringSteps(unit) };
    playTitle.textContent = unit.emoji + ' ' + unit.name;
    show(screenPlay);
    renderStep();
  }

  function renderStepDots() {
    stepDots.innerHTML = '';
    for (var i = 0; i < cur.unit.steps.length; i++) {
      var b = document.createElement('i');
      if (i < cur.idx) b.className = 'on';
      else if (i === cur.idx) b.className = 'cur';
      stepDots.appendChild(b);
    }
  }

  function next() {
    cur.idx++;
    if (cur.idx >= cur.unit.steps.length) finishUnit();
    else renderStep();
  }

  function ttsButton(text) {
    /* 已移除 TTS：本頁非英文發音頁，不再顯示朗讀按鈕 */
    return '';
  }
  function bindTts(root) {
    /* 已移除 TTS：本頁非英文發音頁，無朗讀按鈕可綁定 */
  }

  function scoreOnce(step, correct) {
    // 每個計分步只計一次；答對才 correctCount++（星等用）。
    record(correct);
    if (correct) cur.correctCount++;
  }

  function renderStep() {
    renderStepDots();
    var step = cur.unit.steps[cur.idx];
    var fn = {
      fact: renderFact, choose: renderChoose, match: renderMatch, nw: renderNW,
      piggy: renderPiggy, budget: renderBudget, fork: renderFork, bank: renderBank,
      pricing: renderPricing, stall: renderStall, addet: renderAdDetective, share: renderShare
    }[step.t];
    if (fn) fn(step);
  }

  // ---- fact ----
  function renderFact(step) {
    stage.innerHTML =
      '<div class="fi-stage">' +
        '<div class="fi-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="fi-sentence">' + step.s + '</p>' +
        '<div class="fi-toolrow">' + ttsButton(step.s) +
          (step.more ? '<button type="button" class="btn" id="btn-more">💡 看更多</button>' : '') + '</div>' +
        (step.more ? '<div class="fi-reveal" id="reveal">' + step.more + '</div>' : '') +
      '</div>' +
      '<div class="fi-actions"><button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button></div>';
    bindTts(stage);
    if (step.more) $('btn-more').addEventListener('click', function () { $('reveal').classList.add('show'); speak(step.more); });
    $('btn-next').addEventListener('click', next);
  }

  // ---- choose ----
  function renderChoose(step) {
    var order = [];
    for (var oi = 0; oi < step.opts.length; oi++) order.push(oi);
    for (var m = order.length - 1; m > 0; m--) {
      var r = Math.floor(Math.random() * (m + 1));
      var tt = order[m]; order[m] = order[r]; order[r] = tt;
    }
    var optsHtml = '';
    for (var k = 0; k < order.length; k++) {
      var origIdx = order[k];
      optsHtml += '<button type="button" class="fi-opt" data-i="' + origIdx + '">' +
        '<span>' + step.opts[origIdx] + '</span><span class="fi-opt-mark" aria-hidden="true"></span></button>';
    }
    stage.innerHTML =
      '<div class="fi-stage">' +
        '<div class="fi-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="fi-sentence">' + step.s + '</p>' +
        '<div class="fi-toolrow">' + ttsButton(step.s) + '</div>' +
        '<div class="fi-options">' + optsHtml + '</div>' +
        '<div class="fi-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="fi-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button></div>';
    bindTts(stage);

    var answered = false;
    var btns = stage.querySelectorAll('.fi-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var i = parseInt(this.getAttribute('data-i'), 10);
        var isCorrect = (i === step.ans);
        if (answered) {
          // 第一次答錯後的重試：只給視覺提示，不再重複計分。
          if (isCorrect) { this.classList.add('correct'); this.querySelector('.fi-opt-mark').textContent = '✅'; }
          else { this.classList.add('wrong'); this.querySelector('.fi-opt-mark').textContent = '❌'; }
          return;
        }
        answered = true;
        scoreOnce(step, isCorrect); // 每題只計一次分（第一次作答）
        if (isCorrect) {
          this.classList.add('correct');
          this.querySelector('.fi-opt-mark').textContent = '✅';
        } else {
          this.classList.add('wrong');
          this.querySelector('.fi-opt-mark').textContent = '❌';
          var correctBtn = stage.querySelector('.fi-opt[data-i="' + step.ans + '"]');
          if (correctBtn) { correctBtn.classList.add('correct'); correctBtn.querySelector('.fi-opt-mark').textContent = '✅'; }
        }
        var rev = $('reveal');
        rev.textContent = (isCorrect ? '答對了！' : '沒關係，再想想～答案是這個！') + (step.why || '');
        rev.classList.add('show');
        $('afteract').style.display = 'flex';
        var all = stage.querySelectorAll('.fi-opt');
        for (var q = 0; q < all.length; q++) all[q].disabled = true;
      });
    }
    $('btn-next').addEventListener('click', next);
  }

  // ---- match（工作 → 問題 配對） ----
  function renderMatch(step) {
    var jobs = step.pairs.map(function (p, i) { return { text: p.job, i: i }; });
    var probs = step.pairs.map(function (p, i) { return { text: p.prob, i: i }; });
    shuffle(jobs); shuffle(probs);
    var jobsHtml = '', probsHtml = '';
    for (var a = 0; a < jobs.length; a++)
      jobsHtml += '<button type="button" class="fi-tile fi-job" data-i="' + jobs[a].i + '">' + jobs[a].text + '</button>';
    for (var b = 0; b < probs.length; b++)
      probsHtml += '<button type="button" class="fi-tile fi-prob" data-i="' + probs[b].i + '">' + probs[b].text + '</button>';

    stage.innerHTML =
      '<div class="fi-stage">' +
        '<div class="fi-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="fi-sentence">' + step.s + '</p>' +
        '<div class="fi-toolrow">' + ttsButton(step.s) + '</div>' +
        '<div class="fi-match">' +
          '<div><div class="fi-match-col-label">工作</div>' + jobsHtml + '</div>' +
          '<div><div class="fi-match-col-label">幫忙解決的問題</div>' + probsHtml + '</div>' +
        '</div>' +
        '<div class="fi-reveal" id="reveal">' + (step.why || '') + '</div>' +
      '</div>' +
      '<div class="fi-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">全部配對好了，繼續 ➡️</button></div>';
    bindTts(stage);

    var selJob = null, matched = 0, scored = false;
    var total = step.pairs.length;

    function clearSel() {
      var s = stage.querySelector('.fi-job.sel');
      if (s) s.classList.remove('sel');
      selJob = null;
    }
    function tryFinish() {
      if (matched === total && !scored) {
        scored = true;
        scoreOnce(step, true); // 全部正確配對＝完成，計一次正向互動
        $('reveal').classList.add('show');
        $('afteract').style.display = 'flex';
        toast('全部配對成功！🎉', 'badge');
      }
    }
    function onProb(probEl) {
      if (!selJob) { probEl.classList.add('shake'); setTimeout(function(){ probEl.classList.remove('shake'); }, 320); return; }
      var ji = selJob.getAttribute('data-i');
      var pi = probEl.getAttribute('data-i');
      if (ji === pi) {
        selJob.classList.remove('sel'); selJob.classList.add('matched'); selJob.disabled = true;
        probEl.classList.add('matched'); probEl.disabled = true;
        selJob = null; matched++;
        tryFinish();
      } else {
        probEl.classList.add('shake');
        var jb = selJob;
        setTimeout(function(){ probEl.classList.remove('shake'); if (jb) jb.classList.remove('sel'); }, 320);
        selJob = null;
      }
    }
    var jobBtns = stage.querySelectorAll('.fi-job');
    for (var jj = 0; jj < jobBtns.length; jj++) {
      jobBtns[jj].addEventListener('click', function () {
        if (this.classList.contains('matched')) return;
        clearSel(); this.classList.add('sel'); selJob = this;
      });
    }
    var probBtns = stage.querySelectorAll('.fi-prob');
    for (var pp = 0; pp < probBtns.length; pp++) {
      probBtns[pp].addEventListener('click', function () { if (!this.classList.contains('matched')) onProb(this); });
    }
    $('btn-next').addEventListener('click', next);
  }

  // ---- nw（需要 / 想要） ----
  function renderNW(step) {
    var items = step.items.slice(); shuffle(items);
    var rows = '';
    for (var i = 0; i < items.length; i++) {
      rows += '<div class="fi-nw-row" data-i="' + i + '" data-need="' + (items[i].need ? '1' : '0') + '">' +
        '<span class="fi-nw-item"><span class="fi-nw-emoji" aria-hidden="true">' + items[i].e + '</span>' + items[i].n + '</span>' +
        '<span class="fi-nw-btns">' +
          '<button type="button" class="fi-nw-btn" data-ans="1">需要</button>' +
          '<button type="button" class="fi-nw-btn" data-ans="0">想要</button>' +
        '</span></div>';
    }
    stage.innerHTML =
      '<div class="fi-stage">' +
        '<div class="fi-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="fi-sentence">' + step.s + '</p>' +
        '<div class="fi-toolrow">' + ttsButton(step.s) + '</div>' +
        '<div>' + rows + '</div>' +
        '<div class="fi-reveal" id="reveal">' + (step.why || '') + '</div>' +
      '</div>' +
      '<div class="fi-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">全部分好了，繼續 ➡️</button></div>';
    bindTts(stage);

    var done = 0, scored = false;
    var total = items.length;
    var rowEls = stage.querySelectorAll('.fi-nw-row');
    for (var r = 0; r < rowEls.length; r++) {
      (function (row) {
        var need = row.getAttribute('data-need') === '1';
        var btns = row.querySelectorAll('.fi-nw-btn');
        for (var b = 0; b < btns.length; b++) {
          btns[b].addEventListener('click', function () {
            if (row.classList.contains('done')) return;
            var ans = this.getAttribute('data-ans') === '1';
            if (ans === need) {
              row.classList.add('done');
              row.querySelector('.fi-nw-btns').innerHTML = '<span class="fi-nw-tag">✅ ' + (need ? '需要' : '想要') + '</span>';
              done++;
              if (done === total && !scored) {
                scored = true;
                scoreOnce(step, true);
                $('reveal').classList.add('show');
                $('afteract').style.display = 'flex';
                toast('全部分對了！👍', 'badge');
              }
            } else {
              this.classList.add('wrong');
              var badBtn = this;
              badBtn.textContent = '再想想';
              setTimeout(function () { badBtn.textContent = ans ? '需要' : '想要'; badBtn.classList.remove('wrong'); }, 700);
            }
          });
        }
      })(rowEls[r]);
    }
    $('btn-next').addEventListener('click', next);
  }

  // ---- piggy（撲滿溫度計；不計分、達標情感慶祝） ----
  function renderPiggy(step) {
    var goal = step.goal, per = step.per, filled = 0;
    var segs = '';
    for (var i = 0; i < goal; i++) segs += '<div class="fi-thermo-seg" data-i="' + i + '"></div>';
    stage.innerHTML =
      '<div class="fi-stage">' +
        '<div class="fi-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="fi-sentence">' + step.s + '</p>' +
        '<div class="fi-note" style="max-width:34ch;margin:0 auto var(--s3)"><span class="fi-note-ico">💡</span><span>這是學習點數，不是真的錢。</span></div>' +
        '<div class="fi-thermo" id="thermo" aria-hidden="true">' + segs + '</div>' +
        '<div class="fi-goal-line" id="goal-line">已存 0 / ' + (goal * per) + ' 元</div>' +
        '<div class="fi-toolrow" style="margin-top:var(--s3)">' +
          '<button type="button" class="btn btn-primary" id="btn-save">存 ' + per + ' 元 🐷</button></div>' +
        '<div class="fi-reveal" id="reveal">' + (step.why || '') + '</div>' +
      '</div>' +
      '<div class="fi-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">達成目標，繼續 ➡️</button></div>';
    bindTts(stage);

    $('btn-save').addEventListener('click', function () {
      if (filled >= goal) return;
      var seg = stage.querySelector('.fi-thermo-seg[data-i="' + filled + '"]');
      if (seg) seg.classList.add('on');
      filled++;
      $('goal-line').textContent = '已存 ' + (filled * per) + ' / ' + (goal * per) + ' 元';
      if (filled >= goal) {
        this.disabled = true;
        this.textContent = '存滿了！🎉';
        $('reveal').classList.add('show');
        $('afteract').style.display = 'flex';
        toast('達成存錢目標！🎉 你好有耐心！', 'badge');
        speak('達成目標！你好棒，靠耐心存到了！');
      }
    });
    $('btn-next').addEventListener('click', next);
  }

  // ---- budget（同樂會採購） ----
  function renderBudget(step) {
    var items = step.items;
    var picked = {};
    var itemsHtml = '';
    for (var i = 0; i < items.length; i++) {
      itemsHtml += '<div class="fi-shop-item" data-i="' + i + '">' +
        '<span class="fi-shop-check" aria-hidden="true">⬜</span>' +
        '<span class="fi-shop-emoji" aria-hidden="true">' + items[i].e + '</span>' +
        '<span class="fi-shop-name">' + items[i].n + '</span>' +
        '<span class="fi-shop-price">' + items[i].price + ' 元</span></div>';
    }
    stage.innerHTML =
      '<div class="fi-stage">' +
        '<div class="fi-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="fi-sentence">' + step.s + '</p>' +
        '<div class="fi-toolrow">' + ttsButton(step.s) + '</div>' +
        '<div class="fi-note" style="max-width:34ch;margin:0 auto var(--s3)"><span class="fi-note-ico">💡</span><span>這是假裝的同樂會，用來練習算錢，不是真的錢。</span></div>' +
        '<div>還剩 <span class="fi-money" id="remain">' + step.budget + '</span> 元</div>' +
        '<div class="fi-shop">' + itemsHtml + '</div>' +
        '<div class="fi-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="fi-actions">' +
        '<button type="button" class="btn btn-primary" id="btn-checkout" disabled>就買這些 ✓</button>' +
        '<button type="button" class="btn btn-primary" id="btn-next" style="display:none">繼續 ➡️</button></div>';
    bindTts(stage);

    var answered = false;
    function total() { var t = 0; for (var k in picked) if (picked[k]) t += items[k].price; return t; }
    function refresh() {
      var spent = total();
      var remain = step.budget - spent;
      var el = $('remain'); el.textContent = remain;
      el.classList.toggle('over', remain < 0);
      var anyPicked = spent > 0;
      $('btn-checkout').disabled = !(anyPicked && remain >= 0) || answered;
    }
    var rows = stage.querySelectorAll('.fi-shop-item');
    for (var r = 0; r < rows.length; r++) {
      rows[r].addEventListener('click', function () {
        if (answered) return;
        var i = this.getAttribute('data-i');
        picked[i] = !picked[i];
        this.classList.toggle('pick', picked[i]);
        this.querySelector('.fi-shop-check').textContent = picked[i] ? '✅' : '⬜';
        refresh();
      });
    }
    $('btn-checkout').addEventListener('click', function () {
      if (answered) return;
      answered = true;
      var remain = step.budget - total();
      var ok = remain >= 0; // 能到這裡一定 >=0，但保險判斷
      scoreOnce(step, ok);
      var rev = $('reveal');
      rev.textContent = '控制在預算內，過關！剩下的 ' + remain + ' 元可以存進撲滿。' + (step.why || '');
      rev.classList.add('show');
      if (remain > 0) { addPiggy(remain); toast('剩下 ' + remain + ' 元存進撲滿！🐷', 'badge'); }
      this.style.display = 'none';
      $('btn-next').style.display = 'inline-flex';
    });
    $('btn-next').addEventListener('click', next);
    refresh();
  }

  // 需求模型（供 pricing 與 stall 共用）：價格越高、想買的人越少。
  // demand = customers * (1 - (price-min)/(max-min))，四捨五入、下限 0。
  function demandAt(price, customers, min, max) {
    var frac = (price - min) / (max - min);
    if (frac < 0) frac = 0; if (frac > 1) frac = 1;
    var d = Math.round(customers * (1 - frac * 0.9)); // 就算最貴也還有一點點人買
    return Math.max(0, d);
  }

  // ---- pricing（訂價滑桿） ----
  function renderPricing(step) {
    var price = Math.round((step.min + step.max) / 2);
    // 找出最佳利潤，用來定義「甜蜜價格」門檻（≥ 最佳的 75%）。
    var best = 0;
    for (var pr = step.min; pr <= step.max; pr++) {
      var sold = demandAt(pr, step.customers, step.min, step.max);
      var profit = sold * (pr - step.cost);
      if (profit > best) best = profit;
    }
    var target = Math.round(best * 0.75);

    stage.innerHTML =
      '<div class="fi-stage">' +
        '<div class="fi-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="fi-sentence">' + step.s + '</p>' +
        '<div class="fi-toolrow">' + ttsButton(step.s) + '</div>' +
        '<div class="fi-note" style="max-width:34ch;margin:0 auto var(--s3)"><span class="fi-note-ico">💡</span><span>這是假裝的小攤子，用來練習算錢；金幣是學習點數，不是真的錢。</span></div>' +
        '<div class="fi-event"><span class="fi-event-ico" aria-hidden="true">📣</span>' +
          '<span class="fi-event-txt">' + step.weather + '，今天大約有 ' + step.customers + ' 個人經過。</span></div>' +
        '<div class="fi-slider-wrap">' +
          '<div>一杯賣 <span class="fi-slider-val" id="pr-val">' + price + '</span> 元（成本 ' + step.cost + ' 元）</div>' +
          '<input type="range" class="fi-slider" id="pr-slider" min="' + step.min + '" max="' + step.max + '" step="1" value="' + price + '" aria-label="調整價格">' +
        '</div>' +
        '<div class="fi-cups" id="pr-cups" aria-hidden="true"></div>' +
        '<div class="fi-readout">' +
          '<div class="fi-stat">賣出<b id="pr-sold">0</b>杯</div>' +
          '<div class="fi-stat">賺到<b id="pr-profit">0</b>元</div>' +
        '</div>' +
        '<div class="fi-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="fi-actions">' +
        '<button type="button" class="btn btn-primary" id="btn-sell">就賣這個價！</button>' +
        '<button type="button" class="btn btn-primary" id="btn-next" style="display:none">繼續 ➡️</button></div>';
    bindTts(stage);

    var answered = false;
    function recompute() {
      var p = parseInt($('pr-slider').value, 10);
      var sold = demandAt(p, step.customers, step.min, step.max);
      var profit = sold * (p - step.cost);
      $('pr-val').textContent = p;
      $('pr-sold').textContent = sold;
      $('pr-profit').textContent = profit;
      var cups = ''; for (var c = 0; c < Math.min(sold, 20); c++) cups += '🥤';
      $('pr-cups').textContent = cups;
      return { p: p, sold: sold, profit: profit };
    }
    $('pr-slider').addEventListener('input', recompute);
    $('btn-sell').addEventListener('click', function () {
      if (answered) return;
      var res = recompute();
      var good = res.profit >= target;
      var rev = $('reveal');
      if (good) {
        answered = true;
        scoreOnce(step, true);
        rev.textContent = '找到甜蜜價格啦！賣出 ' + res.sold + ' 杯，賺了 ' + res.profit + ' 元！' + (step.why || '');
        rev.classList.add('show');
        this.style.display = 'none';
        $('btn-next').style.display = 'inline-flex';
        toast('好棒的定價！🥤', 'badge');
      } else {
        // 不計分、不懲罰，只給提示，讓孩子再調整。
        var tooHigh = res.p > (step.min + step.max) / 2;
        rev.textContent = tooHigh
          ? '價格有點高，想買的人變少了。試著調低一點點看看？'
          : '價格有點低，每杯賺得少。試著調高一點點看看？';
        rev.classList.add('show');
      }
    });
    $('btn-next').addEventListener('click', next);
    recompute();
  }

  // ---- stall（旗艦：我的小攤子） ----
  function renderStall(step) {
    // 事前明示、但真正隨機的天氣事件：讓「運氣」真的會變，孩子的「決定」才需要因應。
    // 天氣在開店「前」就先公開（事前明示），結算時再把「決定」與「運氣」分開說明。
    var WEATHER = [
      { ico: '☀️', name: '大晴天', customers: 22, before: '明天是大晴天，會有很多人想喝冰檸檬水！', luck: '今天是大晴天，想喝冰的人比較多。' },
      { ico: '🥵', name: '大熱天', customers: 28, before: '明天超級熱！大家都想喝冰的，人潮會很多。', luck: '今天很熱，想喝冰的人特別多。' },
      { ico: '⛅', name: '多雲', customers: 16, before: '明天多雲、不太熱，想喝冰的人普普通通。', luck: '今天多雲不太熱，想喝冰的人普通。' },
      { ico: '🌧️', name: '下雨天', customers: 9,  before: '明天會下雨，出門的人少，想喝冰的人也會變少。', luck: '今天下雨，出門的人少，想喝冰的人也少。' }
    ];
    var EVENT = WEATHER[Math.floor(Math.random() * WEATHER.length)];
    var CUSTOMERS = EVENT.customers, COST = 5, MINP = 10, MAXP = 30, START = 150;
    var st = { phase: 0, stock: 0, price: 20, sold: 0, revenue: 0, cost: 0, profit: 0,
               jars: { save: 0, spend: 0, share: 0 } };

    function wrap(inner, actions, showNote) {
      stage.innerHTML =
        '<div class="fi-stage">' +
          '<div class="fi-visual" aria-hidden="true">' + step.v + '</div>' +
          (showNote ? '<div class="fi-note" style="max-width:34ch;margin:0 auto var(--s3)"><span class="fi-note-ico">💡</span><span>金幣是學習點數，不是真的錢。</span></div>' : '') +
          inner +
        '</div>' +
        '<div class="fi-actions">' + actions + '</div>';
      bindTts(stage);
    }

    // 階段 0：事前明示事件（先公開天氣，再進貨）
    function phaseEvent() {
      wrap(
        '<p class="fi-sentence">歡迎光臨你的小攤子！先看看明天的天氣。</p>' +
        '<div class="fi-event"><span class="fi-event-ico" aria-hidden="true">' + EVENT.ico + '</span>' +
          '<span class="fi-event-txt">' + EVENT.before + '（天氣是運氣，不是我們能控制的）</span></div>' +
        '<p class="fi-sub">你有 ' + START + ' 個學習點數可以進貨。</p>',
        '<button type="button" class="btn btn-primary btn-block" id="s-go">開始進貨 🛒</button>', true);
      $('s-go').addEventListener('click', phaseStock);
    }

    // 階段 1：進貨（花成本）
    function phaseStock() {
      var choices = [10, 20, 30];
      var btns = '';
      for (var i = 0; i < choices.length; i++)
        btns += '<button type="button" class="fi-opt s-stock" data-q="' + choices[i] + '"><span>進 ' + choices[i] +
          ' 杯（花 ' + (choices[i] * COST) + ' 點）</span><span class="fi-opt-mark">🍋</span></button>';
      wrap(
        '<p class="fi-sentence">要進多少杯的材料呢？（每杯成本 ' + COST + ' 點）</p>' +
        '<div class="fi-event"><span class="fi-event-ico" aria-hidden="true">' + EVENT.ico + '</span>' +
          '<span class="fi-event-txt">' + EVENT.name + '：大約 ' + CUSTOMERS + ' 個人會經過。進太多賣不完也會虧本喔。</span></div>' +
        '<div class="fi-options">' + btns + '</div>',
        '', true);
      var opts = stage.querySelectorAll('.s-stock');
      for (var k = 0; k < opts.length; k++) {
        opts[k].addEventListener('click', function () {
          st.stock = parseInt(this.getAttribute('data-q'), 10);
          phasePrice();
        });
      }
    }

    // 階段 2：訂價
    function phasePrice() {
      wrap(
        '<p class="fi-sentence">一杯要賣多少錢？（成本 ' + COST + ' 點）</p>' +
        '<div class="fi-event"><span class="fi-event-ico" aria-hidden="true">' + EVENT.ico + '</span>' +
          '<span class="fi-event-txt">' + EVENT.name + '，大約 ' + CUSTOMERS + ' 個人會經過。</span></div>' +
        '<div class="fi-slider-wrap"><div>一杯賣 <span class="fi-slider-val" id="s-pval">' + st.price + '</span> 點</div>' +
          '<input type="range" class="fi-slider" id="s-slider" min="' + MINP + '" max="' + MAXP + '" step="1" value="' + st.price + '" aria-label="調整價格"></div>' +
        '<div class="fi-cups" id="s-preview" aria-hidden="true"></div>' +
        '<div class="fi-readout">' +
          '<div class="fi-stat">大概賣出<b id="s-psold">0</b>杯</div>' +
          '<div class="fi-stat">大概賺<b id="s-pprofit">0</b>點</div>' +
        '</div>',
        '<button type="button" class="btn btn-primary btn-block" id="s-open">開店做生意 🛎️</button>');
      function prev() {
        var p = parseInt($('s-slider').value, 10);
        st.price = p;
        $('s-pval').textContent = p;
        var d = Math.min(st.stock, demandAt(p, CUSTOMERS, MINP, MAXP));
        $('s-psold').textContent = d;
        $('s-pprofit').textContent = (d * p) - (st.stock * COST); // 收入 − 已花的進貨成本
        var cups = ''; for (var c = 0; c < Math.min(d, 20); c++) cups += '🥤';
        $('s-preview').textContent = cups;
      }
      $('s-slider').addEventListener('input', prev);
      $('s-open').addEventListener('click', phaseServe);
      prev();
    }

    // 階段 3：服務顧客（供需上場）
    function phaseServe() {
      var demand = demandAt(st.price, CUSTOMERS, MINP, MAXP);
      st.sold = Math.min(st.stock, demand);
      st.revenue = st.sold * st.price;
      st.cost = st.stock * COST;
      st.profit = st.revenue - st.cost;
      var cups = ''; for (var c = 0; c < Math.min(st.sold, 25); c++) cups += '🥤';
      wrap(
        '<p class="fi-sentence">開店囉！客人一個一個來買冰檸檬水～</p>' +
        '<div class="fi-cups" style="font-size:30px">' + (cups || '（今天客人不多）') + '</div>' +
        '<p class="fi-sub">你賣出了 ' + st.sold + ' 杯（進了 ' + st.stock + ' 杯）。</p>',
        '<button type="button" class="btn btn-primary btn-block" id="s-settle">打烊、來結算 🧾</button>');
      $('s-settle').addEventListener('click', phaseSettle);
    }

    // 階段 4：結算（把「決定」與「運氣」分開）
    function phaseSettle() {
      var even = st.profit === 0;          // 利潤剛好 0：打平，不顯示「賺了 0」慶祝
      var up = st.profit > 0;
      var demand = demandAt(st.price, CUSTOMERS, MINP, MAXP);
      var youText;
      if (st.sold === st.stock) {
        // 賣光了。只有在進貨量接近「會想買的人數」時才算「剛剛好」；
        // 若進太少（想買的人明顯比進貨多），是賣光但可惜，可以再多進一點。
        var closeEnough = st.stock >= demand - Math.max(2, Math.round(demand * 0.1));
        youText = closeEnough
          ? '進 ' + st.stock + ' 杯、賣 ' + st.price + ' 點，全部賣光，進貨量抓得剛剛好！'
          : '進 ' + st.stock + ' 杯、賣 ' + st.price + ' 點，全部賣光了！下次天氣好時可以多進一點，說不定賺更多。';
      } else {
        youText = (st.price > 22 ? '價格有點高，有些人沒買，剩了一些沒賣掉。' : '進的比賣掉的多，剩下的成本收不回來。');
      }
      var luckText = EVENT.luck + '天氣是「運氣」，不是你能控制的。';
      wrap(
        '<p class="fi-sentence">打烊結算！</p>' +
        '<div class="fi-visual fi-pop" style="font-size:clamp(30px,8vw,44px);margin:0">' +
          (even ? '😊 剛好打平，沒賺也沒虧'
                : (up ? '🎉 賺了 ' : '💪 虧了 ') + '<span class="fi-profit ' + (up ? 'up' : 'down') + '">' + Math.abs(st.profit) + '</span> 點') + '</div>' +
        '<div class="fi-readout">' +
          '<div class="fi-stat">收入<b>' + st.revenue + '</b>點</div>' +
          '<div class="fi-stat">成本<b>' + st.cost + '</b>點</div>' +
        '</div>' +
        ((up || even) ? '' : '<div class="fi-event" style="border-color:var(--c-chinese)"><span class="fi-event-ico">🌈</span>' +
              '<span class="fi-event-txt">虧一點點沒關係！虧本是做生意很正常的學習。下次可以少進一點、或把價格調得剛剛好。</span></div>') +
        '<div class="fi-settle">' +
          '<div class="fi-settle-box you"><h4>🧠 你的決定</h4><p>' + youText + '</p></div>' +
          '<div class="fi-settle-box luck"><h4>🍀 運氣（不能控制）</h4><p>' + luckText + '</p></div>' +
        '</div>',
        up
          ? '<button type="button" class="btn btn-primary btn-block" id="s-jars">分配今天賺的錢 🫙</button>'
          : '<button type="button" class="btn btn-primary" id="s-retry">🔄 再挑戰一次</button>' +
            '<button type="button" class="btn" id="s-check">我學到了，繼續 ➡️</button>');
      if (up) {
        $('s-jars').addEventListener('click', function () { phaseJars(); });
      } else {
        // 虧本：溫柔、不歸零、不懲罰；提供再挑戰，也可直接進理解題完成。
        $('s-retry').addEventListener('click', function () { st = { phase: 0, stock: 0, price: 20, sold: 0, revenue: 0, cost: 0, profit: 0, jars: { save: 0, spend: 0, share: 0 } }; phaseStock(); });
        $('s-check').addEventListener('click', phaseCheck);
      }
    }

    // 階段 5：三罐分配（存 / 花 / 分享）
    function phaseJars() {
      var pool = st.profit;
      var jars = { save: 0, spend: 0, share: 0 };
      function view() {
        return '<div class="fi-jars">' +
          jarBox('save', '🐷', '存起來', jars.save) +
          jarBox('spend', '🛍️', '花用', jars.spend) +
          jarBox('share', '💚', '分享', jars.share) +
        '</div>';
      }
      function jarBox(key, emo, name, val) {
        return '<div class="fi-jar"><div class="fi-jar-emoji" aria-hidden="true">' + emo + '</div>' +
          '<div class="fi-jar-name">' + name + '</div><div class="fi-jar-val" id="jar-' + key + '">' + val + '</div>' +
          '<div class="fi-jar-btns"><button type="button" data-k="' + key + '" data-d="-1" aria-label="減少">−</button>' +
          '<button type="button" data-k="' + key + '" data-d="1" aria-label="增加">＋</button></div></div>';
      }
      wrap(
        '<p class="fi-sentence">今天賺了 ' + pool + ' 點！分成三罐：存、花、分享。</p>' +
        '<p class="fi-sub">還沒分配：<b id="jar-pool" style="color:var(--fi-ink)">' + pool + '</b> 點（分享完全自願喔）</p>' +
        view(),
        '<button type="button" class="btn btn-primary btn-block" id="s-jardone">分好了，打烊 ✅</button>', true);
      function refresh() {
        var used = jars.save + jars.spend + jars.share;
        $('jar-pool').textContent = pool - used;
        $('jar-save').textContent = jars.save;
        $('jar-spend').textContent = jars.spend;
        $('jar-share').textContent = jars.share;
      }
      var btns = stage.querySelectorAll('.fi-jar-btns button');
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', function () {
          var key = this.getAttribute('data-k');
          var d = parseInt(this.getAttribute('data-d'), 10);
          var used = jars.save + jars.spend + jars.share;
          if (d > 0 && used >= pool) return;      // 不能超過賺到的
          if (d < 0 && jars[key] <= 0) return;     // 不能變負
          jars[key] += d;
          refresh();
        });
      }
      $('s-jardone').addEventListener('click', function () {
        st.jars = jars;
        if (jars.save > 0) { addPiggy(jars.save); }
        // 分享罐：純情感回饋，不加經驗值、不給徽章、不影響分數（見 phaseCheck）。
        phaseCheck();
      });
    }

    // 階段 6：理解題（計一次分）——教「決定 vs 運氣」
    function phaseCheck() {
      wrap(
        '<p class="fi-sentence">最後一個小問題：下次想賺更多，你最該用心調整哪一個？</p>' +
        '<div class="fi-options">' +
          '<button type="button" class="fi-opt s-ck" data-ok="1"><span>我的決定：進貨量和價格</span><span class="fi-opt-mark"></span></button>' +
          '<button type="button" class="fi-opt s-ck" data-ok="0"><span>天氣，因為我可以控制它</span><span class="fi-opt-mark"></span></button>' +
        '</div>' +
        '<div class="fi-reveal" id="reveal"></div>',
        '<button type="button" class="btn btn-primary btn-block" id="s-fin" style="display:none">完成 🎉</button>');
      var answered = false;
      var opts = stage.querySelectorAll('.s-ck');
      for (var i = 0; i < opts.length; i++) {
        opts[i].addEventListener('click', function () {
          if (answered) return; answered = true;
          var ok = this.getAttribute('data-ok') === '1';
          scoreOnce(step, ok);
          this.classList.add(ok ? 'correct' : 'wrong');
          this.querySelector('.fi-opt-mark').textContent = ok ? '✅' : '❌';
          if (!ok) { var good = stage.querySelector('.s-ck[data-ok="1"]'); good.classList.add('correct'); good.querySelector('.fi-opt-mark').textContent = '✅'; }
          $('reveal').textContent = (ok ? '答對了！' : '沒關係～') + (step.why || '');
          $('reveal').classList.add('show');
          var all = stage.querySelectorAll('.s-ck'); for (var q = 0; q < all.length; q++) all[q].disabled = true;
          $('s-fin').style.display = 'inline-flex';
        });
      }
      $('s-fin').addEventListener('click', next);
    }

    phaseEvent();
  }

  // ---- addet（廣告偵探） ----
  function renderAdDetective(step) {
    var chips = step.tricks.map(function (t) { return { text: t, trick: true }; })
      .concat(step.plains.map(function (t) { return { text: t, trick: false }; }));
    shuffle(chips);
    var chipsHtml = '';
    for (var i = 0; i < chips.length; i++) {
      chipsHtml += chips[i].trick
        ? '<button type="button" class="fi-ad-trick" data-trick="1">' + chips[i].text + '</button>'
        : '<span class="fi-ad-plain">' + chips[i].text + '</span>';
    }
    stage.innerHTML =
      '<div class="fi-stage">' +
        '<div class="fi-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="fi-sentence">' + step.s + '</p>' +
        '<div class="fi-toolrow">' + ttsButton(step.s) + '</div>' +
        '<div class="fi-ad"><div class="fi-ad-head">🥤 超好喝冰紅茶 大特賣！</div>' + chipsHtml + '</div>' +
        '<p class="fi-sub" id="ad-hint">點出所有「催你快買」的話術（還剩 ' + step.tricks.length + ' 個）</p>' +
        '<div class="fi-reveal" id="reveal">' + (step.why || '') + '</div>' +
      '</div>' +
      '<div class="fi-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">🛑 買前三問，再繼續 ➡️</button></div>';
    bindTts(stage);

    var found = 0, total = step.tricks.length, scored = false;
    var tricks = stage.querySelectorAll('.fi-ad-trick');
    for (var t = 0; t < tricks.length; t++) {
      tricks[t].addEventListener('click', function () {
        if (this.classList.contains('found')) return;
        this.classList.add('found');
        found++;
        $('ad-hint').textContent = found >= total ? '你全部找到了！這些都是催你快買的話術。' : '點出所有「催你快買」的話術（還剩 ' + (total - found) + ' 個）';
        if (found >= total && !scored) {
          scored = true;
          scoreOnce(step, true);
          $('reveal').classList.add('show');
          $('afteract').style.display = 'flex';
          toast('好眼力，廣告偵探！🕵️', 'badge');
        }
      });
    }
    // 「買前三問」做成過關前必看的暫停畫面（遊戲內卡片，不用瀏覽器彈窗）。
    $('btn-next').addEventListener('click', function () {
      stage.innerHTML =
        '<div class="fi-stage">' +
          '<div class="fi-visual" aria-hidden="true">🛑</div>' +
          '<p class="fi-sentence">買東西前，先問自己「買前三問」！</p>' +
          '<div class="fi-ad" style="border-style:solid;border-color:var(--fi);background:var(--fi-tint)">' +
            '<div class="fi-ad-head">1️⃣ 停一下</div>' +
            '<div class="fi-ad-head">2️⃣ 比一比</div>' +
            '<div class="fi-ad-head" style="margin-bottom:0">3️⃣ 問自己「這是需要嗎？」</div>' +
          '</div>' +
        '</div>' +
        '<div class="fi-actions"><button type="button" class="btn btn-primary btn-block" id="btn-thinked">想清楚了，繼續 ➡️</button></div>';
      $('btn-thinked').addEventListener('click', next);
    });
  }

  // ---- share（分享罐；完全脫離獎勵、只給情感回饋，不呼叫 record） ----
  function renderShare(step) {
    var scene = ['🏚️🐕', '🏠🐕🐈', '🏡🐕🐈🐰', '🏡✨🐕🐈🐰🐦'];
    var idx = 0;
    stage.innerHTML =
      '<div class="fi-stage">' +
        '<div class="fi-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="fi-sentence">' + step.s + '</p>' +
        '<div class="fi-toolrow">' + ttsButton(step.s) + '</div>' +
        '<div class="fi-share-scene" id="share-scene">' + scene[0] + '</div>' +
        '<div class="fi-share-thanks" id="share-thanks"></div>' +
        '<div class="fi-toolrow">' +
          '<button type="button" class="btn btn-primary" id="btn-share">放一點進分享罐 💚</button>' +
          '<button type="button" class="btn" id="btn-skip">這次先不放</button>' +
        '</div>' +
        '<div class="fi-reveal" id="reveal">' + (step.why || '') + '</div>' +
      '</div>' +
      '<div class="fi-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">完成這一關 🎉</button></div>';
    bindTts(stage);

    var thanksMsgs = ['謝謝你！收容所變乾淨了一點。', '謝謝你！又有小動物有家了。', '謝謝你！大家都好開心～', '謝謝你！村民向你揮揮手 👋'];
    function reveal() { $('reveal').classList.add('show'); $('afteract').style.display = 'flex'; }
    $('btn-share').addEventListener('click', function () {
      if (idx < scene.length - 1) idx++;
      $('share-scene').innerHTML = '<span class="fi-pop" style="display:inline-block">' + scene[idx] + '</span>';
      var msg = thanksMsgs[Math.min(idx - 1, thanksMsgs.length - 1)] || thanksMsgs[0];
      $('share-thanks').textContent = msg;
      speak(msg);
      reveal();
      // 注意：分享不呼叫 record()、不加經驗值、不給徽章、不影響星等（安全規則）。
    });
    $('btn-skip').addEventListener('click', function () {
      $('share-thanks').textContent = '沒關係，做不做都可以，你一樣很棒 💛';
      reveal();
    });
    $('btn-next').addEventListener('click', next);
  }

  // =====================================================================
  // 完成單元
  // =====================================================================
  function finishUnit() {
    var unit = cur.unit;
    var stars = cur.correctCount;
    var total = cur.total;
    var prev = progress.units[unit.id] || {};
    progress.units[unit.id] = { done: true, best: Math.max(prev.best || 0, stars) };
    saveProg();

    var starStr = '';
    for (var i = 0; i < total; i++) starStr += (i < stars ? '⭐' : '☆');

    stage.innerHTML =
      '<div class="fi-stage fi-done">' +
        '<div class="fi-done-emoji" aria-hidden="true">🎉</div>' +
        '<div class="fi-done-title">完成「' + unit.name + '」！</div>' +
        (total > 0 ? '<div class="fi-done-stars" aria-label="得到 ' + stars + ' 顆星">' + starStr + '</div>' +
          '<p class="fi-sentence" style="font-size:clamp(16px,3.6vw,19px)">你答對了 ' + stars + ' / ' + total + ' 題，好棒！</p>'
          : '<p class="fi-sentence" style="font-size:clamp(16px,3.6vw,19px)">你完成了這一關，好棒！</p>') +
      '</div>' +
      '<div class="fi-actions">' +
        '<button type="button" class="btn" id="btn-menu">回到選單</button>' +
        (nextUnitOf(unit) ? '<button type="button" class="btn btn-primary" id="btn-nextunit">下一關 ➡️</button>' : '') +
      '</div>';

    toast('完成關卡：' + unit.emoji + ' ' + unit.name + '！', 'badge');

    $('btn-menu').addEventListener('click', goMenu);
    var nu = nextUnitOf(unit);
    if (nu) $('btn-nextunit').addEventListener('click', function () { startUnit(nu); });
  }

  function nextUnitOf(unit) {
    for (var i = 0; i < UNITS.length; i++) if (UNITS[i].id === unit.id) return UNITS[i + 1] || null;
    return null;
  }

  function goMenu() {
    cur = null;
    renderMenu();
    show(screenMenu);
  }

  // 小工具：Fisher–Yates 洗牌（就地）
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // =====================================================================
  // 頂列按鈕
  // =====================================================================
  function toggleTheme() {
    try { if (window.Game && Game.toggleTheme) Game.toggleTheme(); } catch (e) {}
    syncThemeIcon();
  }
  function syncThemeIcon() {
    var dark = false;
    try { dark = window.Game && Game.getTheme ? Game.getTheme() === 'dark' : (document.documentElement.getAttribute('data-theme') === 'dark'); } catch (e) {}
    var icon = dark ? '☀️' : '🌙';
    if ($('btn-theme')) $('btn-theme').textContent = icon;
    if ($('btn-theme2')) $('btn-theme2').textContent = icon;
  }
  // 主題切換已交給共用 .app-bar 的 data-theme-toggle 鈕（由 game_core 自動接線）；
  // 本頁不再自行接線主題鈕，只保留回到選單（in-page 導覽，非回首頁）。
  $('btn-back').addEventListener('click', goMenu);

  try { if (window.Game && Game.on) Game.on('theme', syncThemeIcon); } catch (e) {}

  // =====================================================================
  // 啟動
  // =====================================================================
  renderMenu();
  syncThemeIcon();
})();
</script>
</body>
</html>
