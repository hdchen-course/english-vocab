<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立體積木工坊 🧊</title>
<!-- 統一遊戲化引擎：先載共用設計 token（assets/app.css），再載 HUD/toast 樣式
     （game_core.css），最後同步載入引擎（game_core.js）。
     本頁為全新頁面（greenfield），沒有任何 legacy 資料來源，因此「不」宣告
     data-game-wired；只透過 Game.recordAnswer('math', ...) 即時記帳，XP 匯入
     同一個數學角色（與 finance.html 的作法一致）。
     兒童安全（§3.6）：金幣＝純記錄努力的學習點數，不綁任何可兌換造型／物品（清資料才不會讓孩子失落）；無抽卡／轉蛋／隨機獎勵／真錢／
     懲罰性計時／損失厭惡文案；答錯不扣分，操作元件會演示答案讓孩子看懂再離開。
     數學正確性（基礎階段上限）：體積僅「數單位立方／逐層重複加法」，不教
     長×寬×高；對稱僅「線對稱」；面／邊／頂點計數僅限多面體，曲面（球／圓柱／
     圓錐）此年段定性處理、不數邊與頂點。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* =====================================================================
 * geometry.html — 本頁樣式（建立在 assets/app.css 的設計 token 上，
 * 自動亮／暗色主題化、與學習基地視覺一致）。強調色沿用數學科的紫。
 * =================================================================== */
:root {
  --accent: var(--c-math);
  --accent-tint: var(--tint-math);
  --accent-ink: var(--c-math-ink);
  /* 等角積木配色（illustrative；隨主題微調） */
  --geo-top: #b9b1ff;
  --geo-left: #6c5ce7;
  --geo-right: #8b7ff0;
  --geo-stroke: #4b3fb0;
  --geo-cell: var(--card);
  --geo-cell-on: var(--c-math);
  --geo-line: var(--card-border);
}
:root[data-theme="dark"] {
  --geo-top: #6d64c9;
  --geo-left: #4a3fa0;
  --geo-right: #5b50b6;
  --geo-stroke: #2a2360;
}

body { overflow-x: hidden; }

/* 頁面頂列（回選單、標題） */
.geo-topbar { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s4); }
.geo-topbar .geo-title { flex: 1; font-size: var(--fs-h2); font-weight: 800; color: var(--ink); min-width: 0; }

/* 夥伴機器人「阿方」歡迎卡 */
.geo-hello { display: flex; align-items: center; gap: var(--s3); padding: var(--s4);
  background: var(--accent-tint); border: 1px solid var(--card-border); border-radius: var(--r-lg); margin-bottom: var(--s4); }
.geo-hello .geo-bot { font-size: 46px; flex: none; line-height: 1; }
.geo-hello .geo-bot.spin { animation: geo-spin 0.9s ease; }
@keyframes geo-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.geo-hello .geo-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.geo-hello .geo-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }

/* 安全提示條 */
.geo-note {
  display: flex; align-items: center; gap: var(--s2);
  padding: 10px var(--s3); margin: 0 auto var(--s3); max-width: 40ch;
  background: var(--accent-tint); border: 1px solid var(--card-border); border-left: 4px solid var(--accent);
  border-radius: var(--r-md); color: var(--ink); font-weight: 700; font-size: var(--fs-small);
}
.geo-note .geo-note-ico { font-size: 20px; flex: none; }

/* 立體圖示（solidSVG / net / shape）容器 */
.geo-figure { display: flex; justify-content: center; align-items: center; gap: var(--s4); flex-wrap: wrap; margin: var(--s3) 0; }
.geo-figure svg { display: block; }
.geo-svg-md { width: clamp(120px, 42vw, 180px); height: auto; }
.geo-svg-sm { width: clamp(90px, 30vw, 130px); height: auto; }

/* 面／邊／頂點 計數器 stepper */
.geo-counter { display: flex; align-items: center; justify-content: center; gap: var(--s3); margin: var(--s3) 0; }
.geo-counter button { min-width: 56px; min-height: 56px; border-radius: 16px; border: 2px solid var(--card-border);
  background: var(--card); color: var(--ink); font-family: var(--font); font-weight: 800; font-size: 26px; cursor: pointer; }
.geo-counter button:active { transform: scale(0.96); }
.geo-counter .geo-count-val { font-size: clamp(30px, 9vw, 46px); font-weight: 800; color: var(--accent-ink); min-width: 2.2ch; text-align: center; }

/* 提示（列出面等） */
.geo-hintbox { margin: var(--s2) auto; max-width: 34ch; padding: var(--s2) var(--s3);
  background: var(--accent-tint); border-radius: var(--r-md); font-size: var(--fs-small);
  font-weight: 700; color: var(--ink); line-height: 1.5; display: none; text-align: left; }
.geo-hintbox.show { display: block; }

/* 配對（reuse fi-match 風格；此頁用 geo-*） */
.geo-match { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin: var(--s3) 0; text-align: left; }
.geo-match-lbl { font-size: var(--fs-small); font-weight: 700; color: var(--ink-soft); text-align: center; }
.geo-tile { min-height: 56px; width: 100%; padding: 12px 14px; border: 2px solid var(--card-border); border-radius: 14px;
  background: var(--card); color: var(--ink); font-family: var(--font); font-size: clamp(14px, 3.1vw, 17px);
  font-weight: 700; text-align: left; cursor: pointer; margin-bottom: var(--s2); display: flex; align-items: center; gap: 8px; }
.geo-tile:active { transform: scale(0.98); }
.geo-tile.sel { border-color: var(--accent); background: var(--accent-tint); }
.geo-tile.matched { border-color: var(--c-correct); background: var(--tint-english); color: var(--ink); cursor: default; }
.geo-tile.shake { animation: geo-shake 0.3s; }
@keyframes geo-shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
.geo-tile svg { width: 34px; height: 34px; flex: none; }

/* 選項內嵌圖形（旋轉／對稱線題） */
.q-opt.geo-opt-fig { justify-content: center; padding: 10px; }
.q-opt.geo-opt-fig svg { width: clamp(74px, 22vw, 104px); height: auto; }

/* 積木堆疊建構（build to match）欄位 */
.geo-build-wrap { display: grid; gap: var(--s3); margin: var(--s3) 0; }
.geo-build-pane { padding: var(--s3); border: 2px solid var(--card-border); border-radius: var(--r-md); background: var(--card); }
.geo-build-pane h4 { margin: 0 0 var(--s2); font-size: var(--fs-small); color: var(--ink-soft); text-align: center; }
.geo-cols { display: flex; justify-content: center; gap: var(--s3); flex-wrap: wrap; margin-top: var(--s2); }
.geo-col-ctrl { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.geo-col-ctrl button { min-width: 52px; min-height: 44px; border-radius: 12px; border: 2px solid var(--card-border);
  background: var(--card); color: var(--ink); font-family: var(--font); font-weight: 800; font-size: 20px; cursor: pointer; }
.geo-col-ctrl button:active { transform: scale(0.96); }
.geo-col-ctrl .geo-col-h { font-weight: 800; color: var(--accent-ink); }
.geo-col-ctrl .geo-col-lbl { font-size: 12px; color: var(--ink-soft); font-weight: 700; }

/* 鏡射上色格 */
.geo-mirror { margin: var(--s3) auto; position: relative; width: max-content; }
.geo-mgrid { display: grid; gap: 3px; }
.geo-mcell { width: 34px; height: 34px; border-radius: 8px; border: 2px solid var(--card-border); background: var(--card);
  padding: 0; cursor: pointer; }
.geo-mcell.locked { background: var(--c-math); border-color: var(--c-math); cursor: default; }
.geo-mcell.on { background: var(--c-math-soft); border-color: var(--c-math); }
.geo-mcell.axis-left { box-shadow: 3px 0 0 0 var(--c-wrong); }
.geo-mirror-axis { text-align: center; font-size: var(--fs-small); font-weight: 700; color: var(--ink); margin-top: 6px; }

.geo-footnote { text-align: center; color: var(--ink-soft); font-size: var(--fs-small); margin-top: var(--s5); font-weight: 600; max-width: 34em; margin-inline: auto; }

/* 藍圖式單元卡的小徽記（沿用 u-card；此處只加旗標樣式） */
.u-card__blueprint { font-size: var(--fs-small); font-weight: 700; color: var(--accent-ink); }
.geo-due { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800;
  color: #4b3fb0; background: var(--accent-tint); border-radius: 999px; padding: 2px 10px; }
/* 淺色：待複習 chip 疊在旗艦卡漸層(--accent-tint→--card)上，最淺端近 --card；
   字色由 --accent-ink(#5a4bd4) 加深為 #4b3fb0，確保 chip 任一處 ≥4.5:1 */
/* 暗色主題：待複習標籤文字調亮，確保 ≥AA（原 --accent-ink on --accent-tint 為 4.17:1） */
:root[data-theme="dark"] .geo-due { color: #d7ccff; background: rgba(0,0,0,0.28); }
</style>
</head>
<body>
<!-- ===== 共用頂部應用列（全站一致） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">立體積木工坊 🧊</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

  <!-- ============================= 選單 / 首頁 ============================= -->
  <section id="screen-menu" class="u-screen active">
    <div class="geo-hello">
      <span class="geo-bot" id="hello-bot" aria-hidden="true">🤖</span>
      <div>
        <div class="geo-hello-text" id="hello-text">嗨！我是阿方，我們一起用積木蓋出立體吧！</div>
        <div class="geo-hello-sub" id="hello-sub">選一張藍圖，動手做做看，慢慢想沒關係。</div>
      </div>
    </div>

    <a class="cn-nextup cn-nextup--back" href="geometry_concepts.html"><span class="cn-nextup-ic" aria-hidden="true">🧠</span><span>還沒學過嗎？先到「幾何觀念養成」用圖學會，再回來練習 →</span></a>

    <div class="geo-note">
      <span class="geo-note-ico" aria-hidden="true">💡</span>
      <span>這裡的金幣是「學習點數」，記錄你努力的成果，不是真的錢、也不能拿去買東西喔！答錯不會扣分。</span>
    </div>

    <div class="u-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-done">0/7</span><span class="stat-label">完成藍圖</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-xp">0</span><span class="stat-label">數學經驗值</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-due">0</span><span class="stat-label">今日複習</span></div>
    </div>

    <div class="u-grid" id="unit-list"><!-- 由 JS 產生 --></div>

    <p class="geo-footnote">數立方、摺展開圖、轉一轉立體——動手做，就能把「想像不出來」變成「我蓋得出來」！🧱</p>
  </section>

  <!-- ============================= 進行中 ============================= -->
  <section id="screen-play" class="u-screen">
    <div class="geo-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button>
      <span class="geo-title" id="play-title">藍圖</span>
    </div>
    <div class="q-progress" id="step-dots" aria-hidden="true"></div>
    <div class="play-column">
      <div id="stage"><!-- 由 JS 產生每一步 --></div>
    </div>
  </section>

</main>

<script src="geometry.js"></script>
</body>
</html>
