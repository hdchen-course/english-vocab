<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成語故事館 📖</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<!--
  成語故事館：用「典故小故事」把成語講具體、好懂好記（回應「國語有點難」）。
  每個成語：故事 → 意思 → 造句 → 一題小測。純本地教學（idiom_stories_v1、data-game-hud="off"、
  不呼叫 Game.recordAnswer/award），不計入主角色 XP／等級（與觀念養成頁一致）。典故忠於經典出處。全繁體中文。
-->
<style>
  :root{ --su:#9a3412; --su-d:#7c2d12; --su-tint:rgba(154,52,18,0.10); }
  :root[data-theme="dark"]{ --su:#fdba74; --su-d:#fed7aa; --su-tint:rgba(253,186,116,0.14); }
  .id-wrap{ max-width: 900px; margin-inline:auto; }
  /* 選單（成語卡片格）填滿寬版容器，與其他頁一致；閱讀/練習畫面維持易讀窄欄 */
  #screen-menu.id-wrap{ max-width: var(--content-max); }
  .id-screen{ display:none; } .id-screen.active{ display:block; }
  .id-topbar{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s4); }
  .id-title{ font-size:var(--fs-h2); font-weight:800; color:var(--su-d); }
  .id-hello{ display:flex; align-items:center; gap:var(--s3); padding:var(--s4); background:var(--su-tint);
    border:1px solid var(--card-border); border-radius:var(--r-lg); margin-bottom:var(--s5); }
  .id-hello .id-mascot{ font-size:46px; flex:none; line-height:1; }
  .id-htext{ font-size:var(--fs-body); font-weight:700; color:var(--ink); }
  .id-hsub{ font-size:var(--fs-small); color:var(--ink-soft); font-weight:600; margin-top:2px; }
  .id-count{ font-size:var(--fs-small); font-weight:700; color:var(--ink-soft); margin-bottom:var(--s3); display:block; }
  .id-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:var(--s3); }
  .id-card{ display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; width:100%;
    padding:var(--s4) var(--s3); min-height:var(--tap-min); background:var(--card);
    border:2px solid var(--card-border); border-radius:var(--r-lg); cursor:pointer;
    font-family:var(--font); color:var(--ink); }
  .id-card:hover{ border-color:var(--su); }
  .id-card.done{ border-color:var(--su); background:var(--su-tint); }
  .id-card .id-c-word{ font-size:20px; font-weight:800; letter-spacing:1px; color:var(--ink); }
  .id-card .id-c-state{ font-size:12px; font-weight:800; color:var(--su-d); }
  .id-card.is-todo .id-c-state{ color:var(--ink-soft); }
  .id-note{ text-align:center; color:var(--ink-soft); font-size:var(--fs-small); margin-top:var(--s5); font-weight:600; max-width:34em; margin-inline:auto; }
  /* 故事/教學區 */
  .id-teach{ background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm); padding:var(--s5) var(--s4); }
  .id-teach h2{ font-size:26px; font-weight:800; color:var(--su-d); text-align:center; letter-spacing:2px; margin:0 0 var(--s4); }
  .id-block{ margin-bottom:var(--s4); padding:var(--s3) var(--s4); border-radius:var(--r-md); border-left:4px solid var(--su); background:var(--su-tint); }
  .id-block-label{ font-size:var(--fs-small); font-weight:800; margin-bottom:4px; color:var(--su-d); }
  .id-block-text{ font-size:var(--fs-body); font-weight:600; color:var(--ink); line-height:1.85; }
  .id-block.story .id-block-text{ line-height:1.9; }
  .id-block.eg{ border-left-color:var(--c-english); background:var(--tint-english); }
  .id-block.eg .id-block-label{ color:var(--c-english-ink); }
  /* quiz */
  .id-q{ font-size:var(--fs-body); font-weight:700; color:var(--ink); line-height:1.6; margin-bottom:var(--s3); }
  .id-opt{ display:block; width:100%; text-align:left; margin-bottom:var(--s2); padding:14px var(--s4);
    min-height:var(--tap-min); border:2px solid var(--card-border); border-radius:var(--r-md);
    background:var(--card); color:var(--ink); font-family:var(--font); font-size:var(--fs-body); font-weight:600; cursor:pointer; }
  .id-opt:hover{ border-color:var(--su); }
  .id-opt.correct{ border-color:var(--c-correct); background:var(--tint-english); }
  .id-opt.wrong{ border-color:var(--c-wrong); background:rgba(255,118,117,0.12); }
  .id-reveal{ margin-top:var(--s3); padding:var(--s3) var(--s4); background:var(--su-tint);
    border-radius:var(--r-md); font-size:var(--fs-body); font-weight:700; color:var(--ink); line-height:1.6; display:none; }
  .id-reveal.show{ display:block; }
  .id-actions{ margin-top:var(--s4); display:flex; gap:var(--s3); }
  .id-actions .btn{ flex:1; }
</style>
</head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">成語故事館 📖</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">
  <section id="screen-menu" class="id-screen active id-wrap">
    <div class="id-topbar"><span class="id-title">成語故事館 📖</span></div>
    <div class="id-hello">
      <span class="id-mascot" aria-hidden="true">📖</span>
      <div>
        <div class="id-htext">每個成語背後都有一個小故事。聽完故事，就會懂它的意思，也會用了！</div>
        <div class="id-hsub">先看故事 → 記住意思 → 看造句 → 玩個小測驗。放輕鬆讀就好。</div>
      </div>
    </div>
    <span class="id-count" id="id-count">已讀 0 / 0</span>
    <div class="id-grid" id="idiom-grid" aria-label="成語清單"></div>
    <a class="cn-nextup" href="chinese.html" style="display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px 16px;background:var(--su-tint);border:1px solid var(--card-border);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700;min-height:48px;line-height:1.5"><span style="font-size:26px;flex:none" aria-hidden="true">🚀</span><span>學會了？接著到「國語大冒險」練習 →</span></a>
    <p class="id-note">這是「成語故事」小旅程，只留在你的裝置上，不影響學習基地的等級或經驗值。慢慢讀、慢慢懂就好。</p>
  </section>

  <section id="screen-play" class="id-screen id-wrap">
    <div class="id-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到成語選單">←</button>
      <span class="id-title" id="play-title">成語故事</span>
    </div>
    <div class="play-column"><div id="stage"></div></div>
  </section>
</main>

<script>
/* eslint-disable */
var IDIOM_DATA = [{"idiom":"守株待兔","story":"宋國有個農夫在田裡工作，忽然看見一隻兔子跑得飛快，一頭撞上田邊的樹樁，就死了。農夫白白撿到兔子，好開心。從此他丟下鋤頭，天天守在樹樁旁，等著再撿到兔子。可是兔子再也沒來，他的田也全荒了。","meaning":"比喻不肯努力，只想守著老方法、靠運氣等著不勞而獲。","example":"想把成績考好就要每天複習，不能守株待兔，光坐著等好運降臨。","quiz":{"q":"「守株待兔」是在說什麼樣的人？","options":["不肯努力、只想靠運氣等好處的人","跑步很快、很有運動天分的人","很會種田、收成很好的農夫"],"answer":0,"explain":"這個成語提醒我們不能只等運氣，要靠自己努力，所以指的是「不肯努力、只想靠運氣等好處的人」。"}},{"idiom":"揠苗助長","story":"宋國有個農夫，嫌田裡的稻苗長得太慢，就一株一株把它們往上拔高一點。忙了一整天，他累得滿頭大汗回家，還得意地說：「今天我幫稻苗長高了不少！」他兒子急忙跑去田裡一看，稻苗全都枯死了。","meaning":"比喻違反事物成長的規律，急著求快，反而把事情弄壞。","example":"學鋼琴要一步步慢慢練，一下子就逼自己彈超難的曲子，反而是揠苗助長。","quiz":{"q":"「揠苗助長」告訴我們什麼道理？","options":["急著求快、違反規律，反而會壞事","多幫忙做事一定會有好結果","農夫都很勤勞、值得學習"],"answer":0,"explain":"農夫拔高稻苗反而害死它們，比喻做事太心急、不照規律，只會把事情弄糟。"}},{"idiom":"亡羊補牢","story":"從前有個人養了一群羊，有天羊圈破了個洞，晚上狼從洞裡叼走了一隻羊。鄰居勸他快把洞補好，他起先不聽。結果隔天又少了一隻羊，他才趕緊動手修補羊圈。從此羊圈牢牢的，再也沒丟過羊。","meaning":"比喻出了問題以後趕快想辦法補救，還來得及，不算太晚。","example":"這次月考退步了別灰心，現在亡羊補牢、認真補救，下次一樣有機會進步。","quiz":{"q":"下列哪個情況最適合用「亡羊補牢」？","options":["發現讀書方法錯了，馬上改進還來得及","事情做得很完美，不需要改任何地方","什麼都還沒發生，先擔心個不停"],"answer":0,"explain":"「亡羊補牢」是指出了問題後趕快補救，所以發現錯誤馬上改正最貼切。"}},{"idiom":"塞翁失馬","story":"邊塞住著一位老先生，有天他家的馬跑走了，鄰居都來安慰他，他卻笑說：「這說不定是好事呢。」過了幾個月，那匹馬竟帶著一匹好馬回來了。後來他兒子騎那匹馬時摔斷了腿，可是不久村裡的年輕人都被徵去打仗，他兒子因為腿傷留了下來，保住了性命。","meaning":"比喻壞事有時會變成好事，好與壞常會互相轉變，不必太早下定論。","example":"這次沒選上班長雖然難過，但塞翁失馬，我因此多了時間專心練球，反而更開心。","quiz":{"q":"「塞翁失馬」想表達的意思是什麼？","options":["好事與壞事可能互相轉變，不必太早下結論","丟了東西一定會有壞運氣","養馬的人都特別聰明"],"answer":0,"explain":"故事裡失馬、得馬、摔傷、免去打仗一連串變化，說明禍福會互相轉變。"}},{"idiom":"愚公移山","story":"很久以前，有位快九十歲的老人叫愚公，他家門前擋著兩座大山，進出都要繞很遠。愚公決定帶著子孫一鏟一鏟把山挖平。有人笑他傻，他說：「我死了還有兒子，兒子還有孫子，子子孫孫沒有窮盡，山卻不會再長高，總有一天挖得平！」他的決心感動了上天，兩座山最後被移走了。","meaning":"比喻只要有恆心、肯堅持不放棄，再困難的事也能完成。","example":"想把英文學好沒有捷徑，就要有愚公移山的精神，每天堅持背幾個單字。","quiz":{"q":"「愚公移山」主要在稱讚什麼？","options":["有恆心、肯堅持到底的精神","力氣很大、能搬動大石頭","年紀大的人比較有智慧"],"answer":0,"explain":"愚公靠世世代代不放棄的決心把山移走，這個成語讚美的是恆心與堅持。"}},{"idiom":"井底之蛙","story":"有隻青蛙住在一口淺淺的井裡，牠覺得自己的小天地最棒了。有天一隻來自東海的大鱉（一種像烏龜、生活在水裡的動物）經過，青蛙得意地說：「我這口井多好玩啊！」大鱉便跟牠說起大海的遼闊無邊、深不見底。青蛙聽了呆住了，這才明白，原來自己看到的天空，只有井口那麼一點大。","meaning":"比喻見識狹小、眼界不夠寬廣的人。","example":"多讀點書、多出去走走看看，才不會變成井底之蛙，以為自己知道的就是全世界。","quiz":{"q":"「井底之蛙」用來形容什麼樣的人？","options":["見識狹窄、眼界不夠寬的人","很會游泳、住在水邊的人","跳得特別高、身手好的人"],"answer":0,"explain":"青蛙只看得到井口那麼大的天空，比喻見識狹小、眼界不寬的人。"}},{"idiom":"狐假虎威","story":"老虎在森林裡抓到一隻狐狸，正要吃掉牠。狐狸急中生智說：「你不敢吃我！天帝派我來當百獸之王，不信你跟在我後面走走看。」老虎半信半疑地跟著走，一路上的動物看見老虎都嚇得逃走。老虎以為大家怕的是狐狸，其實牠們怕的是老虎啊。","meaning":"比喻藉著別人的權勢，來嚇唬、欺壓別人。","example":"他仗著哥哥是隊長，就狐假虎威地對同學指手畫腳，大家都很不服氣。","quiz":{"q":"「狐假虎威」是在說什麼行為？","options":["借別人的權勢來嚇唬、欺壓人","勇敢地保護比自己弱小的動物","很誠實地承認自己的錯誤"],"answer":0,"explain":"狐狸靠著老虎的威風嚇跑其他動物，比喻借別人的權勢來嚇唬、欺壓人。"}},{"idiom":"畫蛇添足","story":"楚國有幾個人比賽畫蛇，說好誰先畫完，就能喝那壺酒。有個人最先畫好，看別人還沒完成，就得意地說：「我還能替蛇添上腳呢！」正添著腳，另一個人畫完了，一把搶過酒說：「蛇本來就沒有腳，你畫了腳，那還算蛇嗎？」說完就把酒喝掉了。","meaning":"比喻做了多餘的事，不但沒有幫助，反而把事情弄糟。","example":"這篇作文結尾已經很完整了，你再硬加一段解釋，反而是畫蛇添足。","quiz":{"q":"「畫蛇添足」提醒我們什麼？","options":["多做不必要的事，反而會把事情弄糟","畫圖時要記得畫出動物的腳","比賽時動作要越快越好"],"answer":0,"explain":"那個人多畫了蛇腳反而輸掉，比喻做多餘的事不但沒幫助，還會壞事。"}},{"idiom":"自相矛盾","story":"楚國有個人在市場上賣矛和盾。他先舉起盾大聲誇：「我的盾最堅固，什麼武器都刺不穿它！」接著又舉起矛說：「我的矛最銳利，什麼東西都刺得穿！」旁邊有人問他：「那用你的矛，去刺你的盾，會怎麼樣呢？」他一句話也答不上來。","meaning":"比喻一個人說話或做事前後不一致、互相衝突。","example":"你剛剛說最喜歡安靜看書，現在又吵著要辦熱鬧派對，這不是自相矛盾嗎？","quiz":{"q":"「自相矛盾」是指什麼情況？","options":["說的話前後互相衝突、對不上","同時賣兩種不同的東西","武器又堅固又銳利很厲害"],"answer":0,"explain":"賣的人一下說盾刺不穿、一下說矛都刺得穿，兩句話互相衝突，就是自相矛盾。"}},{"idiom":"刻舟求劍","story":"楚國有個人坐船過江，一不小心把腰間的劍掉進了水裡。旁人要他快下水去撈，他卻不慌不忙，在船邊掉劍的地方刻了個記號，說：「我的劍就是從這裡掉下去的。」等船靠了岸，他才照著記號跳下水找劍，當然什麼也找不到，因為船早就往前走遠了。","meaning":"比喻死守老規矩、老方法，不懂得跟著情況改變。","example":"時代一直在變，做事若還刻舟求劍、不肯換個新方法，就很難進步。","quiz":{"q":"「刻舟求劍」的人錯在哪裡？","options":["船已經移動，卻還照舊記號找劍，不懂變通","太快跳下水，把劍越推越遠","刻記號時刀子不夠鋒利"],"answer":0,"explain":"船會移動、劍卻沉在原地，他死守記號不知變通，所以找不到劍。"}},{"idiom":"掩耳盜鈴","story":"從前有個人想偷別人家的一口大鐘，可是鐘太重搬不走，他就想把鐘敲碎再一塊塊拿走。誰知才敲第一下，鐘就「噹」地發出好大的響聲。他怕被別人聽見，竟然伸手摀住自己的耳朵，以為這樣一來，別人也就聽不見了。（這個故事裡偷的其實是會發出聲音的大鐘，後來人們也把它說成「掩耳盜鈴」，鈴和鐘都是一敲就響的東西。）","meaning":"比喻自己欺騙自己，明明掩蓋不了的事，卻假裝別人都不知道。","example":"作業沒寫完卻把本子藏起來，以為老師不會發現，這根本是掩耳盜鈴。","quiz":{"q":"「掩耳盜鈴」主要在說什麼？","options":["自己騙自己，假裝別人不知道","偷東西前要先做好計畫","摀住耳朵可以保護聽力"],"answer":0,"explain":"摀住自己的耳朵，別人照樣聽得見，比喻自欺欺人、騙的其實是自己。"}},{"idiom":"杯弓蛇影","story":"晉朝有個叫樂廣的人，請朋友到家裡喝酒。朋友回去後竟生病了。原來他喝酒時，看見杯子裡好像有條小蛇在動，勉強喝下肚，越想越噁心。樂廣仔細一查，發現那是牆上掛的一把弓，倒映在酒杯裡的影子。他再請朋友來，當面指出真相，朋友心裡的疙瘩一解開，病馬上就好了。","meaning":"比喻疑神疑鬼，把根本不存在的東西當成真的，自己嚇自己。","example":"只是風把門吹得響一下，你就怕成這樣，真是杯弓蛇影、自己嚇自己。","quiz":{"q":"「杯弓蛇影」形容的是什麼？","options":["疑神疑鬼，把假象當真而自己嚇自己","杯子裡真的有一條毒蛇","喝酒喝太多會生病"],"answer":0,"explain":"杯裡其實只是弓的影子，朋友卻疑心成蛇而生病，比喻疑神疑鬼、自己嚇自己。"}},{"idiom":"三顧茅廬","story":"三國時代，劉備聽說隆中住著一位很有智慧的人叫諸葛亮，就想請他來幫忙。第一次去，諸葛亮不在家；第二次去，還是沒遇到；劉備並不生氣，冒著風雪第三次再去拜訪。諸葛亮看他這麼有誠意，終於答應出山相助。","meaning":"比喻用非常誠懇的態度，一次又一次地邀請有才能的人。","example":"為了請這位得過大獎的老師來教書法，校長三顧茅廬，親自登門拜訪了好幾次。","quiz":{"q":"「三顧茅廬」這個成語，主要用來形容什麼？","options":["誠心誠意，一再邀請有才能的人","很喜歡蓋茅草屋來住","去別人家玩了三次"],"answer":0,"explain":"劉備三次拜訪諸葛亮，重點在「誠懇邀請人才」，不是蓋屋子或單純去玩。"}},{"idiom":"臥薪嘗膽","story":"春秋時代，越王勾踐被吳國打敗，受盡屈辱。回國後，他不敢過舒服的日子：晚上睡在硬邦邦的柴草上，吃飯前還先嘗一口苦膽，提醒自己別忘記失敗的滋味。就這樣努力了好多年，越國終於強大起來。","meaning":"形容人刻苦自勵、發奮圖強，時時提醒自己不忘目標。","example":"這次比賽輸了，他決定臥薪嘗膽，每天多練一小時，明年一定要贏回來。","quiz":{"q":"「臥薪嘗膽」是用來形容一個人怎麼樣？","options":["喜歡吃苦苦的食物","刻苦努力、發憤圖強，不忘目標","睡覺不挑床，隨便睡"],"answer":1,"explain":"勾踐睡柴草、嘗苦膽是為了提醒自己奮發圖強，重點在「刻苦努力」。"}},{"idiom":"破釜沉舟","story":"秦朝末年，項羽帶兵去救被圍困的軍隊。渡過河以後，他下令把煮飯的鍋全砸破，把船也全鑿沉，每人只帶三天糧食。士兵們知道沒有退路，只能拚命向前，果然打了大勝仗。","meaning":"比喻下定決心，不留退路，全力以赴去做一件事。","example":"為了通過檢定考試，姐姐破釜沉舟，把手機收起來，整個暑假都專心讀書。","quiz":{"q":"「破釜沉舟」的意思最接近下面哪一個？","options":["把鍋子和船都弄壞很浪費","下定決心、不留退路，拚盡全力","坐船時要小心不要翻船"],"answer":1,"explain":"項羽砸鍋沉船是為了斷絕退路、逼自己全力作戰，比喻「決心到底」。"}},{"idiom":"一鳴驚人","story":"春秋時代，楚莊王剛當上國王時，整天玩樂，三年都不管國家大事。有位臣子問他：「有一隻鳥停在山上，三年不飛也不叫，這是什麼鳥？」莊王笑著說：「這鳥不飛便罷，一飛就直上雲霄；不叫便罷，一叫就驚動眾人。」後來他果然振作，把國家治理得很好。","meaning":"比喻平時默默無聞，一有表現就做出讓大家驚訝的成績。","example":"他平常很少發言，這次演講比賽卻拿了第一名，真是一鳴驚人。","quiz":{"q":"用「一鳴驚人」來形容一個人，是指他？","options":["很愛大聲說話、很吵","平時不起眼，一出手就有驚人的好表現","養了一隻很會叫的鳥"],"answer":1,"explain":"楚莊王比喻自己像那隻鳥，一表現就驚人，重點是「平時低調、出手驚人」。"}},{"idiom":"東施效顰","story":"古時候有位美女叫西施，有一天她心口不舒服，皺著眉頭、按著胸口走路，樣子仍然很美。同村一個長得普通的女子看見了，以為皺眉很好看，就也學著捧胸皺眉。沒想到這樣一模仿，反而讓人覺得更難看，大家都躲著她。","meaning":"比喻不衡量自己的條件，胡亂模仿別人，結果反而更糟。","example":"別人怎麼穿你就怎麼穿，也不看適不適合自己，這樣東施效顰只會鬧笑話。","quiz":{"q":"「東施效顰」提醒我們不要怎麼做？","options":["不考慮自己的情況，盲目模仿別人","生病時要皺眉頭","多稱讚漂亮的人"],"answer":0,"explain":"醜女硬學西施皺眉反而更難看，這個成語是勸人別「盲目模仿」。"}},{"idiom":"對牛彈琴","story":"從前有位很會彈琴的人叫公明儀，有一次他對著一頭牛，彈了一首很美的曲子。可是牛只顧著低頭吃草，完全沒有反應。原來牛根本聽不懂音樂，他彈得再好也是白費力氣。","meaning":"比喻對不懂道理的人講道理，白費力氣；也用來笑人說話不看對象。","example":"跟只想玩的小狗解釋數學題，簡直是對牛彈琴，牠怎麼聽得懂呢？","quiz":{"q":"「對牛彈琴」這個成語，主要是說什麼情況？","options":["牛其實很喜歡聽音樂","對聽不懂的對象講道理，白費力氣","彈琴要彈給動物聽才好聽"],"answer":1,"explain":"牛聽不懂琴聲，比喻「對不懂的人說道理是白費力氣」。"}},{"idiom":"濫竽充數","story":"戰國時齊宣王喜歡聽人吹「竽」這種樂器，而且愛聽三百人一起合奏。有個南郭先生其實根本不會吹，卻混進樂隊裡，假裝鼓著腮幫子跟大家一起吹，也領到薪水。後來新國王喜歡聽一個一個單獨吹，南郭先生怕露餡，只好偷偷逃走了。","meaning":"比喻沒有真本領的人混在行家裡湊數，或拿不好的東西冒充好的。","example":"分組時大家都很認真，只有他什麼都不做，濫竽充數，被同學發現了。","quiz":{"q":"「濫竽充數」是在說一個人？","options":["吹竽吹得特別大聲","沒有真本領，混在裡面湊數","很喜歡加入樂隊"],"answer":1,"explain":"南郭先生不會吹卻混進樂隊拿薪水，比喻「沒真本事的人湊數」。"}},{"idiom":"鷸蚌相爭","story":"河邊有一隻蚌張開殼曬太陽，一隻叫鷸的鳥飛來啄牠的肉。蚌立刻把殼合起來，夾住鷸的嘴。鷸說：「今天不下雨、明天不下雨，你就會乾死！」蚌回嘴：「今天不放你、明天不放你，你就會餓死！」兩個誰也不讓誰，結果一個路過的漁夫，輕輕鬆鬆就把牠們一起抓走了。","meaning":"比喻雙方僵持不下、互不相讓，結果讓第三者得到好處。","example":"你們兩個為了一顆球吵個不停，最後被別班同學拿去玩，真是鷸蚌相爭啊。","quiz":{"q":"「鷸蚌相爭」告訴我們的道理最接近？","options":["雙方互不相讓，反而讓別人得到好處","河邊很危險不要靠近","鳥和蚌是好朋友"],"answer":0,"explain":"鷸和蚌互不放手，最後被漁夫一起抓走，比喻「相爭讓第三者得利」。"}},{"idiom":"螳螂捕蟬","story":"花園裡，一隻蟬在樹上開心地喝露水唱歌，卻沒發現身後有隻螳螂正舉起前腳要抓牠。而那隻螳螂只顧著盯住蟬，也沒注意到旁邊有隻黃雀，張著嘴正想把牠吃掉。大家都只看見眼前的好處，卻忘了背後藏著危險。","meaning":"比喻只顧眼前的利益，卻沒發現背後正有危險（後常接「黃雀在後」）。","example":"他一心想搶第一個溜下滑梯，卻沒看到腳下的水漬，真是螳螂捕蟬，差點摔跤。","quiz":{"q":"「螳螂捕蟬，黃雀在後」提醒我們什麼？","options":["螳螂比蟬厲害","只顧眼前好處，要小心背後的危險","花園裡昆蟲很多"],"answer":1,"explain":"螳螂只盯著蟬，卻沒發現黃雀在後，比喻「貪圖眼前而忽略身後危險」。"}},{"idiom":"望梅止渴","story":"三國時，曹操帶著大軍趕路，天氣很熱，士兵們又累又渴，卻找不到水，走不動了。曹操靈機一動，指著前方大聲說：「前面有一大片梅子林，梅子又酸又甜，快到了！」士兵一想到酸梅，嘴裡自然生出口水，暫時不那麼渴，就又打起精神繼續往前走。","meaning":"比喻用空想或假象來安慰自己，暫時得到一點滿足。","example":"還沒到晚餐時間，肚子好餓，我只好看著食譜圖片望梅止渴。","quiz":{"q":"「望梅止渴」的意思是？","options":["吃梅子真的能解渴","用空想或想像暫時安慰自己","口渴時要多喝水"],"answer":1,"explain":"士兵靠想像酸梅生口水解渴，比喻「用空想暫時安慰自己」。"}},{"idiom":"精衛填海","story":"傳說炎帝有個女兒叫女娃，有一天到東海邊玩，不小心被大浪捲走，再也沒回來。她的靈魂化成一隻小鳥，叫作「精衛」。精衛心裡很不甘心，每天從西山銜來小樹枝和小石子，一次又一次丟進大海，想要把大海填平。","meaning":"比喻意志堅定，不怕困難，努力不懈地去完成目標。","example":"想把整片沙灘的垃圾撿乾淨雖然很難，但他有精衛填海的決心，每天都來撿一點。","quiz":{"q":"「精衛填海」主要用來稱讚一個人？","options":["很會丟石頭","意志堅定，不怕困難努力到底","喜歡到海邊玩水"],"answer":1,"explain":"精衛不停銜石填海，比喻「不畏艱難、堅持不懈」的精神。"}},{"idiom":"朝三暮四","story":"古時候有個老人養了一群猴子，每天餵牠們橡子吃。有一天他說：「早上給你們三顆，晚上給四顆，好嗎？」猴子們一聽早上只有三顆，都生氣地叫起來。老人改口說：「那早上四顆，晚上三顆呢？」猴子們一聽早上變多了，全都高興得不得了。其實一天還是七顆，一點也沒變。","meaning":"原指用手段愚弄人；現在多用來比喻人反覆無常、變來變去、拿不定主意。","example":"他決定社團一下想選籃球、一下又想選美術，這樣朝三暮四，什麼都學不好。","quiz":{"q":"現在我們說一個人「朝三暮四」，通常是指他？","options":["很會算數學","反覆無常、常常改變主意","早上和晚上都很忙"],"answer":1,"explain":"猴子被早三晚四、早四晚三的說法騙得團團轉；今天多用來說人「反覆無常、拿不定主意」。"}},{"idiom":"盲人摸象","story":"從前有幾個看不見的人，想知道大象長什麼樣子。他們伸手去摸：摸到耳朵的說像扇子，摸到腿的說像柱子，摸到尾巴的說像繩子，摸到肚子的說像牆壁。每個人都堅持自己才對，吵個不停，其實誰也沒摸到大象真正完整的樣子。","meaning":"只看到或摸到一部分，就以為是全部，容易對事情產生誤解。","example":"我只看了考卷第一題就說很簡單，結果後面好難，真是盲人摸象。","quiz":{"q":"「盲人摸象」告訴我們什麼道理？","options":["只憑一部分就下結論，容易誤會事情的全貌","大象的耳朵長得像扇子","摸東西之前要先洗手"],"answer":0,"explain":"這個成語重點在提醒我們別以偏概全，要了解事情的整體，而不是只看某一部分。"}},{"idiom":"鄭人買履","story":"鄭國有個人想買鞋，先在家量好了自己腳的尺寸，卻忘了把量好的紙條帶去。到了市場挑好鞋，他才發現尺寸忘在家裡，急忙跑回去拿，等再回到市場，店已經收了。別人問他：「為什麼不用自己的腳去試呢？」他說：「我寧可相信量好的尺寸，也不相信自己的腳。」","meaning":"死守規矩或條文，不懂得看實際情況靈活變通。","example":"食譜寫兩顆蛋，家裡蛋比較大他還硬要湊兩顆，簡直是鄭人買履。","quiz":{"q":"「鄭人買履」主要在笑什麼樣的人？","options":["死守量好的尺寸，卻不肯用自己的腳去試","買鞋只挑最便宜的","跑步跑得比別人慢"],"answer":0,"explain":"故事重點是那個人只相信紙上的尺寸，不知道變通，明明用腳一試就好了。"}},{"idiom":"葉公好龍","story":"楚國有位葉公，非常喜歡龍。他家的柱子、牆壁、器具上，到處都刻著、畫著龍。天上真正的龍聽說了，很感動，就跑到他家來探望，把頭伸進窗戶。葉公一看到真龍，嚇得臉色發白，轉身就逃走了。原來他愛的只是龍的圖案，並不是真的龍。","meaning":"表面上很喜歡某樣東西，實際上並不是真心喜愛。","example":"他天天說最愛小狗，鄰居的狗一靠近就嚇得躲開，根本是葉公好龍。","quiz":{"q":"「葉公好龍」是在說怎樣的喜歡？","options":["只是表面喜歡，真的遇到卻害怕、退縮","真心喜愛，什麼都不怕","喜歡畫圖的人"],"answer":0,"explain":"葉公愛的是龍的圖案，真龍一來卻嚇跑了，所以比喻只是嘴上喜歡、並非真愛。"}},{"idiom":"買櫝還珠","story":"楚國有個人要賣一顆珍貴的珠子。他用香木做了個精美的盒子，還鑲上寶石、掛上裝飾，把珠子放在裡面。一位鄭國人看了很喜歡，買下之後，竟然把珠子還給賣家，只留下那個漂亮的盒子。他看重的是盒子，反而丟了真正貴重的珠子。","meaning":"取捨顛倒，只看重不重要的外表，反而丟了真正珍貴的東西。","example":"買玩具只顧著搶漂亮的包裝盒，把裡面的積木送人，這不是買櫝還珠嗎？","quiz":{"q":"「買櫝還珠」比喻什麼？","options":["只看重外表的盒子，反而丟了真正珍貴的珠子","盒子做得比珠子還值錢","鄭國人很會做生意"],"answer":0,"explain":"故事重點是那人分不清輕重，留下盒子還了珠子，比喻捨本逐末、取捨不當。"}},{"idiom":"南轅北轍","story":"戰國時，有個人要去南方的楚國，卻駕著馬車一路往北走。路人提醒他方向反了，他卻說：「沒關係，我的馬跑得很快，我的盤纏很多，我的車夫技術很好。」可是楚國在南方，他的條件越好，馬車越快，離楚國反而越來越遠。","meaning":"行動的方向和想達到的目標完全相反，越努力離目標越遠。","example":"想把字寫工整卻越寫越快越潦草，這樣練習根本是南轅北轍。","quiz":{"q":"「南轅北轍」提醒我們什麼？","options":["方向和目標相反時，越努力反而離目標越遠","馬車跑得快就一定會到","楚國其實在北方"],"answer":0,"explain":"那人條件再好，方向錯了也到不了楚國，所以比喻方向錯誤、努力白費。"}},{"idiom":"邯鄲學步","story":"燕國有個年輕人，聽說趙國邯鄲的人走路姿勢特別優雅，就特地跑去學。他一心模仿別人，卻怎麼也學不像，最後連自己原本怎麼走路都忘了。結果沒學會邯鄲的走法，只好一路爬著回家。","meaning":"盲目模仿別人，不但沒學好，反而連自己原有的本領也丟了。","example":"為了模仿同學的字體，我把自己原本工整的字也寫壞了，真是邯鄲學步。","quiz":{"q":"「邯鄲學步」告訴我們什麼？","options":["盲目模仿別人，可能連自己原本會的都忘了","邯鄲人走路最好看","爬回家比走路快"],"answer":0,"explain":"年輕人一味模仿，沒學會新走法還忘了原來的，比喻學別人卻失去了自己。"}},{"idiom":"老馬識途","story":"春秋時，齊國的軍隊跟著管仲出征，回程時在山裡迷了路，怎麼也找不到方向。管仲想了想說：「老馬的經驗可以派上用場。」於是把幾匹老馬放到隊伍前頭，讓大家跟著牠們走，果然順利找到了回去的路。","meaning":"有經驗的人熟悉情況，遇到難題時能帶領大家找到方向。","example":"校慶闖關迷路了，還好學長老馬識途，一下就帶我們找到集合點。","quiz":{"q":"「老馬識途」比喻什麼樣的人？","options":["有經驗、熟悉情況，能帶領大家解決問題","跑得最快的人","年紀最大的人一定最厲害"],"answer":0,"explain":"管仲靠老馬的經驗帶大家找到路，比喻有經驗的人能在關鍵時給大家指引。"}},{"idiom":"唇亡齒寒","story":"春秋時，晉國想向虞國借路去攻打虢國。虞國大臣宮之奇勸阻說：「虞國和虢國的關係，就像嘴唇和牙齒；嘴唇沒有了，牙齒就會覺得冷。虢國要是保不住，虞國也危險了。」虞君不聽，借了路。後來虢國被滅，虞國果然也跟著保不住了。","meaning":"關係密切的雙方利害相連，一方遭殃，另一方也難以平安。","example":"隔壁班被取消戶外教學，我們班也可能一起被取消，真是唇亡齒寒。","quiz":{"q":"「唇亡齒寒」是在比喻什麼？","options":["關係密切的雙方利害相連，一方受害另一方也難保","冬天嘴唇容易乾裂","牙齒要記得保暖"],"answer":0,"explain":"宮之奇用嘴唇和牙齒的關係，說明兩國彼此依靠，一方倒下另一方也危險。"}},{"idiom":"黔驢技窮","story":"從前貴州一帶沒有驢，有人特地運了一頭去。老虎第一次看到這麼大的動物，又聽牠大叫，嚇得躲得遠遠的。過了幾天，老虎慢慢靠近試探，發現驢除了會踢腳，就沒別的本事了。老虎明白驢的本領只有這些，就不再怕牠了。","meaning":"有限的本領全都用完，再也拿不出新辦法了。","example":"他吵架時翻來覆去只會說同一句，早就黔驢技窮了。","quiz":{"q":"「黔驢技窮」是什麼意思？","options":["有限的本領用完了，再也想不出別的辦法","驢子的力氣其實很大","老虎一直很怕驢"],"answer":0,"explain":"驢的本事被老虎看穿，只剩踢腳一招，比喻本領有限、招數用盡。"}},{"idiom":"熟能生巧","story":"北宋有位神射手陳堯咨，很得意自己的箭術。一位賣油的老翁在旁邊看，只是點點頭。老翁拿出一個銅錢蓋在葫蘆口，用勺子把油從錢中間的小孔倒進去，油一滴都沒沾到銅錢。他說：「這沒什麼，只是手熟練罷了。」","meaning":"同一件事反覆練習、做得熟練後，自然就能生出巧妙的技巧。","example":"剛學騎腳踏車一直跌倒，多練幾天就穩了，果然熟能生巧。","quiz":{"q":"「熟能生巧」告訴我們什麼？","options":["反覆練習到熟練，自然能生出巧妙的技巧","有些人天生就什麼都會","倒油本來就很簡單"],"answer":0,"explain":"賣油翁靠長期練習才有那樣的準頭，說明熟練是靠反覆練習得來的。"}},{"idiom":"胸有成竹","story":"北宋畫家文與可很會畫竹子。他平時常到竹林裡仔細觀察竹子在不同季節、天氣下的樣子。等到要動筆時，整棵竹子的模樣早已清清楚楚地在他心裡，於是一提筆就能畫得又快又像。人們說他畫竹前，心中早已有了完整的竹子。","meaning":"做事之前心裡已經有了完整的計畫和把握。","example":"上台報告前我已經反覆練習過，站上去時胸有成竹，一點也不緊張。","quiz":{"q":"「胸有成竹」形容什麼？","options":["動手前心裡已有完整的計畫和把握","胸口真的長出竹子","畫竹子要用很多枝筆"],"answer":0,"explain":"文與可下筆前心中已有完整的竹子，比喻做事前準備充分、心裡有把握。"}},{"idiom":"孟母三遷","story":"孟子小時候，家住在墓地附近，他就常學著大人辦喪事的樣子玩。孟母覺得不好，搬到市場旁，孟子又學起做買賣、吆喝叫賣。孟母再搬到學校附近，孟子開始學讀書、行禮的樣子。孟母這才安心地說：「這裡才適合孩子住。」於是就住下來了。","meaning":"成長的環境會深深影響一個人，所以要慎重選擇好的環境。","example":"為了讓我專心讀書，爸媽把書桌搬到安靜的房間，很有孟母三遷的用心。","quiz":{"q":"「孟母三遷」主要想告訴我們什麼？","options":["環境會影響成長，所以要慎選好的環境","常常搬家是件好玩的事","學校一定要離家很近"],"answer":0,"explain":"孟母三次搬家是為了給孟子好的成長環境，重點在環境對人的影響很大。"}},{"idiom":"完璧歸趙","story":"戰國時候，趙國得到一塊珍貴的「和氏璧」。秦王說願意用十五座城來換，趙王怕被騙，就派聰明的藺相如帶著寶玉去秦國。藺相如看出秦王只想騙玉、不想給城，就用機智把寶玉要了回來，還悄悄派人把玉完好地送回趙國。","meaning":"把東西完整地歸還給原來的主人。","example":"同學借我的漫畫，我一定會愛惜地看，看完完璧歸趙還給他。","quiz":{"q":"「完璧歸趙」這個成語主要在說什麼？","options":["把借來或該還的東西完好地還回去","把玉送給國王當禮物","把城池割讓給別國"],"answer":0,"explain":"藺相如把和氏璧完整地送回趙國，所以用來比喻把東西完好歸還原主。"}},{"idiom":"負荊請罪","story":"趙國的藺相如立了大功，被封為大官，職位在老將軍廉頗之上。廉頗很不服氣，處處想為難他。後來廉頗聽說，藺相如一直忍讓是為了國家團結，非常慚愧。於是他背著荊條（一種帶刺的枝條），親自到藺相如家門前認錯，兩人從此成為好朋友。","meaning":"主動向對方誠懇地承認錯誤、賠不是。","example":"我誤會了好朋友，隔天就負荊請罪，向他道歉。","quiz":{"q":"廉頗背著荊條到藺相如家，是為了做什麼？","options":["炫耀自己的武功","誠心向對方認錯道歉","邀請對方去打仗"],"answer":1,"explain":"廉頗背荊條上門是要向藺相如認錯，所以「負荊請罪」指誠懇地道歉認錯。"}},{"idiom":"紙上談兵","story":"戰國時，趙國名將趙奢的兒子趙括，從小把兵書讀得滾瓜爛熟，談起打仗頭頭是道，連父親也說不過他。可是趙奢卻擔心地說：兒子只會照書本講道理，沒有真正的作戰經驗。後來趙括帶兵，果然因為不懂隨機應變而吃了大敗仗。","meaning":"只會空談理論，卻不能實際去做或解決問題。","example":"光是紙上談兵沒有用，我們要親自動手做實驗才會懂。","quiz":{"q":"「紙上談兵」提醒我們什麼道理？","options":["讀兵書一定會打勝仗","只會空談理論、不會實作是不夠的","說話越多本領越大"],"answer":1,"explain":"趙括只懂書本理論卻不會實際應用，所以這句話提醒人不能只空談、要能實踐。"}},{"idiom":"指鹿為馬","story":"秦朝有個大臣叫趙高，權力很大，想試探朝中大臣是不是聽他的話。有一天他牽來一頭鹿，卻故意對皇帝說：「這是一匹馬。」皇帝笑說那明明是鹿，趙高就轉頭問群臣。有些人害怕趙高，明知是鹿也跟著說是馬，說真話的人反而被記恨。","meaning":"故意顛倒黑白、把錯的硬說成對的。","example":"明明是他先犯規，卻指鹿為馬說是我的錯，真沒道理。","quiz":{"q":"趙高把鹿說成馬，是在做什麼？","options":["教大家認識動物","故意顛倒是非、混淆黑白","跟大臣開善意的玩笑"],"answer":1,"explain":"趙高明知是鹿卻硬說成馬，用來比喻故意顛倒黑白、混淆是非。"}},{"idiom":"四面楚歌","story":"楚漢相爭的末期，西楚霸王項羽的軍隊被漢軍團團圍住，糧食也快沒了。到了夜裡，四面八方的漢軍營裡都傳來楚國的歌聲。項羽聽了大吃一驚，以為連家鄉楚地都被占領了，身邊的人也跟著士氣低落，處境十分孤立為難。","meaning":"比喻四面受敵、孤立無援的困難處境。","example":"他一個人要對抗全班的反對意見，簡直是四面楚歌。","quiz":{"q":"「四面楚歌」用來形容什麼樣的處境？","options":["四周都是好朋友的熱鬧場面","孤立無援、四面受困的處境","到處都在唱歌很開心"],"answer":1,"explain":"項羽被漢軍包圍、四面傳來楚歌，所以這句話比喻孤立無援、四面受困。"}},{"idiom":"草木皆兵","story":"東晉時，前秦的君主苻堅帶著大軍南下，進逼淝水。他登上壽陽城遠望對面的八公山，看到滿山的草和樹木隨風搖動，竟然嚇得以為那些都是埋伏的晉兵。因為心裡太過害怕，連草木都被他當成了士兵；後來果然在淝水打了大敗仗。","meaning":"形容人非常驚慌害怕，把不相干的東西也當成威脅。","example":"看完鬼故事，我一整晚草木皆兵，連窗簾動一下都嚇一跳。","quiz":{"q":"苻堅為什麼會把山上的草木看成士兵？","options":["因為他眼睛看不清楚","因為他心裡太驚慌害怕","因為草木真的變成了士兵"],"answer":1,"explain":"苻堅面對大戰、心裡太過緊張害怕，才把草木都當成敵兵，所以形容人過度驚慌害怕。"}},{"idiom":"聞雞起舞","story":"晉朝有位少年叫祖逖，很有志氣，想為國家做一番事業。他和好朋友一起住的時候，每天半夜一聽到公雞啼叫，就立刻起床，到院子裡舞劍練功，不管天氣多冷都不偷懶。靠著這樣日日勤練，他後來果然成為一位出色的將領。","meaning":"比喻人有志氣，能把握時間、勤奮努力。","example":"為了準備比賽，他聞雞起舞，每天天還沒亮就起來練習。","quiz":{"q":"「聞雞起舞」是在讚美一個人怎麼樣？","options":["很會養雞","很有志氣、把握時間勤奮努力","喜歡早起看日出"],"answer":1,"explain":"祖逖一聽雞叫就起床練劍，所以這句話用來讚美人有志氣、勤奮把握時間。"}},{"idiom":"鑿壁偷光","story":"西漢有個窮孩子叫匡衡，非常喜歡讀書，可是家裡買不起點燈的油，一到晚上就沒辦法看書。他發現隔壁鄰居家有燈光，就在牆壁上鑿了一個小洞，讓那微弱的光透過來，靠著這一點光努力讀書。後來匡衡讀通了許多學問，成了有名的學者。","meaning":"形容在困難的環境裡，仍然想辦法刻苦讀書。","example":"就算家裡沒有書桌，他也發揮鑿壁偷光的精神，在樓梯口認真讀書。","quiz":{"q":"匡衡在牆上鑿洞是為了什麼？","options":["讓透過來的燈光幫助他讀書","偷偷看鄰居家在做什麼","讓房間比較通風涼快"],"answer":0,"explain":"匡衡鑿壁是要借鄰居的燈光讀書，所以這句話形容在困境中刻苦向學。"}},{"idiom":"懸梁刺股","story":"這句成語來自兩個古人勤學的故事。漢朝的孫敬讀書時，怕自己打瞌睡，就用繩子把頭髮綁在屋樑上，一低頭就會被拉醒，趕快繼續讀。戰國時的蘇秦也一樣用功，睏了就用錐子輕輕刺一下大腿提神。兩人都靠著這股苦讀的毅力，後來學問大有成就。","meaning":"形容人讀書非常刻苦、發憤用功。","example":"他抱著懸梁刺股的決心準備考試，一有空就複習功課。","quiz":{"q":"「懸梁刺股」是用來形容什麼？","options":["讀書非常刻苦用功","很會綁頭髮的技巧","喜歡熬夜玩到很晚"],"answer":0,"explain":"孫敬懸梁、蘇秦刺股都是為了提神苦讀，所以這句話形容讀書刻苦發憤。"}},{"idiom":"洛陽紙貴","story":"西晉有位文學家左思，花了很多年心血，寫成一篇很長的文章《三都賦》。文章寫得太精彩了，大家看了都爭著抄寫回家收藏。由於抄的人實在太多，京城洛陽的紙一下子供不應求，連紙的價錢都跟著漲了起來。","meaning":"形容作品非常受歡迎、廣為流傳。","example":"這本新出的故事書大受歡迎，簡直有洛陽紙貴的氣勢。","quiz":{"q":"洛陽的紙為什麼會變貴？","options":["因為紙突然變得很難製造","因為大家爭著抄寫左思的好文章","因為皇帝下令不准賣紙"],"answer":1,"explain":"左思的文章大受歡迎，抄寫的人太多才使紙價上漲，所以比喻作品廣受歡迎、流傳很廣。"}},{"idiom":"樂不思蜀","story":"三國時，蜀國滅亡後，後主劉禪被帶到魏國居住。有一次，掌權的司馬昭在宴會上特地表演蜀國的歌舞，想看看他的反應。旁人都替劉禪傷心，他卻看得很開心，還說：「在這裡很快樂，我一點也不想念蜀國。」大家聽了都覺得他忘了自己的家鄉。","meaning":"形容在新環境過得太開心，反而忘了本來的地方或責任。","example":"去外婆家玩得樂不思蜀，差點忘了作業還沒寫完。","quiz":{"q":"劉禪說「不想念蜀國」，讓「樂不思蜀」用來比喻什麼？","options":["很想念自己的家鄉","玩得太開心而忘了原來的地方","很會安排旅遊行程"],"answer":1,"explain":"劉禪在魏國過得開心而不思念故國，所以這句話比喻樂在其中、忘了本來的地方。"}},{"idiom":"毛遂自薦","story":"戰國時，趙國的平原君要到楚國去談重要的事，想挑選有本事的門客一同前往。名單快湊齊時，一位平時不太起眼的門客毛遂，主動站出來推薦自己一起去。到了楚國，正是毛遂勇敢又有見識地說服了楚王，讓這次任務順利成功。","meaning":"指主動推薦自己去承擔任務或工作。","example":"班上要選演講代表，我鼓起勇氣毛遂自薦。","quiz":{"q":"「毛遂自薦」是指一個人怎麼做？","options":["請別人幫忙推薦自己","主動站出來推薦自己去做事","推辭不肯接下任務"],"answer":1,"explain":"毛遂主動推薦自己隨平原君出使，所以這句話指自告奮勇、主動推薦自己。"}},{"idiom":"司馬光砸缸","story":"宋朝的司馬光七歲時，和一群小朋友在庭院裡玩耍。有個孩子爬上大水缸，一不小心跌了進去，眼看就要滅頂。其他孩子都嚇得跑開去找大人，只有司馬光冷靜地搬起一塊大石頭，用力把水缸砸破。缸裡的水嘩啦流了出來，那個孩子就這樣得救了。","meaning":"形容遇到危急的事情能沉著冷靜、想出好辦法解決問題。","example":"妹妹的氣球卡在樹上大哭，哥哥卻像司馬光砸缸一樣，冷靜地拿竹竿把氣球勾了下來。","quiz":{"q":"司馬光砸缸這個故事，最想稱讚司馬光哪一點？","options":["遇到危急時能冷靜想辦法救人","力氣比其他小朋友大很多","很會爬到高高的水缸上玩"],"answer":0,"explain":"故事重點是別人都慌張跑開，只有司馬光沉著地砸缸放水救出同伴，讚美他臨危不亂、機智救人。"}},{"idiom":"孔融讓梨","story":"東漢的孔融四歲時，家裡拿出一盤梨子分給兄弟們吃。孔融主動挑了一顆最小的梨，把大的都留給哥哥們。大人好奇地問他為什麼，孔融回答：「我年紀小，應該吃小的，大的留給哥哥。」全家人都稱讚他懂得謙讓。","meaning":"比喻懂得謙讓、先為別人著想的好品德。","example":"分蛋糕時，弟弟學孔融讓梨，把最大塊留給奶奶，自己拿了小的一塊。","quiz":{"q":"孔融為什麼挑最小的梨？","options":["因為他不喜歡吃梨子","因為他懂得謙讓，把大的留給哥哥","因為小的梨比較甜"],"answer":1,"explain":"孔融說自己年紀小該吃小的，把大梨留給哥哥，表現的是謙讓與為別人著想，並不是不愛吃或挑甜的。"}},{"idiom":"曹沖稱象","story":"三國時，有人送給曹操一頭大象，曹操很想知道牠有多重，可是沒有那麼大的秤。大臣們都想不出辦法，年幼的曹沖卻說：「把大象牽到船上，在水面到達的地方刻下記號。」接著再把大象牽下船，往船裡裝石頭，直到船沉到同樣的記號。最後一稱這些石頭的重量，就知道大象有多重了。","meaning":"比喻遇到難題時能動腦筋，用巧妙的方法解決。","example":"沒有磅秤量小狗，姊姊用曹沖稱象的巧思，先抱著狗站上體重計，再減掉自己的體重。","quiz":{"q":"曹沖是用什麼方法量出大象的重量？","options":["找了一個超級大的秤直接稱大象","用船和石頭，換算出和大象一樣重的石頭再稱","數大象吃了多少草來推算"],"answer":1,"explain":"曹沖先讓大象上船刻水位，再裝石頭到同樣水位，稱石頭就等於稱大象，靠的是聰明的替換方法。"}},{"idiom":"鐵杵磨針","story":"相傳李白小時候不喜歡讀書，常常半途就想溜出去玩。有一天他在溪邊，看見一位老婆婆拿著一根粗鐵棒在石頭上磨。李白覺得奇怪，一問才知道老婆婆想把鐵棒磨成一根繡花針。老婆婆說：「只要功夫深，鐵杵也能磨成針。」李白聽了很慚愧，從此發憤用功，終於成為大詩人。","meaning":"比喻只要有恆心、肯下功夫，再難的事也能做成。","example":"學鋼琴很枯燥，老師鼓勵我：只要有鐵杵磨針的毅力，每天練一點，總有一天能彈得很好。","quiz":{"q":"「鐵杵磨針」這個故事告訴我們什麼道理？","options":["做事要靠運氣才會成功","只要有恆心、肯下功夫，難事也能做成","遇到困難就該趕快放棄換別的"],"answer":1,"explain":"老婆婆用磨鐵棒的耐心點醒李白，說明持之以恆、肯花功夫才能成功，而不是靠運氣或半途放棄。"}},{"idiom":"程門立雪","story":"宋朝的楊時和游酢一起去拜見有名的老師程頤請教學問。到了門口，正好遇上程頤閉著眼睛在休息。兩人不敢打擾，就恭恭敬敬地站在門外等候。等程頤睜開眼睛時，門外的雪已經積了一尺深，兩人卻一直安靜地站著。","meaning":"比喻求學誠心，非常尊敬老師。","example":"他為了等老師改完作業當面請教，在辦公室外靜靜站著，真有幾分程門立雪的精神。","quiz":{"q":"楊時和游酢為什麼站在雪中等候？","options":["因為忘了帶鑰匙進不了門","因為不敢打擾休息的老師，恭敬地等候","因為想在雪地裡玩耍"],"answer":1,"explain":"兩人見老師閉目休息，怕打擾便在門外恭敬等候，直到雪積一尺仍不離開，表現的是尊師與求學的誠心。"}},{"idiom":"韋編三絕","story":"孔子到了晚年非常喜歡研讀《易經》。那時的書是用皮繩把一片片竹簡串起來的。孔子反覆翻讀，讀了一遍又一遍，串竹簡的皮繩竟然被翻斷了好幾次。人們用這件事來形容他讀書的勤奮認真。","meaning":"形容讀書非常勤奮、反覆研讀。","example":"為了把這本科學書讀懂，哥哥韋編三絕地翻了一次又一次，書角都翻得起毛了。","quiz":{"q":"「韋編三絕」中被翻斷好幾次的是什麼？","options":["竹簡上的字跡","串連竹簡的皮繩","孔子用的毛筆"],"answer":1,"explain":"古書用皮繩（韋）串竹簡，孔子反覆研讀《易經》把皮繩翻斷多次，用來形容讀書勤奮，斷的是繩子而非字或筆。"}},{"idiom":"專心致志","story":"古時候有位下棋高手叫弈秋，他同時教兩個學生下棋。一個學生專心一意地聽講、認真學習；另一個雖然也在聽，心裡卻一直想著要拉弓去射天上的天鵝。結果兩人一起學，後者卻怎麼也比不上前者。孟子用這個故事說明：學不好不是因為笨，而是不夠專心。","meaning":"形容把心思完全集中在一件事情上，非常專注。","example":"考試時我專心致志地作答，連窗外的鳥叫聲都沒聽見。","quiz":{"q":"兩個學生一起跟弈秋學棋，為什麼結果不同？","options":["一個天生比較聰明","一個專心學習，另一個卻分心想著射鳥","老師偏心只教其中一個"],"answer":1,"explain":"孟子指出兩人並非聰明才智不同，而是一個專心致志、一個分心想射天鵝，說明專注才學得好。"}},{"idiom":"高山流水","story":"春秋時，伯牙很會彈琴，鍾子期很會聽琴。伯牙彈奏心裡想著高山，子期就讚嘆：「彈得真好，像巍峨的高山！」伯牙想著流水，子期又說：「像浩蕩的江河！」伯牙心裡想什麼，子期都聽得出來。兩人因此成了最了解彼此的好朋友。","meaning":"比喻真正了解自己的知心朋友，也用來形容樂曲高妙。","example":"我一哼旋律，好朋友就猜中我在想哪首歌，我們簡直是高山流水的知音。","quiz":{"q":"「高山流水」這個成語主要用來比喻什麼？","options":["真正懂自己的知心朋友","住在高山旁邊的人家","很會游泳的本領"],"answer":0,"explain":"伯牙彈琴、子期都能聽懂他的心意，故事流傳為「知音」，因此高山流水比喻互相了解的知心朋友。"}},{"idiom":"班門弄斧","story":"魯班是古代最有名的木匠，技術高超，人人佩服。後來有人比喻：如果在魯班的家門前揮舞斧頭、賣弄砍木頭的本領，那就太不自量力了。因為在真正的行家面前炫耀，只會顯得自己可笑。人們就用「班門弄斧」來形容這種情形。","meaning":"比喻在內行人或高手面前賣弄本領，不自量力。","example":"在圍棋冠軍面前大談棋招，我這才發現自己根本是班門弄斧。","quiz":{"q":"「班門弄斧」是在提醒我們什麼？","options":["要多向木匠魯班學砍木頭","不要在真正的行家面前逞能賣弄","斧頭要收好以免受傷"],"answer":1,"explain":"在木匠祖師魯班門前耍斧頭，比喻在高手面前炫耀本領、不自量力，重點是提醒別逞能賣弄，不是學砍木頭或收工具。"}},{"idiom":"名落孫山","story":"宋朝有個叫孫山的人去參加考試，放榜時他考中了，但名字排在最後一名。和他同行的同鄉之子卻沒有考上。孫山先回到家鄉，那位同鄉問他自己的兒子考中沒有，孫山委婉地說：「榜上最後一名是孫山，令郎的名字還在孫山的後面呢。」意思是那孩子並沒有考上。","meaning":"指考試或選拔沒有被錄取、落榜。","example":"這次歌唱比賽我名落孫山，不過我打算明年再來挑戰一次。","quiz":{"q":"「名落孫山」是什麼意思？","options":["考試考了第一名","考試或選拔沒被錄取、落榜","名字取得和孫山一樣"],"answer":1,"explain":"孫山是榜上最後一名，別人的名字排在他後面就是沒上榜，所以這句成語指落榜、沒被錄取。"}},{"idiom":"聞過則喜","story":"孔子的學生子路，是個很虛心的人。只要有人指出他的過錯，他不但不生氣，反而覺得高興。因為他明白，別人願意告訴自己的缺點，正好幫助他改正、變得更好。孟子稱讚子路這種態度，用「聞過則喜」來形容他。","meaning":"指聽到別人指出自己的過錯，不但不生氣，反而樂於接受並改正。","example":"老師糾正我的握筆姿勢，我聞過則喜地趕快改過來，字果然更漂亮了。","quiz":{"q":"「聞過則喜」的人聽到別人指出缺點時，會怎麼做？","options":["生氣地和對方吵架","高興地接受並願意改正","假裝沒聽見繼續照舊"],"answer":1,"explain":"子路聽到別人說自己的過錯反而高興，因為能藉此改正變好，所以聞過則喜是樂於接受批評、願意改進。"}},{"idiom":"對症下藥","story":"名醫華佗替兩位大人看病，他們都說頭痛又發熱。華佗卻開了不一樣的藥：一位要吃瀉藥、一位要發汗。旁人很疑惑，華佗說：一位是身體內部積了熱，一位是外表受了寒，病因不同，用藥當然也要不同。兩人照著吃，果然都好了。","meaning":"針對問題真正的原因，採取最合適的辦法去解決。","example":"我數學考不好是因為粗心，老師要我每題都檢查，真是對症下藥。","quiz":{"q":"「對症下藥」提醒我們解決問題時要怎麼做？","options":["先找出真正的原因，再想辦法","隨便試試看哪種方法","照抄別人一樣的做法"],"answer":0,"explain":"華佗依照不同的病因開不同的藥，說明要先了解真正原因，才能有效解決問題。"}},{"idiom":"諱疾忌醫","story":"名醫扁鵲見到蔡桓公，說他皮膚有點小毛病，最好早點醫治。桓公不理會，還說扁鵲愛誇大。過了幾天，扁鵲又提醒病情加深了，桓公仍不肯就醫。就這樣一次次拖延，等到病重才後悔，卻已經來不及了。","meaning":"隱瞞自己的缺點或問題，不肯面對，也不願意改正。","example":"作業寫錯不敢問老師，就像諱疾忌醫，錯的地方永遠學不會。","quiz":{"q":"蔡桓公的故事主要告訴我們什麼道理？","options":["有問題要及早面對，不要隱瞞拖延","生病其實不用看醫生","別人的建議都不必聽"],"answer":0,"explain":"桓公不肯面對小毛病、一路拖到嚴重，正是「諱疾忌醫」要我們避免的態度。"}},{"idiom":"病入膏肓","story":"晉景公病得很重，夢見疾病變成兩個小孩。一個說：「名醫快來了，我們躲到膏和肓之間吧，那裡藥力到不了。」不久名醫來了，看過之後說：這病躲在膏之下、肓之上，藥力實在到不了，沒辦法醫治。景公佩服醫生的誠實，也只能嘆息。","meaning":"比喻病情嚴重到無法醫治，也指事情壞到很難挽救的地步。","example":"這台老電風扇零件全壞光了，簡直病入膏肓，只好換一台新的。","quiz":{"q":"「病入膏肓」通常用來形容什麼？","options":["情況嚴重到很難挽回","小感冒很快就會好","醫生的醫術非常高明"],"answer":0,"explain":"病躲在藥力到不了的膏肓之間，因此比喻情況嚴重、難以挽回。"}},{"idiom":"起死回生","story":"扁鵲路過虢國，聽說太子突然昏死過去，宮裡正準備下葬。扁鵲覺得可疑，仔細診察後說：太子只是氣血一時堵住，像睡著了一樣，還有救！他用針灸和湯藥治療，不久太子果然醒了過來。大家都說扁鵲有起死回生的本事，扁鵲卻謙虛地說：我只是把還沒真正離開的人喚醒罷了。","meaning":"形容醫術高明，能救回垂危的人；也比喻把幾乎沒希望的事情挽救回來。","example":"教練的一句鼓勵，讓落後的球隊起死回生，最後反敗為勝。","quiz":{"q":"扁鵲救活虢太子後，為什麼還很謙虛？","options":["因為太子本來就沒真正死去，只是昏迷","因為他其實沒有醫好太子","因為他不想被人感謝"],"answer":0,"explain":"扁鵲說太子只是氣血堵住而昏迷、並非真死，所以謙虛地說自己只是喚醒病人。"}},{"idiom":"一鼓作氣","story":"齊國大軍來攻打魯國，魯莊公帶兵在長勺迎戰。齊軍擂鼓進攻，莊公想立刻反擊，隨行的曹劌卻說先別急。等齊軍擂完第三通鼓，士氣鬆懈了，曹劌才說：現在出擊！魯軍果然大勝。曹劌解釋：打仗靠士氣，第一通鼓士氣最旺，到第三通鼓就洩光了。","meaning":"趁著一開始最有精神、最有幹勁的時候，一口氣把事情完成。","example":"大掃除時我們一鼓作氣，半小時就把教室整理得乾乾淨淨。","quiz":{"q":"曹劌為什麼要等齊軍擂完第三通鼓才進攻？","options":["因為敵人擂到第三通鼓時士氣已經洩光","因為第三通鼓的聲音最大","因為魯軍的人比較多"],"answer":0,"explain":"曹劌指出士氣在第一通鼓最旺、第三通鼓已耗盡，所以趁敵人氣勢洩光時才出擊。"}},{"idiom":"退避三舍","story":"晉國公子重耳流亡到楚國，楚王熱情招待他。楚王問：將來你回國當了國君，要怎麼報答我？重耳說：若有一天兩國不得已交戰，我一定先退避三舍（後退九十里）來報答今天的恩情。後來重耳成了晉文公，兩軍真的相遇，他果然依約先退兵九十里，展現守信重諾。","meaning":"主動退讓、避開衝突，也比喻對人讓步、不與人相爭。","example":"弟弟又在鬧脾氣，我決定退避三舍，等他冷靜下來再說。","quiz":{"q":"晉文公「退避三舍」主要展現了什麼？","options":["遵守當年許下的承諾","害怕得不敢打仗","想偷偷逃跑"],"answer":0,"explain":"重耳當年答應交戰就先退九十里，後來果然守約退兵，展現的是守信重諾。"}},{"idiom":"多多益善","story":"漢高祖劉邦問大將韓信：你看我能帶多少兵？韓信說：陛下最多帶十萬。劉邦又問：那你呢？韓信說：我帶兵是越多越好。劉邦笑著問：那你怎麼還被我管住了？韓信答：陛下不擅長帶兵，卻擅長帶將，這就是我不如您的地方。","meaning":"形容數量越多越好。","example":"好書當然是多多益善，圖書館的書我都想借回家慢慢看。","quiz":{"q":"韓信說自己帶兵「多多益善」是什麼意思？","options":["兵越多，他越能指揮得好","兵越少他越輕鬆","他其實不喜歡帶兵"],"answer":0,"explain":"韓信是說自己帶的兵越多，越能發揮實力，所以叫「多多益善」。"}},{"idiom":"一飯千金","story":"韓信年輕時很窮，常常餓肚子。有位在河邊洗衣服的老婆婆看他可憐，就把自己的飯分給他吃，一連好多天。韓信很感動，說將來一定重重報答。後來韓信立了大功、當上大官，特地找到那位好心的漂母，送她千金來道謝。","meaning":"受人一點恩惠，日後加倍報答；比喻知恩圖報。","example":"生病時同學幫我補課，我一直記得這份恩情，想著將來要一飯千金地回報。","quiz":{"q":"「一飯千金」這個成語主要在讚美什麼？","options":["受人恩惠、懂得感恩報答","很會賺很多錢","喜歡請別人吃飯"],"answer":0,"explain":"韓信對當年一頓飯的恩情念念不忘，後來以千金相報，說明的是知恩圖報。"}},{"idiom":"刮目相看","story":"三國時，吳國大將呂蒙原本不愛讀書。孫權勸他：你現在掌管大事，應該多讀點書。呂蒙聽了，開始努力用功。過些日子，謀士魯肅和他談論國事，發現呂蒙見識大增，驚訝地說：你已經不是從前那個呂蒙了！呂蒙笑著回答：讀書人分別幾天，就該用新眼光來看待啊。","meaning":"用新的眼光看待進步很大的人，不再用舊印象看他。","example":"他這學期認真練習，進步神速，讓大家對他刮目相看。","quiz":{"q":"「刮目相看」是在提醒我們什麼？","options":["別人進步了，就要用新眼光看待他","永遠記得別人的缺點","不必理會別人的改變"],"answer":0,"explain":"呂蒙努力後見識大增，魯肅用新眼光看他，說明人進步了就該重新看待。"}},{"idiom":"手不釋卷","story":"孫權勸呂蒙讀書時，舉了一個例子：東漢的光武帝劉秀，即使在帶兵打仗、軍務繁忙的日子裡，手裡也總是拿著書卷捨不得放下。孫權說，連這麼忙的人都能堅持讀書，你怎麼能說沒空呢？呂蒙聽了很慚愧，從此發奮用功。","meaning":"手裡總是拿著書，形容勤奮好學、非常愛讀書。","example":"哥哥一有空就看書，連排隊的時候也手不釋卷。","quiz":{"q":"「手不釋卷」是用來形容一個人怎麼樣？","options":["非常勤奮、愛讀書","手受傷不能動","喜歡收藏書卻都不看"],"answer":0,"explain":"光武帝再忙也拿著書卷不放，所以「手不釋卷」用來形容勤奮好學。"}},{"idiom":"望洋興嘆","story":"秋天河水暴漲，黃河的河神河伯看著寬闊的河面，得意地以為天下最壯觀的水就是自己。他順著水流來到北海，一看竟然望不到邊際，這才驚覺大海比自己大得太多了。河伯抬頭望著浩瀚的大海，慚愧地嘆了口氣，明白自己見識實在太淺。","meaning":"面對偉大的事物，因自己渺小或力量不足而感到無可奈何、發出感嘆。","example":"看到高年級同學的畫作那麼厲害，我只能望洋興嘆，決定好好練習。","quiz":{"q":"河伯看到大海之後為什麼嘆氣？","options":["發現大海遠比自己大，覺得自己見識太淺","因為海水太鹹不能喝","因為找不到回家的路"],"answer":0,"explain":"河伯見到浩瀚大海，才知道自己其實很渺小，因而慚愧地嘆息。"}},{"idiom":"投筆從戎","story":"東漢的班超，家裡貧窮，靠替官府抄寫書冊賺錢養家。有一天，他抄著抄著，忍不住把筆一丟，感嘆說：大丈夫就算沒有別的本事，也該像傅介子、張騫那樣到邊疆立功，怎麼能一輩子埋在筆墨之間呢？後來他果然投身軍旅，出使西域，立下大功。","meaning":"指讀書人放下手中的筆去從軍報國，投身更遠大的志向。","example":"哥哥決定投筆從戎，報考軍校，想為保衛家園盡一份心力。","quiz":{"q":"「投筆從戎」原本說的是誰的故事？","options":["班超","王羲之","曹植"],"answer":0,"explain":"東漢的班超本來抄書維生，後來丟下筆從軍，出使西域立下大功。"}},{"idiom":"不入虎穴焉得虎子","story":"班超出使西域的鄯善國，起初國王待他們很客氣，後來卻忽然冷淡起來。班超猜到一定是匈奴的使者也來了，國王正猶豫該親近哪一方。他對同伴說：不進老虎的洞穴，怎麼捉得到小老虎？當晚便帶著勇士果斷行動，化解了危機，順利完成任務。","meaning":"比喻不肯冒險、不下決心深入，就得不到想要的成果。","example":"想弄懂這道難題，就得親自動手多試幾次，不入虎穴焉得虎子嘛！","quiz":{"q":"「不入虎穴，焉得虎子」是什麼意思？","options":["不肯冒險深入，就難以得到成果","老虎的洞穴裡一定有小老虎","遇到老虎要趕快逃走"],"answer":0,"explain":"這句話比喻不下決心深入嘗試，就得不到想要的成果。"}},{"idiom":"舉一反三","story":"孔子教學生時說過：如果我舉出一個角落，學生卻不能由此推想到其他三個角落，我就不再重複教他了。他希望學生能自己動腦，從一件事情去領悟其他相關的道理，而不是死背老師講過的話。","meaning":"指懂得從一件事情類推，明白許多相關的道理。","example":"老師教了一種算法，小明就能舉一反三，把類似的題目全都解出來。","quiz":{"q":"「舉一反三」這個成語出自誰的教學主張？","options":["孔子","孟子","老子"],"answer":0,"explain":"出自《論語》，孔子說「舉一隅不以三隅反，則不復也」。"}},{"idiom":"溫故知新","story":"孔子在《論語》裡說：溫習學過的舊知識，能從中體會出新的道理，這樣的人就可以當老師了。他認為學習不是把書讀過一次就算了，而是要常常回頭複習，每一次都會有新的收穫與理解。","meaning":"複習學過的舊知識，能從中得到新的體會。","example":"期末前我把整學期的筆記重看一遍，溫故知新，反而想通了以前不懂的地方。","quiz":{"q":"「溫故知新」告訴我們什麼道理？","options":["複習舊知識能得到新體會","讀書只要讀一遍就好","新知識一定比舊知識重要"],"answer":0,"explain":"孔子認為溫習舊學問能領悟新道理，所以要常常複習。"}},{"idiom":"開卷有益","story":"宋朝的太宗皇帝很愛讀書，他命人編成一部大書《太平御覽》，規定自己每天都要讀上幾卷。有人勸他別太勞累，他卻說：只要打開書本來讀，總會有收穫，我一點也不覺得累。","meaning":"只要翻開書本來閱讀，就會有好處、有收穫。","example":"媽媽常說開卷有益，鼓勵我多讀各種課外書。","quiz":{"q":"「開卷有益」的「卷」指的是什麼？","options":["書本","考卷","卷尺"],"answer":0,"explain":"「卷」在這裡指書本，整句是說翻開書閱讀就有好處。"}},{"idiom":"七步成詩","story":"三國時候，魏國的曹植很有文才。他的哥哥曹丕當了皇帝，想為難他，要他在走七步的時間內作出一首詩來。曹植邊走邊吟，用煮豆子時燃燒豆莖來比喻兄弟互相為難，詩句十分感人，大家聽了都很佩服他敏捷的才思。","meaning":"形容人文思敏捷，很快就能作出好文章。","example":"這位同學下筆飛快，簡直是七步成詩，一下子就寫好了作文。","quiz":{"q":"「七步成詩」形容一個人怎麼樣？","options":["文思敏捷，很快作出好詩文","走路走得特別快","喜歡一邊走路一邊念書"],"answer":0,"explain":"典故說曹植在七步之內就作出詩，用來形容才思敏捷。"}},{"idiom":"才高八斗","story":"南朝有位大詩人謝靈運，他很推崇三國的曹植。他曾經半開玩笑地說：天下的文才如果一共有一石（十斗），那麼曹植一個人就占了八斗，我自己得一斗，剩下的一斗才由天下人去分。後人就用「才高八斗」來稱讚很有才華的人。","meaning":"形容一個人文才極高、學問很好。","example":"大家都說這位作家才高八斗，寫的故事總是又動人又有深度。","quiz":{"q":"「才高八斗」裡，謝靈運說誰獨占了八斗之才？","options":["曹植","曹丕","謝靈運自己"],"answer":0,"explain":"謝靈運說天下之才共一石，曹植獨占八斗，可見他對曹植文才的推崇。"}},{"idiom":"江郎才盡","story":"南朝的江淹，年輕時文章寫得非常好，人人稱讚。傳說他晚年做了個夢，夢見一個人向他討回一枝五色筆。從那以後，他再提筆寫作，就再也寫不出從前那樣精采的句子了，人們便說他「江郎才盡」。","meaning":"比喻人的才思減退，再也寫不出好作品。","example":"他擔心自己江郎才盡，於是更努力讀書、留心生活，好讓靈感源源不絕。","quiz":{"q":"「江郎才盡」是用來形容什麼？","options":["才思減退，寫不出好作品","江邊的人很有才華","年紀輕輕就很有名"],"answer":0,"explain":"傳說江淹被討回五色筆後就失去文采，比喻才思枯竭。"}},{"idiom":"推敲","story":"唐朝詩人賈島騎著驢子作詩，想到一句「僧敲月下門」，卻拿不定該用「推」門好，還是「敲」門好，一路上比劃個不停，竟撞進了大官韓愈的隊伍。韓愈不但沒生氣，還替他想了想，說用「敲」字比較好。後人便用「推敲」來說反覆斟酌字句。","meaning":"比喻寫文章或做事時反覆思考、仔細斟酌。","example":"為了把這句話寫得更貼切，我推敲了好久，改了好幾次。","quiz":{"q":"「推敲」這個詞和誰斟酌用字的故事有關？","options":["賈島","李白","杜甫"],"answer":0,"explain":"唐代賈島為用「推」還是「敲」拿不定主意，經韓愈建議用「敲」，於是有了「推敲」。"}},{"idiom":"入木三分","story":"東晉的大書法家王羲之，寫字時特別用力、專注。有一次，工匠要把他寫在木板上的字重新雕刻，削木頭時發現他的墨跡竟然滲進木板裡足足三分深，大家都驚嘆他的筆力如此雄厚。","meaning":"原指書法筆力剛勁，後來也比喻見解、分析很深刻透徹。","example":"這篇評論把問題分析得入木三分，讓人看了頻頻點頭。","quiz":{"q":"「入木三分」最早是用來形容什麼？","options":["書法筆力雄厚","木匠手藝高超","樹木長得很高"],"answer":0,"explain":"典故說王羲之的墨跡滲進木板三分深，形容筆力剛勁，後來也比喻分析深刻。"}},{"idiom":"草船借箭","story":"三國時，周瑜要諸葛亮十天內造好十萬支箭，想藉機為難他。諸葛亮卻說只要三天，還準備了二十艘綁滿草人的船。趁著大霧的清晨，他把船開近曹操的水寨，擂鼓吶喊。曹操看不清虛實，怕有埋伏，只好下令放箭。箭全射在草人上，諸葛亮就這樣「借」到了滿滿十萬多支箭。","meaning":"比喻善用智慧和形勢，向對方巧妙取得自己需要的東西。","example":"這次報告我借用圖書館現成的資料來整理，簡直像草船借箭，省了好多力氣。","quiz":{"q":"諸葛亮是用什麼方法得到十萬支箭的？","options":["趁大霧開草船，讓曹軍把箭射在草人上","命工匠日夜趕工打造","向孫權的士兵一支一支借來"],"answer":0,"explain":"他利用大霧和曹操多疑的心理，讓對方放箭射滿草人，因而「借」到了箭。"}},{"idiom":"空城計","story":"三國時，諸葛亮駐守的城裡兵力很少，司馬懿卻帶著大軍逼近。諸葛亮不慌張，命人大開城門，自己坐在城樓上悠閒地彈琴。司馬懿看見城門洞開、諸葛亮神情自若，懷疑城裡藏有伏兵。他越想越不安，最後下令退兵。諸葛亮就靠著鎮定和膽識，化解了這場危機。","meaning":"比喻在空虛沒有實力時，故意保持鎮定，讓對方摸不清底細而不敢輕舉妄動。","example":"這局棋我其實快沒棋子了，卻故作鎮定、露出胸有成竹的樣子，對手摸不清我的底細，遲遲不敢進攻，我就這樣用空城計穩住了場面。","quiz":{"q":"諸葛亮面對司馬懿的大軍，做了什麼讓對方退兵？","options":["打開城門、鎮定彈琴，讓對方以為有埋伏","派出所有士兵正面迎戰","放火燒了自己的城"],"answer":0,"explain":"他故作鎮定，讓兵力空虛的城看起來深不可測，多疑的司馬懿怕中計就退兵了。"}},{"idiom":"圍魏救趙","story":"戰國時，魏國出兵攻打趙國，趙國向齊國求救。齊國大將田忌本想直接帶兵去趙國救援，軍師孫臏卻建議：不如趁魏國精兵在外，去攻打魏國的都城。魏軍聽說國都有危險，只好急忙從趙國撤兵回防。齊軍便在半路以逸待勞，打敗了疲累的魏軍。趙國的危機就這樣解除了。","meaning":"比喻不正面硬拚，而是攻擊對方的要害，來解除自己的困境。","example":"面對難纏的大題目，老師教我們用圍魏救趙的方法，先解開旁邊的小關鍵，大問題就跟著鬆動了。","quiz":{"q":"孫臏用什麼辦法解救被攻打的趙國？","options":["去攻打魏國的都城，逼魏軍撤回","派更多軍隊直接衝進趙國","和魏國講和送禮"],"answer":0,"explain":"攻打對方要害的都城，魏軍只好回防，趙國之圍自然就解除了。"}},{"idiom":"田忌賽馬","story":"戰國時，大將田忌常和齊王賽馬，卻總是輸。軍師孫臏發現雙方的馬都分上、中、下三等，實力其實差不多。他教田忌：先用下等馬去對齊王的上等馬，再用上等馬對中等馬、中等馬對下等馬。結果田忌雖然輸了第一場，卻連贏了後兩場。靠著聰明的安排，田忌反敗為勝。","meaning":"比喻善用策略，把有限的條件做最好的安排，以弱勝強。","example":"運動會拔河時，老師像田忌賽馬一樣調整同學上場的順序，讓我們班反敗為勝。","quiz":{"q":"孫臏教田忌怎麼賽馬才能贏？","options":["調整馬出場的順序，用下等馬輸一場、其餘以強對弱","把三匹馬都換成最好的","偷偷把對方的馬放走"],"answer":0,"explain":"他先用下等馬輸掉一場，再以上、中等馬贏另外兩場，靠安排反敗為勝。"}},{"idiom":"樂極生悲","story":"戰國時，齊威王愛喝酒作樂，常常通宵不停。有一次他問淳于髡能喝多少酒，淳于髡便藉機勸他：喝酒喝到極點就容易失態出事，快樂到了盡頭，往往接著就是悲傷。他提醒國君凡事都該有節制。齊威王聽了很受用，從此不再徹夜飲酒作樂。","meaning":"快樂到了極點，往往轉而發生悲傷或不好的事；提醒人凡事要懂得節制。","example":"慶生會上大家玩得太瘋，結果打翻了蛋糕、弄髒了地板，真是樂極生悲。","quiz":{"q":"「樂極生悲」提醒我們什麼？","options":["快樂到極點容易樂昏頭，凡事要有節制","越快樂越好，不用停下來","悲傷的時候要假裝快樂"],"answer":0,"explain":"淳于髡藉喝酒勸齊王：樂到盡頭常轉為悲，做事要懂得節制。"}},{"idiom":"一箭雙鵰","story":"南北朝時，有位神射手叫長孫晟。有一次他出使塞外，看見兩隻鵰在空中爭搶一塊肉。旁人遞給他兩支箭，要他把鵰射下來。長孫晟卻只取一支箭，瞄準飛近的兩隻鵰，一箭就把牠們一起射了下來。大家都佩服他高超的箭法。","meaning":"比喻做一件事就同時達到兩個目的。","example":"我每天走路上學，既能運動又能省下車錢，真是一箭雙鵰。","quiz":{"q":"長孫晟「一箭雙鵰」指的是什麼？","options":["用一支箭同時射下兩隻鵰","射了兩箭才射中一隻","養了兩隻鵰當寵物"],"answer":0,"explain":"他一箭射下正在爭食的兩隻鵰，後來就用來比喻一舉兩得。"}},{"idiom":"畫餅充飢","story":"三國時，魏明帝要選拔官員，交代大臣盧毓：挑人不要只看名聲。他說：名聲就像在地上畫一塊餅，看起來好看，卻不能真的拿來吃、填飽肚子。盧毓便建議，應該用實際的考核來檢驗一個人。後來人們就用「畫餅充飢」比喻用空想安慰自己。","meaning":"比喻用空想或虛名來安慰自己，卻不能解決實際的問題。","example":"光是幻想考一百分卻不肯讀書，只是畫餅充飢，成績不會自己變好。","quiz":{"q":"「畫餅充飢」是什麼意思？","options":["用空想安慰自己，卻不能真正解決問題","畫畫來當點心吃","肚子餓了就去買餅"],"answer":0,"explain":"畫在地上的餅再好看也不能吃，比喻空想填不飽肚子，解決不了實際問題。"}},{"idiom":"杯水車薪","story":"孟子曾說：講仁德的人如果做得不夠，就好像用一杯水，去救一整車柴燒起來的大火。火勢那麼旺，一杯水根本澆不熄。等到火沒滅，有人就說仁德沒有用。孟子藉此提醒：不是仁德沒用，而是做得太少、力量不足。","meaning":"比喻力量太小，對事情起不了作用，無濟於事。","example":"教室這麼亂，我一個人撿垃圾根本是杯水車薪，得大家一起整理才行。","quiz":{"q":"孟子用「一杯水救一車柴的火」比喻什麼？","options":["力量太小，起不了作用","水和火不能相容","救火最好用一杯水"],"answer":0,"explain":"一杯水澆不熄一整車柴的大火，比喻力量太小、無濟於事。"}},{"idiom":"一暴十寒","story":"孟子曾用種植來比喻做事的道理。他說：就算是天下最容易生長的植物，如果曬牠一天，卻又凍牠十天，也不可能長得好。做學問也是一樣，用功一下下，卻荒廢好久，怎麼會有成果呢？他藉此勸人做事要持之以恆。","meaning":"比喻學習或做事不能持久，時勤時懶，就不會有成就。","example":"學鋼琴不能一暴十寒，練一天就休息十天，這樣一定學不好。","quiz":{"q":"「一暴十寒」形容哪一種學習態度？","options":["用功一下就荒廢很久，不能持久","每天都很努力用功","只在天冷的時候讀書"],"answer":0,"explain":"曬一天卻凍十天，植物長不好；比喻做事時勤時懶，難有成就。"}},{"idiom":"螳臂當車","story":"有一次，齊莊公坐車出遊，看見路上有隻螳螂舉起前腳，想擋住前進的車輪。齊莊公問車夫那是什麼蟲，車夫說：這隻蟲只知道前進、不知道後退，才敢用手臂去擋車子。齊莊公感嘆牠不自量力，卻也佩服牠的勇氣，便下令繞道避開牠。後來人們就用這故事比喻不衡量自己的力量。","meaning":"比喻不自量力，妄想抵擋強大的力量，結果必然失敗。","example":"想只靠一個晚上就讀完整學期的課本，簡直是螳臂當車，怎麼可能做得到。","quiz":{"q":"「螳臂當車」比喻什麼樣的行為？","options":["不衡量自己的力量，妄想抵擋強大的力量","螳螂很會開車","勇敢面對困難就一定會成功"],"answer":0,"explain":"螳螂舉起手臂擋不住車輪，比喻不自量力；它強調的是「不自量力」，並非鼓勵盲目硬拚。"}},{"idiom":"水滴石穿","story":"宋朝有位縣令叫張乖崖。有一天他看見一個管倉庫的小吏，從庫房偷偷拿了一枚銅錢。小吏不服氣，說：不過一枚錢，有什麼大不了。張乖崖便說：一天一錢，一千天就是一千錢；繩子來回鋸，能把木頭鋸斷；水一滴一滴地滴，也能把石頭滴穿。他要人明白：小事日積月累，力量非常驚人。","meaning":"比喻力量雖小，只要持之以恆，就能做成看似困難的大事。","example":"每天背五個生字看起來不多，但水滴石穿，一年下來我的詞彙量增加了好多。","quiz":{"q":"張乖崖用「水滴石穿」想告訴小吏什麼道理？","options":["小事日積月累，力量會非常驚人","水很會滴水","石頭其實很軟"],"answer":0,"explain":"一天一錢、繩鋸木斷、水滴石穿，說明小事累積起來影響很大，也比喻持之以恆能成大事。"}},{"idiom":"兩袖清風","story":"明朝有位大臣于謙，為官非常清廉。當時官員進京述職，總會帶些絹帕、蘑菇之類的土產去送給權貴。于謙卻兩手空空，只帶著一身清風進京。他還寫詩說「兩袖清風朝天去」，表示自己做官清白，不貪一分一毫。","meaning":"形容做官清廉、不貪取財物，也比喻人身上一無所有。","example":"這位里長服務多年，兩袖清風，從不收居民一份紅包。","quiz":{"q":"「兩袖清風」用來形容一個人怎麼樣？","options":["為官清廉、不貪錢財","很會賺大錢、家財萬貫","做事拖拖拉拉不積極"],"answer":0,"explain":"這句成語出自于謙進京不帶禮物的故事，強調做官清廉、不貪一分一毫。"}},{"idiom":"鐵面無私","story":"宋朝的包拯，也就是大家熟知的包青天，在開封府當官時執法非常嚴明。不論對方是有錢有勢的權貴，還是自己的親戚，只要犯了法，他都照規矩處理，絕不講私情。當時的權貴、宦官因此都收斂了許多，百姓也十分信服他。","meaning":"形容公正嚴明，不講情面、不偏袒私人。","example":"班長登記秩序時鐵面無私，連好朋友違規也照樣記下來。","quiz":{"q":"包拯執法時，遇到犯了法的親戚會怎麼做？","options":["照樣依法處理，不偏袒","偷偷放過自己人","假裝沒看見就算了"],"answer":0,"explain":"包拯鐵面無私，就算是自己的親戚犯法，也一樣依規矩辦，不徇私情。"}},{"idiom":"汗馬功勞","story":"漢朝建立後，劉邦論功行賞，把在後方管糧草的蕭何列為功勞第一。許多身經百戰的武將不服氣，說自己攻城掠地、出生入死，蕭何憑什麼排在前面。劉邦回答：武將像追獵物的獵狗，蕭何卻是指揮打獵的人，他在後方運籌、供應糧草的功勞更大。眾人聽了才心服口服。（「汗馬」本指武將騎著戰馬奔馳作戰、累得馬都流汗的戰功；這裡劉邦認為蕭何在後方運籌的功勞，比武將的汗馬之勞更大。）","meaning":"「汗馬」是戰馬奔馳流汗，本指將士征戰沙場的戰功；後來「汗馬功勞」泛指在戰場上或工作中辛苦立下的重大功勞。","example":"這次園遊會能順利成功，幾位默默布置場地的同學立下了汗馬功勞。","quiz":{"q":"劉邦為什麼把管糧草的蕭何列為功勞第一？","options":["他認為後方供糧、運籌的功勞很大","因為蕭何是他的親戚","因為蕭何打仗最勇猛"],"answer":0,"explain":"劉邦用「功人、功狗」作比喻，肯定蕭何在後方支援全局的重大功勞。"}},{"idiom":"車水馬龍","story":"東漢明帝的馬皇后品德賢淑。有一次她提到外家親戚門前的景象：來往的車子多得像流水，馬匹連成一片像游動的龍。她覺得這樣的排場太過奢華，於是不肯答應皇帝給娘家人加官封賞。","meaning":"形容車馬來往不斷、熱鬧繁華的景象。","example":"週年慶時，百貨公司門口車水馬龍，人潮擠得水洩不通。","quiz":{"q":"「車水馬龍」原本是馬皇后用來形容什麼？","options":["車馬來往很多、非常熱鬧","馬兒在水裡游泳","龍在天上飛來飛去"],"answer":0,"explain":"「車如流水，馬如游龍」形容車馬絡繹不絕、十分熱鬧的景象。"}},{"idiom":"開誠布公","story":"三國時代，蜀漢丞相諸葛亮治理國家，總是用真誠的心對待別人，秉持公正的道理處理事情。他賞罰分明，即使是自己看重的人犯了錯也照樣處罰，有功勞的人就算是對頭也照樣獎賞。史學家陳壽因此稱讚他「開誠心，布公道」。","meaning":"指以誠懇、公正的態度待人處事，坦白無私。","example":"兩班為了球場的使用起了爭執，老師請雙方代表開誠布公地把想法說清楚。","quiz":{"q":"史書用「開誠心，布公道」稱讚諸葛亮，是說他？","options":["待人誠懇、處事公正","打仗特別厲害","家裡非常有錢"],"answer":0,"explain":"「開誠布公」出自對諸葛亮的評語，讚美他既誠懇又公正、坦白無私。"}},{"idiom":"一諾千金","story":"秦朝末年，楚地有位叫季布的人，非常重視自己的承諾，只要答應別人的事，就一定辦到。當時楚地流傳一句話：「得到黃金百斤，還不如得到季布的一句承諾。」大家都因為他守信用而敬重他。","meaning":"形容說話算話、承諾極有分量，非常守信用。","example":"他答應要幫同學複習功課，就一定準時出現，真是一諾千金。","quiz":{"q":"為什麼楚地的人說「得黃金百斤，不如得季布一諾」？","options":["因為季布很守信用，承諾一定辦到","因為季布非常有錢","因為季布會把石頭變成黃金"],"answer":0,"explain":"季布重視承諾，他的一句話比百斤黃金還可貴，這就是「一諾千金」。"}},{"idiom":"大器晚成","story":"三國時代，崔琰有個堂弟叫崔林，年輕時默默無聞、沒什麼成就，親戚們都看不起他。只有崔琰認為他不平凡，說：「才能越大的人，往往成就得越晚，崔林將來一定有大出息。」後來崔林果然做到很高的官職，證明了崔琰的眼光。","meaning":"比喻有大才能的人往往要經過長久磨練，較晚才成功。","example":"他起步比別人慢，但一直努力，老師相信他會大器晚成。","quiz":{"q":"崔琰說堂弟崔林是「大器晚成」，意思是？","options":["有大才能的人比較晚才成功","他永遠不會成功","他做事又慢又懶惰"],"answer":0,"explain":"「大器晚成」指才能大的人成就得比較晚，崔林後來果然當上大官。"}},{"idiom":"後生可畏","story":"孔子曾說：「年輕的後輩是值得敬重的，怎麼知道將來的人比不上現在的人呢？」他認為年輕人擁有無限的可能，只要肯努力學習，未來的成就未必輸給前輩。這句話後來就成了勉勵年輕人上進的名言。","meaning":"指年輕人潛力大、值得敬佩，將來的成就可能超越前輩。","example":"這場比賽的冠軍竟是三年級的小選手，真是後生可畏。","quiz":{"q":"孔子說「後生可畏」，是在表達什麼態度？","options":["敬重年輕人的潛力","害怕年輕人愛搗蛋","討厭年輕人不聽話"],"answer":0,"explain":"這裡的「畏」是敬重的意思，孔子看重年輕人的可能，相信他們將來或許超越前輩。"}},{"idiom":"按圖索驥","story":"春秋時代，相馬名家伯樂寫了一本《相馬經》，書上描述千里馬額頭高、眼睛亮等特徵。他的兒子讀了書，就照著書上寫的樣子到處找好馬。結果他捧回一隻癩蛤蟆，說牠的額頭和眼睛都符合書上寫的，只是蹄子不太對。伯樂聽了又好氣又好笑。","meaning":"比喻死板地照著線索或條文去找，不知變通；也指依照線索去尋找。","example":"他按圖索驥，照著地圖上的記號，一步步找到了藏在公園裡的寶物。","quiz":{"q":"伯樂的兒子照著《相馬經》去找馬，結果找回了什麼？","options":["一隻癩蛤蟆","一匹千里馬","一頭大水牛"],"answer":0,"explain":"他死板地照著書上的特徵找馬，竟把癩蛤蟆當成好馬，這就是「按圖索驥」不知變通。"}}];
(function(){
  'use strict';
  var PROG_KEY = 'idiom_stories_v1';
  function $(id){ return document.getElementById(id); }
  function loadProg(){ try{ return JSON.parse(localStorage.getItem(PROG_KEY)) || {done:{}}; }catch(e){ return {done:{}}; } }
  function saveProg(p){ try{ localStorage.setItem(PROG_KEY, JSON.stringify(p)); }catch(e){} }
  var prog = loadProg(); if(!prog.done) prog.done = {};

  function shuffleOptions(opts, seed){
    var arr = opts.map(function(o,i){ return {o:o,i:i}; });
    for(var k=arr.length-1;k>0;k--){ seed=(seed*9301+49297)%233280; var j=Math.floor(seed/233280*(k+1)); var t=arr[k];arr[k]=arr[j];arr[j]=t; }
    return arr;
  }

  function renderMenu(){
    var grid = $('idiom-grid'); grid.innerHTML='';
    var doneCount = 0;
    IDIOM_DATA.forEach(function(it, idx){
      var done = !!prog.done[it.idiom];
      if(done) doneCount++;
      var btn = document.createElement('button'); btn.type='button';
      btn.className='id-card ' + (done?'done':'is-todo');
      btn.innerHTML = '<span class="id-c-word">'+it.idiom+'</span>'+
        '<span class="id-c-state">'+(done?'✓ 讀過了':'看故事')+'</span>';
      btn.setAttribute('aria-label', it.idiom + (done?'（已讀過）':''));
      btn.addEventListener('click', function(){ openIdiom(idx); });
      grid.appendChild(btn);
    });
    $('id-count').textContent = '已讀 ' + doneCount + ' / ' + IDIOM_DATA.length;
  }

  var cur = null;
  function showScreen(name){
    $('screen-menu').classList.toggle('active', name==='menu');
    $('screen-play').classList.toggle('active', name==='play');
    try{ window.scrollTo(0,0); }catch(e){}
  }
  function openIdiom(idx){
    var it = IDIOM_DATA[idx]; if(!it) return;
    cur = { it:it, answered:false };
    $('play-title').textContent = '📖 ' + it.idiom;
    showScreen('play');
    renderStory();
  }
  function renderStory(){
    var it = cur.it;
    $('stage').innerHTML =
      '<div class="id-teach">' +
        '<h2>'+it.idiom+'</h2>' +
        '<div class="id-block story"><div class="id-block-label">📜 故事</div><div class="id-block-text">'+it.story+'</div></div>' +
        '<div class="id-block"><div class="id-block-label">💡 意思</div><div class="id-block-text">'+it.meaning+'</div></div>' +
        '<div class="id-block eg"><div class="id-block-label">✏️ 造句</div><div class="id-block-text">'+it.example+'</div></div>' +
        '<div class="id-actions"><button type="button" class="btn btn-primary" id="btn-startquiz">來試試看 ✏️</button></div>' +
      '</div>';
    $('btn-startquiz').addEventListener('click', renderQuiz);
  }
  function renderQuiz(){
    cur.answered=false;
    var q = cur.it.quiz;
    var shown = shuffleOptions(q.options, cur.it.idiom.length*13 + q.q.length);
    var optHtml = shown.map(function(x){ return '<button type="button" class="id-opt" data-orig="'+x.i+'">'+x.o+'</button>'; }).join('');
    $('stage').innerHTML =
      '<div class="id-teach">' +
        '<div class="id-q">小測驗：'+q.q+'</div>' +
        optHtml +
        '<div class="id-reveal" id="reveal"></div>' +
        '<div class="id-actions" id="q-actions" style="display:none"><button type="button" class="btn btn-primary" id="btn-done">讀完這個成語 🎉</button></div>' +
      '</div>';
    var opts = $('stage').querySelectorAll('.id-opt');
    Array.prototype.forEach.call(opts, function(btn){ btn.addEventListener('click', function(){ answer(btn, q, opts); }); });
  }
  function answer(btn, q, opts){
    if(cur.answered) return; cur.answered=true;
    var chosen = parseInt(btn.getAttribute('data-orig'),10);
    var correct = (chosen === q.answer);
    Array.prototype.forEach.call(opts, function(b){
      var oi = parseInt(b.getAttribute('data-orig'),10);
      if(oi===q.answer) b.classList.add('correct');
      else if(b===btn) b.classList.add('wrong');
      b.disabled = true;
    });
    var rev = $('reveal');
    rev.textContent = (correct ? '答對了！👍 ' : '沒關係～正確答案是這個喔！') + q.explain;
    rev.classList.add('show');
    $('q-actions').style.display='flex';
    $('btn-done').onclick = function(){ finishIdiom(); };
  }
  function finishIdiom(){
    prog.done[cur.it.idiom] = true; saveProg(prog);
    $('stage').innerHTML =
      '<div class="id-teach" style="text-align:center">' +
        '<div style="font-size:48px" aria-hidden="true">🎉</div>' +
        '<h2 style="letter-spacing:normal">讀完「'+cur.it.idiom+'」了！</h2>' +
        '<div class="id-block"><div class="id-block-text">你多學會了一個成語。以後說話、寫作文都可以用用看喔！</div></div>' +
        '<div class="id-actions"><button type="button" class="btn btn-primary" id="btn-tomenu">回成語選單</button></div>' +
      '</div>';
    $('btn-tomenu').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });
  }

  $('btn-back').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });
  renderMenu();
})();
</script>
