<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>學習地圖</title>
<!-- 全站共用設計語言（暖奶油白、眼科實證低眩光、日夜切換）；不自訂調色盤 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<!-- 逐單元學習進度（§6.3；獨立 key learning_progress_v1，只讀顯示，不寫 player_profile_v1） -->
<script src="assets/safe_store.js"></script>
<script src="assets/progkey_migration.data.js"></script>
<script src="assets/learning_progress.js"></script>
<style>
  /* 本頁版面：顏色一律取 app.css 房屋變數，不新增色票。以 iPad Air 13"（1366 寬）為基準，吃滿寬與高 */
  .lp-wrap{ max-width:none; margin:0 auto; padding:14px clamp(18px,3vw,48px) 36px; }
  .lp-intro{ margin:4px 0 14px; display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 20px; }
  .lp-intro h1{ font-size:22px; margin:0; color:var(--ink); }
  .lp-tot{ color:var(--ink-soft); font-size:13px; }
  .lp-tot b{ color:var(--c-primary-ink); font-size:15px; }
  /* 左島清單 + 右分區面板：填滿 app-bar 以下的高度 */
  .lp-layout{ display:grid; grid-template-columns:clamp(220px,19vw,290px) 1fr; gap:22px; align-items:stretch; }
  .lp-nav{ display:flex; flex-direction:column; gap:8px; position:sticky;
    top:calc(var(--app-bar-h,56px) + 12px); align-self:start; }
  .lp-navitem{ text-align:left; background:var(--card); color:var(--ink);
    border:1px solid var(--card-border); border-left:6px solid var(--a,var(--c-primary));
    border-radius:12px; padding:10px 12px; cursor:pointer; font:inherit;
    display:flex; flex-direction:column; gap:2px; transition:box-shadow .12s, background .12s; }
  .lp-navitem:hover{ box-shadow:var(--u-shadow-nav-hover); }
  .lp-navitem:focus-visible{ outline:3px solid var(--c-focus); outline-offset:2px; }
  .lp-navitem.active{ background:var(--card-border); box-shadow:var(--u-shadow-card-hover); }
  .lp-navitem .nm{ font-size:16px; font-weight:700; color:var(--aink,var(--ink)); }
  .lp-navitem .mt{ font-size:12px; color:var(--ink-soft); }
  /* 右面板 */
  .lp-panel{ min-height:calc(100vh - var(--app-bar-h,56px) - 120px); }
  .lp-panel-h{ display:flex; align-items:baseline; gap:12px; margin:2px 0 14px; }
  .lp-panel-h h2{ font-size:20px; margin:0; color:var(--ptitle,var(--ink)); }
  .lp-panel-h .sub{ color:var(--ink-soft); font-size:13px; }
  .lp-strandgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:14px; }
  .lp-scard{ background:var(--card); border:1px solid var(--card-border);
    border-top:4px solid var(--a,var(--c-primary)); border-radius:14px; padding:13px 15px;
    display:flex; flex-direction:column; gap:7px; box-shadow:var(--u-card-shadow); }
  .lp-scard .snm{ font-size:15px; font-weight:700; color:var(--ink); line-height:1.35;
    display:flex; align-items:baseline; gap:8px; }
  /* AC-A11Y-1：步驟號對比 ≥4.5:1（WCAG AA）。原白字 on 島 accent --a，淺島僅 1.51:1。
     改深字(--ink) on 「島 accent 22% 淺底」：深字 on 淺底通用達標、仍保留島色調（色仍由卡片 --a 邊框與此淺底呈現）。 */
  .lp-step{ flex:none; display:inline-flex; align-items:center; justify-content:center;
    min-width:22px; height:22px; padding:0 6px; border-radius:999px; font-size:12px; font-weight:700;
    background:color-mix(in srgb, var(--a,var(--c-primary)) 22%, var(--u-mix-lighten)); color:var(--ink); }
  .lp-seqnote{ color:var(--ink-soft); font-size:12.5px; margin:2px 0 0; }
  /* 島面板兩帶：📘 跟著學（編號路徑卡）＋ 🎯 練習與應用（不編號 area 卡） */
  .lp-band{ display:flex; align-items:baseline; gap:10px; margin:6px 0 10px; }
  .lp-band .bem{ font-size:18px; flex:none; } .lp-band .bnm{ font-size:16px; font-weight:800; color:var(--ink); }
  .lp-band .bmt{ font-size:12.5px; color:var(--ink-soft); }
  .lp-zone{ margin-top:24px; }
  a.lp-scard{ text-decoration:none; color:inherit; }
  a.lp-scard:hover{ box-shadow:var(--u-shadow-card-hover); }
  a.lp-scard:focus-visible{ outline:3px solid var(--c-focus); outline-offset:2px; }
  .lp-scard .lp-aem{ font-size:19px; margin-right:3px; }
  .lp-sdesc{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .lp-soonpin{ margin-left:auto; }
  .lp-tchip.area{ background:var(--tint-english); color:var(--c-english-ink); }
  .lp-tchip.soon{ background:var(--card-border); color:var(--ink-soft); }
  /* 大島分類別：在「跟著學」帶內把分區分成類別群（小標＋該群卡牆） */
  .lp-catsec{ margin-bottom:16px; }
  .lp-cath{ font-size:13.5px; font-weight:800; color:var(--ptitle,var(--ink));
    margin:14px 0 9px; display:flex; align-items:center; gap:7px; }
  .lp-scard .scount{ font-size:12px; color:var(--ink-soft); }
  .lp-tiers{ display:flex; flex-wrap:wrap; gap:6px; }
  .lp-tchip{ font-size:11.5px; padding:2px 8px; border-radius:999px;
    background:var(--card-border); color:var(--ink-soft); white-space:nowrap; }
  .lp-foot{ color:var(--ink-soft); font-size:12px; margin-top:24px;
    border-top:1px solid var(--card-border); padding-top:12px; }
  /* ── 分區（strand）→ 其單元清單：點「有單元」的分區卡＝純前端切右側 panel 成該分區「單元牆」
       （§6.1 逐層 drill-down；主視圖＝分區總覽，詳情＝滿版多欄單元牆；左 sidebar 不動；不開新頁、
        不 reload；R-OPEN 無鎖定）。分區卡＝可點 <button>（非 disabled）；單元卡＝深連到該單元頁。 */
  button.lp-scard{ text-align:left; font:inherit; width:100%; cursor:pointer; }
  button.lp-scard:hover{ box-shadow:var(--u-shadow-card-hover); }
  button.lp-scard:focus-visible{ outline:3px solid var(--c-focus); outline-offset:2px; }
  .lp-uhint{ font-size:12.5px; font-weight:700; color:var(--c-primary-ink,var(--ink-soft));
    display:flex; align-items:center; gap:6px; margin-top:1px; }
  .lp-caret{ display:inline-block; font-size:13px; transition:transform .12s; }
  button.lp-scard:hover .lp-caret{ transform:translateX(3px); }
  /* 詳情視圖頂部：返回鈕（≥44px tap、鍵盤可達、島色左條） */
  .lp-detail-h{ margin:2px 0 10px; }
  .lp-back{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:9px 16px;
    background:var(--card); color:var(--ink); border:1px solid var(--card-border);
    border-left:5px solid var(--a,var(--c-primary)); border-radius:11px; cursor:pointer;
    font:inherit; font-size:14.5px; font-weight:700; transition:box-shadow .12s, background .12s; }
  .lp-back:hover{ box-shadow:var(--u-shadow-card-hover); background:var(--card-border); }
  .lp-back:focus-visible{ outline:3px solid var(--c-focus); outline-offset:2px; }
  .lp-back .bk-ar{ font-size:17px; line-height:1; }
  /* 單元牆：滿版多欄 responsive grid，鋪滿整個右側內容區寬度（比照島總覽，不留窄欄/大空白） */
  .lp-unitwall{ grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); }
  a.lp-unitcard{ display:flex; flex-direction:column; gap:4px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--card-border);
    border-left:4px solid var(--a,var(--c-primary)); border-radius:12px;
    padding:13px 15px; min-height:44px; box-sizing:border-box;
    box-shadow:var(--u-card-shadow); transition:box-shadow .12s; }
  a.lp-unitcard:hover{ box-shadow:var(--u-shadow-card-hover); }
  a.lp-unitcard:focus-visible{ outline:3px solid var(--c-focus); outline-offset:2px; }
  .lp-utitle{ font-size:14.5px; font-weight:700; color:var(--ink); line-height:1.35; }
  .lp-ucan{ font-size:12.5px; color:var(--ink-soft); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .lp-umeta{ display:flex; gap:10px; flex-wrap:wrap; margin-top:1px; }
  .lp-umin{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
  @media (max-width:860px){
    .lp-layout{ grid-template-columns:1fr; }
    .lp-nav{ position:static; flex-direction:row; flex-wrap:wrap; }
    .lp-navitem{ flex:1 1 44%; }
  }
  /* ── 接回舊版遊戲 HUD：左欄 Profile 卡 + 底部徽章牆（唯讀顯示 game_core 狀態；R3 never-disappear）──
     .profile-*／.badge-*／.section-* 規則自 index.html 既有版面 verbatim 移植，維持同一設計語言。 */
  .lp-side{ display:flex; flex-direction:column; gap:14px; position:sticky;
    top:calc(var(--app-bar-h,56px) + 12px); align-self:start; }
  .lp-side .lp-nav{ position:static; align-self:stretch; }
  .profile-top { display:flex; align-items:center; gap:var(--s3); }
  .profile-avatar { font-size:30px; line-height:1; flex:none; }
  .profile-id { min-width:0; flex:1; }
  .profile-id .profile-name { display:flex; align-items:center; gap:var(--s2); }
  .profile-xp-wrap { display:flex; flex-direction:column; gap:4px; }
  .profile-xp-text { font-size:var(--fs-small); color:var(--ink-soft); font-weight:700; }
  .section-label { font-size:var(--fs-small); font-weight:800; color:var(--ink-soft); letter-spacing:1px; margin:var(--s2) 0 0; padding-left:var(--s1); }
  .section-note { font-size:12px; color:var(--ink-soft); font-weight:700; padding-left:var(--s1); margin-top:2px; }
  .badge-head { display:flex; align-items:baseline; justify-content:space-between; gap:var(--s2); flex-wrap:wrap; }
  .badge-count { font-size:var(--fs-small); font-weight:700; color:var(--ink-soft); }
  .badge-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:var(--s3); margin-top:var(--s3); }
  .badge-item { display:flex; flex-direction:column; align-items:center; text-align:center; gap:var(--s1);
    padding:var(--s3) var(--s2); background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-sm); }
  .badge-item .b-ico { font-size:30px; line-height:1.15; }
  .badge-item .b-name { font-size:var(--fs-small); font-weight:700; color:var(--ink); }
  .badge-item .b-desc { font-size:11px; color:var(--ink-soft); line-height:1.4; }
  .badge-item.is-earned { border-color:var(--c-coin); box-shadow:var(--shadow-sm); }
  .badge-item.is-locked { background:var(--bg); }
  .badge-item.is-locked .b-ico { filter:grayscale(1); opacity:0.5; }
  .badge-item .b-state { font-size:11px; font-weight:700; }
  .badge-item.is-earned .b-state { color:var(--c-finance-ink); }
  .badge-item.is-locked .b-state { color:var(--ink-soft); }
  @media (max-width:860px){ .lp-side{ position:static; } }
</style>
</head>
<body data-game-hud="native">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">學習地圖</span>
  <a class="app-bar__verswitch" href="index.html" title="切換回舊版學習基地">
    <span class="app-bar__verswitch-icon" aria-hidden="true">🏫</span><span>切換到舊版</span>
  </a>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="lp-wrap">
  <div class="lp-intro">
    <h1>學習地圖</h1>
    <span class="lp-tot" id="tot"></span>
  </div>
  <div class="lp-layout">
    <div class="lp-side">
      <!-- 左上角色 Profile 卡（唯讀顯示 game_core 狀態：頭像/暱稱/等級/經驗值進度條/火焰/金幣） -->
      <section class="profile-card lp-profile" aria-label="我的角色">
        <div class="profile-top">
          <span class="profile-avatar" id="pf-avatar" aria-hidden="true">🦊</span>
          <div class="profile-id">
            <div class="profile-name"><span id="pf-name">小小探險家</span></div>
            <div class="profile-level" id="pf-rank">🌱 探險新手 · 第 1 級</div>
          </div>
        </div>
        <div class="profile-xp-wrap">
          <div class="xp-bar" role="progressbar" aria-label="經驗值進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pf-xpbar">
            <div class="xp-fill" id="pf-xpfill"></div>
          </div>
          <span class="profile-xp-text" id="pf-xptext">距離下一級還差 0 點經驗值</span>
        </div>
        <div class="profile-chips">
          <span class="chip" id="pf-streak" title="連續學習天數">🔥 <span id="pf-streak-num">0</span> 天</span>
          <span class="chip chip-chinese" id="pf-coins" title="金幣：玩學習關卡賺到的點數">🪙 <span id="pf-coins-num">0</span></span>
        </div>
      </section>
      <nav class="lp-nav" id="nav" aria-label="學習島"></nav>
    </div>
    <section class="lp-panel" id="panel" aria-live="polite"></section>
  </div>
  <!-- 成就徽章牆：全部徽章（已解鎖＋未解鎖當目標）；唯讀 game_core.getBadgeWall() -->
  <section id="badge-wall" class="lp-badges" style="margin-top:24px">
    <div class="badge-head">
      <h2 class="section-label">🏅 我的成就徽章</h2>
      <span class="badge-count" id="badge-count">已收集 0 / 0</span>
    </div>
    <p class="section-note" style="margin-top:8px">每一個都是你努力的紀錄。還沒亮起來的是下一個小目標，別急，慢慢來就會收集到！</p>
    <div class="badge-grid" id="badge-grid" aria-label="成就徽章清單"></div>
  </section>
  <footer class="lp-foot" id="foot"></footer>
</main>

<script>
const TIER_ZH={t_base:"初階",t_mid:"中階",t_adv:"高階",t_sub:"銜接",t_enrich:"延伸"};
// 島 accent 一律取房屋科目色票（§5.6），不新增顏色
const ACCENT={
  chi:["var(--c-chinese)","var(--c-chinese-ink)"], eng:["var(--c-english)","var(--c-english-ink)"],
  math:["var(--c-math)","var(--c-math-ink)"], sci:["var(--c-primary)","var(--c-primary-ink)"],
  "soc-civ":["var(--c-social)","var(--c-social-ink)"], "soc-geo":["var(--c-finance)","var(--c-finance-ink)"],
  "soc-hist":["var(--c-coin)","var(--c-coin-ink)"], life:["var(--c-primary-soft)","var(--c-primary-ink)"]};
// 大島分類表：島 → [[emoji, 類別名, [分區 title_zh…]]]。有表的島在「跟著學」帶內分類別群；沒有的維持 flat。
const CATMAP={
  life:[
    ['🛡️','安全與自我保護',['安全綜合','身體界線','居家安全','人身安全','緊急應變','交通安全','網路霸凌防治','網路交友安全','菸酒毒品防制','詐騙辨識']],
    ['💗','情緒與人際',['人際關係','情緒調節','情緒覺察','成長型思維','同理與社會覺察']],
    ['🧠','學會如何學',['讀書方法','後設認知','記憶策略','目標與時間管理','專注力','學習習慣']],
    ['🤔','思考與推理',['決策思考','推理：演繹與歸納','事實與證據','批判與創意思考','認知偏誤','邏輯謬誤','邏輯推理','提問與判讀']],
    ['💰','理財素養',['認識金錢','儲蓄與消費','金錢價值觀','市場與供需','利息與複利','預算規劃','信用與保險']],
    ['📱','數位與資訊素養',['數位公民','媒體識讀','隱私與個資','電腦與資料','新聞識讀','資訊安全','訊息查證','AI 與演算法素養','網路原理']],
    ['💡','運算與創客思維',['運算思維','演算法思維','設計與創客思考','專題實作']],
    ['📊','數據與統計素養',['圖表判讀','誤導性統計圖表','統計概念']],
    ['🌍','公民與永續',['環保與減碳','公民行動','全球公民','永續發展目標 SDGs','科技與社會']],
    ['🌟','典範與啟發',['發明與科學進展','改變世界的人']],
  ],
  sci:[
    ['🔬','科學方法與探究',['科學探究']],
    ['⚛️','物理',{prefix:'物理：'}],
    ['🧪','化學',{prefix:'化學：'}],
    ['🧬','生物',{prefix:'生物：'}],
    ['🌏','地球科學',{prefix:'地球科學：'}],
  ],
};
let NAV=null, cur=null, UNITS={};
const TIER_ORDER={t_base:0,t_mid:1,t_adv:2,t_sub:3,t_enrich:4,t_beyond:5};
const esc=(s)=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function renderPanel(isl){
  const [fill,ink]=ACCENT[isl.island]||["var(--c-primary)","var(--c-primary-ink)"];
  const panel=document.getElementById('panel');
  panel.style.setProperty('--ptitle',ink);
  const us=(UNITS[isl.island]||[]);
  // 該分區（strand）對應的已建單元，依級別→unit_id 穩定排序（§6.7 units_index 彙總）
  const tierOf=(u)=>(u.unit_id||'').split('.')[1];
  // strand 牆只顯示 core track；speaking track（開口說情境單元）只在「練習與應用」的開口說頁顯示，
  // 不在 spec strand 分區重播（HD 2026-11-02：strand 牆不得重複開口說教材）。
  const unitsOf=(strand)=>us.filter(u=>u.strand===strand && u.track!=='speaking').slice()
    .sort((a,b)=>((TIER_ORDER[tierOf(a)]??9)-(TIER_ORDER[tierOf(b)]??9))||(a.unit_id||'').localeCompare(b.unit_id||''));
  // 單元卡＝<a href=該單元頁>：級別徽章（初階/中階/高階/延伸，由 unit_id 第 2 段推；R11 不顯年段）
  // ＋ title_zh ＋ can_do（截斷 2 行）＋ 預估分鐘。深連進單元頁。
  const tierLabel=(t)=>TIER_ZH[t]||t;
  const unitCard=(u)=>{
    const can=(u.can_do||'').trim();
    const mins=u.est_minutes?`<span class="lp-umin">⏱ 約 ${esc(u.est_minutes)} 分</span>`:'';
    const t=tierOf(u);
    // 延伸（選修）用 area chip 底色區隔；其餘用既有 lp-tchip（不私造樣式）
    const lvlCls=(t==='t_enrich'||t==='t_beyond')?'lp-tchip area':'lp-tchip';
    const lvl=t?`<span class="${lvlCls}">${esc(tierLabel(t))}</span>`:'';
    return `<a class="lp-unitcard" style="--a:${fill}" href="${esc(u.page)}">`+
      `<span class="lp-utitle">${esc(u.title_zh||u.unit_id)}</span>`+
      (can?`<span class="lp-ucan">${esc(can)}</span>`:'')+
      `<span class="lp-umeta">${lvl}${mins}</span></a>`;
  };
  // 一張分區／路徑卡（num 省略＝不編號）。若該分區有已建單元 → 做成可點 <button>（點擊＝純前端
  // 切右側 panel 成該分區「單元牆」，左 sidebar 不動、不開新頁、不 reload）；無單元則維持原資訊卡。
  const strandCard=(s,num,label)=>{
    const tiers=Object.entries(s.tiers).map(([t,n])=>`<span class="lp-tchip">${TIER_ZH[t]||t} ${n}</span>`).join('');
    const head=`<span class="snm">${num?`<span class="lp-step">${num}</span>`:''}${label||s.title_zh}</span>`+
      `<span class="scount">${s.min_count} 個必備知識點</span><span class="lp-tiers">${tiers}</span>`;
    const units=unitsOf(s.strand);
    if(!units.length) return `<div class="lp-scard" style="--a:${fill}">${head}</div>`;
    return `<button type="button" class="lp-scard lp-scard-link" style="--a:${fill}" data-strand="${esc(s.strand)}" data-label="${esc(label||s.title_zh)}"`+
      ` aria-label="${esc(label||s.title_zh)}：${units.length} 個單元，點擊看單元清單">`+
      `${head}<span class="lp-uhint">${units.length} 個單元 <span class="lp-caret" aria-hidden="true">→</span></span></button>`;
  };
  // 詳情視圖：整個右側 panel 換成該分區的滿版多欄單元牆（左 sidebar 不動）；頂部返回鈕回分區總覽。
  const renderStrandDetail=(s,label)=>{
    const units=unitsOf(s.strand);
    const backLabel=`返回 ${isl.title_zh} 分區總覽`;
    const back=`<div class="lp-panel-h lp-detail-h"><button type="button" class="lp-back" style="--a:${fill}"`+
      ` aria-label="${esc(backLabel)}"><span class="bk-ar" aria-hidden="true">←</span>返回 ${esc(isl.title_zh)}分區</button></div>`;
    const title=`<div class="lp-panel-h"><h2>${esc(label||s.title_zh)}</h2>`+
      `<span class="sub">${units.length} 個單元 · 必備 ${s.min_count} 個知識點</span></div>`;
    // 依級別分組（初階→中階→高階→銜接→延伸），每段小標題＋該級別單元牆；空級別不顯示。
    // progression 一眼可見；級別僅用難度詞（TIER_ZH），絕不出現年段（R11）。
    const groups=new Map();
    units.forEach(u=>{ const t=tierOf(u)||'_'; if(!groups.has(t)) groups.set(t,[]); groups.get(t).push(u); });
    const ordered=[...groups.keys()].sort((a,b)=>(TIER_ORDER[a]??9)-(TIER_ORDER[b]??9)||a.localeCompare(b));
    const body=ordered.map(t=>
      `<div class="lp-catsec"><h3 class="lp-cath">${esc(tierLabel(t))}`+
      `<span class="scount">（${groups.get(t).length} 個單元）</span></h3>`+
      `<div class="lp-strandgrid lp-unitwall">${groups.get(t).map(unitCard).join('')}</div></div>`).join('');
    panel.innerHTML=back+title+body;
    const bb=panel.querySelector('.lp-back');
    bb.addEventListener('click',()=>renderPanel(isl));
    bb.focus();
  };
  const isEng = isl.island==='eng';
  let gridHtml, zoneHtml='';
  if(isEng){
    // 編號學習路徑＝**純 spec strand 軸**（§6.1：島→subject→strand→unit，每單元單一 home）。
    // №1 自然發音 → №2 主題字彙 → №3 基本句型 →…（開口說不在此，移到下方「練習與應用」補充區）。
    const strands=isl.strands.slice().sort((a,b)=>(a.order||99)-(b.order||99));
    const phon=strands.find(s=>s.order===1);
    const rest=strands.filter(s=>s!==phon);
    const arr=[];
    if(phon) arr.push(strandCard(phon,1));
    rest.forEach(s=>arr.push(strandCard(s,s.order)));   // 用原 strand order（不偏移、不插入開口說）
    gridHtml=arr.join('');
    // 🎯 練習與應用（spec 外補充／cross-cut；不編號、不計入上方 strand 覆蓋）
    const area=(em,nm,desc,chips)=>`<div class="lp-scard" style="--a:${fill}"><span class="snm"><span class="lp-aem" aria-hidden="true">${em}</span>${nm}<span class="lp-tchip soon lp-soonpin">建置中</span></span>`+
      `<span class="lp-sdesc">${desc}</span><span class="lp-tiers">${chips}</span></div>`;
    // 開口說（情境會話）＝舊版 blueprint 移植、spec 外補充；cross-cut 重用上方 strand 單元、換情境角度練。
    // 放補充區、非 spec strand 軸卡，故不與上方編號分區競爭、不灌 strand 覆蓋數。
    const speak = us.length ? (`<a class="lp-scard" style="--a:${fill}" href="english_speaking.html" aria-label="開口說：10 大生活情境的情境會話練習（spec 外補充）">`+
      `<span class="snm"><span class="lp-aem" aria-hidden="true">🗣️</span>開口說（情境會話）</span>`+
      `<span class="lp-sdesc">真實生活 10 大情境的「能用的一句話」：先聽先感覺 → 練 → 跟讀模仿語調 → 自評（含情境聽寫）。舊版情境單元移植，屬 spec 外補充練習——換情境角度重練上面 strand 分區學過的句型與字彙。</span>`+
      `<span class="lp-tiers"><span class="lp-tchip area">10 大情境</span><span class="lp-tchip area">聽・說・寫</span></span>`+
      `<span class="lp-uhint">進入情境會話 <span class="lp-caret" aria-hidden="true">→</span></span></a>`) : '';
    zoneHtml=`<div class="lp-zone"><div class="lp-band"><span class="bem" aria-hidden="true">🎯</span><span class="bnm">練習與應用</span>`+
      `<span class="bmt">spec 外補充・不排順序・隨時可練；與上方 strand 分區是「換角度練同一批內容」，非另一套教材</span></div>`+
      `<div class="lp-strandgrid">`+
      speak+
      area('📚','單字大師（分級字庫）','分級字卡：聽音優先・雙向・三級自評・SRS。重用 CEFR／COCA／英檢多益／YLE 字庫與語音。',
        '<span class="lp-tchip area">A1</span><span class="lp-tchip area">A2</span><span class="lp-tchip area">B1</span><span class="lp-tchip area">B2–C2</span>')+
      area('🎧','聽與寫（分級聽寫）','分級聽寫 drill：DK 入門單字 → CEFR 句子／短文；手寫／鍵盤＋跟讀＋自評。與開口說的情境句聽寫互補。',
        '<span class="lp-tchip area">入門 DK</span><span class="lp-tchip area">初階 A1</span><span class="lp-tchip area">中階 A2–B1</span><span class="lp-tchip area">高階 B2+</span>')+
      area('💬','慣用語與片語','道地語塊＋情境例句＋小故事，三級自評。重用既有慣用語／片語資料。',
        '<span class="lp-tchip area">慣用語</span><span class="lp-tchip area">片語動詞</span>')+
      `</div></div>`;
  } else {
    gridHtml=isl.strands.map(s=>strandCard(s,s.order)).join('');
    // 其他科：練習帶佔位（全站架構一致，誠實標建置中）
    zoneHtml=`<div class="lp-zone"><div class="lp-band"><span class="bem" aria-hidden="true">🎯</span><span class="bnm">練習與應用</span>`+
      `<span class="bmt">這一科的整合練習與題庫建置中</span></div>`+
      `<div class="lp-scard" style="--a:${fill}"><span class="snm"><span class="lp-aem" aria-hidden="true">🧩</span>練習區<span class="lp-tchip soon lp-soonpin">建置中</span></span>`+
      `<span class="lp-sdesc">依這一科的特性提供整合練習（例如計算練習、題組、實作任務）。</span></div></div>`;
  }
  // 「跟著學」主體：有類別表的大島分類別群，否則單一卡牆
  let teachBody;
  const cats=CATMAP[isl.island];
  if(cats && !isEng){
    const byTitle={}; isl.strands.forEach(s=>byTitle[s.title_zh]=s);
    const sorted=isl.strands.slice().sort((a,b)=>(a.order||99)-(b.order||99));
    const used=new Set(); const secs=[];
    cats.forEach(([em,title,sel])=>{
      let inCat, labelOf;
      if(sel && sel.prefix){ // 前綴規則：取未用過且 title 以該前綴開頭者，卡片顯示去前綴
        inCat=sorted.filter(s=>!used.has(s.title_zh) && (s.title_zh||'').startsWith(sel.prefix));
        labelOf=s=>s.title_zh.slice(sel.prefix.length);
      } else {            // 明列分區名
        inCat=sel.map(n=>byTitle[n]).filter(Boolean);
        labelOf=s=>s.title_zh;
      }
      inCat.forEach(s=>used.add(s.title_zh));
      if(inCat.length) secs.push(`<div class="lp-catsec"><h3 class="lp-cath"><span aria-hidden="true">${em}</span>${title}</h3>`+
        `<div class="lp-strandgrid">${inCat.map(s=>strandCard(s,s.order,labelOf(s))).join('')}</div></div>`);
    });
    const left=isl.strands.filter(s=>!used.has(s.title_zh));
    if(left.length) secs.push(`<div class="lp-catsec"><h3 class="lp-cath">其他</h3>`+
      `<div class="lp-strandgrid">${left.map(s=>strandCard(s,s.order)).join('')}</div></div>`);
    teachBody=secs.join('');
  } else {
    teachBody=`<div class="lp-strandgrid">${gridHtml}</div>`;
  }
  const teachBand=`<div class="lp-band"><span class="bem" aria-hidden="true">📘</span><span class="bnm">跟著學</span>`+
    `<span class="bmt">${cats&&!isEng?'依類別整理；':''}數字＝建議學習順序（基礎 → 進階）；科技樹建置中</span></div>`;
  panel.innerHTML=`<div class="lp-panel-h"><h2>${isl.title_zh}</h2>`+
    `<span class="sub">${isl.strand_count} 個分區 · 必備 ${isl.min_count} 個知識點</span></div>`+
    teachBand+
    teachBody+
    zoneHtml;
  // 有單元的分區卡（<button data-strand>）→ 點擊切右側 panel 成該分區單元牆（左 sidebar 不動）
  panel.querySelectorAll('button.lp-scard-link[data-strand]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const s=isl.strands.find(x=>x.strand===btn.dataset.strand);
      if(s) renderStrandDetail(s, btn.dataset.label||s.title_zh);
    });
  });
}
function select(i){
  cur=i;
  [...document.querySelectorAll('.lp-navitem')].forEach((b,k)=>{
    b.classList.toggle('active',k===i); b.setAttribute('aria-current',k===i?'true':'false');});
  renderPanel(NAV.islands[i]);
}
fetch('authoring/units_index.json',{cache:'no-store'}).then(r=>r.ok?r.json():{units:[]}).catch(()=>({units:[]})).then(ui=>{
  (ui.units||[]).forEach(u=>{ (UNITS[u.subject]=UNITS[u.subject]||[]).push(u); });
  return fetch('authoring/nav_index.json',{cache:'no-store'}).then(r=>r.json());
}).then(nav=>{
  NAV=nav;
  document.getElementById('tot').innerHTML=
    `${nav.island_count} 座學習島 · 必備知識點 <b>${nav.minimum_total}</b> · 延伸（選修） <b>${nav.beyond_total}</b>`;
  // 逐單元學習進度（§6.3）：只讀 learning_progress_v1，顯示每島已學單元數。
  // 零進度＝中性顯示（不嚇人，R-OPEN／§14 O-5）；絕不寫 player_profile_v1。
  const LP=window.LearningProgress;
  const ISLE=(LP&&LP.islandCounts&&LP.islandCounts())||{};
  const islandTotal=(k)=>(UNITS[k]||[]).length;   // 該島已有單元總數（units_index）
  const navEl=document.getElementById('nav');
  nav.islands.forEach((isl,i)=>{
    const [fill,ink]=ACCENT[isl.island]||["var(--c-primary)","var(--c-primary-ink)"];
    const b=document.createElement('button'); b.type='button'; b.className='lp-navitem';
    b.style.setProperty('--a',fill); b.style.setProperty('--aink',ink);
    const seen=(ISLE[isl.island]&&ISLE[isl.island].seen)||0;
    const tot=islandTotal(isl.island);
    // 只在「島內已有單元且學過至少一個」時加學習進度，避免零進度時顯得空洞/嚇人。
    const learned=(tot>0&&seen>0)?` · 已學 ${Math.min(seen,tot)}/${tot} 單元`:'';
    b.innerHTML=`<span class="nm">${isl.title_zh}</span><span class="mt">${isl.strand_count} 分區 · ${isl.min_count} 知識點${learned}</span>`;
    b.addEventListener('click',()=>select(i));
    navEl.appendChild(b);
  });
  // hash deep-link（最小侵入）：#<island>/<strand>（如 #eng/vocab）→ 自動選該島並展開該分區
  // 單元牆（等同使用者點了該 strand 卡）；hash 空／不合法＝維持現有預設首屏（第一島展開）。
  function applyHash(){
    const m=(location.hash||'').replace(/^#/,'').match(/^([a-z][a-z-]*)\/(.+)$/);
    if(!m) return false;
    const idx=NAV.islands.findIndex(isl=>isl.island===m[1]);
    if(idx<0) return false;
    select(idx);   // renderPanel 同步跑完，panel DOM 已就緒
    const sel='#panel button.lp-scard-link[data-strand="'+((window.CSS&&CSS.escape)?CSS.escape(m[2]):m[2])+'"]';
    const btn=document.querySelector(sel);
    if(btn) btn.click();   // 重用既有 click → renderStrandDetail，不重寫導覽
    return true;           // 島有效即視為已路由（該分區無單元卡時留在該島總覽）
  }
  if(!applyHash()) select(0);
  // footer：真實總進度概覽（取代舊「Phase 2 後顯示」占位）
  const T=(LP&&LP.totals&&LP.totals())||{seen:0,mastered:0};
  const srcNote='資料來源：authoring/nav_index.json（由 tools/gen_derived.py 自 knowledge_points.json 衍生）。';
  const progNote=(T.seen>0)
    ? `學習進度（這台裝置）：已學 ${T.seen} 個單元、其中 ${T.mastered} 個標記為「會了」。繼續加油！`
    : '學習進度（這台裝置）：還沒有紀錄，挑一座島、點一個單元就開始囉！';
  document.getElementById('foot').textContent=srcNote+progNote;
}).catch(e=>{document.getElementById('foot').textContent='載入 nav_index.json 失敗（請用 http 開啟，勿用 file://）：'+e;});
</script>

<!-- 遊戲 HUD 唯讀渲染：讀 game_core 狀態填 Profile 卡 + 徽章牆；只讀不寫（R3 獎勵 never-disappear） -->
<script>
(function(){
  var G=window.Game; if(!G) return;
  function $(id){return document.getElementById(id);}
  function renderBadges(){
    if(!G.getBadgeWall) return;
    var wall=G.getBadgeWall(), grid=$('badge-grid'); if(!grid) return;
    var earned=0; grid.innerHTML='';
    wall.forEach(function(b){
      if(b.earned) earned++;
      var el=document.createElement('div'); el.className='badge-item '+(b.earned?'is-earned':'is-locked');
      var ico=document.createElement('div'); ico.className='b-ico'; ico.textContent=b.icon;
      var nm=document.createElement('div'); nm.className='b-name'; nm.textContent=b.name;
      var ds=document.createElement('div'); ds.className='b-desc'; ds.textContent=b.desc;
      var st=document.createElement('div'); st.className='b-state'; st.textContent=b.earned?'✓ 已解鎖':'尚未解鎖';
      el.appendChild(ico); el.appendChild(nm); el.appendChild(ds); el.appendChild(st);
      el.setAttribute('aria-label', b.name+'：'+b.desc+'，'+(b.earned?'已解鎖':'尚未解鎖'));
      grid.appendChild(el);
    });
    var cnt=$('badge-count'); if(cnt) cnt.textContent='已收集 '+earned+' / '+wall.length;
  }
  function render(){
    if(!G.getProfile) return; var p=G.getProfile(); if(!p) return; var d=p.derived||{};
    var av=$('pf-avatar'); if(av) av.textContent=p.avatar||'🦊';
    $('pf-name').textContent=p.displayName||'小小探險家';
    $('pf-rank').textContent=(d.rankIcon||'🌱')+' '+(d.rankName||'探險新手')+' · 第 '+(p.level||1)+' 級';
    var prog=d.levelProgress||0; $('pf-xpfill').style.width=Math.round(prog*100)+'%';
    var bar=$('pf-xpbar'); if(bar) bar.setAttribute('aria-valuenow', String(Math.round(prog*100)));
    $('pf-xptext').textContent=d.isMaxLevel?'已達最高等級，你太厲害了！':'距離下一級還差 '+(d.xpToNext||0)+' 點經驗值';
    $('pf-streak-num').textContent=(p.streak&&p.streak.current)||0;
    $('pf-coins-num').textContent=p.coins||0;
    renderBadges();
  }
  if(G.on){ ['xp','levelup','streak','badge','daily-complete'].forEach(function(e){ G.on(e,render); }); }
  render();
})();
</script>
