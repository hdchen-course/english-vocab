<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學習地圖（Phase 1 骨架）</title>
<style>
  :root{ --bg:#0f1720; --card:#17222e; --card2:#1d2b3a; --ink:#e8eef5; --sub:#9db2c6;
         --acc:#4aa3ff; --line:#2a3b4d; --good:#3fb57a; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg); color:var(--ink);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
       line-height:1.5; padding:24px; max-width:1180px; margin:0 auto;}
  h1{font-size:22px; margin:0 0 4px} .muted{color:var(--sub); font-size:13px; margin:0 0 18px}
  .totals{display:flex; gap:18px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:12px 16px; margin-bottom:18px}
  .totals b{color:var(--acc); font-size:18px}
  .islands{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
  .island{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;
          cursor:pointer; transition:border-color .15s, transform .05s}
  .island:hover{border-color:var(--acc)} .island:active{transform:translateY(1px)}
  .island h2{font-size:17px; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center}
  .chip{font-size:12px; color:var(--sub); font-weight:400}
  .bar{height:6px; background:var(--card2); border-radius:4px; overflow:hidden; margin-top:8px}
  .bar>i{display:block; height:100%; width:0; background:var(--good)}
  .detail{display:none; margin-top:12px; border-top:1px solid var(--line); padding-top:10px}
  .island.open .detail{display:block}
  .strand{display:flex; justify-content:space-between; gap:8px; padding:5px 0; font-size:14px;
          border-bottom:1px dashed var(--line)}
  .strand:last-child{border-bottom:none}
  .tiers{color:var(--sub); font-size:12px; white-space:nowrap}
  .needs{color:#d9a441; font-size:11px}
  footer{color:var(--sub); font-size:12px; margin-top:24px; border-top:1px solid var(--line); padding-top:12px}
</style>
</head>
<body>
  <h1>學習地圖</h1>
  <p class="muted">想從哪裡開始？點一個島展開它的分區（strand）與級別。<span class="needs">（Phase 1 骨架：strand 中文名與九島策展待精修）</span></p>
  <div class="totals" id="totals"></div>
  <div class="islands" id="islands"></div>
  <footer id="foot"></footer>

<script>
const TIER_ZH={t_base:"初階",t_mid:"中階",t_adv:"高階",t_sub:"銜接",t_enrich:"延伸"};
fetch('authoring/nav_index.json').then(r=>r.json()).then(nav=>{
  document.getElementById('totals').innerHTML =
    `<span>學習島 <b>${nav.island_count}</b></span>`+
    `<span>必備知識點 <b>${nav.minimum_total}</b></span>`+
    `<span>延伸（選修） <b>${nav.beyond_total}</b></span>`;
  const wrap=document.getElementById('islands');
  nav.islands.forEach(isl=>{
    const el=document.createElement('div'); el.className='island';
    const strands=isl.strands.map(s=>{
      const tiers=Object.entries(s.tiers).map(([t,n])=>`${TIER_ZH[t]||t} ${n}`).join('・');
      const nd=s.needs_review?'':'';
      return `<div class="strand"><span>${s.title_zh}</span><span class="tiers">${tiers}（${s.min_count}）</span></div>`;
    }).join('');
    el.innerHTML=`<h2>${isl.title_zh}<span class="chip">${isl.strand_count} 分區</span></h2>`+
      `<div class="chip">必備 ${isl.min_count} 個知識點</div>`+
      `<div class="bar"><i style="width:0%"></i></div>`+
      `<div class="detail">${strands}</div>`;
    el.addEventListener('click',()=>el.classList.toggle('open'));
    wrap.appendChild(el);
  });
  document.getElementById('foot').textContent=
    `資料來源：authoring/nav_index.json（由 tools/gen_derived.py 自 knowledge_points.json 衍生）。進度條為佔位（Phase 2 接 learning_progress_v1 後顯示）。`;
}).catch(e=>{document.getElementById('foot').textContent='載入 nav_index.json 失敗：'+e;});
</script>
</body>
</html>
