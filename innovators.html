<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>改變世界的人 💡</title>
<!-- 統一遊戲化引擎：assets/app.css（設計 token）→ game_core.css（HUD/toast）→ game_core.js。
     零重複計分：本頁定位「進階挑戰」，絕不呼叫 Game.recordAnswer / award / recordSession，
     （唯一例外：答題時呼叫 Game.pingActive() 維持每日連續學習 streak，不計 XP、不重複計分）
     也不宣告 data-game-wired，故不污染任何科目 XP。只用 Game.showToast（純提示）。
     獨立 localStorage key：innov_progress_v1。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* innovators.html — 強調色系採橙色（發明與靈感）。無專用 subject token，故：
   --su 用實色（邊框/圓點），--su-tint 用半透明（亮暗雙主題自適應），
   --su-ink 用 var(--ink)（自動隨主題翻轉，避免暗色模式對比不足）。 */
:root {
  --su: #ea580c;
  --su-tint: rgba(234,88,12,0.14);
  --su-ink: var(--ink);
  --accent: #ea580c;
  --accent-ink: var(--ink);
  --accent-tint: rgba(234,88,12,0.14);
}
/* 夜間模式：飽和強調色在暗底對比不足，改用淺色版（比照全書 dark accent 慣例）。 */
:root[data-theme="dark"] {
  --su: #fdba74; --su-tint: rgba(253,186,116,0.18);
  --accent: #fdba74; --accent-tint: rgba(253,186,116,0.18);
}

body { overflow-x: hidden; }

.ma-topbar { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s4); }
.ma-topbar .ma-title { flex: 1; font-size: var(--fs-h2); font-weight: 800; color: var(--ink); min-width: 0; }

.ma-screen { display: none; animation: ma-fade 0.3s ease; }
.ma-screen.active { display: block; }
@keyframes ma-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .ma-screen { animation: none; } }

.ma-hello { display: flex; align-items: center; gap: var(--s3); padding: var(--s4); background: var(--su-tint); border: 1px solid var(--card-border); border-radius: var(--r-lg); margin-bottom: var(--s4); }
.ma-hello .ma-mascot { font-size: 46px; flex: none; line-height: 1; }
.ma-hello .ma-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.ma-hello .ma-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }

.ma-overview { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s4); flex-wrap: wrap; }
.ma-overview .stat-tile { flex: 1; min-width: 96px; }

.ma-levels { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.ma-level {
  display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4);
  text-align: left; cursor: pointer; border: 2px solid var(--card-border);
  background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  font-family: var(--font); color: var(--ink);
}
.ma-level:hover { box-shadow: var(--shadow-lg); border-color: var(--su); }
.ma-level:active { transform: scale(0.98); }
.ma-level-top { display: flex; align-items: center; gap: var(--s3); }
.ma-level-emoji { font-size: 34px; width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 16px; }
.ma-level-num { font-size: var(--fs-small); font-weight: 700; color: var(--su-ink); }
.ma-level-name { font-size: var(--fs-body); font-weight: 800; color: var(--ink); line-height: 1.25; }
.ma-level-concepts { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; line-height: 1.4; }
.ma-level-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: 2px; }
.ma-level-status { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-small); font-weight: 700; }
.ma-level-status.done { color: var(--c-correct-ink); }
.ma-level-status.todo { color: var(--ink-soft); }
.ma-level-stars { font-size: 16px; letter-spacing: 1px; }


.ma-visual { font-size: clamp(56px, 18vw, 92px); line-height: 1.1; margin: var(--s2) 0 var(--s3); user-select: none; }
.ma-question { font-size: clamp(19px, 4.5vw, 24px); font-weight: 800; color: var(--ink); line-height: 1.6; margin: 0 auto var(--s4); max-width: 42ch; text-align: left; }

.ma-brief { text-align: left; }
.ma-brief h2 { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); margin: 0 0 var(--s3); text-align: center; }
.ma-brief-sub { text-align: center; color: var(--ink-soft); font-weight: 700; font-size: var(--fs-small); margin: 0 0 var(--s3); }
.ma-keyfacts { list-style: none; padding: 0; margin: 0 auto; max-width: 44ch; display: grid; gap: var(--s2); }
.ma-keyfacts li { display: flex; align-items: flex-start; gap: var(--s2); padding: 10px 14px; background: var(--su-tint); border-radius: var(--r-md); font-size: var(--fs-body); font-weight: 700; color: var(--ink); line-height: 1.6; }
.ma-keyfacts li .ma-kf-dot { flex: none; color: var(--su-ink); font-weight: 900; }
.ma-sec-h { text-align: left; font-size: var(--fs-body); font-weight: 800; color: var(--su-ink); margin: var(--s4) 0 var(--s2); }
.ma-stories { display: grid; gap: var(--s3); text-align: left; margin: 0 0 var(--s3); }
.ma-story-card { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s4); background: var(--card); border: 1px solid var(--card-border); border-radius: var(--r-md); }
.ma-story-emoji { font-size: 30px; flex: none; line-height: 1.15; }
.ma-story-title { font-weight: 800; color: var(--ink); font-size: var(--fs-body); margin-bottom: 3px; }
.ma-story-text { font-weight: 600; color: var(--ink); font-size: var(--fs-small); line-height: 1.8; }

.ma-steps { display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: var(--s3); flex-wrap: wrap; }
.ma-steps i { width: 20px; height: 6px; border-radius: 999px; background: var(--card-border); }
.ma-steps i.on { background: var(--su); }
.ma-steps i.cur { background: var(--su); box-shadow: 0 0 0 3px var(--su-tint); }



.ma-opt:active { transform: scale(0.98); }
.ma-opt:disabled { cursor: default; }
/* 作答後高亮：文字用 var(--ink)（亮暗雙主題皆過 AA），對錯以邊框顏色 + ✅/❌ 雙碼標示 */
.ma-opt.correct { border-color: var(--c-correct); background: var(--tint-english); color: var(--ink); }
.ma-opt.wrong { border-color: var(--c-wrong); background: rgba(255,118,117,0.12); color: var(--ink); }
.ma-opt.correct .ma-opt-mark { color: var(--c-correct-ink); }
.ma-opt.wrong .ma-opt-mark { color: var(--c-streak-ink); }
.ma-opt .ma-opt-mark { margin-left: auto; font-size: 22px; }


.ma-reveal.show { display: block; animation: ma-fade 0.3s ease; }
@media (prefers-reduced-motion: reduce) { .ma-reveal.show { animation: none; } }

.ma-done { text-align: center; padding: var(--s5) var(--s4); }
.ma-done-emoji { font-size: clamp(64px, 22vw, 100px); }
.ma-done-stars { font-size: 34px; letter-spacing: 4px; margin: var(--s2) 0; }
.ma-done-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); }


.ma-actions .btn { flex: 1; min-width: 140px; }

.ma-footnote { text-align: center; color: var(--ink-soft); font-size: var(--fs-small); margin-top: var(--s5); font-weight: 600; max-width: 34em; margin-inline: auto; }
</style>
</head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">改變世界的人 💡</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

  <section id="screen-menu" class="ma-screen active">
    <div class="ma-topbar">
      <span class="ma-title">改變世界的人 💡</span>
    </div>

    <div class="ma-hello">
      <span class="ma-mascot" aria-hidden="true">💡</span>
      <div>
        <div class="ma-hello-text" id="hello-text">歡迎來到「改變世界的人」！認識這些解決難題的發明家，也許下一個就是你。</div>
        <div class="ma-hello-sub" id="hello-sub">還沒開始也沒關係，挑一個等級試試看吧！</div>
      </div>

    <div class="ma-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-done">0/8</span><span class="stat-label">完成等級</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-badges">0/9</span><span class="stat-label">收集徽章</span></div>
    </div>

    <div class="ma-levels" id="level-list"><!-- 由 JS 產生 --></div>

    <!-- 跨頁串接導覽（Tier B）：跨科延伸 + 回上一層。純導覽，不影響答題或計分。 -->
    <nav class="cn-nextup-group" aria-label="接續探索更多主題">
      <a class="cn-nextup" href="computer_science.html"><span class="cn-nextup-ic" aria-hidden="true">💻</span><span>想看看這些發明背後的科技原理？到「電腦與網路探索」 →</span></a>
      <a class="cn-nextup" href="physics.html"><span class="cn-nextup-ic" aria-hidden="true">🧲</span><span>許多發明都來自物理原理，到「物理探險」玩玩看 →</span></a>
      <a class="cn-nextup cn-nextup--back" href="index.html"><span class="cn-nextup-ic" aria-hidden="true">↩️</span><span>← 回上一層：學習基地首頁</span></a>
    </nav>

    <p class="ma-footnote">這是「進階挑戰」小旅程，只留在你自己的裝置上，不影響學習基地的等級或經驗值。慢慢玩、盡量想，答錯也沒關係。🌱</p>
  </section>

  <section id="screen-play" class="ma-screen">
    <div class="ma-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到等級選單">←</button>
      <span class="ma-title" id="play-title">等級</span>
    </div>
    <div class="ma-steps" id="step-dots" aria-hidden="true"></div>
    <div class="play-column">
      <div id="stage"><!-- 由 JS 產生每一題 --></div>
    </div>
  </section>

</main>

<script>
/* 主程式（自足 IIFE）：6 個中性等級、每級約 11–12 題、全部解鎖。選項每題 Fisher–Yates 洗牌；
   answer = 未洗牌前 0-based 索引，以 data-i 判斷，判分不受洗牌影響。每題最多記一次分。
   獨立 key：innov_progress_v1。不呼叫 Game.recordAnswer / award / recordSession。 */
(function () {
  'use strict';

  function toast(msg, kind) {
    try { if (window.Game && Game.showToast) Game.showToast(msg, kind || 'info'); } catch (e) {}
  }

  var PROG_KEY = 'innov_progress_v1';
  function loadProg() {
    var p = null;
    try { p = JSON.parse(localStorage.getItem(PROG_KEY)); } catch (e) { p = null; }
    if (!p || typeof p !== 'object') p = {};
    if (typeof p.badges !== 'object' || !p.badges) p.badges = {};
    return p;
  }
  function saveProg(p) { try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) {} }
  var progress = loadProg();

  // 課程內容（全繁體中文；事實經 WebSearch 查核與雙重審查）。answer = 未洗牌前 0-based 索引。
  var LEVELS = [{"id":"lv1","level":1,"name":"天空與交通","emoji":"✈️","color":"#0ea5e9","concepts":["真實人物與發明的配對","每項發明「解決了什麼問題」","簡單原理：熱氣球、電動車、可回收火箭","發明是接力與不斷嘗試的成果"],"keyFacts":["萊特兄弟在 1903 年於美國小鷹鎮完成人類第一次持續、有動力的載人飛行（萊特飛行者號）。","卡爾·賓士 1885 年造出第一輛實用汽油汽車；妻子貝爾塔·賓士 1888 年長途試駕，證明汽車真的能用。","喬治·史蒂文生被稱為「鐵路之父」，蒸汽火車讓大量人與貨物在陸上又快又省力地運送。","蒙哥菲耶兄弟 1783 年在法國做出載人熱氣球：加熱後的空氣比冷空氣輕，就會往上升。","SpaceX 讓火箭第一節回收重用以降低發射成本；Tesla 電動車用電池與電動馬達驅動，行駛時不燒汽油。"],"questions":[{"q":"萊特兄弟在 1903 年完成了什麼歷史大事？","options":["完成人類第一次「持續的、有動力的」載人飛行","發明了世界上第一輛汽車","造出世界第一列蒸汽火車","第一次登陸月球"],"answer":0,"why":"萊特兄弟 1903 年在美國成功試飛萊特飛行者號。"},{"q":"現代汽車的重要先驅、造出第一輛實用汽油汽車的人是誰？","options":["卡爾·賓士（Karl Benz）","萊特兄弟","喬治·史蒂文生","蒙哥菲耶兄弟"],"answer":0,"why":"賓士 1885 年造出實用的專利汽車 Patent-Motorwagen。"},{"q":"被稱為「鐵路之父」、讓蒸汽火車能載客的英國工程師是誰？","options":["喬治·史蒂文生（George Stephenson）","卡爾·賓士","萊特兄弟","愛迪生"],"answer":0,"why":"史蒂文生推動了世界上最早的客運鐵路，因此被稱為「鐵路之父」。"},{"q":"蒸汽火車在當年主要解決了什麼問題？","options":["讓大量的人和貨物能在陸地上又快又省力地長距離運送","讓人可以在水裡呼吸","讓房子在晚上會發光","讓食物放很久都不會壞"],"answer":0,"why":"火車靠蒸汽推動，比馬車載得更多、跑得更遠。"},{"q":"SpaceX 的「可回收火箭」最特別的地方，解決了什麼問題？","options":["火箭第一節能安全降落、重複使用，大幅降低發射的花費","讓火箭飛得比光還快","讓火箭完全不需要任何燃料","讓火箭一次能載一萬人"],"answer":0,"why":"傳統火箭用一次就丟掉，回收再用能省下最貴的部分。"},{"q":"Tesla 這類電動車和一般汽油車最大的不同是什麼？","options":["用電池和電動馬達驅動，不必燒汽油","用蒸汽推動車輪","靠張開風帆前進","需要馬在前面拉"],"answer":0,"why":"電動車靠電池供電給馬達，行駛時不排廢氣。"},{"q":"1888 年，貝爾塔·賓士（Bertha Benz）帶著兩個兒子開車長途旅行，證明了什麼？","options":["汽車是實用的，可以真的載人跑很長的路","汽車只能放在展覽館裡看","汽車一定比火車快十倍","汽車完全不需要任何保養"],"answer":0,"why":"她從曼海姆開到普福茨海姆約 106 公里，讓大家相信汽車能用。"},{"q":"熱氣球為什麼能飛上天呢？（蒙哥菲耶兄弟 1783 年的發明）","options":["加熱後的空氣比周圍的冷空氣輕，就會往上升","因為球裡裝了很重的石頭","因為裡面放了一顆大電池","因為外面綁了很多小鳥"],"answer":0,"why":"熱空氣較輕會上浮，帶著氣球升空。"},{"q":"1783 年，在法國做出能載人升空熱氣球的是哪一對兄弟？","options":["蒙哥菲耶兄弟（Montgolfier）","萊特兄弟","賓士兄弟","史蒂文生兄弟"],"answer":0,"why":"蒙哥菲耶兄弟 1783 年在法國展示熱氣球並完成載人飛行。"},{"q":"清朝時，推動興建台灣第一條載客鐵路（基隆到台北）的官員是誰？","options":["劉銘傳","卡爾·賓士","萊特兄弟","喬治·史蒂文生"],"answer":0,"why":"劉銘傳 1887 年奏請興建，1891 年基隆到台北通車。"},{"q":"萊特兄弟能成功飛行，最主要靠的是什麼？","options":["反覆做實驗、觀察與改良，還自製風洞測試機翼","只靠運氣，一次就飛成功","直接照抄別人已經做好的飛機","什麼都沒做，飛機自己就飛了起來"],"answer":0,"why":"他們研究鳥、做風洞實驗，一步步改良才成功。"},{"q":"下面關於「發明」的說法，哪一個最正確？","options":["很多發明是站在前人的基礎上，一步步改良而成的","每個發明都是一個人在一夜之間獨自完成的","真正的發明都不需要經過任何失敗和嘗試","只有大人才有辦法發明東西"],"answer":0,"why":"火車、汽車、飛機都是許多人接力改良的成果。"}],"stories":[{"emoji":"🎈","title":"蒙哥菲耶兄弟 (Montgolfier brothers)","text":"很久以前，人們只能羨慕天上的鳥，卻沒辦法自己飛上天。法國的蒙哥菲耶兄弟注意到一件事：加熱後的空氣會比冷空氣輕，就會往上升。於是他們一次次試驗，用大氣球把熱空氣裝進去。1783 年，他們在法國讓熱氣球載著人升空，第一次讓人類真的離開了地面！"},{"emoji":"✈️","title":"萊特兄弟 (Wright brothers)","text":"熱氣球會飄，但沒辦法自己控制方向，人們還想要「像鳥一樣、有動力又能操控的飛行」。開腳踏車店的萊特兄弟不斷做實驗，一次又一次修改機翼和控制方式，還常常摔壞、重來。1903 年，他們在美國小鷹鎮完成了人類第一次持續、有動力的載人飛行——萊特飛行者號。從此，飛上天空不再只是夢。"},{"emoji":"🚗","title":"卡爾·賓士與貝爾塔·賓士 (Karl & Bertha Benz)","text":"馬車要靠馬拉，又慢又累，卡爾·賓士想造出一輛「自己會跑」的車。1885 年，他做出第一輛實用的汽油汽車，可是很多人不相信這東西真的能用。這時，他的妻子貝爾塔·賓士很有勇氣：1888 年她開著車做了一趟長途試駕，親自證明汽車真的能上路。他們一起讓「開車出門」成為可能。"},{"emoji":"🚂","title":"喬治·史蒂文生 (George Stephenson)","text":"以前要把很多人和沉重的貨物運到遠方，只能靠人力、馬車，又慢又費力。喬治·史蒂文生投入研究蒸汽火車，讓火車能在鐵軌上拉動一長串車廂。因為他的努力，大量的人和貨物終於能在陸地上又快又省力地移動，他也因此被稱為「鐵路之父」。"},{"emoji":"🔋","title":"Tesla 電動車","text":"傳統汽車要燒汽油，會排放廢氣。人們想：可不可以讓車子改用電來跑呢？Tesla 的電動車就是這樣的答案——它靠電池儲存電力，再用電動馬達帶動車輪，行駛的時候不燒汽油。這讓大家看見，交通工具也能有更乾淨的新選擇。"},{"emoji":"🚀","title":"SpaceX 可回收火箭","text":"以前的火箭發射一次就報廢了，非常昂貴，就像每次搭飛機都要丟掉一整架飛機。SpaceX 想解決這個難題，經過許多次失敗與改良，終於讓火箭的第一節在完成任務後平穩降落、回收重複使用，大大降低了發射的費用。這正說明：發明是一場接力，靠著一次次嘗試才能往前一步。"}]},{"id":"lv2","level":2,"name":"電力與光明","emoji":"💡","color":"#f59e0b","concepts":["電池：把化學能變成穩定的電（伏打電堆）","電磁感應：磁鐵與線圈相對移動就能產生電，這是發電機的原理","交流電（AC）：讓電力能長距離送到很遠的城市與家庭","電燈泡：讓電變成光，還要做到耐用又便宜才能普及","發明常是一場接力賽：站在別人的肩膀上一起改良"],"keyFacts":["伏打（義大利）在 1800 年左右做出第一個電池「伏打電堆」，電壓單位「伏特」就是紀念他。","法拉第（英國）在 1831 年發現電磁感應：磁鐵與線圈相對移動就能發電，成為發電機的基礎。","愛迪生（美國）不是電燈泡唯一的發明人，他改良出耐用的燈絲並建立供電系統，讓電燈真正普及。","特斯拉（塞爾維亞裔美國人）發展交流電（AC），讓電力能升壓後長距離輸送到家家戶戶。","藍光 LED 由赤崎勇、天野浩與中村修二做出（研究在日本完成，2014 年獲諾貝爾物理獎），讓省電又明亮的白光 LED 照明成真。"],"questions":[{"q":"義大利科學家伏打（Volta）在 1800 年左右做出世界上第一個能持續供電的裝置，解決了「怎麼儲存並提供穩定電流」的問題。這個裝置是什麼？","options":["電風扇","電池（伏打電堆）","電燈泡","收音機"],"answer":1,"why":"伏打電堆是最早的電池，電壓單位「伏特」就是紀念他。"},{"q":"英國科學家法拉第（Faraday）發現，只要讓磁鐵與線圈相對移動，線圈裡就會產生電流。這個成為今日發電機基礎的重要發現叫什麼？","options":["萬有引力","浮力原理","電磁感應","槓桿原理"],"answer":2,"why":"電磁感應讓「用動力轉動就能發電」成為可能。"},{"q":"關於愛迪生（Edison）與電燈泡，下列哪一項描述最正確？","options":["他改良出耐用的燈絲並建立供電系統，讓電燈能普及使用","他是史上第一個、也是唯一想到電燈泡的人","他發明了交流電","他發現了電磁感應"],"answer":0,"why":"電燈泡有許多人一起投入，愛迪生的貢獻是讓它耐用、便宜又能大量供電。"},{"q":"特斯拉（Nikola Tesla）大力發展哪一種電力系統，讓電能夠長距離輸送、送到很遠的城市與家庭？","options":["靜電","雷電","磁鐵","交流電（AC）"],"answer":3,"why":"交流電容易升高電壓後輸送，能把電送到很遠的地方。"},{"q":"美國發明家路易斯・拉提摩（Lewis Latimer）改良了電燈泡裡的碳燈絲製作方法，帶來什麼好處？","options":["讓燈泡會發出聲音","讓燈泡更耐用又便宜，一般家庭更用得起","讓燈泡不需要用電","讓燈泡自己變成交流電"],"answer":1,"why":"更好的燈絲讓電燈更持久便宜，幫助照明走進普通家庭。"},{"q":"和愛迪生差不多同時，英國的斯萬（Joseph Swan）也各自做出了會發光的白熾燈泡。這件事最能說明什麼？","options":["只有一個國家能發明東西","發明都是憑空想出來的","重要發明常是許多人一起接力、各自努力的成果","電燈泡其實沒有什麼用"],"answer":2,"why":"發明常是眾人接力，大家站在彼此的肩膀上前進。"},{"q":"英國工程師赫莎・艾爾頓（Hertha Ayrton）研究早期路燈用的「電弧燈」，解決了它「一直閃爍、發出嘶嘶聲」的問題。她的努力幫助了什麼？","options":["讓街道的照明更穩定明亮","讓電池變得更大顆","讓火車跑得更快","讓電話可以通話"],"answer":0,"why":"她讓電弧路燈更穩定，也示範了女性同樣能是傑出工程師。"},{"q":"2014 年諾貝爾物理獎頒給赤崎勇、天野浩與中村修二，因為他們做出了藍光 LED。這項成就帶來了什麼？","options":["讓燈泡變得更耗電","發明了第一顆電池","發現了電磁感應","讓省電又明亮的白光 LED 照明成真"],"answer":3,"why":"有了藍光 LED，才能組合出白光，帶來省電照明。"},{"q":"1880 年代末，台灣首任巡撫劉銘傳在台北裝設了電燈，是台灣很早引進電力照明的例子。這件事告訴我們什麼？","options":["台灣從來沒有用過電","台灣很早就開始引進並使用新的電力科技","電燈是台灣人發明的","電燈要用蠟燭才能點亮"],"answer":1,"why":"劉銘傳 1888 年在台北裝設電燈，展現了台灣很早就引進新科技的行動力。"},{"q":"為什麼發電廠可以把電送到很遠的城市？下列哪個說法最接近原理？","options":["交流電可以升高電壓後長距離輸送，減少損耗","因為電會自己走路","因為用很長的蠟燭接起來","因為磁鐵會自己飛起來"],"answer":0,"why":"高壓交流電在長距離輸送時損耗較小，是遠距送電的關鍵。"},{"q":"這些發明家（伏打、法拉第、愛迪生、特斯拉……）最像的共同點是什麼？","options":["都只想讓自己出名","都在同一天出生","都想解決「如何讓大家用得起電與光」這類真實問題","都很討厭做實驗"],"answer":2,"why":"他們專注解決真實問題，這份好奇心你也能擁有。"}],"stories":[{"emoji":"🔋","title":"伏打與第一個電池","text":"很久以前，人們只能看到閃電那種一閃就沒的電，沒辦法好好利用。義大利科學家伏打在 1800 年左右想到：把不同的金屬片和濕布一層一層疊起來，做成「伏打電堆」，竟然能源源不絕地流出穩定的電！這是世界上第一個電池。為了紀念他，電壓的單位就叫做「伏特」。"},{"emoji":"🧲","title":"法拉第與電磁感應","text":"英國的法拉第從小家裡窮，靠自學和滿滿的好奇心走進科學。他一直在想：磁鐵和電之間有沒有祕密關係？1831 年他發現，只要讓磁鐵和線圈相對移動，線圈裡就會產生電，這就是「電磁感應」。這個發現後來變成所有發電機的基礎，今天我們家裡用的電，幾乎都是這樣發出來的。"},{"emoji":"💡","title":"愛迪生與耐用的電燈","text":"很多人以為電燈泡是愛迪生一個人發明的，其實在他之前已經有不少人嘗試過，只是燈絲一下就燒斷了。愛迪生和團隊在美國一次又一次試不同材料，改良出比較耐用的燈絲，還建立了發電和送電的整套系統。這樣一來，電燈才真正走進千家萬戶，把黑夜變明亮。"},{"emoji":"⚡","title":"特斯拉與交流電","text":"電要送到很遠的城市，是個大難題。塞爾維亞裔的美國發明家特斯拉大力發展「交流電（AC）」，因為交流電可以先升高電壓，再沿著電線長距離傳送，最後送到家家戶戶。有了他的努力，電力才能離開發電廠，跑到很遠的地方點亮無數的燈。"},{"emoji":"🔵","title":"藍光 LED 與明亮的白光","text":"很久以來，科學家做得出紅光和綠光的 LED，卻一直缺少最難的藍光，沒有藍光就湊不出明亮的白光。赤崎勇、天野浩與中村修二在日本經過長期研究，終於做出藍光 LED，並在 2014 年獲得諾貝爾物理獎。從此省電又明亮的白光 LED 照明成真，路燈、手機、電視都用得上它。"},{"emoji":"🤝","title":"發明是一場接力賽","text":"從伏打的電池、法拉第的發電原理，到愛迪生的電燈、特斯拉的交流電，再到今天的 LED，你會發現沒有人是完全靠自己完成的。每一位發明家都站在前人的肩膀上，一次又一次地嘗試、失敗、再改良。電力與光明，就是這樣一棒接一棒點亮起來的。"}]},{"id":"lv3","level":3,"name":"溝通與電腦","emoji":"💻","color":"#2563eb","concepts":["遠距通訊","電腦科學與程式","全球資訊網","半導體晶片","解決真實問題的勇氣"],"keyFacts":["貝爾在1876 年取得電話專利，把「用聲音遠距交談」變成可能。","圖靈提出「圖靈機」的理論模型，是電腦科學與演算法的重要基礎。","愛達·勒芙蕾絲為巴貝奇的分析機寫下運算步驟，常被譽為電腦程式概念的先驅。","提姆·柏內茲-李在歐洲核子研究組織（CERN）發明了全球資訊網 WWW。","台灣的張忠謀創辦台積電，開創專門替客戶製造晶片的「晶圓代工」模式。"],"questions":[{"q":"誰取得了電話的專利，讓人們可以用聲音即時遠距離交談？","options":["湯瑪斯·愛迪生","阿蘭·圖靈","亞歷山大·格拉漢姆·貝爾","山繆·摩斯"],"answer":2,"why":"貝爾在1876 年取得電話專利，推廣了用聲音遠距通話。"},{"q":"阿蘭·圖靈提出的「圖靈機」概念，替哪一門學問打下重要基礎？","options":["電腦科學與演算法","天文觀測","外科手術","農業灌溉"],"answer":0,"why":"圖靈的理論模型成為現代電腦科學與演算法的重要根基。"},{"q":"誰常被譽為史上第一位電腦程式概念的先驅，為巴貝奇的分析機寫下運算步驟？","options":["居禮夫人","愛達·勒芙蕾絲","南丁格爾","萊特兄弟"],"answer":1,"why":"愛達·勒芙蕾絲為分析機寫下被視為最早程式概念的運算步驟。"},{"q":"提姆·柏內茲-李發明了什麼，讓我們能用瀏覽器點開一頁頁相連的網頁？","options":["電池","蒸汽機","顯微鏡","全球資訊網 WWW"],"answer":3,"why":"他發明全球資訊網，用超連結把一頁頁網頁串連起來。"},{"q":"在還沒有電話的年代，山繆·摩斯幫忙發展了什麼，用長短訊號沿電線快速傳遞文字？","options":["電視","電報與摩斯電碼","冷氣機","電梯"],"answer":1,"why":"摩斯電碼用點與劃的長短訊號，透過電報遠距傳送文字。"},{"q":"馬可尼是哪一種通訊技術的重要先驅，讓訊息不必靠電線也能傳送？","options":["無線電（無線電報）","有線電視","印刷術","打字機"],"answer":0,"why":"馬可尼推動無線電報，讓訊號能跨海、不靠電線傳遞。"},{"q":"葛麗絲·霍普在電腦發展上有什麼重要貢獻？","options":["發明了輪子","畫出世界地圖","開發早期的編譯器，讓程式更接近人類語言","種出新品種稻米"],"answer":2,"why":"她開發早期編譯器，讓人能用較接近人類語言的方式寫程式。"},{"q":"台灣的張忠謀創辦台積電，推動了哪一種商業模式，專門替別家公司製造晶片？","options":["網路購物","連鎖餐廳","宅配快遞","晶圓代工"],"answer":3,"why":"張忠謀開創專業晶圓代工模式，專門替客戶製造晶片。"},{"q":"關於湯瑪斯·愛迪生與電燈泡，下列哪一種說法最準確？","options":["他改良並商業化了實用又耐用的電燈泡","他是唯一發明「電」的人","他發明了電話","他第一個登上月球"],"answer":0,"why":"電燈泡有許多人研究，愛迪生把它改良成耐用、能量產的實用產品。"},{"q":"萊特兄弟在1903 年完成了什麼重要創舉？","options":["第一次環遊世界","首次成功的持續動力載人飛行","發明第一台電腦","造出第一艘潛水艇"],"answer":1,"why":"1903 年萊特兄弟完成人類首次可操控、持續的動力載人飛行。"},{"q":"馬斯克帶領的 SpaceX 團隊，在火箭上做到了什麼讓太空發射更省錢的突破？","options":["火箭用木頭做成","火箭完全不需要燃料","火箭能回收並重複使用","火箭一次能載一萬人"],"answer":2,"why":"SpaceX 讓火箭第一節能回收再飛，大幅降低發射成本。"},{"q":"賈伯斯與沃茲尼克共同創辦蘋果公司，早期最重要的貢獻是什麼？","options":["推動個人電腦走進一般家庭","發明了電報","蓋了第一條鐵路","種出第一棵蘋果樹"],"answer":0,"why":"他們讓操作簡單的個人電腦普及，慢慢走進一般人的家庭。"}],"stories":[{"emoji":"📞","title":"貝爾與電話（Alexander Graham Bell）","text":"很久以前，人們想跟遠方的親友說話，只能寫信慢慢等。貝爾一直研究聲音怎麼傳送，經過很多次嘗試，終於在 1876 年取得電話的專利，讓聲音可以順著電線傳到遠方。從此「用聲音遠距交談」變成真的，這就是後來所有通話的起點。"},{"emoji":"🧮","title":"圖靈與圖靈機（Alan Turing）","text":"電腦還沒出現的年代，圖靈先在腦中想像了一台會「照著步驟做事」的機器，也就是「圖靈機」這個理論模型。它用很簡單的規則，說明機器怎麼一步一步解決問題。這個想法成了電腦科學和演算法的重要基礎，讓後來的電腦有了理論的根。"},{"emoji":"👩‍💻","title":"愛達·勒芙蕾絲（Ada Lovelace）","text":"很久以前，巴貝奇設計了一台叫「分析機」的計算機器，但要怎麼叫它算東西呢？愛達仔細研究後，寫下了一步步的運算步驟，等於告訴機器該怎麼做。因為這份工作，她常被譽為電腦程式概念的先驅，也讓大家知道女生一樣能在科學裡發光。"},{"emoji":"🌐","title":"提姆·柏內茲-李與全球資訊網（WWW）","text":"在歐洲核子研究組織（CERN）裡，科學家有好多資料卻很難互相分享。提姆·柏內茲-李想到一個辦法：把資料變成一頁頁能互相連結的網頁，讓大家點一下就能跳來跳去。他發明的全球資訊網 WWW，就是我們今天上網看到的網頁世界的開始。"},{"emoji":"🔩","title":"張忠謀與台積電","text":"以前一家公司想做晶片，得自己蓋很貴的工廠，小公司根本負擔不起。台灣的張忠謀創辦了台積電，開創「晶圓代工」的新模式：自己不設計晶片，而是專門替客戶把他們設計好的晶片製造出來。這個聰明的分工，讓全世界的好點子都更容易變成真正的晶片。"}]},{"id":"lv4","level":4,"name":"醫學與救命","emoji":"💊","color":"#e63946","concepts":["疫苗：用弱化或無害的病原，先訓練身體的防禦","細菌與感染：看不見的微生物如何讓人生病","抗生素：對付細菌感染的藥物","消毒與洗手：簡單的乾淨動作就能救命","護理與衛生：良好的照顧與環境能降低死亡"],"keyFacts":["疫苗的原理：讓身體先認識弱化或無害的病原，真正的病原來時就能快速打敗它。","1796年珍納用溫和的牛痘幫人預防致命的天花，開創了疫苗接種。","巴斯德證明細菌會讓食物腐壞、讓人生病，並發明加熱殺菌的「巴氏殺菌」。","弗萊明在1928年意外發現青黴素，後來被發展成對抗細菌感染的抗生素。","塞麥爾維斯與南丁格爾用洗手、消毒與乾淨的環境，救了無數人的命。"],"questions":[{"q":"天花曾奪走很多人的生命。1796年，英國醫生珍納（Edward Jenner）做了一件重要的事來預防天花，那是什麼？","options":["他發明了治療天花的抗生素藥丸","他用X光照出病人身上的天花病毒","他讓人接種較溫和的「牛痘」，使身體學會抵抗天花","他發現只要多喝水就不會得天花"],"answer":2,"why":"珍納證明接種牛痘能讓身體產生保護力，開創了疫苗接種。"},{"q":"「疫苗」是怎麼幫助我們的身體的？","options":["直接把所有細菌從身體裡吸出來","讓身體先認識弱化或無害的病原，之後能快速認出並打敗真的病原","讓人永遠都不會覺得累","把生病的記憶從腦中刪掉"],"answer":1,"why":"疫苗像預習，讓免疫系統先「認臉」，遇到真病原就能快速反應。"},{"q":"法國科學家巴斯德（Louis Pasteur）發現食物會腐壞、人會生病，常常是因為什麼？","options":["因為天氣太冷","因為食物顏色不好看","因為月亮的引力","看不見的微生物（例如細菌）在作怪"],"answer":3,"why":"巴斯德的研究支持「細菌致病」，證明許多疾病與腐敗來自微生物。"},{"q":"我們喝的鮮奶盒上常寫著「巴氏殺菌」。這個方法是巴斯德想出來的，它怎麼運作？","options":["用適當的加熱殺死大部分有害微生物，讓食物更安全又不易壞","把牛奶冷凍成冰塊","在牛奶裡加很多糖","用強光照射牛奶一整天"],"answer":0,"why":"巴氏殺菌用溫和加熱來殺菌，讓牛奶等食品更安全、更耐放。"},{"q":"1928年，蘇格蘭科學家弗萊明（Alexander Fleming）在實驗室有一個意外發現，開啟了抗生素時代。他發現了什麼？","options":["一種會發光的細菌","可以讓傷口瞬間癒合的膠水","一種黴菌會分泌出能殺死細菌的物質——青黴素","一種新的維他命"],"answer":2,"why":"弗萊明發現青黴菌會抑制細菌生長，這物質就是青黴素（盤尼西林）。"},{"q":"弗萊明發現了青黴素，但要變成能大量救人的藥物，還需要什麼？","options":["什麼都不用做，隔天就能在店裡買到","其他科學家接力研究，把它純化並大量製造成藥","只要多曬太陽它就會自己變多","把黴菌直接吃下去就好"],"answer":1,"why":"佛洛里與錢恩等人後來把青黴素純化量產，弗萊明的發現才真正救了無數人。"},{"q":"抗生素（例如青黴素）最主要是用來對付什麼？","options":["骨折","近視","蛀牙的洞（直接把洞補起來）","細菌造成的感染"],"answer":3,"why":"抗生素能殺死或抑制細菌，治療細菌感染；但對感冒等病毒無效。"},{"q":"十九世紀，許多產婦生完孩子後因「產褥熱」死亡。醫生塞麥爾維斯（Ignaz Semmelweis）發現一個簡單方法就能大幅減少死亡，那是什麼？","options":["醫生在接觸產婦前先把手洗乾淨、消毒","讓產婦多吃甜點","把窗戶全部關起來","每天量三次體溫"],"answer":0,"why":"塞麥爾維斯發現醫護洗手消毒能大幅降低產褥熱死亡，是消毒觀念的先驅。"},{"q":"南丁格爾（Florence Nightingale）在戰地醫院照顧傷兵時，靠什麼救了很多人的命？","options":["給每個傷兵一把劍","讓傷兵整天躺著不准動","保持環境乾淨、通風並提供充足照顧，大幅降低感染","把醫院蓋在山頂上"],"answer":2,"why":"南丁格爾改善衛生與護理，讓因感染而死的傷兵大幅減少，開創了現代護理。"},{"q":"南丁格爾除了細心照顧病人，還很擅長一件事，用它來說服別人重視衛生。那是什麼？","options":["唱歌","收集數據並畫成圖表，讓大家看懂「乾淨能救命」","畫風景畫","說笑話"],"answer":1,"why":"南丁格爾用統計圖表呈現死亡原因，是用數據說服人改善衛生的先驅。"},{"q":"現代科學家屠呦呦從古老的中醫藥書得到靈感，找出對抗「瘧疾」的重要藥物，並在2015年獲得諾貝爾獎。她找到的是什麼？","options":["從植物（青蒿）中提煉出的青蒿素","一種新的手機","一種會飛的機器人","一種巧克力"],"answer":0,"why":"屠呦呦從青蒿提煉出青蒿素，成為治療瘧疾、拯救眾多生命的關鍵藥物。"},{"q":"這些醫學故事給我們最重要的啟發是什麼？","options":["只有天才才能幫助別人","生病只能靠運氣","洗手沒有用","仔細觀察、動手實驗、注重乾淨，就能發現救命的方法"],"answer":3,"why":"從洗手到疫苗，這些發現都來自好奇、觀察與堅持，我們也能一起探索。"}],"stories":[{"emoji":"🛡️","title":"疫苗是怎麼保護我們的？","text":"生病常常是因為看不見的病原跑進身體。科學家想到一個聰明辦法：先讓身體認識「弱化或無害」的病原，就像先看過壞人的照片。等真正的病原來的時候，身體的防禦部隊早就記得它，就能又快又準地把它打敗。這就是疫苗救了好多人命的祕密。"},{"emoji":"🐄","title":"珍納與牛痘（1796 年）","text":"很久以前，天花是一種會奪走許多性命的可怕疾病。珍納注意到擠牛奶的人常得到溫和的「牛痘」，之後卻很少染上天花。於是他在 1796 年試著用溫和的牛痘來幫人預防致命的天花，成功了！這開創了世界上的疫苗接種，後來救了無數人。"},{"emoji":"🔬","title":"巴斯德與看不見的細菌","text":"以前的人不明白食物為什麼會壞、人為什麼會生病。巴斯德用實驗證明：原來是看不見的小小細菌在作怪。他還發明了用適當加熱來殺菌的方法，叫做「巴氏殺菌」。今天我們喝的牛奶能安全又新鮮，就要謝謝他的發現。"},{"emoji":"🍄","title":"弗萊明與青黴素（1928 年）","text":"1928 年，弗萊明整理實驗室時發現一件怪事：一團黴菌旁邊的細菌竟然都死光了。他沒有忽略這個意外，反而仔細研究，發現這種黴菌會分泌能殺菌的物質——青黴素。後來科學家把它發展成抗生素，成為對抗細菌感染、救人一命的重要藥物。"},{"emoji":"🧼","title":"塞麥爾維斯與洗手的力量","text":"從前的醫生不知道手上會沾著看不見的病菌，常常讓病人受到感染。塞麥爾維斯發現，只要醫生在看病前把手洗乾淨消毒，生病的人就明顯變少了。原來這麼簡單的乾淨動作，就能救好多人的命——這也是我們今天勤洗手的原因。"},{"emoji":"🕯️","title":"南丁格爾與乾淨的照顧","text":"南丁格爾是一位用心的護理先驅。她發現只要保持環境乾淨、通風、給病人好好的照顧，原本很多會失去性命的人都能康復。她用洗手、消毒和整潔的病房證明：良好的護理與衛生，和藥物一樣能救命，讓護理成為一門重要的專業。"}]},{"id":"lv5","level":5,"name":"探索自然與宇宙","emoji":"🔭","color":"#7c3aed","concepts":["萬有引力與運動定律","用望遠鏡觀測宇宙","演化與天擇","放射性與新元素","太空軌道計算","好奇心與科學態度"],"keyFacts":["牛頓提出萬有引力和三大運動定律，說明蘋果落地和星球運行都靠同樣的力。","伽利略改良望遠鏡並用它觀測，發現木星有四顆衛星，支持「地球繞太陽」的地動說。","達爾文搭乘小獵犬號環遊世界，仔細觀察各地生物後，提出「天擇」的演化論。","瑪里·居禮研究放射性、發現釙和鐳，是首位獲諾貝爾獎的女性，也是首位兩度得獎的人。","凱瑟琳·強生是 NASA 的數學家，負責計算太空船軌道，葛倫指名要她驗算才安心升空。"],"questions":[{"q":"牛頓（Newton）提出的「萬有引力」，主要在解釋什麼現象？","options":["為什麼天空在白天是藍色的","為什麼冰塊放久會融化成水","為什麼蘋果會往下掉、月亮會繞著地球轉","為什麼植物的葉子大多是綠色的"],"answer":2,"why":"牛頓用同一條引力，說明地上物體下落和天上星體運行其實是同一回事。"},{"q":"除了萬有引力，牛頓還整理出描述物體如何運動的什麼？","options":["三大運動定律","元素週期表","血液循環的路線","世界地圖"],"answer":0,"why":"牛頓的三大運動定律，成為後世研究力與運動的重要基礎。"},{"q":"關於伽利略（Galileo）和望遠鏡，下面哪一句最正確？","options":["他是全世界第一個發明望遠鏡的人","他改良了望遠鏡，並用它觀測天空，發現木星有衛星","他用望遠鏡發現了電","他用望遠鏡拍下了第一張照片"],"answer":1,"why":"望遠鏡最早由他人製作，伽利略把它改良，並第一個有系統地用來觀測星空。"},{"q":"伽利略透過觀測，支持哪一種在當時很有爭議的看法？","options":["地球是平的一塊大陸","月亮會自己發光","星星其實是掛在天上的燈","地球和其他行星是繞著太陽轉的（地動說）"],"answer":3,"why":"他看到金星的盈虧和木星的衛星，這些證據支持「太陽在中心」的地動說。"},{"q":"達爾文（Darwin）最有名的「演化論」，核心想法是什麼？","options":["比較能適應環境的生物，較容易存活並繁衍後代","所有動物都是同一天一起出現的","生物永遠都不會改變","動物想變成什麼就能立刻變成什麼"],"answer":0,"why":"這就是「天擇」：環境會篩選出較適應的特徵，經過很多世代慢慢累積成演化。"},{"q":"達爾文的許多觀察，來自他年輕時搭船環遊世界。這趟旅程幫助他做什麼？","options":["尋找埋在海底的黃金","測量地球到月球的距離","觀察各地不同的動植物與化石，累積演化論的證據","畫出第一張世界地圖"],"answer":2,"why":"他搭乘「小獵犬號」航行，沿途蒐集大量標本與觀察，後來成為演化論的重要依據。"},{"q":"瑪里·居禮（Marie Curie）主要研究的是什麼？","options":["恐龍化石的挖掘","放射性，並和先生一起發現「釙」和「鐳」兩種元素","火山爆發的預測","飛機的設計"],"answer":1,"why":"她研究放射性現象，並和先生一起發現了釙和鐳這兩種新元素。"},{"q":"關於瑪里·居禮的成就，下面哪一項是對的？","options":["她從來沒有得過任何獎","她只在運動比賽中得過獎牌","她是第一位登上月球的人","她是第一位獲得諾貝爾獎的女性，也是第一位兩度得獎的人"],"answer":3,"why":"她 1903 年得物理獎、1911 年得化學獎，是首位女性得主，也是首位兩度得獎的人。"},{"q":"凱瑟琳·強生（Katherine Johnson）在美國太空總署（NASA）負責什麼工作？","options":["用數學計算太空船飛行的軌道與路線","駕駛太空梭登陸月球","設計太空人的太空衣","替火箭加油"],"answer":0,"why":"她是 NASA 的數學家，負責算出太空任務的飛行軌道和安全返回的路線。"},{"q":"太空人葛倫（John Glenn）要繞地球飛行前，為什麼特別指名要凱瑟琳·強生做一件事？","options":["請她幫忙打開太空船的門","請她準備太空中的食物","請她親自驗算電腦算出的軌道數字，他才放心起飛","請她挑選火箭的顏色"],"answer":2,"why":"當時電腦剛開始使用，葛倫信任她的計算，堅持要她驗算過後才願意升空。"},{"q":"牛頓、伽利略、達爾文、居禮、強生這些人有什麼共同點，值得我們學習？","options":["他們都是同一個國家、同一個時代的人","他們都靠仔細觀察、動手實驗和不怕失敗，去解開自然的問題","他們都放棄提問，只相信別人說的話","他們的發現都只是運氣好、猜對而已"],"answer":1,"why":"他們來自不同國家與時代、有男有女，共同點是好奇、觀察與堅持，這正是我們也能學的態度。"}],"stories":[{"emoji":"🍎","title":"牛頓 Isaac Newton","text":"牛頓從小就愛問「為什麼」。傳說他看到蘋果從樹上掉下來，忍不住想：為什麼蘋果往地面掉，月亮卻乖乖繞著地球轉呢？他反覆思考後提出「萬有引力」和三大運動定律，說明蘋果落地和星球運行其實靠的是同一種力。原來，天上和地上遵守的是同一套規則！"},{"emoji":"🔭","title":"伽利略 Galileo","text":"很久以前，大家都以為所有東西都繞著地球轉。伽利略聽說有一種能把遠方拉近的鏡筒，就動手把望遠鏡改良得更好，然後對準夜空觀測。他發現木星旁邊有四顆小小的衛星繞著木星轉，證明不是每樣東西都繞地球——這支持了「地球繞太陽」的地動說。親眼觀察，比人云亦云更有力量。"},{"emoji":"🐢","title":"達爾文 Charles Darwin","text":"年輕的達爾文搭上一艘叫「小獵犬號」的船，環遊世界好幾年。一路上他仔細觀察各地的動物和植物，好奇：為什麼不同地方的生物長得不太一樣？經過長久思考，他提出「天擇」的演化論——比較適合環境的生物，比較容易存活下來、把特徵傳給後代。耐心觀察，讓他看見了生命變化的祕密。"},{"emoji":"⚛️","title":"瑪里·居禮 Marie Curie","text":"居禮夫人對一種會自己放出神祕射線的現象很好奇，這種現象叫「放射性」。她在簡陋的實驗室裡不怕辛苦地研究，發現了兩種新元素——釙和鐳。她是第一位得到諾貝爾獎的女性，而且還是史上第一位兩度得獎的人！她用行動告訴世界：只要努力，女生也能站上科學的最前線。"},{"emoji":"🚀","title":"凱瑟琳·強生 Katherine Johnson","text":"凱瑟琳·強生是 NASA 的數學家，她的工作是計算太空船要走的軌道。那時候雖然已經有電腦，但太空人葛倫要上太空前，特別指名說：「請凱瑟琳幫我再算一次，我才放心！」她細心又準確的計算，幫助太空人安全升空。原來，一枝筆和厲害的數學，也能把人送上太空。"},{"emoji":"💡","title":"好奇心與科學態度","text":"這些了不起的科學家都有一個共同點：他們對世界充滿好奇，遇到不懂的事就想弄明白。他們不急著相信「大家都這麼說」，而是自己去觀察、動手實驗、耐心思考，再一步步找出答案。你心裡的每一個「為什麼」，都可能是通往新發現的入口喔！"}]},{"id":"lv6","level":6,"name":"台灣與現代創新","emoji":"🚀","color":"#059669","concepts":["晶片與半導體","晶圓代工模式","人工智慧與再生能源","3D 列印與電動車","商業太空與可回收火箭","從失敗中學習的創新精神"],"keyFacts":["張忠謀 1931 年出生，1987 年在台灣創辦了台積電（TSMC）。","台積電開創「晶圓代工」模式：專門替世界各地的公司製造他們設計好的晶片。","晶片（半導體）是手機、電腦、汽車能運算的關鍵零件，台灣是全球重要的供應者。","人工智慧靠「從大量資料學習」；再生能源、電動車、3D 列印、可回收火箭都是現代創新。","創新常從「觀察問題→動手嘗試→從失敗中學習」開始，你也能動手創造。"],"questions":[{"q":"張忠謀在台灣創辦了哪一家世界知名的公司？","options":["一家連鎖手搖飲料店","一座大型主題樂園","台積電（TSMC）","一間拍電影的公司"],"answer":2,"why":"張忠謀 1987 年創辦台積電，是可查證的中性事實。"},{"q":"台積電最有名的「晶圓代工」模式，指的是什麼？","options":["專門替其他公司「製造」他們設計好的晶片，自己不推出品牌手機","只販賣自家品牌的電視機","專門幫客人蓋房子","專門種稻米賣給大家"],"answer":0,"why":"晶圓代工是替別人代工製造晶片的分工模式。"},{"q":"手機和電腦裡，負責運算、像「大腦」一樣的關鍵零件叫什麼？","options":["一塊普通的玻璃","晶片（半導體）","一團棉花","一條橡皮筋"],"answer":1,"why":"晶片是電子產品運算的核心零件。"},{"q":"「人工智慧（AI）」能變聰明，主要是靠什麼？","options":["電腦裡住著一個小精靈","對著電腦許願","幫電腦多充一點電","從大量的資料和例子中「學習」，找出其中的規則"],"answer":3,"why":"AI 透過大量資料學習規律，而非魔法。"},{"q":"太陽能板和風力發電機都把大自然的能量變成電，屬於「再生能源」。它們有什麼優點？","options":["來自陽光和風，用不完，也比較不會污染空氣","一用就沒有，而且會排出很多黑煙","只能在半夜才發得出電","其實根本不能發電"],"answer":0,"why":"再生能源可持續取得且較乾淨。"},{"q":"「3D 列印」是怎麼做出一個立體物品的？","options":["用剪刀把紙剪成形狀","把大石頭慢慢敲碎","把材料「一層一層」堆疊起來，慢慢長成立體形狀","用水彩直接畫在牆上"],"answer":2,"why":"3D 列印以逐層堆疊的方式成形。"},{"q":"電動車和傳統燒汽油的汽車，最大的不同是什麼？","options":["用電池和馬達驅動，不燒汽油，行駛時比較不排廢氣","完全不需要輪子就能跑","只能在水面上行駛","靠張開風帆前進"],"answer":0,"why":"電動車以電池與馬達取代汽油引擎。"},{"q":"由 Elon Musk 創辦的 SpaceX 做出「可回收火箭」，為什麼是很棒的點子？","options":["因為火箭升空後就會自動消失","因為火箭永遠不會再飛回來","因為用過的火箭丟進海裡最環保","因為火箭發射後能安全降落、重複使用，大大節省成本"],"answer":3,"why":"可回收火箭能重複使用，降低太空發射成本。"},{"q":"萊特兄弟在 1903 年完成了人類史上哪一件了不起的事？","options":["第一個登上月球","第一次「持續且可操控」的動力載人飛行","發明了世界上第一顆電燈泡","造出第一支智慧型手機"],"answer":1,"why":"1903 年萊特兄弟完成首次持續、可控制的動力載人飛行。"},{"q":"關於發明家愛迪生和電燈泡，下面哪個說法比較正確？","options":["他是世界上唯一想到用電的人","電燈泡從古到今只有他一個人用過","他「改良」了電燈泡，還讓它能大量生產、普及到家家戶戶","他發明了天上的太陽"],"answer":2,"why":"愛迪生是改良並商業化實用電燈泡，而非唯一發明人。"},{"q":"好萊塢知名影星海蒂·拉瑪（Hedy Lamarr）除了演戲，還做了什麼令人驚訝的事？","options":["和夥伴共同發明一種「跳頻」無線通訊技術，成為現代無線通訊（展頻技術）的先驅概念之一","發明了汽車的輪胎","蓋了世界第一座機場","種出全世界最大的南瓜"],"answer":0,"why":"她與夥伴共同發明跳頻技術，展現女性跨領域的好奇與創造力。"},{"q":"如果你在生活中發現一個想解決的問題，像小發明家一樣，最好的做法是什麼？","options":["覺得自己一定辦不到，馬上放棄","先仔細觀察問題，動手試試看，就算失敗也從中學習、再改進","等別人幫你把一切都想好","只用頭腦想，絕對不動手做"],"answer":1,"why":"觀察問題、動手嘗試、從失敗中學習，正是創新的起點。"}],"stories":[{"emoji":"🏭","title":"張忠謀與台積電（TSMC）","text":"張忠謀 1931 年出生，年輕時就一直在思考：世界上有好多公司很會「設計」晶片，卻不一定有錢蓋昂貴的工廠來製造。1987 年他在台灣創辦了台積電，決定不跟客戶搶著設計，而是專心幫大家把晶片做出來。這個想法後來改變了整個科技世界，讓許多小公司也能實現自己的點子。"},{"emoji":"🧩","title":"晶圓代工：一種全新的合作方式","text":"以前的公司大多要「自己設計、自己製造」晶片，門檻又高又貴。台積電開創了「晶圓代工」模式：世界各地的公司負責想點子、畫好設計，台積電專門替他們把晶片製造出來。就像一間超厲害的中央廚房，客人寫好食譜，廚房幫大家精準地做出來，讓創新變得更容易。"},{"emoji":"🔬","title":"晶片（半導體）：藏在裝置裡的小腦袋","text":"你的手機為什麼會算數、汽車為什麼會導航？關鍵就是一小片「晶片」，也叫半導體。它像一顆迷你的大腦，幫機器運算和做決定。這麼重要的零件，台灣是全球很重要的供應者，世界上很多裝置裡，都有台灣參與製造的晶片在默默工作。"},{"emoji":"🤖","title":"人工智慧：從大量資料裡學習","text":"人工智慧（AI）學東西的方法，和你有點像：看得越多、練得越多，就越厲害。它靠著「從大量資料學習」，慢慢學會認圖、翻譯、對話。今天的 AI 需要許多強大的晶片來幫忙運算，所以晶片和人工智慧就像好夥伴，一起讓現代科技越來越聰明。"},{"emoji":"🌱","title":"現代創新：綠能、電動車與 3D 列印","text":"創新不只在實驗室裡，也在我們的生活周圍。再生能源用陽光和風來發電，比較不會污染；電動車用電池取代汽油；3D 列印能一層一層把東西「印」出來。這些現代發明，都在試著讓生活更方便、也更愛護我們居住的地球。"},{"emoji":"🚀","title":"可回收火箭與商業太空","text":"以前的火箭升空後大多用一次就丟掉，非常浪費又昂貴。現在有人想出讓火箭第一節安全降落、回收重用的辦法，就像把用過的東西洗乾淨再用，大大降低了上太空的成本。這讓探索太空不再只是少數人的夢想，而是越來越多人能參與的事。"},{"emoji":"💡","title":"從失敗中學習的創新精神","text":"你知道嗎？幾乎每個了不起的發明，背後都有數不清的失敗。創新常常從「觀察問題→動手嘗試→從失敗中學習」開始，一次不成功，就想想哪裡可以改，再試一次。這份不怕失敗的精神，張忠謀有，許多發明家也有——而你，也一樣能動手創造。"}]},{"id":"lv7","level":7,"name":"家裡的大發明","emoji":"🏠","color":"#f59e0b","concepts":["家電與居家發明如何改變生活與家務","很多發明是「多人接力＋不斷改良普及」","簡單原理淺說","發明解決了什麼生活問題"],"keyFacts":["空調（冷氣）：威利斯·開利（Willis Carrier）1902 年做出現代電氣空調，最初是為工廠控制溼度，後來讓室內夏天也能涼爽。","微波爐：珀西·斯賓塞（Percy Spencer）在研究雷達的磁控管時，發現口袋裡的巧克力融化了，因而發現微波可以加熱食物。","家用電冰箱：靠壓縮循環把熱從裡面搬到外面來製冷；20 世紀初開始普及，讓食物保鮮、比較不會壞。（由多人逐步發展，非單一人發明）","電動洗衣機：20 世紀初出現，把費力的手洗自動化，大幅減少洗衣的時間與辛勞。（沒有單一發明人，重點在「改變家務」）","抽水馬桶的存水彎：亞歷山大·卡明（Alexander Cumming）1775 年取得 S 形存水彎專利，用一段存水擋住臭味與病菌；配合下水道大幅改善城市衛生。（常被誤會是 Thomas Crapper 發明，其實他主要是推廣者）","安全電梯：伊萊沙·奧的斯（Elisha Otis）1852 年發明「就算鋼索斷了也不會墜落」的安全裝置，讓蓋高樓大廈變得安全可行。","電視：由多位發明家逐步做出（如機械式的貝爾德、電子式的法恩斯沃斯 1927 年），讓影像能傳送到家裡的螢幕上。（多人成果）","吸塵器：休伯特·塞西爾·布思（Hubert Cecil Booth）1901 年做出用吸力清潔的機器；後來變成家用電器，讓打掃更輕鬆。"],"questions":[{"q":"現代電氣空調（冷氣）是誰在1902 年做出來的？最初其實是為了工廠控制溼度。","options":["威利斯·開利（Willis Carrier）","湯瑪斯·愛迪生（Thomas Edison）","伊萊沙·奧的斯（Elisha Otis）","亞歷山大·卡明（Alexander Cumming）"],"answer":0,"why":"開利1902 年造出現代空調，本來是幫工廠控制溼度，後來才讓室內夏天也涼爽。"},{"q":"珀西·斯賓塞（Percy Spencer）研究哪一種裝置時，意外發現微波可以加熱食物，因而催生了微波爐？","options":["電冰箱的壓縮機","雷達的磁控管","電視的映像管","洗衣機的馬達"],"answer":1,"why":"他研究雷達磁控管時，發現口袋裡的巧克力融化了，才知道微波能加熱食物。"},{"q":"家用電冰箱主要是靠什麼方式，讓箱子裡面變冷、食物比較不會壞？","options":["把冰塊放進去慢慢融化","用電把冷風直接吹進去","靠壓縮循環把熱從裡面搬到外面","把水結成冰再打散開來"],"answer":2,"why":"冰箱用壓縮循環把熱搬到外面，裡面就變冷，讓食物能保鮮。"},{"q":"二十世紀初電動洗衣機開始普及，帶來最重要的改變是什麼？","options":["把費力的手洗自動化，省下時間與辛勞","讓衣服永遠都不會弄髒","能把舊衣服變成全新的","讓衣服自己穿到身上"],"answer":0,"why":"電動洗衣機把辛苦的手洗自動化，大幅減少洗衣的時間和力氣。"},{"q":"1775 年取得抽水馬桶「S 形存水彎」專利、用一段存水擋住臭味的是誰？","options":["湯瑪斯·克拉普（Thomas Crapper）","休伯特·布思（Hubert Booth）","珀西·斯賓塞（Percy Spencer）","亞歷山大·卡明（Alexander Cumming）"],"answer":3,"why":"卡明 1775 年取得 S 形存水彎的專利，用存住的一小段水擋住下水道的臭味。"},{"q":"關於抽水馬桶，下列哪個說法才正確？","options":["湯瑪斯·克拉普主要是推廣者，不是存水彎的發明人","抽水馬桶是克拉普一個人獨力發明的","存水彎其實沒有任何作用","抽水馬桶和城市衛生完全無關"],"answer":0,"why":"克拉普主要是推廣馬桶；S 形存水彎是卡明發明的，能擋臭味、改善衛生。"},{"q":"馬桶裡那段彎彎的「存水彎」，主要作用是什麼？","options":["讓水流得更快","用存住的水擋住臭味與病菌","把馬桶裝飾得更漂亮","把水先加熱再沖掉"],"answer":1,"why":"存水彎存住一小段水，把下水道的臭味和病菌擋在外面，配合下水道改善衛生。"},{"q":"伊萊沙·奧的斯（Elisha Otis）1852 年的關鍵發明，讓蓋高樓大廈變得安全可行，那是什麼？","options":["跑得更快的電梯馬達","透明的玻璃電梯","鋼索斷了也不會墜落的安全裝置","能載更多人的大電梯"],"answer":2,"why":"奧的斯發明防墜安全裝置，就算鋼索斷了也不會摔下去，高樓才敢蓋。"},{"q":"關於「電視」是誰發明的，下列哪個說法最正確？","options":["由多位發明家逐步做出，如貝爾德與法恩斯沃斯","由湯瑪斯·愛迪生一個人發明","由威利斯·開利發明","由休伯特·布思發明"],"answer":0,"why":"電視是多人接力的成果，機械式的貝爾德、電子式的法恩斯沃斯都有貢獻。"},{"q":"1901 年做出用「吸力」來清潔的機器、後來演變成家用吸塵器的是誰？","options":["伊萊沙·奧的斯（Elisha Otis）","威利斯·開利（Willis Carrier）","休伯特·塞西爾·布思（Hubert Cecil Booth）","亞歷山大·卡明（Alexander Cumming）"],"answer":2,"why":"布思1901 年造出用吸力清潔的機器，後來變成家用吸塵器，打掃更輕鬆。"},{"q":"像電冰箱、洗衣機、電視這些家裡的大發明，有一個很重要的共同點是什麼？","options":["都是同一個人在同一天發明出來的","都是最近十年才出現的新東西","多半是很多人接力、不斷改良和普及的成果","它們其實都沒有改變人們的生活"],"answer":2,"why":"很多家電不是一個人一次就發明好，而是多人接力、不斷改良才普及開來。"},{"q":"微波爐能把食物加熱，靠的是什麼原理？","options":["微波讓食物裡的水分子快速振動，吸收能量而發熱","微波把一大團火焰直接送進食物裡","微波先把食物冷凍再退冰","微波用很亮的光把食物曬熟"],"answer":0,"why":"微波會讓食物裡的水分子快速振動、翻轉，把能量變成熱，食物就從裡到外熱起來。"}],"stories":[{"emoji":"❄️","title":"冷氣（空調）Air Conditioner","text":"很久以前，一到夏天大家只能搧扇子、流著滿身汗，工廠裡的機器和紙張還會因為太潮溼而出問題。1902 年，威利斯·開利（Willis Carrier）做出了現代電氣空調，本來是要幫工廠控制空氣裡的溼度。後來人們發現它也能讓房間變涼爽，從此夏天躲在室內就能舒舒服服，讀書、睡覺都更安穩了。"},{"emoji":"📡","title":"微波爐 Microwave Oven","text":"想像一下，肚子餓卻要等很久才能把飯菜熱好，是不是很難受？珀西·斯賓塞（Percy Spencer）本來在研究雷達用的磁控管，有一天他發現口袋裡的巧克力竟然融化了！他因此想到：微波可以加熱食物。這個意外的發現，讓我們今天只要按幾個按鈕，幾分鐘就能吃到熱騰騰的飯菜。"},{"emoji":"🧊","title":"家用電冰箱 Refrigerator","text":"以前沒有冰箱，牛奶和肉放一天就會壞掉，大人只好每天去買菜，很麻煩。電冰箱靠著「壓縮循環」把裡面的熱搬到外面去，讓箱子裡一直保持冰涼。20 世紀初它慢慢走進每個家庭（是很多人一步步改良出來的，不是某一個人發明的），從此食物能保鮮好幾天，比較不會壞掉。"},{"emoji":"🌀","title":"電動洗衣機 Washing Machine","text":"從前洗衣服要蹲在河邊或水槽旁，用手搓、用力擰，一大盆衣服洗下來手都痠了。20 世紀初出現的電動洗衣機，把這件費力的家務變成自動的：把衣服丟進去、按下開關就好。它沒有單一的發明人，但它大大減少了洗衣的時間和辛勞，讓家人有更多時間做別的事。"},{"emoji":"🚽","title":"抽水馬桶的存水彎 S-bend","text":"很久以前，廁所的臭味和病菌會順著管子飄回家裡，讓人又臭又容易生病。1775 年，亞歷山大·卡明（Alexander Cumming）取得了 S 形存水彎的專利：用一段彎管裡的水，像一道門一樣擋住臭味和病菌。再配合城市的下水道，衛生大大改善。（很多人以為是 Thomas Crapper 發明的，其實他主要是推廣者喔。）"},{"emoji":"🛗","title":"安全電梯 Safety Elevator","text":"以前的升降機讓人很害怕，萬一鋼索斷了，整個箱子就會摔下去。1852 年，伊萊沙·奧的斯（Elisha Otis）發明了安全裝置：就算鋼索斷了，電梯也會被卡住、不會墜落。有了這個發明，蓋又高又安全的大樓才變得可行，我們今天才能輕鬆搭電梯上上下下。"},{"emoji":"📺","title":"電視 Television","text":"很久以前，想看外面世界的樣子，只能靠報紙上的照片或聽收音機想像。電視是好幾位發明家一步步做出來的，像機械式的貝爾德，還有電子式的法恩斯沃斯在 1927 年做出成果。它能把影像傳送到家裡的螢幕上，讓全家人坐在一起，就能看到遠方的畫面和故事。"},{"emoji":"🧹","title":"吸塵器 Vacuum Cleaner","text":"以前打掃時，掃把一揮，灰塵就飛得到處都是，讓人一直打噴嚏。1901 年，休伯特·塞西爾·布思（Hubert Cecil Booth）做出了用「吸力」把灰塵吸進機器裡的清潔工具。後來它變成家家戶戶都有的家用電器，讓打掃地板變得又快又輕鬆，家裡也更乾淨了。"}]},{"id":"lv8","level":8,"name":"生活小物與數位便利","emoji":"🧰","color":"#14b8a6","concepts":["日常小物與數位科技如何讓生活更方便","仿生學：向大自然學靈感（魔鬼氈）","發明常來自「意外發現」或「解決小麻煩」","資訊變成圖案/訊號讓機器讀"],"keyFacts":["拉鍊：吉德昂·森貝克（Gideon Sundback）1913 年改良出好用的現代拉鍊，讓衣物、包包開合又快又牢。","原子筆：拉斯洛·比羅（László Bíró）在 1930 年代發明原子筆，用一顆小滾珠帶出墨水，比沾水鋼筆乾淨、不易漏。","便利貼：3M 公司的斯賓塞·席佛做出「黏得住又撕得下」的弱黏膠，同事亞瑟·弗萊想到拿來做可重貼的便條紙，就成了便利貼。","魔鬼氈（Velcro）：喬治·德·梅斯特拉（George de Mestral）觀察黏在衣服和狗毛上的植物種子有小鉤刺，模仿它做出魔鬼氈——這是「仿生學」的好例子。","眼鏡：大約 13 世紀在義大利出現用鏡片矯正視力的眼鏡，讓看不清楚的人能重新看清楚、也能長時間閱讀。","腳踏車：19 世紀逐步發展出用踏板和鏈條帶動輪子的腳踏車，成為便宜、環保、人人都能用的代步工具。","GPS 衛星定位：靠繞著地球的衛星送出訊號，接收器根據訊號算出自己在哪裡；手機導航、找路都靠它。（美國原為軍用，後開放民間使用）","智慧型手機：2007 年蘋果公司推出 iPhone（由賈伯斯帶領的團隊），用觸控螢幕把電話、上網、相機、應用程式合在一起，大大改變了生活。","Wi-Fi：一種無線網路技術，讓手機、電腦不用接線就能上網，家裡、學校、咖啡店到處都能連。","QR 碼：日本 Denso Wave 公司的原昌宏在 1994 年發明，把資訊變成黑白方塊圖案，機器一掃就讀到，用在付款、掃描很方便。","注音符號：1918 年公布，用一套符號標出國語的發音，幫助識字與學習發音，是台灣學中文的重要工具。","保溫瓶：詹姆斯·杜瓦（James Dewar）發明真空保溫瓶，做法是雙層瓶壁中間抽成真空來隔熱，讓熱的保持熱、冰的保持冰。"],"questions":[{"q":"現在衣物、包包上又快又牢的現代拉鍊，是誰在1913 年改良出來的？","options":["拉斯洛·比羅（László Bíró）","詹姆斯·杜瓦（James Dewar）","吉德昂·森貝克（Gideon Sundback）","喬治·德·梅斯特拉（George de Mestral）"],"answer":2,"why":"森貝克在1913 年改良出開合又快又牢的現代拉鍊，其他三人是原子筆、保溫瓶、魔鬼氈的發明者。"},{"q":"拉斯洛·比羅發明的原子筆，靠什麼把墨水帶到紙上？","options":["一根羽毛","筆尖的一顆小滾珠","一塊小海綿","一段細管慢慢吸墨"],"answer":1,"why":"原子筆靠筆尖那顆小滾珠滾動帶出墨水，比沾水鋼筆乾淨、不易漏。"},{"q":"便利貼能「貼上去又撕得下、還能重貼」，關鍵是哪一種膠？","options":["黏得住又撕得下的弱黏膠","一撕就破的強力膠","遇到水才會黏的膠","要加熱才會黏的膠"],"answer":0,"why":"3M的斯賓塞·席佛做出弱黏膠，弗萊想到拿來做可重貼便條紙，就成了便利貼。"},{"q":"魔鬼氈（Velcro）的靈感是從哪裡來的？","options":["蜘蛛結網的絲","蜜蜂築的六角巢","貝殼的螺旋紋路","黏在衣服和狗毛上、有小鉤刺的植物種子"],"answer":3,"why":"梅斯特拉觀察到植物種子的小鉤刺會勾住衣服和狗毛，模仿它做出魔鬼氈，是仿生學的好例子。"},{"q":"用鏡片矯正視力、讓人重新看清楚的眼鏡，大約最早在哪裡出現？","options":["約20世紀的美國","約13世紀的義大利","約公元前的埃及","約18世紀的日本"],"answer":1,"why":"大約13世紀在義大利出現用鏡片矯正視力的眼鏡，讓人能看清楚也能長時間閱讀。"},{"q":"19世紀逐步發展出來的腳踏車，為什麼被說是很棒的代步工具？","options":["便宜、環保、人人都能用","一定要加油才能跑","只有工廠裡才能使用","要接上電線才會動"],"answer":0,"why":"腳踏車用踏板和鏈條帶動輪子，不燒油、不排廢氣，便宜又人人可用。"},{"q":"手機導航能算出「你在哪裡、要往哪走」，主要靠什麼？","options":["地底下的電纜","繞著地球的GPS衛星送出訊號","天上的雲","路邊的路燈"],"answer":1,"why":"GPS靠繞地球的衛星送訊號，接收器根據訊號算出自己的位置，導航就靠它。"},{"q":"2007 年推出iPhone，把電話、上網、相機、應用程式合在一起的是哪家公司？","options":["3M 公司","一家日本汽車公司","蘋果（Apple）公司","Denso Wave公司"],"answer":2,"why":"2007 年蘋果公司（由賈伯斯帶領的團隊）推出iPhone，用觸控螢幕整合多種功能，大大改變了生活。"},{"q":"Wi-Fi 這種技術，讓手機、電腦怎麼上網？","options":["不用接線，用無線網路就能上網","一定要插上網路線","一定要靠衛星才能連","只能在戶外才能用"],"answer":0,"why":"Wi-Fi是無線網路技術，不用接線，家裡、學校、咖啡店到處都能連。"},{"q":"1994 年發明QR碼、把資訊變成黑白方塊圖案的是誰？","options":["日本Denso Wave公司的原昌宏","改良拉鍊的森貝克","發明保溫瓶的杜瓦","發明原子筆的比羅"],"answer":0,"why":"原昌宏在1994 年發明QR碼，機器一掃就讀到資訊，用在付款、掃描很方便。"},{"q":"1918 年公布的注音符號，主要是用來做什麼？","options":["計算數學","標出國語的發音，幫助識字與學發音","畫地圖","測量溫度"],"answer":1,"why":"注音符號用一套符號標出國語發音，幫助識字與學習發音，是台灣學中文的重要工具。"},{"q":"詹姆斯·杜瓦發明的真空保溫瓶，靠什麼讓熱的保持熱、冰的保持冰？","options":["雙層瓶壁中間抽成真空來隔熱","瓶裡裝了電池加熱","塞了很多棉花保溫","瓶身自己會發熱"],"answer":0,"why":"保溫瓶把雙層瓶壁中間抽成真空來隔熱，熱量不易散掉也不易進來。"}],"stories":[{"emoji":"🧥","title":"拉鍊 Zipper","text":"以前衣服和包包要一顆一顆扣鈕扣，趕時間時手忙腳亂，一不小心還會扣錯排。1913 年，吉德昂·森貝克改良出好用的現代拉鍊，用兩排小齒互相咬合，輕輕一拉就開合。今天你的外套、書包、鉛筆盒，全靠它又快又牢地關好。"},{"emoji":"🖊️","title":"原子筆 Ballpoint Pen","text":"從前寫字要一直沾墨水，寫沒幾行就得再沾一次，墨水還常常暈開、弄髒手和紙。1930 年代，拉斯洛·比羅發明了原子筆，筆尖藏著一顆小滾珠，滾一滾就把墨水均勻帶到紙上。現在你上課寫作業、簽名畫畫，一支就能乾淨俐落地寫很久。"},{"emoji":"📝","title":"便利貼 Sticky Note","text":"3M 公司的斯賓塞·席佛本來想做很強的黏膠，卻做出「黏得住又撕得下」的弱黏膠，一時想不到用途。後來同事亞瑟·弗萊靈機一動，拿它做成可以重貼的便條紙，便利貼就誕生了。今天你把它貼在課本、冰箱、電腦上提醒自己，撕下來也不留痕跡——原來一個「失敗」的黏膠，也能變成好幫手。"},{"emoji":"🌿","title":"魔鬼氈 Velcro","text":"喬治·德·梅斯特拉帶狗散步回家，發現一種植物種子牢牢黏在衣服和狗毛上。他好奇地放到顯微鏡下看，才知道種子上有許多小小的鉤刺。他模仿這個構造做出了魔鬼氈：一面是小鉤、一面是小圈，壓一下就黏住。這就是「仿生學」——向大自然學靈感，今天你的鞋子、書包很多都靠它黏合。"},{"emoji":"👓","title":"眼鏡與腳踏車","text":"大約 13 世紀，義大利出現了用鏡片矯正視力的眼鏡，讓看不清楚的人重新看清世界，也能長時間讀書。到了 19 世紀，人們一步步做出用踏板和鏈條帶動輪子的腳踏車。這兩樣看似平凡的小發明，一個幫我們看得清楚，一個讓人人都能便宜、環保地到處跑。"},{"emoji":"📱","title":"智慧型手機、Wi-Fi 與 GPS","text":"以前打電話、上網、拍照、找路，要用好幾樣不同的機器。2007 年，蘋果公司在賈伯斯帶領的團隊下推出 iPhone，用觸控螢幕把電話、相機、上網和各種應用程式合在一起。搭配讓機器不用接線就能上網的 Wi-Fi，和靠繞地球的衛星送訊號來算出你在哪裡的 GPS，現在一支手機就能導航、查資料、和朋友聯絡。"},{"emoji":"🔳","title":"QR 碼 QR Code","text":"日本 Denso Wave 公司的原昌宏在 1994 年發明了 QR 碼，把資訊變成一格一格的黑白方塊圖案。機器或手機相機一掃，馬上就能讀出裡面藏的內容。今天你付款、掃菜單、連結網頁，只要對準那個小方塊「嗶」一下就完成，又快又方便。"},{"emoji":"🔤","title":"注音符號","text":"要學一個字怎麼念，如果沒有一套標音的辦法，只能靠別人一個一個教。1918 年公布的注音符號，用一套符號把國語的發音標出來。今天在台灣，小朋友就是靠它學認字、學正確發音，打字時也常用它，是學中文很重要的好工具。"},{"emoji":"🥤","title":"保溫瓶 Thermos","text":"熱湯很快就涼、冰水一下子就變溫，出門在外想喝到剛剛好的溫度好難。詹姆斯·杜瓦發明了真空保溫瓶：在雙層瓶壁中間抽成真空，讓熱不容易跑進跑出。因為真空能隔熱，熱的能保持熱、冰的能保持冰。今天你帶去學校的水壺，就是用這個聰明的辦法幫你保溫。"}]}];

          '<div class="ma-level-top">' +
            '<span class="ma-level-emoji" aria-hidden="true" style="background:' + lv.color + '22;color:' + lv.color + '">' + lv.emoji + '</span>' +
            '<div>' +
              '<div class="ma-level-num">等級 ' + lv.level + '</div>' +
              '<div class="ma-level-name">' + lv.name + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="ma-level-concepts">' + lv.concepts.join('・') + '</div>' +
          '<div class="ma-level-foot">' +
            '<span class="ma-level-status ' + (done ? 'done' : 'todo') + '">' +
              (done ? '✅ 已完成（最佳 ' + (rec.best || 0) + '/' + total + '）' : '▶️ 開始挑戰（共 ' + total + ' 題）') + '</span>' +
            '<span class="ma-level-stars" aria-hidden="true">' + (done ? starStr(st) : '') + '</span>' +
          '</div>';
        card.addEventListener('click', function () { startLevel(lv); });
        levelList.appendChild(card);
      })(LEVELS[u]);
    }
  }

  function show(screen) {
    screenMenu.classList.remove('active');
    screenPlay.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0, 0);
  }

  function startLevel(lv) {
    cur = { level: lv, idx: 0, correctCount: 0, phase: 'brief' };
    playTitle.textContent = lv.emoji + ' 等級 ' + lv.level + '・' + lv.name;
    show(screenPlay);
    renderBrief();
  }

  function renderStepDots() {
    stepDots.innerHTML = '';
    if (cur.phase !== 'quiz') return;
    for (var i = 0; i < cur.level.questions.length; i++) {
      var b = document.createElement('i');
      if (i < cur.idx) b.className = 'on';
      else if (i === cur.idx) b.className = 'cur';
      stepDots.appendChild(b);
    }
  }

  function renderBrief() {
    renderStepDots();
    var lv = cur.level;
    var facts = '';
    for (var i = 0; i < lv.keyFacts.length; i++) {
      facts += '<li><span class="ma-kf-dot" aria-hidden="true">◆</span><span>' + lv.keyFacts[i] + '</span></li>';
    }
    var hasStories = lv.stories && lv.stories.length;
    var storiesHtml = '';
    if (hasStories) {
      var cards = '';
      for (var s = 0; s < lv.stories.length; s++) {
        var st = lv.stories[s];
        cards += '<div class="ma-story-card"><div class="ma-story-emoji" aria-hidden="true">' + st.emoji + '</div>' +
          '<div class="ma-story-body"><div class="ma-story-title">' + st.title + '</div>' +
          '<div class="ma-story-text">' + st.text + '</div></div></div>';
      }
      storiesHtml = '<h3 class="ma-sec-h">先認識這些人與發明 📖</h3><div class="ma-stories">' + cards + '</div>' +
        '<h3 class="ma-sec-h">這一級的重點 ✅</h3>';
    }
    stage.innerHTML =
      '<div class="ma-stage ma-brief">' +
        '<div class="ma-visual" aria-hidden="true">' + lv.emoji + '</div>' +
        '<h2>等級 ' + lv.level + '・' + lv.name + '</h2>' +
        '<p class="ma-brief-sub">' + (hasStories ? '先認識這些人的故事，再開始 ' : '先看看這一級的重點，再開始 ') + lv.questions.length + ' 題挑戰。</p>' +
        storiesHtml +
        '<ul class="ma-keyfacts">' + facts + '</ul>' +
      '</div>' +
      '<div class="ma-actions">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-start">開始挑戰 ➡️</button>' +
      '</div>';
    $('btn-start').addEventListener('click', function () { cur.phase = 'quiz'; cur.idx = 0; renderQuestion(); });
  }

  function next() {
    cur.idx++;
    if (cur.idx >= cur.level.questions.length) finishLevel();
    else renderQuestion();
  }

  function renderQuestion() {
    renderStepDots();
    var lv = cur.level;
    var step = lv.questions[cur.idx];

    var order = [];
    for (var oi = 0; oi < step.options.length; oi++) order.push(oi);
    for (var m = order.length - 1; m > 0; m--) {
      var r = Math.floor(Math.random() * (m + 1));
      var tt = order[m]; order[m] = order[r]; order[r] = tt;
    }
    var optsHtml = '';
    for (var k = 0; k < order.length; k++) {
      var origIdx = order[k];
      optsHtml += '<button type="button" class="ma-opt" data-i="' + origIdx + '">' +
        '<span>' + step.options[origIdx] + '</span><span class="ma-opt-mark" aria-hidden="true"></span></button>';
    }

    stage.innerHTML =
      '<div class="ma-stage">' +
        '<div class="ma-visual" aria-hidden="true">' + lv.emoji + '</div>' +
        '<p class="ma-question">第 ' + (cur.idx + 1) + ' / ' + lv.questions.length + ' 題　' + step.q + '</p>' +
        '<div class="ma-options">' + optsHtml + '</div>' +
        '<div class="ma-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="ma-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button>' +
      '</div>';

    var answered = false;
    var btns = stage.querySelectorAll('.ma-opt');

    function revealAndLock(correct) {
      var rev = $('reveal');
      rev.textContent = (correct ? '答對了！' : '再想想～正確答案是這個！') + (step.why || '');
      rev.classList.add('show');
      $('afteract').style.display = 'flex';
      var all = stage.querySelectorAll('.ma-opt');
      for (var a = 0; a < all.length; a++) all[a].disabled = true;
    }

    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var i = parseInt(this.getAttribute('data-i'), 10);
        var isCorrect = (i === step.answer);
        if (answered) return;
        answered = true;
        // 維持每日連續學習 streak（不計 XP、不重複計分）；同日 idempotent。
        if (window.Game && typeof Game.pingActive === 'function') { try { Game.pingActive(); } catch (e) {} }
        if (isCorrect) {
          this.classList.add('correct');
          this.querySelector('.ma-opt-mark').textContent = '✅';
          cur.correctCount++;
          revealAndLock(true);
        } else {
          this.classList.add('wrong');
          this.querySelector('.ma-opt-mark').textContent = '❌';
          var correctBtn = stage.querySelector('.ma-opt[data-i="' + step.answer + '"]');
          if (correctBtn) {
            correctBtn.classList.add('correct');
            correctBtn.querySelector('.ma-opt-mark').textContent = '✅';
          }
          revealAndLock(false);
        }
      });
    }

    $('btn-next').addEventListener('click', next);
  }

  function finishLevel() {
    var lv = cur.level;
    var total = lv.questions.length;
    var got = cur.correctCount;

    var prev = progress[lv.id] || {};
    progress[lv.id] = { done: true, best: Math.max(prev.best || 0, got) };
    saveProg(progress);

    awardBadge(lv.id);
    var allDone = true;
    for (var i = 0; i < LEVELS.length; i++) if (!(progress[LEVELS[i].id] && progress[LEVELS[i].id].done)) { allDone = false; break; }
    if (allDone) awardBadge('all');

    var st = starsFor(got, total);
    stage.innerHTML =
      '<div class="ma-stage ma-done">' +
        '<div class="ma-done-emoji" aria-hidden="true">🎉</div>' +
        '<div class="ma-done-title">完成「' + lv.name + '」！</div>' +
        '<div class="ma-done-stars" aria-label="得到 ' + st + ' 顆星">' + starStr(st) + '</div>' +
        '<p class="ma-question" style="font-size:clamp(16px,3.6vw,19px);text-align:center">你答對了 ' + got + ' / ' + total + ' 題，真棒！</p>' +
      '</div>' +
      '<div class="ma-actions">' +
        '<button type="button" class="btn" id="btn-menu">回到選單</button>' +
        (nextLevelOf(lv) ? '<button type="button" class="btn btn-primary" id="btn-nextlv">下一個等級 ➡️</button>' : '') +
      '</div>';

    toast('完成「' + lv.name + '」！你答對了 ' + got + ' / ' + total + ' 題，真棒！', 'daily');

    $('btn-menu').addEventListener('click', goMenu);
    var nl = nextLevelOf(lv);
    if (nl) $('btn-nextlv').addEventListener('click', function () { startLevel(nl); });
  }

  function nextLevelOf(lv) {
    for (var i = 0; i < LEVELS.length; i++) { if (LEVELS[i].id === lv.id) return LEVELS[i + 1] || null; }
    return null;
  }

  function goMenu() { cur = null; stepDots.innerHTML = ''; renderMenu(); show(screenMenu); }

  $('btn-back').addEventListener('click', goMenu);

  window.__innovAdv = { LEVELS: LEVELS, BADGES: BADGES, getProgress: function () { return progress; } };

  renderMenu();
})();
</script>

<!-- ===== 改變世界徽章冊：樣式 ===== -->
<style>
#innovAdvBadgeFab {
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 55; display: inline-flex; align-items: center; gap: 6px;
  min-height: 48px; min-width: 48px; padding: 10px 16px;
  background: #9a3412; color: #fff; border: none;  /* 深橙底白字，兩主題同值皆過 AA */
  border-radius: 999px; font-family: var(--font); font-weight: 800;
  font-size: clamp(14px, 3vw, 16px); cursor: pointer; box-shadow: var(--shadow-lg);
}
#innovAdvBadgeFab:active { transform: scale(0.96); }
#innovAdvBadgeFabCount { display: inline-flex; align-items: center; gap: 3px; background: #fff; color: #9a3412; border-radius: 999px; padding: 1px 8px; font-size: 13px; font-weight: 800; }
.ma-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
#innovAdvBadgeOverlay[hidden] { display: none !important; }
.ma-card { position: relative; background: var(--card); border: 2px solid var(--card-border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 20px 18px 22px; color: var(--ink); }
.ma-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ma-card-head h1 { font-size: clamp(1.1rem, 4vw, 1.4rem); font-weight: 800; margin: 0; color: var(--ink); flex: 1; }
.ma-card-back { background: var(--card); border: 2px solid var(--card-border); color: var(--accent-ink, var(--ink)); font-family: var(--font); font-weight: 800; font-size: 15px; cursor: pointer; min-height: 44px; padding: 8px 14px; border-radius: 14px; }
.ma-card-back:active { transform: scale(0.96); }
.ma-card-note { background: var(--accent-tint); color: var(--ink); border-radius: var(--r-md, 12px); font-size: var(--fs-small); font-weight: 600; line-height: 1.7; padding: 10px 12px; margin: 4px 0 12px; }
.ma-card-summary { text-align: center; font-size: var(--fs-small); font-weight: 700; color: var(--ink-soft); margin: 4px 0 14px; line-height: 1.7; }
.ma-badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
.ma-badge { position: relative; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 14px; background: var(--card); border: 2px solid var(--card-border); text-align: center; padding: 10px 6px; }
.ma-badge .ma-badge-glyph { font-size: clamp(1.6rem, 7vw, 2rem); line-height: 1; }
.ma-badge .ma-badge-name { font-size: clamp(0.6rem, 2.6vw, 0.74rem); font-weight: 800; color: var(--ink); line-height: 1.2; }
.ma-badge .ma-badge-state { font-size: clamp(0.52rem, 2.2vw, 0.64rem); font-weight: 700; color: var(--ink-soft); }
.ma-badge.locked { border-style: dashed; opacity: 0.5; filter: grayscale(1); }
.ma-badge.unlocked { box-shadow: 0 0 0 2px #f5b301, 0 0 10px rgba(245,179,1,0.5); background: color-mix(in srgb, #f5b301 12%, var(--card)); }
.ma-badge.unlocked .ma-badge-star { position: absolute; right: 5px; top: 4px; font-size: 14px; }
</style>
<script>
(function () {
  'use strict';
  function api() { return window.__innovAdv || null; }
  function unlockedCount() {
    var a = api(); if (!a) return 0;
    var prog = a.getProgress(); var n = 0;
    for (var i = 0; i < a.BADGES.length; i++) if (prog.badges[a.BADGES[i].id]) n++;
    return n;
  }
  function renderGrid() {
    var a = api(); if (!a) return;
    var prog = a.getProgress();
    var host = document.getElementById('innovAdvBadgeGrid');
    if (!host) return;
    var html = '';
    for (var i = 0; i < a.BADGES.length; i++) {
      var def = a.BADGES[i];
      var got = !!prog.badges[def.id];
      var cls = 'ma-badge ' + (got ? 'unlocked' : 'locked');
      var glyph = got ? def.icon : '🔒';
      var state = got ? '已收集' : '尚未解鎖';
      var star = got ? '<span class="ma-badge-star" aria-hidden="true">★</span>' : '';
      var label = def.name + '（' + state + '）';
      html += '<div class="' + cls + '" title="' + label + '" aria-label="' + label + '">' +
        '<span class="ma-badge-glyph" aria-hidden="true">' + glyph + '</span>' +
        '<span class="ma-badge-name">' + def.name + '</span>' +
        '<span class="ma-badge-state">' + state + '</span>' + star + '</div>';
    }
    host.innerHTML = html;
  }
  function renderSummary() {
    var a = api(); if (!a) return;
    var el = document.getElementById('innovAdvBadgeSummary');
    if (!el) return;
    el.innerHTML = '已收集 <b>' + unlockedCount() + '</b> / ' + a.BADGES.length + ' 枚徽章（收藏只增不減，慢慢玩就好）';
  }
  function updateFabCount() {
    var a = api(); if (!a) return;
    var badge = document.getElementById('innovAdvBadgeFabCount');
    if (badge) badge.textContent = unlockedCount() + '/' + a.BADGES.length;
  }
  function refresh() { updateFabCount(); if (isOpen()) { renderGrid(); renderSummary(); } }
  function isOpen() { var el = document.getElementById('innovAdvBadgeOverlay'); return el && !el.hidden; }
  function openBook() { renderGrid(); renderSummary(); var o = document.getElementById('innovAdvBadgeOverlay'); if (o) o.hidden = false; }
  function closeBook() { var o = document.getElementById('innovAdvBadgeOverlay'); if (o) o.hidden = true; }
  function buildDom() {
    var host = document.createElement('div');
    host.innerHTML =
      '<button id="innovAdvBadgeFab" type="button" aria-label="打開改變世界徽章冊" onclick="InnovAdvBadges.openBook()">' +
        '🏅 徽章冊 <span id="innovAdvBadgeFabCount">0/9</span></button>' +
      '<div id="innovAdvBadgeOverlay" class="ma-overlay" hidden>' +
        '<div class="ma-card" role="dialog" aria-modal="true" aria-label="改變世界徽章冊">' +
          '<div class="ma-card-head"><h1>🏅 改變世界徽章冊</h1>' +
            '<button class="ma-card-back" onclick="InnovAdvBadges.closeBook()">← 返回</button></div>' +
          '<div class="ma-card-note">這本徽章冊只存在你自己的裝置上，純粹紀念你完成過哪些進階等級。它不會計入學習基地的等級或經驗值——放輕鬆挑戰就好 🌱</div>' +
          '<div id="innovAdvBadgeSummary" class="ma-card-summary"></div>' +
          '<div id="innovAdvBadgeGrid" class="ma-badge-grid"></div>' +
        '</div></div>';
    while (host.firstChild) document.body.appendChild(host.firstChild);
  }
  window.InnovAdvBadges = { openBook: openBook, closeBook: closeBook, refresh: refresh };
  function boot() { buildDom(); updateFabCount(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
