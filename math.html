function renderDailyFractionInput(container, q) {
  const inputDisplay = document.createElement('div');
  inputDisplay.className = 'numpad-input';
  inputDisplay.id = 'daily-numpad-display';
  inputDisplay.textContent = '';
  container.appendChild(inputDisplay);

  const hint = document.createElement('div');
  hint.style.cssText = 'text-align:center;color:var(--ink);font-size:13px;margin-bottom:12px;';
  hint.textContent = '輸入格式: 分子/分母';
  container.appendChild(hint);

  const numpad = document.createElement('div');
  numpad.className = 'numpad';

  const layout = ['7','8','9','⌫','4','5','6','C','1','2','3','/','','0','','✓'];

  layout.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'numpad-btn';
    if (key === '✓') btn.className += ' submit';
    if (key === '⌫') btn.className += ' backspace';
    btn.textContent = key;
    btn.style.visibility = key === '' ? 'hidden' : 'visible';

    btn.onclick = () => {
      playSound('click');
      const display = document.getElementById('daily-numpad-display');
      if (!display) return;

      if (key === '⌫') {
        display.textContent = display.textContent.slice(0, -1);
      } else if (key === 'C') {
        display.textContent = '';
      } else if (key === '✓') {
        const val = display.textContent.trim();
        if (!val) return;
        if (numpad.dataset.locked) return;  // 單題作答鎖：防 600ms 換題前 ✓ 連點重複計分/前進
        numpad.dataset.locked = '1';
        let correct = false;
        if (val.includes('/')) {
          const parts = val.split('/');
          const userNum = parseInt(parts[0]);
          const userDen = parseInt(parts[1]);
          if (!isNaN(userNum) && !isNaN(userDen) && userDen !== 0) {
            const userG = gcd(Math.abs(userNum), Math.abs(userDen));
            correct = (userNum/userG === q.answerNum && userDen/userG === q.answerDen);
          }
        } else {
          const num = parseInt(val);
          if (!isNaN(num) && q.answerDen === 1) correct = (num === q.answerNum);
        }
        gameRecord(correct);
        if (correct) dailyState.score += 10; dailyState.results.push(!!correct);
        playSound(correct ? 'correct' : 'wrong');
        setTimeout(() => { dailyState.current++; renderDailyQuestion(); }, 600);
      } else if (key === '/') {
        if (!display.textContent.includes('/')) display.textContent += key;
      } else {
        display.textContent += key;
      }
    };

    numpad.appendChild(btn);
  });

  container.appendChild(numpad);
}

function endDaily() {
  dailyState.active = false;
  if (dailyState.interval) {
    clearInterval(dailyState.interval);
    dailyState.interval = null;
  }

  const today = new Date().toISOString().split('T')[0];
  const prevBest = (state.daily[today] && state.daily[today].best) || 0;
  const newBest = Math.max(dailyState.score, prevBest);
  state.daily[today] = { score: dailyState.score, best: newBest };
  saveState();

  // Show result
  const card = document.getElementById('result-card');
  card.innerHTML = `
    <div class="result-stars">⚡</div>
    <div class="result-title">每日挑戰完成！</div>
    <div class="result-stats">
      本次得分: ${dailyState.score}<br>
      今日最佳: ${newBest}<br>
      回答: ${dailyState.current} / 10
    </div>
    <div style="font-size:var(--fs-small);color:var(--ink-soft);line-height:1.5;margin:4px 0 8px;">😊 純屬好玩，時間到就結束，不影響你的學習進度</div>
    <div class="result-buttons">
      <button class="btn btn-primary" onclick="showScreen('home')">← 返回</button>
      <button class="btn btn-success" onclick="startDaily()">🔄 再挑戰</button>
    </div>
  `;

  showScreen('result');
  if (dailyState.score >= 80) {
    playSound('levelup');
    launchConfetti();
  }
}

  }

}

function practiceWrong() {
  if (state.wrong.length === 0) return;

  // Generate questions from wrong book
  const wrongItems = shuffle(state.wrong).slice(0, 10);
  const questions = wrongItems.map(item => {
    // Try to regenerate a similar question
    const level = item.level - 1;
    const stage = item.stage - 1;
    return generateQuestion(level, stage);
  });

  gameState = {
    level: -1,
    stage: -1,
    questions: questions,
    current: 0,
    errors: 0,
    combo: 0,
    maxCombo: 0,
    expEarned: 0,
    answers: []
  };

  document.getElementById('game-title').textContent = '📕 錯題練習';
  document.getElementById('screen-game').style.background = '';

  showScreen('game');
  renderQuestion();
}

function clearWrongBook() {
  if (confirm('確定要清空錯題本嗎？')) {
    state.wrong = [];
    saveState();
    renderWrongBook();
  }
}

  loadState();

  }
}

// Override toggleSound to save preference
const originalToggleSound = toggleSound;
window.toggleSound = function() {
  soundEnabled = !soundEnabled;
  var b = document.getElementById('btn-sound');
  b.textContent = soundEnabled ? '🔊' : '🔇';
  b.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
  localStorage.setItem('math_sound', soundEnabled ? 'on' : 'off');
};

// Initialize
init();
</script>

     BOSS 戰模組（自足 style + script；獨立 localStorage key

/* ---- 王之殿堂 ---- */
.boss-map-grid { padding-bottom: 80px; }
.boss-card {

}
.boss-card-name { font-size: var(--fs-h3, 1.1rem); font-weight: 800; color: var(--ink); }
.boss-card-level { font-size: var(--fs-small, 0.85rem); color: var(--ink-soft); margin: 4px 0 12px; }
.boss-card-status { font-size: var(--fs-small, 0.85rem); font-weight: 700; color: var(--ink-soft); }
.boss-card-status .crown { color: var(--c-coin-ink); display: block; margin-bottom: 8px; }  /* 有意義狀態文字『👑 已擊敗・最少 N 題』；原硬碼 #f59e0b 亮色 2.06:1 未達 AA→主題感知 --c-coin-ink(亮 5.15:1/暗 F2CD79) */

/* 關卡選單「挑戰王」鈕：跨滿整列 */
.boss-challenge-btn { grid-column: 1 / -1; width: 100%; }
/* 首頁「王之殿堂」入口鈕 */
#boss-hall-entry { display: block; width: 100%; margin: var(--s3, 12px) 0 var(--s4, 16px); }

/* reduce-motion 尊重 */
.boss-reduce .boss-portrait, .boss-reduce .boss-hp-fill,
.boss-reduce .boss-dmg-float { animation: none !important; transition: none !important; }
</style>

<script>
(function () {
  'use strict';
  var KEY = 'math_boss_v1';

  // 7 隻 BOSS，一級一隻（level 為 0-based，對映 LEVELS[i] 與 generateQuestions 的 level）
  var BOSSES = [
    // HP 上限刻意 ≤158（單場10題滿連擊上限傷害＝205）：確保每關 BOSS 皆可擊敗；
    // 高階關卡的挑戰來自「題目更難答對」而非血量灌爆（原 l9–l12 血量 200–245 > 205 最大傷害＝數學上永遠打不死，已修）。
    { id:'boss_l1', level:0, name:'小算術獸', emoji:'🐣', color:'#22c55e', hp:70 },
    { id:'boss_l2', level:1, name:'進位小龍', emoji:'🐉', color:'#3b82f6', hp:85 },
    { id:'boss_l3', level:2, name:'換算精靈', emoji:'🧚', color:'#f59e0b', hp:98 },
    { id:'boss_l4', level:3, name:'披薩分數獸', emoji:'🍕', color:'#ef4444', hp:110 },
    { id:'boss_l5', level:4, name:'小數泡泡怪', emoji:'🫧', color:'#8b5cf6', hp:120 },
    { id:'boss_l6', level:5, name:'圓環守衛', emoji:'🛞', color:'#ec4899', hp:128 },
    { id:'boss_l7', level:6, name:'代數石像', emoji:'🗿', color:'#14b8a6', hp:135 },
    { id:'boss_l8', level:7, name:'方程魔導士', emoji:'⚖️', color:'#0ea5e9', hp:141 },
    { id:'boss_l9', level:8, name:'比例雙子', emoji:'🧮', color:'#f97316', hp:146 },
    { id:'boss_l10', level:9, name:'二次曲龍', emoji:'🎯', color:'#a855f7', hp:150 },
    { id:'boss_l11', level:10, name:'幾何巨像', emoji:'📐', color:'#e11d48', hp:154 },
    { id:'boss_l12', level:11, name:'機率之神', emoji:'📊', color:'#6366f1', hp:158 }
  ];
  // 首次擊敗獎勵（單次 guarded，遞增）
  var BOUNTY = { boss_l1:40, boss_l2:50, boss_l3:60, boss_l4:70, boss_l5:80, boss_l6:90, boss_l7:120, boss_l8:140, boss_l9:160, boss_l10:180, boss_l11:200, boss_l12:220 };
  // 傷害曲線：dmg(combo)=DMG_BASE + min(combo-1,COMBO_CAP)*DMG_STEP
  var DMG_BASE = 10, DMG_STEP = 3, COMBO_CAP = 5;

  var HIT_MSG = ['命中！', '漂亮的一擊！', '連擊越高、傷害越大 🔥'];
  var MISS_MSG = ['沒關係，想清楚再出手！', 'BOSS 閃過了，下一題再來！', '慢慢算，你可以的 💪'];

  var data = null;
  var fight = null; // { boss, maxHp, hp, correctHits, startMs }

  function nowISO() { return new Date().toISOString(); }
  function byId(id) { for (var i = 0; i < BOSSES.length; i++) if (BOSSES[i].id === id) return BOSSES[i]; return null; }
  function bossForLevel(level) { for (var i = 0; i < BOSSES.length; i++) if (BOSSES[i].level === level) return BOSSES[i]; return null; }
  function dmg(combo) { return DMG_BASE + Math.min(Math.max(combo, 1) - 1, COMBO_CAP) * DMG_STEP; }
  function grade(level) { try { if (typeof LEVELS !== 'undefined' && LEVELS[level]) return LEVELS[level].grade; } catch (e) {} return ''; }
  function reduceMotion() {
    try { return !!(window.Game && Game.getProfile && Game.getProfile().settings && Game.getProfile().settings.reduceMotion); } catch (e) { return false; }
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function grad(color) { return 'radial-gradient(circle at 35% 30%, color-mix(in srgb, ' + color + ' 45%, #fff), ' + color + ')'; }

  // ---------- 持久化（獨立 key；照 Stardex 範式）----------
  function fresh() { return { version:1, createdAt: nowISO(), updatedAt: nowISO(), defeated:{}, best:{}, awarded:{} }; }
  function normalize() {
    if (!data.defeated) data.defeated = {};
    if (!data.best) data.best = {};
    if (!data.awarded) data.awarded = {};
  }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) {}
    if (raw) {
      try { var p = JSON.parse(raw); if (p && typeof p === 'object') { data = p; normalize(); return; } } catch (e) {}
    }
    data = fresh();
    migrate();   // 一次性：把已 3 星的 BOSS混合 標記為 defeated + awarded guard（不補發 XP）
    save();
  }
  function migrate() {
    try {
      if (typeof state === 'undefined' || !state || !state.progress || !state.progress.stars) return;
      var stars = state.progress.stars;
      for (var i = 0; i < BOSSES.length; i++) {
        var b = BOSSES[i];
        var key = (b.level + 1) + '-5'; // BOSS混合 = 第 5 子關
        if ((stars[key] || 0) >= 3) {
          data.defeated[b.id] = { firstDefeatedAt: nowISO(), times: 1 };
          data.awarded[b.id] = true; // 只設 guard，不發 XP（避免老玩家一載入爆量領獎）
        }
      }
    } catch (e) {}
  }
  function save() {
    if (!data) return;
    data.updatedAt = nowISO();
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  function updateBest(bid, qUsed, combo, acc, victory) {
    if (!data.best) data.best = {};
    var b = data.best[bid] || {};
    if (victory) b.fewestQuestions = (b.fewestQuestions == null) ? qUsed : Math.min(b.fewestQuestions, qUsed);
    b.maxCombo = Math.max(b.maxCombo || 0, combo || 0);
    b.bestAccuracy = Math.max(b.bestAccuracy || 0, acc || 0);
    data.best[bid] = b;
  }

  // ---------- HUD ----------
  function el(id) { return document.getElementById(id); }
  function showBossHud(boss) {
    var hud = el('boss-hud'); if (!hud) return;
    var pr = el('boss-portrait');
    if (pr) pr.style.background = grad(boss.color);
    var em = el('boss-portrait-emoji'); if (em) em.textContent = boss.emoji;
    var nm = el('boss-hud-name'); if (nm) nm.textContent = boss.name + ' HP';
    var fill = el('boss-hp-fill');
    if (fill) { fill.style.background = boss.color; fill.style.width = '100%'; }
    var bar = el('boss-hp-bar');
    if (bar) { bar.setAttribute('aria-valuemax', String(boss.hp)); bar.setAttribute('aria-valuenow', String(boss.hp)); }
    var num = el('boss-hp-num'); if (num) num.textContent = boss.hp + ' / ' + boss.hp;
    hud.classList.toggle('boss-reduce', reduceMotion());
    hud.hidden = false;
  }
  function hideBossHud() { var hud = el('boss-hud'); if (hud) hud.hidden = true; }
  function updateHpBar() {
    if (!fight) return;
    var pct = Math.max(0, (fight.hp / fight.maxHp) * 100);
    var fill = el('boss-hp-fill'); if (fill) fill.style.width = pct + '%';
    var bar = el('boss-hp-bar'); if (bar) bar.setAttribute('aria-valuenow', String(fight.hp));
    var num = el('boss-hp-num'); if (num) num.textContent = fight.hp + ' / ' + fight.maxHp;
  }
  function floatDamage(d) {
    var pr = el('boss-portrait'); if (!pr) return;
    var f = document.createElement('div');
    f.className = 'boss-dmg-float';
    f.textContent = '-' + d;
    pr.appendChild(f);
    setTimeout(function () { try { f.remove(); } catch (e) {} }, 750);
  }
  function faceAnim(face, boss) {
    var pr = el('boss-portrait'), em = el('boss-portrait-emoji');
    if (pr) { pr.classList.remove('shake'); void pr.offsetWidth; pr.classList.add('shake'); }
    if (em) {
      em.textContent = face;
      setTimeout(function () { try { em.textContent = boss ? boss.emoji : em.textContent; } catch (e) {} }, 420);
    }
  }

  // ---------- 進場 ----------
  function start(bossId) {
    var boss = byId(bossId); if (!boss) return;
    if (!data) load();
    closeVictory();
    var L = boss.level;
    var qs = [];
    try { if (typeof generateQuestions === 'function') qs = generateQuestions(L, 4, 10); } catch (e) { qs = []; }
    // 重建 gameState（新增 boss 欄位；既有正常關卡不設此欄，故互不干擾）
    gameState = { level: L, stage: 4, questions: qs, current: 0, errors: 0, combo: 0, maxCombo: 0, expEarned: 0, answers: [], boss: bossId };
    fight = { boss: bossId, maxHp: boss.hp, hp: boss.hp, correctHits: 0, startMs: Date.now() };
    try { var t = el('game-title'); if (t) t.textContent = '⚔️ ' + boss.name; } catch (e) {}
    showBossHud(boss);
    try { if (typeof showScreen === 'function') showScreen('game'); } catch (e) {}
    try { if (typeof renderQuestion === 'function') renderQuestion(); } catch (e) {}
  }

  // ---------- 每答一題（processAnswer 末端 hook；combo 已結算）----------
  function onAnswer(correct, combo, q) {
    if (!fight) return;
    var boss = byId(fight.boss);
    if (correct) {
      var d = dmg(combo);
      fight.hp = Math.max(0, fight.hp - d);
      fight.correctHits++;
      updateHpBar();
      floatDamage(d);
      faceAnim('😵', boss);           // 受擊表情（音效由既有 processAnswer 播放，避免重複）
      if (fight.hp <= 0) {
        // 提前擊敗：把 current 設 999，讓既有 setTimeout 內 current++>=10 觸發 finishStage
        try { gameState.current = 999; } catch (e) {}
      }
    } else {
      faceAnim('😤', boss);           // BOSS 反擊純視覺演出
      try { if (window.Game && Game.showToast) Game.showToast(pick(MISS_MSG), 'info'); } catch (e) {}
    }
  }

  // ---------- 結算（finishStage 頂端 hook：return MathBoss.finishBattle()）----------
  function finishBattle() {
    var bid = (fight && fight.boss) || (gameState && gameState.boss);
    var boss = byId(bid);
    var victory = !!(fight && fight.hp <= 0);
    var qUsed = (gameState && gameState.answers && gameState.answers.length) || 0;
    var correctCount = fight ? fight.correctHits : 0;
    var acc = qUsed > 0 ? Math.round((correctCount / qUsed) * 100) : 0;
    var combo = (gameState && gameState.maxCombo) || 0;
    var first = false;

    if (!data) load();
    if (boss) {
      if (victory) {
        first = !(data.defeated && data.defeated[bid]);
        if (!data.defeated) data.defeated = {};
        if (data.defeated[bid]) data.defeated[bid].times = (data.defeated[bid].times || 0) + 1;
        else data.defeated[bid] = { firstDefeatedAt: nowISO(), times: 1 };
        updateBest(bid, qUsed, combo, acc, true);
        save();
        // 首勝：先落地 guard → save → 再單次 Game.award（程序中斷也不重領）
        if (!data.awarded) data.awarded = {};
        if (!data.awarded[bid]) {
          data.awarded[bid] = true;
          save();
          var bounty = BOUNTY[bid] || 0;
          try { if (window.Game && Game.award) Game.award('math', bounty, { silent: true, source: 'boss-defeat', boss: bid }); } catch (e) {}
          try { if (window.Game && Game.showToast) Game.showToast('擊敗「' + boss.name + '」！獲得 ' + bounty + ' 經驗值 🏆', 'success'); } catch (e) {}
        }
        try { if (typeof launchConfetti === 'function') launchConfetti(); } catch (e) {}
        try { if (typeof playSound === 'function') playSound('levelup'); } catch (e) {}
      } else {
        updateBest(bid, qUsed, combo, acc, false); // 敗場仍記 maxCombo / accuracy
        save();
      }
    }
    showVictory(boss, victory, qUsed, combo, first);
    hideBossHud();
    try { delete gameState.boss; } catch (e) {} // 還原，避免污染後續正常關卡
    fight = null;
  }

  // ---------- 勝利 / 戰敗浮層 ----------
  function showVictory(boss, victory, qUsed, combo, first) {
    var card = el('boss-victory-card'); if (!card) return;
    var bid = boss ? boss.id : '';
    var name = boss ? boss.name : 'BOSS';
    var bounty = BOUNTY[bid] || 0;
    var html = '';
    if (victory) {
      html += '<div class="boss-victory-emoji">👑</div>';
      html += '<div class="boss-victory-title">擊敗「' + name + '」！</div>';
      if (first) html += '<div class="boss-victory-sub">你用了 ' + qUsed + ' 題就打倒牠，太強了！最高連擊 ×' + combo + '</div>';
      else html += '<div class="boss-victory-sub">再次擊敗！你越來越熟練了 ✨<br>這次用了 ' + qUsed + ' 題・最高連擊 ×' + combo + '</div>';
      if (first && bounty > 0) html += '<div class="boss-victory-bounty">擊敗獎勵 +' + bounty + ' 經驗值 🏆</div>';
      html += '<div class="boss-victory-btns">' +
        '<button class="btn btn-primary" onclick="MathBoss.start(\'' + bid + '\')">🔄 再戰一場</button>' +
        '<button class="btn btn-secondary" onclick="MathBoss.closeVictory();showScreen(\'boss-map\')">🏰 回王之殿堂</button>' +
        '<button class="btn btn-secondary" onclick="MathBoss.closeVictory();showScreen(\'home\')">← 回首頁</button>' +
        '</div>';
    } else {
      html += '<div class="boss-victory-emoji">🌀</div>';
      html += '<div class="boss-victory-title">這次 BOSS 溜走了</div>';
      html += '<div class="boss-victory-sub">差一點點！剛剛答對的都算數，再挑戰一次一定行！</div>';
      html += '<div class="boss-victory-btns">' +
        '<button class="btn btn-primary" onclick="MathBoss.start(\'' + bid + '\')">💪 再挑戰</button>' +
        '<button class="btn btn-secondary" onclick="MathBoss.closeVictory();showScreen(\'boss-map\')">← 返回</button>' +
        '</div>';
    }
    card.innerHTML = html;
    var ov = el('boss-victory'); if (ov) ov.hidden = false;
  }
  function closeVictory() { var ov = el('boss-victory'); if (ov) ov.hidden = true; }

  // ---------- 王之殿堂（圖鑑/入口）----------
  function renderBossMap() {
    if (!data) load();
    var g = el('boss-map-grid'); if (!g) return;
    var html = '';
    for (var i = 0; i < BOSSES.length; i++) {
      var b = BOSSES[i];
      var def = data.defeated && data.defeated[b.id];
      var best = (data.best && data.best[b.id]) || {};
      var status;
      if (def) {
        var fewest = (best.fewestQuestions != null) ? best.fewestQuestions : '?';
        var mc = best.maxCombo || 0;
        status = '<span class="crown">👑 已擊敗・最少 ' + fewest + ' 題</span>' +
          '最高連擊 ×' + mc +
          '<div><button class="btn btn-secondary" onclick="MathBoss.start(\'' + b.id + '\')">🔄 再戰</button></div>';
      } else {
        status = '<button class="btn btn-primary" onclick="MathBoss.start(\'' + b.id + '\')">⚔️ 挑戰</button>';
      }
      html += '<div class="boss-card" style="border-color:' + b.color + '">' +
        '<div class="boss-card-portrait" style="background:' + grad(b.color) + '">' + b.emoji + '</div>' +
        '<div class="boss-card-name">' + b.name + '</div>' +
        '<div class="boss-card-level">等級 ' + (b.level + 1) + ' · ' + grade(b.level) + '</div>' +
        '<div class="boss-card-status">' + status + '</div>' +
        '</div>';
    }
    g.innerHTML = html;
  }

  // ---------- 入口鈕注入 ----------
  function decorateStages(level, list) {
    if (!list) return;
    var boss = bossForLevel(level); if (!boss) return;
    var btn = document.createElement('button');
    btn.className = 'btn btn-primary boss-challenge-btn';
    btn.textContent = '⚔️ 挑戰王：' + boss.name;
    btn.onclick = function () { start(boss.id); };
    list.appendChild(btn);
  }
  function mountHomeEntry() {
    var home = el('screen-home'); if (!home) return;
    if (el('boss-hall-entry')) return; // 只注入一次
    var map = el('level-map');
    var btn = document.createElement('button');
    btn.id = 'boss-hall-entry';
    btn.className = 'btn btn-primary';
    btn.textContent = '🏰 王之殿堂';
    btn.onclick = function () { try { showScreen('boss-map'); } catch (e) {} };
    if (map && map.parentNode === home) home.insertBefore(btn, map.nextSibling);
    else home.appendChild(btn);
  }

  // ---------- 畫面切換 hook ----------
  function onScreen(name) {
    if (name === 'boss-map') { renderBossMap(); return; }
    if (name !== 'game') { hideBossHud(); closeVictory(); return; }
    // 進入 game 畫面但非 BOSS 戰（例如剛從 BOSS 戰逃走後開一般關卡）→ 收起殘留 HUD
    if (!gameState || !gameState.boss) { hideBossHud(); closeVictory(); }
  }

  // ---------- DOM 注入（script 在 body 末端，#app 已存在）----------
  function injectDom() {
    var dots = el('progress-dots');
    if (dots && dots.parentNode && !el('boss-hud')) {
      var hud = document.createElement('div');
      hud.id = 'boss-hud';
      hud.hidden = true;
      hud.innerHTML =
        '<div class="boss-portrait" id="boss-portrait"><span class="boss-portrait-emoji" id="boss-portrait-emoji">🐣</span></div>' +
        '<div class="boss-hud-info">' +
          '<div class="boss-hud-name" id="boss-hud-name">BOSS HP</div>' +
          '<div class="boss-hp-bar" id="boss-hp-bar" role="progressbar" aria-label="BOSS 血量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="boss-hp-fill" id="boss-hp-fill"></div></div>' +
          '<div class="boss-hp-num" id="boss-hp-num">0 / 0</div>' +
        '</div>';
      dots.parentNode.insertBefore(hud, dots);
    }
    var app = el('app');
    if (app && !el('boss-victory')) {
      var v = document.createElement('div');
      v.id = 'boss-victory';
      v.hidden = true;
      v.innerHTML = '<div class="boss-victory-card result-card" id="boss-victory-card"></div>';
      app.appendChild(v);
    }
    if (app && !el('screen-boss-map')) {
      var m = document.createElement('div');
      m.id = 'screen-boss-map';
      m.className = 'screen';
      m.innerHTML =
        '<div class="header">' +
          '<button class="header-btn" onclick="showScreen(\'home\')" aria-label="返回關卡地圖" title="返回關卡地圖">←</button>' +
          '<div class="header-title">🏰 王之殿堂</div>' +
          '<div style="width:48px"></div>' +
        '</div>' +
        '<div class="boss-map-grid u-grid" id="boss-map-grid"></div>';
      app.appendChild(m);
    }
  }

  // ---------- 對外 API ----------
  window.MathBoss = {
    start: start,
    onAnswer: onAnswer,
    finishBattle: finishBattle,
    decorateStages: decorateStages,
    mountHomeEntry: mountHomeEntry,
    onScreen: onScreen,
    closeVictory: closeVictory
  };

  // 初始化（主程式 init() 已於前一個 <script> 執行完，state 已載入；DOM 已就緒）
  injectDom();
  load();
  try { mountHomeEntry(); } catch (e) {}
})();
</script>
</body>
</html>
