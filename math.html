<!DOCTYPE html>
<html lang="zh-TW" data-game-wired="math">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數學冒險王</title>
<!-- 統一遊戲化引擎：主題 token、HUD/toast 樣式、共用引擎（同步載入於 <head>）。
     app.css 先於本頁 <style> 載入，本頁樣式在後、逐屬性覆蓋，維持原本外觀（並取得夜間模式）。
     data-game-wired 亦置於 <html>：引擎於 <head> 同步執行時 document.body 尚為 null，
     須靠 <html> 讓 deltaSync 當下即抑制 math 來源的重複計分（見 game_core.js 說明）。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* 各年級（level）名稱文字色：亮色 accent 直接當文字只有 2.0–4.0:1（不過 AA）。
   改用「on-surface ink」的加深/提亮版，於亮色奶油卡與暗色卡皆 ≥4.5:1（見對比表）。
   僅供「文字」使用；卡片邊框/圖示底仍沿用 LEVELS[].color 原色（大面積/裝飾）。 */
:root {
  --lvl-ink-1: #15803d;  /* 等級 1 綠 on cream 4.81:1 */
  --lvl-ink-2: #1d4ed8;  /* 等級 2 藍 6.43:1 */
  --lvl-ink-3: #b45309;  /* 等級 3 橘 4.82:1 */
  --lvl-ink-4: #c81e1e;  /* 等級 4 紅 5.50:1 */
  --lvl-ink-5: #6d28d9;  /* 等級 5 紫 6.82:1 */
  --lvl-ink-6: #be185d;  /* 等級 6 桃 5.79:1 */
  --lvl-ink-7: #0f766e;  /* 等級 7 青 5.25:1 */
}
:root[data-theme="dark"] {
  --lvl-ink-1: #4ade80;  /* on dark card 8.34:1 */
  --lvl-ink-2: #60a5fa;  /* 5.72:1 */
  --lvl-ink-3: #fbbf24;  /* 8.70:1 */
  --lvl-ink-4: #f87171;  /* 5.25:1 */
  --lvl-ink-5: #a78bfa;  /* 5.34:1 */
  --lvl-ink-6: #f472b6;  /* 5.49:1 */
  --lvl-ink-7: #2dd4bf;  /* 7.81:1 */
}

/* 本頁強調色三件組（數學紫）：讓所有共用設計語彙的重點色一致換色，
   與 index/social/finance「同一位設計師」的手感一致（僅外觀，不動功能）。 */
:root {
  --accent: var(--c-math);
  --accent-tint: var(--tint-math);
  --accent-ink: var(--c-math-ink);
}

body {
  font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  /* 鎖定字重/行高/字色，抵銷 app.css body 的 600/1.6/var(--ink) 洩漏，維持原本外觀 */
  font-weight: 400;
  line-height: normal;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  /* 直向堆疊：共用 app-bar 置頂滿版，#app 於其下置中，避免與置中並排 */
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: var(--bg);
  overflow-x: hidden;
}

#app {
  width: 100%;
  /* canon：外層吃 --content-max（手機 720 / iPad 1200）並置中，
     取代原本寫死的 500px 窄條，讓 iPad 攤成寬版；保留 SPA 全高與 overflow-x 防溢位 */
  max-width: var(--content-max);
  margin-inline: auto;
  min-height: 100dvh;
  position: relative;
  overflow-x: hidden;
  overflow-y: auto;
}

/* Screens */
.screen {
  display: none;
  width: 100%;
  min-height: 100vh;
  padding: var(--s4);
  padding-bottom: 80px;
  animation: fadeIn 0.3s ease;
}

.screen.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--s3) 0;
  margin-bottom: var(--s4);
}

.header-title {
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.3;
}

.header-btn {
  background: var(--card-border);
  border: none;
  color: var(--ink);
  width: 48px;
  height: 48px;
  min-width: 48px;
  min-height: 48px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}

.header-btn:active {
  transform: scale(0.9);
}

/* Save notice */
.save-notice {
  text-align: center;
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 600;
  margin-bottom: var(--s3);
}

/* Stats bar — 被動內容卡：1px 邊、--r-lg 圓角、--shadow-sm */
.stats-bar {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s3) var(--s4);
  margin-bottom: var(--s4);
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow-sm);
}

.stat-item {
  text-align: center;
  color: var(--ink);
}

.stat-value {
  font-size: var(--fs-h2);
  font-weight: 800;
}

.stat-label {
  font-size: var(--fs-small);
  color: var(--ink-soft);
  font-weight: 600;
}

/* EXP bar — 被動內容卡 */
.exp-bar-container {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s3) var(--s4);
  margin-bottom: var(--s4);
  box-shadow: var(--shadow-sm);
}

.exp-info {
  display: flex;
  justify-content: space-between;
  color: var(--ink);
  font-size: var(--fs-small);
  font-weight: 600;
  margin-bottom: var(--s2);
}

.exp-bar {
  height: 10px;
  background: var(--card-border);
  border-radius: 999px;
  overflow: hidden;
}

.exp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--c-math-soft), var(--c-math));
  border-radius: 999px;
  transition: width 0.5s ease;
}

/* Level Map — 選單改吃共用 .u-grid（見 HTML class）：手機單欄、iPad 自動多欄 dashboard。
   本頁僅保留底部留白，欄數/間距由 app.css .u-grid 提供。 */
.level-map {
  padding-bottom: var(--s5);
}

/* 可點入口卡：2px 邊、--r-lg 圓角，hover 轉強調色 + --shadow-lg */
.level-card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: var(--s4);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  border: 2px solid var(--card-border);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.level-card:hover {
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.level-card:active {
  transform: scale(0.98);
}

.level-card.locked {
  opacity: 0.7;
  cursor: not-allowed;
}

.level-card.locked::after {
  content: '🔒';
  position: absolute;
  top: 50%;
  right: var(--s4);
  transform: translateY(-50%);
  font-size: 24px;
}

.level-card-header {
  display: flex;
  align-items: center;
  gap: var(--s3);
  margin-bottom: var(--s2);
}

/* 圖示內磚：--r-sm、強調淡底 */
.level-icon {
  font-size: 32px;
  width: 56px;
  height: 56px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-tint);
  border-radius: var(--r-sm);
}

.level-name {
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 800;
  line-height: 1.25;
}

.level-grade {
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 600;
}

/* 年級徽章：統一使用數學強調色淡底，僅作導覽定位用 */
.level-grade-badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--accent-tint);
  color: var(--accent-ink);
  font-size: var(--fs-small);
  font-weight: 700;
}

.level-stars {
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 700;
  margin-top: var(--s1);
}

/* Stage Select — 關卡選單同樣改吃共用 .u-grid（見 HTML class）：iPad 攤成多欄。 */
.stage-list {
  padding-bottom: var(--s5);
}

/* 可點入口卡：2px 邊、--r-lg 圓角，hover 轉強調色 + --shadow-lg */
.stage-card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: var(--s4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  border: 2px solid var(--card-border);
  box-shadow: var(--shadow-sm);
}

.stage-card:hover {
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.stage-card:active {
  transform: scale(0.98);
}

.stage-card.locked {
  opacity: 0.7;
  cursor: not-allowed;
}

.stage-card.boss {
  border-color: var(--c-star);
  background: var(--card);
}

.stage-info {
  display: flex;
  align-items: center;
  gap: var(--s3);
}

.stage-num {
  width: 40px;
  height: 40px;
  flex: none;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: white;
  font-size: var(--fs-body);
}

.stage-name {
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 700;
}

.stage-sub {
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 600;
  margin-top: 2px;
}

.stage-stars-display {
  color: var(--c-star);
  font-size: var(--fs-body);
  letter-spacing: 2px;
}

/* Gameplay */
.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--s4);
}

.progress-dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: var(--s4);
}

.progress-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--card-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--ink-soft);
  transition: all 0.3s;
}

.progress-dot.correct {
  background: var(--tint-english);
  color: var(--ink);
}

.progress-dot.wrong {
  background: rgba(255, 118, 117, 0.12);
  color: var(--ink);
}

.progress-dot.current {
  background: var(--accent);
  color: white;
  box-shadow: 0 0 0 3px var(--accent-tint);
}

.combo-display {
  text-align: center;
  margin-bottom: var(--s3);
  min-height: 36px;
}

.combo-text {
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  animation: comboPulse 0.5s ease;
}

@keyframes comboPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* 一題一畫面的大舞台卡：被動內容卡 → 1px 邊、--r-lg 圓角、--s5/--s4 內距 */
.question-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s5) var(--s4);
  text-align: center;
  margin-bottom: var(--s4);
  min-height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
}

/* 題幹：對齊共用 .q-prompt 的字級/字重/行高 */
.question-text {
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.45;
  max-width: 32ch;
}

.question-sub {
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--ink-soft);
  margin-top: var(--s2);
  max-width: 34ch;
}

/* Fraction display */
.frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  margin: 0 4px;
}

.frac .num {
  border-bottom: 2px solid var(--ink);
  padding: 0 4px 2px;
  font-size: 22px;
}

.frac .den {
  padding: 2px 4px 0;
  font-size: 22px;
}

/* Object counting display */
.objects-display {
  font-size: 32px;
  line-height: 1.6;
  letter-spacing: 4px;
  word-break: break-all;
  max-width: 300px;
}

/* Choices — 對齊共用 .q-opt：16px 圓角、56px 命中區、強調 hover、對錯 token 色 */
.choices-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s3);
  margin-bottom: var(--s4);
}

.choice-btn {
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 14px 18px;
  color: var(--ink);
  font-size: clamp(16px, 3.4vw, 19px);
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
}

.choice-btn:hover {
  border-color: var(--accent);
}

.choice-btn:active {
  transform: scale(0.98);
}

.choice-btn.correct {
  background: var(--tint-english);
  border-color: var(--c-correct);
  color: var(--ink);
}

.choice-btn.wrong {
  background: rgba(255, 118, 117, 0.12);
  border-color: var(--c-wrong);
  color: var(--ink);
}

/* 除了顏色，也用符號標對錯（對色盲/低視力友善；與全書其他選擇題頁一致）*/
.choice-btn.correct::after { content: " ✓"; font-weight: 900; }
.choice-btn.wrong::after { content: " ✗"; font-weight: 900; }

.choice-btn.reveal {
  background: var(--tint-english);
  border-color: var(--c-correct);
  color: var(--ink);
  opacity: 0.7;
}

/* Number Pad（功能保留；僅對齊圓角/字級/按壓與 token 色） */
.numpad-input {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
  text-align: center;
  font-size: clamp(22px, 5vw, 28px);
  font-weight: 800;
  color: var(--ink);
  margin-bottom: var(--s4);
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  word-break: break-all;
}

.numpad {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--s2);
}

.numpad-btn {
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: var(--r-sm);
  padding: 14px;
  color: var(--ink);
  font-size: 22px;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.2s ease;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.numpad-btn:active {
  transform: scale(0.96);
  background: var(--card-border);
}

.numpad-btn.submit {
  background: var(--c-correct-btn);
  border-color: var(--c-correct-btn);
  color: var(--on-accent);
}

.numpad-btn.submit:active {
  filter: brightness(0.95);
}

.numpad-btn.backspace {
  background: rgba(255, 118, 117, 0.12);
  border-color: var(--c-wrong);
  color: var(--ink);
}

.numpad-btn.negative {
  background: var(--card-border);
  border-color: var(--c-math-soft);
  color: var(--c-math-ink);
}

/* Feedback overlay */
.feedback-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  pointer-events: none;
}

.feedback-overlay.show {
  display: flex;
}

.feedback-correct {
  font-size: 80px;
  animation: correctAnim 0.8s ease forwards;
}

@keyframes correctAnim {
  0% { transform: scale(0); opacity: 1; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}

.feedback-wrong {
  font-size: 80px;
  animation: wrongAnim 0.8s ease forwards;
}

@keyframes wrongAnim {
  0% { transform: scale(0) rotate(0deg); opacity: 1; }
  50% { transform: scale(1.2) rotate(10deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 0; }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

.shake {
  animation: shake 0.3s ease;
}

/* Result Screen — 被動結算卡：1px 邊、--r-lg 圓角、--s5/--s4 內距 */
.result-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s5) var(--s4);
  text-align: center;
  margin-top: var(--s5);
  box-shadow: var(--shadow-sm);
}

.result-stars {
  font-size: 34px;
  margin-bottom: var(--s3);
  letter-spacing: 4px;
}

.result-title {
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  margin-bottom: var(--s2);
}

.result-stats {
  color: var(--ink-soft);
  font-size: var(--fs-body);
  font-weight: 700;
  margin-bottom: var(--s5);
  line-height: 1.8;
}

.result-exp {
  font-size: var(--fs-body);
  font-weight: 800;
  color: var(--ink);
  margin-bottom: var(--s5);
}

/* 底部行動列：對齊共用 .q-actions（等分、最小寬 140） */
.result-buttons {
  display: flex;
  gap: var(--s3);
  justify-content: center;
  flex-wrap: wrap;
}

.result-buttons .btn {
  flex: 1;
  min-width: 140px;
}

/* #app 作用域提高特異度，勝過 app.css 的 .btn / .btn-primary，
   並中和 app.css 才有的屬性（min-height / display / gap / box-shadow），維持原本外觀 */
#app .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  /* 對齊共用 .btn：16px 圓角、48px 命中區（--tap-min），視覺與全站一致 */
  min-height: var(--tap-min);
  gap: var(--s2, 8px);
  box-shadow: none;
  border: none;
  border-radius: 16px;
  padding: 14px 24px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
}

#app .btn:active {
  transform: scale(0.95);
}

#app .btn-primary {
  background: var(--c-math);
  color: white;
  box-shadow: var(--shadow-sm);
}

#app .btn-secondary {
  background: var(--card-border);
  color: var(--c-math-ink);
  border: 2px solid var(--card-border);
}

#app .btn-success {
  background: var(--c-correct-btn);
  color: var(--on-accent);
}

#app .btn-danger {
  background: var(--c-wrong-btn);
  color: var(--on-accent);
}

/* Daily Challenge */
.daily-timer {
  text-align: center;
  font-size: 36px;
  font-weight: 800;
  color: var(--ink);
  margin-bottom: var(--s4);
}

.daily-timer.warning {
  color: var(--ink);
  animation: timerPulse 1.2s ease-in-out infinite;
}

@keyframes timerPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.78; }
}

.daily-score {
  text-align: center;
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 700;
  margin-bottom: var(--s4);
}

/* Wrong Book */
.wrong-list {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}

/* 被動內容卡 → 1px 邊、--r-lg 圓角 */
.wrong-item {
  background: var(--card);

/* Confetti */
.confetti-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 200;
  overflow: hidden;
}

.confetti-piece {
  position: absolute;
  width: 10px;
  height: 10px;
  top: -10px;
  animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* Flying stars */
@keyframes starFly {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-100px) scale(0); opacity: 0; }
}

  position: absolute;
  font-size: 20px;
  animation: starFly 0.8s ease-out forwards;
  pointer-events: none;
}

  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }

<script>
// ==================== GAME STATE ====================
const LEVELS = [
  { name: '等級 1', grade: '基礎加減', color: '#22c55e', icon: '🌱', stages: ['10以內加法','10以內減法','比大小','數物品','BOSS混合'] },
  { name: '等級 2', grade: '進位與乘法', color: '#3b82f6', icon: '🌊', stages: ['100以內加法','100以內減法','九九乘法','填空題','BOSS混合'] },
  { name: '等級 3', grade: '乘除與換算', color: '#f59e0b', icon: '🌟', stages: ['三位數加減','兩位×一位','基本除法','單位換算','BOSS混合'] },
  { name: '等級 4', grade: '多位乘除與分數', color: '#ef4444', icon: '🔥', stages: ['多位數乘法','長除法','分數比較與加減','長方形面積','BOSS混合'] },
  { name: '等級 5', grade: '分數與小數', color: '#8b5cf6', icon: '💜', stages: ['異分母加減','分數乘除','小數運算','百分比','BOSS混合'] },
  { name: '等級 6', grade: '比例與圓', color: '#ec4899', icon: '🌸', stages: ['分數小數混合','比與比例','圓周與面積','速率問題','BOSS混合'] },
  { name: '等級 7', grade: '代數入門（★）', color: '#14b8a6', icon: '🧊', stages: ['正負數運算','一元方程式','座標象限','三角形','BOSS混合'] },
  { name: '等級 8', grade: '一元一次方程式（★★）', color: '#0ea5e9', icon: '⚖️', stages: ['解一元一次','兩邊有未知數','應用題','雞兔同籠','BOSS混合'] },
  { name: '等級 9', grade: '比與比例（★★）', color: '#f97316', icon: '🧮', stages: ['解比例式','正比','反比','比例分配','BOSS混合'] },
  { name: '等級 10', grade: '一元二次方程式（★★★）', color: '#a855f7', icon: '🎯', stages: ['平方根±','括號式求根','因式分解求根','判別式','BOSS混合'] },
  { name: '等級 11', grade: '平面幾何（★★★）', color: '#e11d48', icon: '📐', stages: ['角度計算','平行線截角','畢氏定理','面積','BOSS混合'] },
  { name: '等級 12', grade: '統計與機率（★★★）', color: '#6366f1', icon: '📊', stages: ['平均數','中位數與眾數','球的機率','骰子機率','BOSS混合'] }
];

const RANKS = [
  { min: 0, max: 100, name: '數學新手' },
  { min: 100, max: 300, name: '計算小兵' },
  { min: 300, max: 600, name: '算術戰士' },
  { min: 600, max: 1000, name: '數學騎士' },
  { min: 1000, max: 1500, name: '運算大師' },
  { min: 1500, max: 2500, name: '數學王者' },
  { min: 2500, max: Infinity, name: '數學神童' }
];

let state = {
  progress: { stars: {}, exp: 0 },
  stats: { totalCorrect: 0, totalAttempts: 0, bestCombo: 0, streak: 0, lastPlay: null },
  wrong: [],
  daily: {}
};

let gameState = {
  level: 0,
  stage: 0,
  questions: [],
  current: 0,
  errors: 0,
  combo: 0,
  maxCombo: 0,
  expEarned: 0,
  answers: []
};

let dailyState = {
  questions: [],
  results: [],
  current: 0,
  score: 0,
  timer: 60,
  interval: null,
  active: false
};

let soundEnabled = true;
let audioCtx = null;

// ==================== PERSISTENCE ====================
function loadState() {
  try {
    const p = localStorage.getItem('math_progress');
    const s = localStorage.getItem('math_stats');
    const w = localStorage.getItem('math_wrong');
    const d = localStorage.getItem('math_daily');
    if (p) state.progress = JSON.parse(p);
    if (s) state.stats = JSON.parse(s);
    if (w) state.wrong = JSON.parse(w);
    if (d) state.daily = JSON.parse(d);
    if (!state.progress.stars) state.progress.stars = {};
    if (!state.progress.exp) state.progress.exp = 0;
  } catch(e) { console.error('Load error', e); }

  // Check streak
  const today = new Date().toISOString().split('T')[0];
  if (state.stats.lastPlay) {
    const last = new Date(state.stats.lastPlay);
    const diff = Math.floor((new Date(today) - last) / 86400000);
    if (diff > 1) state.stats.streak = 0;
  }
}

function saveState() {
  try {
    localStorage.setItem('math_progress', JSON.stringify(state.progress));
    localStorage.setItem('math_stats', JSON.stringify(state.stats));
    localStorage.setItem('math_wrong', JSON.stringify(state.wrong));
    localStorage.setItem('math_daily', JSON.stringify(state.daily));
  } catch(e) {
    console.error('Save error', e);
    showSaveError();
  }
}

function showSaveError() {
  let el = document.getElementById('save-warning');
  if (!el) {
    el = document.createElement('div');
    el.id = 'save-warning';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:8px;background:#c92a2a;color:white;text-align:center;font-size:0.8rem;z-index:9999;';
    el.textContent = '⚠️ 無法儲存進度！請直接從 GitHub Pages 網址開啟，不要使用嵌入模式。';
    document.body.prepend(el);
  }
}

// ==================== SOUND ====================
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    switch(type) {
      case 'correct':
        osc.frequency.setValueAtTime(523, ctx.currentTime);
        osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
        break;
      case 'wrong':
        osc.type = 'sine';  /* 柔和音色，避免鋸齒波「失敗蜂鳴」的懲罰感（與全書去懲罰化一致） */
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
        break;
      case 'combo':
        osc.frequency.setValueAtTime(600 + gameState.combo * 100, ctx.currentTime);
        osc.frequency.setValueAtTime(800 + gameState.combo * 100, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.2);
        break;
      case 'levelup':
        osc.frequency.setValueAtTime(523, ctx.currentTime);
        osc.frequency.setValueAtTime(659, ctx.currentTime + 0.15);
        osc.frequency.setValueAtTime(784, ctx.currentTime + 0.3);
        osc.frequency.setValueAtTime(1047, ctx.currentTime + 0.45);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.7);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.7);
        break;
      case 'click':
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.05);
        break;
    }
  } catch(e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('btn-sound').textContent = soundEnabled ? '🔊' : '🔇';
}

// ==================== UTILITY ====================
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { [a, b] = [b, a % b]; }
  return a;
}

function lcm(a, b) {
  return (a * b) / gcd(a, b);
}

function getRank(exp) {
  for (const r of RANKS) {
    if (exp < r.max) return r;
  }
  return RANKS[RANKS.length - 1];
}

function getRankName(exp) {
  return getRank(exp).name;
}

// ==================== UNIFIED GAME ENGINE BRIDGE ====================
// 每答一題就把結果記進統一 profile（math 科目）。此頁已在 <html>/<body>
// 宣告 data-game-wired="math"，故 game_core 的 delta-sync 不會重複計分。
function gameRecord(correct) {
  try {
    if (window.Game && typeof Game.recordAnswer === 'function') {
      Game.recordAnswer('math', !!correct);
    }
  } catch (e) { /* 引擎缺席時不影響本頁邏輯 */ }
}

// 用統一 profile 驅動「既有的」原生 HUD（稱號 / 經驗條 / 連續天數），
// 不注入浮動 HUD（body 已標記 data-game-hud="native"）。
function syncHudFromGame() {
  try {
    if (!(window.Game && typeof Game.getProfile === 'function')) return;
    const p = Game.getProfile();
    if (!p) return;
    const d = p.derived || {};
    const setText = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    setText('home-rank', d.rankName || '數學新手');
    setText('home-exp', p.totalXp);
    setText('home-streak', (p.streak && p.streak.current) || 0);
    setText('exp-rank-label', d.rankName || '數學新手');
    if (d.isMaxLevel) {
      setText('exp-progress-label', `Lv.${p.level}・${p.totalXp}`);
    } else {
      setText('exp-progress-label', `Lv.${p.level}・${d.xpIntoLevel} / ${d.xpForLevel}`);
    }
    const fill = document.getElementById('exp-fill');
    if (fill) fill.style.width = `${Math.round((d.levelProgress || 0) * 100)}%`;
  } catch (e) { /* 靜默 */ }
}

// 註冊事件：XP 變動 / 升級 / 連續天數更新時即時刷新原生 HUD。
function wireGameEvents() {
  if (!(window.Game && typeof Game.on === 'function')) return;
  ['xp', 'levelup', 'streak', 'daily-complete'].forEach(evt => Game.on(evt, syncHudFromGame));
}

// Level 4, Stage 3: Fractions - compare and same-denominator add/subtract
function genL4S3() {
  const type = randInt(1, 3);
  if (type === 1) {
    // Compare fractions with same denominator
    const den = randInt(2, 10);
    const n1 = randInt(1, den - 1);
    let n2 = randInt(1, den - 1);
    if (Math.random() < 0.15) n2 = n1;
    const correct = n1 > n2 ? '>' : (n1 < n2 ? '<' : '=');
    return {
      question: `${n1}/${den} ○ ${n2}/${den}`,
      answer: correct,
      type: 'choice',
      choices: ['>', '<', '='],
      questionSub: '在 ○ 裡選 >、< 或 = 讓算式成立'
    };
  } else if (type === 2) {
    // Same denominator addition
    const den = randInt(2, 10);
    const n1 = randInt(1, den - 1);
    const n2 = randInt(1, den - n1);
    const ansNum = n1 + n2;
    const g = gcd(ansNum, den);
    return {
      question: `${n1}/${den} + ${n2}/${den} = ?`,
      answer: den/g === 1 ? `${ansNum/g}` : `${ansNum/g}/${den/g}`,
      type: 'fraction',
      answerNum: ansNum/g,
      answerDen: den/g,
      questionSub: '答案可以不用先約分，2/4 或 1/2 都算對'
    };
  } else {
    // Same denominator subtraction（分母下限 3，確保 n1<den 為真分數，不會退化成 2/2 之類假分數）
    const den = randInt(3, 10);
    const n1 = randInt(2, den - 1);
    const n2 = randInt(1, n1 - 1);
    const ansNum = n1 - n2;
    const g = gcd(ansNum, den);
    return {
      question: `${n1}/${den} - ${n2}/${den} = ?`,
      answer: den/g === 1 ? `${ansNum/g}` : `${ansNum/g}/${den/g}`,
      type: 'fraction',
      answerNum: ansNum/g,
      answerDen: den/g,
      questionSub: '答案可以不用先約分，2/4 或 1/2 都算對'
    };
  }
}

// Level 5, Stage 1: Unlike fraction add/subtract
function genL5S1() {
  // 產生最簡真分數運算元、且分母不同（異分母練習），與全書其他分數產生器一致（不出現 4/8 這種可約分題面）
  function pickFrac() { let d = randInt(2, 8); let n = randInt(1, d - 1); const g = gcd(n, d); return { n: n / g, d: d / g }; }
  let f1 = pickFrac(), f2 = pickFrac(), guard = 0;
  while (f1.d === f2.d && guard++ < 20) f2 = pickFrac();
  const n1 = f1.n, d1 = f1.d, n2 = f2.n, d2 = f2.d;
  const commonDen = lcm(d1, d2);
  const newN1 = n1 * (commonDen / d1);
  const newN2 = n2 * (commonDen / d2);

  if (Math.random() < 0.5 || newN1 <= newN2) {
    // Addition
    const resNum = newN1 + newN2;
    const g = gcd(resNum, commonDen);
    return {
      question: `${n1}/${d1} + ${n2}/${d2} = ?`,
      answer: commonDen/g === 1 ? `${resNum/g}` : `${resNum/g}/${commonDen/g}`,
      type: 'fraction',
      answerNum: resNum/g,
      answerDen: commonDen/g,
      questionSub: '答案可以不用先約分，2/4 或 1/2 都算對'
    };
  } else {
    // Subtraction
    const resNum = newN1 - newN2;
    if (resNum <= 0) {
      const resNum2 = newN1 + newN2;
      const g = gcd(resNum2, commonDen);
      return {
        question: `${n1}/${d1} + ${n2}/${d2} = ?`,
        answer: commonDen/g === 1 ? `${resNum2/g}` : `${resNum2/g}/${commonDen/g}`,
        type: 'fraction',
        answerNum: resNum2/g,
        answerDen: commonDen/g,
        questionSub: '答案可以不用先約分，2/4 或 1/2 都算對'
      };
    }
    const g = gcd(resNum, commonDen);
    return {
      question: `${n1}/${d1} - ${n2}/${d2} = ?`,
      answer: commonDen/g === 1 ? `${resNum/g}` : `${resNum/g}/${commonDen/g}`,
      type: 'fraction',
      answerNum: resNum/g,
      answerDen: commonDen/g,
      questionSub: '答案可以不用先約分，2/4 或 1/2 都算對'
    };
  }
}

// Level 5, Stage 2: Fraction multiply/divide
function genL5S2() {
  // Build a proper, already-simplified fraction operand (numerator < denominator)
  function properFrac() {
    const d = randInt(2, 9);
    const n = randInt(1, d - 1);
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  const f1 = properFrac();
  const f2 = properFrac();
  if (Math.random() < 0.5) {
    // Multiplication
    const resNum = f1.n * f2.n;
    const resDen = f1.d * f2.d;
    const g = gcd(resNum, resDen);
    return {
      question: `${f1.n}/${f1.d} × ${f2.n}/${f2.d} = ?`,
      answer: (resDen/g === 1) ? `${resNum/g}` : `${resNum/g}/${resDen/g}`,
      type: 'fraction',
      answerNum: resNum/g,
      answerDen: resDen/g,
      questionSub: '答案可以不用先約分，2/4 或 1/2 都算對'
    };
  } else {
    // Division (multiply by reciprocal)
    const resNum = f1.n * f2.d;
    const resDen = f1.d * f2.n;
    const g = gcd(resNum, resDen);
    return {
      question: `${f1.n}/${f1.d} ÷ ${f2.n}/${f2.d} = ?`,
      answer: (resDen/g === 1) ? `${resNum/g}` : `${resNum/g}/${resDen/g}`,
      type: 'fraction',
      answerNum: resNum/g,
      answerDen: resDen/g,
      questionSub: '答案可以不用先約分，2/4 或 1/2 都算對'
    };
  }
}

    const [n, d] = fracs[randInt(0, fracs.length - 1)];

  } else if (type === 2) {

    const dec = (randInt(1, 99) / 100);
    const pct = Math.round(dec * 100);
    return { question: `${dec} = ?%`, answer: pct, type: 'input', questionSub: '將小數轉換為百分比' };
  } else if (type === 3) {
    // Percent to decimal (choose from multiple choice)
    const pct = randInt(1, 9) * 10;
    const correct = (pct / 100).toFixed(1);
    const choices = [correct];
    while (choices.length < 4) {
      const c = ((randInt(1, 9) * 10) / 100).toFixed(1);
      if (!choices.includes(c)) choices.push(c);
    }
    return { question: `${pct}% = ?`, answer: correct, type: 'choice', choices: shuffle(choices), questionSub: '選擇對應的小數' };
  } else {

    const whole = randInt(2, 10) * 10;

// Level 6, Stage 1: Mixed fraction/decimal operations
function genL6S1() {
  const type = randInt(1, 3);
  if (type === 1) {
    // Fraction + decimal — only use denominators that give exact (terminating) decimals
    const denoms = [2, 4, 5, 10];
    const d0 = denoms[randInt(0, denoms.length - 1)];
    const n0 = randInt(1, d0 - 1);
    const g = gcd(n0, d0); const n = n0 / g, d = d0 / g;   // 顯示最簡真分數（不出現 2/4、5/10），值不變、仍為有限小數
    const dec = (randInt(1, 20) / 10).toFixed(1);
    const fracVal = n / d;
    // n/d is exact here, so the sum is an exact 2-decimal value
    const correctVal = fracVal + parseFloat(dec);
    const ans = correctVal.toFixed(2);
    const choices = [ans];
    while (choices.length < 4) {
      const c = (correctVal + (randInt(-5, 5) * 0.1)).toFixed(2);
      if (!choices.includes(c) && parseFloat(c) > 0) choices.push(c);
    }
    return { question: `${n}/${d} + ${dec} = ?`, answer: ans, type: 'choice', choices: shuffle(choices), questionSub: '先把分數轉成小數再相加' };
  } else if (type === 2) {
    // Integer × fraction — answer as an exact (simplified) fraction, no rounding
    const whole = randInt(2, 9);
    let d = randInt(2, 6);
    let n = randInt(1, d - 1);
    const gOp = gcd(n, d);            // 顯示為最簡真分數（如 2/4 → 1/2），與全書其他分數產生器一致
    n = n / gOp; d = d / gOp;
    const resNum = whole * n;
    const resDen = d;
    const g = gcd(resNum, resDen);
    const sNum = resNum / g;
    const sDen = resDen / g;
    return {
      question: `${whole} × ${n}/${d} = ?`,
      answer: sDen === 1 ? `${sNum}` : `${sNum}/${sDen}`,
      type: 'fraction',
      answerNum: sNum,
      answerDen: sDen,
      questionSub: '答案可以是分數，2/4 或 1/2 都算對'
    };
  } else {
    // Compare fraction and decimal — 顯示最簡真分數（<1），與全書其他分數產生器一致（不出現 4/8 或 7/2）
    let d = randInt(2, 8);
    let n = randInt(1, d - 1);
    const g = gcd(n, d); n /= g; d /= g;
    const fracVal = n / d;
    // 保持正的一位小數（負數/0 在等級 7 才教，等級 6 不出現）
    const tenths = Math.max(1, Math.round(fracVal * 10) + randInt(-3, 3));
    const dec = (tenths / 10).toFixed(1);
    const correct = fracVal > parseFloat(dec) ? '>' : (fracVal < parseFloat(dec) ? '<' : '=');
    return { question: `${n}/${d} ○ ${dec}`, answer: correct, type: 'choice', choices: ['>', '<', '='], questionSub: '在 ○ 裡選 >、< 或 = 讓算式成立' };
  }
}

// Level 6, Stage 2: Ratio and proportion
function genL6S2() {
  const type = randInt(1, 3);
  if (type === 1) {
    // Simplify ratio
    const g = randInt(2, 5);
    const a = randInt(1, 6) * g;
    const b = randInt(1, 6) * g;
    const ga = gcd(a, b);
    const ans = `${a/ga}:${b/ga}`;
    const choices = [ans];
    while (choices.length < 4) {
      const c = `${randInt(1, 8)}:${randInt(1, 8)}`;
      if (!choices.includes(c)) choices.push(c);
    }
    return { question: `化簡比 ${a}:${b} = ?`, answer: ans, type: 'choice', choices: shuffle(choices), questionSub: '選擇最簡比' };
  } else if (type === 2) {
    // Proportion: a/b = c/?
    const a = randInt(1, 6);
    const b = randInt(2, 8);
    const mult = randInt(2, 5);
    const c = a * mult;
    const ans = b * mult;
    return { question: `${a}:${b} = ${c}:?`, answer: ans, type: 'input', questionSub: '求未知數' };
  } else {
    // Divide in ratio
    const total = randInt(3, 10) * 10;
    const a = randInt(1, 4);
    let b = randInt(1, 4);
    while (b === a) b = randInt(1, 4);  // a≠b：確保有「較大的一份」，a=b 相等時題意不通
    const partA = total * a / (a + b);
    if (partA !== Math.floor(partA)) {
      // Ensure integer answer
      const total2 = (a + b) * randInt(2, 8);
      const partA2 = total2 * a / (a + b);
      return { question: `${total2} 按 ${a}:${b} 分配\n較大的部分 = ?`, answer: Math.max(partA2, total2 - partA2), type: 'input', questionSub: '按比例分配' };
    }
    return { question: `${total} 按 ${a}:${b} 分配\n較大的部分 = ?`, answer: Math.max(partA, total - partA), type: 'input', questionSub: '按比例分配' };
  }
}

// Level 6, Stage 3: Circle circumference and area
function genL6S3() {
  const type = randInt(1, 3);
  if (type === 1) {
    // Circumference
    const r = randInt(1, 10);
    const ans = (2 * 3.14 * r).toFixed(2);
    const choices = [ans];
    while (choices.length < 4) {
      const c = (2 * 3.14 * randInt(1, 10)).toFixed(2);
      if (!choices.includes(c)) choices.push(c);
    }
    return { question: `圓的半徑 = ${r}\n周長 = ? (π=3.14)`, answer: ans, type: 'choice', choices: shuffle(choices), questionSub: '周長 = 2πr' };
  } else if (type === 2) {
    // Area
    const r = randInt(1, 8);
    const ans = (3.14 * r * r).toFixed(2);
    const choices = [ans];
    while (choices.length < 4) {
      const c = (3.14 * randInt(1, 8) * randInt(1, 8)).toFixed(2);
      if (!choices.includes(c)) choices.push(c);
    }
    return { question: `圓的半徑 = ${r}\n面積 = ? (π=3.14)`, answer: ans, type: 'choice', choices: shuffle(choices), questionSub: '面積 = πr²' };
  } else {
    // Diameter to circumference
    const d = randInt(2, 14);
    const ans = (3.14 * d).toFixed(2);
    const choices = [ans];
    while (choices.length < 4) {
      const c = (3.14 * randInt(2, 14)).toFixed(2);
      if (!choices.includes(c)) choices.push(c);
    }
    return { question: `圓的直徑 = ${d}\n周長 = ? (π=3.14)`, answer: ans, type: 'choice', choices: shuffle(choices), questionSub: '周長 = πd' };
  }
}

// Level 7, Stage 2: Simple linear equations
function genL7S2() {
  const type = randInt(1, 4);
  if (type === 1) {
    // ax + b = c
    const a = randInt(2, 8);
    const x = randInt(-10, 10);
    const b = randInt(-15, 15);
    const c = a * x + b;
    const bTerm = b === 0 ? '' : (b > 0 ? ` + ${b}` : ` - ${Math.abs(b)}`);   // 負常數印成「- 15」而非「+ (-15)」，與 genL8S1 一致、易讀
    return { question: `${a}x${bTerm} = ${c}\nx = ?`, answer: x, type: 'input', allowNegative: true, questionSub: '解方程式' };
  } else if (type === 2) {
    // ax - b = c
    const a = randInt(2, 6);
    const x = randInt(1, 10);
    const b = randInt(1, 15);
    const c = a * x - b;
    return { question: `${a}x - ${b} = ${c}\nx = ?`, answer: x, type: 'input', allowNegative: true, questionSub: '解方程式' };
  } else if (type === 3) {
    // x/a + b = c
    const a = randInt(2, 6);
    const x = a * randInt(1, 8);
    const b = randInt(1, 10);
    const c = x / a + b;
    return { question: `x/${a} + ${b} = ${c}\nx = ?`, answer: x, type: 'input', allowNegative: true, questionSub: '解方程式' };
  } else {
    // a(x + b) = c
    const a = randInt(2, 5);
    const x = randInt(-5, 10);
    const b = randInt(1, 8);
    const c = a * (x + b);
    return { question: `${a}(x + ${b}) = ${c}\nx = ?`, answer: x, type: 'input', allowNegative: true, questionSub: '解方程式' };
  }
}

// Level 7, Stage 3: Coordinate plane (which quadrant)
function genL7S3() {
  const type = randInt(1, 3);
  if (type === 1) {
    // Which quadrant
    const x = randInt(1, 10) * (Math.random() < 0.5 ? 1 : -1);
    const y = randInt(1, 10) * (Math.random() < 0.5 ? 1 : -1);
    let quadrant;
    if (x > 0 && y > 0) quadrant = '第一象限';
    else if (x < 0 && y > 0) quadrant = '第二象限';
    else if (x < 0 && y < 0) quadrant = '第三象限';
    else quadrant = '第四象限';
    return {
      question: `點 (${x}, ${y}) 在哪個象限？`,
      answer: quadrant,
      type: 'choice',
      choices: ['第一象限', '第二象限', '第三象限', '第四象限'],
      questionSub: '判斷座標點所在象限'
    };
  } else if (type === 2) {
    // Distance from origin (choose)
    const x = randInt(1, 5) * (Math.random() < 0.5 ? 1 : -1);
    const y = randInt(1, 5) * (Math.random() < 0.5 ? 1 : -1);
    // Use only Pythagorean triples for integer answers
    const triples = [[3,4,5],[5,12,13],[6,8,10],[8,15,17]];
    const t = triples[randInt(0, triples.length - 1)];
    const px = t[0] * (Math.random() < 0.5 ? 1 : -1);
    const py = t[1] * (Math.random() < 0.5 ? 1 : -1);
    return { question: `點 (${px}, ${py}) 到原點的距離 = ?`, answer: t[2], type: 'input', questionSub: '距離 = √(x² + y²)' };
  } else {
    // 判斷點的位置。不產生 (0,0)：原點同時在 x 軸與 y 軸上，會造成「x軸/y軸」也成立的多解，
    // 故原點只作為誘答選項出現、不當正解，確保每題唯一解。
    const val = randInt(1, 10) * (Math.random() < 0.5 ? 1 : -1);
    const val2 = randInt(1, 10) * (Math.random() < 0.5 ? 1 : -1);
    const kase = randInt(0, 2);
    let point, correct;
    if (kase === 0) { point = `(${val}, 0)`; correct = 'x 軸'; }
    else if (kase === 1) { point = `(0, ${val})`; correct = 'y 軸'; }
    else { point = `(${val}, ${val2})`; correct = '不在軸上'; }
    return { question: `點 ${point} 在哪裡？`, answer: correct, type: 'choice', choices: ['x 軸', 'y 軸', '原點', '不在軸上'], questionSub: '判斷點的位置' };
  }
}

// Level 7, Stage 4: Triangle area and angle sum
function genL7S4() {
  const type = randInt(1, 3);
  if (type === 1) {
    // Triangle area
    const base = randInt(3, 15);
    const height = randInt(2, 12);
    // Ensure even product for integer area
    const b2 = base % 2 === 0 ? base : base + 1;
    const area = b2 * height / 2;
    return { question: `三角形：底 ${b2}，高 ${height}\n面積 = ?`, answer: area, type: 'input', questionSub: '面積 = 底 × 高 ÷ 2' };
  } else if (type === 2) {
    // Angle sum (find missing angle)
    const a1 = randInt(20, 80);
    const a2 = randInt(20, 80);
    const a3 = 180 - a1 - a2;
    if (a3 <= 0) {
      return { question: `三角形兩角為 30° 和 60°\n第三角 = ?°`, answer: 90, type: 'input', questionSub: '三角形內角和 = 180°' };
    }
    return { question: `三角形兩角為 ${a1}° 和 ${a2}°\n第三角 = ?°`, answer: a3, type: 'input', questionSub: '三角形內角和 = 180°' };
  } else {
    // Triangle type —— 每題四個選項中「恰好一個」為真，避免「更廣義但也正確」的
    // 選項被判錯（例：等邊亦為等腰、45-45-90 亦為直角/等腰）。作法：每種三角形自帶
    // 一組專屬選項，正解以外三個對「這個」三角形皆為假（用等邊/直角/鈍角/不等邊等
    // 互斥類別當誘答），故不會出現多重正確。
    const types = [
      // 60-60-60：等邊（正解）；直角✗、鈍角✗、不等邊✗
      { angles: [60, 60, 60], name: '等邊三角形',
        choices: ['等邊三角形', '直角三角形', '鈍角三角形', '不等邊三角形'] },
      // 45-45-90：等腰直角（正解）；不提供「直角/等腰」以免多重正確 → 等邊✗、鈍角✗、不等邊✗
      { angles: [90, 45, 45], name: '等腰直角三角形',
        choices: ['等腰直角三角形', '等邊三角形', '鈍角三角形', '不等邊三角形'] },
      // 30-60-90：直角（正解，且三邊不等，非等腰）；等邊✗、等腰✗、鈍角✗
      { angles: [90, 30, 60], name: '直角三角形',
        choices: ['直角三角形', '等邊三角形', '等腰三角形', '鈍角三角形'] },
      // 50-50-80：等腰（正解，最大角 80° 為銳角）；等邊✗、直角✗、鈍角✗
      { angles: [50, 50, 80], name: '等腰三角形',
        choices: ['等腰三角形', '等邊三角形', '直角三角形', '鈍角三角形'] }
    ];
    const t = types[randInt(0, types.length - 1)];
    const shuffledAngles = shuffle(t.angles);
    return {
      question: `三角形三角為 ${shuffledAngles[0]}°, ${shuffledAngles[1]}°, ${shuffledAngles[2]}°\n這是什麼三角形？`,
      answer: t.name,
      type: 'choice',
      choices: shuffle(t.choices),
      questionSub: '判斷三角形類型'
    };
  }
}

// Level 8, Stage 2: 兩邊都有未知數（ax + b = cx + d）

  const c = a * m;
  const x = b * m; // a:b = c:x  →  a·x = b·c  →  x = b·c/a = b·m
  return { question: `${a} : ${b} = ${c} : ?`, answer: x, type: 'input', questionSub: '比例式：a : b = c : d 時 a × d = b × c' };

// Level 9, Stage 2: 正比（y = kx）
function genL9S2() {
  const k = randInt(2, 9);
  const x1 = randInt(2, 9);
  let x2 = randInt(2, 12);
  while (x2 === x1) x2 = randInt(2, 12);
  return { question: `y 與 x 成正比。當 x = ${x1} 時 y = ${k * x1}，則當 x = ${x2} 時 y = ?`, answer: k * x2, type: 'input', questionSub: '正比：y = k x，先求出比例常數 k' };
}

// Level 9, Stage 3: 反比（x × y = k）
function genL9S3() {
  const y1 = randInt(2, 12);
  const x1 = randInt(2, 12);
  const k = x1 * y1;
  const divisors = [];
  for (let d = 1; d <= k; d++) if (k % d === 0) divisors.push(d);
  let x2 = divisors[randInt(0, divisors.length - 1)];
  while (x2 === x1 && divisors.length > 1) x2 = divisors[randInt(0, divisors.length - 1)]; // 排除 x2=x1 的退化題（與 genL9S2 一致）
  return { question: `y 與 x 成反比。當 x = ${x1} 時 y = ${y1}，則當 x = ${x2} 時 y = ?`, answer: k / x2, type: 'input', questionSub: '反比：x × y = 定值 k' };
}

// Level 10, Stage 2: 括號式求根（(x − p)(x − q) = 0）
function genL10S2() {
  let p = randInt(-8, 8), q = randInt(-8, 8);
  while (q === p) q = randInt(-8, 8);
  const fac = r => r === 0 ? 'x' : (r > 0 ? `(x - ${r})` : `(x + ${-r})`);
  return { question: `${fac(p)}${fac(q)} = 0\n較大的根 x = ?`, answer: Math.max(p, q), type: 'input', allowNegative: true, questionSub: '每個括號各自等於 0（若因式是 x，代表有一個根是 0）' };
}

// Level 10, Stage 3: 因式分解求根（x² + bx + c = 0）
function genL10S3() {
  let r1 = randInt(-7, 7); while (r1 === 0) r1 = randInt(-7, 7);
  let r2 = randInt(-7, 7); while (r2 === 0 || r2 === r1 || r1 + r2 === 0) r2 = randInt(-7, 7);
  const b = -(r1 + r2);
  const c = r1 * r2;
  const bStr = (b === 1) ? '+ x' : (b === -1) ? '- x' : (b > 0 ? `+ ${b}x` : `- ${-b}x`);
  const cStr = c >= 0 ? `+ ${c}` : `- ${-c}`;
  return { question: `x² ${bStr} ${cStr} = 0\n較小的根 x = ?`, answer: Math.min(r1, r2), type: 'input', allowNegative: true, questionSub: '因式分解成兩個括號後求兩根' };
}

// Level 10, Stage 4: 判別式判斷實根個數（x² + bx + c = 0，a = 1）
function genL10S4() {
  const b = randInt(-6, 6);
  let c = randInt(-6, 9); while (c === 0) c = randInt(-6, 9);
  const D = b * b - 4 * c;
  const count = D > 0 ? '2 個' : (D === 0 ? '1 個' : '0 個');
  let bpart = '';
  if (b === 1) bpart = ' + x';
  else if (b === -1) bpart = ' - x';
  else if (b > 0) bpart = ` + ${b}x`;
  else if (b < 0) bpart = ` - ${-b}x`;
  const cpart = c >= 0 ? ` + ${c}` : ` - ${-c}`;
  return {
    question: `方程式 x²${bpart}${cpart} = 0\n有幾個不同（相異）的實數根？`,
    answer: count,
    type: 'choice',
    choices: shuffle(['2 個', '1 個', '0 個']),
    questionSub: '判別式 D = b² − 4ac：D>0 有 2 個相異實數根、D=0 有 1 個（重根，相異的只有 1 個）、D<0 沒有實數根'
  };
}

// Level 11, Stage 1: 角度計算（內角和／外角／多邊形）
function genL11S1() {
  const t = randInt(1, 3);
  if (t === 1) {
    let a1 = randInt(30, 80), a2 = randInt(30, 80);
    if (a1 + a2 >= 175) { a1 = 60; a2 = 70; }
    return { question: `三角形有兩個角是 ${a1}° 和 ${a2}°，第三個角是幾度？`, answer: 180 - a1 - a2, type: 'input', questionSub: '三角形內角和 = 180°' };
  } else if (t === 2) {
    const a1 = randInt(40, 80), a2 = randInt(40, 80);
    return { question: `三角形的一個外角等於「不相鄰的兩個內角」之和。若這兩個內角為 ${a1}° 和 ${a2}°，則這個外角是幾度？`, answer: a1 + a2, type: 'input', questionSub: '三角形的外角 = 兩個內對角之和' };
  } else {
    const n = randInt(3, 8);
    return { question: `${n} 邊形的內角和是幾度？`, answer: (n - 2) * 180, type: 'input', questionSub: 'n 邊形內角和 =（n − 2）× 180°' };
  }
}

// Level 11, Stage 2: 平行線截角
function genL11S2() {

    return { question: `兩條平行線被一直線所截，其中一個角為 ${theta}°，與它「同旁內角」的角是幾度？`, answer: 180 - theta, type: 'input', questionSub: '兩平行線的同旁內角互補（和為 180°）' };

// Level 11, Stage 4: 面積（平行四邊形／梯形／三角形）
function genL11S4() {
  const t = randInt(1, 3);
  if (t === 1) {
    const base = randInt(4, 15), h = randInt(3, 12);
    return { question: `平行四邊形：底 ${base}，高 ${h}\n面積 = ?`, answer: base * h, type: 'input', questionSub: '平行四邊形面積 = 底 × 高' };
  } else if (t === 2) {

    return { question: `梯形：上底 ${top}，下底 ${bot}，高 ${h}\n面積 = ?`, answer: (top + bot) * h / 2, type: 'input', questionSub: '梯形面積 =（上底 ＋ 下底）× 高 ÷ 2' };
  } else {
    const base = randInt(3, 16);
    let h = randInt(2, 12);
    if ((base * h) % 2 !== 0) h += 1;
    return { question: `三角形：底 ${base}，高 ${h}\n面積 = ?`, answer: base * h / 2, type: 'input', questionSub: '三角形面積 = 底 × 高 ÷ 2' };

// Level 12, Stage 1: 平均數
function genL12S1() {
  const n = randInt(4, 5);
  let nums, sum;
  do {
    nums = [];
    for (let i = 0; i < n; i++) nums.push(randInt(2, 30));
    sum = nums.reduce((s, v) => s + v, 0);
  } while (sum % n !== 0);
  return { question: `資料：${nums.join('、')}\n這組數的平均數 = ?`, answer: sum / n, type: 'input', questionSub: '平均數 = 總和 ÷ 個數' };
}

// Level 12, Stage 2: 中位數與眾數
function genL12S2() {
  if (Math.random() < 0.5) {
    const nums = [];
    for (let i = 0; i < 5; i++) nums.push(randInt(1, 30));
    const sorted = [...nums].sort((a, b) => a - b);
    return { question: `資料：${nums.join('、')}\n這組數的中位數 = ?`, answer: sorted[2], type: 'input', questionSub: '中位數：由小到大排序後，最中間的那個數' };
  } else {
    const modeVal = randInt(1, 9);
    let o1 = randInt(1, 9); while (o1 === modeVal) o1 = randInt(1, 9);
    let o2 = randInt(1, 9); while (o2 === modeVal || o2 === o1) o2 = randInt(1, 9);
    const nums = shuffle([modeVal, modeVal, modeVal, o1, o2]);
    return { question: `資料：${nums.join('、')}\n這組數的眾數 = ?`, answer: modeVal, type: 'input', questionSub: '眾數：出現次數最多的那個數' };
  }
}

// Level 12, Stage 3: 球的機率
function genL12S3() {
  const red = randInt(1, 6), blue = randInt(1, 6), green = randInt(0, 4);
  const total = red + blue + green;
  const colors = [['紅', red], ['藍', blue]];
  if (green > 0) colors.push(['綠', green]);
  const pick = colors[randInt(0, colors.length - 1)];
  const num = pick[1], den = total;
  const g = gcd(num, den);
  return {
    question: `袋子裡有 ${red} 顆紅球、${blue} 顆藍球${green > 0 ? `、${green} 顆綠球` : ''}。\n隨機抽一顆，抽到${pick[0]}球的機率 = ?`,
    answer: den / g === 1 ? `${num / g}` : `${num / g}/${den / g}`,
    type: 'fraction',
    answerNum: num / g,
    answerDen: den / g,
    questionSub: '機率 = 想要的結果數 ÷ 全部結果數（可不約分）'
  };
}

// ==================== SCREEN MANAGEMENT ====================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');

  // Update nav
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    btn.classList.remove('active');
  });
  const navMap = { home: 0, daily: 1, wrong: 2, stats: 3 };
  if (navMap[name] !== undefined) {
    document.querySelectorAll('.nav-btn')[navMap[name]].classList.add('active');
  }

  // Show/hide nav during game
  const hideNav = ['game', 'result', 'daily'].includes(name);
  document.getElementById('bottom-nav').style.display = hideNav ? 'none' : 'flex';

  // Refresh screen content
  if (name === 'home') renderHome();
  if (name === 'wrong') renderWrongBook();
  if (name === 'stats') renderStats();

  // BOSS 戰 hook：離開 game 畫面時收起 HUD/浮層，進王之殿堂時渲染
  if (window.MathBoss) { try { MathBoss.onScreen(name); } catch (e) {} }
}

    card.className = `stage-card${unlocked ? '' : ' locked'}${isBoss ? ' boss' : ''}`;

// ==================== GAMEPLAY ====================
function startStage(level, stage) {
  gameState = {
    level,
    stage,
    questions: generateQuestions(level, stage, 10),
    current: 0,
    errors: 0,
    combo: 0,
    maxCombo: 0,
    expEarned: 0,
    answers: []
  };

  const levelInfo = LEVELS[level];
  document.getElementById('game-title').textContent = `${levelInfo.icon} ${levelInfo.stages[stage]}`;
  document.getElementById('screen-game').style.background = '';

  showScreen('game');
  renderQuestion();
}

function renderQuestion() {
  const q = gameState.questions[gameState.current];
  gameState.answered = false;  // 單題鎖：新題目重置，杜絕回饋期間連點重複計分

  // Progress dots
  const dots = document.getElementById('progress-dots');
  dots.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if (i < gameState.current) {
      dot.className += gameState.answers[i] ? ' correct' : ' wrong';
      dot.textContent = gameState.answers[i] ? '✓' : '✗';
    } else if (i === gameState.current) {
      dot.className += ' current';
      dot.textContent = i + 1;
    } else {
      dot.textContent = i + 1;
    }
    dots.appendChild(dot);
  }

  // Combo display
  const comboEl = document.getElementById('combo-display');
  if (gameState.combo >= 2) {
    const fireLevel = Math.min(gameState.combo, 5);
    const fires = '🔥'.repeat(Math.min(fireLevel, 3));
    comboEl.innerHTML = `<span class="combo-text ${fireLevel >= 4 ? 'fire-anim' : ''}">${fires} ×${gameState.combo} 連擊！</span>`;
  } else {
    comboEl.innerHTML = '';
  }

  // Question
  const questionText = document.getElementById('question-text');
  const questionSub = document.getElementById('question-sub');

  if (q.isObjects) {
    questionText.innerHTML = `<div class="objects-display">${q.question}</div>`;
  } else if (q.question.includes('\n')) {
    questionText.innerHTML = q.question.split('\n').join('<br>');
  } else {
    questionText.textContent = q.question;
  }
  questionSub.textContent = q.questionSub || '';

  // Answer area
  const area = document.getElementById('answer-area');
  area.innerHTML = '';

  if (q.type === 'choice') {
    renderChoices(area, q);
  } else if (q.type === 'fraction') {
    renderFractionInput(area, q);
  } else if (q.type === 'decimal') {
    renderDecimalInput(area, q);
  } else {
    renderNumpad(area, q);
  }
}

function renderChoices(container, q) {
  const grid = document.createElement('div');
  grid.className = 'choices-grid';
  if (q.choices.length === 3) {
    grid.style.gridTemplateColumns = '1fr 1fr 1fr';
  }

  q.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.onclick = () => handleChoiceAnswer(choice, q, grid);
    grid.appendChild(btn);
  });

  container.appendChild(grid);
}


// ── 診斷式迷思回饋（答錯時給對症提示；由 math 團隊撰寫+對抗式驗證，永不對正解誤診）──
function mathDiag(question, correctAnswer, userAnswer) {
  // ---------- helpers ----------
  // Convert full-width digits/operators to half-width and unify operator glyphs.
  function normalize(str) {
    if (str === null || str === undefined) return '';
    var s = String(str);
    // full-width digits FF10-FF19 -> 0-9
    s = s.replace(/[０-９]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    });
    s = s.replace(/．/g, '.');            // full-width period
    s = s.replace(/[＋]/g, '+');          // full-width plus
    s = s.replace(/[−－–—―﹣ｰ]/g, '-');  // minus variants
    s = s.replace(/[×✕✖╳＊\*ｘ]/g, '×'); // multiply variants -> ×
    s = s.replace(/[÷]/g, '÷');           // divide
    s = s.replace(/[／]/g, '/');          // full-width slash -> fraction slash
    s = s.replace(/[＞]/g, '>').replace(/[＜]/g, '<').replace(/[＝]/g, '=');
    return s;
  }
  function num(x) {
    return parseFloat(normalize(x).replace(/\s+/g, ''));
  }
  function approx(a, b) { return Math.abs(a - b) < 1e-9; }

  var q = normalize(question).trim();
  var uaRaw = normalize(userAnswer).trim();

  // ============================================================
  // 1) COMPARISON  "a ○ b"  (answer is > < =)
  //    Operands may be fractions/decimals, so we intentionally trust
  //    correctAnswer (the caller-computed symbol) for the factual claim
  //    instead of re-parsing the operands numerically.
  // ============================================================
  if (q.indexOf('○') !== -1) {
    var parts = q.split('○');
    if (parts.length === 2) {
      var left = parts[0].trim();
      var right = parts[1].trim();
      var correct = normalize(correctAnswer).trim();
      var user = uaRaw;
      if (user && user !== correct && (user === '>' || user === '<' || user === '=')) {
        if (correct === '=') {
          return '兩邊其實一樣大！' + left + ' 和 ' + right +
            ' 相等，要用「=」。先把兩邊都算出來再比一比。';
        }
        if (correct === '>') {
          return '符號的開口要對著比較大的數！' + left + ' 比 ' + right +
            ' 大，所以要用「>」。';
        } else if (correct === '<') {
          return '符號的開口要對著比較大的數！' + right + ' 比 ' + left +
            ' 大，所以要用「<」。';
        }
      }
    }
    return null;
  }

  // ============================================================
  // 2) UNIT CONVERSION  "X 公分 = ? 公尺" etc.
  // ============================================================
  var unitRe = /^(\d+(?:\.\d+)?)\s*(公分|公尺|公克|公斤)\s*=\s*\?\s*(公分|公尺|公克|公斤)/;
  var um = q.match(unitRe);
  if (um) {
    var val = parseFloat(um[1]);
    var uFrom = um[2], uTo = um[3];
    var uv = num(userAnswer);
    if (isNaN(uv)) return null;
    var lengthUnits = { '公分': 'small', '公尺': 'big' };
    var weightUnits = { '公克': 'small', '公斤': 'big' };
    var F, otherF, sizeFrom, sizeTo, pairName;
    if (lengthUnits[uFrom] && lengthUnits[uTo]) {
      F = 100; otherF = 1000; sizeFrom = lengthUnits[uFrom]; sizeTo = lengthUnits[uTo];
      pairName = '公分和公尺之間是 100 倍（100 公分 = 1 公尺），不是 1000 倍！';
    } else if (weightUnits[uFrom] && weightUnits[uTo]) {
      F = 1000; otherF = 100; sizeFrom = weightUnits[uFrom]; sizeTo = weightUnits[uTo];
      pairName = '公克和公斤之間是 1000 倍（1000 公克 = 1 公斤），不是 100 倍！';
    } else {
      return null; // mixed length/weight — nonsensical, skip
    }
    var bigToSmall = (sizeFrom === 'big' && sizeTo === 'small'); // multiply
    var smallToBig = (sizeFrom === 'small' && sizeTo === 'big'); // divide
    if (!bigToSmall && !smallToBig) return null;
    var correctVal = bigToSmall ? (val * F) : (val / F);
    if (approx(uv, correctVal)) return null; // actually correct

    // (a) reversed operation, correct factor
    var reversedVal = bigToSmall ? (val / F) : (val * F);
    if (approx(uv, reversedVal)) {
      var dir = bigToSmall
        ? ('大單位換小單位要「乘」' + F + '倍')
        : ('小單位換大單位要「除以」' + F);
      return '單位換算的乘除要看方向！' + val + ' ' + uFrom + ' 換成 ' + uTo +
        '：' + dir + '。答案是 ' + correctVal + ' ' + uTo + '。';
    }
    // (b) right direction, wrong factor
    var wrongFactorVal = bigToSmall ? (val * otherF) : (val / otherF);
    if (approx(uv, wrongFactorVal)) {
      return pairName + '答案是 ' + correctVal + ' ' + uTo + '。';
    }
    return null;
  }

  // ============================================================
  // 3) SAME-DENOMINATOR FRACTION add / subtract  "n1/d ± n2/d = ?"
  // ============================================================
  var fracRe = /^(\d+)\s*\/\s*(\d+)\s*([+\-])\s*(\d+)\s*\/\s*(\d+)\s*=/;
  var fm = q.match(fracRe);
  if (fm) {
    var n1 = parseInt(fm[1], 10), d1 = parseInt(fm[2], 10);
    var op = fm[3];
    var n2 = parseInt(fm[4], 10), d2 = parseInt(fm[5], 10);
    if (d1 === d2 && d1 !== 0) {
      var d = d1;
      var uf = uaRaw.match(/^(\d+)\s*\/\s*(\d+)$/);
      var un, ud;
      if (uf) { un = parseInt(uf[1], 10); ud = parseInt(uf[2], 10); }
      else if (/^\d+$/.test(uaRaw)) { un = parseInt(uaRaw, 10); ud = 1; }
      else return null;

      function sameFrac(a, b, c, e) { // a/b == c/e ?  (b,e must be > 0)
        if (b === 0 || e === 0) return false;
        return a * e === c * b;
      }

      // (a) denominator wrongly combined too:  (n1+n2)/(d+d)  e.g. 2/5+1/5 = 3/10
      if (op === '+') {
        if (ud !== 0 && sameFrac(un, ud, n1 + n2, d + d)) {
          return '分母不用相加喔！同分母相加時，分母保持不變，只把分子相加：' +
            n1 + '/' + d + ' + ' + n2 + '/' + d + ' = ' + (n1 + n2) + '/' + d + '。';
        }
      }
      // (b) wrong operation on numerators
      if (op === '+' && sameFrac(un, ud, n1 - n2, d)) {
        return '這題是「＋」相加，分子要相加（分母不變）：' +
          n1 + '/' + d + ' + ' + n2 + '/' + d + ' = ' + (n1 + n2) + '/' + d + '。';
      }
      if (op === '-' && sameFrac(un, ud, n1 + n2, d)) {
        return '這題是「−」相減，分子要相減（分母不變）：' +
          n1 + '/' + d + ' − ' + n2 + '/' + d + ' = ' + (n1 - n2) + '/' + d + '。';
      }
      return null;
    }
    return null;
  }

  // ============================================================
  // 4) INTEGER ARITHMETIC  a + b / a - b / a × b / a ÷ b = ?
  // ============================================================
  var uv2 = num(userAnswer);

  // digit-wise no-carry addition (classic "forgot to carry")
  function noCarryAdd(a, b) {
    var res = 0, place = 1, hadCarry = false;
    while (a > 0 || b > 0) {
      var da = a % 10, db = b % 10;
      if (da + db >= 10) hadCarry = true;
      res += ((da + db) % 10) * place;
      place *= 10;
      a = Math.floor(a / 10); b = Math.floor(b / 10);
    }
    return { value: res, hadCarry: hadCarry };
  }
  // digit-wise "always big minus small" (classic borrow error)
  function colAbsDiff(a, b) {
    var res = 0, place = 1, neededBorrow = false;
    while (a > 0 || b > 0) {
      var da = a % 10, db = b % 10;
      if (da < db) neededBorrow = true;
      res += Math.abs(da - db) * place;
      place *= 10;
      a = Math.floor(a / 10); b = Math.floor(b / 10);
    }
    return { value: res, neededBorrow: neededBorrow };
  }

  var mAdd = q.match(/^(\d+)\s*\+\s*(\d+)\s*=/);
  if (mAdd) {
    var a = parseInt(mAdd[1], 10), b = parseInt(mAdd[2], 10);
    if (isNaN(uv2)) return null;
    var sum = a + b;
    if (approx(uv2, sum)) return null;
    var nc = noCarryAdd(a, b);
    if (nc.hadCarry && nc.value !== sum && approx(uv2, nc.value)) {
      var au = a % 10, bu = b % 10;
      var eg = (au + bu >= 10) ? ('像個位 ' + au + '+' + bu + '=' + (au + bu) + '，就要進位。') : '';
      return '再檢查一次進位喔！只要某一位相加滿 10，就要往左邊那一位進 1。' +
        eg + '正確答案是 ' + sum + '。';
    }
    return null;
  }

  var mSub = q.match(/^(\d+)\s*-\s*(\d+)\s*=/);
  if (mSub) {
    var a2 = parseInt(mSub[1], 10), b2 = parseInt(mSub[2], 10);
    if (isNaN(uv2)) return null;
    var diff = a2 - b2;
    if (approx(uv2, diff)) return null;
    var cd = colAbsDiff(a2, b2);
    if (cd.neededBorrow && cd.value !== diff && approx(uv2, cd.value)) {
      var au2 = a2 % 10, bu2 = b2 % 10;
      var eg2 = (au2 < bu2) ? ('像個位 ' + au2 + ' 比 ' + bu2 + ' 小，就要向左邊借位。') : '';
      return '減法不能「大減小」喔！上面的數字比下面小時，要向左邊「借 1 當 10」。' +
        eg2 + '再算一次，答案是 ' + diff + '。';
    }
    return null;
  }

  var mMul = q.match(/^(\d+)\s*×\s*(\d+)\s*=/);
  if (mMul) {
    var a3 = parseInt(mMul[1], 10), b3 = parseInt(mMul[2], 10);
    if (isNaN(uv2)) return null;
    var prod = a3 * b3;
    if (approx(uv2, prod)) return null;
    // (a) added instead of multiplied
    if (a3 + b3 !== prod && approx(uv2, a3 + b3)) {
      return '× 是「乘」不是「加」喔！' + a3 + ' × ' + b3 +
        ' 的意思是 ' + b3 + ' 個 ' + a3 + ' 相加（不是 ' + a3 + '+' + b3 +
        '）。答案是 ' + prod + '。';
    }
    // (b) off by one group
    if (approx(uv2, a3 * (b3 - 1)) || approx(uv2, a3 * (b3 + 1)) ||
        approx(uv2, (a3 - 1) * b3) || approx(uv2, (a3 + 1) * b3)) {
      return '差一組而已！' + a3 + ' × ' + b3 + ' 要算「' + b3 + ' 個 ' + a3 +
        '」。再數一次有沒有多算或少算一組，答案是 ' + prod + '。';
    }
    return null;
  }

  var mDiv = q.match(/^(\d+)\s*÷\s*(\d+)\s*=/);
  if (mDiv) {
    var a4 = parseInt(mDiv[1], 10), b4 = parseInt(mDiv[2], 10);
    if (isNaN(uv2) || b4 === 0) return null;
    var quo = a4 / b4;
    if (approx(uv2, quo)) return null;
    // (a) multiplied instead of divided
    if (a4 * b4 !== quo && approx(uv2, a4 * b4)) {
      return '÷ 是「平分」不是相乘喔！' + a4 + ' ÷ ' + b4 +
        ' 是把 ' + a4 + ' 平分成 ' + b4 + ' 份，看每份多少。答案是 ' + quo + '。';
    }
    // (b) divisor/dividend reversed (only if that gives a clean integer)
    if (a4 !== 0) {
      var rev = b4 / a4;
      if (Number.isInteger(rev) && !approx(rev, quo) && approx(uv2, rev)) {
        return '除數和被除數放反了！是 ' + a4 + ' ÷ ' + b4 +
          '（把 ' + a4 + ' 平分成 ' + b4 + ' 份），不是 ' + b4 + ' ÷ ' + a4 +
          '。答案是 ' + quo + '。';
      }
    }
    // (c) off-by-one quotient
    if (Number.isInteger(quo) && (approx(uv2, quo - 1) || approx(uv2, quo + 1))) {
      return '很接近了！' + a4 + ' ÷ ' + b4 + ' 要想「' + b4 +
        ' 乘以幾會等於 ' + a4 + '」。因為 ' + b4 + ' × ' + quo + ' = ' + a4 +
        '，答案是 ' + quo + '。';
    }
    return null;
  }

  return null;
}
function revealMethodText(q, userAnswer){
  try { if (typeof mathDiag === "function") { var d = mathDiag(q.question, q.answer, userAnswer); if (d) return d; } } catch(e){}
  return q.questionSub ? ("解法：" + q.questionSub) : "";
}

function handleChoiceAnswer(selected, q, grid) {
  const correct = String(selected) === String(q.answer);
  const buttons = grid.querySelectorAll('.choice-btn');

  buttons.forEach(btn => {
    btn.onclick = null;
    if (btn.textContent === String(q.answer)) {
      btn.classList.add('correct');
    }
    if (btn.textContent === selected && !correct) {
      btn.classList.add('wrong');
    }
  });

  // 答錯時補上回饋：優先對症診斷（mathDiag），否則退回一般解法提示
  if (!correct) {
    const _mt = revealMethodText(q, selected);
    const area = document.getElementById('answer-area');
    if (_mt && area && !area.querySelector('.reveal-method')) {
      const reveal = document.createElement('div');
      reveal.className = 'correct-reveal';
      const methodLine = document.createElement('div');
      methodLine.className = 'reveal-method';
      methodLine.textContent = _mt;
      reveal.appendChild(methodLine);
      area.appendChild(reveal);
    }
  }

  processAnswer(correct, selected, q);
}

function renderNumpad(container, q) {

  container.appendChild(inputDisplay);

  const numpad = document.createElement('div');
  numpad.className = 'numpad';

  const buttons = ['7','8','9','⌫','4','5','6','C','1','2','3','',
    q.allowNegative ? '(-)' : '0', q.allowNegative ? '0' : '', q.allowNegative ? '' : '', '✓'];

  // Better layout
  const layout = q.allowNegative ?
    ['7','8','9','⌫','4','5','6','C','1','2','3','(-)','','0','','✓'] :

function submitNumpadAnswer(q) {
  const display = document.getElementById('numpad-display');
  if (!display || !display.textContent) return;

  const userAnswer = display.textContent.trim();
  let correct = false;

  if (q.type === 'decimal') {
    correct = parseFloat(userAnswer) === parseFloat(q.answer);
  } else {
    correct = parseInt(userAnswer) === parseInt(q.answer);
  }

  // Show correct answer if wrong
  if (!correct) {
    const area = document.getElementById('answer-area');
    const reveal = document.createElement('div');
    reveal.className = 'correct-reveal';
    const ansLine = document.createElement('div');
    ansLine.textContent = `正確答案: ${q.answer}`;
    reveal.appendChild(ansLine);
    { const _mt = revealMethodText(q, userAnswer);
      if (_mt) {
        const methodLine = document.createElement('div');
        methodLine.className = 'reveal-method';
        methodLine.textContent = _mt;
        reveal.appendChild(methodLine);
      } }
    area.appendChild(reveal);
  }

  processAnswer(correct, userAnswer, q);
}

function submitFractionAnswer(q) {
  const display = document.getElementById('numpad-display');
  if (!display || !display.textContent) return;

  const userAnswer = display.textContent.trim();
  let correct = false;

  // Parse user fraction
  if (userAnswer.includes('/')) {
    const parts = userAnswer.split('/');
    const userNum = parseInt(parts[0]);
    const userDen = parseInt(parts[1]);
    if (!isNaN(userNum) && !isNaN(userDen) && userDen !== 0) {
      // Compare by simplifying both
      const userG = gcd(Math.abs(userNum), Math.abs(userDen));
      const simpNum = userNum / userG;
      const simpDen = userDen / userG;
      correct = (simpNum === q.answerNum && simpDen === q.answerDen);
    }
  } else {
    // Maybe they entered a whole number
    const num = parseInt(userAnswer);
    if (!isNaN(num) && q.answerDen === 1) {
      correct = (num === q.answerNum);
    }
  }

  if (!correct) {
    const area = document.getElementById('answer-area');
    const reveal = document.createElement('div');
    reveal.className = 'correct-reveal';
    const ansLine = document.createElement('div');
    ansLine.textContent = `正確答案: ${q.answer}`;
    reveal.appendChild(ansLine);
    { const _mt = revealMethodText(q, userAnswer);
      if (_mt) {
        const methodLine = document.createElement('div');
        methodLine.className = 'reveal-method';
        methodLine.textContent = _mt;
        reveal.appendChild(methodLine);
      } }
    area.appendChild(reveal);
  }

  processAnswer(correct, userAnswer, q);
}

function processAnswer(correct, userAnswer, q) {
  if (gameState.answered) return;  // 單題鎖：本題已作答，忽略回饋期間的重複送出（防 numpad/分數連點灌水 XP）
  gameState.answered = true;
  gameRecord(correct);
  state.stats.totalAttempts++;

  if (correct) {
    state.stats.totalCorrect++;
    gameState.combo++;
    if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
    if (gameState.combo > state.stats.bestCombo) state.stats.bestCombo = gameState.combo;

    const comboBonus = Math.min(gameState.combo - 1, 4) * 5;
    const exp = 10 + comboBonus;
    gameState.expEarned += exp;
    state.progress.exp += exp;

    gameState.answers.push(true);

    playSound(gameState.combo >= 3 ? 'combo' : 'correct');
    showFeedback(true);
  } else {
    gameState.errors++;
    gameState.combo = 0;
    gameState.answers.push(false);

    playSound('wrong');
    showFeedback(false);

    // Record wrong answer (skip during wrong book practice)
    if (gameState.level >= 0 && gameState.stage >= 0) {
      state.wrong.unshift({
        question: q.question,
        userAnswer: String(userAnswer),
        correctAnswer: String(q.answer),
        questionSub: q.questionSub || '',
        level: gameState.level + 1,
        stage: gameState.stage + 1,
        timestamp: Date.now()
      });
      if (state.wrong.length > 50) state.wrong.pop();
    }

    // Shake question card
    document.getElementById('question-card').classList.add('shake');
    setTimeout(() => {
      document.getElementById('question-card').classList.remove('shake');
    }, 300);
  }

  // BOSS 戰 hook：combo 已結算；扣血/演出，擊敗時把 current 設 999 讓下方 setTimeout 觸發 finishStage
  if (gameState.boss && window.MathBoss) { try { MathBoss.onAnswer(correct, gameState.combo, q); } catch (e) {} }

  saveState();

  // Move to next question after delay
  setTimeout(() => {
    gameState.current++;
    if (gameState.current >= 10) {
      finishStage();
    } else {
      renderQuestion();
    }
  }, correct ? 800 : 2800);
}

function showFeedback(correct) {
  const overlay = document.getElementById('feedback-overlay');
  overlay.innerHTML = correct ?
    '<div class="feedback-correct">⭐</div>' :
    '<div class="feedback-wrong">🤔</div>';
  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 800);
}

function finishStage() {
  // BOSS 戰 hook：提早返回，跳過星星/showResult，改走 BOSS 結算
  if (gameState.boss && window.MathBoss) { try { return MathBoss.finishBattle(); } catch (e) {} }
  const errors = gameState.errors;
  let stars = 0;
  if (errors === 0) stars = 3;
  else if (errors <= 2) stars = 2;
  else if (errors <= 4) stars = 1;
  else stars = 0;

  // Save stars (keep best) - skip for wrong book practice
  if (gameState.level >= 0 && gameState.stage >= 0) {
    const key = `${gameState.level + 1}-${gameState.stage + 1}`;
    const prevStars = state.progress.stars[key] || 0;
    if (stars > prevStars) {
      state.progress.stars[key] = stars;
    }
  }

  // Update streak
  const today = new Date().toISOString().split('T')[0];
  if (state.stats.lastPlay !== today) {
    if (state.stats.lastPlay) {
      const last = new Date(state.stats.lastPlay);
      const diff = Math.floor((new Date(today) - last) / 86400000);
      if (diff === 1) state.stats.streak++;
      else if (diff > 1) state.stats.streak = 1;
    } else {
      state.stats.streak = 1;
    }
    state.stats.lastPlay = today;
  }

  saveState();

  // Show result
  showResult(stars, errors);
}

function showResult(stars, errors) {
  const starsText = stars > 0 ? '⭐'.repeat(stars) + '☆'.repeat(3 - stars) : '🌱🌱🌱';
  let title = '';
  if (stars === 3) title = '完美通關！';
  else if (stars === 2) title = '表現不錯！';
  else if (stars === 1) title = '順利過關，繼續加油！';
  else title = '差一點點，再挑戰一次！';

  const correct = 10 - errors;
  const isPractice = gameState.level < 0;
  const replayAction = isPractice ? `practiceWrong()` : `startStage(${gameState.level}, ${gameState.stage})`;
  const backLabel = isPractice ? '← 返回' : '➡️ 繼續';
  const backAction = isPractice ? `showScreen('home')` : `showStages(${gameState.level})`;
  const card = document.getElementById('result-card');
  card.innerHTML = `
    <div class="result-stars">${starsText}</div>
    <div class="result-title">${title}</div>
    <div class="result-stats">
      正確: ${correct} / 10<br>
      最高連擊: ×${gameState.maxCombo}
    </div>
    <div class="result-exp">+${gameState.expEarned} 經驗值 🎉</div>
    <div class="result-buttons">
      <button class="btn btn-secondary" onclick="${replayAction}">🔄 重玩</button>
      <button class="btn btn-primary" onclick="${backAction}">${backLabel}</button>
    </div>
  `;

  showScreen('result');

  if (stars === 3) {
    playSound('levelup');
    launchConfetti();
  } else if (stars > 0) {
    playSound('correct');
  }
}

function confirmQuit() {

// ==================== DAILY CHALLENGE ====================
// 每日挑戰的難度上限（0-based level index）。
// 規則：只從「孩子目前已達到的關卡與其以下」出題，預設為等級 4（index 3）；
// 且硬性封頂在等級 4 —— 每日模式「絕不」出現等級 5 以上內容
// （不含負數、ax+b=c、座標象限等）。超前學習只在自由/練習模式開放。
const DAILY_LEVEL_CAP = 3; // 等級 4
function dailyMaxLevel() {
  // 由星星進度推得「已達到的最高關卡」：某關至少拿到 1 顆星即視為已達到。
  let reached = -1;
  for (let i = 0; i < LEVELS.length; i++) {
    for (let s = 1; s <= 5; s++) {
      if (getStageStars(i, s) > 0) { reached = i; break; }
    }
  }
  // 尚無任何進度 → 預設等級 4；否則取已達到關卡，但一律不超過等級 4 硬上限。
  const cap = (reached < 0) ? DAILY_LEVEL_CAP : Math.min(reached, DAILY_LEVEL_CAP);
  return Math.max(0, cap);
}

function startDaily() {
  const today = new Date().toISOString().split('T')[0];

  // 依「已達到關卡且封頂等級 4」的上限出題，確保每日題目都在可贏區間。
  const maxLevel = dailyMaxLevel();
  const questions = [];
  for (let i = 0; i < 10; i++) {
    const level = randInt(0, maxLevel);
    const stage = randInt(0, 3); // 不含 BOSS 關
    questions.push(generateQuestion(level, stage));
  }

  dailyState = {
    questions,
    results: [],
    current: 0,
    score: 0,
    timer: 60,
    interval: null,
    active: true
  };

  showScreen('daily');
  renderDailyQuestion();
  startDailyTimer();
}

function startDailyTimer() {
  document.getElementById('daily-timer').textContent = dailyState.timer;
  dailyState.interval = setInterval(() => {
    dailyState.timer--;
    const timerEl = document.getElementById('daily-timer');
    timerEl.textContent = dailyState.timer;
    if (dailyState.timer <= 10) {
      timerEl.classList.add('warning');
    }
    if (dailyState.timer <= 0) {
      endDaily();
    }
  }, 1000);
}

function renderDailyQuestion() {
  if (dailyState.current >= 10) {
    endDaily();
    return;
  }

  const q = dailyState.questions[dailyState.current];

  // Progress
  const prog = document.getElementById('daily-progress');
  prog.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if (i < dailyState.current) {
      var ok = dailyState.results[i] !== false;   // 依實際對錯標示（原本一律打勾，會誤導）
      dot.className += ok ? ' correct' : ' wrong';
      dot.textContent = ok ? '✓' : '✗';
    } else if (i === dailyState.current) {
      dot.className += ' current';
      dot.textContent = i + 1;
    } else {
      dot.textContent = i + 1;
    }
    prog.appendChild(dot);
  }

  document.getElementById('daily-score').textContent = `得分: ${dailyState.score}`;

  const questionText = document.getElementById('daily-question-text');
  const questionSub = document.getElementById('daily-question-sub');

  if (q.isObjects) {
    questionText.innerHTML = `<div class="objects-display">${q.question}</div>`;
  } else if (q.question.includes('\n')) {
    questionText.innerHTML = q.question.split('\n').join('<br>');
  } else {
    questionText.textContent = q.question;
  }
  questionSub.textContent = q.questionSub || '';

  const area = document.getElementById('daily-answer-area');
  area.innerHTML = '';

  if (q.type === 'choice') {
    renderDailyChoices(area, q);
  } else if (q.type === 'fraction') {
    renderDailyFractionInput(area, q);
  } else if (q.type === 'decimal') {
    renderDailyDecimalInput(area, q);
  } else {
    renderDailyNumpad(area, q);
  }
}

function renderDailyChoices(container, q) {
  const grid = document.createElement('div');
  grid.className = 'choices-grid';
  if (q.choices.length === 3) {
    grid.style.gridTemplateColumns = '1fr 1fr 1fr';
  }

  q.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.onclick = () => {
      const correct = String(choice) === String(q.answer);
      gameRecord(correct);
      if (correct) dailyState.score += 10; dailyState.results.push(!!correct);
      grid.querySelectorAll('.choice-btn').forEach(b => { b.onclick = null; });
      btn.classList.add(correct ? 'correct' : 'wrong');
      playSound(correct ? 'correct' : 'wrong');
      setTimeout(() => { dailyState.current++; renderDailyQuestion(); }, 600);
    };
    grid.appendChild(btn);
  });

  container.appendChild(grid);
}

function renderDailyNumpad(container, q) {
  const inputDisplay = document.createElement('div');
  inputDisplay.className = 'numpad-input';
  inputDisplay.id = 'daily-numpad-display';
  inputDisplay.textContent = '';
  container.appendChild(inputDisplay);

  const numpad = document.createElement('div');
  numpad.className = 'numpad';

  const layout = q.allowNegative ?
    ['7','8','9','⌫','4','5','6','C','1','2','3','(-)','','0','','✓'] :
    ['7','8','9','⌫','4','5','6','C','1','2','3','','','0','','✓'];

  layout.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'numpad-btn';
    if (key === '✓') btn.className += ' submit';
    if (key === '⌫') btn.className += ' backspace';
    if (key === '(-)') btn.className += ' negative';
    btn.textContent = key;
    btn.style.visibility = key === '' ? 'hidden' : 'visible';

    btn.onclick = () => {
      playSound('click');
      const display = document.getElementById('daily-numpad-display');
      if (!display) return;

      if (key === '⌫') {
        display.textContent = display.textContent.slice(0, -1);
      } else if (key === 'C') {
        display.textContent = '';
      } else if (key === '(-)') {
        if (display.textContent.startsWith('-')) {
          display.textContent = display.textContent.slice(1);
        } else {
          display.textContent = '-' + display.textContent;
        }
      } else if (key === '✓') {
        const val = display.textContent.trim();
        if (!val) return;
        if (numpad.dataset.locked) return;  // 單題作答鎖：防 600ms 換題前 ✓ 連點重複計分/前進
        numpad.dataset.locked = '1';
        const correct = parseInt(val) === parseInt(q.answer);
        gameRecord(correct);
        if (correct) dailyState.score += 10; dailyState.results.push(!!correct);
        playSound(correct ? 'correct' : 'wrong');
        setTimeout(() => { dailyState.current++; renderDailyQuestion(); }, 600);
      } else {
        display.textContent += key;
      }
    };

    numpad.appendChild(btn);
  });

  container.appendChild(numpad);
}
