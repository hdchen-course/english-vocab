<!DOCTYPE html>
<html lang="zh-TW" data-game-wired="math">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數學冒險王</title>
<!-- 統一遊戲化引擎：主題 token、HUD/toast 樣式、共用引擎（同步載入於 <head>）。
     app.css 先於本頁 <style> 載入，本頁樣式在後、逐屬性覆蓋，維持原本外觀（並取得夜間模式）。
     data-game-wired 亦置於 <html>：引擎於 <head> 同步執行時 document.body 尚為 null，
     須靠 <html> 讓 deltaSync 當下即抑制 math 來源的重複計分（見 game_core.js 說明）。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* 各年級（level）名稱文字色：亮色 accent 直接當文字只有 2.0–4.0:1（不過 AA）。
   改用「on-surface ink」的加深/提亮版，於亮色奶油卡與暗色卡皆 ≥4.5:1（見對比表）。
   僅供「文字」使用；卡片邊框/圖示底仍沿用 LEVELS[].color 原色（大面積/裝飾）。 */
:root {
  --lvl-ink-1: #15803d;  /* 等級 1 綠 on cream 4.81:1 */
  --lvl-ink-2: #1d4ed8;  /* 等級 2 藍 6.43:1 */
  --lvl-ink-3: #b45309;  /* 等級 3 橘 4.82:1 */
  --lvl-ink-4: #c81e1e;  /* 等級 4 紅 5.50:1 */
  --lvl-ink-5: #6d28d9;  /* 等級 5 紫 6.82:1 */
  --lvl-ink-6: #be185d;  /* 等級 6 桃 5.79:1 */
  --lvl-ink-7: #0f766e;  /* 等級 7 青 5.25:1 */
}
:root[data-theme="dark"] {
  --lvl-ink-1: #4ade80;  /* on dark card 8.34:1 */
  --lvl-ink-2: #60a5fa;  /* 5.72:1 */
  --lvl-ink-3: #fbbf24;  /* 8.70:1 */
  --lvl-ink-4: #f87171;  /* 5.25:1 */
  --lvl-ink-5: #a78bfa;  /* 5.34:1 */
  --lvl-ink-6: #f472b6;  /* 5.49:1 */
  --lvl-ink-7: #2dd4bf;  /* 7.81:1 */
}

/* 本頁強調色三件組（數學紫）：讓所有共用設計語彙的重點色一致換色，
   與 index/social/finance「同一位設計師」的手感一致（僅外觀，不動功能）。 */
:root {
  --accent: var(--c-math);
  --accent-tint: var(--tint-math);
  --accent-ink: var(--c-math-ink);
}

body {
  font-family: var(--font);
  /* 鎖定字重/行高/字色，抵銷 app.css body 的 600/1.6/var(--ink) 洩漏，維持原本外觀 */
  font-weight: 400;
  line-height: normal;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  /* 直向堆疊：共用 app-bar 置頂滿版，#app 於其下置中，避免與置中並排 */
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: var(--bg);
  overflow-x: hidden;
}

#app {
  width: 100%;
  /* canon：外層吃 --content-max（手機 720 / iPad 1200）並置中，
     取代原本寫死的 500px 窄條，讓 iPad 攤成寬版；保留 SPA 全高與 overflow-x 防溢位 */
  max-width: var(--content-max);
  margin-inline: auto;
  min-height: 100dvh;
  position: relative;
  overflow-x: hidden;
  overflow-y: auto;
}

/* Screens */
.screen {
  display: none;
  width: 100%;
  min-height: 100vh;
  padding: var(--s4);
  padding-bottom: 80px;
  animation: fadeIn 0.3s ease;
}

.screen.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--s3) 0;
  margin-bottom: var(--s4);
}

.header-title {
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.3;
}

.header-btn {
  background: var(--card-border);
  border: none;
  color: var(--ink);
  width: 48px;
  height: 48px;
  min-width: 48px;
  min-height: 48px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}

.header-btn:active {
  transform: scale(0.9);
}

/* Save notice */
.save-notice {
  text-align: center;
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 600;
  margin-bottom: var(--s3);
}

/* Stats bar — 被動內容卡：1px 邊、--r-lg 圓角、--shadow-sm */
.stats-bar {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s3) var(--s4);
  margin-bottom: var(--s4);
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow-sm);
}

.stat-item {
  text-align: center;
  color: var(--ink);
}

.stat-value {
  font-size: var(--fs-h2);
  font-weight: 800;
}

.stat-label {
  font-size: var(--fs-small);
  color: var(--ink-soft);
  font-weight: 600;
}

/* EXP bar — 被動內容卡 */
.exp-bar-container {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s3) var(--s4);
  margin-bottom: var(--s4);
  box-shadow: var(--shadow-sm);
}

.exp-info {
  display: flex;
  justify-content: space-between;
  color: var(--ink);
  font-size: var(--fs-small);
  font-weight: 600;
  margin-bottom: var(--s2);
}

.exp-bar {
  height: 10px;
  background: var(--card-border);
  border-radius: 999px;
  overflow: hidden;
}

.exp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--c-math-soft), var(--c-math));
  border-radius: 999px;
  transition: width 0.5s ease;
}

/* Level Map — 選單改吃共用 .u-grid（見 HTML class）：手機單欄、iPad 自動多欄 dashboard。
   本頁僅保留底部留白，欄數/間距由 app.css .u-grid 提供。 */
.level-map {
  padding-bottom: var(--s5);
}

/* 可點入口卡：2px 邊、--r-lg 圓角，hover 轉強調色 + --shadow-lg */
.level-card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: var(--s4);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  border: 2px solid var(--card-border);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.level-card:hover {
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.level-card:active {
  transform: scale(0.98);
}

.level-card.locked {
  opacity: 0.7;
  cursor: not-allowed;
}

.level-card.locked::after {
  content: '🔒';
  position: absolute;
  top: 50%;
  right: var(--s4);
  transform: translateY(-50%);
  font-size: 24px;
}

.level-card-header {
  display: flex;
  align-items: center;
  gap: var(--s3);
  margin-bottom: var(--s2);
}

/* 圖示內磚：--r-sm、強調淡底 */
.level-icon {
  font-size: 32px;
  width: 56px;
  height: 56px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-tint);
  border-radius: var(--r-sm);
}

.level-name {
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 800;
  line-height: 1.25;
}

.level-grade {
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 600;
}

/* 年級徽章：統一使用數學強調色淡底，僅作導覽定位用 */
.level-grade-badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--accent-tint);
  color: var(--accent-ink);
  font-size: var(--fs-small);
  font-weight: 700;
}

.level-stars {
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 700;
  margin-top: var(--s1);
}

/* Stage Select — 關卡選單同樣改吃共用 .u-grid（見 HTML class）：iPad 攤成多欄。 */
.stage-list {
  padding-bottom: var(--s5);
}

/* 可點入口卡：2px 邊、--r-lg 圓角，hover 轉強調色 + --shadow-lg */
.stage-card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: var(--s4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  border: 2px solid var(--card-border);
  box-shadow: var(--shadow-sm);
}

.stage-card:hover {
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.stage-card:active {
  transform: scale(0.98);
}

.stage-card.locked {
  opacity: 0.7;
  cursor: not-allowed;
}

.stage-card.boss {
  border-color: var(--c-star);
  background: var(--card);
}

.stage-info {
  display: flex;
  align-items: center;
  gap: var(--s3);
}

.stage-num {
  width: 40px;
  height: 40px;
  flex: none;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  color: white;
  font-size: var(--fs-body);
}

.stage-name {
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 700;
}

.stage-sub {
  color: var(--ink-soft);
  font-size: var(--fs-small);
  font-weight: 600;
  margin-top: 2px;
}

.stage-stars-display {
  color: var(--c-star);
  font-size: var(--fs-body);
  letter-spacing: 2px;
}

/* Gameplay */
.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--s4);
}

.progress-dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: var(--s4);
}

.progress-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--card-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--ink-soft);
  transition: all 0.3s;
}

.progress-dot.correct {
  background: var(--tint-english);
  color: var(--ink);
}

.progress-dot.wrong {
  background: rgba(255, 118, 117, 0.12);
  color: var(--ink);
}

.progress-dot.current {
  background: var(--accent);
  color: white;
  box-shadow: 0 0 0 3px var(--accent-tint);
}

.combo-display {
  text-align: center;
  margin-bottom: var(--s3);
  min-height: 36px;
}

.combo-text {
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  animation: comboPulse 0.5s ease;
}

@keyframes comboPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* 一題一畫面的大舞台卡：被動內容卡 → 1px 邊、--r-lg 圓角、--s5/--s4 內距 */
.question-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s5) var(--s4);
  text-align: center;
  margin-bottom: var(--s4);
  min-height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
}

/* 題幹：對齊共用 .q-prompt 的字級/字重/行高 */
.question-text {
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.45;
  max-width: 32ch;
}

.question-sub {
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--ink-soft);
  margin-top: var(--s2);
  max-width: 34ch;
}

/* Fraction display */
.frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  margin: 0 4px;
}

.frac .num {
  border-bottom: 2px solid var(--ink);
  padding: 0 4px 2px;
  font-size: 22px;
}

.frac .den {
  padding: 2px 4px 0;
  font-size: 22px;
}

/* Object counting display */
.objects-display {
  font-size: 32px;
  line-height: 1.6;
  letter-spacing: 4px;
  word-break: break-all;
  max-width: 300px;
}

/* Choices — 對齊共用 .q-opt：16px 圓角、56px 命中區、強調 hover、對錯 token 色 */
/* 選項排版比照全書 canon（.q-options）：手機單欄、寬螢幕置中兩欄並收斂易讀寬度，
   避免桌機上選項被拉成整條、中間空空。 */
.choices-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s3);
  margin: 0 auto var(--s4);
  max-width: 640px;
}
@media (min-width: 1024px) {
  .choices-grid { grid-template-columns: 1fr 1fr; max-width: 760px; }
}

.choice-btn {
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: 16px;
  padding: 14px 18px;
  color: var(--ink);
  font-size: clamp(16px, 3.4vw, 19px);
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
}

.choice-btn:hover {
  border-color: var(--accent);
}

.choice-btn:active {
  transform: scale(0.98);
}

.choice-btn.correct {
  background: var(--tint-english);
  border-color: var(--c-correct);
  color: var(--ink);
}

.choice-btn.wrong {
  background: rgba(255, 118, 117, 0.12);
  border-color: var(--c-wrong);
  color: var(--ink);
}

/* 除了顏色，也用符號標對錯（對色盲/低視力友善；與全書其他選擇題頁一致）*/
.choice-btn.correct::after { content: " ✓"; font-weight: 900; }
.choice-btn.wrong::after { content: " ✗"; font-weight: 900; }

.choice-btn.reveal {
  background: var(--tint-english);
  border-color: var(--c-correct);
  color: var(--ink);
  opacity: 0.7;
}

/* Number Pad（功能保留；僅對齊圓角/字級/按壓與 token 色） */
.numpad-input {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
  text-align: center;
  font-size: clamp(22px, 5vw, 28px);
  font-weight: 800;
  color: var(--ink);
  margin-bottom: var(--s4);
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  word-break: break-all;
}

.numpad {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--s2);
}

.numpad-btn {
  background: var(--card);
  border: 2px solid var(--card-border);
  border-radius: var(--r-sm);
  padding: 14px;
  color: var(--ink);
  font-size: 22px;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.2s ease;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.numpad-btn:active {
  transform: scale(0.96);
  background: var(--card-border);
}

.numpad-btn.submit {
  background: var(--c-correct-btn);
  border-color: var(--c-correct-btn);
  color: var(--on-accent);
}

.numpad-btn.submit:active {
  filter: brightness(0.95);
}

.numpad-btn.backspace {
  background: rgba(255, 118, 117, 0.12);
  border-color: var(--c-wrong);
  color: var(--ink);
}

.numpad-btn.negative {
  background: var(--card-border);
  border-color: var(--c-math-soft);
  color: var(--c-math-ink);
}

/* Feedback overlay */
.feedback-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  pointer-events: none;
}

.feedback-overlay.show {
  display: flex;
}

.feedback-correct {
  font-size: 80px;
  animation: correctAnim 0.8s ease forwards;
}

@keyframes correctAnim {
  0% { transform: scale(0); opacity: 1; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}

.feedback-wrong {
  font-size: 80px;
  animation: wrongAnim 0.8s ease forwards;
}

@keyframes wrongAnim {
  0% { transform: scale(0) rotate(0deg); opacity: 1; }
  50% { transform: scale(1.2) rotate(10deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 0; }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

.shake {
  animation: shake 0.3s ease;
}

/* Result Screen — 被動結算卡：1px 邊、--r-lg 圓角、--s5/--s4 內距 */
.result-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s5) var(--s4);
  text-align: center;
  margin-top: var(--s5);
  box-shadow: var(--shadow-sm);
}

.result-stars {
  font-size: 34px;
  margin-bottom: var(--s3);
  letter-spacing: 4px;
}

.result-title {
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  margin-bottom: var(--s2);
}

.result-stats {
  color: var(--ink-soft);
  font-size: var(--fs-body);
  font-weight: 700;
  margin-bottom: var(--s5);
  line-height: 1.8;
}

.result-exp {
  font-size: var(--fs-body);
  font-weight: 800;
  color: var(--ink);
  margin-bottom: var(--s5);
}

/* 底部行動列：對齊共用 .q-actions（等分、最小寬 140） */
.result-buttons {
  display: flex;
  gap: var(--s3);
  justify-content: center;
  flex-wrap: wrap;
}

.result-buttons .btn {
  flex: 1;
  min-width: 140px;
}

/* #app 作用域提高特異度，勝過 app.css 的 .btn / .btn-primary，
   並中和 app.css 才有的屬性（min-height / display / gap / box-shadow），維持原本外觀 */
#app .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  /* 對齊共用 .btn：16px 圓角、48px 命中區（--tap-min），視覺與全站一致 */
  min-height: var(--tap-min);
  gap: var(--s2, 8px);
  box-shadow: none;
  border: none;
  border-radius: 16px;
  padding: 14px 24px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
}

#app .btn:active {
  transform: scale(0.95);
}

#app .btn-primary {
  background: var(--c-math);
  color: white;
  box-shadow: var(--shadow-sm);
}

#app .btn-secondary {
  background: var(--card-border);
  color: var(--c-math-ink);
  border: 2px solid var(--card-border);
}

#app .btn-success {
  background: var(--c-correct-btn);
  color: var(--on-accent);
}

#app .btn-danger {
  background: var(--c-wrong-btn);
  color: var(--on-accent);
}

/* Daily Challenge */
.daily-timer {
  text-align: center;
  font-size: 36px;
  font-weight: 800;
  color: var(--ink);
  margin-bottom: var(--s4);
}

.daily-timer.warning {
  color: var(--ink);
  animation: timerPulse 1.2s ease-in-out infinite;
}

@keyframes timerPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.78; }
}

.daily-score {
  text-align: center;
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 700;
  margin-bottom: var(--s4);
}

/* Wrong Book */
.wrong-list {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}

/* 被動內容卡 → 1px 邊、--r-lg 圓角 */
.wrong-item {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s4);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

.wrong-question {
  font-size: var(--fs-body);
  font-weight: 800;
  margin-bottom: var(--s2);
}

.wrong-answers {
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--ink-soft);
}

.wrong-answers .wrong-ans {
  color: var(--ink);
  text-decoration: line-through;
}

.wrong-answers .correct-ans {
  color: var(--ink);
  font-weight: 800;
}

.wrong-hint {
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--ink-soft);
  margin-top: var(--s2);
  padding: 8px 12px;
  background: var(--bg);
  border-radius: var(--r-md);
  line-height: 1.5;
}

/* Bottom nav — 全部 #app 作用域以勝過 app.css 的 .bottom-nav / .bottom-nav button
   （含 @media ≥1024px 隱藏 nav 與較高特異度的 button 樣式），維持原本外觀 */
#app .bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  background: var(--card);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-around;
  padding: 8px 0;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  border-top: 2px solid var(--card-border);
  box-shadow: none;
  z-index: 50;
}

#app .nav-btn {
  background: none;
  border: none;
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 400;
  cursor: pointer;
  display: flex;
  flex: 0 0 auto;
  min-height: 0;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 12px;
  transition: color 0.2s;
}

#app .nav-btn.active {
  color: var(--c-math);
}
:root[data-theme="dark"] #app .nav-btn.active {
  color: var(--c-math-ink);
}

#app .nav-btn .nav-icon {
  font-size: 22px;
}

/* Confetti */
.confetti-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 200;
  overflow: hidden;
}

.confetti-piece {
  position: absolute;
  width: 10px;
  height: 10px;
  top: -10px;
  animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* Flying stars */
@keyframes starFly {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-100px) scale(0); opacity: 0; }
}

.flying-star {
  position: absolute;
  font-size: 20px;
  animation: starFly 0.8s ease-out forwards;
  pointer-events: none;
}

/* Fire animation for combo */
@keyframes fireGrow {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.fire-anim {
  animation: fireGrow 0.5s ease infinite;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 4px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--card-border);
  border-radius: 2px;
}

/* Tab content */
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
}

/* Achievements in stats */
.achievement-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.achievement-item {
  background: var(--card);
  border-radius: var(--r-sm);
  padding: var(--s3) var(--s2);
  text-align: center;
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--ink-soft);
}

.achievement-item.unlocked {
  color: var(--ink);
  background: var(--card);
  border: 2px solid var(--c-star);
}

.achievement-item .ach-icon {
  font-size: 24px;
  display: block;
  margin-bottom: 4px;
}

/* Correct answer reveal — 對齊共用 .q-feedback.is-ok：淡底 + 左側粗邊語意 */
.correct-reveal {
  /* 答錯時揭示正解：用琥珀（提醒）而非綠色，綠色在全站代表「答對」，避免語意衝突。 */
  background: var(--tint-chinese);
  border-left: 4px solid var(--c-warn);
  border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
  margin-top: var(--s3);
  text-align: center;
  color: var(--ink);
  font-size: var(--fs-body);
  font-weight: 800;
}
.reveal-method {
  /* 答錯時把該題方法提示再呈現一次（糾正式回饋）：比答案行更輕、左對齊、當提示讀。 */
  margin-top: var(--s2);
  font-size: var(--fs-small);
  font-weight: 600;
  text-align: left;
  color: var(--ink-soft);
  line-height: 1.5;
}

/* Sound toggle */
.sound-toggle {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 10;
}
</style>
</head>
