<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進階數學挑戰 🧮</title>
<!-- 統一遊戲化引擎：先載共用設計 token（assets/app.css），再載 HUD/toast 樣式
     （game_core.css），最後同步載入引擎（game_core.js）。
     ─────────────────────────────────────────────────────────────────
     計分（本頁為「數學進階」，計入 math 科目，讓學生升上進階內容時獎勵不中斷）：
       宣告 body[data-game-wired="math"]，每題作答只呼叫一次 Game.recordAnswer('math', 對錯)
       （作答後 answered 旗標鎖定，重試不再記帳）。本頁「不」呼叫 Game.award / recordSession，
       進階徽章冊為純本地（自有 key、無 XP），故無 double-count。
       本頁只「唯讀 / 純提示」使用引擎：Game.showToast（純提示，不記帳）與
       Game.getProfile（唯讀，僅顯示暱稱／可省略）。主題切換完全交給共用
       app-bar 的 [data-theme-toggle]，由 game_core 自動接線，本頁不寫主題 JS。
     獨立 localStorage key：math_adv_progress_v1（與 player_profile_v1 完全區隔）。
     ───────────────────────────────────────────────────────────────── -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* =====================================================================
 * math_advanced.html — 本頁樣式（全部建立在 assets/app.css 的設計 token 上，
 * 因此自動亮/暗色主題化、與學習基地視覺一致）。強調色系採紫色（purple）。
 * =================================================================== */

/* 本頁強調色沿用數學科紫色 --c-math；供 FAB / 徽章冊等共用 --accent* 別名。 */
:root {
  --su: var(--c-math);
  --su-tint: var(--tint-math);
  --su-ink: var(--c-math-ink);
  --accent: var(--c-math);
  --accent-ink: var(--c-math-ink);
  --accent-tint: var(--tint-math);
}

body { overflow-x: hidden; }

/* 頁面頂列（返回、標題） */
.ma-topbar {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s4);
}
.ma-topbar .ma-title {
  flex: 1;
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  min-width: 0;
}

/* 螢幕切換（尊重 prefers-reduced-motion） */
.ma-screen { display: none; animation: ma-fade 0.3s ease; }
.ma-screen.active { display: block; }
@keyframes ma-fade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .ma-screen { animation: none; }
}

/* 歡迎卡 */
.ma-hello {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s4);
  background: var(--su-tint);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  margin-bottom: var(--s4);
}
.ma-hello .ma-mascot { font-size: 46px; flex: none; line-height: 1; }
.ma-hello .ma-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.ma-hello .ma-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }

/* 進度總覽小列 */
.ma-overview {
  display: flex; align-items: center; gap: var(--s3);
  margin-bottom: var(--s4); flex-wrap: wrap;
}
.ma-overview .stat-tile { flex: 1; min-width: 96px; }

/* 等級選單 grid */
.ma-levels {
  display: grid;
  gap: var(--s4);
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.ma-level {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  padding: var(--s4);
  text-align: left;
  cursor: pointer;
  border: 2px solid var(--card-border);
  background: var(--card);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  font-family: var(--font);
  color: var(--ink);
}
.ma-level:hover { box-shadow: var(--shadow-lg); border-color: var(--su); }
.ma-level:active { transform: scale(0.98); }
.ma-level-top { display: flex; align-items: center; gap: var(--s3); }
.ma-level-emoji {
  font-size: 34px;
  width: 56px; height: 56px;
  flex: none;
  display: flex; align-items: center; justify-content: center;
  border-radius: 16px;
}
.ma-level-num { font-size: var(--fs-small); font-weight: 700; color: var(--su-ink); }
.ma-level-name { font-size: var(--fs-body); font-weight: 800; color: var(--ink); line-height: 1.25; }
.ma-level-concepts { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; line-height: 1.4; }
.ma-level-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: 2px; }
.ma-level-status {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--fs-small); font-weight: 700;
}
.ma-level-status.done { color: var(--c-correct-ink); }
.ma-level-status.todo { color: var(--ink-soft); }
.ma-level-stars { font-size: 16px; letter-spacing: 1px; }

/* 進行中：大卡 */
.ma-stage {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--s5) var(--s4);
  text-align: center;
}
.ma-visual {
  font-size: clamp(56px, 18vw, 92px);
  line-height: 1.1;
  margin: var(--s2) 0 var(--s3);
  user-select: none;
}
.ma-question {
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.45;
  margin: 0 auto var(--s4);
  max-width: 32ch;
}

/* 本級起始重點卡（advance organizer / worked example 先於練習） */
.ma-brief { text-align: left; }
.ma-brief h2 {
  font-size: var(--fs-h2); font-weight: 800; color: var(--ink);
  margin: 0 0 var(--s3); text-align: center;
}
.ma-brief-sub { text-align: center; color: var(--ink-soft); font-weight: 700; font-size: var(--fs-small); margin: 0 0 var(--s3); }
.ma-keyfacts { list-style: none; padding: 0; margin: 0 auto; max-width: 40ch; display: grid; gap: var(--s2); }
.ma-keyfacts li {
  display: flex; align-items: flex-start; gap: var(--s2);
  padding: 10px 14px;
  background: var(--su-tint);
  border-radius: var(--r-md);
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.5;
}
.ma-keyfacts li .ma-kf-dot { flex: none; color: var(--su-ink); font-weight: 900; }

/* 進度：本級第幾題 */
.ma-steps {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  margin-bottom: var(--s3); flex-wrap: wrap;
}
.ma-steps i { width: 20px; height: 6px; border-radius: 999px; background: var(--card-border); }
.ma-steps i.on { background: var(--su); }
.ma-steps i.cur { background: var(--su); box-shadow: 0 0 0 3px var(--su-tint); }

/* 選項按鈕（tap 作答；命中區 ≥56px） */
.ma-options { display: grid; gap: var(--s3); margin-top: var(--s2); }
.ma-opt {
  display: flex; align-items: center; gap: var(--s2);
  min-height: 56px;
  width: 100%;
  padding: 14px 18px;
  border: 2px solid var(--card-border);
  border-radius: 16px;
  background: var(--card);
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(16px, 3.4vw, 19px);
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
}
.ma-opt:active { transform: scale(0.98); }
.ma-opt:disabled { cursor: default; }
/* 作答後高亮：文字用 var(--ink)（亮暗雙主題皆過 AA），對錯以邊框顏色 + ✅/❌ 雙碼標示（不單靠顏色） */
.ma-opt.correct { border-color: var(--c-correct); background: var(--tint-english); color: var(--ink); }
.ma-opt.wrong { border-color: var(--c-wrong); background: rgba(255,118,117,0.12); color: var(--ink); }
.ma-opt.correct .ma-opt-mark { color: var(--c-correct-ink); }
.ma-opt.wrong .ma-opt-mark { color: var(--c-streak-ink); }
.ma-opt .ma-opt-mark { margin-left: auto; font-size: 22px; }

/* 揭示區（答案解說） */
.ma-reveal {
  margin-top: var(--s4);
  padding: var(--s3) var(--s4);
  background: var(--su-tint);
  border-radius: var(--r-md);
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.55;
  text-align: left;
  display: none;
}
.ma-reveal.show { display: block; animation: ma-fade 0.3s ease; }
@media (prefers-reduced-motion: reduce) { .ma-reveal.show { animation: none; } }

/* 完成畫面 */
.ma-done { text-align: center; padding: var(--s5) var(--s4); }
.ma-done-emoji { font-size: clamp(64px, 22vw, 100px); }
.ma-done-stars { font-size: 34px; letter-spacing: 4px; margin: var(--s2) 0; }
.ma-done-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); }

/* 底部行動列 */
.ma-actions { display: flex; gap: var(--s3); margin-top: var(--s4); flex-wrap: wrap; }
.ma-actions .btn { flex: 1; min-width: 140px; }

.ma-footnote { text-align: center; color: var(--ink-soft); font-size: var(--fs-small); margin-top: var(--s5); font-weight: 600; max-width: 34em; margin-inline: auto; }

/* 桌機（≥1280）近滿版：沿用 app.css 的 --content-max（min(95vw,1800)），不再自行封頂 1200，讓選單多欄鋪滿、與其他頁一致；答題欄由 .ma-question/.ma-keyfacts 自身 ch 上限維持窄欄護眼。 */
</style>
</head>
<body data-game-wired="math" data-game-maturity="advanced">
<!-- ===== 共用頂部應用列（全站一致；貼在 <body> 內第一個元素） ===== -->
<!-- data-game-hud="off"：本頁透過 data-game-wired="math" + recordAnswer 直接記帳（會計入主角色 XP/等級），關閉浮動 HUD 僅為減少干擾；「純本地、不計 XP」的是下方進階徽章冊，不是整頁。 -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">進階數學挑戰 🧮</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

  <!-- ============================= 等級選單 ============================= -->
  <section id="screen-menu" class="ma-screen active">
    <div class="ma-topbar">
      <span class="ma-title">進階數學挑戰 🧮</span>
    </div>

    <div class="ma-hello">
      <span class="ma-mascot" aria-hidden="true">🧮</span>
      <div>
        <div class="ma-hello-text" id="hello-text">歡迎來到進階挑戰！這裡是加分小旅程，玩得開心最重要。</div>
        <div class="ma-hello-sub" id="hello-sub">還沒開始也沒關係，挑一個等級試試看吧！</div>
      </div>
    </div>

    <div class="ma-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-done">0/18</span><span class="stat-label">完成等級</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-badges">0/19</span><span class="stat-label">收集徽章</span></div>
    </div>

    <div class="ma-levels" id="level-list"><!-- 由 JS 產生 --></div>

    <p class="ma-footnote">這是「進階挑戰」小旅程，慢慢玩、盡量想，答錯也沒關係。🌱</p>

    <nav class="cn-nextup" aria-label="打好基礎" style="display:flex;flex-direction:column;gap:10px;max-width:640px;margin:4px auto 8px">
      <a href="multiply.html" style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border:2px dashed var(--card-border);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700;min-height:48px;line-height:1.4"><span style="font-size:22px;flex:none" aria-hidden="true">🧮</span><span>← 覺得太快？先回「乘法樂園」練習打底</span></a>
      <a href="math_concepts.html" style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border:2px dashed var(--card-border);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700;min-height:48px;line-height:1.4"><span style="font-size:22px;flex:none" aria-hidden="true">🧠</span><span>← 先回「數學觀念養成」複習觀念</span></a>
    </nav>
  </section>

  <!-- ============================= 進行中 ============================= -->
  <section id="screen-play" class="ma-screen">
    <div class="ma-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到等級選單">←</button>
      <span class="ma-title" id="play-title">等級</span>
    </div>
    <div class="ma-steps" id="step-dots" aria-hidden="true"></div>
    <div class="play-column">
      <div id="stage"><!-- 由 JS 產生每一題 --></div>
    </div>
  </section>

</main>

<script>
/* =====================================================================
 * 主程式（自足 IIFE）
 *   - 9 個中性等級（等級1..9）、每級 12 題，全部一律解鎖、可自由進入。
 *   - 選項每題 Fisher–Yates 洗牌；answer 為「未洗牌前的 0-based 索引」，
 *     以 data-i 保留原始索引判斷 i===answer，判分不受洗牌影響。
 *   - 每題最多記一次分（answered 旗標守衛）；答錯可再試但只給視覺提示、不加分。
 *   - 完成一級 → 依 correctCount/總題數給星（3 階：★☆☆／★★☆／★★★）、寫入 best、
 *     彈 Game.showToast 鼓勵語，並解鎖對應本地徽章。
 *   - 獨立 localStorage key：math_adv_progress_v1。結構：
 *       { lv1:{done,best}, ..., lv9:{done,best}, badges:{ badgeId:true } }
 *   - 「只增不減」：best = Math.max(prev.best||0, thisRun)；徽章 awarded guard 永不取消。
 *   - 零重複計分：本徽章模組不呼叫 Game.recordAnswer / award / recordSession，
 *     只用 Game.showToast（純提示）與（可省略的）Game.getProfile（唯讀）。
 *     （每題作答的 recordAnswer('math') 在頁面主程式，非本模組；兩者不重疊。）
 * =================================================================== */
(function () {
  'use strict';

  // ---- 純提示（不記帳）：優先用 game_core toast，失敗即靜默 ----
  function toast(msg, kind) {
    try { if (window.Game && Game.showToast) Game.showToast(msg, kind || 'info'); } catch (e) { /* 靜默 */ }
  }

  // ---- 本頁進度（獨立 key，全程 try/catch；配額滿即靜默放棄不崩潰） ----
  var PROG_KEY = 'math_adv_progress_v1';
  function loadProg() {
    var p = null;
    try { p = JSON.parse(localStorage.getItem(PROG_KEY)); } catch (e) { p = null; }
    if (!p || typeof p !== 'object') p = {};
    if (typeof p.badges !== 'object' || !p.badges) p.badges = {};
    return p;
  }
  function saveProg(p) {
    try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) { /* 靜默降級 */ }
  }
  var progress = loadProg(); // { lvId:{done,best}, badges:{} }

  // =====================================================================
  // 課程內容（全繁體中文；每一題定義／公式／答案皆已獨立數值查核）
  //   answer = 未洗牌前 options 陣列的 0-based 索引。
  // =====================================================================
  var LEVELS = [
    {
      id: 'lv1', level: 1, name: '拆解與重組', emoji: '🧩', color: '#14b8a6',
      concepts: ['因式分解（提公因式、十字交乘、差平方、完全平方）', '一元二次方程式與其解（因式分解法、判別式）'],
      keyFacts: [
        '(a+b)² = a²+2ab+b²',
        'x²−a² = (x+a)(x−a)',
        '(x−p)(x−q)=0 的解為 x=p 或 x=q',
        '判別式 b²−4ac 決定實數解個數',
        'x²+bx 補成完全平方要加 (b/2)²'
      ],
      questions: [
        { q: '把 (x+3)(x+2) 乘開，會得到什麼？', options: ['x²+5x+6', 'x²+6x+5', 'x²+5x+5', 'x²+6x+6'], answer: 0, why: '外項內項相加 3+2=5，常數 3×2=6，所以是 x²+5x+6。' },
        { q: '把 x²+7x+12 因式分解，等於？', options: ['(x+3)(x+4)', '(x+2)(x+6)', '(x+1)(x+12)', '(x+2)(x+10)'], answer: 0, why: '找兩數相乘=12、相加=7，就是 3 和 4，所以 (x+3)(x+4)。' },
        { q: '把 x²−9 因式分解，等於？', options: ['(x+3)(x−3)', '(x−3)(x−3)', '(x+9)(x−1)', '(x+3)(x+3)'], answer: 0, why: '這是差平方：x²−a²=(x+a)(x−a)，9=3²，所以 (x+3)(x−3)。' },
        { q: '把 x²−5x+6 因式分解，等於？', options: ['(x−2)(x−3)', '(x+2)(x+3)', '(x−1)(x−6)', '(x−5)(x−1)'], answer: 0, why: '兩數相乘=6、相加=−5，就是 −2 和 −3，所以 (x−2)(x−3)。' },
        { q: '方程式 x²=16 的解是？', options: ['x=4 或 x=−4', '只有 x=4', 'x=8', 'x=±2'], answer: 0, why: '4²=16、(−4)²=16，正負都要算，所以 x=4 或 −4。' },
        { q: '解方程式 (x−2)(x+5)=0', options: ['x=2 或 x=−5', 'x=−2 或 x=5', 'x=2 或 x=5', 'x=−2 或 x=−5'], answer: 0, why: '兩個東西相乘=0，代表其中一個是 0：x−2=0 或 x+5=0。' },
        { q: '解方程式 x²−7x+10=0', options: ['x=2 或 x=5', 'x=−2 或 x=−5', 'x=2 或 x=−5', 'x=1 或 x=10'], answer: 0, why: '因式分解成 (x−2)(x−5)=0，所以 x=2 或 5。' },
        { q: '一元二次方程式 ax²+bx+c=0 的「判別式」是？', options: ['b²−4ac', 'b²+4ac', '4ac−b²', '2a'], answer: 0, why: '判別式 b²−4ac 用來判斷有幾個實數解。' },
        { q: '若判別式 b²−4ac 小於 0，這個方程式有幾個實數解？', options: ['沒有實數解', '剛好一個實數解', '兩個實數解', '無限多個解'], answer: 0, why: '判別式 <0 時開根號開不出實數，所以沒有實數解。' },
        { q: '解方程式 x²−2x−3=0', options: ['x=3 或 x=−1', 'x=−3 或 x=1', 'x=3 或 x=1', 'x=2 或 x=3'], answer: 0, why: '因式分解成 (x−3)(x+1)=0，所以 x=3 或 −1。' },
        { q: '要讓 x²+6x+□ 變成完全平方式，□ 要填？', options: ['9', '6', '3', '36'], answer: 0, why: '取一次項係數一半再平方：(6÷2)²=9，因為 (x+3)²=x²+6x+9。' },
        { q: '(a+b)² 乘開等於？', options: ['a²+2ab+b²', 'a²+b²', 'a²−2ab+b²', '2a+2b'], answer: 0, why: '完全平方公式：(a+b)²=a²+2ab+b²，中間別忘了 2ab。' }
      ]
    },
    {
      id: 'lv2', level: 2, name: '座標與直線', emoji: '📐', color: '#3b82f6',
      concepts: ['座標平面與象限', '兩點距離、中點、斜率', '直線方程式、平行與垂直'],
      keyFacts: [

    {"id":"lv8","level":8,"name":"機率與統計・看懂生活數據","emoji":"🎲","color":"#f59e0b","concepts":["乘法原理與排列組合","古典機率與期望值","統計量的陷阱","統計圖判讀","相關不等於因果與抽樣代表性"],"keyFacts":["古典機率 ＝ 有利結果數 ÷ 所有等可能結果數，前提是每個結果機會均等。","期望值 ＝ Σ（數值 × 機率），代表「長期平均」，不是單次一定拿到的值。","平均數容易被少數極端值拉高或拉低；中位數較能代表「多數人」的情況。","長條圖若 y 軸不從 0 開始，會在視覺上誇大差距，判讀時要看實際數字。","相關不等於因果：兩件事一起變化，可能只是共同受第三個變因影響；抽樣也要隨機且具代表性，只問特定族群（如只問打球的人估運動量）會產生偏差。"],"questions":[{"q":"早餐店有 3 種主餐、2 種飲料，一份套餐要選 1 種主餐加 1 種飲料，共有幾種不同的搭配？","options":["5 種","6 種","8 種","9 種"],"answer":1,"why":"這是乘法原理：主餐 3 種、飲料 2 種各自獨立選擇，總數 ＝ 3 × 2 ＝ 6 種。把 3＋2 相加得 5 是常見錯誤，因為兩個步驟要相乘而非相加。"},{"q":"從 5 位同學中選出 2 位擔任班級幹部（兩人職務相同、不分先後），共有幾種選法？","options":["7 種","20 種","5 種","10 種"],"answer":3,"why":"不分順序是「組合」：C(5,2) ＝ (5×4)/(2×1) ＝ 10 種。選 20 是把它當成有順序的排列 P(5,2)＝5×4＝20，但「兩人職務相同」時 {甲，乙} 與 {乙，甲} 算同一種，要再除以 2。"},{"q":"擲一顆公正的六面骰子，出現點數大於 4（也就是 5 或 6）的機率是多少？","options":["1/6","1/3","1/2","2/3"],"answer":1,"why":"有利結果是 5、6 共 2 種，總共 6 種等可能結果，機率 ＝ 2/6 ＝ 1/3。「大於 4」不包含 4 本身，只有 2 個點數；若誤算成 4、5、6 三種會得到 1/2。"},{"q":"同時擲兩顆公正骰子，兩顆點數「相加等於 7」的機率是多少？","options":["1/6","1/12","1/9","7/36"],"answer":0,"why":"兩顆骰子共有 6×6 ＝ 36 種等可能結果。和為 7 的有 (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) 共 6 種，機率 ＝ 6/36 ＝ 1/6。看到「7」就寫 7/36 是把點數當成分子的常見錯誤。"},{"q":"從一副標準 52 張撲克牌中隨機抽 1 張，抽到「紅心」的機率是多少？","options":["1/13","1/2","1/4","1/26"],"answer":2,"why":"一副牌分 4 種花色，紅心有 13 張，機率 ＝ 13/52 ＝ 1/4。1/13 是抽到「某個特定點數（如 A）」的機率；紅色只有紅心與方塊兩種花色，紅心占四分之一而非二分之一。"},{"q":"某抽獎活動每抽一次收 10 元，有 1/100 的機率中 500 元、其餘沒有獎。單就「獎金」而言，平均每抽一次可拿回的期望值是多少？","options":["50 元","0 元","5 元","10 元"],"answer":2,"why":"期望值 ＝ 500 × (1/100) ＋ 0 × (99/100) ＝ 5 元。也就是說平均每抽只能拿回 5 元，卻要付 10 元，長期下來是虧的。把 500 直接除以 10 得 50 是忽略了中獎機率極低。"},{"q":"一間 5 人小公司的月薪（千元）為 30、32、33、35、200（老闆）。想描述「一般員工」的薪資水準，用哪個統計量比較不會被老闆高薪誤導？","options":["平均數（66 千）","中位數（33 千）","全距（170 千）","四個都一樣好"],"answer":1,"why":"平均數 ＝ 330/5 ＝ 66 千，被老闆的 200 千大幅拉高，比 4 位員工實際薪資都高。中位數（排序後中間值）＝ 33 千，不受單一極端值影響，較能代表多數人的情況。"},{"q":"某鞋店一週賣出的鞋碼依序為 24、25、25、26、25、27、25。若想知道「最多人買的尺碼」，該看哪個統計量？答案是多少？","options":["平均數，約 25.3","眾數，25","中位數，26","全距，3"],"answer":1,"why":"「出現次數最多」的數值稱為眾數；25 出現 4 次最多，所以眾數是 25。對鞋店備貨而言，眾數比平均數更有意義，因為平均出來的 25.3 並不是真正存在的鞋碼。"},{"q":"關於「全距（最大值 － 最小值）」，下列哪個敘述才正確？","options":["全距大代表全班分數都很高","全距等於全班的平均分數","全距越大平均一定越大","全距只反映最高與最低分之差，可能被單一個極端分數拉大"],"answer":3,"why":"全距只用到最大與最小兩個值，完全不看中間資料的分布，因此只要有一個特別高或特別低的極端值，全距就會被拉大，並不能代表整體的高低或分散程度。"},{"q":"一張長條圖比較兩位候選人的支持率：A 為 96%、B 為 98%，但圖的 y 軸從 95% 才開始畫，使 B 的長條看起來是 A 的好幾倍高。正確的判讀是？","options":["B 真的比 A 受歡迎好幾倍","兩人差距其實只有 2 個百分點，圖形因 y 軸未從 0 開始而被誇大","A 其實比 B 高","資料不足，完全無法比較"],"answer":1,"why":"96% 與 98% 只差 2 個百分點。因為 y 軸從 95% 起跳（沒有從 0 開始），微小差距在視覺上被放大成好幾倍高的錯覺。判讀長條圖務必先看座標軸起點與實際數值。"},{"q":"統計發現：夏天冰淇淋銷量上升時，溺水人數也同時上升，兩者高度相關。最合理的結論是？","options":["吃冰淇淋會導致溺水","溺水的人特別想吃冰淇淋","兩者都受『高溫（夏天）』這個共同原因影響，屬相關而非因果","兩件事完全沒有任何關聯"],"answer":2,"why":"相關不等於因果。天氣熱時大家既愛吃冰、也更常戲水，因此氣溫這個「第三變因」同時推高了兩者，並非冰淇淋造成溺水。看到兩件事一起變化，要先想有沒有共同原因。"},{"q":"學校想估計「全校學生平均每天運動幾分鐘」，若只到籃球場訪問正在打球的同學，這種抽樣有什麼問題？","options":["只訪問打球的同學不具代表性，會高估全校的運動時間","樣本人數夠多就一定沒問題","應該改成只訪問完全不運動的同學","抽樣本來就不需要考慮代表性"],"answer":0,"why":"在籃球場的人本來就偏愛運動，屬於「自我選擇偏差」，樣本無法代表全校（包含不常運動的人），會系統性地高估運動時間。好的抽樣要隨機且涵蓋各類學生，代表性比人數多寡更關鍵。"}]},
    {"id":"lv9","level":9,"name":"生活裡的進階數學","emoji":"🧮","color":"#8b5cf6","concepts":["複利與指數成長","對數尺度（pH／分貝／地震／星等）","三角測量與相似形","估算與最佳化直覺"],"keyFacts":["<b>複利：</b>「利滾利」，成長屬指數型；72 法則：約 72÷年利率(%) 年，本金就會翻倍。","<b>對數尺度：</b>「每差一級」代表固定倍數：pH 差 1 是 10 倍、分貝差 10 dB 是 10 倍、星等差 5 等是 100 倍。","<b>相似測量：</b>同一時刻，物體「高度÷影長」為定值（相似三角形）；也可用「高＝水平距離×tan(仰角)」估算高度。","<b>縮放：</b>周長固定時，正方形面積最大；圖形放大 k 倍，面積變 k² 倍、體積變 k³ 倍。","<b>比例尺：</b>1:n 表示圖上 1 單位＝實際 n 單位；單位換算記得 1 公里＝100000 公分。","<b>費米估算：</b>只看數量級（10 的幾次方），用合理假設連乘，答案對到「級」就算成功。"],"questions":[{"q":"把錢存入年利率 6%、每年複利計息的帳戶，本金大約要多少年才會翻倍？","options":["6 年","12 年","24 年","36 年"],"answer":1,"why":"複利翻倍可用「72 法則」估算：72÷年利率(%)。72÷6＝12，約 12 年翻倍。誤選 6（把 6% 直接當年數）忽略了複利成長的節奏。"},{"q":"存入 10000 元，年利率 5%、每年複利計息，2 年後本利和最接近多少？","options":["11000 元","11025 元","11050 元","10500 元"],"answer":1,"why":"複利要乘方：10000×1.05²＝10000×1.1025＝11025 元。誤選 11000 是用「單利」算（10000×(1+0.05×2)），少算了第二年利息再生的利息。"},{"q":"pH 值每差 1，氫離子濃度就差 10 倍。pH 4 的溶液，氫離子濃度是 pH 6 的幾倍？","options":["2 倍","20 倍","100 倍","1000 倍"],"answer":2,"why":"pH 是對數尺度，每差 1 差 10 倍。pH 4 與 pH 6 相差 2，故差 10²＝100 倍（pH 越小越酸）。誤選 2 倍是把「差 2 級」當成「差 2 倍」。"},{"q":"音量以分貝(dB)衡量，聲音強度每增加 10 dB 變為 10 倍。從 60 dB 提高到 90 dB，聲音強度變為幾倍？","options":["3 倍","30 倍","500 倍","1000 倍"],"answer":3,"why":"分貝是對數尺度：差 30 dB＝三個 10 dB，強度變 10×10×10＝10³＝1000 倍。誤選 3 倍是把「差 3 個級距」誤當成 3 倍。"},{"q":"芮氏規模每增加 1 級，地震釋放的能量大約變為 32 倍。規模 6 的地震釋放能量約是規模 5 的幾倍？","options":["10 倍","32 倍","100 倍","320 倍"],"answer":1,"why":"規模每差 1 級，地動振幅約 10 倍，但釋放「能量」約增為 32 倍（約 10^1.5）。差 1 級即約 32 倍。誤選 10 倍是把振幅倍數當成能量倍數。"},{"q":"星等數字越小越亮，且「每差 5 等，亮度剛好差 100 倍」為定義。1 等星的亮度約是 6 等星的幾倍？","options":["5 倍","6 倍","25 倍","100 倍"],"answer":3,"why":"1 等與 6 等相差 5 等，依定義亮度差 100 倍。誤選 5 倍是把「差 5 等」直接當 5 倍，忽略星等是對數尺度。"},{"q":"同一時刻，1 公尺長的竹竿影長 0.5 公尺；此時一棵樹的影長是 6 公尺。這棵樹大約多高？","options":["3 公尺","6 公尺","12 公尺","24 公尺"],"answer":2,"why":"同一時刻太陽角度相同，各物體「高度÷影長」為定值。竹竿 1÷0.5＝2，故樹高＝6×2＝12 公尺。誤選 6 是直接把影長當樹高。"},{"q":"站在離大樓底部 30 公尺處，抬頭看樓頂的仰角恰為 45°（眼睛高度忽略不計）。大樓高度約多少？","options":["15 公尺","30 公尺","45 公尺","60 公尺"],"answer":1,"why":"高度＝水平距離×tan(仰角)＝30×tan45°＝30×1＝30 公尺。仰角 45° 時高與距離相等。誤選 60 是把距離加倍，誤選 15 是把距離減半。"},{"q":"用 40 公尺長的籬笆圍出一塊矩形菜園，圍出的最大面積是多少？","options":["40 平方公尺","75 平方公尺","96 平方公尺","100 平方公尺"],"answer":3,"why":"周長固定時，正方形面積最大。周長 40→邊長 10→面積 10×10＝100 平方公尺。誤選 96 是 12×8（同周長但非正方形，面積較小），可見越接近正方形面積越大。"},{"q":"地圖比例尺為 1:50000，圖上量得兩地相距 4 公分。實際距離大約是多少？","options":["200 公尺","2 公里","20 公里","200 公里"],"answer":1,"why":"實際距離＝4×50000＝200000 公分。換算：200000÷100000＝2 公里（1 公里＝100000 公分）。誤選 20 公里是單位換算多算一位。"},{"q":"把一張照片的邊長放大為原來的 3 倍（形狀不變）。放大後的面積是原來的幾倍？","options":["3 倍","6 倍","9 倍","27 倍"],"answer":2,"why":"相似放大 k 倍時，面積變 k² 倍：3²＝9 倍。誤選 3 倍是只看邊長，誤選 27 倍是體積的 k³＝3³（照片是面積，不是體積）。"},{"q":"用費米估算：一個人活到 80 歲，一生心跳總次數的『數量級』最接近哪一個？（心跳約每分鐘 70 次）","options":["約 10⁶（百萬）次","約 10⁹（數十億）次","約 10¹²（兆）次","約 10¹⁵ 次"],"answer":1,"why":"70×60×24×365×80 ≈ 3×10⁹，數量級為 10⁹（數十億次）。費米估算重點在對到「數量級」而非精確值；誤選 10⁶ 是漏乘了年或天的因子。"}]},
    {"id":"lv10","level":10,"name":"代數升學・不等式與二次方程","emoji":"⚖️","color":"#0ea5e9","concepts":["一元一次不等式與『乘除負數要變號』","二元一次聯立方程式（代入·加減消去）","一元二次方程式的配方法","公式解（求根公式）與判別式 b²−4ac"],"keyFacts":["<b>不等式變號：</b>不等式兩邊同乘或同除以「負數」時，不等號方向要反過來（＞變＜、≤變≥）；乘除正數則不變。","<b>聯立解＝交點：</b>二元一次聯立方程式的解 (x, y) 就是兩條直線的交點；可用代入消去或加減消去求出。","<b>配方法：</b>把 x²＋bx 配成完全平方，要加上「一次項係數一半的平方」(b/2)²；再開平方時「正負兩個根都要取」。","<b>公式解（求根公式）：</b>ax²＋bx＋c＝0 的解為 x＝(−b±√(b²−4ac))／2a，別漏掉 −b 的負號與分母 2a。","<b>判別式 b²−4ac：</b>＞0 有兩相異實根、＝0 有兩相等實根（重根）、＜0 沒有實根。"],"questions":[{"q":"解不等式 -3x &gt; 12，下列何者正確？","options":["x &gt; -4","x &gt; 4","x &lt; -4","x &lt; 4"],"answer":2,"why":"不等式兩邊同除以負數 -3 時，不等號方向必須改變。-3x > 12 兩邊除以 -3 得 x < -4。選「x > -4」是忘了變號的典型錯誤；含 4 的選項是把 12÷(-3) 的負號也算錯了，記得除完負號要保留喔。"},{"q":"解不等式 5 - 2x ≥ 1，下列何者正確？","options":["x ≥ 2","x ≤ -2","x ≤ 2","x ≥ -2"],"answer":2,"why":"先移項：5 - 2x ≥ 1 → -2x ≥ -4。兩邊同除以 -2（負數）要變號，得 x ≤ 2。選「x ≥ 2」是沒變號；含 -2 的選項是把 -4÷(-2) 的正負號算錯。"},{"q":"在數線上表示 x ≥ -1，正確的畫法是？","options":["在 -1 畫實心點，向右畫箭頭","在 -1 畫空心點，向右畫箭頭","在 -1 畫實心點，向左畫箭頭","在 -1 畫空心點，向左畫箭頭"],"answer":0,"why":"x ≥ -1 包含「等於 -1」，所以端點用實心點；「大於」表示往數值變大的方向（右邊），故箭頭向右。空心點是用在 > 或 <（不含端點）；向左則是 x ≤ -1 的畫法。"},{"q":"解不等式 2(x - 3) &lt; 4x + 2，下列何者正確？","options":["x &lt; -4","x &gt; -4","x &lt; 4","x &gt; 4"],"answer":1,"why":"先展開：2(x - 3) = 2x - 6，得 2x - 6 < 4x + 2。移項：-6 - 2 < 4x - 2x，即 -8 < 2x，兩邊除以正數 2「不變號」，得 x > -4。此題除數是正數，若誤以為每次都要變號就會錯選「x < -4」。"},{"q":"解不等式 -x/2 + 1 ≤ 3，下列何者正確？","options":["x ≤ -4","x ≥ 4","x ≥ -4","x ≤ 4"],"answer":2,"why":"移項：-x/2 + 1 ≤ 3 → -x/2 ≤ 2。兩邊同乘 -2（負數）要變號，得 x ≥ -4。沒變號會錯選「x ≤ -4」；把 2×(-2) 的負號弄丟則得到含 4 的錯誤選項。"},{"q":"用代入消去法解聯立方程式 { y = 2x - 1；3x + y = 9 }，其解為？","options":["x = 2，y = 5","x = 2，y = 3","x = 3，y = 5","x = 1，y = 1"],"answer":1,"why":"把第一式 y = 2x - 1 代入第二式：3x + (2x - 1) = 9 → 5x = 10 → x = 2，再代回得 y = 2(2) - 1 = 3。「y = 5」是把常數 -1 誤看成 +1（用 y = 2x + 1）算得 2(2) + 1 = 5；若真的漏掉減 1（用 y = 2x）則會得到 4。"},{"q":"用加減消去法解聯立方程式 { 2x + 3y = 12；2x - y = 4 }，其解為？","options":["x = 2，y = 3","x = 3，y = 2","x = 3，y = -2","x = 1，y = 2"],"answer":1,"why":"兩式 x 的係數都是 2，相減可消去 x：(2x + 3y) - (2x - y) = 4y = 12 - 4 = 8，得 y = 2；再代回 2x - 2 = 4 得 x = 3。「x = 3，y = -2」是正確求出 x = 3 後、代回求 y 時把正負號弄反了（6 - y = 4 應得 y = 2，弄反才會變成 -2）。"},{"q":"用加減消去法解聯立方程式 { x + 2y = 7；3x - 2y = 5 }，其解為？","options":["x = 3，y = -2","x = 3，y = 2","x = 2，y = 3","x = 1，y = 3"],"answer":1,"why":"兩式中 y 的係數 +2 與 -2 互為相反數，相加即可消去 y：4x = 12 → x = 3，代回 3 + 2y = 7 得 y = 2。「y = -2」是代回求 y 時把符號弄反（例如把 3x - 2y = 5 解成 2y = -4）而得到的錯誤。"},{"q":"在座標平面上，二元一次聯立方程式的解 (x, y) 代表什麼？","options":["兩直線的斜率","兩直線的交點座標","兩直線與 y 軸的交點","兩直線的中點"],"answer":1,"why":"每個二元一次方程式在座標平面上是一條直線，聯立方程式的解要同時滿足兩式，也就是兩直線「同時通過」的那一點，即交點座標。斜率、與 y 軸的交點、中點都不是聯立方程式的解。"},{"q":"用配方法解一元二次方程式 x² + 6x + 5 = 0，其解為？","options":["x = 1 或 x = 5","x = -1 或 x = -5","x = -1 或 x = 5","x = 3 或 x = -3"],"answer":1,"why":"配方法：x² + 6x + 5 = 0 → x² + 6x = -5 → 兩邊加 (6/2)² = 9 → (x + 3)² = 4 → x + 3 = ±2 → x = -1 或 x = -5（平方根要取正負兩個值）。「x = 1 或 5」是把符號弄反；「x = 3 或 −3」是把配方時補上的 9 直接開根號（誤以為 x² = 9），但正確要對 (x + 3)² = 4 開根號，得 x + 3 = ±2。"},{"q":"要把 x² - 8x 配成完全平方式，需在後面加上哪個數？","options":["64","16","8","-16"],"answer":1,"why":"配成完全平方要加上「一次項係數一半的平方」：(-8/2)² = (-4)² = 16，即 x² - 8x + 16 = (x - 4)²。選 64 是把 8 直接平方（忘了先除以 2）；選 8 是只取一半卻忘了平方；選 -16 則是把要加的數寫成負的，但一次項係數一半的「平方」一定是正的，所以是 +16。"},{"q":"用公式解（求根公式） x = (-b ± √(b²-4ac)) / 2a 解 x² + 3x + 1 = 0，其解為？","options":["x = (3 ± √5)/2","x = (-3 ± √5)/2","x = (-3 ± √13)/2","x = (-3 ± √5)/1"],"answer":1,"why":"此處 a = 1、b = 3、c = 1，判別式 b²-4ac = 3² - 4(1)(1) = 9 - 4 = 5，代入得 x = (-3 ± √5)/2。「(3 ± √5)/2」是漏掉 -b 的負號；「√13」是把 -4ac 誤算成 +4（9 + 4）；分母應為 2a = 2，不是 1。"},{"q":"利用判別式判斷方程式 x² - 4x + 4 = 0 的實根個數，下列何者正確？","options":["兩個不相等的實根","兩個相等的實根（重根）","沒有實根","無法判別"],"answer":1,"why":"判別式 b²-4ac = (-4)² - 4(1)(4) = 16 - 16 = 0。判別式「等於 0」時有兩個相等的實根（重根，此題為 x = 2）；判別式「大於 0」才有兩相異實根，「小於 0」則沒有實數根。此題誤判正負號很容易錯選其他選項。"}]},
    {"id":"lv11","level":11,"name":"估算數感・抓大小與合理性","emoji":"🎯","color":"#f97316","concepts":["湊整數與四捨五入估算和差積商","用估算檢查答案是否合理","生活量級與單位數感","百分比與折扣的粗估"],"keyFacts":["<b>估算先湊整：</b>把數字四捨五入或湊成好算的整數（如 4980→5000、29→30），再心算，答案抓「大約」與「量級」就好。","<b>合理性檢查：</b>算完先用估算對一下量級——差一位（10 倍）通常是小數點或位數錯了，例如 297×4 應在 1200 上下，不會是 118。","<b>生活數感：</b>記住常見量級：成人身高約 170 公分、鋁罐飲料約 350 毫升、國小高年級體重約 35 公斤，離譜太多就是單位或小數點錯了。","<b>折扣估算：</b>打 N 折＝付原價的 N 成（打 7 折付約 7 成、打 5 折付一半）；一成＝10%，小費、折扣都可先湊整再抓成數。"],"questions":[{"q":"用湊整數的方法估算，4980 × 2 大約是多少？","options":["約 1000","約 10000","約 100000","約 5000"],"answer":1,"why":"把 4980 湊成整數 5000，5000 × 2 = 10000，所以答案大約落在一萬左右。「約 1000」少算了一位、「約 100000」多算了一位，都是量級抓錯；「約 5000」則是忘了要乘 2。"},{"q":"用四捨五入湊整估算，312 + 489 + 198 大約是多少？","options":["約 700","約 1500","約 1000","約 100"],"answer":2,"why":"把三個數各自湊整：312≈300、489≈500、198≈200，相加 300 + 500 + 200 = 1000，所以總和大約一千。「約 700」漏加了一個數、「約 1500」估太多、「約 100」則是量級少了一位。"},{"q":"用好算的相近整數估算（把 6120 看成 6000、29 看成 30），6120 ÷ 29 大約是多少？","options":["約 200","約 20","約 2000","約 60"],"answer":0,"why":"把 6120 看成 6000、29 看成 30，6000 ÷ 30 = 200，所以商大約是兩百。「約 20」「約 2000」是把商的量級抓少或抓多一位；「約 60」是把除數 29 誤看成 100（6000÷100=60），估算時分母抓錯了量級。"},{"q":"小華計算 297 × 4，寫出答案 118。用估算判斷，這個答案合理嗎？","options":["合理，大約就是 120 左右","不合理，大約應該是 12000","不合理，大約應該是 1200，他可能少算了一位","合理，大約 100 左右"],"answer":2,"why":"把 297 湊成 300，300 × 4 = 1200，正確答案應該落在一千二左右（實際 297×4=1188）。118 只有正確答案的十分之一，明顯少了一位，不合理。「約 12000」反而多抓一位；把 118 當成合理則是沒有先估算就相信了錯答案。"},{"q":"算式 8100 ÷ 9 的答案，四位同學各報一個。用估算判斷，哪一個最合理？","options":["約 90","約 900","約 9000","約 9"],"answer":1,"why":"8100 = 9 × 900，所以商恰好是 900，選「約 900」。「約 90」少一位、「約 9000」多一位、「約 9」少了兩位，都是量級判斷錯誤。"},{"q":"小美買了三樣東西，大約分別是 98 元、203 元、152 元，收銀機卻顯示總共 4530 元。用估算判斷這個金額：","options":["合理，大約就是 4530 元","不合理，總價大約應該是 45 元","合理，大約 4500 元很正常","不合理，總價大約 450 元，4530 元多了一位"],"answer":3,"why":"把三個價錢湊整：98≈100、203≈200、152≈150，相加大約 450 元。顯示的 4530 元多了一位（可能是掃到重複或按錯），不合理。「約 45 元」則是反而少了一位；把 4530 當合理是沒有先估算就相信機器。"},{"q":"下列哪一個數量最接近一位成年人的身高？","options":["約 17 公分","約 1700 公分","約 170 公分","約 70 公分"],"answer":2,"why":"成年人身高大約在 160～180 公分之間，所以「約 170 公分」最合理。「17 公分」大約只有一支筆的長度、「70 公分」大約是還不到一歲的小寶寶的身高、「1700 公分」等於 17 公尺（比五層樓還高），都是把小數點或量級弄錯了。"},{"q":"一瓶常見的鋁罐汽水，容量最接近下列哪一個？","options":["約 350 毫升","約 35 毫升","約 3500 毫升","約 35 公升"],"answer":0,"why":"一般鋁罐飲料大約 330～355 毫升，一口一口喝得完，所以「約 350 毫升」最合理。「35 毫升」大概只有幾口、「3500 毫升」約是 3.5 公升（近兩瓶 2 公升裝的大寶特瓶）、「35 公升」等於一個小水桶，都是量級或單位抓錯。"},{"q":"一隻成年大型犬（例如黃金獵犬）的體重，下列哪一個最合理？","options":["約 3.5 公斤","約 35 公斤","約 350 公斤","約 350 公克"],"answer":1,"why":"成年大型犬（例如黃金獵犬）大約 30～40 公斤，所以「約 35 公斤」最合理。「3.5 公斤」是把小數點往左移了一位（大約只有一隻小貓重）；「350 公斤」往右多移了一位（差不多是四、五個大人加起來那麼重）；「350 公克」則是把單位看成公克（只有一罐飲料的重量），都是小數點位置或單位弄錯了。"},{"q":"原價 1000 元的外套打 7 折，大約要付多少錢？","options":["約 300 元","約 70 元","約 930 元","約 700 元"],"answer":3,"why":"打 7 折就是付原價的 7 成，1000 × 0.7 = 700，大約付七百元。「約 300 元」是把「打 7 折」誤當成「折掉 7 成」；「約 70 元」少了一位；「約 930 元」則是把折扣方向想反（以為只便宜一點點）。"},{"q":"一頓飯共 780 元，想給大約一成（約 10%）當小費，大約要準備多少錢？","options":["約 80 元","約 8 元","約 800 元","約 160 元"],"answer":0,"why":"一成就是 10%，把 780 湊成 800，800 的一成是 80，所以大約給八十元。「約 8 元」少了一位、「約 800 元」多了一位（那是全額）、「約 160 元」則是估成了兩成。"},{"q":"一雙原價約 1980 元的球鞋打 5 折（半價），折後大約要付多少錢？","options":["約 100 元","約 500 元","約 1000 元","約 1500 元"],"answer":2,"why":"打 5 折就是半價，把 1980 湊成 2000，2000 的一半是 1000，所以大約付一千元。「約 500 元」是又多折了一半（打成 2.5 折）、「約 100 元」量級少太多、「約 1500 元」則是只折掉四分之一，折扣方向估錯。"}]},
    {"id":"lv12","level":12,"name":"圖表判讀・看圖說話","emoji":"📊","color":"#0891b2","concepts":["長條圖判讀（比大小、求差與總和）","折線圖判讀（趨勢、升降、最大值）","從圖表找資訊解題","看穿誤導圖表（y 軸不從 0 起的視覺陷阱）"],"keyFacts":["<b>先看標題與座標軸：</b>讀圖前先看標題、每軸代表什麼、單位、每一格是多少，再讀數值才不會出錯。","<b>長條圖比高低：</b>長條越高數值越大；比「多幾」用減法、比「一共」用加法，別把相減看成相加。","<b>折線圖看趨勢：</b>線往上是增加、往下是減少、平的是不變；最高點對到縱軸就是最大值。","<b>當心誤導圖：</b>若 y 軸不是從 0 開始，微小差距會被視覺放大——一定要回頭看實際數字，不能只看柱子高矮。"],"questions":[{"q":"看這張長條圖，星期幾賣出的杯數最多？","options":["星期二","星期三","星期四","星期五"],"answer":2,"why":"找出最高的長條：星期四 40 杯的柱子最高，所以答案是星期四。星期二 35 杯是第二高，容易被當成最多；星期三 15 杯其實是最矮（最少），別把它看成最多；星期五 30 杯也不是最高。","svg":"<svg viewBox=\"0 0 340 210\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><title>飲料店這週每天賣出的杯數（單位：杯）</title><text x=\"170\" y=\"14\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">飲料店這週每天賣出的杯數</text><line x1=\"38\" y1=\"182.0\" x2=\"328\" y2=\"182.0\" stroke=\"currentColor\" stroke-opacity=\"0.18\"/><text x=\"33\" y=\"185.0\" font-size=\"9\" text-anchor=\"end\" fill=\"currentColor\">0</text><line x1=\"38\" y1=\"150.8\" x2=\"328\" y2=\"150.8\" stroke=\"currentColor\" stroke-opacity=\"0.18\"/><text x=\"33\" y=\"153.8\" font-size=\"9\" text-anchor=\"end\" fill=\"currentColor\">10</text><line x1=\"38\" y1=\"119.6\" x2=\"328\" y2=\"119.6\" stroke=\"currentColor\" stroke-opacity=\"0.18\"/><text x=\"33\" y=\"122.6\" font-size=\"9\" text-anchor=\"end\" fill=\"currentColor\">20</text><line x1=\"38\" y1=\"88.4\" x2=\"328\" y2=\"88.4\" stroke=\"currentColor\" stroke-opacity=\"0.18\"/><text x=\"33\" y=\"91.4\" font-size=\"9\" text-anchor=\"end\" fill=\"currentColor\">30</text><line x1=\"38\" y1=\"57.2\" x2=\"328\" y2=\"57.2\" stroke=\"currentColor\" stroke-opacity=\"0.18\"/><text x=\"33\" y=\"60.2\" font-size=\"9\" text-anchor=\"end\" fill=\"currentColor\">40</text><line x1=\"38\" y1=\"26.0\" x2=\"328\" y2=\"26.0\" stroke=\"currentColor\" stroke-opacity=\"0.18\"/><text x=\"33\" y=\"29.0\" font-size=\"9\" text-anchor=\"end\" fill=\"current     {"id":"lv13","level":13,"name":"國中幾何・全等相似與畢氏","emoji":"📐","color":"#7c3aed","concepts":["畢氏定理與逆定理（直角三角形三邊關係）","相似三角形與相似比、面積比","三角形全等判定 SSS／SAS／ASA／RHS","複合圖形面積（大矩形減缺角）"],"keyFacts":["<b>畢氏定理：</b>直角三角形中，兩股平方和 = 斜邊平方（a² + b² = c²，c 是最長的斜邊）；反過來若三邊符合此式，就是直角三角形（逆定理）。","<b>相似三角形：</b>對應角相等、對應邊成比例；相似比 a:b 時，面積比是 a²:b²（比要平方）。平行線會截出相似三角形。","<b>全等判定：</b>SSS（三邊）、SAS（兩邊夾一角）、ASA（兩角夾一邊）、RHS（直角三角形的斜邊與一股）；SAS 的角一定要是兩邊的「夾角」。","<b>複合圖形：</b>不規則圖形可切成或補成長方形——用「大矩形面積 − 缺角面積」或分塊相加來求。"],"questions":[{"q":"看圖中的直角三角形，兩股長已標示，斜邊以「？」表示。請問這條斜邊的長度是多少？","options":["10","14","100","2√7"],"answer":0,"why":"由圖可知兩股為 6 與 8，夾成直角，「？」是最長的斜邊。依畢氏定理：斜邊² = 6² + 8² = 36 + 64 = 100，故斜邊 = √100 = 10。選項「14」是把兩股直接相加（6 + 8），誤以為斜邊等於兩股之和。選項「100」是算到 6² + 8² = 100 後忘了開根號。選項「2√7」是把最長邊 8 當成斜邊、用減法 √(8² − 6²) = √28 = 2√7，弄錯了斜邊與股的位置。","svg":"<svg viewBox=\"0 0 220 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><title>直角三角形（畢氏定理）</title><polygon points=\"45,140 157.5,140 45,-10\" fill=\"#2f7fd1\" fill-opacity=\"0.14\" stroke=\"#2f7fd1\" stroke-width=\"2\"/><path d=\"M 57 140 L 57 128 L 45 128\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><text x=\"101.25\" y=\"156\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">6</text><text x=\"35\" y=\"65\" font-size=\"11\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"700\">8</text><text x=\"111.25\" y=\"59\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">?</text></svg>","svgAlt":"直角三角形，兩股長 6 與 8，直角在左下角，斜邊未知。"},{"q":"看圖，這個直角三角形的兩股長分別為 5 與 12，斜邊長標示為「？」。請問斜邊的長度是多少？","options":["13","17","√119（約 10.9）","169"],"answer":0,"why":"畢氏定理：直角三角形斜邊的平方等於兩股平方和。斜邊 = √(5² + 12²) = √(25 + 144) = √169 = 13，所以正解是 13。容易選錯的「17」是把兩股直接相加 5 + 12，忘了要用平方；容易選錯的「√119（約 10.9）」是把 12 誤當成斜邊、用相減 √(12² − 5²），也就是把斜邊當股的典型錯誤；容易選錯的「169」是正確算到 5² + 12² = 169，卻忘了最後要開根號。","svg":"<svg viewBox=\"0 0 220 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><title>直角三角形（畢氏定理）</title><polygon points=\"45,140 107.5,140 45,-10\" fill=\"#2f7fd1\" fill-opacity=\"0.14\" stroke=\"#2f7fd1\" stroke-width=\"2\"/><path d=\"M 57 140 L 57 128 L 45 128\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><text x=\"76.25\" y=\"156\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">5</text><text x=\"35\" y=\"65\" font-size=\"11\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"700\">12</text><text x=\"86.25\" y=\"59\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"700\">?</text></svg>","svgAlt":"直角三角形，兩股長 5 與 12，直角在左下角，斜邊未知。"},{"q":"看圖，格點上有一個 L 形。它可以看成一個大長方形，左上角被切掉一個小矩形缺口。請根據圖上標示的邊長，求出這個 L 形的面積。","options":["48 平方單位","54 平方單位","42 平方單位","40 平方單位"],"answer":2,"why":"看圖：把 L 形補成完整的大長方形 8×6 = 48，再減掉左上角的缺口 3×2 = 6，得 48 − 6 = 42 平方單位。答 48 的是只算了大長方形、忘了扣掉缺角；答 54 的是把缺角面積加上去而不是減掉；答 40 的是把缺口邊長看錯（例如當成 4×2 = 8）。","svg":"<svg viewBox=\"0 0 230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><title>格點上的複合圖形（L 形）</title><line x1=\"30\" y1=\"25\" x2=\"30\" y2=\"133\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"48\" y1=\"25\" x2=\"48\" y2=\"133\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"66\" y1=\"25\" x2=\"66\" y2=\"133\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"84\" y1=\"25\" x2=\"84\" y2=\"133\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"102\" y1=\"25\" x2=\"102\" y2=\"133\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"120\" y1=\"25\" x2=\"120\" y2=\"133\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"138\" y1=\"25\" x2=\"138\" y2=\"133\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"156\" y1=\"25\" x2=\"156\" y2=\"133\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"174\" y1=\"25\" x2=\"174\" y2=\"133\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"30\" y1=\"25\" x2=\"174\" y2=\"25\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"30\" y1=\"43\" x2=\"174\" y2=\"43\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"30\" y1=\"61\" x2=\"174\" y2=\"61\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"30\" y1=\"79\" x2=\"174\" y2=\"79\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"30\" y1=\"97\" x2=\"174\" y2=\"97\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"30\" y1=\"115\" x2=\"174\" y2=\"115\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><line x1=\"30\" y1=\"133\" x2=\"174\" y2=\"133\" stroke=\"currentColor\" stroke-opacity=\"0.12\"/><polygon points=\"30,61 30,133 174,133 174,25 84,25 84,61\" fill=\"#2f7fd1\" fill-opacity=\"0.16\" stroke=\"#2f7fd1\" stroke-width=\"2\"/><text x=\"102\" y=\"148\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">8</text><text x=\"184\" y=\"79\" font-size=\"11\" text-anchor=\"start\" fill=\"currentColor\">6</text><text x=\"57\" y=\"19\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">3</text><text x=\"22\" y=\"43\" font-size=\"11\" text-anchor=\"end\" fill=\"currentColor\">2</text></svg>","svgAlt":"格點上的 L 形：大長方形寬 8、高 6，左上角切掉一塊寬 3、高 2 的缺口。"},{"q":"看圖，直角三角形 ABC 的直角在頂點 A。D、E 分別在兩股 AB、AC 上，且 DE 平行於 BC。已知 D 是 AB 的中點（AD=DB），另一股 AC 上 AE=3。試問線段 EC 的長度是多少？","options":["EC = 3","EC = 6","EC = 4","EC = 5"],"answer":0,"why":"因為 DE∥BC 且 D 是 AB 的中點，平行線會把兩股切成相同比例：AD:DB=AE:EC=1:1，所以 EC=AE=3。（也可用相似：△ADE∼△ABC，AD:AB=1:2，算出 AC=6，EC=6−3=3。）選「6」是算出整條 AC 就當答案，忘了 EC 只是 AC 減掉 AE 的一段；「4」是把 AB 上另一段 DB=4 直接當成 EC；「5」是看到 3、4 就湊成經典的 3-4-5，但這兩個數不是同一個直角三角形的兩股。","svg":"<svg viewBox=\"0 0 250 175\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><title>相似三角形（平行線 DE 截出）</title><polygon points=\"30,150 166,150 30,48\" fill=\"none\" stroke=\"#2f7fd1\" stroke-width=\"2\"/><line x1=\"98\" y1=\"150\" x2=\"30\" y2=\"99\" stroke=\"#2f7fd1\" stroke-width=\"2\"/><path d=\"M 41 150 L 41 139 L 30 139\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><text x=\"64\" y=\"165\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">4</text><text x=\"132\" y=\"165\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">4</text><text x=\"21\" y=\"124.5\" font-size=\"11\" text-anchor=\"end\" fill=\"currentColor\">3</text><text x=\"21\" y=\"73.5\" font-size=\"11\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"700\">?</text><text x=\"36\" y=\"95\" font-size=\"10\" text-anchor=\"start\" fill=\"currentColor\">E</text><text x=\"98\" y=\"165\" font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">D</text></svg>","svgAlt":"直角三角形 ABC，直角在 A。一股 AB=8（水平）、中點為 D；另一股 AC 上 AE=3、EC 未知；DE 與 BC 平行。"},{"q":"看圖，兩個三角形上：一組對應邊各有 1 條刻痕、另一組對應邊各有 2 條刻痕（表示這兩組對應邊分別相等），而它們的夾角處都畫了角弧（表示夾角相等）。已知這兩組邊及其「夾角」對應相等，請問可用哪一個判據判定這兩個三角形全等？","options":["SSS（邊邊邊）：三組對應邊都相等","SAS（邊角邊）：兩組對應邊及其夾角相等","ASA（角邊角）：兩組對應角及其夾邊相等","RHS（直角、斜邊、股）：直角三角形斜邊與一股相等"],"answer":1,"why":"正解 SAS：圖上兩組對應邊（1 條、2 條刻痕）相等，角弧又落在這兩邊「中間」，正是它們的夾角，符合「兩邊夾一角」。選 SSS 的人把只標了兩組的邊當成三組都相等；ASA 要的是兩角夾一邊，這裡相等的是邊而非角；RHS 只適用於有直角的三角形，圖中並沒有直角。","svg":"<svg viewBox=\"0 0 280 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><title>兩個三角形（兩邊與夾角標記相等）</title><polygon points=\"20,120 110,120 70,40\" fill=\"#2f7fd1\" fill-opacity=\"0.12\" stroke=\"#2f7fd1\" stroke-width=\"2\"/><line x1=\"40.8\" y1=\"77.4\" x2=\"49.2\" y2=\"82.6\" stroke=\"currentColor\" stroke-width=\"1.4\"/><line x1=\"86.4\" y1=\"84.0\" x2=\"95.4\" y2=\"79.6\" stroke=\"currentColor\" stroke-width=\"1.4\"/><line x1=\"84.6\" y1=\"80.4\" x2=\"93.6\" y2=\"76.0\" stroke=\"currentColor\" stroke-width=\"1.4\"/><path d=\"M 62.1 52.7 A 15 15 0 0 0 76.7 53.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/><polygon points=\"160,120 250,120 210,40\" fill=\"#2f7fd1\" fill-opacity=\"0.12\" stroke=\"#2f7fd1\" stroke-width=\"2\"/><line x1=\"180.8\" y1=\"77.4\" x2=\"189.2\" y2=\"82.6\" stroke=\"currentColor\" stroke-width=\"1.4\"/><line x1=\"226.4\" y1=\"84.0\" x2=\"235.4\" y2=\"79.6\" stroke=\"currentColor\" stroke-width=\"1.4\"/><line x1=\"224.6\" y1=\"80.4\" x2=\"233.6\" y2=\"76.0\" stroke=\"currentColor\" stroke-width=\"1.4\"/><path d=\"M 202.1 52.7 A 15 15 0 0 0 216.7 53.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></svg>","svgAlt":"兩個三角形，各標記兩組對應邊相等（一組 1 刻痕、一組 2 刻痕）與夾角相等。"},{"q":"已知某三角形三邊長分別為 9、12、15（單位：公分）。根據畢氏逆定理判斷，下列敘述何者正確？","options":["這是直角三角形，其中 15 是斜邊。","這是直角三角形，其中 9 與 15 是兩股，12 是斜邊。","這不是直角三角形，因為 9+12 ≠ 15。","這不是直角三角形，因為 9²+12² ≠ 15²。"],"answer":0,"why":"最長邊 15 就是斜邊：另兩股平方和 9²+12²=81+144=225，正好等於 15²，等式成立，所以是直角三角形。把「15 當股、12 當斜邊」的答法弄錯了角色——最長邊一定是斜邊，不會是股。用「9+12≠15」判斷的，是把該比的平方和誤當成邊長直接相加；說「9²+12²≠15²」的則是算錯了，81+144 其實剛好等於 225。"},{"q":"一把長 25 公尺的梯子斜靠在垂直的牆面上，梯子底端與牆腳的水平距離為 7 公尺。假設地面水平、牆面鉛直，則梯子頂端沿牆面離地面有多高？","options":["24 公尺","26 公尺","18 公尺","576 公尺"],"answer":0,"why":"梯子、牆、地面圍成一個直角三角形，直角在牆腳。梯長 25 公尺是最長的邊，所以是斜邊；底邊 7 公尺與高（設為 h）是兩股。由畢氏定理：斜邊² = 股² + 股²，即 25² = 7² + h²，得 h² = 625 − 49 = 576，開平方根 h = √576 = 24（公尺），故選 24 公尺。其他選項：26 公尺是把斜邊 25 錯當成一支股，去算 √(25² + 7²) = √674 ≈ 26，方向相反、把斜邊當股了；18 公尺是忘了先平方，直接用 25 − 7 相減，畢氏定理必須對邊長「平方」後才能加減；576 公尺是正確算到 h² = 576 後忘了開平方根，576 只是高的平方而非高本身。"},{"q":"已知 △ABC 與 △DEF 相似，且 AB:DE = 3:5。下列關於這兩個三角形的敘述，何者正確？","options":["對應角 ∠A = ∠D，且對應邊 BC:EF = 3:5","對應角相等，所以 ∠A:∠D = 3:5","因為相似，所以 △ABC 面積：△DEF 面積 = 3:5","相似的兩三角形對應邊相等，所以 △ABC 與 △DEF 全等"],"answer":0,"why":"相似形的對應角相等、對應邊成同一個比，所以 ∠A = ∠D，且 BC:EF 也是 3:5。說「∠A:∠D = 3:5」的把比例錯用到角度上（對應角是相等，不是成比例）；說「面積比 3:5」的忘了面積比是邊長比的平方（應是 9:25）；說「對應邊相等所以全等」的混淆了相似與全等（相似只要邊成比例，這裡比是 3:5 不是 1:1，並不全等）。"},{"q":"甲、乙兩個三角形相似，其對應邊長的相似比 甲：乙 = 2:5。已知乙三角形的面積為 100 平方公分，則甲三角形的面積為多少平方公分？","options":["16","40","80","625"],"answer":0,"why":"相似比 2:5，面積比 = 相似比的平方 = 2²:5² = 4:25。設甲面積為 x，由 甲：乙 = 4:25，得 x:100 = 4:25，故 x = 100 × 4/25 = 16（平方公分），正解為 16。容易選錯的 40：把相似比直接當面積比（用 100 × 2/5），錯在忘了面積比要取對應邊長比的平方。容易選錯的 80：只把相似比其中一項平方，把面積比誤算成 4:5（100 × 4/5），其實分子、分母兩項都要平方。容易選錯的 625：方向弄反，誤以為甲較大而用 25:4（100 × 25/4）；但甲的對應邊較短，面積必定比乙小，不可能大於 100。"},{"q":"小明想用 SSS（三邊對應相等）判定 △ABC 與 △DEF 全等。下列哪一組「已知條件」，剛好完整符合 SSS 判據，可直接斷定兩三角形全等？","options":["AB=DE，BC=EF，CA=FD（三組對應邊分別相等）","AB=DE，BC=EF，且 ∠A=∠D（兩組對應邊與一角相等）","∠A=∠D，∠B=∠E，∠C=∠F（三組對應角分別相等）","AB：DE=BC：EF=CA：FD=2：1（三組對應邊成比例）"],"answer":0,"why":"三組對應邊分別相等正是 SSS 的定義，足以斷定全等。答「兩邊與 ∠A」的人把它當成 SAS，但 SAS 的角要夾在兩已知邊之間，AB、BC 的夾角是 ∠B 而非 ∠A；只有三角相等是 AAA，僅能保證相似；三邊比 2：1 也是相似，全等需比為 1：1。"},{"q":"已知△ABC 與 △DEF 中，∠A = ∠D，∠B = ∠E，且 AB = DE。關於這兩個三角形是否全等，下列判斷何者正確？","options":["兩三角形全等，因為 AB 恰是 ∠A 與 ∠B 的夾邊，符合 ASA（兩角夾邊）。","兩三角形全等，理由是 AAS（兩角與一非夾邊對應相等）。","只知道兩組對應角，屬於 AAA，無法判定全等。","兩三角形全等，理由是 SAS（兩邊夾一角）。"],"answer":0,"why":"∠A、∠B 是△ABC 的兩個角，而 AB 正好是這兩個角之間的「夾邊」（△DEF 中 DE 同理），兩角加夾邊對應相等，正是 ASA，兩三角形全等。標「AAS」的把夾邊誤當成非夾邊——AB 明明夾在 ∠A、∠B 之間，應算 ASA；標「AAA」的忽略了題目已給的一組對應邊 AB = DE，不是只有三個角；標「SAS」的只有一組對應邊，邊數不足，不能用。"},{"q":"直角三角形 ABC 中，∠C=90°，斜邊 AB=15，一股 BC=9。另一個直角三角形 DEF 中，∠F=90°，斜邊 DE=15，一股 EF=9。因為「直角、斜邊、一股對應相等」，可用 RHS 判定 △ABC ≅ △DEF，所以對應邊 AC=DF。試求 AC 的長。","options":["12","√306","6","24"],"answer":0,"why":"先由 RHS 判定：兩三角形都有直角，斜邊 AB=DE=15、一股 BC=EF=9 對應相等，故 △ABC ≅ △DEF，對應邊 AC=DF。要算 AC，在直角三角形 ABC 中，斜邊 AB 對的是直角，兩股平方和等於斜邊平方：AC²=AB²−BC²=15²−9²=225−81=144，所以 AC=√144=12。容易選錯的「√306」是把斜邊 15 當成一股，用 15²+9²=306 相加後開根號，畢氏定理方向弄反（把斜邊當股）。容易選錯的「6」是把斜邊直接減一股 15−9，忽略要用平方。容易選錯的「24」是把斜邊加一股 15+9，同樣沒有用畢氏定理的平方關係。"}]}

    {"id":"lv14","level":14,"name":"二次函數頂點・配方與最值","emoji":"🎢","color":"#e11d48","concepts":["配方法將 y=ax²+bx+c 化成頂點式 y=a(x−h)²+k","由頂點式直接讀出頂點座標 (h, k) 與對稱軸 x=h","開口方向與最大／最小值判斷（a 的正負）","對稱軸公式 x=−b÷(2a) 與代回求最值","由頂點與另一點求係數 a、二次函數的生活最值應用"],"keyFacts":["<b>頂點式：</b>y=a(x−h)²+k 的頂點就是 (h, k)，對稱軸是直線 x=h。注意括號內是「x 減 h」，所以 (x+4) 代表 h=−4。","<b>配方三步：</b>先提出 a，再把一次項係數的一半平方「加進去又減回來」，最後整理成完全平方式。例：x²+6x=(x+3)²−9。","<b>開口與最值：</b>a＞0 開口向上，頂點是最低點，有最小值；a＜0 開口向下，頂點是最高點，有最大值。最值的大小就是 k。","<b>對稱軸公式：</b>x=−b÷(2a)。小心 b 本身的正負號，例如 b=−6 時 −b=+6。把這個 x 代回原式就得到最值（頂點的 y）。","<b>最值發生在頂點：</b>最大或最小「值」是 k，而「發生在」x=h。別把 h 或係數 a 誤當成最值。"],"questions":[{"q":"已知二次函數 y=(x−3)²+2，它的頂點座標是？","options":["(3, 2)","(−3, 2)","(3, −2)","(−3, −2)"],"answer":0,"why":"頂點式 y=a(x−h)²+k 的頂點就是 (h, k)。這裡括號是 x−3，對應 h=3；常數是 +2，對應 k=2，所以頂點是 (3, 2)。選 (−3, 2) 是把 x−3 的 h 誤看成 −3，其實括號內是減 3，h 要取正 3；選 (3, −2) 是把 +2 的 k 抄成負號；選 (−3, −2) 則是兩個符號都弄反了。"},{"q":"二次函數 y=2(x+4)²−5 的對稱軸是哪一條直線？","options":["x=4","x=−5","x=−4","x=5"],"answer":2,"why":"對稱軸是 x=h。把 x+4 寫成 x−(−4)，所以 h=−4，對稱軸為 x=−4。選 x=4 是忘了 x+4 其實代表 h=−4，括號內是加就要取負；選 x=−5 是把常數 k=−5 誤當成對稱軸；選 x=5 則是既抓錯常數又弄錯符號。"},{"q":"函數 y=−3(x−1)²+7 有最大值還是最小值？值是多少？","options":["最小值 7","最大值 7","最大值 1","最小值 −3"],"answer":1,"why":"a=−3 小於 0，開口向下，頂點是最高點，所以有最大值，值等於 k=7。選「最小值 7」是把開口方向搞反，a<0 應該是最大值；選「最大值 1」是把 h=1 誤當成最值，最值看的是 k 不是 h；選「最小值 −3」是把係數 a=−3 誤當成最值，又弄錯了最大最小。"},{"q":"用對稱軸公式 x=−b÷(2a)，求 y=x²−6x+5 的對稱軸。","options":["x=3","x=−3","x=6","x=−6"],"answer":0,"why":"代入 a=1、b=−6：x=−(−6)÷(2×1)=6÷2=3。選 x=−3 是忘了 b=−6 前面還有一個負號，−(−6) 應該是 +6；選 x=6 是算完 −b=6 後忘了除以 2a；選 x=−6 是直接把 b 當答案又沒有變號。"},{"q":"把 y=x²+6x+5 用配方法化成頂點式，正確的是？","options":["y=(x−3)²−4","y=(x+3)²+5","y=(x+3)²+4","y=(x+3)²−4"],"answer":3,"why":"取一次項係數 6 的一半 3，平方得 9，所以 x²+6x=(x+3)²−9，再加原本的 +5，得到 (x+3)²−4。選 (x−3)²−4 是把括號內符號弄反，+6x 配方後括號內應是 +3；選 (x+3)²+5 是忘了配方時補進來的 −9 要一起算（−9+5=−4，不是 +5）；選 (x+3)²+4 是把 −9+5 算成 +4，正負號弄錯了。"},{"q":"二次函數 y=x²−4x+1 的頂點座標是？","options":["(−2, −3)","(2, 3)","(2, −3)","(2, −5)"],"answer":2,"why":"x²−4x=(x−2)²−4，再加 1 得 (x−2)²−3，所以頂點 (h, k)=(2, −3)。選 (−2, −3) 是把 x−2 的 h 弄成負，括號內是減 2，h 要取正；選 (2, 3) 是把 k 的負號掉了；選 (2, −5) 是把 −4+1 誤算成 −5，正確是 −3。"},{"q":"把 y=2x²+8x+5 化成頂點式，正確的是？","options":["y=2(x+2)²−3","y=2(x−2)²−3","y=2(x+2)²+5","y=2(x+2)²−8"],"answer":0,"why":"先提出 a=2：2(x²+4x)+5；括號內 4 的一半是 2，平方得 4，所以 2((x+2)²−4)+5=2(x+2)²−8+5=2(x+2)²−3。選 2(x−2)²−3 是括號內符號弄反；選 2(x+2)²+5 是忘了乘進去的 −8 要和 +5 合併；選 2(x+2)²−8 是漏加最後的 +5（−8+5 才是 −3）。"},{"q":"承上題，y=2x²+8x+5 的最小值是多少？","options":["5","−8","3","−3"],"answer":3,"why":"化成 y=2(x+2)²−3 後，a=2>0 開口向上，最小值就是頂點的 k=−3。選 5 是把原式常數項 c=5 誤當成最小值；選 −8 是配方過程中的中間值 −8 忘了再加 +5；選 3 是把最小值 −3 的正負號弄反了。"},{"q":"二次函數 y=−2x²+12x−7 的對稱軸是？","options":["x=−3","x=3","x=6","x=−6"],"answer":1,"why":"用 x=−b÷(2a)，a=−2、b=12：x=−12÷(2×(−2))=−12÷(−4)=3。選 x=−3 是把「負除以負得正」弄錯，分母 2a=−4，−12÷(−4)=+3；選 x=6 是忘了分母裡的 2、只用 −b÷a=−12÷(−2)=6；選 x=−6 是忘了分母裡的 a、只用 −b÷2=−12÷2=−6。"},{"q":"承上題，y=−2x²+12x−7 的最大值是多少？","options":["−11","3","11","7"],"answer":2,"why":"a=−2<0 開口向下，有最大值。把對稱軸 x=3 代回：−2×3²+12×3−7=−18+36−7=11。選 −11 是計算時把 −7 或整體符號弄反；選 3 是把對稱軸 x=3 誤當成最大值（那是發生的位置，不是值）；選 7 是把常數項 −7 的絕對值直接拿來當答案。"},{"q":"頂點式 y=a(x−2)²+1 的圖形通過點 (0, 5)，則 a 等於多少？","options":["a=1","a=4","a=−1","a=2"],"answer":0,"why":"把 (0, 5) 代入：5=a(0−2)²+1=4a+1，解得 4a=4，所以 a=1。選 a=4 是忘了要除以 (0−2)²=4，把 4a 直接當成 a；選 a=−1 是把 (0−2)² 算成負值或移項時符號弄錯；選 a=2 是把 (0−2)² 只開根號成 2，少算了平方。"},{"q":"用長 20 公尺的籬笆圍成一個矩形（四邊都要圍），面積最大是多少平方公尺？","options":["20","100","50","25"],"answer":3,"why":"周長 20 表示兩邊相加 x+y=10（周長的一半）。面積 A=x(10−x)=−x²+10x，對稱軸在 x=5 時最大，此時 A=5×5=25 平方公尺，也就是圍成正方形時面積最大。選 20 是把周長直接當成面積；選 100 是把半周長 10 誤當成正方形的邊長去平方（10²=100），但 10 是相鄰兩邊之和，每邊其實各 5；選 50 是把半周長 10 當成一邊、再乘另一邊 5，忘了兩邊要相等各 5 才最大。"}]},
    {"id":"lv15","level":15,"name":"數列通式・等差等比與級數和","emoji":"🔢","color":"#db2777","concepts":["等差數列通項與公差 aₙ=a₁+(n−1)d","等差級數和 Sₙ=n(a₁+aₙ)/2 的兩種寫法","等比數列通項與公比 aₙ=a₁·r^(n−1)","等比級數和 Sₙ=a₁(rⁿ−1)/(r−1)（r≠1）","由前幾項找規律寫通式與生活應用（堆疊、對折等）"],"keyFacts":["<b>等差通項：</b>aₙ = a₁ + (n−1)×d，其中 d 是公差，等於「後一項減前一項」。要小心是 (n−1) 不是 n。","<b>等差級數和：</b>Sₙ = n×(a₁+aₙ)÷2；若不知末項，可用 Sₙ = n×〔2a₁+(n−1)d〕÷2。別忘了最後要除以 2。","<b>等比通項：</b>aₙ = a₁×r^(n−1)，其中 r 是公比，等於「後一項除以前一項」。次方是 n−1。","<b>等比級數和：</b>Sₙ = a₁×(rⁿ−1)÷(r−1)，適用於 r≠1；分子的 rⁿ 之後要記得減 1。","<b>找規律訣竅：</b>先看相鄰兩項是「差固定」（等差）還是「倍數固定」（等比），判斷後再套對應通式，並用 n=1、n=2 代回去驗算。"],"questions":[{"q":"等差數列 2, 5, 8, 11, … 的公差 d 是多少？","options":["5","3","2","7"],"answer":1,"why":"公差是後一項減前一項，5−2=3。誤答：5 是把第二項當成公差；2 是把首項當成公差；7 是把相鄰兩項相加（2+5）。"},{"q":"等差數列首項 a₁=4、公差 d=3，第 10 項 a₁₀ 是多少？","options":["34","31","27","30"],"answer":1,"why":"aₙ=a₁+(n−1)d=4+9×3=4+27=31。誤答：34 是把 n−1 誤用成 n（算成 4+10×3）；27 是忘了加首項（只算 9×3）；30 是既忘加首項又用 n（10×3）。"},{"q":"等差數列 5, 8, 11, … 中，41 是第幾項？","options":["12","14","13","36"],"answer":2,"why":"由 41=5+(n−1)×3，得 (n−1)×3=36，n−1=12，所以 n=13。誤答：12 是把 n−1 直接當成 n（忘了加回 1）；14 是多加了 1；36 是只做 41−5、忘了除以公差 3。"},{"q":"等差數列 1, 2, 3, …, 100 的總和是多少？","options":["10100","5000","5050","101"],"answer":2,"why":"Sₙ=n(a₁+aₙ)/2=100×(1+100)/2=100×101/2=5050。誤答：10100 是忘了除以 2；5000 是把 (1+100) 誤當成 100 再乘除；101 是只算了 a₁+aₙ、忘了乘項數再除。"},{"q":"等差數列首項 3、公差 4，前 20 項的和 S₂₀ 是多少？","options":["1640","860","79","820"],"answer":3,"why":"Sₙ=n〔2a₁+(n−1)d〕/2=20×〔2×3+19×4〕/2=20×82/2=820。誤答：1640 是忘了除以 2；860 是把 n−1 誤用成 n（19 寫成 20）；79 只是第 20 項本身（a₂₀=3+19×4），不是總和。"},{"q":"等比數列首項 2、公比 3，第 5 項 a₅ 是多少？","options":["486","162","54","32"],"answer":1,"why":"aₙ=a₁·r^(n−1)=2×3⁴=2×81=162。誤答：486 是把次方用成 n（算成 2×3⁵）；54 是次方少一（2×3³）；32 是把首項 2 當底數、指數直接用 n（算成 2⁵），忘了公比 3 才是底數、次方是 n−1。"},{"q":"等比數列 3, 6, 12, 24, … 的公比 r 是多少？","options":["3","1/2","2","6"],"answer":2,"why":"公比是後一項除以前一項，6÷3=2。誤答：3 是把首項當成公比；6 是把第二項當成公比；1/2 是相除方向反了（用前項除後項）。"},{"q":"等比數列 1, 2, 4, 8, … 中，256 是第幾項？","options":["8","128","9","10"],"answer":2,"why":"通項 aₙ=1×2^(n−1)=256，而 256=2⁸，所以 n−1=8、n=9。誤答：8 是把指數 8 直接當成項數（忘了加 1）；128 是只做 256÷2、沒對應到項數；10 是多加了 1。"},{"q":"等比數列首項 2、公比 3，前 4 項的和 S₄ 是多少？","options":["160","80","81","54"],"answer":1,"why":"Sₙ=a₁(rⁿ−1)/(r−1)=2×(3⁴−1)/(3−1)=2×80/2=80（也就是 2+6+18+54）。誤答：160 是忘了除以 (r−1)；81 是分子的 rⁿ 忘了減 1（算成 2×3⁴÷2）；54 只是第 4 項 a₄=2×3³，不是總和。"},{"q":"數列 5, 8, 11, 14, … 的通項公式 aₙ 是什麼？","options":["3n+5","3n","3n+2","5n+3"],"answer":2,"why":"首項 5、公差 3，aₙ=5+(n−1)×3=3n+2（驗算：n=1 得 5，n=2 得 8）。誤答：3n+5 是用 a₁+n×d、少減了 1（n=1 會算出 8）；3n 只看了公差、漏掉常數項；5n+3 把首項和公差的位置放反了。"},{"q":"罐頭堆成三角形，最上層 1 個，往下每層多 1 個，共堆 10 層。總共幾個罐頭？","options":["45","55","100","50"],"answer":1,"why":"每層數量為 1,2,…,10，總和 S=10×(1+10)/2=55。誤答：45 是只加到第 9 層、漏了最底層；100 是用 10×10；50 是用 10×10÷2、把 (1+10) 誤當成 10。"},{"q":"一張紙每對折一次，厚度就變成原來的兩倍。連續對折 7 次後，厚度是原來的幾倍？","options":["64","14","128","49"],"answer":2,"why":"每折一次厚度乘以 2，折 7 次就是乘了 7 個 2，即 2⁷=128 倍。誤答：64 是 2⁶、少算了一次對折；14 是把「乘 7 個 2（2⁷）」誤算成「7×2」，把應該連乘的倍數當成一次加乘；49 是把它當成 7² 來算。"}]}

    {"id":"lv16","level":16,"name":"圓的性質・圓心角圓周角與切線","emoji":"⭕","color":"#0891b2","concepts":["圓周角是同弧圓心角的一半（反過來圓心角是圓周角的兩倍）","半圓（直徑）所對的圓周角恆為 90°","同弧或等弧所對的圓周角相等；圓內接四邊形對角互補","切線垂直過切點的半徑、圓外一點兩切線段等長","弦心距垂直平分弦，配合畢氏定理求弦長"],"keyFacts":["<b>圓周角定理：</b>同一段弧所對的圓周角，等於它所對圓心角的一半；反過來看，圓心角是圓周角的兩倍。","<b>半圓的圓周角：</b>直徑所對的圓周角一定是 90°（因為直徑對的圓心角是 180°，一半就是 90°）。","<b>同弧等角：</b>只要都對著同一段弧 AB（頂點落在對側的那條弧上），不論頂點在對側弧的哪個位置，圓周角都相等；但若頂點跑到弧 AB 那一側，張角會變成互補（180° 減原角）而不是相等。","<b>切線性質：</b>切線與過切點的半徑互相垂直（夾角 90°）；從圓外同一點畫出的兩條切線段長度相等。","<b>內接四邊形與弦心距：</b>圓內接四邊形的一組對角互補（和為 180°）；圓心到弦的垂線（弦心距）會垂直平分那條弦，配合半徑用畢氏定理即可求弦長。"],"questions":[{"q":"圓 O 上有 A、B、C 三點，圓心角 ∠AOB＝100° 對弧 AB，圓周角 ∠ACB 對同一段弧 AB。求 ∠ACB。","options":["50°","100°","200°","25°"],"answer":0,"why":"同弧的圓周角是圓心角的一半，∠ACB = 100° ÷ 2 = 50°。選 100° 是誤以為圓周角等於圓心角；選 200° 是把關係顛倒、拿圓心角再乘 2；選 25° 是多除一次 2（等於除以 4）。"},{"q":"圓 O 上有 A、B、C 三點，圓周角 ∠ACB＝35° 對弧 AB，∠AOB 是對同一段弧 AB 的圓心角。求 ∠AOB。","options":["70°","35°","17.5°","145°"],"answer":0,"why":"圓心角是同弧圓周角的兩倍，∠AOB = 35° × 2 = 70°。選 35° 是誤以為兩者相等；選 17.5° 是方向做反、把圓周角又除以 2；選 145° 是誤用 180° − 35° 當成互補，但圓心角與圓周角是 2 倍關係、不是互補。"},{"q":"AB 是圓 O 的直徑，C 是圓上另一點。求 ∠ACB。","options":["90°","180°","45°","60°"],"answer":0,"why":"直徑所對的圓心角是 180°（一直線），圓周角是它的一半，180° ÷ 2 = 90°，所以半圓所對的圓周角一定是直角。選 180° 是把圓周角當成圓心角；選 45° 是又多除一次 2；選 60° 並沒有對應的定理依據——直徑對的圓周角固定是 90°，用「半圓＝90°」就能直接排除。"},{"q":"AB 是圓 O 的直徑，C 在圓上，∠ABC＝32°。求 ∠BAC。","options":["58°","32°","90°","45°"],"answer":0,"why":"因 AB 是直徑，∠ACB 是半圓所對的圓周角 = 90°。三角形內角和 180°，∠BAC = 180° − 90° − 32° = 58°。選 32° 是誤以為 △ABC 是等腰、兩底角相等；選 90° 是把直角安到 ∠BAC 上（其實直角在頂點 C）；選 45° 是誤以為兩個銳角平分 90°、各得一半。"},{"q":"圓 O 上有 A、B、C、D 四點，∠ACB 與 ∠ADB 都對同一段弧 AB。已知 ∠ACB＝40°，求 ∠ADB。","options":["40°","80°","20°","140°"],"answer":0,"why":"∠ACB 與 ∠ADB 對同一段弧 AB，同弧所對的圓周角都相等，所以 ∠ADB = ∠ACB = 40°。選 80° 是誤把它當成圓心角（圓周角的 2 倍）；選 20° 是誤除以 2；選 140° 是誤用 180° − 40° 當互補，但同弧圓周角是相等、不是互補。"},{"q":"四邊形 ABCD 內接於圓 O，∠A＝100°、∠B＝70°。求 ∠C。","options":["80°","110°","100°","70°"],"answer":0,"why":"圓內接四邊形的「對角」互補，∠A 與 ∠C 是對角，∠C = 180° − 100° = 80°。選 110° 是拿錯對象、用了 180° − ∠B（∠B 的對角是 ∠D 不是 ∠C）；選 100° 是誤以為 ∠C = ∠A；選 70° 是誤以為 ∠C = ∠B。"},{"q":"過圓 O 外一點 P 作圓的切線，切點為 T，連 OT（半徑）與 OP。已知 ∠TPO＝40°，求 ∠TOP。","options":["50°","40°","90°","140°"],"answer":0,"why":"切線垂直過切點的半徑，所以 ∠OTP = 90°。△OTP 內角和 180°，∠TOP = 180° − 90° − 40° = 50°。選 40° 是誤以為 △OTP 等腰、兩角相等；選 90° 是把直角安到 ∠TOP（其實直角在切點 T）；選 140° 是誤算 180° − 40°、忘了先扣掉 90°。"},{"q":"自圓 O 外一點 P 作兩條切線，切於 A、B 兩點。已知 ∠APB＝50°。因兩切線段等長，△PAB 為等腰三角形。求 ∠PAB。","options":["65°","50°","130°","25°"],"answer":0,"why":"圓外一點的兩條切線段等長（PA = PB），△PAB 為等腰三角形，兩底角相等 = (180° − 50°) ÷ 2 = 65°。選 50° 是誤以為底角等於頂角；選 130° 是只算 180° − 50°、忘了兩個底角要再平分；選 25° 是把頂角 50° 直接對半、弄錯了要平分的對象。"},{"q":"自圓 O 外一點 P 作兩條切線，切於 A、B 兩點，∠APB＝50°；OA、OB 為圓 O 的半徑，∠OAP＝∠OBP＝90°（半徑垂直切線）。求圓心角 ∠AOB。","options":["130°","50°","100°","40°"],"answer":0,"why":"四邊形 OAPB 中，∠OAP = ∠OBP = 90°，四邊形內角和 360°，∠AOB = 360° − 90° − 90° − 50° = 130°。選 50° 是誤以為 ∠AOB = ∠APB；選 100° 是誤用「圓心角是 2 倍」把 50° 加倍；選 40° 是誤算 90° − 50°。"},{"q":"圓 O 的半徑為 13，圓心到弦 AB 的距離（弦心距）為 5，弦心距垂直平分弦 AB。求弦長 AB。","options":["24","12","18","26"],"answer":0,"why":"弦心距垂直平分弦，形成直角三角形，半弦長 = √(13² − 5²) = √144 = 12，整條弦 AB = 12 × 2 = 24。選 12 是只算到半弦、忘了乘 2；選 26 是誤把弦當成直徑（2 × 13）；選 18 是把半徑與弦心距直接相加（13 + 5）、沒用畢氏定理。"},{"q":"四邊形 ABCD 內接於圓 O，∠A＝80°，且 ∠B＝∠D。求 ∠B。","options":["90°","100°","80°","45°"],"answer":0,"why":"內接四邊形中 ∠B 與 ∠D 是「對角」，互補和為 180°；又已知兩角相等，所以各為 180° ÷ 2 = 90°。選 100° 是算成 ∠A 的對角 ∠C（180° − 80°），但問的是 ∠B；選 80° 是誤以為 ∠B = ∠A；選 45° 是把 90° 又對半、沒有根據。"},{"q":"AB 是圓 O 的直徑，AB＝20，C 是圓上一點，∠ABC＝60°。求 BC 的長。","options":["10","20","10√3","5"],"answer":0,"why":"AB 是直徑，∠ACB = 90°（半圓）。△ABC 中 ∠ABC = 60°，故 ∠BAC = 30°；直角三角形中 30° 角所對的邊是斜邊的一半，BC = 20 ÷ 2 = 10。選 20 是誤以為 BC 等於直徑；選 10√3 那是對著 60° 的另一股 AC 的長、不是 BC；選 5 是誤以為 30° 的對邊是斜邊的 1/4。"}]},
    {"id":"lv17","level":17,"name":"幾何證明・選出正確理由","emoji":"🏛️","color":"#7c3aed","concepts":["相交線的角關係：對頂角相等、鄰角互補","平行線截角：同位角相等、內錯角相等、同旁內角互補","等腰三角形：等邊對等角、等角對等邊","三角形全等判定 SSS／SAS／ASA／AAS／RHS 各自的條件","先證全等才用 CPCTC；公共邊、中點、角平分線屬定義層級的理由"],"keyFacts":["<b>相交線：</b>兩直線相交時，開口相反、沒有共用邊的『對頂角』一定相等；相鄰、共用一邊而合成一直線的兩角則『互補』，和為 180°。互補是『相加』不是『相等』，兩者別混。","<b>平行線被截：</b>只有在『兩直線平行』時才成立——『同位角相等』(位置相同)、『內錯角相等』(在兩線之間、截線異側交錯)、『同旁內角互補』(在兩線之間、同一側，和 180°)。沒有平行條件時這三條都不能用。","<b>等腰三角形：</b>兩邊相等，則它們所對的兩底角相等(等邊對等角)；反過來兩角相等也會使兩邊相等(等角對等邊)。這是同一個三角形內的性質，不需要另一個三角形。","<b>全等五判定：</b>SSS(三邊)、SAS(兩邊及其夾角)、ASA(兩角及其夾邊)、AAS(兩角及一非夾邊)、RHS(直角三角形的斜邊加一股)。要小心：『AAA』只能證相似、不能證全等；一般『SSA(兩邊及非夾角)』不保證全等，唯有在直角這個特例才升級為 RHS。","<b>先全等，才有 CPCTC：</b>『全等三角形對應邊、對應角相等(CPCTC)』必須等全等『已經證出』後才能引用；若拿它當判定全等的條件就是循環論證。而『公共邊(自己等於自己)、中點(把線段分成相等兩段)、角平分線(把角分成相等兩角)』都是定義層級的理由，常用來湊出全等所需的相等條件。"],"questions":[{"q":"兩條直線 AB、CD 相交於點 O。∠AOC 與 ∠BOD 是這次相交所形成、沒有共用邊、開口方向相反的一對角。某人在證明中寫下『∠AOC＝∠BOD』。這一步成立的理由是？","options":["對頂角相等","兩直線平行，內錯角相等","同一直線上兩鄰角互補，所以這兩角相等","等腰三角形的兩底角相等"],"answer":0,"why":"∠AOC 與 ∠BOD 由兩直線相交而成、無共用邊且開口相反，正是『對頂角』，對頂角必相等（各自與 ∠AOD 互補，故彼此相等）。選項『內錯角相等』要先有兩直線平行且被第三線所截，這裡兩線是相交而非平行，用不上。『鄰角互補』說的是相加等於 180°（和的關係），不是兩角相等，而且互補的是相鄰的角、不是這一對。『等腰三角形底角』完全用錯定理，這個配置根本沒有三角形。"},{"q":"直線 L1 平行於 L2，一條截線 t 同時穿過這兩條平行線。∠1 在 L1 上方、截線右側；∠2 在 L2 上方、截線右側，兩角在各自交點的位置完全相同。證明中寫『∠1＝∠2』的理由是？","options":["兩直線平行，同位角相等","兩直線平行，內錯角相等","對頂角相等","兩直線平行，同旁內角互補"],"answer":0,"why":"∠1、∠2 位於兩個交點的相同位置（都在上方、右側），是『同位角』；兩線平行時同位角相等。『內錯角』指的是夾在兩平行線之間、且分處截線兩側的一對角，位置不合。∠1、∠2 分屬不同交點、並非同一次相交所成，故不是『對頂角』。『同旁內角互補』是相加為 180° 的關係（且指兩線之間、同一側的角），不是相等。"},{"q":"直線 L1 平行於 L2，被截線 t 所截。∠3 夾在兩平行線之間、位於截線左側；∠4 也夾在兩平行線之間、位於截線右側，兩角分處截線兩側且交錯。證明寫『∠3＝∠4』，理由是？","options":["兩直線平行，內錯角相等","兩直線平行，同位角相等","兩直線平行，同旁內角互補","對頂角相等"],"answer":0,"why":"兩角都在兩平行線『之間』、且分居截線兩側交錯，正是『內錯角』，平行時內錯角相等。『同位角』要位置相同（同一側、同上下），這裡是交錯、位置不同。『同旁內角』指兩線之間、同一側的一對，關係是互補（和 180°）而非相等，且題目兩角是異側。『對頂角』須由兩直線相交於一點所成，這裡兩角並不在同一交點。"},{"q":"△ABC 中，AB＝AC（頂點在 A）。證明裡出現『∠B＝∠C』。這一步的正確理由是？","options":["等腰三角形的兩底角相等（等邊對等角）","三角形三內角和為 180°","大邊對大角，故兩角相等","全等三角形對應角相等"],"answer":0,"why":"AB＝AC 表示這是等腰三角形，∠B、∠C 是兩腰所對的底角，『等邊對等角』保證底角相等。『內角和 180°』只給三角總和，無法單獨推出其中兩角相等。『大邊對大角』是處理『不等邊』時邊與角的大小順序，用在兩邊相等時導不出相等，用詞也不對。『全等三角形對應角相等』要先有兩個已證全等的三角形，這裡只有一個三角形。"},{"q":"△ABC 與 △DEF 中，已知 AB＝DE、BC＝EF、CA＝FD（三組對應邊分別相等）。證明寫『△ABC≅△DEF』。判定全等的理由是？","options":["SSS（三邊對應相等）","SAS（兩邊及其夾角對應相等）","ASA（兩角及其夾邊對應相等）","AAS（兩角及一非夾邊對應相等）"],"answer":0,"why":"題目給的是三組『邊』對應相等，正好符合 SSS。SAS 需要兩邊再加這兩邊的『夾角』，題目沒給任何角。ASA 需兩角及其夾邊，AAS 需兩角及一邊，兩者都要用到『角』的條件，而題目完全沒有角的資訊，所以只能用 SSS。"},{"q":"△ABC 與 △DEF 中，已知 AB＝DE、∠A＝∠D、AC＝DF。注意 ∠A 正是 AB 與 AC 這兩邊所夾的角。證明寫『△ABC≅△DEF』，理由是？","options":["SAS（兩邊及其夾角對應相等）","SSS（三邊對應相等）","ASA（兩角及其夾邊對應相等）","SSA：兩邊及其中一邊的對角相等"],"answer":0,"why":"給的是兩邊 AB、AC 以及它們所『夾』的角 ∠A，對應相等，正是 SAS。SSS 需三邊，題目只給兩邊。ASA 需兩個角，題目只有一個角。『SSA（兩邊及非夾角）』並不是有效的全等判定（可能出現兩種三角形的模糊情形），而且本題已知的角恰為夾角，本來就該歸為 SAS。"},{"q":"△ABC 與 △DEF 中，已知 ∠B＝∠E、BC＝EF、∠C＝∠F。其中 BC 正好是 ∠B 與 ∠C 兩角所夾的邊。證明寫『△ABC≅△DEF』，理由是？","options":["ASA（兩角及其夾邊對應相等）","AAS（兩角及一非夾邊對應相等）","SAS（兩邊及其夾角對應相等）","SSS（三邊對應相等）"],"answer":0,"why":"兩個角 ∠B、∠C 以及夾在它們中間的邊 BC 對應相等，正是 ASA。AAS 用在『邊不是夾在兩角之間』的情形，這裡 BC 恰為夾邊，應歸 ASA。SAS 需要兩邊一夾角，本題只有一邊。SSS 需三邊，本題也只有一邊。"},{"q":"△ABC 與 △DEF 中，已知 ∠A＝∠D、∠B＝∠E、BC＝EF。這裡 BC 所對的是 ∠A，並不是夾在 ∠A 與 ∠B 之間的邊。證明寫『△ABC≅△DEF』，理由是？","options":["AAS（兩角及一非夾邊對應相等）","ASA（兩角及其夾邊對應相等）","SAS（兩邊及其夾角對應相等）","無法判定，因為兩角相等只代表相似"],"answer":0,"why":"兩角相等加上一條『不是夾邊』的對應邊相等，正是 AAS（可由內角和先得第三角相等，再轉成 ASA）。ASA 要求那條邊剛好夾在兩角之間，但本題 BC 對著 ∠A、不是 ∠A 與 ∠B 的夾邊（夾邊應是 AB），所以不是 ASA。SAS 需兩邊，本題只有一邊。『只相似不全等』是錯的：兩角相等雖確定相似，但此處還多給了一組對應邊相等，足以升級為全等。"},{"q":"直角三角形 △ABC 與 △DEF 中，∠B＝∠E＝90°。已知斜邊 AC＝DF，且一股 BC＝EF。證明寫『△ABC≅△DEF』，理由是？","options":["RHS（直角三角形，斜邊與一股對應相等）","SSA：兩邊及其中一邊的對角相等","AAA（三角對應相等）","SAS（兩邊及其夾角對應相等）"],"answer":0,"why":"兩者皆為直角三角形，且『斜邊』AC＝DF 與一『股』BC＝EF 對應相等，正是專用於直角三角形的 RHS。一般的『SSA（兩邊及非夾角）』不保證全等，但在有直角這個特例時就成立，這正是 RHS 被特別列出的原因。AAA 只能判定相似、不能判定全等（大小可不同）。SAS 需要的是『兩邊的夾角』，但已知兩邊 AC 與 BC 所夾的角是 ∠C，而題目給的直角是 ∠B（並非這兩邊的夾角），故不能直接用 SAS。"},{"q":"在某證明中已經證得 △ABC≅△DEF。接著證明寫下『∠A＝∠D』。這一步的理由是？","options":["全等三角形的對應角相等（CPCTC）","對頂角相等","兩直線平行，同位角相等","等腰三角形兩底角相等"],"answer":0,"why":"既然 △ABC≅△DEF 已成立，∠A 與 ∠D 是對應角，『全等三角形對應邊、對應角都相等』（常記作 CPCTC）保證它們相等。『對頂角』要兩直線相交，與此無關。『同位角相等』要兩平行線被截，這裡沒有平行線條件。『等腰底角』要在同一個三角形內兩腰相等，與『兩個全等三角形的對應角』是不同情境。"},{"q":"要證 △ABD≅△ACD。這四點 A、B、C、D 中，線段 AD 同時是 △ABD 與 △ACD 的一條邊（兩個三角形共用這條 AD）。證明中寫『AD＝AD』作為一組對應邊相等，其理由是？","options":["AD 是兩個三角形的公共邊，同一條線段自己等於自己","全等三角形對應邊相等","AD 是 ∠A 的角平分線，故兩段相等","D 是 BC 的中點，故 AD 相等"],"answer":0,"why":"AD 被兩個三角形共用，它就是同一條線段，長度當然等於自己，這就是『公共邊（共同邊）』這一步的依據，常用來湊出全等所需的一組對應邊。『全等三角形對應邊相等』要『先』證出全等才能用，拿它當全等的條件會變成循環論證（倒果為因）。『角平分線』說的是把一個角分成相等兩角，與 AD 自身等長無關，且題目未說 AD 平分角。『D 是中點』講的是 BD＝DC，那是另外兩條邊，與 AD＝AD 無關，也未給此條件。"},{"q":"已知射線 AD 平分 ∠BAC（即 AD 為 ∠BAC 的角平分線）。證明中寫『∠BAD＝∠CAD』。這一步成立的理由是？","options":["角平分線的定義：平分線把一個角分成相等的兩個角","對頂角相等","全等三角形對應角相等","AD 是公共邊，故兩角相等"],"answer":0,"why":"『角平分線』的定義就是把一個角分成大小相等的兩個角，所以由 AD 平分 ∠BAC 直接得 ∠BAD＝∠CAD，用的是定義本身。『對頂角』需由兩直線相交產生，這裡是一個角被分割、並非相交。『全等對應角相等』要先有兩個已證全等的三角形，此步尚未證全等（這反而常是用來『證』全等的條件之一）。『公共邊』講的是邊相等（長度），不是角相等，張冠李戴。"}]},
    {"id":"lv18","level":18,"name":"尺規作圖・原理與步驟","emoji":"✒️","color":"#b45309","concepts":["尺規工具限制：直尺只畫直線（不量刻度）、圓規只畫圓弧與搬移等長","垂直平分線＝到線段兩端點等距的點所成的線","角平分線與複製角都靠SSS三邊全等成立","過線外一點作垂線（等距→垂直平分線）與平行線（複製同位角）","正三角形、正六邊形：邊長＝半徑的作圖原理"],"keyFacts":["<b>工具規則：</b>尺規作圖只准兩件事——直尺「過兩點畫一條直線」（<b>不能看刻度量長度、不能量角度</b>），圓規「以一點為圓心、另一點定半徑畫圓或弧」，並可保持兩腳張開的距離去<b>搬移等長</b>。","<b>垂直平分線：</b>以線段兩端A、B為圓心、用<b>大於半個AB的同一半徑</b>各畫弧，兩弧交於P、Q，連PQ即得。原理：P、Q到A、B都等於半徑r，而「<b>到兩端點等距</b>」的點全落在垂直平分線上。","<b>角平分線與複製角：</b>都靠<b>SSS全等</b>。角平分線讓OC＝OD、CP＝DP、OP共用邊 → △OCP≅△ODP → 兩半角相等；複製角把底弧半徑與弦長一起搬到新射線，使兩三角形三邊相等，對應角自然相等。","<b>過線外一點P：</b>作<b>垂線</b>——以P畫弧截直線於M、N，再作MN的垂直平分線（P到M、N等距，必在其上）；作<b>平行線</b>——過P畫一條截線並<b>複製一個同位角</b>，靠「同位角相等則兩直線平行」。","<b>正多邊形：</b>以AB為邊作<b>正三角形</b>，就以A、B為圓心、<b>AB為半徑</b>畫弧交於頂點（三邊皆＝AB）；在圓上作<b>正六邊形</b>，因邊長＝外接圓半徑，用半徑當弦沿圓周截6次剛好一圈。注意：一般角的<b>三等分</b>是尺規做不到的。"],"questions":[{"q":"在尺規作圖中，「（無刻度）直尺」唯一合法的用途是什麼？","options":["可以量出線段長度後，畫出指定公分的線段","只能用來畫「過兩個已知點的一條直線」，不能讀刻度量長度","可以當作量角器，量出角度的大小","可以固定一腳、旋轉畫出一個圓"],"answer":1,"why":"尺規作圖裡直尺只借用「兩點決定一直線」的功能。「量出線段長度後畫出指定公分」的說法，把直尺當成有刻度的尺去量長度，這是規則不允許的；「當作量角器量出角度」則是量角，量角也不是直尺能做的事；「固定一腳旋轉畫圓」是圓規的工作，不是直尺。"},{"q":"在尺規作圖中，「圓規」的合法功能是什麼？","options":["可以直接量出半徑是幾公分再畫","可以拿來畫一條筆直的直線","以一點為圓心、另一點定半徑畫圓或弧，並能保持兩腳張開的距離不變，到別處畫出等長的弧","只能畫出完整的整個圓，不能只畫一小段弧"],"answer":2,"why":"圓規負責「等距離」：固定圓心與半徑畫圓或弧，還能保持張開距離搬移等長。「直接量出半徑幾公分再畫」不行，因為圓規不讀刻度、不量長度（量長度違規）；「拿來畫一條筆直的直線」是直尺的事；「只能畫整個圓、不能畫一小段弧」也錯，圓規當然可以只畫一段弧，作圖時常只畫交會附近的小弧而已。"},{"q":"給定線段AB，要作它的垂直平分線，正確步驟是？","options":["分別以A、B為圓心、用大於半個AB的「相同半徑」各畫一弧，取兩弧的兩個交點，把兩交點連成直線","以A為圓心、AB長為半徑畫一個圓，再從A連到圓上任一點","在AB上隨便取一點，過它畫一條直線","先找到AB的中點，再以中點為圓心畫一個圓"],"answer":0,"why":"兩弧的交點到A、到B都等於同一半徑r，兩交點連線就是垂直平分線。「以A為圓心、AB長為半徑畫一個圓再連到圓上一點」只用一個圓心，畫不出兩個對稱交點；「在AB上取一點過它畫直線」既不保證過中點也不保證垂直；「先找中點再以中點為圓心畫圓」的作法還沒作圖就要先知道中點，但找中點正是這題的目的，而且畫圓也定不出垂直方向。半徑要大於半個AB，兩弧才會相交。"},{"q":"接上題：以A、B為圓心、相同半徑r畫弧，兩弧交於P、Q兩點。為什麼「連P、Q」得到的直線就是AB的垂直平分線？","options":["因為P、Q剛好都是AB的中點","因為PQ的長度和AB一定相等","因為兩弧半徑相等，所以 P、Q 會把 AB 三等分","因為P、Q到A、到B的距離都等於r（到兩端點等距），而到線段兩端等距的點都落在垂直平分線上"],"answer":3,"why":"垂直平分線的判定性質就是「到兩端點等距的點所成的線」。P、Q到A、B都等於r，兩點都在垂直平分線上，故連線即是。「P、Q剛好是AB中點」不對：P、Q在AB外，不是中點，中點其實是PQ與AB的交點；「PQ長度和AB一定相等」也沒有這種相等關係；至於「兩弧半徑相等就會把 AB 三等分」則是無中生有——兩弧交點 P、Q 落在 AB 的垂直方向上、和「三等分」毫無關係。"},{"q":"給定∠AOB，要作它的角平分線，正確步驟是？","options":["直接量出∠AOB的度數，再除以2畫出來","以O為圓心畫弧，交兩邊於C、D；再以C、D為圓心、用大於半個CD的相同半徑各畫弧交於P；連OP","取OA的中點與OB的中點，把兩個中點連起來","以O為圓心畫一弧交兩邊於C、D，直接把C、D兩點連起來"],"answer":1,"why":"這樣OC=OD、CP=DP、OP共用，兩三角形全等，故∠COP=∠DOP，OP平分該角。「量出∠AOB度數再除以2」違反「不可量」的規定；「取OA、OB兩邊中點連起來」和角平分沒有關係；「以O畫弧交兩邊於C、D後直接連C、D」連成的是一條弦，並不通過O，不是角平分線。"},{"q":"接上題：作角平分線後得到OC=OD、CP=DP、OP=OP。OP能平分∠AOB，是根據哪一個理由？","options":["根據SAS（兩邊及其夾角對應相等）","根據AA（兩角對應相等）","△OCP與△ODP三邊對應相等（OC=OD、CP=DP、OP共用），依SSS全等，所以∠COP=∠DOP","因為OP有通過P點，通過就一定會平分"],"answer":2,"why":"三組對應邊都相等，正是SSS全等，對應角∠COP=∠DOP。「用SAS」要先知道夾角相等，但那正是還沒證出來的東西；「用AA」是相似的條件、不是全等，也給不出「兩半角相等」；「OP通過P點就一定會平分」則是沒有理由的循環說法。"},{"q":"要在射線A′X上作一個角等於已知∠A：以A為圓心畫弧交∠A兩邊於B、C；以A′為圓心、相同半徑畫弧交A′X於B′；再以B′為圓心、取BC長為半徑畫弧交前一弧於C′；連A′C′。這樣作出的∠A′會等於∠A，是因為△ABC與△A′B′C′？","options":["三邊對應相等（AB=A′B′、AC=A′C′、BC=B′C′），依SSS全等，對應角∠A=∠A′","兩角及其夾邊對應相等，依ASA全等","因為都用同一支圓規畫，角度會自動相同","因為BC剛好是圓的直徑"],"answer":0,"why":"AB=A′B′、AC=A′C′（都用同一半徑r），BC=B′C′（把弦長複製過去），三邊相等就是SSS全等，對應角自然相等。「用ASA」需要先有一組角相等，但角正是我們要複製的未知量；「都用同一支圓規畫，角度就自動相同」只是工具相同，不是幾何理由；「BC剛好是圓的直徑」也不對，BC只是弧上兩點間的弦，不是直徑。"},{"q":"給直線L與L外一點P，要過P作L的垂線，正確原理是？","options":["從P向L隨手畫一條斜線就好","量出P到L的最短距離，再照著距離畫","以L上任取一點為圓心，畫一個通過P的圓","以P為圓心畫弧交L於M、N（PM=PN），再作MN的垂直平分線；因P到M、N等距，P必在MN的垂直平分線上，該線過P又垂直L"],"answer":3,"why":"P到M、N等距，就落在MN的垂直平分線上；MN在L上，其垂直平分線與L垂直，於是得到過P的垂線。「從P向L畫一條斜線」不保證垂直；「量出P到L的最短距離再照著畫」量距離違反規則，也定不出垂直方向；「以L上一點為圓心畫一個通過P的圓」只用單一個圓，給不出垂直的方向。"},{"q":"給直線L與L外一點P，要過P作L的平行線，最正確的作法原理是？","options":["以P為圓心、P到L的距離為半徑畫一段弧","過P向L畫一條截線，並在P處複製一個與「截線和L所夾的角」相等的同位角，依「同位角相等則兩直線平行」得平行線","只要畫一條看起來沒有碰到L的線，就是平行線","作截線PQ的垂直平分線"],"answer":1,"why":"「同位角相等 → 兩直線平行」是平行的判定，複製角就把這個判定實現出來。「以P為圓心、P到L的距離為半徑畫弧」要先量距離（違規），而且等距軌跡在此不會直接給出可作的那條平行線；「畫一條看起來沒有碰到L的線就當平行線」靠眼睛看「沒相交」不能保證真的平行（延長後可能相交）；「作截線PQ的垂直平分線」和平行無關。"},{"q":"以線段AB為一邊，要作一個正三角形（等邊三角形），正確作法是？","options":["以AB的中點為圓心畫一個圓","先作AB的垂直平分線，再在線上隨便取一點當頂點","分別以A、B為圓心、都用AB長為半徑畫弧交於C，連AC、BC","以A為圓心、AB為半徑畫一個圓就完成了"],"answer":2,"why":"兩弧半徑都等於AB，交點C使CA=CB=AB，三邊相等就是正三角形。「以AB中點為圓心畫一個圓」定不出第三個頂點；「先作垂直平分線再在線上取一點當頂點」只保證CA=CB（是等腰），不一定等於AB，通常不是正三角形；「以A為圓心、AB為半徑只畫一個圓」也只有一個圓，仍定不出第三個頂點。"},{"q":"在一個半徑為r的圓上，要作內接正六邊形，最恰當的作法與原理是？","options":["從圓上任一點開始，用「圓的半徑r」當弦長，圓規保持r依序在圓周上截點，繞一圈剛好截出6個等分點；因為正六邊形的邊長等於外接圓半徑","量出整個圓的周長，再除以6標出每段弧長","以圓的直徑當作正六邊形的一邊","邊長必須等於直徑，才畫得出正六邊形"],"answer":0,"why":"正六邊形可切成6個正三角形，所以邊長剛好等於外接圓半徑r，用半徑當弦沿圓周截6次會剛好回到起點。「量出圓周長再除以6標出每段弧長」量弧長違反規則也不好操作；「以圓的直徑當作正六邊形的一邊」不對，直徑等於2r，不是六邊形的邊；「邊長必須等於直徑」的說法也錯，邊長是r而不是直徑2r。"},{"q":"下列哪一項「無法」只用無刻度直尺與圓規作圖完成？","options":["作一條線段的垂直平分線","把一個已知角二等分（作角平分線）","在圓上作內接正六邊形","把任意一個角三等分"],"answer":3,"why":"一般角的三等分是尺規作圖三大不可能問題之一（例如60°就無法只用尺規三等分），做不到。「作線段的垂直平分線」「把角二等分」「作圓的內接正六邊形」都是課本標準的尺規作圖，全都做得到，所以都不是答案；許多人會誤以為「能平分就能三等分」，但這在數學上已被證明行不通。"}]}

  // =====================================================================
  // 星等（3 階，依 correctCount/總題數）
  // =====================================================================
  function starsFor(correct, total) {
    if (total <= 0) return 0;
    var r = correct / total;
    if (r >= 0.9) return 3;
    if (r >= 0.6) return 2;
    if (r > 0) return 1;
    return 0;
  }

    var s = '';
    for (var i = 0; i < 3; i++) s += (i < n ? '⭐' : '☆');
    return s;

    }

    levelList.innerHTML = '';
    for (var u = 0; u < LEVELS.length; u++) {
      (function (lv) {
        var rec = progress[lv.id] || {};
        var done = !!rec.done;
        var total = lv.questions.length;
        var st = done ? starsFor(rec.best || 0, total) : 0;
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'ma-level';
        card.setAttribute('aria-label', '等級 ' + lv.level + '：' + lv.name);
        card.innerHTML =
          '<div class="ma-level-top">' +
            '<span class="ma-level-emoji" aria-hidden="true" style="background:' + lv.color + '22;color:' + lv.color + '">' + lv.emoji + '</span>' +
            '<div>' +
              '<div class="ma-level-num">等級 ' + lv.level + '</div>' +
              '<div class="ma-level-name">' + lv.name + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="ma-level-concepts">' + lv.concepts.join('・') + '</div>' +
          '<div class="ma-level-foot">' +
            '<span class="ma-level-status ' + (done ? 'done' : 'todo') + '">' +
              (done ? '✅ 已完成（最佳 ' + (rec.best || 0) + '/' + total + '）' : '▶️ 開始挑戰（共 ' + total + ' 題）') + '</span>' +
            '<span class="ma-level-stars" aria-hidden="true">' + (done ? starStr(st) : '') + '</span>' +
          '</div>';
        card.addEventListener('click', function () { startLevel(lv); });
        levelList.appendChild(card);
      })(LEVELS[u]);
    }
  }

  // =====================================================================
  // 遊玩流程
  // =====================================================================
  function show(screen) {
    screenMenu.classList.remove('active');
    screenPlay.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0, 0);
  }

  function startLevel(lv) {
    cur = { level: lv, idx: 0, correctCount: 0, phase: 'brief' };
    playTitle.textContent = lv.emoji + ' 等級 ' + lv.level + '・' + lv.name;
    show(screenPlay);
    renderBrief();
  }

  function renderStepDots() {
    stepDots.innerHTML = '';
    if (cur.phase !== 'quiz') return; // 重點卡不畫題目進度點
    for (var i = 0; i < cur.level.questions.length; i++) {
      var b = document.createElement('i');
      if (i < cur.idx) b.className = 'on';
      else if (i === cur.idx) b.className = 'cur';
      stepDots.appendChild(b);
    }
  }

  // ---- 重點卡（worked example / advance organizer；不計分） ----
  function renderBrief() {
    renderStepDots();
    var lv = cur.level;
    var facts = '';
    for (var i = 0; i < lv.keyFacts.length; i++) {
      facts += '<li><span class="ma-kf-dot" aria-hidden="true">◆</span><span>' + lv.keyFacts[i] + '</span></li>';
    }
    stage.innerHTML =
      '<div class="ma-stage ma-brief">' +
        '<div class="ma-visual" aria-hidden="true">' + lv.emoji + '</div>' +
        '<h2>等級 ' + lv.level + '・' + lv.name + '</h2>' +
        '<p class="ma-brief-sub">先看看這一級的重點，再開始 ' + lv.questions.length + ' 題挑戰。</p>' +
        '<ul class="ma-keyfacts">' + facts + '</ul>' +
      '</div>' +
      '<div class="ma-actions">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-start">開始挑戰 ➡️</button>' +
      '</div>';
    $('btn-start').addEventListener('click', function () {
      cur.phase = 'quiz';
      cur.idx = 0;
      renderQuestion();
    });
  }

  function next() {
    cur.idx++;
    if (cur.idx >= cur.level.questions.length) finishLevel();
    else renderQuestion();
  }

  // ---- 單選題（選項 Fisher–Yates 洗牌；每題最多記一次分） ----
  function renderQuestion() {
    renderStepDots();
    var lv = cur.level;
    var step = lv.questions[cur.idx];

    // 打亂選項顯示順序（正解絕不固定在第一個）。data-i 記「原始索引」，
    // 因此對答判斷 i === step.answer 仍然正確、判分不受洗牌影響。
    var order = [];
    for (var oi = 0; oi < step.options.length; oi++) order.push(oi);
    for (var m = order.length - 1; m > 0; m--) {
      var r = Math.floor(Math.random() * (m + 1));
      var tt = order[m]; order[m] = order[r]; order[r] = tt;
    }
    var optsHtml = '';
    for (var k = 0; k < order.length; k++) {
      var origIdx = order[k];
      optsHtml += '<button type="button" class="ma-opt" data-i="' + origIdx + '">' +
        '<span>' + step.options[origIdx] + '</span><span class="ma-opt-mark" aria-hidden="true"></span></button>';
    }

    stage.innerHTML =
      '<div class="ma-stage">' +
        '<div class="ma-visual" aria-hidden="true">' + lv.emoji + '</div>' +
        '<p class="ma-question">第 ' + (cur.idx + 1) + ' / ' + lv.questions.length + ' 題　' + step.q + '</p>' +
        (step.svg ? '<div class="ma-chart" role="img" aria-label="' + (step.svgAlt || '圖表') + '" style="margin:10px auto 14px;max-width:360px">' + step.svg + '</div>' : '') +
        '<div class="ma-options">' + optsHtml + '</div>' +
        '<div class="ma-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="ma-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button>' +
      '</div>';

    var answered = false;
    var btns = stage.querySelectorAll('.ma-opt');

    function revealAndLock(correct) {
      var rev = $('reveal');
      rev.textContent = (correct ? '答對了！' : '再想想～正確答案是這個！') + (step.why || '');
      rev.classList.add('show');
      $('afteract').style.display = 'flex';
      var all = stage.querySelectorAll('.ma-opt');
      for (var a = 0; a < all.length; a++) all[a].disabled = true;
    }

    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var i = parseInt(this.getAttribute('data-i'), 10);
        var isCorrect = (i === step.answer);
        if (answered) return; // 已作答：不再改動計分（守衛）
        answered = true;      // 第一次作答才計分
        if (window.Game && window.Game.recordAnswer) Game.recordAnswer('math', isCorrect);
        if (isCorrect) {
          this.classList.add('correct');
          this.querySelector('.ma-opt-mark').textContent = '✅';
          cur.correctCount++;              // 唯一計分點（純本地）
          revealAndLock(true);
        } else {
          this.classList.add('wrong');
          this.querySelector('.ma-opt-mark').textContent = '❌';
          // 答錯零懲罰：標出正解、允許看解說（不加分、不扣分）。
          var correctBtn = stage.querySelector('.ma-opt[data-i="' + step.answer + '"]');
          if (correctBtn) {
            correctBtn.classList.add('correct');
            correctBtn.querySelector('.ma-opt-mark').textContent = '✅';
          }
          revealAndLock(false);
        }
      });
    }

    $('btn-next').addEventListener('click', next);
  }

  // =====================================================================
  // 完成一級
  // =====================================================================
  function finishLevel() {
    var lv = cur.level;
    var total = lv.questions.length;
    var got = cur.correctCount;

    // 收藏只增不減：best = max(prev, thisRun)。
    var prev = progress[lv.id] || {};
    progress[lv.id] = { done: true, best: Math.max(prev.best || 0, got) };
    saveProg(progress);

    // 解鎖對應等級徽章；若全部等級完成 → 全等級達人。
    awardBadge(lv.id);
    var allDone = true;
    for (var i = 0; i < LEVELS.length; i++) if (!(progress[LEVELS[i].id] && progress[LEVELS[i].id].done)) { allDone = false; break; }
    if (allDone) awardBadge('all');

    var st = starsFor(got, total);
    stage.innerHTML =
      '<div class="ma-stage ma-done">' +
        '<div class="ma-done-emoji" aria-hidden="true">🎉</div>' +
        '<div class="ma-done-title">完成「' + lv.name + '」！</div>' +
        '<div class="ma-done-stars" aria-label="得到 ' + st + ' 顆星">' + starStr(st) + '</div>' +
        '<p class="ma-question" style="font-size:clamp(16px,3.6vw,19px)">你答對了 ' + got + ' / ' + total + ' 題，真棒！</p>' +
      '</div>' +
      '<div class="ma-actions">' +
        '<button type="button" class="btn" id="btn-menu">回到選單</button>' +
        (nextLevelOf(lv) ? '<button type="button" class="btn btn-primary" id="btn-nextlv">下一個等級 ➡️</button>' : '') +
      '</div>';

    toast('完成「' + lv.name + '」！你答對了 ' + got + ' / ' + total + ' 題，真棒！', 'daily');

    $('btn-menu').addEventListener('click', goMenu);
    var nl = nextLevelOf(lv);
    if (nl) $('btn-nextlv').addEventListener('click', function () { startLevel(nl); });
  }

  function nextLevelOf(lv) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (LEVELS[i].id === lv.id) return LEVELS[i + 1] || null;
    }
    return null;
  }

  function goMenu() {
    cur = null;
    stepDots.innerHTML = '';
    renderMenu();
    show(screenMenu);
  }

  // ---- 頁內返回（一律「←」，回選單，非回首頁）----
  $('btn-back').addEventListener('click', goMenu);

  // 暴露給徽章冊模組讀取（唯讀共享同一份進度與定義）。
  window.__mathAdv = {
    LEVELS: LEVELS,
    BADGES: BADGES,
    getProgress: function () { return progress; }
  };

  renderMenu();
})();
</script>

<!-- ===== 進階數學徽章冊：樣式（自足、canon 變數、亮暗雙主題、色盲雙碼、[hidden] 防護；純本地、無 XP、無 Game.award） ===== -->
<style>
/* 入口 FAB（右下固定，避開底部安全區；低於 app-bar 的層級，不遮頂列；≥48px 觸控） */
#mathAdvBadgeFab {
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 55; display: inline-flex; align-items: center; gap: 6px;
  min-height: 48px; min-width: 48px; padding: 10px 16px;
  background: var(--accent, var(--c-math)); color: #fff; border: none;
  border-radius: 999px; font-family: var(--font); font-weight: 800;
  font-size: clamp(14px, 3vw, 16px); cursor: pointer; box-shadow: var(--shadow-lg);
}
#mathAdvBadgeFab:active { transform: scale(0.96); }
#mathAdvBadgeFabCount {
  display: inline-flex; align-items: center; gap: 3px;
  background: #fff; color: var(--accent, var(--c-math));
  border-radius: 999px; padding: 1px 8px; font-size: 13px; font-weight: 800;
}
/* 浮層外殼 */
.ma-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 60; padding: 16px;
}
/* [hidden] 防護：class 的 display:flex(author) 特異度會蓋過 UA 的 [hidden]{display:none}，
   故需更高特異度規則，否則浮層會恆顯、蓋住整頁。 */
#mathAdvBadgeOverlay[hidden] { display: none !important; }
.ma-card {
  position: relative; background: var(--card); border: 2px solid var(--card-border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  padding: 20px 18px 22px; color: var(--ink);
}
.ma-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ma-card-head h1 { font-size: clamp(1.1rem, 4vw, 1.4rem); font-weight: 800; margin: 0; color: var(--ink); flex: 1; }
.ma-card-back {
  background: var(--card); border: 2px solid var(--card-border); color: var(--accent-ink, var(--c-math-ink));
  font-family: var(--font); font-weight: 800; font-size: 15px; cursor: pointer;
  min-height: 44px; padding: 8px 14px; border-radius: 14px;
}
.ma-card-back:active { transform: scale(0.96); }
.ma-card-note {
  background: var(--accent-tint); color: var(--accent-ink); border-radius: var(--r-md, 12px);
  font-size: var(--fs-small); font-weight: 600; line-height: 1.7; padding: 10px 12px; margin: 4px 0 12px;
}
.ma-card-summary { text-align: center; font-size: var(--fs-small); font-weight: 700; color: var(--ink-soft); margin: 4px 0 14px; line-height: 1.7; }
.ma-badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
.ma-badge {
  position: relative; min-height: 96px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border-radius: 14px; background: var(--card); border: 2px solid var(--card-border);
  text-align: center; padding: 10px 6px;
}
.ma-badge .ma-badge-glyph { font-size: clamp(1.6rem, 7vw, 2rem); line-height: 1; }
.ma-badge .ma-badge-name { font-size: clamp(0.6rem, 2.6vw, 0.74rem); font-weight: 800; color: var(--ink); line-height: 1.2; }
.ma-badge .ma-badge-state { font-size: clamp(0.52rem, 2.2vw, 0.64rem); font-weight: 700; color: var(--ink-soft); }
/* 未解鎖：虛線邊 + 去彩 + 半透明（碼一＝形狀 🔒／碼二＝虛線+去彩） */
.ma-badge.locked { border-style: dashed; opacity: 0.5; filter: grayscale(1); }
/* 已解鎖：實線金框 + 右上 ★（碼一＝emoji 形狀／碼二＝金框+★） */
.ma-badge.unlocked { box-shadow: 0 0 0 2px #f5b301, 0 0 10px rgba(245,179,1,0.5); background: color-mix(in srgb, #f5b301 12%, var(--card)); }
.ma-badge.unlocked .ma-badge-star { position: absolute; right: 5px; top: 4px; font-size: 14px; }
</style>
<!-- ===== 進階數學徽章冊：模組（自足 IIFE；讀寫共享獨立 key math_adv_progress_v1；純本地、只增不減、無 XP、無 Game.award、無 streak） ===== -->
<script>
(function () {
  'use strict';

  function api() { return window.__mathAdv || null; }

  function unlockedCount() {
    var a = api(); if (!a) return 0;
    var prog = a.getProgress();
    var n = 0;
    for (var i = 0; i < a.BADGES.length; i++) if (prog.badges[a.BADGES[i].id]) n++;
    return n;
  }

  function renderGrid() {
    var a = api(); if (!a) return;
    var prog = a.getProgress();
    var host = document.getElementById('mathAdvBadgeGrid');
    if (!host) return;
    var html = '';
    for (var i = 0; i < a.BADGES.length; i++) {
      var def = a.BADGES[i];
      var got = !!prog.badges[def.id];
      var cls = 'ma-badge ' + (got ? 'unlocked' : 'locked');
      var glyph = got ? def.icon : '🔒';
      var state = got ? '已收集' : '尚未解鎖';
      var star = got ? '<span class="ma-badge-star" aria-hidden="true">★</span>' : '';
      var label = def.name + '（' + state + '）';
      html += '<div class="' + cls + '" title="' + label + '" aria-label="' + label + '">' +
        '<span class="ma-badge-glyph" aria-hidden="true">' + glyph + '</span>' +
        '<span class="ma-badge-name">' + def.name + '</span>' +
        '<span class="ma-badge-state">' + state + '</span>' + star + '</div>';
    }
    host.innerHTML = html;
  }

  function renderSummary() {
    var a = api(); if (!a) return;
    var el = document.getElementById('mathAdvBadgeSummary');
    if (!el) return;
    el.innerHTML = '已收集 <b>' + unlockedCount() + '</b> / ' + a.BADGES.length +
      ' 枚徽章（收藏只增不減，慢慢玩就好）';
  }

  function updateFabCount() {
    var a = api(); if (!a) return;
    var badge = document.getElementById('mathAdvBadgeFabCount');
    if (badge) badge.textContent = unlockedCount() + '/' + a.BADGES.length;
  }

  function refresh() { updateFabCount(); if (isOpen()) { renderGrid(); renderSummary(); } }
  function isOpen() { var el = document.getElementById('mathAdvBadgeOverlay'); return el && !el.hidden; }
  function openBook() { renderGrid(); renderSummary(); var o = document.getElementById('mathAdvBadgeOverlay'); if (o) o.hidden = false; }
  function closeBook() { var o = document.getElementById('mathAdvBadgeOverlay'); if (o) o.hidden = true; }

  // 附加 DOM（皆 append 於 <body> 尾端，不動既有 section；浮層帶 [hidden]）。
  function buildDom() {
    var host = document.createElement('div');
    host.innerHTML =
      '<button id="mathAdvBadgeFab" type="button" aria-label="打開進階數學徽章冊" onclick="MathAdvBadges.openBook()">' +
        '🏅 徽章冊 <span id="mathAdvBadgeFabCount">0/10</span></button>' +
      '<div id="mathAdvBadgeOverlay" class="ma-overlay" hidden>' +
        '<div class="ma-card" role="dialog" aria-modal="true" aria-label="進階數學徽章冊">' +
          '<div class="ma-card-head"><h1>🏅 進階數學徽章冊</h1>' +
            '<button class="ma-card-back" onclick="MathAdvBadges.closeBook()">← 返回</button></div>' +
          '<div class="ma-card-note">這本徽章冊只存在你自己的裝置上，純粹紀念你完成過哪些進階等級。它不會計入學習基地的等級或經驗值——放輕鬆挑戰就好 🌱</div>' +
          '<div id="mathAdvBadgeSummary" class="ma-card-summary"></div>' +
          '<div id="mathAdvBadgeGrid" class="ma-badge-grid"></div>' +
        '</div></div>';
    while (host.firstChild) document.body.appendChild(host.firstChild);
  }

  window.MathAdvBadges = {
    openBook: openBook,
    closeBook: closeBook,
    refresh: refresh
  };

  function boot() { buildDom(); updateFabCount(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
