<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數理腦・綜合特訓 🧠</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<link rel="stylesheet" href="concept.css">
<script src="game_core.js"></script>
<!--
  數理腦・綜合特訓：把「數論 / 演算法思維 / 向量與變換(線代直覺)」的題目打散、交錯出題，可反覆重來。
  純本地練習模組（data-game-hud="off"、自有 key math_drill_v1、不呼叫 Game.recordAnswer/award），
  不計入主角色 XP／等級（與思考挑戰頁一致），只呼叫 pingActive 續接每日學習連續紀錄。全繁體中文。
  正確性第一；先在觀念頁學過再來特訓（數論觀念/數字魔法師、電腦與網路的演算法、向量與變換）。
-->
<style>
  :root{ --su:#4338ca; --su-d:#3730a3; --su-tint:rgba(67,56,202,0.12); }
  :root[data-theme="dark"]{ --su:#a5b4fc; --su-d:#c7d2fe; --su-tint:rgba(165,180,252,0.16); }
  .md-wrap{ max-width: var(--content-max); margin-inline:auto; }
  .md-screen{ display:none; } .md-screen.active{ display:block; animation: app-fade 0.3s ease; }
  .md-topbar{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s4); }
  .md-title{ font-size:var(--fs-h2); font-weight:800; color:var(--ink); }
  .md-hello{ display:flex; align-items:center; gap:var(--s3); padding:var(--s4); background:var(--su-tint);
    border:1px solid var(--card-border); border-radius:var(--r-lg); margin-bottom:var(--s5); }
  .md-hello .md-mascot{ font-size:44px; flex:none; line-height:1; }
  .md-htext{ font-size:var(--fs-body); font-weight:700; color:var(--ink); }
  .md-hsub{ font-size:var(--fs-small); color:var(--ink); font-weight:600; margin-top:2px; }
  .md-teach{ background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); padding:var(--s5) var(--s4); }
  .md-teach h2{ font-size:var(--fs-h2); font-weight:800; color:var(--su-d); text-align:center; margin:var(--s2) 0 var(--s4); }
  .md-t-emoji{ font-size:46px; text-align:center; }
  .md-block{ margin-bottom:var(--s4); padding:var(--s3) var(--s4); border-radius:var(--r-md); border-left:4px solid var(--su); background:var(--su-tint); }
  .md-block-text{ font-size:var(--fs-body); font-weight:600; color:var(--ink); line-height:1.7; }
  .md-len-grid{ display:flex; flex-direction:column; gap:var(--s3); margin-top:var(--s4); }
  .md-len-unused{ display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left; padding:var(--s4);
    min-height:var(--tap-min); border:2px solid var(--card-border); border-radius:var(--r-md);
    background:var(--card); color:var(--ink); font-family:var(--font); cursor:pointer; }
  .md-len:hover{ border-color:var(--su); }
  .md-len .md-len-emoji{ font-size:26px; flex:none; }
  .md-len .md-len-title{ font-size:var(--fs-body); font-weight:800; }
  .md-len .md-len-sub{ font-size:var(--fs-small); font-weight:600; color:var(--ink-soft); }
  .md-rv-bar{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s3); }
  .md-rv-track{ flex:1; height:8px; border-radius:999px; background:var(--card-border); overflow:hidden; }
  .md-rv-fill{ height:100%; background:var(--su); border-radius:999px; transition:width .25s ease; }
  .md-rv-score{ font-size:var(--fs-small); font-weight:800; color:var(--su-d); flex:none; white-space:nowrap; }
  .md-tag{ display:block; width:fit-content; font-size:var(--fs-small); font-weight:800; color:var(--su-d);
    background:var(--su-tint); border-radius:999px; padding:3px 12px; margin:0 auto var(--s2); }
  .md-q{ font-size:var(--fs-body); font-weight:700; color:var(--ink); line-height:1.6; margin:0 auto var(--s3); max-width:min(100%,42em); text-align:center; }
  .md-opt{ display:block; width:100%; text-align:left; margin-bottom:var(--s2); padding:14px var(--s4);
    min-height:var(--tap-min); border:2px solid var(--card-border); border-radius:var(--r-md);
    background:var(--card); color:var(--ink); font-family:var(--font); font-size:var(--fs-body); font-weight:600; cursor:pointer; }
  .md-opt:hover{ border-color:var(--su); }
  .md-opt.correct{ border-color:var(--c-correct); background:var(--tint-english); }
  .md-opt.wrong{ border-color:var(--c-wrong); background:rgba(255,118,117,0.12); }
  .md-opt.correct::after{ content:' ✓'; font-weight:800; }
  .md-opt.wrong::after{ content:' ✗'; font-weight:800; }
  .md-reveal { max-width: min(100%, 44em); margin-inline: auto;  margin-top:var(--s3); padding:var(--s3) var(--s4); background:var(--su-tint); border-radius:var(--r-md);
    font-size:var(--fs-body); font-weight:700; color:var(--ink); line-height:1.6; display:none; }
  .md-reveal.show{ display:block; }
  .md-actions{ margin-top:var(--s4); display:flex; gap:var(--s3); }
  .md-actions .btn{ flex:1; }
  .md-note{ text-align:center; color:var(--ink-soft); font-size:var(--fs-small); margin-top:var(--s5); font-weight:600; max-width:34em; margin-inline:auto; }
</style>
</head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">數理腦・綜合特訓 🧠</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">
  <section id="screen-menu" class="md-screen active md-wrap">
    <div class="md-topbar"><span class="md-title">數理腦・綜合特訓 🧠</span></div>
    <div class="md-hello"><span class="md-mascot" aria-hidden="true">🧠</span>
      <div><div class="md-htext">把「數論 · 演算法思維 · 向量與變換」的題目打散、交錯出題，一次練到不同腦袋肌肉。</div>
      <div class="md-hsub">每一輪的題目和順序都不一樣，隨時可以重來。答錯不要緊，看完說明再想一次就好。</div></div></div>
    <div id="md-stage-menu"></div>
    <a class="cn-nextup" href="math_advanced.html"><span class="cn-nextup-ic" aria-hidden="true">🚀</span><span>想要更進階嗎？到「進階數學挑戰」繼續 →</span></a>
    <p class="md-note">這是「綜合特訓」練習場，只留在你的裝置上，不影響學習基地的等級或經驗值。還沒學過的觀念，可以先到「數論觀念養成 / 電腦與網路探索 / 向量與變換」學一遍再來特訓。</p>
  </section>
  <section id="screen-play" class="md-screen md-wrap">
    <div class="md-topbar"><button type="button" class="btn btn-icon" id="btn-back" aria-label="回到特訓選單">←</button><span class="md-title" id="play-title">綜合特訓 🧠</span></div>
    <div id="stage"></div>
  </section>
</main>
<script src="math_drill.js"></script>
</body>
</html>
