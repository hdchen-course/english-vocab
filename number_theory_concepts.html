<script>
// ---- 數論專用 SVG 概念圖（文字 currentColor = --ink）----
function dots(cols,rows){ var u=20,pad=8,W=cols*u,H=rows*u,s='<svg viewBox="0 0 '+(W+2*pad)+' '+(H+2*pad)+'" role="img" aria-label="'+cols+'乘'+rows+'點陣">'; for(var r=0;r<rows;r++)for(var c=0;c<cols;c++) s+='<circle cx="'+(pad+c*u+u/2)+'" cy="'+(pad+r*u+u/2)+'" r="7" fill="#6366f1"/>'; return s+'</svg>'; }
function tree12(){ return '<svg viewBox="0 0 300 160" role="img" aria-label="12 的因數樹"><text x="150" y="24" text-anchor="middle" font-size="20" font-weight="800" fill="currentColor">12</text><line x1="145" y1="30" x2="105" y2="54" stroke="#8a8a8a" stroke-width="2"/><line x1="155" y1="30" x2="195" y2="54" stroke="#8a8a8a" stroke-width="2"/><circle cx="100" cy="66" r="15" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="2"/><text x="100" y="71" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor">2</text><text x="200" y="71" text-anchor="middle" font-size="18" font-weight="800" fill="currentColor">6</text><line x1="195" y1="76" x2="160" y2="102" stroke="#8a8a8a" stroke-width="2"/><line x1="205" y1="76" x2="240" y2="102" stroke="#8a8a8a" stroke-width="2"/><circle cx="160" cy="114" r="15" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="2"/><text x="160" y="119" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor">2</text><circle cx="240" cy="114" r="15" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="2"/><text x="240" y="119" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor">3</text><text x="150" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">12 = 2 × 2 × 3</text></svg>'; }
function venn(){ return '<svg viewBox="0 0 300 132" role="img" aria-label="12 和 18 的公因數"><circle cx="120" cy="64" r="54" fill="rgba(99,102,241,0.16)" stroke="#6366f1" stroke-width="2"/><circle cx="180" cy="64" r="54" fill="rgba(245,158,11,0.16)" stroke="#f59e0b" stroke-width="2"/><text x="70" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">12 的因數</text><text x="232" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">18 的因數</text><text x="80" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">4</text><text x="80" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">12</text><text x="150" y="52" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">1  2</text><text x="150" y="72" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">3  6</text><text x="220" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">9</text><text x="220" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">18</text><text x="150" y="126" text-anchor="middle" font-size="12" font-weight="800" fill="currentColor">中間重疊＝公因數：1、2、3、6</text></svg>'; }
function mult(){ var W=300,pad=16,span=W-2*pad,y=46, x=function(v){return pad+(v/24)*span;};
  var s='<svg viewBox="0 0 300 92" role="img" aria-label="4 和 6 的倍數"><line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="#8a8a8a" stroke-width="2"/>';
  [4,8,12,16,20,24].forEach(function(m){ s+='<circle cx="'+x(m)+'" cy="'+(y-8)+'" r="4" fill="#6366f1"/>'; });
  [6,12,18,24].forEach(function(m){ s+='<circle cx="'+x(m)+'" cy="'+(y+8)+'" r="4" fill="#f59e0b"/>'; });
  [12,24].forEach(function(m){ s+='<text x="'+x(m)+'" y="'+(y+28)+'" text-anchor="middle" font-size="11" font-weight="800" fill="currentColor">'+m+'</text>'; });
  s+='<text x="'+pad+'" y="'+(y-16)+'" font-size="11" font-weight="700" fill="currentColor">4 的倍數 ●</text><text x="'+pad+'" y="'+(y+32)+'" font-size="11" font-weight="700" fill="currentColor">6 的倍數 ●</text>';
  return s+'</svg>'; }
// 只畫單一數列倍數（初次介紹「倍數」用，避免出現尚未教到的公倍數標記）
function multSingle(){ var W=300,pad=16,span=W-2*pad,y=46, x=function(v){return pad+(v/24)*span;};
  var s='<svg viewBox="0 0 300 78" role="img" aria-label="4 的倍數"><line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="#8a8a8a" stroke-width="2"/>';
  [4,8,12,16,20,24].forEach(function(m){ s+='<circle cx="'+x(m)+'" cy="'+(y-8)+'" r="4" fill="#6366f1"/>'; s+='<text x="'+x(m)+'" y="'+(y+18)+'" text-anchor="middle" font-size="11" font-weight="800" fill="currentColor">'+m+'</text>'; });
  s+='<text x="'+pad+'" y="'+(y-16)+'" font-size="11" font-weight="700" fill="currentColor">4 的倍數 ●</text>';
  return s+'</svg>'; }

window.CONCEPT = {
  progKey:'number_theory_concepts_v1', practiceHref:'number_theory.html',
  lessons:[
   { id:'fm', name:'因數與倍數', emoji:'🔢', color:'#6366f1', sub:'能整除的數 vs 乘出來的數', done:'記得：因數是「能整除它的數」、倍數是「它乘出來的數」，兩者一體兩面。',
     steps:[
      {type:'teach',kicker:'先想一想',title:'因數：能整除的數',svg:dots(4,3),text:'12 顆點可以排成整齊的 <b>4 × 3</b> 長方形，所以 <b>3 和 4 都能整除 12</b>，是 12 的<b>因數</b>。12 的因數有：1、2、3、4、6、12。'},
      {type:'teach',kicker:'另一面',title:'倍數：乘出來的數',svg:multSingle(),text:'一個數乘以 1、2、3… 得到的就是它的<b>倍數</b>。4 的倍數：4、8、12、16…（藍點）。倍數有<b>無限多個</b>。'},
      {type:'teach',kicker:'關係',title:'因數與倍數是一體兩面',svg:'',text:'如果 <b>3 是 12 的因數</b>，那 <b>12 就是 3 的倍數</b>。一句話：小的整除大的，小的是因數、大的是倍數。'},
      {type:'quiz',kicker:'換你試試',title:'下面哪一個是 12 的因數？',options:['4','5','7','8'],answer:0,why:'12 ÷ 4 = 3 整除，所以 4 是 12 的因數；5、7、8 都無法整除 12。',whyWrong:['','你可能覺得 5 比較小就能整除，但把 12 一直減 5 會剩下 2，除不盡喔。','注意 12÷7 會剩下餘數，7 沒辦法把 12 平分成整組，不算因數。','你可能以為比 12 小的數都是因數，但 8 沒辦法整除 12，還會剩 4。']},
      {type:'quiz',kicker:'換你試試',title:'下面哪一個是 5 的倍數？',options:['20','12','18','22'],answer:0,why:'20 = 5 × 4，是 5 的倍數。',whyWrong:['','5 的倍數個位一定是 0 或 5；12 的個位是 2，不是 0 也不是 5，所以不是 5 的倍數喔。','注意 18 的個位是 8，用 5 一直加不會停在 18，所以它不在 5 的倍數上。','你可能覺得 22 接近 20 就可以，但個位是 2，不是 5 排出來的數。']},
      {type:'quiz',kicker:'想一想',title:'數字 1 是不是「每個數」的因數？',options:['是，1 能整除任何整數','不是，1 太小不能當因數','不是，只有偶數才有 1 當因數','不是，只有質數才有 1 當因數'],answer:0,why:'任何整數都能被 1 整除，所以 1 是每個數的因數。',whyWrong:['','你可能覺得 1 太小不算數，但任何整數都能被 1 平分，1 其實很特別喔。','注意奇數像 3、5 也都能被 1 整除，1 不是只對偶數有效。','你可能把質數想得很特殊，但不管質數還是合數，通通都能被 1 整除。']}
     ]},
   { id:'prime', name:'質數與合數', emoji:'🔎', color:'#0891b2', sub:'只有兩個因數 vs 更多因數', done:'記得：質數只有 1 和自己兩個因數；1 不是質數；最小的質數是 2。',
     steps:[
      {type:'teach',kicker:'先想一想',title:'質數：只能排成一排',svg:dots(7,1),text:'7 顆點<b>只能排成 1 排 7 個</b>（1 × 7），排不成別的長方形。只有 <b>1 和自己</b> 兩個因數的數，叫<b>質數</b>。'},
      {type:'teach',kicker:'對照',title:'合數：能排成長方形',svg:dots(3,2),text:'6 顆點可以排成 <b>2 × 3</b>，因數有 1、2、3、6（比較多）。因數超過兩個的數叫<b>合數</b>。'},
      {type:'teach',kicker:'特別注意',title:'1 很特別；2 是最小質數',svg:'',text:'<b>1 不是質數也不是合數</b>（它只有 1 個因數）。<b>最小的質數是 2</b>，而且 2 是<b>唯一的偶數質數</b>（其他偶數都能被 2 整除）。'},
      {type:'quiz',kicker:'換你試試',title:'下面哪一個是質數？',options:['11','9','15','21'],answer:0,why:'11 只有 1 和 11 兩個因數；9＝3×3、15＝3×5、21＝3×7 都是合數。',whyWrong:['','你可能以為單數就是質數，但 9 可以拆成 3×3，除了 1 和自己還有別的因數。','注意 15 能被 3 和 5 整除，因數不只兩個，就不符合質數的定義。','你可能覺得 21 是單數，但它能被 3 和 7 整除，這樣就不是質數了。']},
      {type:'quiz',kicker:'換你試試',title:'最小的質數是哪一個？',options:['2','1','3','0'],answer:0,why:'2 只有 1 和 2 兩個因數，是最小的質數（1 不算質數）。',whyWrong:['','你可能覺得 1 最小就選它，但質數要「恰好兩個因數」，而 1 只有一個因數喔。','注意 3 確實是質數，但題目問最小，還有一個比它更小的質數。','你可能把 0 當起點，但質數必須大於 1，而 0 不大於 1，所以不是質數。']},
      {type:'quiz',kicker:'想一想',title:'下面哪一個是「合數」（不是質數）？',options:['9','7','11','13'],answer:0,why:'9＝3×3 有因數 1、3、9，是合數；7、11、13 都是質數。',whyWrong:['','你可能以為單數都是合數，但 7 只有 1 和 7 兩個因數，其實是質數喔。','注意 11 除了 1 和自己以外沒有別的因數，這代表它是質數不是合數。','你可能以為單數就是合數，但 13 只有 1 和它自己兩個因數，是質數不是合數喔。']}
     ]},
   { id:'pf', name:'質因數分解', emoji:'🌳', color:'#16a34a', sub:'用因數樹拆成質數相乘', done:'記得：把數一直拆到全是質數，就是質因數分解，而且答案獨一無二。',
     steps:[
      {type:'teach',kicker:'先想一想',title:'因數樹：一直拆到質數',svg:tree12(),text:'把一個數一直拆成兩個因數相乘，直到<b>全部都是質數</b>，就叫<b>質因數分解</b>。12 = 2 × 6，6 再拆成 2 × 3，最後 <b>12 = 2 × 2 × 3</b>（被圈起來的都是質數）。'},
      {type:'teach',kicker:'很特別',title:'每個數的「質數指紋」',svg:'',text:'不管你先從哪裡拆，最後得到的質因數<b>都一樣</b>。這就像每個數獨一無二的<b>質數指紋</b>。'},
      {type:'quiz',kicker:'換你試試',title:'12 的質因數分解是哪一個？',options:['2 × 2 × 3','2 × 6','3 × 4','12 × 1'],answer:0,why:'質因數分解要「全是質數」，只有 2 × 2 × 3 符合；6、4 都不是質數。',whyWrong:['','你可能算對了乘積，但 6 還能再拆成 2×3，質因數分解要拆到全是質數才行。','注意 4 不是質數，它還能分成 2×2，所以這個分解還沒拆完喔。','你可能覺得寫成兩個數相乘就好，但 1 和 12 都不是質數，還沒真正分解。']},
      {type:'quiz',kicker:'換你試試',title:'20 = 2 × 2 × ？',options:['5','4','10','2'],answer:0,why:'2 × 2 × 5 = 20，而且 5 是質數。',whyWrong:['','你可能算成 2×2 再乘一次就好，但 4 不是質數，而且 2×2×4 也不等於 20。','注意 2×2×10 會變成 40 太大了，而且 10 還能再拆，不是質數。','你可能習慣性再乘一個 2，但 2×2×2 只有 8，離 20 還差很多喔。']},
      {type:'quiz',kicker:'想一想',title:'下面哪一個是「全部都是質數」的分解？',options:['2 × 3 × 3','2 × 9','4 × 5','6 × 3'],answer:0,why:'2 × 3 × 3 全是質數（＝18）；9、4、6 都不是質數。',whyWrong:['','你可能只看乘積對不對，但 9 能拆成 3×3 不是質數，這組還沒拆到底。','注意 4 可以再分成 2×2，它不是質數，所以整組不算「全是質數」。','你可能覺得都是整數就好，但 6 能拆成 2×3，含了非質數就不符合喔。']}
     ]},
   { id:'gcd', name:'最大公因數', emoji:'🔗', color:'#e11d48', sub:'兩數共同因數裡最大的', done:'記得：先找共同的因數，最大的那個就是最大公因數（GCD）。約分時很好用！',
     steps:[
      {type:'teach',kicker:'先想一想',title:'公因數：共同的因數',svg:venn(),text:'12 的因數是 1、2、3、4、6、12；18 的因數是 1、2、3、6、9、18。兩邊<b>共同</b>的因數（中間重疊）是 1、2、3、<b>6</b>，叫<b>公因數</b>。'},
      {type:'teach',kicker:'取最大',title:'最大公因數（GCD）',svg:'',text:'公因數裡<b>最大</b>的那一個，就是<b>最大公因數（GCD）</b>。12 和 18 的最大公因數是 <b>6</b>。把分數<b>約分</b>時就是用它！'},
      {type:'quiz',kicker:'換你試試',title:'12 和 18 的最大公因數是多少？',options:['6','3','2','36'],answer:0,why:'共同因數 1、2、3、6 之中，最大的是 6。',whyWrong:['','你可能找到一個公因數就停了，但 3 雖然是共同因數，還有更大的能同時整除兩數。','注意 2 確實能整除 12 和 18，但它不是最大的那一個共同因數喔。','你可能把「公倍數」跟「公因數」搞混了，36 比兩個數還大，是倍數不是因數。']},
      {type:'quiz',kicker:'換你試試',title:'8 和 12 的最大公因數是多少？',options:['4','2','8','24'],answer:0,why:'8 的因數 1、2、4、8；12 的因數 1、2、3、4、6、12；共同最大的是 4。',whyWrong:['','你可能找到一個就選了，但 2 雖是公因數，還有更大的能同時整除 8 和 12。','注意 8 沒辦法整除 12（12÷8 除不盡），所以 8 根本不是它們的公因數。','你可能把最小公倍數當答案了，24 是兩數的倍數，不是它們的因數喔。']}
     ]},
   { id:'lcm', name:'最小公倍數', emoji:'🎯', color:'#f59e0b', sub:'兩數共同倍數裡最小的', done:'記得：先找共同的倍數，最小的那個就是最小公倍數（LCM）。通分時很好用！',
     steps:[
      {type:'teach',kicker:'先想一想',title:'公倍數：共同的倍數',svg:mult(),text:'4 的倍數：4、8、<b>12</b>、16、20、<b>24</b>…；6 的倍數：6、<b>12</b>、18、<b>24</b>…。兩邊<b>共同</b>的倍數（下面標出的）有 12、24…，叫<b>公倍數</b>。'},
      {type:'teach',kicker:'取最小',title:'最小公倍數（LCM）',svg:'',text:'公倍數裡<b>最小</b>的那一個，就是<b>最小公倍數（LCM）</b>。4 和 6 的最小公倍數是 <b>12</b>。分數<b>通分</b>相加減時就是用它！'},
      {type:'quiz',kicker:'換你試試',title:'4 和 6 的最小公倍數是多少？',options:['12','24','2','10'],answer:0,why:'共同倍數 12、24… 之中，最小的是 12。',whyWrong:['','你可能找到一個共同倍數就停，但 24 雖是公倍數，還有更小的能同時是 4 和 6 的倍數。','注意 2 是它們的公因數，不是倍數，而倍數要比原來的數大或相等喔。','你可能把 4＋6 加起來當答案，但 10 既不是 4 的倍數也不是 6 的倍數。']},
      {type:'quiz',kicker:'想一想',title:'3 和 5 的最小公倍數是多少？',options:['15','8','30','5'],answer:0,why:'3 和 5 最小的共同倍數是 15（3×5，因為 3 和 5 除了 1 以外沒有共同的因數）。',whyWrong:['','你可能把 3＋5 加起來當答案，但 8 不是 3 的倍數也不是 5 的倍數喔。','注意 30 確實是共同倍數，但它不是最小的那一個，還有更小的。','你可能只看到它是 5 的倍數，但 5 不能被 3 整除，不算兩數的共同倍數。']}
     ]}
  ]
};
</script>
