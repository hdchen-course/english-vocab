<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理探險 🧲</title>
<!-- 統一遊戲化引擎（canon 載入序）：先載共用設計 token（assets/app.css），
     再載 HUD/toast 樣式（game_core.css），最後同步載入引擎（game_core.js）。
     -------------------------------------------------------------------
     本頁為「物理」，計入 science 科目（理化／生物／地科共用），讓學生升上國中理化、
     高中物理時獎勵不中斷：宣告 data-game-wired="science"，每題只呼叫一次
     Game.recordAnswer('science', 對錯)（answered 鎖定、每題只計一次分）；「不」呼叫
     Game.award / recordSession，本地徽章冊（StampBook）為純本地無 XP，故無 double-count。
     其餘只使用引擎的『唯讀 / UI』API：Game.showToast、Game.localDate、
     Game.getProfile().settings.reduceMotion，以及共用 app-bar 的 [data-theme-toggle]
     （主題切換由引擎自動接線，本頁不自寫主題 JS）。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* =====================================================================
 * physics.html — 本頁樣式（全部建立在 assets/app.css 的設計 token 上，
 * 因此自動亮/暗色主題化、與學習基地視覺一致）。
 * 強調色綁「一科色三件組」：本頁物理採藍色系（沿用 --c-math 藍紫）。
 * =================================================================== */
:root {
  --ph: var(--c-math);
  --ph-tint: var(--tint-math);
  --ph-ink: var(--c-math-ink);
}

body { overflow-x: hidden; }

/* 頁面頂列（返回、標題） */
.ph-topbar {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s4);
}
.ph-topbar .ph-title {
  flex: 1;
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  min-width: 0;
}

/* 螢幕切換 */
.ph-screen { display: none; animation: ph-fade 0.3s ease; }
.ph-screen.active { display: block; }
@keyframes ph-fade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes ph-pop {
  0%   { transform: scale(0.8); }
  60%  { transform: scale(1.08); }
  100% { transform: scale(1); }
}
/* 尊重減動偏好（prefers-reduced-motion 或 profile.settings.reduceMotion→.ph-reduce） */
@media (prefers-reduced-motion: reduce) {
  .ph-screen, .ph-reveal.show { animation: none; }
}
.ph-reduce .ph-screen,
.ph-reduce .ph-reveal.show,
.ph-reduce .ph-opt.is-correct,
.ph-reduce .ph-visual { animation: none !important; }

/* 吉祥物歡迎卡 */
.ph-hello {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s4);
  background: var(--ph-tint);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  margin-bottom: var(--s4);
}
.ph-hello .ph-mascot { font-size: 46px; flex: none; line-height: 1; }
.ph-hello .ph-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.ph-hello .ph-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }
.ph-today {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 6px;
  font-size: var(--fs-small); font-weight: 700;
  color: var(--ph-ink);
}

/* 等級選單 grid */
.ph-levels {
  display: grid;
  gap: var(--s4);
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.ph-level {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  padding: var(--s4);
  text-align: left;
  cursor: pointer;
  border: 2px solid var(--card-border);
  background: var(--card);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  font-family: var(--font);
  color: var(--ink);
}
.ph-level:hover { box-shadow: var(--shadow-lg); border-color: var(--ph); }
.ph-level:active { transform: scale(0.98); }
.ph-level-top { display: flex; align-items: center; gap: var(--s3); }
.ph-level-emoji {
  font-size: 34px;
  width: 56px; height: 56px;
  flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--ph-tint);
  border-radius: 16px;
}
.ph-level-num { font-size: var(--fs-small); font-weight: 700; color: var(--ph-ink); }
.ph-level-name { font-size: var(--fs-body); font-weight: 800; color: var(--ink); line-height: 1.25; }
.ph-level-concept { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }
.ph-level-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: 2px; }
.ph-level-status {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--fs-small); font-weight: 700;
}
.ph-level-status.done { color: var(--ink); }
.ph-level-status.todo { color: var(--ink-soft); }
.ph-level-dots { display: inline-flex; gap: 3px; flex-wrap: wrap; max-width: 55%; justify-content: flex-end; }
.ph-level-dots i {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--card-border); display: inline-block;
}
.ph-level-dots i.on { background: var(--ph); }

/* 進行中：一題一畫面的大卡 */

.ph-visual {
  font-size: clamp(64px, 22vw, 108px);
  line-height: 1.1;
  margin: var(--s2) 0 var(--s3);
  user-select: none;
  display: inline-block;
}
.ph-sentence {
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.45;
  margin: 0 auto var(--s4);
  max-width: 32ch;
}
.ph-toolrow { display: flex; justify-content: center; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s3); }

/* 進度：本等級第幾步 */
.ph-steps {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-bottom: var(--s3); flex-wrap: wrap;
}
.ph-steps i { width: 20px; height: 6px; border-radius: 999px; background: var(--card-border); }
.ph-steps i.on { background: var(--ph); }
.ph-steps i.cur { background: var(--ph); box-shadow: 0 0 0 3px var(--ph-tint); }

/* 選項按鈕（tap 作答；命中區 ≥56px） */


.ph-opt:active { transform: scale(0.98); }
.ph-opt:disabled { cursor: default; }
/* 對錯不只靠色：加 ✅/❌ 圖示 + 左粗邊 + 動效 */
.ph-opt.correct { border-color: var(--c-correct); background: var(--tint-english); color: var(--ink); border-left-width: 8px; }
.ph-opt.wrong { border-color: var(--c-wrong); background: rgba(255,118,117,0.14); color: var(--ink); border-left-width: 8px; }
.ph-opt.is-correct { animation: ph-pop 0.32s ease; }
.ph-opt .ph-opt-mark { margin-left: auto; font-size: 22px; }

/* 揭示區（答對/答錯解說、tap-to-reveal「看更多」） */
.ph-reveal { max-width: min(100%, 44em); margin-inline: auto; 
  margin-top: var(--s4);
  padding: var(--s3) var(--s4);
  background: var(--ph-tint);
  border-radius: var(--r-md);
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.55;
  text-align: left;
  display: none;
}
.ph-reveal.show { display: block; animation: ph-fade 0.3s ease; }
/* 「看更多」長解說的分段小標題與關鍵詞／公式強調（僅視覺節奏，不改內容） */
.ph-reveal .ph-more-h {
  display: block;
  font-weight: 800;
  color: var(--ph-ink);
  margin-top: var(--s3);
  margin-bottom: 2px;
}
.ph-reveal .ph-more-h:first-child { margin-top: 0; }
.ph-reveal b { color: var(--ph-ink); font-weight: 800; }

/* 完成畫面 */
.ph-done { text-align: center; padding: var(--s5) var(--s4); }
.ph-done-emoji { font-size: clamp(64px, 22vw, 100px); }
.ph-done-stars { font-size: 30px; letter-spacing: 3px; margin: var(--s2) 0; line-height: 1.3; }
.ph-done-badge {
  display: inline-flex; align-items: center; gap: 8px;
  margin: var(--s2) auto 0;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--ph-tint);
  color: var(--ph-ink);
  font-weight: 800;
}
.ph-done-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); }

/* 底部行動列 */

.ph-actions .btn { flex: 1; min-width: 140px; }

/* 進度總覽小列（刻意不顯示主科 XP／連續天數） */
.ph-overview {
  display: flex; align-items: center; gap: var(--s3);
  margin-bottom: var(--s4); flex-wrap: wrap;
}
.ph-overview .stat-tile { flex: 1; min-width: 96px; }

.ph-footnote { text-align: center; color: var(--ink-soft); font-size: var(--fs-small); margin-top: var(--s5); font-weight: 600; }

/* ===== 徽章冊：入口 FAB（右下固定，≥48px 觸控） ===== */
.ph-fab {
  position: fixed;
  right: max(16px, env(safe-area-inset-right));
  bottom: max(16px, env(safe-area-inset-bottom));
  z-index: 60;
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 48px;
  padding: 0 18px;
  border: none;
  border-radius: 999px;
  background: var(--ph);
  color: #fff;
  font-family: var(--font);
  font-size: var(--fs-body);
  font-weight: 800;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
}
.ph-fab:active { transform: scale(0.97); }
.ph-fab-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: 999px;
  background: rgba(0,0,0,0.34);
  font-size: var(--fs-small); font-weight: 800;
}

/* ===== 徽章冊：浮層 ===== */
.ph-overlay {
  position: fixed; inset: 0;
  z-index: 90;
  display: flex; align-items: center; justify-content: center;
  padding: var(--s4);
  background: rgba(0,0,0,0.45);
}
/* 浮層鐵則：class .ph-overlay 的 display:flex（author 特異度）會蓋過 UA 的
   [hidden]{display:none}，若不加下面這條更高特異度防護，overlay 會恆顯遮頁
   （沿用 gemMineOverlay 的教訓）。 */
#phBadgeOverlay[hidden] { display: none !important; }

.ph-overlay-card {
  width: min(680px, 96vw);
  max-height: 88vh;
  overflow: auto;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  padding: var(--s4);
}
.ph-overlay-head {
  display: flex; align-items: center; gap: var(--s2);
  margin-bottom: var(--s3);
}
.ph-overlay-head .ph-overlay-title {
  flex: 1;
  font-size: var(--fs-h2); font-weight: 800; color: var(--ink);
}
.ph-badge-grid {
  display: grid; gap: var(--s3);
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
.ph-badge-card {
  padding: var(--s3);
  border: 2px solid var(--card-border);
  border-radius: var(--r-md);
  background: var(--card);
  text-align: center;
}
.ph-badge-card .ph-badge-emoji { font-size: 40px; line-height: 1.1; }
.ph-badge-card .ph-badge-name { font-weight: 800; color: var(--ink); margin-top: 6px; font-size: var(--fs-small); }
.ph-badge-card .ph-badge-date { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; margin-top: 4px; }
/* 已得＝彩色 emoji + 藍框；未得＝◇ 虛線、去彩、半透明（雙碼：形狀＋色相＋文字） */
.ph-badge-card.earned { border-color: var(--ph); background: var(--ph-tint); }
.ph-badge-card.locked { border-style: dashed; opacity: 0.6; }
.ph-badge-card.locked .ph-badge-emoji { filter: grayscale(1); }
.ph-badge-empty {
  text-align: center; color: var(--ink-soft); font-weight: 600;
  padding: var(--s3); line-height: 1.6;
}
</style>
</head>
<body data-game-wired="science" data-game-maturity="advanced">
<!-- ===== 共用頂部應用列（全站一致；貼在 <body> 內第一個元素） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">物理探險 🧲</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

  <!-- ============================= 選單 / 首頁 ============================= -->
  <section id="screen-menu" class="ph-screen active">
    <div class="ph-topbar">
      <span class="ph-title">物理探險 🧲</span>
    </div>

    <a class="cn-nextup cn-nextup--back" href="physics_concepts.html"><span class="cn-nextup-ic" aria-hidden="true">🧠</span><span>還沒學過嗎？先到「物理觀念養成」用圖學會，再回來練習 →</span></a>

    <div class="ph-hello">
      <span class="ph-mascot" aria-hidden="true">🧲</span>
      <div>
        <div class="ph-hello-text" id="hello-text">嗨！我是小物理，一起去發現力、光、聲、熱和電的祕密吧！</div>
        <div class="ph-hello-sub" id="hello-sub">選一個等級，玩一玩、想一想。</div>
        <div class="ph-today" id="hello-today" style="display:none">✨ 今天也來玩物理了，真棒！</div>
      </div>
    </div>

    <div class="ph-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-levels">0/16</span><span class="stat-label">完成等級</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-badges">0/16</span><span class="stat-label">收集徽章</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-stars">0</span><span class="stat-label">收藏星星</span></div>
    </div>

    <div class="ph-levels" id="level-list"><!-- 由 JS 產生 --></div>

    <p class="ph-footnote">物理就在生活裡：推、拉、光、聲、冷熱和電，每一個都是好玩的祕密。🔎</p>
  </section>

  <!-- ============================= 進行中 ============================= -->
  <section id="screen-play" class="ph-screen">
    <div class="ph-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button>
      <span class="ph-title" id="play-title">等級</span>
    </div>
    <div class="ph-steps" id="step-dots" aria-hidden="true"></div>
    <div class="play-column">
      <div id="stage"><!-- 由 JS 產生每一步 --></div>
    </div>
  </section>

</main>

<!-- ===== 徽章冊：FAB + 浮層（浮層以 hidden 屬性切換；已加更高特異度防護） ===== -->
<button type="button" class="ph-fab" id="phBadgeFab" aria-label="打開徽章冊">
  🏅 徽章冊 <span class="ph-fab-count" id="phBadgeCount">0/16</span>
</button>
<div id="phBadgeOverlay" class="ph-overlay" hidden role="dialog" aria-modal="true" aria-label="徽章冊">
  <div class="ph-overlay-card">
    <div class="ph-overlay-head">
      <span class="ph-overlay-title">🏅 我的徽章冊</span>
      <button type="button" class="btn btn-icon" id="phBadgeClose" aria-label="關閉徽章冊">✕</button>
    </div>
    <div class="ph-badge-grid" id="phBadgeGrid"><!-- 由 JS 產生 --></div>
    <div class="ph-badge-empty" id="phBadgeEmpty" style="display:none">還沒有徽章，玩一個等級就會亮起一枚 ✨。</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---- 只用引擎「唯讀 / UI」API：showToast、localDate、reduceMotion。 ----
  // 計分只透過每題一次的 Game.recordAnswer('science', …)（見 <head>）；不呼叫 Game.award / recordSession。
  function toast(msg, kind) {
    try { if (window.Game && Game.showToast) Game.showToast(msg, kind); } catch (e) {}
  }
  function today() {
    try { if (window.Game && Game.localDate) return Game.localDate(); } catch (e) {}
    // 後備：本地 YYYY-MM-DD（不使用 UTC）。
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function reduceMotion() {
    try { return !!(window.Game && Game.getProfile && Game.getProfile().settings && Game.getProfile().settings.reduceMotion); }
    catch (e) { return false; }
  }
  if (reduceMotion()) { try { document.documentElement.classList.add('ph-reduce'); } catch (e) {} }

  // ---- Web Speech TTS（繁中，可選、無網路依賴、失敗即靜默） ----
  function speak(text) { /* 科學頁不朗讀：已移除 TTS（非英文發音頁，機器中文語音難聽又會重疊） */ }

  // ---- 本頁進度（獨立 key，與 player_profile_v1 完全隔離；try/catch 靜默降級） ----
  var PROG_KEY = 'physics_progress_v1';
  function loadProg() {
    try {
      var p = JSON.parse(localStorage.getItem(PROG_KEY)) || {};
      if (!p.levels) p.levels = {};
      if (!p.badges) p.badges = {};
      if (!p.awarded) p.awarded = {};
      return p;
    } catch (e) { return { levels: {}, badges: {}, awarded: {} }; }
  }
  function saveProg(p) {
    try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) { /* 配額滿：靜默降級 */ }
  }
  var progress = loadProg(); // { levels:{[id]:{done,best,correct}}, badges:{[id]:{earnedAt}}, awarded:{} }

  // =====================================================================
  // 課程內容（全繁體中文；物理事實／定義／公式以年齡適當、且正確為準；
  // 電與熱只講「原理／現象／觀察」，絕不出現任何可被模仿的危險操作步驟）。
  // 每個等級：step0 = worked-example 型 fact 卡（先於練習），其後皆為 choose 題。
  // =====================================================================
  var LEVELS = [
    {
      id: 'l1', emoji: '🧲', name: '等級1・生活中的推、拉與現象',
      concept: '力、重力、摩擦、磁鐵、光與聲',
      badge: { icon: '🧲', label: '力的偵探' },
      fact: { v: '🧲', s: '力就是「推」或「拉」。力可以讓東西開始動、停下來，或改變方向。',
        more: '生活裡到處都是力：推門、拉抽屜、球往下掉（重力）、磁鐵吸迴紋針，都是力在作用。摩擦力還會讓東西變熱喔！' },
      questions: [
        { v: '🚪', q: '用手把門推開，這個動作對門施加了什麼？', options: ['力', '熱', '光'], ans: 0,
          why: '推和拉都是「力」，力可以讓物體開始動、停下或改變方向。' },
        { v: '⬆️', q: '把球往上丟，球最後會怎樣？', options: ['掉回地面', '一直往上飛走', '停在半空中'], ans: 0,
          why: '地球的重力會把物體往下拉，所以球最後會掉回地面。' },
        { v: '📦', q: '在粗糙的地面推箱子比在光滑地面費力，這是因為？', options: ['摩擦力較大', '箱子突然變重', '地面沒有空氣'], ans: 0,
          why: '兩個表面接觸滑動會產生摩擦力，粗糙表面摩擦力較大，所以較費力。' },
        { v: '🧲', q: '磁鐵可以吸住下面哪一樣東西？', options: ['鐵製迴紋針', '塑膠尺', '木頭筷子'], ans: 0,

    {"id":"l15","emoji":"🍳","name":"生活中的物理・廚房與居家","concept":"用物理的眼睛，看穿廚房與居家裡的每個小祕密。","badge":{"icon":"🍳","label":"居家物理達人"},"fact":{"v":"🏠","s":"廚房和居家裡藏著滿滿的物理——熱的傳導、對流、輻射、壓力、電和槓桿，天天都在你身邊發生。","more":"這一關用生活小場景帶你看穿現象背後的原理：為什麼鍋把不燙、冷氣要裝高、壓力鍋煮得快、濕手不能碰電……學會用物理的眼睛看家裡，科學其實一點都不遙遠！"},"questions":[{"v":"🍳","q":"炒菜用的金屬鍋，鍋把卻常包一層塑膠或木頭，這樣拿才不燙手。背後的物理原理是什麼？","options":["塑膠和木頭比金屬更會散熱，所以摸起來涼涼的","塑膠和木頭是熱的不良導體，能減緩熱從鍋身傳到手上","塑膠和木頭會把熱吸光，讓鍋子整個不會變熱"],"ans":1,"why":"金屬是熱的良導體，塑膠、木頭是不良導體（絕緣體），能阻擋熱以「傳導」方式傳到手，所以不燙。它們並不會「吸光」熱，也不是比金屬更會散熱。"},{"v":"🍵","q":"保溫瓶的瓶身做成雙層，中間抽成真空，保溫效果特別好。真空層主要擋住了哪種熱的傳遞方式？","options":["只擋住輻射，傳導完全不受影響","讓熱量憑空消失，所以完全不會散熱","傳導與對流——沒有介質，熱幾乎傳不過去"],"ans":2,"why":"熱的傳導和對流都需要「介質」（物質）才能進行，真空裡幾乎沒有物質，所以傳導與對流都被切斷；瓶內壁再做成亮面反射輻射。熱不會憑空消失。"},{"v":"❄️","q":"冷氣機通常裝在牆壁高處，而不是靠近地板。為什麼裝高處反而能讓整個房間都變涼？","options":["冷空氣密度大會往下沉，由高處往下形成對流，讓全室循環變涼","冷空氣比較輕會往上飄，所以要裝高處才接得到它","高處離太陽比較近，冷氣在那裡比較容易發揮效果"],"ans":0,"why":"同體積的冷空氣較重（密度大）會下沉，暖空氣則上升，形成對流循環。冷氣裝高處，冷空氣往下沉、暖空氣被吸上去，整室才涼得均勻。冷空氣不會上飄，也與離太陽遠近無關。"},{"v":"🔥","q":"電暖器或暖氣多半放在地面附近。從對流的角度看，為什麼放低處比放高處更暖和？","options":["熱空氣比較重會沉在地板，所以要放低處才追得到","暖空氣密度小會上升，放低處能讓熱空氣往上帶動全室對流","放低處只是因為離插座比較近，和空氣流動無關"],"ans":1,"why":"暖空氣受熱膨脹、密度變小而上升，冷空氣下沉補位，形成對流。暖氣放低處，熱空氣自然往上循環，全室才會暖起來。熱空氣並不會下沉。"},{"v":"📡","q":"微波爐能快速加熱食物，尤其是含水多的食物特別快。它讓食物變熱的原理是什麼？","options":["微波像瓦斯火一樣，從食物外面把它燒熱","微波先把爐內空氣加熱，再靠熱空氣把食物烤熟","微波讓食物裡的水分子隨微波不停快速轉向、擾動而生熱"],"ans":2,"why":"微波是一種電磁波，會使食物中的水分子劇烈振動（轉動），分子互相摩擦、碰撞而生熱，所以含水多的食物熱得特別快。它不是靠火焰，也不是先加熱空氣。"},{"v":"♨️","q":"用壓力鍋燉肉比普通鍋快很多。壓力鍋加快烹煮的物理原理是什麼？","options":["密封使鍋內壓力升高，水的沸點跟著升到超過 100°C，溫度更高就煮得更快","壓力鍋能讓水的沸點降低，所以水比較快滾開","壓力鍋把食物壓扁，增加受熱面積才變快"],"ans":0,"why":"液體的沸點會隨壓力增大而升高。壓力鍋密封後，蒸氣使內部壓力上升，水要到 100°C 以上才沸騰，鍋內溫度更高，食物就熟得更快。沸點是「升高」而不是降低。"},{"v":"⚡","q":"電磁爐的爐面本身不太熱，卻能把鍋子燒得滾燙。它讓鍋子發熱的原理是什麼？","options":["爐面先燒到很燙，再用傳導把熱傳給鍋子","靠電磁感應在鍋底產生感應電流（渦電流），電流通過鍋底的電阻而發熱","靠紅外線輻射直接穿過鍋子把裡面的食物照熟"],"ans":1,"why":"電磁爐內線圈通有變化的電流，產生變化的磁場，依電磁感應在導磁的鍋底感應出「渦電流」，電流通過有電阻的鍋底而生熱。所以爐面本身不必先變燙；也因此電磁爐要用鐵磁性（可被磁鐵吸）的鍋具。"},{"v":"💡","q":"同樣拿來照明，傳統白熾燈泡摸起來很燙、又比 LED 耗電。從能量轉換的角度看，原因是什麼？","options":["白熾燈把電能「全部」變成光，只是那些光本身比較熱","LED 不耗電，是因為它根本不需要用到電流","白熾燈靠鎢絲通電到高溫才發光，大部分電能變成熱散失；LED 把較多電能直接轉成光"],"ans":2,"why":"白熾燈是把鎢絲通電加熱到高溫才發光，大部分電能以熱（和看不見的輻射）散失，效率低；LED 靠半導體直接把電能轉成光，發熱少、比較省電。LED 仍需要通電，只是轉換效率高很多。"},{"v":"⚠️","q":"大人常提醒：不可以用濕手去碰插座或插拔電器。從導電的角度看，濕手為什麼特別危險？","options":["日常的水含有雜質離子會導電，潮濕使電阻變小，電流更容易通過人體","純水是最強的導體，一沾到水電流就絕對通不過去","水會把電完全擋住，所以濕手其實比乾手更安全"],"ans":0,"why":"生活中的水（自來水、汗水）含有礦物質等雜質離子，能導電；手潮濕時電阻變小，一旦碰到帶電處，電流更容易流過身體而觸電。純水導電性其實很差，但日常幾乎沒有純水，所以千萬別用濕手碰電。"},{"v":"🍶","q":"用開瓶器（撬瓶蓋那種）輕輕一撬，瓶蓋就開了。它其實是一種「省力槓桿」，原理是什麼？","options":["抗力臂比施力臂長，所以反而要用更大的力才撬得開","施力臂比抗力臂長，用較小的力就能產生較大的作用，所以省力","它是靠磁力把瓶蓋吸起來，和槓桿一點關係都沒有"],"ans":1,"why":"開瓶器以瓶緣為支點，你的手離支點遠（施力臂長），瓶蓋離支點近（抗力臂短）。由槓桿原理，施力臂比抗力臂長時，就能用較小的力撬開瓶蓋，屬於「省力槓桿」。"},{"v":"🚪","q":"門把幾乎都裝在離門軸（轉軸）最遠的那一側，而不是靠近門軸。這樣設計為什麼比較好開？","options":["離轉軸越遠其實越費力，設計者只是為了好看","門把裝哪裡和開門省不省力完全無關","施力點離轉軸越遠，力臂越長，同樣的力就能產生更大的力矩（轉動效果）"],"ans":2,"why":"開門是繞著門軸的轉動，轉動效果（力矩）= 力 × 力臂。門把離轉軸越遠，力臂越長，同樣大小的力就能產生更大的力矩，更容易把門推開，這也是槓桿與力臂的生活應用。"}]},
    {"id":"l16","emoji":"🚴","name":"生活中的物理・運動與交通","concept":"鞋底、剎車、安全帶、旋球、齒輪——拆解馬路與運動場上的力學祕密","badge":{"icon":"🚲","label":"運動物理達人"},"fact":{"v":"🚦","s":"從鞋底紋路到安全氣囊，馬路與運動場上處處是物理——摩擦力、慣性、向心力和重心都在默默保護你。","more":"這一關把課本裡的力學搬到生活現場：為什麼下雨路滑、急剎車會前傾、球會在空中轉彎、腳踏車換檔能省力。看懂背後的原理，你會發現物理其實很「接地氣」，也更懂得怎麼保護自己。"},"questions":[{"v":"👟","q":"登山鞋、球鞋的鞋底常做出深深的紋路，主要是為了什麼？","options":["紋路讓鞋底和地面的接觸面積變大，面積越大摩擦力就一定越大","紋路能排開水與碎屑、增加抓地（摩擦）力，讓鞋子比較不會打滑","紋路只是為了好看，對防滑其實沒有什麼幫助"],"ans":1,"why":"鞋底紋路能把水和小碎屑排開，讓鞋底直接咬住地面、維持足夠的摩擦力，尤其在潮濕地面更明顯。至於「接觸面積越大摩擦力一定越大」是常見迷思：理想情況下摩擦力主要看材質和正向力，並不是單純由面積決定。"},{"v":"🌧️","q":"下雨天走在磁磚或大理石地面上特別容易滑倒，背後的原因是？","options":["雨水增加了地面的摩擦力，反而把人往前推倒","下雨時重力變小，人站不穩才會滑倒","雨水在鞋底和地面之間形成一層水膜，減少了兩者的摩擦力"],"ans":2,"why":"水填進鞋底和地面之間形成薄薄的水膜，讓兩者不能好好接觸，摩擦力大幅下降，人就容易滑倒。重力並不會因為下雨而改變，摩擦力也不會憑空「把人往前推」。"},{"v":"🛑","q":"腳踏車或汽車踩剎車時，是靠什麼讓車子慢下來、停住？","options":["剎車皮夾住輪子或碟盤，用摩擦力把車子的動能轉換成熱，車就慢下來","剎車時輪子被磁鐵吸住不動，所以停下來","剎車其實是切斷空氣供應，車子失去動力就自然停了"],"ans":0,"why":"剎車靠的是摩擦：剎車皮緊夾輪圈或碟盤，把車子原本的動能（運動能量）轉成熱能散掉，速度就降下來。這也是為什麼長下坡一直剎車，剎車片會發燙。"},{"v":"🚗","q":"汽車緊急剎車時，為什麼坐在車上的人身體會往前衝？（安全帶就是為了拉住你）","options":["剎車時產生了一股向前的力，把人往前推出去","因為慣性，身體本來和車一起前進，車突然變慢，身體仍想維持原本的前進運動","剎車讓車內的重力方向改變，把人往前拉"],"ans":1,"why":"這是慣性：運動中的身體會傾向維持原本的速度和方向。車子被剎車減速，人卻還想「繼續往前」，所以感覺被往前甩。安全帶的作用就是提供向後的力，安全地拉住你。"},{"v":"💺","q":"汽車座椅上方的「頭枕」，在車子被後方追撞時能發揮什麼保護作用？","options":["頭枕純粹是讓頭靠著睡覺比較舒服，沒有安全功能","被追撞時頭枕會自動彈開，順勢把頭往前推","支撐頭部，避免頭部因慣性突然後仰，造成頸部的「揮鞭式」傷害"],"ans":2,"why":"被後車追撞時，座椅推著身體向前，但頭部因慣性來不及跟上而猛然後仰，頸部像鞭子一樣被甩動（揮鞭式頸部傷害）。頭枕頂住後腦，讓頭和身體一起前進，減少頸椎受傷。"},{"v":"🎈","q":"安全氣囊、機車安全帽的泡棉、運動護具，它們保護人的共同原理是什麼？","options":["延長碰撞時受力的時間，讓衝擊力變小，藉此減輕傷害","縮短碰撞的時間，讓衝擊力也跟著一起變大","讓人完全不受到任何力，達到「零衝擊」"],"ans":0,"why":"撞擊時要改變的動量是固定的，但把「受力的時間」拉長，平均作用力就會變小（衝量＝力×時間）。氣囊、泡棉、護具都是靠變形來延長這段時間，把猛烈的一擊化成較溫和的推。它們能減輕傷害，但沒辦法讓人完全不受力。"},{"v":"⚙️","q":"腳踏車遇到上坡時，切換到「省力檔」會比較好踩，背後的原理是什麼？","options":["省力檔讓你憑空多出力氣，所以爬坡才變輕鬆","用省力檔時，踏板要多轉幾圈輪子才前進一點，是用「多費一點距離」換「比較省力」","省力檔會減少車子受到的重力，所以整台車變輕了"],"ans":1,"why":"變速就是在調整齒輪比。省力檔踩起來輕，但踏板要轉很多圈車子才前進一小段——省了力卻費了距離。這正是機械原理的核心：力氣不會憑空多出來，總功不變，只是在「力」和「距離」之間做交換。"},{"v":"🚌","q":"坐公車轉彎時，為什麼會覺得身體被「甩」向外側？","options":["轉彎時有一股真實的「離心力」從外面把你往外推","轉彎時是輪胎的摩擦力主動把乘客往外側推","轉彎（改變方向）需要向心力，乘客因慣性想繼續直線前進，才感覺被甩向外"],"ans":2,"why":"車子轉彎是不斷改變運動方向，需要指向圓心的向心力。乘客因慣性想「維持直線前進」，相對於轉彎的車就好像被推向外側。所謂「離心力」其實是慣性造成的錯覺，並不是真的有股力從外面把你推出去。"},{"v":"⚾","q":"把球斜斜地往上丟出去（先不管空氣阻力），球在空中飛行的路徑會是什麼形狀？","options":["拋物線，因為水平方向近似等速前進、垂直方向受重力做等加速，兩者合成","一個完美的正圓形","先直線斜著上升到最高點，再垂直往下掉"],"ans":0,"why":"拋體運動可以拆成兩個方向：水平方向不受力（近似等速），垂直方向只受重力（等加速上升再下降）。兩者合起來就畫出一條對稱的拋物線，而不是圓形，也不是先上再直直落下。"},{"v":"🌀","q":"足球的「香蕉球」、桌球的旋球，能在空中轉彎，主要是因為什麼？","options":["球旋轉時重量會變輕，所以比較容易被風吹偏","球高速旋轉帶動兩側空氣流速不同，形成壓力差，產生使球偏向的側向力","旋轉的球會產生磁力，吸著它轉彎"],"ans":1,"why":"這是馬格努斯效應：旋轉的球會帶動表面空氣，使球兩側的空氣流速不一樣，快的一側壓力較小、慢的一側壓力較大，壓力差就推著球往一邊偏，形成漂亮的弧線。這和重量變輕或磁力都無關。"},{"v":"🐣","q":"不倒翁不管你怎麼推，都會自己搖回來站好，這是為什麼？","options":["它裡面裝了彈簧，被推倒後靠彈簧把它彈回來","它的重心很高，所以站得特別穩、推不倒","它底部重、重心很低，一傾斜重心就被抬高，放手後重力會把它轉回最穩的位置"],"ans":2,"why":"不倒翁底部加重、重心很低。傾斜時重心會被抬高，這是不穩定、能量較高的狀態；一放手，重力就把它拉回重心最低、最穩定的位置，所以總是搖回來站好。重心低才穩，重心高反而容易倒。"},{"v":"🎪","q":"特技演員走鋼索時，常拿一根又長又重、兩端還微微下垂的長桿，長桿如何幫助平衡？","options":["長桿兩端下垂能降低整體重心，又增大轉動慣量，讓身體不容易快速傾倒、比較好調整","長桿很重，可以把人牢牢壓在鋼索上，就不會掉下來","長桿會產生一股向上的力，抵消掉人的重力"],"ans":0,"why":"兩端下垂的長桿把重量分散到低處，降低了人與桿整體的重心，比較穩定；同時長桿加大了「轉動慣量」，讓身體傾倒（轉動）變得緩慢，演員就有更多時間微調、把重心拉回鋼索正上方。長桿不會產生向上的力，也不是靠重量壓住人。"}]}

  // =====================================================================
  // DOM 參照
  // =====================================================================
  var $ = function (id) { return document.getElementById(id); };
  var screenMenu = $('screen-menu');
  var screenPlay = $('screen-play');
  var levelList = $('level-list');
  var stage = $('stage');
  var stepDots = $('step-dots');
  var playTitle = $('play-title');

  var cur = null; // { level, idx, correctCount }

  // 計分題數（所有 choose 題；fact 卡不計分）＝ questions.length。
  function scoringCount(level) { return level.questions.length; }

  // 一個等級的總步數（fact 卡 + 題數）。
  function stepCount(level) { return 1 + level.questions.length; }

  // =====================================================================
  // 選單渲染
  // =====================================================================
  function badgeCount() { return Object.keys(progress.badges || {}).length; }

  function totalStars() {
    var t = 0;
    for (var i = 0; i < LEVELS.length; i++) {
      var lp = progress.levels[LEVELS[i].id];
      if (lp && lp.best) t += lp.best;
    }
    return t;
  }

  function renderMenu() {
    var doneCount = 0;
    for (var i = 0; i < LEVELS.length; i++) {
      var lp = progress.levels[LEVELS[i].id];
      if (lp && lp.done) doneCount++;
    }
    var LN = LEVELS.length;
    $('ov-levels').textContent = doneCount + '/' + LN;
    $('ov-badges').textContent = badgeCount() + '/' + LN;
    $('ov-stars').textContent = totalStars();
    $('phBadgeCount').textContent = badgeCount() + '/' + LN;

    // 回訪歡迎語（無 dark pattern；只鼓勵、不催促）。
    if (doneCount > 0) {
      $('hello-text').textContent = '歡迎回來！你已經完成 ' + doneCount + ' 個等級，好棒！';
      $('hello-sub').textContent = doneCount >= LN ? '所有等級都完成了，你是物理小偵探！🧲' : '繼續探索沒玩過的等級吧！';
    }
    // 溫和的「今日已練」標記（非 streak 懲罰）。
    if (progress.lastPlayed === today()) $('hello-today').style.display = 'inline-flex';

    levelList.innerHTML = '';
    for (var u = 0; u < LEVELS.length; u++) {
      (function (level, num) {
        var lp = progress.levels[level.id] || {};
        var done = !!lp.done;
        var stars = lp.best || 0;
        var total = scoringCount(level);
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'ph-level';
        card.setAttribute('aria-label', level.name);
        var dots = '';
        for (var d = 0; d < total; d++) dots += '<i class="' + (d < stars ? 'on' : '') + '"></i>';
        card.innerHTML =
          '<div class="ph-level-top">' +
            '<span class="ph-level-emoji" aria-hidden="true">' + level.emoji + '</span>' +
            '<div>' +
              '<div class="ph-level-num">' + level.badge.icon + ' ' + level.badge.label + '</div>' +
              '<div class="ph-level-name">' + level.name + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="ph-level-concept">' + level.concept + '</div>' +
          '<div class="ph-level-foot">' +
            '<span class="ph-level-status ' + (done ? 'done' : 'todo') + '">' +
              (done ? '✅ 已完成' : '▶️ 開始挑戰（共 ' + total + ' 題）') + '</span>' +
            '<span class="ph-level-dots" aria-hidden="true">' + dots + '</span>' +
          '</div>';
        card.addEventListener('click', function () { startLevel(level); });
        levelList.appendChild(card);
      })(LEVELS[u], u + 1);
    }
  }

  // =====================================================================
  // 遊玩流程
  // =====================================================================
  function show(screen) {
    screenMenu.classList.remove('active');
    screenPlay.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0, 0);
  }

  function startLevel(level) {
    cur = { level: level, idx: 0, correctCount: 0 };
    playTitle.textContent = level.emoji + ' ' + level.name;
    show(screenPlay);
    renderStep();
  }

  function renderStepDots() {
    stepDots.innerHTML = '';
    var n = stepCount(cur.level);
    for (var i = 0; i < n; i++) {
      var b = document.createElement('i');
      if (i < cur.idx) b.className = 'on';
      else if (i === cur.idx) b.className = 'cur';
      stepDots.appendChild(b);
    }
  }

  function next() {
    cur.idx++;
    if (cur.idx >= stepCount(cur.level)) finishLevel();
    else renderStep();
  }

  function ttsButton(text) { return ''; }  /* 科學頁不需朗讀鈕（移除 🔊 TTS） */
  function bindTts(root) {
    var btns = root.querySelectorAll('.ph-tts');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () { speak(this.getAttribute('data-tts')); });
    }
  }

  function renderStep() {
    renderStepDots();
    if (cur.idx === 0) return renderFact(cur.level.fact);
    return renderChoose(cur.level.questions[cur.idx - 1]);
  }

  // ---- fact（worked-example，先於練習） ----
  function renderFact(fact) {
    stage.innerHTML =
      '<div class="ph-stage">' +
        '<div class="ph-visual" aria-hidden="true">' + fact.v + '</div>' +
        '<p class="ph-sentence">' + fact.s + '</p>' +
        '<div class="ph-toolrow">' + ttsButton(fact.s) +
          '<button type="button" class="btn" id="btn-more">💡 看更多</button></div>' +
        '<div class="ph-reveal" id="reveal">' + (fact.more || '') + '</div>' +
      '</div>' +
      '<div class="ph-actions">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">開始挑戰 ➡️</button>' +
      '</div>';
    bindTts(stage);
    $('btn-more').addEventListener('click', function () {
      $('reveal').classList.add('show');
      speak(fact.more || fact.s);
    });
    $('btn-next').addEventListener('click', next);
  }

  // ---- choose（單選題；選項 Fisher–Yates 洗牌，正解絕不固定第一個） ----
  function renderChoose(step) {
    // 洗牌顯示順序；data-i 記「原始索引」，判斷 i === step.ans 仍正確。
    var order = [];
    for (var oi = 0; oi < step.options.length; oi++) order.push(oi);
    for (var m = order.length - 1; m > 0; m--) {
      var r = Math.floor(Math.random() * (m + 1));
      var tt = order[m]; order[m] = order[r]; order[r] = tt;
    }
    var optsHtml = '';
    for (var k = 0; k < order.length; k++) {
      var origIdx = order[k];
      optsHtml += '<button type="button" class="ph-opt" data-i="' + origIdx + '">' +
        '<span>' + step.options[origIdx] + '</span><span class="ph-opt-mark" aria-hidden="true"></span></button>';
    }
    stage.innerHTML =
      '<div class="ph-stage">' +
        '<div class="ph-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="ph-sentence">' + step.q + '</p>' +
        '<div class="ph-toolrow">' + ttsButton(step.q) + '</div>' +
        '<div class="ph-options">' + optsHtml + '</div>' +
        '<div class="ph-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="ph-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button>' +
      '</div>';
    bindTts(stage);

    var answered = false; // 單次記帳守衛：第一次作答才計入 correctCount。
    var btns = stage.querySelectorAll('.ph-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var i = parseInt(this.getAttribute('data-i'), 10);
        var isCorrect = (i === step.ans);
        if (answered) {
          // 重複點擊的防護（選項作答後已停用，正常不會再觸發）：只給視覺提示，不改動任何計數。
          if (isCorrect) {
            this.classList.add('correct');
            this.querySelector('.ph-opt-mark').textContent = '✅';
          } else {
            this.classList.add('wrong');
            this.querySelector('.ph-opt-mark').textContent = '❌';
          }
          return;
        }
        answered = true;
        if (window.Game && window.Game.recordAnswer) Game.recordAnswer('science', isCorrect);
        if (isCorrect) {
          this.classList.add('correct', 'is-correct');
          this.querySelector('.ph-opt-mark').textContent = '✅';
          cur.correctCount++; // 每題只計一次（第一次作答）
          revealAndAdvance(step, true);
        } else {
          this.classList.add('wrong');
          this.querySelector('.ph-opt-mark').textContent = '❌';
          // 標出正解（用原始索引找到正解按鈕，選項已洗牌）。
          var correctBtn = stage.querySelector('.ph-opt[data-i="' + step.ans + '"]');
          if (correctBtn) {
            correctBtn.classList.add('correct');
            correctBtn.querySelector('.ph-opt-mark').textContent = '✅';
          }
          revealAndAdvance(step, false);
        }
      });
    }

    function revealAndAdvance(step, correct) {
      var rev = $('reveal');
      rev.textContent = (correct ? '答對了！' : '再想想～答案是這個！') + (step.why || '');
      rev.classList.add('show');
      $('afteract').style.display = 'flex';
      var all = stage.querySelectorAll('.ph-opt');
      for (var k = 0; k < all.length; k++) all[k].disabled = true;
    }

    $('btn-next').addEventListener('click', next);
  }

  // =====================================================================
  // 完成等級（本地 StampBook：只增不減；點亮概念徽章；發本地 toast）
  // =====================================================================
  function finishLevel() {
    var level = cur.level;
    var stars = cur.correctCount;
    var total = scoringCount(level);

    // 進度：保留最佳星等（只增不減）。
    var prev = progress.levels[level.id] || {};
    progress.levels[level.id] = {
      done: true,
      best: Math.max(prev.best || 0, stars),
      correct: Math.max(prev.correct || 0, stars)
    };
    progress.lastPlayed = today();

    // 概念徽章：只增不減、第一次到手才發 toast。
    var newlyBadged = false;
    if (!progress.badges[level.id]) {
      progress.badges[level.id] = { earnedAt: today() };
      newlyBadged = true;
    }

    // 跨級成就（awarded 守衛，避免重複發 toast）。
    var bc = badgeCount();
    var achievements = [];
    if (bc >= 1 && !progress.awarded.first_badge) { progress.awarded.first_badge = true; achievements.push('🏅 挖到第一枚徽章，太棒了！'); }
    if (bc >= Math.ceil(LEVELS.length / 2) && !progress.awarded.half_badges) { progress.awarded.half_badges = true; achievements.push('✨ 徽章已收集一半，繼續加油！'); }
    if (bc >= LEVELS.length && !progress.awarded.all_badges) { progress.awarded.all_badges = true; achievements.push('🏆 徽章全部到手，你是物理小偵探！'); }

    saveProg(progress);

    var starStr = '';
    for (var i = 0; i < total; i++) starStr += (i < stars ? '⭐' : '☆');

    stage.innerHTML =
      '<div class="ph-stage ph-done">' +
        '<div class="ph-done-emoji" aria-hidden="true">🎉</div>' +
        '<div class="ph-done-title">完成「' + level.name + '」！</div>' +
        '<div class="ph-done-stars" aria-label="得到 ' + stars + ' 顆星">' + starStr + '</div>' +
        '<p class="ph-sentence" style="font-size:clamp(16px,3.6vw,19px)">你答對了 ' + stars + ' / ' + total + ' 題，好棒！</p>' +
        '<div class="ph-done-badge" aria-label="點亮徽章">' + level.badge.icon + ' 點亮徽章：' + level.badge.label + '</div>' +
      '</div>' +
      '<div class="ph-actions">' +
        '<button type="button" class="btn" id="btn-menu">回到選單</button>' +
        (nextLevelOf(level) ? '<button type="button" class="btn btn-primary" id="btn-nextlevel">下一個等級 ➡️</button>' : '') +
      '</div>';

    // 本地 toast（不觸碰主 XP）。
    if (newlyBadged) toast('🏅 點亮徽章：' + level.badge.label + '！', 'badge');
    for (var a = 0; a < achievements.length; a++) toast(achievements[a], 'badge');

    $('btn-menu').addEventListener('click', goMenu);
    var nl = nextLevelOf(level);
    if (nl) $('btn-nextlevel').addEventListener('click', function () { startLevel(nl); });
  }

  function nextLevelOf(level) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (LEVELS[i].id === level.id) return LEVELS[i + 1] || null;
    }
    return null;
  }

  function goMenu() {
    cur = null;
    renderMenu();
    show(screenMenu);
  }

  // =====================================================================
  // 徽章冊浮層（overlay 以 hidden 屬性切換；已加更高特異度 [hidden] 防護）
  // =====================================================================
  var overlay = $('phBadgeOverlay');

  function renderBadgeBook() {
    var grid = $('phBadgeGrid');
    var empty = $('phBadgeEmpty');
    grid.innerHTML = '';
    var count = badgeCount();
    empty.style.display = count === 0 ? 'block' : 'none';
    for (var i = 0; i < LEVELS.length; i++) {
      var lv = LEVELS[i];
      var got = progress.badges[lv.id];
      var card = document.createElement('div');
      card.className = 'ph-badge-card ' + (got ? 'earned' : 'locked');
      card.innerHTML =
        '<div class="ph-badge-emoji" aria-hidden="true">' + (got ? lv.badge.icon : '◇') + '</div>' +
        '<div class="ph-badge-name">' + lv.badge.label + '</div>' +
        '<div class="ph-badge-date">' + (got ? '得到：' + got.earnedAt : '尚未點亮') + '</div>';
      grid.appendChild(card);
    }
  }
  function openBadgeBook() { renderBadgeBook(); overlay.hidden = false; }
  function closeBadgeBook() { overlay.hidden = true; }

  $('phBadgeFab').addEventListener('click', openBadgeBook);
  $('phBadgeClose').addEventListener('click', closeBadgeBook);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeBadgeBook(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden) closeBadgeBook(); });

  // 頁內返回（主題切換交由共用 app-bar 的 [data-theme-toggle]，引擎自動接線）。
  $('btn-back').addEventListener('click', goMenu);

  // =====================================================================
  // 啟動
  // =====================================================================
  renderMenu();
})();
</script>
</body>
</html>
