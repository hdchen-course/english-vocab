    // ===== QUIZ MODE =====
    // 近義字群組：同群的字互為合理翻譯、但中文字面不共用成分者（如 dad=爸爸 也是 father=父親），
    // 不可在同一題互當誘答，避免出現第二個也成立的正解。
    const SYNONYM_GROUPS = [
        ["dad", "father"],
        ["mom", "mother"],
    ];
    // 釋義成分交集：把中文切成語意成分（以 / 、 ， ; ／ 分隔），任一成分重疊即視為近義。
    // 例：mad「瘋狂的/生氣的」與 angry「生氣的」共用「生氣的」→ 互斥，不可互當誘答。
    const meaningParts = (ch) => String(ch || '').replace(/[（(][^）)]*[）)]/g, '').split(/[\/、，,;；／]/).map(s => s.trim()).filter(Boolean);
    const shareMeaning = (a, b) => { const B = new Set(meaningParts(b)); return meaningParts(a).some(p => B.has(p)); };
    // 測驗當題的正解字串（供 checkQuiz 標出正解用；隨雙向題方向而不同）
    let quizCorrectText = '';
    function renderQuiz() {
        const word = allWords[currentWordIndex];
        // 雙向交錯：偶數題「看字選義」(word→meaning)，奇數題「看義選字」(meaning→word)，
        // 與 cefr／coca／toeic／vocabulary_app 一致，讓兩種提取方向都被練到。
        const wordToMeaning = (currentWordIndex % 2 === 0);
        const allEntries = Object.values(wordDatabase[currentGrade]).flat();
        let questionHtml, options;

        if (wordToMeaning) {
            // 看英文字→選中文義：誘答為其他中文釋義，以釋義字串去重（一義一選項）；
            // 並排除與正解「近義」的字之釋義（如 dad↔father、mom↔mother，父親也是 dad 的合理翻譯），
            // 避免第二個也能成立的正解。以來源字迭代（而非直接取釋義）才能套用同義群組守衛。
            quizCorrectText = word.chinese;
            options = [word.chinese];
            const usedMeanings = new Set([word.chinese]);
            const synGroup = SYNONYM_GROUPS.find(g => g.includes(word.word));
            const isNear = (w) => (synGroup && synGroup.includes(w.word)) || shareMeaning(w.chinese, word.chinese);
            const addFrom = (pool) => {
                for (const w of pool) {
                    if (options.length >= 4) break;
                    if (usedMeanings.has(w.chinese)) continue;            // 釋義字串去重
                    if (isNear(w)) continue;                              // 近義字/釋義成分重疊者不當誘答
                    options.push(w.chinese);
                    usedMeanings.add(w.chinese);
                }
            };
            addFrom(shuffleArray(allWords.filter(w => w.word !== word.word)));            // 先同主題
            if (options.length < 4) addFrom(shuffleArray(allEntries.filter(w => w.word !== word.word))); // 再全年級補足
            questionHtml =
                `<p class="quiz-question">What does this word mean? 這個字是什麼意思？</p>
                <div class="quiz-word">${word.word} <button class="fc-audio fc-audio--sm" aria-label="播放發音 Play sound" onclick="speakWord('${word.word.replace(/'/g, "\\'")}')">&#128264;</button></div>`;
        } else {
            // 看中文義→選英文字：誘答為其他英文單字，但以【釋義去重】——凡與正解同義
            //（同一 chinese）的字一律排除，避免出現第二個也能成立的正解（同義多解）。
            quizCorrectText = word.word;
            options = [word.word];
            const usedMeanings = new Set([word.chinese]); // 已占用的釋義（含正解）
            const synGroup = SYNONYM_GROUPS.find(g => g.includes(word.word));
            const isNear = (w) => (synGroup && synGroup.includes(w.word)) || shareMeaning(w.chinese, word.chinese);
            const addFrom = (pool) => {
                for (const w of pool) {
                    if (options.length >= 4) break;
                    if (options.includes(w.word)) continue;   // 不重複英文字
                    if (usedMeanings.has(w.chinese)) continue; // 釋義字串去重
                    if (isNear(w)) continue;                   // 近義字/釋義成分重疊者不當誘答（如 mad↔angry）
                    options.push(w.word);
                    usedMeanings.add(w.chinese);
                }
            };
            addFrom(shuffleArray(allWords.filter(w => w.word !== word.word))); // 先同主題
            if (options.length < 4) addFrom(shuffleArray(allEntries.filter(w => w.word !== word.word)));         // 再全年級補足
            questionHtml =
                `<p class="quiz-question">Which word means this? 這個意思是哪個英文字？</p>
                <div class="quiz-word">${word.chinese}</div>`;
        }
        options = shuffleArray(options);

        const card = document.getElementById('card-area');
        card.innerHTML = `
            <span class="word-counter">${currentWordIndex + 1} / ${allWords.length}</span>
            <div class="quiz-container">
                ${questionHtml}
                <div class="quiz-options">
                    ${options.map(opt => `
                        <div class="quiz-option" role="button" tabindex="0" onclick="checkQuiz(this, ${opt === quizCorrectText})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();checkQuiz(this, ${opt === quizCorrectText});}">${opt}</div>
                    `).join('')}
                </div>
                <div class="feedback-msg" id="quiz-feedback" aria-live="polite"></div>
                <div class="fc-reveal" id="quiz-reveal" aria-live="polite"></div>
                <div class="nav-buttons">
                    <button class="nav-btn secondary" onclick="nextWord()">跳過 Skip &#8594;</button>
                </div>
            </div>
        `;
    }

    function checkQuiz(el, correct) {
        if (document.querySelector('.quiz-option.correct,.quiz-option.wrong')) return;
        const feedback = document.getElementById('quiz-feedback');
        const word = allWords[currentWordIndex];
        if (correct) {
            el.classList.add('correct');
            score += 10; streak++;
            learnedWords.add(word.word);
            if (window.Game) Game.recordAnswer('english', true);
            if (window.Album) Album.onWord(word, true);
            if (feedback) { feedback.textContent = '✓ 答對了，太棒了！'; feedback.className = 'feedback-msg correct'; }
            updateProgress(); celebrate();
            setTimeout(nextWord, 1200);
        } else {
            el.classList.add('wrong'); updateProgress();
            if (window.Game) Game.recordAnswer('english', false);
            if (window.Album) Album.onWord(word, false);
            document.querySelectorAll('.quiz-option').forEach(o => {
                if (o.textContent === quizCorrectText) o.classList.add('correct');
            });
            if (feedback) { feedback.textContent = ''; feedback.className = 'feedback-msg'; }
            // 答錯：揭示正解＋例句＋自控「繼續」（取代原本 2 秒自動跳題），兒童友善無懲罰文案。
            showReveal('quiz-reveal', word, false, '差一點點！看一下正確答案，再看一次就記住囉！');
        }
    }

    // 共用揭示面板：填入正解/中文/例句/鼓勵語＋「繼續」鈕，由使用者自控推進。
    function showReveal(id, word, ok, msg) {
        const rv = document.getElementById(id);
        if (!rv) return;
        rv.className = 'fc-reveal show ' + (ok ? 'is-ok' : 'is-no');
        rv.innerHTML =
            '<span class="fc-reveal__word">' + word.word +
            ' <button class="fc-audio fc-audio--sm" aria-label="播放發音 Play sound" onclick="speakWord(\'' + word.word.replace(/'/g, "\\'") + '\')">&#128264;</button></span>' +
            '<span class="fc-reveal__zh">' + word.chinese + '</span>' +
            '<span class="fc-reveal__sent">' + word.sentence + '</span>' +
            '<span class="fc-reveal__msg">' + msg + '</span>' +
            '<button class="fc-reveal__next" onclick="nextWord()">繼續 Next &#8594;</button>';
        const nb = rv.querySelector('.fc-reveal__next');
        if (nb) setTimeout(() => nb.focus(), 50);
    }

    // ===== SPELLING MODE（字母磚點選為預設 / 鍵盤打字可切換）=====
    function getSpellMode() {
        try { return localStorage.getItem('practice_spell_mode') === 'keyboard' ? 'keyboard' : 'tiles'; }
        catch (e) { return 'tiles'; }
    }
    function toggleSpellMode() {
        var m = getSpellMode() === 'tiles' ? 'keyboard' : 'tiles';
        try { localStorage.setItem('practice_spell_mode', m); } catch (e) {}
        renderSpelling();
    }

    function renderSpelling() {
        const word = allWords[currentWordIndex];
        const mode = getSpellMode();
        const chars = word.word.split('');
        // 首字母（及長字末字母）預填為提示；片語空白處以占位磚顯示，不需拼。
        const letterIdx = [];
        chars.forEach((ch, i) => { if (ch !== ' ') letterIdx.push(i); });
        const hintPos = {};
        if (letterIdx.length) hintPos[letterIdx[0]] = true;
        if (letterIdx.length > 5) hintPos[letterIdx[letterIdx.length - 1]] = true;

        let slotsHtml = '';
        chars.forEach((ch, i) => {
            if (ch === ' ') { slotsHtml += '<span class="fc-spell__gap"></span>'; return; }
            const isHint = !!hintPos[i];
            const target = ch.toLowerCase();
            if (mode === 'keyboard') {
                slotsHtml += '<span class="fc-spell__tile fc-spell__slot' + (isHint ? ' hint filled' : '') + '" data-target="' + target + '">'
                    + '<input type="text" maxlength="1" inputmode="latin" autocapitalize="none" autocomplete="off" spellcheck="false"'
                    + ' value="' + (isHint ? ch : '') + '" ' + (isHint ? 'readonly' : '')
                    + ' oninput="handleSpellInput(this)" onkeydown="handleSpellKey(event, this)"></span>';
            } else {
                slotsHtml += '<span class="fc-spell__tile fc-spell__slot' + (isHint ? ' hint filled' : '') + '" data-target="' + target + '"'
                    + (isHint ? (' data-filled="' + target + '"') : '')
                    + ' role="button" tabindex="0"'
                    + (isHint ? '' : ' onclick="spellClearSlot(this)" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();spellClearSlot(this);}"')
                    + '>' + (isHint ? ch : '') + '</span>';
            }
        });

        let bankHtml = '';
        if (mode === 'tiles') {
            const bankLetters = [];
            chars.forEach((ch, i) => { if (ch !== ' ' && !hintPos[i]) bankLetters.push(ch); });
            bankHtml = shuffleArray(bankLetters).map((ch, k) =>
                '<button type="button" class="fc-spell__tile" data-letter="' + ch.toLowerCase() + '" data-tid="' + k + '" onclick="spellPlaceTile(this)">' + ch + '</button>'
            ).join('');
        }

        const toggleLabel = mode === 'tiles' ? '⌨️ 改用鍵盤' : '🔤 改用字母磚';
        const hintText = mode === 'tiles' ? '點字母磚，把單字拼出來' : '聽發音，用鍵盤把單字拼出來';
        const card = document.getElementById('card-area');
        card.innerHTML = `
            <span class="word-counter">${currentWordIndex + 1} / ${allWords.length}</span>
            <div class="spelling-container">
                <div class="fc-spell">
                    <button class="fc-spell__toggle" type="button" onclick="toggleSpellMode()">${toggleLabel}</button>
                    <div class="fc-spell__head">
                        <div class="spelling-hint">${word.chinese}</div>
                        <button class="fc-audio fc-audio--lg" aria-label="播放發音 Play sound" onclick="speakWord('${word.word.replace(/'/g, "\\'")}')">&#128264;</button>
                        <p style="color:var(--ink-soft);margin:0;font-size:var(--fs-small);font-weight:600;">${hintText} Spell the word:</p>
                    </div>
                    <div class="fc-spell__slots" id="spell-slots">${slotsHtml}</div>
                    ${mode === 'tiles' ? `<div class="fc-spell__bank" id="spell-bank">${bankHtml}</div>` : ''}
                </div>
                <div class="feedback-msg" id="spell-feedback" aria-live="polite"></div>
                <div class="nav-buttons">
                    <button class="nav-btn secondary" onclick="revealSpelling()">看答案 Show Answer</button>
                    <button class="nav-btn primary" onclick="checkSpelling()">檢查 Check &#10003;</button>
                    <button class="nav-btn secondary" onclick="nextWord()">跳過 Skip &#8594;</button>
                </div>
            </div>
        `;
        if (mode === 'keyboard') {
            setTimeout(() => { const f = document.querySelector('#spell-slots input:not([readonly])'); if (f) f.focus(); }, 100);
        }
    }

    // 字母磚：點磚→填入下一個空槽並淡出；點已填的槽→退回該磚（等同退格，無需鍵盤）。
    function spellPlaceTile(tile) {
        if (tile.classList.contains('used')) return;
        const slots = document.querySelectorAll('#spell-slots .fc-spell__slot');
        let target = null;
        for (const s of slots) {
            if (s.classList.contains('hint')) continue;
            if (!s.dataset.filled) { target = s; break; }
        }
        if (!target) return;
        target.dataset.filled = tile.dataset.letter;
        target.dataset.tid = tile.dataset.tid;
        target.textContent = tile.textContent;
        target.classList.add('filled');
        target.classList.remove('ok', 'no');
        tile.classList.add('used');
        // 全部填滿→自動檢查（拼字途中保持中性色，避免半途一片紅）
        let remaining = false;
        slots.forEach(s => { if (!s.classList.contains('hint') && !s.dataset.filled) remaining = true; });
        if (!remaining) checkSpelling();
    }
    function spellClearSlot(slot) {
        if (slot.classList.contains('hint') || !slot.dataset.filled) return;
        const tid = slot.dataset.tid;
        const tile = document.querySelector('#spell-bank .fc-spell__tile[data-tid="' + tid + '"]');
        if (tile) tile.classList.remove('used');
        delete slot.dataset.filled;
        delete slot.dataset.tid;
        slot.textContent = '';
        slot.classList.remove('filled', 'ok', 'no');
    }

    function handleSpellInput(input) {
        if (input.value.length === 1) {
            const inputs = Array.from(document.querySelectorAll('#spell-slots input'));
            const idx = inputs.indexOf(input);
            for (let i = idx + 1; i < inputs.length; i++) { if (!inputs[i].readOnly) { inputs[i].focus(); break; } }
        }
    }
    function handleSpellKey(e, input) {
        if (e.key === 'Backspace' && !input.value) {
            const inputs = Array.from(document.querySelectorAll('#spell-slots input'));
            const idx = inputs.indexOf(input);
            for (let i = idx - 1; i >= 0; i--) { if (!inputs[i].readOnly) { inputs[i].focus(); break; } }
        }
        if (e.key === 'Enter') checkSpelling();
    }

    function checkSpelling() {
        const slots = document.querySelectorAll('#spell-slots .fc-spell__slot');
        const feedback = document.getElementById('spell-feedback');
        const word = allWords[currentWordIndex];
        let allCorrect = true;
        let firstWrong = null;
        slots.forEach(s => {
            const input = s.querySelector('input');
            const val = (input ? input.value : (s.dataset.filled || '')).toLowerCase();
            const target = (s.dataset.target || '').toLowerCase();
            if (val && val === target) {
                s.classList.add('ok'); s.classList.remove('no');
            } else {
                s.classList.add('no'); s.classList.remove('ok'); allCorrect = false;
                if (!firstWrong) firstWrong = s;
            }
        });
        if (allCorrect) {
            score += 15; streak++;
            learnedWords.add(word.word);
            if (window.Game) Game.recordAnswer('english', true);
            if (window.Album) Album.onWord(word, true);
            if (feedback) { feedback.textContent = '✓ 全部拼對了，太厲害了！'; feedback.className = 'feedback-msg correct'; }
            updateProgress(); celebrate();
            setTimeout(nextWord, 1200);
        } else {
            updateProgress();
            if (window.Game) Game.recordAnswer('english', false);
            if (window.Album) Album.onWord(word, false);
            if (feedback) { feedback.textContent = '綠色的字母是對的！修正紅色的再檢查一次，你很接近了！'; feedback.className = 'feedback-msg wrong'; }
            // 自控修正：不自動跳題；游標/焦點移到第一個錯處（鍵盤模式）。
            const inp = firstWrong && firstWrong.querySelector('input');
            if (inp) { inp.focus(); inp.select(); }
        }
    }

    function revealSpelling() {
        document.querySelectorAll('#spell-slots .fc-spell__slot').forEach(s => {
            const t = s.dataset.target || '';
            const input = s.querySelector('input');
            if (input) { input.value = t; }
            else { s.dataset.filled = t; s.textContent = t; s.classList.add('filled'); }
            s.classList.add('ok'); s.classList.remove('no');
        });
    }

    // ===== MATCHING MODE =====
    let matchState = { selected: null, matched: [], words: [] };

    function renderMatching() {
        // 選字時避開「釋義成分重疊」的字(如 mad/angry 都含『生氣的』),否則孩子的合理語意配對會被判錯
        const mParts = (ch) => String(ch || '').replace(/[（(][^）)]*[）)]/g, '').split(/[\/、，,;；／]/).map(s => s.trim()).filter(Boolean);
        const shareM = (a, b) => { const B = new Set(mParts(b)); return mParts(a).some(p => B.has(p)); };
        // 同義群組守衛（重用 quiz 模式既有的 SYNONYM_GROUPS）：同群的字（如 dad/father、
        // mom/mother）中文字面不重疊、shareM 抓不到，需明列群組排除，否則孩子把 dad 連到
        // 「父親」這類合理配對會被判錯，與 quiz 模式不一致。
        const inSameSyn = (a, b) => SYNONYM_GROUPS.some(g => g.includes(a) && g.includes(b));
        const words = [];
        for (const w of shuffleArray([...allWords])) {
            if (words.some(x => shareM(x.chinese, w.chinese) || inSameSyn(x.word, w.word))) continue;
            words.push(w);
            if (words.length >= Math.min(5, allWords.length)) break;
        }
        matchState = { selected: null, matched: [], words };
        const shuffledMeanings = shuffleArray(words.map((w, i) => ({ chinese: w.chinese, index: i })));

        const card = document.getElementById('card-area');
        card.innerHTML = `
            <div class="matching-container">
                <p style="text-align:center;color:var(--ink-soft);margin-bottom:var(--s4);font-size:var(--fs-body);font-weight:600;">把英文單字和中文意思連起來！Match the word with its meaning!</p>
                <div class="matching-grid">
                    <div class="matching-column">
                        <h3>Words</h3>
                        ${words.map((w, i) => `<div class="match-item word-item" role="button" tabindex="0" data-type="word" data-index="${i}" onclick="handleMatch(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();handleMatch(this);}">${w.word}</div>`).join('')}
                    </div>
                    <div class="matching-column">
                        <h3>中文</h3>
                        ${shuffledMeanings.map(m => `<div class="match-item" role="button" tabindex="0" data-type="meaning" data-index="${m.index}" onclick="handleMatch(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();handleMatch(this);}">${m.chinese}</div>`).join('')}
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn primary" onclick="renderMatching()">換一組 New Set</button>
                </div>
            </div>
        `;
    }

    function handleMatch(el) {
        if (el.classList.contains('matched')) return;
        const type = el.dataset.type;
        const index = parseInt(el.dataset.index);

        if (!matchState.selected) {
            matchState.selected = { el, type, index };
            el.classList.add('selected');
        } else {
            if (matchState.selected.type === type) {
                matchState.selected.el.classList.remove('selected');
                matchState.selected = { el, type, index };
                el.classList.add('selected');
            } else {
                if (matchState.selected.index === index) {
                    el.classList.add('matched');
                    matchState.selected.el.classList.add('matched');
                    matchState.selected.el.classList.remove('selected');
                    matchState.matched.push(index);
                    score += 5; streak++;
                    if (window.Game) Game.recordAnswer('english', true);
                    if (window.Album) Album.onWord(matchState.words[index], true);
                    if (matchState.matched.length === matchState.words.length) celebrate();
                } else {
                    el.classList.add('wrong-match');
                    matchState.selected.el.classList.add('wrong-match');
                    matchState.selected.el.classList.remove('selected');
                    if (window.Game) Game.recordAnswer('english', false);
                    setTimeout(() => document.querySelectorAll('.wrong-match').forEach(e => e.classList.remove('wrong-match')), 500);
                }
                matchState.selected = null;
                updateProgress();
            }
        }
    }

    // ===== UTILITIES =====
    function speakWord(word) {
        // 優先播本地童音 mp3(與 cefr/coca/toeic 一致);找不到才退回瀏覽器語音。
        // 本頁 grade 對應 competition 單字組:middle→competition_mid、upper→competition_upper。
        var setkey = ({ middle: 'competition_mid', upper: 'competition_upper' })[(typeof currentGrade !== 'undefined' ? currentGrade : 'middle')] || 'competition_mid';
        var src = 'audio/word_' + setkey + '_' + String(word).replace(/ /g, '_').replace(/\//g, '_') + '.mp3';
        var done = false;
        var fb = function () { if (done) return; done = true; ttsSpeakWord(word); };
        try {
            var a = new Audio(src);
            a.addEventListener('error', fb, { once: true });
            a.play().then(function () { done = true; }).catch(fb);
        } catch (e) { fb(); }
    }

    function ttsSpeakWord(word) {
        if ('speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance(word);
            u.rate = 0.75; u.pitch = 1;
            // 指定英語發音，避免在中文系統上用中文語音唸英文單字
            u.lang = 'en-US';
            const enVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
            if (enVoice) u.voice = enVoice;
            speechSynthesis.speak(u);
        }
    }

    function nextWord() { currentWordIndex = (currentWordIndex + 1) % allWords.length; render(); }
    function prevWord() { currentWordIndex = (currentWordIndex - 1 + allWords.length) % allWords.length; render(); }

    function markLearned() {
        learnedWords.add(allWords[currentWordIndex].word);
        if (window.Album) Album.onWord(allWords[currentWordIndex], true);
        score += 5; updateProgress(); celebrate();
        setTimeout(nextWord, 600);
    }

    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function celebrate() {
        const container = document.getElementById('celebration');
        container.innerHTML = '';
        // 慶祝彩帶刻意用多彩硬碼（彩帶本就是多色紙屑）：純裝飾、不編碼狀態、reduced-motion 下不播放；不套「狀態色禁彩虹」規則。
        const colors = ['#FF6347', '#FFD700', '#32CD32', '#4169E1', '#FF69B4', '#9370DB'];
        for (let i = 0; i < 25; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + '%';
            c.style.top = '-10px';
            c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            c.style.animationDelay = Math.random() * 0.4 + 's';
            c.style.width = (5 + Math.random() * 8) + 'px';
            c.style.height = (5 + Math.random() * 8) + 'px';
            container.appendChild(c);
        }
        setTimeout(() => container.innerHTML = '', 2500);
    }

    // ===== 單字相簿複習橋接（重用既有 quiz 流程；只重新賦值既有 let 綁定） =====
    // 由 Album.startReview()/startFocus() 呼叫：把 word 物件陣列（可跨 grade/category）灌進既有出題流程，
    // 強制 quiz 模式——quiz 誘答項來自 allWords + wordDatabase[currentGrade]，不依賴 category 畫布，跨級安全。
    window.startAlbumReview = function (queue) {
        if (!queue || !queue.length) return;
        allWords = queue;
        currentWordIndex = 0;
        currentMode = 'quiz';
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === 'quiz');
        });
        render();
    };

    // Start
    init();
    </script>

}
.album-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
.album-card:active { transform: scale(0.96); }
.album-card .ab-glyph { font-size: 22px; line-height: 1.1; }
.album-card .ab-word { font-size: var(--fs-small); font-weight: 800; overflow-wrap: anywhere; text-align: center; }
.album-card .ab-cn { font-size: 12px; font-weight: 700; color: var(--ink-soft); text-align: center; overflow-wrap: anywhere; }

.album-card .ab-due { color: var(--c-english-ink); font-size: 12px; }
.album-card.box0 { opacity: 0.6; }
/* 盒級進度：以單一 --accent 的透明度階層呈現（可主題化、無彩虹硬碼）；
   熟練度另有 glyph(☆/⭐/🌟)＋文字階名雙碼，顏色非唯一通道。 */
.album-card.box1 { border-color: color-mix(in srgb, var(--accent) 25%, var(--card-border)); }
.album-card.box2 { border-color: color-mix(in srgb, var(--accent) 45%, var(--card-border)); }
.album-card.box3 { border-color: color-mix(in srgb, var(--accent) 65%, var(--card-border)); }
.album-card.box4 { border-color: color-mix(in srgb, var(--accent) 85%, var(--card-border)); box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 27%, transparent); }

<!-- ===== 單字相簿（Word Explorer Album）：獨立自足模組。獨立 localStorage key、純本地里程碑徽章、
     答錯不退階、收藏只增不減。讀主程式資料用「同一種裸名詞法綁定」（wordDatabase/currentGrade/…），
     不寫 vocab_srs / vocab_stats / player_profile_v1；本頁不宣告 data-game-wired；不呼叫 Game.award。 ===== -->
<script>
(function () {
  'use strict';
  var KEY = 'word_explorer_album_v1';
  var INTERVAL = { 1: 1, 2: 2, 3: 4, 4: 7, 5: 15 };
  var REVIEW_TARGET = 15, REVIEW_CAP = 20;
  var GRADES = ['middle', 'upper'];
  var GRADE_LABEL = { middle: '基礎', upper: '進階' };

  var data = null;
  var wordIndex = null; // id -> { word物件, grade, category }

  // 共用「間隔重複」排程核心：綁定本頁自持 key（巢狀格式，與既有 data 相容）。
  // 排程（scheduleBox 可退盒、驅動 dueDate）與收藏視覺（peakBox/lit 只增不減）脫鉤。
  var store = (typeof SRS !== 'undefined' && SRS.createStore) ? SRS.createStore(KEY, { flat: false }) : null;
  // 視覺收藏盒（只增不減）：優先 peakBox，缺欄位時退回舊 box。
  function visBox(c) { if (!c) return 0; return (c.peakBox != null) ? c.peakBox : (c.box || 0); }

  function wordIdOf(grade, category, word) { return grade + '::' + category + '::' + word; }
  function today() {
    try { if (window.Game && window.Game.localDate) return window.Game.localDate(); } catch (e) {}
    return new Date().toISOString().slice(0, 10);
  }
  function addDays(dateStr, n) {
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    try { if (window.Game && window.Game.localDate) return window.Game.localDate(d); } catch (e) {}
    return d.toISOString().slice(0, 10);
  }

  function load() {
    if (store) {
      // 共用引擎已在 createStore 時讀入本頁 key；共用同一 container 物件，避免雙重繫結分歧。
      data = store.data();
      data.awarded = data.awarded || {};
      // lazy 遷移：只補缺欄位（scheduleBox/peakBox/ease/...），絕不清既有欄位。
      for (var mid in data.cards) { if (Object.prototype.hasOwnProperty.call(data.cards, mid)) { try { SRS.ensureCard(data.cards[mid]); } catch (e) {} } }
      return;
    }
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) {}
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.cards) { data = parsed; data.awarded = data.awarded || {}; return; }
      } catch (e) {}
    }
    data = { version: 1, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), cards: {}, awarded: {} };
    save();
  }
  function save() {
    if (store) { store.save(); return; }
    if (!data) return;
    data.updatedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 配額滿：靜默放棄，不崩頁 */ }
  }
  function ensureCard(id, grade, category, word) {
    if (!data.cards[id]) {
      data.cards[id] = { grade: grade, category: category, word: word, box: 0, lit: false, lastReviewedDate: null, dueDate: null, timesCorrect: 0, timesSeen: 0 };
    }
    if (typeof SRS !== 'undefined' && SRS.ensureCard) { try { SRS.ensureCard(data.cards[id]); } catch (e) {} }
    return data.cards[id];
  }

  // 掃 wordDatabase 兩級建立 id -> { word物件, grade, category }（裸名讀取，與主程式同款綁定）
  function buildIndex() {
    wordIndex = {};
    for (var gi = 0; gi < GRADES.length; gi++) {
      var g = GRADES[gi];
      var gradeObj = (typeof wordDatabase !== 'undefined') ? wordDatabase[g] : null;
      if (!gradeObj) continue;
      for (var cat in gradeObj) {
        if (!Object.prototype.hasOwnProperty.call(gradeObj, cat)) continue;
        var arr = gradeObj[cat];
        for (var wi = 0; wi < arr.length; wi++) {
          var w = arr[wi];
          wordIndex[wordIdOf(g, cat, w.word)] = { word: w, grade: g, category: cat };
        }
      }
    }
  }
  function idx() { if (!wordIndex) buildIndex(); return wordIndex; }

  // ---- 分母 / 統計（即時由 wordDatabase 計算，不落地） ----
  function gradeCategories(grade) {
    var gradeObj = (typeof wordDatabase !== 'undefined') ? wordDatabase[grade] : null;
    return gradeObj ? Object.keys(gradeObj) : [];
  }
  function gradeWordCount(grade) {
    var gradeObj = (typeof wordDatabase !== 'undefined') ? wordDatabase[grade] : null;
    if (!gradeObj) return 0;
    var n = 0; for (var c in gradeObj) if (Object.prototype.hasOwnProperty.call(gradeObj, c)) n += gradeObj[c].length;
    return n;
  }
  function totalCount() { var n = 0; for (var i = 0; i < GRADES.length; i++) n += gradeWordCount(GRADES[i]); return n; }
  function litCount() { var n = 0; for (var id in data.cards) if (data.cards[id].lit) n++; return n; }
  function box5Count() { var n = 0; for (var id in data.cards) if (visBox(data.cards[id]) >= 5) n++; return n; }
  function perGradeAllLit(grade) {
    var gradeObj = (typeof wordDatabase !== 'undefined') ? wordDatabase[grade] : null;
    if (!gradeObj) return false;
    var any = false;
    for (var c in gradeObj) {
      if (!Object.prototype.hasOwnProperty.call(gradeObj, c)) continue;
      var arr = gradeObj[c];
      for (var i = 0; i < arr.length; i++) {
        any = true;
        var st = data.cards[wordIdOf(grade, c, arr[i].word)];
        if (!st || !st.lit) return false;
      }
    }
    return any;
  }
  function perGradeAllBox5(grade) {
    var gradeObj = (typeof wordDatabase !== 'undefined') ? wordDatabase[grade] : null;
    if (!gradeObj) return false;
    var any = false;
    for (var c in gradeObj) {
      if (!Object.prototype.hasOwnProperty.call(gradeObj, c)) continue;
      var arr = gradeObj[c];
      for (var i = 0; i < arr.length; i++) {
        any = true;
        var st = data.cards[wordIdOf(grade, c, arr[i].word)];
        if (!st || visBox(st) < 5) return false;
      }
    }
    return any;
  }
  function allLit() {
    for (var i = 0; i < GRADES.length; i++) if (!perGradeAllLit(GRADES[i])) return false;
    return true;
  }

  // ---- 里程碑：純本地徽章（不呼叫 Game.award；零 double-count）。單調 guard + 先落地再提示 ----
  function satisfiedMilestones() {
    var out = [];
    var lit = litCount(), b5 = box5Count(), total = totalCount();
    if (lit >= 1) out.push('first_word');
    if (lit >= 25) out.push('collect_25');
    if (lit >= 50) out.push('collect_50');
    if (lit >= 100) out.push('collect_100');
    if (perGradeAllLit('middle')) out.push('grade_middle_all');
    if (perGradeAllLit('upper')) out.push('grade_upper_all');
    if (allLit() && total > 0) out.push('all_collected');
    if (b5 >= 50) out.push('master_50');
    if (perGradeAllBox5('middle') && perGradeAllBox5('upper') && total > 0) out.push('master_all');
    return out;
  }
  function mileMsg(id) {
    switch (id) {
      case 'first_word': return '🌟 收集到第一個單字！';
      case 'collect_25': return '✨ 已收集 25 個字！';
      case 'collect_50': return '✨ 已收集 50 個字！';
      case 'collect_100': return '💯 已收集 100 個字！';
      case 'grade_middle_all': return '📗 基礎全部收集完成！';
      case 'grade_upper_all': return '📘 進階全部收集完成！';
      case 'all_collected': return '🌌 所有單字都收集齊了！';
      case 'master_50': return '🏅 已精通 50 個字！';
      case 'master_all': return '👑 全部單字都精通了！';
      default: return '🎉 達成新成就！';
    }
  }
  function checkMilestones() {
    var s = satisfiedMilestones();
    for (var i = 0; i < s.length; i++) {
      var id = s[i];
      if (data.awarded[id]) continue;      // 一生一次 guard，防發獎瞬間關頁重載重領
      data.awarded[id] = true;
      save();                              // 先落地
      try { if (window.Game && window.Game.showToast) window.Game.showToast(mileMsg(id), 'success'); } catch (e) {} // 純 UI 提示，不計分
    }
  }

  // ---- 核心：每次作答（測驗/拼字傳 allWords[currentWordIndex]；配對傳 matchState.words[index]） ----
  function onWord(wordObj, correct) {
    if (!data) load();
    if (!wordObj || typeof wordObj.word !== 'string' || !wordObj.word) return;
    // 優先用佇列標註的 grade/category（跨級複習正確）；否則裸名讀 currentGrade/currentCategory（一般練習正確）
    var grade = wordObj._albG || (typeof currentGrade !== 'undefined' ? currentGrade : null);
    var category = wordObj._albC || (typeof currentCategory !== 'undefined' ? currentCategory : null);
    if (!grade || !category) return;
    var id = wordIdOf(grade, category, wordObj.word);
    ensureCard(id, grade, category, wordObj.word);
    if (store) {
      // 共用排程漏斗：correct→good（升 scheduleBox、點亮 lit、peakBox=max、dueDate 依 ease）；
      // wrong→again（退 scheduleBox=max(1,box-1)、lapses++、dueDate=today）；
      // 【脫鉤】答錯一律不降 peakBox / lit / glyph / 收藏數。
      store.gradeBinary(id, correct);
    } else {
      // 無 SRS 時的保底：維持既有「答錯只重排今天、不退階、收藏只增不減」。
      var st = data.cards[id]; var t = today();
      st.timesSeen = (st.timesSeen || 0) + 1;
      if (correct) {
        st.lit = true;
        st.box = Math.min((st.box || 0) + 1, 5);
        st.timesCorrect = (st.timesCorrect || 0) + 1;
        st.lastReviewedDate = t;
        st.dueDate = addDays(t, INTERVAL[st.box]);
      } else {
        st.dueDate = t;
      }
      save();
    }
    if (correct) checkMilestones();               // onWord 本身絕不發每題 XP
    if (isScreenOpen()) { renderSections(); renderSummary(); }
    updateDueDesc();
  }

  // ---- 今日到期佇列（跨 grade/category 單一收藏） ----
  function dueCardIds(t) {
    var out = [];
    for (var id in data.cards) {
      var s = data.cards[id];
      if (s.lit && s.dueDate && s.dueDate <= t) out.push(id);
    }
    out.sort(function (x, y) {
      var sx = data.cards[x], sy = data.cards[y];
      if (sx.dueDate !== sy.dueDate) return sx.dueDate < sy.dueDate ? -1 : 1;
      var bx = (sx.scheduleBox != null ? sx.scheduleBox : sx.box) || 0;
      var by = (sy.scheduleBox != null ? sy.scheduleBox : sy.box) || 0;
      if (bx !== by) return bx - by;
      return x < y ? -1 : 1;
    });
    return out;
  }
  function dueCount() { if (!data) load(); return dueCardIds(today()).length; }

  function tag(wObj, grade, category) { wObj._albG = grade; wObj._albC = category; return wObj; }

  // 主流程佇列（到期優先）：保留分類內「全部單字」可瀏覽，僅把今日到期的複習卡排到最前，
  // 其餘維持原順序（不設每日新卡上限，避免瀏覽/學習模式隱藏單字）。
  function orderCategory(grade, category, arr) {
    if (!data) load();
    var t = today();
    var due = [], rest = [];
    for (var i = 0; i < arr.length; i++) {
      var w = arr[i];
      var c = data.cards[wordIdOf(grade, category, w.word)];
      if (c && c.lit && c.dueDate && c.dueDate <= t) due.push({ w: w, c: c });
      else rest.push(w);
    }
    due.sort(function (x, y) {
      if (x.c.dueDate !== y.c.dueDate) return x.c.dueDate < y.c.dueDate ? -1 : 1;
      var bx = (x.c.scheduleBox != null ? x.c.scheduleBox : x.c.box) || 0;
      var by = (y.c.scheduleBox != null ? y.c.scheduleBox : y.c.box) || 0;
      return bx - by;
    });
    return due.map(function (o) { return tag(o.w, grade, category); }).concat(rest);
  }

  // 產出「已標註 grade/category 的 word 物件陣列」給 startAlbumReview 橋接函式
  function buildQueue() {
    var t = today();
    var index = idx();
    var queue = [];
    var used = {};
    var dueIds = dueCardIds(t);
    for (var i = 0; i < dueIds.length; i++) {
      var rec = index[dueIds[i]];
      if (rec) { queue.push(tag(rec.word, rec.grade, rec.category)); used[dueIds[i]] = true; }
    }
    if (queue.length < REVIEW_TARGET) {
      // 未點亮新卡補位：grade(middle→upper) → category(物件鍵序) → 原順序
      for (var gi = 0; gi < GRADES.length && queue.length < REVIEW_TARGET; gi++) {
        var g = GRADES[gi];
        var cats = gradeCategories(g);
        for (var ci = 0; ci < cats.length && queue.length < REVIEW_TARGET; ci++) {
          var cat = cats[ci];
          var arr = wordDatabase[g][cat];
          for (var wi = 0; wi < arr.length && queue.length < REVIEW_TARGET; wi++) {
            var w = arr[wi];
            var id = wordIdOf(g, cat, w.word);
            if (used[id]) continue;
            var st = data.cards[id];
            if (st && st.lit) continue;   // 只補未點亮的新卡
            queue.push(tag(w, g, cat)); used[id] = true;
          }
        }
      }
    }
    return queue.slice(0, REVIEW_CAP);
  }

  // ---- 畫面 ----
  function isScreenOpen() {
    var el = document.getElementById('albumArea');
    return el && !el.classList.contains('album-hidden');
  }
  function glyph(box) { if (!box) return '☆'; if (box >= 5) return '🌟'; return '⭐'; }
  function stateText(box) { if (!box) return '未收集'; if (box >= 5) return '精通'; return '第 ' + box + ' 盒'; }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // 產出可安全嵌入 double-quoted onclick 屬性的單引號 JS 字串字面值
  function jsStrAttr(s) {
    return "'" + String(s)
      .replace(/\\/g, '\\\\').replace(/'/g, "\\'")
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
      .replace(/</g, '&lt;').replace(/>/g, '&gt;') + "'";
  }
  function renderSections() {
    if (!data) load();
    var host = document.getElementById('albumSections');
    if (!host) return;
    var t = today();
    var html = '';
    for (var gi = 0; gi < GRADES.length; gi++) {
      var g = GRADES[gi];
      var cats = gradeCategories(g);
      if (!cats.length) continue;
      for (var ci = 0; ci < cats.length; ci++) {
        var cat = cats[ci];
        var arr = wordDatabase[g][cat];
        if (!arr || !arr.length) continue;
        html += '<div class="album-section"><div class="album-section-title">' +
          escapeHtml(GRADE_LABEL[g] || g) + ' · ' + escapeHtml(cat) + '</div><div class="album-grid">';
        for (var wi = 0; wi < arr.length; wi++) {
          var w = arr[wi];
          var id = wordIdOf(g, cat, w.word);
          var c = data.cards[id];
          var box = Math.min(visBox(c), 5); // clamp 到 5：scheduleBox/peakBox 上限為 6，但只有 box1–box5 有樣式；box6（精通）沿用 box5 綠色視覺，與 cefr 一致
          var due = !!(c && c.lit && c.dueDate && c.dueDate <= t);
          html += '<div class="album-card box' + box + (due ? ' due' : '') + '" role="button" tabindex="0"' +
            ' onclick="Album.openFocus(' + jsStrAttr(g) + ',' + jsStrAttr(cat) + ',' + jsStrAttr(w.word) + ')"' +
            ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();Album.openFocus(' + jsStrAttr(g) + ',' + jsStrAttr(cat) + ',' + jsStrAttr(w.word) + ');}">' +
            '<span class="ab-glyph">' + glyph(box) + (due ? ' <span class="ab-due">🔵</span>' : '') + '</span>' +
            '<span class="ab-word">' + escapeHtml(w.word) + '</span>' +
            '<span class="ab-cn">' + escapeHtml(w.chinese || '') + '</span>' +
            '<span class="ab-state">' + stateText(box) + '</span>' +
            '</div>';
        }
        html += '</div></div>';
      }
    }
    host.innerHTML = html;
  }
  function renderSummary() {
    var el = document.getElementById('albumSummary');
    if (!el) return;
    var lit = litCount(), mastered = box5Count(), due = dueCount(), total = totalCount();
    el.innerHTML = '已收集 <b>' + lit + '</b> / ' + total + '　·　精通 <b>' + mastered + '</b> 個　·　' +
      (due > 0 ? '今天有 <b>' + due + '</b> 個字想跟你打招呼 🔵' : '今天都複習完了');
  }
  function updateDueDesc() {
    var el = document.getElementById('albumDueDesc');
    if (!el) return;
    if (!data) load();
    var due = dueCount();
    el.textContent = due > 0 ? ('今天有 ' + due + ' 個字要複習') : '今天複習完了，明天見！';
  }

  function openScreen() {
    if (!data) load();
    ['.play-column', '.grade-selector', '.category-selector', '.mode-selector', '.album-nav'].forEach(function (sel) {
      var el = document.querySelector(sel);
      if (el) el.classList.add('album-hidden');
    });
    var area = document.getElementById('albumArea');
    if (area) area.classList.remove('album-hidden');
    renderSections(); renderSummary(); updateDueDesc();
  }
  function closeScreen() {
    var area = document.getElementById('albumArea');
    if (area) area.classList.add('album-hidden');
    ['.play-column', '.grade-selector', '.category-selector', '.mode-selector', '.album-nav'].forEach(function (sel) {
      var el = document.querySelector(sel);
      if (el) el.classList.remove('album-hidden');
    });
  }

  function openFocus(grade, category, word) {
    if (!data) load();
    var id = wordIdOf(grade, category, word);
    var rec = idx()[id];
    var wObj = rec ? rec.word : null;
    var c = data.cards[id];
    var box = visBox(c);
    var t = today();
    var status;
    if (!box) status = '還沒收集，練一次就會亮起來 ✨';
    else if (box >= 5) status = '已經精通囉！（第 5 盒 🌟）';
    else status = '目前在第 ' + box + ' 盒';
    var when = '';
    if (c && c.lit && c.dueDate) {
      when = (c.dueDate <= t) ? '今天適合複習 🔵' : ('下次複習日：' + c.dueDate);
    }
    var body = document.getElementById('albumFocusBody');
    if (body) {
      body.innerHTML =
        '<div class="album-focus-glyph">' + glyph(box) + '</div>' +
        '<div class="album-focus-word">' + escapeHtml(word) + '</div>' +
        '<div class="album-focus-cn">' + escapeHtml((wObj && wObj.chinese) || '') + '</div>' +
        '<div class="album-focus-meta">' + status + (when ? ('<br>' + when) : '') +
          '<br>答對 ' + (c ? c.timesCorrect : 0) + ' 次</div>' +
        '<button class="album-focus-practice" onclick="Album.startFocus(' + jsStrAttr(grade) + ',' + jsStrAttr(category) + ',' + jsStrAttr(word) + ')">✏️ 練這個字</button>';
    }
    var o = document.getElementById('albumFocusOverlay');
    if (o) o.hidden = false;
  }
  function closeFocus() {
    var o = document.getElementById('albumFocusOverlay');
    if (o) o.hidden = true;
  }

  // ---- 複習 / 單字聚焦（重用既有 quiz 流程） ----
  function startReview() {
    if (!data) load();
    closeFocus();
    var q = buildQueue();
    if (!q.length) {
      try { if (window.Game && window.Game.showToast) window.Game.showToast('今天都複習完了，明天見！', 'success'); } catch (e) {}
      return;
    }
    closeScreen();
    if (typeof window.startAlbumReview === 'function') window.startAlbumReview(q);
  }
  function startFocus(grade, category, word) {
    if (!data) load();
    closeFocus();
    var rec = idx()[wordIdOf(grade, category, word)];
    if (!rec) return;
    closeScreen();
    if (typeof window.startAlbumReview === 'function') window.startAlbumReview([tag(rec.word, rec.grade, rec.category)]);
  }

  window.Album = {
    onWord: onWord,
    orderCategory: orderCategory,
    openScreen: openScreen,
    closeScreen: closeScreen,
    openFocus: openFocus,
    closeFocus: closeFocus,
    startReview: startReview,
    startFocus: startFocus
  };

  // 初始化
  load();
  updateDueDesc();
})();
</script>
