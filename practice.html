<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字探險家</title>

    <!-- 統一遊戲化引擎：主題 token、HUD/toast 樣式、共用引擎（同步載入於 <head>）。
         app.css / game_core.css 先於本頁 <style> 載入，本頁樣式在後、逐屬性覆蓋，維持原本外觀。 -->
    <link rel="stylesheet" href="assets/app.css">
    <link rel="stylesheet" href="game_core.css">
    <script src="game_core.js"></script>
    <!-- 共用「間隔重複」排程核心（window.SRS）；於 game_core.js 之後、頁面腳本之前載入。 -->
    <script src="assets/srs_engine.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding: 0 20px 20px;
            overflow-x: hidden;
        }

        /* Canon 外層：吃 --content-max（手機 720／iPad 1200）、置中。
           在 iPad 上攤成寬版而非中央窄長條（對齊 index/social/finance）。 */
        .container {
            width: 100%;
            max-width: var(--content-max);
            margin-inline: auto;
        }
        /* 頂部橫幅（統計／分類／模式列）與下方活動欄同寬：把主活動流的各區塊都收斂到
           同一個置中欄（~1080px），善用寬螢幕（1512／1920 不再大片留白），與其他頁一致；
           橫幅與卡片齊寬、內容仍置中。卡片內的閱讀文字另行限寬避免行過長。單字相簿畫面不受此限。 */
        .container > h1,
        .container > .subtitle,
        .container > .stats,
        .container > .progress-bar,
        .container > .grade-selector,
        .container > .category-selector,
        .container > .mode-selector,
        .container > .album-nav,
        .container > .play-column,
        .container > .cn-nextup-group {
            max-width: 1080px;
            margin-inline: auto;
        }
        /* 卡片欄本身撐滿這個 1080px 欄，與上方橫幅齊寬（覆蓋 app.css 的 width:100% 預設）。 */
        .container > .play-column,
        .container > .cn-nextup-group { width: min(1080px, 100%); }
        /* 共用 .app-bar 滿版對齊：抵銷本頁 body 的 padding/置中，使頂列與其他頁一致貼齊視窗邊緣。 */
        .app-bar { width: 100vw; margin-left: calc(50% - 50vw); padding-inline: max(var(--s3), calc((100vw - var(--content-max)) / 2)); }

        h1 {
            text-align: center;
            color: var(--ink);
            font-size: var(--fs-h1);
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: var(--s2);
        }

        .subtitle {
            text-align: center;
            color: var(--ink-soft);
            margin-bottom: var(--s5);
            font-size: var(--fs-body);
            font-weight: 600;
        }

        .progress-bar {
            background: var(--card-border);
            border-radius: 999px;
            height: 10px;
            margin-bottom: var(--s4);
            overflow: hidden;
        }

        .progress-fill {
            background: var(--accent);
            height: 100%;
            border-radius: 999px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: var(--s3);
            margin-bottom: var(--s4);
            flex-wrap: wrap;
        }

        /* 成績列小塊：沿用 .stat-tile 的設計語言（1px 邊、--r-sm、柔陰影），
           但保持單行文字（JS 直接寫入 textContent，不改結構）。 */
        .stat-item {
            background: var(--card);
            border: 1px solid var(--card-border);
            padding: var(--s2) var(--s3);
            border-radius: var(--r-sm);
            color: var(--ink);
            font-weight: 700;
            font-size: var(--fs-small);
            box-shadow: var(--shadow-sm);
        }

        /* 英文科「實心按鈕」填色 token 已提升為 app.css 全站 token（亮 #087a5f / 暗 #42D3AA），
           本頁不再重複宣告，直接引用共用 --c-english-btn。 */

        /* 本頁強調色三件組（英文科）：接上共用設計語言，讓進度條、選中態、
           揭示區、num 標籤等自動換成一致的科目色（亮/暗雙主題）。 */
        :root {
            --accent: var(--c-english);
            --accent-tint: var(--tint-english);
            --accent-ink: var(--c-english-ink);
        }

        /* 選擇器按鈕（年級 / 主題 / 模式）：統一採用共用 .btn 的形狀與互動語言
           ── 16px 圓角、2px 邊、48px 命中區、按壓 scale(0.96)、hover 抬升陰影，
           選中（.active）以科目強調色實心填色。三種只差字級與內距密度。 */
        .grade-selector {
            display: flex;
            justify-content: center;
            gap: var(--s2);
            margin-bottom: var(--s3);
            flex-wrap: wrap;
        }

        .grade-btn, .cat-btn, .mode-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            border: 2px solid var(--card-border);
            background: var(--card);
            color: var(--ink);
            border-radius: 16px;
            cursor: pointer;
            font-family: var(--font);
            font-weight: 700;
            transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .grade-btn { padding: 8px 20px; font-size: var(--fs-body); }
        .cat-btn { padding: 5px 14px; font-size: var(--fs-small); color: var(--ink-soft); }
        .mode-btn { padding: 9px 18px; font-size: var(--fs-body); }

        .grade-btn:hover, .cat-btn:hover, .mode-btn:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-lg);
        }
        .grade-btn:active, .cat-btn:active, .mode-btn:active { transform: scale(0.96); }

        .grade-btn.active, .cat-btn.active, .mode-btn.active {
            background: var(--c-english-btn);
            color: var(--on-accent);
            border-color: var(--c-english-btn);
        }

        /* 主題選單（14–16 分類）→ 共用 .u-grid 儀表板：手機單欄好讀，
           iPad 自動攤成寬版多欄 album shelf。分類鈕在格內撐滿寬度。 */
        .category-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--s2);
            margin-bottom: var(--s3);
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: var(--s2);
            margin-bottom: var(--s4);
            flex-wrap: wrap;
        }

        /* 題目大舞台卡：對齊共用 .q-stage 的表面處理（--r-lg 圓角、1px 邊、
           柔靜陰影、--s5/--s4 內距）。 */
        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--r-lg);
            padding: var(--s5) var(--s4);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* 短高視窗（iPad 橫向 1024 高 / 手機）：壓縮前置 chrome 與卡片，讓學習卡一屏可見、動作可達 */
        @media (max-height: 1050px) {
            h1 { font-size: var(--fs-h2); margin: 0 0 2px; }
            .subtitle { display: none; }
            .stats { margin: var(--s2) 0; }
            .progress-bar { margin: var(--s2) 0; }
            .category-selector { gap: 6px; margin: var(--s2) 0; }
            .cat-btn { padding: 4px 12px; min-height: 0; }
            .mode-selector { margin: var(--s2) 0; }
            .album-nav { margin: var(--s2) 0; }
            .card { min-height: 200px; padding: var(--s3) var(--s4); }
        }

        /* Visual Learning Mode */
        .visual-container {
            text-align: center;
            width: 100%;
        }

        /* 主打單字：對齊 .q-prompt 的題幹分量（800 粗、ink 色、clamp 字級）。 */
        .word-display {
            font-size: clamp(30px, 9vw, 52px);
            font-weight: 800;
            color: var(--ink);
            line-height: 1.2;
            margin-bottom: var(--s1);
            letter-spacing: 2px;
            animation: popIn 0.4s ease;
        }

        .word-chinese {
            font-size: var(--fs-h2);
            color: var(--accent-ink);
            margin-bottom: var(--s2);
            font-weight: 700;
        }

        .word-phonetic {
            font-size: var(--fs-body);
            color: var(--ink-soft);
            margin-bottom: var(--s4);
            font-weight: 600;
            font-style: italic;
        }

        .word-scene {
            width: 100%;
            /* 卡片變寬後，插圖限寬置中，避免拉成又寬又扁的橫帶。 */
            max-width: 560px;
            height: 180px;
            margin: var(--s4) auto;
            position: relative;
            border-radius: var(--r-md);
            overflow: hidden;
        }

        .scene-canvas {
            width: 100%;
            height: 100%;
            border-radius: var(--r-md);
            border: 1px solid var(--card-border);
        }

        /* 夜間模式：插圖各自畫的是硬碼亮色底（藍天/草地等），在深色頁面上會突兀發亮。
           不逐一改 136 張圖，改在單一處對整個 canvas 降亮度＋微降飽和（護眼、不刺眼），
           純 CSS 隨主題即時切換、零 JS 風險；illustration 仍清楚可辨。 */
        :root[data-theme="dark"] .scene-canvas {
            filter: brightness(0.72) saturate(0.9);
        }

        /* 例句：對齊 .q-feedback 的揭示面板（tint 底、--r-md、左側強調粗邊）。 */
        .word-sentence {
            font-size: var(--fs-body);
            font-weight: 700;
            color: var(--ink);
            line-height: 1.55;
            margin: var(--s3) auto;
            padding: var(--s3) var(--s4);
            background: var(--tint-english);
            border-radius: var(--r-md);
            border-left: 4px solid var(--c-english);
            text-align: left;
            /* 卡片變寬後仍限制閱讀行寬、置中，避免例句一行過長。 */
            max-width: 680px;
        }

        .word-sentence strong {
            color: var(--c-english-ink);
        }

        /* 記憶小技巧：沿用「暖黃提示」語意，改走 chinese tint token（亮/暗一致）。 */
        .memory-tip {
            margin: var(--s3) auto 0;
            padding: var(--s3) var(--s4);
            background: var(--tint-chinese);
            border-radius: var(--r-md);
            font-size: var(--fs-small);
            font-weight: 600;
            line-height: 1.55;
            color: var(--c-chinese-ink);
            text-align: left;
            /* 與例句同樣限寬置中，寬螢幕下不整行拉長。 */
            max-width: 680px;
        }

        .memory-tip::before {
            content: "💡 ";
            font-weight: bold;
        }

        /* 夜間模式：原本是硬碼的淺黃漸層（#fff3cd→#ffeaa7）＋深黃字，
           在深色背景上會突兀發亮。改用暖黃 tint 底 + 提亮黃墨字（9.54:1）。 */
        :root[data-theme="dark"] .memory-tip {
            background: var(--tint-chinese);
            color: var(--c-chinese-ink);
        }

        .letter-breakdown {
            display: flex;
            justify-content: center;
            gap: var(--s1);
            margin: var(--s3) 0;
            flex-wrap: wrap;
        }

        .letter-box {
            width: 42px;
            height: 50px;
            background: var(--c-english-btn);
            border-radius: var(--r-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: var(--on-accent);
            animation: letterPop 0.3s ease forwards;
            opacity: 0;
            transform: scale(0);
        }

        /* Quiz Mode */
        .quiz-container {
            text-align: center;
            width: 100%;
        }

        /* 題幹：對齊 .q-prompt。 */
        .quiz-question {
            font-size: clamp(19px, 4.5vw, 24px);
            font-weight: 800;
            color: var(--ink);
            line-height: 1.45;
            margin-bottom: var(--s4);
        }

        .quiz-word {
            font-size: clamp(26px, 7vw, 40px);
            font-weight: 800;
            color: var(--accent-ink);
            margin-bottom: var(--s4);
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--s3);
            /* 寬螢幕上讓選項稍微加寬，填充變寬的卡片但仍置中好讀。 */
            max-width: 720px;
            margin: 0 auto;
        }

        /* 選項按鈕：對齊共用 .q-opt（2px 邊、16px 圓角、56px 命中區、按壓縮放）。 */
        .quiz-option {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 56px;
            padding: 14px 18px;
            border: 2px solid var(--card-border);
            border-radius: 16px;
            cursor: pointer;
            font-size: clamp(16px, 3.4vw, 19px);
            font-weight: 700;
            transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
            background: var(--card);
            color: var(--ink);
        }

        .quiz-option:hover {
            border-color: var(--c-english);
            background: var(--tint-english);
        }
        .quiz-option:active { transform: scale(0.98); }

        .quiz-option.correct {
            border-color: var(--c-correct);
            background: var(--tint-english);
            color: var(--ink);
            animation: correctPulse 0.5s ease;
        }

        .quiz-option.wrong {
            border-color: var(--c-wrong);
            background: rgba(255, 118, 117, 0.12);
            color: var(--ink);
            animation: shake 0.5s ease;
        }

        /* Spelling Mode */
        .spelling-container {
            text-align: center;
            width: 100%;
        }

        .spelling-hint {
            font-size: var(--fs-h2);
            color: var(--ink);
            margin-bottom: var(--s1);
            font-weight: 800;
        }

        .spelling-chinese {
            font-size: var(--fs-body);
            color: var(--accent-ink);
            font-weight: 700;
            margin-bottom: var(--s4);
        }

        .spelling-input-area {
            display: flex;
            justify-content: center;
            gap: var(--s1);
            margin: var(--s4) 0;
            flex-wrap: wrap;
        }

        .spell-letter-input {
            width: 44px;
            height: 54px;
            border: 2px solid var(--ink-soft);  /* 輸入格邊界需 ≥3:1 才看得出可輸入（原 --card-border 對卡片僅 ~1.1:1） */
            border-radius: var(--r-sm);
            text-align: center;
            font-size: 1.5em;
            font-weight: 800;
            background: var(--card);
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
            text-transform: lowercase;
        }

        .spell-letter-input:focus {
            border-color: var(--c-focus);
            box-shadow: 0 0 0 3px var(--c-focus);   /* 與全站標準焦點環一致（實色 var(--c-focus) ~5:1），取代原偏弱的綠框+10%淡光暈 */
        }

        .spell-letter-input.correct {
            border-color: var(--c-correct);
            background: var(--tint-english);
            color: var(--ink);
        }

        .spell-letter-input.wrong {
            border-color: var(--c-wrong);
            background: rgba(255, 118, 117, 0.12);
            color: var(--ink);
        }

        .spell-letter-input.hint {
            border-color: var(--c-warn);
            background: var(--tint-chinese);
            color: var(--c-chinese-ink);
        }

        /* Matching Mode */
        .matching-container {
            width: 100%;
        }

        .matching-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--s4);
            align-items: start;
            /* 兩欄配對在寬卡片中限寬置中，避免配對格被拉得過寬。 */
            max-width: 760px;
            margin: 0 auto;
        }

        .matching-column {
            display: flex;
            flex-direction: column;
            gap: var(--s2);
        }

        /* 欄標題：對齊 .section-title 的分量（h2 級、800）。 */
        .matching-column h3 {
            text-align: center;
            color: var(--ink);
            font-size: var(--fs-h2);
            font-weight: 800;
            margin-bottom: var(--s2);
        }

        /* 配對格：對齊 .q-opt 選項按鈕的表面處理。 */
        .match-item {
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 18px;
            border: 2px solid var(--card-border);
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            font-size: clamp(16px, 3.4vw, 19px);
            font-weight: 700;
            color: var(--ink);
            transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
            user-select: none;
        }

        .match-item.word-item {
            font-weight: 800;
            color: var(--ink);
        }

        .match-item.selected {
            border-color: var(--c-english);
            background: var(--tint-english);
            transform: scale(1.02);
        }

        .match-item.matched {
            border-color: var(--c-correct);
            background: var(--tint-english);
            color: var(--ink);
            opacity: 0.7;
            pointer-events: none;
        }

        .match-item.wrong-match {
            animation: shake 0.4s ease;
            border-color: var(--c-wrong);
        }

        /* Navigation */
        /* 底部行動列：對齊共用 .q-actions（按鈕 flex:1、min-width 140px）。 */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: var(--s3);
            margin-top: var(--s4);
            flex-wrap: wrap;
        }

        /* 導覽鈕：對齊共用 .btn 形狀（16px 圓角、48px 命中區、按壓 scale(0.96)）。 */
        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-width: 140px;
            min-height: 48px;
            padding: 12px 20px;
            border: 2px solid transparent;
            border-radius: 16px;
            font-family: var(--font);
            font-size: clamp(15px, 3vw, 17px);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-btn:active { transform: scale(0.96); }

        .nav-btn.primary {
            background: var(--c-english-btn);
            color: var(--on-accent);
            box-shadow: var(--shadow-sm);
        }

        .nav-btn.primary:hover {
            box-shadow: var(--shadow-lg);
        }

        .nav-btn.secondary {
            background: var(--tint-english);
            color: var(--c-english-ink);
        }

        .nav-btn.secondary:hover {
            box-shadow: var(--shadow-lg);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .sound-btn {
            background: none;
            border: none;
            font-size: 1.6em;
            cursor: pointer;
            transition: transform 0.2s;
            vertical-align: middle;
        }

        .sound-btn:hover {
            transform: scale(1.2);
        }

        .word-counter {
            position: absolute;
            top: var(--s3);
            right: var(--s4);
            color: var(--ink-soft);
            font-size: var(--fs-small);
            font-weight: 700;
        }

        /* Celebration */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: confettiFall 2.5s ease-out forwards;
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes letterPop {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* 答對/答錯的鼓勵文字回饋 */
        .feedback-msg {
            min-height: 1.4em;
            margin: var(--s3) auto 0;
            text-align: center;
            font-size: var(--fs-body);
            font-weight: 700;
            line-height: 1.55;
        }
        .feedback-msg.correct { color: var(--ink); }
        .feedback-msg.wrong { color: var(--ink); }

        /* 除了顏色，也用符號標示對錯（對色盲/低視力更友善） */
        .quiz-option.correct::after { content: " ✓"; font-weight: 800; }
        .quiz-option.wrong::after { content: " ✗"; font-weight: 800; }

        /* 鍵盤操作時看得到目前焦點在哪 */
        button:focus-visible,
        .quiz-option:focus-visible,
        .match-item:focus-visible,
        .spell-letter-input:focus-visible,
        .fc-spell__tile:focus-visible,
        .fc-spell__slot:focus-visible {
            outline: 3px solid var(--c-focus);
            outline-offset: 2px;
        }

        /* 尊重「減少動態效果」的系統設定，避免造成不適 */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
            /* 還原「靠動畫才顯現」的元素靜態可見態，否則關掉動畫後永遠隱形（.letter-box 起始 opacity:0/scale(0)，只靠 letterPop 顯現） */
            .letter-box { opacity: 1 !important; transform: none !important; }
        }

        /* 夜間模式：對錯/提示狀態原用硬碼淺色底（#d4f8d4 / #ffe8f0 / #fef9e7），
           在深色頁面會突兀發亮。改用對應語意色的低飽和 tint 底 + 提亮墨字，
           對比皆 ≥6:1；邊框沿用已隨主題切換的 --c-correct/--c-wrong/--c-warn。 */
        :root[data-theme="dark"] .quiz-option.correct,
        :root[data-theme="dark"] .spell-letter-input.correct,
        :root[data-theme="dark"] .match-item.matched {
            background: var(--tint-english);
            color: var(--c-english-ink);
        }
        :root[data-theme="dark"] .quiz-option.wrong,
        :root[data-theme="dark"] .spell-letter-input.wrong {
            background: rgba(255, 144, 141, 0.15);
            color: var(--c-streak-ink);
        }
        :root[data-theme="dark"] .spell-letter-input.hint {
            background: var(--tint-chinese);
            color: var(--c-chinese-ink);
        }

        /* Responsive（字級已改用 clamp() 自動縮放，這裡只調整版面與命中區） */
        @media (max-width: 600px) {
            .card { padding: var(--s4); min-height: 380px; }
            .quiz-options { grid-template-columns: 1fr; }
            .matching-grid { grid-template-columns: 1fr; }
            .letter-box { width: 34px; height: 42px; font-size: 1.2em; }
            .spell-letter-input { width: 36px; height: 44px; font-size: 1.2em; }
            .cat-btn { padding: 10px 14px; min-height: 48px; }
        }
    </style>
</head>
<!-- data-game-hud="native"：本頁已有自己的成績列（學會/連續答對/分數），不注入浮動 HUD（§4.5）。 -->
<body data-game-hud="native">
    <!-- ===== 共用頂部應用列（全站一致；貼在 <body> 內第一個元素） ===== -->
    <header class="app-bar">
      <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
        <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
        <span class="app-bar__home-label">學習基地</span>
      </a>
      <span class="app-bar__title">單字探險家 🔎</span>
      <button type="button" class="app-bar__theme" data-theme-toggle
              aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
        <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
      </button>
    </header>
    <div class="container">
        <h1>單字探險家</h1>
        <p class="subtitle">基礎 ＆ 進階 ｜ 看圖記單字</p>

        <div class="stats">
            <span class="stat-item" id="stat-learned">學會: 0</span>
            <span class="stat-item" id="stat-streak">答對題數: 0</span>
            <span class="stat-item" id="stat-score">分數: 0</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="grade-selector">
            <button class="grade-btn active" onclick="switchGrade('middle')">基礎</button>
            <button class="grade-btn" onclick="switchGrade('upper')">進階</button>
        </div>

        <div class="category-selector" id="category-selector"></div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="visual" onclick="switchMode('visual')">學習 Learn</button>
            <button class="mode-btn" data-mode="quiz" onclick="switchMode('quiz')">測驗 Quiz</button>
            <button class="mode-btn" data-mode="spelling" onclick="switchMode('spelling')">拼字 Spell</button>
            <button class="mode-btn" data-mode="matching" onclick="switchMode('matching')">配對 Match</button>
        </div>

        <!-- 單字相簿入口（跨 grade/category 收藏；未選分類也可用） -->
        <div class="album-nav">
            <button class="mode-btn" onclick="Album.openScreen()">🌈 單字相簿</button>
            <button class="mode-btn" onclick="Album.startReview()" title="複習今天想跟你打招呼的字">🔭 今日複習</button>
            <span class="album-due-desc" id="albumDueDesc"></span>
        </div>

        <!-- 答題／活動區：包進共用 .play-column（≤1080px 置中），
             避免在 iPad 被拉到 1200px 造成閱讀行過長、canvas 過寬。 -->
        <div class="play-column">
            <div class="card" id="card-area"></div>
        </div>

        <!-- ===== 單字相簿畫面（用 .album-hidden 開關；本頁無 .hidden 定義） ===== -->
        <div id="albumArea" class="album-hidden">
            <div class="album-top">
                <h2 class="album-title">🌈 單字相簿</h2>
                <button class="album-back" onclick="Album.closeScreen()">← 返回</button>
            </div>
            <div class="album-summary" id="albumSummary" aria-live="polite"></div>
            <div class="album-legend">
                <span><span class="lg">☆</span> 未收集</span>
                <span><span class="lg">⭐</span> 收集中</span>
                <span><span class="lg">🌟</span> 精通</span>
                <span><span class="lg">🔵</span> 今天待複習</span>
            </div>
            <div class="album-actions">
                <button class="mode-btn" onclick="Album.startReview()">🔭 開始今日複習</button>
            </div>
            <div id="albumSections"></div>
        </div>

        <!-- 跨頁學習串接：練習頁 → 進階；← 先回觀念打底（僅導覽，不影響答題／計分） -->
        <nav class="cn-nextup-group play-column" aria-label="接下來的學習路徑" style="margin:20px auto 8px;display:flex;flex-direction:column;gap:10px">
            <a class="cn-nextup" href="english_advanced.html"><span class="cn-nextup-ic" aria-hidden="true">🏆</span><span>準備好了嗎？挑戰「進階英文語感」 →</span></a>
            <a class="cn-nextup cn-nextup--back" href="english_concepts.html"><span class="cn-nextup-ic" aria-hidden="true">📘</span><span>← 想先打底？回「英文句型觀念養成」複習</span></a>
        </nav>
    </div>

    <div class="celebration" id="celebration"></div>

    <!-- 單字聚焦面板 overlay（預設 hidden 屬性 + CSS [hidden] 高特異度保險，永不閃現） -->
    <div class="album-focus-overlay" id="albumFocusOverlay" hidden>
        <div class="album-focus-card">
            <button class="album-focus-close" onclick="Album.closeFocus()" aria-label="關閉">✕</button>
            <div class="album-focus-body" id="albumFocusBody"></div>
        </div>
    </div>

    <script src="practice.js"></script>
</body>
</html>
