19 找消防隊","先自己想辦法，不用打電話"],"answer":0,"explain":"遇到需要警察的事就打 110，火災、有人受傷叫救護車才打 119，記住這兩個號碼就能找到幫手。"},{"q":"打電話求救時，接通後保持冷靜，最要講清楚的是哪些事？","options":["自己喜歡的顏色和食物","我在哪裡、發生什麼事、有幾個人、有沒有人受傷","電話號碼是幾號"],"answer":1,"explain":"把地點、事情、人數和有沒有人受傷說清楚，救援才能又快又準地趕到。"},{"q":"求救的話講完了，這時候你應該怎麼做？","options":["馬上把電話掛掉","先不要掛，聽對方問題回答，等對方說可以掛了再掛","把電話丟到一邊"],"answer":1,"explain":"先不要急著掛電話，聽對方的問題回答，等對方說可以掛了再掛才對。"},{"q":"遇到很緊急的事，可是手機顯示沒有訊號、打不出去，可以試著撥哪個號碼？","options":["試著撥 112","多撥幾次 110 就會通","關機再開機就好"],"answer":0,"explain":"手機沒訊號、緊急打不出去時，可以試著撥 112 求救，這個小知識很有用。"},{"q":"為什麼把家人的電話和住家地址「背在腦袋裡」，比只寫在紙上更保險？","options":["因為紙比較重","因為背起來後需要時隨時都用得上，不怕紙不見","因為背起來比較好玩"],"answer":1,"explain":"記在腦袋裡，走失或緊急時隨時都能說出來，比帶著紙條更保險。"},{"q":"如果你在外面和家人走散了，最好先怎麼做？","options":["自己到處走一走找家人","待在原地不要亂走，找穿制服的人幫忙","跟著陌生人回他家"],"answer":1,"explain":"走失時先待在原地，找警察、店員等穿制服的人幫忙，最容易找回家人。"},{"q":"練習說出自己的住家地址時，怎樣說才算夠清楚？","options":["只要說出路名就好","從縣市、區、路名一直說到幾號幾樓","只說幾樓就可以了"],"answer":1,"explain":"從縣市、區、路名說到幾號幾樓，越清楚越好，別人才找得到你家。"},{"q":"家人的電話號碼有點長，怎麼做可以讓它變得更好記？","options":["把號碼編成一首小歌或口訣，每隔幾天複習一次","只背前面兩個數字就好","反正記不住就不要背"],"answer":0,"explain":"把號碼編成小歌或口訣，再每隔幾天複習，就會記得又快又牢。"},{"q":"走失時你找到了一位穿制服的店員願意幫忙，接下來你要做什麼？","options":["把背好的家人電話和地址說給他聽，請他幫忙聯絡家人","什麼都不說，自己走開","跟他要糖果吃"],"answer":0,"explain":"把背好的電話和地址說給幫忙的大人聽，他就能幫你聯絡上家人囉。"}],"outdoor":[{"q":"小明想過馬路，馬路對面就是他家，但附近有斑馬線在幾步之外。他應該怎麼做？","options":["直接從最近的地方穿越馬路","走到斑馬線那裡再過馬路","從停著的車子中間鑽過去"],"answer":1,"explain":"多走幾步到斑馬線再過馬路，開車的人才能清楚看到你。"},{"q":"過馬路前要看清楚左右兩邊，正確的看的順序是下面哪一個？","options":["先看左邊，再看右邊，再看一次左邊","只看右邊一次就好","閉上眼睛快步衝過去"],"answer":0,"explain":"先看左、再看右、再看一次左，確定沒有車再走，這樣才安全。"},{"q":"小華在等紅綠燈，這時候是紅燈，但看到路上暫時沒有車，他應該怎麼做？","options":["紅燈也要停下來等，等綠燈亮才走","沒車就趕快跑過去","站到馬路中間等綠燈"],"answer":0,"explain":"紅燈就是要停下來等，等綠燈亮再走，這樣最安全。"},{"q":"綠燈亮了，正要過馬路，下面哪個習慣最安全？","options":["低頭看手機邊走邊過","再看看左右確定沒有車才走","跟著人群跑不用看車"],"answer":1,"explain":"就算是綠燈，也要再確認一下左右沒有車再走，這樣最安全。"},{"q":"在路口要過馬路，應該從哪裡通過最安全？","options":["從車子與車子的縫隙穿越","翻過路中間的欄杆","走斑馬線、天橋或地下道"],"answer":2,"explain":"走斑馬線、天橋或地下道，是最安全的過馬路方法。"},{"q":"小美一坐上車，第一件應該做的事是什麼？","options":["把窗戶打開把手伸出去","坐好並把安全帶扣好","站起來跟後座的人聊天"],"answer":1,"explain":"上車先坐好、扣好安全帶，聽到「喀」一聲，這樣坐車最安全。"},{"q":"為什麼坐車時一定要繫安全帶？","options":["因為安全帶很漂亮","因為突然煞車時它能把我們穩穩留在座位上","因為繫了就可以在車上玩"],"answer":1,"explain":"安全帶就像抱住我們的手，突然煞車時能保護我們。"},{"q":"車子在馬路上行駛時，天氣很熱，小志好想把頭伸出天窗吹風，他應該怎麼做？","options":["把頭和手都留在車子裡面","把頭伸出天窗外吹風","把手伸出窗外跟別的車揮手"],"answer":0,"explain":"頭和手都要留在車裡，才不會被經過的車子或東西撞到。"},{"q":"車子停好了，要開門下車前，應該先做什麼？","options":["用力把門推開最快","先看看門旁邊和後面有沒有機車或腳踏車","閉著眼睛開門"],"answer":1,"explain":"開門前先看看後方有沒有來車，確認安全再下車。"},{"q":"車子正在路上開，下面哪個做法最安全？","options":["在座位上坐好不亂動","站起來在車上跑來跑去","跟同學在車上打鬧"],"answer":0,"explain":"車子在跑的時候坐好、不跑跳打鬧，突然煞車時才不會受傷。"},{"q":"小安和同學到河邊玩，發現旁邊都沒有大人，他應該怎麼做？","options":["自己先下水試試看","不靠近水邊，去找大人陪同","叫同學一起跳下水"],"answer":1,"explain":"沒有大人陪就不靠近水邊，這樣才能保護自己。"},{"q":"還不太會游泳的小玲想去游泳池玩水，下面哪個做法比較好？","options":["自己跳進深水區練習","有大人陪，並穿好合身的救生衣","偷偷一個人去玩"],"answer":1,"explain":"還不會游泳時要有大人陪、穿好救生衣，這樣玩水才安全。"},{"q":"如果不小心滑進水裡，下面哪個做法最能幫助自己？","options":["用力亂揮手亂踢想爬起來","放輕鬆、頭往後仰讓臉浮出水面，大聲喊救命","低頭把臉埋進水裡"],"answer":1,"explain":"放鬆仰漂、讓臉浮出水面再大聲呼救，比較不會嗆水，也能等大人來救。"},{"q":"小杰看到有人在水裡大喊救命，他應該怎麼做？","options":["自己馬上跳下水去救","大聲喊大人來，並打119","假裝沒看到走開"],"answer":1,"explain":"看到有人溺水要喊大人並打119，不自己跳下去，這樣最安全。"},{"q":"岸邊有人溺水，小婷站在岸上想幫忙，下面哪個做法比較安全？","options":["跳下水把人拉上來","站穩在岸上，把救生圈或長棍子遞給他","什麼都不做只是看著"],"answer":1,"explain":"站穩岸上、遞漂浮的東西給對方，既能幫忙又不會被拉下水。"},{"q":"為什麼看到別人溺水時，自己不可以馬上跳下去救？","options":["因為水太冷了","因為常常會連自己也被拉下水，反而更危險","因為衣服會濕掉"],"answer":1,"explain":"自己跳下去常會被一起拉下水，反而更危險，所以要喊大人幫忙。"},{"q":"全家要去爬山，出門前小凱可以先做什麼事最好？","options":["告訴家人要去哪裡、大概什麼時候回來","偷偷出門不讓別人知道","什麼都不用說直接走"],"answer":0,"explain":"出門前先讓家人知道去哪裡、何時回來，萬一有事家人才找得到。"},{"q":"在山上走路時，走在哪裡最安全？","options":["自己跑到隊伍最前面","落在後面很遠自己慢慢逛","走在大人看得到的地方"],"answer":2,"explain":"走在大人看得到的地方，不跑太前也不落太後，才不會走散。"},{"q":"爬山時看到旁邊有一條沒有標示、鑽進樹叢的小路，小芳應該怎麼做？","options":["自己鑽進樹叢探險","走有標示的步道，不亂鑽樹叢","叫同學一起去闖闖看"],"answer":1,"explain":"走有標示的步道最不容易迷路，也比較不會遇到危險。"},{"q":"在山上看到路邊長了紅紅的野果，看起來很好吃，該怎麼辦？","options":["摘下來馬上吃","不亂採也不亂吃，好奇就問大人","多摘一些帶回家吃"],"answer":1,"explain":"野果、野菇不亂採不亂吃，因為有些有毒，想知道就問大人。"},{"q":"萬一在山上不小心和大人走散了，最好怎麼做？","options":["自己到處亂走找路","待在原地不亂走，大聲呼喊等大人來找","躲起來不出聲"],"answer":1,"explain":"走散時待在原地大聲呼喊，大人更容易找到你。"},{"q":"放颱風假的時候，小宇待在家裡，下面哪個做法最好？","options":["關好門窗，聽爸媽和氣象的提醒","跑去河邊玩水看溪水漲多高","自己出門去山上玩"],"answer":0,"explain":"颱風天關好門窗、待在家裡最安心，不去海邊河邊才安全。"},{"q":"在操場上玩的時候突然打雷了，最好趕快躲到哪裡？","options":["空曠的操場中間","室內或硬頂的車子裡","大樹下面"],"answer":1,"explain":"打雷時趕快進到室內或車子裡，才不會被雷打到。"},{"q":"打雷時，下面哪個地方一定要遠離？","options":["室內的房間","電線桿和高高的大樹","有屋頂的家裡"],"answer":1,"explain":"打雷時要遠離大樹、電線桿這些高高的東西，因為容易被雷打到。"},{"q":"在外面走路時聽到打雷，附近沒有房子，小庭應該怎麼做？","options":["停在原地躲到大樹下","繼續往最近的室內移動，遠離空曠地和大樹","站在空曠的田野中間等雨停"],"answer":1,"explain":"聽到打雷不要停，趕快往最近的室內移動並遠離大樹，才能躲開雷擊。"}],"communication":[{"q":"同樣一句「我沒事」，怎麼說最可能代表對方其實心裡有事？","options":["用輕快、大方的聲音說","用很小聲、慢慢的語氣，眼神還往下看","一邊笑一邊說","說完馬上跑去玩"],"answer":1,"explain":"聽語氣、看表情，不只聽字面，就更能讀懂對方真正的心情。"},{"q":"走進教室，發現大家突然都安靜下來、氣氛怪怪的。最體貼的第一步是？","options":["大聲問「你們在幹嘛？」","先安靜觀察一下氣氛，別急著大聲說笑","馬上講個笑話讓大家開心","假裝沒看到繼續做自己的事都不理人"],"answer":1,"explain":"先安靜讀一下氣氛，就不會不小心踩到別人的心情。"},{"q":"朋友一直不太想講話、把身體轉開、低著頭。這些身體訊號通常代表什麼？","options":["他很想跟你聊天","他可能心情不好或不想講話","他覺得你很好笑","他在等你送他禮物"],"answer":1,"explain":"身體語言會透露心情，讀懂之後少說多陪，就是最溫暖的做法。"},{"q":"看出朋友正在難過時，下面哪個做法最體貼？","options":["一直追問「你到底怎麼了啦」","少說多陪，安靜坐旁邊或遞張衛生紙","跟他說「這沒什麼好難過的」","馬上換個超好笑的話題轉移他"],"answer":1,"explain":"讀懂情緒後用行動關心，安靜的陪伴常常比很多話更有力量。"},{"q":"當你心裡冒出「怪怪的、我不想跟他走」的感覺時，最好怎麼做？","options":["先相信這個感覺，保護自己","罵自己想太多，硬把感覺壓下去","一定要先找到證據才可以離開","覺得不好意思，就勉強留下來"],"answer":0,"explain":"心裡「怪怪的」是身體給的保護鈴，感覺不對就有權利保護自己。"},{"q":"在外面覺得有個人讓你很不安全，這時候往哪裡走比較安全？","options":["跟著他走到人少安靜的地方","往店員、警衛或人多明亮的地方走","躲到沒有人的角落自己待著","站在原地不動，等他先離開"],"answer":1,"explain":"拉開距離、走向人多的地方，安全永遠比怕尷尬更重要。"},{"q":"有個大人給你禮物，還小聲說「這是我們的祕密，不可以告訴爸媽」。這時候最該做的是？","options":["乖乖保守這個祕密","覺得毛毛的，回家把整件事告訴爸媽或老師","把禮物收好就當沒事","自己一個人默默想清楚就好"],"answer":1,"explain":"要你瞞著爸媽保守祕密是危險訊號，講給可信的大人聽永遠是對的。"},{"q":"下面哪一個是需要提高警覺的危險訊號？","options":["老師在課堂上請大家一起打掃","陌生大人一直要你單獨跟他走、別告訴爸媽","同學邀你下課一起在操場玩","媽媽叫你幫忙拿碗筷"],"answer":1,"explain":"認得出危險訊號，就能在感覺不對時及早保護自己。"},{"q":"同學不小心弄倒你的水壺，弄濕了作業。用「我訊息」表達，下面哪句最好？","options":["你很煩耶，走開啦！","作業被弄濕了，我有點著急，可以幫我一起擦乾嗎？","你就是個冒失鬼！","你每次都這樣，最討厭了！"],"answer":1,"explain":"說事實、加感受、再提出請求，對方比較聽得進去。"},{"q":"「我訊息」和「你訊息」最大的不同是什麼？","options":["我訊息講自己的感受和需要，不是罵對方是什麼樣的人","我訊息就是講話比較大聲","我訊息一定要先道歉","我訊息就是什麼都不說忍下來"],"answer":0,"explain":"說出自己的感受而不是指責對方，問題才真的有機會解決。"},{"q":"很生氣、怕自己說出難聽話時，用「我訊息」可以怎麼先處理？","options":["趕快把心裡的氣全部罵出來","先說「我現在有點生氣，需要一點時間，等一下再談」","假裝沒事，把氣悶在心裡","直接說「都是你害的」"],"answer":1,"explain":"先喊暫停、冷靜後再談，這不是逃避，而是很負責任的做法。"},{"q":"下面哪一句是「描述行為」而不是「貼標籤」，比較不會讓人覺得被否定？","options":["你就是個懶惰的人","這次的分工你還沒做完，我有點擔心來不及","你這個人真沒用","你根本什麼都不會"],"answer":1,"explain":"講具體的那件事，對方才知道怎麼改，這就是好好說話的祕訣。"},{"q":"同學上台報告講得有點結巴，你覺得他準備不夠。下面哪個反應最不會刺傷人又能幫到他？","options":["當眾說「你也太爛了吧」","私下跟他說「下次我們可以一起多練幾次」","在台下笑他","跟旁邊的人講他好丟臉"],"answer":1,"explain":"要提醒就私下說、保住對方的面子，他會更願意進步。"},{"q":"開口前先過一個「濾網」，要問自己哪三件事？","options":["這句話夠不夠大聲、夠不夠快、夠不夠兇","這句話是真的嗎？是善意的嗎？是必要的嗎？","有沒有人聽到、會不會被罵、好不好笑","對方會不會哭、會不會生氣、會不會告狀"],"answer":1,"explain":"說話前先過濾一下，就能在快說出傷人的話前踩剎車。"},{"q":"下面哪一種話最容易刺傷人、點燃衝突？","options":["嘲笑別人的外表、揭人瘡疤、詛咒別人","說「謝謝你幫我」","說「我們一起想辦法吧」","說「你今天看起來很開心」"],"answer":0,"explain":"這些話攻擊的是別人的自尊，認得出它們就能避開衝突地雷。"},{"q":"如果你不小心說出了傷人的話，最好的補救方式是？","options":["裝作沒說過","越快真誠道歉越好，說「對不起，我不是那個意思」","再說一句更兇的把場面壓過去","叫對方也不要太計較"],"answer":1,"explain":"話收不回，但真誠道歉可以修補關係。"},{"q":"班上群組裡有人貼某個同學的糗照，一堆人跟著留言嘲笑。你最好的做法是？","options":["跟著留言比較好玩","不跟風、不轉傳，私下傳訊息關心被笑的同學，並告訴大人","把糗照轉給更多人看","按個讚就好，反正不是我先開始的"],"answer":1,"explain":"不起鬨就是一種幫忙，私下關心對方，能讓網路變得更友善。"},{"q":"如果你被陌生帳號一直傳很難聽、羞辱你的訊息，下面哪個順序最能保護自己？","options":["自己一個人硬撐，什麼都不說","先截圖存證，封鎖對方，再告訴信任的大人","回傳更難聽的話罵回去","刪掉訊息假裝沒發生過"],"answer":1,"explain":"截圖、封鎖、再告訴大人，這不是告狀，而是保護自己的方法，沒有人需要一個人扛。"},{"q":"在網路上打字，為什麼很容易被誤會？","options":["因為文字看不到表情、聽不到語氣","因為網路很慢","因為大家都不識字","因為手機螢幕太小"],"answer":0,"explain":"文字看不到表情、聽不到語氣，怕誤會時可以加表情符號或直接說「我是開玩笑的喔」。"},{"q":"有人在網路上說你很難聽的話，你越看越難過。下面哪個想法最健康？","options":["他說的一定都是真的，我就是那樣的人","被罵的話不等於事實，那是他的問題，不是我的價值","我要罵回去讓他也難過","我以後都不敢再上網了"],"answer":1,"explain":"被罵的話不等於事實，一個人的價值不是別人一句話能決定的。"},{"q":"被同學故意撞一下、還笑著挑釁「怎樣，不爽喔？」你火氣一下衝上來。最好的做法是？","options":["馬上推回去讓他也痛","先深呼吸、平靜地說「我不想吵」然後走開","大聲罵他一頓","揪一群人去堵他"],"answer":1,"explain":"不接對方的挑釁，這場架就吵不起來，能忍住脾氣是很有力量的事。"},{"q":"被激怒、最想爆炸的那幾秒，先按下「暫停鍵」有什麼好處？","options":["讓最衝的怒氣先降下來，避免做出後悔的事","代表你輸了、很懦弱","讓對方以為你怕他","沒有任何用處"],"answer":0,"explain":"先暫停不是輸，而是能當自己情緒的主人。"},{"q":"就算「是對方先開始的」，如果你動手打回去，通常會怎樣？","options":["一定沒事，因為錯的是他","你也變成衝突的一部分，一樣可能被處罰","大家都會覺得你很威風","問題馬上就解決了"],"answer":1,"explain":"一旦出手就很難說得清，先離開、事後找大人處理最好。"},{"q":"坐你前面的同學突然大叫，把桌上的東西往外丟。你第一件該做的事是？","options":["衝上去把他抓住制止他","先往後退、離開東西丟得到的範圍","拿出手機錄影","大聲笑他發瘋"],"answer":1,"explain":"先拉開距離保護自己最重要，這是保護大家的第一步。"},{"q":"同學情緒爆發、現場有點危險時，下面哪個做法對？","options":["留在原地圍觀看熱鬧","護住頭臉、退到安全處，並趕快去找老師來","自己上前跟他講道理","跟著大家一起嗆他"],"answer":1,"explain":"護住頭、退開、找大人，把幫助他的工作交給老師。"},{"q":"有人起鬨說「他每次都這樣，超怪的，大家一起看他發瘋！」你怎麼回應比較好？","options":["跟著一起笑他","說「不要這樣，他可能只是很難受」，安靜保持距離等老師來","拍手叫大家繼續看","也上去說幾句氣他的話"],"answer":1,"explain":"用同理、不歧視的眼光看待同學，不刺激他才是真正的善良。"},{"q":"班上新來一位坐輪椅的同學，有人偷偷笑他、學他的樣子。你最好怎麼做？","options":["跟著一起學他好玩","說「不要這樣講啦」，走過去陪他，並告訴老師","假裝沒看到就好","也在旁邊指指點點"],"answer":1,"explain":"不參與嘲笑、主動釋出善意，一份接納可能就是他一整天的溫暖。"},{"q":"同理心指的是什麼？","options":["願意停下來想想「如果我是他，我會有什麼感覺」","什麼事都聽別人的","把自己的想法強加給別人","覺得別人都跟自己一樣"],"answer":0,"explain":"願意換位思考，就會發現很多『怪』其實只是『不一樣』而已。"},{"q":"發現同學跟你「不一樣」（例如講話有口音、家裡狀況不同），最尊重的想法是？","options":["他好奇怪，離他遠一點","他跟我們不太一樣，但那沒關係","一定要糾正他變得跟大家一樣","拿他的不同來取笑"],"answer":1,"explain":"把『不一樣』當成『特別』，這樣的班級才會讓大家都安心。"},{"q":"關於「生氣、難過、害怕、嫉妒」這些情緒，下面哪句話是對的？","options":["這些情緒本身沒有好壞、沒有對錯，是正常的","有這些情緒代表你是壞小孩","好孩子不可以有這些情緒","有情緒就要馬上發洩出來"],"answer":0,"explain":"情緒沒有對錯，看懂它、幫它取名字，就比較不會被情緒牽著走。"},{"q":"下面哪一句最符合「情緒沒有對錯，但行為有分別」？","options":["可以生氣，但不可以打人","生氣了就一定要摔東西","難過就要一直哭到別人受不了","嫉妒就要去破壞對方的東西"],"answer":0,"explain":"感覺可以有，但怎麼表現出來是可以選擇的。"},{"q":"心裡有很強的情緒時，「先幫它命名」有什麼好處？","options":["光是說出「我現在很生氣」，強度常常就降一半","會讓情緒變得更嚴重","會被別人笑","一點用都沒有"],"answer":0,"explain":"先停下來說出感覺，情緒就沒那麼容易牽著你走。"},{"q":"你和同學越吵越兇，氣到很想動手。下面哪個是可以馬上用的冷靜方法？","options":["深呼吸、對自己說「我需要冷靜一下」，先離開現場","更用力吼回去","把桌子拍得很大聲","衝過去推他一把"],"answer":0,"explain":"先幫大腦踩剎車、離開刺激源，冷靜下來才想得出好辦法。"},{"q":"「5-4-3-2-1」冷靜法是怎麼做的？","options":["說出看到的5樣、聽到的4種、摸到的3樣、聞到的2種、嚐到的1種","從1快速數到5就好","把生氣的事講5遍","跳5下就結束"],"answer":0,"explain":"用感官把注意力拉回現在，緊張感會慢慢降下來，好用又免費。"},{"q":"下面哪一個是能幫自己冷靜、又不用道具的好方法？","options":["慢慢深呼吸，把吐氣拉長","把心裡的氣全部發洩在別人身上","一直想那件讓你生氣的事","把作業本撕掉"],"answer":0,"explain":"把吐氣拉長，身體會跟著慢下來，這個方法隨時都能用。"},{"q":"電動一直過不了關，氣到很想罵「這遊戲爛死了！」把手把一丟。比較好的做法是？","options":["繼續怪遊戲、怪手把","先深呼吸冷靜一下，再把最卡的一小段拆出來練","直接放棄再也不玩","去怪旁邊的人吵到你"],"answer":1,"explain":"怪東西不會讓關卡變簡單，把力氣留下來再試一次才會慢慢變強。"},{"q":"遇到很難的事、覺得自己做不到時，對自己說哪句話比較好也比較正確？","options":["我很爛，我就是不行","我還沒學會，再試一次","反正我一定做不到","這件事本來就是為難我"],"answer":1,"explain":"一個「還」字，就把「永遠不會」變成「現在正在學」。"},{"q":"覺得一件事「太難了」的時候，其實常常代表什麼？","options":["你壞掉了、沒救了","你的大腦正在長新東西，這是學會的必經過程","你應該馬上放棄","這件事不值得做"],"answer":1,"explain":"覺得難，正是在進步；很厲害的人也都是失敗很多次才變厲害的。"},{"q":"考單字時前面都對，寫到第八個發現拼錯了一個，心裡冒出「我全錯了，不想考了」。比較好的做法是？","options":["就此放棄不寫了","告訴自己「我只錯一個，其他都做到了」，把後面能做對的先完成","把整張都劃掉重來","生氣地把筆丟掉"],"answer":1,"explain":"一個錯，擋不住其他做對的努力，部分成功也是成功。"},{"q":"「只要錯一個，就等於整份都失敗、全毀了。」這個想法對不對？","options":["對，錯一個就沒救了","不對，這是「非黑即白」的想法，一個錯抹不掉你做對的一大堆","對，一定要滿分才算成功","不對，因為根本不會有人錯"],"answer":1,"explain":"把做對的地方數出來，常會發現其實已經完成了好多。"},{"q":"鋼琴比賽表演到一半不小心彈錯一個音，很懊惱。這時候最好的做法是？","options":["停下來不彈了","深呼吸，把那個錯放著，繼續把後面彈完","當場哭出來離開舞台","生氣地重頭再彈一次"],"answer":1,"explain":"別因為一個錯就停擺，把剩下的完成就好。"}],"selfmgmt":[{"q":"小柔一想到要背明天要考的國語課文，就覺得「好難喔」，結果先跑去餵魚、又整理抽屜。她真正卡住的原因最可能是什麼？","options":["她天生就是懶惰的小孩","她的大腦想逃開「怕背不起來」那種不舒服的感覺","餵魚和整理抽屜比背課文更重要","她永遠都不會背好課文了"],"answer":1,"explain":"拖延常常不是懶，而是大腦想逃開「怕做不好」那種不舒服的感覺。看懂這一點，就不必再罵自己了。"},{"q":"阿哲發現自己一直不想寫作文，靜下來想一想，原來是「題目太大，不知道要寫什麼」。找出這個原因對他有什麼幫助？","options":["知道自己很沒用","知道要放棄這篇作文","知道卡住的地方，才知道怎麼幫自己起步","證明他就是個愛拖延的人"],"answer":2,"explain":"先找出卡在哪裡，才知道怎麼幫自己起步；知道原因就能對症下藥。"},{"q":"妹妹遇到一題數學怎麼想都不會，於是一直拖著不寫。以下哪個做法最聰明？","options":["硬盯著題目，什麼都不做","跟大人或老師說「這題我不會，可以陪我看一下嗎」","假裝作業寫完了","把整本作業都不寫了"],"answer":1,"explain":"太難就開口求助，這一點都不丟臉，反而是聰明的選擇。"},{"q":"小賢寫評量寫到一半覺得好無聊，很想放下不寫。下面哪個做法可以讓「繼續下去」沒那麼痛苦？","options":["乾脆整晚都不寫了","一邊生氣一邊罵自己笨","配一個計時或放點喜歡的音樂，讓自己動起來","等到明天早上再一次趕完"],"answer":2,"explain":"太無聊就幫自己加點小陪伴，讓開始變得輕鬆一些。"},{"q":"同樣是面對還沒寫的作業，哪一句話對正在逃避的自己最有幫助？","options":["「我怎麼這麼懶，真是沒救了。」","「我不是懶，只是這件事讓我有點怕，先動一小步看看。」","「反正我就是做不好，不做了。」","「等我心情好再說吧。」"],"answer":1,"explain":"溫柔地接納自己、再起個頭，比一直罵自己更能往前走。"},{"q":"小美要做一份「我的家鄉」報告，覺得好大一團、完全不敢動手。下面哪個起步方式最好？","options":["等到心情很好、很有靈感的那一天再做","把它拆成小步驟，先只做「寫下題目」這一小塊","一次逼自己把整份報告寫完","先跟同學說這份報告太難做不完"],"answer":1,"explain":"任何大事都能拆成一階一階的小步，踏出第一步就沒那麼可怕了。"},{"q":"哥哥要練鋼琴卻一直不想開始。他決定用「先做 5 分鐘就好」。這個方法最主要在幫他克服什麼？","options":["練得比別人久","「開始」這個最難的部分","一次就把整首曲子彈到完美","永遠不用休息"],"answer":1,"explain":"「開始」往往是最難的一關，先做五分鐘，常常就自然做下去了。"},{"q":"小安脫下來的襪子丟在地上，他想「等一下再收」，其實彎腰撿起來放進洗衣籃只要十幾秒。根據「兩分鐘法則」，他該怎麼做？","options":["等到睡前一起收","現在立刻收好，不要讓它排隊等他","明天再說","等媽媽提醒再收"],"answer":1,"explain":"兩分鐘內能做完的小事現在就做掉，事情才不會越堆越多。"},{"q":"小婷把「做勞作」拆成好幾個小步驟，每做完一步就打一個勾。看著勾勾一個個變多，會帶來什麼好處？","options":["讓她越做越有動力繼續往下做","讓作業變得更難","讓她想直接放棄","浪費很多時間"],"answer":0,"explain":"每打一個勾都是一份小小成就感，會讓人越做越起勁。"},{"q":"阿凱寫一大張複習卷，一直想著「還有好多好多沒寫」，越想越煩、越不想動。比較好的想法是？","options":["把整張卷子的每一題同時都想一遍","只專心看「下一題」就好，做完再看下一題","算算看還剩幾題才能休息","想著寫不完會被罵"],"answer":1,"explain":"只看下一步，不去想「還有好多沒做」，心才不會被壓垮。"},{"q":"「早上先把最醜的青蛙吃掉」這句話是在提醒我們什麼？","options":["早餐要吃青蛙","每天先做那件最不想做、卻最重要的事","先做最簡單的事就好","把重要的事留到最後做"],"answer":1,"explain":"先解決最難的那一件，一整天都會覺得輕鬆，因為最重的石頭放下了。"},{"q":"阿樂今天最重要的是訂正一大題錯很多的數學，但他一直先削鉛筆、排桌面、看課外書，還覺得「我很認真啊」。這其實是什麼情形？","options":["他真的很認真","他用簡單的小事在逃避那件真正該做的事","削鉛筆比訂正數學重要","他今天沒事情要做"],"answer":1,"explain":"小心「假裝很忙」的陷阱，看穿它，就能把力氣放在真正該做的事上。"},{"q":"小恩發現最重要的那件事（複習明天要考的社會）好大，一想到就不敢開始。他該怎麼吃掉這隻大青蛙？","options":["先做別的簡單事，社會最後再說","把它拆成小步、先讀五分鐘看看","乾脆不複習了","等媽媽逼他才讀"],"answer":1,"explain":"青蛙很大時，先拆小步、先做五分鐘，一樣是在吃青蛙。"},{"q":"為什麼建議把最難、最重要的事排在一天的最前面先做？","options":["因為那時候精神最好、干擾最少，最容易解決它","因為那件事其實不重要","因為早上做事不算數","因為做完就可以不用睡覺"],"answer":0,"explain":"趁精神最好時先解決最難的，剩下的事就會變得輕鬆又愉快。"},{"q":"小傑好不容易把今天最難的作文寫完了。這時候他對自己說哪句話最合適？","options":["「反正一定寫得很爛。」","「最難的已經解決了，剩下的當獎勵慢慢做。」","「我怎麼拖這麼久才寫。」","「其他的乾脆都別做了。」"],"answer":1,"explain":"做完最難的那件事，記得給自己一句肯定。"},{"q":"小杰寫作業時把手機放在桌子旁邊，說「我不會去看啦」，結果手機一響就忍不住拿起來。比較好的做法是？","options":["把手機開靜音，放到看不到、拿不到的另一個房間或抽屜","把手機音量開到最大提醒自己別看","一邊寫一邊回訊息","邊寫邊放旁邊，靠意志力忍住"],"answer":0,"explain":"先把會分心的東西移開，比硬靠忍耐輕鬆多了，也更容易專心。"},{"q":"關於「番茄鐘」（專心一段時間、時間到就休息），下面哪個觀念是對的？","options":["休息是偷懶，最好都不要休息","排進休息才不會累垮，休息是聰明不是偷懶","一次要專心好幾個小時不能停","休息時要一直滑手機"],"answer":1,"explain":"專注力像手機電量，適時休息才充得回來。"},{"q":"為什麼「一邊寫作業一邊看電視」通常會又慢又容易出錯？","options":["因為電視會把作業寫完","因為注意力一直被搶走，被打斷後要花好幾分鐘才能重新專心","因為看電視會讓人變聰明","因為作業本身太簡單"],"answer":1,"explain":"把干擾移開、專心一小段，做事會又快又好，還多出時間去玩。"},{"q":"小圓正在番茄鐘的專心時段裡，突然想到「等等要記得帶美勞用具」。她最好怎麼處理？","options":["馬上放下作業去準備美勞用具","把它寫在紙上，等休息或做完再處理","一直想著這件事，沒辦法專心","乾脆結束今天的作業"],"answer":1,"explain":"專心時段只做一件事，雜事先記在紙上，專注就不會被打斷。"},{"q":"番茄鐘的 5 分鐘休息時間到了，下面哪個休息方式最能幫助小明再次專心？","options":["滑手機遊戲，結果停不下來","喝水、走動一下、看看遠方","開始看一部很長的卡通","跟朋友講很久的電話"],"answer":1,"explain":"真正的休息是讓身心放鬆一下，這樣下一輪才更有精神。"},{"q":"小雨每次想到要練直笛就說「等一下再說」，結果都拖到睡前才慌張地練。為什麼「等一下」常常沒用？","options":["因為未來的你，跟現在的你一樣不想做","因為直笛不需要練習","因為等一下就會自動練完","因為晚上練最好"],"answer":0,"explain":"打敗「等一下」最好的方法，就是現在先做一小步。"},{"q":"阿明覺得很難開始寫日記，他決定用「倒數 5 秒」的方法。這個方法怎麼用？","options":["心裡數 5、4、3、2、1，數到 1 就立刻開始動手","數到 5 之後再想要不要做","倒數五次深呼吸就去睡覺","數五秒後決定放棄"],"answer":0,"explain":"倒數到 1 就起跑，不給自己想東想西的空間，是很有效的起步方法。"},{"q":"阿光寫報告一直改來改去，覺得「不夠完美就不能交」，結果永遠寫不完。比較健康的想法是？","options":["一定要 100 分才可以交","做完 80 分，好過永遠停在腦中的 100 分","改到最後一秒才交","覺得自己很差就不交了"],"answer":1,"explain":"目標是「完成」不是「完美」，先做完就是很好的一步。"},{"q":"小樺常常覺得「怎麼做都不夠好、很難開始，好痛苦」。這種時候最好怎麼辦？","options":["這是她自己的錯，只能硬撐","跟大人或老師說，一起找方法，對自己溫柔一點","假裝沒這回事","從此都不做那件事"],"answer":1,"explain":"覺得很痛苦並不是誰的錯，說出來、找人幫忙，對自己溫柔一點會更好。"},{"q":"小豪想主動安排自己的功課時間，不要每次都被媽媽催。下面哪個做法最能做到這件事？","options":["主動跟媽媽說「我八點前會把功課寫完」，然後盡力做到","等媽媽催了再開始","跟媽媽說「我不想寫」","把功課藏起來假裝寫完"],"answer":0,"explain":"把模糊的「等一下」換成清楚的時間點並做到，就能慢慢握回自己的方向盤。"},{"q":"你答應爸爸「八點前寫完功課」，結果一直分心拖到快八點半還沒寫完。下次可以怎麼做比較好？","options":["以後都不要跟爸爸約定","先把功課切成小步、先寫十分鐘，並在專心時把干擾移開","把時間改成半夜十二點","乾脆不寫了"],"answer":1,"explain":"把大事切小步、先動起來，再把干擾移開，說到做到就會越來越容易。"},{"q":"小玲把該寫的評量寫完後才去玩最愛的積木。她發現這樣玩起來比平常更盡興，這是為什麼？","options":["因為積木變好玩了","因為沒有一件事懸在心上，玩得特別放鬆安心","因為玩之前做事會累到玩不動","因為她其實不喜歡玩積木"],"answer":1,"explain":"先做完該做的、再把想做的當獎勵，玩起來才真正踏實又安心。"}]};
  function $(id){ return document.getElementById(id); }
  function loadProg(){ try{ return JSON.parse(localStorage.getItem(PROG_KEY)) || {lessons:{}}; }catch(e){ return {lessons:{}}; } }
  function saveProg(p){ try{ localStorage.setItem(PROG_KEY, JSON.stringify(p)); }catch(e){} }
  var prog = loadProg();
  if(!prog.lessons) prog.lessons = {};

  // 不依賴 Math.random 的確定性洗牌（以索引擾動；答案以原字串索引 data-orig 比對，不受洗牌影響）
  function shuffleOptions(opts, seed){
    var arr = opts.map(function(o,i){ return {o:o,i:i}; });
    for(var k=arr.length-1;k>0;k--){ seed=(seed*9301+49297)%233280; var j=Math.floor(seed/233280*(k+1)); var t=arr[k];arr[k]=arr[j];arr[j]=t; }
    return arr;
  }

  // ---------- 選單 ----------
  // filterKey 為某個 area key 時只渲染該分組（深連結直達用）；不給則渲染全部四大主題。
  function renderMenu(filterKey){
    var host = $('area-list'); host.innerHTML='';
    var areasToShow = AREAS;
    if(filterKey){
      areasToShow = AREAS.filter(function(a){ return a.key===filterKey; });
      if(!areasToShow.length){ areasToShow = AREAS; filterKey = null; }
    }
    if(filterKey){
      var toAll = document.createElement('button');
      toAll.type='button'; toAll.className='btn'; toAll.id='btn-all-areas';
      toAll.style.marginBottom='var(--s4)';
      toAll.textContent='← 查看全部安全主題';
      toAll.addEventListener('click', function(){ renderMenu(); });
      host.appendChild(toAll);
    }
    areasToShow.forEach(function(area){
      var lessons = SAFETY_DATA[area.key] || [];
      var doneCount = lessons.filter(function(l){ return prog.lessons[l.id] && prog.lessons[l.id].done; }).length;
      var sec = document.createElement('div'); sec.className='sf-area';
      var head = document.createElement('div'); head.className='sf-area-head';
      head.innerHTML = '<span class="sf-area-title">'+area.emoji+' '+area.label+'</span>'+
                       '<span class="sf-area-count">'+doneCount+' / '+lessons.length+'</span>';
      sec.appendChild(head);
      var grid = document.createElement('div'); grid.className='sf-grid';
      lessons.forEach(function(l){
        var done = prog.lessons[l.id] && prog.lessons[l.id].done;
        var btn = document.createElement('button'); btn.type='button';
        btn.className='sf-card'+(done?' done':'');
        btn.innerHTML = '<span class="sf-c-emoji" aria-hidden="true">'+l.emoji+'</span>'+
          '<span class="sf-c-title">'+l.title+'</span>'+
          '<span class="sf-c-state">'+(done?'✓ 學過了':'去學')+'</span>';
        btn.setAttribute('aria-label', l.title + (done?'（已學過）':''));
        btn.addEventListener('click', function(){ openLesson(area.key, l.id); });
        grid.appendChild(btn);
      });
      sec.appendChild(grid);
      host.appendChild(sec);
    });
  }

  // ---------- 教學 + 練習流程 ----------
  var cur = null; // {area, lesson, phase:'teach'|'quiz', qIndex, correctCount, answered}
  function openLesson(areaKey, lessonId){
    var lessons = SAFETY_DATA[areaKey] || [];
    var lesson = null; for(var i=0;i<lessons.length;i++){ if(lessons[i].id===lessonId){ lesson=lessons[i]; break; } }
    if(!lesson) return;
    cur = { area:areaKey, lesson:lesson, phase:'teach', qIndex:0, correctCount:0, answered:false };
    $('play-title').textContent = lesson.emoji + ' ' + lesson.title;
    showScreen('play');
    renderTeach();
  }
  function showScreen(name){
    $('screen-menu').classList.toggle('active', name==='menu');
    $('screen-play').classList.toggle('active', name==='play');
    $('screen-review').classList.toggle('active', name==='review');
    try{ window.scrollTo(0,0); }catch(e){}
  }
  function renderDots(){
    var total = cur.lesson.quiz.length; var d=$('dots'); d.innerHTML='';
    if(cur.phase!=='quiz'){ d.style.display='none'; return; }
    d.style.display='flex';
    for(var i=0;i<total;i++){ var el=document.createElement('i'); if(i<=cur.qIndex) el.className='on'; d.appendChild(el); }
  }
  function renderTeach(){
    cur.phase='teach'; renderDots();
    var l = cur.lesson;
    var howHtml = '<ol class="sf-how">' + l.how.map(function(s){ return '<li>'+s+'</li>'; }).join('') + '</ol>';
    // 漸進式揭示：一次先只出現一小段，點「繼續」再展開下一段，最後才出練習鈕，
    // 避免一進來就是一大片字讓孩子跳過不讀（教學內容不變，只改節奏）。
    var steps = [
      '<div class="sf-block"><div class="sf-block-label">為什麼要注意？</div><div class="sf-block-text">'+l.why+'</div></div>',
      '<div class="sf-block warn"><div class="sf-block-label">如果不這麼做，可能會…</div><div class="sf-block-text">'+l.consequence+'</div></div>',
      '<div class="sf-block"><div class="sf-block-label">可以怎麼做？</div>'+howHtml+'</div>'
    ];
    var step = 0;
    function paint(){
      var last = step >= steps.length - 1;
      var btn = last
        ? '<button type="button" class="btn btn-primary" id="btn-startquiz">我懂了，來練習 ✏️</button>'
        : '<button type="button" class="btn btn-primary" id="btn-next-teach">繼續 ➡️</button>';
      $('stage').innerHTML =
        '<div class="sf-teach">' +
          '<div class="sf-t-emoji" aria-hidden="true">'+l.emoji+'</div>' +
          '<h2>'+l.title+'</h2>' +
          steps.slice(0, step + 1).join('') +
          '<div class="sf-actions">'+btn+'</div>' +
        '</div>';
      if (last) {
        $('btn-startquiz').addEventListener('click', function(){ cur.phase='quiz'; cur.qIndex=0; cur.correctCount=0; renderQuiz(); });
      } else {
        $('btn-next-teach').addEventListener('click', function(){ step++; paint(); });
      }
    }
    paint();
  }
  function renderQuiz(){
    cur.answered=false; renderDots();
    var q = cur.lesson.quiz[cur.qIndex];
    var shown = shuffleOptions(q.options, (cur.qIndex+1)*7 + q.q.length);
    var optHtml = shown.map(function(x){
      return '<button type="button" class="sf-opt" data-orig="'+x.i+'">'+x.o+'</button>';
    }).join('');
    $('stage').innerHTML =
      '<div class="sf-teach">' +
        '<div class="sf-q">第 '+(cur.qIndex+1)+' / '+cur.lesson.quiz.length+' 題<br>'+q.q+'</div>' +
        optHtml +
        '<div class="sf-reveal" id="reveal" aria-live="polite"></div>' +
        '<div class="sf-actions" id="q-actions" style="display:none"><button type="button" class="btn btn-primary" id="btn-nextq"></button></div>' +
      '</div>';
    var opts = $('stage').querySelectorAll('.sf-opt');
    Array.prototype.forEach.call(opts, function(btn){
      btn.addEventListener('click', function(){ answer(btn, q, opts); });
    });
  }
  function answer(btn, q, opts){
    if(cur.answered) return; cur.answered=true;
    var chosen = parseInt(btn.getAttribute('data-orig'),10);
    var correct = (chosen === q.answer);
    if(correct) cur.correctCount++;
    try { if (window.Game && typeof Game.pingActive === 'function') Game.pingActive(); } catch(e){}  // 安全模組不發 XP，但作答＝當日有學習（且此為首訪 hero 推薦的第一個活動），維持每日連續 streak（只續火焰、不計分）
    Array.prototype.forEach.call(opts, function(b){
      var oi = parseInt(b.getAttribute('data-orig'),10);
      if(oi===q.answer) b.classList.add('correct');
      else if(b===btn) b.classList.add('wrong');
      b.disabled = true;
    });
    var rev = $('reveal');
    rev.textContent = (correct ? '答對了！👍 ' : '沒關係～正確答案是這個喔！') + q.explain;
    rev.classList.add('show');
    var act = $('q-actions'); act.style.display='flex';
    var next = $('btn-nextq');
    var last = (cur.qIndex >= cur.lesson.quiz.length-1);
    next.textContent = last ? '完成這個主題 🎉' : '下一題 ➡️';
    next.onclick = function(){
      if(last){ finishLesson(); }
      else { cur.qIndex++; renderQuiz(); }
    };
    try{ next.focus(); }catch(e){}  // 作答後焦點移到「下一題」，便於鍵盤／螢幕閱讀器操作
  }
  function finishLesson(){
    var l = cur.lesson;
    prog.lessons[l.id] = { done:true, correct:cur.correctCount, total:l.quiz.length };
    saveProg(prog);
    $('dots').style.display='none';
    $('stage').innerHTML =
      '<div class="sf-teach" style="text-align:center">' +
        '<div class="sf-t-emoji" aria-hidden="true">🎉</div>' +
        '<h2>學會了！你更懂得保護自己了</h2>' +
        '<div class="sf-block"><div class="sf-block-text">這個主題答對了 '+cur.correctCount+' / '+l.quiz.length+' 題。記得把學到的方法用在生活裡喔！</div></div>' +
        '<div class="sf-actions"><button type="button" class="btn btn-primary" id="btn-tomenu">回主題選單</button></div>' +
      '</div>';
    $('btn-tomenu').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });
  }

  $('btn-back').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });

  // ================= 綜合複習：交錯出題、可反覆重來 =================
  // 題庫來源＝各主題「已教過並校對過」的 quiz（單一真實來源），外加一份專為複習加寫的 REVIEW_EXTRA。
  // 兩者都標上所屬領域，出題時打散並「盡量讓相鄰題來自不同領域」（交錯練習，interleaving）。
  var AREA_LABEL = {}; AREAS.forEach(function(a){ AREA_LABEL[a.key] = { label:a.label, emoji:a.emoji }; });
  // 複習題脫離原課程情境單獨出現，把少數「用今天學到的觀念」這類承接語去掉，讓題目能獨立閱讀（不動教學模式原文）。
  function stemForReview(s){
    return s.replace(/用今天學到的觀念[，、]?/g,'').replace(/用今天的方法[，、]?/g,'');
  }
  function harvestPool(){
    var pool = [];
    AREAS.forEach(function(a){
      (SAFETY_DATA[a.key]||[]).forEach(function(t){
        (t.quiz||[]).forEach(function(q){
          if(q.sensitive) return;  // 自傷/求助等最沉重的題目不進「計分、可重來」的綜合複習池，只留在原課程完整關懷情境中
          pool.push({ q:stemForReview(q.q), options:q.options, answer:q.answer, explain:q.explain, domain:a.key });
        });
      });
    });
    // 加寫的複習題（若有），同樣標領域
    Object.keys(REVIEW_EXTRA).forEach(function(dk){
      (REVIEW_EXTRA[dk]||[]).forEach(function(q){
        if(q.sensitive) return;  // 與 SAFETY_DATA 同一道防線：加寫題若標記敏感也絕不進計分複習池
        pool.push({ q:q.q, options:q.options, answer:q.answer, explain:q.explain, domain:dk });
      });
    });
    return pool;
  }
  // 以種子擾動的洗牌（每輪用不同種子 → 每次重來題序都不同）
  function seededShuffle(arr, seed){
    var a = arr.slice();
    for(var k=a.length-1;k>0;k--){ seed=(seed*9301+49297)%233280; var j=Math.floor(seed/233280*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    return a;
  }
  // 交錯排列：貪婪地讓相鄰題盡量來自不同領域
  function interleave(items){
    var buckets = {}; items.forEach(function(it){ (buckets[it.domain]=buckets[it.domain]||[]).push(it); });
    var out = [], lastDomain = null, remaining = items.length;
    while(remaining>0){
      var keys = Object.keys(buckets).filter(function(k){ return buckets[k].length; });
      // 優先選「和上一題不同領域、且剩最多」的桶；避免尾端被迫連續同領域
      keys.sort(function(x,y){ return buckets[y].length - buckets[x].length; });
      var pick = null;
      for(var i=0;i<keys.length;i++){ if(keys[i]!==lastDomain){ pick=keys[i]; break; } }
      if(pick===null) pick = keys[0];
      out.push(buckets[pick].shift()); lastDomain = pick; remaining--;
    }
    return out;
  }
  var rv = null; // {queue, idx, correct, answered}
  var rvSeed = 20250822;
  function openReviewMenu(){
    showScreen('review');
    $('review-title').textContent = '綜合複習 🎯';
    var total = harvestPool().length;
    var lens = [
      { n:10, emoji:'⚡', title:'快速複習・10 題', sub:'花幾分鐘，暖身檢查一下' },
      { n:20, emoji:'🎯', title:'標準複習・20 題', sub:'跨主題交錯，紮實驗收' },
      { n:30, emoji:'🏆', title:'挑戰複習・30 題', sub:'想多練一點就選這個' }
    ];
    var cards = lens.map(function(o){
      return '<button type="button" class="sf-len" data-n="'+o.n+'">'+
        '<span class="sf-len-emoji" aria-hidden="true">'+o.emoji+'</span>'+
        '<span><span class="sf-len-title">'+o.title+'</span><br><span class="sf-len-sub">'+o.sub+'</span></span>'+
      '</button>';
    }).join('');
    $('review-stage').innerHTML =
      '<div class="sf-teach">'+
        '<div class="sf-t-emoji" aria-hidden="true">🎯</div>'+
        '<h2>綜合複習・驗收學習</h2>'+
        '<div class="sf-block"><div class="sf-block-text">這裡會把各安全主題的題目<b>打散、交錯</b>出給你，每一輪的題目和順序都不一樣。答錯不要緊，看完說明再想一次就好——重點是把保護自己的本領記牢。目前題庫共有 <b>'+total+'</b> 題。</div></div>'+
        '<div class="sf-len-grid">'+cards+'</div>'+
      '</div>';
    Array.prototype.forEach.call($('review-stage').querySelectorAll('.sf-len'), function(b){
      b.addEventListener('click', function(){ startReview(parseInt(b.getAttribute('data-n'),10)); });
    });
  }
  function startReview(n){
    var pool = harvestPool();
    if(!pool.length){ openReviewMenu(); return; }
    rvSeed = (rvSeed*9301 + 49297) % 233280;  // 每輪換種子（溢位安全）→ 題目與順序每輪不同
    n = Math.min(n, pool.length);
    // 先依領域分組並各自洗牌，再「輪流」從各領域抽題，確保短輪次也能橫跨各主題（不被大領域灌滿）
    var byDom = {}; pool.forEach(function(q){ (byDom[q.domain]=byDom[q.domain]||[]).push(q); });
    var domKeys = Object.keys(byDom);
    domKeys.forEach(function(k,i){ byDom[k] = seededShuffle(byDom[k], rvSeed + i*131 + 17); });
    domKeys = seededShuffle(domKeys, rvSeed + 7);
    // picked.length < pool.length 保證仍有非空的桶，輪流一圈內必取到一題 → 不會空轉
    var picked = [], di = 0;
    while(picked.length < n && picked.length < pool.length){
      var dk = domKeys[di % domKeys.length];
      if(byDom[dk] && byDom[dk].length) picked.push(byDom[dk].shift());
      di++;
    }
    var queue = interleave(picked);
    if(!queue.length){ openReviewMenu(); return; }
    rv = { queue:queue, idx:0, correct:0, answered:false };
    renderReviewQ();
  }
  function renderReviewQ(){
    rv.answered = false;
    var item = rv.queue[rv.idx];
    var total = rv.queue.length;
    var pct = Math.round(rv.idx/total*100);
    var meta = AREA_LABEL[item.domain] || {label:'安全',emoji:'🛡️'};
    var shown = shuffleOptions(item.options, (rv.idx+1)*13 + item.q.length + rvSeed%97);
    var optHtml = shown.map(function(x){ return '<button type="button" class="sf-opt" data-orig="'+x.i+'">'+x.o+'</button>'; }).join('');
    $('review-stage').innerHTML =
      '<div class="sf-teach">'+
        '<div class="sf-rv-bar">'+
          '<div class="sf-rv-track"><div class="sf-rv-fill" style="width:'+pct+'%"></div></div>'+
          '<span class="sf-rv-score">第 '+(rv.idx+1)+'/'+total+' 題 · 答對 '+rv.correct+'</span>'+
        '</div>'+
        '<span class="sf-rv-tag"><span aria-hidden="true">'+meta.emoji+'</span> '+meta.label+'</span>'+
        '<div class="sf-q">'+item.q+'</div>'+
        optHtml+
        '<div class="sf-reveal" id="rv-reveal" aria-live="polite"></div>'+
        '<div class="sf-actions" id="rv-actions" style="display:none"><button type="button" class="btn btn-primary" id="btn-rv-next"></button></div>'+
      '</div>';
    var opts = $('review-stage').querySelectorAll('.sf-opt');
    Array.prototype.forEach.call(opts, function(btn){
      btn.addEventListener('click', function(){ answerReview(btn, item, opts); });
    });
  }
  function answerReview(btn, item, opts){
    if(rv.answered) return; rv.answered = true;
    var chosen = parseInt(btn.getAttribute('data-orig'),10);
    var correct = (chosen === item.answer);
    if(correct) rv.correct++;
    try { if (window.Game && typeof Game.pingActive === 'function') Game.pingActive(); } catch(e){}
    Array.prototype.forEach.call(opts, function(b){
      var oi = parseInt(b.getAttribute('data-orig'),10);
      if(oi===item.answer) b.classList.add('correct');
      else if(b===btn) b.classList.add('wrong');
      b.disabled = true;
    });
    var rev = $('rv-reveal');
    rev.textContent = (correct ? '答對了！👍 ' : '沒關係～正確答案是這個喔！ ') + item.explain;
    rev.classList.add('show');
    var fill = $('review-stage').querySelector('.sf-rv-fill');  // 作答後把進度條推進到「已完成這題」
    if(fill) fill.style.width = Math.round((rv.idx+1)/rv.queue.length*100)+'%';
    var act = $('rv-actions'); act.style.display='flex';
    var next = $('btn-rv-next');
    var last = (rv.idx >= rv.queue.length-1);
    next.textContent = last ? '看成績 🎉' : '下一題 ➡️';
    next.onclick = function(){ if(last){ finishReview(); } else { rv.idx++; renderReviewQ(); } };
    try{ next.focus(); }catch(e){}  // 作答後把焦點移到「下一題」，鍵盤／螢幕閱讀器不必重新尋找
  }
  function finishReview(){
    var total = rv.queue.length, got = rv.correct;
    var pct = Math.round(got/total*100);
    var msg, emoji;
    if(pct>=90){ emoji='🏆'; msg='太厲害了！這些保護自己的本領，你幾乎都記住了。'; }
    else if(pct>=70){ emoji='🌟'; msg='很棒！大部分都答對了，把答錯的再看一次就更完整囉。'; }
    else if(pct>=50){ emoji='💪'; msg='不錯的開始！多複習幾輪，會越來越熟練。'; }
    else { emoji='🌱'; msg='沒關係，複習就是用來練習的。回主題再看一看，然後再來挑戰一次！'; }
    $('review-stage').innerHTML =
      '<div class="sf-teach" style="text-align:center">'+
        '<div class="sf-t-emoji" aria-hidden="true">'+emoji+'</div>'+
        '<h2>這一輪答對 '+got+' / '+total+' 題</h2>'+
        '<div class="sf-block"><div class="sf-block-text">'+msg+'</div></div>'+
        '<div class="sf-actions">'+
          '<button type="button" class="btn btn-primary" id="btn-rv-again">再來一輪 🔄</button>'+
          '<button type="button" class="btn" id="btn-rv-menu">回主題選單</button>'+
        '</div>'+
      '</div>';
    $('btn-rv-again').addEventListener('click', function(){ startReview(total); });  // 立即再來同長度的一輪（重洗題目與順序），符合「再來一輪」
    $('btn-rv-menu').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });
  }
  $('btn-open-review').addEventListener('click', function(){ openReviewMenu(); });
  $('btn-review-back').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });

  // 載入時的 hash 路由：#personal / #home / #emergency / #outdoor（#traffic 為 outdoor 別名）
  // 直接渲染對應分組；無對應 hash 則維持原本的全部主題選單。
  function areaFromHash(){
    var raw = (window.location.hash || '').replace(/^#/, '').toLowerCase();
    return HASH_TO_AREA[raw] || null;
  }
  var initialHash = (window.location.hash || '').replace(/^#/, '').toLowerCase();
  var initialArea = areaFromHash();
  showScreen('menu');
  renderMenu(initialArea);
  if(initialHash === 'review'){ openReviewMenu(); }  // 首頁「綜合複習」卡片深連結 → 直接開複習
})();
</script>
