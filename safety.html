  // 綜合複習專用加寫題庫（各領域），與各主題已校對的 quiz 一起組成複習題庫。
  var REVIEW_EXTRA = {"personal":[{"q":"剛買了一支新手機，在公車上你想拿出來玩，怎麼做比較安全？","options":["把手機收在包包裡，到家再玩","舉高給整車的人看它多新","大聲跟旁邊的人說這支很貴"],"answer":0,"explain":"貴重東西收好、不在外面炫耀，才不會被有壞念頭的人盯上。"},{"q":"同學好奇地問你：『你爸媽一個月賺多少錢啊？』你怎麼回答比較好？","options":["把爸媽的薪水通通說出來","笑一笑說『我不太清楚耶』","說『我家超有錢，比你家多很多』"],"answer":1,"explain":"家裡的錢是自己家的事，笑著帶過就好，低調一點反而更安全也更有禮貌。"},{"q":"生日拿到一條金項鍊，戴去學校時同學圍過來看，下面哪個想法最好？","options":["把它借給大家輪流戴著到處走","低調收好，不特別拿出來炫耀","大聲說這條要好幾萬塊"],"answer":1,"explain":"把值錢的東西收好、不張揚，就不容易被有壞念頭的人盯上，這樣最安全。"},{"q":"遊戲群組裡一個沒見過面的網友問你：『你家住哪？家裡有什麼值錢的東西？』你該怎麼做？","options":["把住址和家裡的東西都告訴他","不告訴他這些私密的事","傳一張家裡客廳的照片給他"],"answer":1,"explain":"家住哪、家裡有什麼都是祕密，不告訴網路上不認識的人才安全。"},{"q":"下面哪一項是應該保密、不隨便告訴同學或陌生人的？","options":["你最喜歡的卡通","家裡的鑰匙藏在哪、爸媽的信用卡號碼","你今天午餐吃什麼"],"answer":1,"explain":"鑰匙位置、密碼和信用卡號碼是家裡的重要祕密，守好它就是保護全家。"},{"q":"路上一個不認識的阿姨遞給你一杯飲料說『天氣熱，請你喝』，你該怎麼做？","options":["馬上接過來一口喝掉","禮貌地說『謝謝，不用了』，不收也不喝","先喝一半再問她是誰"],"answer":1,"explain":"陌生人給的東西禮貌婉拒就好，這樣就不會被有壞念頭的人騙。"},{"q":"一個叔叔開車停在你旁邊說：『上車，我載你一程比較快。』你不認識他，怎麼做才對？","options":["上車，因為走路很累","不上車，快步往人多的地方走","先坐上去再打電話問媽媽"],"answer":1,"explain":"不認識的人要載你，就不上車並往人多的地方走，這樣最能保護自己。"},{"q":"跟不認識的大人說話時，站在什麼位置比較安全？","options":["靠近他的車門邊","保持一個手臂以上、可以隨時跑開的距離","跟他一起走進沒人的角落"],"answer":1,"explain":"保持距離、站在能隨時跑開的地方，遇到狀況才有機會離開。"},{"q":"一個陌生人蹲下來說：『我家的小狗走丟了，你跟我來幫忙找好不好？』你該怎麼做？","options":["馬上跟他走去找狗","說要先打電話問爸媽，並離開往人多的地方","自己一個人跑去暗巷幫他找"],"answer":1,"explain":"大人有事應該找大人幫忙，先問爸媽並離開才不會被騙走。"},{"q":"在百貨公司裡你需要幫忙，找下面哪一種人比較安全？","options":["站在門口的陌生人","櫃檯人員、店員或穿制服的工作人員","剛好經過、看起來很兇的人"],"answer":1,"explain":"找店員、櫃檯或穿制服的工作人員求助最安全，因為他們能提供可靠的幫助。"},{"q":"放學路上一個陌生人說：『你媽媽很忙，叫我來接你回家。』你該怎麼做？","options":["跟他走，因為他知道我媽媽","說『我要先打電話問我爸媽』並馬上離開往人多處","上他的車等媽媽打來"],"answer":1,"explain":"就算對方說是爸媽叫來的，也要先自己打電話確認並離開，這樣最安全。"},{"q":"每天走同一條路上學時，養成什麼習慣以後比較不容易迷路？","options":["一路低頭盯著手機","抬頭記住便利商店、公園、大招牌這些好記的地標","閉上眼睛用走的"],"answer":1,"explain":"多留意沿路的地標，萬一走錯路也能靠記憶找回去。"},{"q":"要跟大人說清楚回家的路時，下面哪一句最能幫上忙？","options":["『就那樣走一走就到了』","『在7-11那個路口右轉，再走一點就到』","『我也不知道怎麼走』"],"answer":1,"explain":"記住關鍵的轉彎和地標，就能把位置說清楚，別人才幫得上你。"},{"q":"走在常走的路上時，怎麼做比較記得住路、也比較安全？","options":["一直低頭看手機遊戲","多留意周圍，看看沿路有什麼","戴著眼罩走"],"answer":1,"explain":"走路時多注意四周，才記得住路，也能及早發現狀況。"},{"q":"萬一跟家人走散、需要請警察幫忙，事先記住什麼會很有用？","options":["自己家的地址和附近的大地標","全班同學的座號","電視上最新的廣告詞"],"answer":0,"explain":"記住住家地址和附近大地標，就能告訴警察你住哪一區，幫忙找到家。"},{"q":"為什麼平常上下學要留意沿路的便利商店、公園這些明顯地標？","options":["因為它們很漂亮","萬一走錯路或迷路，可以靠這些記憶找回去","因為老師規定要背"],"answer":1,"explain":"記住地標就像在心裡畫了一張地圖，迷路時能幫你找到方向。"},{"q":"回家有兩條路，一條是有店家、路燈、人多的大馬路，一條是又暗又沒人但比較近的巷子，你該走哪條？","options":["走又暗又沒人的近路","走有店家、路燈、人多的大馬路","隨便挑一條都行"],"answer":1,"explain":"人多明亮的路上有人看得到、能幫忙，就算多走一點也值得。"},{"q":"天色暗了要走回家，下面哪個做法比較安全？","options":["和同學或家人一起走，不落單","自己一個人抄偏僻的近路","在沒人的公園多待一會兒"],"answer":0,"explain":"天黑後和同學或家人一起走、不落單，遇到狀況才有人在身邊。"},{"q":"一個人走在路上時，把耳機音量開到很大好不好？","options":["很好，這樣走路才不無聊","不好，聽不到旁邊的動靜比較危險","沒差，音量大小都一樣"],"answer":1,"explain":"音量開太大會讓你聽不到周圍的聲音，把音量調小才能注意到旁邊的狀況。"},{"q":"走到某個地方，心裡突然覺得『怪怪的、讓我不舒服』，這時候最好怎麼做？","options":["假裝沒事繼續待著","相信自己的感覺，離開那裡到明亮的地方","留下來看看到底哪裡怪"],"answer":1,"explain":"覺得不對勁時相信自己的感覺並離開，是保護自己很重要的能力。"},{"q":"為什麼人多、明亮的地方通常比暗暗沒人的地方安全？","options":["因為那裡比較涼快","因為有很多人看得到、能幫忙","因為那裡有很多好吃的"],"answer":1,"explain":"人多明亮的地方有人能看到你、幫助你，這就是它比較安全的原因。"},{"q":"走路時你發現好像有人一直跟著你，最好往哪裡走？","options":["往沒人的暗巷跑","往人多、明亮的便利商店或店家走","直接一個人快步走回家"],"answer":1,"explain":"往人多明亮的地方走能找到人幫忙，別往沒人的地方、也別直接回家。"},{"q":"覺得被跟蹤而走進一家商店，你可以怎麼跟店員說？","options":["什麼都不說，站著發呆","跟店員說『我覺得有人跟著我，可以幫我嗎？』並打給家人","偷偷從後門自己溜走"],"answer":1,"explain":"把狀況告訴店員並打電話給家人，就有大人能幫你。"},{"q":"在大賣場逛著逛著，一回頭發現跟爸媽走散了，你該怎麼做？","options":["自己跑到賣場外面找他們","待在原地或找櫃檯、穿制服的工作人員幫忙","跟著旁邊一個好心的陌生人離開賣場"],"answer":1,"explain":"留在原地或找櫃檯人員幫忙，爸媽最容易找到你。"},{"q":"老師常說要背下至少一位家人的電話號碼，這是為什麼？","options":["為了考試會考","需要時可以請大人幫你打電話聯絡家人","因為背電話很好玩"],"answer":1,"explain":"記住家人的電話，走散或需要幫忙時就能請大人幫忙聯絡上家人。"},{"q":"如果真的很危險，有陌生人想抓你走，你可以怎麼做來引起旁邊的人注意？","options":["安靜地跟著他走","大聲喊『救命！我不認識他！』","小小聲地說話怕吵到別人"],"answer":1,"explain":"大聲喊出來讓周圍的人注意到你，是遇到危險時保護自己的好方法。"},{"q":"過年收到很多紅包，回學校後同學問你『你總共拿到多少錢？』，怎麼回答比較好？","options":["笑著說『大家差不多啦』，帶過去就好，不用講清楚金額","很得意地把每一包多少錢都算給大家聽","說出總金額，還說錢放在書包哪一格"],"answer":0,"explain":"紅包多少是自己家裡的事，不用讓大家都知道。輕鬆帶過既不會傷和氣，也不會讓別人惦記你身上有多少錢，這就是財不露白。"},{"q":"你穿了一雙很貴的新球鞋去學校，別班同學跑來說『借我穿去操場走一圈給大家看』，比較好的做法是？","options":["立刻脫下來借他，越多人看到越好","禮貌說『這是我自己要穿的』，不用特地拿去給大家展示","大聲說這雙要好幾千塊，讓大家都羨慕"],"answer":1,"explain":"東西好不好穿自己知道就好，不需要特地炫耀或到處展示。低調一點，別人比較不會盯上你的東西，你也不會因為借出去弄丟而難過。"},{"q":"家裡剛買了很大的新電視，你想拍照PO到網路上，怎麼做比較好？","options":["拍下來，還寫上住址說『歡迎來我家看』","把家裡所有新買的東西都拍一輪貼上去","跟家人商量後，就算要分享也不寫出住址、不強調家裡有多少貴重東西"],"answer":2,"explain":"網路上什麼人都看得到。讓陌生人知道你家有貴重東西又知道住在哪，是很危險的。分享前先問家人，也不要把住址和值錢的東西一起公開。"},{"q":"同學好奇地問『你家是住透天還是大樓？有幾間房間啊？』，怎麼回答比較安全？","options":["說『就普通住的地方啦』，家裡格局不用講得太詳細","畫張平面圖，把每間房間都標清楚給他看","詳細說幾樓、幾間房、爸媽房間在哪"],"answer":0,"explain":"家裡的格局是很私人的事，講得太清楚沒有好處。輕鬆帶過就好，這樣就算對方只是好奇，你也保護了自己家的隱私。"},{"q":"你戴了新的智慧手錶去學校，午休時想拿出來玩，怎麼做比較好？","options":["站到走廊上大聲說這支多少錢，招呼大家來看","在座位上安靜看時間就好，不用刻意秀給全班看","借給每個想玩的同學輪流拿去別班"],"answer":1,"explain":"貴重的東西低調使用最安全。刻意炫耀容易讓人惦記，四處借出也容易弄丟或摔壞。自己好好用、不張揚，才是聰明的做法。"},{"q":"放學時一個不認識的大姐姐在校門口說『你長得好可愛，我幫你拍照就送你貼紙』，你該怎麼做？","options":["馬上擺姿勢讓她拍，還說出自己的名字","跟她走到旁邊沒人的地方拍比較好看","說『謝謝，我不用』，快步走回導護老師或同學那邊"],"answer":2,"explain":"不認識的人用禮物或拍照當理由靠近你，要特別小心。禮貌拒絕、走回有大人和同學的地方最安全，不需要因為對方稱讚你就相信他。"},{"q":"路上一個陌生人叫得出你的名字，說『你爸媽今天很忙，叫我來帶你』，你該怎麼做？","options":["不跟他走，趕快到附近的店家或找認識的大人，打電話問爸媽","因為他知道我的名字，就放心跟他走","上他的車，路上再打電話問"],"answer":0,"explain":"壞人有時會先打聽到你的名字，讓你以為他認識你。真正來接你的人，爸媽一定會事先告訴你。叫得出名字不代表安全，先找大人、打電話向爸媽確認才對。"},{"q":"你在網路上認識的網友說『我們見面玩吧，你自己一個人來就好，不要跟爸媽講』，你該怎麼做？","options":["偷偷一個人去，見面才刺激","絕對不自己去，先告訴爸媽，讓爸媽知道並決定","約在很晚、沒什麼人的地方見面"],"answer":1,"explain":"網路上看不到對方真正是誰。特別交代『不要跟爸媽講、自己來』就是危險的訊號。一定要讓爸媽知道，由大人陪同或幫你判斷，才不會讓自己陷入危險。"},{"q":"電梯門一開，裡面只有一個你不認識、感覺怪怪的大人，你正要上樓，怎麼做比較安全？","options":["先進去再說，反正很快就到","跟他一起進去，站在最裡面的角落","說『我等下一班』，讓電梯先走，或去找別人一起搭"],"answer":2,"explain":"和陌生人單獨待在密閉的電梯裡，萬一有事很難求救。心裡覺得怪怪的時候，寧可多等一下下一班，或等有其他人再一起搭，安全比省時間重要。"},{"q":"一個陌生人手上提著很多東西，說『小朋友力氣真大，幫我把這箱搬到我車上好嗎？』，你該怎麼做？","options":["說『不好意思我要回家了』，不靠近他的車，去找附近的大人","很熱心地幫他搬到車子旁邊","搬到一半覺得怪怪的再跑走"],"answer":0,"explain":"大人真的需要幫忙，會找其他大人，而不是找小孩。用『幫忙』把你騙到車子旁是常見的手法。禮貌拒絕、不靠近車子，才不會被帶走。"},{"q":"陌生人拿出一張券，說『掃這個QR code就送你遊戲點數，來我這邊掃』，你該怎麼做？","options":["馬上拿手機去掃，免費的不拿白不拿","說『我不用』，不掃、不靠近，回家跟爸媽說有這件事","先跟他走到旁邊再決定要不要掃"],"answer":1,"explain":"用『免費點數』當誘餌，是想讓你靠近或騙走你的資料。天下沒有白吃的午餐，不掃、不靠近、回家告訴爸媽，才不會上當或被帶離安全的地方。"},{"q":"一個陌生人神色緊張地說『你爸爸出車禍了，快上我的車，我帶你去醫院！』，你該怎麼做？","options":["很緊張地馬上跟他上車","邊哭邊跟他走，路上再想辦法","先冷靜，不上車，趕快找附近的大人幫忙打電話給家人確認"],"answer":2,"explain":"壞人常用『家人出事』讓你太緊張而忘了判斷。真正有急事，家人或學校會透過你認得的人聯絡。越急越要先停下來，找大人幫忙打電話確認，不要立刻上陌生人的車。"},{"q":"第一天要自己走去新的安親班，怎麼做以後比較不會迷路？","options":["路上留意明顯的招牌、便利商店、轉彎的地方，記在心裡","低頭一直看手機導航就好，路邊什麼都不用看","反正跟著感覺走，記不記得都沒關係"],"answer":0,"explain":"手機可能沒電，只靠它很危險。把沿路的大招牌、商店、轉彎處記下來，變成自己心裡的地圖，就算手機不能用，你也知道自己在哪、怎麼回家。"},{"q":"要跟家人去人很多的遊樂園玩，出發前最好先做什麼？","options":["什麼都不用約，走散了再慢慢找","先和家人約好『如果走散了，就在大門口的服務台等』","約好走散就各自回家"],"answer":1,"explain":"人多的地方最容易走散。出發前先約定一個明顯又固定的集合點，萬一分開了，大家都知道去哪裡會合，就不會慌張亂跑，很快就能找到彼此。"},{"q":"老師說最好記住自己家的完整地址，這是為什麼？","options":["只是要考試用的，平常沒什麼用","背地址會讓壞人更容易找到你，所以不要背","萬一走失或需要大人幫忙時，可以正確說出家在哪裡"],"answer":2,"explain":"知道自己家的完整地址，走失或遇到狀況時，才能清楚告訴警察或幫忙的大人你要回哪裡。這是幫助自己回家的重要資訊，當然要記熟。"},{"q":"跟家人搭捷運出門，到站下車前，記住什麼對回程比較有幫助？","options":["記住是從幾號出口出來的，還有出口附近有什麼","什麼都不用記，回來再問路人","把整條路線圖背下來才行"],"answer":0,"explain":"記住自己走的是幾號出口、附近有什麼明顯的店或招牌，回程就能找到正確的入口，不會走錯方向。抓住幾個關鍵地標，比死背整張圖更實用。"},{"q":"你在外面迷路了，遇到警察想請他幫忙送你回家，怎麼說最能幫上忙？","options":["只說『我要回家』，其他都答不出來","說出自己的名字、家人的電話，還有家附近的地標","一直哭，什麼都不講"],"answer":1,"explain":"能說出名字、家人電話和家附近的明顯地標，大人才知道要怎麼聯絡你的家人、送你回哪裡。平常把這些記熟，緊張的時候才講得出來。"},{"q":"一個人在公車站等車，站在哪裡比較安全？","options":["躲到旁邊暗暗、沒人的樹叢後面等","走到馬路上站著，車來比較看得到","站在有其他人、燈光明亮的候車亭裡"],"answer":2,"explain":"待在明亮、有其他人的地方，萬一有狀況比較有人看得到、幫得上忙。躲到暗處反而讓自己孤立又危險，站到馬路上更容易發生意外。"},{"q":"一個人走路回家時，一直低頭看手機好不好？","options":["不好，最好收起手機，注意四周和來往的車","很好，這樣走路比較不無聊","戴上耳機開很大聲，邊走邊看更好"],"answer":0,"explain":"一直看手機或戴耳機開很大聲，會讓你注意不到周圍發生什麼事，也聽不到車子或有人靠近。走路時抬頭留意四周，才能及早發現危險、保護自己。"},{"q":"天色已經暗了，回家有兩個選擇，怎麼走比較安全？","options":["穿過又暗又沒人的公園，比較快到家","走有路燈、有店家、人比較多的大路，雖然遠一點","翻牆抄捷徑，最快"],"answer":1,"explain":"天黑時，明亮、有人、有店家的路最安全，遇到狀況隨時找得到人幫忙。為了早幾分鐘而走陰暗無人的地方，反而讓自己暴露在危險裡，晚一點到家沒關係。"},{"q":"走在人行道上，怎麼走比較安全？","options":["靠著建築物、避開暗暗的巷口，注意前後有沒有人","專挑沒人的小路走，比較清靜","一路貼著停在路邊的車子中間穿來穿去"],"answer":0,"explain":"走在明亮、開闊、看得清楚四周的地方最安全。避開暗巷口、注意前後，遇到狀況才反應得過來。專走沒人的小路或在車陣中穿梭，都會讓自己更危險。"},{"q":"在熱鬧的夜市裡，一回頭發現和家人走散了，你該怎麼做？","options":["自己在人群裡到處亂鑽，邊走邊找","待在原地或走到店家，請店員幫忙打電話給家人，不要越走越遠","跟著看起來很親切的陌生人離開夜市去找"],"answer":1,"explain":"越走越亂，反而更難和家人會合。留在原地或找店家這種固定又安全的地方請大人幫忙聯絡家人最好，也絕對不要跟不認識的人離開現場。"},{"q":"你走在路上，發現有一輛車一直用很慢的速度跟在你旁邊，你該怎麼做？","options":["停下來看看車裡的人想幹嘛","加快腳步繼續往前，不理它就好","往和車子相反的方向走，走進有人的店家或找大人幫忙"],"answer":2,"explain":"車子調頭比人慢，往相反方向走可以爭取時間。趕快走進有人的店家或找大人，讓自己身邊有人，比一個人繼續往前或停下來查看安全得多。"},{"q":"和家人走散時，有人說『我帶你去找你爸媽』，但你不認識他，怎麼做才對？","options":["不跟他走，去找店員、警察或戴識別證的工作人員幫忙","跟他走，反正是去找爸媽","讓他牽著你的手一起去廣播"],"answer":0,"explain":"走散時最怕被不認識的人趁機帶走。就算對方說要帶你找爸媽，也不要跟他走，而是去找店員、警察或有識別證的工作人員，由他們幫你廣播、聯絡家人。"},{"q":"你覺得後面好像有人一直跟著你，這時候怎麼做比較好？","options":["回頭大聲罵他，叫他不要跟","走進最近有人的商店，跟店員說『我覺得有人跟著我，可以陪我一下嗎』","裝作沒事，繼續走進沒人的小巷確認"],"answer":1,"explain":"覺得被跟蹤時，最重要的是讓自己身邊有大人。走進有人的店家、直接請店員幫忙最安全。走進沒人的地方或去激怒對方，都會讓自己更危險。"},{"q":"在外面需要找大人幫忙時，找下面哪一種人通常比較安全？","options":["穿制服的警察、店員，或帶著小孩的爸爸媽媽","剛好路過、看起來很急的陌生人","主動一直靠過來要幫你的陌生人"],"answer":0,"explain":"穿制服的人員、店家或帶著孩子的家長，身分比較清楚、也比較好求助。反而是主動一直靠過來、太熱心的陌生人要小心，不一定安全。"},{"q":"你自己在公園玩，找不到帶你來的阿嬤了，附近可以找誰幫忙比較好？","options":["找一個獨自坐在角落、招手叫你過去的陌生人","找公園裡穿背心的清潔或管理人員、或帶小孩的家長","自己走出公園沿路找"],"answer":1,"explain":"公園的工作人員或帶著孩子的家長比較好辨認、也願意幫忙。自己走出公園容易越走越遠，跟著招手的陌生人離開更危險，留在原地找可靠的大人最好。"},{"q":"上下學途中如果遇到麻煩，除了警察，還可以找誰幫忙？","options":["看起來凶凶、不想理你的路人","躲起來誰都不找","路口指揮交通的導護老師或導護志工、便利商店的店員"],"answer":2,"explain":"上下學路上，導護老師、導護志工和便利商店都是很好的求助對象，他們熟悉附近環境也願意幫忙。遇到麻煩時勇敢開口找對的人，比自己躲起來安全得多。"},{"q":"為什麼找『穿制服、有識別證的人』求助，通常比隨便找一個路人好？","options":["因為他們的身分比較清楚，也有責任幫忙、比較好找到","因為他們一定長得比較好看","其實沒有差，隨便找誰都一樣"],"answer":0,"explain":"警察、站務員、店員這些有制服或識別證的人，身分清楚、待在固定的地方，遇到事情也有責任幫你處理。找他們比找來歷不明的陌生人更安心可靠。"},{"q":"萬一有陌生人硬要拉你走，附近又有其他人，你可以怎麼做來讓大家注意到？","options":["安靜地跟著走，怕吵到別人","大聲喊『我不認識你！救命！』，用力掙脫、往人多的地方跑","小小聲地說不要，希望他放手"],"answer":1,"explain":"遇到危險時，你的安全最重要，不用怕吵到別人。大聲喊出『我不認識你』能讓旁邊的人知道不對勁而過來幫忙，用力掙脫、往人多的地方跑，才能保護自己。"}],"home":[{"q":"小明剛從公園玩完回到家，正想拿餅乾來吃，這時候他最應該先做什麼？","options":["先去洗手，再拿餅乾吃","直接拿餅乾吃比較快","把手在褲子上擦一擦就好"],"answer":0,"explain":"玩完回家手上病菌最多，先洗手再吃東西才能保護自己。"},{"q":"用肥皂洗手時，除了手心，還有哪些地方也要記得搓乾淨？","options":["只要搓手心就夠了","手背、指縫和指甲縫都要搓到","只要把手指尖沖一下"],"answer":1,"explain":"手背、指縫和指甲縫都藏著病菌，通通搓到才乾淨。"},{"q":"洗完手把泡泡沖乾淨後，接下來怎麼做最好？","options":["用乾淨的毛巾或紙巾把手擦乾","甩一甩手就好，不用擦","直接放進口袋裡讓它自己乾"],"answer":0,"explain":"洗完手用乾淨的毛巾或紙巾把手擦乾，手才會清清爽爽。"},{"q":"在教室裡突然很想打噴嚏，手邊剛好沒有衛生紙，怎麼做最不會傳染給同學？","options":["對著前面的同學打出來","用手掌摀住嘴巴後繼續摸東西","用手肘內側遮住口鼻"],"answer":2,"explain":"沒有衛生紙時用手肘內側遮住口鼻，就不會把病菌傳給大家。"},{"q":"小華感冒了還是要去上學，下面哪個做法最能照顧自己也保護別人？","options":["把用過的衛生紙塞回口袋重複用","戴上口罩、多休息，用過的衛生紙丟進垃圾桶","忍著不咳嗽也不擤鼻涕"],"answer":1,"explain":"生病時戴口罩、多休息，用過的衛生紙丟進垃圾桶，可以減少把病菌傳給別人。"},{"q":"小美洗完手還沒擦乾，就想去拔牆上的插頭，這樣做安全嗎？","options":["安全，濕手拔比較快","不安全，應該先把手擦乾再碰插頭","只要動作快一點就沒關係"],"answer":1,"explain":"水會讓電跑得更快，先把手擦乾再碰插頭才安全。"},{"q":"弟弟拿著一根鐵絲，想插進插座的洞裡看看會怎樣，你應該怎麼提醒他？","options":["告訴他不可以，任何東西都不能插進插座的洞裡","叫他小心一點插就好","幫他一起插進去看看"],"answer":0,"explain":"手指、鐵絲或任何東西都不能插進插座，插進去會觸電，很危險。"},{"q":"要把插頭從插座拔下來時，下面哪個做法才正確？","options":["拉著電線用力扯下來","捏住插頭本體往外拉","用腳把電線踢掉"],"answer":1,"explain":"捏住插頭本體往外拉，才不會弄壞電線。"},{"q":"地上有一個電風扇不小心泡到水了，這時候最好怎麼辦？","options":["趕快用手把它撿起來","不要碰它，請大人來處理","自己拿去插電看看還能不能用"],"answer":1,"explain":"電器泡到水不要碰，請大人來處理最安全。"},{"q":"在同一個插座上接了很多電器，摸起來燙燙的還有燒焦味，這代表什麼？","options":["很正常，電器本來就會燙","有危險，要馬上告訴大人","只要吹一吹讓它涼就好"],"answer":1,"explain":"插座發燙又有燒焦味可能會起火，這時候要馬上告訴大人。"},{"q":"一走進廚房就聞到像臭雞蛋的味道，這時候絕對不可以做哪件事？","options":["去開電燈或打開抽風機","打開窗戶讓空氣流通","大聲告訴大人"],"answer":0,"explain":"聞到瓦斯味時開電器或電燈會產生小火花，可能引起危險，所以絕對不可以開。"},{"q":"聞到臭雞蛋般的瓦斯味時，下面哪個做法可以讓空氣變好？","options":["把窗戶和門都關得緊緊的","趕快打開窗戶和門，讓空氣流通","點一根蠟燭把味道蓋掉"],"answer":1,"explain":"打開窗戶和門讓空氣流通，瓦斯才會散掉。"},{"q":"關於一種叫「一氧化碳」的氣體，下面哪一句是對的？","options":["它有很臭的味道，很好認","它沒有味道，吸太多會頭暈想睡","它聞起來很香，可以多吸幾口"],"answer":1,"explain":"一氧化碳沒有味道卻很危險，所以保持通風最重要。"},{"q":"冬天洗澡在用瓦斯熱水器時，窗戶應該怎麼處理比較安全？","options":["把窗戶全部關死才不會冷","讓窗戶保持通風，不要全部關死","用膠帶把窗縫都貼起來"],"answer":1,"explain":"使用瓦斯熱水器時保持通風、不要把窗戶全部關死，空氣才會流通。"},{"q":"在家裡覺得頭暈、想睡覺，又聞到怪怪的味道，這時候可以先怎麼做？","options":["躺下來睡一覺就好","先到室外呼吸新鮮空氣，並找大人幫忙","把窗戶關起來繼續待著"],"answer":1,"explain":"頭暈想睡又聞到怪味時，先到室外呼吸並找大人。"},{"q":"在桌上看到一瓶顏色鮮豔、像果汁的液體，可是你不認識它，最安全的做法是？","options":["不打開、不聞、也不嚐，去問大人","先聞聞看是不是果汁","喝一小口試試味道"],"answer":0,"explain":"不認識的瓶罐不打開、不聞、不嚐，先去問大人最安全。"},{"q":"小安生病了需要吃藥，下面哪個做法才對？","options":["自己覺得多吃幾顆會好得快","由大人拿給你，照大人說的份量吃","把藥當糖果配果汁吃"],"answer":1,"explain":"吃藥要由大人拿給你、照份量吃，不可以自己多吃。"},{"q":"瓶子上畫著骷髏頭或打叉的圖案，這是在告訴我們什麼？","options":["這是好玩的貼紙，可以撕下來玩","裡面的東西很危險，不要碰","代表這瓶東西特別好吃"],"answer":1,"explain":"骷髏頭或打叉是危險的警告，看到就不要碰它。"},{"q":"媽媽把漂白水裝在瓶子裡，下面哪個做法最不會讓人認錯而喝到？","options":["倒進喝完的飲料瓶裡放冰箱","放在原本的瓶子裡，不要倒進飲料瓶","裝在透明的水杯裡放桌上"],"answer":1,"explain":"清潔劑放在原本的瓶子裡，才不會被當成飲料喝掉。"},{"q":"如果不小心碰到或吃到不該碰的清潔劑或藥，接下來最重要的是什麼？","options":["自己躲起來不要讓大人知道","趕快告訴大人，說清楚碰到或吃了什麼","假裝沒事繼續玩"],"answer":1,"explain":"趕快告訴大人並說清楚吃了什麼，大人才能幫你。"},{"q":"小傑自己在家，門鈴響了，他從貓眼看出去是不認識的人，這時候怎麼做最好？","options":["不開門，可以說「爸媽在忙，現在不方便開門」","馬上把門打開讓對方進來","大聲說「家裡只有我一個人」"],"answer":0,"explain":"不認識就不開門，這樣說既有禮貌又安全。"},{"q":"自己在家時接到陌生電話，對方問「家裡大人在不在」，怎麼回答比較安全？","options":["說「只有我一個人在家」","說「爸媽現在不方便接，等一下回你」","把家裡地址告訴對方"],"answer":1,"explain":"不說只有你一個人在家，這樣回答最安全。"},{"q":"家裡發生火災需要打電話求救時，應該撥打哪個號碼？","options":["119（火災救護）","隨便按幾個數字","先掛掉再說"],"answer":0,"explain":"火災或需要救護時打 119，這是重要的求救號碼。"},{"q":"把爸媽的電話和110、119這些重要號碼寫下來以後，放在哪裡最好？","options":["藏在抽屜最裡面","貼在看得到的地方，需要時方便打電話","丟進垃圾桶"],"answer":1,"explain":"把重要號碼貼在看得到的地方，急的時候才找得到。"},{"q":"一個人在家肚子有點餓，想煮點東西吃，下面哪個做法最安全？","options":["自己開瓦斯爐煮東西","不用瓦斯爐、不玩火，吃不用煮的東西","點火烤東西來吃"],"answer":1,"explain":"自己在家不用瓦斯爐、不玩火，選不用煮的東西最安全。"},{"q":"自己在家時看到窗外有可疑的人在徘徊，心裡覺得害怕，可以怎麼辦？","options":["自己跑出去看個清楚","打電話給爸媽，或找信任的鄰居、大人幫忙","假裝沒看到繼續一個人待著"],"answer":1,"explain":"覺得害怕就打給爸媽或找信任的大人幫忙。"},{"q":"為什麼吃東西前一定要先洗手呢？","options":["因為手上可能沾了看不見的病菌，吃進肚子會生病","因為洗手可以讓餅乾變得更好吃","因為手不洗就會馬上長出黑黑的東西"],"answer":0,"explain":"手摸過很多地方，會沾到眼睛看不見的病菌，先把手洗乾淨再吃東西，就不容易把病菌吃進肚子裡。"},{"q":"洗手時只用清水快速沖一下，這樣夠乾淨嗎？","options":["不太夠，用肥皂仔細搓洗再沖乾淨才能洗掉油油的髒污和病菌","夠了，只要有碰到水就一定乾淨","完全不用管，反正病菌看不見"],"answer":0,"explain":"很多病菌會黏在手上油油的髒污裡，只用清水沖不太掉，要用肥皂搓出泡泡、仔細洗過各個地方再沖乾淨才有效。"},{"q":"用衛生紙擤完鼻涕或摀住噴嚏後，接下來最好怎麼做？","options":["把用過的衛生紙丟進垃圾桶，然後去洗手","把衛生紙塞回口袋，等等再用一次","把衛生紙放在桌上留著"],"answer":0,"explain":"用過的衛生紙上有很多病菌，要馬上丟進垃圾桶，再把手洗乾淨，才不會把病菌傳給別人或自己。"},{"q":"打噴嚏時，用哪個部位擋住最好？","options":["用手心整個摀住","對著空氣直接打出去","用手肘的內側或衛生紙擋住"],"answer":2,"explain":"用手肘內側或衛生紙擋住，噴出來的口水和病菌比較不會飛散，也不會沾在等一下要摸東西的手心上。"},{"q":"插頭上如果積了很多灰塵，長期不理它可能會怎樣？","options":["灰塵會讓插頭變得更安全","沒有任何關係，灰塵只是髒而已","灰塵潮濕時可能引起危險，最好請大人幫忙清理"],"answer":2,"explain":"插頭縫隙積了灰塵又碰到濕氣，時間久了可能會過熱甚至起火，發現時要告訴大人，請大人拔掉電源後小心清理。"},{"q":"電線的外皮破掉、露出裡面的銅線時，應該怎麼辦？","options":["不要去碰它，趕快告訴大人來處理","用手把破掉的地方按回去就好","繼續正常使用，反正還能通電"],"answer":0,"explain":"電線外皮破掉露出銅線，碰到可能會觸電，不可以用手去摸，要離開並告訴大人，請大人來換掉或修理。"},{"q":"下雨打雷的時候，在家裡用電有什麼要注意的？","options":["雷雨時盡量少碰插著電的電器，比較安全","打雷時把手伸出窗外接雨水最好玩","打雷時要趕快去摸每一個插座"],"answer":0,"explain":"打雷時電線可能會有突然變強的電，這時候盡量不要使用插著插座的電器，等雷雨過了再用會比較安心。"},{"q":"看到弟弟妹妹想把玩具的小金屬片塞進插座的洞裡，你該怎麼做？","options":["馬上阻止他，並告訴他插座會電人很危險，再叫大人來","陪他一起塞，看看會發生什麼事","假裝沒看到，這不關我的事"],"answer":0,"explain":"插座裡有電，把金屬塞進去會觸電，非常危險，要趕快阻止弟弟妹妹，並讓大人知道這件事。"},{"q":"手機或平板一邊充電，一邊放在棉被裡玩，這樣好嗎？","options":["不好，充電時被子悶住散不了熱，可能過熱起火，要放在通風的桌面上","很好，這樣被子暖暖的很舒服","沒差，充電本來就會熱熱的"],"answer":0,"explain":"充電時電器會發熱，被棉被悶住熱散不掉，時間久了可能過熱甚至起火，充電時應該放在通風的桌面上。"},{"q":"一聞到像臭雞蛋的瓦斯味，下面哪個動作最危險，千萬不能做？","options":["伸手去按電燈開關看看亮不亮","趕快輕輕打開窗戶","走出去到門外"],"answer":0,"explain":"按電燈開關的瞬間會產生小火花，遇到空氣中的瓦斯可能引起爆炸，所以絕對不能開關任何電器，要開窗、離開並找大人。"},{"q":"聞到濃濃瓦斯味時，可以用打火機點一下火，看看瓦斯漏在哪裡嗎？","options":["可以，這樣才找得到漏的地方","可以，只要動作快一點就沒事","絕對不可以，火會讓瓦斯爆炸，非常危險"],"answer":2,"explain":"瓦斯遇到火會爆炸，絕對不能點火或劃火柴，要做的是打開窗戶通風、趕快離開，再請大人來檢查。"},{"q":"聞到瓦斯味，想打電話請大人回來，最好在哪裡打？","options":["站在瓦斯味最濃的廚房裡打","躲進沒有窗戶的浴室打","先離開到屋外或空氣新鮮的地方再打"],"answer":2,"explain":"在有瓦斯味的地方使用電話也可能產生小火花，要先離開到屋外空氣好的地方，再打電話給大人或求救。"},{"q":"為什麼一氧化碳這種氣體特別可怕？","options":["因為它顏色很鮮豔，一看就知道","因為它會發出很大的聲音提醒大家","因為它沒有顏色也幾乎沒有味道，讓人不知不覺就中毒"],"answer":2,"explain":"一氧化碳看不到也幾乎聞不到，人吸到了可能會頭暈、想睡卻不知道原因，所以用瓦斯時一定要保持通風。"},{"q":"如果覺得頭暈、噁心，還有點想睡，懷疑可能有一氧化碳，最先該做什麼？","options":["趕快打開窗戶或門，到空氣新鮮的地方，並告訴大人","躺下來睡一覺，睡醒就好了","把窗戶關得更緊，這樣比較暖"],"answer":0,"explain":"懷疑吸到一氧化碳時，最重要的是趕快到空氣新鮮的地方呼吸，並讓大人知道，絕對不要留在原地或睡著。"},{"q":"冬天在浴室用瓦斯熱水器洗澡，為什麼要注意通風？","options":["因為通風可以讓水變得更熱","因為通風純粹是為了讓浴室不要有水氣","因為不通風時可能累積一氧化碳，讓人中毒"],"answer":2,"explain":"瓦斯燃燒如果空氣不流通，可能產生一氧化碳，洗澡時要保持通風，才不會不知不覺吸入危險的氣體。"},{"q":"吃藥的時候，把藥當成糖果一次多吃幾顆，會比較快好嗎？","options":["會，吃越多好得越快","會，反正藥都是甜甜的","不會，藥吃太多反而傷身體，要照大人和醫生說的份量吃"],"answer":2,"explain":"藥不是糖果，吃過量會傷害身體，一定要照醫生和大人交代的份量、時間吃，不可以自己多吃。"},{"q":"看到桌上有一顆五顏六色、很像糖果的藥丸，你可以撿起來吃嗎？","options":["可以，看起來像糖果應該沒問題","可以，先舔一口試試味道","不可以，不確定是什麼就不能吃，要先問大人"],"answer":2,"explain":"有些藥做得很像糖果，但吃錯藥會很危險，不認識的東西絕對不能吃，要先問大人這是什麼。"},{"q":"清潔劑或藥品，放在家裡哪個位置比較安全？","options":["放在小朋友和弟弟妹妹拿不到的高處或有鎖的櫃子","放在餐桌上，方便隨時拿","放在地上，跟玩具擺在一起"],"answer":0,"explain":"清潔劑和藥品放在小小孩拿得到的地方很危險，應該收在高處或上鎖的櫃子，才不會被誤拿誤食。"},{"q":"為什麼不可以把清潔劑或藥水裝進喝過的飲料瓶裡？","options":["因為飲料瓶太小裝不下","因為這樣看起來很漂亮","因為別人可能會以為是飲料而誤喝，非常危險"],"answer":2,"explain":"把清潔劑裝進飲料瓶，很容易讓人誤以為是飲料而喝下去，造成中毒，危險的液體要放在原本有標示的瓶子裡。"},{"q":"漂白水和另一種浴廁清潔劑，可以倒在一起加強清潔效果嗎？","options":["可以，兩種一起洗得更乾淨","可以，只要開電風扇吹一吹就好","絕對不可以，混在一起會產生有毒氣體，很危險"],"answer":2,"explain":"漂白水和某些清潔劑混在一起會產生刺鼻的有毒氣體，吸到會很不舒服甚至危險，清潔劑千萬不能亂混，一次只用一種。"},{"q":"如果不小心把兩種清潔劑倒在一起，聞到刺鼻的怪味，該怎麼辦？","options":["趕快靠近聞清楚是什麼味道","馬上離開那個房間、打開窗戶通風，並告訴大人","把臉湊過去用力吸幾口"],"answer":1,"explain":"混合清潔劑產生的氣體有毒，聞到刺鼻怪味要立刻離開、開窗通風，並讓大人知道，絕對不能靠近去聞。"},{"q":"清潔劑不小心濺到皮膚上，最先應該怎麼做？","options":["用力搓一搓讓它乾掉","趕快用大量清水沖洗，並告訴大人","塗一點乳液蓋住就好"],"answer":1,"explain":"清潔劑碰到皮膚可能會刺痛或受傷，要趕快用大量清水沖洗乾淨，再告訴大人，必要時請大人帶去看醫生。"},{"q":"用噴霧式的殺蟲劑或芳香噴霧時，下面哪個做法最安全？","options":["對著自己的臉或嘴巴噴著玩","在通風的地方使用，不對著人、火和眼睛噴","放在很熱的火爐旁邊或曬太陽"],"answer":1,"explain":"噴霧罐裡有壓力和易燃的氣體，要在通風處使用、不對著人或火噴，也不能放在高溫的地方，以免爆炸。"},{"q":"為什麼噴霧罐（像髮膠、殺蟲劑）不能丟進火裡或放在很熱的地方？","options":["因為罐子會變得很漂亮","因為裡面有壓力，受熱可能會爆炸","因為這樣噴霧會變得更香"],"answer":1,"explain":"噴霧罐裡裝著有壓力的氣體，遇到高溫或火會膨脹爆炸，所以要放在陰涼的地方，不能丟進火裡。"},{"q":"關於空氣中飄著大量細粉塵（像很多麵粉、糖粉），下面哪句是對的？","options":["粉塵這麼細，遇到火一定不會怎樣","大量細粉塵遇到火源可能會突然燒起來甚至爆炸，要小心","粉塵越多越安全"],"answer":1,"explain":"很多很細的粉塵飄在空氣中，遇到火源可能一下子劇烈燃燒甚至爆炸，所以廚房裡撒大量麵粉時要遠離火源。"},{"q":"在廚房幫忙時，看到瓦斯爐旁邊放著噴霧罐和一大包麵粉，比較安全的做法是？","options":["把它們放到遠離爐火的地方","把它們直接放在爐火上加熱","打開瓶蓋對著火噴看看"],"answer":0,"explain":"噴霧罐和大量粉塵遇到爐火都可能引起爆炸或劇烈燃燒，要把它們放到遠離火源的地方才安全。"},{"q":"自己一個人在家，有陌生人按門鈴說是來修東西的，你該怎麼做？","options":["馬上開門讓他進來","不開門，先打電話問爸媽或大人該怎麼辦","把門打開一條縫跟他聊天"],"answer":1,"explain":"自己在家時不認識的人來按門鈴，不要隨便開門，可以先打電話問爸媽或信任的大人，確認清楚再說。"},{"q":"一個人在家接到陌生電話，對方問「你爸媽在不在家」，怎麼回答比較安全？","options":["老實說「只有我一個人在家」","說「他們在忙，等一下回電話給你」，不透露只有自己在家","把家裡地址告訴對方"],"answer":1,"explain":"不要讓陌生人知道只有小孩一個人在家，可以說大人在忙、等一下回電，並趕快告訴爸媽這通電話。"},{"q":"自己在家時，家裡有和爸媽約好的重要電話號碼，放在哪裡最方便又安全？","options":["記在心裡就好，不用寫出來","貼在電話旁邊或大家都找得到的固定地方","藏在很難找到的抽屜最深處"],"answer":1,"explain":"把爸媽電話和110、119等號碼寫下來貼在電話旁的固定位置，遇到狀況時才能馬上找到、快速求救。"},{"q":"一個人在家肚子餓想吃東西，下面哪個做法最安全？","options":["自己開瓦斯爐大火炒菜","選不用開火的食物，例如水果、麵包或餅乾","把很多油倒進鍋子裡加熱"],"answer":1,"explain":"小朋友自己在家時盡量不要開火，選水果、麵包這類不用開火的食物比較安全，想煮東西可以等大人回來一起做。"},{"q":"自己在家時突然發生小火災，火勢還很小，最重要的是什麼？","options":["先回房間把玩具收好再說","趕快離開家到安全的地方，並打119求救","站在旁邊看火會不會自己熄掉"],"answer":1,"explain":"發生火災時最重要的是人先安全離開，到屋外安全的地方後打119求救，絕對不要為了拿東西而留在屋內。"},{"q":"一個人在家覺得很不安，看到窗外有可疑的人一直徘徊，可以怎麼辦？","options":["自己開門出去問他要做什麼","確認門窗鎖好，打電話告訴爸媽或需要時打110","打開大門邀請他進來坐"],"answer":1,"explain":"覺得害怕或看到可疑的人時，先確認門窗都鎖好，再打電話告訴爸媽或信任的大人，情況緊急時可以打110請警察幫忙。"}],"emergency":[{"q":"半夜你聞到一股燒焦味，還看到房間門縫飄進一點煙，這時候你最先應該做什麼？","options":["躲進棉被裡等煙散掉","大聲喊「失火了」提醒身邊的人","先把玩具收好再走"],"answer":1,"explain":"先大聲喊「失火了」提醒大家，能讓身邊的人一起快點安全離開。"},{"q":"火災逃生時，為什麼要把身體壓低走？","options":["因為靠近地板的空氣比較乾淨、比較好呼吸","因為壓低身體跑得比較快","因為這樣火看不到你"],"answer":0,"explain":"乾淨的空氣在靠近地板的地方，壓低身體才不會吸到又熱又毒的濃煙。"},{"q":"逃生時你走到一扇關著的門前，想知道能不能開，最安全的做法是什麼？","options":["直接用力把門打開衝出去","先用手背輕輕碰一下門把，很燙就換別條路","把耳朵貼在門上聽聲音"],"answer":1,"explain":"先用手背碰門把，門把很燙就代表門後可能有火，換一條路才安全。"},{"q":"火災時你住在三樓，要下樓逃生，應該走哪一條路？","options":["搭電梯下樓比較快","沿著牆壁摸著走樓梯出口","從窗戶爬水管下去"],"answer":1,"explain":"火災時絕對不搭電梯，沿著牆壁走樓梯出口才是最安全的路。"},{"q":"你已經安全逃到屋外的空地了，突然想起心愛的書包還在房間裡，該怎麼辦？","options":["趕快跑回去拿，很快就好","留在安全的地方，絕對不再跑回去","叫弟弟幫你回去拿"],"answer":1,"explain":"東西再買就有，逃出來後絕對不要再跑回去，人平安最重要。"},{"q":"上課時教室突然開始搖晃，你第一個動作應該是什麼？","options":["站起來跑向教室門口","立刻趴下，讓身體變低","站在原地大聲尖叫"],"answer":1,"explain":"先「趴下」讓身體變低，才不會被搖晃絆倒，這是保護自己的第一步。"},{"q":"地震「趴下、掩護、穩住」中的「掩護」，主要是要保護身體的哪個部位？","options":["保護頭和脖子","保護肚子","保護鞋子"],"answer":0,"explain":"躲到堅固的桌子底下掩護頭和脖子，是地震時最重要的保護動作。"},{"q":"地震時你躲進了堅固的桌子底下，接下來要怎麼「穩住」？","options":["把桌子推到旁邊","抓住桌腳，跟著桌子一起移動","站起來扶著牆壁"],"answer":1,"explain":"抓住桌腳跟桌子一起移動，就能一直待在安全的保護下，直到搖晃停止。"},{"q":"地震發生時，如果你附近剛好沒有桌子可以躲，應該怎麼做？","options":["蹲低用雙手護住頭，遠離窗戶和會倒的高櫃","站在大玻璃窗旁邊看外面","靠在高高的書櫃旁邊"],"answer":0,"explain":"蹲低護住頭，並遠離窗戶、玻璃和會倒的高櫃，就能減少被砸到的危險。"},{"q":"地震後你已經到了戶外的安全空地，這時候應該怎麼做？","options":["待在原地，等大人清點人數","自己跑回教室拿東西","到處走走看有沒有同學"],"answer":0,"explain":"到空地後待在原地不亂跑，讓大人清點人數，才不會走失或發生危險。"},{"q":"地震時如果慌張地亂跑，最可能發生什麼危險？","options":["會被搖晃絆倒，或被掉落的東西砸傷","會跑得比別人快","什麼事都不會發生"],"answer":0,"explain":"亂跑容易被絆倒、或被掉下來的燈和書架砸到，躲好保護頭才安全。"},{"q":"你不小心被熱湯燙到手，第一件事應該趕快做什麼？","options":["塗上牙膏止痛","用流動的自來水沖傷口","用嘴巴吹一吹就好"],"answer":1,"explain":"燙傷要趕快用流動的冷水沖，能讓皮膚少受一點傷、也比較不痛。"},{"q":"燙傷用流動的自來水沖，大約要沖多久比較好？","options":["沖個兩三秒就夠了","至少沖 15 到 20 分鐘，沖到比較不痛","沖一整天都不能停"],"answer":1,"explain":"至少沖 15 到 20 分鐘、沖到比較不痛，皮膚才能好好降溫、傷得比較輕。"},{"q":"關於燙傷的傷口，下面哪一種做法是不可以的？","options":["用流動的冷水沖","在傷口塗牙膏或醬油","沖完後告訴大人"],"answer":1,"explain":"牙膏、醬油、藥膏都不能塗在燙傷上，只要用乾淨的流動冷水沖就好。"},{"q":"膝蓋跌倒流血了，怎麼做能幫忙止血？","options":["用乾淨的布蓋在傷口上，用手輕輕壓住","用髒手把血抹掉","用力去摳傷口"],"answer":0,"explain":"用乾淨的布蓋住傷口輕輕壓，還可以把受傷的地方稍微抬高，能幫忙止血。"},{"q":"如果同學受傷血流很多、一直止不住，最該做的是什麼？","options":["自己想辦法慢慢處理就好","馬上找大人並打 119 請救護車幫忙","先回家休息一下再說"],"answer":1,"explain":"血止不住或傷得很嚴重時，馬上找大人並打 119，讓救護車來幫忙最重要。"},{"q":"家裡失火了，要叫消防隊和救護車來，應該打幾號？","options":["打 110 找警察","打 119 找消防隊、救護車","自己想辦法，不打電話"],"answer":1,"explain":"火災或有人受傷，要找消防隊和救護車就打 119；110 是報警找警察用的，別記錯囉。"},{"q":"如果需要找警察來幫忙、報警，應該打哪一個號碼？","options":["打 110 找警察","打 119 找消防隊","先自己想辦法，不用打電話"],"answer":0,"explain":"遇到需要警察的事就打 110，火災、有人受傷叫救護車才打 119，記住這兩個號碼就能找到幫手。"},{"q":"打電話求救時，接通後保持冷靜，最要講清楚的是哪些事？","options":["自己喜歡的顏色和食物","我在哪裡、發生什麼事、有幾個人、有沒有人受傷","電話號碼是幾號"],"answer":1,"explain":"把地點、事情、人數和有沒有人受傷說清楚，救援才能又快又準地趕到。"},{"q":"求救的話講完了，這時候你應該怎麼做？","options":["馬上把電話掛掉","先不要掛，聽對方問題回答，等對方說可以掛了再掛","把電話丟到一邊"],"answer":1,"explain":"先不要急著掛電話，聽對方的問題回答，等對方說可以掛了再掛才對。"},{"q":"遇到很緊急的事，可是手機顯示沒有訊號、打不出去，可以試著撥哪個號碼？","options":["試著撥 112","多撥幾次 110 就會通","關機再開機就好"],"answer":0,"explain":"手機沒訊號、緊急打不出去時，可以試著撥 112 求救，這個小知識很有用。"},{"q":"為什麼把家人的電話和住家地址「背在腦袋裡」，比只寫在紙上更保險？","options":["因為紙比較重","因為背起來後需要時隨時都用得上，不怕紙不見","因為背起來比較好玩"],"answer":1,"explain":"記在腦袋裡，走失或緊急時隨時都能說出來，比帶著紙條更保險。"},{"q":"如果你在外面和家人走散了，最好先怎麼做？","options":["自己到處走一走找家人","待在原地不要亂走，找穿制服的人幫忙","跟著陌生人回他家"],"answer":1,"explain":"走失時先待在原地，找警察、店員等穿制服的人幫忙，最容易找回家人。"},{"q":"練習說出自己的住家地址時，怎樣說才算夠清楚？","options":["只要說出路名就好","從縣市、區、路名一直說到幾號幾樓","只說幾樓就可以了"],"answer":1,"explain":"從縣市、區、路名說到幾號幾樓，越清楚越好，別人才找得到你家。"},{"q":"家人的電話號碼有點長，怎麼做可以讓它變得更好記？","options":["把號碼編成一首小歌或口訣，每隔幾天複習一次","只背前面兩個數字就好","反正記不住就不要背"],"answer":0,"explain":"把號碼編成小歌或口訣，再每隔幾天複習，就會記得又快又牢。"},{"q":"走失時你找到了一位穿制服的店員願意幫忙，接下來你要做什麼？","options":["把背好的家人電話和地址說給他聽，請他幫忙聯絡家人","什麼都不說，自己走開","跟他要糖果吃"],"answer":0,"explain":"把背好的電話和地址說給幫忙的大人聽，他就能幫你聯絡上家人囉。"},{"q":"火災時，濃煙大多會往哪裡聚集？","options":["往上飄，聚在天花板附近","往下沉，積在地板上","停在半空中不動"],"answer":0,"explain":"濃煙又熱又輕，會往上飄並聚在高處；貼近地面的空氣比較乾淨，所以逃生時要壓低身體前進。"},{"q":"萬一身上的衣服不小心燒了起來，最好的做法是什麼？","options":["張開手大聲跑去找水","停下來、趴下、就地滾一滾","用手拚命拍打火焰"],"answer":1,"explain":"亂跑會讓火燒得更旺；停下來趴到地上來回滾動，可以壓住火苗把火悶熄。"},{"q":"逃離火場、經過有煙的地方時，用什麼摀住口鼻會有幫助？","options":["乾的塑膠袋","一張衛生紙","沾濕的毛巾或衣物"],"answer":2,"explain":"沾濕的毛巾或衣物能幫忙擋掉一些煙，讓呼吸比較舒服；同時還是要壓低身體快速離開。"},{"q":"準備開門逃生時，摸門把覺得很燙，這代表什麼？","options":["門後可能有火，先別開這扇門","門把壞了，用力推就好","沒關係，快點打開衝出去"],"answer":0,"explain":"門把很燙表示門後可能有火，開門會讓火和煙衝進來；這時要改走另一條路，或退回安全的地方求救。"},{"q":"你在室內聽到火災警報響了，但還沒看到火，應該怎麼做？","options":["先繼續做自己的事，看到火再說","當作真的火災，趕快照逃生路線離開","把所有窗戶都打開通風"],"answer":1,"explain":"警報響起就要當成真的，立刻依逃生路線離開才安全；等看到火才行動常常來不及。"},{"q":"火災時不搭電梯逃生，主要原因是什麼？","options":["電梯太慢了","電梯太擠不舒服","可能突然停電，把人困在裡面"],"answer":2,"explain":"火災常會停電，電梯一停人就會被困住，還可能有煙灌進去；走樓梯才是安全的選擇。"},{"q":"安全逃到屋外後，要打電話求救時最好在哪裡打？","options":["在屋外安全的地方或鄰居家打","跑回屋內拿家用電話","站在門口一邊看火一邊打"],"answer":0,"explain":"已經逃出來就千萬不要再回去；在屋外安全的地方或到鄰居家打電話，才不會讓自己再次陷入危險。"},{"q":"逃生時發現樓梯間也都是濃煙、沒辦法通過，比較好的做法是什麼？","options":["摀著鼻子硬闖過去","退回房間關上門，到窗邊揮手呼救","躲進浴缸裡不出聲"],"answer":1,"explain":"硬闖濃煙很危險；退回房間把門關上、用衣物塞住門縫擋煙，再到窗邊揮手大喊讓外面的人看到你，等消防員來救。"},{"q":"地震發生時你正躺在床上，來不及躲到桌子下，可以怎麼保護自己？","options":["趕快跳下床往外跑","站到床邊的窗戶旁","留在床上，用枕頭護住頭和脖子"],"answer":2,"explain":"搖晃中亂跑容易跌倒或被掉落物砸到；留在床上用枕頭護住頭和脖子，等搖完再行動比較安全。"},{"q":"地震正在劇烈搖晃時，下面哪件事最該先做？","options":["先躲好，保護自己的頭部","先跑去關瓦斯、打開大門","先打電話跟家人報平安"],"answer":0,"explain":"搖晃當下最重要的是先保護自己，做到趴下、掩護、穩住；關瓦斯或開門等搖晃停了再說。"},{"q":"地震時待在房間裡，應該離哪裡遠一點？","options":["房間中央的地板","會碎裂的窗戶玻璃","堅固的桌子下面"],"answer":1,"explain":"窗戶玻璃搖晃時可能碎裂噴出，很危險；要遠離窗戶，躲到堅固的桌子下護住頭部。"},{"q":"地震時你剛好在戶外，應該往哪裡移動？","options":["躲到大樓的牆邊","站在招牌下面避一避","走到沒有建築物和電線桿的空曠地方"],"answer":2,"explain":"牆、招牌、電線桿都可能倒下或掉落；到空曠的地方蹲低、護住頭，才不會被砸到。"},{"q":"地震時躲到堅固的桌子底下，手要做什麼才算「穩住」？","options":["抓住桌腳，讓桌子不會移開","雙手撐著地板不要動","把桌子推遠一點"],"answer":0,"explain":"抓住桌腳可以讓桌子不會在搖晃中滑走，你才能一直待在它的保護下，護好頭和脖子。"},{"q":"地震時，房間裡哪一種東西比較可能砸到人，要離遠一點？","options":["地上鋪的地毯","牆上掛的時鐘、櫃子上的重物","牆角的抱枕"],"answer":1,"explain":"掛在牆上或放在高處的重物，搖晃時容易掉下來砸到人；要遠離這些東西，躲到堅固的桌子下。"},{"q":"地震的搖晃停下來之後，還要注意什麼？","options":["確定不會再搖了，可以放心跑跳","馬上回房間繼續睡覺","可能還有餘震，要保持警覺並聽大人指示"],"answer":2,"explain":"大地震後常會有餘震，還可能再搖；要保持警覺，跟著大人一起小心移動到安全的地方。"},{"q":"燙傷的地方冒出水泡，應該怎麼處理？","options":["不要弄破它，保持乾淨","用針把水泡戳破放水","用力搓一搓讓它消掉"],"answer":0,"explain":"水泡是皮膚在保護傷口，弄破容易感染；保持乾淨、不要戳破，並請大人幫忙處理。"},{"q":"被燙到的地方有衣服黏住了，沖水時該怎麼做？","options":["用力把黏住的衣服撕下來","不要硬撕，先隔著衣服一起沖冷水","先不要管它，等一下再說"],"answer":1,"explain":"硬撕會連皮膚一起扯下來，更嚴重；先隔著衣服用大量冷水沖，再請大人幫忙送醫。"},{"q":"處理燙傷時，下面哪一種做法才是對的？","options":["塗上牙膏或醬油降溫","抹一點油讓皮膚滑順","用大量流動的冷水一直沖"],"answer":2,"explain":"牙膏、醬油、油這些都不能塗，反而會讓傷口更難處理；正確做法是用大量流動的冷水持續沖。"},{"q":"燙傷時，直接拿冰塊冰敷傷口好不好？","options":["不好，應該用流動的冷水沖","很好，愈冰愈快好","都可以，兩種一樣"],"answer":0,"explain":"冰塊太冰，直接敷會傷到皮膚；用流動的冷水沖才能溫和又持續地帶走熱氣。"},{"q":"燙傷急救的「沖、脫、泡、蓋、送」，第一步「沖」是指什麼？","options":["先把身上的衣服脫掉","先用冷水沖傷口","先蓋上一層藥膏"],"answer":1,"explain":"第一步是趕快用大量冷水沖傷口，把熱氣帶走、減輕傷害，之後才小心脫、泡、蓋、送醫。"},{"q":"手指割傷流血時，止血最基本的做法是什麼？","options":["把傷口舉高後放著不管","一直用衛生紙把血擦掉","用乾淨的布或紗布直接壓住傷口"],"answer":2,"explain":"用乾淨的布或紗布直接壓住傷口，能幫忙把血止住；壓的時候要有耐心，別一直拿開看。"},{"q":"壓住流血的傷口時，血還是有一點滲出來，該怎麼做？","options":["繼續壓住，需要時再多加一塊布","馬上把布拿開換新的看一看","停止壓迫，讓它流一流"],"answer":0,"explain":"一直把布拿開，會讓好不容易要止住的血又流出來；繼續壓住、必要時在上面再加一塊布，並請大人幫忙。"},{"q":"流鼻血的時候，怎麼做比較好？","options":["頭往後仰，讓血流回去","身體稍微往前傾，捏住鼻子軟軟的地方","整個人躺下來不要動"],"answer":1,"explain":"頭往後仰會讓血流到喉嚨，容易嗆到；身體微微前傾、捏住鼻翼軟的地方一會兒，比較容易止血。"},{"q":"跌倒後傷口沾到沙子和泥土，先怎麼做比較好？","options":["用手把沙子摳掉","不用理它，直接貼起來","用乾淨的水把傷口沖洗乾淨"],"answer":2,"explain":"先用乾淨的水把沙土沖掉，傷口比較不會發炎；沖乾淨後再壓住止血、貼上乾淨的敷料，並告訴大人。"},{"q":"你受傷了，除了自己先簡單處理，還有一件很重要的事是什麼？","options":["趕快告訴身邊的大人或老師","自己忍著不要說","把血擦乾淨假裝沒事"],"answer":0,"explain":"大人和老師可以幫忙判斷傷勢、做進一步處理；受傷時勇敢說出來，才能得到最好的照顧。"},{"q":"打119的時候，要跟對方講清楚哪些事情？","options":["自己喜歡看什麼卡通","發生什麼事、在哪裡、有沒有人受傷","今天是星期幾"],"answer":1,"explain":"說清楚地點、發生什麼狀況、有沒有人受傷，救護和消防人員才能很快找到你、帶對的裝備來。"},{"q":"需要警察來幫忙、報案的時候，要打哪一個號碼？","options":["119","113","110"],"answer":2,"explain":"在台灣，找警察報案打110，火災和叫救護車打119；記住這兩個號碼，緊急時就能打對電話。"},{"q":"打電話求救、話還沒講完，對方請你先別掛，你應該怎麼做？","options":["聽對方的話，先不要掛斷","覺得說完了就直接掛掉","把電話丟在一旁跑開"],"answer":0,"explain":"接電話的人可能還要問你更多事，或一邊指導你怎麼做；他請你別掛就別掛，保持通話比較安全。"},{"q":"打緊急電話時你很緊張、話講不清楚，可以怎麼幫自己？","options":["愈快講完愈好，含糊一點沒關係","先深呼吸，慢慢一句一句說","太緊張就先掛掉再說"],"answer":1,"explain":"先深呼吸、慢慢把重點一句一句說清楚，對方才聽得懂；他們也會溫柔地引導你，不用害怕。"},{"q":"打電話求救時，如果一時說不出正確地址，可以怎麼幫對方找到你？","options":["隨便報一個地址","什麼都不說，等他們自己找","說出附近明顯的招牌、商店或建築物"],"answer":2,"explain":"說出附近明顯的招牌、大樓或商店等特徵，可以幫忙縮小範圍，讓救援更快找到你的位置。"},{"q":"119、110這些緊急電話，可以沒事打來玩嗎？","options":["不可以，會佔線耽誤真正需要幫忙的人","可以，反正打電話是免費的","偶爾打一兩次沒關係"],"answer":0,"explain":"這些是救命的電話，亂打會佔住線路，讓真正遇到危險的人打不進來；只有真的緊急時才撥打。"},{"q":"你把家裡地址告訴求救的接線員後，他又把地址念一次給你聽，這是為了什麼？","options":["覺得你講錯了在生氣","想確認有沒有聽對，是好事","故意浪費時間"],"answer":1,"explain":"接線員複誦一次是要確認地址正確，避免救援跑錯地方；你可以仔細聽，有錯就馬上告訴他。"},{"q":"除了爸爸媽媽的電話，最好還多記住什麼？","options":["班上每個同學的電話","最愛遊戲的密碼","至少一位其他親人或緊急聯絡人的電話"],"answer":2,"explain":"萬一聯絡不到爸媽，還能打給另一位親人幫忙；多記住一個可靠的緊急聯絡電話，會更安心。"},{"q":"練習背住家地址時，最好要記得哪些內容？","options":["縣市、路名、幾號、幾樓都要記","只要記得路名就好","記得自己房間的顏色就行"],"answer":0,"explain":"完整的地址包含縣市、路（街）名、幾號、幾樓；記得愈完整，別人要幫你或送你回家時就愈方便。"},{"q":"在大賣場和家人走散了，一時找不到人，可以怎麼做？","options":["自己跑到停車場等","到服務台請工作人員幫忙廣播找家人","一直待在原地大哭"],"answer":1,"explain":"到服務台請穿制服的工作人員幫忙廣播，家人聽到就會來找你；留在店裡有大人幫忙，比自己亂走安全。"},{"q":"別人的手機有密碼鎖，但你很緊急、需要打電話求救，可以怎麼辦？","options":["沒有密碼就完全打不了，只能放棄","一直亂猜密碼","鎖定畫面通常有「緊急撥號」，可以打119或110"],"answer":2,"explain":"大部分手機在鎖定畫面上都有「緊急撥號」的按鈕，不用解鎖也能打110、119；記住這一點，緊急時就多一個辦法。"},{"q":"在外面和家人走散時，有不認識的人說要帶你去找爸媽，你該怎麼做？","options":["不要跟陌生人走，去找店員或警察幫忙","馬上跟著他走","上他的車比較快"],"answer":0,"explain":"不認識的人就算說要幫忙，也不要跟著走或上車；找穿制服的店員、警察這些可以信任的大人幫忙才安全。"},{"q":"平常在家裡，關於逃生，最好先做哪一項準備？","options":["把出口堆放東西擋起來","和家人一起想好、走過逃生路線和集合地點","把所有房門都反鎖起來"],"answer":1,"explain":"平常就和家人約好逃生路線和外面的集合地點，真的發生火災時才不會慌張，逃出來也知道要在哪裡會合。"}],"outdoor":[{"q":"小明想過馬路，馬路對面就是他家，但附近有斑馬線在幾步之外。他應該怎麼做？","options":["直接從最近的地方穿越馬路","走到斑馬線那裡再過馬路","從停著的車子中間鑽過去"],"answer":1,"explain":"多走幾步到斑馬線再過馬路，開車的人才能清楚看到你。"},{"q":"過馬路前要看清楚左右兩邊，正確的看的順序是下面哪一個？","options":["先看左邊，再看右邊，再看一次左邊","只看右邊一次就好","閉上眼睛快步衝過去"],"answer":0,"explain":"先看左、再看右、再看一次左，確定沒有車再走，這樣才安全。"},{"q":"小華在等紅綠燈，這時候是紅燈，但看到路上暫時沒有車，他應該怎麼做？","options":["紅燈也要停下來等，等綠燈亮才走","沒車就趕快跑過去","站到馬路中間等綠燈"],"answer":0,"explain":"紅燈就是要停下來等，等綠燈亮再走，這樣最安全。"},{"q":"綠燈亮了，正要過馬路，下面哪個習慣最安全？","options":["低頭看手機邊走邊過","再看看左右確定沒有車才走","跟著人群跑不用看車"],"answer":1,"explain":"就算是綠燈，也要再確認一下左右沒有車再走，這樣最安全。"},{"q":"在路口要過馬路，應該從哪裡通過最安全？","options":["從車子與車子的縫隙穿越","翻過路中間的欄杆","走斑馬線、天橋或地下道"],"answer":2,"explain":"走斑馬線、天橋或地下道，是最安全的過馬路方法。"},{"q":"小美一坐上車，第一件應該做的事是什麼？","options":["把窗戶打開把手伸出去","坐好並把安全帶扣好","站起來跟後座的人聊天"],"answer":1,"explain":"上車先坐好、扣好安全帶，聽到「喀」一聲，這樣坐車最安全。"},{"q":"為什麼坐車時一定要繫安全帶？","options":["因為安全帶很漂亮","因為突然煞車時它能把我們穩穩留在座位上","因為繫了就可以在車上玩"],"answer":1,"explain":"安全帶就像抱住我們的手，突然煞車時能保護我們。"},{"q":"車子在馬路上行駛時，天氣很熱，小志好想把頭伸出天窗吹風，他應該怎麼做？","options":["把頭和手都留在車子裡面","把頭伸出天窗外吹風","把手伸出窗外跟別的車揮手"],"answer":0,"explain":"頭和手都要留在車裡，才不會被經過的車子或東西撞到。"},{"q":"車子停好了，要開門下車前，應該先做什麼？","options":["用力把門推開最快","先看看門旁邊和後面有沒有機車或腳踏車","閉著眼睛開門"],"answer":1,"explain":"開門前先看看後方有沒有來車，確認安全再下車。"},{"q":"車子正在路上開，下面哪個做法最安全？","options":["在座位上坐好不亂動","站起來在車上跑來跑去","跟同學在車上打鬧"],"answer":0,"explain":"車子在跑的時候坐好、不跑跳打鬧，突然煞車時才不會受傷。"},{"q":"小安和同學到河邊玩，發現旁邊都沒有大人，他應該怎麼做？","options":["自己先下水試試看","不靠近水邊，去找大人陪同","叫同學一起跳下水"],"answer":1,"explain":"沒有大人陪就不靠近水邊，這樣才能保護自己。"},{"q":"還不太會游泳的小玲想去游泳池玩水，下面哪個做法比較好？","options":["自己跳進深水區練習","有大人陪，並穿好合身的救生衣","偷偷一個人去玩"],"answer":1,"explain":"還不會游泳時要有大人陪、穿好救生衣，這樣玩水才安全。"},{"q":"如果不小心滑進水裡，下面哪個做法最能幫助自己？","options":["用力亂揮手亂踢想爬起來","放輕鬆、頭往後仰讓臉浮出水面，大聲喊救命","低頭把臉埋進水裡"],"answer":1,"explain":"放鬆仰漂、讓臉浮出水面再大聲呼救，比較不會嗆水，也能等大人來救。"},{"q":"小杰看到有人在水裡大喊救命，他應該怎麼做？","options":["自己馬上跳下水去救","大聲喊大人來，並打119","假裝沒看到走開"],"answer":1,"explain":"看到有人溺水要喊大人並打119，不自己跳下去，這樣最安全。"},{"q":"岸邊有人溺水，小婷站在岸上想幫忙，下面哪個做法比較安全？","options":["跳下水把人拉上來","站穩在岸上，把救生圈或長棍子遞給他","什麼都不做只是看著"],"answer":1,"explain":"站穩岸上、遞漂浮的東西給對方，既能幫忙又不會被拉下水。"},{"q":"為什麼看到別人溺水時，自己不可以馬上跳下去救？","options":["因為水太冷了","因為常常會連自己也被拉下水，反而更危險","因為衣服會濕掉"],"answer":1,"explain":"自己跳下去常會被一起拉下水，反而更危險，所以要喊大人幫忙。"},{"q":"全家要去爬山，出門前小凱可以先做什麼事最好？","options":["告訴家人要去哪裡、大概什麼時候回來","偷偷出門不讓別人知道","什麼都不用說直接走"],"answer":0,"explain":"出門前先讓家人知道去哪裡、何時回來，萬一有事家人才找得到。"},{"q":"在山上走路時，走在哪裡最安全？","options":["自己跑到隊伍最前面","落在後面很遠自己慢慢逛","走在大人看得到的地方"],"answer":2,"explain":"走在大人看得到的地方，不跑太前也不落太後，才不會走散。"},{"q":"爬山時看到旁邊有一條沒有標示、鑽進樹叢的小路，小芳應該怎麼做？","options":["自己鑽進樹叢探險","走有標示的步道，不亂鑽樹叢","叫同學一起去闖闖看"],"answer":1,"explain":"走有標示的步道最不容易迷路，也比較不會遇到危險。"},{"q":"在山上看到路邊長了紅紅的野果，看起來很好吃，該怎麼辦？","options":["摘下來馬上吃","不亂採也不亂吃，好奇就問大人","多摘一些帶回家吃"],"answer":1,"explain":"野果、野菇不亂採不亂吃，因為有些有毒，想知道就問大人。"},{"q":"萬一在山上不小心和大人走散了，最好怎麼做？","options":["自己到處亂走找路","待在原地不亂走，大聲呼喊等大人來找","躲起來不出聲"],"answer":1,"explain":"走散時待在原地大聲呼喊，大人更容易找到你。"},{"q":"放颱風假的時候，小宇待在家裡，下面哪個做法最好？","options":["關好門窗，聽爸媽和氣象的提醒","跑去河邊玩水看溪水漲多高","自己出門去山上玩"],"answer":0,"explain":"颱風天關好門窗、待在家裡最安心，不去海邊河邊才安全。"},{"q":"在操場上玩的時候突然打雷了，最好趕快躲到哪裡？","options":["空曠的操場中間","室內或硬頂的車子裡","大樹下面"],"answer":1,"explain":"打雷時趕快進到室內或車子裡，才不會被雷打到。"},{"q":"打雷時，下面哪個地方一定要遠離？","options":["室內的房間","電線桿和高高的大樹","有屋頂的家裡"],"answer":1,"explain":"打雷時要遠離大樹、電線桿這些高高的東西，因為容易被雷打到。"},{"q":"在外面走路時聽到打雷，附近沒有房子，小庭應該怎麼做？","options":["停在原地躲到大樹下","繼續往最近的室內移動，遠離空曠地和大樹","站在空曠的田野中間等雨停"],"answer":1,"explain":"聽到打雷不要停，趕快往最近的室內移動並遠離大樹，才能躲開雷擊。"},{"q":"過馬路的時候，小廷很想一邊走一邊看手機上的影片，這樣好嗎？","options":["把手機收起來，專心看路和來車","戴上耳機聽音樂比較不無聊","邊走邊看，走快一點就好"],"answer":0,"explain":"過馬路時眼睛和耳朵都要留意四周，把手機收起來、拿下耳機才聽得到、看得到有沒有車，走過去才安全。"},{"q":"小安正要過馬路，這時候綠燈開始一閃一閃的，他應該怎麼做？","options":["用力衝過去，趕在燈變之前","不要搶著過，退回人行道等下一次綠燈","站在馬路中間等下一個綠燈"],"answer":1,"explain":"綠燈閃爍代表快要變燈了，時間可能不夠走完，最安全的是留在人行道上，耐心等下一次穩穩的綠燈再過。"},{"q":"在沒有紅綠燈、只有斑馬線的路口要過馬路，小美應該怎麼做？","options":["低頭快步走過去，車子會讓她","對著來車揮手要車子快點停","看清楚兩邊的車都停下或很遠，再走過去"],"answer":2,"explain":"沒有號誌的斑馬線更要靠自己判斷，先確認來車真的停下或距離很遠，確定安全了才踏出去。"},{"q":"和爸爸媽媽一起過馬路時，下面哪個做法最好？","options":["牽好大人的手，一起看清楚再走","自己先跑過去，大人在後面跟","放開手自己走，才像大孩子"],"answer":0,"explain":"牽著大人的手一起過馬路，大人看得比較高、比較遠，可以一起注意來車，走起來更安全。"},{"q":"馬路很寬，小凱走到中間安全島時，綠燈剛好變成紅燈，他該怎麼辦？","options":["趕快跑完剩下的一半","站在安全島上，等下一次綠燈再走","往回跑到剛才出發的地方"],"answer":1,"explain":"安全島就是給行人中途等待的地方，站在上面等下一次綠燈最安全，這時候往前衝或往回跑都可能碰到正在開的車。"},{"q":"要到馬路對面，附近剛好有天橋或地下道，下面哪個做法最安全？","options":["直接從車子中間的空隙鑽過去","等車少的時候快速跑過去","走天橋或地下道到對面"],"answer":2,"explain":"天橋和地下道是專門讓行人安全通過的路，走這裡完全不會和車子搶道，比在車陣中穿越安全多了。"},{"q":"下雨天撐著傘過馬路，雨傘擋住了前面的視線，小華應該怎麼做？","options":["把傘稍微抬高或側一邊，看清楚路況再走","低著頭快步走，反正很快就到","把傘壓低擋雨，別管看不看得到車"],"answer":0,"explain":"下雨天車子比較不好停，行人更要看清楚。把傘稍微抬起或斜一點，讓自己看得到來車，也讓開車的人看得到你。"},{"q":"停在路邊的公車擋住了視線，小宇想從公車前面穿過馬路，這樣好嗎？","options":["從公車前面快步穿過去就好","公車擋著看不到來車，很危險，應到有斑馬線和號誌的地方過","等公車開一點點再從前面過"],"answer":1,"explain":"停著的大車會擋住視線，你看不到旁邊的車，別的車也看不到你。應該走到看得清楚、有斑馬線和號誌的地方再過馬路。"},{"q":"要坐爸爸的機車出門，戴安全帽時下面哪個做法最正確？","options":["戴上就好，扣環扣不扣沒關係","把安全帽掛在手上，到了再戴","戴好安全帽，並把下巴的扣環扣緊"],"answer":2,"explain":"安全帽要戴好、扣環也要扣緊，萬一遇到緊急狀況才不會滑掉，好好保護頭部。"},{"q":"繫上汽車安全帶後，發現帶子卡到脖子很不舒服，小玲應該怎麼做？","options":["請大人幫忙調整，讓帶子好好貼在肩膀和胸前","嫌麻煩就把安全帶解開","把肩膀那條帶子塞到手臂後面"],"answer":0,"explain":"安全帶要好好通過肩膀和胸前才能保護你。覺得不舒服時請大人幫忙調整，千萬不要解開或把它塞到背後。"},{"q":"小朋友坐汽車時，坐在哪個位置比較安全？","options":["坐在前座才看得清楚風景","坐在後座，並使用適合的安全座椅或坐墊","站在後座中間和大人聊天"],"answer":1,"explain":"小朋友坐在後座、用適合身高體重的安全座椅或增高墊最安全，前座在緊急狀況時風險比較大。"},{"q":"車子正在路上開，小杰和弟弟想在後座玩追打遊戲，這樣好嗎？","options":["打鬧一下沒關係，反正有安全帶","解開安全帶才好玩得開","坐好繫好安全帶，不要在車上打鬧"],"answer":2,"explain":"車子行進中打鬧會讓大家分心，緊急煞車時也容易受傷。坐好、繫好安全帶，安靜一點最安全。"},{"q":"坐公車到站下車後，想過到馬路對面，小婷應該怎麼做？","options":["等公車開走、視線清楚了，再走到斑馬線過馬路","從公車前面繞過去比較快","從公車後面馬上衝過去"],"answer":0,"explain":"公車停著會擋住視線，等它開走、看得清楚後，再到有斑馬線的地方過馬路，才不會有看不見的車突然出現。"},{"q":"開車門下車時，小凱坐在靠馬路的那一側，他應該怎麼做？","options":["用力把門一次推開，動作快一點","先看後面有沒有來車或腳踏車，慢慢開一點點門","不用看，直接開門跳下車"],"answer":1,"explain":"靠馬路那側常有機車和腳踏車經過，開門前先回頭看、慢慢開，才不會撞到後面來的人。"},{"q":"去游泳池玩水之前，下面哪件事最好先做？","options":["先下水泡一泡再說","吃很飽以後馬上跳下水","先做暖身操，讓身體活動開再下水"],"answer":2,"explain":"下水前先暖身，讓手腳活動開，比較不會抽筋。剛吃很飽或身體不舒服時都不適合馬上下水。"},{"q":"游泳的時候，小明突然覺得小腿抽筋、很痛，他應該怎麼做？","options":["盡量放輕鬆、浮在水面，大聲呼救請大人幫忙","繼續用力游回岸邊","憋氣潛到水底忍一忍"],"answer":0,"explain":"抽筋時越緊張越危險，盡量放鬆讓身體浮著，同時大聲呼救讓大人和救生員來幫忙最重要。"},{"q":"到海邊玩，看到立著「危險，禁止游泳」的牌子，小芳應該怎麼做？","options":["別人有下水，我也可以下去","聽從警告，不要進入那片水域","只在旁邊踩踩水應該沒關係"],"answer":1,"explain":"警告牌代表那裡的水下或水流很危險。看到禁止游泳的牌子就不要進去，找安全、有人看管的地方玩水。"},{"q":"帶著游泳圈在水裡玩，小志覺得很安全，可以自己跑到很深的地方嗎？","options":["有游泳圈就很安全，可以去深水區","把游泳圈丟掉去深水區練膽量","游泳圈可能漏氣或翻掉，還是要待在大人看得到的淺水處"],"answer":2,"explain":"游泳圈只是輔助，可能會漏氣或翻掉，不能完全依賴。玩水一定要有大人在旁邊，並待在安全的淺水區。"},{"q":"在溪邊玩，石頭上長了青苔又濕又滑，小庭想踩上去，她應該怎麼做？","options":["小心不要踩濕滑的石頭，走安全的地方，並牽好大人","快速跳上去比較不會滑","脫鞋光腳踩才不會滑"],"answer":0,"explain":"濕滑的石頭很容易跌倒滑進水裡。要避開這些地方、牽好大人慢慢走，安全比玩得盡興更重要。"},{"q":"全家要去爬山，出發前小宇可以先做哪件事最好？","options":["什麼都不用準備，到了再說","查好天氣、規劃路線，並告訴沒去的家人行程","偷偷出發，不用讓家人知道去哪"],"answer":1,"explain":"出發前查天氣、看好路線，並把行程告訴家人，萬一發生狀況別人才知道去哪裡找你，是很重要的安全準備。"},{"q":"爬山的時候，包包裡帶什麼最重要，可以保護自己？","options":["只帶零食就好","帶很重的玩具比較好玩","帶足夠的水和保暖的外套"],"answer":2,"explain":"山上活動流汗多、天氣變化快，帶足夠的水才不會渴、帶件外套天冷或下雨時能保暖，都是保護自己的好準備。"},{"q":"爬山走到一半，小美走得比較慢，落在隊伍後面看不到大家了，她應該怎麼做？","options":["出聲呼喊，並待在步道上等大家，不要亂走","自己找捷徑追上去","抄小路穿過樹叢趕快跟上"],"answer":0,"explain":"落單時亂走或抄捷徑很容易迷路。留在原本的步道上、出聲呼喊，等隊伍回來找你最安全。"},{"q":"太陽快下山了，山還沒爬到頂，小凱很想繼續往上衝，這樣好嗎？","options":["反正快到了，摸黑也要爬上去","天黑前應該準備下山，不要硬撐往上爬","一個人先往上衝，大人在後面追"],"answer":1,"explain":"山上天黑得快，看不清路很容易受傷或迷路。要在天黑前留時間安全下山，山頂下次再來就好。"},{"q":"爬山時看到步道旁有蜜蜂飛來飛去，小華應該怎麼做？","options":["用手揮打把牠們趕走","靠近一點看牠們在做什麼","安靜、慢慢地離開，不要揮打或大叫"],"answer":2,"explain":"揮打或大叫會讓蜜蜂受驚而攻擊。遇到蜜蜂要冷靜、放慢動作慢慢離開，才不會被螫到。"},{"q":"山上突然起了大霧，前面的路看不太清楚，小婷和隊伍應該怎麼做？","options":["跟緊隊伍、放慢速度，聽從大人的指示","加快腳步趁還看得到趕路","自己往前跑，找看得清楚的地方"],"answer":0,"explain":"起霧時看不清路，走散或走錯路的風險很高。這時要跟緊隊伍、放慢腳步，聽大人安排最安全。"},{"q":"颱風來的時候，有人說去海邊看大浪很壯觀，小志可以去嗎？","options":["戴好帽子就可以去看","絕對不可以，颱風時的大浪很危險，要待在室內","站遠一點看應該沒事"],"answer":1,"explain":"颱風時的海浪又大又急，一個大浪就可能把人捲走，非常危險。颱風天要乖乖待在室內，不要靠近海邊或溪邊。"},{"q":"颱風天在家裡，外面風很大，小玲喜歡站在大窗戶邊看，這樣好嗎？","options":["站在窗邊看比較清楚","把窗戶打開看得更清楚","離窗戶遠一點，玻璃萬一被吹破會受傷"],"answer":2,"explain":"強風可能把東西吹到窗戶上，或把玻璃震破。颱風天要離窗戶遠一點，待在屋子裡比較安全的地方。"},{"q":"外面在打雷，小安剛好在一棵大樹下躲雨，他應該怎麼做？","options":["趕快離開大樹，到室內或安全的地方躲","繼續待在大樹下比較不會淋濕","爬到樹上躲雨"],"answer":0,"explain":"打雷時，又高又大的樹很容易被雷打到，躲在下面很危險。應該趕快離開，到有屋頂的建築物裡面躲。"},{"q":"打雷的時候，下面哪個地方待著最危險？","options":["家裡的客廳","空曠的操場中央或水裡","有屋頂的室內走廊"],"answer":1,"explain":"空曠的地方和水裡最容易被雷擊中，因為附近沒有更高的東西幫忙擋。打雷時要趕快進到室內。"},{"q":"打雷下雨時，小杰在外面，最好趕快躲到哪裡？","options":["躲到路邊的電線桿旁邊","站在空地上撐傘","躲進堅固的建築物室內"],"answer":2,"explain":"堅固的建築物室內最安全。電線桿又高又通電、空地又空曠，打雷時都是很危險的地方，要遠離。"},{"q":"颱風過後路上有積水，還在流動，小宇想去踩水玩，這樣好嗎？","options":["不要去玩積水，水下可能有危險，也可能有暗溝","穿雨鞋踩一下沒關係","跳進最深的地方最好玩"],"answer":0,"explain":"淹水時看不到水面下，可能有打開的水溝或尖銳的東西，水也可能突然變深變急。颱風天的積水千萬不要去玩。"},{"q":"颱風天走在外面，看到店家的招牌被風吹得搖搖晃晃，小庭應該怎麼做？","options":["站在招牌下面躲風","趕快離開招牌下方，到安全的室內","停下來看招牌會不會掉"],"answer":1,"explain":"強風可能把招牌或樹枝吹落砸下來。經過時要遠離會搖晃的招牌、看板，趕快到安全的室內最重要。"},{"q":"在戶外遇到打雷，小華手上正撐著雨傘、拿著長長的東西，他應該怎麼做？","options":["把傘舉得更高擋雨","把長桿子指向天空看看","放下高舉的雨傘和長桿子，盡快到室內躲避"],"answer":2,"explain":"高舉的雨傘或長桿子會讓自己變成最高點，比較容易被雷打到。打雷時要放下這些東西，趕快進到室內。"},{"q":"坐機車時，小凱覺得把手伸出去感受風很好玩，這樣好嗎？","options":["雙手要抓好，不可以把手伸到車外","伸出去一下下沒關係","把手張開像翅膀一樣飛"],"answer":0,"explain":"把手伸到車外可能撞到旁邊經過的車或路邊的東西，非常危險。坐車時手腳都要收好、抓穩。"},{"q":"上車的時候，小美應該從哪一側上車比較安全？","options":["從靠馬路的那一側比較快","從靠人行道、遠離馬路的那一側","從哪一邊都一樣，隨便上"],"answer":1,"explain":"從靠人行道的那側上下車，才不會站在馬路上被經過的車撞到。靠馬路那側有來車，比較危險。"},{"q":"去河邊玩水，就算旁邊有會游泳的大哥哥，小志還是要注意什麼？","options":["有人在就一定安全，可以隨便玩","比賽看誰游到最遠的地方","還是要有能照顧大家的大人在，並待在安全的水域"],"answer":2,"explain":"會游泳不代表就能救人。玩水一定要有能負責照顧的大人在場，並待在安全、可以踩到底的地方，不逞強比遠。"},{"q":"爬山走在步道上，小婷看到旁邊有一條沒有欄杆、靠近山崖邊的小路，她應該怎麼做？","options":["走過去靠近崖邊看風景","走在步道內側，遠離沒有欄杆的崖邊，牽好大人","站到崖邊拍張照"],"answer":1,"explain":"沒有欄杆的崖邊很容易失足摔下去。走路要靠步道內側、遠離邊緣，並牽好大人，安全欣賞風景。"}],"communication":[{"q":"同樣一句「我沒事」，怎麼說最可能代表對方其實心裡有事？","options":["用輕快、大方的聲音說","用很小聲、慢慢的語氣，眼神還往下看","一邊笑一邊說","說完馬上跑去玩"],"answer":1,"explain":"聽語氣、看表情，不只聽字面，就更能讀懂對方真正的心情。"},{"q":"走進教室，發現大家突然都安靜下來、氣氛怪怪的。最體貼的第一步是？","options":["大聲問「你們在幹嘛？」","先安靜觀察一下氣氛，別急著大聲說笑","馬上講個笑話讓大家開心","假裝沒看到繼續做自己的事都不理人"],"answer":1,"explain":"先安靜讀一下氣氛，就不會不小心踩到別人的心情。"},{"q":"朋友一直不太想講話、把身體轉開、低著頭。這些身體訊號通常代表什麼？","options":["他很想跟你聊天","他可能心情不好或不想講話","他覺得你很好笑","他在等你送他禮物"],"answer":1,"explain":"身體語言會透露心情，讀懂之後少說多陪，就是最溫暖的做法。"},{"q":"看出朋友正在難過時，下面哪個做法最體貼？","options":["一直追問「你到底怎麼了啦」","少說多陪，安靜坐旁邊或遞張衛生紙","跟他說「這沒什麼好難過的」","馬上換個超好笑的話題轉移他"],"answer":1,"explain":"讀懂情緒後用行動關心，安靜的陪伴常常比很多話更有力量。"},{"q":"當你心裡冒出「怪怪的、我不想跟他走」的感覺時，最好怎麼做？","options":["先相信這個感覺，保護自己","罵自己想太多，硬把感覺壓下去","一定要先找到證據才可以離開","覺得不好意思，就勉強留下來"],"answer":0,"explain":"心裡「怪怪的」是身體給的保護鈴，感覺不對就有權利保護自己。"},{"q":"在外面覺得有個人讓你很不安全，這時候往哪裡走比較安全？","options":["跟著他走到人少安靜的地方","往店員、警衛或人多明亮的地方走","躲到沒有人的角落自己待著","站在原地不動，等他先離開"],"answer":1,"explain":"拉開距離、走向人多的地方，安全永遠比怕尷尬更重要。"},{"q":"有個大人給你禮物，還小聲說「這是我們的祕密，不可以告訴爸媽」。這時候最該做的是？","options":["乖乖保守這個祕密","覺得毛毛的，回家把整件事告訴爸媽或老師","把禮物收好就當沒事","自己一個人默默想清楚就好"],"answer":1,"explain":"要你瞞著爸媽保守祕密是危險訊號，講給可信的大人聽永遠是對的。"},{"q":"下面哪一個是需要提高警覺的危險訊號？","options":["老師在課堂上請大家一起打掃","陌生大人一直要你單獨跟他走、別告訴爸媽","同學邀你下課一起在操場玩","媽媽叫你幫忙拿碗筷"],"answer":1,"explain":"認得出危險訊號，就能在感覺不對時及早保護自己。"},{"q":"同學不小心弄倒你的水壺，弄濕了作業。用「我訊息」表達，下面哪句最好？","options":["你很煩耶，走開啦！","作業被弄濕了，我有點著急，可以幫我一起擦乾嗎？","你就是個冒失鬼！","你每次都這樣，最討厭了！"],"answer":1,"explain":"說事實、加感受、再提出請求，對方比較聽得進去。"},{"q":"「我訊息」和「你訊息」最大的不同是什麼？","options":["我訊息講自己的感受和需要，不是罵對方是什麼樣的人","我訊息就是講話比較大聲","我訊息一定要先道歉","我訊息就是什麼都不說忍下來"],"answer":0,"explain":"說出自己的感受而不是指責對方，問題才真的有機會解決。"},{"q":"很生氣、怕自己說出難聽話時，用「我訊息」可以怎麼先處理？","options":["趕快把心裡的氣全部罵出來","先說「我現在有點生氣，需要一點時間，等一下再談」","假裝沒事，把氣悶在心裡","直接說「都是你害的」"],"answer":1,"explain":"先喊暫停、冷靜後再談，這不是逃避，而是很負責任的做法。"},{"q":"下面哪一句是「描述行為」而不是「貼標籤」，比較不會讓人覺得被否定？","options":["你就是個懶惰的人","這次的分工你還沒做完，我有點擔心來不及","你這個人真沒用","你根本什麼都不會"],"answer":1,"explain":"講具體的那件事，對方才知道怎麼改，這就是好好說話的祕訣。"},{"q":"同學上台報告講得有點結巴，你覺得他準備不夠。下面哪個反應最不會刺傷人又能幫到他？","options":["當眾說「你也太爛了吧」","私下跟他說「下次我們可以一起多練幾次」","在台下笑他","跟旁邊的人講他好丟臉"],"answer":1,"explain":"要提醒就私下說、保住對方的面子，他會更願意進步。"},{"q":"開口前先過一個「濾網」，要問自己哪三件事？","options":["這句話夠不夠大聲、夠不夠快、夠不夠兇","這句話是真的嗎？是善意的嗎？是必要的嗎？","有沒有人聽到、會不會被罵、好不好笑","對方會不會哭、會不會生氣、會不會告狀"],"answer":1,"explain":"說話前先過濾一下，就能在快說出傷人的話前踩剎車。"},{"q":"下面哪一種話最容易刺傷人、點燃衝突？","options":["嘲笑別人的外表、揭人瘡疤、詛咒別人","說「謝謝你幫我」","說「我們一起想辦法吧」","說「你今天看起來很開心」"],"answer":0,"explain":"這些話攻擊的是別人的自尊，認得出它們就能避開衝突地雷。"},{"q":"如果你不小心說出了傷人的話，最好的補救方式是？","options":["裝作沒說過","越快真誠道歉越好，說「對不起，我不是那個意思」","再說一句更兇的把場面壓過去","叫對方也不要太計較"],"answer":1,"explain":"話收不回，但真誠道歉可以修補關係。"},{"q":"班上群組裡有人貼某個同學的糗照，一堆人跟著留言嘲笑。你最好的做法是？","options":["跟著留言比較好玩","不跟風、不轉傳，私下傳訊息關心被笑的同學，並告訴大人","把糗照轉給更多人看","按個讚就好，反正不是我先開始的"],"answer":1,"explain":"不起鬨就是一種幫忙，私下關心對方，能讓網路變得更友善。"},{"q":"如果你被陌生帳號一直傳很難聽、羞辱你的訊息，下面哪個順序最能保護自己？","options":["自己一個人硬撐，什麼都不說","先截圖存證，封鎖對方，再告訴信任的大人","回傳更難聽的話罵回去","刪掉訊息假裝沒發生過"],"answer":1,"explain":"截圖、封鎖、再告訴大人，這不是告狀，而是保護自己的方法，沒有人需要一個人扛。"},{"q":"在網路上打字，為什麼很容易被誤會？","options":["因為文字看不到表情、聽不到語氣","因為網路很慢","因為大家都不識字","因為手機螢幕太小"],"answer":0,"explain":"文字看不到表情、聽不到語氣，怕誤會時可以加表情符號或直接說「我是開玩笑的喔」。"},{"q":"有人在網路上說你很難聽的話，你越看越難過。下面哪個想法最健康？","options":["他說的一定都是真的，我就是那樣的人","被罵的話不等於事實，那是他的問題，不是我的價值","我要罵回去讓他也難過","我以後都不敢再上網了"],"answer":1,"explain":"被罵的話不等於事實，一個人的價值不是別人一句話能決定的。"},{"q":"被同學故意撞一下、還笑著挑釁「怎樣，不爽喔？」你火氣一下衝上來。最好的做法是？","options":["馬上推回去讓他也痛","先深呼吸、平靜地說「我不想吵」然後走開","大聲罵他一頓","揪一群人去堵他"],"answer":1,"explain":"不接對方的挑釁，這場架就吵不起來，能忍住脾氣是很有力量的事。"},{"q":"被激怒、最想爆炸的那幾秒，先按下「暫停鍵」有什麼好處？","options":["讓最衝的怒氣先降下來，避免做出後悔的事","代表你輸了、很懦弱","讓對方以為你怕他","沒有任何用處"],"answer":0,"explain":"先暫停不是輸，而是能當自己情緒的主人。"},{"q":"就算「是對方先開始的」，如果你動手打回去，通常會怎樣？","options":["一定沒事，因為錯的是他","你也變成衝突的一部分，一樣可能被處罰","大家都會覺得你很威風","問題馬上就解決了"],"answer":1,"explain":"一旦出手就很難說得清，先離開、事後找大人處理最好。"},{"q":"坐你前面的同學突然大叫，把桌上的東西往外丟。你第一件該做的事是？","options":["衝上去把他抓住制止他","先往後退、離開東西丟得到的範圍","拿出手機錄影","大聲笑他發瘋"],"answer":1,"explain":"先拉開距離保護自己最重要，這是保護大家的第一步。"},{"q":"同學情緒爆發、現場有點危險時，下面哪個做法對？","options":["留在原地圍觀看熱鬧","護住頭臉、退到安全處，並趕快去找老師來","自己上前跟他講道理","跟著大家一起嗆他"],"answer":1,"explain":"護住頭、退開、找大人，把幫助他的工作交給老師。"},{"q":"有人起鬨說「他每次都這樣，超怪的，大家一起看他發瘋！」你怎麼回應比較好？","options":["跟著一起笑他","說「不要這樣，他可能只是很難受」，安靜保持距離等老師來","拍手叫大家繼續看","也上去說幾句氣他的話"],"answer":1,"explain":"用同理、不歧視的眼光看待同學，不刺激他才是真正的善良。"},{"q":"班上新來一位坐輪椅的同學，有人偷偷笑他、學他的樣子。你最好怎麼做？","options":["跟著一起學他好玩","說「不要這樣講啦」，走過去陪他，並告訴老師","假裝沒看到就好","也在旁邊指指點點"],"answer":1,"explain":"不參與嘲笑、主動釋出善意，一份接納可能就是他一整天的溫暖。"},{"q":"同理心指的是什麼？","options":["願意停下來想想「如果我是他，我會有什麼感覺」","什麼事都聽別人的","把自己的想法強加給別人","覺得別人都跟自己一樣"],"answer":0,"explain":"願意換位思考，就會發現很多『怪』其實只是『不一樣』而已。"},{"q":"發現同學跟你「不一樣」（例如講話有口音、家裡狀況不同），最尊重的想法是？","options":["他好奇怪，離他遠一點","他跟我們不太一樣，但那沒關係","一定要糾正他變得跟大家一樣","拿他的不同來取笑"],"answer":1,"explain":"把『不一樣』當成『特別』，這樣的班級才會讓大家都安心。"},{"q":"關於「生氣、難過、害怕、嫉妒」這些情緒，下面哪句話是對的？","options":["這些情緒本身沒有好壞、沒有對錯，是正常的","有這些情緒代表你是壞小孩","好孩子不可以有這些情緒","有情緒就要馬上發洩出來"],"answer":0,"explain":"情緒沒有對錯，看懂它、幫它取名字，就比較不會被情緒牽著走。"},{"q":"下面哪一句最符合「情緒沒有對錯，但行為有分別」？","options":["可以生氣，但不可以打人","生氣了就一定要摔東西","難過就要一直哭到別人受不了","嫉妒就要去破壞對方的東西"],"answer":0,"explain":"感覺可以有，但怎麼表現出來是可以選擇的。"},{"q":"心裡有很強的情緒時，「先幫它命名」有什麼好處？","options":["光是說出「我現在很生氣」，強度常常就降一半","會讓情緒變得更嚴重","會被別人笑","一點用都沒有"],"answer":0,"explain":"先停下來說出感覺，情緒就沒那麼容易牽著你走。"},{"q":"你和同學越吵越兇，氣到很想動手。下面哪個是可以馬上用的冷靜方法？","options":["深呼吸、對自己說「我需要冷靜一下」，先離開現場","更用力吼回去","把桌子拍得很大聲","衝過去推他一把"],"answer":0,"explain":"先幫大腦踩剎車、離開刺激源，冷靜下來才想得出好辦法。"},{"q":"「5-4-3-2-1」冷靜法是怎麼做的？","options":["說出看到的5樣、聽到的4種、摸到的3樣、聞到的2種、嚐到的1種","從1快速數到5就好","把生氣的事講5遍","跳5下就結束"],"answer":0,"explain":"用感官把注意力拉回現在，緊張感會慢慢降下來，好用又免費。"},{"q":"下面哪一個是能幫自己冷靜、又不用道具的好方法？","options":["慢慢深呼吸，把吐氣拉長","把心裡的氣全部發洩在別人身上","一直想那件讓你生氣的事","把作業本撕掉"],"answer":0,"explain":"把吐氣拉長，身體會跟著慢下來，這個方法隨時都能用。"},{"q":"電動一直過不了關，氣到很想罵「這遊戲爛死了！」把手把一丟。比較好的做法是？","options":["繼續怪遊戲、怪手把","先深呼吸冷靜一下，再把最卡的一小段拆出來練","直接放棄再也不玩","去怪旁邊的人吵到你"],"answer":1,"explain":"怪東西不會讓關卡變簡單，把力氣留下來再試一次才會慢慢變強。"},{"q":"遇到很難的事、覺得自己做不到時，對自己說哪句話比較好也比較正確？","options":["我很爛，我就是不行","我還沒學會，再試一次","反正我一定做不到","這件事本來就是為難我"],"answer":1,"explain":"一個「還」字，就把「永遠不會」變成「現在正在學」。"},{"q":"覺得一件事「太難了」的時候，其實常常代表什麼？","options":["你壞掉了、沒救了","你的大腦正在長新東西，這是學會的必經過程","你應該馬上放棄","這件事不值得做"],"answer":1,"explain":"覺得難，正是在進步；很厲害的人也都是失敗很多次才變厲害的。"},{"q":"考單字時前面都對，寫到第八個發現拼錯了一個，心裡冒出「我全錯了，不想考了」。比較好的做法是？","options":["就此放棄不寫了","告訴自己「我只錯一個，其他都做到了」，把後面能做對的先完成","把整張都劃掉重來","生氣地把筆丟掉"],"answer":1,"explain":"一個錯，擋不住其他做對的努力，部分成功也是成功。"},{"q":"「只要錯一個，就等於整份都失敗、全毀了。」這個想法對不對？","options":["對，錯一個就沒救了","不對，這是「非黑即白」的想法，一個錯抹不掉你做對的一大堆","對，一定要滿分才算成功","不對，因為根本不會有人錯"],"answer":1,"explain":"把做對的地方數出來，常會發現其實已經完成了好多。"},{"q":"鋼琴比賽表演到一半不小心彈錯一個音，很懊惱。這時候最好的做法是？","options":["停下來不彈了","深呼吸，把那個錯放著，繼續把後面彈完","當場哭出來離開舞台","生氣地重頭再彈一次"],"answer":1,"explain":"別因為一個錯就停擺，把剩下的完成就好。"},{"q":"午休時，你想找同學借彩色筆，走過去才發現他正把便當推到一旁、手撐著頭、嘆了一口氣。這時候最貼心的第一步是？","options":["先輕聲問一句「你還好嗎？需要我陪你嗎？」，再決定要不要借東西","照樣笑著大聲說：「借我彩色筆啦！」","覺得他心情差就不理他，自己走開不說話"],"answer":0,"explain":"看到對方低落的身體訊號時，先關心、確認需要，比急著談自己的事更溫暖，也讓對方感覺被在乎。"},{"q":"同學講話時總是很小聲、眼睛不太看人、手一直搓衣角。從這些訊號，你可以先猜他現在的心情比較可能是？","options":["很得意、想炫耀","有點緊張或沒把握","故意不理你、討厭你"],"answer":1,"explain":"小聲、少眼神接觸、手部小動作常常是緊張或不安的訊號。先這樣理解，就能用比較溫和的方式回應對方。"},{"q":"你不小心撞到同學，害他手上的水彩灑了一地。想好好道歉，下面哪一句最誠懇、也最能修復關係？","options":["「誰叫你站在路中間，又不是我故意的。」","「地板太滑了才會這樣，不能怪我。」","「對不起，我撞到你了，我幫你一起清理，好嗎？」"],"answer":2,"explain":"好好道歉是承認自己做了什麼，再表達願意補救。把責任推給別人或環境，只會讓對方更難過。"},{"q":"你排隊時被插隊，覺得很不公平。想用「我訊息」表達，下面哪一句最合適？","options":["「我排好久了，看到有人插到前面，我覺得有點不舒服，可以請你排到後面嗎？」","「你很沒禮貌耶，眼睛是不是瞎了？」","算了，什麼都不說，一直悶在心裡生氣"],"answer":0,"explain":"「我訊息」是說出自己看到什麼、感覺如何、希望怎麼做，既能表達不滿，也不會用難聽話點燃衝突。"},{"q":"你想提醒同學說話太大聲，下面哪一種說法比較「描述行為」而不是「貼標籤」，比較不會讓人覺得被否定？","options":["「你這個人有夠吵，煩死了。」","「剛剛你講話的音量有點大，我耳朵有點受不了，可以小聲一點嗎？」","「你天生就是這麼討人厭。」"],"answer":1,"explain":"描述當下的具體行為，對方比較聽得進去；用「你這個人怎樣怎樣」貼標籤，容易讓人覺得整個人被否定而反彈。"},{"q":"班上要選幹部，你落選了，心裡酸酸的。剛好看到當選的同學，下面哪個回應最能表現風度、也對自己比較好？","options":["跟大家說當選的人一定是作弊才選上的","從此不跟他說話，看到他就翻白眼","對他說「恭喜你，有需要幫忙的話我可以幫你」，難過的心情之後再慢慢消化"],"answer":2,"explain":"落選會難過是很正常的。願意先真誠祝福對方，同時允許自己慢慢處理失落，是既尊重別人也照顧自己的做法。"},{"q":"在班級群組裡，有人打了一句「隨便你啦」。因為看不到表情和語氣，你不確定他是生氣還是沒關係。這時候比較好的做法是？","options":["先別急著生氣，直接問一句「你是還好嗎？我怕我誤會你的意思」","直接認定他在嗆你，馬上回一句更兇的","截圖給別人看，說他態度很差"],"answer":0,"explain":"打字看不到表情和語氣，很容易被誤會。與其自己猜到生氣，不如溫和地問清楚，反而能避免不必要的衝突。"},{"q":"你在網路上看到同學被一群人留言嘲笑，你也認識那位被笑的同學。下面哪個做法最能幫到他、又不會讓自己也加入傷害？","options":["跟著留一句好笑的話，反正大家都在笑","不留嘲笑的話，私下傳訊息關心他，並把情況告訴信任的大人","假裝沒看到，把手機關掉就好"],"answer":1,"explain":"看到有人被網路嘲笑時，不加入、私下關心、再讓大人知道，就是螢幕背後最溫暖也最有力量的支持。"},{"q":"同學在遊戲裡贏了你，故意打字說：「哈哈你這麼爛還敢玩？」你越看越氣。下面哪個做法最能保護自己？","options":["用更難聽的話罵回去，一定要贏過他","整晚一直重看那句話，越想越難過","先離開對話深呼吸，需要的話封鎖對方，並告訴大人"],"answer":2,"explain":"面對網路上的挑釁，先離開、冷靜、必要時封鎖並找大人，比互相對罵更能保護自己的心情，也不會讓事情越滾越大。"},{"q":"你被同學故意用很難聽的綽號叫，氣得握緊拳頭很想推他。在動手前的那幾秒，最好先做什麼？","options":["深呼吸、在心裡默數到十，先讓身體離開現場","趁他沒注意，用力推他一把","立刻大吼髒話回去"],"answer":0,"explain":"被激怒時先按下「暫停鍵」，深呼吸、數數、離開現場，能讓衝動的那幾秒過去，才不會做出之後會後悔的事。"},{"q":"就算是「對方先弄你」，如果你忍不住動手打回去，通常結果會怎樣？","options":["對方一定會馬上道歉，事情就結束了","你反而可能一起被處理，事情也變得更複雜","大家都會覺得你很厲害，站在你這邊"],"answer":1,"explain":"動手之後，往往變成雙方都要負責，問題也更難解決。先暫停、找大人幫忙，才是真正保護自己的聰明做法。"},{"q":"隔壁組的同學突然情緒爆發，一邊哭一邊揮手把桌上的東西掃到地上。這時候你第一件該做的事是？","options":["靠過去抓住他的手，叫他不要鬧","站在旁邊拿手機拍下來","先保持一點距離、注意自己的安全，並趕快請老師來"],"answer":2,"explain":"同學情緒爆發、現場可能有危險時，先讓自己安全、再找老師幫忙，才能同時保護自己也不讓對方受更多傷。"},{"q":"同學情緒平復後，紅著眼睛坐在位子上。你想關心他，下面哪種做法最合適？","options":["私下輕聲說一句：「你現在有好一點嗎？」，不逼他馬上解釋","當著全班的面問他：「你剛剛為什麼發瘋？」","一直追問到底發生什麼事，不說不放過他"],"answer":0,"explain":"人在情緒剛平復時還很脆弱，私下、輕聲的關心，不急著追問原因，能讓對方感覺被尊重、也比較有安全感。"},{"q":"班上有位同學說話有很重的外地口音，有人學他講話取笑。你會怎麼做最好？","options":["跟著學他的口音，覺得很好玩","不參與取笑，如果方便就跟那位同學正常聊天，讓他覺得被接納","叫他以後乾脆不要講話"],"answer":1,"explain":"每個人的口音、背景本來就不一樣。不取笑、用平常心對待，就是對「不一樣的人」最基本的尊重。"},{"q":"你發現有位同學中午常常沒有便當，只喝水。下面哪種想法最能表現同理與尊重？","options":["大聲問他：「你家是不是很窮？」讓大家都聽到","覺得那是他家的事，跟我沒關係，還笑他","不隨便議論他的家庭，可以私下問老師能不能幫忙"],"answer":2,"explain":"同理是設身處地為對方著想。不當眾議論別人的難處、悄悄透過大人幫忙，既保護了對方的自尊，也給了實際的溫暖。"},{"q":"你考差了很生氣，很想把考卷撕掉。關於「生氣」這個情緒，下面哪句話是對的？","options":["生氣是很正常的情緒，重要的是別在氣頭上做出傷人或傷己的事","生氣是壞小孩才會有的情緒，要馬上壓下去","只要一生氣，就代表事情一定沒救了"],"answer":0,"explain":"生氣、難過、嫉妒都是正常的情緒，沒有對錯。關鍵在於我們選擇怎麼「行動」，而不是責怪自己有這些感覺。"},{"q":"心裡冒出很強的情緒時，先在心裡幫它「命名」，例如「我現在很失望」，這樣做有什麼好處？","options":["沒有用，講出來只會更嚴重","說出情緒的名字，能幫自己看清楚感覺，比較不會被情緒牽著走","命名之後就能永遠不再有這種感覺"],"answer":1,"explain":"幫情緒取名字，像是替一團亂的感覺貼上標籤，能讓我們更了解自己、稍微拉開距離，也更容易找到下一步該怎麼做。"},{"q":"你和弟弟為了搶遙控器越吵越兇，氣到手都在抖。下面哪個是可以馬上用、幫自己冷靜的好方法？","options":["先大罵一頓，把氣發洩在他身上","把遙控器摔到地上，看誰都不能看","先走到別的房間，慢慢做幾次深呼吸，等心跳緩下來再回來談"],"answer":2,"explain":"暫時離開現場、慢慢深呼吸，是隨時能用、又不用道具的冷靜法。等身體平靜下來，才比較有辦法好好把事情講清楚。"},{"q":"感覺快要爆炸的時候，有人會用「5-4-3-2-1」的方法讓自己回到當下。它主要是怎麼做的？","options":["找出身邊看得到、聽得到、摸得到的東西，一樣一樣數，把注意力拉回現在","用力憋氣憋到臉發紅為止","在心裡一直重複「我好氣、我好氣」"],"answer":0,"explain":"「5-4-3-2-1」是靠說出周圍看到、聽到、摸到的東西，把注意力從激動的情緒拉回眼前，讓自己慢慢穩下來。"},{"q":"你在拼一個很難的積木模型，試了好幾次都倒掉，很想大喊「這爛積木害的！」下面哪個想法對自己比較好、也比較正確？","options":["「都是積木的問題，這種東西本來就不可能拼好。」","「這關真的有點難，我可以先休息一下，再換個方法試試看。」","「我就是笨，以後再也不玩了。」"],"answer":1,"explain":"做不好時把錯全怪到東西或自己身上都沒有幫助。承認它很難、允許自己休息、再換方法，才是能真正進步的成長心態。"},{"q":"明天要上台朗讀，你一想到就心跳加快、手心冒汗。想讓自己更有把握，最有效的做法是什麼？","options":["告訴自己「反正一定會出糗」，乾脆不準備","一直不去想它，直到上台前一秒才開始擔心","事先多練習幾次，先在家人面前朗讀，熟悉了就會比較安心"],"answer":2,"explain":"上台前緊張很正常。真正能降低緊張的，是事先充分練習、找人試講，讓自己對內容越來越熟悉、越來越有把握。"},{"q":"你上台報告時，中間有一句話突然忘詞、停頓了幾秒。這時候最好怎麼做？","options":["深呼吸一下，看一眼小抄或跳到下一句，繼續把報告講完","當場說「我不行了」然後跑下台","站在原地一直責怪自己，越想越亂"],"answer":0,"explain":"表演或報告出一點小狀況是很常見的。穩住呼吸、接著往下講，觀眾多半不會太在意；先別讓一個小停頓打敗自己。"}],"selfmgmt":[{"q":"小柔一想到要背明天要考的國語課文，就覺得「好難喔」，結果先跑去餵魚、又整理抽屜。她真正卡住的原因最可能是什麼？","options":["她天生就是懶惰的小孩","她的大腦想逃開「怕背不起來」那種不舒服的感覺","餵魚和整理抽屜比背課文更重要","她永遠都不會背好課文了"],"answer":1,"explain":"拖延常常不是懶，而是大腦想逃開「怕做不好」那種不舒服的感覺。看懂這一點，就不必再罵自己了。"},{"q":"阿哲發現自己一直不想寫作文，靜下來想一想，原來是「題目太大，不知道要寫什麼」。找出這個原因對他有什麼幫助？","options":["知道自己很沒用","知道要放棄這篇作文","知道卡住的地方，才知道怎麼幫自己起步","證明他就是個愛拖延的人"],"answer":2,"explain":"先找出卡在哪裡，才知道怎麼幫自己起步；知道原因就能對症下藥。"},{"q":"妹妹遇到一題數學怎麼想都不會，於是一直拖著不寫。以下哪個做法最聰明？","options":["硬盯著題目，什麼都不做","跟大人或老師說「這題我不會，可以陪我看一下嗎」","假裝作業寫完了","把整本作業都不寫了"],"answer":1,"explain":"太難就開口求助，這一點都不丟臉，反而是聰明的選擇。"},{"q":"小賢寫評量寫到一半覺得好無聊，很想放下不寫。下面哪個做法可以讓「繼續下去」沒那麼痛苦？","options":["乾脆整晚都不寫了","一邊生氣一邊罵自己笨","配一個計時或放點喜歡的音樂，讓自己動起來","等到明天早上再一次趕完"],"answer":2,"explain":"太無聊就幫自己加點小陪伴，讓開始變得輕鬆一些。"},{"q":"同樣是面對還沒寫的作業，哪一句話對正在逃避的自己最有幫助？","options":["「我怎麼這麼懶，真是沒救了。」","「我不是懶，只是這件事讓我有點怕，先動一小步看看。」","「反正我就是做不好，不做了。」","「等我心情好再說吧。」"],"answer":1,"explain":"溫柔地接納自己、再起個頭，比一直罵自己更能往前走。"},{"q":"小美要做一份「我的家鄉」報告，覺得好大一團、完全不敢動手。下面哪個起步方式最好？","options":["等到心情很好、很有靈感的那一天再做","把它拆成小步驟，先只做「寫下題目」這一小塊","一次逼自己把整份報告寫完","先跟同學說這份報告太難做不完"],"answer":1,"explain":"任何大事都能拆成一階一階的小步，踏出第一步就沒那麼可怕了。"},{"q":"哥哥要練鋼琴卻一直不想開始。他決定用「先做 5 分鐘就好」。這個方法最主要在幫他克服什麼？","options":["練得比別人久","「開始」這個最難的部分","一次就把整首曲子彈到完美","永遠不用休息"],"answer":1,"explain":"「開始」往往是最難的一關，先做五分鐘，常常就自然做下去了。"},{"q":"小安脫下來的襪子丟在地上，他想「等一下再收」，其實彎腰撿起來放進洗衣籃只要十幾秒。根據「兩分鐘法則」，他該怎麼做？","options":["等到睡前一起收","現在立刻收好，不要讓它排隊等他","明天再說","等媽媽提醒再收"],"answer":1,"explain":"兩分鐘內能做完的小事現在就做掉，事情才不會越堆越多。"},{"q":"小婷把「做勞作」拆成好幾個小步驟，每做完一步就打一個勾。看著勾勾一個個變多，會帶來什麼好處？","options":["讓她越做越有動力繼續往下做","讓作業變得更難","讓她想直接放棄","浪費很多時間"],"answer":0,"explain":"每打一個勾都是一份小小成就感，會讓人越做越起勁。"},{"q":"阿凱寫一大張複習卷，一直想著「還有好多好多沒寫」，越想越煩、越不想動。比較好的想法是？","options":["把整張卷子的每一題同時都想一遍","只專心看「下一題」就好，做完再看下一題","算算看還剩幾題才能休息","想著寫不完會被罵"],"answer":1,"explain":"只看下一步，不去想「還有好多沒做」，心才不會被壓垮。"},{"q":"「早上先把最醜的青蛙吃掉」這句話是在提醒我們什麼？","options":["早餐要吃青蛙","每天先做那件最不想做、卻最重要的事","先做最簡單的事就好","把重要的事留到最後做"],"answer":1,"explain":"先解決最難的那一件，一整天都會覺得輕鬆，因為最重的石頭放下了。"},{"q":"阿樂今天最重要的是訂正一大題錯很多的數學，但他一直先削鉛筆、排桌面、看課外書，還覺得「我很認真啊」。這其實是什麼情形？","options":["他真的很認真","他用簡單的小事在逃避那件真正該做的事","削鉛筆比訂正數學重要","他今天沒事情要做"],"answer":1,"explain":"小心「假裝很忙」的陷阱，看穿它，就能把力氣放在真正該做的事上。"},{"q":"小恩發現最重要的那件事（複習明天要考的社會）好大，一想到就不敢開始。他該怎麼吃掉這隻大青蛙？","options":["先做別的簡單事，社會最後再說","把它拆成小步、先讀五分鐘看看","乾脆不複習了","等媽媽逼他才讀"],"answer":1,"explain":"青蛙很大時，先拆小步、先做五分鐘，一樣是在吃青蛙。"},{"q":"為什麼建議把最難、最重要的事排在一天的最前面先做？","options":["因為那時候精神最好、干擾最少，最容易解決它","因為那件事其實不重要","因為早上做事不算數","因為做完就可以不用睡覺"],"answer":0,"explain":"趁精神最好時先解決最難的，剩下的事就會變得輕鬆又愉快。"},{"q":"小傑好不容易把今天最難的作文寫完了。這時候他對自己說哪句話最合適？","options":["「反正一定寫得很爛。」","「最難的已經解決了，剩下的當獎勵慢慢做。」","「我怎麼拖這麼久才寫。」","「其他的乾脆都別做了。」"],"answer":1,"explain":"做完最難的那件事，記得給自己一句肯定。"},{"q":"小杰寫作業時把手機放在桌子旁邊，說「我不會去看啦」，結果手機一響就忍不住拿起來。比較好的做法是？","options":["把手機開靜音，放到看不到、拿不到的另一個房間或抽屜","把手機音量開到最大提醒自己別看","一邊寫一邊回訊息","邊寫邊放旁邊，靠意志力忍住"],"answer":0,"explain":"先把會分心的東西移開，比硬靠忍耐輕鬆多了，也更容易專心。"},{"q":"關於「番茄鐘」（專心一段時間、時間到就休息），下面哪個觀念是對的？","options":["休息是偷懶，最好都不要休息","排進休息才不會累垮，休息是聰明不是偷懶","一次要專心好幾個小時不能停","休息時要一直滑手機"],"answer":1,"explain":"專注力像手機電量，適時休息才充得回來。"},{"q":"為什麼「一邊寫作業一邊看電視」通常會又慢又容易出錯？","options":["因為電視會把作業寫完","因為注意力一直被搶走，被打斷後要花好幾分鐘才能重新專心","因為看電視會讓人變聰明","因為作業本身太簡單"],"answer":1,"explain":"把干擾移開、專心一小段，做事會又快又好，還多出時間去玩。"},{"q":"小圓正在番茄鐘的專心時段裡，突然想到「等等要記得帶美勞用具」。她最好怎麼處理？","options":["馬上放下作業去準備美勞用具","把它寫在紙上，等休息或做完再處理","一直想著這件事，沒辦法專心","乾脆結束今天的作業"],"answer":1,"explain":"專心時段只做一件事，雜事先記在紙上，專注就不會被打斷。"},{"q":"番茄鐘的 5 分鐘休息時間到了，下面哪個休息方式最能幫助小明再次專心？","options":["滑手機遊戲，結果停不下來","喝水、走動一下、看看遠方","開始看一部很長的卡通","跟朋友講很久的電話"],"answer":1,"explain":"真正的休息是讓身心放鬆一下，這樣下一輪才更有精神。"},{"q":"小雨每次想到要練直笛就說「等一下再說」，結果都拖到睡前才慌張地練。為什麼「等一下」常常沒用？","options":["因為未來的你，跟現在的你一樣不想做","因為直笛不需要練習","因為等一下就會自動練完","因為晚上練最好"],"answer":0,"explain":"打敗「等一下」最好的方法，就是現在先做一小步。"},{"q":"阿明覺得很難開始寫日記，他決定用「倒數 5 秒」的方法。這個方法怎麼用？","options":["心裡數 5、4、3、2、1，數到 1 就立刻開始動手","數到 5 之後再想要不要做","倒數五次深呼吸就去睡覺","數五秒後決定放棄"],"answer":0,"explain":"倒數到 1 就起跑，不給自己想東想西的空間，是很有效的起步方法。"},{"q":"阿光寫報告一直改來改去，覺得「不夠完美就不能交」，結果永遠寫不完。比較健康的想法是？","options":["一定要 100 分才可以交","做完 80 分，好過永遠停在腦中的 100 分","改到最後一秒才交","覺得自己很差就不交了"],"answer":1,"explain":"目標是「完成」不是「完美」，先做完就是很好的一步。"},{"q":"小樺常常覺得「怎麼做都不夠好、很難開始，好痛苦」。這種時候最好怎麼辦？","options":["這是她自己的錯，只能硬撐","跟大人或老師說，一起找方法，對自己溫柔一點","假裝沒這回事","從此都不做那件事"],"answer":1,"explain":"覺得很痛苦並不是誰的錯，說出來、找人幫忙，對自己溫柔一點會更好。"},{"q":"小豪想主動安排自己的功課時間，不要每次都被媽媽催。下面哪個做法最能做到這件事？","options":["主動跟媽媽說「我八點前會把功課寫完」，然後盡力做到","等媽媽催了再開始","跟媽媽說「我不想寫」","把功課藏起來假裝寫完"],"answer":0,"explain":"把模糊的「等一下」換成清楚的時間點並做到，就能慢慢握回自己的方向盤。"},{"q":"你答應爸爸「八點前寫完功課」，結果一直分心拖到快八點半還沒寫完。下次可以怎麼做比較好？","options":["以後都不要跟爸爸約定","先把功課切成小步、先寫十分鐘，並在專心時把干擾移開","把時間改成半夜十二點","乾脆不寫了"],"answer":1,"explain":"把大事切小步、先動起來，再把干擾移開，說到做到就會越來越容易。"},{"q":"小玲把該寫的評量寫完後才去玩最愛的積木。她發現這樣玩起來比平常更盡興，這是為什麼？","options":["因為積木變好玩了","因為沒有一件事懸在心上，玩得特別放鬆安心","因為玩之前做事會累到玩不動","因為她其實不喜歡玩積木"],"answer":1,"explain":"先做完該做的、再把想做的當獎勵，玩起來才真正踏實又安心。"},{"q":"下課十分鐘，小華想到回家要寫的作業就覺得心裡悶悶的，於是一直跟同學聊天不想去想它。這種「一想到就不舒服、很想別開頭」的感覺，最可能是什麼？","options":["那是大腦想暫時逃開不舒服的感覺，不代表他不好","他其實很懶，不想努力","那件作業一定不重要，可以不用做"],"answer":0,"explain":"拖延常是大腦想躲開「有點難、有點煩」的感覺，這是很正常的反應，不代表一個人懶或不好；認出這一點，就能溫柔地帶自己開始。"},{"q":"阿翔要背二十個英文單字，一看到「二十個」就頭皮發麻不想動。哪個起步方式最能幫他真正開始？","options":["逼自己一次背完二十個，背不完不准休息","先跟自己說「先背前三個就好」，做起來再說","乾脆先滑一下手機，等心情好一點再背"],"answer":1,"explain":"把大目標縮小成「只做一點點」，門檻低到很容易踏出第一步；一旦開始，往往就能順順地做下去。"},{"q":"今天有四件事：訂正錯很多的數學卷、澆花、看漫畫、擦桌子。小庭想「先把簡單的做完比較有成就感」，於是一直不碰數學。比較聰明的安排是？","options":["一直做小事，讓自己看起來很忙","等到晚上很累的時候再來面對數學","把最花力氣、最重要的數學訂正排在前面先做"],"answer":2,"explain":"人的專注力和精神在前面最充足，把最重要、最費力的事先完成，後面的小事就會變得輕鬆許多。"},{"q":"小宇打算用番茄鐘專心寫功課，他把桌上的漫畫、玩具和響個不停的平板都先收到別的房間。這樣做的好處是什麼？","options":["其實沒什麼用，反正他一定會分心","先把會吸引自己的東西移開，專心就不用一直靠忍耐","這樣桌子比較整齊，跟專心沒關係"],"answer":1,"explain":"與其一直用意志力忍住不去碰，不如一開始就把誘惑移到看不到的地方，專心自然變得容易，也比較不累。"},{"q":"寫評量寫到一半，小凱心裡冒出「等一下再寫，先休息看個影片」。哪個想法最能幫他不掉進「等一下」的陷阱？","options":["「反正還有時間，看完影片再說」","「今天狀態不好，明天一次補」","「先把這一頁寫完，寫完再好好休息」"],"answer":2,"explain":"「等一下」常會一拖再拖；設一個很近的小終點（例如這一頁），完成後再休息，才不會被拖延牽著走。"},{"q":"每天媽媽都要催好幾次，小恩才去寫功課。他想試著自己安排、不被催。哪個做法最能做到？","options":["跟自己約好每天回家先寫功課，再做想做的事","等媽媽開始生氣了再動，比較有動力","把功課留到睡前，反正一定會寫完"],"answer":0,"explain":"自己先訂好固定的時間和順序並照做，就是對自己負責；養成習慣後，就不需要別人一直提醒。"},{"q":"睡前小傑才發現明天要帶的美勞用具沒準備，翻箱倒櫃找到很晚。怎麼做能避免下次又這樣手忙腳亂？","options":["反正早上再找就好，通常來得及","前一天晚上照聯絡簿把隔天要用的東西先準備好放門口","叫爸媽早上幫忙一起找"],"answer":1,"explain":"前一晚照聯絡簿把隔天要帶的東西準備好、放在固定位置，早上就從容不慌張，這是照顧好自己的好習慣。"},{"q":"小雅每次考卷發回來，看到分數就收進書包，錯的題目從來不看。哪個習慣對她的進步最有幫助？","options":["只記住分數，錯的就算了","把考卷藏起來不要再看到","把錯的題目弄懂、訂正一遍，下次才不會再錯"],"answer":2,"explain":"分數只是結果，真正讓人進步的是把錯的地方弄懂並訂正；訂正過的題目，下次遇到就更有把握。"},{"q":"作業寫完了，小安正要闔上簿子。這時候多做哪個小動作，最能減少被退回重寫？","options":["從頭快速檢查一遍，看看有沒有漏寫或明顯的錯","趕快收起來，檢查很浪費時間","相信自己一定全對，不用看"],"answer":0,"explain":"完成後花一點點時間檢查，常能抓到漏寫、算錯或看錯題目的地方；養成檢查習慣，作業品質會穩定很多。"},{"q":"小柔覺得整理凌亂的書桌好麻煩，一直不想開始。用「先做 5 分鐘就好」，她可以怎麼做？","options":["等哪天有一整個下午再一次整理乾淨","先設鬧鐘整理五分鐘，時間到想停就停","乾脆不整理，反正明天又會亂"],"answer":1,"explain":"告訴自己「只做五分鐘」，開始的壓力就變很小；常常做著做著就有了動力，願意再多做一點。"},{"q":"哥哥答應自己「今天要練十分鐘鋼琴」，結果一忙就忘了，到睡前才想起沒練。怎麼做比較能真的做到？","options":["靠自己記住就好，不用寫下來","改成「有空再練」，比較沒壓力","把練琴排進固定時段，並在聯絡本或行事曆上記下來"],"answer":2,"explain":"對自己說到做到的祕訣，是把承諾放進固定時間並寫下來提醒，而不是全靠臨時想起；這樣才不會一忙就忘。"},{"q":"面對一整張還沒寫的複習卷，小睿越看越覺得「好多喔，寫不完」，整個人動彈不得。比較有幫助的做法是？","options":["把整張卷分成幾個小區塊，一次只專心寫一塊","一直盯著整張想「還有好多」，逼自己快一點","先擱著，等心情變好再一次寫完"],"answer":0,"explain":"把一大團工作切成小塊，眼前只面對一小塊，心裡的壓力就小很多，也更容易一塊一塊地完成。"},{"q":"番茄鐘的專心時間還沒到，小圓突然很想查一件跟功課無關的事。最能維持專心的做法是？","options":["馬上停下來去查，查完再回來寫","把想查的事寫在小紙條上，等休息時間再處理","一邊寫一邊查，兩件事一起做"],"answer":1,"explain":"專心時段中冒出的雜念，先記在紙上「放著」，等休息再處理，就能不打斷專注，也不怕忘記那件事。"},{"q":"小豪剛把今天最難的作文寫完，很想對自己說點話。哪句話最能鼓勵他繼續保持這個好習慣？","options":["「反正只是運氣好，下次不一定行」","「早知道就不要那麼認真，好累」","「我先把最難的搞定了，真的很棒！」"],"answer":2,"explain":"完成不容易的事之後，好好肯定自己，會讓大腦記得「開始並完成」是件開心的事，下次更願意主動去做。"},{"q":"寫作業時，小杰習慣一邊寫一邊看旁邊播著的卡通。他常覺得又慢又容易寫錯。這是為什麼？","options":["因為卡通太好看了，跟作業無關","注意力一直在兩件事之間跳來跳去，反而兩件都做不好","因為他不夠聰明"],"answer":1,"explain":"人沒辦法真的同時專心做兩件事，注意力不停切換會讓速度變慢、也更容易出錯；把干擾關掉，反而做得又快又好。"},{"q":"回到家，小婷把外套丟沙發、書包扔地上、鞋子亂踢，想著「等一下再收」。其實每樣歸位只要幾秒。比較好的做法是？","options":["全部堆著，等媽媽提醒再收","反正明天還要用，放地上比較快","進門就順手把每樣東西放回固定位置"],"answer":2,"explain":"能在一兩分鐘內完成的小事，當下順手做完最省事；東西一件件歸位，家裡整齊，明天也不會找不到。"},{"q":"妹妹遇到一題數學怎麼想都不會，於是把整張卷都停下來不寫了。哪個做法最聰明？","options":["先把那題做記號跳過去，寫完其他會的再回頭想","卡在那題上，其他也不寫了","偷看答案抄上去就好"],"answer":0,"explain":"一題卡住不必整張停擺；先跳過去完成會的題目，保持前進的節奏，回頭再處理難題，還可以請人幫忙弄懂。"},{"q":"小樺常想「反正做不到完美，不如先不要開始」，結果什麼都沒動。比較健康的想法是？","options":["「等我準備到完美的那天再開始」","「先做出來，再慢慢改，比一直不開始好」","「做不好就別做，免得丟臉」"],"answer":1,"explain":"追求完美到不敢動手，反而什麼都完成不了；先允許自己做出「還可以」的版本，再慢慢修改，才會真正有進展。"},{"q":"寫功課前，小明會先花一分鐘想「今天要做哪幾樣、先做哪一樣」再動手。這個小習慣有什麼好處？","options":["浪費時間，不如直接開始寫","只是看起來很認真而已","先想清楚順序，做起來更有方向、不會東做西做"],"answer":2,"explain":"動手前先簡單規畫順序，就知道從哪開始、接著做什麼，不會邊做邊猶豫，時間用得更有效率。"},{"q":"連續專心寫了二十五分鐘，番茄鐘響了要休息五分鐘。哪種休息方式最能幫小光待會兒再專心？","options":["起來走一走、喝口水、看看遠方","馬上打開刺激的手機遊戲玩到欲罷不能","趴著不動，愈休息愈想睡"],"answer":0,"explain":"短暫休息是為了讓腦袋放鬆、待會兒更好專心；起來動一動、看看遠方最合適，玩起停不下來的遊戲反而會打亂節奏。"},{"q":"聯絡簿上有五樣功課，小恩想確定自己沒漏做。最可靠的方法是？","options":["憑印象覺得應該都寫完了","對照聯絡簿一樣一樣打勾確認","問同學就好，不用自己核對"],"answer":1,"explain":"照著聯絡簿逐項打勾核對，就能清楚看到哪些做完、哪些還沒，最不容易漏交作業。"},{"q":"小凡發現自己每次都拖到很累才寫功課，想找出原因好改變。這樣「先弄清楚自己為什麼拖」有什麼幫助？","options":["沒有用，反正就是不想寫","只是給自己找藉口","知道卡在哪，才能對症下藥地幫自己開始"],"answer":2,"explain":"拖延背後常有原因，例如太難、太大、或不知怎麼開始；找出真正卡住的地方，就能用對方法，例如拆小步或先弄懂。"},{"q":"寫日記時，小翔盯著空白本子遲遲下不了筆。他決定在心裡倒數「五、四、三、二、一」，數完就寫下第一句。這個方法在幫他什麼？","options":["讓大腦沒空猶豫，用倒數推自己踏出第一步","逼自己一次把整篇寫完","把寫日記變成比賽"],"answer":0,"explain":"倒數幾秒就馬上行動，能趁大腦還來不及想理由退縮時先開始；只要跨出第一步，往往就能繼續下去。"},{"q":"小美把「做科展海報」拆成：想主題、畫草稿、上色、貼照片，每完成一步就打個勾。這樣做為什麼有幫助？","options":["其實沒差，一次做完比較快","看到勾勾變多會有成就感，更有動力做下一步","只是為了讓海報看起來厲害"],"answer":1,"explain":"把大事拆成看得見的小步，每完成一步打勾，就會累積小小的成就感，這股「我做到了」的動力會推著人繼續前進。"},{"q":"爸爸已經第二次提醒小傑去洗餐具，他還坐著看電視。這時候最好的做法是？","options":["先跟爸爸說「對不起，我現在馬上去」，然後起身去做","繼續看，等第三次再說","跟爸爸頂嘴說等一下啦"],"answer":0,"explain":"被提醒時願意馬上起身去做、並好好回應，是對自己也對家人負責的表現；一直拖著只會讓事情和心情都變糟。"},{"q":"小玲答應自己「六點前寫完數學」，結果一直分心，快六點半還沒寫完。下次怎麼做比較能守住約定？","options":["把時間改成「有寫就好」，反正做不到","先把手機和玩具收遠一點，減少分心","怪作業太多，不是自己的問題"],"answer":1,"explain":"守住對自己的承諾，先要減少會讓自己分心的東西；把干擾移開、專心寫，才更可能在約定時間內完成。"},{"q":"小睿寫完整份考卷還剩幾分鐘，很想馬上交出去。哪個選擇對他最有利？","options":["立刻交卷，早交比較厲害","發呆等下課鐘響","利用剩下的時間，把題目和答案再檢查一遍"],"answer":2,"explain":"提早寫完不急著交，用剩下的時間回頭檢查，常能找出粗心的小錯；養成檢查的習慣，成績會更穩定。"},{"q":"小凱一想到要做「植物觀察報告」就覺得好大、不知從哪下手，於是一直逃避。最能幫他起步的第一步是？","options":["先只做一件最小的事，例如去挑一種要觀察的植物","等到快交的前一晚再一次趕完","跟老師說這個報告太難做不出來"],"answer":0,"explain":"大任務讓人不敢開始時，先挑一件最小、最具體的事動手，例如先選好題目；起了頭，後面的步驟就會慢慢清楚起來。"},{"q":"小婷寫完作業後，總是隨手把課本、鉛筆盒留在書桌上不收。養成寫完就收好的習慣，對她有什麼好處？","options":["沒差，反正明天還要用","東西都在固定位置，明天要用馬上找得到、也不會弄丟","收東西很浪費時間，不如多玩一下"],"answer":1,"explain":"用完就把東西歸回固定位置，下次要用時一找就到，也比較不會遺漏或弄丟；整齊的環境也讓人更容易靜下心。"},{"q":"考卷檢討時，小軒發現自己好幾題都是「看錯題目」而錯。他可以怎麼幫自己下次少犯這種錯？","options":["反正是粗心，沒辦法改","以後寫快一點就好","以後寫題目時先把重點圈起來、讀清楚再作答"],"answer":2,"explain":"從訂正裡找出自己常犯的錯誤類型，並想出對策，例如把題目關鍵圈出來、讀清楚再寫，就能一次次減少同樣的失誤。"}],"health":[{"q":"想保護眼睛、減少近視發生，每天最好怎麼安排「到戶外」的時間？","options":["每天盡量到戶外走走、玩耍，讓眼睛看看遠方和自然光","只要在室內開很亮的燈就好，不用出門","整天都待在房間裡看書比較不會累"],"answer":0,"explain":"每天多到戶外活動、看看遠處和自然光，能幫助眼睛放鬆，對減少近視很有幫助；一直待在室內近距離用眼，眼睛比較容易疲勞。"},{"q":"看書或用平板時，眼睛和書本、螢幕的距離大約多遠比較舒服？","options":["越近越看得清楚，貼到快碰到最好","保持大約一個手臂左右的距離，不要太靠近","把螢幕放到腿上低頭看最省力"],"answer":1,"explain":"看東西時保持大約一個手臂的距離，眼睛比較不會太吃力；貼得太近會讓眼睛容易疲勞，也對視力不好。"},{"q":"在書桌前看書時，光線要怎麼安排對眼睛比較好？","options":["把燈全部關掉，只留螢幕的光最省電","越暗越有氣氛，對眼睛沒有影響","光線要足夠、明亮又不刺眼，讓字看得清楚"],"answer":2,"explain":"看書時光線要充足又不刺眼，字看得清楚，眼睛才不容易疲勞；在太暗的地方看書會讓眼睛很辛苦。"},{"q":"連續盯著螢幕看很久，眼睛覺得又酸又乾，最好怎麼做？","options":["停下來，看看遠方、眨眨眼，讓眼睛休息一下","繼續撐著看完，反正休息也沒用","用手用力揉眼睛，讓它舒服一點"],"answer":0,"explain":"用眼一段時間後停下來看看遠方、眨眨眼睛，能讓眼睛得到休息；用力揉眼睛反而可能不小心弄髒或弄傷眼睛。"},{"q":"看電視或用平板時，坐的位置怎麼安排比較保護眼睛？","options":["把臉貼到螢幕前面才看得清楚","躺在床上把螢幕舉到臉的正上方看","坐得離螢幕遠一點、和眼睛差不多同高"],"answer":2,"explain":"和螢幕保持適當距離、螢幕大約與眼睛同高，看起來比較舒服；貼太近或躺著看都會讓眼睛和脖子更辛苦。"},{"q":"寫功課寫太久覺得眼睛疲勞，下面哪一個休息方式比較好？","options":["起來走一走、看看窗外的遠方再回來寫","閉著眼睛趴著睡到隔天早上","把房間燈關掉繼續在黑暗中寫"],"answer":0,"explain":"起來動一動、看看遠方，能讓眼睛和身體都放鬆一下，再回來寫會更有精神；在黑暗中繼續寫只會更累眼睛。"},{"q":"背書包時，怎麼背比較能保護背和肩膀？","options":["只用單邊肩膀背，比較帥氣","兩條背帶都背上，讓重量平均分在兩邊肩膀","背帶調到最長，讓書包垂在屁股下面"],"answer":1,"explain":"兩條背帶都背好，重量平均分在兩邊肩膀，背起來比較穩、也比較不會累；只用單邊背容易讓一邊肩膀特別辛苦。"},{"q":"關於「書包的重量」，下面哪一種做法比較好？","options":["把用不到的東西也全部帶著，才安心","書包越重代表越用功，越重越好","只帶當天需要的課本和用品，別讓書包太重"],"answer":2,"explain":"只帶當天需要的東西，書包不會太重，背起來對身體比較好；把用不到的東西都塞進去，只會讓背和肩膀更累。"},{"q":"背書包時，書包放在背上的高度大約在哪裡比較好？","options":["貼在上背、靠近肩膀，不要垂到很低","越低越好，垂到膝蓋附近最舒服","掛在一隻手上拎著走最方便"],"answer":0,"explain":"書包貼在上背、位置不要太低，重量比較靠近身體，背起來省力又穩；垂得太低或用手拎，身體會更吃力。"},{"q":"看書、寫字的時候，背和身體最好保持什麼樣子？","options":["整個人趴在桌上，臉貼著本子","背打直、坐得穩穩的，桌椅高度剛好","身體歪一邊、翹著腳斜斜地坐"],"answer":1,"explain":"背打直、坐穩，桌椅高度合適，身體比較不會酸痛；趴著或歪一邊坐久了，背和脖子都容易不舒服。"},{"q":"坐著用平板或看書很久之後，除了休息眼睛，還可以怎麼照顧身體？","options":["繼續維持同一個姿勢別亂動","把身體縮得更小才不會累","起來伸伸懶腰、動一動身體再繼續"],"answer":2,"explain":"坐久了起來伸展、動一動，能讓身體和肌肉放鬆，比較不會腰酸背痛；一直維持同一個姿勢反而容易累。"},{"q":"國小的小朋友晚上睡不夠，隔天最可能會怎麼樣？","options":["比較容易沒精神、上課不容易專心","精神特別好，整天都不會累","身體會馬上長高一大截"],"answer":0,"explain":"睡不夠時人容易沒精神、注意力不集中；睡飽睡好才能讓白天更有活力、學習更專心。"},{"q":"想要晚上比較好入睡，睡前一小時做什麼比較合適？","options":["玩很刺激的遊戲或看緊張的影片","做些安靜放鬆的事，例如看故事書、聽輕柔的音樂","喝一大杯含糖的飲料提神"],"answer":1,"explain":"睡前做安靜放鬆的事，身體比較容易慢慢平靜下來、順利入睡；太刺激的活動或含糖飲料反而會讓人更難睡著。"},{"q":"關於「睡覺時房間的環境」，怎麼安排比較好睡？","options":["開著大燈和電視才不會怕","房間越吵越熱越容易睡著","把燈光調暗、環境安靜，比較好入睡"],"answer":2,"explain":"睡覺時把燈調暗、保持安靜，身體比較容易進入睡眠；太亮或太吵都會讓人不容易睡好。"},{"q":"為什麼睡飽對正在長大的小朋友特別重要？","options":["睡覺時身體會休息和修復，對成長和精神都有幫助","睡覺完全沒作用，只是浪費時間","睡越少頭腦才會越靈活"],"answer":0,"explain":"睡覺時身體會好好休息與修復，對成長、精神和學習都有幫助；睡眠是身體長大過程中很重要的一部分。"},{"q":"假日很想晚睡晚起，怎麼做對身體比較好？","options":["假日盡量通宵，反正隔天可以睡到中午","假日的睡覺和起床時間，盡量和平常差不多","每天想睡就睡、想醒就醒最健康"],"answer":1,"explain":"假日的作息盡量和平常接近，身體的生理時鐘比較穩定，收假上學也不會太難調整；作息忽早忽晚容易讓人昏昏沉沉。"},{"q":"下面哪一個是「幫助自己準時上床睡覺」的好方法？","options":["一直玩到很睏、眼睛睜不開才去睡","等到很晚肚子餓，吃飽再睡","訂一個固定的睡覺時間，時間到就準備睡"],"answer":2,"explain":"訂好固定的睡覺時間並準時準備，能幫助身體養成規律；拖到很晚才睡，隔天往往會很累、爬不起來。"},{"q":"口渴的時候，下面哪一個是最適合平常補充水分的選擇？","options":["白開水","含糖的汽水","很甜的手搖飲料"],"answer":0,"explain":"白開水最適合平常補充水分，對身體沒有負擔；含糖的汽水和甜飲料糖分較多，不適合常常喝。"},{"q":"關於「含糖飲料」，下面哪一句說法比較正確？","options":["含糖飲料可以完全取代白開水","含糖飲料偶爾喝就好，平常還是以白開水為主","口渴時喝含糖飲料最能解渴、對身體最好"],"answer":1,"explain":"含糖飲料偶爾喝一點沒關係，但平常補充水分還是以白開水為主比較好；把甜飲料當水喝，糖分會攝取太多。"},{"q":"一餐裡想吃得比較均衡，下面哪一種搭配比較好？","options":["只吃白飯，其他都不吃","只喝一杯飲料就當作一餐","有主食、有蔬菜、也有蛋或豆魚肉類，種類多一點"],"answer":2,"explain":"一餐裡有主食、蔬菜，也有蛋或豆魚肉等，種類豐富才比較均衡；只吃單一種或用飲料代替正餐，身體得不到需要的營養。"},{"q":"每天吃蔬菜和水果，對身體有什麼幫助？","options":["蔬果含有身體需要的營養和纖維，對健康有幫助","蔬果沒什麼用，可以完全不吃","蔬果吃越少身體越健康"],"answer":0,"explain":"蔬菜和水果含有身體需要的營養和纖維，每天適量吃對健康很有幫助；長期都不吃蔬果，營養容易不夠均衡。"},{"q":"小朋友每天適量的運動，對身體和心情有什麼好處？","options":["會讓身體變差、心情變糟","能讓身體更有活力、心情也更好","只會浪費時間，沒有任何好處"],"answer":1,"explain":"每天適量運動能讓身體更有活力、幫助長大，也讓心情更愉快；規律活動是照顧身心的好習慣。"},{"q":"放學後想動一動身體，下面哪一個是不錯的選擇？","options":["整個下午都坐著不動看螢幕","躺在沙發上一動也不動到晚上","到公園跑跳、打球，或和家人散步"],"answer":2,"explain":"到戶外跑跳、打球或散步，能讓身體活動、心情放鬆；一直坐著或躺著不動，對身體和精神都沒有幫助。"},{"q":"關於「吃飯的速度」，下面哪一句說法比較好？","options":["細嚼慢嚥、好好吃飯，對消化比較好","吃越快越好，趕快吃完去玩","一邊狼吞虎嚥一邊跑來跑去最有趣"],"answer":0,"explain":"細嚼慢嚥、專心吃飯，對消化比較好，也比較能感覺到吃飽了；吃太快或邊跑邊吃容易嗆到，也不利消化。"},{"q":"天氣很熱或運動流了很多汗，最需要做的是什麼？","options":["忍著不喝水，等回家再說","適時補充白開水，把流失的水分補回來","多喝幾罐含糖飲料才夠味"],"answer":1,"explain":"流汗多的時候要適時補充水分，白開水最合適，能把流失的水分補回來；忍著不喝或只喝甜飲料，對身體都不好。"},{"q":"想養成多喝水的習慣，下面哪一個方法不錯？","options":["等到非常渴、頭很暈才一次喝很多","整天都用飲料代替喝水","帶著自己的水壺，想到就喝一點"],"answer":2,"explain":"帶著水壺、平常想到就喝一點，能讓身體隨時有足夠水分；等到很渴才喝，身體其實已經缺水一陣子了。"},{"q":"零食和正餐之間，比較好的做法是什麼？","options":["以正餐為主，零食只是偶爾少量吃","用零食取代正餐，比較方便","三餐都不吃，只吃零食"],"answer":0,"explain":"以正餐為主、營養才會均衡，零食只是偶爾少量享用；用零食取代正餐或三餐都不吃，身體會缺乏需要的營養。"},{"q":"為什麼「早餐」對上學的小朋友特別重要？","options":["早餐吃了會沒精神，不如不吃","早餐能補充能量，讓上午更有精神、更好專心","早餐可以完全用睡覺代替"],"answer":1,"explain":"早餐能為身體補充一早需要的能量，讓上午更有精神、學習更專心；不吃早餐常常會覺得沒力氣、不容易集中。"},{"q":"下面哪一種早餐搭配比較均衡、有活力？","options":["只喝一口飲料就出門","什麼都不吃，餓著肚子上學","有主食、也有蛋或牛奶等，種類搭配一下"],"answer":2,"explain":"早餐有主食再搭配蛋、牛奶等，營養比較均衡、也比較有飽足感；只喝一點飲料或空著肚子上學，很快就會沒力氣。"},{"q":"想把一天過得比較規律，下面哪一個做法比較好？","options":["訂出大概的作息，例如吃飯、寫功課、睡覺的時間","每天做事的時間都亂亂的，看心情決定","把所有事都堆到睡前才做"],"answer":0,"explain":"訂出大概的作息時間，一天會過得比較有條理、也不會手忙腳亂；把事情都堆到最後才做，容易熬夜又累。"},{"q":"放學回家後，比較好的做事順序大概是怎樣？","options":["先玩到很晚，功課留到快睡覺才趕","先把該做的事安排好，也留下休息和玩的時間","整晚都在寫功課，完全不休息"],"answer":1,"explain":"先把功課等該做的事安排好，也留一些休息和玩的時間，一天會比較平衡；全部拖到睡前趕或整晚不休息，都會太累。"},{"q":"想讓一個好習慣慢慢養成，下面哪一個方法比較有用？","options":["今天做、明天不做，想到才做","一次要求自己完美達成，做不到就放棄","每天在差不多的時間重複做，慢慢就習慣了"],"answer":2,"explain":"每天在固定的時間重複去做，習慣就會慢慢養成；如果三天打魚兩天曬網，或一失敗就放棄，反而很難堅持下去。"},{"q":"每天刷牙，比較好的做法是什麼？","options":["早上和睡前都刷牙，每次仔細刷","一個星期刷一次就夠了","用清水漱一下口就等於刷牙了"],"answer":0,"explain":"早晚都刷牙、每次仔細刷，能幫助牙齒和牙齦保持乾淨健康；只用清水漱口或很久才刷一次，牙齒容易出問題。"},{"q":"刷牙的時候，怎麼刷比較能把牙齒清乾淨？","options":["很用力快速地來回大力刷幾下就好","慢慢地、每個地方都刷到，內外和咬合面都別漏掉","只刷看得到的門牙前面就可以了"],"answer":1,"explain":"刷牙時慢慢地把每顆牙的內外和咬合面都刷到，才不會有地方漏掉；只刷前面看得到的地方，後面容易藏髒東西。"},{"q":"吃完很甜的東西之後，照顧牙齒比較好的做法是什麼？","options":["什麼都不用做，睡前再說","再多吃一顆糖比較開心","刷刷牙或至少漱漱口，別讓甜甜的東西一直留在牙上"],"answer":2,"explain":"吃完甜食後刷牙或至少漱口，能減少留在牙齒上的糖分，對牙齒比較好；讓甜的東西一直黏在牙上，容易蛀牙。"},{"q":"關於「洗澡」，下面哪一句說法比較正確？","options":["流汗、玩髒了或每天固定洗澡，能保持身體清潔","洗澡會把身體洗壞，越少洗越好","一個月洗一次澡就很乾淨了"],"answer":0,"explain":"每天或在流汗、弄髒後洗澡，能把身上的髒東西和汗水洗掉、保持清潔；太久不洗澡，皮膚容易不舒服也不衛生。"},{"q":"吃東西前和上完廁所後，最好做什麼來保持清潔？","options":["用衣服隨便擦一擦就好","用肥皂或洗手乳把手洗乾淨","不用洗，看起來不髒就沒關係"],"answer":1,"explain":"吃東西前和上廁所後用肥皂好好洗手，能洗掉看不見的髒東西、減少生病的機會；用衣服擦或不洗，其實沒有真正把手弄乾淨。"},{"q":"洗手要洗得乾淨，下面哪一個做法比較好？","options":["用水快速沖一下就甩乾","只洗手心，其他地方不用管","用肥皂搓出泡泡，指縫和手背都搓到，再沖乾淨"],"answer":2,"explain":"用肥皂搓出泡泡，把指縫、手背都搓到再沖乾淨，手才會真的乾淨；只用水沖一下或只洗手心，還會留下看不見的髒東西。"},{"q":"指甲太長又藏著髒東西，比較好的做法是什麼？","options":["定期把指甲修剪整齊、保持乾淨","讓指甲一直留長，越長越好看","用指甲去摳東西剛剛好"],"answer":0,"explain":"定期修剪指甲、保持乾淨，能減少藏在指甲裡的髒東西，也比較不容易刮傷自己或別人；指甲留太長反而容易卡髒東西。"},{"q":"打噴嚏或咳嗽的時候，怎麼做比較不會把細菌散到別人身上？","options":["對著空氣或別人大聲噴出來","用手帕、衛生紙或手肘遮住口鼻","完全不遮，忍住不打最健康"],"answer":1,"explain":"打噴嚏或咳嗽時用手帕、衛生紙或手肘遮住口鼻，能減少把細菌散播出去；對著別人噴出來很容易把病傳給其他人。"},{"q":"用耳機聽音樂時，音量大約開到多大比較保護耳朵？","options":["開到最大聲才過癮","越大聲聽得越清楚，對耳朵沒差","開到還能聽見旁邊講話的舒適音量就好"],"answer":2,"explain":"耳機音量開到還能聽見周圍聲音的舒適大小就好，這樣對耳朵比較安全；長時間聽很大聲，可能會慢慢傷害聽力。"},{"q":"關於「用耳機的時間」，下面哪一句說法比較正確？","options":["聽一段時間就讓耳朵休息一下，音量也別太大","戴著耳機大聲聽一整天也沒關係","音量開越大、聽越久，耳朵越強壯"],"answer":0,"explain":"用耳機聽一段時間後讓耳朵休息一下、音量也不要太大，能保護聽力；長時間大聲聽，耳朵容易疲勞、聽力也可能受影響。"},{"q":"如果覺得耳朵悶悶的、或聽別人講話變得比較吃力，最好怎麼做？","options":["繼續大聲聽音樂，習慣就好","先讓耳朵休息，並告訴爸爸媽媽或老師","用手指或棉花棒用力挖耳朵"],"answer":1,"explain":"耳朵覺得不舒服或聽不太清楚時，先讓耳朵休息並告訴大人，才能得到適當的照顧；用力挖耳朵反而可能弄傷耳朵。"},{"q":"在很吵的地方（例如很大聲的音樂或機器旁），怎麼保護耳朵比較好？","options":["把耳朵貼得更近，聽清楚一點","對著噪音大喊，蓋過聲音","盡量離噪音遠一點，或減少待在那裡的時間"],"answer":2,"explain":"在很吵的環境裡，離噪音遠一點或減少待著的時間，能減少對耳朵的傷害；靠得更近或長時間待著，聽力比較容易受影響。"},{"q":"關於「用力揉眼睛」這件事，下面哪一句說法比較正確？","options":["盡量不要用力揉眼睛，手也可能把髒東西帶到眼睛裡","眼睛癢就用力揉，揉越久越舒服","揉眼睛可以讓視力變好"],"answer":0,"explain":"用力揉眼睛可能把手上的髒東西帶進眼睛，也可能弄傷眼睛，最好不要這樣做；如果眼睛不舒服，可以告訴大人幫忙看看。"}],"life":[{"q":"想養一隻小倉鼠，出發去買之前先做什麼最好？","options":["查清楚牠愛吃什麼、需要多大的籠子和怎麼照顧","覺得可愛就先帶回家，其他之後再說","先買一大堆玩具，食物到時候再想"],"answer":0,"explain":"養任何小動物之前，先了解牠的食物、住的空間和照顧方式，才能把牠養得健康又快樂。"},{"q":"養了小魚之後，關於牠的家，下面哪個做法最貼心？","options":["把魚缸擺在太陽直射的窗邊讓水一直很熱","定期換乾淨的水，並注意水溫不要忽冷忽熱","很久才換一次水，髒了也沒關係"],"answer":1,"explain":"魚需要乾淨且溫度穩定的水才能活得好，定期換水、避免水太熱是負責任的照顧。"},{"q":"暑假要出遠門好幾天，家裡養的兔子怎麼安排最負責任？","options":["放很多食物就好，牠自己會分著吃","把牠放到公園，讓牠自己找東西吃","請家人或信任的人幫忙每天餵食和照顧"],"answer":2,"explain":"出門前先安排好有人每天餵食、給水和關心，才不會讓寵物餓肚子或受傷。"},{"q":"班上養的小烏龜長大了，同學說「養膩了就放到河裡吧」，比較好的想法是什麼？","options":["不隨意野放，先想辦法繼續照顧或找願意好好養的人接手","隨便找條河放掉，眼不見為淨","把烏龜送人是最省事的辦法，不用問對方"],"answer":0,"explain":"隨意野放可能害了寵物，也會影響野外的生態；先繼續照顧或幫牠找到願意負責的新主人才是善待生命。"},{"q":"為什麼不建議把養不下的寵物魚倒進附近的溪流？","options":["溪水太乾淨，魚會不習慣","外來的魚可能搶走原本住在溪裡動物的食物和空間","這樣做溪水會變得更漂亮"],"answer":1,"explain":"寵物常是外來種，放到野外會和原生生物搶食物與棲地，破壞當地的生態平衡。"},{"q":"照顧寵物狗時，下面哪一件事也是主人的責任？","options":["只要餵飽就好，生病了不用管","關在小籠子裡不讓牠動比較好帶","帶牠散步、陪伴牠，生病時帶去看醫生"],"answer":2,"explain":"養狗不只是餵飽，還要陪伴、運動，生病時帶去看獸醫，這些都是主人的責任。"},{"q":"看到路邊有人擺攤賣一箱箱的小雞，想全部買下「救牠們」，比較妥當的想法是？","options":["先想清楚自己能不能好好照顧，不要一時衝動買回一堆","看到就全部買，反正救得越多越好","買回家後養不了再說"],"answer":0,"explain":"善待生命也包括量力而為，先確定自己有能力照顧，才不會讓小動物之後沒人管。"},{"q":"養寵物鸚鵡時，下面哪個做法對牠最好？","options":["讓牠一直單獨關著，都不理牠","每天陪牠說話互動，給牠乾淨的食物和水","給牠吃人類的巧克力當點心"],"answer":1,"explain":"鸚鵡是聰明又需要陪伴的動物，每天互動、給乾淨食物才健康；巧克力對鳥類有害不能餵。"},{"q":"想在陽台種一盆小盆栽，怎麼照顧比較用心？","options":["澆很多水淹著它，越多越好","買回來後放著都不管它","了解它需要多少陽光和水，按需要澆水"],"answer":2,"explain":"每種植物需要的陽光和水都不同，先了解再照顧，才能把它種得好。"},{"q":"養蠶寶寶時，牠主要吃什麼才長得好？","options":["新鮮乾淨的桑葉","餅乾和糖果","肉類的碎屑"],"answer":0,"explain":"蠶寶寶吃新鮮的桑葉，葉子要乾淨、不要有水珠，牠才會健康長大結繭。"},{"q":"下面哪一種是常見的昆蟲？","options":["蜘蛛","螞蟻","蝸牛"],"answer":1,"explain":"昆蟲的身體分頭、胸、腹三部分，而且有六隻腳；螞蟻符合這些特徵，蜘蛛有八隻腳、蝸牛則不是昆蟲。"},{"q":"蝴蝶從卵長成會飛的樣子，中間會經過哪個階段？","options":["直接從卵變成蝴蝶","先變成蜜蜂再變蝴蝶","毛毛蟲和蛹的階段"],"answer":2,"explain":"蝴蝶的一生會經過卵、幼蟲（毛毛蟲）、蛹，最後才羽化成會飛的蝴蝶。"},{"q":"青蛙小時候住在水裡、用鰓呼吸的樣子叫什麼？","options":["蝌蚪","蚱蜢","小蛇"],"answer":0,"explain":"青蛙小時候是蝌蚪，住在水裡用鰓呼吸，長大後長出腳、能上岸，改用肺和皮膚呼吸。"},{"q":"在夜晚公園草叢裡看到會一閃一閃發光的小蟲，最可能是什麼？","options":["會發光提醒大家危險的機器","螢火蟲","天上掉下來的星星"],"answer":1,"explain":"螢火蟲會在夜裡發出一閃一閃的光來吸引同伴，是一種很特別的昆蟲。"},{"q":"蚯蚓喜歡住在什麼樣的地方？","options":["又乾又燙的水泥地上","很乾淨的自來水裡","潮溼鬆軟的泥土裡"],"answer":2,"explain":"蚯蚓喜歡潮溼鬆軟的泥土，在裡面鑽動可以幫土壤透氣，讓植物長得更好。"},{"q":"下面哪一句在描述常見的候鳥現象是對的？","options":["有些鳥會隨著季節飛到很遠的地方過冬再飛回來","所有的鳥一年到頭都待在同一個地方","鳥飛到別的地方是因為迷路了"],"answer":0,"explain":"候鳥會隨季節長距離遷徙，飛到氣候合適、食物多的地方過冬，時間到了再飛回來。"},{"q":"為什麼很多花會開得又香又鮮豔？","options":["純粹是為了讓人採回家","為了吸引蜜蜂、蝴蝶等來幫忙傳播花粉","香味可以趕走陽光"],"answer":1,"explain":"鮮豔的顏色和香味能吸引蜜蜂、蝴蝶前來，牠們在採蜜時順便幫花朵傳播花粉。"},{"q":"觀察到瓢蟲停在葉子上，關於牠下面哪句比較正確？","options":["瓢蟲會咬人，看到要打死","瓢蟲是專門破壞花朵的壞蟲","許多瓢蟲會吃掉危害植物的蚜蟲，是農夫的好幫手"],"answer":2,"explain":"很多瓢蟲會吃掉吸食植物汁液的蚜蟲，反而幫忙保護了植物，是自然界的好幫手。"},{"q":"樹木對我們的環境有什麼幫助？","options":["可以製造氧氣、遮蔭，還能成為小動物的家","會把空氣裡的髒東西全部吸光","只會擋住路，沒什麼用"],"answer":0,"explain":"樹木能製造我們呼吸需要的氧氣、提供遮蔭，樹上和樹下也常常是許多小動物的家。"},{"q":"下面哪一種動物是哺乳類，會用乳汁餵小寶寶？","options":["麻雀","蝙蝠","金魚"],"answer":1,"explain":"蝙蝠雖然會飛，但牠是哺乳類，媽媽會用乳汁餵養寶寶；麻雀是鳥類、金魚是魚類。"},{"q":"在公園草地上發現一隻看起來受傷、不會飛的小鳥，最好怎麼做？","options":["直接用手抓起來帶回家自己養","戳戳看牠有沒有反應","告訴大人，請大人聯絡保育或動物救援單位幫忙"],"answer":2,"explain":"野生動物可能帶有細菌，也需要專業照顧；告訴大人並聯絡救援單位，才能真正幫到牠又保護自己。"},{"q":"在野外看到一條不認識的蛇，最安全的做法是什麼？","options":["保持距離、慢慢離開，並告訴附近的大人","拿樹枝去撥弄牠，看牠會不會動","靠近一點拍照留念"],"answer":0,"explain":"分不出蛇有沒有毒時，最安全的是保持距離、慢慢走開並告訴大人，不要去逗弄或靠近。"},{"q":"如果不小心被貓或狗抓傷、咬傷，第一步應該怎麼做？","options":["自己偷偷擦一擦，不要跟別人說","趕快告訴大人，並去看醫生處理傷口","把傷口藏起來，假裝沒事"],"answer":1,"explain":"被抓咬傷可能會感染，一定要馬上告訴大人並就醫，讓醫生幫忙清理傷口、判斷要不要打針。"},{"q":"在山上或郊外看到不認識的野菇，可以摘來吃嗎？","options":["看起來很漂亮的應該就沒問題","聞起來香的就能吃","不可以，有些野菇有毒，絕對不能隨便採來吃"],"answer":2,"explain":"很多有毒的野菇外表和可食用的長得很像，光看和聞都分不出來，絕對不能隨便採來吃。"},{"q":"在草叢裡看到一個很大的、有很多蜂飛進飛出的窩，應該怎麼辦？","options":["保持距離趕快離開，並告訴大人不要靠近","拿石頭丟丟看裡面有什麼","伸手戳一下看牠們會不會出來"],"answer":0,"explain":"虎頭蜂或蜜蜂的窩被打擾會群起攻擊，很危險；要保持距離、安靜離開並告訴大人。"},{"q":"玩完泥土、摸過小動物之後，回家前要記得做什麼？","options":["直接用手拿東西吃就好","用肥皂把手洗乾淨","在衣服上擦一擦就算洗過了"],"answer":1,"explain":"泥土和動物身上可能有看不見的細菌，摸完後用肥皂把手洗乾淨，才不會把髒東西吃進肚子。"},{"q":"路邊有一隻流浪貓對你哈氣、看起來很緊張，這時候怎麼做最好？","options":["硬要去抱牠、摸牠的頭","把牠追到角落","保持距離不要打擾牠，慢慢走開"],"answer":2,"explain":"陌生的動物緊張時可能會抓咬人，保持距離、不打擾並慢慢離開，對你和牠都比較安全。"},{"q":"郊外樹上結了不認識的紅色野果，看起來很像草莓，可以吃嗎？","options":["不認識的野果不能隨便吃，有些有毒","很像草莓應該可以吃一口試試","洗一洗就能安心吃"],"answer":0,"explain":"有些野果有毒，光看外表很難分辨，不認識的果子絕對不要摘來吃，先問大人最安全。"},{"q":"手臂上停了一隻毛毛蟲，牠身上有很多毛，最好怎麼處理？","options":["用手把牠捏死","不要用手直接摸，輕輕用葉子或樹枝把牠移開","用力甩手，讓牠飛出去"],"answer":1,"explain":"有些毛毛蟲的毛碰到皮膚會又痛又癢，不要用手直接摸，用葉子或樹枝輕輕移開比較安全。"},{"q":"看到地上有一隻死掉的小動物，正確的做法是什麼？","options":["用手撿起來看個仔細","踢踢看牠是不是真的死了","不要用手碰，告訴大人來處理"],"answer":2,"explain":"死掉的動物身上可能有細菌，不要用手去碰，告訴大人由他們安全地處理。"},{"q":"下雨後蝸牛爬到人行道上，關於牠下面哪句最好？","options":["可以安靜觀察，摸過之後記得把手洗乾淨","蝸牛會咬人，看到要踩死","抓起來放進口袋帶去學校"],"answer":0,"explain":"蝸牛不會咬人，可以安靜觀察牠，但牠身上可能有細菌，摸過之後一定要把手洗乾淨。"},{"q":"在溪邊玩水時看到石頭下有小螃蟹，想觀察牠，怎麼做比較好？","options":["把牠抓起來丟到很遠的地方","輕輕看一看就好，觀察完讓牠留在原本的家","把牠帶回家泡在自來水裡"],"answer":1,"explain":"溪裡的小動物有牠自己的家，觀察完讓牠留在原地最好，帶回家常常會讓牠活不下去。"},{"q":"為什麼摸完學校養的兔子或天竺鼠後要洗手？","options":["因為兔子的毛會讓手變色","因為不洗手兔子會生氣","因為動物身上可能有看不見的細菌"],"answer":2,"explain":"就算是很乾淨的寵物，身上也可能有看不見的細菌，摸完後洗手能保護自己不生病。"},{"q":"在戶外看到一隻顏色特別鮮豔的青蛙或昆蟲，下面哪個想法比較安全？","options":["有些鮮豔的顏色是在警告牠有毒，不要用手去抓","越漂亮越可愛，趕快抓來玩","舔一下看看是什麼味道"],"answer":0,"explain":"自然界裡鮮豔的顏色常常是一種警告，代表牠可能有毒；不認識的生物用眼睛看就好，不要用手抓。"},{"q":"有蚊子在身邊飛，下面哪個是比較好的做法？","options":["被叮了就用力抓到流血","穿長袖或擦防蚊液，被叮了也不要一直抓破皮","把整瓶防蚊液喝下去防蚊"],"answer":1,"explain":"預防被叮可以穿長袖或擦防蚊液；被叮了一直抓破皮反而容易讓傷口感染，防蚊液更絕對不能喝。"},{"q":"發現食物上長了霉，下面哪個做法最正確？","options":["把發霉的部分挖掉，剩下的照吃","聞起來沒壞就整個吃掉","告訴大人，這樣的食物不要吃"],"answer":2,"explain":"食物發霉代表已經有肉眼看不到的黴菌長進去了，就算挖掉也不安全，要告訴大人不要再吃。"},{"q":"去農場參觀，在可以摸小羊的區域摸完動物後，下面哪件事最重要？","options":["馬上用旁邊的洗手設施把手洗乾淨再去吃東西","邊摸動物邊吃手上的點心","摸完直接揉眼睛"],"answer":0,"explain":"接觸農場動物後，手上可能沾到細菌，先把手洗乾淨再吃東西或揉眼睛，才能玩得開心又健康。"},{"q":"在公園遇到別人牽著的狗，想摸摸看，最有禮貌又安全的做法是？","options":["直接衝過去抱住牠","先問主人可不可以，得到同意再慢慢伸手","從後面偷偷摸牠的尾巴"],"answer":1,"explain":"就算是有主人的狗，也要先問過主人、得到同意，再慢慢靠近，突然的動作可能會嚇到狗而被咬傷。"},{"q":"關於「保護生活周遭的小生物」，下面哪個做法最貼心？","options":["看到不喜歡的蟲子就全部消滅","把牠們通通抓起來關進盒子","不隨便破壞牠們的家，讓牠們安心生活"],"answer":2,"explain":"每種小生物在自然裡都有自己的角色，不隨意破壞牠們的家，讓牠們安心生活，就是尊重生命的表現。"},{"q":"在野外的池塘邊，同學想抓蝌蚪帶一大桶回家，比較好的建議是什麼？","options":["只安靜觀察，或問過大人後只帶少少幾隻並好好照顧","能抓多少就抓多少，越多越好","把整桶水和蝌蚪都倒進學校水溝"],"answer":0,"explain":"抓太多蝌蚪常常照顧不來就死掉了；安靜觀察，或在大人同意下只帶少量並用心照顧，才是善待生命。"}]};
