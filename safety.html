  // 不依賴 Math.random 的確定性洗牌（以索引擾動；答案以原字串索引 data-orig 比對，不受洗牌影響）
  function shuffleOptions(opts, seed){
    var arr = opts.map(function(o,i){ return {o:o,i:i}; });
    for(var k=arr.length-1;k>0;k--){ seed=(seed*9301+49297)%233280; var j=Math.floor(seed/233280*(k+1)); var t=arr[k];arr[k]=arr[j];arr[j]=t; }
    return arr;
  }

  // ---------- 選單 ----------
  // filterKey 為某個 area key 時只渲染該分組（深連結直達用）；不給則渲染全部四大主題。
  function renderMenu(filterKey){
    var host = $('area-list'); host.innerHTML='';
    var areasToShow = AREAS;
    if(filterKey){
      areasToShow = AREAS.filter(function(a){ return a.key===filterKey; });
      if(!areasToShow.length){ areasToShow = AREAS; filterKey = null; }
    }
    if(filterKey){
      var toAll = document.createElement('button');
      toAll.type='button'; toAll.className='btn'; toAll.id='btn-all-areas';
      toAll.style.marginBottom='var(--s4)';
      toAll.textContent='← 查看全部安全主題';
      toAll.addEventListener('click', function(){ renderMenu(); });
      host.appendChild(toAll);
    }
    areasToShow.forEach(function(area){
      var lessons = SAFETY_DATA[area.key] || [];
      var doneCount = lessons.filter(function(l){ return prog.lessons[l.id] && prog.lessons[l.id].done; }).length;
      var sec = document.createElement('div'); sec.className='sf-area';
      var head = document.createElement('div'); head.className='sf-area-head';
      head.innerHTML = '<span class="sf-area-title">'+area.emoji+' '+area.label+'</span>'+
                       '<span class="sf-area-count">'+doneCount+' / '+lessons.length+'</span>';
      sec.appendChild(head);
      var grid = document.createElement('div'); grid.className='sf-grid';
      lessons.forEach(function(l){
        var done = prog.lessons[l.id] && prog.lessons[l.id].done;
        var btn = document.createElement('button'); btn.type='button';
        btn.className='sf-card'+(done?' done':'');
        btn.innerHTML = '<span class="sf-c-emoji" aria-hidden="true">'+l.emoji+'</span>'+
          '<span class="sf-c-title">'+l.title+'</span>'+
          '<span class="sf-c-state">'+(done?'✓ 學過了':'去學')+'</span>';
        btn.setAttribute('aria-label', l.title + (done?'（已學過）':''));
        btn.addEventListener('click', function(){ openLesson(area.key, l.id); });
        grid.appendChild(btn);
      });
      sec.appendChild(grid);
      host.appendChild(sec);
    });
  }

  // ---------- 教學 + 練習流程 ----------
  var cur = null; // {area, lesson, phase:'teach'|'quiz', qIndex, correctCount, answered}
  function openLesson(areaKey, lessonId){
    var lessons = SAFETY_DATA[areaKey] || [];
    var lesson = null; for(var i=0;i<lessons.length;i++){ if(lessons[i].id===lessonId){ lesson=lessons[i]; break; } }
    if(!lesson) return;
    cur = { area:areaKey, lesson:lesson, phase:'teach', qIndex:0, correctCount:0, answered:false };
    $('play-title').textContent = lesson.emoji + ' ' + lesson.title;
    showScreen('play');
    renderTeach();
  }
  function showScreen(name){
    $('screen-menu').classList.toggle('active', name==='menu');
    $('screen-play').classList.toggle('active', name==='play');
    $('screen-review').classList.toggle('active', name==='review');
    try{ window.scrollTo(0,0); }catch(e){}
  }
  function renderDots(){
    var total = cur.lesson.quiz.length; var d=$('dots'); d.innerHTML='';
    if(cur.phase!=='quiz'){ d.style.display='none'; return; }
    d.style.display='flex';
    for(var i=0;i<total;i++){ var el=document.createElement('i'); if(i<=cur.qIndex) el.className='on'; d.appendChild(el); }
  }
  function renderTeach(){
    cur.phase='teach'; renderDots();
    var l = cur.lesson;
    var howHtml = '<ol class="sf-how">' + l.how.map(function(s){ return '<li>'+s+'</li>'; }).join('') + '</ol>';
    // 漸進式揭示：一次先只出現一小段，點「繼續」再展開下一段，最後才出練習鈕，
    // 避免一進來就是一大片字讓孩子跳過不讀（教學內容不變，只改節奏）。
    var steps = [
      '<div class="sf-block"><div class="sf-block-label">為什麼要注意？</div><div class="sf-block-text">'+l.why+'</div></div>',
      '<div class="sf-block warn"><div class="sf-block-label">如果不這麼做，可能會…</div><div class="sf-block-text">'+l.consequence+'</div></div>',
      '<div class="sf-block"><div class="sf-block-label">可以怎麼做？</div>'+howHtml+'</div>'
    ];
    var step = 0;
    function paint(){
      var last = step >= steps.length - 1;
      var btn = last
        ? '<button type="button" class="btn btn-primary" id="btn-startquiz">我懂了，來練習 ✏️</button>'
        : '<button type="button" class="btn btn-primary" id="btn-next-teach">繼續 ➡️</button>';
      $('stage').innerHTML =
        '<div class="sf-teach">' +
          '<div class="sf-t-emoji" aria-hidden="true">'+l.emoji+'</div>' +
          '<h2>'+l.title+'</h2>' +
          steps.slice(0, step + 1).join('') +
          '<div class="sf-actions">'+btn+'</div>' +
        '</div>';
      if (last) {
        $('btn-startquiz').addEventListener('click', function(){ cur.phase='quiz'; cur.qIndex=0; cur.correctCount=0; renderQuiz(); });
      } else {
        $('btn-next-teach').addEventListener('click', function(){ step++; paint(); });
      }
    }
    paint();
  }
  function renderQuiz(){
    cur.answered=false; renderDots();
    var q = cur.lesson.quiz[cur.qIndex];
    var shown = shuffleOptions(q.options, (cur.qIndex+1)*7 + q.q.length);
    var optHtml = shown.map(function(x){
      return '<button type="button" class="sf-opt" data-orig="'+x.i+'">'+x.o+'</button>';
    }).join('');
    $('stage').innerHTML =
      '<div class="sf-teach">' +
        '<div class="sf-q">第 '+(cur.qIndex+1)+' / '+cur.lesson.quiz.length+' 題<br>'+q.q+'</div>' +
        optHtml +
        '<div class="sf-reveal" id="reveal" aria-live="polite"></div>' +
        '<div class="sf-actions" id="q-actions" style="display:none"><button type="button" class="btn btn-primary" id="btn-nextq"></button></div>' +
      '</div>';
    var opts = $('stage').querySelectorAll('.sf-opt');
    Array.prototype.forEach.call(opts, function(btn){
      btn.addEventListener('click', function(){ answer(btn, q, opts); });
    });
  }
  function answer(btn, q, opts){
    if(cur.answered) return; cur.answered=true;
    var chosen = parseInt(btn.getAttribute('data-orig'),10);
    var correct = (chosen === q.answer);
    if(correct) cur.correctCount++;
    try { if (window.Game && typeof Game.pingActive === 'function') Game.pingActive(); } catch(e){}  // 安全模組不發 XP，但作答＝當日有學習（且此為首訪 hero 推薦的第一個活動），維持每日連續 streak（只續火焰、不計分）
    var sens = !!q.sensitive;  // 敏感題(自傷/求助等揭露型情境)：不用對錯計分語氣，避免把孩子真實處境 trivialize
    Array.prototype.forEach.call(opts, function(b){
      var oi = parseInt(b.getAttribute('data-orig'),10);
      if(oi===q.answer) b.classList.add('correct');
      else if(b===btn && !sens) b.classList.add('wrong');  // 敏感題不把孩子的選擇標成「錯」
      b.disabled = true;
    });
    var rev = $('reveal');
    rev.textContent = sens
      ? ('這一點很重要，記住了就好——你不需要一個人扛。' + q.explain)
      : ((correct ? '答對了！👍 ' : '沒關係～正確答案是這個喔！') + q.explain);
    rev.classList.add('show');
    var act = $('q-actions'); act.style.display='flex';
    var next = $('btn-nextq');
    var last = (cur.qIndex >= cur.lesson.quiz.length-1);
    next.textContent = last ? '完成這個主題 🎉' : '下一題 ➡️';
    next.onclick = function(){
      if(last){ finishLesson(); }
      else { cur.qIndex++; renderQuiz(); }
    };
    try{ next.focus(); }catch(e){}  // 作答後焦點移到「下一題」，便於鍵盤／螢幕閱讀器操作
  }
  function finishLesson(){
    var l = cur.lesson;
    prog.lessons[l.id] = { done:true, correct:cur.correctCount, total:l.quiz.length };
    saveProg(prog);
    $('dots').style.display='none';
    var hasSens = (l.quiz||[]).some(function(q){ return q.sensitive; });  // 含敏感題的課：不顯示「答對 X/Y 題」分數，改用關懷語，避免把沉重情境變成計分遊戲
    var heading = hasSens ? '你更懂得照顧自己，也知道可以找誰了' : '學會了！你更懂得保護自己了';
    var body = hasSens
      ? '你學會了怎麼保護自己，也知道遇到狀況時可以找誰、可以怎麼做。記得：這些事你不用自己一個人面對。'
      : '這個主題答對了 '+cur.correctCount+' / '+l.quiz.length+' 題。記得把學到的方法用在生活裡喔！';
    $('stage').innerHTML =
      '<div class="sf-teach" style="text-align:center">' +
        '<div class="sf-t-emoji" aria-hidden="true">🎉</div>' +
        '<h2>'+heading+'</h2>' +
        '<div class="sf-block"><div class="sf-block-text">'+body+'</div></div>' +
        '<div class="sf-actions"><button type="button" class="btn btn-primary" id="btn-tomenu">回主題選單</button></div>' +
      '</div>';
    $('btn-tomenu').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });
  }

  $('btn-back').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });

  // ================= 綜合複習：交錯出題、可反覆重來 =================
  // 題庫來源＝各主題「已教過並校對過」的 quiz（單一真實來源），外加一份專為複習加寫的 REVIEW_EXTRA。
  // 兩者都標上所屬領域，出題時打散並「盡量讓相鄰題來自不同領域」（交錯練習，interleaving）。
  var AREA_LABEL = {}; AREAS.forEach(function(a){ AREA_LABEL[a.key] = { label:a.label, emoji:a.emoji }; });
  // 複習題脫離原課程情境單獨出現，把少數「用今天學到的觀念」這類承接語去掉，讓題目能獨立閱讀（不動教學模式原文）。
  function stemForReview(s){
    return s.replace(/用今天學到的觀念[，、]?/g,'').replace(/用今天的方法[，、]?/g,'');
  }
  function harvestPool(){
    var pool = [];
    AREAS.forEach(function(a){
      (SAFETY_DATA[a.key]||[]).forEach(function(t){
        (t.quiz||[]).forEach(function(q){
          if(q.sensitive) return;  // 自傷/求助等最沉重的題目不進「計分、可重來」的綜合複習池，只留在原課程完整關懷情境中
          pool.push({ q:stemForReview(q.q), options:q.options, answer:q.answer, explain:q.explain, domain:a.key });
        });
      });
    });
    // 加寫的複習題（若有），同樣標領域
    Object.keys(REVIEW_EXTRA).forEach(function(dk){
      (REVIEW_EXTRA[dk]||[]).forEach(function(q){
        if(q.sensitive) return;  // 與 SAFETY_DATA 同一道防線：加寫題若標記敏感也絕不進計分複習池
        pool.push({ q:q.q, options:q.options, answer:q.answer, explain:q.explain, domain:dk });
      });
    });
    return pool;
  }
  // 以種子擾動的洗牌（每輪用不同種子 → 每次重來題序都不同）
  function seededShuffle(arr, seed){
    var a = arr.slice();
    for(var k=a.length-1;k>0;k--){ seed=(seed*9301+49297)%233280; var j=Math.floor(seed/233280*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    return a;
  }
  // 交錯排列：貪婪地讓相鄰題盡量來自不同領域
  function interleave(items){
    var buckets = {}; items.forEach(function(it){ (buckets[it.domain]=buckets[it.domain]||[]).push(it); });
    var out = [], lastDomain = null, remaining = items.length;
    while(remaining>0){
      var keys = Object.keys(buckets).filter(function(k){ return buckets[k].length; });
      // 優先選「和上一題不同領域、且剩最多」的桶；避免尾端被迫連續同領域
      keys.sort(function(x,y){ return buckets[y].length - buckets[x].length; });
      var pick = null;
      for(var i=0;i<keys.length;i++){ if(keys[i]!==lastDomain){ pick=keys[i]; break; } }
      if(pick===null) pick = keys[0];
      out.push(buckets[pick].shift()); lastDomain = pick; remaining--;
    }
    return out;
  }
  var rv = null; // {queue, idx, correct, answered}
  var rvSeed = 20250822;
  function openReviewMenu(){
    showScreen('review');
    $('review-title').textContent = '綜合複習 🎯';
    var total = harvestPool().length;
    var lens = [
      { n:10, emoji:'⚡', title:'快速複習・10 題', sub:'花幾分鐘，暖身檢查一下' },
      { n:20, emoji:'🎯', title:'標準複習・20 題', sub:'跨主題交錯，紮實驗收' },
      { n:30, emoji:'🏆', title:'挑戰複習・30 題', sub:'想多練一點就選這個' }
    ];
    var cards = lens.map(function(o){
      return '<button type="button" class="sf-len" data-n="'+o.n+'">'+
        '<span class="sf-len-emoji" aria-hidden="true">'+o.emoji+'</span>'+
        '<span><span class="sf-len-title">'+o.title+'</span><br><span class="sf-len-sub">'+o.sub+'</span></span>'+
      '</button>';
    }).join('');
    $('review-stage').innerHTML =
      '<div class="sf-teach">'+
        '<div class="sf-t-emoji" aria-hidden="true">🎯</div>'+
        '<h2>綜合複習・驗收學習</h2>'+
        '<div class="sf-block"><div class="sf-block-text">這裡會把各安全主題的題目<b>打散、交錯</b>出給你，每一輪的題目和順序都不一樣。答錯不要緊，看完說明再想一次就好——重點是把保護自己的本領記牢。目前題庫共有 <b>'+total+'</b> 題。</div></div>'+
        '<div class="sf-len-grid">'+cards+'</div>'+
      '</div>';
    Array.prototype.forEach.call($('review-stage').querySelectorAll('.sf-len'), function(b){
      b.addEventListener('click', function(){ startReview(parseInt(b.getAttribute('data-n'),10)); });
    });
  }
  function startReview(n){
    var pool = harvestPool();
    if(!pool.length){ openReviewMenu(); return; }
    rvSeed = (rvSeed*9301 + 49297) % 233280;  // 每輪換種子（溢位安全）→ 題目與順序每輪不同
    n = Math.min(n, pool.length);
    // 先依領域分組並各自洗牌，再「輪流」從各領域抽題，確保短輪次也能橫跨各主題（不被大領域灌滿）
    var byDom = {}; pool.forEach(function(q){ (byDom[q.domain]=byDom[q.domain]||[]).push(q); });
    var domKeys = Object.keys(byDom);
    domKeys.forEach(function(k,i){ byDom[k] = seededShuffle(byDom[k], rvSeed + i*131 + 17); });
    domKeys = seededShuffle(domKeys, rvSeed + 7);
    // picked.length < pool.length 保證仍有非空的桶，輪流一圈內必取到一題 → 不會空轉
    var picked = [], di = 0;
    while(picked.length < n && picked.length < pool.length){
      var dk = domKeys[di % domKeys.length];
      if(byDom[dk] && byDom[dk].length) picked.push(byDom[dk].shift());
      di++;
    }
    var queue = interleave(picked);
    if(!queue.length){ openReviewMenu(); return; }
    rv = { queue:queue, idx:0, correct:0, answered:false };
    renderReviewQ();
  }
  function renderReviewQ(){
    rv.answered = false;
    var item = rv.queue[rv.idx];
    var total = rv.queue.length;
    var pct = Math.round(rv.idx/total*100);
    var meta = AREA_LABEL[item.domain] || {label:'安全',emoji:'🛡️'};
    var shown = shuffleOptions(item.options, (rv.idx+1)*13 + item.q.length + rvSeed%97);
    var optHtml = shown.map(function(x){ return '<button type="button" class="sf-opt" data-orig="'+x.i+'">'+x.o+'</button>'; }).join('');
    $('review-stage').innerHTML =
      '<div class="sf-teach">'+
        '<div class="sf-rv-bar">'+
          '<div class="sf-rv-track"><div class="sf-rv-fill" style="width:'+pct+'%"></div></div>'+
          '<span class="sf-rv-score">第 '+(rv.idx+1)+'/'+total+' 題 · 答對 '+rv.correct+'</span>'+
        '</div>'+
        '<span class="sf-rv-tag"><span aria-hidden="true">'+meta.emoji+'</span> '+meta.label+'</span>'+
        '<div class="sf-q">'+item.q+'</div>'+
        optHtml+
        '<div class="sf-reveal" id="rv-reveal" aria-live="polite"></div>'+
        '<div class="sf-actions" id="rv-actions" style="display:none"><button type="button" class="btn btn-primary" id="btn-rv-next"></button></div>'+
      '</div>';
    var opts = $('review-stage').querySelectorAll('.sf-opt');
    Array.prototype.forEach.call(opts, function(btn){
      btn.addEventListener('click', function(){ answerReview(btn, item, opts); });
    });
  }
  function answerReview(btn, item, opts){
    if(rv.answered) return; rv.answered = true;
    var chosen = parseInt(btn.getAttribute('data-orig'),10);
    var correct = (chosen === item.answer);
    if(correct) rv.correct++;
    try { if (window.Game && typeof Game.pingActive === 'function') Game.pingActive(); } catch(e){}
    Array.prototype.forEach.call(opts, function(b){
      var oi = parseInt(b.getAttribute('data-orig'),10);
      if(oi===item.answer) b.classList.add('correct');
      else if(b===btn) b.classList.add('wrong');
      b.disabled = true;
    });
    var rev = $('rv-reveal');
    rev.textContent = (correct ? '答對了！👍 ' : '沒關係～正確答案是這個喔！ ') + item.explain;
    rev.classList.add('show');
    var fill = $('review-stage').querySelector('.sf-rv-fill');  // 作答後把進度條推進到「已完成這題」
    if(fill) fill.style.width = Math.round((rv.idx+1)/rv.queue.length*100)+'%';
    var act = $('rv-actions'); act.style.display='flex';
    var next = $('btn-rv-next');
    var last = (rv.idx >= rv.queue.length-1);
    next.textContent = last ? '看成績 🎉' : '下一題 ➡️';
    next.onclick = function(){ if(last){ finishReview(); } else { rv.idx++; renderReviewQ(); } };
    try{ next.focus(); }catch(e){}  // 作答後把焦點移到「下一題」，鍵盤／螢幕閱讀器不必重新尋找
  }
  function finishReview(){
    var total = rv.queue.length, got = rv.correct;
    var pct = Math.round(got/total*100);
    var msg, emoji;
    if(pct>=90){ emoji='🏆'; msg='太厲害了！這些保護自己的本領，你幾乎都記住了。'; }
    else if(pct>=70){ emoji='🌟'; msg='很棒！大部分都答對了，把答錯的再看一次就更完整囉。'; }
    else if(pct>=50){ emoji='💪'; msg='不錯的開始！多複習幾輪，會越來越熟練。'; }
    else { emoji='🌱'; msg='沒關係，複習就是用來練習的。回主題再看一看，然後再來挑戰一次！'; }
    $('review-stage').innerHTML =
      '<div class="sf-teach" style="text-align:center">'+
        '<div class="sf-t-emoji" aria-hidden="true">'+emoji+'</div>'+
        '<h2>這一輪答對 '+got+' / '+total+' 題</h2>'+
        '<div class="sf-block"><div class="sf-block-text">'+msg+'</div></div>'+
        '<div class="sf-actions">'+
          '<button type="button" class="btn btn-primary" id="btn-rv-again">再來一輪 🔄</button>'+
          '<button type="button" class="btn" id="btn-rv-menu">回主題選單</button>'+
        '</div>'+
      '</div>';
    $('btn-rv-again').addEventListener('click', function(){ startReview(total); });  // 立即再來同長度的一輪（重洗題目與順序），符合「再來一輪」
    $('btn-rv-menu').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });
  }
  $('btn-open-review').addEventListener('click', function(){ openReviewMenu(); });
  $('btn-review-back').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });

  // 載入時的 hash 路由：#personal / #home / #emergency / #outdoor（#traffic 為 outdoor 別名）
  // 直接渲染對應分組；無對應 hash 則維持原本的全部主題選單。
  function areaFromHash(){
    var raw = (window.location.hash || '').replace(/^#/, '').toLowerCase();
    return HASH_TO_AREA[raw] || null;
  }
  var initialHash = (window.location.hash || '').replace(/^#/, '').toLowerCase();
  var initialArea = areaFromHash();
  showScreen('menu');
  renderMenu(initialArea);
  if(initialHash === 'review'){ openReviewMenu(); }  // 首頁「綜合複習」卡片深連結 → 直接開複習
})();
</script>
