<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全小達人 🛡️</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<!--
  安全小達人：個人安全 / 居家與衛生 / 緊急應變與求救 / 交通與戶外。
  純本地教學模組（data-game-hud="off"、自有 key safety_progress_v1、不呼叫 Game.recordAnswer/award），
  不計入主角色 XP／等級（避免重複計分，與觀念養成頁一致）。每單元「先教為什麼 → 不做會怎樣 → 怎麼做 → 練習」。
  正確性第一（台灣情境：報警110／火災救護119／手機緊急112）；急救只教安全、孩子做得到的層級。全繁體中文。
-->
<style>
  :root{ --su:#0f766e; --su-d:#0b5b54; --su-tint:rgba(15,118,110,0.12); }
  :root[data-theme="dark"]{ --su:#5eead4; --su-d:#99f6e4; --su-tint:rgba(94,234,212,0.14); }
  .sf-wrap{ max-width: 900px; margin-inline:auto; }
  /* 選單（關卡卡片格）填滿寬版容器，與其他頁一致；教學/練習畫面維持易讀窄欄 */
  #screen-menu.sf-wrap{ max-width: var(--content-max); }
  .sf-screen{ display:none; } .sf-screen.active{ display:block; }
  .sf-topbar{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s4); }
  .sf-title{ font-size:var(--fs-h2); font-weight:800; color:var(--su-d); }
  .sf-hello{ display:flex; align-items:center; gap:var(--s3); padding:var(--s4); background:var(--su-tint);
    border:1px solid var(--card-border); border-radius:var(--r-lg); margin-bottom:var(--s5); }
  .sf-hello .sf-mascot{ font-size:46px; flex:none; line-height:1; }
  .sf-htext{ font-size:var(--fs-body); font-weight:700; color:var(--ink); }
  .sf-hsub{ font-size:var(--fs-small); color:var(--ink-soft); font-weight:600; margin-top:2px; }
  .sf-area{ margin-bottom:var(--s6); }
  .sf-area-head{ display:flex; align-items:baseline; gap:var(--s2); margin-bottom:var(--s3); }
  .sf-area-title{ font-size:17px; font-weight:800; color:var(--ink); }
  .sf-area-count{ font-size:var(--fs-small); font-weight:700; color:var(--ink-soft); }
  .sf-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:var(--s3); }
  .sf-card{ display:flex; align-items:center; gap:var(--s3); text-align:left; width:100%;
    padding:var(--s3) var(--s4); min-height:var(--tap-min); background:var(--card);
    border:2px solid var(--card-border); border-radius:var(--r-lg); cursor:pointer;
    font-family:var(--font); color:var(--ink); }
  .sf-card:hover{ border-color:var(--su); }
  .sf-card.done{ border-color:var(--su); background:var(--su-tint); }
  .sf-card .sf-c-emoji{ font-size:30px; flex:none; }
  .sf-card .sf-c-title{ font-size:var(--fs-body); font-weight:700; line-height:1.4; }
  .sf-card .sf-c-state{ margin-left:auto; font-size:var(--fs-small); font-weight:800; color:var(--su-d); flex:none; }
  .sf-note{ text-align:center; color:var(--ink-soft); font-size:var(--fs-small); margin-top:var(--s5); font-weight:600; max-width:34em; margin-inline:auto; }
  /* 教學區 */
  .sf-teach{ background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm); padding:var(--s5) var(--s4); }
  .sf-teach .sf-t-emoji{ font-size:48px; text-align:center; }
  .sf-teach h2{ font-size:var(--fs-h2); font-weight:800; color:var(--su-d); text-align:center; margin:var(--s2) 0 var(--s4); }
  .sf-block{ margin-bottom:var(--s4); padding:var(--s3) var(--s4); border-radius:var(--r-md); border-left:4px solid var(--su); background:var(--su-tint); }
  .sf-block.warn{ border-left-color:var(--c-warn); background:var(--tint-chinese); }
  .sf-block-label{ font-size:var(--fs-small); font-weight:800; margin-bottom:4px; }
  .sf-block .sf-block-label{ color:var(--su-d); }
  .sf-block.warn .sf-block-label{ color:var(--c-chinese-ink); }
  .sf-block-text{ font-size:var(--fs-body); font-weight:600; color:var(--ink); line-height:1.7; }
  .sf-how{ margin:var(--s2) 0 0 0; padding:0; list-style:none; counter-reset:step; }
  .sf-how li{ position:relative; padding:8px 8px 8px 40px; margin-bottom:6px; font-size:var(--fs-body);
    font-weight:600; color:var(--ink); line-height:1.6; background:var(--bg); border-radius:var(--r-md); }
  .sf-how li::before{ counter-increment:step; content:counter(step); position:absolute; left:8px; top:8px;
    width:24px; height:24px; border-radius:50%; background:var(--c-english-btn); color:var(--on-accent); font-weight:800;
    display:flex; align-items:center; justify-content:center; font-size:13px; }
  /* quiz */
  .sf-q{ font-size:var(--fs-body); font-weight:700; color:var(--ink); line-height:1.6; margin-bottom:var(--s3); }
  .sf-opt{ display:block; width:100%; text-align:left; margin-bottom:var(--s2); padding:14px var(--s4);
    min-height:var(--tap-min); border:2px solid var(--card-border); border-radius:var(--r-md);
    background:var(--card); color:var(--ink); font-family:var(--font); font-size:var(--fs-body); font-weight:600; cursor:pointer; }
  .sf-opt:hover{ border-color:var(--su); }
  .sf-opt.correct{ border-color:var(--c-correct); background:var(--tint-english); }
  .sf-opt.wrong{ border-color:var(--c-wrong); background:rgba(255,118,117,0.12); }
  .sf-reveal{ margin-top:var(--s3); padding:var(--s3) var(--s4); background:var(--su-tint);
    border-radius:var(--r-md); font-size:var(--fs-body); font-weight:700; color:var(--ink); line-height:1.6; display:none; }
  .sf-reveal.show{ display:block; }
  .sf-dots{ display:flex; gap:6px; justify-content:center; margin-bottom:var(--s4); }
  .sf-dots i{ width:20px; height:6px; border-radius:999px; background:var(--card-border); }
  .sf-dots i.on{ background:var(--su); }
  .sf-actions{ margin-top:var(--s4); display:flex; gap:var(--s3); }
  .sf-actions .btn{ flex:1; }
</style>
</head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">安全小達人 🛡️</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">
  <section id="screen-menu" class="sf-screen active sf-wrap">
    <div class="sf-topbar"><span class="sf-title">安全小達人 🛡️</span></div>
    <div class="sf-hello">
      <span class="sf-mascot" aria-hidden="true">🛡️</span>
      <div>
        <div class="sf-htext">學會保護自己，就能玩得開心、走得安心。每個主題都是「先懂為什麼 → 知道怎麼做 → 練習看看」。</div>
        <div class="sf-hsub">放輕鬆學就好，這些本領會一直保護你。</div>
      </div>
    </div>
    <div id="area-list"></div>
    <p class="sf-note">這是「安全教育」小旅程，只留在你的裝置上，不影響學習基地的等級或經驗值。真的遇到危險，記得找大人、打 110（警察）或 119（火災、救護車）。</p>
  </section>

  <section id="screen-play" class="sf-screen sf-wrap">
    <div class="sf-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到主題選單">←</button>
      <span class="sf-title" id="play-title">安全主題</span>
    </div>
    <div class="sf-dots" id="dots" aria-hidden="true"></div>
    <div class="play-column"><div id="stage"></div></div>
  </section>
</main>

<script>
/* eslint-disable */
var SAFETY_DATA = {"personal":[{"id":"ps01money","title":"財不露白：不隨便讓別人知道家裡有什麼","emoji":"🤫","why":"錢和貴重的東西是自己家的事。如果到處跟人說家裡很有錢、有很多名牌，或把新手機、金項鍊亮給不熟的人看，有壞心的人可能會記住你、盯上你的家。低調一點，反而更安全，也更有禮貌。","consequence":"如果一直炫耀家裡多有錢、爸媽賺多少，或在外面把貴重東西拿出來給大家看，可能會被有壞念頭的人注意到，想騙你或偷你的東西；同學之間也容易因為比較而不開心。","how":["別人問『你家很有錢喔？』『你爸媽賺多少？』時，笑一笑說『我不太清楚耶』就好，不用回答。","貴重的東西（手機、平板、首飾、很多現金）放在包包裡收好，不要在路上或公車上拿出來炫耀。","不要在網路上、遊戲聊天室跟不認識的人說你家住哪、家裡有什麼值錢的東西。","家裡的鑰匙、密碼、爸媽的信用卡號碼是祕密，不告訴同學或陌生人。"],"quiz":[{"q":"同學一直問『你家是不是很有錢？你爸賺多少？』，你怎麼回答比較好？","options":["詳細說出爸媽的薪水和家裡有多少錢","笑一笑說『我不太清楚耶』，把話題帶開","把家裡的名牌包照片拿給大家看"],"answer":1,"explain":"錢的事情是家裡的私事，客氣地把話題帶開就好。"},{"q":"在網路遊戲裡，一個不認識的網友問你家住哪、家裡有什麼值錢東西，你該怎麼做？","options":["不告訴他，並跟爸媽說有人問這些","全部老實告訴他，這樣才有禮貌","把家裡地址傳給他看"],"answer":0,"explain":"家裡的資訊是祕密，不要告訴陌生網友，並且要把有人問這些的事告訴爸媽。"}]},{"id":"ps02stranger","title":"應對陌生人：不跟走、不收東西、會找對的人求助","emoji":"🙅","why":"大部分的人都是好人，但我們沒辦法一眼看出誰是好人。所以遇到不認識的大人要你跟他走、或給你糖果、玩具、要載你一程時，先保持距離、先問爸媽，才不會被有壞念頭的人騙走。","consequence":"如果因為對方看起來很親切、東西很吸引人就跟著走或上車，萬一對方是壞人，你可能會被帶到陌生的地方，離開爸媽找得到你的範圍，會很危險也很害怕。","how":["陌生人叫你跟他走、上他的車，就算他說『你媽媽叫我來接你』，也要說『我要先打電話問我爸媽』，並馬上離開往人多的地方。","陌生人給你糖果、飲料、玩具或錢，禮貌地說『謝謝，不用了』，不要收、不要吃。","保持一個手臂以上的距離，站在你可以隨時跑開的位置，不要靠近車子或角落。","需要幫忙時，找店員、櫃檯人員、警察，或有穿制服、帶著小孩的大人求助，比較安全。"],"quiz":[{"q":"放學時一個不認識的叔叔說『你媽媽很忙，叫我開車來載你回家』，你該怎麼做？","options":["因為他知道我媽媽，就上車","說『我要先打電話問我媽媽』，然後往人多的地方走、找老師或店家","收下他給的飲料再說"],"answer":1,"explain":"先打電話向爸媽確認、先離開到人多安全的地方，才不會被有壞念頭的人騙走。"},{"q":"陌生人拿出很漂亮的玩具說『送你，跟我來拿』，正確的做法是？","options":["禮貌說『謝謝，不用了』，不跟他走","玩具很棒，馬上跟著去拿","先收下玩具再決定"],"answer":0,"explain":"再吸引人的東西也不值得冒險，禮貌地拒絕、不跟陌生人走才安全。"},{"q":"在外面需要幫忙時，找誰比較安全？","options":["站在暗巷裡等有人經過","店員、櫃檯人員或警察","任何一個看起來很兇的人"],"answer":1,"explain":"找店員、櫃檯人員或警察這種固定在那裡、看得到的大人求助最可靠。"}]},{"id":"ps03route","title":"記住路線和地標：知道自己在哪裡","emoji":"🗺️","why":"平常上下學、去常去的地方時，如果記得走過的路和明顯的地標（像便利商店、公園、大招牌），萬一走錯路或迷路，就能靠這些記憶找回去，也能跟大人說清楚你在哪裡。","consequence":"如果從來不注意路怎麼走，一旦跟家人走散或走錯方向，就不知道自己在哪、也說不出位置，會更慌張、更難找到回家的路。","how":["走常走的路時，抬頭看看沿路有什麼好記的地標：便利商店、加油站、大樓、公園、學校招牌。","記住幾個關鍵的轉彎，例如『在7-11那個路口右轉』。","走路時不要一直低頭看手機，多留意周圍，才記得住路。","記住自己家的地址和附近的大地標，需要時可以告訴警察或店員你住哪一區。"],"quiz":[{"q":"為什麼平常要記住沿路的地標（像便利商店、公園）？","options":["這樣走錯路或迷路時，比較能找回去、也說得出自己在哪","為了考試","沒有用，記了也沒差"],"answer":0,"explain":"地標就像路上的記號，記住它們，迷路時就能幫你找到方向。"},{"q":"走路回家時，下面哪個習慣比較安全？","options":["一路低頭打電動，都不看路","偶爾抬頭看看路和地標，留意周圍","閉著眼睛憑感覺走"],"answer":1,"explain":"抬頭看路、留意四周，既能記住路線又能注意安全。"}]},{"id":"ps04alert","title":"在外提高警覺：走亮的路、不落單暗處","emoji":"💡","why":"人多、明亮的地方比較安全，因為有很多人看得到、能幫忙。走暗暗的小巷、空無一人的地下道，或自己一個人待在偏僻的角落，遇到狀況時比較沒有人能幫你。","consequence":"如果為了抄近路走沒有燈、沒有人的暗巷，或天黑了還獨自在偏僻的地方逗留，萬一遇到危險，附近可能沒有人能立刻幫忙。","how":["盡量走大馬路、有路燈、有店家、人比較多的路，不要為了近而走暗巷。","天黑後或去不熟的地方，盡量和同學、家人一起走，不要落單。","走路時注意四周，不要戴著耳機把音量開很大，才聽得到旁邊的動靜。","覺得某個地方怪怪的、讓你不舒服，就相信自己的感覺，離開那裡到明亮的地方。"],"quiz":[{"q":"放學要回家，有兩條路：一條是有店家、路燈的大馬路，一條是沒人又沒燈的暗巷但比較近。你該走哪條？","options":["走暗巷，因為比較快","走有店家和路燈、人比較多的大馬路","閉眼睛隨便選一條"],"answer":1,"explain":"安全比快幾分鐘重要，選明亮、有人的路走比較安全。"},{"q":"走在路上覺得某個角落『怪怪的、讓我不舒服』，最好怎麼做？","options":["相信自己的感覺，離開那裡到明亮有人的地方","硬著頭皮繼續往那裡走","站在原地發呆"],"answer":0,"explain":"那種怪怪的感覺常常在提醒你有危險，聽它的話趕快離開比較安全。"}]},{"id":"ps05followed","title":"覺得被跟蹤或走失時怎麼辦","emoji":"🏃","why":"萬一覺得有人一直跟著你，或和家人走散了，先別慌。只要知道該往哪裡走、找誰幫忙，並記得家人的電話，就能讓自己回到安全的地方。事先想好方法，真的遇到時就不會手足無措。","consequence":"如果被跟蹤時往更沒人的地方跑，或走失時自己亂走、還跟著陌生人離開，反而會離安全和家人越來越遠，更難被找到。","how":["覺得被跟蹤時，往人多、明亮的地方走，例如便利商店、店家、有警察的地方，不要往暗巷或家裡直接走。","走進商店跟店員說『我覺得有人跟著我，可以幫我嗎？』，並打電話給家人。","走失時，先待在原地或原本約好的地方等家人；如果在賣場、車站，就找櫃檯或穿制服的工作人員、警察。","記住至少一位家人的電話號碼和自己的名字、住哪一區，需要時可以請大人幫你打電話。","真的很危險、有人要抓你時，大聲喊『救命！我不認識他！』，引起旁邊的人注意。"],"quiz":[{"q":"走在路上覺得有人一直跟著你，最好往哪裡走？","options":["往沒有人的暗巷跑","往人多、明亮的便利商店或店家走，並找店員幫忙","直接走回家，讓對方知道你住哪"],"answer":1,"explain":"往人多的地方走、找店員幫忙最安全；直接回家反而會讓對方知道你家在哪。"},{"q":"在大賣場和爸媽走散了，你該怎麼做？","options":["自己跑出賣場到馬路上找","待在原地或找櫃檯、穿制服的工作人員幫忙","跟著一個好心的陌生人離開賣場去找爸媽"],"answer":1,"explain":"留在原地或找櫃檯人員，爸媽最容易找到你。"},{"q":"為什麼要背下至少一位家人的電話號碼？","options":["為了炫耀記憶力","走失或需要幫忙時，可以請大人幫你打電話聯絡家人","沒有必要，手機會記著"],"answer":1,"explain":"萬一沒有手機或手機沒電，記在腦子裡的電話號碼就能幫你聯絡到家人。"}]}],"home":[{"id":"wash1","title":"洗手與咳嗽禮節：對付看不見的病菌","emoji":"🧼","why":"我們的手和空氣裡有很多看不見的病菌。吃飯前、上完廁所、玩完回家、擤鼻涕或咳嗽後，手上的病菌最多。把它們洗掉，就比較不會生病。","consequence":"如果沒洗手就拿東西吃，病菌會跟著食物跑進肚子，可能讓你拉肚子、發燒；咳嗽打噴嚏不遮口鼻，也容易把感冒傳給家人和同學。","how":["在吃東西前、上廁所後、玩完回家、擤鼻涕或咳嗽後，記得先洗手","用肥皂搓手心、手背、指縫和指甲縫，大約唱兩次生日快樂歌（約20秒）","用清水把泡泡沖乾淨，再用乾淨的毛巾或紙巾把手擦乾","咳嗽或打噴嚏時，用手肘內側或衛生紙遮住口鼻，不要對著別人","生病時可以戴口罩、多休息，用過的衛生紙丟進垃圾桶"],"quiz":[{"q":"下面哪個時候最需要洗手？","options":["吃飯前和上廁所後","只有手看起來很髒才洗","睡覺前洗一次就整天不用了","從來都不用洗"],"answer":0,"explain":"吃飯前和上廁所後手上病菌最多，這時候洗手最重要。"},{"q":"咳嗽或打噴嚏時，怎麼做最有禮貌又不傳染別人？","options":["對著同學咳過去","用手肘內側或衛生紙遮住口鼻","用力憋住不咳","用手摀住後再去拿食物"],"answer":1,"explain":"咳嗽或打噴嚏時用手肘或衛生紙遮住，病菌就不會飛到別人身上。"},{"q":"用肥皂洗手大約要搓多久比較乾淨？","options":["碰一下水就好","大約20秒，可以唱兩次生日快樂歌","只沖水不用肥皂","越快越好，一秒就夠"],"answer":1,"explain":"洗手要搓20秒才能把病菌洗掉，可以一邊唱生日快樂歌一邊洗來計時。"}]},{"id":"elec1","title":"安全用電：電很有力量","emoji":"🔌","why":"電看不見，但力量很大，可以讓燈亮、讓電器動。水會讓電跑得更快，所以濕濕的手碰插座很危險；一個插座接太多電器，也會變得很燙。","consequence":"濕手碰插座、或把東西插進插座的洞，可能會被電到（觸電），又痛又危險；插座接太多電器過熱，還可能起火。","how":["手是濕的時候，先把手擦乾，再去碰插頭或開關","不要把手指、剪刀、鐵絲或任何東西插進插座的洞裡","要拔插頭時，捏住插頭本體往外拉，不要拉電線","不要在同一個插座接很多電器；如果插座或電線發燙、有燒焦味，馬上告訴大人","電器泡到水、或電線破皮露出來時不要碰，請大人來處理"],"quiz":[{"q":"手濕濕的想拔插頭，應該怎麼做？","options":["直接拔就好","先把手擦乾再拔","用嘴巴咬著拔","叫寵物幫忙拔"],"answer":1,"explain":"先把手擦乾再碰插頭，才不會被電到。"},{"q":"聞到插座有燒焦味、摸起來燙燙的，最好怎麼辦？","options":["自己拆開來看看","潑水讓它涼一點","告訴大人，不要自己處理","假裝沒聞到繼續玩"],"answer":2,"explain":"這是危險的信號，趕快告訴大人，讓大人來處理最安全。"},{"q":"下面哪一個用電做法是安全的？","options":["把鐵絲插進插座孔","一個插座插很多電器","拔插頭時用力拉電線","拔插頭時捏住插頭本體"],"answer":3,"explain":"拔插頭時要捏住插頭本體拔，電線才不會壞掉。"}]},{"id":"gas1","title":"瓦斯與一氧化碳：聞到怪味先開窗","emoji":"🔥","why":"廚房的瓦斯和熱水器如果漏出來，聞起來會臭臭的，像臭雞蛋的味道。還有一種叫一氧化碳的氣體沒有味道，卻很危險。這些氣體碰到火花或讓人吸太多，都會出事。","consequence":"聞到瓦斯味還去開電燈、開抽風機或點火，小火花可能引起爆炸或火災；一氧化碳吸太多，人會頭暈、想睡，甚至昏倒。","how":["聞到像臭雞蛋的瓦斯味時，不要開也不要關任何電燈或電器（開關會產生小火花）","趕快打開窗戶和門，讓空氣流通","大聲告訴大人，和大人一起離開到室外","洗澡或使用瓦斯時，讓窗戶保持通風，不要把窗戶全部關死","如果覺得頭暈、想睡又聞到怪味，先到室外呼吸新鮮空氣，並找大人幫忙"],"quiz":[{"q":"聞到像臭雞蛋的瓦斯味，下面哪件事「絕對不能做」？","options":["打開窗戶","去開電燈或開抽風機","告訴大人","走到室外"],"answer":1,"explain":"開關會產生看不見的小火花，聞到瓦斯味時千萬別碰電器，以免引起危險。"},{"q":"聞到瓦斯味的時候，應該怎麼做？","options":["趕快點火看看有沒有漏","打開窗戶通風，並告訴大人","躲進棉被裡","當作沒事繼續玩"],"answer":1,"explain":"聞到瓦斯味時，開窗通風並找大人幫忙，是最安全的做法。"},{"q":"關於一氧化碳，哪一句是對的？","options":["它很臭，一聞就知道","它沒有味道，吸多了會頭暈想睡，所以要保持通風","多吸一點也沒關係","只有夏天才會有"],"answer":1,"explain":"正因為它沒有味道，所以使用瓦斯、熱水器時保持通風特別重要。"}]},{"id":"med1","title":"藥品與清潔劑：不亂碰、不亂吃","emoji":"💊","why":"藥品、清潔劑（像漂白水、洗碗精）、殺蟲劑，有時候顏色鮮豔，看起來像糖果或飲料，但它們是給大人在正確時候用的，吃了或碰到皮膚會受傷。","consequence":"把藥當糖果吃、或喝下清潔劑，可能會中毒，讓嘴巴、肚子灼傷，是很危險的事。","how":["看到不認識的藥、瓶罐或噴劑，不要打開、不要聞、也不要嚐","生病需要吃藥時，一定要由大人拿給你，照著大人說的份量吃，不自己多吃","瓶子上如果有警告圖案（像骷髏頭、打叉），表示很危險，不要碰","清潔劑和藥品要放在原本的瓶子裡，不要倒進飲料瓶，才不會認錯","如果不小心碰到或吃到，趕快告訴大人，說清楚你碰到或吃了什麼"],"quiz":[{"q":"看到不認識的瓶瓶罐罐，最安全的做法是？","options":["打開聞聞看是什麼","嚐一小口試試味道","不要碰，先問大人","倒出來當玩具玩"],"answer":2,"explain":"不確定的東西不要碰、先問大人，才能保護自己。"},{"q":"生病需要吃藥時，怎麼做才對？","options":["自己多吃幾顆會好得快","由大人拿給你，照份量吃","把藥當糖果分給同學","偷偷藏起來自己吃"],"answer":1,"explain":"藥一定要照大人說的份量吃，不能自己亂加。"},{"q":"瓶子上有骷髏頭或打叉的圖案，代表什麼？","options":["很好吃","危險，不要碰","可以拿來喝","是玩具"],"answer":1,"explain":"那是危險的警告標示，看到就要離它遠一點。"}]},{"id":"home1","title":"獨自在家的安全","emoji":"🏠","why":"有時候爸媽有事出門，你要自己在家一下下。學會幾個小方法保護自己，就算一個人也可以很安心。","consequence":"隨便幫不認識的人開門，可能讓壞人進到家裡；在電話裡說出「只有我一個人在家」，也可能被有心人利用。","how":["有人按門鈴時，先從貓眼或窗戶看一看；不認識就不要開門，可以說「爸媽在忙，現在不方便開門」","接到陌生電話問大人在不在，不要說「只有我一個人」，可以說「爸媽現在不方便接，等一下回你」","把爸媽的電話和 110（報警）、119（火災救護）寫下來，貼在看得到的地方，需要時打電話","覺得害怕或看到可疑的人，打電話給爸媽，或找信任的鄰居、大人幫忙","自己在家時不要用瓦斯爐煮東西、不玩火，也不碰危險的電器"],"quiz":[{"q":"自己在家時，有不認識的人按門鈴，最好怎麼做？","options":["馬上開門讓他進來","不認識就不開門，說爸媽在忙","請他進來坐著等","大聲說我一個人在家"],"answer":1,"explain":"遇到不認識的人就不要開門，這樣最安全。"},{"q":"陌生電話問你「家裡大人在不在」，怎麼回答比較安全？","options":["說只有我一個人在家","說爸媽現在不方便接，等一下回你","把家裡地址告訴他","約他過來一起玩"],"answer":1,"explain":"不要透露自己一個人在家，也不要給地址，才不會讓陌生人有機可乘。"},{"q":"一個人在家覺得害怕或看到可疑的人，可以怎麼辦？","options":["自己衝出去追他","打電話給爸媽或信任的大人，需要時打 110","把門打開看清楚","不管它，自己去玩火"],"answer":1,"explain":"遇到狀況要找大人幫忙，需要時打110報警，這是求助的正確方法。"}]}],"emergency":[{"id":"fire01","title":"火災逃生：壓低身體，快速離開","emoji":"🔥","why":"火災時最危險的其實不是火，而是濃煙。濃煙又熱又毒，會讓人看不清路、喘不過氣。學會正確逃生，就能在濃煙變濃之前安全離開。","consequence":"如果站著跑或躲進房間，很可能會吸到濃煙而頭暈、走不動；搭電梯時萬一停電，電梯會卡住把人關在裡面。冷靜照步驟做，就能大大提高安全離開的機會。","how":["聞到燒焦味或看到煙、聽到警報，先大聲喊「失火了」提醒身邊的人。","把身體壓低，用手或衣袖、濕毛巾摀住口鼻，因為乾淨的空氣在靠近地板的地方。","沿著牆壁摸著走向樓梯出口，絕對不要搭電梯。","開門前先用手背碰門把，如果門把很燙就換另一條路，不要開那扇門。","到屋外安全的地方（如空地、集合點）後，馬上請大人或自己打 119，並且不要再跑回去拿東西。"],"quiz":[{"q":"火災逃生時，身體應該怎麼移動最安全？","options":["站直快跑","壓低身體摀住口鼻前進","躲進棉被裡不要動"],"answer":1,"explain":"乾淨空氣在低處，壓低身體並摀住口鼻能減少吸入濃煙。"},{"q":"發生火災時，可以搭電梯下樓嗎？","options":["可以，比較快","不可以，要走樓梯","看電梯有沒有人"],"answer":1,"explain":"火災時電梯可能停電卡住，一定要走樓梯逃生。"},{"q":"安全逃到屋外後，接下來該做什麼？","options":["跑回去拿心愛的玩具","在門口看熱鬧","請大人或自己打119並待在安全的地方"],"answer":2,"explain":"人平安最重要，逃出後打119找消防隊幫忙，千萬別再回到火場裡。"}]},{"id":"quake01","title":"地震來了：趴下、掩護、穩住","emoji":"🌍","why":"地震時地面會搖晃，最容易受傷的原因是被掉下來的東西砸到，或跌倒撞到。學會「趴下、掩護、穩住」，就能在搖晃時保護自己最重要的頭和脖子。","consequence":"如果地震時慌張亂跑，可能會被搖晃絆倒，或被掉落的燈、書架、玻璃砸傷。躲在穩固的桌子下保護頭部，受傷的機會就會小很多。","how":["感覺到搖晃，立刻「趴下」，讓身體變低不容易跌倒。","躲到堅固的桌子底下「掩護」頭和脖子，如果附近沒有桌子，就蹲低用雙手護住頭，遠離窗戶、玻璃和會倒的高櫃。","抓住桌腳「穩住」，跟著桌子一起移動，等搖晃完全停止。","搖晃停止後，聽老師或大人的指示，沿著樓梯有秩序地慢慢走到戶外空曠處，不推擠、不搭電梯。","到安全空地後待在原地，等大人清點人數，不要自己亂跑。"],"quiz":[{"q":"地震開始搖晃時，正確的口訣是什麼？","options":["趴下、掩護、穩住","站好、看窗外、大叫","馬上衝出教室"],"answer":0,"explain":"趴下、掩護、穩住能保護頭部又不容易跌倒。"},{"q":"地震時應該躲在哪裡比較安全？","options":["窗戶旁邊看外面","堅固的桌子底下並護住頭","高高的書櫃旁"],"answer":1,"explain":"躲在桌子下能擋住掉落物，並要遠離窗戶和高櫃才更安全。"},{"q":"搖晃停止後要怎麼離開？","options":["搶第一個衝下樓","推開同學快跑","聽大人指示，有秩序走樓梯到空地"],"answer":2,"explain":"有秩序地走才不會跌倒或推擠受傷。"}]},{"id":"hurt01","title":"受傷了怎麼辦：流血與燙傷的簡單處理","emoji":"🩹","why":"跌倒、割到、被熱水燙到，都是生活中會遇到的小意外。學會幾個簡單又安全的處理方法，就能先照顧好自己，也能幫助身邊的人，同時知道什麼時候一定要找大人。","consequence":"如果傷口不處理或亂擦來路不明的東西，可能會更痛、更容易發炎；燙傷沒有馬上沖冷水，皮膚會傷得更嚴重。用對方法，傷口會好得比較快、比較不痛。","how":["流血時，先用乾淨的布或紗布蓋在傷口上，用手輕輕壓住幫助止血，並把受傷的地方稍微抬高。","燙傷時，趕快用流動的自來水沖傷口，至少沖 15 到 20 分鐘（沖到比較不痛），不要塗牙膏、醬油或藥膏。","不要用手去摳傷口，也不要弄破燙傷起的水泡。","處理完後告訴大人，讓大人幫你看看需不需要進一步照顧。","如果血流很多止不住、傷口很大、燙傷面積大或很痛，馬上找大人並打 119 請救護車幫忙。"],"quiz":[{"q":"被熱水燙到，第一件事應該做什麼？","options":["塗牙膏","用流動的冷水慢慢沖","趕快擦乾裝作沒事"],"answer":1,"explain":"燙傷時沖冷水能讓皮膚降溫、減少傷害；塗牙膏反而會弄髒傷口。"},{"q":"傷口在流血，怎麼做比較好？","options":["用乾淨的布壓住幫助止血","用髒手一直摸","用力擠壓讓血流更多"],"answer":0,"explain":"用乾淨的布輕壓能幫助止血，也能保持傷口乾淨。"},{"q":"遇到流血止不住或很嚴重的傷，最該做的是？","options":["自己想辦法處理不告訴別人","找大人並打119","先睡一覺再說"],"answer":1,"explain":"嚴重的傷要交給大人和專業救護人員，打119找幫手最安全。"}]},{"id":"call01","title":"如何求救：打對電話、說清楚","emoji":"📞","why":"遇到火災、有人受傷、或看到危險的事，打電話求救就能請大人和專業人員來幫忙。學會打哪支電話、怎麼把事情說清楚，別人才能很快趕到正確的地方。","consequence":"如果打錯電話或說不清楚地點，救護車或消防隊就會找不到你，幫忙就會慢很多。把「在哪裡、發生什麼事、有幾個人」講清楚，救援就能又快又準。","how":["記住三個號碼：報警找警察打 110；火災或有人受傷叫消防隊、救護車打 119。","手機如果顯示沒有訊號、緊急狀況打不出去，可以試著撥 112 求救。","電話接通後保持冷靜，慢慢說清楚這幾件事：我在哪裡（地址或明顯地標）、發生什麼事、現場有幾個人、有沒有人受傷。","說完後不要急著掛電話，聽對方的問題回答，等對方說可以掛了再掛。","如果現場有危險，一邊求救一邊移動到安全的地方等救援。"],"quiz":[{"q":"家裡失火或有人受傷要叫救護車，應該打幾號？","options":["110","119","104"],"answer":1,"explain":"119是找消防隊和救護車，110是報警找警察，兩者用途不同。"},{"q":"打電話求救時，最重要、要講清楚的是什麼？","options":["自己叫什麼名字就好","在哪裡、發生什麼事、有幾個人","先講今天天氣"],"answer":1,"explain":"說清楚地點和狀況，救援人員才找得到你、帶對裝備。"},{"q":"手機顯示沒訊號又很緊急時，可以試著撥哪個號碼？","options":["112","123","000"],"answer":0,"explain":"112是手機的緊急求救號碼，記住它在緊急時能幫上忙。"}]},{"id":"info01","title":"記住家人電話和住家地址","emoji":"🏠","why":"萬一走失、遇到意外，或大人一時聯絡不到，會背家人的電話和自己家的地址，就能請別人幫你找到家人、或讓救援人員知道要去哪裡。這是每個小朋友都能學會的重要本領。","consequence":"如果不記得地址和電話，走丟時就很難很快找到家人，救護車也可能找不到你家。把這些記在腦袋裡，需要的時候隨時都用得上，比寫在紙上更保險。","how":["請爸爸媽媽寫下家裡地址和至少一位家人的手機號碼，跟著大人多念幾次把它背起來。","可以把電話號碼編成一首小歌或口訣，會更好記，每隔幾天複習一次。","練習完整說出住家地址：從縣市、區、路名到幾號幾樓，越清楚越好。","如果走失了，先待在原地不要亂走，找穿制服的人（警察、店員、車站服務員）或帶著小孩的大人幫忙。","把背好的電話和地址說給幫忙的大人聽，請他們幫你聯絡家人。"],"quiz":[{"q":"為什麼要把家人的電話和住家地址背起來？","options":["為了考試加分","走失或遇到意外時能請人幫忙聯絡家人","沒有什麼用"],"answer":1,"explain":"記住這些資訊，緊急時就能很快聯絡到家人。"},{"q":"如果在外面和家人走散了，最好先怎麼做？","options":["自己到處亂跑找","待在原地，找警察或店員等可信的大人幫忙","跟著陌生人走"],"answer":1,"explain":"留在原地並找穿制服的人幫忙最安全。"}]}],"outdoor":[{"id":"cross01","title":"安全過馬路","emoji":"🚦","why":"馬路上有很多車子，車子開起來又快又重，沒辦法馬上停下來。過馬路是我們每天都會遇到的事，學會正確方法，就能安全到學校、回到家。","consequence":"如果沒有走斑馬線、沒有看清楚就衝出去，車子可能來不及停下來，就會撞到我們，讓自己受傷、也讓開車的人和家人很難過。追著球或寵物突然衝到馬路上，更是很危險的事。","how":["走到路口，先站在人行道或路邊，不要站在馬路上等。","看紅綠燈：綠燈亮才走，紅燈和黃燈都要停下來等。","過馬路前先看左邊，再看右邊，再看一次左邊，確定沒有車再走。","走斑馬線或天橋、地下道，不要從車子中間穿越。","球、玩具或帽子掉到馬路上，先找大人幫忙，絕對不要自己追過去。"],"quiz":[{"q":"綠燈亮了，準備過馬路，這時候最應該先做什麼？","options":["直接快跑衝過去","先看左右有沒有車，確定安全再走","低頭看手機邊走邊看","閉上眼睛快步走"],"answer":1,"explain":"就算是綠燈，也要先看左右確認沒有車再走。"},{"q":"你的球滾到了馬路中間，應該怎麼辦？","options":["馬上衝過去撿","請旁邊的大人幫忙，不要自己追","站在馬路中間等球停下來","叫朋友一起衝過去撿"],"answer":1,"explain":"球再買就有，但安全最重要；東西掉到馬路上要找大人幫忙，不要自己衝出去撿。"},{"q":"在路口等紅綠燈時，站在哪裡比較安全？","options":["站在馬路上靠近車子的地方","站在人行道或路邊，離車道遠一點","蹲在停著的車子後面","站在斑馬線正中間"],"answer":1,"explain":"站在人行道或路邊、離車子遠一點，轉彎的車才看得到你，也不會不小心碰到你。"}]},{"id":"ride01","title":"乘車安全好習慣","emoji":"🚗","why":"坐車去很多地方都很方便，但車子在跑的時候，如果突然煞車或轉彎，坐在裡面的人會往前衝。安全帶就像抱住我們的手，把我們穩穩留在座位上。","consequence":"沒有繫安全帶，遇到緊急煞車時身體會撞到前面的椅子或玻璃而受傷。把頭或手伸出窗外，可能會被旁邊經過的車子或路邊的東西撞到，很危險。","how":["上車後先坐好，把安全帶拉過來扣好，聽到「喀」一聲才算扣好。","手和頭都放在車子裡面，不要伸出窗外或天窗外。","車子在跑的時候坐好，不要站起來、不要在車上跑跳打鬧。","下車前先看看車門旁邊和後面有沒有機車或腳踏車經過，確認安全再開門下車。","盡量從靠人行道那一側的門下車，比較安全。"],"quiz":[{"q":"一上車坐好，第一件要做的事是什麼？","options":["把窗戶打開把頭伸出去","扣好安全帶","在座位上跳來跳去","把腳翹到前面椅子上"],"answer":1,"explain":"扣好安全帶是坐車最重要的第一步，它會在緊急時保護你。"},{"q":"車子正在馬路上開的時候，下面哪個做法最安全？","options":["把手伸出窗外吹風","站起來看外面的風景","坐好並繫著安全帶","在後座跟弟弟妹妹追打"],"answer":2,"explain":"坐好、繫好安全帶，車子突然停下來時才不會受傷。"},{"q":"車子停好要下車了，開門前應該怎麼做？","options":["用力把門一次推開","先看後面有沒有機車或腳踏車，再慢慢開門","閉著眼睛開門","把門開一半就跳下去"],"answer":1,"explain":"下車開門前先看後方，才不會撞到經過的機車或腳踏車。"}]},{"id":"water01","title":"玩水的安全","emoji":"🌊","why":"水很好玩，但水裡面看不清楚深淺，也很容易滑倒。就算是很淺的水，站不穩跌倒也可能嗆到水。所以玩水一定要有大人在旁邊看著。","consequence":"自己一個人靠近水邊、或不會游泳卻下水，很容易滑倒或沉下去、嗆到水而發生溺水。看到別人溺水時，如果自己跳下去救，常常會連自己也被拉下水，反而更危險。","how":["去河邊、海邊、游泳池，一定要有大人陪，不可以自己一個人靠近水邊。","還不會游泳的時候不要下水；游泳時要穿好合身的救生衣或戴浮具。","如果不小心滑進水裡，記得放輕鬆、頭往後仰讓臉浮出水面（仰漂），身體盡量放鬆、不要亂揮手亂踢（會失去平衡沉下去），保持浮著、省力氣，大聲喊「救命」等大人來救。","看到別人溺水，不要自己跳下去救，要大聲喊大人來，並打119。","可以把身邊漂得起來的東西（像救生圈、寶特瓶、長棍子）遞給溺水的人，自己站穩在岸上不要被拉下水。"],"quiz":[{"q":"你和同學到河邊，發現旁邊沒有大人，這時候應該怎麼做？","options":["自己先下水玩一下","不要靠近水邊，等有大人陪同才可以","站在很滑的石頭上比賽","把腳伸進深水裡試試看"],"answer":1,"explain":"沒有大人在旁邊時，就不要靠近水邊。"},{"q":"看到有人在水裡大喊救命，你應該怎麼做？","options":["馬上跳下水去把他拉上來","大聲喊大人來幫忙，並打119","自己一個人想辦法游過去","假裝沒看到走開"],"answer":1,"explain":"自己跳下去救人很可能會被一起拉下水；喊大人、打119才是能救人又保護自己的方法。"},{"q":"如果你不小心滑進水裡，下面哪個做法比較好？","options":["用力拚命亂揮亂踢","放輕鬆、頭往後仰讓臉浮起來，大聲呼救","把頭往水裡鑽","什麼都不做等它自己好"],"answer":1,"explain":"放輕鬆、讓臉浮出水面呼吸，再大聲呼救，能撐到大人來救你。"}]},{"id":"outdoor01","title":"山林戶外不迷路","emoji":"⛰️","why":"去爬山、郊遊、公園玩很開心，可以看到很多動物和植物。但山上路很多、樹又很密，一不小心就會和大人走散、找不到路，所以要跟緊大人、先讓家人知道我們去哪裡。","consequence":"如果離開隊伍自己亂跑，可能會迷路、找不到人，天黑或下雨時會又冷又害怕。隨便採來吃的野果、野菇，有些是有毒的，吃了會肚子痛、生病。","how":["出門前告訴家人要去哪裡、大概什麼時候回來。","走在大人看得到的地方，不要自己跑到前面或落在後面太遠。","走有標示的步道，不要自己鑽進沒有路的樹叢或草叢。","路邊的野果、野花、野菇不亂採也不亂吃，好奇可以問大人。","萬一和大人走散了，就待在原地不要亂走，大聲呼喊，等大人來找你。"],"quiz":[{"q":"爬山的時候，走在哪裡最安全？","options":["自己跑到隊伍最前面探險","走在大人看得到、跟得上的地方","落在最後面慢慢晃","自己鑽進旁邊的樹叢找捷徑"],"answer":1,"explain":"跟緊大人、走在大人看得到的地方，就不容易走散。"},{"q":"在山上看到紅紅的野果，看起來很好吃，該怎麼辦？","options":["摘下來馬上吃吃看","不亂採也不亂吃，想知道就問大人","帶回家種","分給同學一起吃"],"answer":1,"explain":"有些野果、野菇有毒，光看外表看不出來；不亂吃、先問大人才安全。"},{"q":"如果不小心和大人走散了，最好怎麼做？","options":["自己一直往前走找路","待在原地大聲呼喊，等大人來找","躲起來不出聲","跑去更遠的地方找"],"answer":1,"explain":"走散時待在原地呼救，大人比較容易找到你。"}]},{"id":"weather01","title":"颱風打雷怎麼辦","emoji":"⛈️","why":"台灣夏天常常有颱風和雷陣雨。颱風來的時候風很大、雨很急，海邊和河邊的水會突然變大變快；打雷的時候，電會打到最高、最空曠的地方，這些都要小心避開。","consequence":"颱風天跑去海邊、河邊看大浪，可能被大浪或暴漲的溪水捲走。打雷時待在空曠的地方或躲在大樹下，可能會被雷電打到而受傷，非常危險。","how":["颱風來的時候待在家裡，絕對不要去海邊、河邊、山上看風浪或玩水。","把颱風假當成在家的安全時間，關好門窗，聽爸媽和氣象的提醒。","打雷時趕快進到室內或車子裡，不要待在空曠的操場、田野。","打雷時不要躲在大樹下，也遠離電線桿、金屬欄杆和高高的東西。","在室外聽到打雷，不要停下來，繼續往最近的室內或硬頂汽車移動；遠離大樹、電線桿、金屬欄杆和空曠的地方，盡快找到室內躲起來最安全。"],"quiz":[{"q":"颱風正在來，下面哪件事最不可以做？","options":["待在家裡關好門窗","跑去海邊看大浪","聽爸媽和氣象的提醒","在家裡看書、玩遊戲"],"answer":1,"explain":"颱風天的海邊和河邊最危險，大浪和溪水會突然暴漲，待在家裡才安全。"},{"q":"在外面玩的時候開始打雷了，最好躲到哪裡？","options":["躲到大樹下面","趕快進到室內或車子裡","站在空曠的操場中間","抓住旁邊的金屬欄杆"],"answer":1,"explain":"打雷時進到室內或車子裡最安全，大樹下和空曠的地方反而危險。"}]}],"communication":[{"id":"cm01readroom","title":"讀情緒、讀空氣：看臉色、聽語氣、感覺氣氛","emoji":"🧐","why":"每個人心裡的感覺，常常不會直接說出口，而是藏在臉上的表情、說話的語氣、身體的動作，還有整個場合的氣氛裡。學會「察言觀色」，就像多了一雙看得懂心情的眼睛：你會知道朋友今天是開心還是難過、老師現在方便不方便被打擾、這句玩笑話現在說出口是好笑還是會傷人。這不是要你變得小心翼翼、討好每一個人，而是讓你更體貼、更會挑時機，也更能保護自己和別人的心情。懂得讀空氣的人，別人會覺得「和你相處很舒服，你懂我」，你們的關係也會更靠近、更信任彼此。","consequence":"如果完全不看臉色、不聽語氣，可能會在別人正難過或生氣的時候，還一直開玩笑、講不相干的事，讓對方覺得「你根本不在乎我」，友情就出現裂痕。也可能在很嚴肅的場合（例如有人正在哭、大人正在忙著處理要緊的事）講錯話，讓場面變得尷尬，自己也被誤會成白目或沒禮貌。久了，別人可能會不太想跟你分享心事。這些都不是因為你是壞孩子，只是還沒練習過怎麼讀懂這些訊號而已——而它是可以練的。","how":["看臉：注意對方的眉毛、嘴角和眼睛。眉頭皺、嘴角往下、眼神往下看或發紅，通常是難過或生氣；笑到眼睛也彎起來，才是真的開心。","聽語氣：同樣一句「還好啊」，用輕快的聲音說是真的沒事，用很小聲、慢慢的、或很衝的語氣說，往往代表其實有事。多聽聲音的高低快慢，不要只聽字面。","看身體：對方把身體轉開、雙手抱胸、低著頭、離你遠遠的，可能是不想講話或心情不好；靠過來、面對你、點頭，則是願意聊。","感覺整個場合的氣氛：先安靜觀察三秒鐘——大家是在笑鬧，還是突然變安靜？如果氣氛沉重，就先別大聲說笑或提無關的事。","不確定就溫柔地問，用關心代替猜測：可以說「你看起來有點累，還好嗎？」「現在方便聊一下嗎？」把選擇權留給對方。","讀懂之後要行動：如果朋友難過，就少說多陪，遞張衛生紙、安靜坐在旁邊；如果大人在忙，就先等一下或說「我等你有空再說」。"],"quiz":[{"q":"下課時你想跟好朋友分享一個超好笑的影片，走近才發現他紅著眼睛、低著頭、把身體轉向窗外。這時候最體貼的做法是？","options":["先輕聲問他「你還好嗎？需要我陪你嗎？」，把好笑的影片留到他心情好一點再說","趕快把影片打開放給他看，讓他笑一笑就沒事了","大聲說「你幹嘛哭啦，有什麼好哭的」，想讓氣氛輕鬆一點"],"answer":0,"explain":"紅眼睛、低頭、身體轉開，都是「我現在很難過」的訊號。讀懂之後，最好的行動是先關心、先陪伴，而不是急著逗他笑或評論他的情緒。硬要放影片或說「有什麼好哭的」，會讓對方覺得不被理解。溫柔地問一句、把玩笑往後放，就是會讀空氣又貼心的表現。"},{"q":"你有件開心的事想馬上告訴老師，但走到辦公室門口，看到老師眉頭皺著、正低頭很快地講電話、手邊一堆文件。你應該？","options":["站在門口一直喊「老師老師老師」，直到她理你","先觀察一下，等老師講完、比較有空的時候再說，或先問「老師，現在方便嗎？我等一下再來也可以」","反正我的事很開心，直接衝進去打斷她講電話"],"answer":1,"explain":"皺眉、講電話、忙著處理文件，都是「我現在很忙、不方便」的訊號。讀懂場合的氣氛，就會知道這不是說話的好時機。挑對時機、先問一句「現在方便嗎」，不但有禮貌，你的好消息也會被好好聽見。一直打斷或硬闖，反而會讓老師分心或不高興。"},{"q":"同學們本來在教室裡笑鬧，突然全部安靜下來，有個同學紅著臉快哭了，旁邊氣氛變得很僵。你剛走進來還不知道發生什麼事，最好的第一步是？","options":["馬上大聲問「怎麼了怎麼了？誰欺負誰？快跟我說」","先安靜地觀察一下氣氛，感覺不對就先別起鬨，必要時去關心那位快哭的同學或告訴老師","覺得無聊，開始講自己的笑話想炒熱氣氛"],"answer":1,"explain":"從「突然安靜」和「有人快哭了」可以讀出：這裡剛發生了不好的事，氣氛很緊繃。這時候先安靜觀察、不起鬨、不硬要炒熱氣氛，才不會火上加油。讀懂空氣之後，正確的行動是關心受傷的同學，或在情況嚴重時告訴老師，而不是追問八卦或講笑話。"}]},{"id":"cm05malice","title":"感覺不對就要保護自己：察覺惡意與危險訊號","emoji":"🚦","why":"我們的身體很聰明，遇到不安全的人或情況時，常會先發出警訊：心跳變快、胃緊緊的、起雞皮疙瘩，或心裡冒出一句「怪怪的、我不喜歡這樣、我想離開」。這種直覺是老天給我們的保護鈴，值得你認真對待。學會相信這種「怪怪的感覺」，並知道怎麼拉開距離、去安全的地方、找可信的大人，能在真的有危險時保護你自己。要記得：世界上大部分的人都是善良的，學這個不是要你害怕每一個人、疑神疑鬼，而是讓你在少數不對勁的時候，有勇氣也有方法照顧好自己。","consequence":"如果我們習慣忽略「怪怪的感覺」，一直告訴自己「應該是我想太多」「不好意思拒絕人家」，就可能在不安全的情況裡待太久，或跟著讓自己不舒服的人走。有時候壞事就是這樣發生的：不是因為孩子做錯什麼，而是因為沒有人教過他「感覺不對可以馬上離開、可以大聲拒絕、可以求助」。相反地，如果因此變得太多疑、把每個陌生人都當壞人，也會讓自己活得很緊張、失去很多善意和幫助。所以我們要練的是「剛剛好」——相信直覺，也相信善良。","how":["把直覺當警鈴：只要心裡出現「怪怪的、不舒服、害怕、不想跟他走」，就先相信它。你不需要跟自己吵架，也不用先找到「證據」，感覺不對就有權利保護自己。","拉開距離、往人多的地方走：離開讓你不安的人，走向店員、警衛、老師、櫃台、或人多明亮的地方。安全永遠比「怕失禮、怕尷尬」更重要。","練好可以照抄的拒絕句：對方要你保守祕密、要你單獨跟他走、給你東西或碰你讓你不舒服時，你可以堅定地說「不要，我要去找我媽媽（老師）」「我不跟你走」，然後馬上離開。","認得危險訊號：大人卻一直要小孩幫忙（找小狗、搬東西）、要你別告訴爸媽、給你不該有的禮物或錢、想帶你去只有你們兩個的地方、或一直靠太近讓你不舒服——這些都要提高警覺。","馬上告訴可信的大人：回到家或到學校，把「剛剛有件事讓我怪怪的」完整說給爸媽、老師或輔導老師聽。就算你不確定，講出來永遠是對的，好大人不會怪你。","記住緊急求助方式：真的害怕或遇到立即危險時打 110 報警；自己受到傷害、或看到別人被傷害，可打 113 保護專線；如果心情很糟、很難過，或想幫助有這種心情的朋友，可以打 1925 安心專線（24 小時、免費）。同時提醒自己：大多數人是善良的，願意在你求助時幫你。"],"quiz":[{"q":"放學路上，一個不認識的大人開車靠過來，笑著說：「小朋友，我家的小狗跑不見了，你人這麼好，上車幫我一起找好不好？」你心裡覺得怪怪的。這時候你該？","options":["他看起來很和善又有禮貌，上車幫忙找小狗才是好孩子","相信自己「怪怪的」感覺，說「不要」然後馬上往人多的地方走，回家告訴爸媽這件事","先站在原地跟他聊一聊，問清楚小狗長什麼樣子再決定"],"answer":1,"explain":"「不認識的大人要小孩單獨跟他走、上他的車」是很明確的危險訊號，就算他笑得很和善也一樣——真正需要幫忙的大人會去找其他大人或警察，不會找小孩上車。你心裡的「怪怪的」就是保護鈴。正確做法是堅定拒絕、往人多的地方走、並告訴爸媽。留在原地聊天會給對方接近你的機會。"},{"q":"一位你認識的長輩對你很好，但最近他給你錢和禮物，還悄悄說：「這是我們兩個的祕密，不可以告訴爸媽喔。」你覺得心裡毛毛的、不太舒服。最好的做法是？","options":["因為是熟人又對我好，就照他說的保守祕密，不然會對不起他","把心裡毛毛的感覺當一回事，找機會把「他要我保守祕密」這件事告訴爸媽或信任的老師","自己一個人偷偷煩惱，反正說不定是我想太多"],"answer":1,"explain":"「要你保守祕密、不能告訴爸媽」是很重要的危險訊號，就算對方是認識的人、平常對你很好也一樣。真正對你好的大人，不會要求你對爸媽隱瞞。你心裡「毛毛的」就是在提醒你。正確做法是相信直覺、把這件事告訴可信的大人；一個人悶著或替他保守這種祕密，反而讓自己陷入危險。"},{"q":"你的好朋友偷偷跟你說：「我最近好難過，有時候覺得活著沒意思，很想消失……但你千萬不要告訴任何人喔。」你聽了也很擔心。你應該怎麼做？","options":["答應幫他保守這個祕密，自己一個人陪他、鼓勵他就好","先好好陪著他、告訴他「你不是一個人，我很在乎你」，然後一定要趕快把這件事告訴可信任的大人（爸媽、老師或輔導老師）","覺得他只是想太多，叫他不要亂想就沒事了"],"answer":1,"explain":"當朋友說出「想消失、活著沒意思」這種話，代表他真的很痛苦，需要專業的大人一起幫忙——這是唯一「不能替他保守的祕密」。正確做法是先溫柔陪伴、讓他知道他不孤單，然後盡快告訴信任的大人，也可以請他或陪他打 1925 安心專線（24 小時、免費）。這種難受的感覺會過去，而告訴大人不是背叛，是真正在救他。叫他「不要亂想」或自己一個人扛，都幫不了他。"}]},{"id":"cm02speakkind","title":"好好說話：把指責換成「我訊息」","emoji":"💬","why":"當我們生氣或委屈時，很容易脫口說出「你很爛」「你白痴」「都是你害的」這種指責的話。這種話叫做「你訊息」，它像一根手指直直指向對方，對方聽了會覺得被攻擊，第一個反應通常不是道歉，而是反擊或關上心門，於是小事變成吵架。「我訊息」不一樣：它是說出『發生了什麼事、我有什麼感覺、我希望怎麼樣』，把焦點放在自己的感受和需要，而不是罵對方是什麼樣的人。這樣對方比較聽得進去，你也真的有機會把問題解決，而不是只是把氣出在別人身上。學會好好說話，是你這輩子最好用的能力之一，在家裡、學校、以後工作都用得到。","consequence":"如果一生氣就用指責的話，久了會發生幾件事：朋友覺得跟你相處很緊張、不敢跟你說真心話，慢慢就疏遠了；家人之間也常常因為一句衝口而出的話大吵。更可惜的是，你其實只是想被理解、想解決一件事，卻因為說話的方式，讓對方只記得你兇他，忘了你原本在意什麼。你會覺得「我明明有道理，為什麼沒人聽我的」，其實不是道理的問題，是包裝的方式讓人聽不下去。","how":["用四步驟造句：①觀察（發生了什麼，只講事實不評價）→②感受（我覺得…）→③需要（因為我希望／我需要…）→④請求（可以請你…嗎）。例：『你借的書一直沒還（事實），我有點著急（感受），因為我明天要用（需要），可以明天先還我嗎（請求）？』","把「你」開頭的指責，改成「我」開頭的感受。例：不說『你很自私』，改說『我剛剛沒被問到意見，覺得有點難過』；不說『你白痴喔』，改說『我覺得這樣做可能會有問題，我們要不要再想一下？』","描述『行為』而不是『貼標籤』。不說『你就是個懶惰的人』，改說『這次的分工你還沒做完，我有點擔心來不及』——講具體那件事，對方才知道怎麼改，也比較不會覺得整個人被否定。","先深呼吸三秒再開口。很生氣的當下，先在心裡默數 1、2、3，或先喝口水，等最衝的那股氣過去，再用「我訊息」說。話一旦出口收不回，慢一點沒關係。","說完自己的感受後，記得也問對方：『那你的想法呢？』好好說話是雙向的，不是你講完就結束，聽對方說也一樣重要。","如果真的太氣講不好，可以先說『我現在有點生氣，我需要一點時間，等一下再跟你說』，然後暫時離開，冷靜後再回來談。這不是逃避，是負責任的做法。"],"quiz":[{"q":"同學不小心弄倒了你的水壺，桌上的作業濕了一角。你很懊惱，下面哪一句最符合「我訊息」，最可能好好把事情解決？","options":["「我的作業濕掉了，我有點難過，可以請你幫我一起把它擦乾、跟老師說明一下嗎？」","「你走路不長眼睛喔！每次都是你！」","「你白痴嗎？連個水壺都會撞倒！」"],"answer":0,"explain":"第一句先講事實（作業濕了）、說出自己的感受（有點難過），再提出具體的請求（一起擦乾、跟老師說明），對方聽了願意幫忙，事情就解決了。後兩句都是「你訊息」的指責和罵人，只會讓對方生氣反駁，作業一樣濕，還多了一場吵架。"},{"q":"哥哥又拿了你正在玩的遊戲手把，你很不開心。用「我訊息」的四步驟，下面哪一句最完整？","options":["「你每次都這樣，超級討厭！」","「你敢再拿一次試試看！」","「你沒問我就拿走手把（事實），我覺得有點生氣、也有點難過（感受），因為那時我正在玩（需要），下次可以先問我一聲嗎（請求）？」"],"answer":2,"explain":"第三句完整走過事實、感受、需要、請求四步驟：注意感受講的是自己的心情（生氣、難過），而不是罵哥哥「不尊重我」——把焦點放在自己身上，哥哥比較聽得懂也願意改。第一句是貼標籤（把哥哥講成討厭鬼），第二句是威脅，兩者都只會讓衝突升高。"}]},{"id":"cm03sharpwords","title":"一句話的力量：哪些話會刺傷、激怒別人","emoji":"🗯️","why":"話語看不見、摸不到，卻真的有力量。同樣一件事，換個說法，可能讓人願意合作，也可能讓人瞬間爆炸。有些話特別容易點燃衝突：嘲笑別人的外表或身材、揭人家的瘡疤（最在意、最痛的地方）、詛咒別人（例如叫人去死）、翻舊帳（把很久以前的事一直拿出來講）、還有當眾羞辱（在很多人面前讓對方丟臉）。這些話之所以殺傷力大，是因為它們攻擊的是一個人的『自尊』，人一旦覺得尊嚴受威脅，理智會先關機、情緒先上來，於是原本可以講清楚的事，變成推擠、打架，甚至更嚴重。認得出這些「地雷話」，你就能在快說出口前踩剎車，也能在別人對你說時，選擇不被點燃。","consequence":"一句刺傷人的話，可能換來一輩子的裂痕。被嘲笑外表的同學，可能好多年都不敢照鏡子、不敢在人前說話；被當眾羞辱的人，會記得那個丟臉的場面很久很久。對說話的人來說也很虧：你可能只是一時嘴快、覺得好玩，卻被貼上「講話很毒」「很白目」的標籤，朋友慢慢不敢靠近你。更危險的是，激怒別人有時會引來當下的肢體衝突——有些打架、鬥毆，起因只是「他說了一句我最不能忍的話」。話一出口就收不回，傷害卻會一直留著。","how":["開口前先過一個濾網，自問三件事：這句話是真的嗎？是善意的嗎？是必要的嗎？如果三個有一個是「不」，就先別說。","避開五大地雷：不嘲笑外表身材（如胖、醜、矮）、不揭人瘡疤（對方最在意或最傷心的事）、不詛咒（如『你去死』『你全家…』）、不翻舊帳（『你上次還不是…』）、不當眾羞辱（有意見私下講，別在眾人面前讓人下不了台）。","把「攻擊人」的話換成「講事情」的話。不說『你這個豬頭』，改說『這裡我覺得怪怪的，我們再看一次』；不說『你很煩耶』，改說『我現在需要安靜一下』。","想稱讚就當眾說，要提醒就私下說。表揚在眾人面前會加倍開心；但如果對方做錯了，把他拉到旁邊小聲說，保住他的面子，他更願意改。","當別人對你說地雷話、想激你時，記住『不接招就不會打起來』。可以平靜地說『我不想這樣講話』然後走開，或去找老師。他罵你難聽的話，不代表你就是那樣的人。","如果不小心說出了傷人的話，越快真誠道歉越好：『我剛剛那句話講得太重了，對不起，我不是那個意思。』收回不了話，但可以修補關係。"],"quiz":[{"q":"分組報告時，一個同學上台講得有點結巴。你覺得他準備不夠。下面哪個反應最不會刺傷人、又能幫到他？","options":["當場笑他：「講成這樣還敢上台，好好笑喔！」","報告後私下跟他說：「我覺得你有些地方很緊張，需要的話我可以陪你多練幾次。」","在全班面前大聲說：「你根本沒準備吧？拖累我們這組！」"],"answer":1,"explain":"正解是私下、對事、帶著幫忙的態度說出來，既保住他的面子，又真的可能讓下次更好。選項一是當眾嘲笑，選項三是當眾羞辱、不留情面的指責，都會深深刺傷人，也讓整組氣氛破裂——就算你講的是事實，用羞辱的方式講，別人只會記得被你羞辱。"},{"q":"有人為了激怒你，故意大聲說你「醜八怪、沒人要」。這時最安全、最聰明的做法是？","options":["馬上回嗆更難聽的話，罵回去讓他閉嘴。","衝上去推他，讓他知道不能這樣講你。","平靜地說「我不想這樣講話」，然後走開，去找老師或可信任的大人。"],"answer":2,"explain":"對方就是想點燃你、看你失控。你回嗆或動手，正中他下懷，還可能演變成打架、兩邊都受傷受罰。正解是「不接招」：不被那句話定義（他說你醜不代表你醜），平靜離開、找大人處理，才是真正保護自己、也讓事情不擴大的做法。"}]},{"id":"cm10online","title":"螢幕背後也是人：網路溝通與言語霸凌","emoji":"📱","why":"在網路上打字聊天、留言、傳貼圖，看起來很輕鬆，但有兩件事很容易讓人忘記：第一，螢幕另一頭是一個『真的人』，會痛、會難過，跟你面對面時一模一樣；第二，文字看不到表情、聽不到語氣，很容易被誤會——你覺得是開玩笑，對方讀起來卻像被罵。而且網路有兩個放大器：訊息會被截圖、被轉傳，傳得又快又遠，收也收不回來；還有『跟風』，一個人開頭嘲笑，很多人就一起留言，被笑的人會覺得全世界都在攻擊他。學會在螢幕背後也把對方當人看，是這個時代最重要的溝通能力。","consequence":"網路上的言語霸凌，傷害常常比面對面更重。被公開嘲笑、被建群組排擠、被到處轉傳難聽的話，那個人可能整晚睡不著、不敢去上學，覺得無處可躲——因為手機一打開，那些話又都在。長期被這樣對待，有些人會變得非常憂鬱、非常痛苦。對加害的一方也一樣有代價：網路留言都留有紀錄，截圖跑不掉，嚴重的言語霸凌可能要負法律責任，也會被學校處理；就算只是「跟著一起笑」的旁觀者，其實也是在幫忙傷害別人。一句隨手打的話，可能造成你完全想不到的後果。","how":["送出前先讀一遍，並問自己：「這句話如果是當面講、或被老師和爸媽看到，我還說得出口嗎？」如果會不好意思，就別送出。","怕被誤會時，善用能表達語氣的方式，例如加上表情符號、或直接說明『我是開玩笑的喔』；重要或容易誤會的事，寧可打電話、或見面再談，不要只靠文字猜來猜去。","絕不加入嘲笑、公審、起鬨。看到別人被圍剿，不按讚、不轉傳、不留言跟風就是幫忙；有能力的話，私下傳個訊息關心被笑的同學：『我看到了，你還好嗎？』","如果你被言語霸凌：①先『截圖／存證』留下對話和時間，②『封鎖』對方、退出讓你難受的群組，③一定要『告訴信任的大人』（爸媽、老師、輔導老師）。這不是告狀，是保護自己，你不需要一個人扛。如果你長期很難過、晚上睡不著，除了告訴身邊的大人，台灣也有24小時免費的『安心專線1925』可以打，隨時有人願意聽你說。","記住『被罵的話不等於事實』。有人在網路上說你很難聽的話，那是他的問題，不是你的價值；不要把那些字當成真的在描述你。","檢查自己有沒有不小心當了加害者：轉傳過別人的糗照嗎？在群組裡跟著虧過某個同學嗎？如果有，停下來、刪掉、需要的話道歉——當個讓網路更友善的人。"],"quiz":[{"q":"班上群組裡，有人開始貼某個同學的糗照，一堆人跟著留言嘲笑。你看到了，最好的做法是？","options":["跟著留一句好笑的話，大家都在玩，不參加好像很掃興。","不跟風留言，並私下傳訊息關心那個被笑的同學，如果情況嚴重就告訴老師。","當作沒看到，滑過去就好，反正又不是在笑我。"],"answer":1,"explain":"正解是「不當幫兇，還主動關心」。跟風留言（選項一）等於一起傷害人；假裝沒看到（選項三）雖然沒動手，但被笑的同學會覺得沒有人站在他這邊。真正有力量的做法，是不加入嘲笑、私下關心對方，情況嚴重時讓大人介入。"},{"q":"有陌生帳號連續傳很難聽、羞辱你的訊息，你越看越難過。下面哪個順序最能保護自己？","options":["回傳更兇的話罵回去，證明自己不好惹。","先截圖存證，再封鎖對方，然後把事情告訴爸媽或老師。","自己默默刪掉訊息、假裝沒事，誰都不說。"],"answer":1,"explain":"正解是「存證→封鎖→告訴大人」：截圖留下證據方便日後處理，封鎖能立刻停止傷害，告訴信任的大人代表你不用一個人承受。回罵（選項一）可能讓對方變本加厲、也可能反而害到自己；默默刪掉不說（選項三）會讓你孤單地扛著痛苦，而且沒了證據。被這樣對待不是你的錯，開口求助是勇敢又聰明的事。"}]},{"id":"cm04deescalate","title":"被激怒時：先暫停，不動手","emoji":"✋","why":"人被激怒的時候，身體會先反應：心跳變快、臉發熱、拳頭握緊，這時候大腦裡負責「衝動」的部分會蓋過負責「思考」的部分，很多話和動作會在幾秒內衝出來，事後才後悔。學會在最生氣的那幾秒先按下暫停鍵，是保護自己也保護別人的重要能力。它不是懦弱、不是輸，而是你有能力當自己情緒的主人，而不是被一句難聽的話牽著走。真正厲害的人，是能在最想爆炸的時候，選擇不爆炸的人。","consequence":"如果一被激怒就馬上回嘴、推人或動手，事情很容易像滾雪球一樣越滾越大：一句嗆聲換來一句更難聽的，一個推撞換來一拳，本來只是小摩擦，最後變成打架、有人受傷、被老師處罰、家長被叫到學校，甚至傷了原本還算不錯的同學關係。動手的人常常也會被處罰，就算你覺得「是他先開始的」，一旦你出手，你也變成衝突的一部分，很難再說得清楚。更重要的是，衝動下說出口的狠話，可能會在對方心裡留下很久的傷。","how":["按下身體的暫停鍵：先深呼吸三次，慢慢吸氣數到四、慢慢吐氣數到四，或在心裡從一數到十，讓那股最衝的怒氣先降下來，再決定要不要開口。","先離開現場：跟自己說「我需要離開一下」，走去別的地方，例如走廊、洗手間、或老師辦公室附近。走開不是逃跑，是不給衝突繼續長大的機會。","用『我』開頭說話，不要用『你』攻擊：把「你很白目欸！」換成「我現在很生氣，我需要冷靜一下再談。」把「你很煩耶，走開啦！」換成「我不喜歡這樣，請你停下來。」","不接對方的挑釁：對方越想讓你抓狂，你越可以平平地說「我不想吵」然後轉身。你不回應，這場架就吵不起來。","事後找大人幫忙處理：等雙方都冷靜了，把事情告訴老師或家長，請大人一起釐清、和解，而不是自己私下報復。","如果對方越靠越近、開始動手，或你覺得會受傷，立刻大聲求救並跑向人多、有大人的地方，安全永遠比面子重要。"],"quiz":[{"q":"下課時，同學故意撞你一下還笑著說「怎樣，不爽喔？」你覺得火氣一下衝上來。這時候最好的做法是？","options":["馬上推回去，還罵他一句，讓他知道你不好惹","先深呼吸、在心裡數到十，然後走開去找老師說明情況","忍著什麼都不做，也不告訴任何人，回家再偷偷生氣","糾集其他同學，下課後一起堵他討回來"],"answer":1,"explain":"最想動手的那幾秒，正是最需要暫停的時候。深呼吸、數到十讓怒氣降下來，再走開並告訴大人，事情就不會升級成打架，你也保護了自己。推回去或找人堵他，都會讓小摩擦變成大衝突，動手的人自己也會被處罰；而全部憋著不說，情緒沒有出口，也不是好辦法——把事情交給大人幫忙處理才安全。"},{"q":"你正在很生氣的時候，下面哪一句話最能幫助你降溫、又不會激怒對方？","options":["「你最好給我小心一點！」","「我現在很生氣，我需要先冷靜一下，等一下再談。」","「你這種人根本沒救了。」","「有種你就再說一次試試看。」"],"answer":1,"explain":"用『我』開頭、說出自己的感覺和需要（我很生氣、我需要冷靜），既誠實表達了情緒，又沒有攻擊對方，能讓場面降溫。另外三句都是威脅或人身攻擊，只會把對方也激怒，讓衝突越演越烈。學會這種『我覺得…我需要…』的句型，是化解衝突很好用的工具。"}]},{"id":"cm11outburst","title":"同學情緒爆發時，怎麼保護自己又不傷害他","emoji":"🫂","why":"有時候班上同學會突然很生氣、很激動，控制不住自己，可能會大叫、推人，或把桌上的東西丟出去。這通常不是因為他是「壞小孩」，而是他心裡太難受、或身體本來就比較不容易調節情緒（有時候是因為心裡或身體不太舒服）。這一課要教你兩件同樣重要的事：第一，先把自己和身邊的人保護好；第二，用同理、不歧視的眼光看待這位同學，把幫助他的工作交給老師和專業的大人。","consequence":"如果你選擇留在原地圍觀、錄影、嗆聲，或想自己衝上去把他制止、跟他講道理，很可能被丟出來的東西打到頭或眼睛而受傷，也會讓他更激動、情況更難收拾。反過來，如果沒有人趕快去找老師，現場就少了真正能幫忙的大人，大家都會更危險。學會「先拉開距離、護住頭臉、馬上找大人」，是保護全班（包括那位同學）最聰明的做法。","how":["先離開危險範圍：往後退，離開他伸手推得到、東西丟得到的地方，不要正對著他站著。","護住頭和臉：用手臂彎起來擋在額頭和眼睛前面，低頭、縮小身體，躲到桌子底下或門後面等擋得住的地方。","馬上找大人：大聲喊「老師快來！」，或請離門最近的同學立刻去辦公室、隔壁班找老師來——這是保護大家，不是打小報告。","提醒別人一起退：小聲又清楚地告訴身邊同學「先退到後面」，並把剛走進教室、還不知道發生什麼事的人擋在門外，別讓他們走進危險區。","當下不要刺激他：不要圍觀、不要錄影、不要嘲笑或嗆聲，也不要跟他爭辯或講道理，安靜地保持距離，等大人來處理。","事後照顧自己：如果被嚇到、心裡不舒服，記得告訴老師、輔導老師或爸媽，也可以問問那位同學後來有沒有好一點，讓他知道大家沒有討厭他。"],"quiz":[{"q":"上課時，坐你前面的同學突然大叫，開始把桌上的鉛筆盒、課本往外丟。這時候你第一件該做的事是什麼？","options":["趕快往後退開，離開東西丟得到的範圍，用手臂護住頭和臉","站起來走過去，抓住他的手叫他不要丟","拿出手機把他丟東西的樣子錄下來"],"answer":0,"explain":"人身安全第一。先拉開距離、護住頭臉（尤其眼睛），才不會被丟出來的東西打到。自己上前制止很危險，錄影則會讓他更激動，都不該做。"},{"q":"情況有點嚴重，需要大人來幫忙。你覺得下面哪個想法是對的？","options":["去找老師就是告狀、打小報告，會害到那位同學，所以先忍著不要說","趕快請人去找老師，是為了保護全班和那位同學的安全，應該馬上做","等他自己冷靜下來就好，不用麻煩老師"],"answer":1,"explain":"快找老師不是打小報告，而是讓真正能幫忙的大人到場，保護包括那位同學在內的每一個人。這種時候一定要趕快找大人，不能只靠小朋友自己處理。"},{"q":"有同學起鬨說：「他每次都這樣，超怪的，大家一起看他發瘋！」你應該怎麼回應比較好？","options":["跟著大家一起笑、一起圍過去看熱鬧","說「他可能正在很難受，我們別圍觀，退開讓老師來幫他」","大聲罵那位情緒爆發的同學，叫他安靜一點"],"answer":1,"explain":"會情緒爆發的同學不是壞小孩，可能正在很難受或很痛苦。圍觀、嘲笑、罵人都會讓情況更糟，也是一種歧視。用同理心請大家退開、交給老師，才是善良又安全的做法。"},{"q":"事情結束後，你發現自己還一直很緊張、心裡怕怕的，晚上想起來還會不舒服。這時候最好怎麼做？","options":["覺得說出來很丟臉，自己憋著就好，假裝沒事","告訴老師、輔導老師或爸媽自己的感覺，請他們陪你聊聊","從此躲著那位同學，再也不跟他講話"],"answer":1,"explain":"被嚇到、心裡不舒服是很正常的，說出來一點都不丟臉。找老師、輔導老師或爸媽談，能幫你把情緒整理好。而躲著、孤立那位同學並不公平，等他好一點時，一句友善的問候會讓班上更溫暖。"}]},{"id":"cm09empathy","title":"換個角度想：同理與尊重不一樣的人","emoji":"🤝","why":"每個人的長相、家庭、想法、能力都不一樣：有人戴助聽器、有人坐輪椅、有人家裡只有爸爸或只有阿嬤、有人講話有口音、有人喜歡的東西跟你完全不同。同理心就是願意停下來想想「如果我是他，我會有什麼感覺」。當你學會換位思考，你會發現很多讓你覺得『怪』的事，其實只是『不一樣』而已。懂得尊重不同的人，不但能減少誤會和衝突，還會讓你交到更多真心的朋友，因為大家都喜歡待在一個被接納、不會被取笑的環境裡。","consequence":"如果只用自己的眼光去評斷別人，看到不一樣就取笑、排擠或指指點點，會讓被針對的同學很受傷、很孤單，有些人甚至會因此不敢來上學。而且嘲笑別人的人，久了也會被大家看成刻薄、不好相處，朋友慢慢變少。班上如果充滿嘲笑和排擠，衝突就會變多，每個人都得小心翼翼、不快樂。相反地，一個願意互相理解的班級，才會讓人安心、願意做真正的自己。","how":["先問再猜：遇到不懂的事，例如同學為什麼那樣做，可以善意地問「你需要幫忙嗎？」而不是自己下結論或跟別人議論。","練習換位思考：說話前先想一下「如果別人這樣說我，我會不會難過？」會難過的話，就換個說法或不要說。","把『不一樣』當成『特別』：每個人擅長的、喜歡的都不同，這讓世界更有趣，而不是拿來比較誰比較『正常』。","不參與嘲笑，也不當旁觀者：當有人被取笑外表、家庭或身體狀況時，你可以說「不要這樣講啦」，或走過去陪那位同學，並把情況告訴老師。","用尊重的話取代標籤：不要用綽號或身體特徵取笑人，可以直接叫他的名字；把「他好奇怪」換成「他跟我們不太一樣，但那沒關係」。","主動釋出善意：邀請比較少人一起玩的同學加入，或在他需要時幫個小忙，一個小小的接納，可能就是別人一整天的溫暖。"],"quiz":[{"q":"班上新來一位坐輪椅的同學，有人偷偷笑他、學他的樣子。你會怎麼做最好？","options":["跟著一起笑，這樣才不會被那群人排擠","假裝沒看到，反正又不關我的事","跟那些人說「不要這樣」，並主動去跟新同學打招呼、問他需不需要幫忙","回家把這件好笑的事拍照傳到群組跟大家分享"],"answer":2,"explain":"坐輪椅只是移動方式不一樣，不是可以被取笑的理由。制止嘲笑、主動釋出善意，既保護了新同學，也讓班上更友善。跟著一起笑會讓人更受傷，而假裝沒看到等於默許欺負，把事情傳到群組更是把傷害擴大——換作是你被這樣對待，你也會希望有人願意站出來。"},{"q":"你發現有位同學家裡的狀況跟你不一樣（例如只有阿嬤照顧他）。下面哪種想法最能表現同理與尊重？","options":["「他家好可憐喔，我要到處跟同學講。」","「每個家庭都不一樣，這沒什麼好奇怪的，我就正常跟他相處。」","「他一定過得很慘，我還是離他遠一點好了。」","「我要一直問他爸媽的事，滿足我的好奇心。」"],"answer":1,"explain":"家庭的樣子本來就有很多種，不同不代表不好，也不需要被特別議論或同情。用平常心正常相處，才是真正的尊重。到處跟別人講、疏遠他、或一直追問隱私，都會讓對方不舒服、覺得自己被當成異類——換位思考一下，你也不會希望自己家的事被拿來當話題。"}]},{"id":"cm06feelings","title":"認識我的情緒：生氣、難過、害怕、嫉妒都正常","emoji":"🎭","why":"情緒就像身體的天氣，會來也會走，每一種都在告訴你一件事：生氣說「有界線被踩到了」、難過說「我在乎的東西受傷了」、害怕說「這裡好像不安全」、嫉妒說「我也好想要那個」。這些感覺本身沒有好壞、沒有對錯，是很正常的人都會有的。真正重要的不是「不要有情緒」，而是先看懂它、幫它取名字，再決定要怎麼處理。當你能說出「我現在很生氣」而不是直接摔門，你就已經比情緒更有力量了。","consequence":"如果你以為某些情緒是「壞的」、不准自己有，久了它不會消失，只會悶在心裡：可能突然對家人大吼、莫名想哭、肚子痛、睡不好，或把難過裝成沒事、裝到自己都累了。看不懂自己的情緒，也會讓你更容易誤會別人、和朋友吵架，或做出事後很後悔的事。相反地，願意承認「我就是有這個感覺」的人，通常更冷靜，也更容易被了解。","how":["先幫情緒命名：停下來問自己「我現在是哪一種感覺？」，試著說出「我覺得生氣／難過／害怕／嫉妒／緊張」，光是講出來，強度常常就降一半。","把感覺和身體連起來：注意心跳變快、臉發燙、喉嚨緊緊的、胃悶悶的——這些都是情緒在提醒你，不是你「有問題」。","對自己說一句允許的話：「有這個感覺是可以的，這不代表我是壞小孩。」情緒沒有對錯，怎麼做出來才有分別。","分開「感覺」和「行為」：可以生氣，但不可以打人；可以嫉妒，但可以選擇對朋友說「恭喜」再默默努力。用「我可以覺得＿＿，但我選擇＿＿」來練習。","用「我訊息」說出來，而不是攻擊別人：把「你很煩！」換成「我現在很生氣，因為我覺得沒有被聽到，我需要一點時間。」","做一本小小情緒筆記：每天睡前寫一句今天最強的感覺和發生什麼事，一週後你會更懂自己，也更好照顧自己。"],"quiz":[{"q":"上體育課分隊時，你最後一個被選到，心裡酸酸的、有點嫉妒又難過。這時候比較好的第一步是？","options":["假裝完全不在乎，告訴自己「這種感覺很丟臉，不准有」","先在心裡幫感覺命名：「我現在有點難過也有點嫉妒」，承認它是正常的","走過去對先被選到的同學說「你們很爛」，讓自己好過一點"],"answer":1,"explain":"情緒沒有對錯，難過和嫉妒都是很正常的感覺。第一步是看懂它、幫它取名字，承認「我有這個感覺」，而不是壓下去（選項一會讓它悶更久）或攻擊別人（選項三會傷到關係也讓自己更糟）。命名之後，你才能冷靜決定下一步。"},{"q":"下面哪一句話最符合「情緒沒有對錯，但行為有分別」這個觀念？","options":["「我不可以生氣，生氣的小孩是壞小孩。」","「我可以覺得很生氣，但我選擇先深呼吸、不動手打人。」","「我很生氣，所以我有權利把弟弟推倒。」"],"answer":1,"explain":"感覺本身（生氣）是正常的、被允許的；真正需要負責的是「怎麼把它做出來」。選項二正確地把「我可以有感覺」和「我選擇好的行為」分開。選項一是在否定正常情緒，會把情緒悶壞；選項三則是用情緒當藉口去傷害別人，這是行為的問題，不是感覺的問題。"}]},{"id":"cm07calmdown","title":"讓自己冷靜下來的方法","emoji":"🧊","why":"當你很生氣或很緊張時，大腦裡負責「衝動」的部分會先搶到方向盤，讓你想大吼、想摔東西、想哭或想逃走——這時候講道理其實聽不太進去。冷靜的方法就像先幫大腦「踩剎車」，讓身體慢下來，負責思考的部分才能重新上線。學會幾招能隨時用、不用花錢、不用道具的冷靜法，你就能在關鍵時刻保護好自己，也保護好和別人的關係。","consequence":"如果不會讓自己冷靜，情緒一上來就直接行動，很容易做出馬上後悔的事：對最愛你的人說出很傷人的話、把作業本撕掉、和同學打起來、或一個人越想越鑽牛角尖。事情過去後，通常不是問題本身讓你難過，而是「我剛剛怎麼會那樣」的懊惱。長期學不會踩剎車，也會讓小情緒累積成大爆炸。","how":["深呼吸「4-7-8」：用鼻子吸氣數到4，憋住數到7，用嘴巴慢慢吐氣數到8，重複3~4次。吐氣拉長是關鍵，身體會跟著慢下來。","按下「暫停鍵」並離開刺激源：對自己說「我需要冷靜一下」，先走到別的房間、走廊或喝口水，先離開讓你更生氣的人事物，不是逃避，是給大腦時間。","用「5-4-3-2-1」把注意力拉回現在：說出你看到的5樣東西、聽到的4種聲音、摸得到的3樣東西、聞到的2種味道、嚐到的1種味道，緊張感會慢慢降下來。","動一動身體：去操場跑一圈、原地開合跳20下、用力握拳再放鬆、或用冷水洗把臉，運動能把生氣的能量「用掉」。","找信任的人說出來：跟爸媽、老師或好朋友講「我今天遇到一件很煩的事」，說出口的當下情緒就會鬆開一些，也可能得到幫忙。","把它寫下來或畫出來：拿張紙寫「我很生氣，因為＿＿」，或用力塗鴉再揉掉。等冷靜了，再回頭想「我可以怎麼解決這件事」。"],"quiz":[{"q":"你和同學為了一件小事越吵越兇，你發現自己氣到很想動手。這時候最好的做法是？","options":["先對自己說「我需要冷靜一下」，走到旁邊深呼吸、喝口水，等冷靜了再處理","趁還很氣趕快把話講完、把對方罵到贏，這樣才不會吃虧","忍著不出聲，但在心裡一直重播剛剛的畫面，讓自己越想越氣"],"answer":0,"explain":"氣到快動手時，大腦的「衝動」已經搶了方向盤，這時先按暫停、離開刺激源、深呼吸，是在幫大腦踩剎車，避免做出馬上後悔的事（選項二很可能演變成打架和更大的衝突）。選項三雖然沒動手，但一直重播畫面會讓怒氣越燒越旺，不是真的冷靜。"},{"q":"下列哪一個是可以馬上用、幫助自己冷靜的好方法？","options":["把生氣的能量憋在心裡，假裝什麼都沒發生","用鼻子慢慢吸氣、把吐氣拉長，重複幾次，或用5-4-3-2-1說出周圍的東西","狠狠摔一樣東西，發洩完就好了"],"answer":1,"explain":"拉長吐氣的深呼吸和5-4-3-2-1都能讓身體慢下來、把注意力拉回當下，是隨時能用又不傷人的冷靜法。選項一把情緒硬憋著，久了會悶出更大的爆炸；選項三摔東西看似發洩，其實是在練習「生氣就可以破壞」，容易越摔越兇，也可能傷到自己或別人。"}]},{"id":"cm12frustration","title":"做不好、過不了關的時候：先別放棄，也別怪東西","emoji":"😤","why":"當你電動一直過不了關、鋼琴同一段一直彈錯、功課寫不出來——心裡會冒出一股很不舒服的感覺：又急、又氣、又想哭。這種感覺叫「挫折」。覺得挫折、生氣、想哭，都是正常的，一點也不丟臉；連大人遇到很難的事，也會這樣。想被抱抱、想找爸媽或朋友說一說、被安慰一下，也完全可以，那不是「愛哭」，那是照顧自己。\n\n有時候過不了關，我們會脫口說出「這遊戲爛透了！」「這鋼琴有問題！」——其實不是東西壞了，是心裡的挫折太滿了，需要一個出口。這很好懂、也不是壞小孩才會這樣。只是有個小祕密要偷偷告訴你：怪遊戲、怪琴、怪筆，罵完之後，那一關還是一樣難、我們也還是沒變厲害。真正會讓自己變強的，是把那股力氣，留下來再試一次。","consequence":"如果每次一挫折就立刻放棄、或一直怪別人怪東西，關卡和曲子並不會因此變簡單；久了反而會少了很多「其實再一下下就學會」的機會，也會越來越不敢去試新的、難的東西——因為心裡開始覺得「反正我一定做不到」。但這不是你的錯，只是還沒有人教你：挫折來的時候，可以怎麼陪自己度過。","how":["先讓情緒降下來：停一下、深呼吸三口，或離開現場喝口水、走一走。氣沖沖的時候大腦很難想辦法，先讓自己冷靜，不是逃避，是準備好再回來。","把「太難的一大塊」拆成「小小一塊」：不要想著「整關要過」「整首要會」，只挑最卡的那一小段、那一個動作，先練會它就好。","換句話說給自己聽：把「我很爛、我就是不行」換成「我還沒學會（yet），再試一次」。一個字「還」，就把「永遠不會」變成「現在正在學」。","記住：覺得難，代表大腦正在長新東西。犯錯和失敗不是你壞掉了，而是學會任何東西的必經過程——厲害的人，都是練了很多次、失敗了很多次才變厲害的。","需要的時候就求助：可以請爸媽、老師、同學教你，也可以看攻略、看示範。找人幫忙不是作弊，是聰明的做法。","對自己好一點：只要有進步一點點——多撐了幾秒、少錯了一個音——就肯定自己「我剛剛有變好一點」。想放棄的感覺會過去，今天做不好不代表永遠做不好，重點是有沒有再試，不是有沒有一次就成功。如果有件事長期讓你很痛苦，記得跟爸媽或老師說，一起想辦法。"],"quiz":[{"q":"小安打電動一直過不了同一關，氣到大哭，把手把一丟說：「這遊戲爛死了！」這時候，哪一個做法比較好？","options":["一直罵遊戲爛，然後再也不玩了","先深呼吸、離開一下冷靜，回來只練最卡的那一小段，再試一次","去搶哥哥的遊戲，證明自己其實很厲害"],"answer":1,"explain":"說「遊戲爛」通常是因為心裡太挫折了，這很正常、不用罵自己。但罵完那一關還是一樣難。先讓情緒降下來，再把難關拆成小小一塊來練，才會真的越來越靠近過關。"},{"q":"小婷練鋼琴，同一段一直彈錯，越彈越氣，很想「以後都不要彈了」。她可以怎麼辦？","options":["告訴自己「我就是沒天分」，直接放棄整首曲子","先停下來休息一下，然後只挑彈錯的那兩三個音、放慢速度多練幾次，需要的話請老師或爸媽教","把整首曲子從頭到尾一直用力彈，錯了也不管"],"answer":1,"explain":"一直彈錯很想放棄，是很正常的感覺，會過去的。與其硬撐或直接放棄，不如休息一下、把最難的一小段挑出來慢慢練，還可以請人教你。彈對一次，就是進步。"},{"q":"遇到很難的事情時，下面哪一句話對自己比較好、也比較正確？","options":["「我就是不行，我永遠學不會。」","「我還沒學會，再試一次就好。」","「別人都很厲害，只有我最笨。」"],"answer":1,"explain":"「我還沒學會（yet）」表示你正在學的路上，只是還沒到；而「我就是不行」卻把門關死了。多一個「還」字，心情和結果都會不一樣——覺得難，正是大腦在長大的訊號。"},{"q":"當你很挫折、眼淚快掉下來的時候，下面哪一個做法是可以的？","options":["忍住不能哭，覺得哭出來很丟臉，要假裝沒事","可以先深呼吸讓自己緩一緩，想哭就哭一下，也可以找爸媽或老師抱一抱、說說心裡的感覺","把氣出在旁邊的人或東西上，用力摔東西"],"answer":1,"explain":"想哭、想被安慰都很正常，一點也不丟臉；哭一哭、找人抱抱，是在照顧自己的情緒。但把氣出在別人或東西上會傷到人也傷到自己。先讓情緒降下來，再回頭想辦法，才是對自己最好的方式。"}]},{"id":"cm13allornothing","title":"錯一個不是全錯：別讓一個小失誤打敗你","emoji":"🧩","why":"很多人心裡有一個「開關」：只要有一個地方沒做到，就覺得「整個都毀了、我全失敗了」。心理學把這叫做「全有全無」或「非黑即白」的想法。它會在你只錯一題、只掉一分、只出一個小狀況的時候，忽然把「我做對的那一大堆」全部抹掉，只剩下那一個錯。想像你花了很多力氣準備單字，考了幾十個字，結果一個字沒寫對——如果按下那個開關，你會覺得「我沒禮物了、我全錯了」，難過到不想繼續。但真相是：你其實答對了好多好多字，只是有一個沒寫對而已。一個錯，擋不住你其他做對的努力。","consequence":"如果一直用「錯一個就全毀了」的開關看事情，你會因為一個小失誤就整個停下來、放棄後面還能拿到的分數或還沒完成的事，難過的時間被拉得很長很長；久了還會變得不敢嘗試，因為你會怕「只要不是滿分，就等於失敗」。學會把它換成「我這裡錯一個，但其他都做到了」，你就能接住失望、繼續往前，把剩下的完成——這才是真正會進步的人。","how":["把腦中的『全毀了』改成一句更真實的話：『我這裡錯一個，但其他我都做到了。』先把你做對的數出來——幾十個字對了、只有一個沒對，這叫做部分成功，而部分成功也是成功。","別因為一個錯就停擺。錯的那一個先放著，把後面還沒做、還能做對的先完成；停下來只會讓你連本來能拿的都拿不到。","失望的時候，先深呼吸三次，允許自己難過一下下（難過是正常的，不用假裝沒事）。等心跳慢下來，再回到題目繼續。情緒先被接住，人才走得動。","跟大人一起把約定改得更聰明：把『全對才有獎勵』換成『有進步、有努力就值得肯定』。失誤可以重來、可以重寫，約定是可以一起調整的。","常常提醒自己：目標不是『一次就完美』，而是『比上次進步』。犯錯是學習的一部分，每個錯都在告訴你下次哪裡可以更好。"],"quiz":[{"q":"小安考單字，前面都寫對了，寫到第八個字的時候發現拼錯了一個。他心裡冒出『我全錯了，不想考了』。這時候比較好的做法是什麼？","options":["把考卷推開不寫了，反正已經不是全對","先深呼吸一下，告訴自己『我只錯這一個，其他都對』，再把後面的字寫完","把前面已經寫對的字都擦掉，因為反正不完美了"],"answer":1,"explain":"錯一個字，不會抹掉你前面寫對的那一大堆。先接住情緒、看見自己其實做對很多，再把剩下的完成——這就是把『全毀了』換成『我這裡錯一個，但其他都做到了』。放棄或擦掉做對的，只會讓你失去本來能拿到的。"},{"q":"小雨本來以為單字全對就能拿到禮物，結果錯了一個字，禮物的約定沒達成，她很失望很想哭。下面哪個方法最能幫她調適這份失望？","options":["允許自己難過一下、深呼吸，然後和大人討論把約定改成『有進步就值得肯定』","告訴自己『哭是沒用的、這根本沒什麼好難過』，把情緒壓下去","從今以後都不要再考單字，這樣就不會再失望了"],"answer":0,"explain":"沒拿到期待的東西，失望是很正常的，不需要否定自己的感覺。健康的做法是先接住情緒（深呼吸、允許難過一下），再和大人一起把約定調整得更看重『努力與進步』。逃避不再嘗試，只會讓你少了很多進步的機會。"},{"q":"『只要錯一個，就等於整份都失敗、全毀了。』這個想法對不對？","options":["對，只要不是滿分就是失敗","不對，這是一種『全有全無』的想法陷阱；錯一個不會抹掉你做對的其他部分，部分成功也是成功","對，別人只會看到你錯的那一個"],"answer":1,"explain":"『錯一個就全毀了』是典型的『全有全無/非黑即白』想法陷阱。事實是：一個小失誤蓋不掉你做對的一大片，進步和努力都是真實存在的。把想法換成『我這裡錯一個，但其他都做到了』，才更接近真相。"},{"q":"小凱在鋼琴比賽表演到一半，不小心彈錯一個音。他很懊惱。這時候最好的做法是？","options":["立刻停下來道歉，因為表演已經被毀了","繼續穩穩地把後面彈完，一個小錯不會蓋掉整首曲子的表現","越彈越急，想趕快結束好逃離舞台"],"answer":1,"explain":"表演或比賽出一個小錯很常見，連專業演奏家也會。重點是別讓一個音打斷整首曲子——深呼吸、穩住，把後面完成。觀眾記得的是你整體的努力與完成，而不是那一個音。停下來或慌亂，反而會讓本來很棒的部分沒機會被聽見。"}]},{"id":"cm08reachout","title":"很難過、撐不住的時候：不要傷害自己，一定要找人說","emoji":"🫶","why":"人生總有些時候會特別黑暗、特別累，難過到好像喘不過氣、覺得沒有人懂、甚至冒出「不想再撐下去」的念頭。請你先記得三件最重要的事：這不是你的錯，你不孤單，而且這種很痛的感覺一定會過去——它像大浪，看起來會把你吞掉，但浪一定會退。這種時候最勇敢、最聰明的事，不是自己硬撐，而是把心裡的話告訴一個你信任的大人。說出來，就是把重擔分一半給願意接住你的人。","consequence":"如果把這些很重的心情一個人藏起來、覺得「說了也沒用」或「不想讓別人擔心」，痛苦會像滾雪球越滾越大，讓你更累、更孤單，也可能讓你想做出傷害自己的事。但只要你願意開口，事情幾乎都有轉圜：大人可以幫你解決問題、帶你去看能幫忙的專業人員，或只是好好陪著你。很多曾經覺得撐不下去的人，後來都很慶幸自己當時有開口求助、有撐過來。開口求助，永遠不嫌晚，也永遠不丟臉。","how":["先對自己說：「這種感覺不是我的錯，我不孤單，這麼痛的感覺會過去。」你值得被幫助，也值得被好好對待。","一定要馬上告訴一個你信任的大人：爸爸、媽媽、老師、輔導老師、阿公阿嬤都可以。開口可以很簡單：「我最近很難過，難過到有點撐不住，可以聽我說嗎？」","如果不知道找誰、或當下沒有大人在，打免費專線：1925 安心專線（24小時）、1995 生命線、1980 張老師專線；遇到危險或緊急狀況打110報警、需要保護打113。這些電話都有受過訓練的人願意聽你說、幫你想辦法。","不要一個人硬撐、不要自己一個人待著：找人陪、待在有人的地方，並把讓你難受的事說出來，說出口本身就會讓心裡鬆一點。","如果發現朋友說出「不想活了」、「反正沒人在乎我」這類話，或行為變得很不一樣：請認真對待、好好陪著他，並且「趕快告訴大人」——這種祕密不能替他保守，因為告訴大人才是真正在救他、幫他。","記得：找人幫忙是勇敢，不是軟弱。就算第一個人幫不上，也一定要再找下一個大人或再打一次專線，直到有人接住你為止。"],"quiz":[{"q":"最近你心情很低落，難過到晚上睡不著，甚至冒出「不想再撐下去」的念頭。這時候你最該做的是？","options":["自己一個人忍著，想說過一陣子應該就會好，不要麻煩別人","馬上告訴你信任的大人（爸媽/老師/輔導老師），或打1925安心專線把心裡的話說出來","覺得反正說了也沒用，把自己關起來誰都不理"],"answer":1,"explain":"難過到出現「不想撐下去」的念頭時，最勇敢也最重要的事就是趕快找人說——告訴信任的大人或打1925安心專線（24小時免費）。這種很痛的感覺會過去，你不孤單，也不是你的錯。選項一和選項三都是一個人硬撐、把自己孤立起來，只會讓痛苦越滾越大；開口求助永遠不丟臉。"},{"q":"你的好朋友私下跟你說「我覺得活著好累，不想再撐了」，還拜託你「千萬不要告訴別人」。你應該怎麼做？","options":["答應幫他保守祕密，因為朋友的信任最重要，不能出賣他","先好好陪著他、聽他說，並且趕快把這件事告訴信任的大人，就算他要你保密也一定要說","叫他不要想太多、振作一點，然後就當作沒這回事"],"answer":1,"explain":"當朋友透露想傷害自己或不想活下去，這是最需要大人幫忙的時刻，這種祕密絕對不能替他保守——把事情告訴大人不是背叛，而是在救他。正確做法是先陪伴、認真傾聽，再趕快找信任的大人或打1925專線。選項一保守祕密可能讓朋友失去被幫助的機會；選項三輕描淡寫地帶過，等於沒有把他的痛苦當一回事。"}]}],"selfmgmt":[{"id":"sm01why","title":"為什麼會拖延？不是懶，是大腦想逃避","emoji":"🧠","why":"拖延不是因為你懶，也不是壞小孩。當一件事讓你覺得「太難、太多、太無聊，或怕做不好」，大腦會自動想逃開這種不舒服，於是先去做別的（滑手機、整理鉛筆盒、發呆），因為那些事馬上讓你比較輕鬆。這是每個人的大腦都會有的正常反應。看懂這一點很重要：真正卡住你的不是懶，而是那份「不想面對的感覺」。當你能對自己說「喔，我只是在逃避這個不舒服而已」，你就已經比剛才更有力量了。","consequence":"如果一直不理它，那件事不會消失，反而會一直在心裡「叮」你，讓你玩也玩得不安心、睡前還在想。事情越堆越多、時間越來越少，最後只能匆匆忙忙趕出來，品質變差、自己也更焦慮。相反地，只要先接納「我在逃避」，再用小方法起個頭，那種壓在心上的重量就會慢慢變輕。","how":["先接納，不罵自己：對自己說「我不是懶，我只是這件事讓我有點怕/覺得無聊」，把它說出來，情緒就沒那麼大。","問自己一句：「我到底在逃避什麼？」——是太難？太多？還是怕做不好？找出原因才知道怎麼幫自己。","太難就先求助：跟大人或老師說「這一題我不會，可以陪我看一下嗎」，不會是丟臉，是聰明。","太多就只挑一小塊先做，太無聊就配個計時或喜歡的音樂，讓開始沒那麼痛苦。","提醒自己：「開始」比「完美」重要，先動起來，感覺就會不一樣。"],"quiz":[{"q":"小安一想到要寫那篇很長的讀書心得，就覺得好煩，於是先去整理書包、又去喝水。用今天學到的觀念，這代表什麼？","options":["小安很懶，是壞學生","小安的大腦在逃避「這件事讓他覺得難又麻煩」的不舒服，這是正常反應","小安永遠都寫不出來了"],"answer":1,"explain":"拖延不是懶，而是大腦想逃開「太難、太麻煩」的不舒服感。看懂這一點，就能不罵自己、改用小方法起個頭。"},{"q":"阿哲發現自己一直在拖數學作業，仔細一想是因為「這單元我根本看不懂」。最好的下一步是？","options":["繼續拖，等到明天說不定就會了","承認自己看不懂，去找老師或家人說「可以陪我看一下嗎」","把作業藏起來假裝沒有"],"answer":1,"explain":"拖延的原因如果是「太難」，最有效的辦法是求助。跟大人或老師說出來、一起想辦法，不是丟臉，而是聰明的做法。"},{"q":"下面哪一句話，是對正在拖延的自己最有幫助的說法？","options":["「我就是爛，什麼都做不好。」","「我不是懶，只是這件事讓我有點怕，先做一點點看看。」","「反正來不及了，乾脆不要做。」"],"answer":1,"explain":"先接納情緒、不羞辱自己，再提醒「先做一點點」，能讓壓力變小、比較容易開始。罵自己只會讓人更想逃避。"}]},{"id":"sm02smallsteps","title":"把大事拆成小步：先做 5 分鐘就好","emoji":"🪜","why":"一件大事會讓人卡住，常常是因為它「看起來好大一團」，大腦一看到就想逃。其實任何大事都能被拆成很多小步驟，就像爬樓梯，一次只踏一階。還有一個好用的祕訣叫「先做 5 分鐘就好」：跟自己約定只做五分鐘，時間到想停就停。因為「開始」才是最難的部分，通常做了五分鐘之後，你會發現「咦，好像沒那麼可怕」，就自然做下去了。另一個小規則是「兩分鐘法則」：如果一件事兩分鐘內就能做完（像把碗放進水槽、回一句訊息），現在馬上做，別讓它排隊等你。","consequence":"一直盯著「整件大事」不動手，只會越看越怕、越拖越久，事情堆成一座山。但只要願意把它拆小、先做五分鐘，你會很快嚐到「原來我做得到」的感覺，這份小小的成就感會推著你繼續往前，大事也就一階一階被你踏完了。","how":["把大事寫下來，拆成一個個「小到不可能失敗」的步驟（例如報告：①找一張紙 ②寫下題目 ③列三個重點 ④查資料 ⑤寫第一段）。","用「先做 5 分鐘就好」開場：設一個五分鐘計時，只要求自己動手五分鐘，時間到可以停。","通常五分鐘後你會想繼續——那就繼續；真的想停也沒關係，你已經起步了。","兩分鐘法則：兩分鐘內能完成的小事，現在立刻做掉，不要累積。","每做完一小步就打個勾，看著勾勾變多，你會越做越有動力。","只看「下一步」就好，不要一直想著「還有好多沒做」，那只會讓你想放棄。"],"quiz":[{"q":"小美要做一份「我的家鄉」報告，覺得好大、不知從哪開始，一直不敢動。用今天的方法，她該怎麼起步最好？","options":["等到有一整天空閒、心情很好時再一次做完","把報告拆成小步驟，先花 5 分鐘寫下題目和三個想寫的重點","先去打電動放鬆，報告明天再想"],"answer":1,"explain":"把大事拆成小步、用「先做 5 分鐘就好」起步，是打敗「看起來好大」的最好辦法。開始之後往往就做得下去了。"},{"q":"阿宏喝完牛奶，杯子放桌上想「等一下再洗」。這件事其實一分鐘就能做完。根據「兩分鐘法則」，他應該？","options":["現在馬上洗掉，不要讓小事排隊累積","堆到晚上一次洗十個杯子","放著不管，反正只是一個杯子"],"answer":0,"explain":"兩分鐘內能做完的小事，當下就做掉最省事。累積起來會變成一堆麻煩，也會讓心裡一直記掛著。"},{"q":"「先做 5 分鐘就好」這個方法，最主要是在幫我們克服哪個困難？","options":["讓我們一次就把事情做到完美","克服「開始」最難的那一步，先動起來","讓我們可以永遠只做五分鐘就交差"],"answer":1,"explain":"一件事最難的常常是「開始」。約定只做五分鐘能降低心理門檻，先動手；動起來之後通常就能繼續下去。"}]},{"id":"sm03frogfirst","title":"先做最重要、最難的那一件","emoji":"🐸","why":"有一個有名的說法：「早上先把那隻最醜的青蛙吃掉。」意思是——每天先做那件你最不想做、卻最重要的事。因為那件事會一直在你心裡「碎碎念」，讓你做別的都不安心。很多人會用「先做簡單的小事」來拖延，例如先削鉛筆、先排桌面、先看課外書，感覺好像很認真，其實只是在逃避那件真正該做的。當你趁精神最好、干擾最少的時候先解決最難的那一件，剩下的事就會變得輕鬆又愉快。如果最難的那件實在起不了頭，就先用上一課的方法：把它拆成小步、先做五分鐘，一樣是在吃青蛙。","consequence":"如果總是把最難的留到最後，你會發現：一整天心裡都壓著它，做什麼都分心；等到終於要面對時，你已經又累又沒時間，只能草草做完，品質變差、心情也差。反過來，先把最難的「青蛙」解決掉，你會一整天都覺得輕鬆，因為最重的石頭已經放下了。","how":["每天開始前，先問自己：「今天最重要、最不想做的那一件是什麼？」把它圈出來。","把這件「青蛙」排在最前面，趁你精神最好、還沒被別的事打斷時先做。","如果青蛙很大，就配合上一課：把它拆成小步，先做五分鐘。","小心「假裝很忙」的陷阱：用削鉛筆、整理桌面等簡單小事逃避真正該做的事。","做完最難的那件後，給自己一句肯定：「最難的已經解決了！」剩下的當作獎勵慢慢做。","如果每次都很難開始，就找大人或老師陪你排順序、一起想辦法。"],"quiz":[{"q":"阿樂今天有三件事：①最難的數學訂正 ②看課外書 ③整理鉛筆盒。他一直先做②和③，覺得「我很認真啊」。這其實是？","options":["很棒的安排，先做簡單的暖身","用簡單小事逃避那件最重要、最難的數學訂正","代表他不需要做數學訂正了"],"answer":1,"explain":"用簡單小事讓自己「看起來很忙」，是常見的逃避方式。真正重要又難的事沒解決，它會一直卡在心裡。"},{"q":"「先吃掉那隻最醜的青蛙」是什麼意思？","options":["每天先做最重要、最不想做的那一件事","每天先把最簡單、最好玩的事做完","每天要吃青蛙才會變聰明"],"answer":0,"explain":"「青蛙」比喻你最不想面對卻最重要的事。趁精神好時先解決它，之後一整天都會比較輕鬆、專心。"},{"q":"小恩發現那件最重要的事（讀明天要考的社會）好大，一想到就不敢開始。最好的做法是？","options":["因為太大，就先跳過去做別的","把它拆成小步，先讀 5 分鐘的第一小節，起個頭","乾脆整天都不要讀"],"answer":1,"explain":"先做最難的那件，遇到它很大時，就結合『拆成小步、先做五分鐘』。先起個頭，難的事也能一步步完成。"}]},{"id":"sm04focus","title":"專心一段時間：番茄鐘與趕走干擾","emoji":"🍅","why":"我們的專注力像手機電量，沒辦法一直滿格用好幾個小時。有一個好用的方法叫「番茄鐘」：設定一段時間（例如 15 到 25 分鐘）只專心做一件事，時間到就休息 5 分鐘，再開始下一輪。這樣做，因為知道「等一下就能休息」，反而更容易撐住、更專心。專心的另一個關鍵是「趕走干擾」：手機一響、電視一開，注意力就被搶走，而且被打斷後要重新專心，往往要花好幾分鐘才回得來。所以在專注時段裡，先把會分心的東西移到看不到的地方，你會發現同樣的時間能完成更多。","consequence":"如果一邊寫作業一邊滑手機、開著電視，看起來坐了很久，其實一直被打斷，事情又慢又容易出錯，時間都被偷走了。相反地，用番茄鐘專心一小段、把干擾移開，你會又快又好地做完，還多出時間去玩，玩得也更安心。休息也很重要——排進休息才不會累垮，是聰明不是偷懶。","how":["設一個計時器：例如專心 20 分鐘、休息 5 分鐘，當成一顆「番茄鐘」。","專心時段只做一件事，其他想到的雜事先寫在紙上，等休息或做完再處理。","開始前先把手機關靜音、放到「看不到、拿不到」的另一個房間或抽屜。","跟家人說「我要專心 20 分鐘」，請他們這段時間先不要找你。","休息 5 分鐘就真的休息：喝水、走動、看看遠方，別在休息時滑手機停不下來。","如果常常一坐下就很難專心、很痛苦，把這件事告訴大人或老師，一起想辦法調整（例如換時段、縮短時間）。"],"quiz":[{"q":"小杰要寫作業，他把手機放在旁邊，說「我不會去看啦」。結果每次一響就忍不住拿起來。比較好的做法是？","options":["手機就放旁邊，靠意志力忍住不看","開始前先把手機關靜音、放到看不到拿不到的地方","一邊寫作業一邊回訊息，這樣比較快"],"answer":1,"explain":"把干擾「移到看不到的地方」比硬忍更有效。被通知打斷後要重新專心得花好幾分鐘，先收起來能省下很多時間。"},{"q":"關於「番茄鐘」（專心一段時間、時間到就休息）的休息，哪個觀念是對的？","options":["休息是偷懶，應該一路做到完全做不動為止","把休息排進去是聰明的做法，能讓專注力恢復、撐得更久","休息時要一直滑手機才算真正放鬆"],"answer":1,"explain":"專注力像電量，需要充電。把短休息排進去能恢復精神、避免累垮，是聰明的安排；休息時做點放鬆的事，別又被手機黏住。"},{"q":"為什麼「一邊寫作業一邊看電視、滑手機」通常會又慢又容易出錯？","options":["因為這樣其實有兩倍效率","因為注意力一直被打斷，重新專心要花時間，事情就變慢又易錯","因為電視會讓人變聰明"],"answer":1,"explain":"同時做很多事會不斷打斷專注，每次被打斷都要重新進入狀況。專心一段時間、移開干擾，反而更快更好。"}]},{"id":"sm05justdo","title":"打敗『等一下再說』：完成的快樂","emoji":"✅","why":"「等一下再說」是拖延最常用的口頭禪。問題是，「等一下」常常變成「等到最後」，因為未來的你，跟現在的你其實一樣不想做。真正能打敗它的，是「現在就開始」——哪怕只做一小步。而且你要知道一個祕密：完成一件事的那一刻，大腦會給你一種很棒的「完成的快樂」，把它打勾的瞬間特別爽快。這種成就感會越累積越多，讓你越來越喜歡把事情做完。記得，我們的目標是「完成」，不是「完美」；先把它做完，就已經很了不起了。","consequence":"一直說「等一下」，事情會拖到最後一刻，變成又急又累的趕工，做出來的品質差，自己也心虛難受。更糟的是，沒做完的事會一直懸在心上，玩也玩不開心。但只要你「現在就開始」、把它一件件完成、打上勾，你會體驗到那份輕鬆和成就感——事情做完了，接下來的玩樂才是真正踏實又安心的。對自己好一點，不必事事完美。","how":["把「等一下再說」改成「先做一小步就好」，馬上動手，不給自己拖的空間。","用「倒數 5 秒」起跑：心裡數 5、4、3、2、1，數到 1 就立刻開始，不再想東想西。","做一張待辦清單，每完成一件就用力打個勾，感受「完成的快樂」。","完成後給自己一個小獎勵（喝杯喜歡的飲料、聽一首歌、休息一下），讓大腦記住「做完真好」。","提醒自己：目標是「完成」不是「完美」，做完 80 分好過永遠停在腦中的 100 分。","如果一直覺得「怎麼做都不夠好、很痛苦、很難開始」，這不是你的錯，跟大人或老師說，一起找方法、對自己溫柔一點。"],"quiz":[{"q":"小雨每次想到要練習直笛，就說「等一下再說」，結果都拖到睡前才慌張地練。要打敗「等一下」，最有效的做法是？","options":["相信「等一下」的自己一定會更想練","用倒數 5 秒（5、4、3、2、1）立刻開始，先練一小段就好","乾脆放棄，反正明天也會拖"],"answer":1,"explain":"「等一下」的你和現在的你一樣不想做，所以要「現在就開始」。倒數 5 秒能推自己跨出第一步，先做一小步最有效。"},{"q":"阿光寫報告時一直改來改去，覺得「不夠完美就不能交」，結果永遠寫不完。比較健康的想法是？","options":["一定要 100 分完美，否則就是失敗","目標是先「完成」，做完 80 分好過永遠停在腦中的 100 分","完美最重要，交不出來也沒關係"],"answer":1,"explain":"追求完美常常讓人卡住、遲遲交不出來。先把事情完成，再慢慢修，比停在腦中的完美計畫更有價值，也對自己更好。"},{"q":"為什麼「每完成一件事就打個勾、給自己一個小獎勵」是好方法？","options":["因為打勾和獎勵能讓大腦記住「做完真好」，越做越有動力","因為這樣可以不用真的把事情做完","因為獎勵越貴，事情就會做得越快"],"answer":0,"explain":"完成時的成就感和小獎勵會讓大腦把「做完」和「快樂」連在一起，下次就更容易起身去做，形成好的循環。"}]},{"id":"sm06selfstart","title":"不用等人一直催：自己安排、說到做到","emoji":"⏰","why":"被催，其實不好受——一直被念，你會覺得煩、覺得自己好像什麼都做不好；但這不代表你是壞孩子，只是「開始」這件事對每個人都不容易。這一課要練的，是把「什麼時候做、怎麼做」慢慢變成你自己說了算的事。當你能自己先安排、先開始，不用等別人一直提醒，你會發現：耳邊清靜了、心裡踏實了，做完再去玩也玩得更安心。這叫做把方向盤握回自己手上——你管得動自己的事，是很了不起的能力。","consequence":"如果總是拖到別人來催，念的人累、你也不好受，有時還會演變成一場誰都不開心的爭吵；而且事情拖著沒做完，玩起來心裡也一直卡卡的。反過來，當你先安排、說到做到、卡住就開口，你會愈來愈相信自己「我做得到」——這份對自己的信任，比做完任何一份功課都珍貴，而且會跟著你一輩子。","how":["跟爸媽先「約定一個時間」：主動說「我八點前會把功課寫完」，把模糊的『等一下』換成清楚的時間點，然後盡力做到。做到一次，他們就會更願意放手讓你自己安排。","先做完該做的，再去玩——把最想做的事當成「做完的獎勵」。這樣玩的時候沒有一件事懸在心上，反而更放鬆、更盡興。","被催的時候，先回一句「好，我現在開始」並真的起身——不頂嘴、不辯解（心裡若有話，等大家冷靜後再好好說）。一句回應加一個動作，常常就化解了一場快要吵起來的衝突，對方也知道你聽見了。","如果是真的卡住（太難、太多、不知道從哪開始），那不是你的錯，也不用硬撐著拖——直接說出來：「這裡我不會」「今天作業好多，可以一起排一下順序嗎？」求助是聰明的做法，不是丟臉的事。","先把大事切成小步：『先寫五題』『先做十分鐘』。開頭最難，只要動起來，後面就順了。","做完主動讓爸媽知道：「我寫完了，你要不要看？」不用等他們來查。主動回報會讓他們更放心、更少催你——你會慢慢賺到更多屬於自己的自由。","如果大人已經在生氣，先深呼吸、不頂嘴，把手上的事默默開始做；等大家都冷靜下來，再好好把話說清楚。你顧好自己這一份，就已經做得很好了，大人的情緒有大人自己會處理。"],"quiz":[{"q":"媽媽已經第三次叫你去寫功課，你卻還在看電視。這時候最好的做法是？","options":["回一句「好，我現在去」，然後真的關掉電視去寫","說「等這一集看完啦」，繼續坐著不動","覺得媽媽好煩，回嘴「你很囉唆耶」"],"answer":0,"explain":"這件事本來就是今天該完成的；與其一直被念得不舒服，不如自己先起步。先回應「好，我現在去」再馬上行動，是把主導權拿回自己手上——不頂嘴、不拖延，你會發現耳邊清靜了，自己也不用再被念，對大家都輕鬆。"},{"q":"你答應爸爸「八點前寫完功課」，結果一直分心拖到快八點半還沒寫完。下次怎麼做比較好？","options":["乾脆別再跟爸爸約時間，免得做不到被念","把功課切成小段，一坐下就先寫十分鐘，把想玩的留到寫完當獎勵","騙爸爸說寫完了，先去玩再說"],"answer":1,"explain":"說到做到不是靠意志力硬撐，而是靠方法。把大任務切成小段、先做再玩，開頭就沒那麼難了。約定時間是好習慣，別因為一次沒做到就放棄——調整方法，下次會更接近。"},{"q":"今天作業特別多，多到你光是看著就不想開始、很想逃避。這種時候該怎麼辦？","options":["一直拖著不說，拖到最後真的來不及","告訴自己「我就是懶」，然後自責一整晚","跟爸媽說「今天作業好多，可以幫我一起排一下先寫哪個嗎？」"],"answer":2,"explain":"不想開始，常常是因為事情太難、太多，不是因為你懶或壞——這很正常。把困難說出來、找人一起想辦法，是聰明又勇敢的做法。開口求助，比一個人卡在原地拖著好太多了。"},{"q":"你還沒開始做該做的事，爸爸已經很生氣地大聲說話了。你可以怎麼回應？","options":["先深呼吸、不頂嘴，默默開始做手上的事，等大家冷靜再好好說","也跟著大聲吵回去，證明自己有道理","一直想著「都是我害的」，越想越自責"],"answer":0,"explain":"會難過、甚至一時愣住都很正常，先深呼吸幾秒；而且要記得——大人的情緒由大人自己負責，你不需要扛「是我害的」這種重擔。你能做的，是先深呼吸穩住自己、不頂嘴，把該做的事開始做；等大家都冷靜了再把話說清楚。顧好自己這一份，你就已經做得很棒了。"}]}]};
(function(){
  'use strict';
  var AREAS = [
    { key:'personal',  label:'個人安全（保護自己）', emoji:'🧍' },
    { key:'home',      label:'居家與衛生',           emoji:'🏠' },
    { key:'emergency', label:'緊急應變與求救',       emoji:'🚨' },
    { key:'outdoor',   label:'交通與戶外安全',       emoji:'🚸' },
    { key:'communication', label:'語言溝通與情緒管理', emoji:'🗣️' },
    { key:'selfmgmt',      label:'自我管理：把事情做好', emoji:'⏰' }
  ];
  // 深連結：把首頁四張卡的 hash 對應到實際 area key（traffic 是「交通與戶外」outdoor 的別名）。
  var HASH_TO_AREA = {
    personal:'personal', home:'home', emergency:'emergency',
    outdoor:'outdoor', traffic:'outdoor',
    communication:'communication', emotion:'communication', selfmgmt:'selfmgmt'
  };
  var PROG_KEY = 'safety_progress_v1';
  function $(id){ return document.getElementById(id); }
  function loadProg(){ try{ return JSON.parse(localStorage.getItem(PROG_KEY)) || {lessons:{}}; }catch(e){ return {lessons:{}}; } }
  function saveProg(p){ try{ localStorage.setItem(PROG_KEY, JSON.stringify(p)); }catch(e){} }
  var prog = loadProg();
  if(!prog.lessons) prog.lessons = {};

  // 不依賴 Math.random 的確定性洗牌（以索引擾動；答案以原字串索引 data-orig 比對，不受洗牌影響）
  function shuffleOptions(opts, seed){
    var arr = opts.map(function(o,i){ return {o:o,i:i}; });
    for(var k=arr.length-1;k>0;k--){ seed=(seed*9301+49297)%233280; var j=Math.floor(seed/233280*(k+1)); var t=arr[k];arr[k]=arr[j];arr[j]=t; }
    return arr;
  }

  // ---------- 選單 ----------
  // filterKey 為某個 area key 時只渲染該分組（深連結直達用）；不給則渲染全部四大主題。
  function renderMenu(filterKey){
    var host = $('area-list'); host.innerHTML='';
    var areasToShow = AREAS;
    if(filterKey){
      areasToShow = AREAS.filter(function(a){ return a.key===filterKey; });
      if(!areasToShow.length){ areasToShow = AREAS; filterKey = null; }
    }
    if(filterKey){
      var toAll = document.createElement('button');
      toAll.type='button'; toAll.className='btn'; toAll.id='btn-all-areas';
      toAll.style.marginBottom='var(--s4)';
      toAll.textContent='← 查看全部安全主題';
      toAll.addEventListener('click', function(){ renderMenu(); });
      host.appendChild(toAll);
    }
    areasToShow.forEach(function(area){
      var lessons = SAFETY_DATA[area.key] || [];
      var doneCount = lessons.filter(function(l){ return prog.lessons[l.id] && prog.lessons[l.id].done; }).length;
      var sec = document.createElement('div'); sec.className='sf-area';
      var head = document.createElement('div'); head.className='sf-area-head';
      head.innerHTML = '<span class="sf-area-title">'+area.emoji+' '+area.label+'</span>'+
                       '<span class="sf-area-count">'+doneCount+' / '+lessons.length+'</span>';
      sec.appendChild(head);
      var grid = document.createElement('div'); grid.className='sf-grid';
      lessons.forEach(function(l){
        var done = prog.lessons[l.id] && prog.lessons[l.id].done;
        var btn = document.createElement('button'); btn.type='button';
        btn.className='sf-card'+(done?' done':'');
        btn.innerHTML = '<span class="sf-c-emoji" aria-hidden="true">'+l.emoji+'</span>'+
          '<span class="sf-c-title">'+l.title+'</span>'+
          '<span class="sf-c-state">'+(done?'✓ 學過了':'去學')+'</span>';
        btn.setAttribute('aria-label', l.title + (done?'（已學過）':''));
        btn.addEventListener('click', function(){ openLesson(area.key, l.id); });
        grid.appendChild(btn);
      });
      sec.appendChild(grid);
      host.appendChild(sec);
    });
  }

  // ---------- 教學 + 練習流程 ----------
  var cur = null; // {area, lesson, phase:'teach'|'quiz', qIndex, correctCount, answered}
  function openLesson(areaKey, lessonId){
    var lessons = SAFETY_DATA[areaKey] || [];
    var lesson = null; for(var i=0;i<lessons.length;i++){ if(lessons[i].id===lessonId){ lesson=lessons[i]; break; } }
    if(!lesson) return;
    cur = { area:areaKey, lesson:lesson, phase:'teach', qIndex:0, correctCount:0, answered:false };
    $('play-title').textContent = lesson.emoji + ' ' + lesson.title;
    showScreen('play');
    renderTeach();
  }
  function showScreen(name){
    $('screen-menu').classList.toggle('active', name==='menu');
    $('screen-play').classList.toggle('active', name==='play');
    try{ window.scrollTo(0,0); }catch(e){}
  }
  function renderDots(){
    var total = cur.lesson.quiz.length; var d=$('dots'); d.innerHTML='';
    if(cur.phase!=='quiz'){ d.style.display='none'; return; }
    d.style.display='flex';
    for(var i=0;i<total;i++){ var el=document.createElement('i'); if(i<=cur.qIndex) el.className='on'; d.appendChild(el); }
  }
  function renderTeach(){
    cur.phase='teach'; renderDots();
    var l = cur.lesson;
    var howHtml = '<ol class="sf-how">' + l.how.map(function(s){ return '<li>'+s+'</li>'; }).join('') + '</ol>';
    // 漸進式揭示：一次先只出現一小段，點「繼續」再展開下一段，最後才出練習鈕，
    // 避免一進來就是一大片字讓孩子跳過不讀（教學內容不變，只改節奏）。
    var steps = [
      '<div class="sf-block"><div class="sf-block-label">為什麼要注意？</div><div class="sf-block-text">'+l.why+'</div></div>',
      '<div class="sf-block warn"><div class="sf-block-label">如果不這麼做，可能會…</div><div class="sf-block-text">'+l.consequence+'</div></div>',
      '<div class="sf-block"><div class="sf-block-label">可以怎麼做？</div>'+howHtml+'</div>'
    ];
    var step = 0;
    function paint(){
      var last = step >= steps.length - 1;
      var btn = last
        ? '<button type="button" class="btn btn-primary" id="btn-startquiz">我懂了，來練習 ✏️</button>'
        : '<button type="button" class="btn btn-primary" id="btn-next-teach">繼續 ➡️</button>';
      $('stage').innerHTML =
        '<div class="sf-teach">' +
          '<div class="sf-t-emoji" aria-hidden="true">'+l.emoji+'</div>' +
          '<h2>'+l.title+'</h2>' +
          steps.slice(0, step + 1).join('') +
          '<div class="sf-actions">'+btn+'</div>' +
        '</div>';
      if (last) {
        $('btn-startquiz').addEventListener('click', function(){ cur.phase='quiz'; cur.qIndex=0; cur.correctCount=0; renderQuiz(); });
      } else {
        $('btn-next-teach').addEventListener('click', function(){ step++; paint(); });
      }
    }
    paint();
  }
  function renderQuiz(){
    cur.answered=false; renderDots();
    var q = cur.lesson.quiz[cur.qIndex];
    var shown = shuffleOptions(q.options, (cur.qIndex+1)*7 + q.q.length);
    var optHtml = shown.map(function(x){
      return '<button type="button" class="sf-opt" data-orig="'+x.i+'">'+x.o+'</button>';
    }).join('');
    $('stage').innerHTML =
      '<div class="sf-teach">' +
        '<div class="sf-q">第 '+(cur.qIndex+1)+' / '+cur.lesson.quiz.length+' 題<br>'+q.q+'</div>' +
        optHtml +
        '<div class="sf-reveal" id="reveal"></div>' +
        '<div class="sf-actions" id="q-actions" style="display:none"><button type="button" class="btn btn-primary" id="btn-nextq"></button></div>' +
      '</div>';
    var opts = $('stage').querySelectorAll('.sf-opt');
    Array.prototype.forEach.call(opts, function(btn){
      btn.addEventListener('click', function(){ answer(btn, q, opts); });
    });
  }
  function answer(btn, q, opts){
    if(cur.answered) return; cur.answered=true;
    var chosen = parseInt(btn.getAttribute('data-orig'),10);
    var correct = (chosen === q.answer);
    if(correct) cur.correctCount++;
    try { if (window.Game && typeof Game.pingActive === 'function') Game.pingActive(); } catch(e){}  // 安全模組不發 XP，但作答＝當日有學習（且此為首訪 hero 推薦的第一個活動），維持每日連續 streak（只續火焰、不計分）
    Array.prototype.forEach.call(opts, function(b){
      var oi = parseInt(b.getAttribute('data-orig'),10);
      if(oi===q.answer) b.classList.add('correct');
      else if(b===btn) b.classList.add('wrong');
      b.disabled = true;
    });
    var rev = $('reveal');
    rev.textContent = (correct ? '答對了！👍 ' : '沒關係～正確答案是這個喔！') + q.explain;
    rev.classList.add('show');
    var act = $('q-actions'); act.style.display='flex';
    var next = $('btn-nextq');
    var last = (cur.qIndex >= cur.lesson.quiz.length-1);
    next.textContent = last ? '完成這個主題 🎉' : '下一題 ➡️';
    next.onclick = function(){
      if(last){ finishLesson(); }
      else { cur.qIndex++; renderQuiz(); }
    };
  }
  function finishLesson(){
    var l = cur.lesson;
    prog.lessons[l.id] = { done:true, correct:cur.correctCount, total:l.quiz.length };
    saveProg(prog);
    $('dots').style.display='none';
    $('stage').innerHTML =
      '<div class="sf-teach" style="text-align:center">' +
        '<div class="sf-t-emoji" aria-hidden="true">🎉</div>' +
        '<h2>學會了！你更懂得保護自己了</h2>' +
        '<div class="sf-block"><div class="sf-block-text">這個主題答對了 '+cur.correctCount+' / '+l.quiz.length+' 題。記得把學到的方法用在生活裡喔！</div></div>' +
        '<div class="sf-actions"><button type="button" class="btn btn-primary" id="btn-tomenu">回主題選單</button></div>' +
      '</div>';
    $('btn-tomenu').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });
  }

  $('btn-back').addEventListener('click', function(){ showScreen('menu'); renderMenu(); });

  // 載入時的 hash 路由：#personal / #home / #emergency / #outdoor（#traffic 為 outdoor 別名）
  // 直接渲染對應分組；無對應 hash 則維持原本的全部主題選單。
  function areaFromHash(){
    var raw = (window.location.hash || '').replace(/^#/, '').toLowerCase();
    return HASH_TO_AREA[raw] || null;
  }
  var initialArea = areaFromHash();
  showScreen('menu');
  renderMenu(initialArea);
})();
</script>
</body>
</html>
