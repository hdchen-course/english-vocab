    <div class="cn-hello"><span class="cn-mascot" aria-hidden="true">🔎</span>
      <div><div class="cn-htext" id="hello">世界上大部分的人和地方都是友善又安全的。這裡不是要你害怕，而是幫你多開一盞小燈：學會留意身邊、記住重點、保全證據、看穿詐騙，遇到事情不慌、說得清楚。</div>
      <div class="cn-hsub">每一課都是「先懂這個本領 → 學會怎麼做 → 換你試試」。這些是保護自己、長大也用得到的好習慣。</div></div></div>
    <div class="cn-lessons" id="lesson-list"></div>
    <a class="cn-nextup" href="safety.html"><span class="cn-nextup-ic" aria-hidden="true">🛡️</span><span>想更會保護自己嗎？到「生活安全」看更多 →</span></a>
    <p class="cn-note">這裡是「先學觀念」的教學小旅程，只留在你的裝置上，不影響學習基地的等級或經驗值。</p>
  </section>

<script>
window.CONCEPT = { progKey:'self_protection_concepts_v1', practiceHref:'safety.html', lessons:[{"id":"sp_observe","name":"觀察力","emoji":"👀","sub":"隨時留意身邊，世界大多很安全，但眼睛醒著更安心","done":"記住這句：到新地方，先抬頭看一看，別讓手機遮住整個世界。","steps":[{"type":"teach","kicker":"這個本領","title":"什麼是觀察力","text":"<b>觀察力</b>就是走到哪裡，都順手看看四周的能力。大部分的人和地方都是友善又安全的，我們不是要害怕，而是像開了一盞小燈：<b>知道出口在哪、旁邊有誰、環境長什麼樣</b>。這樣萬一有事，反應會快很多，平常也會玩得更放心。","svg":""},{"type":"teach","kicker":"怎麼做","title":"抬頭三看","text":"進到新地方時，花三秒鐘做「三看」：<b>一看出口</b>（門、樓梯在哪）、<b>二看環境</b>（廁所、服務台、亮不亮）、<b>三看人</b>（附近大概有哪些人）。走路時<b>別一直低頭滑手機</b>，讓耳朵和眼睛保持醒著。如果心裡覺得「這裡怪怪的」，那個<b>直覺</b>值得相信，先離開到人多、明亮的地方。","svg":""},{"type":"quiz","kicker":"換你試試","title":"小安第一次跟同學去一間很大的室內遊樂場，一進門他應該先做什麼？","options":["低頭打開手機，邊走邊玩遊戲","花幾秒看看出口、服務台和廁所在哪","什麼都不用看，跟著人群走就對了"],"answer":1,"why":"進到陌生的大空間時，先看清楚出口、服務台和廁所的位置，遇到走散或需要幫忙時能更快找到方向。"}],"color":"#0f766e"},{"id":"sp_details","name":"記住細節","emoji":"🧠","sub":"用「人事時地物」把發生的事清楚記下來","done":"記住這句：人、事、時、地、物——五個格子填一填，事情就記得住。","steps":[{"type":"teach","kicker":"這個本領","title":"為什麼要記細節","text":"事情發生時，腦袋常常一片空白，事後才想「那個人長怎樣？」。<b>記住關鍵細節</b>能讓你把事情說清楚，別人也才幫得上忙。訣竅是用五個小格子：<b>人、事、時、地、物</b>，把它們填滿。","svg":""},{"type":"teach","kicker":"怎麼做","title":"五個格子怎麼填","text":"<b>人</b>：是誰、大概幾歲、高矮胖瘦、穿什麼顏色的衣服、有沒有戴帽子眼鏡。<b>事</b>：發生了什麼。<b>時</b>：大概幾點、上課還是放學。<b>地</b>：在哪條路、哪家店。<b>物</b>：有沒有相關的東西，例如<b>車子的顏色和車牌開頭幾個字</b>。記不住全部沒關係，<b>抓兩三個最特別的特徵</b>就很有用，例如「戴紅色帽子、騎藍色機車」。","svg":""},{"type":"quiz","kicker":"換你試試","title":"小美想把剛剛看到的一位陌生人記清楚，下面哪一種描述最有幫助？","options":["他看起來就是一個普通人","一個穿黃色外套、戴黑框眼鏡、個子很高的男生","我也說不上來，反正怪怪的"],"answer":1,"why":"「黃色外套、黑框眼鏡、個子很高」都是具體又明顯的特徵，別人聽了比較能對得上人。"}],"color":"#0f766e"},{"id":"sp_evidence","name":"保全證據","emoji":"📸","sub":"遇到不對勁，先留下紀錄，別急著刪掉","done":"記住這句：先截圖、先拍照、先記下時間，證據比記憶更牢靠。","steps":[{"type":"teach","kicker":"這個本領","title":"為什麼要留證據","text":"記憶會忘、會變模糊，但<b>照片、截圖和紀錄不會</b>。遇到不對勁的事——像是<b>被騙、東西被弄壞、收到奇怪的訊息</b>——先把它「留下來」，之後要跟大人說明或處理時，就有實實在在的東西可以看。","svg":""},{"type":"teach","kicker":"怎麼做","title":"三個動作：拍、存、記","text":"<b>拍</b>：拍照或截圖，把奇怪的訊息、壞掉的東西拍下來（不用為了拍照留在讓你不安全的地方）。<b>存</b>：<b>先別急著把訊息刪掉</b>，留著它才是證據；收據、單據也收好。<b>記</b>：寫下<b>發生的時間</b>和大概經過。<b>最重要的是：如果你覺得害怕、被威脅或有危險，安全第一——先離開、馬上告訴信任的大人，截圖之後再和大人一起補就好。</b>其他不緊急的情況，就拍好、存好、記好，再找信任的大人一起看怎麼辦。","svg":""},{"type":"quiz","kicker":"換你試試","title":"阿哲在遊戲裡收到一則陌生人的訊息，說「給我帳號密碼就送你寶物」，他覺得怪怪的，該先怎麼做？","options":["馬上把訊息刪掉，當作沒看到","先截圖留著，再去告訴爸媽或老師","照對方說的先給帳號，反正只是遊戲"],"answer":1,"why":"先截圖能保留這則可疑訊息當證據，之後跟大人說明或檢舉時才有依據；刪掉會讓證據消失。"}],"color":"#0f766e"},{"id":"sp_scam","name":"看穿詐騙","emoji":"🚩","sub":"劇本百百種，但共同訊號就那幾個","done":"記住這句：又急、又要保密、又要錢或密碼——三個一起出現，幾乎就是詐騙。","steps":[{"type":"teach","kicker":"這個本領","title":"看訊號，不用背劇本","text":"詐騙的故事千變萬化，但你不用把每種手法都背起來。因為它們幾乎都藏著<b>同樣幾個訊號</b>。學會認訊號，遇到沒看過的新招也擋得住。","svg":""},{"type":"teach","kicker":"怎麼做","title":"三個危險訊號","text":"訊號一<b>製造急迫</b>：「限時、現在就要、不快點就來不及」，逼你來不及想。訊號二<b>要你保密</b>：「別告訴爸媽、這是我們的祕密」，好人不會叫你瞞著信任的大人。訊號三<b>要錢或帳密</b>：要你<b>給錢、買點數、給帳號密碼或驗證碼</b>。只要出現這些訊號，就<b>先停下來</b>，不管對方說得多好聽。","svg":""},{"type":"quiz","kicker":"換你試試","title":"有人傳訊息說：「你中獎了！十分鐘內給我驗證碼就領獎，別跟家人講，這是祕密。」下面哪個判斷對？","options":["有急迫、要保密、又要驗證碼，三個訊號都齊了，這是詐騙","有中獎就先領，反正是好事","叫我保密應該是怕別人搶，聽他的比較好"],"answer":0,"why":"「十分鐘內」是製造急迫、「別跟家人講」是要求保密、「給驗證碼」是要重要資料，三個危險訊號同時出現，是典型的詐騙特徵。"}],"color":"#0f766e"},{"id":"sp_verify","name":"查證求助","emoji":"☎️","sub":"不急，自己查、找大人、打165","done":"記住這句：慢一點不吃虧——用官方管道查證，165 和大人都是你的靠山。","steps":[{"type":"teach","kicker":"這個本領","title":"停一下，先查證","text":"詐騙最怕你<b>冷靜</b>。當有人催你「快點」，正好就是要你<b>先停下來</b>的時候。真正的好消息、正經的事，不會因為你多想幾分鐘、多問一個大人就消失。","svg":""},{"type":"teach","kicker":"怎麼做","title":"查證三招","text":"第一招<b>自己找官方管道</b>：要查銀行、學校、賣場的事，用<b>你自己查到的官方電話或網站</b>，<b>不要用對方給你的號碼</b>。第二招<b>打 165</b>：台灣的<b>165 反詐騙專線</b>可以幫你判斷是不是詐騙。第三招<b>問信任的大人</b>：爸媽、老師都可以。<b>就算已經上當了也要馬上說</b>，越早講越能補救，<b>不要因為怕被罵就藏起來</b>——把事情擋下來，比面子重要。","svg":""},{"type":"quiz","kicker":"換你試試","title":"小雨接到電話，對方自稱是「銀行」，說她的帳戶有問題，還給了一支電話叫她回撥。她最好怎麼做？","options":["直接回撥對方給的那支電話問清楚","先掛掉，用自己查到的銀行官方電話或打165確認","對方是銀行應該不會騙人，照做就好"],"answer":1,"why":"對方提供的電話可能也是假的；用自己查到的官方電話或撥打165確認，才能避免被同一夥人繼續誤導。"}],"color":"#0f766e"},{"id":"sp_report","name":"說得清楚","emoji":"🗣️","sub":"冷靜把「人事時地物」講明白，別一問三不知","done":"記住這句：先深呼吸，再按人事時地物說一遍，別人就幫得上你。","steps":[{"type":"teach","kicker":"這個本領","title":"說清楚，別人才幫得上","text":"事情發生後，大人、老師、警察想幫你，第一件事就是問「發生什麼事？」。如果你緊張到<b>一問三不知</b>，幫忙的人也很難使上力。<b>把事情說清楚</b>，就是把幫助拉到你身邊。","svg":""},{"type":"teach","kicker":"怎麼做","title":"先深呼吸，再說五格","text":"第一步<b>深呼吸</b>，讓自己稍微冷靜，慢慢說沒關係。第二步照<b>人、事、時、地、物</b>的順序講：<b>誰</b>、發生了<b>什麼事</b>、<b>什麼時候</b>、在<b>哪裡</b>、有沒有相關的<b>東西</b>。不確定的地方就老實說「我不太確定」，<b>別亂猜當成真的</b>。講重點、講你親眼看到的，比講一長串更有用。","svg":""},{"type":"quiz","kicker":"換你試試","title":"小傑放學路上看到同學的腳踏車被人推倒弄壞了，回去要跟老師說。哪一種說法最能幫上忙？","options":["老師，剛剛外面發生了一件很誇張的事！","大概四點在校門口右邊，一個穿藍衣服的大哥哥把小明的腳踏車推倒，車籃壞了","反正就是有人弄壞東西啦，我也講不清楚"],"answer":1,"why":"這個說法把時間、地點、對方特徵、發生的事和受損的物品都講到了，老師能據此了解狀況並處理。"}],"color":"#0f766e"},{"id":"sp_record","name":"留個紀錄","emoji":"📝","sub":"重要的事別只用口頭，白紙黑字讓紀錄替你說話","done":"記住這句：說好的事寫一下、記一下，日後有誤會，紀錄會說話。","steps":[{"type":"teach","kicker":"這個本領","title":"為什麼要留紀錄","text":"這不是不相信別人——大部分的約定都會好好被遵守。只是<b>人都會忘記</b>，記錯了就容易有誤會。<b>把重要的事留個紀錄</b>，是一種讓大家都輕鬆、都安心的好習慣，長大後保護自己也用得到。","svg":""},{"type":"teach","kicker":"怎麼做","title":"生活裡的小紀錄","text":"<b>借還東西記一下</b>：借出或借回，寫張小紙條或傳個訊息「幾號借了什麼給誰」。<b>約定的事留個訊息</b>：說好的時間、地點、要帶的東西，用訊息留著，比只用嘴巴講可靠。<b>重要的事別只靠口頭</b>：例如答應交作業、分工合作，寫下來大家看得到。這樣萬一記憶對不上，<b>紀錄會替你說話</b>，也少了很多爭執。","svg":""},{"type":"quiz","kicker":"換你試試","title":"小玲把心愛的漫畫借給同學，想避免以後說不清誰借了、什麼時候還，最好的做法是？","options":["傳個訊息寫下「幾號借了哪本漫畫、約好哪天還」","什麼都不用做，反正大家都會記得","乾脆不要借，這樣就不會有問題"],"answer":0,"why":"用訊息把借出的日期、物品和歸還時間寫下來，之後就算記憶模糊，也有清楚的紀錄可以對照，減少誤會。"}],"color":"#0f766e"}] };
</script>
