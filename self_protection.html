  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">

  </button>

<main class="shell">
  <section id="screen-menu" class="cn-screen active cn-wrap">
    <div class="cn-topbar"><span class="cn-title">留心眼・觀察與自我保護 🔎</span></div>
    <div class="cn-hello"><span class="cn-mascot" aria-hidden="true">🔎</span>
      <div><div class="cn-htext" id="hello">世界上大部分的人和地方都是友善又安全的。這裡不是要你害怕，而是幫你多開一盞小燈：學會留意身邊、記住重點、保全證據、看穿詐騙，遇到事情不慌、說得清楚。</div>
      <div class="cn-hsub">每一課都是「先懂這個本領 → 學會怎麼做 → 換你試試」。這些是保護自己、長大也用得到的好習慣。</div></div></div>
    <div class="cn-lessons" id="lesson-list"></div>
    <a class="cn-nextup" href="safety.html"><span class="cn-nextup-ic" aria-hidden="true">🛡️</span><span>想更會保護自己嗎？到「生活安全」看更多 →</span></a>
    <p class="cn-note">這裡是「先學觀念」的教學小旅程，只留在你的裝置上，不影響學習基地的等級或經驗值。</p>
  </section>
  <section id="screen-play" class="cn-screen cn-wrap">
    <div class="cn-topbar"><button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button><span class="cn-title" id="play-title">觀察與自我保護</span></div>
    <div class="cn-progress" id="prog" aria-hidden="true"></div>
    <div id="stage"></div>
  </section>
