<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進階社會探索 🌏</title>
<!-- 統一遊戲化引擎：先載共用設計 token（assets/app.css），再載 HUD/toast 樣式
     （game_core.css），最後同步載入引擎（game_core.js）。
     ─────────────────────────────────────────────────────────────────
     零重複計分論證（本頁定位為「進階挑戰」，完全不餵主 XP）：
       本頁為「社會進階」，計入 social 科目：宣告 body[data-game-wired="social"]，
       每題作答只呼叫一次 Game.recordAnswer('social', 對錯)（answered 旗標鎖定、重試不記帳）。
       「不」呼叫 Game.award / recordSession；進階徽章冊為純本地（自有 key、無 XP），
       故無 double-count，讓學生升上進階內容時獎勵不中斷。
       本頁只「唯讀 / 純提示」使用引擎：Game.showToast（純提示，不記帳）與
       Game.getProfile（唯讀，僅顯示暱稱／可省略）。主題切換完全交給共用
       app-bar 的 [data-theme-toggle]，由 game_core 自動接線，本頁不寫主題 JS。
     獨立 localStorage key：social_adv_progress_v1（與 player_profile_v1 完全區隔）。
     內容政策：全數為可查證之中性事實，不褒貶任何政黨或人物、不主張特定立場；
       兩岸與他國僅以國際上不爭議的事實（年代、地理、條約、貿易、組織）呈現。
     ───────────────────────────────────────────────────────────────── -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* =====================================================================
 * social_advanced.html — 本頁樣式（全部建立在 assets/app.css 的設計 token 上，
 * 因此自動亮/暗色主題化、與學習基地視覺一致）。強調色系採社會科珊瑚色（social）。
 * =================================================================== */

:root {
  --su: var(--c-social);
  --su-tint: var(--tint-social);
  --su-ink: var(--c-social-ink);
  --accent: var(--c-social);
  --accent-ink: var(--c-social-ink);
  --accent-tint: var(--tint-social);
}

body { overflow-x: hidden; }

.ma-topbar { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s4); }
.ma-topbar .ma-title { flex: 1; font-size: var(--fs-h2); font-weight: 800; color: var(--ink); min-width: 0; }

.ma-screen { display: none; animation: ma-fade 0.3s ease; }
.ma-screen.active { display: block; }
@keyframes ma-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .ma-screen { animation: none; } }

.ma-hello { display: flex; align-items: center; gap: var(--s3); padding: var(--s4); background: var(--su-tint); border: 1px solid var(--card-border); border-radius: var(--r-lg); margin-bottom: var(--s4); }
.ma-hello .ma-mascot { font-size: 46px; flex: none; line-height: 1; }
.ma-hello .ma-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.ma-hello .ma-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }

.ma-overview { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s4); flex-wrap: wrap; }
.ma-overview .stat-tile { flex: 1; min-width: 96px; }

.ma-levels { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.ma-level {
  display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4);
  text-align: left; cursor: pointer; border: 2px solid var(--card-border);
  background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  font-family: var(--font); color: var(--ink);
}
.ma-level:hover { box-shadow: var(--shadow-lg); border-color: var(--su); }
.ma-level:active { transform: scale(0.98); }
.ma-level-top { display: flex; align-items: center; gap: var(--s3); }
.ma-level-emoji { font-size: 34px; width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 16px; }
.ma-level-num { font-size: var(--fs-small); font-weight: 700; color: var(--su-ink); }
.ma-level-name { font-size: var(--fs-body); font-weight: 800; color: var(--ink); line-height: 1.25; }
.ma-level-concepts { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; line-height: 1.4; }
.ma-level-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: 2px; }
.ma-level-status { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-small); font-weight: 700; }
.ma-level-status.done { color: var(--c-correct-ink); }
.ma-level-status.todo { color: var(--ink-soft); }
.ma-level-stars { font-size: 16px; letter-spacing: 1px; }


.ma-visual { font-size: clamp(56px, 18vw, 92px); line-height: 1.1; margin: var(--s2) 0 var(--s3); user-select: none; }
.ma-question { font-size: clamp(19px, 4.5vw, 24px); font-weight: 800; color: var(--ink); line-height: 1.6; margin: 0 auto var(--s4); max-width: 42ch; text-align: left; }

.ma-brief { text-align: left; }
.ma-brief h2 { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); margin: 0 0 var(--s3); text-align: center; }
.ma-brief-sub { text-align: center; color: var(--ink-soft); font-weight: 700; font-size: var(--fs-small); margin: 0 0 var(--s3); }
.ma-keyfacts { list-style: none; padding: 0; margin: 0 auto; max-width: 44ch; display: grid; gap: var(--s2); }
.ma-keyfacts li { display: flex; align-items: flex-start; gap: var(--s2); padding: 10px 14px; background: var(--su-tint); border-radius: var(--r-md); font-size: var(--fs-body); font-weight: 700; color: var(--ink); line-height: 1.6; }
.ma-keyfacts li .ma-kf-dot { flex: none; color: var(--su-ink); font-weight: 900; }

.ma-steps { display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: var(--s3); flex-wrap: wrap; }
.ma-steps i { width: 20px; height: 6px; border-radius: 999px; background: var(--card-border); }
.ma-steps i.on { background: var(--su); }
.ma-steps i.cur { background: var(--su); box-shadow: 0 0 0 3px var(--su-tint); }



.ma-opt:active { transform: scale(0.98); }
.ma-opt:disabled { cursor: default; }
/* 作答後高亮：文字用 var(--ink)（亮暗雙主題皆過 AA），對錯以邊框顏色 + ✅/❌ 雙碼標示（不單靠顏色） */
.ma-opt.correct { border-color: var(--c-correct); background: var(--tint-english); color: var(--ink); }
.ma-opt.wrong { border-color: var(--c-wrong); background: rgba(255,118,117,0.12); color: var(--ink); }
.ma-opt.correct .ma-opt-mark { color: var(--c-correct-ink); }
.ma-opt.wrong .ma-opt-mark { color: var(--c-streak-ink); }
.ma-opt .ma-opt-mark { margin-left: auto; font-size: 22px; }


.ma-reveal.show { display: block; animation: ma-fade 0.3s ease; }
@media (prefers-reduced-motion: reduce) { .ma-reveal.show { animation: none; } }

.ma-done { text-align: center; padding: var(--s5) var(--s4); }
.ma-done-emoji { font-size: clamp(64px, 22vw, 100px); }
.ma-done-stars { font-size: 34px; letter-spacing: 4px; margin: var(--s2) 0; }
.ma-done-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); }


.ma-actions .btn { flex: 1; min-width: 140px; }

.ma-footnote { text-align: center; color: var(--ink-soft); font-size: var(--fs-small); margin-top: var(--s5); font-weight: 600; max-width: 34em; margin-inline: auto; }
</style>
</head>
<body data-game-wired="social" data-game-maturity="advanced">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">進階社會探索 🌏</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

  <section id="screen-menu" class="ma-screen active">
    <div class="ma-topbar">
      <span class="ma-title">進階社會探索 🌏</span>
    </div>

    <div class="ma-hello">
      <span class="ma-mascot" aria-hidden="true">🌏</span>
      <div>
        <div class="ma-hello-text" id="hello-text">歡迎來到進階社會！從台灣看見世界，玩得開心最重要。</div>
        <div class="ma-hello-sub" id="hello-sub">還沒開始也沒關係，挑一個等級試試看吧！</div>
      </div>
    </div>

    <div class="ma-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-done">0/6</span><span class="stat-label">完成等級</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-badges">0/7</span><span class="stat-label">收集徽章</span></div>
    </div>

    <div class="ma-levels" id="level-list"><!-- 由 JS 產生 --></div>

    <p class="ma-footnote">這是「進階挑戰」小旅程，這裡的內容都是可查證的中性事實，慢慢玩、盡量想，答錯也沒關係。🌱</p>
    <a class="ma-nextup" href="social_studies.html"><span class="cn-nextup-ic" aria-hidden="true">📝</span><span>覺得太快嗎？先回「社會大冒險：認識我們的台灣」練習打底 ←</span></a>
    <a class="ma-nextup" href="social_concepts.html"><span class="cn-nextup-ic" aria-hidden="true">🧭</span><span>基礎想再穩一點？回「社會觀念養成」用圖複習方位、地圖、時間軸 ←</span></a>
  </section>

  <section id="screen-play" class="ma-screen">
    <div class="ma-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到等級選單">←</button>
      <span class="ma-title" id="play-title">等級</span>
    </div>
    <div class="ma-steps" id="step-dots" aria-hidden="true"></div>
    <div class="play-column">
      <div id="stage"><!-- 由 JS 產生每一題 --></div>
    </div>
  </section>

</main>

<script>
/* =====================================================================
 * 主程式（自足 IIFE）
 *   - 6 個中性等級（等級1..6）、每級 12 題，全部一律解鎖、可自由進入。
 *   - 選項每題 Fisher–Yates 洗牌；answer 為「未洗牌前的 0-based 索引」，
 *     以 data-i 保留原始索引判斷 i===answer，判分不受洗牌影響。
 *   - 每題最多記一次分（answered 旗標守衛）；答錯可再試但只給視覺提示、不加分。
 *   - 獨立 localStorage key：social_adv_progress_v1。
 *   - 計分：本頁定位為「社會進階挑戰」，每題作答呼叫一次 Game.recordAnswer('social', 對錯) 計入 social 科目 XP（answered 旗標鎖定、重試不重複記帳）；不使用 award / recordSession。
 * =================================================================== */
(function () {
  'use strict';

  function toast(msg, kind) {
    try { if (window.Game && Game.showToast) Game.showToast(msg, kind || 'info'); } catch (e) { /* 靜默 */ }
  }

  var PROG_KEY = 'social_adv_progress_v1';
  function loadProg() {
    var p = null;
    try { p = JSON.parse(localStorage.getItem(PROG_KEY)); } catch (e) { p = null; }
    if (!p || typeof p !== 'object') p = {};
    if (typeof p.badges !== 'object' || !p.badges) p.badges = {};
    return p;
  }
  function saveProg(p) {
    try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) { /* 靜默降級 */ }
  }
  var progress = loadProg();

  // =====================================================================
  // 課程內容（全繁體中文；每題事實皆經 WebSearch 查核並雙重審查）。
  //   內容為可查證之中性事實，不褒貶任何政黨或人物、不主張特定立場。
  //   answer = 未洗牌前 options 陣列的 0-based 索引。
  // =====================================================================
  var LEVELS = [
    {
      id: 'lv1', level: 1, name: '台灣這片土地', emoji: '🏝️', color: '#00897b',
      concepts: ['相對位置與海洋', '地形與山脈', '氣候與天氣', '河流與離島', '行政區域概念'],
      keyFacts: [
        '台灣位於西太平洋，北回歸線（約北緯 23.5 度）橫越中南部，把氣候分成北邊亞熱帶、南邊熱帶。',
        '西邊隔著台灣海峽與亞洲大陸相望，東邊面向遼闊的太平洋。',
        '中央山脈像脊椎一樣縱貫南北，有「台灣屋脊」之稱；較大的平原多集中在西部。',
        '全台最高峰是玉山（約 3952 公尺），屬於玉山山脈。',
        '夏秋常有颱風，約五、六月有梅雨；濁水溪是台灣最長的河流。',
        '離島有澎湖、金門、馬祖、蘭嶼、綠島；直轄市目前有台北、新北、桃園、台中、台南、高雄六個。'
      ],
      questions: [
        { q: '台灣島大致位於哪一個大洋的西側？', options: ['西太平洋', '印度洋', '大西洋', '北冰洋'], answer: 0, why: '台灣位在亞洲大陸東緣、太平洋的西側，屬西太平洋島嶼。' },
        { q: '北回歸線橫越台灣，它大致把台灣的氣候分成哪兩種？', options: ['北邊亞熱帶、南邊熱帶', '東邊寒帶、西邊溫帶', '全島都是寒帶', '全島都是沙漠氣候'], answer: 0, why: '北回歸線（約北緯 23.5 度）以北偏亞熱帶、以南偏熱帶。' },
        { q: '台灣島的西邊，隔著哪一片海域與亞洲大陸相望？', options: ['台灣海峽', '太平洋', '地中海', '紅海'], answer: 0, why: '台灣海峽位在台灣與亞洲大陸之間，是西側的海域。' },
        { q: '站在台灣東岸向外望，面對的是哪一個大洋？', options: ['大西洋', '印度洋', '太平洋', '北冰洋'], answer: 2, why: '台灣東側直接面向太平洋，海岸外海水很深。' },
        { q: '台灣最高的山峰是哪一座？', options: ['阿里山', '玉山', '合歡山', '陽明山'], answer: 1, why: '玉山主峰約 3952 公尺，是台灣第一高峰。' },
        { q: '有「台灣屋脊」之稱、大致由北到南縱貫全島的山脈是哪一條？', options: ['海岸山脈', '雪山山脈', '中央山脈', '阿里山山脈'], answer: 2, why: '中央山脈南北縱走，像脊梁般貫穿全島。' },
        { q: '台灣面積較大的平原（例如嘉南平原）主要分布在島的哪一側？', options: ['西部', '東部', '正中央的高山區', '北部外海'], answer: 0, why: '高山偏東，河流沖積出的大平原多集中在西部。' },
        { q: '夏天到秋天，常從海上生成、為台灣帶來強風豪雨的天氣現象是？', options: ['颱風', '沙塵暴', '極光', '寒流'], answer: 0, why: '颱風多在夏秋形成於太平洋，常帶來強風與豪雨。' },
        { q: '每年約五、六月，台灣常出現一段連續多雨的天氣，稱為什麼？', options: ['乾季', '梅雨', '焚風', '冰風暴'], answer: 1, why: '春末夏初鋒面滯留，帶來連續降雨，稱為梅雨。' },
        { q: '台灣最長的河流是哪一條？', options: ['淡水河', '高屏溪', '濁水溪', '大甲溪'], answer: 2, why: '濁水溪約 186 公里，是台灣最長的河流。' },
        { q: '位於台灣海峽、由許多島嶼組成、以玄武岩地形聞名的離島縣是？', options: ['蘭嶼', '綠島', '澎湖', '龜山島'], answer: 2, why: '澎湖群島散布在台灣海峽，以柱狀玄武岩地景著名。' },
        { q: '下列哪一個是台灣的「直轄市」？', options: ['高雄市', '嘉義市', '新竹市', '基隆市'], answer: 0, why: '高雄市是六個直轄市之一；嘉義、新竹、基隆為一般市。' }
      ]
    },
    {
      id: 'lv2', level: 2, name: '走向世界地圖', emoji: '🌍', color: '#1e88e5',
      concepts: ['七大洲與五大洋', '赤道與南北半球', '經緯度與時區', '熱帶、溫帶、寒帶', '世界地標與所在洲別'],
      keyFacts: [
        '地球陸地分成七大洲：亞洲、非洲、北美洲、南美洲、南極洲、歐洲、大洋洲。',
        '五大洋中太平洋面積最大；世界最高峰是聖母峰（珠穆朗瑪峰），高約 8849 公尺。',
        '赤道是 0 度緯線，把地球分成北半球和南半球，台灣位於北半球。',
        '經線（經度）用來劃分時區，0 度經線（本初子午線）通過英國的格林威治。',
        '從赤道往兩極，氣候大致分成熱帶、溫帶、寒帶三種。'
      ],
      questions: [
        { q: '地球上的陸地分成七大洲，其中面積最大的是哪一洲？', options: ['亞洲', '非洲', '歐洲', '大洋洲'], answer: 0, why: '亞洲面積最大，約占全球陸地的三成。' },
        { q: '世界五大洋中，面積最大的是哪一個？', options: ['大西洋', '太平洋', '印度洋', '北冰洋'], answer: 1, why: '太平洋是面積最大、也最深的海洋。' },
        { q: '赤道把地球分成哪兩個半球？', options: ['東半球和西半球', '南半球和北半球', '上半球和下半球', '內半球和外半球'], answer: 1, why: '赤道是 0 度緯線，把地球分成南、北半球。' },
        { q: '以赤道來區分，台灣位於哪一個半球？', options: ['北半球', '南半球', '剛好在赤道上', '南極洲'], answer: 0, why: '台灣在北回歸線附近，位於北半球。' },
        { q: '目前公認世界上最高的山峰是哪一座？', options: ['聖母峰（珠穆朗瑪峰）', '玉山', '富士山', '阿爾卑斯山的白朗峰'], answer: 0, why: '聖母峰高約 8849 公尺，是世界最高峰。' },

        '台灣的正式邦交國數目相對較少，常以「中華台北」等名義參與國際活動。',
        '台灣位於板塊交界帶，地震較多；夏秋季常受颱風影響。'
      ],
      questions: [
        { q: '台灣是海島型國家，它的經濟發展特別依賴下列哪一項？', options: ['對外貿易：把商品賣到國外，也從國外買東西', '完全自己生產，不和別的國家往來', '只靠國內觀光，不做買賣', '只靠農業就能自給自足'], answer: 0, why: '台灣市場小、天然資源少，靠進出口貿易帶動經濟。' },
        { q: '台灣和外國之間大量的貨物，主要是用什麼方式運送？', options: ['海運：由貨船經過港口進出', '主要靠人力用背的', '主要靠腳踏車運送', '靠小溪裡的竹筏'], answer: 0, why: '台灣四面環海，港口與貨船是進出口貨物的主要通道。' },
        { q: '下列哪一個產業，讓台灣在全世界扮演很關鍵的角色？', options: ['半導體（晶片）製造', '冰淇淋製造', '雨傘製造', '風箏製造'], answer: 0, why: '台灣的晶片產量在全球舉足輕重，許多國家都需要。' },
        { q: '台灣製造的晶片，最主要用在下列哪一類東西裡面？', options: ['電腦、手機等電子產品', '木頭做的桌椅', '棉花做的衣服', '玻璃做的杯子'], answer: 0, why: '晶片是電腦、手機等電子產品運作的核心零件。' },
        { q: '關於台灣的人口與文化，下列敘述何者正確？', options: ['由閩南、客家、原住民、新住民等多個族群共同組成', '全部都是同一個族群，文化完全一樣', '台灣沒有任何原住民', '台灣只有外國人居住'], answer: 0, why: '台灣是多元族群社會，各族群有不同的語言與文化。' },
        { q: '關於台灣的原住民族，下列敘述何者正確？', options: ['是很早就住在台灣的居民，擁有多種語言和文化', '是最近幾年才從外國搬來的', '全部只有一族、只講一種話', '完全沒有自己的傳統文化'], answer: 0, why: '原住民族是台灣最早的住民之一，分成多族、各有獨特文化。' },
        { q: '目前世界上和台灣維持「正式邦交」的國家數目，和多數大國相比是？', options: ['比較少', '全世界最多', '剛好是所有國家的一半', '一個都沒有'], answer: 0, why: '這是可查證的中性事實：台灣的正式邦交國數目相對較少。' },
        { q: '台灣的運動員參加奧林匹克運動會時，常使用下列哪一個名義？', options: ['中華台北（Chinese Taipei）', '太平洋聯邦', '北極共和國', '地中海王國'], answer: 0, why: '因國際現況，台灣常以「中華台北」的名義參與奧運等國際活動。' },
        { q: '台灣本身的石油、天然氣等能源很少，這些能源主要怎麼來？', options: ['大部分從國外進口', '全部由台灣自己開採，完全不用進口', '從月球運來', '台灣完全不需要能源'], answer: 0, why: '台灣天然資源有限，將近 98% 的能源仰賴進口。' },
        { q: '台灣位於板塊交界的位置，因此比較容易發生下列哪一種天然災害？', options: ['地震', '終年不停的沙塵暴', '極地暴風雪', '火山灰終年覆蓋全島'], answer: 0, why: '台灣處在板塊交界帶，發生地震的機會較高。' },
        { q: '每年從夏天到秋天，常帶著強風和豪雨侵襲台灣的天氣現象是？', options: ['颱風', '下大雪', '永遠不會天黑的永晝', '海水結冰'], answer: 0, why: '台灣夏秋季位於颱風路徑上，常受颱風影響。' },
        { q: '地震發生、東西開始搖晃時，學校教的正確保命動作是？', options: ['趴下、掩護、穩住（躲到桌子下並抓緊）', '趕快去搭電梯下樓', '站到窗戶旁邊往外看', '在教室裡跑來跑去'], answer: 0, why: '「趴下、掩護、穩住」能保護頭頸，是地震時的標準防護動作。' }
      ]
    }
  ];

  var BADGES = [
    { id: 'lv1', icon: '🏝️', name: '寶島領航員' },
    { id: 'lv2', icon: '🌍', name: '世界探險家' },
    { id: 'lv3', icon: '🕰️', name: '時光旅人' },
    { id: 'lv4', icon: '🏛️', name: '文明說書人' },
    { id: 'lv5', icon: '🗳️', name: '民主小公民' },
    { id: 'lv6', icon: '🌏', name: '全球視野家' },
    { id: 'all', icon: '🏆', name: '社會通達人' }
  ];
  var BADGE_BY_ID = {};
  for (var bi = 0; bi < BADGES.length; bi++) BADGE_BY_ID[BADGES[bi].id] = BADGES[bi];

  var $ = function (id) { return document.getElementById(id); };
  var screenMenu = $('screen-menu');
  var screenPlay = $('screen-play');
  var levelList = $('level-list');
  var stage = $('stage');
  var stepDots = $('step-dots');
  var playTitle = $('play-title');

  var cur = null;

  function starsFor(correct, total) {
    if (total <= 0) return 0;
    var r = correct / total;
    if (r >= 0.9) return 3;
    if (r >= 0.6) return 2;
    if (r > 0) return 1;
    return 0;
  }
  function starStr(n) {
    var s = '';
    for (var i = 0; i < 3; i++) s += (i < n ? '⭐' : '☆');
    return s;
  }

  function awardBadge(id) {
    var def = BADGE_BY_ID[id];
    if (!def) return;
    if (progress.badges[id]) return;
    progress.badges[id] = true;
    saveProg(progress);
    toast('獲得徽章：' + def.icon + ' ' + def.name, 'badge');
    try { if (window.SocialAdvBadges) SocialAdvBadges.refresh(); } catch (e) {}
  }
  function badgeCount() {
    var n = 0;
    for (var i = 0; i < BADGES.length; i++) if (progress.badges[BADGES[i].id]) n++;
    return n;
  }

  function renderMenu() {
    var doneCount = 0;
    for (var i = 0; i < LEVELS.length; i++) if (progress[LEVELS[i].id] && progress[LEVELS[i].id].done) doneCount++;
    $('ov-done').textContent = doneCount + '/' + LEVELS.length;
    $('ov-badges').textContent = badgeCount() + '/' + BADGES.length;

    if (doneCount > 0) {
      $('hello-text').textContent = '歡迎回來！你已完成 ' + doneCount + ' 個等級，很棒！';
      $('hello-sub').textContent = (doneCount >= LEVELS.length)
        ? '六個等級都完成了，你是進階社會達人！🏆'
        : '想挑戰哪一個等級都可以，答錯也沒關係。';
    }

    levelList.innerHTML = '';
    for (var u = 0; u < LEVELS.length; u++) {
      (function (lv) {
        var rec = progress[lv.id] || {};
        var done = !!rec.done;
        var total = lv.questions.length;
        var st = done ? starsFor(rec.best || 0, total) : 0;
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'ma-level';
        card.setAttribute('aria-label', '等級 ' + lv.level + '：' + lv.name);
        card.innerHTML =
          '<div class="ma-level-top">' +
            '<span class="ma-level-emoji" aria-hidden="true" style="background:' + lv.color + '22;color:' + lv.color + '">' + lv.emoji + '</span>' +
            '<div>' +
              '<div class="ma-level-num">等級 ' + lv.level + '</div>' +
              '<div class="ma-level-name">' + lv.name + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="ma-level-concepts">' + lv.concepts.join('・') + '</div>' +
          '<div class="ma-level-foot">' +
            '<span class="ma-level-status ' + (done ? 'done' : 'todo') + '">' +
              (done ? '✅ 已完成（最佳 ' + (rec.best || 0) + '/' + total + '）' : '▶️ 開始挑戰（共 ' + total + ' 題）') + '</span>' +
            '<span class="ma-level-stars" aria-hidden="true">' + (done ? starStr(st) : '') + '</span>' +
          '</div>';
        card.addEventListener('click', function () { startLevel(lv); });
        levelList.appendChild(card);
      })(LEVELS[u]);
    }
  }

  function show(screen) {
    screenMenu.classList.remove('active');
    screenPlay.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0, 0);
  }

  function startLevel(lv) {
    cur = { level: lv, idx: 0, correctCount: 0, phase: 'brief' };
    playTitle.textContent = lv.emoji + ' 等級 ' + lv.level + '・' + lv.name;
    show(screenPlay);
    renderBrief();
  }

  function renderStepDots() {
    stepDots.innerHTML = '';
    if (cur.phase !== 'quiz') return;
    for (var i = 0; i < cur.level.questions.length; i++) {
      var b = document.createElement('i');
      if (i < cur.idx) b.className = 'on';
      else if (i === cur.idx) b.className = 'cur';
      stepDots.appendChild(b);
    }
  }

  function renderBrief() {
    renderStepDots();
    var lv = cur.level;
    var facts = '';
    for (var i = 0; i < lv.keyFacts.length; i++) {
      facts += '<li><span class="ma-kf-dot" aria-hidden="true">◆</span><span>' + lv.keyFacts[i] + '</span></li>';
    }
    stage.innerHTML =
      '<div class="ma-stage ma-brief">' +
        '<div class="ma-visual" aria-hidden="true">' + lv.emoji + '</div>' +
        '<h2>等級 ' + lv.level + '・' + lv.name + '</h2>' +
        '<p class="ma-brief-sub">先看看這一級的重點，再開始 ' + lv.questions.length + ' 題挑戰。</p>' +
        '<ul class="ma-keyfacts">' + facts + '</ul>' +
      '</div>' +
      '<div class="ma-actions">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-start">開始挑戰 ➡️</button>' +
      '</div>';
    $('btn-start').addEventListener('click', function () {
      cur.phase = 'quiz';
      cur.idx = 0;
      renderQuestion();
    });
  }

  function next() {
    cur.idx++;
    if (cur.idx >= cur.level.questions.length) finishLevel();
    else renderQuestion();
  }

  function renderQuestion() {
    renderStepDots();
    var lv = cur.level;
    var step = lv.questions[cur.idx];

    var order = [];
    for (var oi = 0; oi < step.options.length; oi++) order.push(oi);
    for (var m = order.length - 1; m > 0; m--) {
      var r = Math.floor(Math.random() * (m + 1));
      var tt = order[m]; order[m] = order[r]; order[r] = tt;
    }
    var optsHtml = '';
    for (var k = 0; k < order.length; k++) {
      var origIdx = order[k];
      optsHtml += '<button type="button" class="ma-opt" data-i="' + origIdx + '">' +
        '<span>' + step.options[origIdx] + '</span><span class="ma-opt-mark" aria-hidden="true"></span></button>';
    }

    stage.innerHTML =
      '<div class="ma-stage">' +
        '<div class="ma-visual" aria-hidden="true">' + lv.emoji + '</div>' +
        '<p class="ma-question">第 ' + (cur.idx + 1) + ' / ' + lv.questions.length + ' 題　' + step.q + '</p>' +
        '<div class="ma-options">' + optsHtml + '</div>' +
        '<div class="ma-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="ma-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button>' +
      '</div>';

    var answered = false;
    var btns = stage.querySelectorAll('.ma-opt');

    function revealAndLock(correct) {
      var rev = $('reveal');
      rev.textContent = (correct ? '答對了！' : '再想想～正確答案是這個！') + (step.why || '');
      rev.classList.add('show');
      $('afteract').style.display = 'flex';
      var all = stage.querySelectorAll('.ma-opt');
      for (var a = 0; a < all.length; a++) all[a].disabled = true;
    }

    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var i = parseInt(this.getAttribute('data-i'), 10);
        var isCorrect = (i === step.answer);
        if (answered) return;
        answered = true;
        if (window.Game && window.Game.recordAnswer) Game.recordAnswer('social', isCorrect);
        if (isCorrect) {
          this.classList.add('correct');
          this.querySelector('.ma-opt-mark').textContent = '✅';
          cur.correctCount++;
          revealAndLock(true);
        } else {
          this.classList.add('wrong');
          this.querySelector('.ma-opt-mark').textContent = '❌';
          var correctBtn = stage.querySelector('.ma-opt[data-i="' + step.answer + '"]');
          if (correctBtn) {
            correctBtn.classList.add('correct');
            correctBtn.querySelector('.ma-opt-mark').textContent = '✅';
          }
          revealAndLock(false);
        }
      });
    }

    $('btn-next').addEventListener('click', next);
  }

  function finishLevel() {
    var lv = cur.level;
    var total = lv.questions.length;
    var got = cur.correctCount;

    var prev = progress[lv.id] || {};
    progress[lv.id] = { done: true, best: Math.max(prev.best || 0, got) };
    saveProg(progress);

    awardBadge(lv.id);
    var allDone = true;
    for (var i = 0; i < LEVELS.length; i++) if (!(progress[LEVELS[i].id] && progress[LEVELS[i].id].done)) { allDone = false; break; }
    if (allDone) awardBadge('all');

    var st = starsFor(got, total);
    stage.innerHTML =
      '<div class="ma-stage ma-done">' +
        '<div class="ma-done-emoji" aria-hidden="true">🎉</div>' +
        '<div class="ma-done-title">完成「' + lv.name + '」！</div>' +
        '<div class="ma-done-stars" aria-label="得到 ' + st + ' 顆星">' + starStr(st) + '</div>' +
        '<p class="ma-question" style="font-size:clamp(16px,3.6vw,19px);text-align:center">你答對了 ' + got + ' / ' + total + ' 題，真棒！</p>' +
      '</div>' +
      '<div class="ma-actions">' +
        '<button type="button" class="btn" id="btn-menu">回到選單</button>' +
        (nextLevelOf(lv) ? '<button type="button" class="btn btn-primary" id="btn-nextlv">下一個等級 ➡️</button>' : '') +
      '</div>';

    toast('完成「' + lv.name + '」！你答對了 ' + got + ' / ' + total + ' 題，真棒！', 'daily');

    $('btn-menu').addEventListener('click', goMenu);
    var nl = nextLevelOf(lv);
    if (nl) $('btn-nextlv').addEventListener('click', function () { startLevel(nl); });
  }

  function nextLevelOf(lv) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (LEVELS[i].id === lv.id) return LEVELS[i + 1] || null;
    }
    return null;
  }

  function goMenu() {
    cur = null;
    stepDots.innerHTML = '';
    renderMenu();
    show(screenMenu);
  }

  $('btn-back').addEventListener('click', goMenu);

  window.__socialAdv = {
    LEVELS: LEVELS,
    BADGES: BADGES,
    getProgress: function () { return progress; }
  };

  renderMenu();
})();
</script>

<!-- ===== 進階社會徽章冊：樣式（自足、canon 變數、亮暗雙主題、色盲雙碼、[hidden] 防護；純本地、無 XP、無 Game.award） ===== -->
<style>
/* 入口 FAB（右下固定，避開底部安全區）。社會科珊瑚色底較亮，故文字採深色（#4a1a0d）以確保亮暗兩主題皆過 AA 對比。 */
#socialAdvBadgeFab {
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 55; display: inline-flex; align-items: center; gap: 6px;

  background: var(--accent, var(--c-social)); color: #4a1a0d; border: none;
  border-radius: 999px; font-family: var(--font); font-weight: 800;
  font-size: clamp(14px, 3vw, 16px); cursor: pointer; box-shadow: var(--shadow-lg);
}
#socialAdvBadgeFab:active { transform: scale(0.96); }
#socialAdvBadgeFabCount {
  display: inline-flex; align-items: center; gap: 3px;
  background: #fff; color: #8a2d10;
  border-radius: 999px; padding: 1px 8px; font-size: 13px; font-weight: 800;
}
.ma-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
/* [hidden] 防護：class 的 display:flex(author) 特異度會蓋過 UA 的 [hidden]{display:none}，故需更高特異度規則。 */
#socialAdvBadgeOverlay[hidden] { display: none !important; }
.ma-card { position: relative; background: var(--card); border: 2px solid var(--card-border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 20px 18px 22px; color: var(--ink); }
.ma-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ma-card-head h1 { font-size: clamp(1.1rem, 4vw, 1.4rem); font-weight: 800; margin: 0; color: var(--ink); flex: 1; }
.ma-card-back { background: var(--card); border: 2px solid var(--card-border); color: var(--accent-ink, var(--c-social-ink)); font-family: var(--font); font-weight: 800; font-size: 15px; cursor: pointer; min-height: 44px; padding: 8px 14px; border-radius: 14px; }
.ma-card-back:active { transform: scale(0.96); }
.ma-card-note { background: var(--accent-tint); color: var(--ink); border-radius: var(--r-md, 12px); font-size: var(--fs-small); font-weight: 600; line-height: 1.7; padding: 10px 12px; margin: 4px 0 12px; }
.ma-card-summary { text-align: center; font-size: var(--fs-small); font-weight: 700; color: var(--ink-soft); margin: 4px 0 14px; line-height: 1.7; }
.ma-badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
.ma-badge { position: relative; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 14px; background: var(--card); border: 2px solid var(--card-border); text-align: center; padding: 10px 6px; }
.ma-badge .ma-badge-glyph { font-size: clamp(1.6rem, 7vw, 2rem); line-height: 1; }
.ma-badge .ma-badge-name { font-size: clamp(0.6rem, 2.6vw, 0.74rem); font-weight: 800; color: var(--ink); line-height: 1.2; }
.ma-badge .ma-badge-state { font-size: clamp(0.52rem, 2.2vw, 0.64rem); font-weight: 700; color: var(--ink-soft); }
.ma-badge.locked { border-style: dashed; opacity: 0.5; filter: grayscale(1); }
.ma-badge.unlocked { box-shadow: 0 0 0 2px #f5b301, 0 0 10px rgba(245,179,1,0.5); background: color-mix(in srgb, #f5b301 12%, var(--card)); }
.ma-badge.unlocked .ma-badge-star { position: absolute; right: 5px; top: 4px; font-size: 14px; }
</style>
<!-- ===== 進階社會徽章冊：模組（自足 IIFE；讀寫共享獨立 key social_adv_progress_v1；純本地、只增不減、無 XP、無 Game.award、無 streak） ===== -->
<script>
(function () {
  'use strict';

  function api() { return window.__socialAdv || null; }

  function unlockedCount() {
    var a = api(); if (!a) return 0;
    var prog = a.getProgress();
    var n = 0;
    for (var i = 0; i < a.BADGES.length; i++) if (prog.badges[a.BADGES[i].id]) n++;
    return n;
  }

  function renderGrid() {
    var a = api(); if (!a) return;
    var prog = a.getProgress();
    var host = document.getElementById('socialAdvBadgeGrid');
    if (!host) return;
    var html = '';
    for (var i = 0; i < a.BADGES.length; i++) {
      var def = a.BADGES[i];
      var got = !!prog.badges[def.id];
      var cls = 'ma-badge ' + (got ? 'unlocked' : 'locked');
      var glyph = got ? def.icon : '🔒';
      var state = got ? '已收集' : '尚未解鎖';
      var star = got ? '<span class="ma-badge-star" aria-hidden="true">★</span>' : '';
      var label = def.name + '（' + state + '）';
      html += '<div class="' + cls + '" title="' + label + '" aria-label="' + label + '">' +
        '<span class="ma-badge-glyph" aria-hidden="true">' + glyph + '</span>' +
        '<span class="ma-badge-name">' + def.name + '</span>' +
        '<span class="ma-badge-state">' + state + '</span>' + star + '</div>';
    }
    host.innerHTML = html;
  }

  function renderSummary() {
    var a = api(); if (!a) return;
    var el = document.getElementById('socialAdvBadgeSummary');
    if (!el) return;
    el.innerHTML = '已收集 <b>' + unlockedCount() + '</b> / ' + a.BADGES.length +
      ' 枚徽章（收藏只增不減，慢慢玩就好）';
  }

  function updateFabCount() {
    var a = api(); if (!a) return;
    var badge = document.getElementById('socialAdvBadgeFabCount');
    if (badge) badge.textContent = unlockedCount() + '/' + a.BADGES.length;
  }

  function refresh() { updateFabCount(); if (isOpen()) { renderGrid(); renderSummary(); } }
  function isOpen() { var el = document.getElementById('socialAdvBadgeOverlay'); return el && !el.hidden; }
  function openBook() { renderGrid(); renderSummary(); var o = document.getElementById('socialAdvBadgeOverlay'); if (o) o.hidden = false; }
  function closeBook() { var o = document.getElementById('socialAdvBadgeOverlay'); if (o) o.hidden = true; }

  function buildDom() {
    var host = document.createElement('div');
    host.innerHTML =
      '<button id="socialAdvBadgeFab" type="button" aria-label="打開進階社會徽章冊" onclick="SocialAdvBadges.openBook()">' +
        '🏅 徽章冊 <span id="socialAdvBadgeFabCount">0/7</span></button>' +
      '<div id="socialAdvBadgeOverlay" class="ma-overlay" hidden>' +
        '<div class="ma-card" role="dialog" aria-modal="true" aria-label="進階社會徽章冊">' +
          '<div class="ma-card-head"><h1>🏅 進階社會徽章冊</h1>' +
            '<button class="ma-card-back" onclick="SocialAdvBadges.closeBook()">← 返回</button></div>' +
          '<div class="ma-card-note">這本徽章冊只存在你自己的裝置上，純粹紀念你完成過哪些進階等級。它不會計入學習基地的等級或經驗值——放輕鬆挑戰就好 🌱</div>' +
          '<div id="socialAdvBadgeSummary" class="ma-card-summary"></div>' +
          '<div id="socialAdvBadgeGrid" class="ma-badge-grid"></div>' +
        '</div></div>';
    while (host.firstChild) document.body.appendChild(host.firstChild);
  }

  window.SocialAdvBadges = { openBook: openBook, closeBook: closeBook, refresh: refresh };

  function boot() { buildDom(); updateFabCount(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
