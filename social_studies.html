<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社會大冒險 · 我們的台灣 🗺️</title>
<!-- 統一遊戲化引擎：先載共用設計 token（assets/app.css），再載 HUD/toast 樣式
     （game_core.css），最後同步載入引擎（game_core.js）。
     本頁為全新頁面（greenfield），沒有任何 legacy 資料來源，因此「不」宣告
     data-game-wired；只透過 Game.recordAnswer('social', ...) 即時記帳。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<style>
/* =====================================================================
 * social_studies.html — 本頁樣式（全部建立在 assets/app.css 的設計 token 上，
 * 因此自動亮/暗色主題化、與學習基地視覺一致）。
 * =================================================================== */

/* 本頁強調色沿用社會科土色赭紅 --c-social。 */
:root { --su: var(--c-social); --su-tint: var(--tint-social); }

body { overflow-x: hidden; }

/* 頁面頂列（返回、標題、主題切換） */
.su-topbar {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s4);
}
.su-topbar .su-title {
  flex: 1;
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--ink);
  min-width: 0;
}

/* 螢幕切換 */
.su-screen { display: none; animation: su-fade 0.3s ease; }
.su-screen.active { display: block; }
@keyframes su-fade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .su-screen { animation: none; }
}

/* 吉祥物歡迎卡 */
.su-hello {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s4);
  background: var(--su-tint);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  margin-bottom: var(--s4);
}
.su-hello .su-mascot { font-size: 46px; flex: none; line-height: 1; }
.su-hello .su-hello-text { font-size: var(--fs-body); font-weight: 700; color: var(--ink); }
.su-hello .su-hello-sub { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }

/* 單元選單 grid */
.su-units {
  display: grid;
  gap: var(--s4);
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.su-unit {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  padding: var(--s4);
  text-align: left;
  cursor: pointer;
  border: 2px solid var(--card-border);
  background: var(--card);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  font-family: var(--font);
  color: var(--ink);
}
.su-unit:hover { box-shadow: var(--shadow-lg); border-color: var(--su); }
.su-unit:active { transform: scale(0.98); }
.su-unit-top { display: flex; align-items: center; gap: var(--s3); }
.su-unit-emoji {
  font-size: 34px;
  width: 56px; height: 56px;
  flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--su-tint);
  border-radius: 16px;
}
.su-unit-num { font-size: var(--fs-small); font-weight: 700; color: var(--c-social-ink); }
.su-unit-name { font-size: var(--fs-body); font-weight: 800; color: var(--ink); line-height: 1.25; }
.su-unit-game { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; }
.su-unit-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: 2px; }
.su-unit-status {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--fs-small); font-weight: 700;
  flex: none; white-space: nowrap;
}
.su-unit-status.done { color: var(--c-correct-ink); }
.su-unit-status.todo { color: var(--ink-soft); }
.su-unit-dots {
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 3px;
  flex: 1 1 auto; min-width: 0;
}
.su-unit-dots i {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--card-border); display: inline-block;
}
.su-unit-dots i.on { background: var(--su); }

/* 進行中：一句一畫面的大卡 */

.su-visual {
  font-size: clamp(64px, 22vw, 108px);
  line-height: 1.1;
  margin: var(--s2) 0 var(--s3);
  user-select: none;
}
.su-sentence {
  font-size: clamp(19px, 4.5vw, 24px);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.45;
  margin: 0 auto var(--s4);
  max-width: 32ch;
}
.su-toolrow { display: flex; justify-content: center; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s3); }

/* 進度：本單元第幾步 */
.su-steps {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-bottom: var(--s3);
}
.su-steps i { width: 22px; height: 6px; border-radius: 999px; background: var(--card-border); }
.su-steps i.on { background: var(--su); }
.su-steps i.cur { background: var(--su); box-shadow: 0 0 0 3px var(--su-tint); }

/* 選項按鈕（tap 作答；命中區 ≥56px） */


.su-opt:active { transform: scale(0.98); }
.su-opt:disabled { cursor: default; }
.su-opt.correct { border-color: var(--c-correct); background: var(--tint-english); color: var(--ink); }
.su-opt.wrong { border-color: var(--c-wrong); background: rgba(255,118,117,0.12); color: var(--ink); }
.su-opt .su-opt-mark { margin-left: auto; font-size: 22px; }

/* 揭示區（tap-to-reveal 事實 / 答案解說） */
.su-reveal { max-width: min(100%, 44em); margin-inline: auto; 
  margin-top: var(--s4);
  padding: var(--s3) var(--s4);
  background: var(--su-tint);
  border-radius: var(--r-md);
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.55;
  text-align: left;
  display: none;
}
.su-reveal.show { display: block; animation: su-fade 0.3s ease; }
@media (prefers-reduced-motion: reduce) { .su-reveal.show { animation: none; } }

/* 排序遊戲 */
.su-order-slots, .su-order-pool { display: flex; flex-direction: column; gap: var(--s2); }
.su-order-slots { margin: var(--s3) 0; min-height: 8px; }
.su-slot {
  min-height: 52px;
  border: 2px dashed var(--card-border);
  border-radius: 14px;
  display: flex; align-items: center; gap: var(--s2);
  padding: 10px 14px;
  color: var(--ink-soft);
  font-weight: 700;
  font-size: var(--fs-small);
}
.su-slot .su-slot-idx {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  background: var(--su-tint); color: var(--c-social-ink);   /* 亮 4.98:1 on tint / 暗 6.48:1，取代原 --su(#e17055) 2.73:1 未達 AA */
  display: flex; align-items: center; justify-content: center; font-weight: 800;
}
.su-chip-btn {
  min-height: 52px;
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--card-border);
  border-radius: 14px;
  background: var(--card);
  color: var(--ink);
  font-family: var(--font);
  font-size: clamp(15px, 3.2vw, 18px);
  font-weight: 700;
  text-align: left;
  cursor: pointer;
}
.su-chip-btn:active { transform: scale(0.98); }
.su-chip-btn.placed { border-color: var(--su); background: var(--su-tint); }
.su-order-pool-label, .su-order-slots-label {
  font-size: var(--fs-small); color: var(--ink-soft); font-weight: 700; text-align: left; margin-top: var(--s2);
}

/* 收集圖鑑（原住民族） */
.su-collect { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin: var(--s3) 0; }
.su-collect-card {
  padding: var(--s3);
  border: 2px solid var(--card-border);
  border-radius: var(--r-md);
  background: var(--card);
  text-align: center;
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.2s ease;
}
.su-collect-card:active { transform: scale(0.97); }
.su-collect-card.opened { border-color: var(--su); background: var(--su-tint); }
.su-collect-emoji { font-size: 40px; }
.su-collect-name { font-weight: 800; color: var(--ink); margin-top: 4px; }
.su-collect-fact { font-size: var(--fs-small); color: var(--ink-soft); font-weight: 600; margin-top: 4px; display: none; }
.su-collect-card.opened .su-collect-fact { display: block; }

/* 名片產生器 */
.su-namecard {
  margin: var(--s3) auto 0;
  max-width: 360px;
  padding: var(--s4);
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--su-tint), var(--card));
  border: 2px solid var(--su);
  text-align: center;
}
.su-namecard .nc-emoji { font-size: 46px; }
.su-namecard .nc-line { font-weight: 800; color: var(--ink); margin-top: 6px; font-size: var(--fs-body); }
.su-select {
  min-height: 52px; width: 100%;
  padding: 12px 14px; border-radius: 14px;
  border: 2px solid var(--card-border);
  background: var(--card); color: var(--ink);
  font-family: var(--font); font-size: var(--fs-body); font-weight: 700;
}

/* 完成畫面 */
.su-done { text-align: center; padding: var(--s5) var(--s4); }
.su-done-emoji { font-size: clamp(64px, 22vw, 100px); }
.su-done-stars { font-size: 34px; letter-spacing: 4px; margin: var(--s2) 0; }
.su-done-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); }

/* 底部行動列 */

.su-actions .btn { flex: 1; min-width: 140px; }

/* 進度總覽小列 */
.su-overview {
  display: flex; align-items: center; gap: var(--s3);
  margin-bottom: var(--s4); flex-wrap: wrap;
}
.su-overview .stat-tile { flex: 1; min-width: 96px; }

.su-footnote { text-align: center; color: var(--ink-soft); font-size: var(--fs-small); margin-top: var(--s5); font-weight: 600; }
</style>
</head>
<body>
<!-- ===== 共用頂部應用列（全站一致；貼在 <body> 內第一個元素） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">社會大冒險 🗺️</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">

  <!-- ============================= 選單 / 首頁 ============================= -->
  <section id="screen-menu" class="su-screen active">
    <div class="su-topbar">
      <span class="su-title">認識我們的台灣 🗺️</span>
    </div>

    <div class="su-hello">
      <span class="su-mascot" aria-hidden="true">🦉</span>
      <div>
        <div class="su-hello-text" id="hello-text">嗨！我是小社，一起去認識我們的島吧！</div>
        <div class="su-hello-sub" id="hello-sub">選一個單元，玩一玩、學一學。</div>
      </div>
    </div>

    <div class="su-overview">
      <div class="stat-tile"><span class="stat-value" id="ov-done">0/21</span><span class="stat-label">完成單元</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-xp">0</span><span class="stat-label">社會經驗值</span></div>
      <div class="stat-tile"><span class="stat-value" id="ov-streak">0</span><span class="stat-label">連續天數</span></div>
    </div>

    <div class="su-units" id="unit-list"><!-- 由 JS 產生 --></div>

    <p class="su-footnote">台灣是我們的家，這裡有山、有海、有很多不同的人，一起把它變得更好。🌱</p>
    <a class="cn-nextup cn-nextup--back" href="social_concepts.html"><span class="cn-nextup-ic" aria-hidden="true">🧭</span><span>還沒學過嗎？先到「社會觀念養成」用圖學會方位、地圖、時間軸，再回來玩 →</span></a>
    <a class="cn-nextup" href="social_advanced.html"><span class="cn-nextup-ic" aria-hidden="true">🌏</span><span>已經很熟了？來挑戰更難的「進階社會探索」→</span></a>
  </section>

  <!-- ============================= 進行中 ============================= -->
  <section id="screen-play" class="su-screen">
    <div class="su-topbar">
      <button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button>
      <span class="su-title" id="play-title">單元</span>
    </div>
    <div class="su-steps" id="step-dots" aria-hidden="true"></div>
    <div class="play-column">
      <div id="stage"><!-- 由 JS 產生每一步 --></div>
    </div>
  </section>

</main>

<script>
(function () {
  'use strict';

  // ---- 安全呼叫引擎（引擎必定已於 <head> 同步載入，但仍防禦式檢查） ----
  function record(correct) {
    try { if (window.Game && Game.recordAnswer) Game.recordAnswer('social', !!correct); }
    catch (e) { /* 靜默：不阻斷孩子的遊戲 */ }
  }
  function toast(msg, kind) {
    try { if (window.Game && Game.showToast) Game.showToast(msg, kind); } catch (e) {}
  }

  function speak(text) {
    /* 已移除 TTS：本頁非英文發音頁，不需朗讀 */
  }

  // ---- 本頁進度（獨立 key，不與引擎 profile 衝突） ----
  var PROG_KEY = 'social_studies_progress_v1';
  function loadProg() {
    try { return JSON.parse(localStorage.getItem(PROG_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveProg(p) {
    try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) {}
  }
  var progress = loadProg(); // { unitId: { done:true, best: stars } }

  // =====================================================================
  // 課程內容（全繁體中文；史地公民事實以 9–10 歲可懂、且正確為準）
  // step 類型：
  //   fact   一句話 + 大圖 + 可翻開的「看更多」+ TTS
  //   choose 單選題（tap 作答，記一次分）
  //   order  時間排序（tap 建立順序，檢查時記一次分）
  //   collect 圖鑑收集（翻卡）後接一題 choose
  //   namecard 家鄉名片產生器（趣味、不計分）
  // =====================================================================
  var UNITS = [
    {
      id: 'u1', emoji: '🗺️', name: '台灣在哪裡？認識我們的島', game: '地圖尋寶',
      steps: [
        { t: 'fact', v: '🏝️', s: '台灣是一座島，位在亞洲的東邊、太平洋上。',
          more: '島的四周都是海。從空中看，台灣本島的形狀很像一片番薯（地瓜）！' },
        { t: 'choose', v: '🏝️', s: '台灣是什麼呢？',
          opts: ['一座島', '一條大河', '一座高山'], ans: 0,
          why: '沒錯！台灣是一座四面環海的島。' },
        { t: 'choose', v: '🍠', s: '台灣本島的形狀最像下面哪一個？',
          opts: ['一片番薯（地瓜）', '一顆圓球', '一顆星星'], ans: 0,
          why: '對！很多人說台灣像一片番薯，所以也叫「番薯囡仔」。' },
        { t: 'choose', v: '🧭', s: '地圖上「最上面」通常代表哪個方向？',
          opts: ['北方', '南方', '西方'], ans: 0,
          why: '看地圖記住：上北、下南、左西、右東。' },
        { t: 'choose', v: '🌊', s: '台灣的東邊，是一片非常廣大的？',
          opts: ['太平洋', '沙漠', '大草原'], ans: 0,
          why: '台灣東邊是太平洋，是世界上最大的海洋。' },
        { t: 'choose', v: '⛴️', s: '台灣的西邊隔著台灣海峽，對面是哪裡？',
          opts: ['中國', '日本', '美國'], ans: 0,
          why: '台灣海峽對面是中國；兩邊由不同的政府各自治理，遇到不一樣的想法時，用和平的方式面對。' },
        { t: 'choose', v: '🏖️', s: '下面哪一個也是屬於台灣的島嶼？',
          opts: ['蘭嶼', '夏威夷', '峇里島'], ans: 0,
          why: '台灣本島之外，還有澎湖、金門、馬祖、蘭嶼、綠島等許多小島。' }
      ]
    },
    {
      id: 'u2', emoji: '⛰️', name: '高山、河流與海岸：地形與天氣', game: '登山闖關',
      steps: [
        { t: 'fact', v: '🗻', s: '台灣有高山、丘陵、平原、盆地和海岸，地形很多樣。',
          more: '中央山脈像台灣的「屋脊」，從北到南；河流大多從高山流向兩邊的大海。' },
        { t: 'choose', v: '🏔️', s: '台灣最高的山是哪一座？',
          opts: ['玉山', '雪山', '阿里山'], ans: 0,
          why: '玉山高約 3952 公尺，是台灣最高的山；雪山第二高，但還是比玉山矮一些。' },
        { t: 'choose', v: '⛰️', s: '哪一條山脈像台灣的屋脊，縱貫南北？',
          opts: ['中央山脈', '大屯火山', '海岸沙丘'], ans: 0,
          why: '中央山脈從北到南，把台灣分成東、西兩邊。' },
        { t: 'choose', v: '🌾', s: '台灣西部大多是什麼地形？這裡人多、農田也多。',
          opts: ['平原', '高山', '沙漠'], ans: 0,
          why: '西部平原地勢平坦，是台灣人口和農田最多的地方。' },
        { t: 'choose', v: '🏙️', s: '被群山圍住的低地，我們叫它？',
          opts: ['盆地', '海岸', '高原'], ans: 0,
          why: '例如台北盆地，就是被山圍住的一塊低地。' },
        { t: 'choose', v: '🌀', s: '夏天和秋天常來、會帶來強風大雨的是？',
          opts: ['颱風', '下雪', '沙塵暴'], ans: 0,
          why: '颱風會帶來雨水（幫水庫存水），但也可能造成淹水、坍方等災害。' },
        { t: 'choose', v: '🛟', s: '颱風來之前，最聰明、最安全的做法是？',
          opts: ['注意氣象、先準備好儲水和食物', '跑去河邊看大水', '爬到山坡上玩'], ans: 0,
          why: '防颱要點：注意氣象報告、準備儲水儲糧、遠離河邊和山坡，待在安全的地方。' }
      ]
    },
    {
      id: 'u3', emoji: '🏘️', name: '我的家鄉與社區', game: '家鄉名片',
      steps: [
        { t: 'fact', v: '🏙️', s: '台灣有「六都」，是六個最大的直轄市。',
          more: '六都是：台北市、新北市、桃園市、台中市、台南市、高雄市。你的家鄉在哪裡呢？' },
        { t: 'choose', v: '🏙️', s: '台灣的「六都」是指幾個直轄市？',
          opts: ['6 個', '3 個', '10 個'], ans: 0,
          why: '六都就是六個直轄市：台北、新北、桃園、台中、台南、高雄。' },
        { t: 'choose', v: '🌆', s: '下面哪一個是「六都」之一？',
          opts: ['高雄市', '花蓮縣', '宜蘭縣'], ans: 0,
          why: '高雄市是六都之一，位在台灣南部。' },

    {"id":"u18","emoji":"🏮","name":"台灣的節慶與民俗","game":"節慶巡禮","steps":[{"t":"fact","v":"🇹🇼","s":"台灣一年四季都有熱鬧的節慶，融合了漢人習俗與原住民族文化。","more":"從農曆新年的圍爐、元宵的燈火，到端午的龍舟、中秋的月餅，再到媽祖遶境與原住民族的豐年祭，每個節慶都藏著先人的智慧與對生活的祝福，也展現台灣多元共融的美。跟著我們一起去「節慶巡禮」吧！"},{"t":"choose","v":"🍲","s":"除夕（農曆年的最後一天）晚上，全家團聚在一起吃團圓飯的習俗，叫做什麼？","opts":["圍爐","踏青","掃墓"],"ans":0,"why":"除夕全家圍坐一起吃團圓飯稱為「圍爐」，象徵一家團圓、溫暖平安；過年時長輩也會發紅包（壓歲錢），並有舞龍舞獅增添喜氣。"},{"t":"choose","v":"🏮","s":"每年元宵節，新北市哪個地方會施放寫著願望的天燈，吸引許多民眾前往祈福？","opts":["平溪","墾丁","阿里山"],"ans":0,"why":"新北市平溪的天燈聞名全台，人們把心願寫在天燈上施放，祈求平安順利；元宵節也有提燈籠、猜燈謎等傳統活動。"},{"t":"choose","v":"🎆","s":"台南市鹽水區在元宵節時，有一項於廟會中施放大量鞭炮煙火的著名民俗，稱為什麼？","opts":["蜂炮","潑水節","賽龍舟"],"ans":0,"why":"台南鹽水的「蜂炮」是元宵節著名民俗，相傳早年為驅除瘟疫祈求平安而施放；參加時一定要聽從指揮、穿戴防護，注意安全。"},{"t":"choose","v":"🕯️","s":"清明節時，家家戶戶通常會做什麼事來表達對祖先的思念？","opts":["掃墓祭祖","賞月吃月餅","放天燈"],"ans":0,"why":"清明節是慎終追遠的日子，人們會前往祖先的墓地整理環境、祭拜，表達對先人的懷念與感恩之情。"},{"t":"choose","v":"🛶","s":"端午節划龍舟、包粽子的習俗，相傳是為了紀念哪一位古代人物？","opts":["屈原","李白","孔子"],"ans":0,"why":"相傳戰國時代的愛國詩人屈原投江後，人們划船打撈並投粽子入江，後來演變成划龍舟、包粽子的端午習俗；人們也會佩戴香包來驅蟲避邪。"},{"t":"choose","v":"🌕","s":"中秋節除了賞月、吃月餅，台灣家庭近年還很流行哪一種應景活動？當季也常吃柚子。","opts":["烤肉","賽龍舟","潑水"],"ans":0,"why":"中秋節在台灣除了賞月、吃月餅，全家一起烤肉已成為常見的過節方式，當季的柚子也是應景水果，大家團聚同樂、共享天倫。"},{"t":"choose","v":"🏮","s":"每年農曆三月，信眾徒步跟隨媽祖神轎出巡的宗教民俗盛事，稱為什麼？","opts":["媽祖遶境","元宵燈會","豐年祭"],"ans":0,"why":"媽祖遶境是台灣重要的民間信仰活動，信眾徒步隨神轎出巡，祈求平安順利；這是台灣珍貴的民俗文化，大家都可以用尊重與欣賞的心去認識它。"},{"t":"choose","v":"🌾","s":"台灣許多原住民族（例如阿美族）會在夏天舉行「豐年祭」，主要是為了什麼？","opts":["感謝祖靈並慶祝小米等作物豐收","紀念屈原","慶祝農曆新年"],"ans":0,"why":"豐年祭是原住民族重要的傳統祭典，族人以歌舞感謝祖靈庇佑、慶祝豐收並凝聚部落情感；參與或觀賞時，要尊重各族的文化與規矩。"}]},

    {"id":"u20","emoji":"🚄","name":"台灣的交通與生活","game":"交通小達人","steps":[{"t":"fact","v":"🚦","s":"交通工具讓我們上學、上班、探親都更方便，但安全永遠擺第一。","more":"台灣的交通網很綿密：想在西部南來北往、又要又快又準時，可以搭高鐵；想沿著海岸線環島、欣賞風景，可以搭台鐵；在都市裡短程移動，捷運和公車最方便，還能用悠遊卡或一卡通輕鬆刷卡付費。認識這些工具、看懂地址與地圖、遵守紅綠燈與交通規則，戴好安全帽、繫上安全帶，並禮讓需要幫助的人，你就是聰明又貼心的交通小達人！"},{"t":"choose","v":"🚄","s":"想從台北快速到高雄（南來北往走西部），下列哪一種交通工具最適合？","opts":["高鐵","渡輪","纜車"],"ans":0,"why":"台灣高鐵主要沿著西部平原行駛，時速可達每小時約三百公里，是西部長途、講求快速準時時最方便的選擇。"},{"t":"choose","v":"🚞","s":"想沿著海岸線『環島』旅行、慢慢欣賞台灣一圈的風景，最能做到的是哪一種？","opts":["捷運","台鐵（火車）","高鐵"],"ans":1,"why":"台鐵的鐵路網幾乎繞台灣一圈，可以環島；高鐵主要在西部，捷運只在都市範圍內行駛，都無法環島。"},{"t":"choose","v":"💳","s":"在台灣搭捷運、公車時，下列哪一種東西可以『嗶』一下就付車費？","opts":["悠遊卡或一卡通","圖書館借書證","健保卡"],"ans":0,"why":"悠遊卡、一卡通是交通電子票證，可在捷運、公車、台鐵等處感應付費；健保卡和借書證用途不同，不能拿來付車費。"},{"t":"choose","v":"🏠","s":"台灣的地址是由大到小排列的，下列哪一個順序才正確？","opts":["路（街）→縣市→號→鄉鎮區","縣市→鄉鎮區→路（街）→號","號→路（街）→鄉鎮區→縣市"],"ans":1,"why":"地址從最大範圍寫到最小：先縣市，再鄉鎮市區，接著路或街名，最後才是門牌號碼，這樣才能一層層找到正確位置。"},{"t":"choose","v":"🗺️","s":"拿著地圖要找到某個地址，下列哪個做法最能幫你確認找對地方？","opts":["只看路名，不用管門牌號","對照路名和門牌『號』，並注意單號、雙號通常分在馬路兩側","閉著眼睛隨便走走看"],"ans":1,"why":"找路時要同時對照路名和門牌號碼；台灣門牌常以單號、雙號分在馬路的兩側，注意這點就能更快找到目的地。"},{"t":"choose","v":"🚶","s":"走到路口要過馬路時，行人正確又安全的做法是？","opts":["紅燈時趕快衝過去比較快","看到綠燈亮，走行人穿越道（斑馬線），並留意左右來車","從沒有斑馬線的地方直接穿越車陣"],"ans":1,"why":"行人要等行人號誌變綠燈，走斑馬線通過，並先看左右確認車輛停下；紅燈搶快或亂穿馬路都非常危險。"},{"t":"choose","v":"🪖","s":"坐在機車上（不論騎士或後座），為了保護頭部安全，一定要做的是？","opts":["戴好並扣緊安全帽","戴帽子擋太陽就好","把安全帽掛在手把上"],"ans":0,"why":"騎乘機車時，騎士與乘客都必須戴好、扣緊安全帽，萬一發生意外才能保護頭部；這也是台灣的交通法規要求。"},{"t":"choose","v":"💺","s":"下列哪一組『搭車時保護自己與禮讓別人』的做法都正確？","opts":["搭汽車繫好安全帶；看到老人、孕婦、身障者主動禮讓博愛座","上車不繫安全帶，車開了才慢慢找位子","博愛座是專屬座位，其他人一定不能坐"],"ans":0,"why":"搭乘汽車應全程繫安全帶；博愛座是提醒大家優先禮讓給有需要的人（如長者、孕婦、行動不便者），做到這兩點就是既安全又貼心。"}]},

            '<span class="su-unit-dots" aria-hidden="true">' + dots + '</span>' +
          '</div>';
        card.addEventListener('click', function () { startUnit(unit); });
        unitList.appendChild(card);
      })(UNITS[u], u + 1);
    }
  }

  // =====================================================================
  // 遊玩流程
  // =====================================================================
  function show(screen) {
    screenMenu.classList.remove('active');
    screenPlay.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0, 0);
  }

  function startUnit(unit) {
    cur = { unit: unit, idx: 0, correctCount: 0, total: scoringSteps(unit) };
    playTitle.textContent = unit.emoji + ' ' + unit.name;
    show(screenPlay);
    renderStep();
  }

  function renderStepDots() {
    stepDots.innerHTML = '';
    for (var i = 0; i < cur.unit.steps.length; i++) {
      var b = document.createElement('i');
      if (i < cur.idx) b.className = 'on';
      else if (i === cur.idx) b.className = 'cur';
      stepDots.appendChild(b);
    }
  }

  function next() {
    cur.idx++;
    if (cur.idx >= cur.unit.steps.length) finishUnit();
    else renderStep();
  }

  function ttsButton(text) {
    /* 已移除 TTS：本頁非英文發音頁，不再顯示朗讀按鈕 */
    return '';
  }

  function bindTts(root) {
    /* 已移除 TTS：本頁非英文發音頁，無朗讀按鈕可綁定 */
  }

  function renderStep() {
    renderStepDots();
    var step = cur.unit.steps[cur.idx];
    if (step.t === 'fact') return renderFact(step);
    if (step.t === 'choose') return renderChoose(step);
    if (step.t === 'order') return renderOrder(step);
    if (step.t === 'collect') return renderCollect(step);
    if (step.t === 'namecard') return renderNamecard(step);
  }

  // ---- fact ----
  function renderFact(step) {
    stage.innerHTML =
      '<div class="su-stage">' +
        '<div class="su-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="su-sentence">' + step.s + '</p>' +
        '<div class="su-toolrow">' + ttsButton(step.s) +
          '<button type="button" class="btn" id="btn-more">💡 看更多</button></div>' +
        '<div class="su-reveal" id="reveal">' + (step.more || '') + '</div>' +
      '</div>' +
      '<div class="su-actions">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button>' +
      '</div>';
    bindTts(stage);
    $('btn-more').addEventListener('click', function () {
      $('reveal').classList.add('show');
      speak(step.more || step.s);
    });
    $('btn-next').addEventListener('click', next);
  }

  // ---- choose ----
  function renderChoose(step) {
    // 打亂選項顯示順序（避免正解永遠在第一個，孩子才會真的閱讀）。
    // data-i 記的是「原始索引」，因此對答判斷 i === step.ans 仍然正確。
    var order = [];
    for (var oi = 0; oi < step.opts.length; oi++) order.push(oi);
    for (var m = order.length - 1; m > 0; m--) {
      var r = Math.floor(Math.random() * (m + 1));
      var tt = order[m]; order[m] = order[r]; order[r] = tt;
    }
    var optsHtml = '';
    for (var k = 0; k < order.length; k++) {
      var origIdx = order[k];
      optsHtml += '<button type="button" class="su-opt" data-i="' + origIdx + '">' +
        '<span>' + step.opts[origIdx] + '</span><span class="su-opt-mark" aria-hidden="true"></span></button>';
    }
    stage.innerHTML =
      '<div class="su-stage">' +
        '<div class="su-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="su-sentence">' + step.s + '</p>' +
        '<div class="su-toolrow">' + ttsButton(step.s) + '</div>' +
        '<div class="su-options">' + optsHtml + '</div>' +
        '<div class="su-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="su-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">繼續 ➡️</button>' +
      '</div>';
    bindTts(stage);

    var answered = false;
    var btns = stage.querySelectorAll('.su-opt');
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener('click', function () {
        var i = parseInt(this.getAttribute('data-i'), 10);
        var isCorrect = (i === step.ans);
        if (answered) {
          // 已答過（第一次答錯後的重試）：只給視覺提示，不再重複計分。
          if (isCorrect) {
            this.classList.add('correct');
            this.querySelector('.su-opt-mark').textContent = '✅';
            revealAndAdvance(step, true, false);
          } else {
            this.classList.add('wrong');
            this.querySelector('.su-opt-mark').textContent = '❌';
            this.classList.add('is-wrong');
          }
          return;
        }
        answered = true;
        record(isCorrect); // 每題只計一次分（第一次作答）
        if (isCorrect) {
          this.classList.add('correct', 'is-correct');
          this.querySelector('.su-opt-mark').textContent = '✅';
          cur.correctCount++;
          revealAndAdvance(step, true, true);
        } else {
          this.classList.add('wrong', 'is-wrong');
          this.querySelector('.su-opt-mark').textContent = '❌';
          // 標出正解、鼓勵再試（不懲罰）。用原始索引找到正解按鈕（選項已洗牌）。
          var correctBtn = stage.querySelector('.su-opt[data-i="' + step.ans + '"]');
          if (correctBtn) {
            correctBtn.classList.add('correct');
            correctBtn.querySelector('.su-opt-mark').textContent = '✅';
          }
          revealAndAdvance(step, false, true);
        }
      });
    }

    function revealAndAdvance(step, correct, first) {
      var rev = $('reveal');
      rev.textContent = (correct ? '答對了！' : '再想想～答案是這個！') + (step.why || '');
      rev.classList.add('show');
      $('afteract').style.display = 'flex';
      // 停用選項（避免再改動計分），但仍允許看正解顏色。
      var all = stage.querySelectorAll('.su-opt');
      for (var k = 0; k < all.length; k++) all[k].disabled = true;
    }

    $('btn-next').addEventListener('click', next);
  }

  // ---- order（時間排序） ----
  function renderOrder(step) {
    // items 為「正確順序」；打亂成 pool 供孩子選。
    var correct = step.items.slice();
    var pool = correct.slice();
    // Fisher–Yates 洗牌（確保與正解不同）
    do {
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
    } while (pool.join('|') === correct.join('|') && correct.length > 1);

    var slotsHtml = '';
    for (var s = 0; s < correct.length; s++) {
      slotsHtml += '<div class="su-slot" data-slot="' + s + '">' +
        '<span class="su-slot-idx">' + (s + 1) + '</span><span class="su-slot-text">（點下面的卡片放進來）</span></div>';
    }
    var poolHtml = '';
    for (var p = 0; p < pool.length; p++) {
      poolHtml += '<button type="button" class="su-chip-btn" data-name="' + pool[p] + '">' + pool[p] + '</button>';
    }

    stage.innerHTML =
      '<div class="su-stage">' +
        '<div class="su-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="su-sentence">' + step.s + '</p>' +
        '<div class="su-toolrow">' + ttsButton(step.s) + '</div>' +
        '<div class="su-order-slots-label">時間先後（1 最早）：</div>' +
        '<div class="su-order-slots" id="slots">' + slotsHtml + '</div>' +
        '<div class="su-order-pool-label">卡片（點一下放入、再點一下取回）：</div>' +
        '<div class="su-order-pool" id="pool">' + poolHtml + '</div>' +
        '<div class="su-reveal" id="reveal"></div>' +
      '</div>' +
      '<div class="su-actions">' +
        '<button type="button" class="btn" id="btn-check" disabled>檢查答案 ✓</button>' +
        '<button type="button" class="btn btn-primary" id="btn-next" style="display:none">繼續 ➡️</button>' +
      '</div>';
    bindTts(stage);

    var placed = []; // 依序放入的名稱
    var answered = false;

    function refreshCheck() {
      $('btn-check').disabled = (placed.length !== correct.length);
    }
    function renderPlaced() {
      var slots = stage.querySelectorAll('.su-slot');
      for (var s = 0; s < slots.length; s++) {
        var txt = slots[s].querySelector('.su-slot-text');
        if (placed[s]) { txt.textContent = placed[s]; slots[s].style.borderStyle = 'solid'; }
        else { txt.textContent = '（點下面的卡片放進來）'; slots[s].style.borderStyle = 'dashed'; }
      }
    }
    function bindPool() {
      var chips = stage.querySelectorAll('#pool .su-chip-btn');
      for (var c = 0; c < chips.length; c++) {
        chips[c].onclick = function () {
          if (answered) return;
          var name = this.getAttribute('data-name');
          if (this.classList.contains('placed')) {
            // 取回
            this.classList.remove('placed'); this.disabled = false;
            var idx = placed.indexOf(name);
            if (idx !== -1) placed.splice(idx, 1);
          } else {
            this.classList.add('placed'); this.disabled = true;
            placed.push(name);
          }
          renderPlaced(); refreshCheck();
        };
      }
    }
    bindPool();

    $('btn-check').addEventListener('click', function () {
      if (answered) return;
      answered = true;
      var ok = placed.join('|') === correct.join('|');
      record(ok);
      if (ok) cur.correctCount++;
      var rev = $('reveal');
      rev.textContent = (ok ? '排對了！太厲害了！' : '順序不太對喔～') + (step.why || '');
      rev.classList.add('show');
      // 標示正解顏色
      var slots = stage.querySelectorAll('.su-slot');
      for (var s = 0; s < slots.length; s++) {
        slots[s].querySelector('.su-slot-text').textContent = (s + 1) + '. ' + correct[s];
        slots[s].style.borderStyle = 'solid';
        slots[s].style.borderColor = 'var(--c-correct)';
      }
      this.style.display = 'none';
      $('btn-next').style.display = 'inline-flex';
    });
    $('btn-next').addEventListener('click', next);
  }

  // ---- collect（圖鑑收集）+ 後接一題 ----
  function renderCollect(step) {
    var cardsHtml = '';
    for (var i = 0; i < step.cards.length; i++) {
      var c = step.cards[i];
      cardsHtml += '<div class="su-collect-card" data-i="' + i + '" tabindex="0" role="button" aria-label="' + c.n + '">' +
        '<div class="su-collect-emoji" aria-hidden="true">' + c.e + '</div>' +
        '<div class="su-collect-name">' + c.n + '</div>' +
        '<div class="su-collect-fact">' + c.f + '</div>' +
      '</div>';
    }
    stage.innerHTML =
      '<div class="su-stage">' +
        '<div class="su-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="su-sentence">' + step.s + '</p>' +
        '<div class="su-toolrow">' + ttsButton(step.s) + '</div>' +
        '<div class="su-collect" id="collect">' + cardsHtml + '</div>' +
        '<div class="su-reveal" id="reveal">' + (step.why || '') + '</div>' +
      '</div>' +
      '<div class="su-actions" id="afteract" style="display:none">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">全部認識了，繼續 ➡️</button>' +
      '</div>';
    bindTts(stage);

    var opened = {};
    var totalCards = step.cards.length;
    var scored = false;
    var cards = stage.querySelectorAll('.su-collect-card');
    function openCard(el) {
      var i = el.getAttribute('data-i');
      el.classList.add('opened');
      opened[i] = true;
      speak(step.cards[i].n + '。' + step.cards[i].f);
      if (Object.keys(opened).length === totalCards && !scored) {
        scored = true;
        record(true); // 全部翻開＝完成這個收集活動，計為一次正向互動
        cur.correctCount++;
        $('reveal').classList.add('show');
        $('afteract').style.display = 'flex';
      }
    }
    for (var k = 0; k < cards.length; k++) {
      cards[k].addEventListener('click', function () { openCard(this); });
      cards[k].addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(this); }
      });
    }
    $('btn-next').addEventListener('click', next);
  }

  // ---- namecard（家鄉名片產生器，趣味不計分） ----
  function renderNamecard(step) {
    var options = '';
    for (var i = 0; i < PLACES.length; i++) options += '<option value="' + PLACES[i] + '">' + PLACES[i] + '</option>';
    stage.innerHTML =
      '<div class="su-stage">' +
        '<div class="su-visual" aria-hidden="true">' + step.v + '</div>' +
        '<p class="su-sentence">' + step.s + '</p>' +
        '<select class="su-select" id="nc-place" aria-label="選擇你的家鄉">' + options + '</select>' +
        '<div class="su-toolrow" style="margin-top:var(--s3)">' +
          '<button type="button" class="btn btn-primary" id="nc-make">做名片 🪪</button></div>' +
        '<div class="su-namecard" id="nc-card" style="display:none">' +
          '<div class="nc-emoji" aria-hidden="true">🏡</div>' +
          '<div class="nc-line" id="nc-line"></div>' +
        '</div>' +
      '</div>' +
      '<div class="su-actions">' +
        '<button type="button" class="btn btn-primary btn-block" id="btn-next">完成單元 🎉</button>' +
      '</div>';
    $('nc-make').addEventListener('click', function () {
      var place = $('nc-place').value;
      var line = '我的家鄉是 ' + place + '，我是這裡的小主人！';
      $('nc-line').textContent = line;
      $('nc-card').style.display = 'block';
      speak(line);
    });
    $('btn-next').addEventListener('click', next);
  }

  // =====================================================================
  // 完成單元
  // =====================================================================
  function finishUnit() {
    var unit = cur.unit;
    var stars = cur.correctCount; // 已含 order/collect 的正向互動
    var total = cur.total;
    // 記錄進度（保留最佳星等）
    var prev = progress[unit.id] || {};
    progress[unit.id] = { done: true, best: Math.max(prev.best || 0, stars) };
    saveProg(progress);

    var starStr = '';
    for (var i = 0; i < total; i++) starStr += (i < stars ? '⭐' : '☆');

    stage.innerHTML =
      '<div class="su-stage su-done">' +
        '<div class="su-done-emoji" aria-hidden="true">🎉</div>' +
        '<div class="su-done-title">完成「' + unit.name + '」！</div>' +
        '<div class="su-done-stars" aria-label="得到 ' + stars + ' 顆星">' + starStr + '</div>' +
        '<p class="su-sentence" style="font-size:clamp(16px,3.6vw,19px)">你答對了 ' + stars + ' / ' + total + ' 題，好棒！</p>' +
      '</div>' +
      '<div class="su-actions">' +
        '<button type="button" class="btn" id="btn-menu">回到選單</button>' +
        (nextUnitOf(unit) ? '<button type="button" class="btn btn-primary" id="btn-nextunit">下一個單元 ➡️</button>' : '') +
      '</div>';

    toast('完成單元：' + unit.emoji + ' ' + unit.name + '！', 'daily');

    $('btn-menu').addEventListener('click', goMenu);
    var nu = nextUnitOf(unit);
    if (nu) $('btn-nextunit').addEventListener('click', function () { startUnit(nu); });
  }

  function nextUnitOf(unit) {
    for (var i = 0; i < UNITS.length; i++) {
      if (UNITS[i].id === unit.id) return UNITS[i + 1] || null;
    }
    return null;
  }

  function goMenu() {
    cur = null;
    renderMenu();
    show(screenMenu);
  }

  // =====================================================================
  // 頂列按鈕（主題切換改由共用 app-bar 的 [data-theme-toggle] 統一處理，
  // 由 game_core 自動接線與圖示同步，本頁不再自行處理主題。）
  // =====================================================================
  $('btn-back').addEventListener('click', goMenu);

  // =====================================================================
  // 啟動
  // =====================================================================
  renderMenu();
})();
</script>
