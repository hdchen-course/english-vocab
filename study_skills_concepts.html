<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">

  <span class="app-bar__title">學習執行力 🎯</span>

    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>

<main class="shell">
  <section id="screen-menu" class="cn-screen active cn-wrap">
    <div class="cn-topbar"><span class="cn-title">學習執行力 🎯</span></div>
    <div class="cn-hello"><span class="cn-mascot" aria-hidden="true">🎯</span>
      <div><div class="cn-htext" id="hello">想學好一件事，光有決心還不夠——這裡教你 5 個「動手做」的工具，把「想學好」變成每天做得到。</div>

    <div class="cn-lessons" id="lesson-list"></div>

  <section id="screen-play" class="cn-screen cn-wrap">
    <div class="cn-topbar"><button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button><span class="cn-title" id="play-title">工具</span></div>

    <div id="stage"></div>
  </section>

<script src="concept_engine.js"></script>
