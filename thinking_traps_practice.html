<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情境偵探・這是哪一種思考陷阱？ 🕵️</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<link rel="stylesheet" href="concept.css">
<script src="game_core.js"></script>
<!--
  情境偵探：讀一個生活情境，判斷它落入「哪一種思考陷阱」。混合出題、可反覆練、答完解說「為什麼是這個、為什麼不是最容易混淆的那個」。
  這是 thinking_traps_concepts.html(先教觀念)的配套練習頁——先學十種陷阱，再來這裡把「認出它」練成本能。
  純本地練習(data-game-hud=off、key thinking_traps_practice_v1、不計 XP、只 pingActive 續每日 streak)。全繁體中文。
-->
<style>
  :root{ --su:#7c3aed; --su-d:#6d28d9; --su-tint:rgba(124,58,237,0.12); }
  :root[data-theme="dark"]{ --su:#c4b5fd; --su-d:#ddd6fe; --su-tint:rgba(196,181,253,0.16); }
  .tp-wrap{ width:100%; }
  .tp-screen{ display:none; } .tp-screen.active{ display:block; animation: app-fade 0.3s ease; }
  .tp-topbar{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s4); }
  .tp-title{ font-size:var(--fs-h2); font-weight:800; color:var(--ink); }
  .tp-hello{ display:flex; align-items:center; gap:var(--s3); padding:var(--s4); background:var(--su-tint);
    border:1px solid var(--card-border); border-radius:var(--r-lg); margin-bottom:var(--s4); }
  .tp-hello .tp-mascot{ font-size:44px; flex:none; }
  .tp-htext{ font-size:var(--fs-body); font-weight:700; color:var(--ink); }
  .tp-hsub{ font-size:var(--fs-small); color:var(--ink); font-weight:600; margin-top:2px; }
  .tp-legend{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:var(--s4); }
  .tp-chip{ font-size:var(--fs-small); font-weight:700; color:var(--ink); background:var(--su-tint);
    border-radius:999px; padding:4px 10px; }
  .tp-card{ background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); padding:var(--s5) var(--s4); max-width:var(--content-max); margin-inline:auto; }
  .tp-bar{ display:flex; justify-content:space-between; align-items:center; font-size:var(--fs-small); font-weight:800; color:var(--su-d); margin-bottom:var(--s3); }
  .tp-scn{ font-size:var(--fs-body); font-weight:700; color:var(--ink); line-height:1.85; background:var(--su-tint);
    border-radius:var(--r-md); padding:var(--s4); margin-bottom:var(--s4); max-width:min(100%,42em); margin-inline:auto; }
  .tp-opt{ display:block; width:100%; text-align:left; padding:14px var(--s4); min-height:var(--tap-min);
    border:2px solid var(--card-border); border-radius:var(--r-md); background:var(--card); color:var(--ink);
    font-family:var(--font); font-size:var(--fs-body); font-weight:700; cursor:pointer; margin-bottom:var(--s3); }
  .tp-opt:hover{ border-color:var(--su); }
  .tp-opt:disabled{ cursor:default; }
  .tp-opt.correct{ border-color:var(--c-correct,#2e7d32); background:var(--tint-english,rgba(46,125,50,.12)); }
  .tp-opt.correct::after{ content:' ✓'; font-weight:800; }
  .tp-opt.wrong{ border-color:var(--c-wrong,#c62828); }
  .tp-opt.wrong::after{ content:' ✗'; font-weight:800; }
  .tp-reveal { max-width: min(100%, 44em); margin-inline: auto;  margin-top:var(--s2); padding:var(--s4); border-radius:var(--r-md); background:var(--su-tint); border-left:4px solid var(--su);
    font-size:var(--fs-body); font-weight:600; color:var(--ink); line-height:1.8; display:none; }
  .tp-reveal.show{ display:block; }
  .tp-reveal b{ color:var(--su-d); }
  .tp-actions{ margin-top:var(--s4); display:flex; gap:var(--s3); }
  .tp-actions .btn{ flex:1; }
  .tp-note{ text-align:center; color:var(--ink-soft); font-size:var(--fs-small); margin-top:var(--s5); font-weight:600; max-width:34em; margin-inline:auto; }
</style>
</head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">情境偵探 🕵️</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">
  <section id="screen-menu" class="tp-screen active tp-wrap">
    <div class="tp-topbar"><span class="tp-title">情境偵探・這是哪一種思考陷阱？ 🕵️</span></div>
    <div class="tp-hello"><span class="tp-mascot" aria-hidden="true">🕵️</span>
      <div><div class="tp-htext">學過十種思考陷阱了嗎？來當偵探！讀一個生活小情境，判斷它掉進了「哪一種」陷阱——真正的本領，是在真實情況裡認出它。</div>
      <div class="tp-hsub">答完每一題都會告訴你「為什麼是這個、為什麼不是最像的那個」。還沒學過的話，建議先到「思考陷阱・清晰思考」看過一輪再來。</div></div></div>
    <div class="tp-legend" id="legend"></div>
    <div id="len-list"></div>
    <a class="cn-nextup cn-nextup--back" href="thinking_traps_concepts.html"><span class="cn-nextup-ic" aria-hidden="true">📖</span><span>還沒學過十種陷阱？先到「思考陷阱・清晰思考」學一輪 →</span></a>
    <p class="tp-note">這是思考練習場，情境每輪打散、可無限重練，只留在你的裝置上，不影響學習基地的等級或經驗值。</p>
  </section>
  <section id="screen-play" class="tp-screen tp-wrap">
    <div class="tp-topbar"><button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button><span class="tp-title" id="play-title">情境偵探</span></div>
    <div id="stage"></div>
  </section>
</main>
<script src="thinking_traps_practice.js"></script>
