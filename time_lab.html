<!--
  時間特訓：先教「時分互換（1 時＝60 分）」與「經過時間」，再用生成器反覆練、難度隨連對提升。
  答案由程式即時算出（correct-by-construction）：全部時間先換成「距離午夜的總分鐘數」計算，
  時刻一律用 24 小時制以避免上午／下午混淆，作答用「時／分」兩格（單純的分則只有一格），
  時分一律正規化為 0≤分＜60、與程式算出的正解逐格比對。
  純本地（data-game-hud=off、key time_lab_v1、不計 XP，只 pingActive 續 streak）。全繁體中文。
-->
<style>
  :root{ --su:#0284c7; --su-d:#0369a1; --su-tint:rgba(2,132,199,0.12); }
  :root[data-theme="dark"]{ --su:#7dd3fc; --su-d:#bae6fd; --su-tint:rgba(125,211,252,0.16); }
  .tl-wrap{ width:100%; }
  .tl-screen{ display:none; } .tl-screen.active{ display:block; animation: app-fade 0.3s ease; }
  .tl-topbar{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s4); }
  .tl-title{ font-size:var(--fs-h2); font-weight:800; color:var(--ink); }
  .tl-hello{ display:flex; align-items:center; gap:var(--s3); padding:var(--s4); background:var(--su-tint);
    border:1px solid var(--card-border); border-radius:var(--r-lg); margin-bottom:var(--s5); }
  .tl-hello .tl-mascot{ font-size:44px; flex:none; }
  .tl-htext{ font-size:var(--fs-body); font-weight:700; color:var(--ink); }
  .tl-hsub{ font-size:var(--fs-small); color:var(--ink); font-weight:600; margin-top:2px; }
  .tl-card{ background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); padding:var(--s5) var(--s4); max-width:var(--content-max); margin-inline:auto; }
  .tl-teach{ font-size:var(--fs-body); font-weight:600; color:var(--ink); line-height:1.8; }
  .tl-teach h2{ font-size:var(--fs-h2); font-weight:800; color:var(--su-d); margin:0 0 var(--s3); }
  .tl-scorebar{ display:flex; justify-content:space-between; align-items:center; font-size:var(--fs-small); font-weight:800; color:var(--su-d); margin-bottom:var(--s3); }
  .tl-lv{ background:var(--su-tint); border-radius:999px; padding:2px 10px; }
  .tl-tag{ display:block; width:fit-content; font-size:var(--fs-small); font-weight:800; color:var(--su-d); background:var(--su-tint); border-radius:999px; padding:3px 12px; margin:0 auto var(--s2); }
  .tl-problem{ font-size:24px; font-weight:800; color:var(--ink); text-align:center; margin:var(--s3) 0; line-height:1.6; }
  .tl-problem .tl-q{ color:var(--su-d); }
  .tl-clock{ font-variant-numeric:tabular-nums; }
  .tl-answer{ display:flex; align-items:center; justify-content:center; gap:8px; margin:var(--s3) 0; flex-wrap:wrap; }
  .tl-answer input{ width:96px; height:52px; font-size:26px; font-weight:800; text-align:center; font-family:var(--font);
    border:2px solid var(--card-border); border-radius:var(--r-md); background:var(--card); color:var(--ink); }
  .tl-answer input:focus{ border-color:var(--su); outline:none; }
  .tl-answer .tl-unit{ font-size:22px; font-weight:800; color:var(--ink); }
  .tl-reveal { max-width: min(100%, 44em); margin-inline: auto;  margin-top:var(--s3); padding:var(--s3) var(--s4); border-radius:var(--r-md); font-size:var(--fs-body); font-weight:700; color:var(--ink); line-height:1.7; display:none; }
  .tl-reveal.show{ display:block; }
  .tl-reveal.ok{ background:var(--tint-english); border-left:4px solid var(--c-correct); }
  .tl-reveal.no{ background:rgba(255,118,117,0.12); border-left:4px solid var(--c-wrong); }
  .tl-actions{ margin-top:var(--s4); display:flex; gap:var(--s3); }
  .tl-actions .btn{ flex:1; }
  .tl-note{ text-align:center; color:var(--ink-soft); font-size:var(--fs-small); margin-top:var(--s5); font-weight:600; max-width:34em; margin-inline:auto; }
</style>

<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">時間特訓 ⏰</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">

<main class="shell">
  <section id="screen-menu" class="tl-screen active tl-wrap">
    <div class="tl-topbar"><span class="tl-title">時間特訓 ⏰</span></div>
    <div class="tl-hello"><span class="tl-mascot" aria-hidden="true">⏰</span>
      <div><div class="tl-htext">時間的祕密只有一句：<b>1 時＝60 分</b>。學會「時分互換」和「算經過了多久」，看時刻表、抓下課時間、算還要等幾分鐘都難不倒你。</div>
      <div class="tl-hsub">這裡用 <b>24 小時制</b>（下午、晚上就在 12 上再往上加：下午 2:30 是 14:30，晚上 8:00 是 20:00），比較不會把上午、下午搞混。建議先一種一種學過，再玩「綜合練習」。答完會告訴你「這題怎麼算」。</div></div></div>
    <div id="tl-menu" class="cn-lessons"></div>
    <a class="cn-nextup" href="mental_math.html"><span class="cn-nextup-ic" aria-hidden="true">🧮</span><span>想再練心算嗎？到「心算特訓」繼續 →</span></a>
    <p class="tl-note">這是時間練習場，題目由程式隨機生成、可無限練習；答對幾題難度會慢慢升高，連續卡關時也會自動降回來，只留在你的裝置上，不影響學習基地的等級或經驗值。</p>
  </section>
  <section id="screen-play" class="tl-screen tl-wrap">
    <div class="tl-topbar"><button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button><span class="tl-title" id="play-title">時間特訓</span></div>
    <div id="stage"></div>
  </section>
</main>
<script>
/* eslint-disable */
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function ri(lo,hi){ return lo + Math.floor(Math.random()*(hi-lo+1)); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function pad2(n){ n=String(n); return n.length<2 ? ('0'+n) : n; }
  // 距離午夜的總分鐘數 → 24 小時制時刻字串（例：875 → 14:35）
  function clock(mins){ var h=Math.floor(mins/60), m=mins%60; return pad2(h)+':'+pad2(m); }
  // 中文口語時刻（給朗讀用），例：14:35 → 十四點三十五分
  function spokenClock(mins){ var h=Math.floor(mins/60), m=mins%60; return h+' 點'+(m? (' '+m+' 分'):'整'); }
  // 難度：經過時間的分鐘上限、以及生成步長
  function durMax(lv){ return lv<=1?55 : lv===2?95 : lv===3?175 : lv===4?255 : 355; }
  function durStep(lv){ return lv<=1?5 : 5; } // 一律 5 分為步長，兼顧真實與乾淨
  // 產生一個落在「白天窗口」內、且與 span 相加後仍在窗口內的起始時刻（總分鐘）
  var DAY_LO=6*60, DAY_HI=21*60; // 06:00 ~ 21:00
  function genStart(span){ var latest=DAY_HI-span; if(latest<DAY_LO) latest=DAY_LO; var slots=Math.floor((latest-DAY_LO)/5); return DAY_LO + 5*ri(0, Math.max(0,slots)); }
  function genEnd(span){ var earliest=DAY_LO+span; if(earliest>DAY_HI) earliest=DAY_HI; var slots=Math.floor((DAY_HI-earliest)/5); return (DAY_LO+span) + 5*ri(0, Math.max(0,slots)); }
  function genSpan(lv){ var mx=durMax(lv); var st=durStep(lv); var slots=Math.floor((mx-10)/st); return 10 + st*ri(0, Math.max(0,slots)); }
  function hm(mins){ return { h:Math.floor(mins/60), m:mins%60 }; }
  function hmText(mins){ var o=hm(mins); if(o.h===0) return o.m+' 分'; if(o.m===0) return o.h+' 時'; return o.h+' 時 '+o.m+' 分'; }
  // 「補到整點」型解說（教學卡主打的方法）——都由程式算，保證與正解一致
  function bridgeElapsed(s,e){ var span=e-s; var nh=Math.ceil(s/60)*60;
    if(nh>=e || nh===s) return '從 '+clock(s)+' 到 '+clock(e)+' 直接數就是 '+hmText(span)+'。';
    var seg1=nh-s, seg2=e-nh;
    return '先從 '+clock(s)+' 走到整點 '+clock(nh)+' 是 '+seg1+' 分，再從 '+clock(nh)+' 到 '+clock(e)+' 是 '+hmText(seg2)+'，合起來 '+hmText(span)+'。'; }
  function bridgeAdd(s,span){ var e=s+span; var nh=Math.ceil(s/60)*60;
    if(nh>=e || nh===s) return clock(s)+' 再過 '+hmText(span)+' 就是 '+clock(e)+'。';
    var seg1=nh-s, rest=span-seg1;
    return clock(s)+' 先補到整點 '+clock(nh)+'（走 '+seg1+' 分），還剩 '+hmText(rest)+'，'+clock(nh)+' ＋ '+hmText(rest)+' ＝ '+clock(e)+'。'; }
  function bridgeSub(e,span){ var s=e-span; var ph=Math.floor(e/60)*60;
    if(ph<=s || ph===e) return clock(e)+' 往前 '+hmText(span)+' 就是 '+clock(s)+'。';
    var seg1=e-ph, rest=span-seg1;
    return clock(e)+' 先退到整點 '+clock(ph)+'（退 '+seg1+' 分），還要再往前 '+hmText(rest)+'，'+clock(ph)+' − '+hmText(rest)+' ＝ '+clock(s)+'。'; }

  var HM_FIELDS=[{key:'h',unit:'時',ph:'時'},{key:'m',unit:'分',ph:'分'}];
  var MIN_FIELD=[{key:'min',unit:'分',ph:'分'}];

  var CATS = [
    { key:'to_min', label:'時分換算成分', emoji:'🔁', sub:'X 時 Y 分 → 全部變成「分」',
      teach:'時間換算的根本只有一句：<b>1 時 ＝ 60 分</b>。<br><br>要把「時分」全部變成「分」，就把<b>時數 × 60，再加上分數</b>。<br><br><b>公式：X 時 Y 分 ＝ X × 60 ＋ Y（分）</b><br><br><b>例：</b>2 時 15 分 ＝ 2 × 60 ＋ 15 ＝ 120 ＋ 15 ＝ 135 分。<br><br>💡 只有「時」沒有「分」時，Y 就當作 0，例如 3 時 ＝ 180 分。',
      gen:function(lv){ var h=ri(1, lv<=1?3:lv<=2?5:9); var m=5*ri(lv<=1?1:0, 11); var ans=h*60+m;
        if(m===0) return { text:'<b>'+h+'</b> 時 <span class="tl-q">等於幾分？</span>', fields:MIN_FIELD, answer:{min:ans},
          tip:h+' 時 ＝ '+h+' × 60 ＝ '+ans+' 分。', spoken:h+' 時 等於幾分' };
        return { text:'<b>'+h+'</b> 時 <b>'+m+'</b> 分 <span class="tl-q">等於幾分？</span>', fields:MIN_FIELD, answer:{min:ans},
          tip:h+' 時 '+m+' 分 ＝ '+h+' × 60 ＋ '+m+' ＝ '+(h*60)+' ＋ '+m+' ＝ '+ans+' 分。', spoken:h+' 時 '+m+' 分 等於幾分' }; } },

    { key:'from_min', label:'分換算成時分', emoji:'⏳', sub:'M 分 → 幾時幾分',
      teach:'反過來，要把一堆「分」變回「幾時幾分」，就看<b>裡面有幾個 60</b>。<br><br>用 <b>M ÷ 60</b>：<b>商是「時」，餘數是「分」</b>。<br><br><b>例：</b>135 分 ＝ 135 ÷ 60 ＝ 2 餘 15，所以是 <b>2 時 15 分</b>。<br><br>💡 分的答案一定小於 60；如果你算出「1 時 75 分」，代表還能再換一次（75 分裡又有一個 60）。',
      gen:function(lv){ var total=5*ri(lv<=1?13:lv<=2?13:25, lv<=1?23:lv<=2?35:59); var o=hm(total);
        return { text:'<b>'+total+'</b> 分 <span class="tl-q">等於幾時幾分？</span>', fields:HM_FIELDS, answer:{h:o.h,m:o.m},
          tip:total+' 分 ＝ '+total+' ÷ 60 ＝ '+o.h+' 餘 '+o.m+'，也就是 '+o.h+' 時 '+o.m+' 分。', spoken:total+' 分 等於幾時幾分' }; } },

    { key:'elapsed', label:'經過了多久', emoji:'⏱️', sub:'從開始到結束，隔了多少時間',
      teach:'「經過時間」就是<b>從開始到結束隔了多久</b>。<br><br>好用的方法是<b>先補到整點，再一段一段加</b>：<br>先從開始時刻走到下一個整點，再走到結束時刻，兩段相加。<br><br><b>例：</b>從 8:40 到 10:15 → 8:40 到 9:00 是 20 分，9:00 到 10:15 是 1 時 15 分，合起來 <b>1 時 35 分</b>。<br><br>💡 也可以兩個時刻都換成「分」相減：10:15 是 615 分、8:40 是 520 分，615 − 520 ＝ 95 分 ＝ 1 時 35 分。',
      gen:function(lv){ var span=genSpan(lv); var s=genStart(span); var e=s+span; var o=hm(span);
        return { text:'從 <b class="tl-clock">'+clock(s)+'</b> 到 <b class="tl-clock">'+clock(e)+'</b>，<span class="tl-q">經過了多久？</span>', fields:HM_FIELDS, answer:{h:o.h,m:o.m},
          tip:bridgeElapsed(s,e)+'（也可以都換成分：'+e+' − '+s+' ＝ '+span+' 分'+(o.h>0?(' ＝ '+hmText(span)):'')+'。）', spoken:'從 '+spokenClock(s)+' 到 '+spokenClock(e)+' 經過了多久' }; } },

    { key:'endtime', label:'幾點結束', emoji:'🏁', sub:'開始時刻＋經過時間＝結束時刻',
      teach:'知道<b>開始時刻</b>和<b>經過多久</b>，要算<b>結束時刻</b>，就是<b>開始 ＋ 經過</b>。<br><br>好用的方法是<b>先補到整點，再加剩下的</b>。<br><br><b>例：</b>9:50 開始，經過 1 時 25 分 → 先從 9:50 補到整點 10:00（走了 10 分），還剩 1 時 15 分，10:00 ＋ 1 時 15 分 ＝ <b>11:15</b>。<br><br>💡 也可以把時刻換成分相加後再換回來；分加起來超過 60 時，記得進位成 1 時。',
      gen:function(lv){ var span=genSpan(lv); var s=genStart(span); var e=s+span; var o=hm(span);
        return { text:'<b class="tl-clock">'+clock(s)+'</b> 開始，經過 <b>'+hmText(span)+'</b>，<span class="tl-q">幾點結束？</span>', fields:HM_FIELDS, answer:{h:Math.floor(e/60),m:e%60},
          tip:bridgeAdd(s,span)+'（也可以都換成分：'+s+' ＋ '+span+' ＝ '+e+' 分 ＝ '+clock(e)+'。）', spoken:spokenClock(s)+' 開始，經過 '+hmText(span)+'，幾點結束' }; } },

    { key:'starttime', label:'幾點開始', emoji:'🔙', sub:'結束時刻－經過時間＝開始時刻',
      teach:'反過來，知道<b>結束時刻</b>和<b>經過多久</b>，要算<b>開始時刻</b>，就是<b>結束 − 經過</b>（往回推）。<br><br>好用的方法是<b>先退到整點，再往前減剩下的</b>。<br><br><b>例：</b>15:10 結束，經過了 1 時 40 分 → 先從 15:10 退到整點 15:00（退了 10 分），還要再往前 1 時 30 分，15:00 − 1 時 30 分 ＝ <b>13:30</b>。<br><br>💡 也可以把時刻換成分相減後再換回來；分不夠減時，先跟前面借 1 時（＝60 分）再減。',
      gen:function(lv){ var span=genSpan(lv); var e=genEnd(span); var s=e-span; var o=hm(span);
        return { text:'<b class="tl-clock">'+clock(e)+'</b> 結束，往前算，剛剛經過了 <b>'+hmText(span)+'</b>，<span class="tl-q">幾點開始？</span>', fields:HM_FIELDS, answer:{h:Math.floor(s/60),m:s%60},
          tip:bridgeSub(e,span)+'（也可以都換成分：'+e+' − '+span+' ＝ '+s+' 分 ＝ '+clock(s)+'。）', spoken:spokenClock(e)+' 結束，往前經過 '+hmText(span)+'，幾點開始' }; } }
  ];
  var CAT_BY = {}; CATS.forEach(function(c){ CAT_BY[c.key]=c; });

  function showScreen(name){
    $('screen-menu').classList.toggle('active', name==='menu');
    $('screen-play').classList.toggle('active', name==='play');
    try{ window.scrollTo(0,0); }catch(e){}
  }
  function renderMenu(){
    var html='';
    CATS.forEach(function(c){
      html+='<button type="button" class="cn-lesson" data-cat="'+c.key+'">'+
        '<span class="cn-lesson-top"><span class="cn-lesson-emoji" style="background:var(--su-tint)" aria-hidden="true">'+c.emoji+'</span><span class="cn-lesson-name">'+c.label+'</span></span>'+
        '<span class="cn-lesson-sub">'+c.sub+'</span><span class="cn-lesson-foot todo">▶️ 開始練習</span></button>';
    });
    html+='<button type="button" class="cn-lesson" data-cat="mix">'+
      '<span class="cn-lesson-top"><span class="cn-lesson-emoji" style="background:var(--su-tint)" aria-hidden="true">🎲</span><span class="cn-lesson-name">綜合練習（各種混合）</span></span>'+
      '<span class="cn-lesson-sub">上面幾種都學過之後再來這裡混合練，最能練到「看到題目就知道怎麼算」</span><span class="cn-lesson-foot todo">▶️ 開始練習</span></button>';
    $('tl-menu').innerHTML=html;
    Array.prototype.forEach.call($('tl-menu').querySelectorAll('.cn-lesson'), function(b){
      b.addEventListener('click', function(){ startMode(b.getAttribute('data-cat')); });
    });
  }

  var mode=null, cur=null, answered=false, correct=0, total=0, streak=0, bestStreak=0, lv=1;
  var lvCorrect=0, missStreak=0, lvChange=0;
  var LVL_UP=5, LVL_DOWN=3;
  function startMode(m){
    mode=m; correct=0; total=0; streak=0; bestStreak=0; lv=1; lvCorrect=0; missStreak=0; lvChange=0;
    showScreen('play');
    $('play-title').textContent = (m==='mix'?'綜合練習':CAT_BY[m].label)+' ⏰';
    if(m==='mix'){ renderMixPrimer(); } else { renderTeach(m); }
  }
  function renderMixPrimer(){
    $('stage').innerHTML =
      '<div class="tl-card">'+
        '<div class="cn-teach-emoji" aria-hidden="true">🎲</div><h2 class="cn-h">綜合練習</h2>'+
        '<div class="tl-teach">這裡會把<b>各種時間題型混在一起</b>出題。看到題目先想：<br><br>'+
        '・<b>時分換成分</b> → 時 × 60 ＋ 分<br>・<b>分換成時分</b> → ÷ 60，商是時、餘是分<br>・<b>經過多久</b> → 結束 − 開始<br>・<b>幾點結束</b> → 開始 ＋ 經過<br>・<b>幾點開始</b> → 結束 − 經過<br><br>'+
        '想不起來也沒關係，答完每題都會再示範怎麼算。<b>建議先把上面幾種各自練過再來這裡</b>。</div>'+
        '<div class="tl-actions"><button type="button" class="btn btn-primary" id="btn-begin">開始混合練習 🎲</button></div>'+
      '</div>';
    $('btn-begin').addEventListener('click', function(){ beginPractice(); });
    try{ $('btn-begin').focus(); }catch(e){}
  }
  function renderTeach(m){
    var c=CAT_BY[m];
    $('stage').innerHTML =
      '<div class="tl-card">'+
        '<div class="cn-teach-emoji" aria-hidden="true">'+c.emoji+'</div><h2 class="cn-h">'+c.label+'</h2>'+
        '<div class="cn-block"><div class="tl-teach">'+c.teach+'</div></div>'+
        '<div class="tl-actions"><button type="button" class="btn btn-primary" id="btn-begin">我學會了，開始練習 ✏️</button></div>'+
      '</div>';
    $('btn-begin').addEventListener('click', function(){ beginPractice(); });
    try{ $('btn-begin').focus(); }catch(e){}
  }
  function beginPractice(){ nextProblem(); }
  function genOne(){ var c = mode==='mix' ? pick(CATS) : CAT_BY[mode]; var p=c.gen(lv); p.cat=c; return p; }

  function fieldsHtml(fields){
    var h='';
    fields.forEach(function(f,i){
      h+='<input type="text" inputmode="numeric" id="tl-in-'+f.key+'" aria-label="答案（'+f.unit+'）" autocomplete="off" placeholder="'+f.ph+'">'+
         '<span class="tl-unit">'+f.unit+'</span>';
    });
    return h;
  }
  function nextProblem(){
    cur=genOne(); answered=false;
    var bestTxt = bestStreak>streak ? ('（最佳 '+bestStreak+'）') : '';
    $('stage').innerHTML =
      '<div class="tl-card">'+
        '<div class="tl-scorebar"><span>答對 '+correct+' / '+total+'　連對 '+streak+' '+bestTxt+'🔥</span><span class="tl-lv">難度 Lv.'+lv+'</span></div>'+
        '<span class="tl-tag">'+cur.cat.emoji+' '+cur.cat.label+'</span>'+
        '<div class="tl-problem" id="tl-prob" tabindex="-1" role="img" aria-label="題目：'+cur.spoken+'？">'+cur.text+'</div>'+
        '<div class="tl-answer">'+fieldsHtml(cur.fields)+'</div>'+
        '<div class="tl-actions"><button type="button" class="btn btn-primary" id="btn-submit">送出答案 ✓</button></div>'+
        '<div class="tl-reveal" id="tl-reveal" aria-live="assertive"></div>'+
        '<div class="tl-actions" id="tl-next-actions" style="display:none"><button type="button" class="btn btn-primary" id="btn-next">下一題 ➡️</button></div>'+
      '</div>';
    try{ $('tl-prob').focus(); }catch(e){}
    $('btn-submit').addEventListener('click', submit);
    cur.fields.forEach(function(f){
      var el=$('tl-in-'+f.key);
      el.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); if(!answered) submit(); } });
    });
    try{ $('tl-in-'+cur.fields[0].key).focus(); }catch(e){}
    $('btn-next').onclick=function(){ nextProblem(); };
  }
  function parseField(s){ s=(s||'').trim().replace(/^\+/,''); if(s==='') return 0; if(!/^\d+$/.test(s)) return null; return parseInt(s,10); }
  function fieldLabel(f){ return f.unit; }
  function answerText(){
    // 依欄位組出正解字串（時／分 或 純分）
    if(cur.fields.length===1) return cur.answer.min+' 分';
    var a=cur.answer; if(a.h===0) return a.m+' 分'; if(a.m===0) return a.h+' 時'; return a.h+' 時 '+a.m+' 分';
  }
  function submit(){
    if(answered) return;
    var vals={}, bad=false, mFieldOver=false;
    cur.fields.forEach(function(f){
      var v=parseField($('tl-in-'+f.key).value);
      if(v===null){ bad=true; }
      else { vals[f.key]=v; if(f.key==='m' && v>=60) mFieldOver=true; }
    });
    if(bad){
      var rev0=$('tl-reveal'); rev0.className='tl-reveal show no';
      rev0.textContent='請在每個空格填入數字再按送出（沒有的話填 0 也可以）。';
      return;
    }
    if(mFieldOver){
      var rev1=$('tl-reveal'); rev1.className='tl-reveal show no';
      rev1.textContent='「分」要小於 60 喔——一到 60 分就代表滿一整時，記得先換成 1 時再填。';
      return;
    }
    answered=true; total++;
    var ok=true;
    cur.fields.forEach(function(f){ if(vals[f.key]!==cur.answer[f.key]) ok=false; });
    lvChange=0;
    if(ok){
      correct++; streak++; if(streak>bestStreak) bestStreak=streak;
      missStreak=0; lvCorrect++;
      if(lvCorrect>=LVL_UP && lv<5){ lv++; lvCorrect=0; lvChange=1; }
    } else {
      streak=0; missStreak++;
      if(missStreak>=LVL_DOWN && lv>1){ lv--; lvCorrect=0; missStreak=0; lvChange=-1; }
    }
    try{ if(window.Game && typeof Game.pingActive==='function') Game.pingActive(); }catch(e){}
    var lvMsg = lvChange>0 ? ('　🎉 難度升到 Lv.'+lv+'！') : (lvChange<0 ? ('　難度降到 Lv.'+lv+'，先把手感找回來 🙂') : '');
    var rev=$('tl-reveal');
    rev.className='tl-reveal show '+(ok?'ok':'no');
    rev.textContent=(ok?'答對了！👍 ':('沒關係～答案是 '+answerText()+'。'))+cur.tip+lvMsg;
    $('btn-submit').disabled=true;
    cur.fields.forEach(function(f){ $('tl-in-'+f.key).disabled=true; });
    $('tl-next-actions').style.display='flex';
    try{ $('btn-next').focus(); }catch(e){}
  }
  document.addEventListener('keydown', function(e){
    if(!$('screen-play').classList.contains('active')) return;
    if(e.key==='Enter'){
      var onActionBtn = e.target && e.target.tagName==='BUTTON';
      if(onActionBtn) return;
      if(answered && $('btn-next')){ e.preventDefault(); nextProblem(); }
    }
  });
  $('btn-back').addEventListener('click', function(){ showScreen('menu'); });
  showScreen('menu');
  renderMenu();
})();
</script>
</body>
</html>
