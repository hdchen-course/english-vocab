<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多益 / 英檢閃卡</title>
<!-- 統一遊戲系統：本頁無原生 HUD，交給 game_core 注入浮動 HUD（不設 data-game-hud）。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<!-- 共用「間隔重複」排程核心（window.SRS）：於 game_core.js 之後、頁面腳本之前載入。 -->
<script src="assets/srs_engine.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 本頁強調色三件組：英語科（accent 稀用且一致，見 app.css 共用元件層）。 */
:root {
  --accent: var(--c-english);
  --accent-tint: var(--tint-english);
  --accent-ink: var(--c-english-ink);
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  overflow-x: hidden;
}

header { text-align: center; margin-bottom: var(--s5); }
header h1 { font-size: var(--fs-h1); font-weight: 800; color: var(--ink); line-height: 1.3; }
header p { color: var(--ink-soft); font-size: var(--fs-small); font-weight: 600; margin-top: var(--s1); }

/* 分數列（知道／再看）。 */
.score-bar {
  display: flex;
  justify-content: center;
  gap: var(--s5);
  margin-bottom: var(--s4);
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--ink-soft);
}
.score-bar span { display: flex; align-items: center; gap: var(--s1); }
.score-known { color: var(--c-english-ink); }
.score-again { color: var(--c-streak-ink); }

.word-counter {
  text-align: center;
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--ink-soft);
  margin-bottom: var(--s3);
}

/* 翻卡背面：例句與發音鈕成組排列，長內容換行不撐破卡面。 */
.flashcard-audio-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  flex-wrap: wrap;
  max-width: 100%;
}
.fc-card__sent { font-size: var(--fs-body); color: var(--ink-soft); line-height: 1.55; overflow-wrap: break-word; }
.fc-card__sent strong { color: var(--accent-ink); font-weight: 700; }
.fc-card__tip {
  font-size: var(--fs-small);
  color: var(--ink);
  background: var(--tint-chinese);
  border: 1px solid var(--c-chinese);
  padding: var(--s2) var(--s3);
  border-radius: var(--r-sm);
  max-width: 100%;
  overflow-wrap: break-word;
}

/* 測驗舞台。 */
.quiz-container {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s5) var(--s4);
  box-shadow: var(--shadow-sm);
  margin: var(--s4) auto 0;
  max-width: 560px;
}
.quiz-prompt {
  text-align: center;
  line-height: 1.45;
  color: var(--ink);
  margin: 0 auto var(--s5);
}
.quiz-word { font-size: clamp(26px, 6.5vw, 40px); font-weight: 800; color: var(--accent-ink); overflow-wrap: break-word; }
.quiz-clue { font-size: clamp(19px, 4.5vw, 24px); font-weight: 800; color: var(--ink); max-width: 32ch; margin: 0 auto; }
.quiz-dir-label { display: block; font-size: var(--fs-small); font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 1px; margin-bottom: var(--s2); }
.quiz-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s3);
  margin-top: var(--s2);
}
.quiz-option {
  padding: 14px 18px;
  border: 2px solid var(--card-border);
  border-radius: 16px;
  cursor: pointer;
  font-size: clamp(16px, 3.4vw, 19px);
  font-weight: 700;
  transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
  background: var(--card);
  color: var(--ink);
  text-align: center;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font);
}
.quiz-option:hover { border-color: var(--accent); }
.quiz-option:active { transform: scale(0.98); }
.quiz-option.correct { background: var(--tint-english); border-color: var(--c-correct); color: var(--c-english-ink); }
.quiz-option.wrong { background: rgba(255,118,117,0.12); border-color: var(--c-wrong); color: var(--ink); }
.quiz-option.correct::after { content: ' ✓'; font-weight: 800; }
.quiz-option.wrong::after { content: ' ✗'; font-weight: 800; }

/* 拼字舞台。 */
.spell-stage {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--s5) var(--s4);
  box-shadow: var(--shadow-sm);
  margin: var(--s4) auto 0;
  max-width: 560px;
}
.fc-spell__tile, .fc-spell__slot { text-transform: uppercase; }
.fc-spell__slot.no { animation: app-shake 0.4s ease; }
@media (prefers-reduced-motion: reduce) { .fc-spell__slot.no { animation: none; } }

/* 空狀態。 */
.empty-state {
  text-align: center;
  padding: var(--s6) var(--s5);
  color: var(--ink-soft);
  font-weight: 600;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  margin: var(--s4) auto 0;
  max-width: 460px;
}
.empty-state-emoji { font-size: clamp(48px, 14vw, 64px); margin-bottom: var(--s3); }

/* iPad ≥1024：閃卡視圖單欄置中，進度側欄堆疊於卡片下方。 */
@media (min-width: 1024px) {
  .dashboard { display: block; max-width: 720px; margin-inline: auto; }
  .dashboard .aside { position: static; margin-top: var(--s4); }
}
</style>
</head>
<body>

<!-- ===== 共用頂部應用列（全站一致） ===== -->
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">多益 / 英檢閃卡 📝</span>
  <button type="button" class="app-bar__theme" data-theme-toggle
          aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>

<main class="shell">

  <header>
    <h1>多益 / 英檢閃卡</h1>
    <p>聽發音、記字義、練拼字 — 幫你把單字牢牢記住</p>
    <p style="margin-top:var(--s1)">不用擔心難度～先從初級開始，一次記幾個字就好，慢慢來 😊</p>
  </header>

  <!-- 等級選擇器（共用 .fc-source） -->
  <div class="fc-source" id="levelSelector"></div>

  <!-- 模式切換（共用 .fc-source） -->
  <div class="fc-source mode-toggle" role="tablist" aria-label="學習模式">
    <button class="fc-source__btn active" data-mode="flashcard" aria-pressed="true" onclick="switchMode('flashcard')">🃏 閃卡</button>
    <button class="fc-source__btn" data-mode="quiz" aria-pressed="false" onclick="switchMode('quiz')">📝 測驗</button>
    <button class="fc-source__btn" data-mode="spell" aria-pressed="false" onclick="switchMode('spell')">🔤 拼字</button>
  </div>

  <!-- 單字圖鑑入口（跨等級收藏；未選等級也可用） -->
  <div class="fc-dex__nav worddex-nav">
    <button class="fc-source__btn" onclick="Worddex.openScreen()">🌈 單字圖鑑</button>
    <button class="fc-source__btn" onclick="Worddex.startReview()" title="複習今天到期的字">🔭 今日複習</button>
    <span class="worddex-due-desc" id="worddexDueDesc"></span>
  </div>

  <div class="dashboard">
    <aside class="aside tg-aside">
      <div class="score-bar">
        <span class="score-known">&#10003; 記住: <b id="knownCount">0</b></span>
        <span class="score-again">&#8635; 再練: <b id="againCount">0</b></span>
      </div>
    </aside>
    <div class="tg-main">
      <div class="play-column">
        <div id="learningArea"></div>
      </div>
    </div>
  </div>

  <!-- ===== 單字圖鑑畫面 ===== -->
  <div id="worddexArea" class="hidden">
    <div class="worddex-top">
      <h2 class="worddex-title">🌈 單字圖鑑</h2>
      <button class="fc-source__btn worddex-back" onclick="Worddex.closeScreen()">← 返回</button>
    </div>
    <div class="worddex-summary" id="worddexSummary" aria-live="polite"></div>
    <div class="worddex-legend">
      <span><span class="lg">☆</span> 未收集</span>
      <span><span class="lg">⭐</span> 收集中</span>
      <span><span class="lg">🌟</span> 精通</span>
      <span><span class="lg">🔵</span> 今天待複習</span>
    </div>
    <div class="worddex-actions">
      <button class="fc-source__btn" onclick="Worddex.startReview()">🔭 開始今日複習</button>
    </div>
    <div id="worddexSections"></div>
  </div>

  <!-- 單字聚焦面板 overlay -->
  <div class="worddex-focus-overlay" id="worddexFocusOverlay" hidden>
    <div class="worddex-focus-card">
      <button class="worddex-focus-close" onclick="Worddex.closeFocus()" aria-label="關閉">✕</button>
      <div class="worddex-focus-body" id="worddexFocusBody"></div>
    </div>
  </div>

</main>

<script src="toeic_gept_flashcard__0.js"></script>
<script src="vocab_data_toeic.js"></script>
<script src="vocab_data_gept_elementary.js"></script>

<!-- ===== 單字圖鑑（Worddex）：以共用 SRS store 承載。獨立 localStorage key、
     里程碑單次 award + 單調 guard；scheduleBox 可退盒、peakBox/lit 收藏只增不減；
     本圖鑑模組只寫自己的 key、不直接寫 vocab_srs / vocab_stats；單字測驗答對會經 Game.recordAnswer/award('english') API 計入英文主 XP（刻意設計，非污染）；本頁不宣告 data-game-wired。 ===== -->
<script src="toeic_gept_flashcard__1.js"></script>

<!-- ===== 單字圖鑑（Worddex）自足樣式：沿用本頁 app.css 變數與設計語言 ===== -->
<style>
.hidden { display: none !important; }

.worddex-nav .worddex-due-desc {
  flex-basis: 100%; text-align: center;
  font-size: var(--fs-small); font-weight: 600; color: var(--ink-soft);
}
.worddex-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-bottom: var(--s3); }
.worddex-title { font-size: var(--fs-h2); font-weight: 800; color: var(--ink); }
.worddex-summary { text-align: center; font-size: var(--fs-small); font-weight: 700; color: var(--ink-soft); margin: var(--s1) 0 var(--s2); line-height: 1.6; }
.worddex-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; font-size: var(--fs-small); font-weight: 600; color: var(--ink-soft); margin-bottom: var(--s3); }
.worddex-legend .lg { margin-right: 4px; }
.worddex-actions { text-align: center; margin: var(--s2) 0 var(--s4); }
.worddex-section { margin-bottom: var(--s5); }
.worddex-section-title { font-size: var(--fs-body); font-weight: 800; color: var(--ink); margin-bottom: var(--s2); }
.fc-dex__card { cursor: pointer; transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease; }
.fc-dex__card:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); }
.fc-dex__card:active { transform: scale(0.96); }
.fc-dex__card .wd-emoji { font-size: 24px; line-height: 1.1; }
/* 聚焦面板 overlay */
.worddex-focus-overlay {
  position: fixed; inset: 0; z-index: 10000;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.45); padding: var(--s4);
}
.worddex-focus-overlay[hidden] { display: none !important; }
.worddex-focus-card {
  position: relative; width: min(360px, 92vw);
  background: var(--card); color: var(--ink);
  border: 2px solid var(--card-border); border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg); padding: var(--s6) var(--s4) var(--s5);
  text-align: center;
}
.worddex-focus-close {
  position: absolute; top: 8px; right: 8px;
  min-width: 48px; min-height: 48px;
  border: none; background: transparent; color: var(--ink-soft);
  font-size: 20px; cursor: pointer; border-radius: 12px;
}
.worddex-focus-close:hover { background: var(--accent-tint); }
.worddex-focus-emoji { font-size: 52px; line-height: 1.1; }
.worddex-focus-word { font-size: var(--fs-h2); font-weight: 800; color: var(--c-english-ink); margin: 4px 0; overflow-wrap: anywhere; }
.worddex-focus-cn { font-size: var(--fs-body); font-weight: 800; color: var(--ink); }
.worddex-focus-meta { font-size: var(--fs-small); font-weight: 600; color: var(--ink-soft); line-height: 1.7; margin: 10px 0 14px; }
.worddex-focus-practice {
  min-height: 48px; padding: 12px 24px; border: none; border-radius: 16px;
  background: var(--c-english-btn); color: var(--on-accent);
  font-family: var(--font); font-size: var(--fs-small); font-weight: 700;
  cursor: pointer; box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, box-shadow 0.2s ease;
}
.worddex-focus-practice:hover { box-shadow: var(--shadow-lg); }
.worddex-focus-practice:active { transform: scale(0.96); }
@media (prefers-reduced-motion: reduce) {
  .fc-dex__card:active, .worddex-focus-practice:active { transform: none; }
}
</style>
</body>
</html>
