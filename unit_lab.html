<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單位換算特訓 📏</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<link rel="stylesheet" href="concept.css">
<script src="game_core.js"></script>
<!--
  單位換算特訓：先教「大單位換小單位要乘、小單位換大單位要除」的想法(附換算關係)，再用生成器反覆練不同題目、難度隨連對提升。
  答案由程式即時算出(correct-by-construction，無人工出題錯誤)：以整數比率相乘/相除，保證答案乾淨(整數或終止小數)。
  作答用單一數字格，判定用數值比較(容忍浮點誤差)。純本地(data-game-hud=off、key unit_lab_v1、不計 XP，只 pingActive 續 streak)。全繁體中文。
-->
<style>
  :root{ --su:#0891b2; --su-d:#0e7490; --su-tint:rgba(8,145,178,0.12); }
  :root[data-theme="dark"]{ --su:#67e8f9; --su-d:#a5f3fc; --su-tint:rgba(103,232,249,0.16); }
  .ul-wrap{ width:100%; }
  .ul-screen{ display:none; } .ul-screen.active{ display:block; animation: app-fade 0.3s ease; }
  .ul-topbar{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s4); }
  .ul-title{ font-size:var(--fs-h2); font-weight:800; color:var(--ink); }
  .ul-hello{ display:flex; align-items:center; gap:var(--s3); padding:var(--s4); background:var(--su-tint);
    border:1px solid var(--card-border); border-radius:var(--r-lg); margin-bottom:var(--s5); }
  .ul-hello .ul-mascot{ font-size:44px; flex:none; }
  .ul-htext{ font-size:var(--fs-body); font-weight:700; color:var(--ink); }
  .ul-hsub{ font-size:var(--fs-small); color:var(--ink); font-weight:600; margin-top:2px; }
  .ul-card{ background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); padding:var(--s5) var(--s4); max-width:var(--content-max); margin-inline:auto; }
  .ul-teach{ font-size:var(--fs-body); font-weight:600; color:var(--ink); line-height:1.8; }
  .ul-teach h2{ font-size:var(--fs-h2); font-weight:800; color:var(--su-d); margin:0 0 var(--s3); }
  .ul-scorebar{ display:flex; justify-content:space-between; align-items:center; font-size:var(--fs-small); font-weight:800; color:var(--su-d); margin-bottom:var(--s3); }
  .ul-lv{ background:var(--su-tint); border-radius:999px; padding:2px 10px; }
  .ul-tag{ display:block; width:fit-content; font-size:var(--fs-small); font-weight:800; color:var(--su-d); background:var(--su-tint); border-radius:999px; padding:3px 12px; margin:0 auto var(--s2); }
  .ul-problem{ font-size:30px; font-weight:800; color:var(--ink); text-align:center; margin:var(--s3) 0; letter-spacing:1px; line-height:1.5; }
  .ul-problem .ul-q{ color:var(--su-d); }
  .ul-answer{ display:flex; align-items:center; justify-content:center; gap:10px; margin:var(--s3) 0; }
  .ul-answer input{ width:150px; height:52px; font-size:26px; font-weight:800; text-align:center; font-family:var(--font);
    border:2px solid var(--card-border); border-radius:var(--r-md); background:var(--card); color:var(--ink); }
  .ul-answer input:focus{ border-color:var(--su); outline:none; }
  .ul-answer .ul-unit{ font-size:24px; font-weight:800; color:var(--ink); }
  .ul-reveal { max-width: min(100%, 44em); margin-inline: auto;  margin-top:var(--s3); padding:var(--s3) var(--s4); border-radius:var(--r-md); font-size:var(--fs-body); font-weight:700; color:var(--ink); line-height:1.7; display:none; }
  .ul-reveal.show{ display:block; }
  .ul-reveal.ok{ background:var(--tint-english); border-left:4px solid var(--c-correct); }
  .ul-reveal.no{ background:rgba(255,118,117,0.12); border-left:4px solid var(--c-wrong); }
  .ul-actions{ margin-top:var(--s4); display:flex; gap:var(--s3); }
  .ul-actions .btn{ flex:1; }
  .ul-note{ text-align:center; color:var(--ink-soft); font-size:var(--fs-small); margin-top:var(--s5); font-weight:600; max-width:34em; margin-inline:auto; }
</style>
</head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index.html" aria-label="回到學習基地首頁">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span>
    <span class="app-bar__home-label">學習基地</span>
  </a>
  <span class="app-bar__title">單位換算特訓 📏</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell">
  <section id="screen-menu" class="ul-screen active ul-wrap">
    <div class="ul-topbar"><span class="ul-title">單位換算特訓 📏</span></div>
    <div class="ul-hello"><span class="ul-mascot" aria-hidden="true">📏</span>
      <div><div class="ul-htext">換單位有一個大原則：<b>大單位換成小單位要「乘」，小單位換成大單位要「除」</b>。先記住每種單位之間差幾倍，再開始練習——每一題都不一樣，越練越順、難度也會慢慢變高。</div>
      <div class="ul-hsub">建議先一種一種學過再玩「綜合練習」。答完會告訴你「這題怎麼換」。</div></div></div>
    <div id="ul-menu" class="cn-lessons"></div>
    <a class="cn-nextup" href="fraction_lab.html"><span class="cn-nextup-ic" aria-hidden="true">🍕</span><span>想再練分數嗎？到「分數特訓」繼續 →</span></a>
    <p class="ul-note">這是單位換算練習場，題目由程式隨機生成、可無限練習；答對幾題難度會慢慢升高，連續卡關時也會自動降回來，只留在你的裝置上，不影響學習基地的等級或經驗值。</p>
  </section>
  <section id="screen-play" class="ul-screen ul-wrap">
    <div class="ul-topbar"><button type="button" class="btn btn-icon" id="btn-back" aria-label="回到選單">←</button><span class="ul-title" id="play-title">單位換算特訓</span></div>
    <div id="stage"></div>
  </section>
</main>
<script src="unit_lab.js"></script>
</body>
</html>
