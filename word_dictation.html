<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>分級聽寫 🎧</title>
<!-- 新版版面頁（練習與應用「聽與寫」）。只「重複使用」既有材料，絕不修改舊檔：
     材料＝dictation.js（引擎）＋dict_data_*.js（資料）＋audio/*.mp3＋dictation.css（dct-* 元件樣式）。
     版面＝共用房屋 pshell（assets/unit.css）＋本頁 inline 覆蓋（house 卡片質感）。
     沿用相同 dct-screen-* / dct-* id，dictation.js 直接驅動，無需改引擎。 -->
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<script src="assets/srs_engine.js"></script>
<link rel="stylesheet" href="assets/unit.css"><!-- 共用房屋 pshell（.pshell-grid/.psb/.psb-main/.sb-*/.sb-cat） -->
<link rel="stylesheet" href="dictation.css"><!-- 重用既有 dct-* 元件樣式（不改此檔） -->
<style>
/* 強調色＝英語科；版面用共用 pshell。以下為本新頁對 dct-* 的「house 卡片質感」覆蓋（不動 dictation.css）。 */
:root{ --accent:var(--c-english); --accent-tint:var(--tint-english); --accent-ink:var(--c-english-ink); }
body{ font-family:var(--font); min-height:100vh; background:var(--bg); color:var(--ink); overflow-x:hidden; }
.dct-cat{ display:none; }
.dct-cat.on{ display:block; }
.dct-cat-hint{ color:var(--ink-soft); font-size:var(--fs-small); font-weight:600; margin:0 0 var(--s3); }
/* 選單卡片 house 化（覆蓋 dictation.css 的扁平樣式；僅本頁生效） */
.dct-section-title{ font-size:clamp(17px,3.4vw,20px); font-weight:800; margin:var(--s2) 0 4px; }
.dct-week-grid{ gap:var(--s3); }
@media (min-width:1200px){ .dct-week-grid{ grid-template-columns:1fr 1fr 1fr; } }
.dct-week{ border:1px solid var(--card-border); border-left:4px solid var(--accent); border-radius:18px;
  box-shadow:var(--shadow-sm); transition:transform .14s ease, box-shadow .2s ease; }
.dct-week:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.dct-week__head{ padding:16px 18px; }
.dct-week__head::before{ content:"✍️"; margin-right:8px; }
.dct-day, .dct-bonus-btn{ border:1px solid var(--card-border); border-radius:12px; box-shadow:var(--shadow-sm); background:var(--bg); }
.dct-day:hover, .dct-bonus-btn:hover{ box-shadow:var(--shadow-lg); }
/* 加碼／主題／CEFR：項目排成小卡格狀（比照單元頁卡牆，不用滿寬長條） */
#dct-bonus, #dct-themes, #dct-cefr{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
#dct-bonus > .dct-day, #dct-bonus > .dct-bonus-btn,
#dct-themes > .dct-day, #dct-themes > .dct-bonus-btn,
#dct-cefr > .dct-day, #dct-cefr > .dct-bonus-btn{
  display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:4px;
  min-height:88px; border:1px solid var(--card-border); border-left:4px solid var(--accent);
  border-radius:16px; padding:16px 18px; background:var(--card); box-shadow:var(--shadow-sm);
  font-size:clamp(15px,3vw,17px); text-align:left; transition:transform .14s ease, box-shadow .2s ease; }
#dct-bonus > .dct-day:hover, #dct-bonus > .dct-bonus-btn:hover,
#dct-themes > .dct-day:hover, #dct-themes > .dct-bonus-btn:hover,
#dct-cefr > .dct-day:hover, #dct-cefr > .dct-bonus-btn:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); }
/* 載入 CTA（主題例句尚未載入時）維持滿欄一條，不做成小卡 */
#dct-themes > .dct-load{ grid-column:1/-1; }
/* 作答畫面：房屋卡片版面（聽卡＋寫卡＋對答案卡），置中一欄。重用 .gr-card；dct-* 細節沿用 dictation.css。 */
.wd-play{ display:flex; flex-direction:column; gap:16px; }   /* 100% 滿版，填滿 psb-main */
.wd-topnav{ display:flex; align-items:center; gap:12px; }
.wd-back{ display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:8px 16px; border-radius:999px;
  background:var(--card); color:var(--c-english-ink); border:1px solid var(--card-border); border-left:4px solid var(--accent);
  font-family:inherit; font-size:14px; font-weight:800; cursor:pointer; }
.wd-back:hover{ border-color:var(--accent); }
.wd-step{ margin-left:auto; font-size:14px; font-weight:800; color:var(--ink-soft); }
.wd-h{ margin:0 0 10px; font-size:15px; }
.wd-listen{ text-align:center; }
.wd-bigplay{ display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  width:116px; height:116px; margin:2px auto 12px; border:none; border-radius:999px;
  background:var(--accent); color:var(--on-accent); cursor:pointer; box-shadow:var(--shadow-lg); transition:transform .12s ease; }
.wd-bigplay:hover{ transform:scale(1.04); } .wd-bigplay:active{ transform:scale(.96); }
.wd-bigplay__icon{ font-size:42px; line-height:1; } .wd-bigplay__t{ font-size:14px; font-weight:800; }
.wd-auxrow{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.wd-write-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
.wd-write-top .wd-h{ margin:0; }
.wd-tools{ display:inline-flex; gap:6px; }
.wd-actions{ display:flex; gap:12px; }
.wd-actions .dct-btn{ flex:1; }
.wd-play .dct-canvas{ height:clamp(200px,34vh,300px); border-style:solid; border-color:var(--card-border); }
/* 對答案卡：滿版卡、內容置中一致（句子＋逐詞＋中文都置中），三級自評鈕回到置中大鈕。 */
.wd-play .dct-reveal{ width:100%; max-width:none; align-items:center; text-align:center; gap:10px; }
.wd-play .dct-reveal__row{ text-align:center; max-width:60ch; }
.wd-play .dct-reveal .fc-rate{ width:min(460px,100%); margin:14px auto 0; }

/* ===== iPad 友善版面：一屏不捲動 ＋ 聽卡翻面看答案 ＋ 看答案/自評釘底（2026-11-09，HD 核可方向） ===== */
body{ overflow:hidden; }
.shell{ height:calc(100dvh - 56px); }
.pshell-grid{ height:100%; }
.psb-main{ height:100%; min-height:0; display:flex; flex-direction:column; }
#dct-screen-play{ flex:1 1 auto; min-height:0; }
.wd-play{ height:100%; min-height:0; gap:12px; }
/* ① 聽卡：翻面容器（正面＝聽；背面＝答案就地出現，不往下推、不新增捲動） */
.wd-flip{ flex:0 0 auto; perspective:1400px; }
.wd-flip-inner{ position:relative; transition:transform .5s; transform-style:preserve-3d; }
.wd-flip.flipped .wd-flip-inner{ transform:rotateY(180deg); }
.wd-flip .wd-face{ backface-visibility:hidden; margin:0; }
.wd-flip .wd-face.back{ position:absolute; inset:0; transform:rotateY(180deg); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:8px; text-align:center; }
.wd-listen.gr-card{ min-height:176px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
.wd-bigplay{ width:92px; height:92px; margin:2px auto 4px; }
.wd-ans-label{ font-size:14px; font-weight:800; color:var(--accent); }
/* 答案列（自 #dct-reveal 搬入背面）沿用 dictation.css 的 .dct-reveal__* 樣式 */
.wd-back .dct-reveal__word{ font-size:clamp(26px,5vw,36px); font-weight:800; }
.wd-back .dct-reveal__sentence{ font-size:clamp(20px,3.4vw,26px); font-weight:800; }
/* ② 寫卡：填滿中段、canvas 撐滿 */
.wd-write.gr-card{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
.wd-play .dct-canvas-wrap{ flex:1 1 auto; min-height:0; }
.wd-play .dct-canvas{ height:100%; min-height:0; }
/* 釘底動作列：看答案（翻面前）→ 真 .fc-rate 自評（翻面後，原配色搬入） */
.wd-actions{ flex:0 0 auto; margin-top:2px; align-items:stretch; }
#wd-rate-slot{ display:none; flex:1 1 auto; }
#wd-rate-slot.show{ display:block; }
#wd-rate-slot .fc-rate{ width:100%; max-width:none; margin:0; display:flex; gap:12px; }  /* 搬入後撐滿底列 */
#wd-rate-slot .fc-rate .fc-rate__btn{ flex:1 1 0; }  /* 三顆等寬橫向填滿；按鈕本身保留 app.css 原配色 */
/* #dct-reveal 僅作 dictation.js 的資料來源，內容搬走後不自行顯示 */
.wd-play #dct-reveal{ display:none !important; }
</style>
</head>

<script src="dictation.js"></script>
<script>
/* 側欄「選聽寫類別」(.sb-cat) → 主欄只顯示該類 (.dct-cat.on)；獨立於 dictation.js（只操作本頁靜態外殼）。
   主題例句／CEFR 共用同一個載入鈕（在 #dct-themes），切到任一類若尚未載入即自動觸發，否則 CEFR 會空白。 */
/* 不動舊檔前提下，停止 dictation.js（curAudio 封閉在其 IIFE 內無法外部存取）播放中的音訊：
   在本頁攔截全域 Audio 建構子，登記所有實例並提供 __stopDictAudio() 暫停全部。
   dictation.js 以 new Audio() 播放，且只在使用者播放時才建立（lazy），本攔截在其首次播放前即生效。 */
(function(){
  var Native=window.Audio; if(!Native) return;
  var insts=[]; var suppressUntil=0;
  function Wrapped(src){
    var a=new Native(src); insts.push(a); if(insts.length>64) insts.splice(0, insts.length-64);
    var origPlay=a.play.bind(a);
    a.play=function(){ if(Date.now()<suppressUntil) return Promise.resolve(); return origPlay(); };
    return a;
  }
  Wrapped.prototype=Native.prototype;
  window.Audio=Wrapped;
  window.__stopDictAudio=function(){
    // 暫停目前所有實例，並短暫抑制（蓋住逐詞播放 playWordByWord 的後續 setTimeout 連播）。
    suppressUntil=Date.now()+1500;
    insts.forEach(function(a){ try{ a.pause(); a.currentTime=0; }catch(e){} });
    insts.length=0;
  };
})();
(function(){
  var cats=[].slice.call(document.querySelectorAll('#dct-cats .sb-cat'));
  var secs=[].slice.call(document.querySelectorAll('.dct-cat'));
  function show(cat){
    if(window.__stopDictAudio) window.__stopDictAudio(); // 切類別先停殘響
    // 若正在作答/完成畫面，先回選單（否則點側欄類別看似沒反應——選單被隱藏）。
    var menu=document.getElementById('dct-screen-menu');
    ['dct-screen-play','dct-screen-done'].forEach(function(id){ var e=document.getElementById(id); if(e) e.classList.add('hidden'); });
    if(menu) menu.classList.remove('hidden');
    cats.forEach(function(b){ var on=b.getAttribute('data-cat')===cat; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on?'true':'false'); });
    secs.forEach(function(s){ s.classList.toggle('on', s.getAttribute('data-cat')===cat); });
    if(cat==='themes'||cat==='cefr'){
      // themes 與 cefr 載同一份資料，但載入鈕只建在 #dct-themes；CEFR tab 找 #dct-cefr .dct-load 會落空→首點空白（HD 2026-11-10 回報）。
      // 一律點「存在的那顆」loader（擇一 themes／cefr），兩容器都會在載完後填入；載入中回饋顯示在 themes 容器。
      var loader=document.querySelector('#dct-themes .dct-load') || document.querySelector('#dct-cefr .dct-load');
      if(loader && !loader.disabled){ loader.click(); }
    }
  }
  cats.forEach(function(b){ b.setAttribute('aria-pressed', b.classList.contains('on')?'true':'false'); b.addEventListener('click', function(){ show(b.getAttribute('data-cat')); }); });
})();
/* 翻面看答案版面（HD 核可 2026-11-09）：不改 dictation.js，只「搬移」它產生的 #dct-reveal 內容——
   答案列 → 聽卡背面 #wd-answer-slot；真 .fc-rate（app.css 原配色）→ 釘底 #wd-rate-slot。換題/隱藏即還原正面。 */
(function(){
  var rv=document.getElementById('dct-reveal'), flip=document.getElementById('wd-flip'),
      ansSlot=document.getElementById('wd-answer-slot'), rateSlot=document.getElementById('wd-rate-slot'),
      revealBtn=document.getElementById('dct-reveal-btn');
  if(!rv||!flip||!ansSlot||!rateSlot) return;
  function toFront(){
    flip.classList.remove('flipped');
    rateSlot.classList.remove('show'); rateSlot.innerHTML=''; ansSlot.innerHTML='';
    if(revealBtn) revealBtn.style.display='';
  }
  function toBack(){
    var rate=rv.querySelector('.dct-rate, .fc-rate');
    ansSlot.innerHTML='';
    Array.prototype.slice.call(rv.children).forEach(function(c){ if(c!==rate) ansSlot.appendChild(c); });
    if(rate){ rateSlot.appendChild(rate); rateSlot.classList.add('show'); }
    if(revealBtn) revealBtn.style.display='none';
    flip.classList.add('flipped');
  }
  var mo=new MutationObserver(function(){
    var hidden=rv.classList.contains('hidden');
    if(!hidden && rv.children.length){ toBack(); }
    else if(hidden && flip.classList.contains('flipped')){ toFront(); }
  });
  mo.observe(rv,{attributes:true,attributeFilter:['class'],childList:true});
})();
</script>
