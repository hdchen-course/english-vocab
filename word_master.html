<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>單字大師（分級字庫）📚</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<script src="assets/srs_engine.js"></script>
<link rel="stylesheet" href="assets/unit.css"><!-- 共用房屋 pshell（.pshell-grid/.psb/.psb-main/.sb-*/.sb-cat）；與 dictation / 333 單元頁同一套 -->
<style>
/* 單字大師（分級字庫）葉工具頁。資料＝Anki COCA 10K（sense-aligned）；色彩一律吃 app.css 英語科 token。 */
:root{ --accent:var(--c-english); --accent-tint:var(--tint-english); --accent-ink:var(--c-english-ink); }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;overflow-x:hidden}
/* 版面＝共用房屋 pshell（unit.css：.pshell-grid/.psb/.psb-main/.sb-group/.sb-title/.sb-back/.sb-cat）。本頁只留卡片與 scheme 小控制。 */
.sb-note{font-size:12px;color:var(--ink-soft);padding:0 2px;line-height:1.5}
.wm-intro h1{font-size:21px;margin:0 0 4px;display:flex;align-items:center;gap:9px}
.wm-intro p{margin:0;color:var(--ink-soft);font-size:13.5px}
.wm-deckline{font-size:13px;color:var(--accent-ink);font-weight:700;margin:10px 2px 14px}
/* 卡片 */
.wm-card{background:var(--card);border:1px solid var(--card-border);border-radius:18px;box-shadow:var(--shadow-lg);max-width:600px;margin:0 auto;min-height:360px;display:flex;flex-direction:column;overflow:hidden}
.wm-tag{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}
.tg{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--accent-tint);color:var(--accent-ink)}
.tg.band{background:var(--accent);color:var(--on-accent)}
.wm-face{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 26px 8px}
.wm-def{font-size:23px;font-weight:700;text-align:center;line-height:1.4;margin:6px 4px 12px}
.wm-pos{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.wm-hintrow{text-align:center;margin:2px 0 8px}
.wm-hintbtn{border:1px dashed var(--accent);background:none;color:var(--accent-ink);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700;cursor:pointer}
.wm-hintshow{font-size:22px;letter-spacing:.3em;color:var(--accent-ink);font-weight:800;margin:2px 0 8px;text-align:center}
.wm-hr{border:none;border-top:1px solid var(--card-border);margin:8px 0}
.wm-ex{font-size:18px;margin:11px 2px;line-height:1.6}
.wm-blank{display:inline-block;min-width:72px;border-bottom:2.5px solid var(--accent);color:transparent;margin:0 3px;vertical-align:bottom}
.wm-wordrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 6px}
.wm-word{font-size:42px;font-weight:800;color:var(--accent-ink)}
.wm-ipa{text-align:center;font-size:17px;color:var(--ink-soft);margin-bottom:12px}
.wm-ipa b{color:var(--ink);font-weight:600}
.wm-exrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--card-border)}
.wm-exrow .wm-ex{flex:1;margin:0}
.wm-ans{color:var(--accent-ink);font-weight:800}
.wm-rnd{width:46px;height:46px;border-radius:999px;border:1px solid var(--card-border);background:var(--accent-tint);color:var(--accent-ink);font-size:19px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.wm-rnd.sm{width:40px;height:40px;font-size:16px}
.wm-ctl{padding:10px 18px 18px;border-top:1px solid var(--card-border)}
.wm-flip{width:100%;min-height:50px;border:none;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:800;cursor:pointer}
.wm-flipback{width:100%;min-height:40px;border:1px solid var(--card-border);background:var(--card);color:var(--accent-ink);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px}
.wm-flipback:hover{border-color:var(--accent)}
.wm-rate{display:flex;gap:10px}
.wm-rate button{flex:1;min-height:50px;border-radius:12px;border:1px solid var(--card-border);background:var(--card);color:var(--ink);font-size:14.5px;font-weight:700;cursor:pointer}
.wm-rate button.again{border-color:#e0894a;color:#c56a1f}
.wm-rate button.good{border-color:var(--accent);color:var(--accent-ink)}
.wm-rate button.easy{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.wm-foot{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:14px}
.wm-schemes{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px}
.wm-schemes button{min-height:0;width:auto;flex:0 0 auto;padding:4px 10px;font-size:12px;font-weight:700;border:1px solid var(--card-border);border-radius:999px}
.wm-schemes button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:800}
.tg.lvl{background:var(--accent);color:var(--on-accent)}
.tg.freq{background:var(--card);border:1px solid var(--card-border);color:var(--ink-soft)}
.tg.na{background:var(--card);border:1px dashed var(--card-border);color:var(--ink-soft)}
</style></head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index_new.html"><span aria-hidden="true">🏠</span> 學習地圖</a>
  <span class="app-bar__title">單字大師（分級字庫）📚</span>
  <button class="app-bar__theme" id="themeBtn" aria-label="日夜切換">🌙</button>
</header>
<main class="shell"><div class="pshell-grid pshell--mobilebar">
  <aside class="psb" aria-label="導覽側欄">
    <div class="sb-group"><div class="sb-title">你在哪裡</div>
      <a class="sb-back" href="index_new.html#eng"><span aria-hidden="true">←</span> 英語文</a>
    </div>
    <div class="sb-group lv"><div class="sb-title">選分級 / 字庫</div>
      <div id="schemeTabs" class="wm-schemes"></div>
      <div id="levelList"></div>
    </div>
    <div class="sb-group"><div class="sb-title">本回合</div>
      <div class="sb-note" id="roundNote">載入中…</div>
    </div>
  </aside>
  <div class="psb-main">
    <div class="wm-intro">
      <p>COCA 高頻字 · 聽音優先 · 看義想字 · 首字母提示 · 三級自評 · 間隔複習（SRS）。先看定義與例句回想單字，翻面對答案並聽發音。</p></div>
    <div class="wm-deckline" id="deckLine"></div>
    <div class="wm-card" id="card" aria-live="polite">
      <div class="wm-tag" id="cardTag"></div>
      <div class="wm-face" id="face"></div>
      <div class="wm-ctl" id="ctl"></div>
    </div>
    <p class="wm-foot">英文學英文：卡面只給英文定義與例句；字長大於 2 可按「提示」看首字母。自評誠實選，SRS 會依此安排複習。</p>
  </div>
</div></main>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const AUD='assets/wordmaster/audio/';
const DATA='assets/wordmaster/';
let CARDS=[], idx=0, flipped=false, hinted=false;
let INDEX=null, scheme='cefr', curLevel=null, curPool=[];
const shardCache={};
const STORE=(window.SRS&&window.SRS.createStore)?window.SRS.createStore('wordmaster_srs_v1'):null;
const DAILY_NEW=20;  // 每回合新卡上限（到期複習不受限，優先排入）
// scheme → level 顯示設定（難易度軸＝CEFR；band 僅頻率，不當級別）
const CEFR_LV=['a1','a2','b1','b2','c1','c2'], CEFR_UP={a1:'A1',a2:'A2',b1:'B1',b2:'B2',c1:'C1',c2:'C2'};
const YLE_ZH={starters:'Starters',movers:'Movers',flyers:'Flyers'};
function playAudio(f){ if(!f) return; try{ new Audio(AUD+f).play().catch(()=>{}); }catch(e){} }
function blankExample(text, hw){
  const re=new RegExp('\\b'+hw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(s|es|ed|ing|d)?\\b','ig');
  return esc(text).replace(re,'<span class="wm-blank">____</span>');
}
function restoreExample(text, hw){
  const re=new RegExp('\\b'+hw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(s|es|ed|ing|d)?\\b','ig');
  return esc(text).replace(re,m=>'<span class="wm-ans">'+m+'</span>');
}
function hintMask(w){ return w[0]+' '+Array(Math.max(0,w.length-1)).fill('_').join(' '); }
function levelChips(c){
  let h='';
  h += c.cefr ? `<span class="tg lvl">CEFR ${esc(c.cefr)}</span>` : `<span class="tg na">未分級</span>`;
  if(c.gept)  h += `<span class="tg">全民英檢 ${esc(c.gept)}</span>`;
  if(c.yle)   h += `<span class="tg">YLE ${esc(YLE_ZH[c.yle]||c.yle)}</span>`;
  if(c.toeic) h += `<span class="tg">TOEIC</span>`;
  h += `<span class="tg freq">COCA ${esc(c.band)} 頻率</span>`;
  return h;
}
function render(){
  const c=CARDS[idx]; if(!c){ return; }
  document.getElementById('cardTag').innerHTML=levelChips(c);
  const face=document.getElementById('face'), ctl=document.getElementById('ctl');
  const exs=(c.ex||[]).slice(0,2);
  if(!flipped){
    const hintHtml = (c.hw||'').length>2
      ? (hinted ? `<div class="wm-hintshow">${esc(hintMask(c.hw))}</div>`
                : `<div class="wm-hintrow"><button class="wm-hintbtn" id="hintBtn">💡 提示（首字母）</button></div>`)
      : '';
    face.innerHTML=`<div class="wm-def">${esc(c.def)}</div>`+
      `<div class="wm-pos">${esc(c.pos||'')}</div>`+hintHtml+`<hr class="wm-hr">`+
      exs.map(e=>`<div class="wm-ex">${blankExample(e,c.hw)}</div>`).join('');
    ctl.innerHTML=`<button class="wm-flip" id="flipBtn">翻面看答案 ↻</button>`;
    const hb=document.getElementById('hintBtn'); if(hb) hb.onclick=()=>{hinted=true;render();};
    document.getElementById('flipBtn').onclick=()=>{flipped=true;render();};
  }else{
    face.innerHTML=`<div class="wm-wordrow"><span class="wm-word">${esc(c.hw)}</span>`+
      `<button class="wm-rnd" id="wAudio" title="播放單字發音" aria-label="播放單字發音">🔊</button></div>`+
      `<div class="wm-ipa">US <b>/${esc(c.ipaus)}/</b> &nbsp; UK <b>/${esc(c.ipauk)}/</b></div>`+
      exs.map((e,i)=>`<div class="wm-exrow"><div class="wm-ex">${restoreExample(e,c.hw)}</div>`+
        ((c.ae&&c.ae[i])?`<button class="wm-rnd sm" data-ae="${i}" title="播放例句" aria-label="播放例句">🔊</button>`:'')+`</div>`).join('');
    ctl.innerHTML=`<button class="wm-flipback" id="backBtn">↩ 翻回正面看定義</button>`+
      `<div class="wm-rate"><button class="again">還不熟</button><button class="good">快會了</button><button class="easy">會了 ✓</button></div>`;
    const bk=document.getElementById('backBtn'); if(bk) bk.onclick=()=>{ flipped=false; render(); };
    const wa=document.getElementById('wAudio'); if(wa) wa.onclick=()=>playAudio(c.aw);
    face.querySelectorAll('[data-ae]').forEach(b=>b.onclick=()=>playAudio(c.ae[+b.dataset.ae]));
    const grades=['again','good','easy'];
    ctl.querySelectorAll('.wm-rate button').forEach((b,i)=>b.onclick=()=>rate(grades[i]));
    playAudio(c.aw); // audio-first：翻面即播單字
  }
  document.getElementById('deckLine').innerHTML=`本回合牌組：${esc(deckLabel())} · 第 ${idx+1} / ${CARDS.length} 張`;
}
function startSession(){
  const pool=curPool||[];
  CARDS = STORE ? STORE.buildSession(pool,{idOf:c=>c.sk, dailyNew:DAILY_NEW}) : pool.slice();
  idx=0; flipped=false; hinted=false;
  const rn=document.getElementById('roundNote');
  if(!pool.length){ document.getElementById('face').innerHTML='<p class="wm-foot">這一級目前沒有字。</p>'; if(rn) rn.innerHTML='本回合：'+esc(deckLabel()); return; }
  if(!CARDS.length){ renderDone(); if(rn) rn.innerHTML='本回合：'+esc(deckLabel())+'<br>今日複習已完成 🎉'; return; }
  if(rn) rn.innerHTML='本回合：'+esc(deckLabel())+'<br>'+CARDS.length+' 張（新卡＋到期複習）· 全級共 '+pool.length+' 字';
  render();
}
function renderDone(){
  document.getElementById('cardTag').innerHTML='';
  document.getElementById('face').innerHTML='<div class="wm-def">這一級今天的新卡與到期複習都做完了 🎉</div>'+
    '<div class="wm-pos">換個分級，或明天再回來複習（SRS 已記住你的進度）。</div>';
  document.getElementById('ctl').innerHTML='<button class="wm-flip" id="moreBtn">再來一批 / 重新開始 ↻</button>';
  const mb=document.getElementById('moreBtn'); if(mb) mb.onclick=()=>startSession();
  document.getElementById('deckLine').innerHTML='本回合牌組：'+esc(deckLabel())+' · 完成';
}
function rate(grade){
  const c=CARDS[idx];
  try{ if(STORE) STORE.rate(c.sk, grade); }catch(e){}
  if(idx>=CARDS.length-1){ startSession(); return; } // 回合結束→重建取下一批（今日清空則顯示完成）
  next();
}
function next(){ idx=(idx+1)%CARDS.length; flipped=false; hinted=false; render(); }
function deckLabel(){
  const S=INDEX&&INDEX.schemes[scheme];
  if(!curLevel) return '—';
  if(scheme==='cefr') return curLevel==='unclassified'?'未分級':'CEFR '+(CEFR_UP[curLevel]||curLevel);
  if(scheme==='yle')  return 'YLE '+(YLE_ZH[curLevel]||curLevel);
  if(scheme==='toeic')return 'TOEIC（TSL）';
  if(scheme==='coca')  return curLevel==='tail'?'COCA 較少見字':'COCA 最常用 '+curLevel;
  return (S?S.label_zh:'')+' '+curLevel;
}
function shardKey(level){ return scheme==='cefr' ? level : (scheme+'/'+level); }
function loadLevel(level){
  curLevel=level;
  [...document.querySelectorAll('#levelList button')].forEach(b=>b.classList.toggle('on', b.dataset.lv===level));
  const key=shardKey(level), file=DATA+'cards/'+key.replace(/\//g,'_')+'.json';
  const use=d=>{ curPool=(d&&d.cards)||[]; startSession(); };
  if(shardCache[key]) return use(shardCache[key]);
  document.getElementById('face').innerHTML='<p class="wm-foot">載入中…</p>';
  fetch(file,{cache:'no-store'}).then(r=>r.ok?r.json():null,()=>null).then(d=>{ shardCache[key]=d; use(d); });
}
function levelsFor(scm){
  const S=INDEX.schemes[scm], cnt=INDEX.counts[scm]||{};
  const lbl=lv=>scm==='cefr'?(CEFR_UP[lv]||lv):scm==='yle'?YLE_ZH[lv]:scm==='toeic'?'TOEIC 字表':scm==='coca'?(lv==='tail'?'較少見字':'最常用 '+lv):lv;
  let items=S.levels.map(lv=>({lv, label: lbl(lv), n: scm==='cefr'?(cnt[CEFR_UP[lv]]||0):(scm==='toeic'?(INDEX.counts.toeic||0):(cnt[lv]||0))}));
  if(scm==='cefr') items.push({lv:'unclassified', label:'未分級', n: cnt['unclassified']||0});
  return items;
}
function renderSidebar(){
  const tabs=document.getElementById('schemeTabs');
  tabs.innerHTML=Object.keys(INDEX.schemes).map(k=>`<button data-scm="${k}" class="${k===scheme?'on':''}">${esc(INDEX.schemes[k].label_zh)}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{ scheme=b.dataset.scm;
    tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); renderLevels(); });
  renderLevels();
}
function renderLevels(){
  const ll=document.getElementById('levelList');
  ll.innerHTML=levelsFor(scheme).map(it=>`<button class="sb-cat" data-lv="${it.lv}">${esc(it.label)} <span class="n">${it.n}</span></button>`).join('');
  ll.querySelectorAll('button').forEach(b=>b.onclick=()=>loadLevel(b.dataset.lv));
  // 預設載該 scheme 第一個非空級別
  const first=levelsFor(scheme).find(it=>it.n>0) || levelsFor(scheme)[0];
  if(first) loadLevel(first.lv);
}
document.getElementById('themeBtn').onclick=()=>document.documentElement.classList.toggle('dark');
fetch(DATA+'index.json',{cache:'no-store'}).then(r=>r.ok?r.json():null,()=>null).then(d=>{
  if(!d||!d.schemes){ document.getElementById('face').innerHTML='<p class="wm-foot" role="alert">⚠ 字庫索引暫時無法載入（請用 http 開啟）。</p>'; return; }
  INDEX=d; renderSidebar();
});
</script>
</body></html>
