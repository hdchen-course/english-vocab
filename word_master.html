<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>單字大師（分級字庫）📚</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="game_core.css">
<script src="game_core.js"></script>
<script src="assets/srs_engine.js"></script>
<link rel="stylesheet" href="assets/unit.css"><!-- 共用房屋 pshell -->
<link rel="stylesheet" href="assets/wd-practice.css"><!-- 共用 word_* 練習骨架（翻面卡＋釘底全寬自評）；與 word_idioms／word_dictation 一致（HD 2026-11-10 三頁統一） -->
<style>
/* 單字大師（分級字庫）葉工具頁。資料＝Anki COCA 10K（sense-aligned）；色彩一律吃 app.css 英語科 token。
   版型＝共用 wd-practice.css（翻面卡＋釘底全寬 .fc-rate）；本檔只留卡面「內容」樣式與 scheme 小控制。 */
:root{ --accent:var(--c-english); --accent-tint:var(--tint-english); --accent-ink:var(--c-english-ink); }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;overflow-x:hidden}
.sb-note{font-size:12px;color:var(--ink-soft);padding:0 2px;line-height:1.5}
.wm-deckline{font-size:14px;color:var(--accent-ink);font-weight:800}
/* 卡面內容（卡框＝共用 .gr-card + .wd-face） */
.wm-face-in{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:2px;width:100%;max-width:min(1040px,92%);margin:0 auto}
.wm-tag{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.tg{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--accent-tint);color:var(--accent-ink)}
.tg.lvl{background:var(--accent);color:var(--on-accent)}
.tg.freq{background:var(--card);border:1px solid var(--card-border);color:var(--ink-soft)}
.tg.na{background:var(--card);border:1px dashed var(--card-border);color:var(--ink-soft)}
.wm-def{font-size:clamp(20px,4vw,24px);font-weight:700;text-align:center;line-height:1.4;margin:6px 4px 10px}
.wm-pos{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.wm-hintrow{text-align:center;margin:2px 0 8px}
.wm-hintbtn{border:1px dashed var(--accent);background:none;color:var(--accent-ink);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700;cursor:pointer}
.wm-hintshow{font-size:22px;letter-spacing:.3em;color:var(--accent-ink);font-weight:800;margin:2px 0 8px;text-align:center}
.wm-hr{border:none;border-top:1px solid var(--card-border);margin:8px 0;width:100%}
.wm-ex{font-size:clamp(16px,3.2vw,18px);margin:11px 2px;line-height:1.6;text-align:center}
.wm-blank{display:inline-block;min-width:72px;border-bottom:2.5px solid var(--accent);color:transparent;margin:0 3px;vertical-align:bottom}
.wm-wordrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 6px}
.wm-word{font-size:clamp(32px,7vw,42px);font-weight:800;color:var(--accent-ink)}
.wm-ipa{text-align:center;font-size:16px;color:var(--ink-soft);margin-bottom:10px}
.wm-ipa b{color:var(--ink);font-weight:600}
.wm-exrow{display:flex;align-items:center;justify-content:center;gap:12px;padding:9px 0;border-top:1px solid var(--card-border)}
.wm-exrow .wm-ex{flex:0 1 auto;margin:0;text-align:center}
.wm-ans{color:var(--accent-ink);font-weight:800}
.wm-rnd{width:46px;height:46px;border-radius:999px;border:1px solid var(--card-border);background:var(--accent-tint);color:var(--accent-ink);font-size:19px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.wm-rnd.sm{width:40px;height:40px;font-size:16px}
.wm-schemes{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px}
.wm-schemes button{min-height:0;width:auto;flex:0 0 auto;padding:4px 10px;font-size:12px;font-weight:700;border:1px solid var(--card-border);border-radius:999px;background:var(--card);color:var(--ink)}
.wm-schemes button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:800}
</style></head>
<body data-game-hud="off" class="wd-noscroll">
<header class="app-bar">
  <a class="app-bar__home" href="index_new.html"><span aria-hidden="true">🏠</span> 學習地圖</a>
  <span class="app-bar__title">單字大師（分級字庫）📚</span>
  <button class="app-bar__theme" id="themeBtn" aria-label="日夜切換">🌙</button>
</header>
<main class="shell"><div class="pshell-grid pshell--mobilebar">
  <aside class="psb" aria-label="導覽側欄">
    <div class="sb-group"><div class="sb-title">你在哪裡</div>
      <a class="sb-back" href="index_new.html#eng"><span aria-hidden="true">←</span> 英語文</a>
    </div>
    <div class="sb-group lv"><div class="sb-title">選分級 / 字庫</div>
      <div id="schemeTabs" class="wm-schemes"></div>
      <div id="levelList"></div>
    </div>
    <div class="sb-group"><div class="sb-title">本回合</div>
      <div class="sb-note" id="roundNote">載入中…</div>
    </div>
    <div class="sb-group"><div class="sb-title">更多</div>
      <a class="sb-cat current" href="word_master.html">📚 單字大師練習</a>
      <a class="sb-cat" href="word_stats.html">📊 學習統計</a>
      <a class="sb-cat" href="word_browse.html">📖 全部單字（字母序）</a>
    </div>
  </aside>
  <div class="psb-main">
    <section class="wd-screen">
      <div class="wd-play">
        <div class="wd-topnav">
          <span class="wm-deckline wd-step" id="deckLine"></span>
        </div>

        <!-- ① 翻面卡：正面＝看義想字（定義＋挖空例句）；背面＝單字＋IPA＋例句＋發音 -->
        <div class="wd-flip" id="wd-flip">
          <div class="wd-flip-inner">
            <div class="gr-card wd-face front"><div class="wm-face-in" id="wmFront" aria-live="polite"></div></div>
            <div class="gr-card wd-face back"><div class="wm-face-in" id="wmBack"></div></div>
          </div>
        </div>

        <!-- 釘底動作列：翻面看答案（翻面前）→ 全寬三級自評 .fc-rate（翻面後搬入 #wd-rate-slot） -->
        <div class="wd-actions">
          <button type="button" class="wd-revealbtn" id="flipBtn">翻面看答案 ↻</button>
          <div id="wd-rate-slot"></div>
        </div>
      </div>
    </section>
  </div>
</div></main>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const AUD='assets/wordmaster/audio/';
const DATA='assets/wordmaster/';
let CARDS=[], idx=0, flipped=false, hinted=false;
let INDEX=null, scheme='cefr', curLevel=null, curPool=[];
const shardCache={};
const STORE=(window.SRS&&window.SRS.createStore)?window.SRS.createStore('wordmaster_srs_v1'):null;
const DAILY_NEW=20;
const ROUND_SIZE=20; // 一回合最多 20 張（到期複習優先、再補新卡）；做完要再練才按「再來一回合」，避免每日複習量雪球式暴增
const CEFR_UP={a1:'A1',a2:'A2',b1:'B1',b2:'B2',c1:'C1',c2:'C2'};
const YLE_ZH={starters:'Starters',movers:'Movers',flyers:'Flyers'};
const flipEl=()=>document.getElementById('wd-flip');
const rateSlot=()=>document.getElementById('wd-rate-slot');
function playAudio(f){ if(!f) return; try{ new Audio(AUD+f).play().catch(()=>{}); }catch(e){} }
function blankExample(text, hw){
  const re=new RegExp('\\b'+hw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(s|es|ed|ing|d)?\\b','ig');
  return esc(text).replace(re,'<span class="wm-blank">____</span>');
}
function restoreExample(text, hw){
  const re=new RegExp('\\b'+hw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(s|es|ed|ing|d)?\\b','ig');
  return esc(text).replace(re,m=>'<span class="wm-ans">'+m+'</span>');
}
function hintMask(w){ return w[0]+' '+Array(Math.max(0,w.length-1)).fill('_').join(' '); }
function levelChips(c){
  let h='';
  h += c.cefr ? `<span class="tg lvl">CEFR ${esc(c.cefr)}</span>` : (c.cefr_est ? `<span class="tg na">約 ${esc(c.cefr_est)}</span>` : `<span class="tg na">未分級</span>`);
  if(c.gept)  h += `<span class="tg">全民英檢 ${esc(c.gept)}</span>`;
  if(c.yle)   h += `<span class="tg">YLE ${esc(YLE_ZH[c.yle]||c.yle)}</span>`;
  if(c.toeic) h += `<span class="tg">TOEIC</span>`;
  h += `<span class="tg freq">COCA ${esc(c.band)} 頻率</span>`;
  return h;
}
function toFront(){
  flipped=false;
  if(flipEl()) flipEl().classList.remove('flipped');
  const rs=rateSlot(); if(rs){ rs.classList.remove('show'); rs.innerHTML=''; }
  const fb=document.getElementById('flipBtn'); if(fb) fb.style.display='';
}
function render(){
  const c=CARDS[idx]; if(!c){ return; }
  const front=document.getElementById('wmFront'), back=document.getElementById('wmBack');
  const exs=(c.ex||[]).slice(0,2);
  // 正面：定義＋詞性＋（首字母提示）＋挖空例句
  const hintHtml = (c.hw||'').length>2
    ? (hinted ? `<div class="wm-hintshow">${esc(hintMask(c.hw))}</div>`
              : `<div class="wm-hintrow"><button class="wm-hintbtn" id="hintBtn">💡 提示（首字母）</button></div>`)
    : '';
  front.innerHTML=`<div class="wm-tag">${levelChips(c)}</div>`+
    `<div class="wm-def">${esc(c.def)}</div>`+
    `<div class="wm-pos">${esc(c.pos||'')}</div>`+hintHtml+`<hr class="wm-hr">`+
    exs.map(e=>`<div class="wm-ex">${blankExample(e,c.hw)}</div>`).join('');
  // 背面：單字＋發音＋IPA＋例句（填回）
  back.innerHTML=`<div class="wm-wordrow"><span class="wm-word">${esc(c.hw)}</span>`+
    `<button class="wm-rnd" id="wAudio" title="播放單字發音" aria-label="播放單字發音">🔊</button></div>`+
    `<div class="wm-ipa">US <b>/${esc(c.ipaus)}/</b> &nbsp; UK <b>/${esc(c.ipauk)}/</b></div>`+
    exs.map((e,i)=>`<div class="wm-exrow"><div class="wm-ex">${restoreExample(e,c.hw)}</div>`+
      ((c.ae&&c.ae[i])?`<button class="wm-rnd sm" data-ae="${i}" title="播放例句" aria-label="播放例句">🔊</button>`:'')+`</div>`).join('');
  const hb=document.getElementById('hintBtn'); if(hb) hb.onclick=()=>{hinted=true;render();};
  document.getElementById('deckLine').innerHTML=`本回合牌組：${esc(deckLabel())} · 第 ${idx+1} / ${CARDS.length} 張`;
  // 依 flipped 狀態擺正/翻面
  if(flipped){ showBack(); } else { toFront(); }
}
function showBack(){
  const c=CARDS[idx]; if(!c) return;
  flipped=true;
  if(flipEl()) flipEl().classList.add('flipped');
  const fb=document.getElementById('flipBtn'); if(fb) fb.style.display='none';
  // 綁發音
  const wa=document.getElementById('wAudio'); if(wa) wa.onclick=()=>playAudio(c.aw);
  document.getElementById('wmBack').querySelectorAll('[data-ae]').forEach(b=>b.onclick=()=>playAudio(c.ae[+b.dataset.ae]));
  // 三級自評（app.css .fc-rate solid 配色）搬入釘底 #wd-rate-slot 全寬
  const rs=rateSlot();
  rs.innerHTML='<div class="fc-rate">'
    +'<button type="button" class="fc-rate__btn again" data-grade="again" aria-label="還不熟">😅<span class="fc-rate__btn__label">還不熟</span></button>'
    +'<button type="button" class="fc-rate__btn good" data-grade="good" aria-label="快會了">🙂<span class="fc-rate__btn__label">快會了</span></button>'
    +'<button type="button" class="fc-rate__btn easy" data-grade="easy" aria-label="會了">😎<span class="fc-rate__btn__label">會了</span></button>'
    +'</div>';
  const grades=['again','good','easy'];
  rs.querySelectorAll('.fc-rate__btn').forEach((b,i)=>b.onclick=()=>rate(grades[i]));
  rs.classList.add('show');
  playAudio(c.aw); // audio-first：翻面即播單字
  const focusRate=()=>{ const b=rs.querySelector('.fc-rate__btn'); if(b){ try{ b.focus(); }catch(e){} } };
  let reduce=false; try{ reduce=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduce) focusRate(); else setTimeout(focusRate,520);
}
function startSession(){
  const pool=curPool||[];
  CARDS = STORE ? STORE.buildSession(pool,{idOf:c=>c.sk, dailyNew:DAILY_NEW, reviewCap:ROUND_SIZE}) : pool.slice(0,ROUND_SIZE);
  idx=0; flipped=false; hinted=false;
  const rn=document.getElementById('roundNote');
  if(!pool.length){ document.getElementById('wmFront').innerHTML='<p class="wm-pos">這一級目前沒有字。</p>'; toFront(); if(rn) rn.innerHTML='本回合：'+esc(deckLabel()); return; }
  if(!CARDS.length){ renderDone(); if(rn) rn.innerHTML='本回合：'+esc(deckLabel())+'<br>今日複習已完成 🎉'; return; }
  if(rn) rn.innerHTML='本回合：'+esc(deckLabel())+'<br>'+CARDS.length+' 張（一回合最多 '+ROUND_SIZE+'：到期複習優先＋新卡）· 全級共 '+pool.length+' 字';
  render();
}
function renderDone(){
  const front=document.getElementById('wmFront'), back=document.getElementById('wmBack');
  toFront();
  front.innerHTML='<div class="wm-def">這一級今天的新卡與到期複習都做完了 🎉</div>'+
    '<div class="wm-pos">換個分級，或明天再回來複習（SRS 已記住你的進度）。</div>';
  back.innerHTML='';
  const fb=document.getElementById('flipBtn'); if(fb){ fb.textContent='再來一批 / 重新開始 ↻'; fb.style.display=''; fb.onclick=()=>{ fb.textContent='翻面看答案 ↻'; fb.onclick=onFlip; startSession(); }; }
  document.getElementById('deckLine').innerHTML='本回合牌組：'+esc(deckLabel())+' · 完成';
}
function rate(grade){
  const c=CARDS[idx];
  try{ if(STORE) STORE.rate(c.sk, grade); }catch(e){}
  if(idx>=CARDS.length-1){ renderRoundComplete(); return; }
  idx++; flipped=false; hinted=false; render();
}
// 一回合（最多 ROUND_SIZE 張）做完：不自動再開一回合（否則到期卡越滾越多、每天量暴增）。
// 顯示完成畫面＋「再來一回合」按鈕；想多練才按，按了才建下一批。若已無到期/新卡則顯示今日完成。
function renderRoundComplete(){
  const done=CARDS.length;
  // 唯讀預看下一回合是否還有卡（buildSession 只讀 peek、不改狀態）
  let nextN=0;
  try{ if(STORE){ nextN=STORE.buildSession(curPool||[],{idOf:c=>c.sk, dailyNew:DAILY_NEW, reviewCap:ROUND_SIZE}).length; } }catch(e){}
  toFront();
  const front=document.getElementById('wmFront'), back=document.getElementById('wmBack');
  back.innerHTML='';
  const fb=document.getElementById('flipBtn');
  if(nextN>0){
    front.innerHTML='<div class="wm-def">這一回合 '+done+' 張做完了，很棒！🎉</div>'+
      '<div class="wm-pos">今天先到這裡就可以囉。想多練的話，按「再來一回合」會再給你一批（最多 '+ROUND_SIZE+' 張）。</div>';
    if(fb){ fb.textContent='再來一回合（還有 '+Math.min(nextN,ROUND_SIZE)+' 張）↻'; fb.style.display='';
      fb.onclick=()=>{ fb.textContent='翻面看答案 ↻'; fb.onclick=onFlip; startSession(); }; }
  } else {
    front.innerHTML='<div class="wm-def">這一回合 '+done+' 張做完，今天的複習也全部完成了 🎉</div>'+
      '<div class="wm-pos">換個分級，或明天再回來（SRS 已記住你的進度）。</div>';
    if(fb){ fb.textContent='重新開始這一級 ↻'; fb.style.display='';
      fb.onclick=()=>{ fb.textContent='翻面看答案 ↻'; fb.onclick=onFlip; startSession(); }; }
  }
  document.getElementById('deckLine').innerHTML='本回合牌組：'+esc(deckLabel())+' · 完成';
  const rn=document.getElementById('roundNote'); if(rn) rn.innerHTML='本回合：'+esc(deckLabel())+'<br>這一回合完成 ✓'+(nextN>0?('（還有約 '+nextN+' 張可練）'):'（今日複習已完成）');
}
function onFlip(){ hinted=hinted; showBack(); }
function deckLabel(){
  if(!curLevel) return '—';
  if(scheme==='cefr') return curLevel==='unclassified'?'未分級':'CEFR '+(CEFR_UP[curLevel]||curLevel);
  if(scheme==='yle')  return 'YLE '+(YLE_ZH[curLevel]||curLevel);
  if(scheme==='toeic')return 'TOEIC（TSL）';
  if(scheme==='coca')  return curLevel==='tail'?'COCA 較少見字':'COCA 最常用 '+curLevel;
  const S=INDEX&&INDEX.schemes[scheme]; return (S?S.label_zh:'')+' '+curLevel;
}
function shardKey(level){ return scheme==='cefr' ? level : (scheme+'/'+level); }
function loadLevel(level){
  curLevel=level;
  [...document.querySelectorAll('#levelList button')].forEach(b=>b.classList.toggle('on', b.dataset.lv===level));
  const key=shardKey(level), file=DATA+'cards/'+key.replace(/\//g,'_')+'.json';
  const use=d=>{ curPool=(d&&d.cards)||[]; startSession(); };
  if(shardCache[key]) return use(shardCache[key]);
  document.getElementById('wmFront').innerHTML='<p class="wm-pos">載入中…</p>'; toFront();
  fetch(file,{cache:'no-store'}).then(r=>r.ok?r.json():null,()=>null).then(d=>{ shardCache[key]=d; use(d); });
}
function levelsFor(scm){
  const S=INDEX.schemes[scm], cnt=INDEX.counts[scm]||{};
  const lbl=lv=>scm==='cefr'?(CEFR_UP[lv]||lv):scm==='yle'?YLE_ZH[lv]:scm==='toeic'?'TOEIC 字表':scm==='coca'?(lv==='tail'?'較少見字':'最常用 '+lv):lv;
  let items=S.levels.map(lv=>({lv, label: lbl(lv), n: scm==='cefr'?(cnt[CEFR_UP[lv]]||0):(scm==='toeic'?(INDEX.counts.toeic||0):(cnt[lv]||0))}));
  if(scm==='cefr' && (cnt['unclassified']||0)>0) items.push({lv:'unclassified', label:'未分級', n: cnt['unclassified']});
  return items;
}
function renderSidebar(){
  const tabs=document.getElementById('schemeTabs');
  tabs.innerHTML=Object.keys(INDEX.schemes).map(k=>`<button data-scm="${k}" class="${k===scheme?'on':''}">${esc(INDEX.schemes[k].label_zh)}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{ scheme=b.dataset.scm;
    tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); renderLevels(); });
  renderLevels();
}
function renderLevels(){
  const ll=document.getElementById('levelList');
  ll.innerHTML=levelsFor(scheme).map(it=>`<button class="sb-cat" data-lv="${it.lv}">${esc(it.label)} <span class="n">${it.n}</span></button>`).join('');
  ll.querySelectorAll('button').forEach(b=>b.onclick=()=>loadLevel(b.dataset.lv));
  const first=levelsFor(scheme).find(it=>it.n>0) || levelsFor(scheme)[0];
  if(first) loadLevel(first.lv);
}
document.getElementById('flipBtn').onclick=onFlip;
document.getElementById('themeBtn').onclick=()=>document.documentElement.classList.toggle('dark');
// 單張模式：從「全部單字」清單點一個字進來（?w=<sk>）→ 直接顯示原本的閃卡
const SINGLE_SK=new URLSearchParams(location.search).get('w');
function openSingleCard(sk){
  fetch(DATA+'cards/all.json',{cache:'no-store'}).then(r=>r.ok?r.json():null,()=>null).then(d=>{
    const c=d&&d.cards&&d.cards.find(x=>x.sk===sk);
    document.getElementById('schemeTabs').innerHTML='';
    document.getElementById('levelList').innerHTML='<a class="sb-cat" href="word_browse.html">← 回全部單字</a>';
    if(!c){ document.getElementById('wmFront').innerHTML='<p class="wm-pos">找不到這個單字。</p>'; toFront(); return; }
    curLevel=null; curPool=[c]; CARDS=[c]; idx=0; flipped=false; hinted=false;
    render();
    document.getElementById('deckLine').innerHTML='全部單字 · '+esc(c.hw);
    const rn=document.getElementById('roundNote'); if(rn) rn.innerHTML='單張預覽：'+esc(c.hw)+'<br>可翻面看答案、評分（會存進 SRS 進度）';
  });
}
fetch(DATA+'index.json',{cache:'no-store'}).then(r=>r.ok?r.json():null,()=>null).then(d=>{
  if(!d||!d.schemes){ document.getElementById('wmFront').innerHTML='<p class="wm-pos" role="alert">⚠ 字庫索引暫時無法載入（請用 http 開啟）。</p>'; return; }
  INDEX=d;
  if(SINGLE_SK){ openSingleCard(SINGLE_SK); } else { renderSidebar(); }
});
</script>
</body></html>
