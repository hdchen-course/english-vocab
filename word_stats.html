<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>單字大師・學習統計</title>
<link rel="stylesheet" href="assets/app.css">
<script src="game_core.js"></script>
<style>
/* 學習統計：盡量沿用 house 元件（.stat-tile、card token、與單字大師同款 .wm-schemes pill）。
   狀態四色沿用單字大師四桶（還沒學/不熟/快會了/已學會）。只留圖表必要的少量樣式。 */
:root{ --wm-new:#b4ab9b; --wm-learning:#d9704f; --wm-almost:#cf9a1e; --wm-known:#2f8a63; }
:root[data-theme="dark"]{ --wm-new:#8d8575; --wm-learning:#ff9a7a; --wm-almost:#e8c05a; --wm-known:#46c98f; }
.ws-wrap{max-width:900px;margin:0 auto;padding:10px 0 40px}
/* 與單字大師側欄 scheme tab 同款 pill（維持家族一致） */
.wm-schemes{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.wm-schemes button{min-height:0;width:auto;flex:0 0 auto;padding:5px 12px;font-size:12.5px;font-weight:700;border:1px solid var(--card-border);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.wm-schemes button.on{background:var(--c-primary);color:var(--on-accent);border-color:var(--c-primary);font-weight:800}
.ws-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-md,14px);padding:16px}
.ws-top{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ws-donut{width:180px;height:180px;flex:0 0 auto}
.ws-donutwrap{position:relative;width:180px;height:180px;margin:0 auto}
.ws-donut__c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ws-donut__pct{font-size:30px;font-weight:800;color:var(--wm-known);line-height:1}
.ws-donut__sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.ws-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ws-tiles .stat-tile{align-items:flex-start;text-align:left}
.ws-tiles .stat-label{display:flex;align-items:center;gap:6px}
.ws-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;display:inline-block}
.ws-due{margin:14px 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;color:var(--ink)}
.ws-due b{color:var(--wm-learning);font-size:16px}
.ws-due a{text-decoration:none;font-weight:800;font-size:13px;padding:7px 14px;border-radius:999px;background:var(--c-primary);color:var(--on-accent)}
.ws-sec{margin:20px 0 8px;font-size:15px;font-weight:800;color:var(--ink)}
.ws-legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 10px;font-size:12px;color:var(--ink-soft)}
.ws-legend span{display:inline-flex;align-items:center;gap:6px}
.ws-levels{display:flex;flex-direction:column;gap:9px}
.ws-row{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center}
.ws-row .lv{font-size:13px;font-weight:700;color:var(--ink);text-align:right}
.ws-row .lv small{display:block;color:var(--ink-soft);font-weight:600;font-size:11px}
.ws-bar{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--card-border)}
.ws-bar span{height:100%}
.ws-note{margin-top:16px;font-size:12px;color:var(--ink-soft);line-height:1.7}
@media (max-width:640px){ .ws-top{grid-template-columns:1fr;gap:12px} .ws-row{grid-template-columns:84px 1fr} }
</style>
</head>
<body data-game-hud="off">
<header class="app-bar">
  <a class="app-bar__home" href="index_new.html#eng" aria-label="回到學習地圖">
    <span class="app-bar__home-icon" aria-hidden="true">🏠</span><span class="app-bar__home-label">學習地圖</span>
  </a>
  <span class="app-bar__title">單字大師・學習統計 📊</span>
  <button type="button" class="app-bar__theme" data-theme-toggle aria-label="切換日間／夜間模式" aria-pressed="false" title="切換日間／夜間模式">
    <span class="app-bar__theme-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main class="shell"><div class="ws-wrap">
  <nav class="wm-schemes" id="scope" aria-label="字庫範圍"></nav>
  <div style="margin:0 0 12px;font-size:13px"><a href="word_browse.html" style="color:var(--c-primary);font-weight:700;text-decoration:none">📖 查看全部單字（字母序）→</a></div>
  <div class="ws-card">
    <div class="ws-top">
      <div class="ws-donutwrap">
        <svg class="ws-donut" id="donut" viewBox="0 0 200 200" role="img" aria-label="學習進度甜甜圈"></svg>
        <div class="ws-donut__c"><span class="ws-donut__pct" id="knownPct">—</span><span class="ws-donut__sub">已學會</span></div>
      </div>
      <div class="ws-tiles" id="tiles"></div>
    </div>
  </div>
  <div class="ws-due" id="dueLine"></div>
  <h2 class="ws-sec">各分級的掌握情形</h2>
  <div class="ws-legend" id="legend"></div>
  <div class="ws-levels" id="levels"></div>
  <p class="ws-note" id="note"></p>
</div></main>
<script src="assets/safe_store.js"></script>
<script src="assets/srs_engine.js"></script>
<script>
const DATA='assets/wordmaster/';
const STORE=(window.SRS&&window.SRS.createStore)?window.SRS.createStore('wordmaster_srs_v1'):null;
const TODAY=(window.SRS&&window.SRS.today)?window.SRS.today():null;
const BUCKETS=[
  {k:'known',   label:'已學會', note:'盒 5–6',  color:'var(--wm-known)'},
  {k:'almost',  label:'快會了', note:'盒 3–4',  color:'var(--wm-almost)'},
  {k:'learning',label:'不熟',   note:'盒 1–2',  color:'var(--wm-learning)'},
  {k:'new',     label:'還沒學', note:'尚未開始',color:'var(--wm-new)'},
];
const CEFR_LEVELS=['A1','A2','B1','B2','C1','C2'];
let ALL=[], scope='all';
const SCOPES=[
  {k:'all',   label:'全部字庫', test:()=>true},
  {k:'cefr',  label:'官方 CEFR', test:c=>!!c.cefr},
  {k:'gept',  label:'全民英檢 GEPT', test:c=>!!c.gept},
  {k:'yle',   label:'劍橋 YLE', test:c=>!!c.yle},
  {k:'toeic', label:'TOEIC／學術字', test:c=>!!c.toeic},
];
function bucketOf(sk){
  const c=STORE?STORE.peek(sk):null; const b=c?(c.scheduleBox||0):0;
  let bk; if(b===0)bk='new'; else if(b<=2)bk='learning'; else if(b<=4)bk='almost'; else bk='known';
  const due=!!(c && c.status!=='new' && c.dueDate && TODAY && c.dueDate<=TODAY);
  return {bk,due};
}
function effLevel(c){ return c.cefr || c.cefr_est || null; }
function compute(pool){
  const counts={new:0,learning:0,almost:0,known:0}; let due=0;
  const byLevel={}; CEFR_LEVELS.forEach(l=>byLevel[l]={new:0,learning:0,almost:0,known:0,total:0,est:0});
  for(const c of pool){
    const r=bucketOf(c.sk);
    counts[r.bk]++; if(r.due)due++;
    const lv=effLevel(c);
    if(lv&&byLevel[lv]){ byLevel[lv][r.bk]++; byLevel[lv].total++; if(!c.cefr&&c.cefr_est)byLevel[lv].est++; }
  }
  return {counts,due,byLevel,total:pool.length};
}
function donut(counts,total){
  const C=2*Math.PI*78; let off=0; let seg='';
  for(const k of ['known','almost','learning','new']){
    const b=BUCKETS.find(x=>x.k===k); const f=total?counts[k]/total:0;
    if(f>0){
      seg+=`<circle cx="100" cy="100" r="78" fill="none" stroke="${b.color}" stroke-width="28"
        stroke-dasharray="${(f*C).toFixed(2)} ${(C-f*C).toFixed(2)}" stroke-dashoffset="${(-off*C).toFixed(2)}"
        transform="rotate(-90 100 100)"><title>${b.label} ${counts[k]} 字</title></circle>`;
      off+=f;
    }
  }
  if(total===0) seg=`<circle cx="100" cy="100" r="78" fill="none" stroke="var(--card-border)" stroke-width="28"></circle>`;
  document.getElementById('donut').innerHTML=seg;
}
function tiles(counts,total){
  document.getElementById('tiles').innerHTML=BUCKETS.map(b=>{
    const n=counts[b.k], p=total?Math.round(n/total*100):0;
    return `<div class="stat-tile"><div class="stat-value" style="color:${b.color}">${n.toLocaleString()}</div>
      <div class="stat-label"><span class="ws-dot" style="background:${b.color}"></span>${b.label} · ${p}%</div></div>`;
  }).join('');
}
function legend(){
  document.getElementById('legend').innerHTML=BUCKETS.map(b=>
    `<span><i class="ws-dot" style="background:${b.color}"></i>${b.label}（${b.note}）</span>`).join('');
}
function levels(byLevel){
  document.getElementById('levels').innerHTML=CEFR_LEVELS.map(l=>{
    const d=byLevel[l]; const t=d.total||0;
    const segs=['known','almost','learning','new'].map(k=>{
      const f=t?d[k]/t*100:0; if(f<=0)return '';
      const b=BUCKETS.find(x=>x.k===k);
      return `<span style="width:${f}%;background:${b.color}" title="${l} ${b.label} ${d[k]} 字"></span>`;
    }).join('');
    const estTxt=d.est>0?`<small>含約估 ${d.est}</small>`:'';
    return `<div class="ws-row"><div class="lv">${l} <span style="color:var(--ink-soft);font-weight:600">${t}</span>${estTxt}</div>
      <div class="ws-bar">${t?segs:'<span style="width:100%;background:var(--card-border)"></span>'}</div></div>`;
  }).join('');
}
function dueLine(due){
  const el=document.getElementById('dueLine');
  el.innerHTML = due>0
    ? `今天有 <b>${due}</b> 張到期要複習。<a href="word_master.html">▶ 去複習</a>`
    : `今天的複習都做完了 🎉　<a href="word_master.html">▶ 繼續學新字</a>`;
}
function render(){
  const pool=ALL.filter(SCOPES.find(s=>s.k===scope).test);
  const r=compute(pool);
  donut(r.counts,r.total); tiles(r.counts,r.total); legend(); levels(r.byLevel); dueLine(r.due);
  document.getElementById('knownPct').textContent=(r.total?Math.round(r.counts.known/r.total*100):0)+'%';
  document.getElementById('note').innerHTML=
    `統計依你在「單字大師」的自評進度（SRS 間隔複習盒）即時計算，資料存在本機瀏覽器。範圍「${SCOPES.find(s=>s.k===scope).label}」共 ${r.total.toLocaleString()} 字。`+
    `各分級以官方 CEFR 為準；官方未收錄的字以「約估」等級歸入（來源：GEPT／YLE 官方對照，或 COCA 詞頻推估），僅供參考、不等同官方分級。`;
}
function scopeBar(){
  document.getElementById('scope').innerHTML=SCOPES.map(s=>`<button data-k="${s.k}" class="${s.k===scope?'on':''}">${s.label}</button>`).join('');
  document.querySelectorAll('#scope button').forEach(b=>b.onclick=()=>{
    scope=b.dataset.k; document.querySelectorAll('#scope button').forEach(x=>x.classList.toggle('on',x===b)); render();
  });
}
fetch(DATA+'cards/stats_index.json',{cache:'no-store'}).then(r=>r.ok?r.json():null,()=>null).then(d=>{
  if(!d||!d.cards){ document.getElementById('tiles').innerHTML='<p class="ws-note" role="alert">⚠ 統計索引暫時無法載入（請用 http 開啟）。</p>'; return; }
  ALL=d.cards; scopeBar(); render();
});
</script>
</body>
</html>
